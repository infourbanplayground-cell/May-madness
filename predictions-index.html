<style>
:root {
  --gold: #F2C14E;

  --gold-glow: rgba(242,193,78,0.18);
  --green: #00C97B;

  --red: #FF3651;
  --blue: #4A9EFF;
  --or: #FF7240;
  --bg: #020C1E;
  --bg2: #03111F;
  --surface: rgba(7, 20, 44, 0.75);
  --surface2: rgba(10, 26, 56, 0.6);
  --glass: rgba(14, 30, 64, 0.5);
  --border: rgba(242,193,78,0.1);
  --border2: rgba(255,255,255,0.06);

}

  --red: #E0223B;
  --blue: #2E7BE0;
  --or: #E55A28;
  --bg: #F4F0E6;
  --bg2: #EDE6D3;
  --surface: rgba(255,253,247,0.75);
  --surface2: rgba(255,253,247,0.55);
  --glass: rgba(255,255,255,0.7);
  --border: rgba(180,123,5,0.18);
  --border2: rgba(40,30,10,0.08);
  --border-hover: rgba(201,147,22,0.4);
  --text: #1A1408;
  --text2: #5A4E32;
  --muted: #8A7A55;
  --pitch: rgba(0,163,95,0.04);
  --header-bg: rgba(255,251,240,0.85);
  --on-gold: #fff;
  --card-grad: linear-gradient(160deg, rgba(255,253,247,0.95) 0%, rgba(248,242,228,0.9) 100%);
  --next-hero-grad: linear-gradient(135deg, rgba(255,253,247,0.95) 0%, rgba(248,240,220,0.92) 100%);
  --bg-grid-dot: rgba(60,40,10,0.05);

  --score-color: #B47B05;
}
html.light .bg-orb { opacity: 0.6 !important; }
html.light .orb-gold { background: radial-gradient(circle, rgba(242,193,78,0.18) 0%, transparent 70%); }
html.light .orb-green { background: radial-gradient(circle, rgba(0,201,123,0.12) 0%, transparent 70%); }
html.light .orb-blue { background: radial-gradient(circle, rgba(74,158,255,0.1) 0%, transparent 70%); }
html.light .match-card { box-shadow: 0 4px 24px rgba(120,90,30,0.08), inset 0 1px 0 rgba(255,255,255,0.5); }
html.light .match-card:hover { box-shadow: 0 12px 40px rgba(120,90,30,0.12), 0 0 0 1px rgba(201,147,22,0.12); }
html.light .match-card::after { background: linear-gradient(90deg, transparent, rgba(40,30,10,0.06), transparent); }
html.light .pred-btn { background: rgba(40,30,10,0.025); border-color: rgba(40,30,10,0.08); color: var(--text2); }
html.light .pred-btn:hover:not(:disabled) { background: rgba(201,147,22,0.08); border-color: rgba(201,147,22,0.4); color: var(--gold-bright); box-shadow: 0 6px 16px rgba(120,90,30,0.08); }
html.light .pred-btn.selected-1 { background: rgba(46,123,224,0.2); border-color: rgba(46,123,224,0.6); color: #1a5db3; font-weight:700; }
html.light .pred-btn.selected-X { background: rgba(201,147,22,0.2); border-color: rgba(201,147,22,0.6); color: var(--gold-bright); font-weight:700; }
html.light .pred-btn.selected-2 { background: rgba(229,90,40,0.2); border-color: rgba(229,90,40,0.6); color: #b84010; font-weight:700; }
html.light .pred-btn.selected-1X { background: linear-gradient(135deg,rgba(46,123,224,0.17),rgba(201,147,22,0.14)); border-color: rgba(46,123,224,0.5); color: #1a5db3; font-weight:700; }
html.light .pred-btn.selected-X2 { background: linear-gradient(135deg,rgba(201,147,22,0.14),rgba(229,90,40,0.17)); border-color: rgba(229,90,40,0.5); color: #b84010; font-weight:700; }
html.light .pred-btn.correct { background: rgba(0,163,95,0.1); border-color: rgba(0,163,95,0.4); color: #008A50; }
html.light .pred-btn.wrong { background: rgba(224,34,59,0.06); border-color: rgba(224,34,59,0.25); color: #B01828; }
html.light .pred-btn.selected-1:disabled,html.light .pred-btn.selected-X:disabled,html.light .pred-btn.selected-2:disabled,html.light .pred-btn.selected-1X:disabled,html.light .pred-btn.selected-X2:disabled { opacity: .9; cursor: default; }
html.light .pred-btn.correct:disabled,html.light .pred-btn.wrong:disabled { opacity: .9; cursor: default; }
html.light .float-nav-pill {
  background: rgba(255,253,247,0.9);
  border: 1px solid rgba(40,30,10,0.1);
  box-shadow: 0 8px 32px rgba(120,90,30,0.12), inset 0 1px 0 rgba(255,255,255,0.5);
}
html.light .nav-item.active { background: linear-gradient(135deg, #C99316, #9E7308); color: #fff; box-shadow: 0 4px 12px rgba(201,147,22,0.35); }
html.light .btn-primary { background: linear-gradient(135deg, #C99316, #9E7308); color: #fff; box-shadow: 0 4px 20px rgba(201,147,22,0.3); }
html.light .glass-gold { background: rgba(255,253,247,0.92); border-color: rgba(201,147,22,0.2); box-shadow: 0 20px 48px rgba(120,90,30,0.12), inset 0 1px 0 rgba(255,255,255,0.6); }
html.light .glass { background: rgba(255,253,247,0.7); border-color: rgba(40,30,10,0.08); box-shadow: 0 4px 24px rgba(120,90,30,0.06), inset 0 1px 0 rgba(255,255,255,0.4); }
html.light .next-hero { box-shadow: 0 8px 32px rgba(120,90,30,0.12), inset 0 1px 0 rgba(255,255,255,0.5); border-color: rgba(201,147,22,0.18); }
html.light .badge-group { background: rgba(201,147,22,0.12); color: #9E7308; border-color: rgba(201,147,22,0.2); }
html.light .vs-orb { background: rgba(40,30,10,0.04); border-color: rgba(40,30,10,0.1); color: var(--muted); }
html.light .inp { background: rgba(40,30,10,0.03); border-color: rgba(40,30,10,0.1); color: var(--text); }
html.light .inp:focus { border-color: var(--gold); background: rgba(201,147,22,0.05); }
html.light .admin-inp { background: rgba(40,30,10,0.03); border-color: rgba(40,30,10,0.1); color: var(--text); }
html.light .lang-btn { border-color: rgba(40,30,10,0.1); }
html.light .lang-btn.active-lang { background: var(--gold); color: #fff; border-color: var(--gold); }
html.light .pill-tab.active { background: var(--gold); color: #fff; }
html.light .pill-tab:not(.active) { background: rgba(40,30,10,0.04); color: var(--muted); border-color: rgba(40,30,10,0.08); }
html.light ::-webkit-scrollbar-thumb { background: rgba(201,147,22,0.3); }
html.light .bg-grid { background-image: radial-gradient(circle at 1px 1px, rgba(60,40,10,0.05) 1px, transparent 0) !important; }
html.light .vs-orb { background: rgba(40,30,10,0.05); border-color: rgba(40,30,10,0.12); color: var(--text2); }

*, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: 'Cairo', sans-serif;
  min-height: 100dvh;
  overflow-x: hidden;
}
html.en, html.en body { font-family: 'Outfit', sans-serif; }
html.en .syne { font-family: 'Syne', sans-serif; }
.syne { font-family: 'Syne', sans-serif; }
.mono { font-family: 'Space Grotesk', monospace; font-variant-numeric: tabular-nums; }

#root { min-height: 100dvh; position: relative; z-index: 1; }
button { cursor: pointer; font-family: inherit; }
input { font-family: inherit; }

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(242,193,78,0.2); border-radius: 2px; }

/* ── Animated background mesh ── */
.bg-mesh {
  position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
}
.bg-orb {
  position: absolute; border-radius: 50%;
  filter: blur(100px);
}
.orb-gold {
  width: 800px; height: 800px;
  background: radial-gradient(circle, rgba(242,193,78,0.09) 0%, transparent 70%);
  top: -200px; left: -150px;
  animation: orbDrift1 28s ease-in-out infinite;
}
.orb-green {
  width: 700px; height: 700px;
  background: radial-gradient(circle, rgba(0,201,123,0.08) 0%, transparent 70%);
  bottom: -100px; right: -100px;
  animation: orbDrift2 35s ease-in-out infinite;
}
.orb-blue {
  width: 500px; height: 500px;
  background: radial-gradient(circle, rgba(74,158,255,0.07) 0%, transparent 70%);
  top: 40%; left: 60%;
  animation: orbDrift3 22s ease-in-out infinite;
}
.bg-grid {
  position: absolute; inset: 0;
  background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.018) 1px, transparent 0);
  background-size: 44px 44px;
}
@keyframes orbDrift1 { 0%,100%{transform:translate(0,0) scale(1)} 33%{transform:translate(60px,-40px) scale(1.08)} 66%{transform:translate(-30px,50px) scale(0.94)} }
@keyframes orbDrift2 { 0%,100%{transform:translate(0,0) scale(1)} 33%{transform:translate(-50px,30px) scale(1.12)} 66%{transform:translate(40px,-60px) scale(0.9)} }
@keyframes orbDrift3 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-80px,-40px)} }

/* ── Glass surface ── */
.glass {
  background: var(--glass);
  backdrop-filter: blur(20px) saturate(160%);
  -webkit-backdrop-filter: blur(20px) saturate(160%);
  border: 1px solid var(--border2);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 20px 40px rgba(0,0,0,0.4);
}
.glass-gold {
  background: rgba(12, 26, 56, 0.6);
  backdrop-filter: blur(20px) saturate(160%);
  -webkit-backdrop-filter: blur(20px) saturate(160%);
  border: 1px solid var(--border);
  box-shadow: inset 0 1px 0 rgba(242,193,78,0.08), 0 20px 48px rgba(0,0,0,0.5);
}

/* ── Spotlight card ── */
.spotlight-card { position: relative; overflow: hidden; }
.spotlight-card::before {
  content: '';
  position: absolute; inset: 0; pointer-events: none; z-index: 0;
  background: radial-gradient(380px circle at var(--mx,50%) var(--my,50%), rgba(242,193,78,0.05), transparent 60%);
  opacity: 0; transition: opacity .3s;
}
.spotlight-card:hover::before { opacity: 1; }

/* ── Match card ── */
.match-card {
  background: var(--card-grad);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--border2);
  border-radius: 24px;
  overflow: hidden;
  transition: border-color .3s, transform .22s, box-shadow .3s;
  box-shadow: 0 4px 32px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.05);
}
.match-card:hover {
  border-color: rgba(242,193,78,0.22);
  transform: translateY(-3px);
  box-shadow: 0 12px 48px rgba(0,0,0,0.5), 0 0 0 1px rgba(242,193,78,0.08), inset 0 1px 0 rgba(255,255,255,0.07);
}
/* top shimmer line */
.match-card::after {
  content: '';
  position: absolute; top: 0; left: 10%; right: 10%; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
  pointer-events: none;
}

/* ── Bet buttons ── */
.pred-btn {
  flex: 1; padding: 12px 4px 10px; border-radius: 16px;
  border: 1px solid rgba(255,255,255,0.07);
  background: rgba(255,255,255,0.025);
  color: var(--text2); font-family: inherit;
  transition: all .2s cubic-bezier(.16,1,.3,1);
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  position: relative; overflow: hidden;
}
.pred-btn::before {
  content: ''; position: absolute; inset: 0; border-radius: 16px;
  background: radial-gradient(circle at 50% 0%, rgba(255,255,255,0.06), transparent 60%);
  opacity: 0; transition: opacity .2s;
}
.pred-btn:hover:not(:disabled)::before { opacity: 1; }
.pred-btn:hover:not(:disabled) {
  border-color: rgba(242,193,78,0.4);
  background: rgba(242,193,78,0.07);
  color: var(--gold-bright);
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(0,0,0,0.3);
}
.pred-btn:active:not(:disabled) { transform: translateY(0) scale(0.97); }
.pred-btn.selected-1 { background: rgba(74,158,255,0.12); border-color: rgba(74,158,255,0.45); color: #7EC3FF; box-shadow: 0 0 20px rgba(74,158,255,0.12), inset 0 1px 0 rgba(74,158,255,0.15); }
.pred-btn.selected-X { background: rgba(242,193,78,0.1); border-color: rgba(242,193,78,0.45); color: var(--gold-bright); box-shadow: 0 0 20px rgba(242,193,78,0.1), inset 0 1px 0 rgba(242,193,78,0.15); }
.pred-btn.selected-2 { background: rgba(255,114,64,0.12); border-color: rgba(255,114,64,0.45); color: #FFA07A; box-shadow: 0 0 20px rgba(255,114,64,0.12), inset 0 1px 0 rgba(255,114,64,0.15); }
.pred-btn.selected-1X { background: linear-gradient(135deg,rgba(74,158,255,0.1),rgba(242,193,78,0.06)); border-color: rgba(74,158,255,0.4); color: #7EC3FF; box-shadow: 0 0 16px rgba(74,158,255,0.1); }
.pred-btn.selected-X2 { background: linear-gradient(135deg,rgba(242,193,78,0.06),rgba(255,114,64,0.1)); border-color: rgba(255,114,64,0.4); color: #FFA07A; box-shadow: 0 0 16px rgba(255,114,64,0.1); }
.pred-btn.correct { background: rgba(0,201,123,0.12); border-color: rgba(0,201,123,0.45); color: #4DFFB2; box-shadow: 0 0 20px rgba(0,201,123,0.1), inset 0 1px 0 rgba(0,201,123,0.15); }
.pred-btn.wrong { background: rgba(255,54,81,0.06); border-color: rgba(255,54,81,0.2); color: #FF7A8E; }
.pred-btn:disabled { opacity: .38; cursor: not-allowed; transform: none; }
.pred-btn.selected-1:disabled,.pred-btn.selected-X:disabled,.pred-btn.selected-2:disabled,.pred-btn.selected-1X:disabled,.pred-btn.selected-X2:disabled { opacity: .9; cursor: default; }
.pred-btn.correct:disabled,.pred-btn.wrong:disabled { opacity: .9; cursor: default; }
.pred-btn.dc { font-size: 11px; }

/* ── Odds ── */
.odds-val { font-family: 'Space Grotesk', monospace; font-size: 20px; font-weight: 700; letter-spacing: -0.5px; line-height: 1; }
.odds-label { font-size: 9px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; opacity: .55; }
.odds-val-dc { font-family: 'Space Grotesk', monospace; font-size: 16px; font-weight: 700; letter-spacing: -0.3px; }

/* ── Next match hero ── */
.next-hero {
  background: var(--next-hero-grad);
  border: 1px solid rgba(242,193,78,0.14);
  border-radius: 24px; overflow: hidden; position: relative;
  box-shadow: 0 8px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
}
.next-hero::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent 0%, rgba(242,193,78,0.5) 30%, rgba(0,201,123,0.4) 70%, transparent 100%);
}
@keyframes heroShimmer { 0%{background-position:-400px 0} 100%{background-position:400px 0} }
.live-badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 10px; border-radius: 999px;
  background: rgba(255,54,81,0.12); border: 1px solid rgba(255,54,81,0.25);
  font-size: 9px; font-weight: 800; color: var(--red);
  font-family: 'Space Grotesk'; letter-spacing: 1px; text-transform: uppercase;
}

/* ── Section date header ── */
.section-header {
  display: flex; align-items: center; gap: 10px;
  padding: 6px 0 10px;
}
.section-header-bar {
  width: 3px; height: 32px; border-radius: 2px; flex-shrink: 0;
  background: linear-gradient(180deg, var(--gold), rgba(242,193,78,0.1));
}
.section-date-label {
  font-family: 'Syne', sans-serif; font-weight: 800; font-size: 13px;
  color: var(--text); letter-spacing: -.2px;
}
.section-stage-badge {
  margin-left: auto; font-family: 'Space Grotesk'; font-size: 9px;
  font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--muted); opacity: .7;
}

/* ── Pill filter ── */
.pill-tab {
  padding: 8px 18px; border-radius: 999px;
  font-weight: 700; font-size: 12px; border: none;
  transition: all .18s; letter-spacing: .2px;
}
.pill-tab.active { background: var(--gold); color: #0A0600; box-shadow: 0 3px 12px rgba(242,193,78,0.3); }
.pill-tab:not(.active) { background: rgba(255,255,255,0.05); color: var(--muted); border: 1px solid rgba(255,255,255,0.06); }

/* ── Stage badges ── */
.badge { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 999px; font-size: 10px; font-weight: 800; letter-spacing: .5px; text-transform: uppercase; }
.badge-group { background: rgba(242,193,78,0.1); color: var(--gold); border: 1px solid rgba(242,193,78,0.15); }
.badge-r32 { background: rgba(74,158,255,0.1); color: #7EC3FF; border: 1px solid rgba(74,158,255,0.15); }
.badge-r16 { background: rgba(255,114,64,0.1); color: #FFA07A; border: 1px solid rgba(255,114,64,0.15); }
.badge-qf { background: rgba(167,51,234,0.1); color: #D09FFF; border: 1px solid rgba(167,51,234,0.15); }
.badge-sf { background: rgba(236,72,153,0.1); color: #F9A8D4; border: 1px solid rgba(236,72,153,0.15); }
.badge-final { background: linear-gradient(135deg,rgba(242,193,78,0.2),rgba(255,114,64,0.15)); color: var(--gold-bright); border: 1px solid rgba(242,193,78,0.3); }

/* ── Countdown ── */
.ct-urgent { color: var(--red); }
.ct-soon { color: var(--or); }
.ct-ok { color: var(--muted); }
@keyframes livePulse { 0%,100%{opacity:1}50%{opacity:.4} }
.ct-live { animation: livePulse .9s ease infinite; color: var(--red); }

/* ── Inputs ── */
.inp {
  width: 100%;
  background: rgba(255,255,255,0.04);
  border: 1.5px solid rgba(255,255,255,0.08);
  border-radius: 14px; padding: 14px 18px;
  color: var(--text); font-size: 16px; font-family: inherit;
  outline: none; transition: border-color .2s, background .2s;
  direction: auto;
}
.inp:focus { border-color: var(--gold); background: rgba(242,193,78,0.04); }
.inp::placeholder { color: var(--muted); }

/* ── Primary button ── */
.btn-primary {
  width: 100%; padding: 15px;
  border-radius: 14px; border: none;
  background: linear-gradient(135deg, #F2C14E, #D4950D);
  color: #0A0600; font-size: 17px; font-weight: 900; font-family: inherit;
  letter-spacing: .3px;
  transition: all .22s cubic-bezier(.16,1,.3,1);
  box-shadow: 0 4px 20px rgba(242,193,78,0.3), inset 0 1px 0 rgba(255,255,255,0.2);
  position: relative; overflow: hidden;
}
.btn-primary::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
  opacity: 0; transition: opacity .2s;
}
.btn-primary:hover::after { opacity: 1; }
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(242,193,78,0.4); }
.btn-primary:active { transform: translateY(0) scale(0.98); }
.btn-primary:disabled { opacity: .45; cursor: not-allowed; transform: none; }

/* ── Admin inputs ── */
.admin-inp {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 10px; padding: 8px 12px;
  color: var(--text); font-size: 13px; font-family: inherit;
  outline: none; transition: border-color .15s;
}
.admin-inp:focus { border-color: var(--gold); }

// ── API ───────────────────────────────────────────────────────────────────────
async function apiFetch(path,opts={}){
  const token=localStorage.getItem('wc_token');
  const res=await fetch(API+path,{headers:{'Content-Type':'application/json',...(token?{Authorization:token}:{}),...(opts.headers||{})},...opts});
  const data=await res.json();
  if(!res.ok) throw new Error(data.error||'Error');
  return data;
}

// ── Countdown hook ────────────────────────────────────────────────────────────
function useCountdown(kickoff){
  const [ms,setMs]=useState(()=>new Date(kickoff)-Date.now()-5*60*1000);
  useEffect(()=>{const t=setInterval(()=>setMs(new Date(kickoff)-Date.now()-5*60*1000),1000);return()=>clearInterval(t);},[kickoff]);
  return ms;
}
// Ticks every 10s — use for deadline/canPredict checks without re-rendering every second
function useNow(){
  const [now,setNow]=useState(Date.now);
  useEffect(()=>{const t=setInterval(()=>setNow(Date.now()),10000);return()=>clearInterval(t);},[]);
  return now;
}

// ── Spotlight card HOC ────────────────────────────────────────────────────────
function SpotlightCard({children,style,className=''}){
  const ref=useRef(null);
  function onMove(e){
    if(!ref.current) return;
    const r=ref.current.getBoundingClientRect();
    ref.current.style.setProperty('--mx',`${e.clientX-r.left}px`);
    ref.current.style.setProperty('--my',`${e.clientY-r.top}px`);
  }
  return(
    <div ref={ref} className={`spotlight-card ${className}`} style={style} onMouseMove={onMove}>
      {children}
    </div>
  );
}

function Toast({msg,type,onDone}){
  useEffect(()=>{const t=setTimeout(onDone,2800);return()=>clearTimeout(t);},[]);

    info:{bg:'linear-gradient(135deg,rgba(242,193,78,0.95),rgba(180,130,20,0.95))',color:'#0A0600'},
    warn:{bg:'linear-gradient(135deg,rgba(255,114,64,0.95),rgba(200,70,20,0.95))',color:'#fff'},
  }[type]||{bg:'linear-gradient(135deg,rgba(242,193,78,0.95),rgba(180,130,20,0.95))',color:'#0A0600'};
  return(
    <div className="toast fixed top-4 left-4 right-4 z-50 rounded-2xl px-5 py-3 text-sm font-bold text-center"
      style={{background:cfg.bg,color:cfg.color,maxWidth:380,margin:'0 auto',backdropFilter:'blur(20px)',boxShadow:'0 8px 32px rgba(0,0,0,0.4)'}}>
      {msg}
    </div>
  );
}

// ── Countdown display ─────────────────────────────────────────────────────────
function Countdown({kickoff,settled,lang}){
  const T=TX[lang];
  const ms=useCountdown(kickoff);
  if(settled) return <span style={{color:'var(--muted)',fontSize:11,fontFamily:'Space Grotesk',fontWeight:500}}>{T.ended}</span>;
  if(ms<=-5*60*1000) return(
    <span className="live-badge ct-live" style={{fontSize:10,fontWeight:800,fontFamily:'Space Grotesk',letterSpacing:.5}}>
      <span style={{width:5,height:5,borderRadius:'50%',background:'var(--red)',display:'inline-block',marginRight:4,verticalAlign:'middle'}}/>
      {T.liveNow||'Live'}
    </span>
  );
  if(ms<=0) return(
    <span style={{color:'var(--red)',fontSize:10,fontWeight:800,fontFamily:'Space Grotesk',letterSpacing:.5,padding:'2px 8px',background:'rgba(255,54,81,0.1)',borderRadius:999,border:'1px solid rgba(255,54,81,0.2)'}}>
      {T.deadlinePassed}
    </span>
  );
  const totalSec=Math.floor(ms/1000);
  const d=Math.floor(totalSec/86400),h=Math.floor((totalSec%86400)/3600),m=Math.floor((totalSec%3600)/60),s=totalSec%60;
  const cls=ms<3600000?'ct-urgent':ms<86400000?'ct-soon':'ct-ok';
  const txt=d>0?`${d}${T.days} ${h}${T.hours}`:h>0?`${h}${T.hours} ${String(m).padStart(2,'0')}${T.mins}`:`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  return <span className={`${cls} mono`} style={{fontSize:12,fontWeight:700}}>{txt}</span>;
}

// ── Confirm Sheet ─────────────────────────────────────────────────────────────
function ConfirmSheet({match,pick,defaultStake,onConfirm,onCancel,balance,startBal,lang,extraOdds,isKO,existingPred}){
  const T=TX[lang];
  const CHIPS=[10,25,50,100,200,500,1000,2000];
  const [chosenStake,setChosenStake]=useState(()=>{
    const d=parseFloat(defaultStake||100);
    return CHIPS.includes(d)?d:100;
  });
  const [customVal,setCustomVal]=useState('');
  const stakeUsed=isKO?chosenStake:parseFloat(defaultStake||100);
  if(!match||!pick) return null;
  const h=parseFloat(match.home_odds),d=parseFloat(match.draw_odds),a=parseFloat(match.away_odds);
  const allOdds={'1':h,'X':d,'2':a,'1X':parseFloat(match.odds_1x)||(h*d)/(h+d),'X2':parseFloat(match.odds_x2)||(d*a)/(d+a),
    'BTTS-Y':parseFloat(match.odds_btts_yes),'BTTS-N':parseFloat(match.odds_btts_no),
    'OVER2.5':parseFloat(match.odds_over25),'UNDER2.5':parseFloat(match.odds_under25),
    'DNB1':parseFloat(match.odds_dnb_home),'DNB2':parseFloat(match.odds_dnb_away),
    'CORNERS-OVER':parseFloat(match.odds_corners_over),'CORNERS-UNDER':parseFloat(match.odds_corners_under),
    'CARDS-OVER':parseFloat(match.odds_cards_over),'CARDS-UNDER':parseFloat(match.odds_cards_under),
    'BTTS-CARD-Y':parseFloat(match.odds_btts_card_yes),'BTTS-CARD-N':parseFloat(match.odds_btts_card_no),
    'FIRSTCORNER-1':parseFloat(match.odds_firstcorner_home),'FIRSTCORNER-2':parseFloat(match.odds_firstcorner_away)};
  const _p1=1/h,_px=1/d,_p2=1/a,_tot=_p1+_px+_p2;
  allOdds['QUALIFY1']=Math.round(100/((_p1+0.5*_px)/_tot))/100;
  allOdds['QUALIFY2']=Math.round(100/((_p2+0.5*_px)/_tot))/100;
  const odds=extraOdds||allOdds[pick]||h;
  const bal=parseFloat(balance);
  const maxStake=bal;
  const netWin=(stakeUsed*(odds-1)).toFixed(2);
  const balAfter=(bal-stakeUsed+stakeUsed*odds).toFixed(0);
  // Pick label & team
  let pickLabel, team, pickColor, pickBadge='';
  if(pick==='1'){team=match.home_team;pickLabel=match.home_team;pickColor='var(--blue)';}
  else if(pick==='X'){team=null;pickLabel=T.pickX;pickColor='var(--gold)';}
  else if(pick==='2'){team=match.away_team;pickLabel=match.away_team;pickColor='var(--or)';}
  else if(pick==='1X'){team=null;pickLabel=lang==='ar'?`${match.home_team} أو تعادل`:`${match.home_team} or Draw`;pickColor='#7EC3FF';pickBadge='DOUBLE CHANCE';}
  else if(pick==='X2'){team=null;pickLabel=lang==='ar'?`تعادل أو ${match.away_team}`:`Draw or ${match.away_team}`;pickColor='#FFA07A';pickBadge='DOUBLE CHANCE';}
  else if(pick==='BTTS-Y'){team=null;pickLabel='Both Teams Score — Yes';pickColor='var(--green)';pickBadge='BTTS';}
  else if(pick==='BTTS-N'){team=null;pickLabel='Both Teams Score — No';pickColor='var(--red)';pickBadge='BTTS';}
  else if(pick==='OVER2.5'){team=null;pickLabel='Over 2.5 Goals';pickColor='var(--green)';pickBadge='GOALS';}
  else if(pick==='UNDER2.5'){team=null;pickLabel='Under 2.5 Goals';pickColor='var(--red)';pickBadge='GOALS';}
  else if(pick==='DNB1'){team=match.home_team;pickLabel=`Draw No Bet — ${match.home_team}`;pickColor='var(--blue)';pickBadge='DNB';}
  else if(pick==='DNB2'){team=match.away_team;pickLabel=`Draw No Bet — ${match.away_team}`;pickColor='var(--or)';pickBadge='DNB';}
  else if(pick==='QUALIFY1'){team=match.home_team;pickLabel=`${match.home_team} to Qualify`;pickColor='var(--green)';pickBadge='TO QUALIFY';}
  else if(pick==='QUALIFY2'){team=match.away_team;pickLabel=`${match.away_team} to Qualify`;pickColor='var(--green)';pickBadge='TO QUALIFY';}
  else if(pick.startsWith('ANYTIME:')){team=null;pickLabel=pick.slice(8);pickColor='var(--gold)';pickBadge='ANYTIME SCORER';}
  else if(pick.startsWith('FIRST:')){team=null;pickLabel=pick.slice(6);pickColor='var(--gold)';pickBadge='FIRST SCORER';}
  else if(pick==='CORNERS-OVER'){team=null;pickLabel=`Over ${parseFloat(match.corners_line)||'?'} Corners`;pickColor='var(--blue)';pickBadge='CORNERS';}
  else if(pick==='CORNERS-UNDER'){team=null;pickLabel=`Under ${parseFloat(match.corners_line)||'?'} Corners`;pickColor='var(--or)';pickBadge='CORNERS';}
  else if(pick==='CARDS-OVER'){team=null;pickLabel=`Over ${parseFloat(match.cards_line)||'?'} Cards`;pickColor='var(--red)';pickBadge='CARDS';}
  else if(pick==='CARDS-UNDER'){team=null;pickLabel=`Under ${parseFloat(match.cards_line)||'?'} Cards`;pickColor='var(--green)';pickBadge='CARDS';}
  else if(pick==='BTTS-CARD-Y'){team=null;pickLabel='Both Teams Carded — Yes';pickColor='var(--red)';pickBadge='CARDS';}
  else if(pick==='BTTS-CARD-N'){team=null;pickLabel='Not Both Carded — No';pickColor='var(--green)';pickBadge='CARDS';}
  else if(pick==='FIRSTCORNER-1'){team=match.home_team;pickLabel=`${match.home_team} First Corner`;pickColor='var(--blue)';pickBadge='CORNERS';}
  else if(pick==='FIRSTCORNER-2'){team=match.away_team;pickLabel=`${match.away_team} First Corner`;pickColor='var(--or)';pickBadge='CORNERS';}
  else{team=null;pickLabel=pick;pickColor='var(--gold)';}
  return(
    <div className="fixed inset-0 z-40" style={{background:'rgba(0,0,0,.7)',backdropFilter:'blur(8px)'}} onClick={onCancel}>
      <div className="confirm-sheet fixed bottom-0 left-0 right-0 rounded-t-[28px] overflow-hidden"
        style={{background:'rgba(6,15,36,0.98)',border:'1px solid var(--border)',borderBottom:'none',maxWidth:480,margin:'0 auto',backdropFilter:'blur(32px)'}}
        onClick={e=>e.stopPropagation()}>
        <div style={{height:3,width:36,background:'rgba(255,255,255,0.12)',borderRadius:2,margin:'14px auto 0'}}/>
        <div className="px-6 py-5">
          <div style={{fontSize:11,color:'var(--muted)',fontWeight:800,letterSpacing:1,marginBottom:16,fontFamily:'Space Grotesk',textTransform:'uppercase'}}>{existingPred?lang==='ar'?'تغيير الرهان':'Change Bet':T.confirmTitle}</div>
          {/* Teams */}
          <div className="flex items-center justify-between gap-3 mb-5" style={{direction:'ltr'}}>
            <div className="flex items-center gap-2 flex-1">
              <Flag team={match.home_team} size={32}/>
              <span style={{fontSize:13,fontWeight:700,lineHeight:1.2}}>{match.home_team}</span>
            </div>
            <div className="vs-orb"><span>VS</span></div>
            <div className="flex items-center gap-2 flex-1 justify-end">
              <span style={{fontSize:13,fontWeight:700,lineHeight:1.2,textAlign:'right'}}>{match.away_team}</span>
              <Flag team={match.away_team} size={32}/>
            </div>
          </div>
          {/* Pick */}
          <div className="rounded-2xl p-4 mb-5 text-center" style={{background:`${pickColor}18`,border:`1px solid ${pickColor}40`}}>
            <div style={{fontSize:10,color:'var(--muted)',marginBottom:4,fontFamily:'Space Grotesk',fontWeight:600,letterSpacing:.5,textTransform:'uppercase'}}>
              {lang==='ar'?'توقعك':'Your Pick'}
            </div>
            <div className="flex items-center justify-center gap-2 flex-wrap">
              {pick==='1X'&&<><Flag team={match.home_team} size={20}/><span style={{fontSize:12,color:'var(--muted)'}}>+</span><span style={{fontSize:13,color:'var(--muted)'}}>X</span></>}
              {pick==='X2'&&<><span style={{fontSize:13,color:'var(--muted)'}}>X</span><span style={{fontSize:12,color:'var(--muted)'}}>+</span><Flag team={match.away_team} size={20}/></>}
              {!['1X','X2'].includes(pick)&&team&&<Flag team={team} size={22}/>}
              <span style={{fontSize:pick.length>8?12:pick.length>2?14:17,fontWeight:900,color:pickColor,textAlign:'center'}}>{pickLabel}</span>
            </div>
            <div className="mono" style={{fontSize:28,fontWeight:700,color:'var(--text)',marginTop:6,letterSpacing:-1}}>{odds.toFixed(2)}<span style={{fontSize:14,color:'var(--muted)',marginLeft:2}}>×</span></div>
            {pickBadge&&<div style={{fontSize:9,color:'var(--muted)',marginTop:4,fontFamily:'Space Grotesk',fontWeight:600,letterSpacing:.5}}>{pickBadge}</div>}
          </div>
          {/* Stake selector — KO only */}
          {isKO?(
            <div className="mb-4">
              <div style={{fontSize:10,color:'var(--muted)',fontWeight:800,letterSpacing:.5,marginBottom:8,fontFamily:'Space Grotesk',textTransform:'uppercase'}}>Stake</div>
              <div className="flex gap-1.5 flex-wrap mb-2" style={{direction:'ltr'}}>
                {CHIPS.filter(c=>c<=maxStake).map(c=>(
                  <button key={c} onClick={()=>{setChosenStake(c);setCustomVal('');}}
                    style={{padding:'6px 12px',borderRadius:20,fontSize:11,fontWeight:800,fontFamily:'Space Grotesk',border:'1px solid',
                      background:chosenStake===c&&!customVal?'var(--gold)':'rgba(255,255,255,0.05)',
                      borderColor:chosenStake===c&&!customVal?'var(--gold)':'var(--border2)',
                      color:chosenStake===c&&!customVal?'#0A0600':'var(--muted)',transition:'all .12s'}}>
                    ${c}
                  </button>
                ))}
                <input type="number" min="1" max="99999" placeholder="custom"
                  value={customVal} onChange={e=>{const v=Math.min(99999,Math.max(1,parseInt(e.target.value)||1));setCustomVal(e.target.value);if(parseInt(e.target.value))setChosenStake(v);}}
                  style={{flex:1,minWidth:60,padding:'6px 8px',borderRadius:10,background:'rgba(255,255,255,0.04)',border:'1px solid var(--border2)',color:'var(--text)',fontSize:12,fontFamily:'Space Grotesk',fontWeight:700,outline:'none'}}/>
              </div>
              {stakeUsed>bal&&<div style={{fontSize:10,color:'var(--red)',fontFamily:'Space Grotesk',fontWeight:700}}>Insufficient balance</div>}
            </div>
          ):(
            <div className="mb-4">
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'8px 12px',borderRadius:12,background:'rgba(255,255,255,0.03)',border:'1px solid var(--border2)'}}>
                <span style={{fontSize:10,color:'var(--muted)',fontWeight:700,fontFamily:'Space Grotesk',textTransform:'uppercase',letterSpacing:.5}}>{lang==='ar'?'الرهان الثابت':'Fixed Stake'}</span>
                <span className="mono" style={{fontSize:16,fontWeight:800,color:'var(--gold)'}}>${stakeUsed}</span>
              </div>
            </div>
          )}
          {/* Stats row */}
          <div className="grid grid-cols-3 gap-2 mb-5">
            {[
              {label:T.stake,val:`$${stakeUsed}`,c:'var(--text2)'},
              {label:T.potentialWin,val:`+$${netWin}`,c:'var(--green)'},
              {label:T.balanceAfter,val:`$${balAfter}`,c:'var(--gold)'},
            ].map(s=>(
              <div key={s.label} className="rounded-2xl p-3 text-center" style={{background:'rgba(255,255,255,0.03)',border:'1px solid var(--border2)'}}>
                <div className="mono" style={{fontSize:15,fontWeight:700,color:s.c}}>{s.val}</div>
                <div style={{fontSize:9,color:'var(--muted)',marginTop:2,lineHeight:1.3,fontWeight:600}}>{s.label}</div>
              </div>
            ))}

            <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:8,marginBottom:12,padding:'8px 14px',background:'rgba(255,255,255,0.04)',border:'1px solid var(--border2)',borderRadius:12}}>
              <span style={{fontSize:11,fontFamily:'Space Grotesk',fontWeight:800,color:'var(--red)',letterSpacing:.5}}>{existingPred}</span>
              <span style={{fontSize:12,color:'var(--muted)'}}>→</span>
              <span style={{fontSize:11,fontFamily:'Space Grotesk',fontWeight:800,color:'var(--green)',letterSpacing:.5}}>{pick}</span>

          <button onClick={onCancel} style={{width:'100%',padding:'10px',background:'none',border:'none',color:'var(--muted)',fontSize:13,fontWeight:700,fontFamily:'inherit'}}>{T.cancelBtn}</button>
        </div>
        <div style={{height:'env(safe-area-inset-bottom,0px)'}}/>

    </div>
  );
}

// ── Next Match Banner — hero style ───────────────────────────────────────────
function NextMatchBanner({matches,lang}){
  const T=TX[lang];
  const [tick,setTick]=useState(0);
  useEffect(()=>{const t=setInterval(()=>setTick(x=>x+1),60000);return()=>clearInterval(t);},[]);
  const next=useMemo(()=>
    matches.filter(m=>!m.settled&&new Date(m.kickoff).getTime()>Date.now()-120*60*1000)
      .sort((a,b)=>new Date(a.kickoff)-new Date(b.kickoff))[0]||null
  ,[matches,tick]);
  const [ms,setMs]=useState(()=>next?new Date(next.kickoff)-Date.now():0);
  useEffect(()=>{if(!next)return;const t=setInterval(()=>setMs(new Date(next.kickoff)-Date.now()),1000);return()=>clearInterval(t);},[next]);
  if(!next) return null;

  const isLive=ms<0&&ms>-120*60*1000;
  const deadlinePassed=new Date(next.kickoff).getTime()-5*60*1000-Date.now()<=0;
  const totalSec=Math.max(0,Math.floor(Math.abs(ms)/1000));
  const dd=Math.floor(totalSec/86400),hh=Math.floor((totalSec%86400)/3600),mm=Math.floor((totalSec%3600)/60),ss=totalSec%60;

  const urgency=ms<3600000?'var(--red)':ms<86400000?'var(--or)':'var(--gold)';

  // Countdown segments
  const segs = isLive ? null : dd>0
    ? [{v:dd,l:T.days},{v:hh,l:T.hours}]
    : hh>0
    ? [{v:hh,l:T.hours},{v:mm,l:T.mins},{v:ss,l:T.secs}]
    : [{v:mm,l:T.mins},{v:ss,l:T.secs}];

  const kickoffTime=new Date(next.kickoff).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Muscat'});
  const kickoffDate=new Date(next.kickoff).toLocaleDateString(lang==='ar'?'ar-OM':'en-GB',{weekday:'short',month:'short',day:'numeric',timeZone:'Asia/Muscat'});

  return(
    <div className="next-hero mx-4 mb-4">
      <div className="px-5 py-4" style={{direction:'ltr'}}>
        {/* Label row */}
        <div className="flex items-center justify-between mb-3">
          <div style={{fontSize:9,fontFamily:'Space Grotesk',fontWeight:800,letterSpacing:2,textTransform:'uppercase',color:'var(--muted)',opacity:.7}}>
            {isLive?'':(T.nextMatch||'Next Match')}
          </div>
          {isLive?(
            <div className="live-badge">
              <div className="ct-live" style={{width:5,height:5,borderRadius:'50%',background:'var(--red)'}}/>
              LIVE
            </div>
          ):(
            <div style={{fontSize:9,fontFamily:'Space Grotesk',color:'var(--muted)',fontWeight:600}}>
              {kickoffDate} · {kickoffTime} · {next.venue}
            </div>
          )}
        </div>

        {/* Teams duel */}
        <div className="flex items-center gap-3">
          {/* Home */}
          <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'flex-start',gap:4}}>
            <Flag team={next.home_team} size={38}/>
            <span className="syne" style={{fontSize:13,fontWeight:800,color:'var(--text)',lineHeight:1.1,letterSpacing:-.2}}>{next.home_team}</span>
          </div>

          {/* Countdown center */}
          <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:2,flex:'0 0 auto'}}>
            {isLive?(
              <div className="ct-live mono" style={{fontSize:28,fontWeight:900,letterSpacing:1,color:'var(--red)'}}>LIVE</div>
            ):(
              <div style={{display:'flex',alignItems:'flex-end',gap:6}}>
                {(segs||[]).map(({v,l},i)=>(
                  <div key={i} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:0}}>
                    <span className="mono" style={{fontSize:26,fontWeight:900,color:urgency,letterSpacing:-1,lineHeight:1}}>{String(v).padStart(2,'0')}</span>
                    <span style={{fontSize:8,fontFamily:'Space Grotesk',fontWeight:700,color:'var(--muted)',letterSpacing:.5,textTransform:'uppercase'}}>{l}</span>
                  </div>
                ))}
              </div>
            )}
            {!isLive&&!deadlinePassed&&(
              <div style={{fontSize:8,color:'var(--muted)',fontFamily:'Space Grotesk',marginTop:2,whiteSpace:'nowrap',fontWeight:600,opacity:.7}}>{T.predDeadline}</div>
            )}
            {!isLive&&deadlinePassed&&(
              <div style={{fontSize:8,color:'var(--red)',fontFamily:'Space Grotesk',marginTop:2,fontWeight:700,opacity:.8}}>{T.deadlinePassed}</div>
            )}
          </div>

          {/* Away */}
          <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'flex-end',gap:4}}>
            <Flag team={next.away_team} size={38}/>
            <span className="syne" style={{fontSize:13,fontWeight:800,color:'var(--text)',lineHeight:1.1,letterSpacing:-.2,textAlign:'right'}}>{next.away_team}</span>
          </div>
        </div>
      </div>
    </div>
  );
}

// ── Match Card ────────────────────────────────────────────────────────────────
function MatchCard({match,predictions,builders,onPickClick,onBuildClick,loading,lang,stake,playerId}){
  const T=TX[lang];
  const ref=useRef(null);
  const now=useNow();
  const isDeadlinePassed=now>new Date(match.kickoff).getTime()-5*60*1000;
  const isAfterKickoff=now>new Date(match.kickoff).getTime();
  const isTBD=match.home_team==='TBD'||match.away_team==='TBD';
  const canPredict=!isDeadlinePassed&&!match.settled&&!isTBD;
  const preds=predictions||[];
  const predSet=new Set(preds.map(p=>p.prediction));
  const pred=preds.find(p=>['1','X','2','1X','X2'].includes(p.prediction))?.prediction;
  const isKO=match.stage&&match.stage!=='group';
  const [scorers,setScorers]=useState(null);
  const [showScorers,setShowScorers]=useState(false);
  const [loadingScorers,setLoadingScorers]=useState(false);
  // ── Inline Bet Builder state ────────────────────────────────────────────────
  const [showBuilder,setShowBuilder]=useState(false);
  const [blLegs,setBlLegs]=useState([]);
  const [blStake,setBlStake]=useState('100');
  const [blScorers,setBlScorers]=useState(null);
  const [blLoadingScorers,setBlLoadingScorers]=useState(false);
  // ── All picks state ──────────────────────────────────────────────────────────
  const [showPicks,setShowPicks]=useState(false);
  const [allPicks,setAllPicks]=useState(null);
  const [loadingPicks,setLoadingPicks]=useState(false);
  async function loadPicks(){
    if(allPicks)return;
    setLoadingPicks(true);
    try{const d=await apiFetch(`/wc/matches/${match.id}/picks`);setAllPicks(d);}
    catch(e){setAllPicks({predictions:[],builders:[]});}
    setLoadingPicks(false);
  }
  const BCHIPS=[10,25,50,100,200,500,1000,2000];
  function bGetOdds(pred){
    const bh=parseFloat(match.home_odds),bd=parseFloat(match.draw_odds),ba=parseFloat(match.away_odds);
    if(pred==='1') return bh; if(pred==='X') return bd; if(pred==='2') return ba;
    if(pred==='QUALIFY1'||pred==='QUALIFY2'){const p1=1/bh,px=1/bd,p2=1/ba,tot=p1+px+p2;return pred==='QUALIFY1'?Math.round(100/((p1+0.5*px)/tot))/100:Math.round(100/((p2+0.5*px)/tot))/100;}
    if(pred==='1X') return parseFloat(match.odds_1x)||(bh*bd)/(bh+bd);
    if(pred==='X2') return parseFloat(match.odds_x2)||(bd*ba)/(bd+ba);
    if(pred==='BTTS-Y') return parseFloat(match.odds_btts_yes);
    if(pred==='BTTS-N') return parseFloat(match.odds_btts_no);
    if(pred==='OVER2.5') return parseFloat(match.odds_over25);
    if(pred==='UNDER2.5') return parseFloat(match.odds_under25);
    if(pred==='CORNERS-OVER') return parseFloat(match.odds_corners_over);
    if(pred==='CORNERS-UNDER') return parseFloat(match.odds_corners_under);
    if(pred==='CARDS-OVER') return parseFloat(match.odds_cards_over);
    if(pred==='CARDS-UNDER') return parseFloat(match.odds_cards_under);
    if(pred==='BTTS-CARD-Y') return parseFloat(match.odds_btts_card_yes);
    if(pred==='BTTS-CARD-N') return parseFloat(match.odds_btts_card_no);
    if(pred==='FIRSTCORNER-1') return parseFloat(match.odds_firstcorner_home);
    if(pred==='FIRSTCORNER-2') return parseFloat(match.odds_firstcorner_away);
    if(pred.startsWith('ANYTIME:')||pred.startsWith('FIRST:')){
      const pn=pred.split(':').slice(1).join(':');
      const mkt=pred.startsWith('ANYTIME:')?'anytime':'first';
      const s=blScorers?.find(sc=>sc.player_name===pn&&sc.market===mkt);
      return s?parseFloat(s.odds):5.0;
    }
    return 1;
  }
  function bMktGrp(pred){
    if(['1','X','2','1X','X2'].includes(pred)) return '1x2';
    if(['BTTS-Y','BTTS-N'].includes(pred)) return 'btts';
    if(['OVER2.5','UNDER2.5'].includes(pred)) return 'ou';
    if(['CORNERS-OVER','CORNERS-UNDER'].includes(pred)) return 'corners';
    if(['CARDS-OVER','CARDS-UNDER','BTTS-CARD-Y','BTTS-CARD-N','FIRSTCORNER-1','FIRSTCORNER-2'].includes(pred)) return 'cards';
    if(['QUALIFY1','QUALIFY2'].includes(pred)) return 'qualify';
    return pred;
  }
  function bToggleLeg(pred){
    const grp=bMktGrp(pred);
    const isUnique=pred.startsWith('ANYTIME:')||pred.startsWith('FIRST:');
    if(blLegs.includes(pred)){setBlLegs(prev=>prev.filter(p=>p!==pred));}
    else if(!isUnique){setBlLegs(prev=>{const f=prev.filter(p=>bMktGrp(p)!==grp);if(f.length>=8)return prev;return[...f,pred];});}
    else{setBlLegs(prev=>prev.length>=8?prev:[...prev,pred]);}
  }
  function bLegLabel(pred){
    if(pred==='1') return match.home_team; if(pred==='X') return lang==='ar'?'تعادل':'Draw';
    if(pred==='2') return match.away_team; if(pred==='1X') return match.home_team+'/Draw';
    if(pred==='X2') return 'Draw/'+match.away_team; if(pred==='BTTS-Y') return 'BTTS Yes';
    if(pred==='BTTS-N') return 'BTTS No'; if(pred==='OVER2.5') return 'Over 2.5';
    if(pred==='UNDER2.5') return 'Under 2.5';
    if(pred==='QUALIFY1') return match.home_team+' to Qualify';
    if(pred==='QUALIFY2') return match.away_team+' to Qualify';
    if(pred.startsWith('ANYTIME:')) return pred.slice(8);
    if(pred.startsWith('FIRST:')) return '1st: '+pred.slice(6);
    if(pred==='CORNERS-OVER') return `Over ${parseFloat(match.corners_line)||'?'} Corners`;
    if(pred==='CORNERS-UNDER') return `Under ${parseFloat(match.corners_line)||'?'} Corners`;
    if(pred==='CARDS-OVER') return `Over ${parseFloat(match.cards_line)||'?'} Cards`;
    if(pred==='CARDS-UNDER') return `Under ${parseFloat(match.cards_line)||'?'} Cards`;
    if(pred==='BTTS-CARD-Y') return 'Both Teams Carded';
    if(pred==='BTTS-CARD-N') return 'Not Both Carded';
    if(pred==='FIRSTCORNER-1') return match.home_team+' 1st Corner';
    if(pred==='FIRSTCORNER-2') return match.away_team+' 1st Corner';
    return pred;
  }
  async function loadBlScorers(){
    setBlLoadingScorers(true);
    try{const data=await apiFetch(`/wc/matches/${match.id}/players`);setBlScorers(data);}
    catch(e){setBlScorers([]);}
    setBlLoadingScorers(false);
  }
  const blCombinedOdds=blLegs.reduce((acc,p)=>acc*(bGetOdds(p)||1),1);
  const blStakeAmt=Math.min(99999,Math.max(1,parseFloat(blStake)||100));
  const blPotWin=(blStakeAmt*blCombinedOdds).toFixed(2);
  const blCanSubmit=blLegs.length>=2&&blStakeAmt>=1;
  function BlLegBtn({pred,label}){
    const on=blLegs.includes(pred);
    const o=bGetOdds(pred);
    const atMax=blLegs.length>=8&&!on;
    return(
      <button onClick={()=>!atMax&&bToggleLeg(pred)} disabled={atMax}
        style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'6px 10px',
          borderRadius:9,border:`1px solid ${on?'var(--gold)':'var(--border2)'}`,
          background:on?'rgba(242,193,78,0.08)':'transparent',
          cursor:atMax?'not-allowed':'pointer',width:'100%',marginBottom:3,transition:'all .12s',opacity:atMax?0.4:1}}>
        <span style={{fontSize:11,fontWeight:700,color:on?'var(--gold)':'var(--text)',textAlign:'left',flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{label}</span>
        {o&&<span className="mono" style={{fontSize:10,color:on?'var(--gold)':'var(--muted)',fontWeight:700,flexShrink:0,marginLeft:6}}>{o.toFixed(2)}</span>}
      </button>
    );
  }
  const bSecHdr={fontSize:8,fontFamily:'Space Grotesk',fontWeight:800,letterSpacing:1.2,color:'var(--muted)',marginBottom:4,textTransform:'uppercase'};
  async function toggleScorers(){
    if(showScorers){setShowScorers(false);return;}
    setShowScorers(true);
    if(!scorers){
      setLoadingScorers(true);
      try{const sd=await apiFetch(`/wc/matches/${match.id}/players`);setScorers(sd);}catch(e){setScorers([]);}
      setLoadingScorers(false);
    }
  }

  // Computed double-chance odds
  const h=parseFloat(match.home_odds),d=parseFloat(match.draw_odds),a=parseFloat(match.away_odds);
  const odds1X=(parseFloat(match.odds_1x)||(h*d)/(h+d)).toFixed(2);
  const oddsX2=(parseFloat(match.odds_x2)||(d*a)/(d+a)).toFixed(2);

  function onMove(e){
    if(!ref.current)return;
    const r=ref.current.getBoundingClientRect();
    ref.current.style.setProperty('--mx',`${e.clientX-r.left}px`);
    ref.current.style.setProperty('--my',`${e.clientY-r.top}px`);
  }

  function btnClass(type){
    if(match.settled&&match.result){
      const res=match.result;
      const dcWins={'1X':res==='1'||res==='X','X2':res==='X'||res==='2','12':res==='1'||res==='2','1':res==='1','X':res==='X','2':res==='2'};
      if(['1','X','2','1X','X2'].includes(type)){
        if(predSet.has(type)) return dcWins[type]?'correct':'wrong';
        if(['1','X','2'].includes(type)&&type===res) return 'correct';
        return '';
      }
      const pEntry=preds.find(p=>p.prediction===type);
      if(pEntry) return parseFloat(pEntry.payout||0)>0?'correct':'wrong';
      return '';
    }
    if(predSet.has(type)) return ['1','X','2','1X','X2'].includes(type)?`selected-${type}`:'selected-ko';
    return '';
  }

  const stageKey=match.stage;
  const badgeClass=stageKey==='group'?'badge-group':stageKey==='r32'?'badge-r32':stageKey==='r16'?'badge-r16':stageKey==='qf'?'badge-qf':stageKey==='sf'?'badge-sf':'badge-final';
  const stageLabel=stageKey==='group'?`${T.grpPrefix} ${match.grp}`:(T[`stage_${stageKey}`]||stageKey);
  const allOdds={'1':h,'X':d,'2':a,'1X':parseFloat(odds1X),'X2':parseFloat(oddsX2)};
  const potWin=preds.length>0?preds.reduce((s,p)=>s+(stake*(parseFloat(p.odds_locked)||allOdds[p.prediction]||1)),0).toFixed(2):null;

  const kickoffTime=new Date(match.kickoff).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Muscat'});
  const kickoffDate=new Date(match.kickoff).toLocaleDateString('en-GB',{month:'short',day:'numeric',timeZone:'Asia/Muscat'});

  return(
    <div ref={ref} className="match-card spotlight-card mb-3 relative" onMouseMove={onMove}>
      <div className="pitch-texture"/>
      <div className="team-glow-left"/>
      <div className="team-glow-right"/>

      {/* ── Top bar: stage + countdown ── */}
      <div className="flex items-center justify-between px-4 pt-3.5 pb-0 relative z-10">
        <span className={`badge ${badgeClass}`}>{stageLabel}</span>
        <Countdown kickoff={match.kickoff} settled={match.settled} lang={lang}/>
      </div>

      {/* ── Teams duel — centered layout ── */}
      <div className="flex items-center gap-2 px-4 pt-3 pb-2 relative z-10" style={{direction:'ltr'}}>
        {/* Home */}
        <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:5}}>
          <Flag team={match.home_team} size={42}/>
          <span className="syne" style={{fontSize:12,fontWeight:800,textAlign:'center',lineHeight:1.2,letterSpacing:-.2,color:'var(--text)',maxWidth:90,wordBreak:'break-word'}}>{match.home_team}</span>
        </div>

        {/* Center — score or time */}
        <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:3,flex:'0 0 auto',minWidth:64}}>
          {match.settled&&match.home_score!=null?(
            <div className="mono" style={{fontSize:24,fontWeight:900,color:'var(--gold-bright)',letterSpacing:-2,lineHeight:1}}>
              {match.home_score}<span style={{color:'var(--muted)',margin:'0 2px',fontSize:16}}>–</span>{match.away_score}
            </div>
          ):(
            <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:1}}>
              <div style={{width:28,height:28,borderRadius:'50%',background:'rgba(255,255,255,0.04)',border:'1px solid rgba(255,255,255,0.08)',display:'flex',alignItems:'center',justifyContent:'center'}}>
                <span style={{fontSize:7,fontWeight:900,color:'var(--muted)',fontFamily:'Space Grotesk',letterSpacing:1}}>VS</span>
              </div>
            </div>
          )}
          <div style={{fontSize:9,color:'var(--muted)',fontFamily:'Space Grotesk',fontWeight:600,textAlign:'center',lineHeight:1.4,whiteSpace:'nowrap'}}>
            {kickoffDate}<br/>{kickoffTime}
          </div>
        </div>

        {/* Away */}
        <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:5}}>
          <Flag team={match.away_team} size={42}/>
          <span className="syne" style={{fontSize:12,fontWeight:800,textAlign:'center',lineHeight:1.2,letterSpacing:-.2,color:'var(--text)',maxWidth:90,wordBreak:'break-word'}}>{match.away_team}</span>
        </div>
      </div>

      {/* Venue */}
      <div className="text-center pb-2 relative z-10">
        <span style={{fontSize:9,color:'var(--muted)',fontFamily:'Space Grotesk',fontWeight:500,opacity:.7}}>{match.venue}</span>
      </div>

      {/* ── Divider ── */}
      <div style={{height:1,margin:'0 16px',background:'linear-gradient(90deg,transparent,rgba(255,255,255,0.06),rgba(242,193,78,0.1),rgba(255,255,255,0.06),transparent)'}}/>

      {/* ── Row 1: 1 X 2 ── */}
      <div className="flex gap-1.5 px-3 pt-2.5 relative z-10" style={{direction:'ltr'}}>
        {[
          {type:'1',team:match.home_team,odds:match.home_odds,label:'1'},
          {type:'X',team:null,odds:match.draw_odds,label:'X'},
          {type:'2',team:match.away_team,odds:match.away_odds,label:'2'},
        ].map(({type,team,odds,label})=>(
          <button key={type}
            className={`pred-btn ${btnClass(type)}`}
            disabled={!canPredict||loading}
            onClick={()=>canPredict&&onPickClick(match,type)}>
            <span className="odds-label">{label}</span>
            <span className="odds-val">{parseFloat(odds).toFixed(2)}</span>
            {team?<Flag team={team} size={14}/>:<span style={{height:10,fontSize:9,opacity:.4}}>—</span>}
          </button>
        ))}
      </div>

      {/* ── Row 2: Double Chance ── */}
      <div className="flex gap-1.5 px-3 pt-1.5 pb-3 relative z-10" style={{direction:'ltr'}}>
        {[
          {type:'1X',odds:odds1X,label:'1X',desc:lang==='ar'?`${match.home_team} أو تعادل`:`${match.home_team} or Draw`},
          {type:'X2',odds:oddsX2,label:'X2',desc:lang==='ar'?`تعادل أو ${match.away_team}`:`Draw or ${match.away_team}`},
        ].map(({type,odds,label,desc})=>(
          <button key={type}
            className={`pred-btn dc ${btnClass(type)}`}
            disabled={!canPredict||loading}
            onClick={()=>canPredict&&onPickClick(match,type)}
            style={{flexDirection:'row',justifyContent:'space-between',padding:'9px 12px',gap:0}}>
            <div style={{display:'flex',flexDirection:'column',alignItems:'flex-start',gap:1}}>
              <span className="odds-label" style={{fontSize:8}}>{label}</span>
              <span style={{fontSize:9,color:'var(--muted)',fontWeight:600,lineHeight:1.2,maxWidth:100,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{desc}</span>
            </div>
            <span className="odds-val-dc">{odds}</span>
          </button>
        ))}
      </div>

      {/* ── KO Markets ── */}
      {isKO&&(
        <div className="px-3 pb-1 relative z-10" style={{borderTop:'1px solid rgba(255,255,255,0.04)',paddingTop:6}}>
          {isTBD&&(
            <div style={{textAlign:'center',padding:'10px 0 6px',fontSize:11,color:'var(--muted)',fontFamily:'Space Grotesk',fontWeight:600,letterSpacing:.3}}>
              Betting opens when teams are confirmed
            </div>
          )}
          {/* To Qualify row — settles on who actually advances (incl. ET/pens) */}
          {!isTBD&&(()=>{
            const _bh=parseFloat(match.home_odds),_bd=parseFloat(match.draw_odds),_ba=parseFloat(match.away_odds);
            const _p1=1/_bh,_px=1/_bd,_p2=1/_ba,_tot=_p1+_px+_p2;
            const q1=Math.round(100/((_p1+0.5*_px)/_tot))/100;
            const q2=Math.round(100/((_p2+0.5*_px)/_tot))/100;
            return(
            <div className="flex gap-1.5 mb-1.5" style={{direction:'ltr'}}>
              {[
                {type:'QUALIFY1',label:'Qualify',desc:match.home_team,odds:q1,team:match.home_team},
                {type:'QUALIFY2',label:'Qualify',desc:match.away_team,odds:q2,team:match.away_team},
              ].map(({type,label,desc,odds,team})=>(
                <button key={type} className={`pred-btn ko ${btnClass(type)}`}
                  disabled={!canPredict||loading}
                  onClick={()=>canPredict&&onPickClick(match,type)}
                  style={{flexDirection:'row',justifyContent:'space-between',padding:'7px 10px',gap:0}}>
                  <div style={{display:'flex',flexDirection:'column',alignItems:'flex-start',gap:1}}>
                    <span className="odds-label" style={{fontSize:8}}>{label}</span>
                    <div style={{display:'flex',alignItems:'center',gap:3}}><Flag team={team} size={12}/><span style={{fontSize:9,color:'var(--muted)',fontWeight:600,maxWidth:80,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{desc}</span></div>
                  </div>
                  <span className="odds-val-dc">{odds.toFixed(2)}</span>
                </button>
              ))}
            </div>
            );
          })()}
          {/* BTTS row */}
          {match.odds_btts_yes&&(
            <div className="flex gap-1.5 mb-1.5" style={{direction:'ltr'}}>
              {[
                {type:'BTTS-Y',label:'BTTS',desc:'Yes',odds:match.odds_btts_yes},
                {type:'BTTS-N',label:'BTTS',desc:'No',odds:match.odds_btts_no},
              ].map(({type,label,desc,odds})=>(
                <button key={type} className={`pred-btn ko ${btnClass(type)}`}
                  disabled={!canPredict||loading}
                  onClick={()=>canPredict&&onPickClick(match,type)}
                  style={{flexDirection:'row',justifyContent:'space-between',padding:'7px 10px',gap:0}}>
                  <div style={{display:'flex',flexDirection:'column',alignItems:'flex-start',gap:1}}>
                    <span className="odds-label" style={{fontSize:8}}>{label}</span>
                    <span style={{fontSize:9,color:'var(--muted)',fontWeight:600}}>{desc}</span>
                  </div>
                  <span className="odds-val-dc">{parseFloat(odds).toFixed(2)}</span>
                </button>
              ))}
            </div>
          )}
          {/* Over/Under row */}
          {match.odds_over25&&(
            <div className="flex gap-1.5 mb-1.5" style={{direction:'ltr'}}>
              {[
                {type:'OVER2.5',label:'Goals',desc:'Over 2.5',odds:match.odds_over25},
                {type:'UNDER2.5',label:'Goals',desc:'Under 2.5',odds:match.odds_under25},
              ].map(({type,label,desc,odds})=>(
                <button key={type} className={`pred-btn ko ${btnClass(type)}`}
                  disabled={!canPredict||loading}
                  onClick={()=>canPredict&&onPickClick(match,type)}
                  style={{flexDirection:'row',justifyContent:'space-between',padding:'7px 10px',gap:0}}>
                  <div style={{display:'flex',flexDirection:'column',alignItems:'flex-start',gap:1}}>
                    <span className="odds-label" style={{fontSize:8}}>{label}</span>
                    <span style={{fontSize:9,color:'var(--muted)',fontWeight:600}}>{desc}</span>
                  </div>
                  <span className="odds-val-dc">{parseFloat(odds).toFixed(2)}</span>
                </button>
              ))}
            </div>
          )}
          {/* Draw No Bet row */}
          {match.odds_dnb_home&&(
            <div className="flex gap-1.5 mb-1.5" style={{direction:'ltr'}}>
              {[
                {type:'DNB1',label:'DNB',desc:match.home_team.split(' ').slice(-1)[0],odds:match.odds_dnb_home},
                {type:'DNB2',label:'DNB',desc:match.away_team.split(' ').slice(-1)[0],odds:match.odds_dnb_away},
              ].map(({type,label,desc,odds})=>(
                <button key={type} className={`pred-btn ko ${btnClass(type)}`}

        const bord=refund?'rgba(242,193,78,0.2)':won?'rgba(0,201,123,0.18)':'rgba(255,54,81,0.12)';
        return(
          <div key={b.id} style={{margin:'0 12px 6px',padding:'8px 10px',background:bc,border:`1px solid ${bord}`,borderRadius:12,direction:'ltr'}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:5}}>
              <div style={{display:'flex',alignItems:'center',gap:5}}>
                <span style={{fontSize:8,fontFamily:'Space Grotesk',fontWeight:800,color:rc,letterSpacing:1,textTransform:'uppercase'}}>Builder</span>
                <span style={{fontSize:9,fontFamily:'Space Grotesk',fontWeight:700,color:'var(--muted)',opacity:.7}}>{(b.legs||[]).length} legs</span>
              </div>
              <div style={{display:'flex',alignItems:'center',gap:8}}>
                <span className="mono" style={{fontSize:13,fontWeight:800,color:rc,letterSpacing:-0.5}}>{result}</span>
                <span className="mono" style={{fontSize:11,fontWeight:700,color:'var(--muted)'}}>{parseFloat(b.combined_odds).toFixed(2)}×</span>
              </div>
            </div>
            <div style={{display:'flex',flexWrap:'wrap',gap:3}}>
              {(b.legs||[]).map(l=>{
                const lc=l.leg_result==='won'?'var(--green)':l.leg_result==='lost'?'var(--red)':l.leg_result==='refund'?'var(--gold)':'var(--muted)';
                const lb=l.leg_result==='won'?'rgba(0,201,123,.1)':l.leg_result==='lost'?'rgba(255,54,81,.08)':l.leg_result==='refund'?'rgba(242,193,78,.1)':'rgba(255,255,255,.04)';
                return(
                  <span key={l.id} style={{fontSize:9,padding:'2px 7px',borderRadius:99,background:lb,border:`1px solid ${lc}40`,color:lc,fontWeight:600,fontFamily:'Space Grotesk',display:'inline-flex',alignItems:'center',gap:3}}>
                    {bLegLabel(l.prediction)}
                    {l.leg_result&&<span style={{fontSize:7}}>{l.leg_result==='won'?'✓':l.leg_result==='lost'?'✗':l.leg_result==='refund'?'↩':'?'}</span>}
                  </span>
                );
              })}
            </div>
          </div>
        );
      })}
      {/* ── Potential win ── */}
      {!match.settled&&preds.length>0&&(
        <div className="pb-3 relative z-10" style={{marginTop:-4,textAlign:'center'}}>
          <span style={{display:'inline-flex',alignItems:'center',gap:6,padding:'4px 12px',background:'rgba(0,201,123,0.07)',border:'1px solid rgba(0,201,123,0.15)',borderRadius:999}}>
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="var(--green)" strokeWidth="2.5" strokeLinecap="round"><polyline points="20 6 9 17 4 12"/></svg>
            <span style={{fontSize:11,color:'var(--green)',fontWeight:700,fontFamily:'Space Grotesk'}}>{T.potentialWin} <span className="mono" style={{fontWeight:900,fontSize:12}}>${potWin}</span></span>
          </span>
        </div>
      )}
      {/* ── All Picks drawdown ── */}
      {isAfterKickoff&&(()=>{
        function pLabel(pred){
          if(pred==='1') return match.home_team;
          if(pred==='X') return lang==='ar'?'تعادل':'Draw';
          if(pred==='2') return match.away_team;
          if(pred==='1X') return match.home_team+'/Draw';
          if(pred==='X2') return 'Draw/'+match.away_team;
          return bLegLabel(pred);
        }
        const playerMap={};
        (allPicks?.predictions||[]).forEach(p=>{
          if(!playerMap[p.player_id]) playerMap[p.player_id]={id:p.player_id,name:p.player_name,preds:[],builders:[]};
          playerMap[p.player_id].preds.push(p);
        });
        (allPicks?.builders||[]).forEach(b=>{
          if(!playerMap[b.player_id]) playerMap[b.player_id]={id:b.player_id,name:b.player_name,preds:[],builders:[]};
          playerMap[b.player_id].builders.push(b);
        });
        const players=Object.values(playerMap).sort((a,b)=>{
          if(a.id===playerId) return -1;
          if(b.id===playerId) return 1;
          return a.name<b.name?-1:1;
        });
        const totalCount=players.length;
        return(
          <div style={{borderTop:'1px solid var(--border2)',margin:'0 12px',paddingTop:5,paddingBottom:6,direction:'ltr'}}>
            <button onClick={()=>{setShowPicks(s=>{const nv=!s;if(nv&&!allPicks)loadPicks();return nv;})}}
              style={{width:'100%',display:'flex',alignItems:'center',justifyContent:'space-between',background:'none',border:'none',cursor:'pointer',padding:'3px 0',color:'var(--muted)'}}>
              <div style={{display:'flex',alignItems:'center',gap:5}}>
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
                <span style={{fontSize:10,fontFamily:'Space Grotesk',fontWeight:700,letterSpacing:.4,textTransform:'uppercase'}}>{lang==='ar'?'رهانات الجميع':'All Picks'}</span>
                {allPicks&&<span style={{fontSize:9,background:'rgba(255,255,255,0.07)',padding:'0px 6px',borderRadius:99,fontFamily:'Space Grotesk',color:'var(--text2)',fontWeight:600}}>{totalCount}</span>}
              </div>
              <span style={{fontSize:8,transition:'transform .2s',transform:showPicks?'rotate(180deg)':'none'}}>▼</span>
            </button>
            {showPicks&&(
              <div style={{marginTop:4,display:'flex',flexDirection:'column',gap:3}}>
                {loadingPicks&&<div style={{textAlign:'center',fontSize:10,color:'var(--muted)',padding:'8px 0',fontFamily:'Space Grotesk'}}>...</div>}
                {!loadingPicks&&allPicks&&players.length===0&&<div style={{textAlign:'center',fontSize:10,color:'var(--muted)',padding:'6px 0',fontFamily:'Space Grotesk'}}>{lang==='ar'?'لا توجد رهانات':'No picks yet'}</div>}
                {!loadingPicks&&allPicks&&players.map(pl=>{
                  const isMe=pl.id===playerId;
                  return(
                    <div key={pl.id} style={{display:'flex',alignItems:'flex-start',gap:6,padding:'4px 5px',borderRadius:8,background:isMe?'rgba(242,193,78,0.05)':'rgba(255,255,255,0.02)'}}>
                      <div style={{minWidth:18,height:18,borderRadius:99,background:isMe?'var(--gold)':'rgba(255,255,255,0.08)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,marginTop:1}}>
                        <span style={{fontSize:7,fontWeight:800,color:isMe?'#0A0600':'var(--muted)',fontFamily:'Space Grotesk'}}>{pl.name.charAt(0).toUpperCase()}</span>
                      </div>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontSize:9,fontWeight:700,color:isMe?'var(--gold)':'var(--text2)',fontFamily:'Space Grotesk',marginBottom:3,lineHeight:1}}>
                          {pl.name}{isMe&&<span style={{fontWeight:500,color:'var(--muted)',fontSize:8}}> ({lang==='ar'?'أنت':'You'})</span>}
                        </div>
                        <div style={{display:'flex',flexWrap:'wrap',gap:3}}>
                          {pl.preds.map((p,i)=>{
                            const won=p.settled&&parseFloat(p.payout)>parseFloat(p.stake);
                            const lost=p.settled&&parseFloat(p.payout)===0;
                            const c=!p.settled?'var(--gold)':won?'var(--green)':lost?'var(--red)':'var(--muted)';
                            const bg=!p.settled?'rgba(242,193,78,0.07)':won?'rgba(0,201,123,0.07)':lost?'rgba(255,54,81,0.06)':'rgba(255,255,255,0.04)';
                            const brd=!p.settled?'rgba(242,193,78,0.18)':won?'rgba(0,201,123,0.18)':lost?'rgba(255,54,81,0.12)':'rgba(255,255,255,0.06)';
                            return(
                              <span key={i} style={{fontSize:9,padding:'2px 7px',borderRadius:99,background:bg,border:`1px solid ${brd}`,color:c,fontWeight:600,fontFamily:'Space Grotesk',display:'inline-flex',alignItems:'center',gap:2}}>
                                {pLabel(p.prediction)}{p.settled&&<span style={{fontSize:7}}>{won?'✓':lost?'✗':'↩'}</span>}
                              </span>
                            );
                          })}
                          {pl.builders.map((b,i)=>{
                            const bWon=b.settled&&parseFloat(b.payout)>parseFloat(b.stake);
                            const bLost=b.settled&&parseFloat(b.payout)===0;
                            const bc=!b.settled?'var(--or)':bWon?'var(--green)':bLost?'var(--red)':'var(--muted)';
                            const bbg=!b.settled?'rgba(255,114,64,0.07)':bWon?'rgba(0,201,123,0.07)':bLost?'rgba(255,54,81,0.06)':'rgba(255,255,255,0.04)';
                            const bbrd=!b.settled?'rgba(255,114,64,0.2)':bWon?'rgba(0,201,123,0.18)':bLost?'rgba(255,54,81,0.12)':'rgba(255,255,255,0.06)';
                            return(
                              <span key={i} style={{fontSize:9,padding:'2px 7px',borderRadius:99,background:bbg,border:`1px solid ${bbrd}`,color:bc,fontWeight:600,fontFamily:'Space Grotesk',display:'inline-flex',alignItems:'center',gap:3}}>
                                <svg width="7" height="7" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                                {(b.legs||[]).length}L ×{parseFloat(b.combined_odds).toFixed(2)}{b.settled&&<span style={{fontSize:7}}>{bWon?'✓':bLost?'✗':'↩'}</span>}
                              </span>
                            );
                          })}
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        );
      })()}
    </div>
  );
}

// ── Bet Builder Sheet ─────────────────────────────────────────────────────────
function BuilderSheet({match,onConfirm,onCancel,lang,defaultStake}){
  const T=TX[lang];
  const CHIPS=[10,25,50,100,200,500,1000,2000];
  const [selectedLegs,setSelectedLegs]=useState([]);
  const [chosenStake,setChosenStake]=useState(String(defaultStake||100));
  const [scorers,setScorers]=useState(null);
  const [loadingScorers,setLoadingScorers]=useState(false);
  const bh=parseFloat(match.home_odds),bd=parseFloat(match.draw_odds),ba=parseFloat(match.away_odds);
  function getOdds(pred){
    if(pred==='1') return bh;
    if(pred==='X') return bd;
    if(pred==='2') return ba;
    if(pred==='1X') return parseFloat(match.odds_1x)||(bh*bd)/(bh+bd);
    if(pred==='X2') return parseFloat(match.odds_x2)||(bd*ba)/(bd+ba);
    if(pred==='BTTS-Y') return parseFloat(match.odds_btts_yes);
    if(pred==='BTTS-N') return parseFloat(match.odds_btts_no);
    if(pred==='OVER2.5') return parseFloat(match.odds_over25);
    if(pred==='UNDER2.5') return parseFloat(match.odds_under25);
    if(pred==='CORNERS-OVER') return parseFloat(match.odds_corners_over);
    if(pred==='CORNERS-UNDER') return parseFloat(match.odds_corners_under);
    if(pred==='CARDS-OVER') return parseFloat(match.odds_cards_over);
    if(pred==='CARDS-UNDER') return parseFloat(match.odds_cards_under);
    if(pred==='BTTS-CARD-Y') return parseFloat(match.odds_btts_card_yes);
    if(pred==='BTTS-CARD-N') return parseFloat(match.odds_btts_card_no);
    if(pred==='FIRSTCORNER-1') return parseFloat(match.odds_firstcorner_home);
    if(pred==='FIRSTCORNER-2') return parseFloat(match.odds_firstcorner_away);
    if(pred==='QUALIFY1'||pred==='QUALIFY2'){const p1=1/bh,px=1/bd,p2=1/ba,tot=p1+px+p2;return pred==='QUALIFY1'?Math.round(100/((p1+0.5*px)/tot))/100:Math.round(100/((p2+0.5*px)/tot))/100;}
    if(pred.startsWith('ANYTIME:')||pred.startsWith('FIRST:')){
      const pn=pred.split(':').slice(1).join(':');
      const mkt=pred.startsWith('ANYTIME:')?'anytime':'first';
      const s=scorers?.find(sc=>sc.player_name===pn&&sc.market===mkt);
      return s?parseFloat(s.odds):5.0;
    }
    return 1;
  }
  function mktGrp(pred){
    if(['1','X','2','1X','X2'].includes(pred)) return '1x2';
    if(['BTTS-Y','BTTS-N'].includes(pred)) return 'btts';
    if(['OVER2.5','UNDER2.5'].includes(pred)) return 'ou';
    if(['CORNERS-OVER','CORNERS-UNDER'].includes(pred)) return 'corners';
    if(['CARDS-OVER','CARDS-UNDER','BTTS-CARD-Y','BTTS-CARD-N','FIRSTCORNER-1','FIRSTCORNER-2'].includes(pred)) return 'cards';
    if(['QUALIFY1','QUALIFY2'].includes(pred)) return 'qualify';
    return pred;
  }
  function toggleLeg(pred){
    const grp=mktGrp(pred);
    const isUnique=pred.startsWith('ANYTIME:')||pred.startsWith('FIRST:');
    if(selectedLegs.includes(pred)){
      setSelectedLegs(prev=>prev.filter(p=>p!==pred));
    } else if(!isUnique){
      setSelectedLegs(prev=>{
        const filtered=prev.filter(p=>mktGrp(p)!==grp);
        if(filtered.length>=8) return prev;
        return [...filtered,pred];
      });
    } else {
      setSelectedLegs(prev=>prev.length>=8?prev:[...prev,pred]);
    }
  }
  function legLabel(pred){
    if(pred==='1') return match.home_team;
    if(pred==='X') return lang==='ar'?'تعادل':'Draw';
    if(pred==='2') return match.away_team;
    if(pred==='1X') return match.home_team+'/Draw';
    if(pred==='X2') return 'Draw/'+match.away_team;
    if(pred==='BTTS-Y') return 'BTTS Yes';
    if(pred==='BTTS-N') return 'BTTS No';
    if(pred==='OVER2.5') return 'Over 2.5';
    if(pred==='UNDER2.5') return 'Under 2.5';
    if(pred==='CORNERS-OVER') return `Over ${parseFloat(match.corners_line)||'?'} Corners`;
    if(pred==='CORNERS-UNDER') return `Under ${parseFloat(match.corners_line)||'?'} Corners`;
    if(pred==='CARDS-OVER') return `Over ${parseFloat(match.cards_line)||'?'} Cards`;
    if(pred==='CARDS-UNDER') return `Under ${parseFloat(match.cards_line)||'?'} Cards`;
    if(pred==='BTTS-CARD-Y') return 'Both Teams Carded';
    if(pred==='BTTS-CARD-N') return 'Not Both Carded';
    if(pred==='FIRSTCORNER-1') return match.home_team+' 1st Corner';
    if(pred==='FIRSTCORNER-2') return match.away_team+' 1st Corner';
    if(pred==='QUALIFY1') return match.home_team+' to Qualify';
    if(pred==='QUALIFY2') return match.away_team+' to Qualify';
    if(pred.startsWith('ANYTIME:')) return pred.slice(8);
    if(pred.startsWith('FIRST:')) return '1st: '+pred.slice(6);
    return pred;
  }
  const combinedOdds=selectedLegs.reduce((acc,p)=>acc*(getOdds(p)||1),1);
  const stakeAmt=Math.min(99999,Math.max(1,parseFloat(chosenStake)||defaultStake||100));
  const potWin=(stakeAmt*combinedOdds).toFixed(2);
  const canSubmit=selectedLegs.length>=2&&stakeAmt>=1;
  async function loadScorers(){
    setLoadingScorers(true);
    try{const data=await apiFetch(`/wc/matches/${match.id}/players`);setScorers(data);}
    catch(e){}
    setLoadingScorers(false);
  }
  function LegBtn({pred,label}){
    const on=selectedLegs.includes(pred);
    const o=getOdds(pred);
    const atMax=selectedLegs.length>=8&&!on;
    return(
      <button onClick={()=>!atMax&&toggleLeg(pred)} disabled={atMax}
        style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'7px 10px',
          borderRadius:10,border:`1px solid ${on?'var(--gold)':'var(--border2)'}`,
          background:on?'rgba(242,193,78,0.08)':'var(--glass)',
          cursor:atMax?'not-allowed':'pointer',width:'100%',marginBottom:4,transition:'all .12s',opacity:atMax?0.4:1}}>
        <span style={{fontSize:12,fontWeight:700,color:on?'var(--gold)':'var(--text)',textAlign:'left',flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{label}</span>
        {o&&<span className="mono" style={{fontSize:11,color:on?'var(--gold)':'var(--muted)',fontWeight:700,flexShrink:0,marginLeft:8}}>{o.toFixed(2)}</span>}
      </button>
    );
  }
  const secHdr={fontSize:9,fontFamily:'Space Grotesk',fontWeight:800,letterSpacing:1.2,color:'var(--muted)',marginBottom:6,textTransform:'uppercase'};
  return(
    <div className="sheet-overlay" onClick={onCancel}>
      <div className="sheet-panel" style={{maxHeight:'92dvh',overflowY:'auto',paddingBottom:'env(safe-area-inset-bottom,20px)'}} onClick={e=>e.stopPropagation()}>
        <div className="sheet-handle"/>
        <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',padding:'4px 16px 12px'}}>
          <div>
            <div style={{fontSize:14,fontWeight:800,fontFamily:'Space Grotesk',color:'var(--gold)',letterSpacing:.3}}>{lang==='ar'?'بناء رهان':'Bet Builder'}</div>
            <div style={{fontSize:11,color:'var(--muted)',marginTop:2,fontWeight:600}}>{match.home_flag} {match.home_team} vs {match.away_team} {match.away_flag}</div>
          </div>
          <button onClick={onCancel} style={{width:28,height:28,borderRadius:8,background:'var(--glass)',border:'1px solid var(--border2)',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--muted)',cursor:'pointer',fontSize:13,flexShrink:0}}>✕</button>
        </div>
        <div style={{padding:'0 16px',display:'flex',flexDirection:'column',gap:12}}>
          <div>
            <div style={secHdr}>{lang==='ar'?'نتيجة المباراة':'Match Result'}</div>
            <LegBtn pred="1" label={`1 · ${match.home_team}`}/>
            <LegBtn pred="X" label={lang==='ar'?'X · تعادل':'X · Draw'}/>
            <LegBtn pred="2" label={`2 · ${match.away_team}`}/>
          </div>
          <div>
            <div style={secHdr}>{lang==='ar'?'فرصة مزدوجة':'Double Chance'}</div>
            <LegBtn pred="1X" label={`1X · ${match.home_team}/Draw`}/>
            <LegBtn pred="X2" label={`X2 · Draw/${match.away_team}`}/>
          </div>
          {(parseFloat(match.odds_btts_yes)||parseFloat(match.odds_btts_no))&&(
            <div>
              <div style={secHdr}>{lang==='ar'?'كلا الفريقين يسجل':'Both Teams to Score'}</div>
              <LegBtn pred="BTTS-Y" label={lang==='ar'?'BTTS نعم':'BTTS Yes'}/>
              <LegBtn pred="BTTS-N" label={lang==='ar'?'BTTS لا':'BTTS No'}/>
            </div>
          )}
          {(parseFloat(match.odds_over25)||parseFloat(match.odds_under25))&&(
            <div>
              <div style={secHdr}>{lang==='ar'?'أهداف Over/Under 2.5':'Goals Over/Under 2.5'}</div>
              <LegBtn pred="OVER2.5" label={lang==='ar'?'أكثر من 2.5':'Over 2.5'}/>
              <LegBtn pred="UNDER2.5" label={lang==='ar'?'أقل من 2.5':'Under 2.5'}/>
            </div>
          )}
          {match.stage==='r16'&&(parseFloat(match.odds_corners_over)||parseFloat(match.odds_corners_under))&&(
            <div>
              <div style={secHdr}>Corners O/U {match.corners_line||'?'}</div>
              <LegBtn pred="CORNERS-OVER" label={`Over ${parseFloat(match.corners_line)||'?'} Corners`}/>
              <LegBtn pred="CORNERS-UNDER" label={`Under ${parseFloat(match.corners_line)||'?'} Corners`}/>
            </div>
          )}
          {match.stage==='r16'&&(parseFloat(match.odds_cards_over)||parseFloat(match.odds_cards_under))&&(
            <div>
              <div style={secHdr}>Cards O/U {match.cards_line||'?'}</div>
              <LegBtn pred="CARDS-OVER" label={`Over ${parseFloat(match.cards_line)||'?'} Cards`}/>
              <LegBtn pred="CARDS-UNDER" label={`Under ${parseFloat(match.cards_line)||'?'} Cards`}/>
            </div>
          )}
          {match.stage==='r16'&&(parseFloat(match.odds_btts_card_yes)||parseFloat(match.odds_firstcorner_home))&&(
            <div>
              <div style={secHdr}>Cards Specials</div>
              {!!parseFloat(match.odds_btts_card_yes)&&<><LegBtn pred="BTTS-CARD-Y" label="Both Teams Carded"/><LegBtn pred="BTTS-CARD-N" label="Not Both Carded"/></>}
              {!!parseFloat(match.odds_firstcorner_home)&&<><LegBtn pred="FIRSTCORNER-1" label={match.home_team+' 1st Corner'}/><LegBtn pred="FIRSTCORNER-2" label={match.away_team+' 1st Corner'}/></>}
            </div>
          )}
          <div>
            <div style={secHdr}>{lang==='ar'?'من يتأهل؟':'To Qualify'}</div>
            <LegBtn pred="QUALIFY1" label={`${match.home_team} to Qualify`}/>
            <LegBtn pred="QUALIFY2" label={`${match.away_team} to Qualify`}/>
          </div>
          <div>
            <div style={secHdr}>{lang==='ar'?'هداف الأهداف':'Goal Scorers'}</div>
            {!scorers&&(
              <button onClick={loadScorers} disabled={loadingScorers}
                style={{display:'flex',alignItems:'center',gap:6,padding:'8px 12px',borderRadius:10,border:'1px dashed var(--border2)',background:'transparent',color:'var(--muted)',cursor:loadingScorers?'wait':'pointer',fontSize:11,fontWeight:600,width:'100%',justifyContent:'center'}}>
                {loadingScorers?'Loading...':(lang==='ar'?'تحميل هداف الأهداف':'Load Goal Scorer Markets')}
              </button>
            )}
            {scorers&&(()=>{
              const anytime=scorers.filter(s=>s.market==='anytime').sort((a,b)=>parseFloat(a.odds)-parseFloat(b.odds)).slice(0,12);
              const first=scorers.filter(s=>s.market==='first').sort((a,b)=>parseFloat(a.odds)-parseFloat(b.odds)).slice(0,8);
              return(<>
                {anytime.length>0&&(<div style={{marginBottom:8}}>
                  <div style={{fontSize:8,color:'var(--muted)',fontWeight:700,letterSpacing:.8,marginBottom:4,fontFamily:'Space Grotesk'}}>ANYTIME SCORER</div>
                  {anytime.map(s=>(<LegBtn key={'A:'+s.player_name} pred={'ANYTIME:'+s.player_name} label={s.player_name}/>))}
                </div>)}
                {first.length>0&&(<div>
                  <div style={{fontSize:8,color:'var(--muted)',fontWeight:700,letterSpacing:.8,marginBottom:4,fontFamily:'Space Grotesk'}}>FIRST SCORER</div>
