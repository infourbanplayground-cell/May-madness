  );
}

// ── Fixtures Tab ──────────────────────────────────────────────────────────────
function FixturesTab({matches,predictions,builders,onPickClick,onBuildClick,loadingMatch,settings,lang,playerId}){
  const T=TX[lang];
  const [filter,setFilter]=useState('upcoming');
  const [showFinished,setShowFinished]=useState(false);
  const predMap={};(predictions||[]).forEach(p=>{if(!predMap[p.match_id])predMap[p.match_id]=[];predMap[p.match_id].push(p);});
  const builderMap={};(builders||[]).forEach(b=>{if(!builderMap[b.match_id])builderMap[b.match_id]=[];builderMap[b.match_id].push(b);});
  const now=useNow();
  const deadline=(m)=>new Date(m.kickoff).getTime()-5*60*1000;
  let shown=matches;
  if(filter==='upcoming') shown=matches.filter(m=>!m.settled&&deadline(m)>now);
  if(filter==='my') shown=matches.filter(m=>predMap[m.id]);
  function groupAndSort(list){
    const g={};
    list.forEach(m=>{
      const dk=new Date(m.kickoff).toLocaleDateString('en-CA',{timeZone:'Asia/Muscat'});
      const k=m.stage+'_'+dk;
      if(!g[k]) g[k]={stage:m.stage,date:dk,matches:[]};
      g[k].matches.push(m);
    });
    return Object.values(g).sort((a,b)=>a.date.localeCompare(b.date));
  }
  const upcoming=shown.filter(m=>!m.settled);
  const finished=filter==='upcoming'?[]:shown.filter(m=>m.settled);
  const upcomingGroups=groupAndSort(upcoming);
  const finishedGroups=groupAndSort(finished);
  const stake=parseFloat(settings?.stake_per_match||100);
  function renderGroups(groups){
    return groups.map(group=>(
      <div key={group.stage+'_'+group.date} className="px-4 mb-1">
        <div className="section-header mt-3">
          <div className="section-header-bar"/>
          <div><div className="section-date-label">{new Date(group.date+'T12:00:00Z').toLocaleDateString(lang==='ar'?'ar-OM':'en-GB',{weekday:'long',month:'long',day:'numeric'})}</div></div>
          <span className="section-stage-badge">{STAGE_EN[group.stage]||group.stage}</span>
        </div>
        {group.matches.map(m=>(
          <MatchCard key={m.id} match={m} predictions={predMap[m.id]||[]} builders={builderMap[m.id]||[]}
            onPickClick={onPickClick} onBuildClick={onBuildClick} loading={loadingMatch===m.id}
            lang={lang} stake={stake} playerId={playerId}/>
        ))}
      </div>
    ));
  }
  return(
    <div className="pb-32">
      <div className="pt-3"><NextMatchBanner matches={matches} lang={lang}/></div>
      {/* ── Filter + odds info row ── */}
      <div className="flex items-center gap-2 px-4 pb-3">
        <div className="flex gap-1.5" style={{flex:1}}>
          {[['all',T.all],['upcoming',T.upcoming],['my',T.myPicks]].map(([v,l])=>(
            <button key={v} className={`pill-tab ${filter===v?'active':''}`} onClick={()=>setFilter(v)}>{l}</button>
          ))}
        </div>
        <div style={{display:'flex',alignItems:'center',gap:4,padding:'4px 9px',background:'rgba(0,201,123,0.06)',border:'1px solid rgba(0,201,123,0.12)',borderRadius:999,flexShrink:0}}>
          <div style={{width:5,height:5,borderRadius:'50%',background:'var(--green)',boxShadow:'0 0 4px rgba(0,201,123,0.6)'}}/>
          <span style={{fontSize:8,fontFamily:'Space Grotesk',fontWeight:800,color:'var(--green)',letterSpacing:.5,whiteSpace:'nowrap'}}>
            LIVE ODDS
            {settings?.odds_last_updated&&(()=>{const diff=Date.now()-new Date(settings.odds_last_updated).getTime();const m=Math.floor(diff/60000);const h=Math.floor(m/60);return ` · ${h>0?`${h}h`:`${m}m`}`;})()}
          </span>
        </div>
      </div>
      {upcomingGroups.length===0&&finished.length===0&&(
        <div className="flex flex-col items-center justify-center py-20" style={{color:'var(--muted)'}}>
          <IconBall size={40} color="var(--muted)"/>
          <div className="mt-3 font-bold">{T.noMatches}</div>
        </div>
      )}
      {renderGroups(upcomingGroups)}
      {finished.length>0&&(
        <div className="px-4 mt-3 mb-2">
          <button onClick={()=>setShowFinished(v=>!v)}
            style={{width:'100%',display:'flex',alignItems:'center',justifyContent:'space-between',padding:'10px 14px',background:'var(--glass)',border:'1px solid var(--border2)',borderRadius:14,backdropFilter:'blur(16px)',cursor:'pointer',color:'var(--muted)'}}>
            <span style={{fontSize:12,fontWeight:700,fontFamily:'Space Grotesk',letterSpacing:.3}}>
              {lang==='ar'?`المنتهية (${finished.length})`:`Finished (${finished.length})`}
            </span>
            <span style={{fontSize:9,display:'inline-block',transform:showFinished?'rotate(180deg)':'none',transition:'transform .2s'}}>▼</span>
          </button>
          {showFinished&&renderGroups(finishedGroups)}
        </div>
      )}
    </div>
  );
}

// ── My Bets Tab ───────────────────────────────────────────────────────────────
function MyBetsTab({matches,predictions,builders,lang,onCancelBuilder}){
  const T=TX[lang];
  const matchMap={};matches.forEach(m=>matchMap[m.id]=m);
  const preds=[...(predictions||[])].sort((a,b)=>{
    const ma=matchMap[a.match_id],mb=matchMap[b.match_id];
    if(!ma||!mb) return 0;
    return new Date(ma.kickoff)-new Date(mb.kickoff);
  });
  const settled=preds.filter(p=>p.settled),pending=preds.filter(p=>!p.settled);
  const totalWon=settled.reduce((s,p)=>s+(parseFloat(p.payout)||0),0);
  const totalStaked=settled.reduce((s,p)=>s+parseFloat(p.stake),0);
  const wins=settled.filter(p=>p.payout>0).length;
  const pl=totalWon-totalStaked;
  const bldrs=[...(builders||[])].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  const bldrPending=bldrs.filter(b=>!b.settled);
  const bldrSettled=bldrs.filter(b=>b.settled);
  function bldrLegLabel(pred,m){
    if(pred==='1') return m?.home_team||'Home';
    if(pred==='X') return lang==='ar'?'تعادل':'Draw';
    if(pred==='2') return m?.away_team||'Away';
    if(pred==='1X') return (m?.home_team||'Home')+'/Draw';
    if(pred==='X2') return 'Draw/'+(m?.away_team||'Away');
    if(pred==='BTTS-Y') return 'BTTS Yes';
    if(pred==='BTTS-N') return 'BTTS No';
    if(pred==='OVER2.5') return 'Over 2.5';
    if(pred==='UNDER2.5') return 'Under 2.5';
    if(pred==='DNB1') return 'DNB '+(m?.home_team||'Home');
    if(pred==='DNB2') return 'DNB '+(m?.away_team||'Away');
    if(pred==='QUALIFY1') return (m?.home_team||'Home')+' to Qualify';
    if(pred==='QUALIFY2') return (m?.away_team||'Away')+' to Qualify';
    if(pred.startsWith('ANYTIME:')) return pred.slice(8);
    if(pred.startsWith('FIRST:')) return '1st: '+pred.slice(6);
    return pred;
  }
  function legResultColor(r){
    if(r==='won') return 'var(--green)';
    if(r==='lost') return 'var(--red)';
    if(r==='refund') return 'var(--gold)';
    return 'var(--muted)';
  }

  const [showSettled,setShowSettled]=useState(false);

  return(
    <div className="pb-32 px-4 pt-3">
      {/* Stats */}
      {settled.length>0&&(
        <div className="grid grid-cols-3 gap-2 mb-4">
          {[
            {label:T.matches,val:preds.length,c:'var(--text)'},
            {label:T.wins,val:wins,c:'var(--green)'},
            {label:T.profitLoss,val:`$${pl.toFixed(1)}`,c:pl>=0?'var(--green)':'var(--red)'},
          ].map(s=>(
            <div key={s.label} className="rounded-2xl text-center py-4" style={{background:'var(--glass)',border:'1px solid var(--border2)',backdropFilter:'blur(16px)'}}>
              <div className="mono" style={{fontSize:22,fontWeight:700,color:s.c,letterSpacing:-1}}>{s.val}</div>
              <div style={{fontSize:10,color:'var(--muted)',marginTop:2,fontWeight:600}}>{s.label}</div>
            </div>
          ))}
        </div>
      )}
      {pending.length>0&&(
        <>
          <div className="section-date mt-2 mb-3">{T.pending} · {pending.length}</div>
          {pending.map(p=>{
            const m=matchMap[p.match_id];if(!m)return null;
            const h=parseFloat(m.home_odds),d=parseFloat(m.draw_odds),a=parseFloat(m.away_odds);
            const odds=parseFloat(p.odds_locked)||({'1':h,'X':d,'2':a,'1X':(h*d)/(h+d),'X2':(d*a)/(d+a)}[p.prediction]||h);
            const pickTeam=p.prediction==='1'?m.home_team:p.prediction==='2'?m.away_team:p.prediction==='DNB1'?m.home_team:p.prediction==='DNB2'?m.away_team:null;
            const pickLabel=p.prediction==='X'?T.pickX:p.prediction==='1X'?(m.home_team+'/X'):p.prediction==='X2'?('X/'+m.away_team):p.prediction==='BTTS-Y'?'BTTS Yes':p.prediction==='BTTS-N'?'BTTS No':p.prediction==='OVER2.5'?'Over 2.5':p.prediction==='UNDER2.5'?'Under 2.5':p.prediction==='DNB1'?('DNB '+m.home_team):p.prediction==='DNB2'?('DNB '+m.away_team):p.prediction.startsWith('ANYTIME:')?p.prediction.slice(8):p.prediction.startsWith('FIRST:')?('1st: '+p.prediction.slice(6)):pickTeam;
            return(
              <div key={p.id} className="match-card mb-2 px-4 py-3" style={{direction:'ltr'}}>
                <div className="flex items-center gap-3">
                  <div className="flex items-center gap-1 shrink-0">
                    <Flag team={m.home_team} size={22}/><span style={{fontSize:9,color:'var(--muted)',padding:'0 2px',fontFamily:'Space Grotesk'}}>v</span><Flag team={m.away_team} size={22}/>
                  </div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:12,fontWeight:700,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{m.home_team} vs {m.away_team}</div>
                    <div className="mono" style={{fontSize:10,color:'var(--muted)'}}>{new Date(m.kickoff).toLocaleDateString('en-GB',{month:'short',day:'numeric',timeZone:'Asia/Muscat'})} · {new Date(m.kickoff).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Muscat'})}</div>
                  </div>
                  <div className="flex items-center gap-2 shrink-0">
                    {pickTeam&&<Flag team={pickTeam} size={18}/>}
                    <div>
                      <div style={{fontSize:11,fontWeight:800,color:'var(--gold)',textAlign:'right'}}>{pickLabel}</div>
                      <div className="mono" style={{fontSize:10,color:'var(--muted)',textAlign:'right'}}>{odds.toFixed(2)}×</div>
                    </div>
                  </div>
                </div>
              </div>
            );
          })}
        </>
      )}
      {settled.length>0&&(
        <>
          <button onClick={()=>setShowSettled(s=>!s)} style={{width:'100%',display:'flex',alignItems:'center',justifyContent:'space-between',marginTop:20,marginBottom:showSettled?12:0,background:'transparent',border:'none',padding:0,cursor:'pointer'}}>
            <div className="section-date" style={{margin:0}}>{T.settled} · {settled.length}</div>
            <span style={{fontSize:9,fontFamily:'Space Grotesk',fontWeight:700,color:'var(--muted)',display:'inline-block',transform:showSettled?'rotate(180deg)':'none',transition:'transform .2s'}}>▼</span>
          </button>
          {showSettled&&settled.map(p=>{
            const m=matchMap[p.match_id];if(!m)return null;
            const won=p.payout>0;
            const pickTeam=p.prediction==='1'?m.home_team:p.prediction==='2'?m.away_team:p.prediction==='DNB1'?m.home_team:p.prediction==='DNB2'?m.away_team:null;
            const pickLabel=p.prediction==='X'?T.pickX:p.prediction==='1X'?(m.home_team+'/X'):p.prediction==='X2'?('X/'+m.away_team):p.prediction==='BTTS-Y'?'BTTS Yes':p.prediction==='BTTS-N'?'BTTS No':p.prediction==='OVER2.5'?'Over 2.5':p.prediction==='UNDER2.5'?'Under 2.5':p.prediction==='DNB1'?('DNB '+m.home_team):p.prediction==='DNB2'?('DNB '+m.away_team):p.prediction==='QUALIFY1'?(m.home_team+' ✓'):p.prediction==='QUALIFY2'?(m.away_team+' ✓'):p.prediction.startsWith('ANYTIME:')?p.prediction.slice(8):p.prediction.startsWith('FIRST:')?('1st: '+p.prediction.slice(6)):pickTeam;
            return(
              <div key={p.id} className="match-card mb-2 px-4 py-3" style={{direction:'ltr',borderColor:won?'rgba(0,201,123,0.15)':'rgba(255,54,81,0.1)'}}>

                  </div>
                </div>
              </div>
            );

        </>
      )}

      {bldrPending.length>0&&(

                  <div className="flex items-center gap-1 shrink-0">

                  </div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:12,fontWeight:700,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{m?.home_team||b.match_id} vs {m?.away_team||''}</div>
                    <div className="mono" style={{fontSize:10,color:'var(--muted)'}}>{m&&new Date(m.kickoff).toLocaleDateString('en-GB',{month:'short',day:'numeric',timeZone:'Asia/Muscat'})+' · '+new Date(m.kickoff).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Muscat'})}</div>

// ── Leaderboard ───────────────────────────────────────────────────────────────
function LeaderboardTab({leaderboard,currentPlayer,lang}){
  const T=TX[lang];
  const [expandedId,setExpandedId]=useState(null);
  const [betsCache,setBetsCache]=useState({});
  const [loadingId,setLoadingId]=useState(null);
  const [expandedBuilders,setExpandedBuilders]=useState(new Set());
  const podiumColors=[
    {rank:'#F2C14E',bg:'rgba(242,193,78,0.06)',border:'rgba(242,193,78,0.2)',num:'var(--gold)'},
    {rank:'#C0C0C0',bg:'rgba(192,192,192,0.05)',border:'rgba(192,192,192,0.15)',num:'#C0C0C0'},
    {rank:'#CD7F32',bg:'rgba(205,127,50,0.05)',border:'rgba(205,127,50,0.15)',num:'#CD7F32'},
  ];
  async function togglePlayer(id){
    if(expandedId===id){setExpandedId(null);return;}
    setExpandedId(id);
    if(!betsCache[id]){
      setLoadingId(id);
      try{const data=await apiFetch(`/wc/player/${id}/bets`);setBetsCache(c=>({...c,[id]:data}));}
      catch(e){setBetsCache(c=>({...c,[id]:{predictions:[],builders:[]}}))}
      setLoadingId(null);
    }
  }
  function toggleBuilder(bid){
    setExpandedBuilders(prev=>{const n=new Set(prev);n.has(bid)?n.delete(bid):n.add(bid);return n;});
  }
  function fmtPick(pred,m){
    if(pred==='1') return m.home_team;
    if(pred==='2') return m.away_team;
    if(pred==='X') return lang==='ar'?'تعادل':'Draw';
    if(pred==='1X') return m.home_team+'/'+(lang==='ar'?'تعادل':'X');
    if(pred==='X2') return (lang==='ar'?'تعادل':'X')+'/'+m.away_team;
    if(pred==='BTTS-Y') return 'BTTS Yes';
    if(pred==='BTTS-N') return 'BTTS No';
    if(pred==='OVER2.5') return 'Over 2.5';
    if(pred==='UNDER2.5') return 'Under 2.5';
    if(pred==='QUALIFY1') return (m.home_team||'Home')+' to Qualify';
    if(pred==='QUALIFY2') return (m.away_team||'Away')+' to Qualify';
    if(pred.startsWith('ANYTIME:')) return pred.slice(8);
    if(pred.startsWith('FIRST:')) return '1st: '+pred.slice(6);
    if(pred==='CORNERS-OVER') return `Over ${parseFloat(m.corners_line)||'?'} Corners`;
    if(pred==='CORNERS-UNDER') return `Under ${parseFloat(m.corners_line)||'?'} Corners`;
    if(pred==='CARDS-OVER') return `Over ${parseFloat(m.cards_line)||'?'} Cards`;
    if(pred==='CARDS-UNDER') return `Under ${parseFloat(m.cards_line)||'?'} Cards`;
    if(pred==='BTTS-CARD-Y') return 'Both Carded';
    if(pred==='BTTS-CARD-N') return 'Not Both Carded';
    if(pred==='FIRSTCORNER-1') return (m.home_team||'Home')+' 1st Corner';
    if(pred==='FIRSTCORNER-2') return (m.away_team||'Away')+' 1st Corner';
    return pred;
  }
  function legColor(res){
    if(res==='won') return {c:'var(--green)',bg:'rgba(0,201,123,0.08)',brd:'rgba(0,201,123,0.2)'};
    if(res==='lost') return {c:'var(--red)',bg:'rgba(255,54,81,0.07)',brd:'rgba(255,54,81,0.15)'};
    if(res==='refund') return {c:'var(--gold)',bg:'rgba(242,193,78,0.08)',brd:'rgba(242,193,78,0.2)'};
    return {c:'var(--or)',bg:'rgba(255,114,64,0.06)',brd:'rgba(255,114,64,0.18)'};
  }
  return(
    <div className="pb-32 px-4 pt-3">
      <div className="section-date mb-4">{T.rank}</div>
      {leaderboard.map((p,i)=>{
        const isMe=currentPlayer&&p.id===currentPlayer.id;
        const style=i<3?podiumColors[i]:null;
        const winnings=parseFloat(p.winnings||0);
        const profitColor=winnings>0?'var(--green)':'var(--muted)';
        const profitStr=winnings>0?'+$'+winnings.toFixed(0):'$0';
        const isExp=expandedId===p.id;
        const bets=betsCache[p.id];
        const koPreds=bets?.predictions||[];
        const builders=bets?.builders||[];
        return(
          <div key={p.id} className="match-card mb-2 overflow-hidden"
            style={{borderColor:style?.border||'var(--border2)',background:style?.bg||'var(--glass)',backdropFilter:'blur(16px)'}}>
            {/* ── Main row ── */}
            <div className="px-4 py-3.5 relative" style={{cursor:'pointer'}} onClick={()=>togglePlayer(p.id)}>
              <div className="mono" style={{position:'absolute',right:lang==='ar'?'auto':'12px',left:lang==='ar'?'12px':'auto',top:'50%',transform:'translateY(-50%)',fontSize:64,fontWeight:900,color:style?style.rank:'rgba(255,255,255,0.03)',lineHeight:1,pointerEvents:'none',letterSpacing:-4,userSelect:'none'}}>{i+1}</div>
              <div className="flex items-center gap-3 relative z-10">
                <div className="mono shrink-0 text-center" style={{width:28,fontSize:i<3?20:14,fontWeight:900,color:style?.num||'var(--muted)'}}>
                  {i===0?'#1':i===1?'#2':i===2?'#3':`${i+1}`}
                </div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontWeight:700,fontSize:14,display:'flex',alignItems:'center',gap:6}}>
                    {p.name}
                    {isMe&&<span style={{fontSize:9,fontWeight:800,color:'var(--gold)',background:'rgba(242,193,78,0.12)',border:'1px solid rgba(242,193,78,0.2)',borderRadius:999,padding:'1px 7px',fontFamily:'Space Grotesk',letterSpacing:.5}}>{T.youLabel}</span>}
                  </div>
                  <div className="mono" style={{fontSize:10,color:'var(--muted)',marginTop:1}}>{p.wins} {T.predWin} / {p.played||0} {T.predPlayed} · {p.total||0} {T.predTotal}</div>
                </div>
                <div className="text-right shrink-0" style={{display:'flex',alignItems:'center',gap:6}}>
                  <div>
                    <div className="mono" style={{fontSize:22,fontWeight:700,color:profitColor,letterSpacing:-1}}>{profitStr}</div>
                    <div className="mono" style={{fontSize:11,color:'var(--muted)',marginTop:2}}>${parseFloat(p.balance).toFixed(0)} {T.balance}</div>
                  </div>
                  <div style={{fontSize:9,color:'var(--muted)',display:'inline-block',transform:isExp?'rotate(180deg)':'none',transition:'transform .2s',marginBottom:isExp?0:2}}>▼</div>
                </div>
              </div>
            </div>
            {/* ── Expanded section ── */}
            {isExp&&(
              <div style={{borderTop:'1px solid var(--border2)',padding:'8px 16px 12px',direction:'ltr'}}>
                {loadingId===p.id&&<div style={{textAlign:'center',color:'var(--muted)',fontSize:11,padding:'8px 0'}}>···</div>}
                {!loadingId&&bets&&koPreds.length===0&&builders.length===0&&(
                  <div style={{textAlign:'center',color:'var(--muted)',fontSize:11,padding:'8px 0'}}>
                    {lang==='ar'?'لا رهانات في أدوار الحذف':'No KO bets yet'}
                  </div>
                )}
                {/* KO predictions */}
                {koPreds.length>0&&(
                  <div style={{marginBottom:builders.length?10:0}}>
                    <div style={{fontSize:9,color:'var(--muted)',fontFamily:'Space Grotesk',fontWeight:800,letterSpacing:.6,textTransform:'uppercase',marginBottom:5}}>
                      {lang==='ar'?'رهانات أدوار الحذف':'KO Bets'}
                    </div>
                    {koPreds.map(pr=>{
                      const won=pr.settled&&parseFloat(pr.payout)>parseFloat(pr.stake);
                      const lost=pr.settled&&parseFloat(pr.payout)===0;
                      const icon=!pr.settled?'·':won?'✓':'✗';
                      const iconColor=!pr.settled?'var(--gold)':won?'var(--green)':'var(--red)';
                      const payStr=won?`+$${(parseFloat(pr.payout)-parseFloat(pr.stake)).toFixed(0)}`:lost?`-$${parseFloat(pr.stake).toFixed(0)}`:'';
                      return(
                        <div key={pr.id} style={{display:'flex',alignItems:'center',gap:8,padding:'5px 0',borderBottom:'1px solid rgba(255,255,255,0.04)'}}>
                          <div style={{fontSize:12,color:iconColor,fontWeight:700,width:14,flexShrink:0,textAlign:'center'}}>{icon}</div>
                          <div style={{flex:1,minWidth:0}}>
                            <div style={{fontSize:11,color:'var(--text)',fontWeight:600,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{pr.home_team} – {pr.away_team}</div>
                            <div style={{fontSize:10,color:'var(--muted)'}}>{fmtPick(pr.prediction,pr)}{pr.result?` · ${pr.home_score}–${pr.away_score}`:''}</div>
                          </div>
                          {payStr&&<div className="mono" style={{fontSize:11,fontWeight:700,color:won?'var(--green)':'var(--muted)',flexShrink:0}}>{payStr}</div>}
                        </div>
                      );
                    })}
                  </div>
                )}
                {/* Builders */}
                {builders.length>0&&(
                  <div>
                    <div style={{fontSize:9,color:'var(--muted)',fontFamily:'Space Grotesk',fontWeight:800,letterSpacing:.6,textTransform:'uppercase',marginBottom:5}}>
                      {lang==='ar'?'الرهانات المركبة':'Builders'}
                    </div>
                    {builders.map(b=>{
                      const bWon=b.settled&&parseFloat(b.payout)>parseFloat(b.stake);
                      const bLost=b.settled&&parseFloat(b.payout)===0;
                      const bPush=b.settled&&parseFloat(b.payout)>0&&parseFloat(b.payout)<=parseFloat(b.stake)*1.001;
                      const bc=!b.settled?'var(--or)':bWon?'var(--green)':bLost?'var(--red)':'var(--gold)';
                      const bbg=!b.settled?'rgba(255,114,64,0.05)':bWon?'rgba(0,201,123,0.05)':bLost?'rgba(255,54,81,0.04)':'rgba(242,193,78,0.04)';
                      const bbrd=!b.settled?'rgba(255,114,64,0.18)':bWon?'rgba(0,201,123,0.18)':bLost?'rgba(255,54,81,0.13)':'rgba(242,193,78,0.18)';
                      const bPay=bWon?`+$${(parseFloat(b.payout)-parseFloat(b.stake)).toFixed(0)}`:bLost?`-$${parseFloat(b.stake).toFixed(0)}`:bPush?'PUSH':'';
                      const isExpB=expandedBuilders.has(b.id);
                      return(
                        <div key={b.id} onClick={()=>toggleBuilder(b.id)}
                          style={{cursor:'pointer',padding:'7px 8px',borderRadius:9,marginBottom:5,border:`1px solid ${bbrd}`,background:bbg,transition:'all .1s'}}>
                          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:6}}>
                            <div style={{flex:1,minWidth:0}}>
                              <div style={{fontSize:11,color:'var(--text)',fontWeight:600,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{b.home_team} – {b.away_team}</div>
                              <div style={{display:'flex',alignItems:'center',gap:5,marginTop:2}}>
                                <svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" style={{color:bc,flexShrink:0}}><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                                <span style={{fontSize:10,color:'var(--muted)',fontFamily:'Space Grotesk'}}>{(b.legs||[]).length} legs</span>
                                <span className="mono" style={{fontSize:10,color:bc,fontWeight:700}}>{parseFloat(b.combined_odds).toFixed(2)}×</span>
                                <span style={{fontSize:9,color:'var(--muted)',fontFamily:'Space Grotesk'}}>${parseFloat(b.stake).toFixed(0)}</span>
                              </div>
                            </div>
                            <div style={{display:'flex',alignItems:'center',gap:6,flexShrink:0}}>
                              {bPay&&<span className="mono" style={{fontSize:12,fontWeight:800,color:bc}}>{bPay}</span>}
                              <span style={{fontSize:8,color:'var(--muted)',transition:'transform .15s',transform:isExpB?'rotate(180deg)':'none',display:'inline-block'}}>▼</span>
                            </div>
                          </div>
                          {isExpB&&(
                            <div style={{marginTop:6,paddingTop:6,borderTop:'1px solid rgba(255,255,255,0.05)',display:'flex',flexWrap:'wrap',gap:3}} onClick={e=>e.stopPropagation()}>
                              {(b.legs||[]).map(l=>{
                                const lc=legColor(l.leg_result);
                                return(
                                  <span key={l.id} style={{fontSize:9,padding:'2px 7px',borderRadius:99,background:lc.bg,border:`1px solid ${lc.brd}`,color:lc.c,fontWeight:600,fontFamily:'Space Grotesk',display:'inline-flex',alignItems:'center',gap:2}}>
                                    {fmtPick(l.prediction,b)}
                                    <span className="mono" style={{opacity:.6,fontSize:8}}>{parseFloat(l.odds_locked).toFixed(2)}</span>
                                    {l.leg_result&&<span style={{fontSize:7}}>{l.leg_result==='won'?'✓':l.leg_result==='lost'?'✗':l.leg_result==='refund'?'↩':'·'}</span>}
                                  </span>
                                );
                              })}
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            )}
          </div>
        );
      })}
      {leaderboard.length===0&&(
        <div className="flex flex-col items-center justify-center py-24" style={{color:'var(--muted)'}}>
          <IconTrophy size={44} color="var(--muted)"/>
          <div className="mt-3 font-bold">{T.noPlayers}</div>
        </div>
      )}
    </div>
  );
}

// ── Admin Panel ───────────────────────────────────────────────────────────────
function AdminPanel({matches,players,settings,onRefresh,showToast,lang,onClose}){
  const T=TX[lang];
  const [tab,setTab]=useState('results');
  const [selectedMatch,setSelectedMatch]=useState(null);
  const [hs,setHs]=useState('');const [as_,setAs]=useState('');const [qualifier,setQualifier]=useState('');
  const [saving,setSaving]=useState(false);
  const [editOdds,setEditOdds]=useState(null);
  const [oh,setOh]=useState('');const [od,setOd]=useState('');const [oa,setOa]=useState('');
  const [o1x,setO1x]=useState('');const [ox2,setOx2]=useState('');
  const [oby,setOby]=useState('');const [obn,setObn]=useState('');
  const [oov,setOov]=useState('');const [oun,setOun]=useState('');

  const [ocnline,setOcnline]=useState('');const [ocardline,setOcardline]=useState('');
  const [ocnov,setOcnov]=useState('');const [ocnun,setOcnun]=useState('');
  const [ocrdov,setOcrdov]=useState('');const [ocrdun,setOcrdun]=useState('');
  const [obtcy,setObtcy]=useState('');const [obtcn,setObtcn]=useState('');

  const [ccMatchId,setCcMatchId]=useState(null);
  const [ccCorners,setCcCorners]=useState('');const [ccCards,setCcCards]=useState('');
  const [ccFirstCorner,setCcFirstCorner]=useState('');const [ccBttsCard,setCcBttsCard]=useState(null);
  const [stakeInput,setStakeInput]=useState(settings?.stake_per_match||'100');
  const [balInput,setBalInput]=useState(settings?.starting_balance||'100');
  const [editPlayer,setEditPlayer]=useState(null);
  const [epBal,setEpBal]=useState('');const [epName,setEpName]=useState('');const [epPin,setEpPin]=useState('');
  const [filterStage,setFilterStage]=useState('group');
  const [expandedBetsId,setExpandedBetsId]=useState(null);
  const [matchBets,setMatchBets]=useState([]);
  const [betsLoading,setBetsLoading]=useState(false);
  const [goalsMatchId,setGoalsMatchId]=useState(null);
  const [goalScorers,setGoalScorers]=useState([]);
  const [goalPlayers,setGoalPlayers]=useState([]);
  const [newScorerName,setNewScorerName]=useState('');
  const [newScorerMin,setNewScorerMin]=useState('');
  const [loadingGoalPlayers,setLoadingGoalPlayers]=useState(false);
  const scorerSelectRef=useRef(null);
  const scorerKeyCounter=useRef(0);
  const [creditPlayer,setCreditPlayer]=useState(null);
  const [creditAmount,setCreditAmount]=useState('');

  async function loadBets(matchId){
    if(expandedBetsId===matchId){setExpandedBetsId(null);setMatchBets([]);return;}
    setBetsLoading(true);setExpandedBetsId(matchId);
    try{const data=await apiFetch(`/wc/admin/match/${matchId}/bets`);setMatchBets(data);}
    catch(e){showToast(e.message,'error');setExpandedBetsId(null);}
    setBetsLoading(false);
  }
  async function voidBet(pred){
    if(!confirm(T.confirmVoid))return;
    try{
      await apiFetch(`/wc/admin/prediction/${pred.id}`,{method:'DELETE'});
      showToast(T.toastVoided,'success');
      setMatchBets(mb=>mb.filter(b=>b.id!==pred.id));
      onRefresh();
    }catch(e){showToast(e.message,'error');}
  }

  async function submitResult(){if(!selectedMatch||hs===''||as_==='')return;setSaving(true);try{const body={matchId:selectedMatch.id,homeScore:parseInt(hs),awayScore:parseInt(as_)};if(selectedMatch.stage!=='group'&&qualifier)body.qualifier=qualifier;await apiFetch('/wc/admin/result',{method:'POST',body:JSON.stringify(body)});showToast(T.toastResult,'success');setSelectedMatch(null);setHs('');setAs('');setQualifier('');onRefresh();}catch(e){showToast(e.message,'error');}setSaving(false);}
  async function submitOdds(matchId){setSaving(true);try{await apiFetch(`/wc/admin/match/${matchId}`,{method:'PUT',body:JSON.stringify({homeOdds:parseFloat(oh)||undefined,drawOdds:parseFloat(od)||undefined,awayOdds:parseFloat(oa)||undefined,odds1X:parseFloat(o1x)||undefined,oddsX2:parseFloat(ox2)||undefined,oddsBttsYes:parseFloat(oby)||undefined,oddsBttsNo:parseFloat(obn)||undefined,oddsOver25:parseFloat(oov)||undefined,oddsUnder25:parseFloat(oun)||undefined,oddsDnbHome:parseFloat(odnbh)||undefined,oddsDnbAway:parseFloat(odnba)||undefined,cornersLine:parseFloat(ocnline)||undefined,cardsLine:parseFloat(ocardline)||undefined,oddsCornersOver:parseFloat(ocnov)||undefined,oddsCornersUnder:parseFloat(ocnun)||undefined,oddsCardsOver:parseFloat(ocrdov)||undefined,oddsCardsUnder:parseFloat(ocrdun)||undefined,oddsBttsCardYes:parseFloat(obtcy)||undefined,oddsBttsCardNo:parseFloat(obtcn)||undefined,oddsFirstcornerHome:parseFloat(ofch)||undefined,oddsFirstcornerAway:parseFloat(ofca)||undefined})});showToast(T.toastOdds,'success');setEditOdds(null);onRefresh();}catch(e){showToast(e.message,'error');}setSaving(false);}
  async function submitCornCards(matchId){
    if(!ccCorners&&!ccCards&&!ccFirstCorner&&ccBttsCard===null)return;
    setSaving(true);
    try{
      const body={};
      if(ccCorners!=='')body.totalCorners=parseInt(ccCorners);
      if(ccCards!=='')body.totalCards=parseInt(ccCards);
      if(ccFirstCorner)body.firstCorner=ccFirstCorner;
      if(ccBttsCard!==null)body.bttsCard=ccBttsCard;
      const d=await apiFetch(`/wc/admin/match/${matchId}/corncards`,{method:'POST',body:JSON.stringify(body)});

      setCcMatchId(null);setCcCorners('');setCcCards('');setCcFirstCorner('');setCcBttsCard(null);

    setSaving(false);
  }
  async function saveSettings(){setSaving(true);try{await apiFetch('/wc/admin/settings',{method:'PUT',body:JSON.stringify({stake_per_match:stakeInput,starting_balance:balInput})});showToast(T.toastSettings,'success');}catch(e){showToast(e.message,'error');}setSaving(false);}
  async function savePlayer(){if(!editPlayer)return;setSaving(true);try{await apiFetch(`/wc/admin/player/${editPlayer.id}`,{method:'PUT',body:JSON.stringify({balance:parseFloat(epBal),name:epName||undefined})});showToast(T.toastPlayer,'success');setEditPlayer(null);onRefresh();}catch(e){showToast(e.message,'error');}setSaving(false);}
  async function deletePlayer(p){if(!confirm(`${T.confirmDelete} ${p.name}?`))return;try{await apiFetch(`/wc/admin/player/${p.id}`,{method:'DELETE'});showToast(T.toastDeleted,'success');onRefresh();}catch(e){showToast(e.message,'error');}}
  async function undoResult(matchId){if(!confirm(T.confirmUndo))return;try{await apiFetch(`/wc/admin/result/${matchId}`,{method:'DELETE'});showToast(T.toastUndo,'success');onRefresh();}catch(e){showToast(e.message,'error');}}
  async function openGoals(matchId){
    if(goalsMatchId===matchId){setGoalsMatchId(null);return;}
    const isSwitch=goalsMatchId!==null&&goalsMatchId!==matchId;
    setGoalsMatchId(matchId);
    if(isSwitch){setGoalScorers([]);setNewScorerName('');setNewScorerMin('');}
    setLoadingGoalPlayers(true);
    try{const data=await apiFetch(`/wc/matches/${matchId}/players`);
    const seen=new Set();
    setGoalPlayers(data.filter(p=>{if(p.market!=='anytime'||seen.has(p.player_name))return false;seen.add(p.player_name);return true;}).sort((a,b)=>parseFloat(a.odds)-parseFloat(b.odds)));}
    catch(e){setGoalPlayers([]);}
    setLoadingGoalPlayers(false);
  }
  function addScorer(team){
    const name=scorerSelectRef.current?.value||newScorerName;
    if(!name)return;
    setGoalScorers(prev=>[...prev,{key:++scorerKeyCounter.current,name,team,minute:newScorerMin||''}]);
    setNewScorerName('');setNewScorerMin('');
    showToast(`✓ ${name}`,'success');
  }
  async function submitGoals(matchId,homeTeam,awayTeam){
    const goals=goalScorers.map((s,i)=>({scorer:s.name,minute:parseInt(s.minute)||50+i,team:s.team==='home'?homeTeam:awayTeam,isOwnGoal:false,isPenalty:false}));
    setSaving(true);
    try{const d=await apiFetch(`/wc/admin/match/${matchId}/goals`,{method:'POST',body:JSON.stringify({goals})});
    showToast(`⚽ Goals saved · ${d.resettled} bet(s) re-settled`,'success');
    setGoalsMatchId(null);setGoalScorers([]);onRefresh();}
    catch(e){showToast(e.message,'error');}
    setSaving(false);
  }
  async function submitCredit(){
    if(!creditPlayer||!creditAmount)return;
    const amt=parseFloat(creditAmount);
    if(isNaN(amt))return;
    setSaving(true);
    try{await apiFetch('/wc/admin/credit',{method:'POST',body:JSON.stringify({playerId:creditPlayer.id,amount:amt})});
    showToast(`${amt>=0?'+':''}$${amt.toFixed(0)} → ${creditPlayer.name}`,'success');
    setCreditPlayer(null);setCreditAmount('');onRefresh();}
    catch(e){showToast(e.message,'error');}
    setSaving(false);
  }

  const stageMatches=matches.filter(m=>m.stage===filterStage);

  return(
    <div className="fixed inset-0 z-30 admin-drawer" style={{background:'rgba(2,12,30,0.98)',maxWidth:480,margin:'0 auto',overflowY:'auto',backdropFilter:'blur(32px)'}}>
      {/* Header */}
      <div style={{background:'rgba(3,15,38,0.9)',borderBottom:'1px solid var(--border2)',position:'sticky',top:0,zIndex:10,paddingTop:'env(safe-area-inset-top,0px)',backdropFilter:'blur(20px)'}}>
        <div className="flex items-center justify-between px-4 py-3">
          <div>
            <div style={{fontSize:9,color:'var(--gold)',fontWeight:800,letterSpacing:2,fontFamily:'Space Grotesk',textTransform:'uppercase',marginBottom:2}}>Control</div>
            <div className="syne" style={{fontSize:20,fontWeight:800,color:'var(--text)'}}>{T.adminTitle}</div>
          </div>
          <button onClick={onClose} style={{background:'rgba(255,255,255,0.06)',border:'1px solid var(--border2)',borderRadius:12,width:36,height:36,display:'flex',alignItems:'center',justifyContent:'center',color:'var(--muted)'}}>
            <IconClose size={14}/>
          </button>
        </div>
        {/* Sub-tabs */}
        <div className="flex gap-1.5 px-4 pb-3 overflow-x-auto" style={{scrollbarWidth:'none'}}>
          {[['results',T.results],['odds',T.odds],['teams',T.teams],['players',T.players],['settings',T.settings]].map(([v,l])=>(
            <button key={v} className={`pill-tab shrink-0 ${tab===v?'active':''}`} onClick={()=>setTab(v)}>{l}</button>
          ))}
        </div>
        {/* Stage filter */}
        {['results','odds','teams'].includes(tab)&&(
          <div className="flex gap-1.5 px-4 pb-3 overflow-x-auto" style={{scrollbarWidth:'none',direction:'ltr'}}>
            {['group','r32','r16','qf','sf','3rd','final'].map(s=>(
              <button key={s} onClick={()=>setFilterStage(s)} style={{padding:'4px 12px',borderRadius:999,fontSize:10,fontWeight:800,border:'none',letterSpacing:.5,background:filterStage===s?'var(--gold)':' rgba(255,255,255,0.05)',color:filterStage===s?'#0A0600':'var(--muted)',flexShrink:0,fontFamily:'Space Grotesk',textTransform:'uppercase',transition:'all .15s'}}>
                {STAGE_EN[s]||s}
              </button>
            ))}
          </div>
        )}
      </div>

      <div className="pb-12">
        {tab==='results'&&(
          <div className="px-4 pt-3 space-y-2">
            {filterStage==='r32'&&stageMatches.every(m=>m.home_team==='TBD')&&(
              <div style={{padding:'14px',background:'rgba(242,193,78,0.06)',border:'1px solid rgba(242,193,78,0.25)',borderRadius:14}}>
                <div style={{fontSize:12,fontWeight:700,color:'var(--gold)',marginBottom:6,fontFamily:'Space Grotesk'}}>{lang==='ar'?'جدول الدور 32 لم يُحدَّد بعد':'R32 bracket not seeded yet'}</div>
                <div style={{fontSize:11,color:'var(--muted)',marginBottom:10,fontFamily:'Space Grotesk'}}>{lang==='ar'?'يتم توليده تلقائياً عند اكتمال جميع مباريات دور المجموعات، أو اضغط لتوليده الآن.':'Generated automatically when all group matches are settled, or seed manually now.'}</div>
                <button onClick={async()=>{setSaving(true);try{const d=await apiFetch('/wc/admin/seed-r32',{method:'POST'});showToast(lang==='ar'?`تم توليد ${d.seeded.length} مباراة`:`Seeded ${d.seeded.length} R32 matches`,'success');onRefresh();}catch(e){showToast(e.message,'error');}setSaving(false);}}
                  disabled={saving}
                  style={{background:'var(--gold)',color:'#0A0600',border:'none',borderRadius:10,padding:'8px 18px',fontWeight:900,fontSize:12,fontFamily:'Space Grotesk',cursor:'pointer'}}>
                  {saving?'…':lang==='ar'?'توليد الدور 32':'Seed R32'}
                </button>
              </div>
            )}
            {filterStage==='r32'&&stageMatches.some(m=>m.home_team!=='TBD')&&stageMatches.some(m=>m.home_team==='TBD')&&(
              <div style={{padding:'10px 14px',background:'rgba(255,255,255,0.03)',border:'1px solid var(--border)',borderRadius:10,fontSize:11,color:'var(--muted)',fontFamily:'Space Grotesk'}}>
                {lang==='ar'?'⚠ بعض مباريات دور 32 لم تُحدَّد بعد':'⚠ Some R32 slots still TBD'}
              </div>
            )}
            {stageMatches.map(m=>(
              <div key={m.id} className="match-card p-3">
                <div className="flex items-center justify-between gap-2">
                  <div className="flex items-center gap-2 flex-1 min-w-0" style={{direction:'ltr'}}>
                    <Flag team={m.home_team} size={18}/>
                    <span style={{fontSize:12,fontWeight:700,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',flex:1}}>{m.home_team} vs {m.away_team}</span>
                    <Flag team={m.away_team} size={18}/>
                  </div>
                  <div className="flex items-center gap-2 shrink-0">
                    {m.settled&&<span className="score-display" style={{fontSize:15}}>{m.home_score}–{m.away_score}</span>}
                    {m.settled&&<button onClick={()=>undoResult(m.id)} style={{fontSize:10,color:'var(--muted)',background:'rgba(255,255,255,0.05)',border:'1px solid var(--border2)',borderRadius:8,padding:'3px 8px'}}>{T.undoBtn}</button>}
                    {!m.settled&&<button onClick={()=>{setSelectedMatch(m===selectedMatch?null:m);setHs('');setAs('');setQualifier('');}} style={{fontSize:10,background:selectedMatch?.id===m.id?'rgba(255,255,255,0.06)':'var(--gold)',color:selectedMatch?.id===m.id?'var(--muted)':'#0A0600',border:'none',borderRadius:10,padding:'5px 12px',fontWeight:800,fontFamily:'Space Grotesk'}}>{selectedMatch?.id===m.id?T.cancelEdit:T.enterResult}</button>}
                  </div>
                </div>
                {/* Bets + Goals buttons */}
                <div className="mt-2 flex items-center gap-2">
                  <button onClick={()=>loadBets(m.id)} style={{fontSize:10,color:expandedBetsId===m.id?'var(--gold)':'var(--muted)',background:expandedBetsId===m.id?'rgba(242,193,78,0.1)':'rgba(255,255,255,0.04)',border:`1px solid ${expandedBetsId===m.id?'rgba(242,193,78,0.3)':'var(--border)'}`,borderRadius:8,padding:'3px 10px',fontFamily:'Space Grotesk',fontWeight:700}}>
                    {T.betsBtn} {expandedBetsId===m.id&&!betsLoading?`(${matchBets.length})`:''}
                  </button>
                  <button onClick={()=>openGoals(m.id)}
                    style={{fontSize:10,color:goalsMatchId===m.id?'var(--green)':'var(--muted)',background:goalsMatchId===m.id?'rgba(0,201,123,0.1)':'rgba(255,255,255,0.04)',border:`1px solid ${goalsMatchId===m.id?'rgba(0,201,123,0.3)':'var(--border)'}`,borderRadius:8,padding:'3px 10px',fontFamily:'Space Grotesk',fontWeight:700}}>
                    ⚽ Goals
                  </button>
                  {m.stage==='r16'&&(
                    <button type="button" onClick={()=>{setCcMatchId(ccMatchId===m.id?null:m.id);if(ccMatchId!==m.id){setCcCorners('');setCcCards('');setCcFirstCorner('');setCcBttsCard(null);}}}
                      style={{fontSize:10,color:ccMatchId===m.id?'var(--blue)':'var(--muted)',background:ccMatchId===m.id?'rgba(74,158,255,0.1)':'rgba(255,255,255,0.04)',border:`1px solid ${ccMatchId===m.id?'rgba(74,158,255,0.3)':'var(--border)'}`,borderRadius:8,padding:'3px 10px',fontFamily:'Space Grotesk',fontWeight:700}}>
                      📐 C&amp;C
                    </button>
                  )}
                </div>
                {ccMatchId===m.id&&(
                  <div className="mt-2" style={{direction:'ltr',background:'rgba(74,158,255,0.04)',border:'1px solid rgba(74,158,255,0.12)',borderRadius:10,padding:'10px'}}>
                    <div style={{fontSize:10,color:'var(--blue)',fontFamily:'Space Grotesk',fontWeight:800,marginBottom:8}}>📐 Corners &amp; Cards Result</div>
                    <div className="flex gap-2 mb-3">
                      <div style={{flex:1}}>
                        <div style={{fontSize:9,color:'var(--muted)',fontFamily:'Space Grotesk',marginBottom:3}}>Total Corners</div>
                        <input type="number" min="0" max="30" value={ccCorners} onChange={e=>setCcCorners(e.target.value)} placeholder="0"
                          style={{width:'100%',boxSizing:'border-box',padding:'6px 8px',borderRadius:8,border:'1px solid var(--border2)',background:'var(--glass)',color:'var(--text)',fontSize:13,fontFamily:'Space Grotesk',fontWeight:700,outline:'none',textAlign:'center'}}/>
                      </div>
                      <div style={{flex:1}}>
                        <div style={{fontSize:9,color:'var(--muted)',fontFamily:'Space Grotesk',marginBottom:3}}>Total Cards</div>
                        <input type="number" min="0" max="20" value={ccCards} onChange={e=>setCcCards(e.target.value)} placeholder="0"
                          style={{width:'100%',boxSizing:'border-box',padding:'6px 8px',borderRadius:8,border:'1px solid var(--border2)',background:'var(--glass)',color:'var(--text)',fontSize:13,fontFamily:'Space Grotesk',fontWeight:700,outline:'none',textAlign:'center'}}/>
                      </div>
                    </div>
                    {m.odds_btts_card_yes&&(
                      <div style={{marginBottom:10}}>
                        <div style={{fontSize:9,color:'var(--muted)',fontFamily:'Space Grotesk',marginBottom:4}}>Both Teams Carded?</div>
                        <div className="flex gap-2">
                          <button type="button" onClick={()=>setCcBttsCard(true)}
                            style={{flex:1,padding:'6px',borderRadius:8,border:`1px solid ${ccBttsCard===true?'rgba(255,54,81,0.4)':'var(--border2)'}`,background:ccBttsCard===true?'rgba(255,54,81,0.1)':'transparent',color:ccBttsCard===true?'var(--red)':'var(--muted)',fontFamily:'Space Grotesk',fontWeight:700,fontSize:11,cursor:'pointer'}}>Yes</button>
                          <button type="button" onClick={()=>setCcBttsCard(false)}
                            style={{flex:1,padding:'6px',borderRadius:8,border:`1px solid ${ccBttsCard===false?'rgba(0,201,123,0.4)':'var(--border2)'}`,background:ccBttsCard===false?'rgba(0,201,123,0.1)':'transparent',color:ccBttsCard===false?'var(--green)':'var(--muted)',fontFamily:'Space Grotesk',fontWeight:700,fontSize:11,cursor:'pointer'}}>No</button>
                        </div>
                      </div>
                    )}
                    {m.odds_firstcorner_home&&(
                      <div style={{marginBottom:10}}>
                        <div style={{fontSize:9,color:'var(--muted)',fontFamily:'Space Grotesk',marginBottom:4}}>First Corner</div>
                        <div className="flex gap-2">
                          <button type="button" onClick={()=>setCcFirstCorner('home')}
                            style={{flex:1,padding:'6px',borderRadius:8,border:`1px solid ${ccFirstCorner==='home'?'rgba(74,158,255,0.4)':'var(--border2)'}`,background:ccFirstCorner==='home'?'rgba(74,158,255,0.1)':'transparent',color:ccFirstCorner==='home'?'var(--blue)':'var(--muted)',fontFamily:'Space Grotesk',fontWeight:700,fontSize:10,cursor:'pointer'}}>{m.home_team}</button>
                          <button type="button" onClick={()=>setCcFirstCorner('away')}
                            style={{flex:1,padding:'6px',borderRadius:8,border:`1px solid ${ccFirstCorner==='away'?'rgba(255,114,64,0.4)':'var(--border2)'}`,background:ccFirstCorner==='away'?'rgba(255,114,64,0.1)':'transparent',color:ccFirstCorner==='away'?'var(--or)':'var(--muted)',fontFamily:'Space Grotesk',fontWeight:700,fontSize:10,cursor:'pointer'}}>{m.away_team}</button>
                        </div>
                      </div>
                    )}
                    <button type="button" onClick={()=>submitCornCards(m.id)} disabled={saving}
                      style={{width:'100%',padding:'7px',borderRadius:9,background:'var(--blue)',color:'#fff',border:'none',fontWeight:900,fontSize:12,fontFamily:'Space Grotesk',cursor:'pointer'}}>
                      {saving?'…':'Save & Re-settle'}
                    </button>
                  </div>
                )}
                {goalsMatchId===m.id&&(
                  <div className="mt-2" style={{direction:'ltr',background:'rgba(0,201,123,0.04)',border:'1px solid rgba(0,201,123,0.12)',borderRadius:10,padding:'10px'}}>
                    <div style={{fontSize:10,color:'var(--green)',fontFamily:'Space Grotesk',fontWeight:800,marginBottom:8}}>⚽ Goal Scorers</div>
                    {loadingGoalPlayers&&<div style={{fontSize:10,color:'var(--muted)',fontFamily:'Space Grotesk',padding:'8px 0',textAlign:'center'}}>Loading players…</div>}
                    {!loadingGoalPlayers&&(
                      <div>
                        <div style={{display:'flex',gap:5,flexWrap:'wrap',marginBottom:8}}>
                          <select ref={scorerSelectRef} value={newScorerName} onChange={e=>setNewScorerName(e.target.value)}
                            style={{flex:'2 1 120px',padding:'6px 8px',borderRadius:8,border:'1px solid var(--border2)',background:'var(--glass)',color:'var(--text)',fontSize:11,fontFamily:'Space Grotesk',outline:'none'}}>
                            <option value="">Select scorer…</option>
                            {goalPlayers.map(pl=><option key={pl.player_name} value={pl.player_name}>{pl.player_name} ({parseFloat(pl.odds).toFixed(1)})</option>)}
                          </select>
                          <input type="number" min="1" max="120" placeholder="Min" value={newScorerMin} onChange={e=>setNewScorerMin(e.target.value)}
                            style={{width:52,padding:'6px 5px',borderRadius:8,border:'1px solid var(--border2)',background:'var(--glass)',color:'var(--text)',fontSize:11,fontFamily:'Space Grotesk',outline:'none',textAlign:'center'}}/>
                          <button type="button" onClick={()=>addScorer('home')}
                            style={{padding:'5px 9px',borderRadius:8,border:'1px solid rgba(74,158,255,0.3)',background:'rgba(74,158,255,0.1)',color:'var(--blue)',fontSize:10,fontFamily:'Space Grotesk',fontWeight:800,cursor:'pointer',opacity:newScorerName?1:.4}}>
                            +{m.home_team.split(' ').slice(-1)[0]}
                          </button>
                          <button type="button" onClick={()=>addScorer('away')}
                            style={{padding:'5px 9px',borderRadius:8,border:'1px solid rgba(255,114,64,0.3)',background:'rgba(255,114,64,0.1)',color:'var(--or)',fontSize:10,fontFamily:'Space Grotesk',fontWeight:800,cursor:'pointer',opacity:newScorerName?1:.4}}>
                            +{m.away_team.split(' ').slice(-1)[0]}
                          </button>
                        </div>
                        {goalScorers.length===0&&<div style={{fontSize:10,color:'var(--muted)',fontFamily:'Space Grotesk',textAlign:'center',padding:'4px 0',opacity:.6}}>No scorers added yet</div>}
                        <div style={{display:'flex',flexDirection:'column',gap:4,marginBottom:goalScorers.length?8:0}}>
                          {goalScorers.map(s=>(
                            <div key={s.key} style={{display:'flex',alignItems:'center',gap:6,padding:'4px 8px',borderRadius:8,background:s.team==='home'?'rgba(74,158,255,0.08)':'rgba(255,114,64,0.08)',border:`1px solid ${s.team==='home'?'rgba(74,158,255,0.2)':'rgba(255,114,64,0.2)'}`}}>
                              <span style={{fontSize:9,fontWeight:800,color:s.team==='home'?'var(--blue)':'var(--or)',fontFamily:'Space Grotesk',minWidth:24,textTransform:'uppercase'}}>{s.team==='home'?m.home_team.split(' ').slice(-1)[0]:m.away_team.split(' ').slice(-1)[0]}</span>
                              <span style={{flex:1,fontSize:11,color:'var(--text)',fontFamily:'Space Grotesk',fontWeight:600}}>{s.name}</span>
                              <input type="number" min="1" max="120" value={s.minute} onChange={e=>setGoalScorers(prev=>prev.map(g=>g.key===s.key?{...g,minute:e.target.value}:g))}
                                placeholder="Min" style={{width:44,padding:'2px 4px',borderRadius:6,border:'1px solid var(--border2)',background:'var(--glass)',color:'var(--text)',fontSize:10,fontFamily:'Space Grotesk',textAlign:'center',outline:'none'}}/>
                              <button onClick={()=>setGoalScorers(prev=>prev.filter(g=>g.key!==s.key))} style={{background:'none',border:'none',color:'var(--red)',cursor:'pointer',fontSize:13,padding:'0 2px',lineHeight:1}}>✕</button>
                            </div>
                          ))}
                        </div>
                        <button onClick={()=>submitGoals(m.id,m.home_team,m.away_team)} disabled={saving}
                          style={{width:'100%',padding:'7px',borderRadius:9,background:'var(--green)',color:'#002916',border:'none',fontWeight:900,fontSize:12,fontFamily:'Space Grotesk',cursor:'pointer'}}>
                          {saving?'…':`Save ${goalScorers.length} scorer(s) & Re-settle`}
                        </button>
                      </div>
                    )}
                  </div>
                )}
                {expandedBetsId===m.id&&(
                  <div className="mt-2 space-y-1.5" style={{direction:'ltr'}}>
                    {betsLoading&&<div style={{fontSize:11,color:'var(--muted)',fontFamily:'Space Grotesk',padding:'6px 0'}}>Loading…</div>}
                    {!betsLoading&&matchBets.length===0&&<div style={{fontSize:11,color:'var(--muted)',fontFamily:'Space Grotesk',padding:'6px 0'}}>No bets yet</div>}
                    {!betsLoading&&matchBets.map(bet=>(
                      <div key={bet.id} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'6px 10px',background:'rgba(255,255,255,0.03)',borderRadius:8,border:'1px solid var(--border)'}}>
                        <div style={{flex:1,minWidth:0}}>
                          <span style={{fontSize:12,fontWeight:700,color:'var(--text)'}}>{bet.player_name}</span>
                          <span style={{fontSize:10,color:'var(--muted)',marginLeft:6,fontFamily:'Space Grotesk'}}>{bet.prediction}</span>
                          <span style={{fontSize:10,color:'var(--muted)',marginLeft:4,fontFamily:'Space Grotesk'}}>@ {parseFloat(bet.odds_locked).toFixed(2)}</span>
                          <span style={{fontSize:9,color:'var(--muted)',marginLeft:6,fontFamily:'Space Grotesk',opacity:.7}}>{new Date(bet.created_at).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',timeZone:'Asia/Muscat'})}</span>
                        </div>
                        <div style={{display:'flex',alignItems:'center',gap:6,flexShrink:0}}>
                          {bet.settled?(
                            <span style={{fontSize:10,fontFamily:'Space Grotesk',fontWeight:700,color:parseFloat(bet.payout)>0?'var(--green)':'var(--red)'}}>
                              {parseFloat(bet.payout)>0?`+$${(parseFloat(bet.payout)-parseFloat(bet.stake)).toFixed(0)}`:`-$${parseFloat(bet.stake).toFixed(0)}`}
                            </span>
                          ):(
                            <span style={{fontSize:10,fontFamily:'Space Grotesk',color:'var(--muted)'}}>$&nbsp;{parseFloat(bet.stake).toFixed(0)}</span>
                          )}
                          <button onClick={()=>voidBet(bet)} style={{fontSize:10,color:'var(--red)',background:'rgba(255,54,81,0.08)',border:'none',borderRadius:6,padding:'3px 8px',fontFamily:'Space Grotesk',fontWeight:700}}>{T.voidBtn}</button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
                {selectedMatch?.id===m.id&&(
                  <div className="mt-3" style={{direction:'ltr'}}>
                    <div className="flex gap-2 items-center">
                      <input className="admin-inp w-16 text-center" placeholder="0" value={hs} onChange={e=>setHs(e.target.value)} type="number" min="0"/>
                      <span style={{color:'var(--muted)',fontFamily:'Space Grotesk',fontWeight:700}}>–</span>
                      <input className="admin-inp w-16 text-center" placeholder="0" value={as_} onChange={e=>setAs(e.target.value)} type="number" min="0"/>
                      <button onClick={submitResult} disabled={saving||hs===''||as_===''} style={{background:'var(--green)',color:'#002916',border:'none',borderRadius:10,padding:'7px 14px',fontWeight:900,fontSize:12,fontFamily:'Space Grotesk'}}>{T.saveBtn}</button>
                    </div>
                    {m.stage!=='group'&&(
                      <div className="flex gap-2 mt-2 items-center">
                        <span style={{fontSize:10,color:'var(--muted)',fontFamily:'Space Grotesk',fontWeight:700,whiteSpace:'nowrap'}}>Who Qualified?</span>
                        {[['home',m.home_team],['away',m.away_team]].map(([v,label])=>(
                          <button key={v} onClick={()=>setQualifier(qualifier===v?'':v)}
                            style={{padding:'4px 10px',borderRadius:8,fontSize:10,fontWeight:800,fontFamily:'Space Grotesk',border:'1px solid',borderColor:qualifier===v?'var(--green)':'var(--border2)',background:qualifier===v?'rgba(0,201,123,0.15)':'transparent',color:qualifier===v?'var(--green)':'var(--muted)',transition:'all .15s'}}>
                            {label}
                          </button>
                        ))}
                        <span style={{fontSize:9,color:'var(--muted)',fontFamily:'Space Grotesk',opacity:.7}}>(for draw/ET/pens)</span>
                      </div>
                    )}
                  </div>
                )}
              </div>
            ))}
          </div>
        )}
        {tab==='odds'&&(
          <div className="px-4 pt-3 space-y-2">
