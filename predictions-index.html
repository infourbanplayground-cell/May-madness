// ── PIN Keypad (shared by Login + Admin unlock) ───────────────────────────────
function PinKeypad({value,onChange,onDelete,error}){
  return(
    <div>
      {/* Dots */}
      <div style={{display:'flex',justifyContent:'center',gap:14,marginBottom:28}}>
        {[0,1,2,3].map(i=>(
          <div key={i} style={{
            width:16,height:16,borderRadius:'50%',
            transition:'all .2s cubic-bezier(.16,1,.3,1)',
            background: error?'var(--red)':i<value.length?'var(--gold)':'rgba(255,255,255,0.1)',
            border:`1.5px solid ${error?'var(--red)':i<value.length?'var(--gold)':'rgba(255,255,255,0.15)'}`,
            transform: error?'scale(1.2)':'scale(1)',
            boxShadow: i<value.length&&!error?'0 0 10px rgba(242,193,78,0.45)':'none',
          }}/>
        ))}
      </div>
      {/* Keypad */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:10}}>
        {[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map((d,i)=>(
          <button key={i}
            onClick={()=>{if(d==='⌫')onDelete();else if(d!==''&&value.length<4)onChange(String(d));}}
            style={{
              padding:'15px 0',borderRadius:14,
              background:d===''?'transparent':'rgba(255,255,255,0.05)',
              border:d===''?'none':'1px solid rgba(255,255,255,0.08)',
              color:d==='⌫'?'var(--muted)':'var(--text)',
              fontSize:d==='⌫'?18:22, fontWeight:700, fontFamily:'Space Grotesk',
              transition:'all .12s',
              cursor:d===''?'default':'pointer',
              pointerEvents:d===''?'none':'all',
            }}
            onMouseDown={e=>e.currentTarget.style.transform='scale(0.92)'}
            onMouseUp={e=>e.currentTarget.style.transform='scale(1)'}
            onTouchStart={e=>e.currentTarget.style.transform='scale(0.92)'}
            onTouchEnd={e=>e.currentTarget.style.transform='scale(1)'}
          >{d}</button>
        ))}
      </div>
    </div>
  );
}

// ── Login Screen ──────────────────────────────────────────────────────────────
function LoginScreen({onLogin,lang,setLang,theme,setTheme}){
  const T=TX[lang];
  const [phone,setPhone]=useState('');
  const [name,setName]=useState('');
  const [step,setStep]=useState('phone'); // phone | name | pin
  const [setupPin,setSetupPin]=useState(false); // true = create new PIN, false = verify
  const [pinVal,setPinVal]=useState('');
  const [pinErr,setPinErr]=useState(false);
  const [loading,setLoading]=useState(false);
  const [err,setErr]=useState('');

  async function checkPhone(e){
    e.preventDefault();setErr('');
    if(!phone.trim()) return setErr(lang==='ar'?'أدخل رقم الهاتف':'Enter your phone number');
    setLoading(true);
    try{
      const res=await fetch(API+'/wc/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:phone.trim()})});
      const data=await res.json();
      if(data.needsName){setStep('name');setLoading(false);return;}
      if(data.needsPin){setSetupPin(!!data.setupPin);setStep('pin');setLoading(false);return;}
      if(!res.ok) throw new Error(data.error||'Error');
      localStorage.setItem('wc_token',data.token);localStorage.setItem('wc_player',JSON.stringify(data.player));
      onLogin(data.player,data.isAdmin);
    }catch(e){setErr(e.message);}
    setLoading(false);
  }
  async function submitName(e){
    e.preventDefault();setErr('');
    if(!name.trim()) return setErr(lang==='ar'?'أدخل اسمك':'Enter your name');
    setLoading(true);
    try{
      const res=await fetch(API+'/wc/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:phone.trim(),name:name.trim()})});
      const data=await res.json();
      if(!res.ok) throw new Error(data.error||'Error');
      if(data.needsPin){setSetupPin(true);setStep('pin');setLoading(false);return;}
      // legacy fallback — token returned immediately
      localStorage.setItem('wc_token',data.token);localStorage.setItem('wc_player',JSON.stringify(data.player));
      onLogin(data.player,data.isAdmin);
    }catch(e){setErr(e.message);}
    setLoading(false);
  }

  function handlePinDigit(d){
    const next=pinVal+d;
    setPinVal(next);setPinErr(false);
    if(next.length===4) submitPin(next);
  }
  function handlePinDelete(){setPinVal(v=>v.slice(0,-1));setPinErr(false);}

  async function submitPin(pin4){
    setLoading(true);
    try{
      const body=setupPin?{phone:phone.trim(),name:name.trim()||undefined,pin:pin4}:{phone:phone.trim(),pin:pin4};
      const res=await fetch(API+'/wc/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      const data=await res.json();
      if(!res.ok){setPinErr(true);setTimeout(()=>{setPinVal('');setPinErr(false);},700);setLoading(false);setErr(data.error||'Wrong PIN');return;}
      localStorage.setItem('wc_token',data.token);localStorage.setItem('wc_player',JSON.stringify(data.player));
      onLogin(data.player,data.isAdmin);
    }catch(e){setErr(e.message);}
    setLoading(false);
  }

  const LoginBg=()=>(
    <div style={{position:'absolute',inset:0,overflow:'hidden',pointerEvents:'none'}}>
      <div style={{position:'absolute',width:700,height:700,borderRadius:'50%',background:'radial-gradient(circle,rgba(242,193,78,0.07),transparent 70%)',top:'-15%',left:'10%',filter:'blur(40px)'}}/>
      <div style={{position:'absolute',width:600,height:600,borderRadius:'50%',background:'radial-gradient(circle,rgba(0,201,123,0.05),transparent 70%)',bottom:'-10%',right:'5%',filter:'blur(40px)'}}/>
      <div style={{position:'absolute',inset:0,backgroundImage:'radial-gradient(circle at 1px 1px,var(--bg-grid-dot) 1px,transparent 0)',backgroundSize:'36px 36px'}}/>
      <PlayerFigure theme={theme} src="/players/messi.png" side="left" height="82%" opacity={theme==='light'?0.55:0.82} glow={theme==='light'?'rgba(116,172,223,0.15)':'rgba(116,172,223,0.25)'} style={{'--delay':'-2s'}}/>
      <PlayerBadge name="Messi" num="10" code="ar" accent="#74ACDF" side="left" style={{bottom:'26%',left:'3%','--delay':'-2s'}}/>
      <PlayerFigure theme={theme} src="/players/mbappe.png" side="right" height="78%" opacity={theme==='light'?0.55:0.78} glow={theme==='light'?'rgba(0,85,180,0.18)':'rgba(0,85,180,0.28)'} style={{'--delay':'-5s'}}/>
      <PlayerBadge name="Mbappé" num="10" code="fr" accent="#4169E1" side="right" style={{bottom:'28%',right:'3%','--delay':'-5s'}}/>
      <PlayerFigure theme={theme} src="/players/vinicius.png" side="left" height="50%" opacity={theme==='light'?0.32:0.45} glow={theme==='light'?'rgba(255,223,0,0.1)':'rgba(255,223,0,0.15)'} float={false} style={{left:'0',bottom:0,zIndex:0}}/>
      <PlayerFigure theme={theme} src="/players/yamal.png" side="right" height="44%" opacity={theme==='light'?0.28:0.38} glow={theme==='light'?'rgba(170,21,27,0.08)':'rgba(170,21,27,0.12)'} float={false} style={{right:'0',bottom:0,zIndex:0}}/>
      <div style={{position:'absolute',top:'6%',right:'22%'}}>
        <div style={{animation:'starFloat 30s ease-in-out infinite','--rot':'10deg','--rot2':'7deg','--dy':'-18px'}}>
          <SoccerBall size={70} opacity={0.06}/>
        </div>
      </div>
      {theme==='dark'?<>
        <div style={{position:'absolute',inset:0,background:'radial-gradient(ellipse 55% 60% at 50% 48%, transparent 30%, rgba(2,12,30,0.6) 70%, rgba(2,12,30,0.92) 100%)'}}/>
        <div style={{position:'absolute',bottom:0,left:0,right:0,height:'38%',background:'linear-gradient(0deg,rgba(2,12,30,1) 0%,transparent 100%)'}}/>
        <div style={{position:'absolute',top:0,left:0,right:0,height:'28%',background:'linear-gradient(180deg,rgba(2,12,30,0.85) 0%,transparent 100%)'}}/>
      </>:<>
        <div style={{position:'absolute',inset:0,background:'radial-gradient(ellipse 55% 60% at 50% 48%, transparent 30%, rgba(244,240,230,0.6) 70%, rgba(244,240,230,0.92) 100%)'}}/>
        <div style={{position:'absolute',bottom:0,left:0,right:0,height:'38%',background:'linear-gradient(0deg,rgba(244,240,230,1) 0%,transparent 100%)'}}/>
        <div style={{position:'absolute',top:0,left:0,right:0,height:'28%',background:'linear-gradient(180deg,rgba(244,240,230,0.85) 0%,transparent 100%)'}}/>
      </>}
    </div>
  );

  return(
    <div className="min-h-dvh flex flex-col items-center justify-center px-5 py-12 relative overflow-hidden">
      <LoginBg/>

      {/* Lang + theme toggle */}
      <div className="flex gap-2 mb-6 login-fade items-center" style={{animationDelay:'.05s',zIndex:1}}>
        <button className={`lang-btn ${lang==='ar'?'active-lang':''}`} onClick={()=>setLang('ar')}>عربي</button>
        <button className={`lang-btn ${lang==='en'?'active-lang':''}`} onClick={()=>setLang('en')}>English</button>
        <button onClick={()=>setTheme(t=>t==='light'?'dark':'light')}
          style={{width:30,height:30,borderRadius:999,background:'rgba(255,255,255,0.04)',border:'1px solid var(--border2)',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--text2)'}}>
          {theme==='dark'?(
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
          ):(
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
          )}
        </button>
      </div>

      {/* Logo + title */}
      <div className="text-center mb-6 login-fade" style={{animationDelay:'.1s',zIndex:1}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'center',marginBottom:4}}>
          <WCLogo size={110}/>
        </div>
        <div className="syne" style={{fontSize:lang==='ar'?30:24,fontWeight:900,color:'var(--text)',lineHeight:1.1,marginTop:4}}>{T.appName}</div>
        <div style={{fontSize:12,color:'var(--muted)',marginTop:6,fontFamily:'Space Grotesk',fontWeight:500,letterSpacing:.5}}>{T.appSub}</div>
        <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:6,marginTop:12}}>
          {[['us','USA'],['ca','Canada'],['mx','Mexico']].map(([code,nm])=>(
            <div key={code} style={{display:'flex',alignItems:'center',gap:4,padding:'3px 8px',background:'rgba(255,255,255,0.04)',border:'1px solid rgba(255,255,255,0.07)',borderRadius:999}}>
              <img src={`https://flagcdn.com/w20/${code}.png`} style={{width:16,height:11,borderRadius:2,objectFit:'cover'}} alt=""/>
              <span style={{fontSize:9,fontFamily:'Space Grotesk',fontWeight:700,color:'rgba(255,255,255,0.4)',letterSpacing:.5}}>{nm}</span>
            </div>
          ))}
        </div>
      </div>

      {/* Card */}
      <div className="glass-gold rounded-3xl p-6 w-full login-fade" style={{maxWidth:380,animationDelay:'.18s',zIndex:1}}>

        {/* ── Step: phone ── */}
        {step==='phone'&&(
          <>
            <div className="syne" style={{fontWeight:800,fontSize:18,marginBottom:4,color:'var(--text)'}}>{T.enterGroup}</div>
            <div style={{fontSize:13,color:'var(--muted)',marginBottom:20,fontWeight:500}}>{T.enterPhone}</div>
            <form onSubmit={checkPhone}>
              <input className="inp" type="tel" placeholder={T.phonePlaceholder} value={phone} onChange={e=>setPhone(e.target.value)} style={{direction:'ltr',textAlign:'left',marginBottom:16}} inputMode="tel"/>
              {err&&<div style={{color:'var(--red)',fontSize:12,marginBottom:12,fontFamily:'Space Grotesk'}}>{err}</div>}
              <button type="submit" className="btn-primary" disabled={loading}>{loading?T.loading+'…':T.enterBtn+' →'}</button>
            </form>
          </>
        )}

        {/* ── Step: name (new user) ── */}
        {step==='name'&&(
          <>
            <div style={{marginBottom:16}}>
              <button onClick={()=>setStep('phone')} style={{fontSize:11,color:'var(--muted)',background:'none',border:'none',fontFamily:'Space Grotesk',fontWeight:700,padding:0,marginBottom:12,display:'flex',alignItems:'center',gap:4}}>
                ← {lang==='ar'?'رجوع':'Back'}
              </button>
              <div className="syne" style={{fontWeight:800,fontSize:18,marginBottom:4,color:'var(--text)'}}>{T.welcome}</div>
              <div style={{fontSize:13,color:'var(--muted)',fontWeight:500}}>{T.firstTime}</div>
            </div>
            <form onSubmit={submitName}>
              <input className="inp" placeholder={T.namePlaceholder} value={name} onChange={e=>setName(e.target.value)} style={{marginBottom:16}} autoFocus/>
              {err&&<div style={{color:'var(--red)',fontSize:12,marginBottom:12,fontFamily:'Space Grotesk'}}>{err}</div>}
              <button type="submit" className="btn-primary" disabled={loading||!name.trim()}>{loading?T.loading+'…':lang==='ar'?'التالي →':'Next →'}</button>
            </form>
          </>
        )}

        {/* ── Step: PIN ── */}
        {step==='pin'&&(
          <>
            <div style={{marginBottom:20}}>
              <button onClick={()=>{setStep(setupPin&&name?'name':'phone');setPinVal('');setPinErr(false);}} style={{fontSize:11,color:'var(--muted)',background:'none',border:'none',fontFamily:'Space Grotesk',fontWeight:700,padding:0,marginBottom:12,display:'flex',alignItems:'center',gap:4}}>
                ← {lang==='ar'?'رجوع':'Back'}
              </button>
              <div className="syne" style={{fontWeight:800,fontSize:16,marginBottom:4,color:'var(--text)',textAlign:'center'}}>
                {setupPin?(lang==='ar'?'اختر رمز PIN (4 أرقام)':'Create your 4-digit PIN'):(lang==='ar'?'أدخل رمز PIN':'Enter your PIN')}
              </div>
              {setupPin&&<div style={{fontSize:11,color:'var(--muted)',textAlign:'center',fontFamily:'Space Grotesk',fontWeight:500,marginTop:4}}>
                {lang==='ar'?'ستحتاجه عند الدخول من جهاز آخر':'You\'ll need this to log in from other devices'}
              </div>}
              {!setupPin&&<div style={{fontSize:11,color:'var(--muted)',textAlign:'center',fontFamily:'Space Grotesk',fontWeight:500,marginTop:4}}>
                {lang==='ar'?`مرحباً ${name||''}!`:`Welcome back!`}
              </div>}
              {err&&!pinErr&&<div style={{color:'var(--red)',fontSize:12,marginTop:8,textAlign:'center',fontFamily:'Space Grotesk'}}>{err}</div>}
            </div>
            <PinKeypad value={pinVal} onChange={handlePinDigit} onDelete={handlePinDelete} error={pinErr}/>
            {loading&&<div style={{textAlign:'center',marginTop:14,fontSize:12,color:'var(--muted)',fontFamily:'Space Grotesk'}}>{T.loading}…</div>}
          </>
        )}
      </div>
      <div style={{fontSize:11,color:'var(--muted)',marginTop:16,textAlign:'center',fontFamily:'Space Grotesk',zIndex:1}} className="login-fade">
        {T.friendly}
      </div>
    </div>
  );
}

// ── App ───────────────────────────────────────────────────────────────────────
function App(){
  const [player,setPlayer]=useState(null);
  const [isAdmin,setIsAdmin]=useState(false);
  const [loading,setLoading]=useState(true);
  const [tab,setTab]=useState('fixtures');
  const [showAdmin,setShowAdmin]=useState(false);
  const [matches,setMatches]=useState([]);
  const [predictions,setPredictions]=useState([]);
  const [leaderboard,setLeaderboard]=useState([]);
  const [adminPlayers,setAdminPlayers]=useState([]);
  const [settings,setSettings]=useState({});
  const [loadingMatch,setLoadingMatch]=useState(null);
  const [toast,setToastMsg]=useState(null);
  const [confirmPick,setConfirmPick]=useState(null);
  const [builders,setBuilders]=useState([]);
  const [lang,setLang]=useState(()=>localStorage.getItem('wc_lang')||'ar');
  const [theme,setTheme]=useState(()=>localStorage.getItem('wc_theme')||'light');
  const [logoTaps,setLogoTaps]=useState(0);
  const [showPin,setShowPin]=useState(false);
  const [pinVal,setPinVal]=useState('');
  const [pinErr,setPinErr]=useState(false);
  const tapTimer=useRef(null);
  const refreshTimer=useRef(null);
  const T=TX[lang];

  useEffect(()=>{
    const h=document.getElementById('html-root');
    h.lang=lang;h.dir=lang==='ar'?'rtl':'ltr';
    if(lang==='en') h.classList.add('en'); else h.classList.remove('en');
    localStorage.setItem('wc_lang',lang);
  },[lang]);

  useEffect(()=>{
    const h=document.getElementById('html-root');
    if(theme==='light') h.classList.add('light'); else h.classList.remove('light');
    localStorage.setItem('wc_theme',theme);
  },[theme]);

  function showToast(msg,type='success'){setToastMsg({msg,type,id:Date.now()});}

  async function loadMatches(){try{setMatches(await apiFetch('/wc/matches'));}catch(e){}}
  async function loadMe(){
    try{
      const data=await apiFetch('/wc/me');
      setPlayer(data.player);setPredictions(data.predictions||[]);setIsAdmin(data.isAdmin||false);
      localStorage.setItem('wc_player',JSON.stringify(data.player));
    }catch(e){if(e.message==='Unauthorized'){localStorage.removeItem('wc_token');localStorage.removeItem('wc_player');setPlayer(null);}}
  }
  async function loadLeaderboard(){try{setLeaderboard(await apiFetch('/wc/leaderboard'));}catch(e){}}
  async function loadSettings(){try{const st=await apiFetch('/wc/settings');setSettings(s=>({...s,...st}));}catch(e){}}
  async function loadAdminData(){try{const[pl,st]=await Promise.all([apiFetch('/wc/admin/players'),apiFetch('/wc/admin/settings')]);setAdminPlayers(pl);setSettings(st);}catch(e){}}
  async function loadBuilders(){try{setBuilders(await apiFetch('/wc/my-builders'));}catch(e){}}
  async function refresh(){
    await Promise.all([loadMatches(),loadMe(),loadLeaderboard(),loadBuilders()]);
    if(isAdmin) loadAdminData();
  }

  useEffect(()=>{
    const token=localStorage.getItem('wc_token'),cached=localStorage.getItem('wc_player');
    if(token&&cached){try{setPlayer(JSON.parse(cached));}catch(e){}}
    Promise.all([loadMatches(),token?loadMe():Promise.resolve(),loadLeaderboard(),loadSettings(),token?loadBuilders():Promise.resolve()]).finally(()=>setLoading(false));
  },[]);

  useEffect(()=>{
    refreshTimer.current=setInterval(()=>{loadMatches();loadLeaderboard();if(player)loadMe();},60000);
    return()=>clearInterval(refreshTimer.current);
  },[player]);

  useEffect(()=>{if(isAdmin&&showAdmin) loadAdminData();},[isAdmin,showAdmin]);

  function handleLogoTap(){
    clearTimeout(tapTimer.current);
    const next=logoTaps+1;
    if(next>=3){setLogoTaps(0);setShowPin(true);setPinVal('');setPinErr(false);return;}
    setLogoTaps(next);
    tapTimer.current=setTimeout(()=>setLogoTaps(0),1800);
  }
  function handlePinKey(d){
    const next=pinVal+d;
    setPinVal(next);
    setPinErr(false);
    if(next.length===4){
      if(next==='1212'){setShowPin(false);setPinVal('');setShowAdmin(true);loadAdminData();}
      else{setPinErr(true);setTimeout(()=>setPinVal(''),600);}
    }
  }

  function handlePickClick(match,pick,extraOdds=null){
    const isGroupStage=!match.stage||match.stage==='group';
    const existingPred=isGroupStage?predictions.find(p=>p.match_id===match.id&&['1','X','2','1X','X2','12'].includes(p.prediction)):null;
    setConfirmPick({match,pick,extraOdds,existingPred:existingPred?.prediction||null});
  }

  async function handleBuildClick(match,legs,stake){
    if(!player) return;
    try{
      const data=await apiFetch('/wc/bet-builder',{method:'POST',body:JSON.stringify({matchId:match.id,legs,stake})});
      setPlayer(p=>({...p,balance:data.newBalance}));
      loadBuilders();
      loadLeaderboard();
      showToast(lang==='ar'?`رهان مركب ✓ ${data.combinedOdds.toFixed(2)}×`:`Builder bet placed ✓ ${data.combinedOdds.toFixed(2)}×`,'success');
    }catch(e){showToast(e.message,'error');}
  }

  async function handleConfirm(chosenStake){
    if(!confirmPick||!player) return;
    const{match,pick,extraOdds}=confirmPick;
    const stakeAmt=parseFloat(chosenStake)||parseFloat(settings.stake_per_match||100);
    setConfirmPick(null);
    setLoadingMatch(match.id);
    try{
      const data=await apiFetch('/wc/predict',{method:'POST',body:JSON.stringify({matchId:match.id,prediction:pick,stake:stakeAmt})});
      setPlayer(p=>({...p,balance:data.newBalance}));
      const _h=parseFloat(match.home_odds),_d=parseFloat(match.draw_odds),_a=parseFloat(match.away_odds);
      const _dc={'1X':parseFloat(match.odds_1x)||(_h*_d)/(_h+_d),'X2':parseFloat(match.odds_x2)||(_d*_a)/(_d+_a)};
      const _stdOdds={'1':_h,'X':_d,'2':_a,'BTTS-Y':parseFloat(match.odds_btts_yes),'BTTS-N':parseFloat(match.odds_btts_no),'OVER2.5':parseFloat(match.odds_over25),'UNDER2.5':parseFloat(match.odds_under25),'DNB1':parseFloat(match.odds_dnb_home),'DNB2':parseFloat(match.odds_dnb_away),..._dc};
      const _lockedOdds=extraOdds||_stdOdds[pick]||_h;
      const MG={'1':'1x2','X':'1x2','2':'1x2','1X':'1x2','X2':'1x2','BTTS-Y':'btts','BTTS-N':'btts','OVER2.5':'ou','UNDER2.5':'ou','DNB1':'dnb','DNB2':'dnb'};
      const pickGroup=MG[pick]||pick;
      setPredictions(prev=>[...prev.filter(p=>p.match_id!==match.id||(MG[p.prediction]||p.prediction)!==pickGroup),{match_id:match.id,prediction:pick,settled:false,stake:stakeAmt,odds_locked:_lockedOdds}]);
      const team=pick==='1'?match.home_team:pick==='2'?match.away_team:pick==='X'?T.pickX:pick==='1X'?`${match.home_team}/X`:pick==='X2'?`X/${match.away_team}`:pick.startsWith('ANYTIME:')?pick.slice(8):pick.startsWith('FIRST:')?pick.slice(6):pick;
      showToast(data.changed?`→ ${team} ✓`:`${team} ✓`,'success');
      loadLeaderboard();
    }catch(e){showToast(e.message,'error');}
    setLoadingMatch(null);
  }

  if(loading){
    return(
      <div className="min-h-dvh flex flex-col items-center justify-center gap-5">
        {/* Bg mesh */}
        <div className="bg-mesh"><div className="bg-grid"/><div className="bg-orb orb-gold"/><div className="bg-orb orb-green"/></div>
        <WCLogo size={72}/>
        <div className="flex gap-1.5">
          {[0,1,2].map(i=>(
            <div key={i} className="skeleton" style={{width:8,height:8,borderRadius:'50%',animationDelay:`${i*.15}s`}}/>
          ))}
        </div>
      </div>
    );
  }

  if(!player){
    return(
      <>
        <div className="bg-mesh"><div className="bg-grid"/><div className="bg-orb orb-gold"/><div className="bg-orb orb-green"/><div className="bg-orb orb-blue"/></div>
        <LoginScreen onLogin={(p,admin)=>{setPlayer(p);setIsAdmin(admin||false);}} lang={lang} setLang={setLang} theme={theme} setTheme={setTheme}/>
      </>
    );
  }

  const bal=parseFloat(player.balance);
  const balColor='var(--gold)';

  const navTabs=[
    {id:'fixtures',Icon:IconBall,label:T.fixtures},
    {id:'mybets',Icon:IconTarget,label:T.mybets},
    {id:'leaderboard',Icon:IconTrophy,label:T.leaderboard},
  ];

  return(
    <div style={{maxWidth:480,margin:'0 auto',minHeight:'100dvh',position:'relative'}}>
      {/* Mesh background + motifs */}
      <div className="bg-mesh">
        <div className="bg-grid"/>
        <div className="bg-orb orb-gold"/><div className="bg-orb orb-green"/><div className="bg-orb orb-blue"/>
        {/* Subtle "26" watermark */}
        <div style={{position:'absolute',top:'28%',left:'50%',transform:'translateX(-50%)',opacity:.018,pointerEvents:'none'}}>
          <Logo26SVG size={340}/>
        </div>
      </div>

      {/* ── Player figures — fixed, full-viewport, all 5 ── */}
      {(()=>{
        // Theme-aware fade colors
        const FC = theme==='light' ? '244,240,230' : '2,12,30';
        const fadeR = (s,m,e)=>`linear-gradient(to right,rgba(${FC},${s}) 0%,rgba(${FC},${m}) ${35}%,transparent ${e}%)`;
        const fadeL = (s,m,e)=>`linear-gradient(to left,rgba(${FC},${s}) 0%,rgba(${FC},${m}) ${35}%,transparent ${e}%)`;
        const fadeT = (s,m,e)=>`linear-gradient(to top,rgba(${FC},${s}) 0%,rgba(${FC},${m}) ${25}%,transparent ${e}%)`;
        const imgFilter = theme==='light' ? 'sepia(0.45) saturate(0.85) brightness(0.95) contrast(1.05)' : '';
        // Opacity tuned per theme
        const op = (light,dark)=>theme==='light'?light:dark;
        return(<>
        {/* Messi — far left, tall */}
        <div style={{position:'fixed',bottom:72,left:0,height:'46%',maxHeight:420,opacity:op(0.22,0.18),pointerEvents:'none',zIndex:0,overflow:'hidden',
          animation:'starFloat 26s ease-in-out infinite','--rot':'-2deg','--rot2':'-1deg','--dy':'-6px'}}>
          <img src="/players/messi.png" alt="" style={{height:'100%',width:'auto',objectFit:'contain',objectPosition:'bottom left',filter:imgFilter||'drop-shadow(0 0 24px rgba(116,172,223,0.4))'}}/>
          <div style={{position:'absolute',inset:0,background:fadeR(0.8,0.3,65)}}/>
          <div style={{position:'absolute',inset:0,background:fadeT(1,0.4,55)}}/>
        </div>
        {/* Mbappe — right side */}
        <div style={{position:'fixed',bottom:72,right:0,height:'44%',maxHeight:400,opacity:op(0.2,0.16),pointerEvents:'none',zIndex:0,overflow:'hidden',
          animation:'starFloat 30s ease-in-out infinite','--rot':'2deg','--rot2':'1deg','--dy':'-7px',animationDelay:'-8s'}}>
          <img src="/players/mbappe.png" alt="" style={{height:'100%',width:'auto',objectFit:'contain',objectPosition:'bottom right',filter:imgFilter||'drop-shadow(0 0 24px rgba(0,35,149,0.35))'}}/>
          <div style={{position:'absolute',inset:0,background:fadeL(0.8,0.3,65)}}/>
          <div style={{position:'absolute',inset:0,background:fadeT(1,0.4,55)}}/>
        </div>
        {/* Vinicius — left, lower */}
        <div style={{position:'fixed',bottom:72,left:0,height:'28%',maxHeight:260,opacity:op(0.13,0.1),pointerEvents:'none',zIndex:0,overflow:'hidden',animationDelay:'-14s'}}>
          <img src="/players/vinicius.png" alt="" style={{height:'100%',width:'auto',objectFit:'contain',objectPosition:'bottom left',filter:imgFilter||'drop-shadow(0 0 16px rgba(255,223,0,0.2))'}}/>
          <div style={{position:'absolute',inset:0,background:fadeR(0.9,0.5,60)}}/>
          <div style={{position:'absolute',inset:0,background:fadeT(1,0.5,45)}}/>
        </div>
        {/* Ronaldo — right */}
        <div style={{position:'fixed',bottom:72,right:0,height:'30%',maxHeight:280,opacity:op(0.15,0.12),pointerEvents:'none',zIndex:0,overflow:'hidden',
          animation:'starFloat 20s ease-in-out infinite','--rot':'3deg','--rot2':'2deg','--dy':'-5px',animationDelay:'-5s'}}>
          <img src="/players/ronaldo.png" alt="" style={{height:'100%',width:'auto',objectFit:'contain',objectPosition:'bottom right',filter:imgFilter||'drop-shadow(0 0 20px rgba(255,255,255,0.12))'}}/>
          <div style={{position:'absolute',inset:0,background:fadeL(0.85,0.3,60)}}/>
          <div style={{position:'absolute',inset:0,background:fadeT(1,0.5,45)}}/>
        </div>
        {/* Yamal — center-right */}
        <div style={{position:'fixed',bottom:72,right:'8%',height:'22%',maxHeight:200,opacity:op(0.11,0.09),pointerEvents:'none',zIndex:0,overflow:'hidden',animationDelay:'-20s'}}>
          <img src="/players/yamal.png" alt="" style={{height:'100%',width:'auto',objectFit:'contain',objectPosition:'bottom center',filter:imgFilter||'drop-shadow(0 0 12px rgba(170,21,27,0.2))'}}/>
          <div style={{position:'absolute',inset:0,background:fadeT(1,0.5,60)}}/>
          <div style={{position:'absolute',inset:0,background:`linear-gradient(to left,rgba(${FC},0.5) 0%,transparent 50%)`}}/>
        </div>
        </>);
      })()}

      {toast&&<Toast key={toast.id} msg={toast.msg} type={toast.type} onDone={()=>setToastMsg(null)}/>}
      {confirmPick&&(
        <ConfirmSheet match={confirmPick.match} pick={confirmPick.pick} extraOdds={confirmPick.extraOdds}
          defaultStake={parseFloat(settings.stake_per_match||100)} balance={player.balance} startBal={parseFloat(settings?.starting_balance||7200)}
          isKO={confirmPick.match?.stage&&confirmPick.match.stage!=='group'}
          existingPred={confirmPick.existingPred}
          onConfirm={handleConfirm} onCancel={()=>setConfirmPick(null)} lang={lang}/>
      )}
      {/* PIN entry modal */}
      {showPin&&(
        <div className="fixed inset-0 z-50" style={{background:'rgba(0,0,0,.75)',backdropFilter:'blur(12px)',display:'flex',alignItems:'center',justifyContent:'center',padding:24}} onClick={()=>{setShowPin(false);setPinVal('');}}>
          <div className="glass-gold rounded-3xl p-7 w-full" style={{maxWidth:320}} onClick={e=>e.stopPropagation()}>
            <div style={{textAlign:'center',marginBottom:24}}>
              <WCLogo size={48}/>
              <div className="syne" style={{fontSize:16,fontWeight:800,color:'var(--text)',marginTop:12}}>{lang==='ar'?'رمز الإدارة':'Admin PIN'}</div>
            </div>
            <PinKeypad
              value={pinVal}
              onChange={handlePinKey}
              onDelete={()=>{setPinVal(v=>v.slice(0,-1));setPinErr(false);}}
              error={pinErr}
            />
            <button onClick={()=>{setShowPin(false);setPinVal('');}} style={{width:'100%',marginTop:14,padding:'10px',background:'none',border:'none',color:'var(--muted)',fontSize:13,fontFamily:'inherit',fontWeight:700}}>{lang==='ar'?'إلغاء':'Cancel'}</button>
          </div>
        </div>
      )}

      {showAdmin&&(
        <AdminPanel matches={matches} players={adminPlayers} settings={settings}
          onRefresh={refresh} showToast={showToast} lang={lang} onClose={()=>setShowAdmin(false)}/>
      )}
      {/* Header */}
      <div style={{position:'sticky',top:0,zIndex:10,paddingTop:'env(safe-area-inset-top,0px)'}}>
        <div style={{background:'var(--header-bg)',backdropFilter:'blur(24px) saturate(180%)',WebkitBackdropFilter:'blur(24px) saturate(180%)',borderBottom:'1px solid var(--border2)',boxShadow:'0 1px 0 rgba(242,193,78,0.04)'}}>
          <div className="flex items-center gap-3 px-4 py-3">
            {/* Logo — tap 3× to unlock admin */}
            <div onClick={handleLogoTap} style={{cursor:'default',userSelect:'none',position:'relative'}}>
              <WCLogo size={36}/>
              {logoTaps>0&&(
                <div style={{position:'absolute',top:-4,right:-4,width:14,height:14,borderRadius:'50%',background:'var(--gold)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:8,fontWeight:900,color:'#0A0600',fontFamily:'Space Grotesk',boxShadow:'0 0 6px rgba(242,193,78,0.5)'}}>
                  {3-logoTaps}
                </div>
              )}
            </div>
            {/* Title */}
            <div style={{flex:1,minWidth:0}}>
              <div className="syne" style={{fontSize:lang==='ar'?16:13,fontWeight:800,color:'var(--text)',lineHeight:1,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{T.appName}</div>
              <div style={{fontSize:9,color:'var(--muted)',fontFamily:'Space Grotesk',fontWeight:500,letterSpacing:.5,marginTop:1}}>{T.appSub}</div>
            </div>
            {/* Right side */}
            <div className="flex items-center gap-2">
              {/* Theme */}
              <button onClick={()=>setTheme(t=>t==='light'?'dark':'light')}
                style={{width:30,height:30,borderRadius:10,background:'rgba(255,255,255,0.04)',border:'1px solid var(--border2)',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--text2)',flexShrink:0,transition:'all .15s'}}>
                {theme==='dark'?(
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <circle cx="12" cy="12" r="4"/>
                    <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
                  </svg>
                ):(
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
                  </svg>
                )}
              </button>
              {/* Lang */}
              <div className="flex gap-1">
                <button className={`lang-btn ${lang==='ar'?'active-lang':''}`} onClick={()=>setLang('ar')}>ع</button>
                <button className={`lang-btn ${lang==='en'?'active-lang':''}`} onClick={()=>setLang('en')}>EN</button>
              </div>
              {/* Balance */}
              <div className="text-right">
                <div style={{fontSize:10,color:'var(--muted)',fontWeight:600,fontFamily:'Space Grotesk'}}>{player.name}</div>
                <div className="mono bal-count" style={{fontSize:19,fontWeight:700,color:balColor,letterSpacing:-1,lineHeight:1}}>${bal.toFixed(0)}</div>
              </div>
              {/* Sign out */}
              <button onClick={()=>{localStorage.removeItem('wc_token');localStorage.removeItem('wc_player');setPlayer(null);setIsAdmin(false);setShowAdmin(false);}}
                style={{width:32,height:32,borderRadius:10,background:'rgba(255,255,255,0.04)',border:'1px solid rgba(255,255,255,0.07)',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--muted)',flexShrink:0,transition:'all .15s'}}
                onMouseEnter={e=>{e.currentTarget.style.borderColor='rgba(255,54,81,0.35)';e.currentTarget.style.color='var(--red)';}}
                onMouseLeave={e=>{e.currentTarget.style.borderColor='rgba(255,255,255,0.07)';e.currentTarget.style.color='var(--muted)';}}>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
                  <polyline points="16 17 21 12 16 7"/>
                  <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>

      {/* Content */}
      <div style={{position:'relative',zIndex:1}}>
        {tab==='fixtures'&&<FixturesTab matches={matches} predictions={predictions} builders={builders} onPickClick={handlePickClick} onBuildClick={player?handleBuildClick:null} loadingMatch={loadingMatch} settings={settings} lang={lang} playerId={player?.id}/>}
        {tab==='mybets'&&<MyBetsTab matches={matches} predictions={predictions} builders={builders} lang={lang} onCancelBuilder={async(b)=>{try{const d=await apiFetch(`/wc/bet-builder/${b.id}`,{method:'DELETE'});setPlayer(p=>({...p,balance:d.newBalance}));loadBuilders();showToast(lang==='ar'?'تم إلغاء الرهان':'Builder cancelled','success');}catch(e){showToast(e.message,'error');}}}/>}
        {tab==='leaderboard'&&<LeaderboardTab leaderboard={leaderboard} currentPlayer={player} lang={lang}/>}
      </div>

      {/* Floating pill nav */}
      <div className="float-nav">
        <div className="float-nav-pill">
          {navTabs.map(({id,Icon,label})=>(
            <button key={id} className={`nav-item ${tab===id?'active':''}`} onClick={()=>setTab(id)}>
              <Icon size={18} color="currentColor"/>
              <span style={{marginTop:1}}>{label}</span>
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
