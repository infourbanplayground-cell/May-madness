function TeamsTab({ session, state, updateSession, update, isAdmin, leaderboard }) {
  const [showAdd, setShowAdd] = useState(false);
  const [showImport, setShowImport] = useState(false);
  const [showSeedModal, setShowSeedModal] = useState(false);
  const [edit, setEdit] = useState(null);
  const teams = session.teams || [];
  const groups = getSessionGroups(session);
  const maxTeams = groups.length * 4;
  const byGroup = groups.reduce((a, g) => (a[g] = teams.filter(t => t.group === g), a), {});

  // manualSeeds: ordered array of teamIds (index 0 = seed 1)
  const manualSeeds = session.manualSeeds || null;

  const lifetimeSorted = [...(leaderboard || [])].sort((a, b) => b.lifetimePts - a.lifetimePts);
  const rankOf = (pid) => { const idx = lifetimeSorted.findIndex(e => e.player.id === pid); return idx === -1 ? 999 : idx; };
  const autoRanked = [...teams].sort((a, b) => (rankOf(a.p1Id) + rankOf(a.p2Id)) - (rankOf(b.p1Id) + rankOf(b.p2Id)));

  // Effective seed order: manual if set, else auto
  const seedOrder = manualSeeds
    ? manualSeeds.map(id => teams.find(t => t.id === id)).filter(Boolean).concat(teams.filter(t => !manualSeeds.includes(t.id)))
    : autoRanked;

  const getSeedNum = (tid) => { const i = seedOrder.findIndex(t => t.id === tid); return i < 8 ? i + 1 : null; };

  const serpentineFromOrder = (ordered, allTeams) => {
    // teams not in ordered go at end
    const sorted = [...ordered, ...allTeams.filter(t => !ordered.find(o => o.id === t.id))];
    const assign = [];
    let dir = 1, gi = 0;
    for (let i = 0; i < sorted.length; i++) {
      assign.push(groups[gi]);
      gi += dir;
      if (gi >= groups.length) { gi = groups.length - 1; dir = -1; }
      else if (gi < 0) { gi = 0; dir = 1; }
    }
    return sorted.map((t, i) => ({ ...t, group: assign[i] }));
  };

  const autoSeedGroups = () => {
    if (teams.length === 0) return;
    const seeded = serpentineFromOrder(seedOrder, teams);
    updateSession(s => ({ ...s, teams: s.teams.map(t => { const u = seeded.find(r => r.id === t.id); return u ? { ...t, group: u.group } : t; }) }));
  };

  const handleImport = (newTeams) => {
    updateSession(s => {
      const all = [...(s.teams || []), ...newTeams];
      const order = manualSeeds
        ? manualSeeds.map(id => all.find(t => t.id === id)).filter(Boolean).concat(all.filter(t => !manualSeeds.includes(t.id)))
        : [...all].sort((a, b) => (rankOf(a.p1Id) + rankOf(a.p2Id)) - (rankOf(b.p1Id) + rankOf(b.p2Id)));
      const seeded = serpentineFromOrder(order, all);
      return { ...s, teams: seeded };
    });
  };

  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between flex-wrap gap-2">
        <div><div className="text-stone-200 font-semibold">{teams.length} / {maxTeams} teams</div>{isAdmin && <div className="text-xs text-stone-500">Tap team to edit · {groups.length} groups</div>}</div>
        {isAdmin && <div className="flex gap-2 flex-wrap">
          {teams.length > 0 && <Btn size="sm" variant="secondary" onClick={() => setShowSeedModal(true)}><I.shield size={14} /> Seeds</Btn>}
          {teams.length > 0 && <Btn size="sm" variant="secondary" onClick={autoSeedGroups}><I.bolt size={14} /> Re-Seed</Btn>}
          <Btn size="sm" variant="secondary" onClick={() => setShowImport(true)}><I.users size={14} /> Import</Btn>
          <Btn size="sm" onClick={() => setShowAdd(true)} disabled={teams.length >= maxTeams}><I.plus size={14} /> Add</Btn>
        </div>}
      </div>
      {groups.map(g => (
        <Card key={g} className="p-3">
          <div className="flex items-center justify-between mb-2">
            <div className="flex items-center gap-2">
              <div style={{ width:32, height:32, display:"flex", alignItems:"center", justifyContent:"center", background:"var(--gold)", border:"3px solid var(--ink)", boxShadow:"3px 3px 0 var(--ink)", fontFamily:"'Bangers',cursive", fontSize:"20px", letterSpacing:"1px", color:"var(--ink)" }}>{g}</div>
              <span className="font-semibold text-stone-200">Group {g}</span>
            </div>
            <span className="text-xs text-stone-500 font-mono">{byGroup[g].length} / 4</span>
          </div>
          {byGroup[g].length === 0 ? <div className="text-xs text-stone-600 italic px-2 py-3 text-center border border-dashed border-stone-800 rounded-lg">Empty</div>
            : <div className="space-y-1">{byGroup[g].map(t => {
              const p1 = state.players.find(p => p.id === t.p1Id);
              const p2 = state.players.find(p => p.id === t.p2Id);
              const seed = getSeedNum(t.id);
              return <button key={t.id} onClick={() => isAdmin && setEdit(t)} className="w-full flex items-center gap-2 p-2 rounded-lg bg-stone-900/50 hover:bg-stone-800/70 text-left">
                {seed ? <span className="text-[9px] font-bold px-1.5 py-0.5 rounded font-mono shrink-0" style={{ background: seed <= 4 ? "rgba(255,94,30,.18)" : "rgba(255,255,255,.06)", color: seed <= 4 ? "var(--orange-br)" : "var(--muted2)", border: `1px solid ${seed <= 4 ? "rgba(255,94,30,.3)" : "rgba(255,255,255,.08)"}` }}>S{seed}</span> : null}
                <div className="flex-1 min-w-0"><div className="text-sm text-stone-100 truncate">{p1?.name || "?"} & {p2?.name || "?"}</div></div>
                {isAdmin && <I.edit size={12} className="text-stone-500" />}
              </button>;
            })}</div>}
        </Card>
      ))}
      {showAdd && <TeamFormModal title="ADD TEAM" state={state} session={session} groups={groups} onClose={() => setShowAdd(false)} onSave={(t) => updateSession(s => ({ ...s, teams: [...(s.teams || []), { id: uid("t"), ...t }] }))} />}
      {edit && <TeamFormModal title="EDIT TEAM" state={state} session={session} groups={groups} initial={edit} onClose={() => setEdit(null)} onSave={(t) => updateSession(s => ({ ...s, teams: s.teams.map(x => x.id === edit.id ? { ...x, ...t } : x) }))} onDelete={() => updateSession(s => ({ ...s, teams: s.teams.filter(x => x.id !== edit.id) }))} />}
      {showImport && <WhatsAppTeamImportModal onClose={() => setShowImport(false)} state={state} session={session} leaderboard={leaderboard || []} onImport={handleImport} update={update} />}
      {showSeedModal && <ManualSeedModal teams={teams} seedOrder={seedOrder} state={state} onClose={() => setShowSeedModal(false)} onSave={(order) => updateSession(s => ({ ...s, manualSeeds: order.map(t => t.id) }))} />}
    </div>
  );
}

function ManualSeedModal({ teams, seedOrder, state, onClose, onSave }) {
  const [order, setOrder] = useState([...seedOrder]);
  const lbl = (t) => {
    const p1 = state.players.find(p => p.id === t.p1Id);
    const p2 = state.players.find(p => p.id === t.p2Id);
    return `${p1?.name?.split(" ")[0] || "?"} & ${p2?.name?.split(" ")[0] || "?"}`;
  };
  const move = (i, dir) => {
    const j = i + dir;
    if (j < 0 || j >= order.length) return;
    const next = [...order];
    [next[i], next[j]] = [next[j], next[i]];
    setOrder(next);
  };
  return <Modal open={true} onClose={onClose} title="SET SEEDS">
    <div className="space-y-3">
      <div className="text-xs text-stone-400">Re-Seed distributes teams by all-time lifetime points — best players spread evenly across groups (snake order).</div>
      <div className="space-y-1 max-h-80 overflow-y-auto pr-1">
        {order.map((t, i) => (
          <div key={t.id} className="flex items-center gap-2 px-2 py-1.5 rounded-lg" style={{ background: i < 8 ? (i < 4 ? "rgba(255,94,30,.08)" : "rgba(255,255,255,.03)") : "transparent", border: `1px solid ${i < 4 ? "rgba(255,94,30,.18)" : i < 8 ? "rgba(255,255,255,.06)" : "rgba(255,255,255,.03)"}` }}>
            <span className="font-mono text-xs w-5 text-center font-bold" style={{ color: i < 4 ? "var(--orange-br)" : i < 8 ? "var(--muted)" : "var(--muted2)" }}>S{i + 1}</span>
            <span className="flex-1 text-sm text-stone-200 truncate">{lbl(t)}</span>
            <div className="flex gap-1">
              <button onClick={() => move(i, -1)} disabled={i === 0} className="w-6 h-6 rounded bg-stone-800 border border-stone-700 text-stone-400 hover:text-stone-100 disabled:opacity-25 flex items-center justify-center text-xs">↑</button>
              <button onClick={() => move(i, 1)} disabled={i === order.length - 1} className="w-6 h-6 rounded bg-stone-800 border border-stone-700 text-stone-400 hover:text-stone-100 disabled:opacity-25 flex items-center justify-center text-xs">↓</button>
            </div>
          </div>
        ))}
      </div>
      <div className="flex gap-2 pt-1">
        <Btn variant="ghost" onClick={onClose} className="ml-auto">Cancel</Btn>
        <Btn onClick={() => { onSave(order); onClose(); }}>Save Seeds</Btn>
      </div>
    </div>
  </Modal>;
}

function TeamFormModal({ title, state, session, groups, initial, onClose, onSave, onDelete }) {
  const grps = groups || GROUPS;
  const [p1, setP1] = useState(initial?.p1Id || "");
  const [p2, setP2] = useState(initial?.p2Id || "");
  const [g, setG] = useState(initial?.group || grps[0] || "A");
  const warn = useMemo(() => {
    if (!p1 || !p2) return null;
    const others = state.sessions.filter(s => s.id !== session.id);
    const locked = getLockedPartners(p1, others);
    return locked.has(p2) ? "These players won a final together before. Loyalty Lockout!" : null;
  }, [p1, p2, state.sessions, session.id]);
  const used = (session.teams || []).filter(t => !initial || t.id !== initial.id).flatMap(t => [t.p1Id, t.p2Id]);
  return <Modal open={true} onClose={onClose} title={title}>
    <div className="space-y-3">
      <div><label className="text-xs text-stone-400 uppercase tracking-wider font-semibold mb-1 block">Player 1</label><PlayerPicker players={state.players} value={p1} onChange={setP1} exclude={[...used, p2].filter(Boolean)} /></div>
      <div><label className="text-xs text-stone-400 uppercase tracking-wider font-semibold mb-1 block">Player 2</label><PlayerPicker players={state.players} value={p2} onChange={setP2} exclude={[...used, p1].filter(Boolean)} /></div>
      {warn && <div className="flex gap-2 p-2.5 rounded-lg border bg-red-950/30 border-red-900/50 text-red-300 text-xs"><I.lock size={14} className="shrink-0 mt-0.5" /><span>{warn}</span></div>}
      <div><label className="text-xs text-stone-400 uppercase tracking-wider font-semibold mb-1 block">Group</label>
        <div className={`grid gap-2`} style={{gridTemplateColumns:`repeat(${grps.length},1fr)`}}>{grps.map(x => <button key={x} type="button" onClick={() => setG(x)} className={`py-2 rounded-lg font-display text-lg ${g === x ? "bg-gradient-to-b from-orange-500 to-red-600 text-white shadow-lg" : "bg-stone-900 text-stone-300 border border-stone-700"}`}>{x}</button>)}</div>
      </div>
      <div className="flex gap-2 pt-2">
        {onDelete && <Btn variant="danger" onClick={() => { onDelete(); onClose(); }}><I.trash size={14} /></Btn>}
        <Btn variant="ghost" onClick={onClose} className="ml-auto">Cancel</Btn>
        <Btn onClick={() => { if (p1 && p2) { onSave({ p1Id: p1, p2Id: p2, group: g }); onClose(); } }} disabled={!p1 || !p2}>Save</Btn>
      </div>
    </div>
  </Modal>;
}

function GroupsTab({ session, state, updateSession, isAdmin }) {

          <I.alert size={16} className="shrink-0 mt-0.5" style={{ color: "#fbbf24" }} />
          <div>
            <div className="text-xs font-bold" style={{ color: "#fbbf24" }}>Uneven Groups</div>
            <div className="text-[11px] text-stone-400 mt-0.5">Groups have different team counts ({groupSizes.join(" / ")}). Auto-Seed will equalize 3rd-place comparisons with ghost BYE wins for smaller groups{groupSizes.some(s => s === 5) ? " and drop-lowest for 5-team groups" : ""}.</div>
          </div>
        </div>
      )}
      {isAdmin && <div className="text-xs text-stone-400">Enter group stage match results. Top of group is auto-calculated.</div>}
      {groups.map(g => {
        const teams = (session.teams || []).filter(t => t.group === g);
        const matches = (session.groupMatches || []).filter(m => teams.find(t => t.id === m.team1Id) && teams.find(t => t.id === m.team2Id));
        const standings = calcGroupStandings(session, g);
        const top = getTopOfGroup(session, g);
        return (
          <Card key={g} className="p-3">
            <div className="flex items-center justify-between mb-3">
              <div className="flex items-center gap-2"><div style={{ width:32, height:32, display:"flex", alignItems:"center", justifyContent:"center", background:"var(--gold)", border:"3px solid var(--ink)", boxShadow:"3px 3px 0 var(--ink)", fontFamily:"'Bangers',cursive", fontSize:"20px", letterSpacing:"1px", color:"var(--ink)" }}>{g}</div><span className="font-semibold text-stone-200">Group {g}</span></div>
              {isAdmin && teams.length >= 2 && <Btn size="sm" variant="secondary" onClick={() => setAdd(g)}><I.plus size={12} /> Match</Btn>}
            </div>
            {standings.length > 0 && <div className="mb-3 space-y-1">{standings.map((s, i) => {
              const p1 = state.players.find(p => p.id === s.team.p1Id);

              const isTop = s.team.id === top;

                {isTop && <I.crown size={12} className="text-amber-400" />}
                <span className="flex-1 text-xs text-stone-200 truncate">{p1?.name?.split(" ")[0]} & {p2?.name?.split(" ")[0]}</span>
                <span className="font-mono text-xs text-stone-400">{s.played}P</span>
                {s.gd !== 0 && <span className={`font-mono text-xs w-8 text-right ${s.gd > 0 ? "text-emerald-500" : "text-red-500"}`}>{s.gd > 0 ? "+" : ""}{s.gd}</span>}
                <span className="font-mono text-xs text-orange-400 font-bold w-7 text-right">{s.pts}</span>
              </div>;
            })}</div>}
            {matches.length === 0 ? <div className="text-xs text-stone-600 italic px-2 py-3 text-center border border-dashed border-stone-800 rounded-lg">No matches</div>
              : <div className="space-y-1.5">{matches.map(m => {
                const t1 = (session.teams || []).find(t => t.id === m.team1Id);
                const t2 = (session.teams || []).find(t => t.id === m.team2Id);
                const lbl = (t) => t ? `${state.players.find(p => p.id === t.p1Id)?.name?.split(" ")[0] || "?"} & ${state.players.find(p => p.id === t.p2Id)?.name?.split(" ")[0] || "?"}` : "?";
                return <div key={m.id} className="flex items-center gap-1 p-2 rounded-lg bg-stone-900/50">
                  <div className="flex-1 min-w-0">
                    <div className="flex items-center gap-2 text-xs">
                      <div className={`flex-1 truncate ${m.winner === "team1" ? "text-emerald-400 font-semibold" : "text-stone-300"}`}>{lbl(t1)}</div>
                      {m.score ? (
                        <span className="font-mono font-bold text-sm tracking-tight shrink-0">
                          <span className={m.winner === "team1" ? "text-emerald-400" : "text-stone-500"}>{m.score.t1}</span>
                          <span className="text-stone-600 mx-0.5">-</span>
                          <span className={m.winner === "team2" ? "text-emerald-400" : "text-stone-500"}>{m.score.t2}</span>
                        </span>
                      ) : <span className="text-stone-600 font-mono text-xs shrink-0">vs</span>}
                      <div className={`flex-1 truncate text-right ${m.winner === "team2" ? "text-emerald-400 font-semibold" : "text-stone-300"}`}>{lbl(t2)}</div>
                    </div>
                    {!m.score && m.lossType && <div className="text-[10px] text-stone-500 mt-0.5 text-center">{LOSS_TYPES.find(lt => lt.id === m.lossType)?.label}</div>}
                  </div>
                  {isAdmin && <button onClick={() => setEdit({ ...m, group: g })} className="p-1 rounded text-stone-600 hover:text-stone-300 hover:bg-stone-700 shrink-0"><I.edit size={12} /></button>}
                </div>;
              })}</div>}
          </Card>
        );
      })}
      {(edit || add) && <MatchEditorModal session={session} state={state} group={edit?.group || add} match={edit} onClose={() => { setEdit(null); setAdd(null); }} onSave={(d) => { if (edit) updateSession(s => ({ ...s, groupMatches: s.groupMatches.map(m => m.id === edit.id ? { ...m, ...d } : m) })); else updateSession(s => ({ ...s, groupMatches: [...(s.groupMatches || []), { id: uid("m"), ...d }] })); }} onDelete={edit ? () => updateSession(s => ({ ...s, groupMatches: s.groupMatches.filter(m => m.id !== edit.id) })) : null} />}
    </div>
  );
}

function MatchEditorModal({ session, state, group, match, onClose, onSave, onDelete }) {
  const teams = (session.teams || []).filter(t => t.group === group);
  const [t1, setT1] = useState(match?.team1Id || "");
  const [t2, setT2] = useState(match?.team2Id || "");
  const initS1 = match?.score?.t1 ?? (match?.winner ? (match.winner === "team1" ? 6 : 3) : null);
  const initS2 = match?.score?.t2 ?? (match?.winner ? (match.winner === "team2" ? 6 : 3) : null);
  const [s1, setS1] = useState(initS1);
  const [s2, setS2] = useState(initS2);
  const lbl = (t) => t ? `${state.players.find(p => p.id === t.p1Id)?.name?.split(" ")[0] || "?"} & ${state.players.find(p => p.id === t.p2Id)?.name?.split(" ")[0] || "?"}` : "?";

  const playedPairs = new Set(
    (session.groupMatches || [])
      .filter(m => m.winner && (!match || m.id !== match.id))
      .map(m => [m.team1Id, m.team2Id].sort().join("|"))
  );
  const hasPlayed = (id1, id2) => id1 && id2 && playedPairs.has([id1, id2].sort().join("|"));

  const derived = (s1 !== null && s2 !== null && s1 !== s2) ? scoreToResult(s1, s2) : null;
  const [confirmed, setConfirmed] = useState(false);
  const canConfirm = t1 && t2 && derived;

  const ScoreBtn = ({ onClick, children }) => (
    <button type="button" onClick={onClick}
      className="w-7 h-7 rounded-md bg-stone-800 border border-stone-700 text-stone-300 text-sm font-bold hover:bg-stone-700 active:scale-95 flex items-center justify-center">{children}</button>
  );

  return <Modal open={true} onClose={onClose} title={match ? "EDIT MATCH" : `GROUP ${group} MATCH`}>
    <div className="space-y-3">
      <div><label className="text-xs text-stone-400 uppercase tracking-wider font-semibold mb-1 block">Team 1</label>
        <select value={t1} onChange={e => { setT1(e.target.value); setConfirmed(false); }} className="w-full bg-stone-900 border border-stone-700 rounded-lg px-3 py-2.5 text-stone-100 focus:outline-none focus:border-orange-500">
          <option value="">Pick team</option>{teams.filter(t => t.id !== t2 && !hasPlayed(t.id, t2)).map(t => <option key={t.id} value={t.id}>{lbl(t)}</option>)}
        </select>
      </div>
      <div><label className="text-xs text-stone-400 uppercase tracking-wider font-semibold mb-1 block">Team 2</label>
        <select value={t2} onChange={e => { setT2(e.target.value); setConfirmed(false); }} className="w-full bg-stone-900 border border-stone-700 rounded-lg px-3 py-2.5 text-stone-100 focus:outline-none focus:border-orange-500">
          <option value="">Pick team</option>{teams.filter(t => t.id !== t1 && !hasPlayed(t1, t.id)).map(t => <option key={t.id} value={t.id}>{lbl(t)}</option>)}
        </select>
      </div>
      {t1 && t2 && <>
        {!confirmed ? (
          <div>
            <label className="text-xs text-stone-400 uppercase tracking-wider font-semibold mb-2 block">Score</label>
            <div className="flex items-center gap-3">
              <div className="flex-1">
                <div className="text-[10px] text-stone-500 mb-1 truncate text-center">{lbl(teams.find(t => t.id === t1))}</div>
                <div className="flex items-center justify-center gap-2">
                  <ScoreBtn onClick={() => setS1(v => Math.max(0, (v ?? 0) - 1))}>−</ScoreBtn>
                  <span className={`w-10 text-center font-mono text-2xl font-bold ${derived?.winner === "team1" ? "text-emerald-400" : derived?.winner === "team2" ? "text-stone-600" : "text-stone-200"}`}>{s1 ?? "—"}</span>
                  <ScoreBtn onClick={() => setS1(v => Math.min(6, (v ?? 0) + 1))}>+</ScoreBtn>
                </div>
              </div>
              <span className="text-stone-600 font-bold text-lg mt-4">—</span>
              <div className="flex-1">
                <div className="text-[10px] text-stone-500 mb-1 truncate text-center">{lbl(teams.find(t => t.id === t2))}</div>
                <div className="flex items-center justify-center gap-2">
                  <ScoreBtn onClick={() => setS2(v => Math.max(0, (v ?? 0) - 1))}>−</ScoreBtn>
                  <span className={`w-10 text-center font-mono text-2xl font-bold ${derived?.winner === "team2" ? "text-emerald-400" : derived?.winner === "team1" ? "text-stone-600" : "text-stone-200"}`}>{s2 ?? "—"}</span>
                  <ScoreBtn onClick={() => setS2(v => Math.min(6, (v ?? 0) + 1))}>+</ScoreBtn>
                </div>
              </div>
            </div>
            <div className="mt-2 text-center text-xs">
              {derived ? <span className="text-emerald-400">{lbl(teams.find(t => t.id === (derived.winner === "team1" ? t1 : t2)))} wins · <span className="text-stone-500">{LOSS_TYPES.find(lt => lt.id === derived.lossType)?.label}</span></span>
                : s1 !== null && s1 === s2 ? <span className="text-amber-400">Tied — adjust score</span>
                : <span className="text-stone-600">Enter score above</span>}
            </div>
          </div>
        ) : (
          <div className="rounded-xl p-4 text-center space-y-1" style={{ background: "rgba(16,185,129,.08)", border: "1px solid rgba(16,185,129,.25)" }}>
            <div className="font-mono text-3xl font-bold text-stone-100">{s1} — {s2}</div>
            <div className="text-emerald-400 text-sm font-semibold">{lbl(teams.find(t => t.id === (derived.winner === "team1" ? t1 : t2)))} wins</div>
            <div className="text-stone-500 text-xs">{LOSS_TYPES.find(lt => lt.id === derived.lossType)?.label}</div>
          </div>
        )}
      </>}
      <div className="flex gap-2 pt-2">
        {onDelete && <Btn variant="danger" onClick={() => { onDelete(); onClose(); }}><I.trash size={14} /></Btn>}
        {confirmed && <Btn variant="ghost" onClick={() => setConfirmed(false)}>← Edit</Btn>}
        <Btn variant="ghost" onClick={onClose} className={confirmed ? "" : "ml-auto"}>Cancel</Btn>
        {!confirmed
          ? <Btn onClick={() => canConfirm && setConfirmed(true)} disabled={!canConfirm}>Confirm →</Btn>
          : <Btn onClick={() => { onSave({ team1Id: t1, team2Id: t2, ...derived }); onClose(); }}>Save Result ✓</Btn>
        }
      </div>
    </div>
  </Modal>;
}

function BracketTab({ session, state, updateSession, isAdmin, canScore }) {
  const [edit, setEdit] = useState(null);
  const b = session.bracket || { qf: [], sf: [], final: null };
  const teams = session.teams || [];
  const thirdPlaceMode = session.thirdPlaceMode || "best2";

  const seedQF = () => {
    const groups = getSessionGroups(session);
    const qCount = getQualifyCount(session);
    const standings = groups.map(g => {
      const size = (session.teams || []).filter(t => t.group === g).length;
      return size === 5 ? calcGroupStandingsNormalized(session, g) : calcGroupStandings(session, g);
    });
    const N = groups.length;

    if (N === 4 && thirdPlaceMode === "all4r16") {
      const winners   = standings.map((s, gi) => s[0]?.team?.id ? { id: s[0].team.id, pts: s[0].pts, wins: s[0].wins, gd: s[0].gd||0, gf: s[0].gf||0, seed: groups[gi]+"1" } : null).filter(Boolean);
      const runnersUp = standings.map((s, gi) => s[1]?.team?.id ? { id: s[1].team.id, pts: s[1].pts, wins: s[1].wins, gd: s[1].gd||0, gf: s[1].gf||0, seed: groups[gi]+"2" } : null).filter(Boolean);
      const rawThirds = standings.map((s, gi) => s[2]?.team?.id ? { id: s[2].team.id, pts: s[2].pts, wins: s[2].wins, gd: s[2].gd||0, gf: s[2].gf||0, seed: groups[gi]+"3" } : null).filter(Boolean);
      if (winners.length < 4) { alert("Need results for all 4 group winners first"); return; }
      if (runnersUp.length < 4) { alert("Need results for all 4 runners-up first"); return; }
      if (rawThirds.length < 4) { alert("Need results for all 4 third-place teams first"); return; }

      // Equalize for cross-group seeding: ghost BYE wins for smaller groups — does NOT change group points
      const eqWinners   = [...equalizeThirds(winners,   session)].sort(compareThirds);
      const eqRunners   = [...equalizeThirds(runnersUp, session)].sort(compareThirds);
      const eqThirds    = [...equalizeThirds(rawThirds, session)].sort(compareThirds);

      // R16: seeds 5-12 (runners-up then thirds)
      // Match 1: seed5 vs seed12, Match 2: seed6 vs seed11, Match 3: seed7 vs seed10, Match 4: seed8 vs seed9
      const r16p = [...eqRunners, ...eqThirds]; // 8 teams, indices 0–7
      const r16 = [1,2,3,4].map((slot, i) => ({
        id: uid("r16"), slot,
        team1Id: r16p[i].id,     s1: r16p[i].seed,
        team2Id: r16p[7-i].id,   s2: r16p[7-i].seed,
        winner: null
      }));

      // QF: seed1 gets bye and faces R16M4 winner (weakest), seed4 faces R16M1 winner (strongest)
      const qf = eqWinners.map((w, i) => ({
        id: uid("qf"), slot: i+1,
        team1Id: w.id,              s1: w.seed,
        team2Id: `R16_TBD_${4-i}`, s2: `R16W${4-i}`,
        winner: null, r16Slot: 4-i,
      }));

      updateSession(s => ({ ...s, bracket: { r16, qf, sf: [], final: null } }));
      return;
    }

    if (N === 3) {
      // Tier 1 = winners, Tier 2 = runners-up, Tier 3 = thirds
      const tier1 = standings.map((s, gi) => s[0]?.team?.id ? { id: s[0].team.id, pts: s[0].pts, wins: s[0].wins, gd: s[0].gd || 0, gf: s[0].gf || 0, tier: 1, seed: groups[gi] + "1" } : null).filter(Boolean);
      const tier2 = standings.map((s, gi) => s[1]?.team?.id ? { id: s[1].team.id, pts: s[1].pts, wins: s[1].wins, gd: s[1].gd || 0, gf: s[1].gf || 0, tier: 2, seed: groups[gi] + "2" } : null).filter(Boolean);
      const rawThirds = standings.map((s, gi) => s[2]?.team?.id ? { id: s[2].team.id, pts: s[2].pts, wins: s[2].wins, gd: s[2].gd || 0, gf: s[2].gf || 0, tier: 3, seed: groups[gi] + "3" } : null).filter(Boolean);
      const equalized = equalizeThirds(rawThirds, session);
      // Padel ranking for 3rds: wins → game difference → games scored
      const sortedThirds = [...equalized].sort(compareThirds);
      // Check for complete tie between 2nd and 3rd thirds (tiebreak match required)
      if (sortedThirds.length >= 3 && thirdPlaceMode === "best2" && compareThirds(sortedThirds[1], sortedThirds[2]) === 0) {
        alert(`Tie between ${lbl(sortedThirds[1].id)} and ${lbl(sortedThirds[2].id)} for the last 3rd-place spot!\n\nPlay a tiebreak match to determine who qualifies.`);
        return;
      }
      const t1sorted = tier1.sort((a, b) => b.pts - a.pts || b.wins - a.wins || b.gd - a.gd);
      const t2sorted = tier2.sort((a, b) => b.pts - a.pts || b.wins - a.wins || b.gd - a.gd);

      if (thirdPlaceMode === "playoff" && sortedThirds.length >= 3) {
        // T3A (best third) → direct QF spot; T3B vs T3C play a qualifier
        const t3a = sortedThirds[0];
        const t3b = sortedThirds[1];
        const t3c = sortedThirds[2];
        const seeded7 = [...t1sorted, ...t2sorted, t3a]; // 7 known + 1 TBD
        const PLAYOFF_TBD = "PLAYOFF_TBD";
        const seeded8ids = [...seeded7.map(t => t.id), PLAYOFF_TBD];
        const seeded8seeds = [...seeded7.map(t => t.seed), "Q"];
        const pairs = [[0,7],[3,4],[2,5],[1,6]];
        const qf = pairs.map(([x, y], i) => ({
          id: uid("qf"), slot: i + 1,
          team1Id: seeded8ids[x], team2Id: seeded8ids[y],
          s1: seeded8seeds[x], s2: seeded8seeds[y], winner: null
        }));
        const thirdsPlayoff = { id: uid("tpo"), team1Id: t3b.id, team2Id: t3c.id, s1: t3b.seed, s2: t3c.seed, winner: null };
        updateSession(s => ({ ...s, bracket: { qf, sf: [], final: null, thirdsPlayoff } }));
        return;
      }

      // best2 mode: top 2 thirds directly into bracket
      const best2 = sortedThirds.slice(0, 2);
      const qualified = [...t1sorted, ...t2sorted, ...best2].slice(0, 8);
      if (qualified.length < 4) { alert("Not enough results — need at least 2 teams per group and some 3rd-place results"); return; }
      const pairs = [[0,7],[3,4],[2,5],[1,6]];
      const qf = pairs.map(([x, y], i) => qualified[x] && qualified[y] ? {
        id: uid("qf"), slot: i + 1,
        team1Id: qualified[x].id, team2Id: qualified[y].id,
        s1: qualified[x].seed, s2: qualified[y].seed, winner: null
      } : null).filter(Boolean);
      updateSession(s => ({ ...s, bracket: { qf, sf: [], final: null } }));
      return;
    }

    if (qCount === 2 && (N === 2 || N === 4)) {
      const winners = standings.map((s, i) => ({ id: s[0]?.team?.id, seed: groups[i] + "1" }));
      const runners = standings.map((s, i) => ({ id: s[1]?.team?.id, seed: groups[i] + "2" }));
      if (winners.some(w => !w.id) || runners.some(r => !r.id)) { alert("Need top 2 in every group first"); return; }
      const pairs = winners.map((w, i) => ({ a: w, b: runners[N - 1 - i] }));
      if (N === 2) {
        const sf = pairs.map((p, i) => ({ id: uid("sf"), slot: i + 1, team1Id: p.a.id, team2Id: p.b.id, s1: p.a.seed, s2: p.b.seed, winner: null }));
        updateSession(s => ({ ...s, bracket: { qf: [], sf, final: null } }));
      } else {
        const order = [0, 2, 1, 3];
        const qf = order.map((idx, i) => ({ id: uid("qf"), slot: i + 1, team1Id: pairs[idx].a.id, team2Id: pairs[idx].b.id, s1: pairs[idx].a.seed, s2: pairs[idx].b.seed, winner: null }));
        updateSession(s => ({ ...s, bracket: { qf, sf: [], final: null } }));
      }
      return;
    }

    const qualifiers = [];
    standings.forEach((s, gi) => {
      for (let i = 0; i < qCount; i++) {
        if (s[i]?.team?.id) qualifiers.push({ teamId: s[i].team.id, pts: s[i].pts, wins: s[i].wins, groupRank: i, seed: groups[gi] + (i + 1) });
      }
    });
    if (qualifiers.length === 0) { alert("No qualified teams yet"); return; }
    const seeded = [...qualifiers].sort((a, b) => b.pts - a.pts || b.wins - a.wins || a.groupRank - b.groupRank);
    const total = seeded.length;
    if (total === 2) {
      updateSession(s => ({ ...s, bracket: { qf: [], sf: [], final: { id: uid("f"), team1Id: seeded[0].teamId, team2Id: seeded[1].teamId, s1: seeded[0].seed, s2: seeded[1].seed, winner: null } } }));
    } else if (total <= 4) {
      const sf = [];
      for (let i = 0; i < Math.floor(total / 2); i++) sf.push({ id: uid("sf"), slot: i + 1, team1Id: seeded[i].teamId, team2Id: seeded[total - 1 - i].teamId, s1: seeded[i].seed, s2: seeded[total - 1 - i].seed, winner: null });
      updateSession(s => ({ ...s, bracket: { qf: [], sf, final: null } }));
    } else {
      const pick = [[0,7],[3,4],[1,6],[2,5]];
      const qf = pick.map(([x, y], i) => seeded[x] && seeded[y] ? { id: uid("qf"), slot: i + 1, team1Id: seeded[x].teamId, team2Id: seeded[y].teamId, s1: seeded[x].seed, s2: seeded[y].seed, winner: null } : null).filter(Boolean);
      updateSession(s => ({ ...s, bracket: { qf, sf: [], final: null } }));
    }
  };

  const lbl = (id) => {
    if (id === "PLAYOFF_TBD") return "Qualifier TBD";
    if (id?.startsWith?.("R16_TBD_")) return `R16 M${id.slice(8)} Winner`;
    const t = teams.find(t => t.id === id);
    if (!t) return "—";
    return `${state.players.find(p => p.id === t.p1Id)?.name?.split(" ")[0] || "?"} & ${state.players.find(p => p.id === t.p2Id)?.name?.split(" ")[0] || "?"}`;
  };

  useEffect(() => {
    // R16 → QF (all4r16 mode)
    if (b.r16?.length > 0) {
      let updatedQF = [...b.qf];
      let changed = false;
      for (const r16m of b.r16) {
        if (!r16m.winner) continue;
        const winnerId = r16m.winner === "team1" ? r16m.team1Id : r16m.team2Id;
        updatedQF = updatedQF.map(qfm => {
          if (qfm.r16Slot !== r16m.slot || qfm.winner) return qfm;
          if (qfm.team2Id !== winnerId) { changed = true; return { ...qfm, team2Id: winnerId }; }
          return qfm;
        });
      }
      if (changed) updateSession(s => ({ ...s, bracket: { ...s.bracket, qf: updatedQF } }));
    }
    // Thirds playoff winner → fill PLAYOFF_TBD slot in QF
    if (b.thirdsPlayoff?.winner && b.qf.some(m => m.team1Id === "PLAYOFF_TBD" || m.team2Id === "PLAYOFF_TBD")) {
      const winner = b.thirdsPlayoff.winner === "team1" ? b.thirdsPlayoff.team1Id : b.thirdsPlayoff.team2Id;
      updateSession(s => ({ ...s, bracket: { ...s.bracket, qf: s.bracket.qf.map(m => ({
        ...m,
        team1Id: m.team1Id === "PLAYOFF_TBD" ? winner : m.team1Id,
        team2Id: m.team2Id === "PLAYOFF_TBD" ? winner : m.team2Id,
      })) } }));
    }
    // QF → SF
    const qfWinners = b.qf.filter(m => m.winner && m.team1Id !== "PLAYOFF_TBD" && m.team2Id !== "PLAYOFF_TBD").map(m => m.winner === "team1" ? m.team1Id : m.team2Id);
    if (qfWinners.length === 4 && (b.sf?.length || 0) < 2) {
      updateSession(s => ({ ...s, bracket: { ...s.bracket, sf: [
        { id: uid("sf"), slot: 1, team1Id: qfWinners[0], team2Id: qfWinners[1], winner: null },
        { id: uid("sf"), slot: 2, team1Id: qfWinners[2], team2Id: qfWinners[3], winner: null },
      ] } }));
    }
    // SF → Final
    const sfWinners = (b.sf || []).filter(m => m.winner).map(m => m.winner === "team1" ? m.team1Id : m.team2Id);
    if (sfWinners.length === 2 && !b.final) {
      updateSession(s => ({ ...s, bracket: { ...s.bracket, final: { id: uid("f"), team1Id: sfWinners[0], team2Id: sfWinners[1], winner: null } } }));
    }
  }, [JSON.stringify(b)]);

  if ((!b.qf || b.qf.length === 0) && (!b.r16 || b.r16.length === 0)) {
    return <Card className="p-6 text-center border-dashed">
      <I.swords className="mx-auto mb-3 text-stone-600" size={36} />
      <div className="text-stone-300 font-semibold mb-1">No bracket yet</div>
      {isAdmin && <><div className="text-stone-500 text-sm mb-4">Auto-seed from group standings</div><Btn onClick={seedQF}><I.bolt size={14} /> Auto-Seed</Btn></>}
    </Card>;
  }

  const champId = b.final?.winner ? (b.final.winner === "team1" ? b.final.team1Id : b.final.team2Id) : null;

  return (
    <div className="space-y-4">
      {champId && <div style={{ background:"var(--yellow)", border:"5px solid var(--ink)", boxShadow:"8px 8px 0 var(--ink)", padding:"20px", textAlign:"center", marginBottom:16 }}>
        <I.crown size={32} style={{ color:"var(--ink)", margin:"0 auto 8px" }} />
        <div style={{ fontWeight:900, fontSize:"11px", letterSpacing:".22em", textTransform:"uppercase", color:"var(--ink)", marginBottom:4 }}>Champion</div>
        <div style={{ fontFamily:"'Bangers',cursive", fontSize:"36px", letterSpacing:"1.5px", color:"var(--ink)" }}>{lbl(champId)}</div>
      </div>}

      {/* R16 round (all4r16 mode) */}
      {b.r16?.length > 0 && (
        <Card className="p-3" style={{ borderColor: "rgba(167,139,250,0.35)" }}>
          <div className="flex items-center justify-between mb-2">
            <h3 className="font-display text-base" style={{ color: "#a78bfa" }}>ROUND OF 16</h3>
            <span className="text-[10px] font-bold uppercase tracking-wider" style={{ color: "#a78bfa" }}>All thirds qualify</span>
          </div>
          <div className="space-y-1.5">
            {b.r16.map(m => (
              <BracketRow key={m.id} match={m} lbl={lbl}
                onClick={() => canScore && setEdit({ ...m, round: "r16" })} />
            ))}
          </div>
        </Card>
      )}

      {/* Thirds qualifier (playoff mode) */}
      {b.thirdsPlayoff && !b.thirdsPlayoff.winner && (
        <Card className="p-3" style={{ borderColor: "rgba(167,139,250,0.35)" }}>
          <div className="flex items-center justify-between mb-2">
            <h3 className="font-display text-base" style={{ color: "#a78bfa" }}>3RDS QUALIFIER</h3>
            <span className="text-[10px] font-bold uppercase tracking-wider" style={{ color: "#a78bfa" }}>For 8th QF spot</span>
          </div>
          <BracketRow match={b.thirdsPlayoff} lbl={lbl} onClick={() => canScore && setEdit({ ...b.thirdsPlayoff, round: "thirdsPlayoff" })} />
        </Card>
      )}

      {/* Bracket tree (4 QF) or fallback list */}
      {b.qf.length === 4
        ? <BracketTreeView b={b} lbl={lbl} canScore={canScore} setEdit={setEdit} />
        : <>
            <Card className="p-3">
              <div className="flex items-center justify-between mb-2"><h3 className="font-display text-lg text-stone-200">QUARTERFINALS</h3><Pill color="orange">+1 · W+3 TB+2 L+1</Pill></div>
              {isAdmin && <div className="text-[10px] text-amber-400 mb-2 flex items-center gap-1"><I.alert size={10} /> Tap to edit (for dropouts)</div>}
              <div className="space-y-1.5">{b.qf.map(m => <BracketRow key={m.id} match={m} lbl={lbl} onClick={() => canScore && setEdit({ ...m, round: "qf" })} />)}</div>
            </Card>
            {b.sf?.length > 0 && <Card className="p-3">
              <div className="flex items-center justify-between mb-2"><h3 className="font-display text-lg text-stone-200">SEMIFINALS</h3><Pill color="red">+2 · W+3 TB+2 L+1</Pill></div>
              <div className="space-y-1.5">{b.sf.map(m => <BracketRow key={m.id} match={m} lbl={lbl} onClick={() => canScore && setEdit({ ...m, round: "sf" })} />)}</div>
            </Card>}
            {b.final && <Card className="p-3" style={{ borderColor: "rgba(251, 191, 36, 0.3)" }}>
              <div className="flex items-center justify-between mb-2"><h3 className="font-display text-lg text-amber-400">🏆 FINAL</h3><Pill color="amber">+3 reach · +5 win · W+3 TB+2 L+1</Pill></div>
              <BracketRow match={b.final} lbl={lbl} onClick={() => canScore && setEdit({ ...b.final, round: "final" })} big />
            </Card>}
          </>
      }

      {edit && <BracketEditModal match={edit} teams={teams} state={state} isAdmin={isAdmin} onClose={() => setEdit(null)}
        onSave={(d) => updateSession(s => {
          const nb = { ...s.bracket };
          if (edit.round === "r16") nb.r16 = (nb.r16||[]).map(m => m.id === edit.id ? { ...m, ...d } : m);
          else if (edit.round === "qf") nb.qf = nb.qf.map(m => m.id === edit.id ? { ...m, ...d } : m);
          else if (edit.round === "sf") nb.sf = nb.sf.map(m => m.id === edit.id ? { ...m, ...d } : m);
          else if (edit.round === "final") nb.final = { ...nb.final, ...d };
          else if (edit.round === "thirdsPlayoff") nb.thirdsPlayoff = { ...nb.thirdsPlayoff, ...d };
          return { ...s, bracket: nb };
        })}
        onReset={() => updateSession(s => ({ ...s, bracket: { r16: s.bracket.r16, qf: s.bracket.qf, sf: [], final: null, thirdsPlayoff: s.bracket.thirdsPlayoff } }))}
      />}
    </div>
  );
}

function BracketTreeView({ b, lbl, canScore, setEdit }) {
  const CARD_H = 64, GAP = 22, COL_W = 134, CONN_W = 46;
  const step = CARD_H + GAP;
  const qfTops = [0, 1, 2, 3].map(i => i * step);
  const qfCenters = qfTops.map(t => t + CARD_H / 2);
  const sfCenters = [(qfCenters[0] + qfCenters[1]) / 2, (qfCenters[2] + qfCenters[3]) / 2];
  const sfTops = sfCenters.map(c => c - CARD_H / 2);
  const finalCenter = (sfCenters[0] + sfCenters[1]) / 2;
  const finalTop = finalCenter - CARD_H / 2;
  const totalH = 4 * CARD_H + 3 * GAP;

  // Always show all 3 columns — use placeholders until rounds are populated
  const sfData = b.sf?.length > 0 ? b.sf : [
    { id: "sfp1", slot: 1, team1Id: null, team2Id: null, winner: null },
    { id: "sfp2", slot: 2, team1Id: null, team2Id: null, winner: null },
  ];
  const finalData = b.final || { id: "fp", team1Id: null, team2Id: null, winner: null };

  const colX = { qf: 0, sf: COL_W + CONN_W, final: 2 * (COL_W + CONN_W) };
  const totalW = colX.final + COL_W;

  const MiniCard = ({ m, round, top, left }) => {
    const w = m.winner;
    const isFinal = round === "final";
    const isEmpty = !m.team1Id && !m.team2Id;
    const hasTbd = m.team1Id === "PLAYOFF_TBD" || m.team2Id === "PLAYOFF_TBD" || m.team1Id?.startsWith?.("R16_TBD_") || m.team2Id?.startsWith?.("R16_TBD_");
    const isPlaceholder = isEmpty || hasTbd;
    const sides = [
      { key: "team1", id: m.team1Id, seed: m.s1 },
      { key: "team2", id: m.team2Id, seed: m.s2 },
    ];
    const roundLabel = { sf: "SF Winner", final: "Finalist" };
    return (
      <button
        onClick={() => canScore && !isPlaceholder && setEdit({ ...m, round })}
        style={{
          position: "absolute", top, left, width: COL_W, height: CARD_H,
          background: isFinal ? "rgba(251,191,36,0.06)" : isEmpty ? "rgba(10,8,7,0.5)" : w ? "rgba(16,185,129,0.06)" : "rgba(20,18,16,0.8)",
          border: `1px solid ${isFinal ? "rgba(251,191,36,0.25)" : isEmpty ? "rgba(68,64,60,0.25)" : w ? "rgba(16,185,129,0.25)" : "rgba(68,64,60,0.45)"}`,
          borderRadius: "10px", padding: "7px 8px", textAlign: "left",
          cursor: canScore && !isPlaceholder ? "pointer" : "default",
          display: "flex", flexDirection: "column", justifyContent: isEmpty ? "center" : "space-between",
          transition: "border-color 0.15s",
        }}
      >
        {isEmpty ? (
          <div style={{ fontSize: "10px", color: "#44403c", textAlign: "center", fontStyle: "italic" }}>
            {roundLabel[round] || "TBD"}
          </div>
        ) : sides.map(({ key, id, seed }) => {
          const won = w === key;
          const lost = w && w !== key;
          return (
            <div key={key} style={{
              display: "flex", alignItems: "center", gap: "3px",
              fontSize: "11px", lineHeight: "1.3",
              color: won ? "#34d399" : lost ? "#57534e" : id ? "#d6d3d1" : "#44403c",
              fontWeight: won ? "700" : "400",
            }}>
              {won && <I.trophy size={9} style={{ flexShrink: 0, color: "#34d399" }} />}
              {seed && seed !== "Q" && <SeedBadge seed={seed} />}
              {m.score && id && (
                <span style={{ fontFamily: "monospace", fontSize: "10px", color: won ? "#34d399" : "#57534e", flexShrink: 0 }}>
                  {key === "team1" ? m.score.t1 : m.score.t2}
                </span>
              )}
              <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", flex: 1, fontStyle: id ? "normal" : "italic" }}>
                {id ? lbl(id) : "TBD"}
              </span>
            </div>
          );
        })}
      </button>
    );
  };

  const qfWon = (i) => b.qf[i]?.winner;
  const sfWon = (i) => sfData[i]?.winner;
  const qfConnColor = (i) => qfWon(i) ? "rgba(52,211,153,0.3)" : "rgba(68,64,60,0.2)";
  const sfConnColor = (i) => sfWon(i) ? "rgba(251,191,36,0.38)" : "rgba(68,64,60,0.2)";

  return (
    <div className="rounded-xl overflow-hidden" style={{ background: "var(--surface)", border: "1px solid var(--hairline)" }}>
      <div className="flex items-center justify-between px-3 pt-3 pb-2">
        <h3 className="font-display text-lg text-stone-200">BRACKET</h3>
        <div className="flex items-center gap-1.5 text-[10px] font-bold uppercase tracking-wider">
          <span style={{ color: "var(--orange-br)" }}>QF</span>
          <span className="text-stone-600">→</span>
          <span className="text-red-400">SF</span>
          <span className="text-stone-600">→</span>
          <span className="text-amber-400">Final</span>
        </div>
      </div>
      <div style={{ overflowX: "auto", padding: "0 12px 12px" }}>
        <div style={{ position: "relative", width: totalW, height: totalH, minWidth: Math.min(totalW, 320) }}>
          {/* QF */}
          {b.qf.map((m, i) => <MiniCard key={m.id} m={m} round="qf" top={qfTops[i]} left={colX.qf} />)}
          {/* SF */}
          {sfData.map((m, i) => <MiniCard key={m.id} m={m} round="sf" top={sfTops[i]} left={colX.sf} />)}
          {/* Final */}
          <MiniCard m={finalData} round="final" top={finalTop} left={colX.final} />

          {/* SVG connectors */}
          <svg style={{ position: "absolute", top: 0, left: 0, width: totalW, height: totalH, pointerEvents: "none", overflow: "visible" }}>
            {/* QF → SF */}
            {b.qf.map((m, i) => {
              const sfIdx = i < 2 ? 0 : 1;
              const sx = colX.qf + COL_W, sy = qfCenters[i];
              const ex = colX.sf, ey = sfCenters[sfIdx];
              const mx = sx + CONN_W / 2;
              return <path key={m.id} d={`M${sx} ${sy} H${mx} V${ey} H${ex}`} fill="none" stroke={qfConnColor(i)} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" />;
            })}
            {/* SF → Final */}
            {sfData.map((m, i) => {
              const sx = colX.sf + COL_W, sy = sfCenters[i];
              const ex = colX.final, ey = finalCenter;
              const mx = sx + CONN_W / 2;
              return <path key={m.id} d={`M${sx} ${sy} H${mx} V${ey} H${ex}`} fill="none" stroke={sfConnColor(i)} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" />;
            })}
          </svg>
        </div>
      </div>
      {canScore && <div className="text-center text-[10px] text-stone-600 pb-2">Tap any match to enter result</div>}
    </div>
  );
}

function SeedBadge({ seed }) {
  if (!seed) return null;
  // Tier color: ends in 1 = winner (green), 2 = runner-up (gold), 3 = third (purple), else blue
  const n = parseInt(seed.slice(-1));
  const cfg = n === 1
    ? { bg: "rgba(52,211,153,0.18)", color: "#34d399" }
    : n === 2
    ? { bg: "rgba(251,191,36,0.18)", color: "#fbbf24" }
    : n === 3
    ? { bg: "rgba(167,139,250,0.18)", color: "#a78bfa" }
    : { bg: "rgba(51,161,255,0.18)", color: "#7FC4FF" };
  return <span className="inline-flex items-center justify-center px-1.5 py-0.5 rounded text-[9px] font-bold font-mono shrink-0" style={{ background: cfg.bg, color: cfg.color }}>{seed}</span>;
}

function BracketRow({ match, lbl, onClick, big }) {
  const w = match.winner;
  return <button onClick={onClick} className={`w-full ${big ? "p-3" : "p-2"} rounded-lg bg-stone-900/50 hover:bg-stone-800/70 text-left`}>
    <div className="flex items-center gap-2">
      <div className={`flex-1 min-w-0 flex items-center gap-1.5 ${big ? "text-base" : "text-sm"} ${w === "team1" ? "text-emerald-400 font-bold" : "text-stone-300"}`}>{w === "team1" && <I.trophy size={big ? 14 : 11} className="shrink-0" />}<SeedBadge seed={match.s1} /><span className="truncate">{lbl(match.team1Id)}</span></div>
      {match.score ? (
        <span className="font-mono font-bold text-sm tracking-tight shrink-0">
          <span className={w === "team1" ? "text-emerald-400" : "text-stone-500"}>{match.score.t1}</span>
          <span className="text-stone-600 mx-0.5">-</span>
          <span className={w === "team2" ? "text-emerald-400" : "text-stone-500"}>{match.score.t2}</span>
        </span>
      ) : <span className="text-stone-600 font-mono text-xs shrink-0">vs</span>}
      <div className={`flex-1 min-w-0 flex items-center justify-end gap-1.5 ${big ? "text-base" : "text-sm"} ${w === "team2" ? "text-emerald-400 font-bold" : "text-stone-300"}`}><span className="truncate">{lbl(match.team2Id)}</span><SeedBadge seed={match.s2} />{w === "team2" && <I.trophy size={big ? 14 : 11} className="shrink-0" />}</div>
    </div>
  </button>;
}

function BracketEditModal({ match, teams, state, isAdmin, onClose, onSave, onReset }) {
  const [t1, setT1] = useState(match.team1Id || "");
  const [t2, setT2] = useState(match.team2Id || "");
  const initS1 = match?.score?.t1 ?? (match?.winner ? (match.winner === "team1" ? 6 : 3) : null);
  const initS2 = match?.score?.t2 ?? (match?.winner ? (match.winner === "team2" ? 6 : 3) : null);
  const [s1, setS1] = useState(initS1);
  const [s2, setS2] = useState(initS2);
  const [confirmed, setConfirmed] = useState(false);
  const lbl = (id) => { const t = teams.find(t => t.id === id); if (!t) return "?"; const p1 = state.players.find(p => p.id === t.p1Id)?.name?.split(" ")[0] || "?"; const p2 = state.players.find(p => p.id === t.p2Id)?.name?.split(" ")[0] || "?"; return `${p1} & ${p2}`; };
  const titles = { r16: "ROUND OF 16", qf: "QUARTERFINAL", sf: "SEMIFINAL", final: "FINAL", thirdsPlayoff: "3RDS QUALIFIER" };
  const maxScore = match.round === "final" ? 9 : 7;
  const derived = (s1 !== null && s2 !== null && s1 !== s2) ? scoreToResult(s1, s2) : null;
  const canConfirm = t1 && t2 && derived;
  const ScoreBtn = ({ onClick, children }) => (
    <button type="button" onClick={onClick} className="w-7 h-7 rounded-md bg-stone-800 border border-stone-700 text-stone-300 text-sm font-bold hover:bg-stone-700 active:scale-95 flex items-center justify-center">{children}</button>
  );
  return <Modal open={true} onClose={onClose} title={`EDIT ${titles[match.round]}`}>
    <div className="space-y-3">
      {isAdmin && <>
        <div className="text-xs text-amber-400 bg-amber-400/10 border border-amber-400/30 rounded-lg p-2 flex gap-2"><I.alert size={14} className="shrink-0 mt-0.5" /><span>Edit teams here for dropouts. May need to reset downstream rounds.</span></div>
        <div><label className="text-xs text-stone-400 uppercase tracking-wider font-semibold mb-1 block">Team 1</label><select value={t1} onChange={e => { setT1(e.target.value); setConfirmed(false); }} className="w-full bg-stone-900 border border-stone-700 rounded-lg px-3 py-2.5 text-stone-100"><option value="">— None —</option>{teams.filter(t => t.id !== t2).map(t => <option key={t.id} value={t.id}>{lbl(t.id)} (Group {t.group})</option>)}</select></div>
        <div><label className="text-xs text-stone-400 uppercase tracking-wider font-semibold mb-1 block">Team 2</label><select value={t2} onChange={e => { setT2(e.target.value); setConfirmed(false); }} className="w-full bg-stone-900 border border-stone-700 rounded-lg px-3 py-2.5 text-stone-100"><option value="">— None —</option>{teams.filter(t => t.id !== t1).map(t => <option key={t.id} value={t.id}>{lbl(t.id)} (Group {t.group})</option>)}</select></div>
      </>}
      {t1 && t2 && <>
        {!confirmed ? (
          <div>
            <label className="text-xs text-stone-400 uppercase tracking-wider font-semibold mb-2 block">Score{match.round === "final" ? " (up to 9)" : ""}</label>
            <div className="flex items-center gap-3">
              <div className="flex-1">
                <div className="text-[10px] text-stone-500 mb-1 truncate text-center">{lbl(t1)}</div>
                <div className="flex items-center justify-center gap-2">
                  <ScoreBtn onClick={() => setS1(v => Math.max(0, (v ?? 0) - 1))}>−</ScoreBtn>
                  <span className={`w-10 text-center font-mono text-2xl font-bold ${derived?.winner === "team1" ? "text-emerald-400" : derived?.winner === "team2" ? "text-stone-600" : "text-stone-200"}`}>{s1 ?? "—"}</span>
                  <ScoreBtn onClick={() => setS1(v => Math.min(maxScore, (v ?? 0) + 1))}>+</ScoreBtn>
                </div>
              </div>
              <span className="text-stone-600 font-bold text-lg mt-4">—</span>
              <div className="flex-1">
                <div className="text-[10px] text-stone-500 mb-1 truncate text-center">{lbl(t2)}</div>
                <div className="flex items-center justify-center gap-2">
                  <ScoreBtn onClick={() => setS2(v => Math.max(0, (v ?? 0) - 1))}>−</ScoreBtn>
                  <span className={`w-10 text-center font-mono text-2xl font-bold ${derived?.winner === "team2" ? "text-emerald-400" : derived?.winner === "team1" ? "text-stone-600" : "text-stone-200"}`}>{s2 ?? "—"}</span>
                  <ScoreBtn onClick={() => setS2(v => Math.min(maxScore, (v ?? 0) + 1))}>+</ScoreBtn>
                </div>
              </div>
            </div>
            <div className="mt-2 text-center text-xs">
              {derived ? <span className="text-emerald-400">{lbl(derived.winner === "team1" ? t1 : t2)} wins · <span className="text-stone-500">{LOSS_TYPES.find(lt => lt.id === derived.lossType)?.label}</span></span>
                : s1 !== null && s1 === s2 ? <span className="text-amber-400">Tied — adjust score</span>
                : <span className="text-stone-600">Enter score above</span>}
            </div>
          </div>
        ) : (
          <div className="rounded-xl p-4 text-center space-y-1" style={{ background: "rgba(16,185,129,.08)", border: "1px solid rgba(16,185,129,.25)" }}>
            <div className="font-mono text-3xl font-bold text-stone-100">{s1} — {s2}</div>
            <div className="text-emerald-400 text-sm font-semibold">{lbl(derived.winner === "team1" ? t1 : t2)} wins</div>
            <div className="text-stone-500 text-xs">{LOSS_TYPES.find(lt => lt.id === derived.lossType)?.label}</div>
          </div>
        )}
      </>}
      {isAdmin && match.round === "qf" && <Btn variant="secondary" className="w-full" onClick={() => { onReset(); onClose(); }}>Reset SFs + Final</Btn>}
      <div className="flex gap-2 pt-2">
        {confirmed && <Btn variant="ghost" onClick={() => setConfirmed(false)}>← Edit</Btn>}
        <Btn variant="ghost" onClick={onClose} className={confirmed ? "" : "ml-auto"}>Cancel</Btn>
        {!confirmed
          ? <Btn onClick={() => canConfirm && setConfirmed(true)} disabled={!canConfirm}>Confirm →</Btn>
          : <Btn onClick={() => { onSave({ team1Id: t1 || null, team2Id: t2 || null, ...derived }); onClose(); }}>Save Result ✓</Btn>
        }
      </div>
    </div>
  </Modal>;
}

function LeaderboardView({ leaderboard, state, setOpenPlayerId }) {
  const [mode, setMode] = useState("season"); // "season" | "lifetime"
  const seriesNames = state.prevSeriesNames || [];
  const hasLifetime = leaderboard.some(e => {
    const p = e.player;
    return (p.prevSeriesPoints || 0) > 0 || Object.values(p.prevSeriesPts || {}).some(v => v > 0);
  });
  const sorted = mode === "lifetime"
    ? [...leaderboard].sort((a, b) => b.lifetimePts - a.lifetimePts)
    : leaderboard;
  const hasPlayed = (l) => l.stats.groupPlayed > 0 || l.stats.qfReached > 0;
  const active = sorted.filter(hasPlayed);
  const inactive = sorted.filter(l => !hasPlayed(l));
  const rankColors = ["#FFC24B", "#c0c0c0", "#cd7f32"];
  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between" style={{paddingTop:8}}>
        <div>
          <div className="jh-sec-kicker">Series Standings</div>
          <h2 className="jh-sec-title">JULY <em>HEAT</em></h2>
        </div>
        {active.length > 0 && <span className="jh-flag blue" style={{alignSelf:"flex-start"}}>{active.length} RANKED</span>}
      </div>
      {hasLifetime && (
        <div className="flex gap-1 p-1 rounded-xl bg-stone-900/60 border border-stone-800">
          {["season","lifetime"].map(m => (
            <button key={m} onClick={() => setMode(m)} className={`flex-1 py-1.5 rounded-lg text-xs font-bold uppercase tracking-wider transition-all ${mode === m ? "text-white shadow" : "text-stone-500"}`}
              style={{ background: mode === m ? "linear-gradient(135deg, var(--orange), var(--red))" : "transparent" }}>
              {m === "season" ? "This Series" : "All-Time"}
            </button>
          ))}
        </div>
      )}
      {active.length === 0 && mode === "season" ? <Card className="p-8 text-center border-dashed"><I.trophy className="mx-auto mb-3 text-stone-600" size={32} /><div className="text-stone-300 font-semibold">Ranking locked</div><div className="text-stone-500 text-sm mt-1">Standings appear after the first match is played</div></Card>
        : <div className="space-y-1.5">{(mode === "lifetime" ? sorted : active).map((e, i) => {
          const pts = mode === "lifetime" ? e.lifetimePts : e.totalPts;
          const playerSeriesPts = e.player.prevSeriesPts || {};
          const legacyPrev = e.player.prevSeriesPoints || 0;
          const played = hasPlayed(e);
          return (
            <div key={e.player.id} className="rounded-xl p-3 cursor-pointer transition-all active:scale-[0.99]"
              style={{ background: "var(--surface)", border: `1px solid ${i < 3 ? rankColors[i] + "33" : "rgba(68,64,60,0.5)"}`, opacity: mode === "lifetime" && !played && pts === 0 ? 0.55 : 1 }}
              onClick={() => setOpenPlayerId(e.player.id)}>
              <div className="flex items-center gap-3">
                <div className="jh-rank" style={{background:i>=3?"rgba(240,233,216,.8)":"",color:i>=3?"rgba(11,8,20,.35)":""}}>{i+1}</div>
                <Avatar player={e.player} size={38} />
                <div className="flex-1 min-w-0">
                  <div className="font-semibold truncate" style={{ color: "var(--ink)", fontFamily: "'Bangers',cursive", fontSize: 17, letterSpacing: ".5px" }}>{e.player.name}</div>
                  <div className="text-[10px] mt-0.5 flex items-center gap-2 flex-wrap" style={{color:"rgba(11,8,20,.72)"}}>
                    {played ? <>
                      <span>{e.stats.sessionsPlayed}sess</span>
                      <span>·</span>
                      <span style={{color:"var(--ink)",fontWeight:700}}>{e.stats.groupWins + e.stats.qfWins + e.stats.sfWins + e.stats.finalsWon}W</span>
                      {e.stats.qfReached > 0 && <><span>·</span><span>QF×{e.stats.qfReached}</span></>}
                      {e.stats.sfReached > 0 && <><span>·</span><span>SF×{e.stats.sfReached}</span></>}
                      {e.stats.finalsWon > 0 && <><span>·</span><span style={{color:"var(--orange)",fontWeight:600}}>🏆×{e.stats.finalsWon}</span></>}
                      {(e.stats.finalsReached - e.stats.finalsWon) > 0 && <><span>·</span><span>🥈×{e.stats.finalsReached - e.stats.finalsWon}</span></>}
                      {getMilestones(e).slice(0, 3).map(m => <span key={m.id} title={m.label + ": " + m.desc} className="ml-0.5">{m.icon}</span>)}
                    </> : <span>Not yet played</span>}
                  </div>
                  {mode === "lifetime" && seriesNames.length > 0 && (
                    <div className="mt-1.5 flex flex-wrap gap-x-3 gap-y-0.5">
                      {seriesNames.map(sn => {
                        const v = playerSeriesPts[sn] || 0;
                        return <span key={sn} style={{fontSize:9,color:"rgba(11,8,20,.65)"}}>{sn}: <span style={{color:"rgba(11,8,20,.82)",fontFamily:"'JetBrains Mono',monospace"}}>{v}</span></span>;
                      })}
                      {legacyPrev > 0 && <span style={{fontSize:9,color:"rgba(11,8,20,.65)"}}>Legacy: <span style={{color:"rgba(11,8,20,.82)",fontFamily:"'JetBrains Mono',monospace"}}>{legacyPrev}</span></span>}
                      <span style={{fontSize:9,color:"rgba(11,8,20,.65)"}}>{state.seasonName}: <span style={{color:"var(--blue)",fontFamily:"'JetBrains Mono',monospace"}}>{e.totalPts}</span></span>
                    </div>
                  )}
                </div>
                <div className="text-right shrink-0">
                  <div className="jh-pts" style={{color:i>=3?"var(--ink)":"",WebkitTextStroke:i>=3?"none":""}}>{pts}</div>
                  <div style={{ fontFamily:"'Archivo',sans-serif", fontWeight:900, fontSize:"9px", letterSpacing:".16em", textTransform:"uppercase", color:"rgba(11,8,20,.68)", marginTop:3 }}>{mode === "lifetime" ? "total" : "pts"}</div>
                </div>
              </div>
            </div>
          );
        })}</div>}
    </div>
  );
}

function PlayerDetail({ playerId, state, leaderboard, canScore, update, onClose }) {
  const player = state.players.find(p => p.id === playerId);
  const entry = leaderboard.find(l => l.player.id === playerId);
  if (!player || !entry) return null;
  const rank = leaderboard.findIndex(l => l.player.id === playerId) + 1;
  const locked = getLockedPartners(playerId, state.sessions);
  const lockedNames = Array.from(locked).map(id => state.players.find(p => p.id === id)?.name).filter(Boolean);
  const seriesNames = state.prevSeriesNames || [];
  const playerSeriesPts = player.prevSeriesPts || {};
  const legacyPrev = player.prevSeriesPoints || 0;
  const prevSum = Object.values(playerSeriesPts).reduce((a, b) => a + (Number(b) || 0), 0) + legacyPrev;
  const [uploading, setUploading] = useState(false);
  const handlePhotoUpload = async (e) => {
    const f = e.target.files?.[0]; if (!f) return;
    setUploading(true);
    try {
      const b64 = await resizeToBase64(f);
      update(s => ({ ...s, players: s.players.map(p => p.id === playerId ? { ...p, photoUrl: b64 } : p) }));
      await uploadPhotoToServer(playerId, b64);
    } catch {}
    setUploading(false);
  };
  return <Modal open={true} onClose={onClose} title={player.name.toUpperCase()}>
    <div className="space-y-4">
      <div className="text-center py-3">
        <div className="flex justify-center mb-3 relative">
          <Avatar player={player} size={72} />
          {canScore && <label className="absolute -bottom-1 -right-1 w-7 h-7 rounded-full bg-orange-500 flex items-center justify-center cursor-pointer hover:bg-orange-400 shadow-lg">
            {uploading ? <span className="text-[9px] text-white">…</span> : <I.camera size={12} className="text-white" />}
            <input type="file" accept="image/*" className="hidden" onChange={handlePhotoUpload} />
          </label>}
        </div>
        <div className="text-xs text-stone-500 uppercase tracking-wider mb-1">Rank #{rank}</div>
        <div className="font-mono text-5xl font-bold" style={{ color: rank === 1 ? "#fbbf24" : rank <= 3 ? "#f97316" : "#fafaf9" }}>{entry.totalPts}</div>
        <div className="text-xs text-stone-500 uppercase tracking-wider">this series</div>
        {prevSum > 0 && <div className="text-sm text-blue-400 mt-1 font-mono">+{prevSum} prev = <span className="font-bold text-stone-200">{entry.lifetimePts}</span> lifetime</div>}
      </div>
      {prevSum > 0 && seriesNames.length > 0 && <Card className="p-3">
        <div className="text-[10px] text-stone-500 uppercase tracking-wider font-semibold mb-2">Previous Series</div>
        <div className="space-y-1">
          {seriesNames.map(sn => (
            <div key={sn} className="flex justify-between text-sm">
              <span className="text-stone-400">{sn}</span>
              <span className="font-mono text-stone-200">{playerSeriesPts[sn] || 0}</span>
            </div>
          ))}
          {legacyPrev > 0 && <div className="flex justify-between text-sm"><span className="text-stone-400">Legacy</span><span className="font-mono text-stone-200">{legacyPrev}</span></div>}
          <div className="border-t border-stone-800 pt-1 flex justify-between text-sm font-semibold">
            <span className="text-stone-300">Total prev</span><span className="font-mono text-blue-400">{prevSum}</span>
          </div>
        </div>
      </Card>}
      <div className="grid grid-cols-2 gap-2">
        <Card className="p-3"><div className="text-[10px] text-stone-500 uppercase tracking-wider mb-1">Match</div><div className="font-mono text-2xl font-bold text-stone-100">{entry.breakdown.matchPts}</div></Card>
        <Card className="p-3"><div className="text-[10px] text-stone-500 uppercase tracking-wider mb-1">Knockout</div><div className="font-mono text-2xl font-bold text-red-400">{entry.breakdown.knockoutPts}</div></Card>
        <Card className="p-3"><div className="text-[10px] text-stone-500 uppercase tracking-wider mb-1">Top of Group</div><div className="font-mono text-2xl font-bold text-amber-400">+{entry.breakdown.topOfGroup}</div></Card>
        <Card className="p-3"><div className="text-[10px] text-stone-500 uppercase tracking-wider mb-1">🔥 Streak</div><div className="font-mono text-2xl font-bold text-orange-500">+{entry.breakdown.streakPts}</div></Card>
        {entry.breakdown.comebackPts > 0 && <Card className="p-3 col-span-2"><div className="text-[10px] text-stone-500 uppercase tracking-wider mb-1">↩️ Comeback</div><div className="font-mono text-2xl font-bold text-blue-400">+{entry.breakdown.comebackPts}</div></Card>}
      </div>
      <Card className="p-3">
        <div className="grid grid-cols-2 gap-3 text-sm">
          <div><span className="text-stone-500">Sessions: </span><span className="text-stone-200 font-mono">{entry.stats.sessionsPlayed}</span></div>
          <div><span className="text-stone-500">Total Wins: </span><span className="text-stone-200 font-mono font-bold">{entry.stats.groupWins + entry.stats.qfWins + entry.stats.sfWins + entry.stats.finalsWon}</span></div>
          <div><span className="text-stone-500">Group: </span><span className="text-stone-200 font-mono">{entry.stats.groupWins}W / {entry.stats.groupPlayed}P</span></div>
          <div><span className="text-stone-500">QF: </span><span className="text-stone-200 font-mono">{entry.stats.qfWins}W / {entry.stats.qfReached}P</span></div>
          <div><span className="text-stone-500">SF: </span><span className="text-stone-200 font-mono">{entry.stats.sfWins}W / {entry.stats.sfReached}P</span></div>
          <div><span className="text-stone-500">🏆 / 🥈: </span><span className="text-amber-400 font-mono font-bold">{entry.stats.finalsWon} / {entry.stats.finalsReached - entry.stats.finalsWon}</span></div>
        </div>
      </Card>
      {lockedNames.length > 0 && <Card className="p-3" style={{ borderColor: "rgba(220, 38, 38, 0.3)" }}>
        <div className="flex items-center gap-2 mb-2"><I.lock size={14} className="text-red-400" /><div className="text-xs text-red-400 uppercase tracking-wider font-bold">Loyalty Lockout</div></div>
        <div className="text-xs text-stone-400 mb-2">Won with — can't pair again:</div>
        <div className="flex flex-wrap gap-1">{lockedNames.map(n => <Pill key={n} color="red">{n}</Pill>)}</div>
      </Card>}
      {(() => {
        const rivals = calcRivals(playerId, state.sessions);
        if (rivals.length === 0) return null;
        return (
          <Card className="p-3">
            <div className="text-[10px] text-stone-500 uppercase tracking-wider font-semibold mb-2">⚔️ Rivalries</div>
            <div className="space-y-1.5">
              {rivals.map(r => {
                const opp = state.players.find(p => p.id === r.id);
                if (!opp) return null;
                const rate = Math.round((r.wins / r.total) * 100);
                return (
                  <div key={r.id} className="flex items-center gap-2 text-sm">
                    <span className="flex-1 text-stone-300 truncate">{opp.name}</span>
                    <span className="font-mono text-emerald-400">{r.wins}W</span>
                    <span className="text-stone-600">/</span>
                    <span className="font-mono text-red-400">{r.losses}L</span>
                    <span className="text-[10px] text-stone-500 w-8 text-right">{rate}%</span>
                  </div>
                );
              })}
            </div>
          </Card>
        );
      })()}
      {(() => {
        const earned = getMilestones(entry);
        if (earned.length === 0) return null;
        return (
          <Card className="p-3">
            <div className="text-[10px] text-stone-500 uppercase tracking-wider font-semibold mb-2">🏅 Badges</div>
            <div className="flex flex-wrap gap-2">
              {earned.map(m => (
                <div key={m.id} title={m.desc} className="flex items-center gap-1 px-2 py-1 rounded-full text-xs font-semibold border border-stone-700 bg-stone-900/40 text-stone-300">
                  <span>{m.icon}</span><span>{m.label}</span>
                </div>
              ))}
            </div>
          </Card>
        );
      })()}
      <Btn variant="secondary" className="w-full" onClick={() => {
        const txt = generatePlayerCard(entry, state);
        navigator.clipboard?.writeText(txt);
        alert("Player card copied! Paste it in WhatsApp.");
      }}>📜 Copy My Player Card</Btn>
    </div>
  </Modal>;
}

function SettingsView({ state, update, setTab, logout }) {
  const [showExp, setShowExp] = useState(false);
  const [syncing, setSyncing] = useState(false);
  const [syncMsg, setSyncMsg] = useState(null);

  const syncJuneFury = async () => {
    setSyncing(true); setSyncMsg(null);
    try {
      const r = await fetch("/jf-leaderboard");
      const d = await r.json();
      if (!d.ok) throw new Error(d.error || "Failed");
      const map = {};
      d.standings.forEach(e => { if (e.pts > 0) map[e.id] = e.pts; });
      let matched = 0;
      update(s => ({
        ...s,
        players: s.players.map(p => {
          const pts = map[p.id];
          if (pts === undefined) return p;
          matched++;
          return { ...p, prevSeriesPts: { ...(p.prevSeriesPts || {}), "June Fury": pts } };
        })
      }));
      setSyncMsg(`✓ Synced ${Object.keys(map).length} June Fury players`);
    } catch (e) {
      setSyncMsg("Error: " + e.message);
    }
    setSyncing(false);
  };

  return (
    <div className="space-y-4">
      <h2 className="font-display text-3xl text-stone-100">SETTINGS</h2>
      <Card className="p-4 space-y-3">
        <div><label className="text-xs text-stone-400 uppercase tracking-wider font-semibold mb-1 block">Season Name</label><Input value={state.seasonName} onChange={v => update(s => ({ ...s, seasonName: v }))} /></div>
        <div><label className="text-xs text-stone-400 uppercase tracking-wider font-semibold mb-1 block">Subtitle</label><Input value={state.seasonSubtitle || ""} onChange={v => update(s => ({ ...s, seasonSubtitle: v }))} /></div>
        <div><label className="text-xs text-stone-400 uppercase tracking-wider font-semibold mb-1 block">Tagline</label><Input value={state.seasonTagline} onChange={v => update(s => ({ ...s, seasonTagline: v }))} /></div>
      </Card>
      <Card className="p-4">
        <h3 className="font-display text-lg text-stone-200 mb-3">POINT SYSTEM</h3>
        <div className="space-y-2 text-sm">
          <div className="flex justify-between"><span className="text-stone-300">✅ Win</span><span className="font-mono text-emerald-400">+3</span></div>
          <div className="flex justify-between"><span className="text-stone-300">🎯 Tiebreak Loss</span><span className="font-mono text-amber-400">+2</span></div>
          <div className="flex justify-between"><span className="text-stone-300">🤝 Competitive Loss</span><span className="font-mono text-orange-400">+1</span></div>
          <div className="flex justify-between"><span className="text-stone-300">❌ 6-0/6-1 Loss</span><span className="font-mono text-stone-500">0</span></div>
          <div className="border-t border-stone-800 my-2" />
          <div className="flex justify-between"><span className="text-stone-300">🥇 Top of Group</span><span className="font-mono text-amber-400">+1</span></div>
          <div className="flex justify-between"><span className="text-stone-300">🎯 Reach QF</span><span className="font-mono text-orange-400">+1 + match</span></div>
          <div className="flex justify-between"><span className="text-stone-300">🔥 Reach SF</span><span className="font-mono text-orange-400">+2 + match</span></div>
          <div className="flex justify-between"><span className="text-stone-300">⚔️ Reach Final</span><span className="font-mono text-red-400">+3 + match</span></div>
          <div className="flex justify-between"><span className="text-stone-300">🏆 Win Final</span><span className="font-mono text-amber-400 font-bold">+5 bonus</span></div>
          <div className="border-t border-stone-800 my-2" />
          <div className="flex justify-between"><span className="text-stone-300">🔥 Streak Max</span><span className="font-mono text-orange-500 font-bold">+5</span></div>
          <div className="flex justify-between"><span className="text-stone-300">↩️ Comeback (miss 2+)</span><span className="font-mono text-blue-400 font-bold">+2</span></div>
        </div>
      </Card>
      <Card className="p-4">
        <h3 className="font-display text-lg text-stone-200 mb-3">PREVIOUS SERIES</h3>
        <div className="text-[10px] text-stone-500 mb-3">Series listed here appear as separate point inputs per player in the all-time leaderboard.</div>
        <div className="space-y-2 mb-3">
          {(state.prevSeriesNames || []).map((sn, idx) => (
            <div key={idx} className="flex items-center gap-2">
              <Input value={sn} onChange={v => update(s => { const a = [...(s.prevSeriesNames || [])]; a[idx] = v; return { ...s, prevSeriesNames: a }; })} className="flex-1" />
              <button onClick={() => update(s => { const a = (s.prevSeriesNames || []).filter((_, i) => i !== idx); return { ...s, prevSeriesNames: a }; })} className="p-1.5 rounded-lg text-stone-500 hover:text-red-400 hover:bg-red-950/30"><I.trash size={14} /></button>
            </div>
          ))}
        </div>
        <Btn size="sm" variant="secondary" onClick={() => update(s => ({ ...s, prevSeriesNames: [...(s.prevSeriesNames || []), "New Series"] }))}><I.plus size={12} /> Add Series</Btn>
      </Card>
      <Card className="p-4">
        <h3 className="font-display text-lg text-stone-200 mb-3">SYNC</h3>
        <div className="text-xs text-stone-500 mb-3">Pull final June Fury standings into each player's all-time points. Safe to run multiple times — overwrites the "June Fury" entry.</div>
        <Btn variant="secondary" className="w-full" onClick={syncJuneFury} disabled={syncing}>
          {syncing ? "Syncing…" : "⚡ Sync June Fury Points"}
        </Btn>
        {syncMsg && <div className={`text-xs mt-2 font-semibold ${syncMsg.startsWith("Error") ? "text-red-400" : "text-emerald-400"}`}>{syncMsg}</div>}
      </Card>
      <Card className="p-4">
        <h3 className="font-display text-lg text-stone-200 mb-3">PUBLIC LINK</h3>
        <div className="text-xs text-stone-500 mb-3">Share a read-only leaderboard — no login required. Works on any device.</div>
        <Btn variant="secondary" className="w-full" onClick={() => {
          const url = window.location.origin + window.location.pathname + "?public";
          navigator.clipboard?.writeText(url);
          alert("Copied: " + url);
        }}>🔗 Copy Public Leaderboard URL</Btn>
      </Card>
      <Card className="p-4">
        <h3 className="font-display text-lg text-stone-200 mb-3">DATA</h3>
        <div className="space-y-2">
          <Btn variant="secondary" className="w-full" onClick={() => setShowExp(true)}><I.download size={14} /> Export JSON</Btn>
          <Btn variant="ghost" className="w-full" onClick={logout}>Sign out of organizer mode</Btn>
        </div>
      </Card>
      <button onClick={() => setTab("dashboard")} className="w-full py-3 text-sm text-stone-500">← Back to Dashboard</button>
      {showExp && <Modal open={true} onClose={() => setShowExp(false)} title="EXPORT">
        <div className="space-y-3"><div className="text-xs text-stone-400">Copy to back up:</div>
          <textarea readOnly value={JSON.stringify(state, null, 2)} rows={10} className="w-full bg-stone-900 border border-stone-700 rounded-lg px-3 py-2.5 text-stone-100 font-mono text-xs" />
          <Btn className="w-full" onClick={() => navigator.clipboard?.writeText(JSON.stringify(state, null, 2))}>Copy</Btn>
        </div></Modal>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<script>
// Runtime comic forcer — patches inline styles React applies
(function(){
  const INK = '#0B0814', CREAM = '#FFF7E8', YELLOW = '#FFE03D', RED = '#FF2E9A', ORANGE = '#FF6A1E', BLUE = '#29E0FF';
  
  // Patch elements with known inline style patterns
  function patch(el){
    const s = el.style;
    if(!s) return;
    // Never touch jh- brand elements
    if(el.className && typeof el.className === 'string' && el.className.includes('jh-')) return;
    if(el.closest && el.closest('.jh-hero,.jh-caption,.jh-chip,.jh-pool,.jh-strip,.jh-flag,.jh-srow,.jh-lbrow')) return;
    const bg = s.background || s.backgroundColor || '';
    
    // surface → cream
    if(bg.includes('var(--surface)') || bg.includes('rgba(28, 25, 23') || bg.includes('rgba(28,25,23')){
      el.style.background = CREAM;
      el.style.border = '4px solid '+INK;
      el.style.boxShadow = '6px 6px 0 '+INK;
      el.style.borderRadius = '0';
    }
    // stone-900 rows
    if(bg.includes('rgba(28, 25, 23, 0.4)') || bg.includes('rgba(28,25,23,0.4)') || bg.includes('rgba(20, 18, 16') || bg.includes('rgba(20,18,16')){
      el.style.background = 'rgba(240,233,216,0.9)';
      el.style.border = '2px solid '+INK;
      el.style.borderRadius = '0';
    }
    // streak cells (dark)
    if(bg.includes('rgba(28, 25, 23, 0.8)') || bg.includes('rgba(28,25,23,0.8)')){
      el.style.background = CREAM;
      el.style.border = '4px solid '+INK;
      el.style.color = INK;
    }
    // double points 2X badge inside toggle
    if(bg.includes('var(--gold)') || bg.includes('#FFE03D')){
      el.style.border = '2px solid '+INK;
      el.style.borderRadius = '0';
    }
  }
  
  const obs = new MutationObserver(muts => {
    muts.forEach(m => m.addedNodes.forEach(n => {
      if(n.nodeType !== 1) return;
      patch(n);
      n.querySelectorAll('*').forEach(patch);
    }));
  });
  obs.observe(document.body, {childList:true, subtree:true});
  
  // Also patch existing after load
  setTimeout(()=>document.querySelectorAll('*').forEach(patch), 600);
  setTimeout(()=>document.querySelectorAll('*').forEach(patch), 1500);
})();
</script>
