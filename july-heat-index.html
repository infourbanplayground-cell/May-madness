const { useState, useEffect, useMemo, useRef } = React;

// 🔌 API CLIENT — Cloudflare Worker auth + storage proxy

// ═══════════════════════════════════════════════════════════════
const WORKER_URL = ""; // API served from same origin (urbanpadel.om)

const LOCAL_KEY = "july-heat-state-v1";
const ADMIN_KEY = "july-heat-admin";
const TOKEN_KEY = "july-heat-token";

function getToken() { try { return localStorage.getItem(TOKEN_KEY) || ""; } catch (e) { return ""; } }
function setToken(t) { try { t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); } catch (e) {} }

// Merge a photos map { playerId: dataUrl } into a players array
function mergePhotos(players, photos) {
  return (players || []).map(p => ({ ...p, photoUrl: photos[p.id] || p.photoUrl || "" }));
}

// Extract changed photos from players (only data: URLs)
function extractPhotos(players) {
  const out = {};
  (players || []).forEach(p => { if (p.photoUrl?.startsWith("data:")) out[p.id] = p.photoUrl; });
  return out;
}

async function uploadPhotoToServer(playerId, dataUrl) {
  const token = getToken();
  if (!token || !dataUrl?.startsWith("data:")) return;
  try {

// Read latest state. Returns { ok, state } shape for existing callers.
async function apiGet(action, params = {}) {
  if (action === "unlock") {
    const res = await fetch(WORKER_URL + "/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ pin: String(params.pin) }),
    });
    if (!res.ok) return { ok: false };
    const data = await res.json().catch(() => ({}));
    if (data.ok && data.token) { setToken(data.token); return { ok: true, role: data.role }; }
    return { ok: false };
  }
  if (action === "ping") return { ok: true };
  // Load state and photos in parallel
  const [stateRes, photosRes] = await Promise.all([
    fetch(WORKER_URL + "/state", { method: "GET" }),
    fetch(WORKER_URL + "/photos", { method: "GET" }),
  ]);
  if (!stateRes.ok) throw new Error("Load failed (" + stateRes.status + ")");
  const data = await stateRes.json();
  if (!data.ok) throw new Error(data.error || "Load failed");
  const photosData = photosRes.ok ? await photosRes.json().catch(() => ({})) : {};
  const photos = photosData.photos || {};
  const base = initState();
  const raw = data.state;
  const loaded = (raw && raw.players) ? { ...base, ...raw } : base;
  loaded.players = mergePhotos(loaded.players, photos);
  return { ok: true, state: loaded };
}

// Write state and photos to the server (requires a valid token).
async function apiPost(body) {
  if (body.action !== "saveState") return { ok: true };
  const token = getToken();
  if (!token) throw new Error("Sign in to save");

  // Save state (API strips base64 photos server-side too)
  const saveRes = await fetch(WORKER_URL + "/save", {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
    body: JSON.stringify({ state: body.state }),
  });
  if (saveRes.status === 401) { setToken(""); throw new Error("Session expired — sign in again"); }
  if (!saveRes.ok) {
    const errData = await saveRes.json().catch(() => ({}));
    throw new Error(errData.error || "Save failed (" + saveRes.status + ")");
  }

  // Save any base64 photos separately
  const photos = extractPhotos(body.state?.players);

function levenshtein(a, b) {
  const m = a.length, n = b.length;
  const dp = Array.from({length: m+1}, (_, i) => Array.from({length: n+1}, (_, j) => i || j));
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++)
    dp[i][j] = a[i-1] === b[j-1] ? dp[i-1][j-1] : 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
  return dp[m][n];
}
function fuzzyMatch(name, candidates, threshold = 3) {
  const nl = name.toLowerCase();
  let best = null, bestDist = Infinity;
  for (const c of candidates) { const d = levenshtein(nl, c.toLowerCase()); if (d < bestDist) { bestDist = d; best = c; } }
  return bestDist <= threshold && bestDist > 0 ? { match: best, dist: bestDist } : null;
}
function parseWhatsAppNames(text) {
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  const waPattern = /^\d{1,2}[\/\-.]\d{1,2}[\/\-.]\d{2,4},? \d{1,2}:\d{2}(?::\d{2})?(?: [AP]M)? [-–] (.+?): /;
  const systemKw = ['end-to-end','changed','added','removed','left','created','pinned','security code','joined using','using this link','number changed'];
  const isWA = lines.some(l => waPattern.test(l));
  const names = new Set();
  if (isWA) {
    lines.forEach(l => {
      const m = l.match(waPattern);
      if (!m) return;
      const sender = m[1].trim();
      if (sender.startsWith('+') || sender.match(/^\d/)) return;
      const body = l.slice(m[0].length).toLowerCase();
      if (systemKw.some(k => body.startsWith(k) || sender.toLowerCase().includes(k))) return;
      names.add(sender);
    });
  } else {
    lines.forEach(l => { if (l.length > 1 && l.length < 60 && !/^\+?\d[\d\s\-()]+$/.test(l)) names.add(l); });
  }
  return [...names];
}
function parseTeamsFromText(text) {
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  const waPattern = /^\d{1,2}[\/\-.]\d{1,2}[\/\-.]\d{2,4},? \d{1,2}:\d{2}(?::\d{2})?(?: [AP]M)? [-–] (.+?): (.*)/;
  const teams = [];
  const parsePair = (line) => {
    line = line.replace(/^(?:team|فريق)\s*\d+\s*[:\-]\s*/i, '').replace(/^\d+[\.\-\)]\s*/, '').trim();
    for (const sep of [' & ', ' / ', ' – ', ' - ', ' + ', ' vs ', ', ', '&', '/', '+']) {
      const idx = line.indexOf(sep);
      if (idx < 1) continue;
      const n1 = line.slice(0, idx).trim(), n2 = line.slice(idx + sep.length).trim();
      if (n1.length > 1 && n2.length > 1 && n1.length < 60 && n2.length < 60) return [n1, n2];
    }
    return null;
  };
  if (lines.some(l => waPattern.test(l))) {
    lines.forEach(l => { const m = l.match(waPattern); if (!m) return; const p = parsePair(m[2]); if (p) teams.push(p); });
  } else {
    lines.forEach(l => { const p = parsePair(l); if (p) teams.push(p); });
  }
  return teams;
}

function resolvePlayer(name, players) {
  const exact = players.find(p => p.name.toLowerCase() === name.toLowerCase());
  if (exact) return exact;
  const f = fuzzyMatch(name, players.map(p => p.name), 3);
  return f ? players.find(p => p.name === f.match) : null;
}

// ─── Smart partial-name matching (players write short names on WhatsApp) ───
function normName(s) {
  return (s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/[^a-z0-9\s]/g, " ").replace(/\s+/g, " ").trim();
}
function scoreNameMatch(input, fullName) {
  const a = normName(input), b = normName(fullName);
  if (!a || !b) return 0;
  if (a === b) return 100;
  const at = a.split(" "), bt = b.split(" ");
  if (b.startsWith(a + " ")) return 96;          // "ahmed" → "ahmed al wahaibi"
  if (a.startsWith(b + " ")) return 93;          // "ahmed al wahaibi extra" → "ahmed al"
  if (at[0] === bt[0]) {                          // first name exact
    if (at[1]) return bt.some((t, i) => i > 0 && (t.startsWith(at[1]) || at[1].startsWith(t))) ? 90 : 68;
    return 80;
  }
  // any token prefix overlap (handles "moh" → "mohammed")
  let tokenHit = false;
  for (const x of at) if (x.length >= 3 && bt.some(y => y.startsWith(x) || x.startsWith(y))) tokenHit = true;
  if (tokenHit) return 62;
  const d0 = levenshtein(at[0], bt[0]);           // typo in first name
  if (d0 === 0) return 78;
  if (d0 === 1) return 56;
  if (d0 === 2 && at[0].length >= 4) return 44;
  const dd = levenshtein(a, b);                   // typo in whole string
  if (dd <= 2) return 48;
  if (dd <= 3) return 34;
  return 0;
}
function resolvePlayerSmart(name, players) {
  const scored = players.map(p => ({ player: p, score: scoreNameMatch(name, p.name) }))
    .filter(s => s.score > 0).sort((a, b) => b.score - a.score);
  if (!scored.length) return { player: null, candidates: [], ambiguous: false };
  const best = scored[0];
  // ambiguous when 2+ strong matches are within 8 pts (e.g. two "Ahmed"s)
  const close = scored.filter(s => best.score - s.score <= 8 && s.score >= 60);
  return { player: best.player, score: best.score, candidates: scored.slice(0, 5).map(s => s.player), ambiguous: close.length > 1 };
}

function getSessionGroups(session) {
  return GROUPS.slice(0, session?.groupCount || 4);

function resizeToBase64(file, size = 200) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const canvas = document.createElement("canvas");
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext("2d");
      const s = Math.min(img.width, img.height);
      const ox = (img.width - s) / 2, oy = (img.height - s) / 2;
      ctx.drawImage(img, ox, oy, s, s, 0, 0, size, size);
      resolve(canvas.toDataURL("image/jpeg", 0.65));
    };
    img.onerror = reject;
    img.src = url;
  });
}
function resizePhotoToBase64(file, maxW = 900) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const scale = Math.min(1, maxW / img.width);
      const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL("image/jpeg", 0.72));
    };
    img.onerror = reject;
    img.src = url;
  });
}

function getPlayerTeam(s, pid) { return (s.teams || []).find(t => t.p1Id === pid || t.p2Id === pid); }
function teamWon(m, tid) { if (!m || !m.winner) return false; if (m.winner === "team1") return m.team1Id === tid; if (m.winner === "team2") return m.team2Id === tid; return false; }

function calcGroupStandings(session, group) {
  const teams = (session.teams || []).filter(t => t.group === group);
  const matchList = session.groupMatches || [];
  const rows = teams.map(team => {
    let pts = 0, wins = 0, played = 0, gf = 0, ga = 0;
    matchList.forEach(m => {
      if (m.team1Id !== team.id && m.team2Id !== team.id) return;
      if (!m.winner) return;
      played++;
      const isT1 = m.team1Id === team.id;
      if (m.score) { gf += isT1 ? m.score.t1 : m.score.t2; ga += isT1 ? m.score.t2 : m.score.t1; }
      if (teamWon(m, team.id)) { pts += 3; wins++; }
      else { const t = m.lossType || "tiebreak"; if (t === "tiebreak") pts += 2; else if (t === "competitive") pts += 1; }
    });
    return { team, pts, wins, played, gf, ga, gd: gf - ga };
  });
  // h2h wins map
  const h2h = {};
  matchList.forEach(m => {
    if (!m.winner) return;
    const wid = m.winner === "team1" ? m.team1Id : m.team2Id;
    const lid = m.winner === "team1" ? m.team2Id : m.team1Id;
    if (!h2h[wid]) h2h[wid] = {};
    h2h[wid][lid] = (h2h[wid][lid] || 0) + 1;
  });
  return rows.sort((a, b) => {
    if (b.pts !== a.pts) return b.pts - a.pts;
    if (b.gd !== a.gd) return b.gd - a.gd;
    const aH = (h2h[a.team.id]?.[b.team.id] || 0) - (h2h[b.team.id]?.[a.team.id] || 0);
    if (aH !== 0) return -aH; // positive = a beat b more → a higher
    return b.gf - a.gf;
  });
}

function scoreToResult(s1, s2) {
  if (s1 === s2 || (s1 === null || s2 === null)) return { winner: null, lossType: null };
  const [winScore, loseScore] = s1 > s2 ? [s1, s2] : [s2, s1];
  const lossType = (loseScore <= 1) ? "blowout" : (loseScore === 5) ? "tiebreak" : "competitive";
  return { winner: s1 > s2 ? "team1" : "team2", lossType, score: { t1: s1, t2: s2 } };
}

function getTopOfGroup(s, g) { const ov = s.topOfGroupOverride && s.topOfGroupOverride[g]; if (ov) return ov; const r = calcGroupStandings(s, g); return r[0]?.team?.id || null; }

// Returns standings for a group, dropping each team's lowest match for 5-team groups
// so the 3rd-place comparison is fair across differently-sized groups.
function calcGroupStandingsNormalized(session, group) {
  const teams = (session.teams || []).filter(t => t.group === group);
  const matchList = session.groupMatches || [];
  if (teams.length !== 5) return calcGroupStandings(session, group);
  const rows = teams.map(team => {
    const myMatches = matchList.filter(m => (m.team1Id === team.id || m.team2Id === team.id) && m.winner);
    const scored = myMatches.map(m => {
      const isT1 = m.team1Id === team.id;
      const pts = teamWon(m, team.id) ? 3 : (m.lossType === "tiebreak" ? 2 : m.lossType === "competitive" ? 1 : 0);
      return { pts, gf: m.score ? (isT1 ? m.score.t1 : m.score.t2) : 0, ga: m.score ? (isT1 ? m.score.t2 : m.score.t1) : 0, w: teamWon(m, team.id) ? 1 : 0 };
    });
    if (scored.length > 4) { scored.sort((a, b) => a.pts - b.pts); scored.shift(); }
    let pts = 0, wins = 0, gf = 0, ga = 0;
    scored.forEach(s => { pts += s.pts; wins += s.w; gf += s.gf; ga += s.ga; });
    return { team, pts, wins, played: scored.length, gf, ga, gd: gf - ga };
  });
  return rows.sort((a, b) => b.pts - a.pts || b.gd - a.gd || b.gf - a.gf || b.wins - a.wins);
}

// Equalizes 3rd-place entries for cross-group comparison by adding ghost BYE wins
// (+3 pts each) for teams in smaller groups to normalize to the largest group's match count.
function equalizeThirds(thirds, session) {
  const groups = getSessionGroups(session);
  const groupSizes = {};
  groups.forEach(g => { groupSizes[g] = (session.teams || []).filter(t => t.group === g).length; });
  const maxPerTeam = Math.max(...Object.values(groupSizes)) - 1;
  return thirds.map(t => {
    const g = (session.teams || []).find(tm => tm.id === t.id)?.group;
    const missing = maxPerTeam - ((groupSizes[g] || maxPerTeam + 1) - 1);
    // Ghost BYE win: +1 win, +6 games for (notional 6-0), +6 GD
    return { ...t, wins: t.wins + missing, gd: (t.gd || 0) + missing * 6, gf: (t.gf || 0) + missing * 6, ghostWins: missing };
  });
}

// Compare two thirds entries: wins → GD → GF (padel tiebreaker order)
function compareThirds(a, b) {
  return b.wins - a.wins || b.gd - a.gd || b.gf - a.gf;
}

function calcStreak(idxs) {
  if (!idxs?.length) return 0;
  const sorted = [...idxs].sort((a, b) => a - b);
  let total = 0, len = 0, last = null;
  for (const i of sorted) {
    if (last === null || i === last + 1) len++; else len = 1;
    last = i;
    // len=1: no bonus (first session alone doesn't count)
    // len=2: +1, len=3: +1, len=4: jackpot +3
    if (len === 2 || len === 3) total += 1;
    else if (len >= 4) total += 3;
  }
  return Math.min(total, 5);
}

function koMatchPts(match, teamId) {
  if (teamWon(match, teamId)) return 3;
  const t = match.lossType || "tiebreak";
  return t === "tiebreak" ? 2 : t === "competitive" ? 1 : 0;
}

function calcPlayerStats(pid, sessions) {
  let total = 0;
  const breakdown = { matchPts: 0, topOfGroup: 0, knockoutPts: 0, streakPts: 0, comebackPts: 0 };
  const stats = { groupWins: 0, groupPlayed: 0, sessionsPlayed: 0, qfReached: 0, qfWins: 0, sfReached: 0, sfWins: 0, finalsReached: 0, finalsWon: 0 };
  const attended = [];
  const partners = {};
  sessions.forEach((s, idx) => {
    const team = getPlayerTeam(s, pid); if (!team) return;
    stats.sessionsPlayed++;
    const partnerId = team.p1Id === pid ? team.p2Id : team.p1Id;
    partners[partnerId] = (partners[partnerId] || 0) + 1;
    // 2X Double Points (applies to everything except streak)
    const mult = s.doublePoints ? 2 : 1;
    let sessionPlayed = 0;
    (s.groupMatches || []).forEach(m => {
      if (m.team1Id !== team.id && m.team2Id !== team.id) return;
      if (!m.winner) return; stats.groupPlayed++; sessionPlayed++;
      if (teamWon(m, team.id)) { total += 3 * mult; breakdown.matchPts += 3 * mult; stats.groupWins++; }
      else { const t = m.lossType || "tiebreak"; const p = t === "tiebreak" ? 2 : t === "competitive" ? 1 : 0; total += p * mult; breakdown.matchPts += p * mult; }
    });
    // Only award top-of-group if team actually played matches
    if (sessionPlayed > 0 && getTopOfGroup(s, team.group) === team.id) { total += 1 * mult; breakdown.topOfGroup += 1 * mult; }
    // Only count streak if player actually played a match this session
    if (sessionPlayed > 0) {
      // Comeback bonus: +2 for returning after missing 2+ consecutive sessions
      if (attended.length > 0 && (idx - attended[attended.length - 1]) >= 3) {
        total += 2; breakdown.comebackPts += 2;
      }
      attended.push(idx);
    }
    const qfM = s.bracket?.qf?.find(m => (m.team1Id === team.id || m.team2Id === team.id) && m.winner);
    if (qfM) { stats.qfReached++; if (teamWon(qfM, team.id)) stats.qfWins++; const qp = (1 + koMatchPts(qfM, team.id)) * mult; total += qp; breakdown.knockoutPts += qp; }
    const sfM = s.bracket?.sf?.find(m => (m.team1Id === team.id || m.team2Id === team.id) && m.winner);
    if (sfM) { stats.sfReached++; if (teamWon(sfM, team.id)) stats.sfWins++; const sp = (2 + koMatchPts(sfM, team.id)) * mult; total += sp; breakdown.knockoutPts += sp; }
    const f = s.bracket?.final;
    if (f && (f.team1Id === team.id || f.team2Id === team.id) && f.winner) {
      stats.finalsReached++;
      const fp = (3 + koMatchPts(f, team.id) + (teamWon(f, team.id) ? 5 : 0)) * mult;
      total += fp; breakdown.knockoutPts += fp;
      if (teamWon(f, team.id)) stats.finalsWon++;
    }
  });
  const streak = calcStreak(attended); total += streak; breakdown.streakPts = streak;
  return { totalPts: total, breakdown, stats, attended, partners };
}

function getLockedPartners(pid, sessions) {
  const locked = new Set();
  sessions.forEach(s => {
    const team = getPlayerTeam(s, pid); if (!team) return;
    const partnerId = team.p1Id === pid ? team.p2Id : team.p1Id;
    // Lock only if they WON the final together (session champions)
    const wonFinal = s.bracket?.final && teamWon(s.bracket.final, team.id);
    if (wonFinal) locked.add(partnerId);
  });
  return locked;
}

      <img src="assets/up-logo.png" alt="Urban Playground" className="light-logo" style={{ height: "100%", width: "auto", objectFit: "contain", filter: "drop-shadow(0 4px 12px rgba(249, 115, 22, 0.25))" }} />

// ═══════════════════════════════════════════════════════════════
// 🎨 UI PRIMITIVES
// ═══════════════════════════════════════════════════════════════
function Pill({ children, color = "orange" }) {
  const bg = { orange:"var(--orange)", red:"var(--red)", amber:"var(--gold)", blue:"var(--blue)", stone:"rgba(255,247,232,.2)", green:"#1FD9C4" };
  const tc = { orange:"var(--cream)", red:"var(--cream)", amber:"var(--ink)", blue:"var(--ink)", stone:"var(--cream)", green:"var(--ink)" };
  return <span style={{display:"inline-flex",alignItems:"center",gap:4,padding:"3px 10px 1px",background:bg[color]||bg.orange,color:tc[color]||"var(--cream)",border:"3px solid var(--ink)",boxShadow:"3px 3px 0 var(--ink)",borderRadius:0,fontFamily:"'Bangers',cursive",fontSize:"14px",letterSpacing:"1px",whiteSpace:"nowrap"}}>{children}</span>;
}

function Btn({ children, onClick, variant = "primary", size = "md", className = "", disabled, type = "button" }) {
  const styles = {
    primary: { background:"var(--red)", color:"var(--cream)", border:"4px solid var(--ink)", boxShadow:"5px 5px 0 var(--ink)", borderRadius:0, fontFamily:"'Bangers',cursive", fontSize:"20px", letterSpacing:"2px", paddingTop:"10px", paddingBottom:"6px", paddingLeft:"20px", paddingRight:"20px" },
    secondary: { background:"var(--cream)", color:"var(--ink)", border:"4px solid var(--ink)", boxShadow:"4px 4px 0 var(--ink)", borderRadius:0, fontFamily:"'Bangers',cursive", fontSize:"18px", letterSpacing:"1.5px", paddingTop:"8px", paddingBottom:"4px", paddingLeft:"16px", paddingRight:"16px" },
    ghost: { background:"transparent", color:"var(--yellow)", border:"3px solid var(--yellow)", boxShadow:"4px 4px 0 var(--yellow)", borderRadius:0, fontFamily:"'Bangers',cursive", fontSize:"18px", letterSpacing:"1.5px", paddingTop:"8px", paddingBottom:"4px", paddingLeft:"16px", paddingRight:"16px" },
    danger: { background:"var(--red)", color:"var(--cream)", border:"4px solid var(--ink)", boxShadow:"4px 4px 0 var(--ink)", borderRadius:0, fontFamily:"'Bangers',cursive", fontSize:"18px", letterSpacing:"1.5px", paddingTop:"8px", paddingBottom:"4px", paddingLeft:"14px", paddingRight:"14px" },
    gold: { background:"var(--gold)", color:"var(--ink)", border:"4px solid var(--ink)", boxShadow:"5px 5px 0 var(--ink)", borderRadius:0, fontFamily:"'Bangers',cursive", fontSize:"20px", letterSpacing:"2px", paddingTop:"10px", paddingBottom:"6px", paddingLeft:"20px", paddingRight:"20px" },
  };
  return <button type={type} onClick={onClick} disabled={disabled} className={`inline-flex items-center justify-center gap-2 ${className}`} style={{...styles[variant]||styles.primary,opacity:disabled?.5:1,cursor:disabled?"not-allowed":"pointer",transition:"transform .1s, box-shadow .1s"}} onMouseEnter={e=>{if(!disabled){e.currentTarget.style.transform="translate(-2px,-2px)";e.currentTarget.style.boxShadow="7px 7px 0 var(--ink)";}}} onMouseLeave={e=>{e.currentTarget.style.transform="";e.currentTarget.style.boxShadow=styles[variant]?.boxShadow||"5px 5px 0 var(--ink)";}} onMouseDown={e=>{e.currentTarget.style.transform="translate(3px,3px)";e.currentTarget.style.boxShadow="0px 0px 0 var(--ink)";}} onMouseUp={e=>{e.currentTarget.style.transform="";e.currentTarget.style.boxShadow=styles[variant]?.boxShadow||"5px 5px 0 var(--ink)";}}>{children}</button>;
}

function Card({ children, className = "", onClick }) {
  return <div onClick={onClick} className={className} style={{background:"var(--cream)",border:"5px solid var(--ink)",boxShadow:"7px 7px 0 var(--ink)",borderRadius:0,color:"var(--ink)",cursor:onClick?"pointer":"default",transition:onClick?"transform .1s":undefined}} onMouseEnter={onClick?e=>{e.currentTarget.style.transform="translate(-2px,-2px)";e.currentTarget.style.boxShadow="9px 9px 0 var(--ink)";}:undefined} onMouseLeave={onClick?e=>{e.currentTarget.style.transform="";e.currentTarget.style.boxShadow="7px 7px 0 var(--ink)";}:undefined}>{children}</div>;
}

function Input({ value, onChange, placeholder, className = "", type = "text", autoFocus }) {
  return <input type={type} value={value || ""} onChange={e => onChange(e.target.value)} placeholder={placeholder} autoFocus={autoFocus} className={className} style={{width:"100%",background:"#fff",border:"4px solid var(--ink)",borderRadius:0,padding:"12px 14px",color:"var(--ink)",fontFamily:"'Archivo',sans-serif",fontSize:"16px",fontWeight:700,outline:"none"}} onFocus={e=>e.target.style.borderColor="var(--red)"} onBlur={e=>e.target.style.borderColor="var(--ink)"} />;
}

function Modal({ open, onClose, title, children }) {
  if (!open) return null;
  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4" onClick={onClose} style={{background:"rgba(11,8,20,.85)"}}>
      <div onClick={e => e.stopPropagation()} style={{position:"relative",width:"100%",maxWidth:520,background:"var(--cream)",border:"5px solid var(--ink)",boxShadow:"10px 10px 0 var(--ink)",borderRadius:0,maxHeight:"90vh",overflowY:"auto"}}>
        <div style={{position:"sticky",top:0,background:"var(--cream)",borderBottom:"4px solid var(--ink)",padding:"14px 20px",display:"flex",alignItems:"center",justifyContent:"space-between",zIndex:10}}>
          <h2 style={{fontFamily:"'Bangers',cursive",fontSize:"28px",letterSpacing:"2px",color:"var(--ink)"}}>{title}</h2>
          <button onClick={onClose} style={{background:"none",border:"none",cursor:"pointer",color:"var(--ink)",padding:4}}><I.x size={22} /></button>
        </div>
        <div style={{padding:20}}>{children}</div>
      </div>
    </div>
  );
}

function PlayerPicker({ players, value, onChange, exclude = [], placeholder = "Pick player" }) {
  const [open, setOpen] = useState(false);
  const [search, setSearch] = useState("");
  const ref = useRef();
  useEffect(() => { const h = e => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); }; document.addEventListener("mousedown", h); return () => document.removeEventListener("mousedown", h); }, []);
  const sel = players.find(p => p.id === value);
  const avail = players.filter(p => !exclude.includes(p.id) && (!search || p.name.toLowerCase().includes(search.toLowerCase())));
  return (
    <div className="relative" ref={ref}>
      <button type="button" onClick={() => setOpen(!open)} className="w-full bg-stone-900 border border-stone-700 rounded-lg px-3 py-2.5 text-left flex items-center justify-between">
        <span className={sel ? "text-stone-100" : "text-stone-500"}>{sel?.name || placeholder}</span>
        <I.chev size={16} className={`transition-transform ${open ? "rotate-90" : ""}`} />
      </button>
      {open && (
        <div className="absolute z-20 mt-1 w-full bg-stone-900 border border-stone-700 rounded-lg shadow-2xl max-h-64 overflow-y-auto">
          <div className="sticky top-0 bg-stone-900 p-2 border-b border-stone-800">
            <div className="relative">
              <I.search size={14} className="absolute left-2.5 top-1/2 -translate-y-1/2 text-stone-500" />
              <input autoFocus value={search} onChange={e => setSearch(e.target.value)} placeholder="Search…" className="w-full bg-stone-800 rounded-md pl-8 pr-2 py-1.5 text-sm text-stone-100 focus:outline-none" />
            </div>
          </div>
          {avail.length === 0 ? <div className="px-3 py-4 text-sm text-stone-500 text-center">No players found</div>
            : avail.map(p => <button key={p.id} type="button" onClick={() => { onChange(p.id); setOpen(false); setSearch(""); }} className="w-full text-left px-3 py-2 hover:bg-stone-800 text-stone-100 text-sm border-b border-stone-800/50 last:border-0">{p.name}</button>)}
        </div>
      )}
    </div>
  );
}

function Avatar({ player, size = 40, className = "" }) {
  const initials = (player.name || "?").split(" ").map(n => n[0]).join("").slice(0, 2).toUpperCase();
  const [imgErr, setImgErr] = useState(false);
  const border = Math.max(2, Math.round(size * 0.07));
  const commonStyle = { width: size, height: size, flexShrink: 0, border: `${border}px solid var(--ink)`, boxShadow: `${border}px ${border}px 0 var(--ink)`, borderRadius: 0 };
  if (player.photoUrl && !imgErr) {
    return <img src={player.photoUrl} alt={player.name} onError={() => setImgErr(true)}
      className={`object-cover shrink-0 ${className}`} style={{ ...commonStyle }} />;
  }
  return (
    <div className={`flex items-center justify-center shrink-0 font-bold ${className}`}
      style={{ ...commonStyle, background: "var(--ink)", color: "var(--cream)", fontSize: size * 0.35, fontFamily: "'Bangers',cursive", letterSpacing: "1px" }}>
      {initials}
    </div>
  );
}

function PublicLeaderboardPage({ state, leaderboard }) {
  const top = leaderboard.filter(e => e.stats.groupPlayed > 0 || e.stats.qfReached > 0);
  const rankColors = ["#FFC24B", "#c0c0c0", "#cd7f32"];
  return (
    <div className="min-h-screen" style={{ background: "var(--ink)" }}>
      <div className="court-motif" />
      <div className="max-w-2xl mx-auto px-4 py-6 pb-16">
        <div className="text-center mb-6">
          <div className="font-display text-4xl heat-grad" style={{ fontFamily: "'Bangers',cursive", letterSpacing: 3 }}>JULY HEAT</div>
          <div className="text-xs uppercase tracking-widest font-bold mt-1" style={{ color: "var(--blue)" }}>Vol. 5 · Series Standings</div>
        </div>
        {top.length === 0
          ? <div className="text-center text-stone-500 py-12">No standings yet</div>
          : <div className="space-y-2">
              {top.map((e, i) => {
                const badges = getMilestones(e).slice(0, 3);
                return (
                  <div key={e.player.id} style={{ background: "var(--cream)", border: "4px solid var(--ink)", boxShadow: `5px 5px 0 ${i < 3 ? rankColors[i] : "rgba(11,8,20,.35)"}`, padding: "12px 14px", display: "flex", alignItems: "center", gap: 12 }}>
                    <div style={{ width: 40, height: 40, flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center", background: i < 3 ? rankColors[i] : "#e5e0d8", border: "3px solid var(--ink)", fontFamily: "'Bangers',cursive", fontSize: 15, color: "var(--ink)" }}>
                      {i + 1}
                    </div>
                    <Avatar player={e.player} size={36} />
                    <div className="flex-1 min-w-0">
                      <div style={{ fontFamily: "'Bangers',cursive", fontSize: 18, color: "var(--ink)", letterSpacing: ".5px" }}>{e.player.name}</div>
                      <div style={{ fontSize: 10, color: "rgba(11,8,20,.6)", marginTop: 2 }}>
                        {e.stats.sessionsPlayed}s · {e.stats.groupWins + e.stats.qfWins + e.stats.sfWins + e.stats.finalsWon}W
                        {e.stats.finalsWon > 0 && ` · 🏆×${e.stats.finalsWon}`}
                        {badges.length > 0 && <span className="ml-1">{badges.map(b => b.icon).join("")}</span>}
                      </div>
                    </div>
                    <div style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: 26, fontWeight: 700, color: i < 3 ? rankColors[i] : "var(--ink)" }}>{e.totalPts}</div>
                  </div>

        <div className="text-center mt-8 text-xs text-stone-600 uppercase tracking-widest">heat.urbanpadel.om · Urban Playground Oman</div>
      </div>
    </div>
  );

function App() {
  const [state, setState] = useState(null);
  const [tab, setTab] = useState("dashboard");
  const [openSessionId, setOpenSessionId] = useState(null);
  const [openPlayerId, setOpenPlayerId] = useState(null);
  const [role, setRole] = useState(() => { const r = localStorage.getItem(ADMIN_KEY); return r === "yes" ? "admin" : (r === "admin" || r === "scorer") ? r : "guest"; });
  const isAdmin = role === "admin";
  const canScore = role === "admin" || role === "scorer";
  const [showLogin, setShowLogin] = useState(false);
  const [theme, setTheme] = useState(() => localStorage.getItem("jh-theme") || "dark");
  const [sync, setSync] = useState("idle");
  const [syncErr, setSyncErr] = useState("");
  const saveTimer = useRef();
  const pollTimer = useRef();
  const initialLoaded = useRef(false);
  const tapRef = useRef({ n: 0, t: 0 });

  useEffect(() => {
    const root = document.documentElement;
    if (theme === "light") root.classList.add("light"); else root.classList.remove("light");
    localStorage.setItem("jh-theme", theme);
    document.querySelector('meta[name="theme-color"]')?.setAttribute("content", theme === "light" ? "#FFF4EC" : "#0a0807");
  }, [theme]);

  // Secret sign-in: tap brand logo 5× within 2.5s
  const secretTap = () => {
    const now = Date.now();
    const r = tapRef.current;
    r.n = (now - r.t < 2500) ? r.n + 1 : 1;
    r.t = now;
    if (r.n >= 5) { r.n = 0; setShowLogin(true); }
  };

  useEffect(() => {
    (async () => {
      try {
        const res = await apiGet("getState");
        if (res?.ok && res.state) {
          setState(res.state);
          localStorage.setItem(LOCAL_KEY, JSON.stringify(res.state));
          setSync("idle");
          initialLoaded.current = true;
          document.getElementById("splash")?.remove();
          return;
        }
      } catch (e) { setSync("offline"); }
      try {
        const cached = localStorage.getItem(LOCAL_KEY);
        setState(cached ? JSON.parse(cached) : initState());
      } catch (e) { setState(initState()); }
      initialLoaded.current = true;
      document.getElementById("splash")?.remove();
    })();
  }, []);

  useEffect(() => {
    if (!state || !initialLoaded.current) return;
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify(state)); } catch (e) {}
    if (!canScore) return;
    clearTimeout(saveTimer.current);
    setSync("syncing");
    saveTimer.current = setTimeout(async () => {
      try { await apiPost({ action: "saveState", state }); setSync("idle"); setSyncErr(""); }
      catch (e) { setSync("error"); setSyncErr(e.message || "Unknown sync error"); }
    }, 3000);
  }, [state, canScore]);

  useEffect(() => {
    if (canScore) return;
    pollTimer.current = setInterval(async () => {
      try {
        const res = await apiGet("getState");
        if (res?.ok && res.state) {
          setState(s => (JSON.stringify(s) !== JSON.stringify(res.state) ? res.state : s));
          setSync("idle");
        }
      } catch (e) { setSync("offline"); }
    }, 30000);
    return () => clearInterval(pollTimer.current);
  }, [canScore]);

  const handleLogin = async (pin) => {
    try { const r = await apiGet("unlock", { pin }); if (r?.ok && r.role) { setRole(r.role); localStorage.setItem(ADMIN_KEY, r.role); setShowLogin(false); return true; } return false; }
    catch (e) { return false; }
  };
  const logout = () => { setRole("guest"); localStorage.removeItem(ADMIN_KEY); setToken(""); if (tab === "players" || tab === "settings") setTab("dashboard"); };

  if (!state) return null;

  const isPublicMode = new URLSearchParams(window.location.search).has("public");
  const update = (fn) => setState(s => fn({ ...s }));
  const updateSession = (sid, fn) => setState(s => ({ ...s, sessions: s.sessions.map(ss => ss.id === sid ? fn({ ...ss }) : ss) }));
  const leaderboard = state.players.map(p => {
    const s = calcPlayerStats(p.id, state.sessions);
    const prevSum = Object.values(p.prevSeriesPts || {}).reduce((a, b) => a + (Number(b) || 0), 0) + (p.prevSeriesPoints || 0);
    return { player: p, ...s, lifetimePts: s.totalPts + prevSum };
  }).sort((a, b) => b.totalPts - a.totalPts);
  const currentSession = state.sessions.find(s => s.id === openSessionId);

  if (isPublicMode) return <PublicLeaderboardPage state={state} leaderboard={leaderboard} />;

  const navTabs = [
    { id: "dashboard", icon: I.flame, label: "HOME" },
    { id: "sessions", icon: I.calendar, label: "SESSIONS" },
    { id: "leaderboard", icon: I.trophy, label: "RANK" },
    ...(isAdmin ? [{ id: "players", icon: I.users, label: "PLAYERS" }] : []),
  ];

  return (
    <div className="min-h-screen">
      <div className="court-motif" />
      <header className="sticky top-0 z-30 backdrop-blur-xl border-b border-stone-800/80" style={{ background: "rgba(10, 8, 7, 0.85)" }}>
        <div className="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
          <div className="flex items-center gap-3 min-w-0">
            <button onClick={secretTap} className="shrink-0" aria-label="Urban Playground"><UPLogo size={40} /></button>
            <div className="min-w-0">
              <div className="font-display text-2xl leading-none truncate heat-grad">{state.seasonName}</div>
              <div className="text-[10px] uppercase tracking-widest font-extrabold mt-0.5 truncate" style={{ color: "var(--blue)", letterSpacing: ".22em" }}>{state.seasonSubtitle || "Urban Playground"}</div>
            </div>
          </div>
          <div className="flex items-center gap-1 shrink-0">
            {canScore && <SyncIndicator status={sync} errMsg={syncErr} />}
            <button onClick={() => setTheme(t => t === "light" ? "dark" : "light")} className="text-stone-400 hover:text-orange-500 p-2" aria-label="Toggle theme">{theme === "light" ? <I.moon size={18} /> : <I.sun size={18} />}</button>
            {canScore && (
              <button onClick={() => isAdmin ? setTab("settings") : logout()} className="flex items-center gap-1.5 pl-2 pr-2.5 py-1.5 rounded-lg" style={{ background: isAdmin ? "rgba(255,94,30,.14)" : "rgba(51,161,255,.14)", border: `1px solid ${isAdmin ? "rgba(255,94,30,.3)" : "rgba(51,161,255,.3)"}` }} aria-label={isAdmin ? "Settings" : "Sign out scorer"}>
                {isAdmin ? <I.shield size={14} className="text-orange-400" /> : <I.whistle size={14} className="text-blue-400" />}
                <span className="text-[10px] font-bold uppercase tracking-wider" style={{ color: isAdmin ? "var(--orange-br)" : "var(--blue)" }}>{isAdmin ? "Admin" : "Scorer"}</span>
              </button>
            )}
          </div>
        </div>
      </header>

      <main className="max-w-3xl mx-auto px-4 py-4 pb-24">
        {tab === "dashboard" && <DashboardView state={state} leaderboard={leaderboard} setTab={setTab} setOpenSessionId={setOpenSessionId} isAdmin={isAdmin} />}
        {tab === "players" && isAdmin && <PlayersView state={state} update={update} setOpenPlayerId={setOpenPlayerId} isAdmin={isAdmin} />}
        {tab === "sessions" && <SessionsView state={state} update={update} setOpenSessionId={setOpenSessionId} isAdmin={isAdmin} leaderboard={leaderboard} />}
        {tab === "leaderboard" && <LeaderboardView leaderboard={leaderboard} state={state} setOpenPlayerId={setOpenPlayerId} />}
        {tab === "settings" && isAdmin && <SettingsView state={state} update={update} setTab={setTab} logout={logout} />}
      </main>

      <nav className="fixed bottom-0 inset-x-0 z-30 border-t border-stone-800/80 backdrop-blur-xl" style={{ background: "rgba(10, 8, 7, 0.92)" }}>
        <div className={`max-w-3xl mx-auto grid ${isAdmin ? "grid-cols-4" : "grid-cols-3"} px-2 py-1.5`}>
          {navTabs.map(t => {
            const A = t.icon;
            if (t.href) return (
              <a key={t.id} href={t.href} className="flex flex-col items-center gap-0.5 py-2 rounded-lg transition-colors text-stone-500 hover:text-orange-400" style={{textDecoration:"none"}}>
                <A size={20} /><span className="text-[10px] font-semibold tracking-wide uppercase">{t.label}</span>
              </a>
            );
            return <button key={t.id} onClick={() => setTab(t.id)} className={`flex flex-col items-center gap-0.5 py-2 rounded-lg transition-colors ${tab === t.id ? "" : "text-stone-500"}`} style={tab === t.id ? { color: "var(--orange-br)" } : {}}>
              <A size={20} /><span className="text-[10px] font-semibold tracking-wide uppercase">{t.label}</span>
            </button>;
          })}
        </div>
      </nav>

      {currentSession && <SessionDetail session={currentSession} state={state} isAdmin={isAdmin} canScore={canScore} onClose={() => setOpenSessionId(null)} updateSession={(fn) => updateSession(currentSession.id, fn)} update={update} deleteSession={() => { update(s => ({ ...s, sessions: s.sessions.filter(ss => ss.id !== currentSession.id) })); setOpenSessionId(null); }} leaderboard={leaderboard} />}
      {openPlayerId && <PlayerDetail playerId={openPlayerId} state={state} leaderboard={leaderboard} canScore={canScore} update={update} onClose={() => setOpenPlayerId(null)} />}
      {showLogin && <LoginModal onClose={() => setShowLogin(false)} onLogin={handleLogin} />}
    </div>
  );
}

function SyncIndicator({ status, errMsg }) {
  const map = { idle:{color:"#10b981",label:"Synced"}, syncing:{color:"#f59e0b",label:"Syncing"}, error:{color:"#ef4444",label:"Sync error"}, offline:{color:"#a8a29e",label:"Offline"} };
  const s = map[status] || map.idle;
  const onClick = () => { if (status === "error" && errMsg) alert("Sync error:\n\n" + errMsg); };
  return <div onClick={onClick} className={`flex items-center gap-1.5 text-[10px] uppercase font-semibold tracking-wider ${status === "error" ? "cursor-pointer" : ""}`} title={status === "error" ? (errMsg || s.label) : s.label}>
    <div className="w-2 h-2 rounded-full" style={{ background: s.color, boxShadow: `0 0 8px ${s.color}` }} />
    <span className="text-stone-500 hidden sm:inline">{s.label}</span>
  </div>;
}

function LoginModal({ onClose, onLogin }) {
  const [pin, setPin] = useState("");
  const [err, setErr] = useState("");
  const submit = async () => { setErr(""); const ok = await onLogin(pin); if (!ok) setErr("Wrong PIN"); };
  return <Modal open={true} onClose={onClose} title="STAFF SIGN-IN">
    <div className="space-y-3">
      <div className="text-xs text-stone-400">Enter your PIN to unlock editing.</div>
      <input autoFocus type="password" value={pin} onChange={e => setPin(e.target.value)} placeholder="••••" onKeyDown={e => e.key === "Enter" && submit()} className="w-full bg-stone-900 border border-stone-700 rounded-lg px-3 py-3 text-center text-2xl font-mono text-stone-100 tracking-widest focus:outline-none focus:border-orange-500" />
      {err && <div className="text-xs text-red-400 text-center">{err}</div>}
      <Btn className="w-full" onClick={submit}><I.unlock size={14} /> Unlock</Btn>
    </div>
  </Modal>;
}

            <div style={{ fontFamily:"'Archivo',sans-serif", fontWeight:900, fontSize:"11px", letterSpacing:".18em", textTransform:"uppercase", color:"rgba(11,8,20,.72)", marginTop:6 }}>{label}</div>
          </div>
        ))}
      </div>

      {/* ── Top 3 Leaderboard ────────────────────────── */}
      {top3.length > 0 && top3[0].totalPts > 0 && (
        <div className="rounded-xl overflow-hidden" style={{ background: "var(--surface)", border: "1px solid var(--hairline)" }}>
          <div className="flex items-center justify-between px-4 pt-4 pb-2">
            <h3 style={{ fontFamily:"'Bangers',cursive", fontSize:"28px", letterSpacing:"2px", color:"var(--ink)" }}>LEADERBOARD</h3>
            <button onClick={() => setTab("leaderboard")} className="text-[11px] uppercase tracking-widest font-bold transition-colors cursor-pointer" style={{ color: "var(--blue)" }}>View All →</button>
          </div>
          <div className="px-3 pb-3 space-y-2">
            {top3.map((e, i) => {
              const rc = rankColors[i];
              return (
                <div key={e.player.id} style={{ display:"flex", alignItems:"center", gap:12, padding:"12px 14px", background:"var(--cream)", border:"4px solid var(--ink)", boxShadow:`5px 5px 0 ${rc.text}`, borderRadius:0, cursor:"pointer" }} onClick={() => setTab("leaderboard")}>
                  <div style={{ width:42, height:42, flexShrink:0, display:"flex", alignItems:"center", justifyContent:"center", background:rc.text, border:"3px solid var(--ink)", fontFamily:"'Bangers',cursive", fontSize:"18px", color:"var(--ink)", letterSpacing:"1px" }}>
                    {i === 0 ? "1ST" : i === 1 ? "2ND" : "3RD"}
                  </div>
                  <div className="flex-1 min-w-0">
                    <div style={{ fontFamily:"'Bangers',cursive", fontSize:"20px", letterSpacing:".5px", color: i === 0 ? "var(--orange)" : "var(--ink)" }}>{e.player.name}</div>
                    <div className="text-xs text-stone-500 mt-0.5">{e.stats.sessionsPlayed} sessions · {e.stats.groupWins} wins</div>
                  </div>
                  <div className="text-right shrink-0">
                    <div className="font-mono font-bold text-xl" style={{ color: rc.text, textShadow: `0 0 16px ${rc.glow}` }}>{e.totalPts}</div>
                    <div className="text-[10px] text-stone-600 uppercase">pts</div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* ── Latest Session ───────────────────────────── */}
      {latest ? (
        <div style={{ background:"var(--cream)", border:"5px solid var(--ink)", boxShadow:"7px 7px 0 var(--orange)", borderRadius:0, padding:"20px", cursor:"pointer" }} onClick={() => setOpenSessionId(latest.id)} onMouseEnter={e=>{e.currentTarget.style.transform="translate(-2px,-2px)";e.currentTarget.style.boxShadow="9px 9px 0 var(--orange)";}} onMouseLeave={e=>{e.currentTarget.style.transform="";e.currentTarget.style.boxShadow="7px 7px 0 var(--orange)";}}>
          <div className="flex items-center justify-between mb-2">
            <span style={{ fontWeight:900, fontSize:"11px", letterSpacing:".22em", textTransform:"uppercase", color:"rgba(11,8,20,.7)" }}>Latest Session</span>
            <Pill color={latest.completed ? "green" : "orange"}>{latest.completed ? "Complete" : "Active"}</Pill>
          </div>
          <h3 style={{ fontFamily:"'Bangers',cursive", fontSize:"34px", letterSpacing:"1.5px", color:"var(--ink)", marginBottom:4 }}>{latest.name}</h3>
          <div style={{ fontSize:"14px", fontWeight:700, color:"rgba(11,8,20,.72)" }}>{latest.teams?.length || 0} teams · {latest.date ? new Date(latest.date).toLocaleDateString() : "No date"}</div>
          <div style={{ marginTop:12, display:"flex", alignItems:"center", gap:6, fontFamily:"'Bangers',cursive", fontSize:"20px", letterSpacing:"1px", color:"var(--red)" }}>
            Open Session <I.chev size={16} />
          </div>
        </div>
      ) : isAdmin ? (
        <Card className="p-6 text-center border-dashed">
          <I.calendar className="mx-auto mb-2 text-stone-600" size={32} />
          <div className="text-stone-400 mb-3">No sessions yet</div>
          <Btn onClick={() => setTab("sessions")}><I.plus size={14} /> Create Session 1</Btn>
        </Card>
      ) : (
        <Card className="p-6 text-center border-dashed">
          <I.calendar className="mx-auto mb-2 text-stone-600" size={32} />
          <div className="text-stone-400">Waiting for first session…</div>
        </Card>
      )}

      {/* ── Point Structure ──────────────────────────── */}
      <div className="rounded-xl overflow-hidden" style={{ background: "var(--surface)", border: "1px solid var(--hairline)" }}>
        <div className="flex items-center justify-between px-4 pt-4 pb-3 border-b border-stone-800/60">
          <h3 style={{ fontFamily:"'Bangers',cursive", fontSize:"32px", letterSpacing:"2px", color:"var(--ink)" }}>POINT STRUCTURE</h3>
          <Pill color="orange">July Heat</Pill>
        </div>

        <div className="p-4 space-y-5">
          {/* Group Stage */}
          <div>
            <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:14 }}>
              <div style={{ height:3, flex:1, background:"var(--ink)" }}/>
              <span style={{ fontFamily:"'Bangers',cursive", fontSize:"16px", letterSpacing:"3px", color:"var(--ink)", padding:"3px 12px", border:"3px solid var(--ink)", background:"var(--blue)" }}>GROUP STAGE</span>
              <div style={{ height:3, flex:1, background:"var(--ink)" }}/>
            </div>
            <div className="space-y-1.5">
              {[
                { label: "WIN", pts: "+3", color: "#1FD9C4", bg: "var(--cream)", border: "var(--ink)", icon: <Icon d='<path d="M20 6L9 17l-5-5"/>' size={13} /> },
                { label: "TIEBREAK LOSS", pts: "+2", color: "var(--gold)", bg: "var(--cream)", border: "var(--ink)", icon: <Icon d='<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>' size={13} /> },
                { label: "COMPETITIVE LOSS", pts: "+1", color: "var(--orange)", bg: "var(--cream)", border: "var(--ink)", icon: <Icon d='<path d="M16 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="8.5" cy="7" r="4"/><path d="M22 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/>' size={13} /> },
                { label: "6-0 / 6-1 LOSS", pts: "0", color: "rgba(11,8,20,.55)", bg: "var(--cream)", border: "var(--ink)", icon: <Icon d='<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>' size={13} /> },
              ].map(({ label, pts, color, bg, border, icon }) => (
                <div key={label} style={{ display:"flex", alignItems:"center", gap:10, padding:"10px 14px", background:bg, border:`4px solid ${border}`, boxShadow:`4px 4px 0 ${border}`, marginBottom:8 }}>
                  <span style={{ color, flexShrink:0 }}>{icon}</span>
                  <span style={{ flex:1, fontFamily:"'Bangers',cursive", fontSize:"20px", letterSpacing:"1px", color:"var(--ink)" }}>{label}</span>
                  <span style={{ fontFamily:"'Bangers',cursive", fontSize:"28px", color, WebkitTextStroke:"1px var(--ink)", letterSpacing:"1px" }}>{pts}</span>
                </div>
              ))}
              <div style={{ display:"flex", alignItems:"center", gap:10, padding:"10px 14px", background:"var(--gold)", border:"4px solid var(--ink)", boxShadow:"4px 4px 0 var(--ink)", marginBottom:8 }}>
                <Icon d='<path d="M11.562 3.266a.5.5 0 01.876 0L15.39 8.87a1 1 0 001.516.294L21.183 5.5a.5.5 0 01.798.519l-2.834 10.246a1 1 0 01-.956.734H5.81a1 1 0 01-.957-.734L2.02 6.02a.5.5 0 01.798-.519l4.276 3.664a1 1 0 001.516-.294z"/><path d="M5 21h14"/>' size={13} style={{ color: "var(--ink)" }} />
                <span style={{ flex:1, fontFamily:"'Bangers',cursive", fontSize:"20px", letterSpacing:"1px", color:"var(--ink)" }}>TOP OF GROUP</span>
                <span style={{ fontFamily:"'Bangers',cursive", fontSize:"28px", color:"var(--ink)", WebkitTextStroke:"1px var(--ink)", letterSpacing:"1px" }}>+1</span>
              </div>
            </div>
          </div>

          {/* Knockout Stage */}
          <div>
            <div style={{ display:"flex", alignItems:"center", gap:10, margin:"16px 0 14px" }}>
              <div style={{ height:3, flex:1, background:"var(--ink)" }}/>
              <span style={{ fontFamily:"'Bangers',cursive", fontSize:"16px", letterSpacing:"3px", color:"var(--ink)", padding:"3px 12px", border:"3px solid var(--ink)", background:"var(--red)" }}>KNOCKOUT STAGE</span>
              <div style={{ height:3, flex:1, background:"var(--ink)" }}/>
            </div>
            <div className="space-y-1.5">
              {[
                { label: "REACH QF",    pts: "+1", color: "var(--orange)" },
                { label: "REACH SF",    pts: "+2", color: "var(--orange)" },
                { label: "REACH FINAL", pts: "+3", color: "var(--red)" },
              ].map(({ label, pts, color }) => (
                <div key={label} style={{ display:"flex", alignItems:"center", gap:10, padding:"10px 14px", background:"var(--cream)", border:"4px solid var(--ink)", boxShadow:"4px 4px 0 var(--ink)", marginBottom:8 }}>
                  <div style={{ width:12, height:12, background:color, border:"2px solid var(--ink)", flexShrink:0 }} />
                  <span style={{ flex:1, fontFamily:"'Bangers',cursive", fontSize:"20px", letterSpacing:"1px", color:"var(--ink)" }}>{label}</span>
                  <span style={{ fontFamily:"'Bangers',cursive", fontSize:"28px", color, WebkitTextStroke:"1px var(--ink)", letterSpacing:"1px" }}>{pts}</span>
                </div>
              ))}
              <div style={{ display:"flex", alignItems:"center", gap:10, padding:"12px 14px", background:"var(--yellow)", border:"5px solid var(--ink)", boxShadow:"5px 5px 0 var(--red)", marginBottom:8 }}>
                <Icon d='<path d="M6 9H4.5a2.5 2.5 0 010-5H6"/><path d="M18 9h1.5a2.5 2.5 0 000-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0012 0V2z"/>' size={16} style={{ color:"var(--ink)" }} />
                <span style={{ flex:1, fontFamily:"'Bangers',cursive", fontSize:"22px", letterSpacing:"1px", color:"var(--ink)" }}>WIN FINAL 🏆</span>
                <span style={{ fontFamily:"'Bangers',cursive", fontSize:"36px", color:"var(--red)", WebkitTextStroke:"1.5px var(--ink)", letterSpacing:"1px" }}>+5</span>
              </div>
            </div>
          </div>

          {/* Attendance Streak */}
          <div>
            <div style={{ display:"flex", alignItems:"center", gap:10, margin:"16px 0 14px" }}>
              <div style={{ height:3, flex:1, background:"var(--ink)" }}/>
              <span style={{ fontFamily:"'Bangers',cursive", fontSize:"16px", letterSpacing:"3px", color:"var(--ink)", padding:"3px 12px", border:"3px solid var(--ink)", background:"var(--orange)" }}>ATTENDANCE STREAK</span>
              <div style={{ height:3, flex:1, background:"var(--ink)" }}/>
            </div>
            <div className="flex gap-1.5 mb-2">
              {[{n:1,pts:"0",lbl:"1ST"},{n:2,pts:"+1",lbl:"2ND"},{n:3,pts:"+1",lbl:"3RD"},{n:4,pts:"+3",lbl:"4TH 🔥"}].map(({n,pts,lbl}) => (
                <div key={n} style={{ flex:1, padding:"10px 6px", textAlign:"center", background: n===4?"var(--orange)":n===1?"rgba(240,233,216,.6)":"var(--cream)", border:"4px solid var(--ink)", boxShadow: n===4?"4px 4px 0 var(--ink)":"3px 3px 0 var(--ink)", marginRight: n<4?6:0 }}>
                  <div style={{ fontFamily:"'Bangers',cursive", fontSize:"26px", letterSpacing:"1px", color: n===4?"var(--cream)":n===1?"rgba(11,8,20,.3)":"var(--ink)", WebkitTextStroke: n===4?"1px var(--ink)":"none" }}>{pts}</div>
                  <div style={{ fontFamily:"'Archivo',sans-serif", fontWeight:900, fontSize:"9px", letterSpacing:".14em", textTransform:"uppercase", color: n===4?"rgba(255,247,232,.85)":"rgba(11,8,20,.65)", marginTop:3 }}>{lbl}</div>
                </div>
              ))}
            </div>
            <div className="text-[11px] text-stone-500 italic px-1">Builds from 2nd session in a row · Max +5 · Miss a session → streak resets</div>
          </div>

          {/* Double Points */}
          <div style={{ padding:"14px 16px", background:"var(--cream)", border:"5px solid var(--ink)", boxShadow:"6px 6px 0 var(--red)" }}>
            <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:8 }}>
              <div style={{ padding:"4px 12px 2px", background:"var(--red)", border:"3px solid var(--ink)", fontFamily:"'Bangers',cursive", fontSize:"22px", letterSpacing:"1px", color:"var(--cream)", flexShrink:0 }}>2X</div>
              <span style={{ fontFamily:"'Bangers',cursive", fontSize:"22px", letterSpacing:"1px", color:"var(--ink)" }}>LAST TWO SESSIONS</span>
            </div>
            <div style={{ fontSize:"14px", fontWeight:700, color:"rgba(11,8,20,.6)", lineHeight:1.4 }}>All points doubled — wins, knockouts, top of group. <b style={{color:"var(--red)"}}>Streak bonus NOT doubled</b> (stays max +5).</div>
          </div>

          {/* Loyalty Lockout */}
          <div style={{ padding:"14px 16px", background:"var(--cream)", border:"5px solid var(--ink)", boxShadow:"6px 6px 0 var(--ink)" }}>
            <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:8 }}>
              <I.lock size={16} style={{ color:"var(--red)", flexShrink:0 }} />
              <span style={{ fontFamily:"'Bangers',cursive", fontSize:"22px", letterSpacing:"1px", color:"var(--red)" }}>LOYALTY LOCKOUT 🔒</span>
            </div>
            <div style={{ fontSize:"14px", fontWeight:700, color:"rgba(11,8,20,.6)", lineHeight:1.4 }}>Win the session final with a partner → you <b style={{color:"var(--red)"}}>cannot pair with them again</b> for the rest of the series.</div>
          </div>
        </div>
      </div>

    </div>
  );
}

function PlayersView({ state, update, setOpenPlayerId, isAdmin }) {
  const [search, setSearch] = useState("");
  const [showAdd, setShowAdd] = useState(false);
  const [showBulk, setShowBulk] = useState(false);
  const [editPlayer, setEditPlayer] = useState(null);
  const filtered = state.players.filter(p => !search || p.name.toLowerCase().includes(search.toLowerCase())).slice().sort((a, b) => a.name.localeCompare(b.name));
  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between">
        <h2 className="font-display text-3xl text-stone-100">PLAYERS</h2>
        {isAdmin && <div className="flex gap-2">
          <Btn variant="secondary" size="sm" onClick={() => setShowBulk(true)}><I.upload size={14} /> Import</Btn>
          <Btn size="sm" onClick={() => setShowAdd(true)}><I.plus size={14} /> Add</Btn>
        </div>}
      </div>
      <div className="relative">
        <I.search size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-stone-500" />
        <Input value={search} onChange={setSearch} placeholder="Search players…" className="pl-9" />
      </div>
      <div className="space-y-2">
        {filtered.length === 0 ? <Card className="p-6 text-center text-stone-500">No players match.</Card>
          : filtered.map(p => {
            const stats = calcPlayerStats(p.id, state.sessions);
            return (
              <Card key={p.id} className="p-3 flex items-center gap-3" onClick={() => isAdmin ? setEditPlayer(p) : setOpenPlayerId(p.id)}>
                <Avatar player={p} size={40} />
                <div className="flex-1 min-w-0">
                  <div className="font-semibold text-stone-100 truncate">{p.name}</div>
                  <div className="text-xs text-stone-500">{stats.stats.sessionsPlayed} sessions · {stats.stats.groupWins}W{(p.prevSeriesPoints||0) > 0 ? ` · +${p.prevSeriesPoints} prev` : ""}</div>
                </div>
                <div className="text-right">
                  <div className="font-mono font-bold text-orange-500">{stats.totalPts}</div>
                  <div className="text-[10px] text-stone-500 uppercase">pts</div>
                </div>
                {isAdmin ? <I.edit size={14} className="text-stone-600" /> : <I.chev size={16} className="text-stone-600" />}
              </Card>
            );
          })}
      </div>
      {showAdd && <AddPlayerModal onClose={() => setShowAdd(false)} onAdd={(name) => update(s => ({ ...s, players: [...s.players, { id: uid("p"), name: name.trim(), addedAt: Date.now() }] }))} />}
      {showBulk && <WhatsAppImportModal onClose={() => setShowBulk(false)} existing={state.players} onAdd={(players) => update(s => ({ ...s, players: [...s.players, ...players] }))} />}
      {editPlayer && <PlayerEditModal player={editPlayer} seriesNames={state.prevSeriesNames || []} onClose={() => setEditPlayer(null)}
        onSave={(data) => update(s => ({ ...s, players: s.players.map(p => p.id === editPlayer.id ? { ...p, ...data } : p) }))}
        onDelete={() => update(s => ({ ...s, players: s.players.filter(p => p.id !== editPlayer.id) }))} />}
    </div>
  );
}

function AddPlayerModal({ onClose, onAdd }) {
  const [n, setN] = useState("");
  return <Modal open={true} onClose={onClose} title="ADD PLAYER">
    <div className="space-y-3">
      <Input autoFocus value={n} onChange={setN} placeholder="Player name" />
      <div className="flex gap-2">
        <Btn variant="ghost" onClick={onClose}>Cancel</Btn>
        <Btn onClick={() => { if (n.trim()) { onAdd(n); onClose(); } }} disabled={!n.trim()}>Add</Btn>
      </div>
    </div>
  </Modal>;
}

function PlayerEditModal({ player, seriesNames, onClose, onSave, onDelete }) {
  const [name, setName] = useState(player.name || "");
  const [photoUrl, setPhotoUrl] = useState(player.photoUrl || "");
  const [photoUploading, setPhotoUploading] = useState(false);
  const initSeriesPts = {};
  (seriesNames || []).forEach(n => { initSeriesPts[n] = String((player.prevSeriesPts || {})[n] || 0); });
  const [seriesPts, setSeriesPts] = useState(initSeriesPts);
  const [showDel, setShowDel] = useState(false);
  const totalPrev = (seriesNames || []).reduce((sum, n) => sum + (parseInt(seriesPts[n]) || 0), 0) + (player.prevSeriesPoints || 0);
  return <Modal open={true} onClose={onClose} title="EDIT PLAYER">
    <div className="space-y-3">
      {photoUrl && !photoUrl.includes("PASTE") && (
        <div className="flex justify-center"><img src={photoUrl} alt="preview" className="w-20 h-20 rounded-full object-cover border-2 border-orange-500/30" onError={e => e.target.style.display="none"} /></div>
      )}
      <div><label className="text-xs text-stone-400 uppercase tracking-wider font-semibold mb-1 block">Name</label><Input value={name} onChange={setName} /></div>
      <div>
        <label className="text-xs text-stone-400 uppercase tracking-wider font-semibold mb-1 block">Photo</label>
        <div className="flex gap-2 items-center">
          <Input value={photoUrl} onChange={setPhotoUrl} placeholder="https://... or upload ↓" className="flex-1" />
        </div>
        <label className={`mt-1.5 flex items-center justify-center gap-2 w-full py-2 rounded-lg border border-dashed text-xs transition-colors ${photoUploading ? "border-orange-500 text-orange-400 cursor-wait" : "border-stone-700 text-stone-400 hover:border-orange-500 hover:text-orange-400 cursor-pointer"}`}>
          {photoUploading ? <><span className="animate-pulse">Uploading…</span></> : <><I.camera size={13} /> Upload from device</>}
          <input type="file" accept="image/*" className="hidden" disabled={photoUploading} onChange={async e => {
            const f = e.target.files?.[0]; if (!f) return;
            setPhotoUploading(true);
            try { const b64 = await resizeToBase64(f); setPhotoUrl(b64); } catch {}
            setPhotoUploading(false);
          }} />
        </label>
      </div>
      {(seriesNames || []).length > 0 && <div>
        <label className="text-xs text-stone-400 uppercase tracking-wider font-semibold mb-2 block">Previous Series Points <span className="text-stone-600 normal-case">(total: {totalPrev})</span></label>
        <div className="space-y-2">
          {(seriesNames || []).map(sn => (
            <div key={sn} className="flex items-center gap-2">
              <span className="text-xs text-stone-400 flex-1 truncate">{sn}</span>
              <Input type="number" value={seriesPts[sn] ?? "0"} onChange={v => setSeriesPts(p => ({ ...p, [sn]: v }))} className="w-20 text-right" />
            </div>
          ))}
        </div>
      </div>}
      <div className="flex gap-2 pt-2">
        <Btn variant="danger" size="sm" onClick={() => setShowDel(true)}><I.trash size={14} /></Btn>
        <Btn variant="ghost" onClick={onClose} className="ml-auto">Cancel</Btn>
        <Btn onClick={async () => {
          const pts = {};
          (seriesNames || []).forEach(n => { pts[n] = parseInt(seriesPts[n]) || 0; });
          const trimmedPhoto = photoUrl.trim();
          onSave({ name: name.trim() || player.name, photoUrl: trimmedPhoto, prevSeriesPts: pts });
          if (trimmedPhoto.startsWith("data:")) uploadPhotoToServer(player.id, trimmedPhoto);
          onClose();
        }}>Save</Btn>
      </div>
      {showDel && <div className="mt-2 p-3 rounded-lg bg-red-950/40 border border-red-900/40 space-y-2">
        <div className="text-sm text-red-300">Delete {player.name}? This is permanent.</div>
        <div className="flex gap-2"><Btn variant="ghost" size="sm" onClick={() => setShowDel(false)}>Cancel</Btn><Btn variant="danger" size="sm" onClick={() => { onDelete(); onClose(); }}>Delete</Btn></div>
      </div>}
    </div>
  </Modal>;
}

function WhatsAppImportModal({ onClose, onAdd, existing }) {
  const [text, setText] = useState("");
  const [step, setStep] = useState("paste");
  const [checked, setChecked] = useState({});
  const existingNames = existing.map(p => p.name);

  const parsed = useMemo(() => {
    if (!text.trim()) return [];
    return parseWhatsAppNames(text).map(name => {
      const exactMatch = existingNames.find(e => e.toLowerCase() === name.toLowerCase());
      if (exactMatch) return { name, status: "existing", suggestion: null };
      const fuzzy = fuzzyMatch(name, existingNames);
      return { name, status: fuzzy ? "fuzzy" : "new", suggestion: fuzzy?.match || null };
    });
  }, [text]);

  const freshItems = parsed.filter(p => p.status !== "existing");
  const toAdd = freshItems.filter(p => checked[p.name] !== false && p.status === "new")
    .concat(freshItems.filter(p => checked[p.name] === true && p.status === "fuzzy"));

  return <Modal open={true} onClose={onClose} title="IMPORT PLAYERS">
    <div className="space-y-3">
      {step === "paste" ? <>
        <div className="text-xs text-stone-400">Paste a WhatsApp chat export or a plain list of names (one per line).</div>
        <textarea value={text} onChange={e => setText(e.target.value)} rows={10}
          placeholder={"31/05/2025, 10:23 - Hassan: Hey\n31/05/2025, 10:24 - Faisal: Ready!\n\nOR just:\nHassan Al Salhi\nFaisal Al Harthi"}

function WhatsAppTeamImportModal({ onClose, state, session, leaderboard, onImport, update }) {
  const [text, setText] = useState("");
  const [step, setStep] = useState("paste");
  const [rows, setRows] = useState([]);
  const groups = getSessionGroups(session);
  const existingPairs = new Set((session.teams || []).map(t => [t.p1Id, t.p2Id].sort().join("|")));

  const buildRows = () => {
    const parsed = parseTeamsFromText(text).map(([n1, n2]) => {
      const r1 = resolvePlayerSmart(n1, state.players);
      const r2 = resolvePlayerSmart(n2, state.players);
      return {
        n1, n2,
        sel1: r1.player?.id || "", sel2: r2.player?.id || "",
        amb1: r1.ambiguous, amb2: r2.ambiguous,
        new1: !r1.player,  // no match → will auto-register
        new2: !r2.player,
      };
    });
    setRows(parsed);
    setStep("review");
  };

  const setSel = (i, key, val) => setRows(rs => rs.map((r, j) => j === i ? { ...r, [key]: val } : r));
  const toggleSkip = (i) => setRows(rs => rs.map((r, j) => j === i ? { ...r, skip: !r.skip } : r));

  // "__register__" sentinel = user explicitly chose to register as new (overrides any fuzzy match)
  const isRegisterNew = (r, side) => r["sel" + side] === "__register__" || (r["new" + side] && !r["sel" + side]);
  const effectiveId = (r, side) => {
    const sel = r["sel" + side];
    if (sel === "__register__" || (!sel && r["new" + side])) return "__new__";
    return sel || "";
  };
  const status = (r) => {
    const id1 = effectiveId(r, 1), id2 = effectiveId(r, 2);
    if (!id1 || !id2) return "unmatched";
    const real1 = id1 !== "__new__" ? id1 : null;
    const real2 = id2 !== "__new__" ? id2 : null;
    if (real1 && real1 === real2) return "samepair";
    if (real1 && real2 && existingPairs.has([real1, real2].sort().join("|"))) return "dup";
    return "ok";
  };
  const importable = rows.filter(r => !r.skip && status(r) === "ok");
  const newCount = importable.filter(r => isRegisterNew(r, 1)).length + importable.filter(r => isRegisterNew(r, 2)).length;

  const handleImport = () => {
    const created = {};
    importable.forEach(r => {
      if (isRegisterNew(r, 1)) { const p = { id: uid("p"), name: r.n1, addedAt: Date.now() }; created[r.n1] = p; }
      if (isRegisterNew(r, 2)) { const p = { id: uid("p"), name: r.n2, addedAt: Date.now() }; created[r.n2] = p; }
    });
    if (Object.keys(created).length > 0) {
      update(s => ({ ...s, players: [...s.players, ...Object.values(created)] }));
    }
    const newTeams = importable.map(r => ({
      id: uid("t"),
      p1Id: isRegisterNew(r, 1) ? created[r.n1]?.id : r.sel1,
      p2Id: isRegisterNew(r, 2) ? created[r.n2]?.id : r.sel2,
      group: groups[0],
    }));
    onImport(newTeams);
    onClose();
  };

  const sortedPlayers = useMemo(() => [...state.players].sort((a, b) => a.name.localeCompare(b.name)), [state.players]);
  const NameSelect = ({ raw, value, ambiguous, isNew, onChange }) => {
    const registerChosen = value === "__register__";
    const resolved = !isNew && value && value !== "__register__";
    const borderCls = !value && !isNew ? "border-red-500/60"
      : ambiguous && !registerChosen ? "border-amber-500/60"
      : (isNew && !value) || registerChosen ? "border-emerald-500/60"
      : "border-stone-700";
    return (
      <div className="flex-1 min-w-0">
        <div className="flex items-center gap-1">
          <div className="text-[10px] text-stone-500 truncate">"{raw}"</div>
          {(isNew && !value) || registerChosen ? <span className="text-[9px] font-bold px-1 rounded bg-emerald-500 text-white">NEW</span> : null}
        </div>
        <select value={value} onChange={e => onChange(e.target.value)}
          className={`w-full bg-stone-900 border rounded-md px-2 py-1.5 text-xs text-stone-100 ${borderCls}`}>
          <option value="">{isNew ? "— auto-register as new —" : "— pick player —"}</option>
          <option value="__register__">+ Register "{raw}" as new player</option>
          <option disabled>──────────────</option>
          {sortedPlayers.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
        </select>
      </div>
    );
  };

  return <Modal open={true} onClose={onClose} title="IMPORT TEAMS">
    <div className="space-y-3">
      {step === "paste" ? <>
        <div className="text-xs text-stone-400">Paste WA chat export or plain list. One team per line, separated by <code className="text-amber-400">&amp;</code> or <code className="text-amber-400">/</code>. Unknown names auto-register as new players.</div>
        <textarea value={text} onChange={e => setText(e.target.value)} rows={10}
          placeholder={"Ahmed & Khalid\nMoh / Sultan\nFaisal & Omar\n\nOR from WA export:\n31/05/2025, 10:23 - Coach: Ahmed & Khalid"}
          className="w-full bg-stone-900 border border-stone-700 rounded-lg px-3 py-2.5 text-stone-100 font-mono text-xs focus:outline-none focus:border-stone-500" />
        <div className="flex gap-2">
          <Btn variant="ghost" onClick={onClose}>Cancel</Btn>
          <Btn onClick={buildRows} disabled={!text.trim()}>Extract Teams →</Btn>
        </div>
      </> : <>
        <div className="text-xs text-stone-400">{rows.length} pairs · {importable.length} ready{newCount > 0 ? <span className="text-emerald-400"> · {newCount} new player{newCount>1?"s":""} will be registered</span> : null}. <span className="text-amber-400">Amber</span> = unsure. <span className="text-red-400">Red</span> = pick manually.</div>
        <div className="space-y-2 max-h-80 overflow-y-auto pr-1">
          {rows.map((r, i) => {
            const st = status(r);
            const bg = st === "dup" ? "rgba(16,185,129,0.06)" : st === "ok" ? "var(--surface)" : "rgba(239,68,68,0.06)";
            return (
              <div key={i} className="px-2.5 py-2 rounded-lg" style={{ background: bg, border: "1px solid var(--hairline)" }}>
                <div className="flex items-center gap-2">
                  <input type="checkbox" checked={!r.skip && st !== "dup"} disabled={st === "dup"} onChange={() => toggleSkip(i)} className="accent-orange-500 shrink-0" />
                  <NameSelect raw={r.n1} value={r.sel1} ambiguous={r.amb1} isNew={r.new1} onChange={v => setSel(i, "sel1", v)} />
                  <span className="text-stone-500 shrink-0">&</span>
                  <NameSelect raw={r.n2} value={r.sel2} ambiguous={r.amb2} isNew={r.new2} onChange={v => setSel(i, "sel2", v)} />
                </div>
                {st === "dup" && <div className="text-[10px] text-emerald-500 mt-1 pl-6">Already in this session</div>}
                {st === "samepair" && <div className="text-[10px] text-red-400 mt-1 pl-6">Same player twice</div>}
                {(r.amb1 || r.amb2) && st === "ok" && <div className="text-[10px] text-amber-400 mt-1 pl-6">Multiple possible matches — verify</div>}
              </div>
            );
          })}
        </div>
        <div className="flex gap-2 pt-1">
          <Btn variant="ghost" onClick={() => setStep("paste")}>← Back</Btn>
          <Btn onClick={handleImport} disabled={!importable.length}>Import {importable.length} + Auto-Seed</Btn>
        </div>
      </>}
    </div>
  </Modal>;
}

  { id: "comeback",   icon: "↩️",  label: "Phoenix",    desc: "Earned a comeback bonus",   check: e => e.breakdown.comebackPts > 0 },

  { id: "die_hard",   icon: "💪", label: "Die-Hard",    desc: "Played 10+ sessions",       check: e => e.stats.sessionsPlayed >= 10 },
  { id: "gunslinger", icon: "🎱", label: "Gunslinger",  desc: "25+ match wins",            check: e => (e.stats.groupWins + e.stats.qfWins + e.stats.sfWins + e.stats.finalsWon) >= 25 },
  { id: "century",    icon: "💯", label: "Century",     desc: "100+ series points",        check: e => e.totalPts >= 100 },
];
function getMilestones(entry) {

}

// ── H2H Rivals ────────────────────────────────────────────────
function calcRivals(pid, sessions) {
  const map = {};
  sessions.forEach(s => {
    const myTeam = getPlayerTeam(s, pid); if (!myTeam) return;
    const matches = [...(s.groupMatches || []),
      ...(s.bracket?.qf || []),
      ...(s.bracket?.sf || []),
      s.bracket?.final
    ].filter(Boolean);
    matches.forEach(m => {
      if (!m.winner) return;
      const isTeam1 = m.team1Id === myTeam.id;
      const isTeam2 = m.team2Id === myTeam.id;
      if (!isTeam1 && !isTeam2) return;
      const oppTeamId = isTeam1 ? m.team2Id : m.team1Id;
      const oppTeam = (s.teams || []).find(t => t.id === oppTeamId); if (!oppTeam) return;
      const opponents = [oppTeam.p1Id, oppTeam.p2Id].filter(Boolean);
      const won = teamWon(m, myTeam.id);
      opponents.forEach(oid => {
        if (!map[oid]) map[oid] = { wins: 0, losses: 0 };
        if (won) map[oid].wins++; else map[oid].losses++;
      });
    });
  });
  return Object.entries(map)
    .map(([id, r]) => ({ id, ...r, total: r.wins + r.losses }))
    .filter(r => r.total >= 1)
    .sort((a, b) => b.total - a.total)
    .slice(0, 5);
}

function generateSessionShareText(session, state, leaderboard) {
  const pName = (id) => state.players.find(p => p.id === id)?.name?.split(" ")[0] || "?";
  const tLabel = (t) => t ? `${pName(t.p1Id)} & ${pName(t.p2Id)}` : "TBD";
  const winner = session.bracket?.final?.winner
    ? (session.bracket.final.winner === "team1" ? session.teams?.find(t => t.id === session.bracket.final.team1Id) : session.teams?.find(t => t.id === session.bracket.final.team2Id))
    : null;
  const finalist = session.bracket?.final?.winner
    ? (session.bracket.final.winner === "team1" ? session.teams?.find(t => t.id === session.bracket.final.team2Id) : session.teams?.find(t => t.id === session.bracket.final.team1Id))
    : null;

  // Top scorers this session
  const sessionScores = (state.players || []).map(p => {
    const team = getPlayerTeam(session, p.id); if (!team) return null;
    const mult = session.doublePoints ? 2 : 1;
    let pts = 0;
    (session.groupMatches || []).forEach(m => {
      if ((m.team1Id !== team.id && m.team2Id !== team.id) || !m.winner) return;
      if (teamWon(m, team.id)) pts += 3 * mult;
      else { const t = m.lossType || "tiebreak"; pts += (t === "tiebreak" ? 2 : t === "competitive" ? 1 : 0) * mult; }
    });
    if (getTopOfGroup(session, team.group) === team.id) pts += 1 * mult;
    const qfM = (session.bracket?.qf || []).find(m => (m.team1Id === team.id || m.team2Id === team.id) && m.winner);
    if (qfM) pts += (1 + koMatchPts(qfM, team.id)) * mult;
    const sfM = (session.bracket?.sf || []).find(m => (m.team1Id === team.id || m.team2Id === team.id) && m.winner);
    if (sfM) pts += (2 + koMatchPts(sfM, team.id)) * mult;
    const f = session.bracket?.final;
    if (f && (f.team1Id === team.id || f.team2Id === team.id) && f.winner)
      pts += (3 + koMatchPts(f, team.id) + (teamWon(f, team.id) ? 5 : 0)) * mult;
    return { name: p.name, pts };
  }).filter(Boolean).sort((a, b) => b.pts - a.pts);

  const seriesLeader = [...leaderboard].sort((a, b) => b.totalPts - a.totalPts)[0];
  const dateStr = session.date ? new Date(session.date + "T12:00:00").toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" }) : "";

  let text = `🔥 *JULY HEAT Vol.5 — ${session.name}*`;
  if (dateStr) text += ` (${dateStr})`;
  text += `\n`;
  if (session.doublePoints) text += `⚡ *DOUBLE POINTS NIGHT*\n`;
  text += `\n`;
  if (winner) {
    text += `🏆 *Champions:* ${tLabel(winner)}\n`;
    if (finalist) text += `🥈 *Finalists:* ${tLabel(finalist)}\n`;
    text += `\n`;
  }
  if (sessionScores.length > 0) {
    text += `📊 *Top Scorers Tonight:*\n`;
    sessionScores.slice(0, 5).forEach((e, i) => { text += `${["🥇","🥈","🥉","4️⃣","5️⃣"][i]} ${e.name} — ${e.pts} pts\n`; });
    text += `\n`;
  }
  if (seriesLeader) {
    text += `📈 *Series Leader:* ${seriesLeader.player.name} (${seriesLeader.totalPts} pts)\n`;
  }
  text += `\n🎾 *heat.urbanpadel.om*`;
  return text;
}

function PartnerDrawModal({ onClose, state, session, onAddTeams }) {
  const inSession = new Set((session.teams || []).flatMap(t => [t.p1Id, t.p2Id]));
  const available = (state.players || []).filter(p => !inSession.has(p.id));
  const [selected, setSelected] = useState([]);
  const toggle = (id) => setSelected(s => s.includes(id) ? s.filter(x => x !== id) : [...s, id]);
  const toggleAll = () => setSelected(selected.length === available.length ? [] : available.map(p => p.id));

  const draw = () => {
    const pool = [...selected].sort(() => Math.random() - 0.5);
    if (pool.length < 2) return;
    const groups = getSessionGroups(session);
    const teams = [];
    for (let i = 0; i + 1 < pool.length; i += 2) {
      teams.push({ id: uid("t"), name: "", p1Id: pool[i], p2Id: pool[i + 1], group: groups[Math.floor(i / 2) % groups.length] });
    }
    onAddTeams(teams);
    onClose();
  };

  return <Modal open={true} onClose={onClose} title="PARTNER DRAW">
    <div className="space-y-3">
      <div className="text-xs text-stone-400">Select players entering the draw — pairs will be random. Odd player out is skipped.</div>
      <div className="flex items-center justify-between">
        <div className="text-xs text-stone-500">{selected.length} selected</div>
        <button onClick={toggleAll} className="text-xs text-orange-400 font-semibold">{selected.length === available.length ? "Clear all" : "Select all"}</button>
      </div>
      <div className="max-h-64 overflow-y-auto space-y-1">
        {available.length === 0
          ? <div className="text-xs text-stone-500 text-center py-4">All players already in session</div>
          : available.map(p => (
            <button key={p.id} onClick={() => toggle(p.id)}
              className={`w-full text-left px-3 py-2 rounded-lg text-sm font-semibold transition-all ${selected.includes(p.id) ? "bg-orange-500/20 text-orange-300 border border-orange-500/40" : "bg-stone-900 text-stone-300 border border-transparent"}`}>
              {p.name}
            </button>
          ))}
      </div>
      {selected.length % 2 !== 0 && selected.length > 0 && <div className="text-[11px] text-amber-400">Odd number — one player will be left out of draw</div>}
      <div className="flex gap-2 pt-1">
        <Btn variant="ghost" onClick={onClose}>Cancel</Btn>
        <Btn className="flex-1" onClick={draw} disabled={selected.length < 2}>🎲 Draw {Math.floor(selected.length / 2)} Pairs</Btn>
      </div>
    </div>
  </Modal>;
}

            <label className="text-xs text-stone-400 uppercase tracking-wider font-semibold mb-1 block">⭐ MVP of the Night</label>
