<script>
// Recovery collector — uploads this device's cached tournament state to the
// server BEFORE the app boots, because the normal load flow overwrites the
// cache with server state. Runs once per unique cache content (hash-guarded).
(function(){
  try {
    var st = localStorage.getItem("july-heat-state-v1");
    if (!st) return;
    var mark = "len" + st.length + "_" + st.slice(0, 40) + st.slice(-40);
    if (localStorage.getItem("jh-recovery-sent") === mark) return;
    fetch("/recovery-dump", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ data: st, meta: { ua: navigator.userAgent, ts: Date.now(), len: st.length } })
    }).then(function(r){ if (r.ok) localStorage.setItem("jh-recovery-sent", mark); }).catch(function(){});
  } catch(e){}
})();
</script>
<script>
(function(){
  // Self-healing update check.
  //
  // The version this document was BUILT as — stamped by
  // build-september-surge-app.py from the file's own content hash, and
  // written to version.txt by the same deploy. So the comparison below is
  // "is the page I am running the page the server now has", which is the
  // actual question. It replaces a localStorage marker that could not
  // answer it: the old code wrote the new version to localStorage BEFORE
  // reloading, so if that reload came back out of a cache the marker said
  // "current" while the page was stale — and it never checked again.
  // A phone could sit on a superseded build indefinitely.
  var V = "5007af74912f";
  fetch("/version.txt?_=" + Date.now(), { cache: "no-store" })
    .then(function(r){ return r.text(); })
    .then(function(v){
      v = v.trim();
      localStorage.setItem("jh-build", v);
      if (!v || v === V) return;
      // One reload per server version, so a mismatch we cannot fix — a
      // version.txt that never matches any build — degrades to serving the
      // stale page rather than reloading forever.
      try {
        if (sessionStorage.getItem("jh-reloaded") === v) return;
        sessionStorage.setItem("jh-reloaded", v);
      } catch (e) { return; }
      // Reload through a changed URL: a plain reload can be answered from
      // the browser's cache, and that cache is exactly what is stale.
      var u = location.pathname + "?b=" + encodeURIComponent(v) + location.hash;
      location.replace(u);
    }).catch(function(){});
})();
</script>

/* Background: dark ink paper */
body{
  background:
    radial-gradient(ellipse 90% 55% at 10% 8%, rgba(255,46,136,.14), transparent),
    radial-gradient(ellipse 70% 55% at 88% 12%, rgba(198,255,0,.11), transparent),
    radial-gradient(ellipse 50% 50% at 50% 92%, rgba(198,255,0,.07), transparent),
    linear-gradient(180deg,#080808 0%,#0a0a0a 60%,#060606 100%) !important;
}

/* Global halftone — neon cyan dots */
body::before{
  background-image:radial-gradient(rgba(255,46,136,.12) 20%,transparent 22%) !important;
  background-size:22px 22px !important;
}

/* ── APP CHROME ── */
#root{position:relative;z-index:1;}

/* ── HEAT HERO LOCKUP ── */
.jh-hero{
  position:relative;overflow:hidden;
  padding:0;
  background:#0A0A0A;
  border-bottom:5px solid var(--orange);
}
.jh-hero .rays{
  position:absolute;inset:-30%;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 60% 50% at 50% 30%, rgba(198,255,0,.18), transparent 70%);
}
.jh-hero .halftone{
  position:absolute;inset:0;pointer-events:none;z-index:0;opacity:.6;
  background-image:radial-gradient(rgba(255,46,136,.13) 20%,transparent 22%);

}
.jh-hero .frame{display:none;}
.jh-hero-inner{position:relative;z-index:2;padding:32px 22px 26px;text-align:center;}
.jh-caption{display:inline-block !important;background:var(--blue) !important;border:1px solid rgba(242,242,242,.10) !important;box-shadow:none !important;}
.jh-caption *{color:var(--cream) !important;}
.jh-caption b{color:var(--red) !important;}

/* BLACKOUT SERIES lockup */
@keyframes logo-glow{
  0%,100%{filter:drop-shadow(0 0 24px rgba(255,46,136,.7)) drop-shadow(0 0 50px rgba(198,255,0,.4));}
  50%{filter:drop-shadow(0 0 42px rgba(255,46,136,1)) drop-shadow(0 0 80px rgba(198,255,0,.7)) drop-shadow(0 0 120px rgba(198,255,0,.3));}
}
.jh-lockup{margin:0 0 16px;}
.jh-logo-img{width:340px;max-width:96%;display:block;margin:0 auto 2px;

.jh-vol{display:inline-block;margin-top:8px;font-family:'Archivo',sans-serif;font-style:italic;font-variation-settings:'wdth' 125,'wght' 900;font-size:22px;

.jh-flag{display:inline-flex;align-items:center;gap:8px;font-family:'Archivo',sans-serif;font-style:italic;font-variation-settings:'wdth' 125,'wght' 900;

.jh-flag.red{background:var(--red);color:var(--cream);}
.jh-flag.yel{background:var(--blue);color:#F2F2F2;}
.jh-flag.blue{background:var(--blue);color:var(--cream);}
.jh-flag.org{background:var(--orange);color:var(--cream);}

/* caption box */
.jh-caption{display:inline-block;background:var(--orange);border:1px solid rgba(242,242,242,.10);
  box-shadow:none;padding:14px 18px;transform: none;
  text-align:left;max-width:100%;}
.jh-caption p{font-weight:800;font-size:15px;line-height:1.35;color:var(--cream);}
.jh-caption b{font-weight:900;color:var(--blue);}

/* info chips */
.jh-chips{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0;}
.jh-chip{display:flex;align-items:center;gap:10px;background:rgba(14,14,14,.85);
  border:1px solid rgba(242,242,242,.10);box-shadow:none;padding:12px 14px;}
.jh-chip:nth-child(2){transform: none;}
.jh-chip:nth-child(3){transform: none;}
.jh-chip .jc-ico{width:38px;height:38px;flex:0 0 auto;display:grid;place-items:center;
  background:var(--blue);border:1px solid rgba(242,242,242,.14);}
.jh-chip .jc-lab{font-size:10px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--red);}
.jh-chip .jc-val{font-family:'Archivo',sans-serif;font-style:italic;font-variation-settings:'wdth' 125,'wght' 900;font-size:24px;letter-spacing:1px;color:#F2F2F2;line-height:.9;margin-top:2px;}

/* prize burst */
.jh-burst{display:grid;place-items:center;text-align:center;flex:0 0 auto;
  clip-path:polygon(50% 0,61% 18%,82% 9%,79% 32%,100% 38%,84% 53%,98% 72%,73% 70%,72% 95%,53% 79%,33% 96%,32% 70%,7% 71%,22% 53%,4% 39%,25% 33%,21% 9%,42% 18%);}

/* pool row */
.jh-pool{display:flex;align-items:center;gap:16px;margin:16px 0;}
.jh-pool-note .big{font-family:'Archivo',sans-serif;font-style:italic;font-variation-settings:'wdth' 125,'wght' 900;font-size:clamp(28px,8vw,42px);line-height:.9;color:var(--cream);}
.jh-pool-note .big em{font-style:normal;color:var(--red);}
.jh-pool-note .teams{display:inline-block;margin-top:8px;background:var(--blue);
  border:1px solid rgba(242,242,242,.10);box-shadow:none;
  font-family:'Archivo',sans-serif;font-style:italic;font-variation-settings:'wdth' 125,'wght' 900;font-size:20px;letter-spacing:1px;
  padding:4px 14px 2px;transform: none;color:#F2F2F2;}

/* section footer strip */
.jh-strip{background:#111111;border:3px solid var(--blue);
  box-shadow:0 0 18px rgba(255,46,136,.4);color:var(--cream);
  padding:12px 20px;display:flex;align-items:center;justify-content:space-between;margin-top:auto;}
.jh-strip .b{font-family:'Archivo',sans-serif;font-style:italic;font-variation-settings:'wdth' 125,'wght' 900;letter-spacing:2px;font-size:22px;color:var(--blue);}
.jh-strip .c{font-family:'Archivo',sans-serif;font-style:italic;font-variation-settings:'wdth' 125,'wght' 900;letter-spacing:1px;font-size:20px;color:var(--cream);}
.jh-strip .c b{color:var(--orange);}

/* session row (srow style) */
.jh-srow{display:flex;align-items:center;gap:14px;background:rgba(14,14,14,.85);
  border:1px solid rgba(242,242,242,.10);box-shadow:none;padding:14px 18px;
  cursor:pointer;transition:transform .1s;}
.jh-srow:hover{transform:translate(-2px,-2px);}
.jh-srow .sx{font-family:'Archivo',sans-serif;font-style:italic;font-variation-settings:'wdth' 125,'wght' 900;font-size:36px;line-height:.8;color:var(--cream);
  background:var(--blue);border:1px solid rgba(242,242,242,.14);
  width:56px;height:56px;flex:0 0 auto;display:grid;place-items:center;padding-top:5px;}
.jh-srow.done .sx{background:var(--blue);}
.jh-srow.active .sx{background:var(--red);}
.jh-srow.upcoming .sx{background:rgba(10,10,10,.12);color:#9A9A9A;}
.jh-srow .sd small{display:block;font-size:10px;font-weight:900;letter-spacing:.16em;
  text-transform:uppercase;color:var(--red);}
.jh-srow .sd b{font-family:'Archivo',sans-serif;font-style:italic;font-variation-settings:'wdth' 125,'wght' 900;font-size:26px;letter-spacing:1px;
  color:#F2F2F2;line-height:.86;display:block;margin-top:2px;}
.jh-srow .tags{display:flex;flex-direction:column;align-items:flex-end;gap:5px;margin-left:auto;}
.jh-pill{font-family:'Archivo',sans-serif;font-style:italic;font-variation-settings:'wdth' 125,'wght' 900;font-size:14px;color:var(--cream);background:var(--orange);
  border:1px solid rgba(242,242,242,.14);box-shadow:none;
  padding:3px 10px 1px;letter-spacing:1px;white-space:nowrap;}
.jh-pill.done{background:var(--blue);color:#F2F2F2;}
.jh-pill.live{background:var(--red);}
.jh-pill.x2{background:var(--red);transform: none;}
.jh-pill.fin{background:var(--orange);color:var(--cream);}

/* leaderboard rows */
.jh-lbrow{background:rgba(14,14,14,.85);border:1px solid rgba(242,242,242,.10);
  box-shadow:none;padding:12px 14px;
  display:flex;align-items:center;gap:12px;cursor:pointer;
  transition:transform .1s;}
.jh-lbrow:hover{transform:translate(-2px,-2px);}
.jh-lbrow.r1{border-color:var(--orange);box-shadow:none;}
.jh-lbrow.r2{box-shadow:none;}
.jh-lbrow.r3{box-shadow:none;}
.jh-rank{font-family:'Archivo',sans-serif;font-style:italic;font-variation-settings:'wdth' 125,'wght' 900;font-size:22px;width:40px;height:40px;
  display:grid;place-items:center;border:1px solid rgba(242,242,242,.14);flex:0 0 auto;}
.jh-lbrow.r1 .jh-rank{background:var(--blue);color:#F2F2F2;}
.jh-lbrow.r2 .jh-rank{background:#a0a0a0;color:#F2F2F2;}
.jh-lbrow.r3 .jh-rank{background:#cd7f32;color:var(--cream);}
.jh-lbname{font-family:'Archivo',sans-serif;font-style:italic;font-variation-settings:'wdth' 125,'wght' 900;font-size:20px;letter-spacing:.5px;color:#F2F2F2;}
.jh-lbsub{font-size:11px;font-weight:700;color:#9A9A9A;margin-top:1px;}
.jh-pts{font-family:'Archivo',sans-serif;font-style:italic;font-variation-settings:'wdth' 125,'wght' 900;font-size:32px;-webkit-text-stroke: 0;}
.jh-lbrow.r1 .jh-pts{color:var(--orange);font-size:38px;}
.jh-lbrow.r2 .jh-pts{color:#6e6e6e;}
.jh-lbrow.r3 .jh-pts{color:#5B6472;}

/* page section title */
.jh-sec-kicker{display:inline-block;background:var(--blue);color:var(--cream);
  font-weight:900;font-size:12px;letter-spacing:.22em;text-transform:uppercase;
  padding:5px 12px;transform: none;margin-bottom:6px;}
.jh-sec-title{font-family:'Archivo',sans-serif;font-style:italic;font-variation-settings:'wdth' 125,'wght' 900;font-size:clamp(52px,14vw,80px);
  line-height:.82;letter-spacing:2px;text-transform:uppercase;color:var(--cream);
  text-shadow:none;margin-bottom:16px;}
.jh-sec-title em{font-style:normal;color:var(--red);
  text-shadow:none;-webkit-text-stroke: 0;}

/* entry animation */
@keyframes jhPop{from{opacity:0;transform:translateY(26px);}to{opacity:1;transform:none;}}
@keyframes jhSlam{0%{opacity:0;transform:scale(1.5);}60%{opacity:1;}100%{opacity:1;transform:scale(1);}}
.jh-pop{animation:jhPop .5s cubic-bezier(.2,.8,.2,1) both;}
.jh-slam{animation:jhSlam .6s cubic-bezier(.2,.8,.25,1.05) both;}

/* ═══════════════════════════════════════════════════════════
   BLACKOUT SERIES · NEON — FINAL LAYER
   Converts every remaining light/comic surface into a dark
   neon panel. Nothing from the comic theme survives this.
   ═══════════════════════════════════════════════════════════ */
:root{
  --yellow:#FF2E88; --paper:#0A0A0A;
  --panel:rgba(14,14,14,.82); --panel-2:rgba(30,36,50,.9);
  --hair:rgba(242,242,242,.12); --neon:rgba(198,255,0,.55);
  --glow:0 0 30px rgba(198,255,0,.32);
}
/* kill the comic halftone dot field ▶ faint tactical grid */
body::before{
  background-image:
    linear-gradient(rgba(198,255,0,.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(198,255,0,.05) 1px,transparent 1px) !important;
  background-size:46px 46px !important;
}
body::after{opacity:.28 !important;}

/* light comic cards ▶ dark neon panels */
.jh-chip,.jh-srow,.jh-lbrow,.jh-caption,.jh-panel{
  background:var(--panel) !important;
  border:1px solid var(--hair) !important;
  box-shadow:none !important;
  backdrop-filter:blur(4px);
}
.jh-srow:hover,.jh-lbrow:hover{
  transform:none !important;
  border-color:var(--neon) !important;
  box-shadow:var(--glow) !important;
}
/* text that assumed a light card ▶ chalk / steel */
.jh-chip .jc-val,.jh-lbname,.jh-srow .sd b,.jh-caption p,.jh-pool-note .big{
  color:var(--cream) !important;
}
.jh-lbsub{color:var(--muted) !important;}
.jh-caption b{color:var(--red) !important;}
.jh-chip .jc-lab,.jh-srow .sd small{color:var(--red) !important;}
.jh-chip .jc-ico{
  background:rgba(198,255,0,.12) !important;
  border:1px solid var(--neon) !important;
  color:var(--red) !important;
}
/* leaderboard podium: medal tints on dark, not solid blocks */
.jh-lbrow.r1{border-left:2px solid var(--red) !important;box-shadow:var(--glow) !important;}
.jh-lbrow.r2{border-left:2px solid #CFCFCF !important;}
.jh-lbrow.r3{border-left:2px solid #9A9A9A !important;}
.jh-rank{background:rgba(255,255,255,.05) !important;color:var(--cream) !important;
  border:1px solid var(--hair) !important;}
.jh-lbrow.r1 .jh-rank{background:rgba(198,255,0,.15) !important;color:var(--red) !important;border-color:var(--neon) !important;}
.jh-lbrow.r2 .jh-rank{background:rgba(201,207,218,.12) !important;color:#CFCFCF !important;}
.jh-lbrow.r3 .jh-rank{background:rgba(192,138,74,.14) !important;color:#9A9A9A !important;}
.jh-lbrow.r1 .jh-pts{color:var(--red) !important;}
.jh-lbrow.r2 .jh-pts{color:#CFCFCF !important;}
.jh-lbrow.r3 .jh-pts{color:#9A9A9A !important;}
.jh-pts{color:var(--cream) !important;}
/* session number tile */
.jh-srow .sx{border:1px solid var(--hair) !important;color:var(--cream) !important;}
.jh-srow.active .sx{background:rgba(198,255,0,.18) !important;color:var(--red) !important;border-color:var(--neon) !important;}
.jh-srow.done .sx{background:rgba(255,46,136,.12) !important;color:var(--blue) !important;}
.jh-srow.upcoming .sx{background:rgba(255,255,255,.04) !important;color:var(--muted) !important;}
/* flags / pills ▶ outlined neon, no solid comic blocks */
.jh-flag,.jh-pill,.jh-vol{
  border:1px solid var(--neon) !important;
  box-shadow:var(--glow) !important;
  background:rgba(198,255,0,.12) !important;
  color:var(--cream) !important;
}
.jh-flag.blue,.jh-pill.done{background:rgba(255,46,136,.12) !important;border-color:rgba(255,46,136,.6) !important;color:var(--blue) !important;}
.jh-flag.yel{background:rgba(255,46,136,.12) !important;border-color:rgba(255,46,136,.6) !important;color:var(--blue) !important;}
.jh-pool-note .teams{background:rgba(198,255,0,.12) !important;border:1px solid var(--neon) !important;
  box-shadow:var(--glow) !important;color:var(--cream) !important;}
/* hero + strip */
.jh-hero{background:#050505 !important;border-bottom:1px solid var(--neon) !important;}
.jh-hero .halftone{display:none !important;}
.jh-strip{background:#050505 !important;border:1px solid var(--neon) !important;
  box-shadow:var(--glow) !important;color:var(--cream) !important;}
.jh-strip .b{color:var(--red) !important;}
.jh-strip .c b{color:var(--red) !important;}
/* prize burst: star ▶ clean reticle ring */
.jh-burst{clip-path:none !important;border-radius:50% !important;
  border:1.5px solid var(--neon) !important;box-shadow:var(--glow),inset 0 0 18px rgba(198,255,0,.15) !important;
  background:rgba(198,255,0,.08) !important;}
/* section headings */
.jh-sec-kicker{background:rgba(255,46,136,.12) !important;border:1px solid rgba(255,46,136,.5) !important;color:var(--blue) !important;}
.jh-sec-title,.jh-round-title{color:var(--cream) !important;text-shadow:0 0 18px rgba(198,255,0,.35) !important;}
.jh-sec-title em{color:var(--red) !important;}
/* display type: tactical caps, never comic */
.font-display,.jh-sec-title,.jh-round-title,.jh-lbname,.jh-pts,.jh-vol,.jh-flag,.jh-pill{
  font-family:'Archivo',sans-serif;font-style:italic;font-variation-settings:'wdth' 125,'wght' 900;letter-spacing:.02em !important;
}
/* buttons ▶ neon */
button[style*="linear-gradient"]{box-shadow:var(--glow) !important;}
/* Force visibility on all jh brand elements */
.jh-lockup,.jh-hero-inner{opacity:1 !important;}
.jh-caption,.jh-chip,.jh-chips,.jh-pool,.jh-strip,.jh-flag{opacity:1 !important;}

function getMe() { try { return localStorage.getItem(ME_KEY) || ""; } catch (e) { return ""; } }
function saveMe(id) { try { id ? localStorage.setItem(ME_KEY, id) : localStorage.removeItem(ME_KEY); } catch (e) {} }

// Rank is always taken over the players who have actually played, so the
// number here matches the number the RANK tab shows.
function hasPlayedEntry(e) { return e.stats.groupPlayed > 0 || e.stats.qfReached > 0; }

function getToken() { try { return localStorage.getItem(TOKEN_KEY) || ""; } catch (e) { return ""; } }
function setToken(t) { try { t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); } catch (e) {} }

// Merge a photos map { playerId: dataUrl } into a players array
function mergePhotos(players, photos) {
  return (players || []).map(p => ({ ...p, photoUrl: photos[p.id] || p.photoUrl || "" }));
}

// Extract changed photos from players (only data: URLs)
function extractPhotos(players) {
  const out = {};
  (players || []).forEach(p => { if (p.photoUrl?.startsWith("data:")) out[p.id] = p.photoUrl; });
  return out;
}

// Immediately save a single player's photo to the server (fire-and-forget safe)
async function uploadPhotoToServer(playerId, dataUrl) {
  const token = getToken();
  if (!token || !dataUrl?.startsWith("data:")) return;
  try {
    await fetch(WORKER_URL + "/photos", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
      body: JSON.stringify({ photos: { [playerId]: dataUrl } }),
    });
    _lastSyncedPlayerPhotosJSON = "";  // force a fresh diff next debounced save (this player's entry is now current server-side, but the cheap way to stay correct is to re-check next time)
  } catch {}
}

// Merge session photo arrays (fetched separately) back onto sessions
function mergeSessionPhotos(sessions, sessionPhotos) {
  return (sessions || []).map(s => ({ ...s, photos: sessionPhotos[s.id] || s.photos || [] }));
}

// Strip heavy base64 photo data before caching to localStorage (avoids QuotaExceededError)
function stateForLocalCache(state) {
  if (!state) return state;
  return {
    ...state,
    players: (state.players || []).map(p => p.photoUrl?.startsWith("data:") ? { ...p, photoUrl: "" } : p),
    sessions: (state.sessions || []).map(s => (s.photos && s.photos.length > 0) ? { ...s, photos: [] } : s),
  };
}

// Re-attach base64 photos from a previous state (which had them) onto a
// server-merged state (which is photo-stripped), matched by id. Used when
// adopting a concurrent-merge result so the UI keeps showing photos.
function reattachPhotos(newState, prevState) {
  if (!newState) return newState;
  const pPhoto = {}, sPhoto = {};
  (prevState?.players || []).forEach(p => { if (p.photoUrl?.startsWith("data:")) pPhoto[p.id] = p.photoUrl; });
  (prevState?.sessions || []).forEach(s => { if (Array.isArray(s.photos) && s.photos.length) sPhoto[s.id] = s.photos; });
  return {
    ...newState,
    players: (newState.players || []).map(p => pPhoto[p.id] ? { ...p, photoUrl: pPhoto[p.id] } : p),
    sessions: (newState.sessions || []).map(s => sPhoto[s.id] ? { ...s, photos: sPhoto[s.id] } : s),
  };
}

// Extract session photo arrays that need saving (only non-empty)
function extractSessionPhotos(sessions) {
  const out = {};
  (sessions || []).forEach(s => { if (Array.isArray(s.photos) && s.photos.length > 0) out[s.id] = s.photos; });
  return out;
}

// Immediately save a session's full photo array to the server (fire-and-forget safe)
async function uploadSessionPhotosToServer(sessionId, photosArr) {
  const token = getToken();
  if (!token) return;
  try {
    await fetch(WORKER_URL + "/session-photos", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
      body: JSON.stringify({ photos: { [sessionId]: photosArr } }),
    });
    _lastSyncedSessionPhotosJSON = "";  // force a fresh diff next debounced save
  } catch {}
}

// Upload an already-framed session photo (data URL) to Cloudinary and get back
// a hosted URL, so the photo wall stays a few KB instead of tens of MB of
// base64. Falls back to the original data URL if the upload fails, so adding
// photos never breaks — a later migration can still move it to a URL.
async function uploadFramedPhotoToCloud(dataUrl) {
  const token = getToken();
  if (!token || !dataUrl?.startsWith("data:")) return dataUrl;
  try {
    const res = await fetch(WORKER_URL + "/photo-upload", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
      body: JSON.stringify({ image: dataUrl, raw: true }),
    });
    const json = await res.json();
    return json.ok && json.url ? json.url : dataUrl;
  } catch (e) {
    return dataUrl;
  }
}

// Read latest state. Returns { ok, state } shape for existing callers.
async function apiGet(action, params = {}) {
  if (action === "unlock") {
    const res = await fetch(WORKER_URL + "/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ pin: String(params.pin) }),
    });
    if (!res.ok) return { ok: false };
    const data = await res.json().catch(() => ({}));
    if (data.ok && data.token) { setToken(data.token); return { ok: true, role: data.role }; }
    return { ok: false };
  }
  if (action === "ping") return { ok: true };
  // Load state and photos in parallel
  const [stateRes, photosRes, sessionPhotosRes] = await Promise.all([
    fetch(WORKER_URL + "/state", { method: "GET" }),
    fetch(WORKER_URL + "/photos", { method: "GET" }),
    fetch(WORKER_URL + "/session-photos", { method: "GET" }),
  ]);
  if (!stateRes.ok) throw new Error("Load failed (" + stateRes.status + ")");
  const data = await stateRes.json();
  if (!data.ok) throw new Error(data.error || "Load failed");
  if (typeof data.version === "number") _serverVersion = data.version;  // track for concurrency
  const photosData = photosRes.ok ? await photosRes.json().catch(() => ({})) : {};
  const photos = photosData.photos || {};
  const sessionPhotosData = sessionPhotosRes.ok ? await sessionPhotosRes.json().catch(() => ({})) : {};
  const sessionPhotos = sessionPhotosData.photos || {};
  const base = initState();
  const raw = data.state;
  const loaded = (raw && raw.players) ? { ...base, ...raw } : base;
  loaded.players = mergePhotos(loaded.players, photos);
  loaded.sessions = mergeSessionPhotos(loaded.sessions, sessionPhotos);
  return { ok: true, state: loaded };
}

// Write state and photos to the server (requires a valid token).
let _lastSyncedPlayerPhotosJSON = "";
let _lastSyncedSessionPhotosJSON = "";
let _serverVersion = 0;  // optimistic-concurrency version last seen from server

async function apiPost(body) {
  if (body.action !== "saveState") return { ok: true };
  const token = getToken();
  if (!token) throw new Error("Sign in to save");

  // Save state WITHOUT base64 photos — those go via /photos and /session-photos
  // below. Sending them here bloats the payload to tens of MB and trips a 413.
  // baseVersion lets the server detect a concurrent edit and merge instead of
  // clobbering another scorer's results.
  const saveRes = await fetch(WORKER_URL + "/save", {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
    body: JSON.stringify({ state: stateForLocalCache(body.state), baseVersion: _serverVersion }),
  });
  if (saveRes.status === 401) { setToken(""); throw new Error("Session expired — sign in again"); }
  if (!saveRes.ok) {
    const errData = await saveRes.json().catch(() => ({}));
    throw new Error(errData.error || "Save failed (" + saveRes.status + ")");
  }
  const saveData = await saveRes.json().catch(() => ({}));
  if (typeof saveData.version === "number") _serverVersion = saveData.version;

  // Save any base64 photos separately — only re-upload if they actually changed
  const photos = extractPhotos(body.state?.players);
  const photosJSON = JSON.stringify(photos);
  if (Object.keys(photos).length > 0 && photosJSON !== _lastSyncedPlayerPhotosJSON) {
    _lastSyncedPlayerPhotosJSON = photosJSON;
    fetch(WORKER_URL + "/photos", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
      body: photosJSON,
    }).then(r => { if (!r.ok) _lastSyncedPlayerPhotosJSON = ""; }).catch(() => { _lastSyncedPlayerPhotosJSON = ""; });
  }

  // Save session photo arrays separately — only re-upload if they actually changed
  const sessionPhotos = extractSessionPhotos(body.state?.sessions);
  const sessionPhotosJSON = JSON.stringify(sessionPhotos);
  if (Object.keys(sessionPhotos).length > 0 && sessionPhotosJSON !== _lastSyncedSessionPhotosJSON) {
    _lastSyncedSessionPhotosJSON = sessionPhotosJSON;
    fetch(WORKER_URL + "/session-photos", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
      body: JSON.stringify({ photos: sessionPhotos }),
    }).then(r => { if (!r.ok) _lastSyncedSessionPhotosJSON = ""; }).catch(() => { _lastSyncedSessionPhotosJSON = ""; });
  }

  // If the server merged in another scorer's changes, hand the merged state
  // back so the app adopts it (with local photos re-attached) instead of
  // re-saving its now-stale copy on the next tick.
  return { ok: true, merged: !!saveData.merged, mergedState: saveData.merged ? saveData.state : null };
}

function levenshtein(a, b) {
  const m = a.length, n = b.length;
  const dp = Array.from({length: m+1}, (_, i) => Array.from({length: n+1}, (_, j) => i || j));
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++)
    dp[i][j] = a[i-1] === b[j-1] ? dp[i-1][j-1] : 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
  return dp[m][n];
}
function fuzzyMatch(name, candidates, threshold = 3) {
  const nl = name.toLowerCase();
  let best = null, bestDist = Infinity;
  for (const c of candidates) { const d = levenshtein(nl, c.toLowerCase()); if (d < bestDist) { bestDist = d; best = c; } }
  return bestDist <= threshold && bestDist > 0 ? { match: best, dist: bestDist } : null;
}
function parseWhatsAppNames(text) {
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  const waPattern = /^\d{1,2}[\/\-.]\d{1,2}[\/\-.]\d{2,4},? \d{1,2}:\d{2}(?::\d{2})?(?: [AP]M)? [-–] (.+?): /;
  const systemKw = ['end-to-end','changed','added','removed','left','created','pinned','security code','joined using','using this link','number changed'];
  const isWA = lines.some(l => waPattern.test(l));
  const names = new Set();
  if (isWA) {
    lines.forEach(l => {
      const m = l.match(waPattern);
      if (!m) return;
      const sender = m[1].trim();
      if (sender.startsWith('+') || sender.match(/^\d/)) return;
      const body = l.slice(m[0].length).toLowerCase();
      if (systemKw.some(k => body.startsWith(k) || sender.toLowerCase().includes(k))) return;
      names.add(sender);
    });
  } else {
    lines.forEach(l => { if (l.length > 1 && l.length < 60 && !/^\+?\d[\d\s\-()]+$/.test(l)) names.add(l); });
  }
  return [...names];
}
function parseTeamsFromText(text) {
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  const waPattern = /^\d{1,2}[\/\-.]\d{1,2}[\/\-.]\d{2,4},? \d{1,2}:\d{2}(?::\d{2})?(?: [AP]M)? [-–] (.+?): (.*)/;
  const teams = [];
  const parsePair = (line) => {
    line = line.replace(/^(?:team|فريق)\s*\d+\s*[:\-]\s*/i, '').replace(/^\d+[\.\-\)]\s*/, '').trim();
    for (const sep of [' & ', ' / ', ' – ', ' - ', ' + ', ' vs ', ', ', '&', '/', '+']) {
      const idx = line.indexOf(sep);
      if (idx < 1) continue;
      const n1 = line.slice(0, idx).trim(), n2 = line.slice(idx + sep.length).trim();
      if (n1.length > 1 && n2.length > 1 && n1.length < 60 && n2.length < 60) return [n1, n2];
    }
    return null;
  };
  if (lines.some(l => waPattern.test(l))) {
    lines.forEach(l => { const m = l.match(waPattern); if (!m) return; const p = parsePair(m[2]); if (p) teams.push(p); });
  } else {
    lines.forEach(l => { const p = parsePair(l); if (p) teams.push(p); });
  }
  return teams;
}

function resolvePlayer(name, players) {
  const exact = players.find(p => p.name.toLowerCase() === name.toLowerCase());
  if (exact) return exact;
  const f = fuzzyMatch(name, players.map(p => p.name), 3);
  return f ? players.find(p => p.name === f.match) : null;
}

// ─── Smart partial-name matching (players write short names on WhatsApp) ───
function normName(s) {
  return (s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/[^a-z0-9\s]/g, " ").replace(/\s+/g, " ").trim();
}
function scoreNameMatch(input, fullName) {
  const a = normName(input), b = normName(fullName);
  if (!a || !b) return 0;
  if (a === b) return 100;
  const at = a.split(" "), bt = b.split(" ");
  if (b.startsWith(a + " ")) return 96;          // "ahmed" ▶ "ahmed al wahaibi"
  if (a.startsWith(b + " ")) return 93;          // "ahmed al wahaibi extra" ▶ "ahmed al"
  if (at[0] === bt[0]) {                          // first name exact
    if (at[1]) return bt.some((t, i) => i > 0 && (t.startsWith(at[1]) || at[1].startsWith(t))) ? 90 : 68;
    return 80;
  }
  // any token prefix overlap (handles "moh" ▶ "mohammed")
  let tokenHit = false;
  for (const x of at) if (x.length >= 3 && bt.some(y => y.startsWith(x) || x.startsWith(y))) tokenHit = true;
  if (tokenHit) return 62;
  const d0 = levenshtein(at[0], bt[0]);           // typo in first name
  if (d0 === 0) return 78;
  if (d0 === 1) return 56;
  if (d0 === 2 && at[0].length >= 4) return 44;
  const dd = levenshtein(a, b);                   // typo in whole string
  if (dd <= 2) return 48;
  if (dd <= 3) return 34;
  return 0;
}
function resolvePlayerSmart(name, players) {
  const scored = players.map(p => ({ player: p, score: scoreNameMatch(name, p.name) }))
    .filter(s => s.score > 0).sort((a, b) => b.score - a.score);
  if (!scored.length) return { player: null, candidates: [], ambiguous: false };
  const best = scored[0];
  // ambiguous when 2+ strong matches are within 8 pts (e.g. two "Ahmed"s)
  const close = scored.filter(s => best.score - s.score <= 8 && s.score >= 60);
  return { player: best.player, score: best.score, candidates: scored.slice(0, 5).map(s => s.player), ambiguous: close.length > 1 };
}

function getSessionGroups(session) {
  return GROUPS.slice(0, session?.groupCount || 4);
}
function getQualifyCount(session) {
  return session?.qualifyCount || 2;  // default: top 2 per group qualify
}

// Which teams are currently on course to qualify — the same rule seedQF uses,
// so a group table can never promise a spot the bracket won't honour. There is
// no single "top N" in this series: it is qualifyCount per group (1, 2 or 4),
// except that 3 groups is fixed at top-2 plus the two best thirds, and
// 4-groups/all-thirds sends every third through to a round of 16.
function qualifyingTeamIds(session) {
  const groups = getSessionGroups(session);
  const N = groups.length;
  const stand = groups.map(g => calcGroupStandingsNormalized(session, g));
  const ids = new Set();
  const take = (rows, n) => rows.slice(0, n).forEach(r => r && r.team && r.team.id && ids.add(r.team.id));

  if (N === 4 && session && session.thirdPlaceMode === "all4r16") {
    stand.forEach(rows => take(rows, 3));
    return ids;
  }
  if (N === 3) {
    stand.forEach(rows => take(rows, 2));
    // the two best thirds, ranked exactly the way the bracket ranks them
    const thirds = stand.map(rows => rows[2]).filter(r => r && r.team && r.team.id)
      .map(r => ({ id: r.team.id, pts: r.pts, wins: r.wins, gd: r.gd || 0, gf: r.gf || 0 }));
    thirds.sort(compareThirds).slice(0, 2).forEach(t => ids.add(t.id));
    return ids;
  }
  stand.forEach(rows => take(rows, getQualifyCount(session)));
  return ids;
}

function groupFixtures(session, group) {
  const teams = (session.teams || []).filter(t => t.group === group);
  const all = session.groupMatches || [];
  const pairs = [];
  for (let i = 0; i < teams.length; i++)
    for (let j = i + 1; j < teams.length; j++) {
      const a = teams[i], b = teams[j];
      const recs = all.filter(m =>
        (m.team1Id === a.id && m.team2Id === b.id) || (m.team1Id === b.id && m.team2Id === a.id));
      const done = recs.find(m => m.winner) || null;
      pairs.push({ a, b, match: done || recs[0] || null, played: !!done, extra: Math.max(0, recs.length - 1) });
    }
  return { pairs, total: pairs.length, played: pairs.filter(p => p.played).length };
}

// Every group's fixtures at once — what the whole night amounts to.
function sessionFixtures(session) {
  let total = 0, played = 0;
  getSessionGroups(session).forEach(g => {
    const f = groupFixtures(session, g);
    total += f.total; played += f.played;
  });
  return { total, played, left: total - played };
}

function resizeToBase64(file, size = 200) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const canvas = document.createElement("canvas");
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext("2d");
      const s = Math.min(img.width, img.height);
      const ox = (img.width - s) / 2, oy = (img.height - s) / 2;
      ctx.drawImage(img, ox, oy, s, s, 0, 0, size, size);
      resolve(canvas.toDataURL("image/jpeg", 0.65));
    };
    img.onerror = reject;
    img.src = url;
  });
}
function resizePhotoToBase64(file, maxW = 900) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const scale = Math.min(1, maxW / img.width);
      const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL("image/jpeg", 0.72));
    };
    img.onerror = reject;
    img.src = url;
  });
}

function drawAttackPhotoFrame(ctx, img, w, h, wm) {
  // Blackout Series photo frame. Replaces the July Heat comic frame (aged
  // paper, sunburst rays, halftone vignette, "MEANWHILE, AT URBAN
  // PLAYGROUND...", a SNAP! burst) which had been recoloured but never
  // redrawn — and which still stamped HEAT.URBANPADEL.OM on every share.
  //
  // Wall photos arrive via watermarkPhotoToBase64 at up to 1080px (the 200px
  // cap in resizeToBase64 is the avatar path, not this one), so the frame is
  // sized in units of min(w,h)/1080 and holds at full resolution.
  const s = Math.min(w, h) / 1080;
  const ink = "#0A0A0A", ice = "#FF2E88", chalk = "#F2F2F2", red = "#C6FF00";
  const pad = 26 * s;

  // ── court black base + faint tactical grid ──
  ctx.fillStyle = "#050505";
  ctx.fillRect(0, 0, w, h);
  ctx.save();
  ctx.strokeStyle = "rgba(198,255,0,.07)";
  ctx.lineWidth = Math.max(1, 1 * s);
  const cell = 46 * s * 2;
  for (let x = 0; x < w; x += cell) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
  for (let y = 0; y < h; y += cell) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
  ctx.restore();

  // ── the photo, cover-fitted into the frame window ──
  const barH = 92 * s;                       // bottom plate
  const iw = w - pad * 2, ih = h - pad * 2 - barH;
  const scale = Math.max(iw / img.width, ih / img.height);
  const dw = img.width * scale, dh = img.height * scale;
  ctx.save();
  ctx.beginPath(); ctx.rect(pad, pad, iw, ih); ctx.clip();
  ctx.drawImage(img, pad + (iw - dw) / 2, pad + (ih - dh) / 2, dw, dh);

  // chromatic tear slices — red pulled left, cyan pushed right
  // No scanlines and no tear slices over the photo — both drew lines
  // straight across the image. The frame carries its identity in the
  // border: corner ticks, the red/cyan edge and the bottom plate.

  // edge falloff so the photo sits into the plate rather than on top of it
  const g = ctx.createLinearGradient(0, pad + ih - 120 * s, 0, pad + ih);
  g.addColorStop(0, "rgba(5,5,5,0)"); g.addColorStop(1, "rgba(5,5,5,.78)");
  ctx.fillStyle = g; ctx.fillRect(pad, pad + ih - 120 * s, iw, 120 * s);
  ctx.restore();

  // ── corner ticks: cyan opens top-left, red closes bottom-right ──
  const tk = 40 * s, tw3 = 4 * s;
  ctx.fillStyle = ice;
  ctx.fillRect(pad, pad, tk, tw3); ctx.fillRect(pad, pad, tw3, tk);
  ctx.fillStyle = red;
  ctx.fillRect(pad + iw - tk, pad + ih - tw3, tk, tw3);
  ctx.fillRect(pad + iw - tw3, pad + ih - tk, tw3, tk);

  // ── bottom plate: emblem, series, URL ──
  const by = h - pad - barH;
  ctx.fillStyle = "rgba(5,5,5,.96)";
  ctx.fillRect(pad, by, iw, barH);
  ctx.fillStyle = red;
  ctx.fillRect(pad, by, iw, 3 * s);

  let tx = pad + 20 * s;
  if (wm) {                                   // emblem, left
    const lh = barH - 30 * s, lw = (wm.width / wm.height) * lh;
    ctx.drawImage(wm, tx, by + 15 * s, lw, lh);
    tx += lw + 18 * s;
  }
  ctx.textAlign = "left"; ctx.textBaseline = "middle";
  ctx.fillStyle = chalk;
  ctx.font = `italic 900 ${30 * s}px 'Archivo', sans-serif`;
  ctx.fillText("BLACKOUT SERIES", tx, by + barH / 2 - 12 * s);
  ctx.fillStyle = "#9A9A9A";
  ctx.font = `700 ${17 * s}px 'JetBrains Mono', monospace`;
  ctx.fillText("URBAN SOCIAL SERIES \u00B7 VOL.8", tx, by + barH / 2 + 18 * s);

  ctx.textAlign = "right";
  ctx.fillStyle = ice;
  ctx.font = `700 ${19 * s}px 'JetBrains Mono', monospace`;
  ctx.fillText("ATTACK.URBANPADEL.OM", w - pad - 20 * s, by + barH / 2);
}

// Uploads a resized photo to the server for Cloudinary enhancement (brightness/
// contrast/vibrance auto-correct). Returns the enhanced image URL, or null if
// the enhancement call fails — caller falls back to the original photo.
function fileToDataURL(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

async function enhancePhotoOnServer(file, maxW = 1600) {
  let dataUrl = null, forceJpg = false;
  // Try to decode + downscale locally first (keeps the upload small).
  try {
    dataUrl = await new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        URL.revokeObjectURL(url);
        const scale = Math.min(1, maxW / img.width);
        const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", 0.9));
      };
      img.onerror = reject;
      img.src = url;
    });
  } catch (e) {
    // Browser can't decode this file (e.g. HEIC from an iPhone). Send the raw
    // bytes to Cloudinary — it converts them — and force JPEG on the way back
    // so the framing step can render it.
    try { dataUrl = await fileToDataURL(file); forceJpg = true; } catch (e2) { return null; }
  }
  try {
    const res = await fetch(WORKER_URL + "/photo-upload", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + getToken() },
      body: JSON.stringify({ image: dataUrl }),
    });
    const json = await res.json();
    if (!json.ok || !json.url) return null;
    return forceJpg ? json.url.replace("/upload/", "/upload/f_jpg/") : json.url;
  } catch (e) {
    return null;
  }
}

function loadImageEl(src, useCors = false) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    if (useCors) img.crossOrigin = "anonymous";
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

async function watermarkPhotoToBase64(file, maxW = 1080) {
  const wm = await loadJHWatermark();
  try { await document.fonts.load("italic 27px Archivo"); } catch (e) {}

  const enhancedUrl = await enhancePhotoOnServer(file);
  let srcImg = enhancedUrl ? await loadImageEl(enhancedUrl, true).catch(() => null) : null;
  if (!srcImg) {
    // fall back to decoding the original file directly
    srcImg = await new Promise((resolve) => {
      const fallback = new Image();
      const url = URL.createObjectURL(file);
      fallback.onload = () => { URL.revokeObjectURL(url); resolve(fallback); };
      fallback.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
      fallback.src = url;
    });
  }
  // Still couldn't render it for framing — if Cloudinary already hosts it,
  // use that URL unframed so the photo still lands on the wall.
  if (!srcImg) {
    if (enhancedUrl) return enhancedUrl;
    throw new Error("This image format couldn't be read");
  }

  const scale = Math.min(1, maxW / srcImg.width);
  const w = Math.round(srcImg.width * scale), h = Math.round(srcImg.height * scale);
  const canvas = document.createElement("canvas");
  canvas.width = w; canvas.height = h;
  drawAttackPhotoFrame(canvas.getContext("2d"), srcImg, w, h, wm);
  return canvas.toDataURL("image/jpeg", 0.85);
}

// ── Share a photo via the native share sheet (Instagram etc.) ──
async function sharePhoto(dataUrl, idx) {
  try {
    const blob = await (await fetch(dataUrl)).blob();

    if (navigator.canShare && navigator.canShare({ files: [f] })) {

      return;
    }

}
function generatePlayerCard(entry, state) {
  const p = entry.player;
  const rank = [...(state?.players || [])].map(pl => {
    const s = calcPlayerStats(pl.id, state.sessions);
    const prev = Object.values(pl.prevSeriesPts || {}).reduce((a,b)=>a+(Number(b)||0),0)+(pl.prevSeriesPoints||0);
    return { id: pl.id, totalPts: s.totalPts, lifetimePts: s.totalPts + prev };
  }).sort((a,b)=>b.totalPts-a.totalPts).findIndex(l=>l.id===p.id)+1;
  const badges = getMilestones(entry);
  const totalWins = entry.stats.groupWins + entry.stats.qfWins + entry.stats.sfWins + entry.stats.finalsWon;
  const prevSum = Object.values(p.prevSeriesPts||{}).reduce((a,b)=>a+(Number(b)||0),0)+(p.prevSeriesPoints||0);
  let txt = `🏅 *BLACKOUT SERIES Vol.8 · PLAYER CARD*\n\n`;
  txt += `*${p.name.toUpperCase()}*\n`;
  txt += `🏆 Rank #${rank} · ${entry.totalPts} pts this series\n`;
  if (prevSum > 0) txt += `📈 ${entry.totalPts + prevSum} pts all-time\n`;
  txt += `\n`;
  txt += `📅 ${entry.stats.sessionsPlayed} sessions played\n`;
  txt += `⚡ ${totalWins} match wins\n`;
  if (entry.stats.finalsWon > 0) txt += `🏆 Champion ×${entry.stats.finalsWon}\n`;
  if (entry.stats.finalsReached - entry.stats.finalsWon > 0) txt += `🥈 Finalist ×${entry.stats.finalsReached - entry.stats.finalsWon}\n`;
  if (entry.stats.sfReached > 0) txt += `⚔️ Semifinalist ×${entry.stats.sfReached}\n`;
  if (badges.length > 0) { txt += `\n🎖 Badges: ${badges.map(b => b.icon+" "+b.label).join(" · ")}\n`; }
  txt += `\n🎾 https://blackout.urbanpadel.om`;
  return txt;
}

function initState() {
  return {
    seasonName: "BLACKOUT SERIES",
    seasonSubtitle: "URBAN SOCIAL SERIES · VOL. 8",
    seasonTagline: "Lights Out.",
    prevSeriesNames: ["April Clash", "Midnight Madness", "Midnight Rally", "June Fury", "July Heat", "August Attack", "September Surge"],
    players: SEED_PLAYERS.map(name => ({ id: uid("p"), name, addedAt: Date.now() })),
    sessions: [],
  };
}

function getPlayerTeam(s, pid) { return (s.teams || []).find(t => t.p1Id === pid || t.p2Id === pid); }
function teamWon(m, tid) { if (!m || !m.winner) return false; if (m.winner === "team1") return m.team1Id === tid; if (m.winner === "team2") return m.team2Id === tid; return false; }

// Points baseline for the SERIES leaderboard only: a group of 4 plays 3
// matches, so only each team's best GROUP_COUNTED_GAMES results earn series
// points. A 5-team group therefore drops its lowest game and cannot out-earn a
// group of 4. This does NOT touch the group table below — group standings use
// every match played, so qualification is decided on real results.
const GROUP_COUNTED_GAMES = 3;

function teamGroupResults(session, teamId) {
  const out = [];
  (session.groupMatches || []).forEach(m => {
    if (m.team1Id !== teamId && m.team2Id !== teamId) return;
    if (!m.winner) return;
    const isT1 = m.team1Id === teamId;
    const won = teamWon(m, teamId);
    const lt = m.lossType || "tiebreak";
    out.push({
      pts: won ? 3 : (lt === "tiebreak" ? 2 : lt === "competitive" ? 1 : 0),
      w: won ? 1 : 0,
      gf: m.score ? (isT1 ? m.score.t1 : m.score.t2) : 0,
      ga: m.score ? (isT1 ? m.score.t2 : m.score.t1) : 0,
    });
  });
  const playedActual = out.length;
  out.sort((a, b) => b.pts - a.pts || (b.gf - b.ga) - (a.gf - a.ga) || b.gf - a.gf);
  // A group too small to offer GROUP_COUNTED_GAMES matches tops each of its
  // teams up with notional 6-0 bye wins, so the draw cannot cost a player
  // points. Appended after the sort, so a ghost can only ever fill a slot no
  // real result reached — and only for a team that actually played.
  const gTeam = (session.teams || []).find(t => t.id === teamId);
  const gSize = gTeam ? (session.teams || []).filter(t => t.group === gTeam.group).length : 0;
  const ghosts = out.length > 0 ? Math.max(0, GROUP_COUNTED_GAMES - Math.max(0, gSize - 1)) : 0;
  const withByes = ghosts
    ? out.concat(Array.from({ length: ghosts }, () => ({ pts: 3, w: 1, gf: 6, ga: 0, bye: true })))
    : out;
  return { all: out, counted: withByes.slice(0, GROUP_COUNTED_GAMES), playedActual, byes: ghosts };
}

// GROUP TABLE — every match played counts. This is the real standing and it is
// what decides top-of-group and who qualifies.
function calcGroupStandings(session, group) {
  const teams = (session.teams || []).filter(t => t.group === group);
  const matchList = session.groupMatches || [];
  const rows = teams.map(team => {
    let pts = 0, wins = 0, played = 0, gf = 0, ga = 0;
    matchList.forEach(m => {
      if (m.team1Id !== team.id && m.team2Id !== team.id) return;
      if (!m.winner) return;
      played++;
      const isT1 = m.team1Id === team.id;
      if (m.score) { gf += isT1 ? m.score.t1 : m.score.t2; ga += isT1 ? m.score.t2 : m.score.t1; }
      if (teamWon(m, team.id)) { pts += 3; wins++; }
      else { const t = m.lossType || "tiebreak"; if (t === "tiebreak") pts += 2; else if (t === "competitive") pts += 1; }
    });
    // An undersized group cannot offer GROUP_COUNTED_GAMES matches, so each of
    // its teams carries notional 6-0 bye wins to make up the difference —
    // the same ones the series points and the seeding count. Awarded only to a
    // team that has actually played, so a group that never took the court
    // banks nothing.
    const gSize = teams.length;
    const byes = played > 0 ? Math.max(0, GROUP_COUNTED_GAMES - Math.max(0, gSize - 1)) : 0;
    if (byes) { pts += 3 * byes; wins += byes; played += byes; gf += 6 * byes; }
    return { team, pts, wins, played, gf, ga, gd: gf - ga, byes };
  });
  const h2h = {};
  matchList.forEach(m => {
    if (!m.winner) return;
    const wid = m.winner === "team1" ? m.team1Id : m.team2Id;
    const lid = m.winner === "team1" ? m.team2Id : m.team1Id;
    if (!h2h[wid]) h2h[wid] = {};
    h2h[wid][lid] = (h2h[wid][lid] || 0) + 1;
  });
  return rows.sort((a, b) => {
    if (b.wins !== a.wins) return b.wins - a.wins;   // 1) most wins
    if (b.gd !== a.gd) return b.gd - a.gd;           // 2) game difference
    if (b.gf !== a.gf) return b.gf - a.gf;           // 3) games won
    const aH = (h2h[a.team.id]?.[b.team.id] || 0) - (h2h[b.team.id]?.[a.team.id] || 0);
    if (aH !== 0) return -aH;                        // 4) head-to-head
    return b.pts - a.pts;
  });
}

function scoreToResult(s1, s2) {
  if (s1 === s2 || (s1 === null || s2 === null)) return { winner: null, lossType: null };
  const [winScore, loseScore] = s1 > s2 ? [s1, s2] : [s2, s1];
  const lossType = (loseScore <= 1) ? "blowout" : (loseScore === 5) ? "tiebreak" : "competitive";
  return { winner: s1 > s2 ? "team1" : "team2", lossType, score: { t1: s1, t2: s2 } };
}

function getTopOfGroup(s, g) { const ov = s.topOfGroupOverride && s.topOfGroupOverride[g]; if (ov) return ov; const r = calcGroupStandings(s, g); return r[0]?.team?.id || null; }

// Returns standings for a group NORMALISED to the session's smallest group size:
// each team keeps only its best (minGroupSize − 1) results, so every team across
// differently-sized groups is compared on the same number of matches. In a 5/5/4
// session that means everyone is ranked on their best 3 games — the group-of-5
// teams drop their single worst result, the group-of-4 teams are unchanged.
// Used for KNOCKOUT SEEDING only; the displayed group table and leaderboard are
// handled separately.
// KO SEEDING ONLY — when groups are UNEVEN (e.g. 5/5/4) teams have played a
// different number of matches, so ranking them against each other across groups
// is unfair. In that case rank everyone on the smallest group's match count
// (larger groups drop their lowest). Equal-size groups need no adjustment and
// use the real table.
function calcGroupStandingsNormalized(session, group) {
  const teams = (session.teams || []).filter(t => t.group === group);
  const sizes = getSessionGroups(session)
    .map(g => (session.teams || []).filter(t => t.group === g).length)
    .filter(n => n > 0);
  const uneven = sizes.length > 1 && new Set(sizes).size > 1;
  if (!uneven) return calcGroupStandings(session, group);
  // Seed on the same results the series points count: best
  // GROUP_COUNTED_GAMES, with an undersized group's 6-0 byes making up the
  // difference. The old rule cut everyone to the smallest group's match count,
  // which levelled down; this levels up, and keeps one definition of "your
  // results" for both the leaderboard and the bracket.
  const rows = teams.map(team => {
    const best = teamGroupResults(session, team.id).counted;
    let pts = 0, wins = 0, gf = 0, ga = 0;
    best.forEach(r => { pts += r.pts; wins += r.w; gf += r.gf; ga += r.ga; });
    return { team, pts, wins, played: best.length, gf, ga, gd: gf - ga };
  });
  return rows.sort((a, b) => b.wins - a.wins || b.gd - a.gd || b.gf - a.gf || b.pts - a.pts);
}

// Equalizes 3rd-place entries for cross-group comparison by adding ghost BYE wins
// (+3 pts each) for teams in smaller groups to normalize to the largest group's match count.
function equalizeThirds(thirds, session) {
  const groups = getSessionGroups(session);
  const groupSizes = {};
  groups.forEach(g => { groupSizes[g] = (session.teams || []).filter(t => t.group === g).length; });
  const maxPerTeam = Math.max(...Object.values(groupSizes)) - 1;
  return thirds.map(t => {
    const g = (session.teams || []).find(tm => tm.id === t.id)?.group;
    const missing = maxPerTeam - ((groupSizes[g] || maxPerTeam + 1) - 1);
    // Ghost BYE win: +1 win, +6 games for (notional 6-0), +6 GD
    return { ...t, wins: t.wins + missing, gd: (t.gd || 0) + missing * 6, gf: (t.gf || 0) + missing * 6, ghostWins: missing };
  });
}

// Compare two thirds entries: wins ▶ GD ▶ GF (padel tiebreaker order)
function compareThirds(a, b) {
  return b.wins - a.wins || b.gd - a.gd || b.gf - a.gf;
}

// Standard 8-team knockout pairing: 1v8, 4v5, 3v6, 2v7 — in that slot order,
// so the top two seeds sit in opposite halves and can only meet in the final.
// The seeding transparency panel reads the same table, so the two never drift.
const SEED_PAIRS = [[0, 7], [3, 4], [2, 5], [1, 6]];

// Builds the QF pairing from tiers of qualifiers, in strict tier order:
// every group winner outranks every runner-up, every runner-up outranks
// every third. Seeds 1..8 are just the flattened tiers, so seed 1 is the
// best 1st and seed 8 the weakest last-tier qualifier. Callers sort each
// tier internally with compareThirds (wins ▶ GD ▶ GF) — never by points,
// which include consolation scoring for close losses and so measure
// participation rather than strength.
//
// If a pairing would rematch two teams that already met in the group stage,
// it's resolved by swapping seats WITHIN one tier (a 2nd trades places with
// another 2nd), so a clash fix can never promote a team above a tier it
// didn't earn, and 1v8 stays 1v8.
function seedStandardBracket(tiers) {
  const seeded = tiers.flat();
  if (seeded.length !== 8) return null;
  const bounds = [];
  let off = 0;
  tiers.forEach(t => { bounds.push([off, off + t.length]); off += t.length; });
  const tierOf = (i) => bounds.findIndex(([lo, hi]) => i >= lo && i < hi);
  // A still-undecided slot (thirds-playoff winner) has no group yet, so it
  // can't clash — treat it as compatible with everyone.
  const grp = (x) => x?.group || (/^[A-Z]\d$/.test(x?.seed || "") ? x.seed[0] : null);
  const partnerOf = (i) => { const p = SEED_PAIRS.find(pr => pr[0] === i || pr[1] === i); return p[0] === i ? p[1] : p[0]; };

  for (const [x, y] of SEED_PAIRS) {
    const gx = grp(seeded[x]), gy = grp(seeded[y]);
    if (!gx || !gy || gx !== gy) continue;
    const [lo, hi] = bounds[tierOf(y)];
    for (let k = lo; k < hi; k++) {
      if (k === y) continue;
      // Never trade places with a slot that has no group yet (the thirds-
      // playoff winner). It looks like a free fix because an unknown cannot
      // clash, but it demotes the known best third to seed 8 against the top
      // seed, and the clash returns anyway if the playoff is won by a team
      // from that same group.
      if (!grp(seeded[k])) continue;
      // Swapping y and k must leave BOTH pairings clash-free.
      if (grp(seeded[k]) !== gx && grp(seeded[y]) !== grp(seeded[partnerOf(k)])) {
        const t = seeded[y]; seeded[y] = seeded[k]; seeded[k] = t;
        break;
      }
    }
  }
  return SEED_PAIRS.map(([x, y], i) => ({ slot: i + 1, a: seeded[x], b: seeded[y] }));
}

function calcStreak(idxs) {
  if (!idxs?.length) return 0;
  const sorted = [...idxs].sort((a, b) => a - b);
  let total = 0, len = 0, last = null;
  for (const i of sorted) {
    if (last === null || i === last + 1) len++; else len = 1;
    last = i;
    // len=1: no bonus (first session alone doesn't count)
    // len=2: +1, len=3: +1, len=4: jackpot +3
    if (len === 2 || len === 3) total += 1;
    else if (len >= 4) total += 3;
  }
  return Math.min(total, 5);
}

function koMatchPts(match, teamId) {
  if (teamWon(match, teamId)) return 3;
  const t = match.lossType || "tiebreak";
  return t === "tiebreak" ? 2 : t === "competitive" ? 1 : 0;
}

function calcPlayerStats(pid, sessions) {
  let total = 0;
  const breakdown = { matchPts: 0, topOfGroup: 0, knockoutPts: 0, streakPts: 0, comebackPts: 0 };
  const stats = { groupWins: 0, groupPlayed: 0, sessionsPlayed: 0, qfReached: 0, qfWins: 0, sfReached: 0, sfWins: 0, finalsReached: 0, finalsWon: 0 };
  const attended = [];
  const partners = {};
  sessions.forEach((s, idx) => {
    const team = getPlayerTeam(s, pid); if (!team) return;
    stats.sessionsPlayed++;
    const partnerId = team.p1Id === pid ? team.p2Id : team.p1Id;
    partners[partnerId] = (partners[partnerId] || 0) + 1;
    // 2X Double Points (applies to everything except streak)
    const mult = s.doublePoints ? 2 : 1;
    let sessionPlayed = 0;
    // Group scoring is normalised to the group-of-4 baseline: only each team's
    // best GROUP_COUNTED_GAMES (3) results count toward series points, so a
    // 5-team group (4 matches) drops its lowest and the maximum matches a group
    // of 4. Win/played records below stay actual. Knockout and playoff matches
    // are not group matches, so they never enter this calculation.
    (s.groupMatches || []).forEach(m => {
      if (m.team1Id !== team.id && m.team2Id !== team.id) return;
      if (!m.winner) return;
      stats.groupPlayed++; sessionPlayed++;
      if (teamWon(m, team.id)) stats.groupWins++;
    });
    teamGroupResults(s, team.id).counted.forEach(r => {
      total += r.pts * mult; breakdown.matchPts += r.pts * mult;
    });
    // Only award top-of-group if team actually played matches
    if (sessionPlayed > 0 && getTopOfGroup(s, team.group) === team.id) { total += 1 * mult; breakdown.topOfGroup += 1 * mult; }
    // Only count streak if player actually played a match this session
    if (sessionPlayed > 0) {
      // Comeback bonus: +2 for returning after missing 2+ consecutive sessions
      if (attended.length > 0 && (idx - attended[attended.length - 1]) >= 3) {
        total += 2; breakdown.comebackPts += 2;
      }
      attended.push(idx);
    }
    const qfM = s.bracket?.qf?.find(m => (m.team1Id === team.id || m.team2Id === team.id) && m.winner);
    if (qfM) { stats.qfReached++; if (teamWon(qfM, team.id)) stats.qfWins++; const qp = (1 + koMatchPts(qfM, team.id)) * mult; total += qp; breakdown.knockoutPts += qp; }
    const sfM = s.bracket?.sf?.find(m => (m.team1Id === team.id || m.team2Id === team.id) && m.winner);
    if (sfM) { stats.sfReached++; if (teamWon(sfM, team.id)) stats.sfWins++; const sp = (2 + koMatchPts(sfM, team.id)) * mult; total += sp; breakdown.knockoutPts += sp; }
    const f = s.bracket?.final;
    if (f && (f.team1Id === team.id || f.team2Id === team.id) && f.winner) {
      stats.finalsReached++;
      const fp = (3 + koMatchPts(f, team.id) + (teamWon(f, team.id) ? 5 : 0)) * mult;
      total += fp; breakdown.knockoutPts += fp;
      if (teamWon(f, team.id)) stats.finalsWon++;
    }
  });
  const streak = calcStreak(attended); total += streak; breakdown.streakPts = streak;
  return { totalPts: total, breakdown, stats, attended, partners };
}

// ══ VOL.8 · PER-EVENT SCORING DETAIL ══════════════════════════════════════
//
// Players kept asking "how many points did I get and why", and the honest
// answer used to be a single number. This block turns the same arithmetic
// calcPlayerStats does into a list of receipt lines.
//
// It deliberately does NOT re-implement scoring. It walks the same path, in the
// same order, and records each award as it is made. calcPlayerNights then checks
// its own total against calcPlayerStats and reports `ok:false` if they ever
// disagree, which the UI surfaces rather than hides — a receipt that quietly
// drifts from the leaderboard is worse than no receipt.

// Same ordering and bye logic as teamGroupResults, but keeping the match so each
// counted result can say who it was against. teamGroupResults throws the match
// away, which is fine for a total and useless for a receipt.
function countedGroupResults(session, teamId) {
  const out = [];
  (session.groupMatches || []).forEach(m => {
    if (m.team1Id !== teamId && m.team2Id !== teamId) return;
    if (!m.winner) return;
    const isT1 = m.team1Id === teamId;
    const won = teamWon(m, teamId);
    const lt = m.lossType || "tiebreak";
    out.push({
      m, won, lt,
      pts: won ? 3 : (lt === "tiebreak" ? 2 : lt === "competitive" ? 1 : 0),
      gf: m.score ? (isT1 ? m.score.t1 : m.score.t2) : 0,
      ga: m.score ? (isT1 ? m.score.t2 : m.score.t1) : 0,
    });
  });
  out.sort((a, b) => b.pts - a.pts || (b.gf - b.ga) - (a.gf - a.ga) || b.gf - a.gf);
  const gTeam = (session.teams || []).find(t => t.id === teamId);
  const gSize = gTeam ? (session.teams || []).filter(t => t.group === gTeam.group).length : 0;
  const ghosts = out.length > 0 ? Math.max(0, GROUP_COUNTED_GAMES - Math.max(0, gSize - 1)) : 0;
  const withByes = out.concat(Array.from({ length: ghosts },
    () => ({ bye: true, won: true, pts: 3, gf: 6, ga: 0 })));
  return {
    counted: withByes.slice(0, GROUP_COUNTED_GAMES),
    dropped: withByes.slice(GROUP_COUNTED_GAMES),
  };
}

function lossWord(lt) {
  return lt === "tiebreak" ? "tiebreak loss" : lt === "competitive" ? "close loss" : "blowout";
}
function scoreOf(m, teamId) {
  if (!m || !m.score) return "";
  const isT1 = m.team1Id === teamId;
  return (isT1 ? m.score.t1 : m.score.t2) + "–" + (isT1 ? m.score.t2 : m.score.t1);
}
function koLine(m, teamId) {
  if (!m) return "";
  const won = teamWon(m, teamId);
  const sc = scoreOf(m, teamId);
  if (won) return sc ? "Won " + sc : "Won";
  return (sc ? "Lost " + sc : "Lost") + " · " + lossWord(m.lossType || "tiebreak") + " · knocked out";
}

// One receipt per night a player was on a team, plus the season-level lines.
// `nameOf(session, teamId)` renders "Khalid & Rashid"; the caller owns it
// because only the component has the player list.
function calcPlayerNights(pid, sessions, nameOf) {
  const nights = [];
  const seg = { groupWins: 0, lossPts: 0, topOfGroup: 0, knockout: 0,
                titles: 0, comeback: 0, streak: 0, double: 0 };
  const attended = [];
  let total = 0;

  sessions.forEach((s, idx) => {
    const team = getPlayerTeam(s, pid);
    if (!team) return;
    const mult = s.doublePoints ? 2 : 1;
    const ev = [];
    let base = 0, flat = 0;

    const played = (s.groupMatches || [])
      .filter(m => (m.team1Id === team.id || m.team2Id === team.id) && m.winner).length;
    const { counted, dropped } = countedGroupResults(s, team.id);

    counted.forEach(r => {
      base += r.pts;
      if (r.bye) {
        ev.push({ kind: "GROUP", label: "Bye", pts: r.pts,
                  detail: "group too small for three games" });
        seg.groupWins += r.pts;
        return;
      }
      const opp = r.m.team1Id === team.id ? r.m.team2Id : r.m.team1Id;
      const sc = scoreOf(r.m, team.id);
      ev.push({
        kind: "GROUP", pts: r.pts,
        label: "vs " + nameOf(s, opp),
        detail: r.won ? (sc ? "Won " + sc : "Won")
                      : (sc ? "Lost " + sc : "Lost") + " · " + lossWord(r.lt),
      });
      if (r.won) seg.groupWins += r.pts; else seg.lossPts += r.pts;
    });

    // The best-three rule is the single most common "why don't I have more
    // points" question, so a dropped result is shown rather than omitted.
    dropped.forEach(r => {
      if (r.bye) return;
      const opp = r.m.team1Id === team.id ? r.m.team2Id : r.m.team1Id;
      ev.push({ kind: "DROPPED", pts: 0, label: "vs " + nameOf(s, opp),
                detail: "best three group results count — this one dropped" });
    });

    if (played > 0 && getTopOfGroup(s, team.group) === team.id) {
      base += 1; seg.topOfGroup += 1;
      ev.push({ kind: "GROUP", pts: 1, label: "Top of Group " + team.group, detail: "" });
    }

    // Comeback is a flat +2 in calcPlayerStats — it is NOT doubled on a 2X
    // night. Folding it into `base` would silently pay 4 on those nights.
    if (played > 0) {
      const prev = attended.length ? attended[attended.length - 1] : null;
      if (prev !== null && (idx - prev) >= 3) {
        flat += 2; seg.comeback += 2;
        ev.push({ kind: "BONUS", pts: 2, label: "Comeback",
                  detail: "back after " + (idx - prev - 1) + " nights out" });
      }
      attended.push(idx);
    }

    const qfM = (s.bracket?.qf || []).find(m => (m.team1Id === team.id || m.team2Id === team.id) && m.winner);
    if (qfM) {
      const p = 1 + koMatchPts(qfM, team.id);
      base += p; seg.knockout += p;
      ev.push({ kind: "KNOCKOUT", pts: p, label: "Quarter-final", detail: koLine(qfM, team.id) });
    }
    const sfM = (s.bracket?.sf || []).find(m => (m.team1Id === team.id || m.team2Id === team.id) && m.winner);
    if (sfM) {
      const p = 2 + koMatchPts(sfM, team.id);
      base += p; seg.knockout += p;
      ev.push({ kind: "KNOCKOUT", pts: p, label: "Semi-final", detail: koLine(sfM, team.id) });
    }
    const f = s.bracket?.final;
    const inFinal = f && (f.team1Id === team.id || f.team2Id === team.id) && f.winner;
    if (inFinal) {
      const p = 3 + koMatchPts(f, team.id);
      base += p; seg.knockout += p;
      ev.push({ kind: "KNOCKOUT", pts: p, label: "Final", detail: koLine(f, team.id) });
      if (teamWon(f, team.id)) {
        base += 5; seg.titles += 5;
        const mate = team.p1Id === pid ? team.p2Id : team.p1Id;
        ev.push({ kind: "TITLE", pts: 5, label: "Session champion",
                  detail: "With " + nameOf(s, null, mate) });
      }
    }

    const doubled = base * (mult - 1);
    seg.double += doubled;
    const nightTotal = base * mult + flat;
    total += nightTotal;

    nights.push({
      idx, id: s.id, date: s.date, name: s.name, no: idx + 1,
      x2: mult === 2, events: ev, subtotal: base, flat, mult,
      nightTotal, played,
      outcome: inFinal && teamWon(f, team.id) ? "Session champion"
             : inFinal ? "Reached the final"
             : sfM ? "Reached the semi-final"
             : qfM ? "Made the knockout"
             : "Group stage",
    });
  });

  const streak = calcStreak(attended);
  seg.streak = streak;
  total += streak;

  // The guard rail. If this ever fails the UI says so instead of showing a
  // receipt that disagrees with the table.
  const ref = calcPlayerStats(pid, sessions).totalPts;
  return { nights, seg, total, attended, ok: total === ref, ref };
}

// Where each player stood after every night, so "climbed N places" is a fact
// rather than an impression. O(sessions x players), which at nine nights and a
// roster this size is nothing.
function rankByNight(players, sessions) {
  const out = [];
  for (let i = 0; i < sessions.length; i++) {
    const upto = sessions.slice(0, i + 1);
    const table = players
      .map(p => ({ id: p.id, pts: calcPlayerStats(p.id, upto).totalPts }))
      .sort((a, b) => b.pts - a.pts);
    const pos = {};
    table.forEach((r, j) => { pos[r.id] = j + 1; });
    out.push(pos);
  }
  return out;
}

const BADGES = [
  { code: "IM", name: "Iron man",   desc: "Played every finished night" },
  { code: "3T", name: "Hat-trick",  desc: "Three session titles" },
  { code: "GK", name: "Giant killer", desc: "Beat the team holding the #1 spot" },
  { code: "CB", name: "Comeback",   desc: "Won a match after trailing 2–5" },
  { code: "+5", name: "Climber",    desc: "Moved up 5+ places in one night" },
  { code: "D1", name: "Debut win",  desc: "Won a match on your first night" },
  { code: "W3", name: "On a run",   desc: "Three match wins in a row" },
];

function calcBadges(pid, sessions, players, nightsData, ranks) {
  const done = sessions.filter(s => s.completed).length || sessions.length;
  const played = nightsData.nights.length;
  const titles = nightsData.nights.filter(n => n.outcome === "Session champion").length;

  // Every decided match this player's team was in, in order.
  const results = [];
  sessions.forEach((s, idx) => {
    const team = getPlayerTeam(s, pid); if (!team) return;
    const all = (s.groupMatches || []).concat(s.bracket?.qf || [], s.bracket?.sf || [],
                                              s.bracket?.final ? [s.bracket.final] : []);
    all.forEach(m => {
      if (!m || !m.winner) return;
      if (m.team1Id !== team.id && m.team2Id !== team.id) return;
      results.push({ idx, won: teamWon(m, team.id), m, team });
    });
  });

  let best = 0, run = 0;
  results.forEach(r => { run = r.won ? run + 1 : 0; best = Math.max(best, run); });

  const firstIdx = nightsData.nights.length ? nightsData.nights[0].idx : null;
  const debutWin = firstIdx !== null && results.some(r => r.idx === firstIdx && r.won);

  // Giant killer: beat a team containing whoever led the table going INTO that
  // night, which is the only reading that is fair at the time it happened.
  let giant = false;
  results.forEach(r => {
    if (!r.won || r.idx === 0) return;
    const prev = ranks[r.idx - 1] || {};
    const leader = Object.keys(prev).find(id => prev[id] === 1);
    if (!leader) return;
    const s = sessions[r.idx];
    const oppId = r.m.team1Id === r.team.id ? r.m.team2Id : r.m.team1Id;
    const opp = (s.teams || []).find(t => t.id === oppId);
    if (opp && (opp.p1Id === leader || opp.p2Id === leader)) giant = true;
  });

  let climb = 0;
  nightsData.nights.forEach(n => {
    if (n.idx === 0) return;
    const before = (ranks[n.idx - 1] || {})[pid];
    const after = (ranks[n.idx] || {})[pid];
    if (before && after) climb = Math.max(climb, before - after);
  });

  return BADGES.map(b => {
    switch (b.code) {
      case "IM": return { ...b, got: played >= done && done > 0, prog: played + "/" + done };
      case "3T": return { ...b, got: titles >= 3, prog: titles + "/3" };
      case "GK": return { ...b, got: giant };
      // The handoff flags this one as needing data the app does not record: a
      // comeback flag on result entry, or a game-by-game score. Only the final
      // score is stored, so it is shown locked with the reason rather than
      // quietly redefined into something else.
      case "CB": return { ...b, got: false, locked: "needs game-by-game scoring" };
      case "+5": return { ...b, got: climb >= 5, prog: climb > 0 ? "best +" + climb : null };
      case "D1": return { ...b, got: debutWin };
      case "W3": return { ...b, got: best >= 3, prog: Math.min(best, 3) + "/3" };
      default:   return { ...b, got: false };
    }
  });
}


// Last n decided results for a player across the series (most recent last),
// as 'W'/'L'. Used for the form strip and hot-streak detection.
function recentForm(pid, sessions, n = 5) {
  const res = [];
  sessions.forEach(s => {
    const team = getPlayerTeam(s, pid); if (!team) return;
    (s.groupMatches || []).forEach(m => {
      if ((m.team1Id === team.id || m.team2Id === team.id) && m.winner) res.push(teamWon(m, team.id) ? "W" : "L");
    });
    ["qf", "sf"].forEach(r => {
      const km = s.bracket?.[r]?.find(m => (m.team1Id === team.id || m.team2Id === team.id) && m.winner);
      if (km) res.push(teamWon(km, team.id) ? "W" : "L");
    });
    const f = s.bracket?.final;
    if (f && (f.team1Id === team.id || f.team2Id === team.id) && f.winner) res.push(teamWon(f, team.id) ? "W" : "L");
  });
  return res.slice(-n);
}

// Current win streak (trailing W count) from a form array.
function currentStreak(form) {
  let n = 0;
  for (let i = form.length - 1; i >= 0; i--) { if (form[i] === "W") n++; else break; }
  return n;
}

function getLockedPartners(pid, sessions) {
  const locked = new Set();
  sessions.forEach(s => {
    const team = getPlayerTeam(s, pid); if (!team) return;
    const partnerId = team.p1Id === pid ? team.p2Id : team.p1Id;
    // Lock only if they WON the final together (session champions)
    const wonFinal = s.bracket?.final && teamWon(s.bracket.final, team.id);
    if (wonFinal) locked.add(partnerId);
  });
  return locked;
}

// ── YOUR STANDING ────────────────────────────────────────────────────────
// The first thing on HOME once the phone knows who it belongs to. Answers
// "where do I stand" without a scroll: rank, points, movement since the last
// session, and the gap to the place above.
function YourStanding({ leaderboard, state, meId, onOpenPicker, setTab }) {
  const played = leaderboard.filter(hasPlayedEntry);

  // Rank a session ago, so movement is real rather than decorative. Same
  // method the RANK tab uses: rebuild the table over sessions minus the last.
  const prevRank = useMemo(() => {
    const ss = state.sessions || [];
    if (ss.length < 2) return null;
    const board = state.players
      .map(pl => ({ id: pl.id, s: calcPlayerStats(pl.id, ss.slice(0, -1)) }))
      .filter(e => e.s.stats.groupPlayed > 0 || e.s.stats.qfReached > 0)
      .sort((a, b) => b.s.totalPts - a.s.totalPts);
    const m = {}; board.forEach((e, i) => { m[e.id] = i + 1; });
    return m;
  }, [state.players, state.sessions]);

  if (!meId || !played.some(e => e.player.id === meId)) {
    return (
      <button onClick={onOpenPicker}
        style={{width:"100%",display:"flex",alignItems:"center",justifyContent:"space-between",gap:12,
                background:"rgba(14,14,14,.92)",border:"1px solid rgba(198,255,0,.35)",borderRadius: 0,
                padding:"16px 16px 14px",cursor:"pointer",textAlign:"left"}}>
        <span>
          <span style={{display:"block",fontFamily:"'JetBrains Mono',monospace",fontWeight:700,fontSize:10,
                        letterSpacing:".22em",color:"#C6FF00"}}>YOUR STANDING</span>
          <span style={{display:"block",marginTop:6,fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900",fontSize:24,letterSpacing:1,
                        color:"#F2F2F2",lineHeight:1}}>WHICH ONE ARE YOU?</span>
          <span style={{display:"block",marginTop:6,fontFamily:"'Archivo',sans-serif",fontSize:12,color:"#9A9A9A"}}>
            Tap once to follow your own rank</span>
        </span>
        <span style={{flex:"0 0 auto",fontFamily:"'JetBrains Mono',monospace",fontWeight:700,fontSize:20,
                      color:"#C6FF00"}}>&rarr;</span>
      </button>
    );
  }

  const i    = played.findIndex(e => e.player.id === meId);
  const me   = played[i];
  const rank = i + 1;
  const above = i > 0 ? played[i - 1] : null;
  const gap   = above ? above.totalPts - me.totalPts : 0;
  const was   = prevRank ? prevRank[meId] : null;
  const delta = (was && was !== rank) ? was - rank : 0;

  const box = { flex:1, background:"rgba(10,10,10,.55)", border:"1px solid rgba(242,242,242,.08)",
                padding:"10px 8px 9px", textAlign:"center" };
  const num = { fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize:26, lineHeight:1, color:"#F2F2F2" };
  const cap = { display:"block", marginTop:5, fontFamily:"'JetBrains Mono',monospace", fontWeight:700,
                fontSize:9, letterSpacing:".14em", color:"#9A9A9A" };

  return (
    <div style={{background:"rgba(14,14,14,.92)",border:"1px solid rgba(198,255,0,.35)",
                 borderRadius: 0,padding:"14px 14px 13px"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,marginBottom:10}}>
        <span style={{fontFamily:"'JetBrains Mono',monospace",fontWeight:700,fontSize:10,
                      letterSpacing:".22em",color:"#C6FF00"}}>YOUR STANDING</span>
        <button onClick={onOpenPicker}
          style={{background:"none",border:"none",cursor:"pointer",padding:"2px 0",
                  fontFamily:"'JetBrains Mono',monospace",fontWeight:700,fontSize:10,
                  letterSpacing:".14em",color:"#9A9A9A"}}>NOT YOU?</button>
      </div>

      <div onClick={() => setTab("leaderboard")} style={{display:"flex",alignItems:"baseline",gap:10,cursor:"pointer"}}>
        <span style={{fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900",fontSize:52,lineHeight:.85,color:"#C6FF00"}}>
          {rank}<span style={{fontSize:20,color:"#9A9A9A"}}>{rank===1?"st":rank===2?"nd":rank===3?"rd":"th"}</span></span>
        <span style={{flex:1,minWidth:0,fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900",fontSize:23,letterSpacing:.5,color:"#F2F2F2",
                      lineHeight:1.05,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
          {me.player.name.toUpperCase()}</span>
      </div>

      <div style={{display:"flex",gap:8,marginTop:12}}>
        <div style={box}><span style={num}>{me.totalPts}</span><span style={cap}>POINTS</span></div>
        <div style={box}>
          <span style={{...num, color: delta > 0 ? "#C6FF00" : delta < 0 ? "#C6FF00" : "#9A9A9A"}}>
            {delta > 0 ? "\u25B2" + delta : delta < 0 ? "\u25BC" + Math.abs(delta) : "\u2013"}</span>
          <span style={cap}>SINCE LAST</span>
        </div>
        <div style={box}>
          <span style={num}>{above ? gap : "\u2013"}</span>
          <span style={cap}>{above ? "BEHIND " + rank_ordinal(rank - 1) : "TOP SPOT"}</span>
        </div>
      </div>
    </div>
  );
}
function rank_ordinal(n) { return n + (n===1?"ST":n===2?"ND":n===3?"RD":"TH"); }

// ── "Which one are you?" ──────────────────────────────────────────────────
// Searchable because 73 names is too many to scan, and a shared phone needs
// to be able to switch without clearing storage by hand.
function MePicker({ leaderboard, meId, onPick, onClear, onClose }) {
  const [q, setQ] = useState("");
  const played = leaderboard.filter(hasPlayedEntry);
  const shown = q ? played.filter(e => e.player.name.toLowerCase().includes(q.toLowerCase())) : played;
  return (
    <Modal open={true} onClose={onClose} title="WHICH ONE ARE YOU?">
      <div style={{fontFamily:"'Archivo',sans-serif",fontSize:13,lineHeight:1.5,color:"#9A9A9A",marginBottom:14}}>
        Saved on this phone only. No account, and it never unlocks scoring.
      </div>
      <input value={q} onChange={e => setQ(e.target.value)} placeholder="Search your name"
        style={{width:"100%",background:"rgba(10,10,10,.9)",border:"1px solid rgba(242,242,242,.14)",
                color:"#F2F2F2",padding:"12px 14px",fontFamily:"'Archivo',sans-serif",fontSize:15,
                outline:"none",borderRadius: 0,marginBottom:12}} />
      <div style={{maxHeight:"46vh",overflowY:"auto",WebkitOverflowScrolling:"touch"}}>
        {shown.map((e, i) => {
          const mine = e.player.id === meId;
          return (
            <button key={e.player.id} onClick={() => onPick(e.player.id)}
              style={{width:"100%",display:"flex",alignItems:"center",gap:12,textAlign:"left",
                      background: mine ? "rgba(198,255,0,.12)" : "rgba(10,10,10,.6)",
                      border:"1px solid " + (mine ? "rgba(198,255,0,.5)" : "rgba(242,242,242,.08)"),
                      borderRadius: 0,padding:"11px 12px",marginBottom:6,cursor:"pointer"}}>
              <span style={{flex:"0 0 auto",width:34,textAlign:"right",fontFamily:"'JetBrains Mono',monospace",
                            fontWeight:700,fontSize:12,color:"#9A9A9A"}}>{played.indexOf(e) + 1}</span>
              <span style={{flex:1,minWidth:0,fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900",fontSize:19,letterSpacing:.5,
                            color:"#F2F2F2",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                {e.player.name.toUpperCase()}</span>
              <span style={{flex:"0 0 auto",fontFamily:"'JetBrains Mono',monospace",fontWeight:700,
                            fontSize:12,color:"#9A9A9A"}}>{e.totalPts} PTS</span>
            </button>
          );
        })}
        {shown.length === 0 && (
          <div style={{padding:"18px 4px",fontFamily:"'Archivo',sans-serif",fontSize:14,color:"#9A9A9A"}}>
            No one by that name has played yet.
          </div>
        )}
      </div>
      {meId && (
        <button onClick={onClear}
          style={{marginTop:12,width:"100%",background:"none",border:"1px solid rgba(242,242,242,.14)",
                  color:"#9A9A9A",padding:"11px",fontFamily:"'JetBrains Mono',monospace",fontWeight:700,
                  fontSize:11,letterSpacing:".16em",cursor:"pointer",borderRadius: 0}}>
          NOT ME — FORGET THIS PHONE
        </button>
      )}
    </Modal>
  );
}

function Modal({ open, onClose, title, children }) {

          <button onClick={onClose} style={{background:"none",border:"none",cursor:"pointer",color:"#F2F2F2",padding:4}}><I.x size={22} /></button>
