html:not(.light) nav.fixed .grid > button[style*="var(--orange-br)"] svg{color:#C6FF00 !important;}


/* ═══════════════════════════════════════════════════════════
   BLACKOUT SERIES · BOX TREATMENT v2 — CORNER TICKS
   No outlines and no angled cuts. Each surface is a flat dark
   plate marked by two L-shaped corner ticks (drawn with
   background gradients, so no pseudo-element conflicts).
   Accent colour of the ticks carries the meaning.
   ═══════════════════════════════════════════════════════════ */
:root{ --tick:#C6FF00; --plate:rgba(16,20,29,.92); --plate-2:rgba(255,255,255,.035); }

.jh-panel,.jh-srow,.jh-lbrow,.jh-mock-sess,.jh-mock-row,
[class*="bg-stone-9"]:not(nav):not(header):not(.sticky){
  clip-path:none !important;
  border:none !important;
  border-radius:0 !important;
  box-shadow:none !important;
  background-color:var(--plate) !important;
  background-image:
    linear-gradient(var(--tick),var(--tick)), linear-gradient(var(--tick),var(--tick)),
    linear-gradient(var(--tick),var(--tick)), linear-gradient(var(--tick),var(--tick)) !important;
  background-size:16px 2px, 2px 16px, 16px 2px, 2px 16px !important;
  background-position:0 0, 0 0, 100% 100%, 100% 100% !important;
  background-repeat:no-repeat !important;
}
/* nested rows: quieter plate, steel ticks so they don't compete */
.jh-panel .jh-mock-row,.jh-panel .jh-mock-sess,
[class*="bg-stone-9"] [class*="bg-stone-9"]{
  --tick:#9A9A9A;
  background-color:var(--plate-2) !important;
}
/* meaning through tick colour */
.jh-fill-red,.jh-lbrow.r1,.jh-srow.active{ --tick:#C6FF00; }
.jh-fill-blue,.jh-fill-yellow{ --tick:#FF2E88; }
.jh-fill-green{ --tick:#C6FF00; }
.jh-lbrow.r2{ --tick:#CFCFCF; }
.jh-lbrow.r3{ --tick:#9A9A9A; }
/* the hero is the one full-bleed surface: bloom, ticks in red, no frame */
.jh-hero{
  background-color:rgba(8,10,16,.96) !important;
  background-image:
    radial-gradient(ellipse 80% 55% at 50% 18%,rgba(198,255,0,.16),transparent 62%),
    linear-gradient(#C6FF00,#C6FF00), linear-gradient(#C6FF00,#C6FF00),
    linear-gradient(#C6FF00,#C6FF00), linear-gradient(#C6FF00,#C6FF00) !important;
  background-size:auto, 26px 2px, 2px 26px, 26px 2px, 2px 26px !important;
  background-position:center, 0 0, 0 0, 100% 100%, 100% 100% !important;
  background-repeat:no-repeat !important;
  border:none !important;
}
/* hover: brighten the plate, ticks stay put */
.jh-srow:hover,.jh-lbrow:hover,.jh-mock-row:hover,.jh-mock-sess:hover{
  background-color:rgba(198,255,0,.07) !important;
}
/* stat tiles: plate + ticks, value in chalk, label steel */
.grid > div[style*="padding"]{box-shadow:none !important;}
/* medal chips follow the same ladder — never gold */
.jh-lbrow.r1 .jh-rank{background:rgba(198,255,0,.16) !important;color:#C6FF00 !important;}
.jh-lbrow.r2 .jh-rank{background:rgba(201,207,218,.14) !important;color:#CFCFCF !important;}
.jh-lbrow.r3 .jh-rank{background:rgba(154,154,154,.14) !important;color:#9A9A9A !important;}
.jh-crown{color:#C6FF00 !important;filter:drop-shadow(0 0 8px rgba(198,255,0,.6)) !important;}


/* list rows (matches, fixtures) are not cards: no ticks, just a plate +
   hairline rule so long lists stay calm. Ticks are for cards only. */
.space-y-1\.5 > div[class*="bg-stone-9"][class*="rounded"],
.space-y-1 > div[class*="bg-stone-9"][class*="rounded"],
.space-y-2 > div[class*="bg-stone-9"][class*="rounded"],
.space-y-1\.5 > div,.space-y-1 > div,.space-y-2 > div{
  background-image:none !important;
  background-color:rgba(255,255,255,.028) !important;
  border-bottom:1px solid rgba(242,242,242,.07) !important;
}
.space-y-1\.5 > div:hover,.space-y-1 > div:hover{background-color:rgba(198,255,0,.06) !important;}
/* standings rows keep their own treatment (they carry rank meaning) */
.jh-lbrow,.jh-srow{border-bottom:none !important;}


/* ═══════════════════════════════════════════════════════════
   BLACKOUT SERIES · MOTION + NAV PASS
   1. Bottom nav no longer drifts: it drops backdrop-filter (the
      expensive thing that re-rasterises while Safari's toolbar
      collapses), gets its own compositor layer, and finally
      honours env(safe-area-inset-bottom) — the page has always
      set viewport-fit=cover but never read the inset back.
   2. Nav restyled as a HUD console: segment dividers, mono
      labels, corner ticks, active segment in red.
   3. Press feedback on everything pressable.
   4. Motion curves + durations: UI moves in under 250ms.
   5. Hover effects gated to devices that actually hover, so a
      tap no longer leaves a row stuck in its hover colour.
   6. prefers-reduced-motion covers scanlines and chromatic
      text-splits, not just .glitch-in.
   ═══════════════════════════════════════════════════════════ */
:root{
  --ease-out:cubic-bezier(.34,1.56,.64,1);
  --ease-in-out:cubic-bezier(.77,0,.175,1);
}

/* ── 1 · NAV: stable, safe-area aware ─────────────────────── */
nav.fixed.bottom-0{
  backdrop-filter:none !important;
  -webkit-backdrop-filter:none !important;
  padding-bottom:env(safe-area-inset-bottom,0px) !important;
  transform:translateZ(0);
  will-change:transform;
}
/* colour needs html:not(.light) to outrank the earlier dark-mode nav rule,
   otherwise that rule wins on specificity and the ticks never paint */
html:not(.light) nav.fixed.bottom-0{
  /* fully opaque: with backdrop-blur gone, any translucency lets the
     hero type ghost through the bar */
  background-color:#050505 !important;
  border-top:1px solid rgba(198,255,0,.35) !important;
  /* corner ticks, drawn as backgrounds so no pseudo-element clash */
  background-image:
    linear-gradient(#FF2E88,#FF2E88), linear-gradient(#FF2E88,#FF2E88),
    linear-gradient(#C6FF00,#C6FF00), linear-gradient(#C6FF00,#C6FF00) !important;
  background-size:14px 2px, 2px 14px, 14px 2px, 2px 14px !important;
  background-position:0 0, 0 0, 100% 100%, 100% 100% !important;
  background-repeat:no-repeat !important;
}
/* the main region must clear the taller nav */
main.pb-24{ padding-bottom:calc(6rem + env(safe-area-inset-bottom,0px)) !important; }

/* ── 2 · NAV: HUD console segments ────────────────────────── */
html:not(.light) nav.fixed .grid > button,
html:not(.light) nav.fixed .grid > a{
  border-right:1px solid rgba(242,242,242,.08) !important;
  border-radius:0 !important;
  transition:color 160ms ease, background-color 160ms ease,
             transform 160ms var(--ease-out) !important;
}
html:not(.light) nav.fixed .grid > *:last-child{ border-right:none !important; }
nav.fixed .grid > button span,nav.fixed .grid > a span{
  font-family:'JetBrains Mono',monospace !important;
  font-size:9px !important;letter-spacing:1px !important;
}

/* ── 3 · PRESS FEEDBACK ───────────────────────────────────── */
nav.fixed .grid > button:active,
nav.fixed .grid > a:active{ transform:scale(.94) !important; }
.jh-srow:active,.jh-lbrow:active,.jh-mock-row:active,.jh-mock-sess:active{
  transform:scale(.985);
}
button:active:not(:disabled),[role="button"]:active{ transform:scale(.97); }
.jh-srow,.jh-lbrow,.jh-mock-row,.jh-mock-sess{
  transition:transform 160ms var(--ease-out), background-color 160ms ease;
}

/* ── 4 · CURVES: replace Tailwind's transition-all ─────────── */
.transition-all{
  transition-property:transform,background-color,border-color,color,opacity !important;
  transition-duration:180ms !important;
  transition-timing-function:var(--ease-out) !important;
}
.transition-colors{ transition-duration:160ms !important; }

/* ── 5 · HOVER ONLY WHERE HOVER EXISTS ────────────────────── */
@media (hover:none){
  .jh-srow:hover,.jh-lbrow:hover,.jh-mock-row:hover,.jh-mock-sess:hover,
  .space-y-1\.5 > div:hover,.space-y-1 > div:hover{
    background-color:inherit !important;
    border-color:inherit !important;
  }
}

/* ── 6 · REDUCED MOTION, properly ─────────────────────────── */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{

<script>
/* Presentational only — a press ripple and a bump on numbers that change.
   Reads no state, writes no state, touches no React props. */
(function(){
  if (matchMedia("(prefers-reduced-motion:reduce)").matches) return;

  document.addEventListener("pointerdown", function(e){
    var t = e.target.closest && e.target.closest(
      "button,[role='button'],.jh-mock-row,.jh-mock-sess,.sg-top,.sg-thin,.jh-chipbtn");
    if (!t) return;
    var r = document.createElement("span");
    r.className = "sg-ripple";
    r.style.left = e.clientX + "px";
    r.style.top  = e.clientY + "px";
    document.body.appendChild(r);
    setTimeout(function(){ r.remove(); }, 480);
  }, { passive: true });

  // Bump whichever number just changed. Guarded three ways: not during the
  // first paint, not inside a field the user is typing in, and never more
  // than a handful at once — a full-table re-render after a server sync
  // would otherwise flash the whole screen.
  var boot = Date.now();
  var mo = new MutationObserver(function(muts){
    if (Date.now() - boot < 1500) return;
    if (muts.length > 12) return;
    muts.forEach(function(m){
      var el = m.target.nodeType === 3 ? m.target.parentElement : m.target;
      if (!el || !el.classList) return;
      if (!/^[\d\s.,:+\-–]+$/.test((el.textContent || "").trim())) return;
      if (el.closest("input,textarea,nav")) return;
      el.classList.remove("sg-bump");
      void el.offsetWidth;
      el.classList.add("sg-bump");
      setTimeout(function(){ el.classList.remove("sg-bump"); }, 460);
    });
  });
  (function start(){
    var root = document.getElementById("root");
    if (!root) return setTimeout(start, 400);
    mo.observe(root, { subtree: true, characterData: true });
  })();
})();
</script>


<script>
/* Bottom-nav indicator. The nav is rendered by React and the active
   tab is only knowable from the inline `color: var(--orange-br)` it
   carries, so the rule is measured from the DOM rather than driven by
   app state — no React changes, and it survives re-renders because a
   MutationObserver re-measures. Width is set too: the segments are
   equal now, but they change count when an admin logs in. */
(function(){
  function mount(){
    var nav=document.querySelector('nav.fixed.bottom-0');
    var grid=nav&&nav.querySelector('.grid');
    if(!grid) return false;
    var ind=nav.querySelector('.aa-ind');
    if(!ind){ ind=document.createElement('div'); ind.className='aa-ind'; nav.appendChild(ind); }
    function place(){
      var el=grid.querySelector('[style*="orange-br"]')||grid.firstElementChild;
      if(!el) return;
      var r=el.getBoundingClientRect(), n=nav.getBoundingClientRect();
      if(!r.width) return;
      ind.style.width=r.width+'px';
      ind.style.transform='translateX('+(r.left-n.left)+'px)';
    }
    place();
    new MutationObserver(place).observe(grid,
      {attributes:true,subtree:true,childList:true,attributeFilter:['style','class']});
    grid.addEventListener('click',function(){ requestAnimationFrame(place); setTimeout(place,80); });
    addEventListener('resize',place);
    addEventListener('orientationchange',function(){ setTimeout(place,120); });
    return true;
  }
  /* the app boots behind a splash, so poll briefly until the nav exists */
  var t=setInterval(function(){ if(mount()) clearInterval(t); },200);
  setTimeout(function(){ clearInterval(t); },30000);
})();
</script>

     never replays it
   - counts the three dashboard stat tiles up from zero, once. The numbers
     are React-rendered, so this writes textContent and stops the moment
     React writes something else — worst case it snaps to the real value,
     which is what it would have shown anyway. */
(function(){
  var root=document.documentElement, RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
  root.classList.add('aa-boot');
  setTimeout(function(){ root.classList.remove('aa-boot'); }, 6000);
  if (RM) return;

  var done=false;
  function countUp(el, target){
    var t0=null, dur=900, last=null;
    function step(ts){
      if(!t0) t0=ts;
      if(last!==null && el.textContent!==last) return;      // React took over
      var k=Math.min(1,(ts-t0)/dur), e=1-Math.pow(1-k,3);   // ease-out cubic
      last=String(Math.round(target*e));
      el.textContent=last;
      if(k<1) requestAnimationFrame(step); else el.textContent=String(target);
    }
    requestAnimationFrame(step);
  }
  function run(){
    if(done) return true;
    var grid=document.querySelector('main .grid.grid-cols-3');
    if(!grid) return false;
    var cells=[].slice.call(grid.children).slice(0,3), any=false;
    cells.forEach(function(c,i){
      var el=c.firstElementChild;
      if(!el) return;
      var n=parseInt(el.textContent,10);
      if(isNaN(n) || String(n)!==el.textContent.trim() || n<=0) return;
      any=true; el.textContent='0';
      setTimeout(function(){ countUp(el,n); }, 420 + i*90);
    });
    done=true;
    return any || true;
  }
  var t=setInterval(function(){ if(run()) clearInterval(t); }, 200);
  setTimeout(function(){ clearInterval(t); }, 12000);
})();
</script>

<script>
/* Branded toast in place of window.alert.
   Shimming the global rather than editing 20 call sites keeps this a single
   reviewable change and means anything added later gets it for free.
   Caveat handled at the one place that mattered: the restore flow used to
   rely on alert() blocking before location.reload(), so that call site now
   delays its reload instead. confirm() is deliberately untouched — it needs
   to block, and a toast cannot answer a question. */
(function(){
  var host=null, native=window.alert.bind(window);
  function show(msg){
    try{
      if(!host){ host=document.createElement('div'); host.id='aa-toast-host';
                 document.body.appendChild(host); }
      var t=document.createElement('div');
      t.className='aa-toast'; t.setAttribute('role','status');
      t.setAttribute('aria-live','polite'); t.textContent=String(msg);
      host.appendChild(t);
      requestAnimationFrame(function(){ t.classList.add('in'); });
      var life=Math.min(7000, 2600 + String(msg).length*28);
      setTimeout(function(){
        t.classList.remove('in');
        setTimeout(function(){ t.remove(); }, 260);
      }, life);
    }catch(e){ native(msg); }   // never lose a message to a broken toast
  }
  window.alert = show;
})();
</script>


<style>
/* ══ BLACKOUT SERIES · VOL.8 SKIN — appended last ══ */
/* ═══════════════════════════════════════════════════════════════════════
   BLACKOUT SERIES · VOL.8 SKIN
   ───────────────────────────────────────────────────────────────────────
   Appended as the LAST style block, after every September Surge override
   layer. Each volume's skin is an append-only layer on the one before, so
   nothing above needs deleting.

   It re-points tokens and enforces four rules the colour sweep cannot:
   square corners, the scanline ground, the lime/magenta division of
   labour, and the hard-edged glow. It does not touch layout, structure,
   or scoring.
   ═══════════════════════════════════════════════════════════════════════ */

/* ── 1 · TOKENS ────────────────────────────────────────────────────────
   The sweep already rewrote every literal in the file. These re-point the
   named tokens so anything added later inherits Blackout rather than a
   Surge value that happens to still be spelled as a variable.
   ────────────────────────────────────────────────────────────────────── */
:root {
  --ink: #0A0A0A;
  --ink2: #050505;
  --orange: #C6FF00;      /* historical name; it is the lead colour */
  --orange-br: #C6FF00;
  --red: #C6FF00;
  --blue: #FF2E88;        /* historical name; it is the accent */
  --blue-deep: #C4215F;
  --blue-soft: #FF8FBE;
  --gold: #FF2E88;
  --cream: #F2F2F2;
  --muted: #9A9A9A;
  --muted2: #6E6E6E;
  --line: rgba(110,110,110,.16);
  --line-2: rgba(255,255,255,.07);
  --surface: rgba(14,14,14,.94);
  --surface-2: rgba(20,20,20,.96);
  --hairline: rgba(110,110,110,.16);

  /* Blackout is a square brand. Anything still reading a radius token gets
     zero, so a component added later cannot reintroduce rounding. */
  --radius: 0px;
  --radius-sm: 0px;
  --radius-lg: 0px;
}

/* ── 2 · SQUARE ────────────────────────────────────────────────────────
   Radius 0 everywhere is the defining shape rule. The build zeroes React
   inline styles (which beat a stylesheet); this covers the CSS rules and
   Tailwind's rounded-* classes in one sweep.

   The deliberate exceptions are circles, not rounded rectangles: status
   dots, the live pulse ring, avatars and the progress ring. They are
   matched by their 50%/9999px radius and left alone.
   ────────────────────────────────────────────────────────────────────── */
[class*="rounded"]:not([style*="50%"]) { border-radius: 0 !important; }
.rounded-full, [style*="border-radius: 50%"], [style*="borderRadius: 50%"] {
  border-radius: 50% !important;
}
button, input, select, textarea, .card, .tile, .panel, .pill, .chip, .sheet {
  border-radius: 0 !important;
}
img.avatar, .avatar img, .dot, .ring { border-radius: 50% !important; }

/* ── 3 · GROUND ───────────────────────────────────────────────────────
   Surge sat on a deep-current gradient with a faint court motif. Blackout
   sits on true black with two corner washes and scanlines — the lights
   going down. The scanline pitch (1px line every 5px) is from the handoff;
   coarser reads as stripes, finer disappears on a phone.
   ────────────────────────────────────────────────────────────────────── */
body {
  background:
    radial-gradient(circle at 100% 18%, rgba(255,46,136,.16), transparent 42%),
    radial-gradient(circle at 0% 92%, rgba(198,255,0,.08), transparent 40%),
    repeating-linear-gradient(0deg, rgba(198,255,0,.045) 0 1px, transparent 1px 5px),
    #050505 !important;
  background-attachment: fixed !important;
}
/* The court-line motif is a Surge/Attack idea and is retired here. */
body::before, body::after { background-image: none !important; }

/* ── 4 · GLOW ─────────────────────────────────────────────────────────
   Surge's glow was wide and soft (40px + 90px). Blackout's is a single
   tight halo — a hard light rather than an atmosphere.
   ────────────────────────────────────────────────────────────────────── */
.glow, .is-live, .leader, [data-glow] {
  box-shadow: 0 0 30px rgba(198,255,0,.32) !important;
}

/* ── 5 · TYPE ─────────────────────────────────────────────────────────
   Same family and axes as Vol.7 — Archivo, italic, 'wdth' 125 / 'wght' 900
   — so the display face is unchanged. What differs is the kicker: Blackout
   letterspaces harder and sets them in the muted grey, not the accent.
   ────────────────────────────────────────────────────────────────────── */
.kicker, .eyebrow, [class*="tracking-wide"], [class*="tracking-widest"] {
  letter-spacing: .28em !important;
  color: #9A9A9A !important;
  font-weight: 800 !important;
}
/* Numbers that tick must not reflow as they change. */
.tabular, [class*="font-mono"], .pts, .score { font-variant-numeric: tabular-nums; }

/* ── 6 · DIVISION OF LABOUR ───────────────────────────────────────────
   Lime is every positive and primary state: qualifying, winning, live, the
   main action. Magenta is "you", knockout points, prizes and anything
   urgent. The sweep mapped Surge's cyan and amber onto exactly those two
   roles, so this layer only has to fix the places Surge used its accent
   for something Blackout would not.
   ────────────────────────────────────────────────────────────────────── */
.you, [data-you], .is-you { color: #FF2E88 !important; border-color: rgba(255,46,136,.4) !important; }
.qualify, .is-qualified { border-color: rgba(198,255,0,.5) !important; }

/* Text on lime is always near-black — never white, which fails contrast
   badly on a colour this bright. */
[style*="background:#C6FF00"], [style*="background: #C6FF00"],
[style*="backgroundColor:#C6FF00"], .bg-lime, .btn-primary {
  color: #050505 !important;
}

/* ── 7 · REDUCED MOTION ───────────────────────────────────────────────

   ────────────────────────────────────────────────────────────────────── */
@media (prefers-reduced-motion: reduce) {

    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;

  }
}
