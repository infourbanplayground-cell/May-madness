function generateSessionShareText(session, state, leaderboard) {
  const pName = (id) => state.players.find(p => p.id === id)?.name?.split(" ")[0] || "?";
  const tLabel = (t) => t ? `${pName(t.p1Id)} & ${pName(t.p2Id)}` : "TBD";
  const winner = session.bracket?.final?.winner
    ? (session.bracket.final.winner === "team1" ? session.teams?.find(t => t.id === session.bracket.final.team1Id) : session.teams?.find(t => t.id === session.bracket.final.team2Id))
    : null;
  const finalist = session.bracket?.final?.winner
    ? (session.bracket.final.winner === "team1" ? session.teams?.find(t => t.id === session.bracket.final.team2Id) : session.teams?.find(t => t.id === session.bracket.final.team1Id))
    : null;

  // Top scorers this session
  const sessionScores = (state.players || []).map(p => {
    const team = getPlayerTeam(session, p.id); if (!team) return null;
    const mult = session.doublePoints ? 2 : 1;
    let pts = 0;
    (session.groupMatches || []).forEach(m => {
      if ((m.team1Id !== team.id && m.team2Id !== team.id) || !m.winner) return;
      if (teamWon(m, team.id)) pts += 3 * mult;
      else { const t = m.lossType || "tiebreak"; pts += (t === "tiebreak" ? 2 : t === "competitive" ? 1 : 0) * mult; }
    });
    if (getTopOfGroup(session, team.group) === team.id) pts += 1 * mult;
    const qfM = (session.bracket?.qf || []).find(m => (m.team1Id === team.id || m.team2Id === team.id) && m.winner);
    if (qfM) pts += (1 + koMatchPts(qfM, team.id)) * mult;
    const sfM = (session.bracket?.sf || []).find(m => (m.team1Id === team.id || m.team2Id === team.id) && m.winner);
    if (sfM) pts += (2 + koMatchPts(sfM, team.id)) * mult;
    const f = session.bracket?.final;
    if (f && (f.team1Id === team.id || f.team2Id === team.id) && f.winner)
      pts += (3 + koMatchPts(f, team.id) + (teamWon(f, team.id) ? 5 : 0)) * mult;
    return { name: p.name, pts };
  }).filter(Boolean).sort((a, b) => b.pts - a.pts);

  const seriesLeader = [...leaderboard].sort((a, b) => b.totalPts - a.totalPts)[0];
  const dateStr = session.date ? new Date(session.date + "T12:00:00").toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" }) : "";

  let text = `🔥 *BLACKOUT SERIES Vol.8 — ${session.name}*`;
  if (dateStr) text += ` (${dateStr})`;
  text += `\n`;
  if (session.doublePoints) text += `⚡ *DOUBLE POINTS NIGHT*\n`;
  text += `\n`;
  if (winner) {
    text += `🏆 *Champions:* ${tLabel(winner)}\n`;
    if (finalist) text += `🥈 *Finalists:* ${tLabel(finalist)}\n`;
    text += `\n`;
  }
  if (sessionScores.length > 0) {
    text += `📊 *Top Scorers Tonight:*\n`;
    sessionScores.slice(0, 5).forEach((e, i) => { text += `${["🥇","🥈","🥉","4️⃣","5️⃣"][i]} ${e.name} — ${e.pts} pts\n`; });
    text += `\n`;
  }
  if (seriesLeader) {
    text += `📈 *Series Leader:* ${seriesLeader.player.name} (${seriesLeader.totalPts} pts)\n`;
  }
  text += `\n🎾 https://blackout.urbanpadel.om`;
  return text;
}

function PartnerDrawModal({ onClose, state, session, onAddTeams }) {
  const inSession = new Set((session.teams || []).flatMap(t => [t.p1Id, t.p2Id]));
  const available = (state.players || []).filter(p => !inSession.has(p.id));
  const [selected, setSelected] = useState([]);
  const toggle = (id) => setSelected(s => s.includes(id) ? s.filter(x => x !== id) : [...s, id]);
  const toggleAll = () => setSelected(selected.length === available.length ? [] : available.map(p => p.id));

  const draw = () => {
    const pool = [...selected].sort(() => Math.random() - 0.5);
    if (pool.length < 2) return;
    const groups = getSessionGroups(session);
    const teams = [];
    for (let i = 0; i + 1 < pool.length; i += 2) {
      teams.push({ id: uid("t"), name: "", p1Id: pool[i], p2Id: pool[i + 1], group: groups[Math.floor(i / 2) % groups.length] });
    }
    onAddTeams(teams);
    onClose();
  };

  return <Modal open={true} onClose={onClose} title="PARTNER DRAW">
    <div className="space-y-3">
      <div className="text-xs text-stone-400">Select players entering the draw — pairs will be random. Odd player out is skipped.</div>
      <div className="flex items-center justify-between">
        <div className="text-xs text-stone-500">{selected.length} selected</div>
        <button onClick={toggleAll} className="text-xs text-orange-400 font-semibold">{selected.length === available.length ? "Clear all" : "Select all"}</button>
      </div>
      <div className="max-h-64 overflow-y-auto space-y-1">
        {available.length === 0
          ? <div className="text-xs text-stone-500 text-center py-4">All players already in session</div>
          : available.map(p => (
            <button key={p.id} onClick={() => toggle(p.id)}
              className={`w-full text-left px-3 py-2 rounded-lg text-sm font-semibold transition-all ${selected.includes(p.id) ? "bg-orange-500/20 text-orange-300 border border-orange-500/40" : "bg-stone-900 text-stone-300 border border-transparent"}`}>
              {p.name}
            </button>
          ))}
      </div>
      {selected.length % 2 !== 0 && selected.length > 0 && <div className="text-[11px] text-cyan-300">Odd number — one player will be left out of draw</div>}
      <div className="flex gap-2 pt-1">
        <Btn variant="ghost" onClick={onClose}>Cancel</Btn>
        <Btn className="flex-1" onClick={draw} disabled={selected.length < 2}>Draw {Math.floor(selected.length / 2)} Pairs</Btn>
      </div>
    </div>
  </Modal>;
}

const MAX_TEAMS = 16;
const WL_SIZE = 5;

function SignupsTab({ session, state, updateSession, isAdmin, onRemind }) {
  const slots = session.signupSlots || Array(MAX_TEAMS).fill("");
  const waitlist = session.signupWaitlist || Array(WL_SIZE).fill("");
  const filledSlots = slots.filter(s => s.trim()).length;
  const filledWl = waitlist.filter(s => s.trim()).length;
  const isFull = filledSlots >= MAX_TEAMS;

  const setSlot = (i, v) => updateSession(s => {
    const arr = [...(s.signupSlots || Array(MAX_TEAMS).fill(""))];
    arr[i] = v;
    return { ...s, signupSlots: arr };
  });
  const setWl = (i, v) => updateSession(s => {
    const arr = [...(s.signupWaitlist || Array(WL_SIZE).fill(""))];
    arr[i] = v;
    return { ...s, signupWaitlist: arr };
  });
  const clearSlot = (i) => setSlot(i, "");
  const clearWl = (i) => setWl(i, "");

  return (
    <div className="space-y-4">
      {/* Counter bar */}
      <div style={{ background:"rgba(14,14,14,.85)", border:"1px solid rgba(242,242,242,.10)", boxShadow: isFull ? "none" : "none", padding:"14px 18px" }}>
        <div className="flex items-center justify-between mb-3">
          <div>
            <div style={{ fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize:46, lineHeight:1, color: isFull ? "#FF2E88" : "var(--ink)", WebkitTextStroke:"0" }}>
              {filledSlots}<span style={{ fontSize:26, color:"#9A9A9A" }}>/{MAX_TEAMS}</span>
            </div>
            <div style={{ fontWeight:900, fontSize:10, letterSpacing:".18em", textTransform:"uppercase", color:"#9A9A9A", marginTop:2 }}>
              Teams · {isFull ? "FULL" : `${MAX_TEAMS - filledSlots} spot${MAX_TEAMS - filledSlots !== 1 ? "s" : ""} left`}
              {filledWl > 0 && ` · ${filledWl} waitlisted`}
            </div>
          </div>
          <div style={{ display:"flex", flexDirection:"column", gap:6, alignItems:"flex-end" }}>
            {isFull
              ? <div style={{ fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize:20, color:"#FF2E88", border:"3px solid #FF2E88", padding:"3px 10px" }}>FULL</div>
              : <div style={{ fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize:20, color:"var(--orange)", border:"1px solid rgba(242,242,242,.14)", padding:"3px 10px", boxShadow:"none" }}>{MAX_TEAMS - filledSlots} OPEN</div>
            }
            <button onClick={onRemind} style={{ fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize:15, color:"#F2F2F2", background:"rgba(198,255,0,.12)", border:"1px solid rgba(198,255,0,.4)", boxShadow:"none", padding:"2px 10px", cursor:"pointer" }}>Copy list</button>
          </div>
        </div>
        <div style={{ height:7, background:"rgba(10,10,10,.12)", border:"1px solid rgba(242,242,242,.14)" }}>
          <div style={{ height:"100%", width:`${(filledSlots/MAX_TEAMS)*100}%`, background: isFull ? "#FF2E88" : "linear-gradient(90deg, var(--orange), var(--red))", transition:"width .3s" }} />
        </div>
      </div>

      {/* 16 team slots */}
      <div>
        <div className="text-xs text-stone-500 uppercase tracking-widest font-bold mb-2">✅ Team Slots</div>
        <div className="space-y-1.5">
          {slots.map((val, i) => (
            <div key={i} style={{ display:"flex", alignItems:"center", gap:8, background: val.trim() ? "var(--cream)" : "rgba(255,247,232,.35)", border: val.trim() ? "3px solid var(--ink)" : "2px dashed rgba(10,10,10,.25)", boxShadow: val.trim() ? "none" : "none", padding:"6px 10px" }}>
              <span style={{ fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize:16, color: val.trim() ? "var(--ink)" : "rgba(10,10,10,.3)", width:22, flexShrink:0 }}>{i + 1}-</span>
              {isAdmin
                ? <input value={val} onChange={e => setSlot(i, e.target.value)} placeholder="Name + Partner" style={{ flex:1, background:"transparent", border:"none", outline:"none", fontSize:14, fontWeight:700, color:"#F2F2F2", minWidth:0 }} />
                : <span style={{ flex:1, fontSize:14, fontWeight:700, color: val.trim() ? "var(--ink)" : "rgba(10,10,10,.25)" }}>{val.trim() || "—"}</span>
              }
              {isAdmin && val.trim() && <button onClick={() => clearSlot(i)} style={{ color:"#9A9A9A", fontSize:13, background:"none", border:"none", cursor:"pointer", padding:2 }}>✕</button>}
            </div>
          ))}
        </div>
      </div>

      {/* Waitlist */}
      <div>
        <div className="text-xs text-stone-500 uppercase tracking-widest font-bold mb-2">⏳ Waitlist</div>
        <div className="space-y-1.5">
          {waitlist.map((val, i) => (
            <div key={i} style={{ display:"flex", alignItems:"center", gap:8, background:"rgba(255,247,232,.25)", border:"2px dashed rgba(10,10,10,.2)", padding:"6px 10px", opacity: val.trim() ? 1 : 0.6 }}>
              <span style={{ fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize:14, color:"#9A9A9A", width:22, flexShrink:0 }}>{i + 1}-</span>
              {isAdmin
                ? <input value={val} onChange={e => setWl(i, e.target.value)} placeholder="Name + Partner" style={{ flex:1, background:"transparent", border:"none", outline:"none", fontSize:13, fontWeight:700, color:"#F2F2F2", minWidth:0 }} />
                : <span style={{ flex:1, fontSize:13, fontWeight:700, color: val.trim() ? "var(--ink)" : "rgba(10,10,10,.25)" }}>{val.trim() || "—"}</span>
              }
              {isAdmin && val.trim() && <button onClick={() => clearWl(i)} style={{ color:"#9A9A9A", fontSize:13, background:"none", border:"none", cursor:"pointer", padding:2 }}>✕</button>}
            </div>
          ))}
        </div>
      </div>

      <div className="text-[10px] text-stone-600 text-center">⚠️ 16 teams max · first come, first served</div>
    </div>
  );
}

function SessionDetail({ session, state, isAdmin, canScore, canUploadPhotos, sync, syncErr, onClose, updateSession, update, deleteSession, leaderboard }) {
  const [tab, setTab] = useState("teams");
  const [showEdit, setShowEdit] = useState(false);
  const [showDel, setShowDel] = useState(false);
  const [showDraw, setShowDraw] = useState(false);
  const [showShare, setShowShare] = useState(false);
  const [showLineup, setShowLineup] = useState(false);
  // Derived, not stored: the draw is the source of truth for who is playing.
  const lineups = buildLineups(session, state,
    14 * 2 * SESSIONS_TOTAL + SEASON_PRIZES.reduce((a, b) => a + b, 0));
  const [showRemind, setShowRemind] = useState(false);
  const [uploadingPhoto, setUploadingPhoto] = useState(false);
  const mvpPlayer = state.players.find(p => p.id === session.mvpId);
  const sessionPhotos = session.photos || [];

  // ── When the final is scored, close the night ──
  // Three guards, each earning its place:
  //   canScore   — every phone in the club has this session open. Without it
  //                they would all race to write the same change.
  //   autoClosed — a latch, so an admin who deliberately re-opens a finished
  //                session is not overruled a second later by this effect.
  //   the vote   — crowning is only done from what the vote actually decided.
  //                No votes means no MVP and voting is left OPEN, because on
  //                most nights the voting starts after the final is played;
  //                closing it here would end a vote before it began. A tie at
  //                the top is left to a human rather than settled by whichever
  //                key happened to come first.
  const finalWinner = (session.bracket && session.bracket.final && session.bracket.final.winner) || null;
  useEffect(() => {
    if (!canScore || !finalWinner || session.autoClosed) return;
    updateSession(s => {
      const next = { ...s, completed: true, autoClosed: true };
      const tally = Object.entries(s.mvpVotes || {}).sort((a, b) => b[1] - a[1]);
      const tied = tally.length > 1 && tally[0][1] === tally[1][1];
      if (tally.length && !s.mvpId && !tied) {
        next.mvpId = tally[0][0];
        next.mvpVotingOpen = false;
      }
      return next;
    });
  }, [canScore, finalWinner, session.autoClosed]);
  return (
    <div className="fixed inset-0 z-40 overflow-y-auto screen-bg">
      <div className="sticky top-0 z-10 backdrop-blur-xl border-b border-stone-800/80 px-4 py-3 flex items-center justify-between gap-3" style={{ background: "rgba(10,10,10,0.96)" }}>
        <button onClick={onClose} className="text-stone-300 hover:text-orange-500 p-1"><I.back size={22} /></button>
        <div className="flex-1 min-w-0 text-center">
          <div className="flex items-center justify-center gap-2">
            <div className="font-display text-xl text-stone-100 truncate">{session.name}</div>
            {session.doublePoints && <div className="px-1.5 py-0.5 rounded font-display text-stone-950 text-[10px] font-bold shrink-0" style={{ background:"#FF2E88", color:"#050505", letterSpacing:".08em" }}>2X</div>}
          </div>
          <div className="text-[10px] text-stone-500 uppercase tracking-wider flex items-center justify-center gap-2">
            {session.date ? new Date(session.date).toLocaleDateString() : "No date"}
            {mvpPlayer && <span className="text-cyan-300 font-bold">MVP · {mvpPlayer.name.split(" ")[0]}</span>}
          </div>
        </div>
        <div className="flex items-center gap-1 shrink-0">
          {canScore && <SyncIndicator status={sync} errMsg={syncErr} />}
          {isAdmin ? <button onClick={() => setShowEdit(true)} className="text-stone-400 hover:text-orange-500 p-1"><I.dots size={20} /></button> : <div className="w-7" />}
        </div>
      </div>
      <div className="sticky top-[57px] z-10" style={{ background:"rgba(5,5,5,.97)",
           borderBottom:"1px solid rgba(198,255,0,.22)", backdropFilter:"blur(18px)", padding:"8px 16px 10px" }}>
        {/* four destinations, equal weight, never scrolling off */}
        <div className="max-w-3xl mx-auto" style={{ display:"grid", gridTemplateColumns:"repeat(4,minmax(0,1fr))",
             gap:2, background:"rgba(255,255,255,.04)", padding:2 }}>
          {(() => {
            const cnt = (session.signupSlots||[]).filter(s=>s.trim()).length;
            const isFull = cnt >= MAX_TEAMS;
            const DESTS = [
              { id:"teams",   label:"Teams",  Ic:I.users },
              { id:"groups",  label:"Groups", Ic:I.bar },
              { id:"bracket", label:"KO",     Ic:I.swords },
              { id:"signups", label:"List",   Ic:CIc.clipboard, count:cnt > 0 ? `${cnt}/${MAX_TEAMS}` : null, warm:isFull },
            ];
            return DESTS.map(t => {
              const on = tab === t.id;
              return <button key={t.id} onClick={() => setTab(t.id)}
                style={{ minHeight:44, display:"flex", alignItems:"center", justifyContent:"center", gap:6,
                         padding:"8px 2px", border:"none", cursor:"pointer",
                         fontFamily:"'Archivo',sans-serif", fontWeight:800, fontSize:12, letterSpacing:".08em",
                         textTransform:"uppercase", whiteSpace:"nowrap",
                         background:on ? "#C6FF00" : "transparent",
                         color:on ? "#050505" : (t.warm && !on ? "#FF2E88" : "#CFCFCF"),
                         boxShadow:on ? "0 0 24px rgba(198,255,0,.35)" : "none" }}>
                <t.Ic size={13} /> {t.label}
                {t.count && <span style={{ fontSize:10, fontWeight:800, letterSpacing:".04em", padding:"1px 5px",
                     background:on ? "rgba(5,5,5,.22)" : "rgba(198,255,0,.16)",
                     color:on ? "#050505" : "#C6FF00" }}>{t.count}</span>}
              </button>;
            });
          })()}
        </div>
        {/* the occasional actions, one quiet row, scrolls if it must */}
        <div className="max-w-3xl mx-auto" style={{ display:"flex", gap:8, marginTop:8,
             overflowX:"auto", scrollbarWidth:"none" }}>
          {(() => {
            const votes = Object.values(session.mvpVotes||{}).reduce((a,b)=>a+b,0);
            const ACTS = [
              { key:"photos", label:"Photos", Ic:CIc.camera, on:tab === "photos",
                count:sessionPhotos.length > 0 ? sessionPhotos.length : null, go:() => setTab("photos"), show:true },
              { key:"mvp", label:"MVP", Ic:CIc.crown, on:tab === "mvp",
                count:session.mvpVotingOpen && votes ? votes : null, go:() => setTab("mvp"),
                // Vol.7 showed this to scorers only, so the "player vote" was
                // whoever was holding the scoring phone. The tab is open to
                // everyone once voting is; MvpVoteTab already enforces one
                // vote per device.
                show:canScore || !!session.mvpVotingOpen },
              { key:"lineup", label:"Line-up", Ic:CIc.share, go:() => setShowLineup(true),
                show:lineups.length > 0, warm:true },
              { key:"draw", label:"Draw", Ic:CIc.dice, go:() => setShowDraw(true), show:isAdmin },
              { key:"remind", label:"Remind", Ic:CIc.megaphone, go:() => setShowRemind(true), show:isAdmin },
              { key:"share", label:"Share", Ic:CIc.share, go:() => setShowShare(true), show:!!session.completed, warm:true },
            ].filter(a => a.show);
            return ACTS.map(a => (
              <button key={a.key} onClick={a.go}
                style={{ flex:"0 0 auto", minHeight:36, display:"inline-flex", alignItems:"center", gap:6,
                         padding:"8px 12px", cursor:"pointer", whiteSpace:"nowrap",
                         fontFamily:"'Archivo',sans-serif", fontWeight:800, fontSize:10, letterSpacing:".14em",
                         textTransform:"uppercase",
                         background:a.on ? "rgba(198,255,0,.10)" : "rgba(255,255,255,.04)",
                         border:`1px solid ${a.on ? "rgba(198,255,0,.45)" : a.warm ? "rgba(255,46,136,.4)" : "transparent"}`,
                         color:a.on ? "#C6FF00" : a.warm ? "#FF2E88" : "#CFCFCF" }}>
                <a.Ic size={13} /> {a.label}
                {a.count ? <span style={{ fontSize:10, padding:"1px 5px", background:"rgba(198,255,0,.16)",
                     color:"#C6FF00" }}>{a.count}</span> : null}
              </button>
            ));
          })()}
        </div>
      </div>
      <div className="max-w-3xl mx-auto px-4 py-4 pb-24">
        {tab === "teams" && <TeamsTab session={session} state={state} updateSession={updateSession} update={update} isAdmin={isAdmin} leaderboard={leaderboard || []} />}
        {tab === "signups" && <SignupsTab session={session} state={state} updateSession={updateSession} isAdmin={isAdmin} onRemind={() => { navigator.clipboard?.writeText(generateReminderText(session, state, leaderboard||[])); alert("Copied — paste it in WhatsApp."); }} />}
        {tab === "groups" && <GroupsTab session={session} state={state} updateSession={updateSession} isAdmin={canScore} />}
        {tab === "bracket" && <BracketTab session={session} state={state} updateSession={updateSession} isAdmin={isAdmin} canScore={canScore} canUploadPhotos={canUploadPhotos} />}
        {tab === "mvp" && <MvpVoteTab session={session} state={state} updateSession={updateSession} isAdmin={isAdmin} canScore={canScore} />}
        {tab === "photos" && <div className="space-y-4">
          <button onClick={() => { navigator.clipboard?.writeText(location.origin + "/?photos"); alert("Photo Wall link copied — paste it in WhatsApp."); }} className="jh-chipbtn" style={{width:"100%",justifyContent:"center"}}><CIc.share size={13} /> Copy Photo Wall Link</button>
          {canUploadPhotos && <label className={`flex items-center justify-center gap-2 w-full py-4 border-2 border-dashed border-stone-700 rounded-xl cursor-pointer text-stone-400 hover:border-orange-500 hover:text-orange-400 transition-colors ${uploadingPhoto ? "opacity-50 pointer-events-none" : ""}`}>
            {uploadingPhoto ? "Uploading…" : <><CIc.camera size={14} /> Add Photo</>}
            <input type="file" accept="image/*" multiple className="hidden" onChange={async (e) => {
              const files = Array.from(e.target.files || []);
              e.target.value = "";  // allow re-picking the same file after an error
              if (!files.length) return;
              if (!getToken()) { alert("Please log in first — photos can't be saved without signing in."); return; }
              setUploadingPhoto(true);
              try {
                // Process each photo independently so one bad file can't sink the batch.
                const settled = await Promise.allSettled(
                  files.map(async f => uploadFramedPhotoToCloud(await watermarkPhotoToBase64(f)))
                );
                const urls = settled.filter(r => r.status === "fulfilled" && r.value).map(r => r.value);
                const failed = files.length - urls.length;
                if (urls.length) {
                  const newPhotos = [...(session.photos || []), ...urls];
                  updateSession(s => ({ ...s, photos: newPhotos }));
                  await uploadSessionPhotosToServer(session.id, newPhotos);
                }
                if (failed > 0) {
                  const msg = settled.find(r => r.status === "rejected")?.reason?.message;
                  alert(`${failed} photo${failed > 1 ? "s" : ""} couldn't be added${msg ? ": " + msg : ""}.` +
                        (urls.length ? ` ${urls.length} added.` : " Try a JPEG, or check you're still logged in."));
                }
              } catch (err) {
                alert("Couldn't add photos: " + (err?.message || err));
              } finally {
                setUploadingPhoto(false);
              }
            }} />
          </label>}
          {sessionPhotos.length === 0
            ? <div className="text-center text-stone-500 py-12">{isAdmin ? "No photos yet — tap to add some from tonight" : "No photos yet"}</div>
            : <div className="grid grid-cols-2 gap-2 aa-wall">
                {sessionPhotos.map((src, i) => (
                  <div key={i} className="relative group">
                    <img src={src} alt={`Photo ${i+1}`} className="w-full rounded-lg object-cover cursor-pointer" style={{ aspectRatio: "4/3" }} onClick={() => sharePhoto(src, i)} />
                    <div className="absolute bottom-1 right-1 px-2 py-0.5 rounded text-[10px] font-bold text-white flex items-center gap-1 pointer-events-none" style={{ background: "rgba(0,0,0,.55)" }}><CIc.share size={11} /> Share</div>
                    {isAdmin && <button onClick={() => { const newPhotos = (session.photos||[]).filter((_,j)=>j!==i); updateSession(s => ({ ...s, photos: newPhotos })); uploadSessionPhotosToServer(session.id, newPhotos); }}
                      className="absolute top-1 right-1 w-6 h-6 rounded-full bg-black/70 text-white text-xs flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">✕</button>}
                  </div>
                ))}
              </div>
          }
        </div>}
      </div>
      <LineupSheet open={showLineup} items={lineups} photos={sessionPhotos}
                   onClose={() => setShowLineup(false)} />
      {showEdit && <Modal open={true} onClose={() => setShowEdit(false)} title="SESSION OPTIONS">
        <div className="space-y-3">
          <div><label className="text-xs text-stone-400 uppercase tracking-wider font-semibold mb-1 block">Name</label><Input value={session.name} onChange={v => updateSession(s => ({ ...s, name: v }))} /></div>
          <div><label className="text-xs text-stone-400 uppercase tracking-wider font-semibold mb-1 block">Date</label><Input type="date" value={session.date || ""} onChange={v => updateSession(s => ({ ...s, date: v }))} /></div>
          <div className="flex items-center justify-between p-3 bg-stone-900 rounded-lg">
            <span className="text-sm text-stone-200">Mark Complete</span>
            <button onClick={() => updateSession(s => ({ ...s, completed: !s.completed }))} className={`relative w-11 h-6 rounded-full ${session.completed ? "bg-emerald-500" : "bg-stone-700"}`}>
              <div className={`absolute top-0.5 w-5 h-5 rounded-full bg-white transition-transform ${session.completed ? "translate-x-5" : "translate-x-0.5"}`} />
            </button>
          </div>
          <div>
            <label className="text-xs text-stone-400 uppercase tracking-wider font-semibold mb-1 block">⭐ MVP of the Night</label>
            <select value={session.mvpId || ""} onChange={e => updateSession(s => ({ ...s, mvpId: e.target.value || null }))}
              className="w-full bg-stone-900 border border-stone-700 rounded-lg px-3 py-2 text-stone-100 text-sm">
              <option value="">— No MVP —</option>
              {(session.teams || []).flatMap(t => [t.p1Id, t.p2Id]).filter(Boolean).filter((v,i,a)=>a.indexOf(v)===i).map(pid => {
                const pl = state.players.find(p => p.id === pid);
                return pl ? <option key={pid} value={pid}>{pl.name}</option> : null;
              })}
            </select>
          </div>
          <div className="flex items-center justify-between p-3 rounded-lg" style={{ background: session.doublePoints ? "linear-gradient(135deg, rgba(220, 38, 38, 0.15), rgba(249, 115, 22, 0.08))" : "#0E0E0E", border: session.doublePoints ? "1px solid rgba(220, 38, 38, 0.3)" : "1px solid transparent" }}>
            <div className="flex items-center gap-2">
              <div className="px-1.5 py-0.5 rounded font-display text-stone-950 text-[10px] font-bold" style={{ background:"#FF2E88", color:"#050505", letterSpacing:".08em" }}>2X</div>
              <div>
                <div className="text-sm text-stone-200 font-semibold">Double Points</div>
                <div className="text-[10px] text-stone-500">Everything ×2 except streak</div>
              </div>
            </div>
            <button onClick={() => updateSession(s => ({ ...s, doublePoints: !s.doublePoints }))} className={`relative w-11 h-6 rounded-full ${session.doublePoints ? "bg-red-600" : "bg-stone-700"}`}>
              <div className={`absolute top-0.5 w-5 h-5 rounded-full bg-white transition-transform ${session.doublePoints ? "translate-x-5" : "translate-x-0.5"}`} />
            </button>
          </div>
          {session.doublePoints && <Btn variant="secondary" className="w-full" onClick={() => {
            const txt = `🔥⚡ *SURPRISE ALERT* ⚡🔥\n\nTONIGHT is a *DOUBLE POINTS* session!\n2× everything — group wins, KOs, streak, all of it.\n\n📅 ${session.name}${session.date ? " · " + new Date(session.date + "T12:00:00").toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "short" }) : ""}\n📍 Urban Playground\n\nDon't miss this one 👀\n🎾 https://blackout.urbanpadel.om`;
            navigator.clipboard?.writeText(txt);
          }}>📣 Copy 2X Announcement</Btn>}
          <Btn variant="danger" className="w-full" onClick={() => setShowDel(true)}><I.trash size={14} /> Delete Session</Btn>
        </div>
      </Modal>}
      {showDel && <Modal open={true} onClose={() => setShowDel(false)} title="DELETE?">
        <div className="space-y-3">

        </div>
      </Modal>}
      {showRemind && <Modal open={true} onClose={() => setShowRemind(false)} title="SESSION REMINDER">
        <div className="space-y-3">
          <div className="text-xs text-stone-400">Copy this to your WhatsApp group to hype up the session.</div>
          <textarea readOnly rows={12} value={generateReminderText(session, state, leaderboard || [])}
            className="w-full bg-stone-900 border border-stone-700 rounded-lg px-3 py-2.5 text-stone-100 font-mono text-xs leading-relaxed" />
          <Btn className="w-full" onClick={() => navigator.clipboard?.writeText(generateReminderText(session, state, leaderboard || []))}>
            Copy for WhatsApp
          </Btn>
        </div>
      </Modal>}
      {showDraw && <PartnerDrawModal onClose={() => setShowDraw(false)} state={state} session={session}
        onAddTeams={newTeams => updateSession(s => ({ ...s, teams: [...(s.teams || []), ...newTeams] }))} />}
      {showShare && <Modal open={true} onClose={() => setShowShare(false)} title="SHARE RESULTS">
        <div className="space-y-3">
          <textarea readOnly rows={14} value={generateSessionShareText(session, state, leaderboard || [])}
            className="w-full bg-stone-900 border border-stone-700 rounded-lg px-3 py-2.5 text-stone-100 font-mono text-xs leading-relaxed" />
          <Btn className="w-full" onClick={() => { navigator.clipboard?.writeText(generateSessionShareText(session, state, leaderboard || [])); }}>
            Copy for WhatsApp

        </div>
      </Modal>}
    </div>
  );

function MvpVoteTab({ session, state, updateSession, isAdmin, canScore }) {
  const [voterPick, setVoterPick] = useState("");
  const [pick, setPick] = useState("");
  const [justVoted, setJustVoted] = useState("");
  const [showTally, setShowTally] = useState(false);
  const [blocked, setBlocked] = useState(false);

  const eligible = (session.teams || []).flatMap(t => [t.p1Id, t.p2Id]).filter(Boolean).filter((v, i, a) => a.indexOf(v) === i)
    .map(pid => state.players.find(p => p.id === pid)).filter(Boolean)
    .sort((a, b) => a.name.localeCompare(b.name));
  const votable = eligible.filter(p => p.id !== voterPick);

  const votedIds = session.mvpVotedIds || [];
  const alreadyVoted = voterPick && votedIds.includes(voterPick);

  const votes = session.mvpVotes || {};
  const totalVotes = Object.values(votes).reduce((a, b) => a + b, 0);
  const tally = Object.entries(votes)
    .map(([id, count]) => ({ id, count, player: state.players.find(p => p.id === id) }))
    .filter(t => t.player)
    .sort((a, b) => b.count - a.count);
  const mvpPlayer = state.players.find(p => p.id === session.mvpId);

  const startVoting = () => updateSession(s => ({ ...s, mvpVotingOpen: true, mvpVotes: {}, mvpVotedIds: [] }));
  const chooseVoter = (pid) => {
    setVoterPick(pid);
    if (pick === pid) setPick("");
    setBlocked(false);
  };
  const castVote = () => {
    if (!pick || !voterPick) return;
    if ((session.mvpVotedIds || []).includes(voterPick)) { setBlocked(true); return; }
    const name = state.players.find(p => p.id === pick)?.name || "";
    updateSession(s => {
      const v = { ...(s.mvpVotes || {}) };
      v[pick] = (v[pick] || 0) + 1;
      const votedIds = [...(s.mvpVotedIds || []), voterPick];
      return { ...s, mvpVotes: v, mvpVotedIds: votedIds };
    });
    setJustVoted(name);
    setVoterPick("");
    setPick("");
    setTimeout(() => setJustVoted(""), 1800);
  };
  const crownWinner = () => {
    if (tally.length === 0) return;
    updateSession(s => ({ ...s, mvpId: tally[0].id, mvpVotingOpen: false }));
    setShowTally(false);
  };
  const closeVoting = () => updateSession(s => ({ ...s, mvpVotingOpen: false }));
  const reopenVoting = () => updateSession(s => ({ ...s, mvpVotingOpen: true }));
  const resetVotes = () => updateSession(s => ({ ...s, mvpVotes: {}, mvpVotedIds: [] }));

  return (
    <div className="space-y-4">
      <div className="jh-panel jh-fill-yellow" style={{ transform:"none" }}>
        <div style={{ padding: "16px 14px 20px", position: "relative", zIndex: 2 }}>
          <div className="aa-kicker">MVP vote</div>

          {!session.mvpVotingOpen && !session.mvpId && (
            <div style={{ background:"rgba(14,14,14,.85)", border: "1px solid rgba(242,242,242,.10)", boxShadow: "none", padding: "22px 18px", textAlign: "center" }}>
              <div style={{ fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize: 22, color:"#F2F2F2", marginBottom: 10 }}>VOTING HASN'T STARTED</div>
              {canScore
                ? <>
                    <div style={{ fontSize: 13, fontWeight: 700, color:"#9A9A9A", marginBottom: 14 }}>Hand the device around the courts once you open voting.</div>
                    <button className="jh-chipbtn red" style={{ fontSize: 20, width: "100%", justifyContent: "center" }} onClick={startVoting}>▶ START VOTING</button>
                  </>
                : <div style={{ fontSize: 13, fontWeight: 700, color:"#9A9A9A" }}>Ask the scorer to open MVP voting.</div>
              }
            </div>
          )}

          {session.mvpVotingOpen && (
            <div style={{ background:"rgba(14,14,14,.85)", border: "1px solid rgba(242,242,242,.10)", boxShadow: "none", padding: "22px 18px", textAlign: "center", position: "relative" }}>
              {justVoted ? (
                <div style={{ padding: "20px 0" }}>
                  <div style={{ fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize: 30, color: "#3FA33C" }}>Vote locked</div>
                  <div style={{ fontSize: 15, fontWeight: 700, color:"#F2F2F2", marginTop: 6 }}>Thanks for repping <b>{justVoted}</b></div>
                  <div style={{ fontSize: 11, fontWeight: 700, color:"#9A9A9A", marginTop: 10, textTransform: "uppercase", letterSpacing: 1 }}>Pass it to the next voter ▶</div>
                </div>
              ) : (
                <>
                  <div style={{ fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize: 13, letterSpacing: 1, color:"#9A9A9A", marginBottom: 6, textTransform: "uppercase", fontWeight: 700 }}>Step 1</div>
                  <div style={{ fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize: 22, color:"#F2F2F2", marginBottom: 10 }}>WHO ARE YOU?</div>
                  <select value={voterPick} onChange={e => chooseVoter(e.target.value)}
                    style={{ width: "100%", background: "#fff", border: "1px solid rgba(242,242,242,.10)", padding: "14px 12px", fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize: 20, color:"#F2F2F2", marginBottom: 14 }}>
                    <option value="">— Select your name —</option>
                    {eligible.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                  </select>

                  {voterPick && alreadyVoted && (
                    <div style={{ background: "#FF2E88", border: "1px solid rgba(242,242,242,.10)", padding: "14px", marginBottom: 14, fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize: 17, color:"#F2F2F2" }}>
                      🚫 {state.players.find(p => p.id === voterPick)?.name} already voted tonight!
                    </div>
                  )}

                  {voterPick && !alreadyVoted && (
                    <>
                      <div style={{ fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize: 13, letterSpacing: 1, color:"#9A9A9A", marginBottom: 6, textTransform: "uppercase", fontWeight: 700 }}>Step 2</div>
                      <div style={{ fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize: 22, color:"#F2F2F2", marginBottom: 10 }}>WHO'S YOUR MVP?</div>
                      <select value={pick} onChange={e => setPick(e.target.value)}
                        style={{ width: "100%", background: "#fff", border: "1px solid rgba(242,242,242,.10)", padding: "14px 12px", fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize: 20, color:"#F2F2F2", marginBottom: 14 }}>
                        <option value="">— Select a player —</option>
                        {votable.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                      </select>
                      <button className="jh-chipbtn red" disabled={!pick} style={{ fontSize: 22, width: "100%", justifyContent: "center", opacity: pick ? 1 : 0.4, cursor: pick ? "pointer" : "default" }} onClick={castVote}>VOTE! 🔥</button>
                    </>
                  )}
                </>
              )}
              <div style={{ marginTop: 16, fontSize: 11, fontWeight: 700, color:"#9A9A9A", textTransform: "uppercase", letterSpacing: 1 }}>{totalVotes} vote{totalVotes !== 1 ? "s" : ""} cast tonight</div>
            </div>
          )}

          {!session.mvpVotingOpen && session.mvpId && mvpPlayer && (
            <div style={{ background:"rgba(16,23,31,.96)", backgroundImage:"linear-gradient(180deg,#FF2E88,rgba(255,46,136,.06))", backgroundSize:"3px 100%", backgroundRepeat:"no-repeat", border:"1px solid rgba(255,46,136,.4)", boxShadow:"0 0 40px rgba(255,46,136,.10)", padding: "24px 18px 24px 22px", textAlign: "center" }}>
              <div style={{ display: "flex", justifyContent: "center", marginBottom: 8 }}><CIc.crown size={40} /></div>
              <div style={{ fontSize: 11, fontWeight: 900, letterSpacing: 2, color:"#F2F2F2", textTransform: "uppercase" }}>MVP of the Night</div>
              <div style={{ fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize: 40, color:"#F2F2F2", marginTop: 4 }}>{mvpPlayer.name}</div>
              {canScore && <button className="jh-chipbtn" style={{ marginTop: 14 }} onClick={reopenVoting}>Reopen voting</button>}
            </div>
          )}

          {canScore && session.mvpVotingOpen && (
            <div style={{ marginTop: 14 }}>
              <button className="jh-chipbtn" onClick={() => setShowTally(v => !v)}>{showTally ? "Hide tally" : "View tally"}</button>
              {showTally && (
                <div style={{ marginTop: 10 }}>
                  {tally.length === 0
                    ? <div style={{ fontSize: 13, color:"#9A9A9A", fontWeight: 700, padding: "10px 4px" }}>No votes yet.</div>
                    : tally.map((t, i) => (
                      <div key={t.id} className="jh-mock-row" style={{ transform: `rotate(${i % 2 ? ".4" : "-.4"}deg)` }}>
                        <div className="jh-mock-rank" style={{ background: i === 0 ? "var(--blue)" : "var(--cream)" }}>{i + 1}</div>
                        <div style={{ flex: 1, fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize: 20, color:"#F2F2F2" }}>{t.player.name}</div>
                        <div style={{ fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize: 28, color: "#C6FF00", WebkitTextStroke:"0" }}>{t.count}</div>
                      </div>
                    ))
                  }
                  <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
                    <button className="jh-chipbtn red" style={{ flex: 1, justifyContent: "center" }} disabled={tally.length === 0} onClick={crownWinner}><CIc.crown size={14} /> Crown Winner</button>
                    <button className="jh-chipbtn" onClick={closeVoting}>⏹ Close</button>
                    <button className="jh-chipbtn" onClick={resetVotes}>🔄 Reset</button>
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function TeamsTab({ session, state, updateSession, update, isAdmin, leaderboard }) {
  const [showAdd, setShowAdd] = useState(false);
  const [showImport, setShowImport] = useState(false);
  const [showSeedModal, setShowSeedModal] = useState(false);
  const [edit, setEdit] = useState(null);
  const teams = session.teams || [];
  const groups = getSessionGroups(session);
  const maxTeams = groups.length * 4;
  const byGroup = groups.reduce((a, g) => (a[g] = teams.filter(t => t.group === g), a), {});

  // manualSeeds: ordered array of teamIds (index 0 = seed 1)
  const manualSeeds = session.manualSeeds || null;

  const lifetimeSorted = [...(leaderboard || [])].sort((a, b) => b.lifetimePts - a.lifetimePts);
  const rankOf = (pid) => { const idx = lifetimeSorted.findIndex(e => e.player.id === pid); return idx === -1 ? 999 : idx; };
  const autoRanked = [...teams].sort((a, b) => (rankOf(a.p1Id) + rankOf(a.p2Id)) - (rankOf(b.p1Id) + rankOf(b.p2Id)));

  // Effective seed order: manual if set, else auto
  const seedOrder = manualSeeds
    ? manualSeeds.map(id => teams.find(t => t.id === id)).filter(Boolean).concat(teams.filter(t => !manualSeeds.includes(t.id)))
    : autoRanked;

  const getSeedNum = (tid) => { const i = seedOrder.findIndex(t => t.id === tid); return i < 8 ? i + 1 : null; };

  const serpentineFromOrder = (ordered, allTeams) => {
    // teams not in ordered go at end
    const sorted = [...ordered, ...allTeams.filter(t => !ordered.find(o => o.id === t.id))];
    const assign = [];
    let dir = 1, gi = 0;
    for (let i = 0; i < sorted.length; i++) {
      assign.push(groups[gi]);
      gi += dir;
      if (gi >= groups.length) { gi = groups.length - 1; dir = -1; }
      else if (gi < 0) { gi = 0; dir = 1; }
    }
    return sorted.map((t, i) => ({ ...t, group: assign[i] }));
  };

  const autoSeedGroups = () => {
    if (teams.length === 0) return;
    const seeded = serpentineFromOrder(seedOrder, teams);
    updateSession(s => ({ ...s, teams: s.teams.map(t => { const u = seeded.find(r => r.id === t.id); return u ? { ...t, group: u.group } : t; }) }));
  };

  const handleImport = (newTeams) => {
    updateSession(s => {
      const all = [...(s.teams || []), ...newTeams];
      const order = manualSeeds
        ? manualSeeds.map(id => all.find(t => t.id === id)).filter(Boolean).concat(all.filter(t => !manualSeeds.includes(t.id)))
        : [...all].sort((a, b) => (rankOf(a.p1Id) + rankOf(a.p2Id)) - (rankOf(b.p1Id) + rankOf(b.p2Id)));
      const seeded = serpentineFromOrder(order, all);
      return { ...s, teams: seeded };
    });
  };

  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between flex-wrap gap-2">
        <div><div className="text-stone-200 font-semibold">{teams.length} / {maxTeams} teams</div>{isAdmin && <div className="text-xs text-stone-500">Tap team to edit · {groups.length} groups</div>}</div>
        {isAdmin && <div className="flex gap-2 flex-wrap">
          {teams.length > 0 && <Btn size="sm" variant="secondary" onClick={() => setShowSeedModal(true)}><I.shield size={14} /> Seeds</Btn>}
          {teams.length > 0 && <Btn size="sm" variant="secondary" onClick={autoSeedGroups}><I.bolt size={14} /> Re-Seed</Btn>}
          <Btn size="sm" variant="secondary" onClick={() => setShowImport(true)}><I.users size={14} /> Import</Btn>
          <Btn size="sm" onClick={() => setShowAdd(true)} disabled={teams.length >= maxTeams}><I.plus size={14} /> Add</Btn>
        </div>}
      </div>
      {groups.map(g => (
        <Card key={g} className="p-3">
          <div className="flex items-center justify-between mb-2">
            <div className="flex items-center gap-2">
              <div style={{ width:32, height:32, display:"flex", alignItems:"center", justifyContent:"center", background:"rgba(198,255,0,.12)", border:"1px solid rgba(198,255,0,.4)", boxShadow:"none", fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize:"20px", letterSpacing:"1px", color:"#F2F2F2" }}>{g}</div>
              <span style={{fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900",fontSize:20,letterSpacing:1,color:"#F2F2F2"}}>GROUP {g}</span>
            </div>
            <span className="text-xs text-stone-500 font-mono">{byGroup[g].length} / 4</span>
          </div>
          {byGroup[g].length === 0 ? <div className="text-xs text-stone-600 italic px-2 py-3 text-center border border-dashed border-stone-800 rounded-lg">Empty</div>
            : <div className="space-y-1">{byGroup[g].map(t => {
              const p1 = state.players.find(p => p.id === t.p1Id);
              const p2 = state.players.find(p => p.id === t.p2Id);
              const seed = getSeedNum(t.id);
              return <button key={t.id} onClick={() => isAdmin && setEdit(t)} className="w-full flex items-center gap-2 p-2 rounded-lg bg-stone-900/50 hover:bg-stone-800/70 text-left">
                {seed ? <span className="text-[9px] font-bold px-1.5 py-0.5 rounded font-mono shrink-0 text-center" style={{ background: seed <= 4 ? "#C6FF00" : "rgba(242,242,242,.08)", color: seed <= 4 ? "#F2F2F2" : "#9A9A9A", border: "1px solid rgba(242,242,242,.14)", borderRadius: 0, minWidth: 28 }}>S{seed}</span> : <span className="shrink-0" style={{ width: 28 }} aria-hidden="true" />}
                <span className="flex items-center shrink-0" style={{ marginRight: 2 }}>
                  {p1 && <Avatar player={p1} size={26} />}
                  {p2 && <span style={{ marginLeft: -6 }}><Avatar player={p2} size={26} /></span>}
                </span>
                <div className="flex-1 min-w-0"><div className="text-sm text-stone-100 truncate">{p1?.name || "?"} & {p2?.name || "?"}</div></div>
                {isAdmin && <I.edit size={12} className="text-stone-500" />}
              </button>;
            })}</div>}
        </Card>
      ))}
      {showAdd && <TeamFormModal title="ADD TEAM" state={state} session={session} groups={groups} onClose={() => setShowAdd(false)} onSave={(t) => updateSession(s => ({ ...s, teams: [...(s.teams || []), { id: uid("t"), ...t }] }))} />}
      {edit && <TeamFormModal title="EDIT TEAM" state={state} session={session} groups={groups} initial={edit} onClose={() => setEdit(null)} onSave={(t) => updateSession(s => ({ ...s, teams: s.teams.map(x => x.id === edit.id ? { ...x, ...t } : x) }))} onDelete={() => updateSession(s => ({ ...s, teams: s.teams.filter(x => x.id !== edit.id) }))} />}
      {showImport && <WhatsAppTeamImportModal onClose={() => setShowImport(false)} state={state} session={session} leaderboard={leaderboard || []} onImport={handleImport} update={update} />}
      {showSeedModal && <ManualSeedModal teams={teams} seedOrder={seedOrder} state={state} onClose={() => setShowSeedModal(false)} onSave={(order) => updateSession(s => ({ ...s, manualSeeds: order.map(t => t.id) }))} />}
    </div>
  );
}

function ManualSeedModal({ teams, seedOrder, state, onClose, onSave }) {
  const [order, setOrder] = useState([...seedOrder]);
  const lbl = (t) => {
    const p1 = state.players.find(p => p.id === t.p1Id);
    const p2 = state.players.find(p => p.id === t.p2Id);
    return `${p1?.name?.split(" ")[0] || "?"} & ${p2?.name?.split(" ")[0] || "?"}`;
  };
  const move = (i, dir) => {
    const j = i + dir;
    if (j < 0 || j >= order.length) return;
    const next = [...order];
    [next[i], next[j]] = [next[j], next[i]];
    setOrder(next);
  };
  return <Modal open={true} onClose={onClose} title="SET SEEDS">
    <div className="space-y-3">
      <div className="text-xs text-stone-400">Re-Seed distributes teams by all-time lifetime points — best players spread evenly across groups (snake order).</div>
      <div className="space-y-1 max-h-80 overflow-y-auto pr-1">
        {order.map((t, i) => (
          <div key={t.id} className="flex items-center gap-2 px-2 py-1.5 rounded-lg" style={{ background: i < 8 ? (i < 4 ? "rgba(198,255,0,.08)" : "rgba(255,255,255,.03)") : "transparent", border: `1px solid ${i < 4 ? "rgba(198,255,0,.18)" : i < 8 ? "rgba(255,255,255,.06)" : "rgba(255,255,255,.03)"}` }}>
            <span className="font-mono text-xs w-5 text-center font-bold" style={{ color: i < 4 ? "var(--orange-br)" : i < 8 ? "var(--muted)" : "var(--muted2)" }}>S{i + 1}</span>
            <span className="flex-1 text-sm text-stone-200 truncate">{lbl(t)}</span>
            <div className="flex gap-1">
              <button onClick={() => move(i, -1)} disabled={i === 0} className="w-6 h-6 rounded bg-stone-800 border border-stone-700 text-stone-400 hover:text-stone-100 disabled:opacity-25 flex items-center justify-center text-xs">↑</button>
              <button onClick={() => move(i, 1)} disabled={i === order.length - 1} className="w-6 h-6 rounded bg-stone-800 border border-stone-700 text-stone-400 hover:text-stone-100 disabled:opacity-25 flex items-center justify-center text-xs">↓</button>
            </div>
          </div>
        ))}
      </div>
      <div className="flex gap-2 pt-1">
        <Btn variant="ghost" onClick={onClose} className="ml-auto">Cancel</Btn>
        <Btn onClick={() => { onSave(order); onClose(); }}>Save Seeds</Btn>
      </div>
    </div>
  </Modal>;
}

function TeamFormModal({ title, state, session, groups, initial, onClose, onSave, onDelete }) {
  const grps = groups || GROUPS;
  const [p1, setP1] = useState(initial?.p1Id || "");
  const [p2, setP2] = useState(initial?.p2Id || "");
  const [g, setG] = useState(initial?.group || grps[0] || "A");
  const warn = useMemo(() => {
    if (!p1 || !p2) return null;
    const others = state.sessions.filter(s => s.id !== session.id);
    const locked = getLockedPartners(p1, others);
    return locked.has(p2) ? "These players won a final together before. Loyalty Lockout!" : null;
  }, [p1, p2, state.sessions, session.id]);
  const used = (session.teams || []).filter(t => !initial || t.id !== initial.id).flatMap(t => [t.p1Id, t.p2Id]);
  return <Modal open={true} onClose={onClose} title={title}>
    <div className="space-y-3">
      <div><label className="text-xs text-stone-400 uppercase tracking-wider font-semibold mb-1 block">Player 1</label><PlayerPicker players={state.players} value={p1} onChange={setP1} exclude={[...used, p2].filter(Boolean)} /></div>
      <div><label className="text-xs text-stone-400 uppercase tracking-wider font-semibold mb-1 block">Player 2</label><PlayerPicker players={state.players} value={p2} onChange={setP2} exclude={[...used, p1].filter(Boolean)} /></div>
      {warn && <div className="flex gap-2 p-2.5 rounded-lg border bg-red-950/30 border-red-900/50 text-red-300 text-xs"><I.lock size={14} className="shrink-0 mt-0.5" /><span>{warn}</span></div>}
      <div><label className="text-xs text-stone-400 uppercase tracking-wider font-semibold mb-1 block">Group</label>
        <div className={`grid gap-2`} style={{gridTemplateColumns:`repeat(${grps.length},1fr)`}}>{grps.map(x => <button key={x} type="button" onClick={() => setG(x)} className={`py-2 rounded-lg font-display text-lg ${g === x ? "bg-gradient-to-b from-orange-500 to-red-600 text-white shadow-lg" : "bg-stone-900 text-stone-300 border border-stone-700"}`}>{x}</button>)}</div>
      </div>
      <div className="flex gap-2 pt-2">
        {onDelete && <Btn variant="danger" onClick={() => { onDelete(); onClose(); }}><I.trash size={14} /></Btn>}
        <Btn variant="ghost" onClick={onClose} className="ml-auto">Cancel</Btn>
        <Btn onClick={() => { if (p1 && p2) { onSave({ p1Id: p1, p2Id: p2, group: g }); onClose(); } }} disabled={!p1 || !p2}>Save</Btn>
      </div>
    </div>
  </Modal>;
}

  const lbl = (t) => t ? `${first(t.p1Id)} & ${first(t.p2Id)}` : "?";

                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <div style={{fontFamily:"'Archivo',sans-serif",fontWeight:800,fontSize:9,letterSpacing:".28em",color:"#CFCFCF"}}>MATCH {mi + 1}</div>

                       border:`1px solid ${done ? "rgba(198,255,0,.35)" : "rgba(110,110,110,.3)"}`}}>
                    <span style={{fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 112,'wght' 900",
                          fontSize:25,lineHeight:1,color:w1 ? "#C6FF00" : "#CFCFCF"}}>{m.score ? m.score.t1 : "–"}</span>
                    <span style={{fontSize:13,color:"#CFCFCF"}}>/</span>
                    <span style={{fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 112,'wght' 900",

                  </div>
                  <div style={{minWidth:0,fontFamily:"'Archivo',sans-serif",fontWeight:800,fontSize:14,
                       color:w2 ? "#C6FF00" : "#F2F2F2",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{lbl(t2)}</div>
                </div>
                {!m.score && m.lossType && <div style={{marginTop:9,fontFamily:"'Archivo',sans-serif",fontWeight:800,
                     fontSize:10,letterSpacing:".14em",color:"#CFCFCF"}}>
                  {(LOSS_TYPES.find(lt => lt.id === m.lossType) || {}).label}</div>}
              </div>;
            })}
          </div>}

      {/* ── STILL TO PLAY ──
          The point of the fix: not just a truthful count, but the actual
          fixtures outstanding. A scorer can see what is left without holding
          the round robin in their head, and tap one to enter it. */}
      {(() => {
        const left = fx.pairs.filter(p => !p.played);
        if (!left.length) return null;
        return <div style={{marginTop:20}}>
          <div style={{display:"flex",alignItems:"baseline",gap:10}}>
            <div className="sg-kicker">Still to play</div>
            <div style={{marginLeft:"auto",fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:"#C6FF00"}}>
              {left.length} left</div>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:6,marginTop:10}}>
            {left.map(pr => (
              <div key={pr.a.id + pr.b.id}
                onClick={() => { if (!isAdmin) return; if (pr.match) setEdit({ ...pr.match, group: g }); else setAdd(g); }}
                style={{cursor:isAdmin ? "pointer" : "default",display:"flex",alignItems:"center",gap:10,

                <div style={{flex:1,minWidth:0,fontFamily:"'Archivo',sans-serif",fontWeight:800,fontSize:13,

                  {pr.match ? "NO SCORE" : isAdmin ? "ADD" : "TO PLAY"}</div>
