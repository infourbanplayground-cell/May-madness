function WhatsAppTeamImportModal({ onClose, state, session, leaderboard, onImport, update }) {
  const [text, setText] = useState("");
  const [step, setStep] = useState("paste");
  const [rows, setRows] = useState([]);
  const groups = getSessionGroups(session);
  const existingPairs = new Set((session.teams || []).map(t => [t.p1Id, t.p2Id].sort().join("|")));

  const buildRows = () => {
    const parsed = parseTeamsFromText(text).map(([n1, n2]) => {
      const r1 = resolvePlayerSmart(n1, state.players);
      const r2 = resolvePlayerSmart(n2, state.players);
      return {
        n1, n2,
        sel1: r1.player?.id || "", sel2: r2.player?.id || "",
        amb1: r1.ambiguous, amb2: r2.ambiguous,
        new1: !r1.player,  // no match ▶ will auto-register
        new2: !r2.player,
      };
    });
    setRows(parsed);
    setStep("review");
  };

  const setSel = (i, key, val) => setRows(rs => rs.map((r, j) => j === i ? { ...r, [key]: val } : r));
  const toggleSkip = (i) => setRows(rs => rs.map((r, j) => j === i ? { ...r, skip: !r.skip } : r));

  // "__register__" sentinel = user explicitly chose to register as new (overrides any fuzzy match)
  const isRegisterNew = (r, side) => r["sel" + side] === "__register__" || (r["new" + side] && !r["sel" + side]);
  const effectiveId = (r, side) => {
    const sel = r["sel" + side];
    if (sel === "__register__" || (!sel && r["new" + side])) return "__new__";
    return sel || "";
  };
  const status = (r) => {
    const id1 = effectiveId(r, 1), id2 = effectiveId(r, 2);
    if (!id1 || !id2) return "unmatched";
    const real1 = id1 !== "__new__" ? id1 : null;
    const real2 = id2 !== "__new__" ? id2 : null;
    if (real1 && real1 === real2) return "samepair";
    if (real1 && real2 && existingPairs.has([real1, real2].sort().join("|"))) return "dup";
    return "ok";
  };
  const importable = rows.filter(r => !r.skip && status(r) === "ok");
  const newCount = importable.filter(r => isRegisterNew(r, 1)).length + importable.filter(r => isRegisterNew(r, 2)).length;

  const handleImport = () => {
    const created = {};
    importable.forEach(r => {
      if (isRegisterNew(r, 1)) { const p = { id: uid("p"), name: r.n1, addedAt: Date.now() }; created[r.n1] = p; }
      if (isRegisterNew(r, 2)) { const p = { id: uid("p"), name: r.n2, addedAt: Date.now() }; created[r.n2] = p; }
    });
    if (Object.keys(created).length > 0) {
      update(s => ({ ...s, players: [...s.players, ...Object.values(created)] }));
    }
    const newTeams = importable.map(r => ({
      id: uid("t"),
      p1Id: isRegisterNew(r, 1) ? created[r.n1]?.id : r.sel1,
      p2Id: isRegisterNew(r, 2) ? created[r.n2]?.id : r.sel2,
      group: groups[0],
    }));
    onImport(newTeams);
    onClose();
  };

  const sortedPlayers = useMemo(() => [...state.players].sort((a, b) => a.name.localeCompare(b.name)), [state.players]);
  const NameSelect = ({ raw, value, ambiguous, isNew, onChange }) => {
    const registerChosen = value === "__register__";
    const resolved = !isNew && value && value !== "__register__";
    const borderCls = !value && !isNew ? "border-red-500/60"
      : ambiguous && !registerChosen ? "border-amber-500/60"
      : (isNew && !value) || registerChosen ? "border-emerald-500/60"
      : "border-stone-700";
    return (
      <div className="flex-1 min-w-0">
        <div className="flex items-center gap-1">
          <div className="text-[10px] text-stone-500 truncate">"{raw}"</div>
          {(isNew && !value) || registerChosen ? <span className="text-[9px] font-bold px-1 rounded bg-emerald-500 text-white">NEW</span> : null}
        </div>
        <select value={value} onChange={e => onChange(e.target.value)}
          className={`w-full bg-stone-900 border rounded-md px-2 py-1.5 text-xs text-stone-100 ${borderCls}`}>
          <option value="">{isNew ? "— auto-register as new —" : "— pick player —"}</option>
          <option value="__register__">+ Register "{raw}" as new player</option>
          <option disabled>──────────────</option>
          {sortedPlayers.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
        </select>
      </div>
    );
  };

  return <Modal open={true} onClose={onClose} title="IMPORT TEAMS">
    <div className="space-y-3">
      {step === "paste" ? <>
        <div className="text-xs text-stone-400">Paste WA chat export or plain list. One team per line, separated by <code className="text-cyan-300">&amp;</code> or <code className="text-cyan-300">/</code>. Unknown names auto-register as new players.</div>
        <textarea value={text} onChange={e => setText(e.target.value)} rows={10}
          placeholder={"Ahmed & Khalid\nMoh / Sultan\nFaisal & Omar\n\nOR from WA export:\n31/05/2025, 10:23 - Coach: Ahmed & Khalid"}
          className="w-full bg-stone-900 border border-stone-700 rounded-lg px-3 py-2.5 text-stone-100 font-mono text-xs focus:outline-none focus:border-stone-500" />
        <div className="flex gap-2">
          <Btn variant="ghost" onClick={onClose}>Cancel</Btn>
          <Btn onClick={buildRows} disabled={!text.trim()}>Extract Teams ▶</Btn>
        </div>
      </> : <>
        <div className="text-xs text-stone-400">{rows.length} pairs · {importable.length} ready{newCount > 0 ? <span className="text-emerald-400"> · {newCount} new player{newCount>1?"s":""} will be registered</span> : null}. <span className="text-cyan-300">Amber</span> = unsure. <span className="text-red-400">Red</span> = pick manually.</div>
        <div className="space-y-2 max-h-80 overflow-y-auto pr-1">
          {rows.map((r, i) => {
            const st = status(r);
            const bg = st === "dup" ? "rgba(247,241,230,0.06)" : st === "ok" ? "var(--surface)" : "rgba(239,68,68,0.06)";
            return (
              <div key={i} className="px-2.5 py-2 rounded-lg" style={{ background: bg, border: "1px solid var(--hairline)" }}>
                <div className="flex items-center gap-2">
                  <input type="checkbox" checked={!r.skip && st !== "dup"} disabled={st === "dup"} onChange={() => toggleSkip(i)} className="accent-orange-500 shrink-0" />
                  <NameSelect raw={r.n1} value={r.sel1} ambiguous={r.amb1} isNew={r.new1} onChange={v => setSel(i, "sel1", v)} />
                  <span className="text-stone-500 shrink-0">&</span>
                  <NameSelect raw={r.n2} value={r.sel2} ambiguous={r.amb2} isNew={r.new2} onChange={v => setSel(i, "sel2", v)} />
                </div>
                {st === "dup" && <div className="text-[10px] text-emerald-500 mt-1 pl-6">Already in this session</div>}
                {st === "samepair" && <div className="text-[10px] text-red-400 mt-1 pl-6">Same player twice</div>}
                {(r.amb1 || r.amb2) && st === "ok" && <div className="text-[10px] text-cyan-300 mt-1 pl-6">Multiple possible matches — verify</div>}
              </div>
            );
          })}
        </div>
        <div className="flex gap-2 pt-1">
          <Btn variant="ghost" onClick={() => setStep("paste")}>← Back</Btn>
          <Btn onClick={handleImport} disabled={!importable.length}>Import {importable.length} + Auto-Seed</Btn>
        </div>
      </>}
    </div>
  </Modal>;
}

function DraftReminderModal({ onClose, state, leaderboard }) {
  const nextNum = (state.sessions || []).length + 1;
  const [name, setName] = useState(`Session ${nextNum}`);
  const [date, setDate] = useState(() => {
    const d = new Date(); d.setDate(d.getDate() + 1);
    return [d.getFullYear(), String(d.getMonth()+1).padStart(2,"0"), String(d.getDate()).padStart(2,"0")].join("-");
  });
  // Defaults from the schedule — see DOUBLE_NIGHTS. Overridable.
  const [doublePoints, setDoublePoints] = useState(
    () => DOUBLE_NIGHTS.includes(date));
  // ...and follows the date if the organiser changes it, unless they
  // have already touched the toggle themselves.
  const touchedDouble = React.useRef(false);
  React.useEffect(() => {
    if (!touchedDouble.current) setDoublePoints(DOUBLE_NIGHTS.includes(date));
  }, [date]);
  const mockSession = { name, date, doublePoints, signupSlots: Array(16).fill(""), signupWaitlist: Array(3).fill("") };
  const text = generateReminderText(mockSession, state, leaderboard);
  const [copied, setCopied] = useState(false);
  const copy = () => { navigator.clipboard?.writeText(text); setCopied(true); setTimeout(() => setCopied(false), 2000); };
  return <Modal open={true} onClose={onClose} title="DRAFT SIGNUP POST">
    <div className="space-y-3">
      <div><label className="text-xs text-stone-400 uppercase tracking-wider font-semibold mb-1 block">Session Name</label><Input autoFocus value={name} onChange={setName} /></div>
      <div><label className="text-xs text-stone-400 uppercase tracking-wider font-semibold mb-1 block">Date</label><Input type="date" value={date} onChange={setDate} /></div>
      <div className="flex items-center justify-between p-3 bg-stone-900 rounded-lg">
        <div className="flex items-center gap-2">
          <div className="px-1.5 py-0.5 rounded font-display text-[10px] font-bold" style={{ background:"#F2B8BC", color:"#1A0A0C", letterSpacing:".08em" }}>2X</div>
          <span className="text-sm text-stone-200">Double Points</span>
        </div>
        <button onClick={() => { touchedDouble.current = true; setDoublePoints(v => !v); }} className={`relative w-11 h-6 rounded-full ${doublePoints ? "bg-red-600" : "bg-stone-700"}`}>
          <div className={`absolute top-0.5 w-5 h-5 rounded-full bg-white transition-transform ${doublePoints ? "translate-x-5" : "translate-x-0.5"}`} />
        </button>
      </div>
      <textarea readOnly rows={16} value={text} className="w-full bg-stone-900 border border-stone-700 rounded-lg px-3 py-2.5 text-stone-100 font-mono text-xs leading-relaxed" />
      <Btn className="w-full" onClick={copy}>{copied ? "Copied" : "Copy for WhatsApp"}</Btn>
    </div>
  </Modal>;
}


// ─── FORMAT explainer for WhatsApp ──────────────────────────────────────
// Everything here is derived, not typed: the point values come from the same
// numbers the scoring engine uses, and the pool is checked against its parts
// so the post can never contradict the app.
function generateFormatText(state) {
  const seriesName = state.seasonName || "56 NATIONAL SERIES";
  const vol = state.seasonSubtitle?.match(/VOL\.\s*\d+/i)?.[0] || "Vol. 9";
  const sessionVoucher = 14, perTeam = 2, sessionsTotal = SESSIONS_TOTAL;
  const season = SEASON_PRIZES;
  const pool = sessionVoucher * perTeam * sessionsTotal + season.reduce((a, b) => a + b, 0);

  let t = `🔥 *${seriesName} · HOW IT WORKS* 🔥\n`;
  t += `_Urban Social Series · ${vol}_\n\n`;
  t += `📍 Urban Playground, Oman\n`;
  t += `🗓️ Mon & Wed · 5:30 PM · all November\n`;
  t += `💸 7 OMR per player\n\n`;
  t += `━━━━━━━━━━━━━━━━━━━━\n*🎾 THE FORMAT*\n\n`;
  t += `A *social* series — not a closed league.\n\n`;
  t += `• 16 teams · 4 groups of 4\n`;
  t += `• Group stage, then knockouts: QF ▶ SF ▶ Final\n`;
  t += `• New partners every session — you're not locked to one player all series\n`;
  t += `• Everyone gets ranked, first night or fiftieth\n`;
  t += `• Points follow *you*, not your team\n\n`;
  t += `━━━━━━━━━━━━━━━━━━━━\n*📊 POINTS PER NIGHT*\n\n`;
  t += `*Group stage*\nWin +3\nTiebreak loss +2\nCompetitive loss +1\nTop of your group +1\n\n`;
  t += `*Knockouts*\nReach QF +1\nReach SF +2\nReach Final +3\nWin the Final +5 🏆\n\n`;
  t += `_Only your best ${GROUP_COUNTED_GAMES} group games count — a bigger group is never an advantage._\n\n`;
  t += `━━━━━━━━━━━━━━━━━━━━\n*💰 PRIZES — ${pool} OMR*\n\n`;
  t += `*Every session*\n🏆 Winners take a *${sessionVoucher} OMR voucher each*\n\n`;
  t += `*End of season*\n🥇 1st — *${season[0]} OMR*\n🥈 2nd — *${season[1]} OMR*\n🥉 3rd — *${season[2]} OMR*\n\n`;
  t += `⚡ *Sessions 6, 8 & 9 pay DOUBLE points* — including the national day night on ${NATIONAL_DAY_LABEL}. The table can still flip on the last night, so it's never too late to join.\n\n`;
  t += `━━━━━━━━━━━━━━━━━━━━\n📊 Live table: https://national.urbanpadel.om\n`;
  t += `💥 *One flag. One court.* 👑`;
  return t;
}

function luWeave(g, y) {
  const b = LU_BAND_IMG;
  if (!b) return;
  const h = 56, pad = 36, x0 = pad, bw = LU_W - pad * 2;
  // The width always keeps the art's own 100:56 ratio: a woven band stretched
  // off its aspect is the one place a pattern looks obviously wrong.
  const w = Math.round(h * b.width / b.height);
  g.save();
  g.beginPath();
  if (g.roundRect) g.roundRect(x0, y, bw, h, h / 2); else g.rect(x0, y, bw, h);
  g.clip();
  g.fillStyle = "#9E1520"; g.fillRect(x0, y, bw, h);
  for (let x = x0; x < x0 + bw; x += w) g.drawImage(b, x, y, w, h);
  g.restore();
}
// Head and foot. The side inset is 36 and the edge offset 18, which is the
// handoff's own 14-against-7 at this scale — the band is a trim ON the edge,
// so it sits nearer to it than to the sides. Inset 36 all round instead, the
// foot band needed the footer moved 54px up and that clipped the top of the
// club mark behind the lower name plate.
const luTrim = (g) => { luWeave(g, 18); luWeave(g, LU_H - 74); };

// The masar band, inset and pilled — the handoff's own proportions.
function ncBand(g, y) {
  const b = LU_BAND_IMG;
  const x0 = NC.PAD, w = LU_W - NC.PAD * 2, h = NC.BAND;
  g.save();
  g.beginPath();
  if (g.roundRect) g.roundRect(x0, y, w, h, h / 2); else g.rect(x0, y, w, h);
  g.clip();
  g.fillStyle = NC.DEEP; g.fillRect(x0, y, w, h);
  if (b) {
    // Always the art's own 100:56 ratio. A woven band stretched off its
    // aspect is the one place a pattern looks obviously wrong.
    const tw = Math.round(h * b.width / b.height);
    for (let x = x0; x < x0 + w; x += tw) g.drawImage(b, x, y, tw, h);
  }
  g.restore();
}

// The arch: a dome on straight sides with a small foot radius. One path,
// reused for the outline, the clip and the inner line — three copies of this
// shape would be three chances for them to disagree.
function ncArchPath(g, l, t, r, b, foot) {
  const rad = (r - l) / 2, f = foot == null ? 30 : foot;
  g.beginPath();
  g.moveTo(l, b - f);
  g.lineTo(l, t + rad);
  g.arc(l + rad, t + rad, rad, Math.PI, 0);
  g.lineTo(r, b - f);
  g.arcTo(r, b, r - f, b, f);
  g.lineTo(l + f, b);
  g.arcTo(l, b, l, b - f, f);
  g.closePath();
}

function ncArt(key) {
  if (NC_ART[key] !== undefined) return NC_ART[key];
  const src = (typeof LANDMARK_ART !== "undefined") && LANDMARK_ART[key];
  if (!src) { NC_ART[key] = null; return null; }
  const im = new Image();
  im.src = src;
  NC_ART[key] = im;
  return im;
}
// AND IT HAS TO BE DECODED BEFORE THE FIRST PAINT. A canvas draw of an image
// that has not loaded is a silent no-op — the first render came out with an
// empty medallion, a ring with nothing in it, which looks like a deliberate
// blank disc rather than a missing asset. Every draw entry point awaits this.
async function ncPreload(d) {
  const lm = ncLandmark(d);
  const im = lm && ncArt(lm.asset);
  if (!im || (im.complete && im.naturalWidth)) return;
  await new Promise(r => { im.onload = r; im.onerror = r; setTimeout(r, 1500); });
}

// Which landmark this night wears. The night number is on the card already
// (d.foot is "NIGHT 06"), so the card does not need to be told separately —
// and it cannot disagree with the app, which cycles the same list in order.
function ncLandmark(d) {
  if (typeof LANDMARKS === "undefined" || !LANDMARKS.length) return null;
  const m = String(d && d.foot || "").match(/(\d+)/);
  const n = m ? parseInt(m[1], 10) : 1;
  return landmarkFor(Math.max(0, n - 1));
}

function ncPaint(g, kind, d, im, logo, adj, mode) {
  adj = adj || LU_ADJ0;
  const L = NC.PAD + 28, R = LU_W - NC.PAD - 28, W = R - L;

  // ── the ground ──────────────────────────────────────────────────────────
  g.fillStyle = NC.BG; g.fillRect(0, 0, LU_W, LU_H);
  if (LU_TILE_IMG) {
    g.save(); g.globalAlpha = 0.14;
    const t = 300;
    for (let y = 0; y < LU_H; y += t) for (let x = 0; x < LU_W; x += t)
      g.drawImage(LU_TILE_IMG, x, y, t, t);
    g.restore();
  }

  // ── the arch ────────────────────────────────────────────────────────────
  const A = NC;
  const archCx = (A.ARCH_L + A.ARCH_R) / 2;

  // its own ground, a shade deeper than the card, so the door reads as a
  // recess rather than as an outline drawn on a flat wall
  g.save();
  ncArchPath(g, A.ARCH_L, A.ARCH_TOP, A.ARCH_R, A.ARCH_BOT);
  g.clip();
  g.fillStyle = A.DEEP; g.fillRect(0, 0, LU_W, LU_H);
  if (LU_TILE_IMG) {
    g.save(); g.globalAlpha = 0.16;
    const t = 190;
    for (let y = A.ARCH_TOP; y < A.ARCH_BOT; y += t)
      for (let x = A.ARCH_L; x < A.ARCH_R; x += t)
        g.drawImage(LU_TILE_IMG, x, y, t, t);
    g.restore();
  }

  // the volume's number, a ghost behind whoever is standing there
  {
    const t = "56";
    const sz = stFit(g, t, (A.ARCH_R - A.ARCH_L) * 1.02, 560, 900);
    g.font = `italic 900 ${sz}px Archivo, sans-serif`;
    g.fillStyle = "rgba(26,10,12,.26)";
    g.fillText(t, archCx - g.measureText(t).width / 2, A.ARCH_BOT - 300);
  }

  // ── the players, inside the arch ────────────────────────────────────────
  if (im) {
    if (mode === "cut") {
      // A cut-out STANDS on the arch's floor. Fitted on both axes: fitting on
      // height alone runs a row of four past the sides and slices the outer
      // two, which is the bug the inherited painter already records.
      const FEET = A.ARCH_BOT - 26, HEAD = A.ARCH_TOP + 96;
      const box = luInkBox(im);
      const z = Math.max(1, adj.zoom || 1);
      const maxH = (FEET - HEAD) * z, maxW = (A.ARCH_R - A.ARCH_L - 56) * z;
      const r = Math.min(maxH / box.h, maxW / box.w);
      const dw = im.width * r, dh = im.height * r;
      const x = archCx - (box.x + box.w / 2) * r + (adj.x || 0);
      const y = FEET - (box.y + box.h) * r + (adj.y || 0);
      g.imageSmoothingEnabled = true; g.imageSmoothingQuality = "high";
      g.drawImage(im, x, y, dw, dh);
    } else {
      // A whole photograph fills the arch. NO GRADE ON THE PLAYERS — the
      // owner's call; only the brightness the organiser dialled in.
      const br = adj.bright || 1;
      if (LU_CAN_FILTER && br !== 1) g.filter = `brightness(${br.toFixed(3)})`;
      luCoverAdj(g, im, A.ARCH_L, A.ARCH_TOP,
                 A.ARCH_R - A.ARCH_L, A.ARCH_BOT - A.ARCH_TOP, adj);
      g.filter = "none";
    }
    // the floor: enough to stand the arch's own foot on, not a wash on anyone
    const fg = g.createLinearGradient(0, A.ARCH_BOT - 190, 0, A.ARCH_BOT);
    fg.addColorStop(0, "rgba(158,21,32,0)");
    fg.addColorStop(1, "rgba(158,21,32,.86)");
    g.fillStyle = fg; g.fillRect(A.ARCH_L, A.ARCH_BOT - 190,
                                 A.ARCH_R - A.ARCH_L, 190);
  }

  // ONE SOFT LIGHT, AND IT IS NOT GREEN. Green lamps on `screen` over a
  // photograph do not read as light in the room — they read as a green smear
  // laid on the picture, which is exactly what the owner called a blob. The
  // green belongs where it has an edge: the arch's inner line, the medallion's
  // outer ring, the weave on the plate. What stays here is a single neutral
  // lamp high in the arch, which is what stops a cut-out looking pasted on.
  g.globalCompositeOperation = "screen";
  {
    const cx = archCx, cy = A.ARCH_TOP + 180, rad = 460;
    const r2 = g.createRadialGradient(cx, cy, 0, cx, cy, rad);
    r2.addColorStop(0, "rgba(247,241,230,.20)");
    r2.addColorStop(0.45, "rgba(247,241,230,.06)");
    r2.addColorStop(1, "rgba(247,241,230,0)");
    g.fillStyle = r2;
    g.fillRect(A.ARCH_L, A.ARCH_TOP, A.ARCH_R - A.ARCH_L, A.ARCH_BOT - A.ARCH_TOP);
  }
  g.globalCompositeOperation = "source-over";
  g.restore();

  // the double line: 4px ivory, and a hairline inset 14 inside it. The
  // handoff's "double line" is the volume's one piece of depth — there are
  // no drop shadows anywhere in this design.
  g.strokeStyle = A.IVORY; g.lineWidth = 5;
  ncArchPath(g, A.ARCH_L, A.ARCH_TOP, A.ARCH_R, A.ARCH_BOT);
  g.stroke();
  g.strokeStyle = A.GREEN; g.lineWidth = 3;
  ncArchPath(g, A.ARCH_L + 15, A.ARCH_TOP + 15, A.ARCH_R - 15, A.ARCH_BOT - 15, 20);
  g.stroke();

  // ── the medallion, straddling the apex ──────────────────────────────────
  {
    const lm = ncLandmark(d);
    const cx = archCx, cy = A.ARCH_TOP;
    g.fillStyle = A.BG;
    g.beginPath(); g.arc(cx, cy, A.MED_R, 0, Math.PI * 2); g.fill();
    g.strokeStyle = A.IVORY; g.lineWidth = 5;
    g.beginPath(); g.arc(cx, cy, A.MED_R, 0, Math.PI * 2); g.stroke();
    g.strokeStyle = A.GREEN; g.lineWidth = 4;
    g.beginPath(); g.arc(cx, cy, A.MED_R + 8, 0, Math.PI * 2); g.stroke();
    // LANDMARK_ART is keyed by the plain asset name. The "@ink" suffix is
    // national_assets.py's own key for an inked variant and does not
    // survive into the page — asking for it got undefined, and a canvas
    // draw of nothing is a silent no-op, so the medallion rendered as a
    // ring with an empty disc in it. That looks like a design choice.
    const art = lm && ncArt(lm.asset);
    if (art && art.complete && art.naturalWidth) {
      const s = A.MED_R * 1.16;
      const r = Math.min(s / art.naturalWidth, s / art.naturalHeight);
      g.drawImage(art, cx - art.naturalWidth * r / 2,
                  cy - art.naturalHeight * r / 2 + 3,
                  art.naturalWidth * r, art.naturalHeight * r);
    }
  }

  // ── the frame ───────────────────────────────────────────────────────────
  ncBand(g, 72);
  ncBand(g, LU_H - 72 - NC.BAND);

  // ── the header row ──────────────────────────────────────────────────────
  const head = `${SERIES_NAME} \u00B7 ${d.foot || ""}`.trim();
  stMono(g, head, L, 206, 25, A.IVORY, 5);
  {
    // The Arabic opposite, right-aligned. Noto Kufi is subsetted to exactly
    // the words the brand uses, so this string comes from the config and is
    // never written here.
    g.font = `700 30px "Noto Kufi Arabic", sans-serif`;
    g.fillStyle = A.IVORY;
    g.fillText(SERIES_NAME_AR, R - g.measureText(SERIES_NAME_AR).width, 212);
  }

  // ── the headline ────────────────────────────────────────────────────────
  const big = kind === "champs" ? ["NIGHT", "CHAMPIONS"]
            : kind === "final"  ? ["THE", "FINAL"]
            : ["SEMI", "FINAL"];
  stDisp(g, big[0], L, 352, 132, A.IVORY, W);
  stDisp(g, big[1], L, 474, 132, A.IVORY, W);

  // ── the result plate ────────────────────────────────────────────────────
  const PT = A.PLATE_T, PB = A.PLATE_B, PL = NC.PAD, PR = LU_W - NC.PAD;
  const PW = PR - PL, PH = PB - PT, PRAD = 42;
  g.save();
  g.beginPath();
  if (g.roundRect) g.roundRect(PL, PT, PW, PH, PRAD); else g.rect(PL, PT, PW, PH);
  g.fillStyle = A.IVORY; g.fill();
  g.clip();
  // its own masar trim, along the top edge and clipped by the plate's corners
  {
    const b = LU_BAND_IMG, h = 16;
    g.fillStyle = A.DEEP; g.fillRect(PL, PT, PW, h);
    if (b) {
      const tw = Math.round(h * b.width / b.height);
      for (let x = PL; x < PR; x += tw) g.drawImage(b, x, PT, tw, h);
    }
  }
  g.restore();

  const midY = PT + 30 + (PH - 30) / 2;
  if (kind === "champs") {
    // WINNERS chip, then the name in ink. The chip is the only red fill on
    // the plate, so it reads as the one thing that matters on it.
    const chip = "WINNERS";
    g.font = '700 22px "JetBrains Mono", monospace';
    const cw = g.measureText(chip).width + 10 * 6 + 44;
    g.fillStyle = A.FLAG;
    g.beginPath();
    if (g.roundRect) g.roundRect(PL + 44, PT + 56, cw, 44, 22);
    else g.rect(PL + 44, PT + 56, cw, 44);
    g.fill();
    stMono(g, chip, PL + 66, PT + 85, 22, A.IVORY, 6);

    // The score is the hero: the winner's figure in the flag's red, the
    // loser's in the plate's muted ink. Centred on the plate, not on the
    // card, so it stays put whatever the names do.
    const hi = String(d.aScore == null ? "" : d.aScore);
    const lo = String(d.bScore == null ? "" : d.bScore);
    if (hi !== "" || lo !== "") {
      g.font = "italic 900 104px Archivo, sans-serif";
      const wHi = g.measureText(hi).width, wLo = g.measureText(lo).width;
      g.font = "italic 900 72px Archivo, sans-serif";
      const wDash = g.measureText("\u2013").width + 22;
      const total = wHi + wDash + wLo;
      let x = (PL + PR) / 2 - total / 2;
      g.font = "italic 900 104px Archivo, sans-serif";
      g.fillStyle = A.FLAG; g.fillText(hi, x, midY + 34); x += wHi + 11;
      g.font = "italic 900 72px Archivo, sans-serif";
      g.fillStyle = A.MUTED; g.fillText("\u2013", x, midY + 24); x += wDash - 11;
      g.font = "italic 900 104px Archivo, sans-serif";
      g.fillStyle = A.MUTED; g.fillText(lo, x, midY + 34);
    }

    // FINAL, outlined, opposite the WINNERS chip
    {
      const t = "FINAL";
      g.font = '700 22px "JetBrains Mono", monospace';
      const w = g.measureText(t).width + 5 * (t.length - 1) + 44;
      g.strokeStyle = A.MUTED; g.lineWidth = 2;
      g.beginPath();
      if (g.roundRect) g.roundRect(PR - 44 - w, PT + 56, w, 44, 22);
      else g.rect(PR - 44 - w, PT + 56, w, 44);
      g.stroke();
      stMono(g, t, PR - 44 - w + 22, PT + 85, 22, A.MUTED, 5);
    }

    // the two names, under their chips, each in its own half
    const half = (PW - 88) * 0.40;
    ncName(g, (d.a || "").toUpperCase(), PL + 44, PT + 150, half, A.INK, "left");
    ncName(g, (d.b || "").toUpperCase(), PR - 44, PT + 150, half, A.MUTED, "right");
  } else {
    // A line-up: two teams and the groups they came out of, with VS between.
    const half = (PW - 88) * 0.38;
    ncName(g, (d.a || "TBD").toUpperCase(), PL + 44, PT + 112, half, A.INK, "left");
    ncName(g, (d.b || "TBD").toUpperCase(), PR - 44, PT + 112, half, A.INK, "right");
    g.font = "italic 900 58px Archivo, sans-serif";
    g.fillStyle = A.FLAG;
    const vs = "VS";
    g.fillText(vs, (PL + PR) / 2 - g.measureText(vs).width / 2, midY + 6);
    const chipY = PB - 44;
    if (d.aChip) stMono(g, d.aChip, PL + 44, chipY, 21, A.MUTED, 5);
    if (d.bChip) {
      g.font = '700 21px "JetBrains Mono", monospace';
      const w = g.measureText(d.bChip).width + 5 * (d.bChip.length - 1);
      stMono(g, d.bChip, PR - 44 - w, chipY, 21, A.MUTED, 5);
    }
  }

  // ── the foot ────────────────────────────────────────────────────────────
  // EVERYTHING HERE HAS TO CLEAR THE BOTTOM BAND, which starts at
  // LU_H - 72 - BAND. At 104px from PLATE_B + 48 the club mark ran to 1828
  // and the band begins at 1804, so the mark was drawn straight through the
  // weave — and a decorative strip is invisible to every text check there is.
  const FOOT = A.PLATE_B, BAND_TOP = LU_H - 72 - NC.BAND;
  if (logo) {
    const h = 74, w = logo.width * (h / logo.height);
    const off = document.createElement("canvas");
    off.width = Math.ceil(w); off.height = h;
    const o = off.getContext("2d");
    o.drawImage(logo, 0, 0, w, h);
    o.globalCompositeOperation = "source-in";
    o.fillStyle = A.IVORY; o.fillRect(0, 0, w, h);
    g.drawImage(off, L, FOOT + 26);
  }
  {
    const t = `${VOLUME_LABEL} \u00B7 ${SEASON_MONTH_SHORT} ${SEASON_YEAR}`;
    g.font = '700 26px "JetBrains Mono", monospace';
    const w = g.measureText(t).width + 7 * (t.length - 1);
    stMono(g, t, R - w, FOOT + 62, 26, A.IVORY, 7);
    const lm = ncLandmark(d);
    if (lm && lm.nameAr) {
      g.font = `700 26px "Noto Kufi Arabic", sans-serif`;
      g.fillStyle = A.ROSE;
      g.fillText(lm.nameAr, R - g.measureText(lm.nameAr).width, FOOT + 106);
    }
  }
}

// A team name on the ivory plate. Doubles pairs are long — "ALMUNTASER &
// MUATASIM" — so it breaks on the ampersand before it shrinks, which keeps
// the type big and reads as two people rather than as one long string.
function ncName(g, name, x, y, max, colour, align) {
  const parts = name.split(/\s*&\s*/);
  const lines = parts.length === 2 ? [parts[0], "& " + parts[1]] : [name];
  let size = 46;
  for (;;) {
    g.font = `italic 900 ${size}px Archivo, sans-serif`;
    if (lines.every(t => g.measureText(t).width <= max) || size <= 20) break;
    size -= 2;
  }
  g.fillStyle = colour;
  lines.forEach((t, i) => {
    const w = g.measureText(t).width;
    g.fillText(t, align === "right" ? x - w : x, y + i * (size + 6));
  });
  return size;
}

// ── Vol.9 group / bracket cards ───────────────────────────────────────────
const NG = {
  L: NC.PAD + 28,
  EYE: 268,          // eyebrow baseline
  H1: 372, H2: 476,  // the two headline lines
  DISP: 104,
  TOP: 530,          // body top, with no key row
  BOT: 1654,         // body bottom; the foot block and the band live below
  MED: 62,           // the landmark medallion beside the headline
  RAD: 14,           // a row's corner — a tall block pilled is an ellipse
};

// Which landmark, from the SESSION number in the eyebrow. These cards carry
// the host in `foot` rather than "NIGHT 06", so ncLandmark cannot read them.
function ngLandmark(d) {
  if (typeof LANDMARKS === "undefined" || !LANDMARKS.length) return null;
  const m = String(d && d.eyebrow || "").match(/(\d+)/);
  return landmarkFor(Math.max(0, (m ? parseInt(m[1], 10) : 1) - 1));
}
async function ngPreload(d) {
  const lm = ngLandmark(d);
  const im = lm && ncArt(lm.asset);
  if (!im || (im.complete && im.naturalWidth)) return;
  await new Promise(r => { im.onload = r; im.onerror = r; setTimeout(r, 1500); });
}

// WHERE EACH BLOCK WAS GIVEN AND WHERE IT ACTUALLY ENDED. This is the one
// thing on these cards that cannot be seen in the bitmap: a group header
// landing on the row above it is ivory type on a deep-red pill, which no
// colour sample distinguishes from the same type 40px higher. So the painter
// reports its own geometry and ops/check-cards.mjs reads it back.
let NG_BLOCKS = [];

// A pill. Canvas got roundRect late enough that the fallback is not optional.
function ngPill(g, x, y, w, h, r) {
  g.beginPath();
  if (g.roundRect) g.roundRect(x, y, w, h, r); else g.rect(x, y, w, h);
}

// ── one group's block ─────────────────────────────────────────────────────
// Sized to the slot it is GIVEN, with no floor. Everything inside is derived
// from the row height, so a six-team group and a four-team group are the same
// design at two sizes rather than two designs.
function ngGroup(g, d, x, y, w, h) {
  const A = NC;
  const rows = d.rows || [];
  const n = Math.max(1, rows.length);
  const HEAD = Math.min(46, h * 0.19);
  const gap = 5;
  const rh = Math.min(96, (h - HEAD - gap * n) / n);

  // the letter, on an ivory disc. The handoff has no square blocks, and a
  // letter in a circle is the one place a disc is unambiguous.
  const dr = Math.min(21, HEAD * 0.46);
  g.fillStyle = A.IVORY;
  g.beginPath(); g.arc(x + dr, y + dr, dr, 0, Math.PI * 2); g.fill();
  g.font = `italic 900 ${Math.round(dr * 1.26)}px Archivo, sans-serif`;
  g.fillStyle = A.INK;
  {
    const t = d.letter || "";
    g.fillText(t, x + dr - g.measureText(t).width / 2, y + dr + dr * 0.44);
  }

  stMono(g, d.title || "", x + dr * 2 + 16, y + dr + 7, Math.round(dr * 0.92), A.IVORY, 4);
  if (d.note) {
    const s = Math.round(dr * 0.8);
    g.font = `700 ${s}px "JetBrains Mono", monospace`;
    const tw = g.measureText(d.note).width + 4 * (d.note.length - 1);
    stMono(g, d.note, x + w - tw, y + dr + 6, s, A.ROSE, 4);
  }

  let ry = y + HEAD;
  rows.forEach((r, i) => {
    // Three states, not two. A third-placed team has NOT been knocked out
    // when this card goes up — it is either a best third or in the playoff —
    // so "still in it" is its own state and is never drawn as eliminated.
    const live = r.through === true;
    const alive = r.through === "alive";
    const out = r.through === false;

    g.save();
    ngPill(g, x, ry, w, rh, NG.RAD);
    g.fillStyle = A.DEEP; g.fill();
    g.clip();
    // GREEN IS THE WINNER'S EDGE, the same thing it means on the line-up
    // card's champion plate — never a fill and never a lamp. A through team
    // gets a bar down its left; nothing else on these cards is green.
    if (live) { g.fillStyle = A.GREEN; g.fillRect(x, ry, 7, rh); }
    else if (alive) { g.fillStyle = A.FLAG; g.fillRect(x, ry, 7, rh); }
    g.restore();
    ngPill(g, x + 1.25, ry + 1.25, w - 2.5, rh - 2.5, NG.RAD);
    g.strokeStyle = live ? A.GREEN : alive ? A.ROSE : "rgba(247,241,230,.26)";
    g.lineWidth = live || alive ? 2.5 : 1.5;
    g.stroke();

    const pad = 18 + 7;
    let nx = x + pad;
    // A position only on a card that HAS positions. On the draw nothing has
    // been played, so 1-2-3-4 beside the names reads as a ranking somebody
    // made, when it is only the order the teams were entered.
    if (d.ordered) {
      const s = Math.round(rh * 0.38);
      g.font = `700 ${s}px "JetBrains Mono", monospace`;
      // NEVER the green. #087A3F on the deep red is about 1.2:1 — the first
      // render put the position of every qualifying team in a colour that is
      // not there. Green is the EDGE; the numeral is ivory, or rose once the
      // team is out.
      g.fillStyle = out ? A.ROSE : A.IVORY;
      g.fillText(String(i + 1), nx, ry + rh / 2 + s * 0.36);
      nx += Math.max(26, s * 1.5);
    }

    // the tail — wins and game difference, or the seed — measured first, so
    // the name is fitted to the room that is actually left
    let tail = 0;
    if (r.tail) {
      const s = Math.round(rh * 0.3);
      g.font = `700 ${s}px "JetBrains Mono", monospace`;
      const tw = g.measureText(r.tail).width + 3 * (r.tail.length - 1);
      stMono(g, r.tail, x + w - 20 - tw, ry + rh / 2 + s * 0.36, s,
             out ? A.ROSE : A.IVORY, 3);
      tail = tw + 24;
    }
    const size = stFit(g, r.name, w - pad - (nx - x - pad) - 20 - tail,
                       Math.min(44, Math.round(rh * 0.56)), 900);
    g.font = `italic 900 ${size}px Archivo, sans-serif`;
    g.fillStyle = out ? A.ROSE : A.IVORY;
    g.fillText(r.name, nx, ry + rh / 2 + size * 0.34);

    ry += rh + gap;
  });
  NG_BLOCKS.push({ letter: d.letter, rows: n, rh,
                   slot: [y, y + h], drawn: [y, ry - gap] });
}

// ── the knockout, round by round ──────────────────────────────────────────
// The LAYOUT is kept from the volume this inherits from, and deliberately:
// the rounds stack because three columns leave ~300px a slot and a doubles
// pair does not fit in 300px at any size worth reading; each round is inset so
// the card visibly narrows; a chevron pushes the eye down the tree; and the
// champions get the foot. What changes is everything about how it is DRAWN —
// pilled rows, the winner's green edge, and the champions on an ivory plate
// with its own weave, which is the same plate the line-up card's result sits
// on.
function ngBracket(g, d, x, y, w, h, faces) {
  const A = NC;
  const cols = (d.cols || []).filter(c => c.ties && c.ties.length);
  if (!cols.length) return;

  const last = cols[cols.length - 1];
  const fin = last.label === "FINAL" ? last.ties[0] : null;
  const champ = fin ? (fin.aWon ? fin.a : fin.bWon ? fin.b : "") : "";
  const CH = champ ? 200 : 0;

  const ties = cols.reduce((n, c) => n + c.ties.length, 0);
  const LBL = 34, SGAP = 30, RGAP = 26, STEP = 52, CGAP = 44;
  const band = h - (champ ? CH + CGAP : 0);
  const avail = band - cols.length * (LBL + SGAP) - (ties - cols.length) * RGAP;
  const units = ties + (fin ? 0.55 : 0);
  // Capped above but NOT below: this is the same floor that overlapped the
  // draw card, and a bracket deep enough to hit it would overlap the same way.
  const th = Math.min(132, avail / units);

  const rowsH = cols.reduce((n, c) =>
    n + LBL + c.ties.length * (c.label === "FINAL" ? th * 1.55 : th)
      + (c.ties.length - 1) * RGAP + SGAP, 0) - SGAP;
  const contentH = rowsH + (champ ? CGAP + CH : 0);
  let cy = y + Math.max(0, (h - contentH) / 2);
  const top = cy;

  cols.forEach((col, ci) => {
    const inset = ci * STEP;
    const cx = x + inset, cw = w - inset * 2;
    const isFinal = col.label === "FINAL";
    const rowH = isFinal ? th * 1.55 : th;

    stMono(g, col.label, cx, cy + 18, 19, isFinal ? A.IVORY : A.ROSE, 3);
    cy += LBL;
    col.ties.forEach(t => {
      const rh = (rowH - 4) / 2;
      [[t.a, t.aWon, t.aScore, t.aPics], [t.b, t.bWon, t.bScore, t.bPics]]
        .forEach(([nm, won, sc, pics], k) => {
        const ry = cy + k * (rh + 4);
        g.save();
        ngPill(g, cx, ry, cw, rh, NG.RAD);
        g.fillStyle = A.DEEP; g.fill();
        g.clip();
        if (won) { g.fillStyle = A.GREEN; g.fillRect(cx, ry, 7, rh); }
        g.restore();
        ngPill(g, cx + 1.25, ry + 1.25, cw - 2.5, rh - 2.5, NG.RAD);
        g.strokeStyle = won ? A.GREEN : "rgba(247,241,230,.26)";
        g.lineWidth = won ? 2.5 : 1.5;
        g.stroke();

        // Faces ONLY on the final. A quarter-final row is ~44px tall, and a
        // face in it lands at about 16px once a story is scaled to a phone —
        // a smudge that also steals the width the name needs.
        let tx = cx + 26;
        if (isFinal && pics && pics.length) {
          const fr = rh * 0.40;
          pics.slice(0, 2).forEach((q, j) => {
            gcFace(g, q, cx + 24 + fr + j * fr * 1.55, ry + rh / 2, fr, faces);
          });
          tx = cx + 24 + fr * 2.55 + fr + 18;
        }
        let tail = 0;
        if (sc) {
          const s = Math.round(rh * 0.42);
          g.font = `700 ${s}px "JetBrains Mono", monospace`;
          const tw = g.measureText(sc).width;
          g.fillStyle = won ? A.IVORY : A.ROSE;
          g.fillText(sc, cx + cw - 22 - tw, ry + rh / 2 + s * 0.36);
          tail = tw + 24;
        }
        const size = stFit(g, nm || "TBD", cw - (tx - cx) - 22 - tail,
                           Math.round(rh * 0.5), 900);
        g.font = `italic 900 ${size}px Archivo, sans-serif`;
        g.fillStyle = nm ? (won ? A.IVORY : A.ROSE) : "rgba(247,241,230,.35)";
        g.fillText(nm || "TBD", tx, ry + rh / 2 + size * 0.34);
      });
      cy += rowH + RGAP;
    });
    cy += SGAP - RGAP;
    if (ci < cols.length - 1) {
      const mx = x + w / 2, my = cy - SGAP / 2 - 2, s = 13;
      g.strokeStyle = "rgba(247,241,230,.45)"; g.lineWidth = 3;
      g.beginPath();
      g.moveTo(mx - s, my - s / 2); g.lineTo(mx, my + s / 2); g.lineTo(mx + s, my - s / 2);
      g.stroke();
    }
  });

  // ── champions, on the ivory plate ──
  // Drawn only when the final has been WON. An undecided final renders both
  // names on equal footing with no scores, which reads correctly as "this is
  // about to happen"; a card announcing an empty winner is worse than one
  // that stops at the semis.
  if (champ) {
    const by = top + rowsH + CGAP, bh = CH;
    g.save();
    ngPill(g, x, by, w, bh, 34);
    g.fillStyle = A.IVORY; g.fill();
    g.clip();
    const b = LU_BAND_IMG, th2 = 14;
    g.fillStyle = A.DEEP; g.fillRect(x, by, w, th2);
    if (b) {
      const tw = Math.round(th2 * b.width / b.height);
      for (let px = x; px < x + w; px += tw) g.drawImage(b, px, by, tw, th2);
    }
    g.restore();

    stMono(g, "CHAMPIONS", x + 30, by + 62, 20, A.FLAG, 5);

    const cp = fin ? (fin.aWon ? fin.aPics : fin.bPics) : null;
    let right = x + w - 30;
    if (cp && cp.length) {
      const fr = 50;
      // Left to right, matching the order of the two names beside them.
      cp.slice(0, 2).forEach((q, j) => {
        gcFace(g, q, x + w - 36 - fr - (1 - j) * fr * 1.6, by + bh / 2 + 14, fr, faces);
      });
      right = x + w - 36 - fr * 2.6 - fr - 20;
    }
    const size = stFit(g, champ, right - (x + 30), 68, 900);
    g.font = `italic 900 ${size}px Archivo, sans-serif`;
    g.fillStyle = A.INK;
    g.fillText(champ, x + 30, by + bh - 38);
  }
}

// ── the card ──────────────────────────────────────────────────────────────
function ngPaint(g, kind, d, logo, faces) {
  const A = NC;
  const L = NG.L, R = LU_W - NC.PAD - 28, W = R - L;
  g.textBaseline = "alphabetic";
  NG_BLOCKS = [];

  // the ground, and the khanjar over it
  g.fillStyle = A.BG; g.fillRect(0, 0, LU_W, LU_H);
  if (LU_TILE_IMG) {
    g.save(); g.globalAlpha = 0.14;
    const t = 300;
    for (let y = 0; y < LU_H; y += t) for (let x = 0; x < LU_W; x += t)
      g.drawImage(LU_TILE_IMG, x, y, t, t);
    g.restore();
  }

  // the frame
  ncBand(g, 72);
  ncBand(g, LU_H - 72 - NC.BAND);

  // the header row: the series in mono, the Arabic opposite
  stMono(g, SERIES_NAME, L, 206, 25, A.IVORY, 5);
  {
    g.font = `700 30px "Noto Kufi Arabic", sans-serif`;
    g.fillStyle = A.IVORY;
    g.fillText(SERIES_NAME_AR, R - g.measureText(SERIES_NAME_AR).width, 212);
  }

  // the landmark medallion, beside the headline. On the line-up card it
  // straddles the arch's apex; there is no arch on a list card, so it sits
  // where the headline ends and holds the right edge of the block.
  const mcx = R - NG.MED, mcy = (NG.H1 + NG.H2) / 2 - 26;
  {
    const lm = ngLandmark(d);
    g.fillStyle = A.DEEP;
    g.beginPath(); g.arc(mcx, mcy, NG.MED, 0, Math.PI * 2); g.fill();
    g.strokeStyle = A.IVORY; g.lineWidth = 5;
    g.beginPath(); g.arc(mcx, mcy, NG.MED, 0, Math.PI * 2); g.stroke();
    g.strokeStyle = A.GREEN; g.lineWidth = 4;
    g.beginPath(); g.arc(mcx, mcy, NG.MED + 8, 0, Math.PI * 2); g.stroke();
    const art = lm && ncArt(lm.asset);
    if (art && art.complete && art.naturalWidth) {
      const s = NG.MED * 1.16;
      const r = Math.min(s / art.naturalWidth, s / art.naturalHeight);
      g.drawImage(art, mcx - art.naturalWidth * r / 2,
                  mcy - art.naturalHeight * r / 2 + 3,
                  art.naturalWidth * r, art.naturalHeight * r);
    }
  }

  stMono(g, (d.eyebrow || "").toUpperCase(), L, NG.EYE, 24, A.ROSE, 5);
  const big = kind === "draw"   ? ["THE", "DRAW"]
            : kind === "tables" ? ["GROUP", "TABLES"]
            :                     ["THE", "BRACKET"];
  // The headline stops short of the medallion, which is why it is measured
  // against a narrower box than the body uses.
  const HW = W - NG.MED * 2 - 46;
  stDisp(g, big[0], L, NG.H1, NG.DISP, A.IVORY, HW);
  stDisp(g, big[1], L, NG.H2, NG.DISP, A.IVORY, HW);

  // the key, on the one card that needs one. Green means "through" here and
  // means nothing on the draw, so it is stated only where it carries meaning.
  let TOP = NG.TOP;
  if (d.keys && d.keys.length) {
    let kx = L;
    d.keys.forEach(([col, label]) => {
      g.fillStyle = col;
      ngPill(g, kx, 500, 22, 22, 6); g.fill();
      kx += 32;
      const s = 19;
      g.font = `700 ${s}px "JetBrains Mono", monospace`;
      const tw = g.measureText(label).width + 3 * (label.length - 1);
      stMono(g, label, kx, 518, s, A.IVORY, 3);
      kx += tw + 34;
    });
    TOP = NG.TOP + 36;
  }

  // ── body ──
  const BOT = NG.BOT;
  if (kind === "bracket") {
    ngBracket(g, d, L, TOP, W, BOT - TOP, faces || new Map());
  } else {
    const groups = d.groups || [];
    const n = Math.max(1, groups.length);
    const gap = 18;
    const bh = (BOT - TOP - gap * (n - 1)) / n;
    groups.forEach((gr, i) => ngGroup(g, gr, L, TOP + i * (bh + gap), W, bh));
  }

  // ── the foot ──
  // Everything here clears the bottom band, which starts at LU_H-72-BAND.
  // A decorative strip is invisible to every text check there is, so the one
  // thing that can go wrong here is drawing straight through the weave.
  if (logo) {
    const h = 74, w = logo.width * (h / logo.height);
    const off = document.createElement("canvas");
    off.width = Math.ceil(w); off.height = h;
    const o = off.getContext("2d");
    o.drawImage(logo, 0, 0, w, h);
    o.globalCompositeOperation = "source-in";
    o.fillStyle = A.IVORY; o.fillRect(0, 0, w, h);
    g.drawImage(off, L, BOT + 24);
  }
  {
    const t = `${VOLUME_LABEL} \u00B7 ${SEASON_MONTH_SHORT} ${SEASON_YEAR}`;
    g.font = '700 26px "JetBrains Mono", monospace';
    const w = g.measureText(t).width + 7 * (t.length - 1);
    stMono(g, t, R - w, BOT + 60, 26, A.IVORY, 7);
    const host = d.foot || "";
    if (host) {
      const s = 22;
      g.font = `700 ${s}px "JetBrains Mono", monospace`;
      const hw = g.measureText(host).width + 5 * (host.length - 1);
      stMono(g, host, R - hw, BOT + 100, s, A.ROSE, 5);
    }
  }
}

// ── THE NIGHT'S OWN SCREENS (Vol.9) ──────────────────────────────────────────

// MON 2 NOV, NOT 11/2/2026. The night header built its date with
// `new Date(<plain date>).toLocaleDateString()`, which is ambiguous to every
// reader outside the US and is also the construction this repo has a standing
// rule against: the string parses as UTC midnight and the server runs at
// UTC+4, so the day shown can be the day before the day stored. The parts are
// read out of the string, and the weekday is taken with the UTC getters off a
// UTC-built date, so neither half can drift.
function naNightWhen(d) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d || "");
  if (!m) return (d || "").toUpperCase();
  const DOW = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
  const dt = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
  return DOW[dt.getUTCDay()] + " " + fmtNightDate(d);
}

// What is happening RIGHT NOW, read off the fixtures the same way the wall
// reads them: a match with a record and no winner is ON COURT (the scorer has
// opened it), a match with no record at all is NEXT. Nothing here is stored,
// so it cannot drift from the scores.
function naNightPulse(session) {
  const groups = getSessionGroups(session);
  const teams = session.teams || [];
  const nameOfTeam = (id) => {
    const t = teams.find(x => x.id === id);
    return t || null;
  };
  const ms = session.groupMatches || [];
  const played = ms.filter(m => m.winner).length;
  // The fixture list is what the draw owes, not what has been entered: a
  // night with nothing scored must still report how many matches it is.
  const total = ms.length;
  const live = ms.filter(m => !m.winner && m.score
    && (m.score.t1 !== null || m.score.t2 !== null));
  const next = ms.filter(m => !m.winner && !(m.score
    && (m.score.t1 !== null || m.score.t2 !== null)));
  const bracket = session.bracket || {};
  const koAll = (bracket.qf || []).concat(bracket.sf || [],
                                          bracket.final ? [bracket.final] : []);
  const koPlayed = koAll.filter(m => m && m.winner).length;
  const koDrawn = koAll.length > 0;
  const groupsDone = total > 0 && played === total;
  return { groups, played, total, live, next, koAll, koPlayed, koDrawn,
           groupsDone, teams };
}

// THE STRIP AT THE TOP OF THE NIGHT. One line of state and then whatever is
// on court, which is the only thing on this screen that changes while you are
// looking at it.
function NaNightPulse({ session, state }) {
  const p = naNightPulse(session);
  const first = (id) => {
    const pl = (state.players || []).find(x => x.id === id);
    return pl ? pl.name.split(" ")[0] : "?";
  };
  const lbl = (tid) => {
    const t = (session.teams || []).find(x => x.id === tid);
    return t ? first(t.p1Id) + " & " + first(t.p2Id) : "?";
  };
  if (!p.total && !p.koDrawn) return null;
  const pct = p.total ? Math.round((p.played / p.total) * 100) : 0;
  const stage = p.groupsDone
    ? (p.koDrawn
        ? (p.koPlayed === p.koAll.length ? "FINISHED" : "KNOCKOUT")
        : "GROUPS DONE")
    : "GROUP STAGE";

  // THE FIXTURE GETS THE FULL WIDTH, ON ITS OWN LINE. On one row with the
  // badge and the score it had about 200px of a 390px phone, and
  // "Muntaser & Mohammed v Hisham & Jalal" came out as
  // "Muntaser & Mohammed v ..." — the half of the fixture that is cut is the
  // opponent, which is the half somebody standing by the court is reading it
  // for. Badge and score on top, the two teams underneath.
  const Row = ({ m, kind }) => (
    <div style={{ padding: "10px 0 9px",
      borderTop: "1px solid rgba(242,208,211,.16)" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
        <span style={{ fontFamily: "'JetBrains Mono',monospace", fontWeight: 700,
          fontSize: 9, letterSpacing: ".18em", padding: "3px 8px", borderRadius: 28,
          whiteSpace: "nowrap", flex: "0 0 auto",
          background: kind === "live" ? "#F7F1E6" : "rgba(247,241,230,.14)",
          color: kind === "live" ? "#B8141F" : "#F2D0D3" }}>
          {kind === "live" ? "ON COURT" : "NEXT"}
        </span>
        <span style={{ flex: 1 }} />
        {kind === "live" && m.score && (
          <span style={{ fontFamily: "'JetBrains Mono',monospace", fontWeight: 700,
            fontSize: 15, color: "#F7F1E6", flex: "0 0 auto" }}>
            {m.score.t1 === null ? "-" : m.score.t1}&#8201;/&#8201;{m.score.t2 === null ? "-" : m.score.t2}
          </span>
        )}
      </div>
      <div style={{ marginTop: 5, fontSize: 13.5, lineHeight: 1.35, color: "#F7F1E6" }}>
        {lbl(m.team1Id)} <span style={{ color: "#F2D0D3" }}>v</span> {lbl(m.team2Id)}
      </div>
    </div>
  );

  return (
    <div className="na-pulse" style={{ padding: "14px 16px 12px", marginBottom: 12 }}>
      <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between",
        gap: 14, flexWrap: "wrap" }}>
        <span style={{ fontFamily: "'JetBrains Mono',monospace", fontWeight: 700,
          fontSize: 10, letterSpacing: ".24em", color: "#F7F1E6" }}>{stage}</span>
        <span style={{ fontFamily: "'JetBrains Mono',monospace", fontWeight: 700,
          fontSize: 11, color: "#F2D0D3" }}>
          {p.played}&#8201;/&#8201;{p.total} MATCHES
          {p.koDrawn ? "  \u00B7  KO " + p.koPlayed + "/" + p.koAll.length : ""}
        </span>
      </div>
      {/* THE BAR IS A BAR, NOT A PILL. A 999px radius on a 6px rule is the
           same fault as a radius on a hairline, and the track would read as
           a lozenge rather than as a measure. */}
      <div style={{ height: 6, marginTop: 10, background: "rgba(247,241,230,.16)",
        borderRadius: 28, overflow: "hidden" }}>
        <div style={{ height: "100%", width: pct + "%", borderRadius: 28,
          background: p.groupsDone ? "#087A3F" : "#F7F1E6" }} />
      </div>
      <div style={{ marginTop: 6 }}>
        {p.live.slice(0, 3).map(m => <Row key={m.id} m={m} kind="live" />)}
        {p.live.length === 0 && p.next.slice(0, 2).map(m => <Row key={m.id} m={m} kind="next" />)}
        {p.live.length === 0 && p.next.length === 0 && p.groupsDone && !p.koDrawn && (
          <div style={{ paddingTop: 10, borderTop: "1px solid rgba(242,208,211,.16)",
            fontSize: 13, color: "#F2D0D3" }}>
            Every group match is in. The knockout has not been drawn yet.
          </div>
        )}
      </div>
    </div>
  );
}

// ── THE NIGHT LEADERBOARD ────────────────────────────────────────────────────
// What every player took home from THIS night, which is the question asked in
// the car park and which no screen in the app could answer.
//
// IT IS THE APP'S OWN RECEIPT, not a second scorer. `calcPlayerNights` walks
// the same path `calcPlayerStats` walks and checks its own total against it;
// this reads the one night out of that and sorts on it, so a row here cannot
// claim a figure the player's own card contradicts.
//
// AND IT SAYS WHAT IT IS COUNTING. The streak bonus is a fact about a RUN of
// nights, not about this one, so it is not in `nightTotal` and is not implied
// here — the same discipline as never multiplying out what a 2X night is
// worth. The line under the heading says so in words.
function NaNightPoints({ session, state, sessions, onPick }) {
  const idx = sessions.findIndex(s => s.id === session.id);
  const nameOf = (s, _t, pid) => {
    const p = (state.players || []).find(x => x.id === pid);
    return p ? p.name : "?";
  };
  const rows = React.useMemo(() => {
    if (idx < 0) return [];
    const upto = sessions.slice(0, idx + 1);
    const out = [];
    (session.teams || []).forEach(t => {
      [t.p1Id, t.p2Id].forEach(pid => {
        const pl = (state.players || []).find(x => x.id === pid);
        if (!pl) return;
        const r = calcPlayerNights(pid, upto, nameOf);
        const n = r.nights.find(x => x.id === session.id);
        if (!n) return;
        out.push({ player: pl, team: t, n, ok: r.ok });
      });
    });
    return out.sort((a, b) => (b.n.nightTotal - a.n.nightTotal)
      || a.player.name.localeCompare(b.player.name));
  }, [session, sessions, state.players, idx]);

  if (!rows.length) return (
    <div className="sg-card" style={{ padding: 20, textAlign: "center",
      fontSize: 13, color: "#F2D0D3" }}>
      Nobody has scored on this night yet. The table fills in as results are locked.
    </div>
  );

  // A DEAD HEAT IS A DEAD HEAT. Equal points share a position, and the next
  // one skips — ranking two identical rows 1 and 2 invents a winner the
  // scoring never named.
  let lastPts = null, lastPos = 0;
  const disagree = rows.some(r => !r.ok);

  return (
    <div className="space-y-3">
      <div className="sg-card" style={{ padding: "14px 16px" }}>
        <div style={{ fontFamily: "'Archivo',sans-serif", fontStyle: "italic",
          fontVariationSettings: "'wdth' 125,'wght' 900", fontSize: 26,
          color: "#F7F1E6", lineHeight: 1.05 }}>TONIGHT&#8217;S POINTS</div>
        <div style={{ marginTop: 6, fontSize: 12, color: "#F2D0D3", lineHeight: 1.45 }}>
          What each player earned on this night. The attendance streak bonus is
          counted across the season, not on one night, so it is not in here.
        </div>
      </div>
      {disagree && (
        <div style={{ padding: "10px 14px", background: "#F7F1E6", color: "#B8141F",
          fontSize: 12, fontWeight: 700 }}>
          A receipt disagrees with the series table. Do not trust this screen
          until it is looked at.
        </div>
      )}
      <div className="sg-card" style={{ padding: "6px 14px 10px" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10,
          padding: "10px 0 8px", fontFamily: "'JetBrains Mono',monospace",
          fontWeight: 700, fontSize: 9, letterSpacing: ".2em", color: "#F2D0D3" }}>
          <span style={{ flex: "0 0 26px" }}>#</span>
          <span style={{ flex: 1 }}>PLAYER</span>
          <span style={{ flex: "0 0 52px", textAlign: "right" }}>PTS</span>
        </div>
        {rows.map((r, i) => {
          const pos = r.n.nightTotal === lastPts ? lastPos : i + 1;
          lastPts = r.n.nightTotal; lastPos = pos;
          const champ = r.n.outcome === "Session champion";
          return (
            <button key={r.player.id} onClick={() => onPick && onPick(r.player)}
              style={{ width: "100%", display: "flex", alignItems: "center", gap: 10,
                minHeight: 44, padding: "9px 0", textAlign: "left", cursor: "pointer",
                background: "transparent", border: 0,
                borderTop: "1px solid rgba(242,208,211,.16)", color: "inherit" }}>
              <span style={{ flex: "0 0 26px", fontFamily: "'JetBrains Mono',monospace",
                fontWeight: 700, fontSize: 13,
                color: pos <= 3 ? "#F7F1E6" : "#F2D0D3" }}>{pos}</span>
              <Avatar player={r.player} size={30} />
              <span style={{ flex: 1, minWidth: 0 }}>
                <span style={{ display: "block", fontSize: 14, color: "#F7F1E6",
                  overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                  {r.player.name}
                </span>
                <span style={{ display: "block", marginTop: 2, fontSize: 11,
                  color: champ ? "#F7F1E6" : "#F2D0D3",
                  overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                  {r.n.outcome}{r.n.x2 ? " \u00B7 2X" : ""}
                </span>
              </span>
              <span style={{ flex: "0 0 52px", textAlign: "right",
                fontFamily: "'Archivo',sans-serif", fontStyle: "italic",
                fontVariationSettings: "'wdth' 125,'wght' 900", fontSize: 22,
                color: "#F7F1E6" }}>{r.n.nightTotal}</span>
            </button>
          );
        })}
      </div>
    </div>
  );
}

function SessionsView({ state, update, setOpenSessionId, isAdmin, leaderboard, setTab, meId }) {
  // A finished night's row used to open the live session screen, which is the
  // scorer's view of a night nobody is scoring any more. It opens the recap
  // instead; the session screen is still one tap away from inside it.
  const [recapSession, setRecapSession] = React.useState(null);
  const [show, setShow] = useState(false);
  const [showDraft, setShowDraft] = useState(false);
  const [showAnnounce, setShowAnnounce] = useState(false);
  const [showFormat, setShowFormat] = useState(false);
  return (
    <div className="space-y-4" style={{animation:"sgSlide 200ms var(--ease-out) both"}}>

// ── H2H Rivals ────────────────────────────────────────────────
function calcRivals(pid, sessions) {
  const map = {};
  sessions.forEach(s => {
    const myTeam = getPlayerTeam(s, pid); if (!myTeam) return;
    const matches = [...(s.groupMatches || []),
      ...(s.bracket?.qf || []),
      ...(s.bracket?.sf || []),
      s.bracket?.final
    ].filter(Boolean);
    matches.forEach(m => {
      if (!m.winner) return;
      const isTeam1 = m.team1Id === myTeam.id;
      const isTeam2 = m.team2Id === myTeam.id;
      if (!isTeam1 && !isTeam2) return;
      const oppTeamId = isTeam1 ? m.team2Id : m.team1Id;
      const oppTeam = (s.teams || []).find(t => t.id === oppTeamId); if (!oppTeam) return;
      const opponents = [oppTeam.p1Id, oppTeam.p2Id].filter(Boolean);
      const won = teamWon(m, myTeam.id);
      opponents.forEach(oid => {
        if (!map[oid]) map[oid] = { wins: 0, losses: 0 };
        if (won) map[oid].wins++; else map[oid].losses++;
      });
    });
  });
  return Object.entries(map)
    .map(([id, r]) => ({ id, ...r, total: r.wins + r.losses }))
    .filter(r => r.total >= 1)
    .sort((a, b) => b.total - a.total)
    .slice(0, 5);
}

function generateReminderText(session, state, leaderboard) {
  const slots = session.signupSlots || Array(16).fill("");
  const waitlist = session.signupWaitlist || Array(3).fill("");
  const dateStr = session.date
    ? new Date(session.date + "T12:00:00").toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" })
    : "";
  const seriesName = state.seasonName || "56 NATIONAL SERIES";
  const vol = state.seasonSubtitle?.match(/VOL\.\s*\d+/i)?.[0] || "Vol. 9";
  const sessionsTotal = (state.sessions || []).length;
  const sessionsLeft = Math.max(0, SESSIONS_TOTAL - sessionsTotal);
  const top5 = [...(leaderboard || [])].filter(e => e.stats.groupPlayed > 0 || e.stats.qfReached > 0).slice(0, 5);
  const rankEmoji = ["🥇","🥈","🥉","4️⃣","5️⃣"];

  let text = `🔥 *${seriesName} · ${session.name}* 🔥\n`;
  text += `_Urban Social Series · ${vol}_\n\n`;
  if (session.doublePoints) {
    text += `*⚡ DOUBLE POINTS ⚡ DOUBLE POINTS ⚡ DOUBLE POINTS*\n\n`;
  }
  text += `📍 Urban Playground\n`;
  if (dateStr) text += `🗓️ ${dateStr} · 5:30 PM\n`;
  text += `💸 7 OMR\n\n`;
  text += `🏆 Win = 14 OMR voucher per player\n`;
  if (session.doublePoints) {
    text += `🔥🔥 *EVERY POINT COUNTS TWICE — leaderboard about to FLIP* 🔥🔥\n`;
  }
  if (sessionsLeft > 0) text += `📊 ${sessionsLeft} session${sessionsLeft !== 1 ? "s" : ""} left · this is where champions are made\n`;
  if (top5.length > 0) {
    text += `\n*📈 Current Standings:*\n`;
    top5.forEach((e, i) => { text += `${rankEmoji[i]} ${e.player.name} — ${e.totalPts} pts\n`; });
  }
  // The four other generated posts all carry the link; the signup post was the
  // only one without it, and it is the post players actually act on. Sits under
  // the standings because that is the tease the link pays off.
  text += `\n🎾 Full table & your own rank: https://national.urbanpadel.om\n`;
  text += `\nDrop name + partner below 👇\n\n`;
  slots.forEach((s, i) => { text += `${i + 1}- ${s}\n`; });
  text += `\n⏳ Waitlist\n`;
  waitlist.forEach((s, i) => { text += `${i + 1}- ${s}\n`; });
  text += `\n⚠️ *16 teams max* · first come, first served\n`;
  text += `💥 *One flag. One court.* 👑`;
  return text;
}

function generateSessionShareText(session, state, leaderboard) {
  const pName = (id) => state.players.find(p => p.id === id)?.name?.split(" ")[0] || "?";
  const tLabel = (t) => t ? `${pName(t.p1Id)} & ${pName(t.p2Id)}` : "TBD";
  const winner = session.bracket?.final?.winner
    ? (session.bracket.final.winner === "team1" ? session.teams?.find(t => t.id === session.bracket.final.team1Id) : session.teams?.find(t => t.id === session.bracket.final.team2Id))
    : null;
  const finalist = session.bracket?.final?.winner
    ? (session.bracket.final.winner === "team1" ? session.teams?.find(t => t.id === session.bracket.final.team2Id) : session.teams?.find(t => t.id === session.bracket.final.team1Id))
    : null;

  // Top scorers this session
  const sessionScores = (state.players || []).map(p => {
    const team = getPlayerTeam(session, p.id); if (!team) return null;
    const mult = session.doublePoints ? 2 : 1;
    let pts = 0;
    (session.groupMatches || []).forEach(m => {
      if ((m.team1Id !== team.id && m.team2Id !== team.id) || !m.winner) return;
      if (teamWon(m, team.id)) pts += 3 * mult;
      else { const t = m.lossType || "tiebreak"; pts += (t === "tiebreak" ? 2 : t === "competitive" ? 1 : 0) * mult; }
    });
    if (getTopOfGroup(session, team.group) === team.id) pts += 1 * mult;
    const qfM = (session.bracket?.qf || []).find(m => (m.team1Id === team.id || m.team2Id === team.id) && m.winner);
    if (qfM) pts += (1 + koMatchPts(qfM, team.id)) * mult;
    const sfM = (session.bracket?.sf || []).find(m => (m.team1Id === team.id || m.team2Id === team.id) && m.winner);
    if (sfM) pts += (2 + koMatchPts(sfM, team.id)) * mult;
    const f = session.bracket?.final;
    if (f && (f.team1Id === team.id || f.team2Id === team.id) && f.winner)
      pts += (3 + koMatchPts(f, team.id) + (teamWon(f, team.id) ? 5 : 0)) * mult;
    return { name: p.name, pts };
  }).filter(Boolean).sort((a, b) => b.pts - a.pts);

  const seriesLeader = [...leaderboard].sort((a, b) => b.totalPts - a.totalPts)[0];
  const dateStr = session.date ? new Date(session.date + "T12:00:00").toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" }) : "";

  let text = `🔥 *56 NATIONAL SERIES Vol.9 — ${session.name}*`;
  if (dateStr) text += ` (${dateStr})`;
  text += `\n`;
  if (session.doublePoints) text += `⚡ *DOUBLE POINTS NIGHT*\n`;
  text += `\n`;
  if (winner) {
    text += `🏆 *Champions:* ${tLabel(winner)}\n`;
    if (finalist) text += `🥈 *Finalists:* ${tLabel(finalist)}\n`;
    text += `\n`;
  }
  if (sessionScores.length > 0) {
    text += `📊 *Top Scorers Tonight:*\n`;
    sessionScores.slice(0, 5).forEach((e, i) => { text += `${["🥇","🥈","🥉","4️⃣","5️⃣"][i]} ${e.name} — ${e.pts} pts\n`; });
    text += `\n`;
  }
  if (seriesLeader) {
    text += `📈 *Series Leader:* ${seriesLeader.player.name} (${seriesLeader.totalPts} pts)\n`;
  }
  text += `\n🎾 https://national.urbanpadel.om`;
  return text;
}

function PartnerDrawModal({ onClose, state, session, onAddTeams }) {
  const inSession = new Set((session.teams || []).flatMap(t => [t.p1Id, t.p2Id]));
  const available = (state.players || []).filter(p => !inSession.has(p.id));
  const [selected, setSelected] = useState([]);
  const toggle = (id) => setSelected(s => s.includes(id) ? s.filter(x => x !== id) : [...s, id]);
  const toggleAll = () => setSelected(selected.length === available.length ? [] : available.map(p => p.id));

  const draw = () => {
    const pool = [...selected].sort(() => Math.random() - 0.5);
    if (pool.length < 2) return;
    const groups = getSessionGroups(session);
    const teams = [];
    for (let i = 0; i + 1 < pool.length; i += 2) {
      teams.push({ id: uid("t"), name: "", p1Id: pool[i], p2Id: pool[i + 1], group: groups[Math.floor(i / 2) % groups.length] });
    }
    onAddTeams(teams);
    onClose();
  };

  return <Modal open={true} onClose={onClose} title="PARTNER DRAW">
    <div className="space-y-3">
      <div className="text-xs text-stone-400">Select players entering the draw — pairs will be random. Odd player out is skipped.</div>
      <div className="flex items-center justify-between">
        <div className="text-xs text-stone-500">{selected.length} selected</div>
        <button onClick={toggleAll} className="text-xs text-orange-400 font-semibold">{selected.length === available.length ? "Clear all" : "Select all"}</button>
      </div>
      <div className="max-h-64 overflow-y-auto space-y-1">
        {available.length === 0
          ? <div className="text-xs text-stone-500 text-center py-4">All players already in session</div>
          : available.map(p => (
            <button key={p.id} onClick={() => toggle(p.id)}
              className={`w-full text-left px-3 py-2 rounded-lg text-sm font-semibold transition-all ${selected.includes(p.id) ? "bg-orange-500/20 text-orange-300 border border-orange-500/40" : "bg-stone-900 text-stone-300 border border-transparent"}`}>
              {p.name}
            </button>
          ))}
      </div>
      {selected.length % 2 !== 0 && selected.length > 0 && <div className="text-[11px] text-cyan-300">Odd number — one player will be left out of draw</div>}
      <div className="flex gap-2 pt-1">
        <Btn variant="ghost" onClick={onClose}>Cancel</Btn>
        <Btn className="flex-1" onClick={draw} disabled={selected.length < 2}>Draw {Math.floor(selected.length / 2)} Pairs</Btn>
      </div>
    </div>
  </Modal>;
}

  const groupCards = useMemo(
    () => buildGroupCards(session, state, (state.sessions || []).findIndex(s => s.id === session.id)),
    [session, state]);
  // Derived, not stored: the draw is the source of truth for who is playing.
  const lineups = buildLineups(session, state,
    14 * 2 * SESSIONS_TOTAL + SEASON_PRIZES.reduce((a, b) => a + b, 0));
  const [showRemind, setShowRemind] = useState(false);

  const mvpPlayer = state.players.find(p => p.id === session.mvpId);
  const sessionPhotos = session.photos || [];

  // ── When the final is scored, close the night ──
  // Three guards, each earning its place:
  //   canScore   — every phone in the club has this session open. Without it
  //                they would all race to write the same change.
  //   autoClosed — a latch, so an admin who deliberately re-opens a finished
  //                session is not overruled a second later by this effect.
  //   the vote   — crowning is only done from what the vote actually decided.
  //                No votes means no MVP and voting is left OPEN, because on
  //                most nights the voting starts after the final is played;
  //                closing it here would end a vote before it began. A tie at
  //                the top is left to a human rather than settled by whichever
  //                key happened to come first.
  const finalWinner = (session.bracket && session.bracket.final && session.bracket.final.winner) || null;
  useEffect(() => {
    if (!canScore || !finalWinner || session.autoClosed) return;
    updateSession(s => {
      const next = { ...s, completed: true, autoClosed: true };
      const tally = Object.entries(s.mvpVotes || {}).sort((a, b) => b[1] - a[1]);

              if (!getToken()) { alert("Please log in first — photos can't be saved without signing in."); return; }
              setUploadingPhoto(true);
              try {
                // Process each photo independently so one bad file can't sink the batch.
                const settled = await Promise.allSettled(
                  files.map(async f => uploadFramedPhotoToCloud(await watermarkPhotoToBase64(f)))
                );
                const urls = settled.filter(r => r.status === "fulfilled" && r.value).map(r => r.value);
                const failed = files.length - urls.length;
                if (urls.length) {
                  const newPhotos = [...(session.photos || []), ...urls];
                  updateSession(s => ({ ...s, photos: newPhotos }));
                  await uploadSessionPhotosToServer(session.id, newPhotos);
                }
                if (failed > 0) {
                  const msg = settled.find(r => r.status === "rejected")?.reason?.message;
                  alert(`${failed} photo${failed > 1 ? "s" : ""} couldn't be added${msg ? ": " + msg : ""}.` +
                        (urls.length ? ` ${urls.length} added.` : " Try a JPEG, or check you're still logged in."));
                }
              } catch (err) {
                alert("Couldn't add photos: " + (err?.message || err));
              } finally {
                setUploadingPhoto(false);
              }
            }} />
          </label>}
          {sessionPhotos.length === 0
            ? <div className="text-center text-stone-500 py-12">{isAdmin ? "No photos yet — tap to add some from tonight" : "No photos yet"}</div>
            : <div className="grid grid-cols-2 gap-2 aa-wall">

                    {isAdmin && <button onClick={() => { const newPhotos = (session.photos||[]).filter((_,j)=>j!==i); updateSession(s => ({ ...s, photos: newPhotos })); uploadSessionPhotosToServer(session.id, newPhotos); }}
                      className="absolute top-1 right-1 w-6 h-6 rounded-full bg-black/70 text-white text-xs flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">✕</button>}
                  </div>
                ))}
              </div>
          }
        </div>}
      </div>
      <GroupCardSheet open={showGroupCards} items={groupCards}
                      onClose={() => setShowGroupCards(false)} />
      <LineupSheet open={showLineup} items={lineups} photos={sessionPhotos}
                   session={session} updateSession={updateSession} state={state}

                   onClose={() => setShowLineup(false)} />
      {showEdit && <Modal open={true} onClose={() => setShowEdit(false)} title="SESSION OPTIONS">
        <div className="space-y-3">
          <div><label className="text-xs text-stone-400 uppercase tracking-wider font-semibold mb-1 block">Name</label><Input value={session.name} onChange={v => updateSession(s => ({ ...s, name: v }))} /></div>
          <div><label className="text-xs text-stone-400 uppercase tracking-wider font-semibold mb-1 block">Date</label><Input type="date" value={session.date || ""} onChange={v => updateSession(s => ({ ...s, date: v }))} /></div>
          <div className="flex items-center justify-between p-3 bg-stone-900 rounded-lg">
            <span className="text-sm text-stone-200">Mark Complete</span>
            <button onClick={() => updateSession(s => ({ ...s, completed: !s.completed }))} className={`relative w-11 h-6 rounded-full ${session.completed ? "bg-emerald-500" : "bg-stone-700"}`}>
              <div className={`absolute top-0.5 w-5 h-5 rounded-full bg-white transition-transform ${session.completed ? "translate-x-5" : "translate-x-0.5"}`} />
            </button>
          </div>

            <select value={session.mvpId || ""} onChange={e => updateSession(s => ({ ...s, mvpId: e.target.value || null }))}
              className="w-full bg-stone-900 border border-stone-700 rounded-lg px-3 py-2 text-stone-100 text-sm">
              <option value="">— No MVP —</option>
              {(session.teams || []).flatMap(t => [t.p1Id, t.p2Id]).filter(Boolean).filter((v,i,a)=>a.indexOf(v)===i).map(pid => {
