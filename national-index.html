function BracketEditModal({ match, teams, state, session, isAdmin, onClose, onSave, onReset }) {
  const [t1, setT1] = useState(match.team1Id || "");
  const [t2, setT2] = useState(match.team2Id || "");
  const initS1 = match?.score?.t1 ?? (match?.winner ? (match.winner === "team1" ? 6 : 3) : null);
  const initS2 = match?.score?.t2 ?? (match?.winner ? (match.winner === "team2" ? 6 : 3) : null);
  const [s1, setS1] = useState(initS1);
  const [s2, setS2] = useState(initS2);
  const [confirmed, setConfirmed] = useState(false);
  const lbl = (id) => { const t = teams.find(t => t.id === id); if (!t) return "?"; const p1 = state.players.find(p => p.id === t.p1Id)?.name?.split(" ")[0] || "?"; const p2 = state.players.find(p => p.id === t.p2Id)?.name?.split(" ")[0] || "?"; return `${p1} & ${p2}`; };
  const titles = { r16: "ROUND OF 16", qf: "QUARTERFINAL", sf: "SEMIFINAL", final: "FINAL", thirdsPlayoff: "3RDS QUALIFIER" };
  // The seed label is a fact about where a team FINISHED, so it is read back
  // off the group tables rather than carried along with the slot. Left alone
  // it says "B2" beside a team out of group D, which is what the bracket on
  // the server said all through the 26 Oct knockout.
  const seedLabelOf = (tid) => {
    const t = teams.find(x => x.id === tid);
    if (!t || !t.group || !session) return null;
    try {
      const rows = calcGroupStandingsNormalized(session, t.group);
      const i = rows.findIndex(r => r.team && r.team.id === tid);
      return i >= 0 ? t.group + (i + 1) : null;
    } catch (e) { return null; }
  };
  const teamsChanged = (t1 || "") !== (match.team1Id || "") || (t2 || "") !== (match.team2Id || "");
  const hadResult = !!match.winner;
  const maxScore = match.round === "final" ? 9 : 7;
  const derived = (s1 !== null && s2 !== null && s1 !== s2) ? scoreToResult(s1, s2) : null;
  const canConfirm = t1 && t2 && derived;
  const ScoreBtn = ({ onClick, children }) => (
    <button type="button" onClick={onClick} className="w-7 h-7 rounded-md bg-stone-800 border border-stone-700 text-stone-300 text-sm font-bold hover:bg-stone-700 active:scale-95 flex items-center justify-center">{children}</button>
  );
  return <Modal open={true} onClose={onClose} title={`EDIT ${titles[match.round]}`}>
    <div className="space-y-3">
      {isAdmin && <>
        <div className="text-xs text-cyan-300 bg-cyan-400/10 border border-cyan-300/30 rounded-lg p-2 flex gap-2"><I.alert size={14} className="shrink-0 mt-0.5" /><span>Edit teams here for dropouts. May need to reset downstream rounds.</span></div>
        <div><label className="text-xs text-stone-400 uppercase tracking-wider font-semibold mb-1 block">Team 1</label><select value={t1} onChange={e => { setT1(e.target.value); setConfirmed(false); }} className="w-full bg-stone-900 border border-stone-700 rounded-lg px-3 py-2.5 text-stone-100"><option value="">— None —</option>{teams.filter(t => t.id !== t2).map(t => <option key={t.id} value={t.id}>{lbl(t.id)} (Group {t.group})</option>)}</select></div>
        <div><label className="text-xs text-stone-400 uppercase tracking-wider font-semibold mb-1 block">Team 2</label><select value={t2} onChange={e => { setT2(e.target.value); setConfirmed(false); }} className="w-full bg-stone-900 border border-stone-700 rounded-lg px-3 py-2.5 text-stone-100"><option value="">— None —</option>{teams.filter(t => t.id !== t1).map(t => <option key={t.id} value={t.id}>{lbl(t.id)} (Group {t.group})</option>)}</select></div>
      </>}
      {t1 && t2 && <>
        {(() => {
          const ini = tid => { const t = teams.find(x => x.id === tid); if (!t) return "??";
            const f = id => (state.players.find(p => p.id === id)?.name || "?")[0];
            return (f(t.p1Id) || "?") + (f(t.p2Id) || "?"); };
          return <>
            <ScorePanel label={lbl(t1)} initials={ini(t1)} val={s1}
              setVal={n => { setS1(n); setConfirmed(false); }}
              won={derived?.winner === "team1"} lost={derived && derived.winner !== "team1"} max={maxScore} />
            <ScorePanel label={lbl(t2)} initials={ini(t2)} val={s2}
              setVal={n => { setS2(n); setConfirmed(false); }}
              won={derived?.winner === "team2"} lost={derived && derived.winner !== "team2"} max={maxScore} />
            <LossReadout derived={derived} />
            {/* The knockout ladder pays by round, so the preview says which. */}
            <PointsPreview derived={derived}
              winPts={match.round === "final" ? 8 : match.round === "sf" ? 3 : 2} />
          </>;
        })()}
      </>}
      {isAdmin && teamsChanged && t1 && t2 && (
        <div className="space-y-1.5">
          <Btn variant="secondary" className="w-full"
            onClick={() => {
              // No celebrate(), no resultAt: nobody has gone through, the
              // pairing was simply wrong. Any result already on this match
              // belonged to the teams that played it and is cleared with them.
              onSave({ team1Id: t1, team2Id: t2,
                       s1: seedLabelOf(t1) || null, s2: seedLabelOf(t2) || null,
                       winner: null, lossType: null, score: null, resultAt: null });
              onClose();
            }}>
            Save teams only — no score
          </Btn>
          <div className="text-[10px] px-1" style={{ color: hadResult ? "#F2B8BC" : "#F2D0D3" }}>
            {hadResult
              ? "This match already has a result. Changing who is in it clears that score — it belonged to the two teams that played it."
              : "Fixes who is playing whom. The score pad below is for recording the result."}
          </div>
        </div>
      )}
      {isAdmin && match.round === "qf" && <Btn variant="secondary" className="w-full" onClick={() => { onReset(); onClose(); }}>Reset SFs + Final</Btn>}
      <div className="flex gap-2 pt-2">
        {confirmed && <Btn variant="ghost" onClick={() => setConfirmed(false)}>← Edit</Btn>}
        <Btn variant="ghost" onClick={onClose} className={confirmed ? "" : "ml-auto"}>Cancel</Btn>
        <LockButton
          why={s1 === null || s2 === null ? "PICK BOTH SCORES"
             : s1 === s2 ? "SCORES CAN'T BE LEVEL"
             : !canConfirm ? "PICK BOTH TEAMS" : null}
          onLock={() => {
            celebrate(lbl(derived.winner === "team1" ? t1 : t2) + " GO THROUGH");
            onSave({ team1Id: t1 || null, team2Id: t2 || null,
                     s1: seedLabelOf(t1) || match.s1, s2: seedLabelOf(t2) || match.s2,
                     ...derived, resultAt: Date.now() });
            onClose();
          }} />
      </div>
    </div>
  </Modal>;
}

// Lets the admin swap opponents across the QF before any score exists. Only
// available while every QF match is still fully unresolved (no winner) — the
// gate that opens this modal in BracketTab enforces that, so nothing here
// ever touches a recorded score. Matches with a still-unknown side (a thirds
// playoff TBD, an R16 winner) are locked out of this tool since there's
// nothing yet to seed. Swapping happens two rows at a time — a pure exchange
// of "team2" between two matches — so it can never produce a duplicate or
// drop a team, unlike freeform per-slot dropdowns would.
function QFSeedingModal({ qf, lbl, onClose, onSave }) {
  const seedFor = {};
  qf.forEach(m => { if (m.team1Id) seedFor[m.team1Id] = m.s1; if (m.team2Id) seedFor[m.team2Id] = m.s2; });
  const isReal = (id) => id && !String(id).includes("TBD");
  const [rows, setRows] = useState(() => qf.map(m => ({
    id: m.id, slot: m.slot, team1Id: m.team1Id, team2Id: m.team2Id,
    locked: !(isReal(m.team1Id) && isReal(m.team2Id)),
  })));
  const swapWith = (i, j) => setRows(rs => {
    const next = rs.map(r => ({ ...r }));
    const t2 = next[i].team2Id;
    next[i].team2Id = next[j].team2Id;
    next[j].team2Id = t2;
    return next;
  });
  return <Modal open={true} onClose={onClose} title="EDIT QF SEEDING">
    <div className="space-y-3">
      <div className="text-xs text-cyan-300 bg-cyan-400/10 border border-cyan-300/30 rounded-lg p-2 flex gap-2">
        <I.alert size={14} className="shrink-0 mt-0.5" />
        <span>Swap who each seed plays. No score exists yet on any of these matches, so nothing here touches a result.</span>
      </div>
      {rows.map((r, i) => (
        <div key={r.id} className="rounded-lg bg-stone-900/60 border border-stone-800 p-2.5 space-y-1.5">
          <div className="flex items-center gap-2 text-sm">
            <SeedBadge seed={seedFor[r.team1Id]} />
            <span className="flex-1 min-w-0 truncate font-semibold text-stone-200">{lbl(r.team1Id)}</span>
            <span className="text-stone-600 font-mono text-xs shrink-0">vs</span>
            <span className="flex-1 min-w-0 truncate text-right text-stone-200">{lbl(r.team2Id)}</span>
            <SeedBadge seed={seedFor[r.team2Id]} />
          </div>
          {r.locked ? (
            <div className="text-[10px] text-stone-500">One side isn't decided yet — this match can't be re-seeded.</div>
          ) : (
            <select
              value=""
              onChange={e => { const j = Number(e.target.value); if (!Number.isNaN(j)) swapWith(i, j); }}
              className="w-full bg-stone-800 border border-stone-700 rounded-md px-2 py-1.5 text-xs text-stone-300"
            >
              <option value="">Swap opponent with…</option>
              {rows.map((o, j) => j !== i && !o.locked && (
                <option key={o.id} value={j}>Match {o.slot}: {lbl(o.team2Id)}</option>
              ))}
            </select>
          )}
        </div>
      ))}
      <div className="flex gap-2 pt-1">
        <Btn variant="ghost" onClick={onClose} className="ml-auto">Cancel</Btn>
        <Btn onClick={() => onSave(qf.map((m, i) => {
          const r = rows[i];
          return r.locked ? m : { ...m, team2Id: r.team2Id, s2: seedFor[r.team2Id] };
        }))}>Save seeding ✓</Btn>
      </div>
    </div>
  </Modal>;
}

function LeaderboardView({ leaderboard, state, setOpenPlayerId, meId, onOpenPicker }) {
  const [q, setQ] = useState("");
  const [showTail, setShowTail] = useState(false);
  // Four chips, not the canvas's three. ALL-TIME is not a sort — it changes
  // which total is being ranked — but it is the carry-over, and it is not
  // being dropped to save a row.
  const [sort, setSort] = useState("points");
  const sessions = state.sessions || [];
  const hasLifetime = leaderboard.some(e => {
    const p = e.player;
    return (p.prevSeriesPoints || 0) > 0 || Object.values(p.prevSeriesPts || {}).some(v => v > 0);
  });
  const lifetime = sort === "lifetime";
  const ptsOf = (e) => lifetime ? e.lifetimePts : e.totalPts;

  const enrich = (e) => {
    const form = recentForm(e.player.id, sessions);
    const decided = e.stats.groupPlayed + e.stats.qfReached + e.stats.sfReached + e.stats.finalsReached;
    const wins = e.stats.groupWins + e.stats.qfWins + e.stats.sfWins + e.stats.finalsWon;
    return { form, streak: currentStreak(form), decided,
             winRate: decided ? Math.round(wins / decided * 100) : 0 };
  };

  const hasPlayed = (l) => l.stats.groupPlayed > 0 || l.stats.qfReached > 0;
  const active = leaderboard.filter(hasPlayed);
  const base = lifetime ? [...leaderboard].sort((a, b) => b.lifetimePts - a.lifetimePts) : active;
  // Win rate and streak rank the same field, only ordered differently — and
  // both need a floor, or one lucky night tops the table at 100%.
  const list = (() => {
    if (sort === "winrate")
      return [...base].map(e => ({ e, en: enrich(e) }))
        .filter(x => x.en.decided >= 5)
        .sort((a, b) => b.en.winRate - a.en.winRate || b.e.totalPts - a.e.totalPts)
        .map(x => x.e);
    if (sort === "streak")
      return [...base].map(e => ({ e, en: enrich(e) }))
        .filter(x => x.en.streak > 0)
        .sort((a, b) => b.en.streak - a.en.streak || b.e.totalPts - a.e.totalPts)
        .map(x => x.e);
    return base;
  })();

  // Movement, season view only — an all-time table has no "since last week".
  const prevRank = useMemo(() => {
    if (lifetime || sessions.length < 2) return null;
    const prev = sessions.slice(0, -1);
    const board = state.players
      .map(p => ({ id: p.id, s: calcPlayerStats(p.id, prev) }))
      .filter(e => e.s.stats.groupPlayed > 0 || e.s.stats.qfReached > 0)
      .sort((a, b) => b.s.totalPts - a.s.totalPts);
    const m = {}; board.forEach((e, i) => { m[e.id] = i; });
    return m;
  }, [state.players, sessions, lifetime]);
  const moveOf = (e, i) => {
    if (!prevRank || !(e.player.id in prevRank)) return null;
    const d = prevRank[e.player.id] - i;
    return d === 0 ? null : { up: d > 0, n: Math.abs(d) };
  };

  const indexed = list.map((e, i) => ({ e, i }));
  const TAIL_MAX = 3;
  const rest = indexed.slice(1);
  const restMain = rest.filter(({ e }) => ptsOf(e) > TAIL_MAX);
  const restTail = rest.filter(({ e }) => ptsOf(e) <= TAIL_MAX);
  const found = q ? indexed.filter(({ e }) => e.player.name.toLowerCase().includes(q.toLowerCase())) : [];
  const leader = list[0];
  const topPts = leader ? Math.max(1, ptsOf(leader)) : 1;
  const streakLabel = (en) => en.streak > 0 ? `W${en.streak}` : "–";

  const CHIPS = [["points","Points"],["winrate","Win rate"],["streak","Streak"]]
    .concat(hasLifetime ? [["lifetime","All-time"]] : []);

  const Row = ({ e, i }) => {
    const en = enrich(e), mv = moveOf(e, i);
    return (
      <React.Fragment>
        <div onClick={() => setOpenPlayerId(e.player.id)} className="sg-thin"
             style={{cursor:"pointer",display:"flex",alignItems:"center",gap:4,borderTop:"1px solid rgba(242,208,211,.16)"}}>
          <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:13,color:"#F7F1E6"}}>{i + 1}</span>
          {mv && <span style={{fontSize:9,color:mv.up ? "#F7F1E6" : "#F2B8BC"}}>{mv.up ? "▲" : "▼"}</span>}
        </div>
        <div onClick={() => setOpenPlayerId(e.player.id)}
             style={{cursor:"pointer",padding:"9px 0",borderTop:"1px solid rgba(242,208,211,.16)",minWidth:0,
                     display:"flex",alignItems:"center",gap:9}}>
          <Avatar player={e.player} size={28} />
          <div style={{flex:1,minWidth:0}}>
          <div style={{fontFamily:"'Archivo',sans-serif",fontWeight:800,fontSize:15,color:"#FFFFFF",
               whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{e.player.name}</div>
          <div style={{height:4,marginTop:5,width:`${Math.max(4, Math.round(ptsOf(e) / topPts * 100))}%`,
               background:"linear-gradient(90deg,rgba(247,241,230,.7),rgba(247,241,230,.12))"}} />
          </div>
        </div>
        <div onClick={() => setOpenPlayerId(e.player.id)}
             style={{cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",
                     borderTop:"1px solid rgba(242,208,211,.16)"}}>
          <span style={{fontFamily:"'JetBrains Mono',monospace",fontWeight:700,fontSize:12,
                color:en.streak >= 3 ? "#F2B8BC" : "#F7F1E6"}}>{streakLabel(en)}</span>
        </div>
        <div onClick={() => setOpenPlayerId(e.player.id)}
             style={{cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"flex-end",
                     borderTop:"1px solid rgba(242,208,211,.16)",fontFamily:"'Archivo',sans-serif",fontStyle:"italic",
                     fontVariationSettings:"'wdth' 112,'wght' 900",fontSize:20,color:"#FFFFFF"}}>{ptsOf(e)}</div>
      </React.Fragment>
    );
  };

  return (
    <div style={{animation:"sgSlide 200ms var(--ease-out) both"}}>
      <div style={{position:"relative",padding:"20px 0 12px",overflow:"hidden"}}>
        <div style={{position:"absolute",right:-14,top:-30,fontFamily:"'Archivo',sans-serif",fontStyle:"italic",
             fontVariationSettings:"'wdth' 125,'wght' 900",fontSize:150,lineHeight:1,
             color:"rgba(26,10,12,.055)",pointerEvents:"none"}} className="vol-mark" aria-hidden="true">09</div>
        <div style={{position:"relative",fontFamily:"'Archivo',sans-serif",fontWeight:800,fontSize:10,
             letterSpacing:".34em",textTransform:"uppercase",color:"#F7F1E6",
             display:"flex",alignItems:"center",gap:8}}>
          <BoMark size={14} />Series standings · {active.length} players</div>
        <div style={{position:"relative",fontFamily:"'Archivo',sans-serif",fontStyle:"italic",
             fontVariationSettings:"'wdth' 125,'wght' 900",fontSize:50,lineHeight:.88,color:"#FFFFFF",marginTop:8}}>RANKINGS</div>
        <div style={{position:"relative",height:3,marginTop:12,background:"linear-gradient(90deg,#F7F1E6,rgba(247,241,230,0))"}} />
      </div>

      <div style={{display:"grid",gridTemplateColumns:`repeat(${CHIPS.length},minmax(0,1fr))`,gap:6}}>
        {CHIPS.map(([id, label]) => {
          const on = sort === id;
          return <div key={id} onClick={() => setSort(id)}
            style={{cursor:"pointer",minHeight:40,display:"grid",placeItems:"center",
                    background:on ? "rgba(247,241,230,.12)" : "rgba(158,21,32,.94)",
                    border:`1px solid ${on ? "rgba(247,241,230,.55)" : "rgba(242,208,211,.3)"}`,
                    fontFamily:"'Archivo',sans-serif",fontWeight:800,fontSize:10,letterSpacing:".16em",
                    textTransform:"uppercase",color:on ? "#F7F1E6" : "#F7F1E6"}}>{label}</div>;
        })}
      </div>

      <div style={{marginTop:12}}><Input value={q} onChange={setQ} placeholder="Find a player&hellip;" /></div>

      {q ? (
        <div style={{display:"grid",gridTemplateColumns:"34px 1fr 56px 74px",marginTop:12}}>
          {found.length === 0
            ? <div style={{gridColumn:"1 / -1",padding:"18px 4px",fontFamily:"'JetBrains Mono',monospace",
                     fontSize:11,letterSpacing:".1em",color:"#F7F1E6",textTransform:"uppercase"}}>No ranked player by that name</div>
            : found.map(({ e, i }) => <Row key={e.player.id} e={e} i={i} />)}
        </div>
      ) : !leader ? (
        <Card className="p-8 text-center border-dashed" style={{marginTop:14}}>
          <I.trophy className="mx-auto mb-3 text-stone-600" size={32} />
          <div className="text-stone-300 font-semibold">Ranking locked</div>
          <div className="text-stone-500 text-sm mt-1">Standings appear after the first match is played</div>
        </Card>
      ) : (<>
        {/* ── YOU, PINNED (Vol.9) ── */}
        {meId && !lifetime && <RankPin state={state} leaderboard={leaderboard} meId={meId}
                                       setOpenPlayerId={setOpenPlayerId} />}

        {/* ── LEADER ── */}
        {(() => {
          const en = enrich(leader);
          return <div onClick={() => setOpenPlayerId(leader.player.id)} className="sg-top" data-lead="1"
            style={{cursor:"pointer",position:"relative",marginTop:12,padding:"16px 14px",
                    background:"rgba(16,23,31,.96)",backgroundImage:"linear-gradient(180deg,#F7F1E6,rgba(247,241,230,.06))",
                    backgroundSize:"3px 100%",backgroundRepeat:"no-repeat",overflow:"hidden"}}>
            <div style={{position:"relative",display:"flex",alignItems:"center",gap:12}}>
              <div style={{flex:"0 0 auto",width:48,height:48,display:"grid",placeItems:"center",
                   background:"rgba(247,241,230,.14)",border:"1px solid rgba(247,241,230,.5)",
                   boxShadow:"0 0 26px rgba(247,241,230,.22)",fontFamily:"'Archivo',sans-serif",fontStyle:"italic",
                   fontVariationSettings:"'wdth' 125,'wght' 900",fontSize:22,color:"#F7F1E6"}}>1</div>
              <Avatar player={leader.player} size={40} />
              <div style={{flex:"1 1 auto",minWidth:0}}>
                <div style={{fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 112,'wght' 900",
                     fontSize:19,lineHeight:1.05,color:"#FFFFFF",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>
                  {leader.player.name}</div>
                <div style={{display:"flex",gap:8,marginTop:5,flexWrap:"wrap"}}>
                  <span style={{whiteSpace:"nowrap",fontFamily:"'Archivo',sans-serif",fontWeight:800,fontSize:9,
                        letterSpacing:".16em",color:"#F7F1E6"}}>{leader.stats.sessionsPlayed} {leader.stats.sessionsPlayed === 1 ? "SESSION" : "SESSIONS"} · {en.winRate}% WIN</span>
                  {en.streak > 0 && <span style={{whiteSpace:"nowrap",fontFamily:"'Archivo',sans-serif",fontWeight:800,
                        fontSize:9,letterSpacing:".16em",color:"#F7F1E6"}}>W{en.streak} STREAK</span>}
                </div>
              </div>
              <div style={{flex:"0 0 auto",textAlign:"right"}}>
                <div className="sg-top-pts" style={{whiteSpace:"nowrap",fontFamily:"'Archivo',sans-serif",fontStyle:"italic",
                     fontVariationSettings:"'wdth' 112,'wght' 900",fontSize:28,lineHeight:.9,color:"#F7F1E6"}}>{ptsOf(leader)}</div>
                <div style={{fontFamily:"'Archivo',sans-serif",fontWeight:800,fontSize:8,letterSpacing:".26em",color:"#F7F1E6"}}>PTS</div>
              </div>
            </div>
            {en.form.length > 0 && <div style={{position:"relative",display:"flex",alignItems:"center",gap:6,marginTop:12,
                 paddingTop:11,borderTop:"1px solid rgba(242,208,211,.2)"}}>
              <span style={{fontFamily:"'Archivo',sans-serif",fontWeight:800,fontSize:9,letterSpacing:".26em",color:"#F7F1E6"}}>FORM</span>
              {en.form.map((r, k) => <div key={k} style={{width:14,height:6,
                   background:r === "W" ? "#F7F1E6" : "rgba(242,208,211,.45)"}} />)}
            </div>}
          </div>;
        })()}

        {/* ── YOU, IN CONTEXT ── */}
        {(() => {
          const mi = meId ? list.findIndex(e => e.player.id === meId) : -1;
          if (mi < 1) return null;
          const e = list[mi], en = enrich(e), mv = moveOf(e, mi);
          const near = indexed.slice(Math.max(0, mi - 2), mi + 3);
          return <div style={{marginTop:14,padding:"13px 14px",background:"rgba(16,23,31,.96)",
               backgroundImage:"linear-gradient(180deg,#F2B8BC,rgba(242,184,188,.06))",backgroundSize:"3px 100%",
               backgroundRepeat:"no-repeat",border:"1px solid rgba(242,184,188,.4)"}}>
            <div style={{display:"flex",alignItems:"center",gap:12}}>
              <div style={{flex:"0 0 auto",width:42,height:42,display:"grid",placeItems:"center",
                   background:"rgba(242,184,188,.12)",border:"1px solid rgba(242,184,188,.5)",
                   fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900",
                   fontSize:18,color:"#F2B8BC"}}>{mi + 1}</div>
              <Avatar player={e.player} size={36} />
              <div style={{flex:"1 1 auto",minWidth:0}}>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <span style={{fontFamily:"'Archivo',sans-serif",fontWeight:800,fontSize:9,letterSpacing:".3em",color:"#F2B8BC"}}>YOU</span>
                  <button onClick={(ev) => { ev.stopPropagation(); onOpenPicker(); }}
                    style={{background:"none",border:"none",cursor:"pointer",padding:0,
                            fontFamily:"'JetBrains Mono',monospace",fontWeight:700,fontSize:9,
                            letterSpacing:".14em",color:"#F7F1E6"}}>NOT YOU?</button>
                </div>
                <div onClick={() => setOpenPlayerId(e.player.id)} style={{cursor:"pointer",fontFamily:"'Archivo',sans-serif",
                     fontStyle:"italic",fontVariationSettings:"'wdth' 112,'wght' 900",fontSize:18,lineHeight:1.05,
                     color:"#FFFFFF",marginTop:2,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{e.player.name}</div>
                <div style={{fontFamily:"'Archivo',sans-serif",fontWeight:800,fontSize:9,letterSpacing:".18em",
                     color:"#F7F1E6",marginTop:4}}>{streakLabel(en)} · {en.winRate}% WIN</div>
              </div>
              <div style={{flex:"0 0 auto",textAlign:"right"}}>
                {mv && <div style={{fontFamily:"'Archivo',sans-serif",fontWeight:800,fontSize:10,
                     color:mv.up ? "#F7F1E6" : "#F2B8BC"}}>{mv.up ? "▲" : "▼"}{mv.n}</div>}
                <div style={{whiteSpace:"nowrap",fontFamily:"'Archivo',sans-serif",fontStyle:"italic",
                     fontVariationSettings:"'wdth' 112,'wght' 900",fontSize:26,lineHeight:1,color:"#F2B8BC",marginTop:2}}>{ptsOf(e)}</div>
              </div>
            </div>
            <div style={{marginTop:12,paddingTop:11,borderTop:"1px solid rgba(242,208,211,.22)"}}>
              {near.map(({ e: n, i: ni }) => {
                const me = n.player.id === meId;
                return <div key={n.player.id} onClick={() => setOpenPlayerId(n.player.id)}
                  style={{cursor:"pointer",display:"flex",alignItems:"center",gap:10,padding:"5px 0"}}>
                  <div style={{flex:"0 0 auto",width:20,fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:"#F7F1E6"}}>{ni + 1}</div>
                  <div style={{flex:"0 0 auto",width:2,height:14,background:me ? "#F2B8BC" : "rgba(242,208,211,.5)"}} />
                  <div style={{flex:"1 1 auto",minWidth:0,fontFamily:"'Archivo',sans-serif",fontWeight:800,fontSize:13,
                       color:me ? "#F2B8BC" : "#FFFFFF",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{n.player.name}</div>
                  <div style={{flex:"0 0 auto",fontFamily:"'JetBrains Mono',monospace",fontSize:12,
                       color:me ? "#F2B8BC" : "#F7F1E6"}}>{ptsOf(n)}</div>
                </div>;
              })}
            </div>
          </div>;
        })()}

        {/* ── FULL TABLE ── */}
        <div style={{marginTop:18,display:"grid",gridTemplateColumns:"34px 1fr 56px 74px",
             fontFamily:"'Archivo',sans-serif",fontWeight:800,fontSize:10,letterSpacing:".2em",color:"#F7F1E6"}}>
          <div style={{paddingBottom:8}}>#</div>
          <div style={{paddingBottom:8}}>PLAYER</div>
          <div style={{paddingBottom:8,textAlign:"center"}}>STREAK</div>
          <div style={{paddingBottom:8,textAlign:"right"}}>PTS</div>
          {restMain.map(({ e, i }) => <Row key={e.player.id} e={e} i={i} />)}
          {showTail && restTail.map(({ e, i }) => <Row key={e.player.id} e={e} i={i} />)}
        </div>
        {restTail.length > 0 && !showTail &&
          <button onClick={() => setShowTail(true)}
            style={{width:"100%",textAlign:"left",background:"none",border:"none",
                    borderTop:"1px solid rgba(242,208,211,.18)",padding:"14px 4px",cursor:"pointer",
                    fontFamily:"'JetBrains Mono',monospace",fontSize:10,fontWeight:700,
                    letterSpacing:".14em",color:"#F7F1E6",textTransform:"uppercase"}}>
            Show {restTail.length} more on {TAIL_MAX} pts or fewer &#9654;
          </button>}
      </>)}
    </div>
  );
}

function PlayerDetail({ playerId, state, leaderboard, canScore, sync, syncErr, update, onClose, meId }) {
  const player = state.players.find(p => p.id === playerId);
  const entry = leaderboard.find(l => l.player.id === playerId);
  if (!player || !entry) return null;
  const rank = leaderboard.findIndex(l => l.player.id === playerId) + 1;
  const locked = getLockedPartners(playerId, state.sessions);
  const lockedNames = Array.from(locked).map(id => state.players.find(p => p.id === id)?.name).filter(Boolean);
  const seriesNames = state.prevSeriesNames || [];
  const playerSeriesPts = player.prevSeriesPts || {};
  const legacyPrev = player.prevSeriesPoints || 0;
  const prevSum = Object.values(playerSeriesPts).reduce((a, b) => a + (Number(b) || 0), 0) + legacyPrev;
  const [uploading, setUploading] = useState(false);
  const handlePhotoUpload = async (e) => {
    const f = e.target.files?.[0]; if (!f) return;
    setUploading(true);
    try {
      // A branded avatar is a URL, so it lives in the state like any other
      // field. uploadPhotoToServer is only for base64, which is why it is not
      // called on that branch — calling it would store nothing and clear the
      // separate photo record the fallback path depends on.
      const branded = await buildBrandAvatar(f);
      if (branded) {
        update(s => ({ ...s, players: s.players.map(p => p.id === playerId ? { ...p, photoUrl: branded } : p) }));
      } else {
        const b64 = await resizeToBase64(f);
        update(s => ({ ...s, players: s.players.map(p => p.id === playerId ? { ...p, photoUrl: b64 } : p) }));
        await uploadPhotoToServer(playerId, b64);
      }
    } catch {}
    setUploading(false);
  };
  return <Modal open={true} onClose={onClose} title={player.name.toUpperCase()}>
    <div className="space-y-4">
      {canScore && <div className="flex justify-end -mt-1 -mb-2"><SyncIndicator status={sync} errMsg={syncErr} /></div>}
      {(() => {
        const form = recentForm(playerId, state.sessions);
        const dec = entry.stats.groupPlayed + entry.stats.qfReached + entry.stats.sfReached + entry.stats.finalsReached;
        const wins = entry.stats.groupWins + entry.stats.qfWins + entry.stats.sfWins + entry.stats.finalsWon;
        const winRate = dec ? Math.round(wins / dec * 100) : 0;
        const streak = currentStreak(form);
        const accent = streak >= 3 ? "#F2B8BC" : "#F7F1E6";
        const last8 = form.slice(-8);
        const STATS = [
          ["POINTS", entry.totalPts, "#F7F1E6"],
          ["WIN %", winRate + "%", "#FFFFFF"],
          ["NIGHTS", entry.stats.sessionsPlayed, "#FFFFFF"],
        ];
        return <div>
          {/* photo */}
          <div style={{position:"relative",width:"100%",height:200,background:"#0A1017",overflow:"hidden",
               display:"grid",placeItems:"center"}}>
            {player.photoUrl
              ? <img src={player.photoUrl} alt={player.name}
                     style={{width:"100%",height:"100%",objectFit:"cover",objectPosition:"center 28%"}} />
              : <div style={{fontFamily:"'Archivo',sans-serif",fontStyle:"italic",
                     fontVariationSettings:"'wdth' 125,'wght' 900",fontSize:64,color:"rgba(159,176,188,.25)"}}>
                  {(player.name || "?").split(" ").map(x => x[0]).join("").slice(0, 2).toUpperCase()}</div>}
            {canScore && <label style={{position:"absolute",right:10,bottom:10,width:36,height:36,
                 display:"grid",placeItems:"center",background:"rgba(247,241,230,.9)",cursor:"pointer"}}>
              {uploading ? <span style={{fontSize:9,color:"#B8141F"}}>…</span> : <I.camera size={15} style={{color:"#B8141F"}} />}
              <input type="file" accept="image/*" className="hidden" onChange={handlePhotoUpload} />
            </label>}
          </div>

          {/* identity */}
          <div style={{padding:"14px 2px",borderTop:`1px solid ${accent}55`}}>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <div style={{padding:"4px 9px",background:"rgba(255,255,255,.05)",border:`1px solid ${accent}55`,
                   fontFamily:"'Archivo',sans-serif",fontWeight:800,fontSize:9,letterSpacing:".2em",color:accent}}>RANK {rank}</div>
              {streak > 0 && <div style={{padding:"4px 9px",background:streak >= 3 ? "rgba(242,184,188,.14)" : "rgba(247,241,230,.12)",
                   fontFamily:"'Archivo',sans-serif",fontWeight:800,fontSize:9,letterSpacing:".16em",
                   color:streak >= 3 ? "#F2B8BC" : "#F7F1E6"}}>W{streak} STREAK</div>}
            </div>
            <div style={{fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900",
                 fontSize:32,lineHeight:.95,color:"#FFFFFF",marginTop:9}}>{player.name.toUpperCase()}</div>
          </div>

          {/* three tiles */}
          <div style={{display:"grid",gridTemplateColumns:"repeat(3,minmax(0,1fr))",gap:8}}>
            {STATS.map(([label, value, colour]) => (
              <div key={label} style={{padding:11,background:"rgba(158,21,32,.94)",
                   backgroundImage:`linear-gradient(180deg,${colour},rgba(242,208,211,.05))`,
                   backgroundSize:"3px 100%",backgroundRepeat:"no-repeat"}}>
                <div style={{fontFamily:"'Archivo',sans-serif",fontWeight:800,fontSize:8,letterSpacing:".2em",color:"#F7F1E6"}}>{label}</div>
                <div style={{fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 112,'wght' 900",
                     fontSize:24,lineHeight:1,color:colour,marginTop:5}}>{value}</div>
              </div>
            ))}
          </div>

          {/* form */}
          {last8.length > 0 && <div style={{marginTop:14,padding:14,background:"rgba(158,21,32,.94)",
               backgroundImage:"linear-gradient(180deg,#F7F1E6,rgba(247,241,230,.06))",
               backgroundSize:"3px 100%",backgroundRepeat:"no-repeat"}}>
            <div style={{display:"flex",alignItems:"baseline",gap:8}}>
              <div style={{fontFamily:"'Archivo',sans-serif",fontWeight:800,fontSize:9,letterSpacing:".3em",color:"#F7F1E6"}}>
                FORM · LAST {last8.length}</div>
              {streak > 0 && <div style={{marginLeft:"auto",fontFamily:"'Archivo',sans-serif",fontWeight:800,fontSize:9,
                   letterSpacing:".16em",color:accent}}>W{streak}</div>}
            </div>
            <div style={{display:"flex",gap:5,marginTop:11}}>
              {last8.map((r, i) => <div key={i} style={{flex:1,height:30,display:"grid",placeItems:"center",
                   background:r === "W" ? "rgba(247,241,230,.14)" : "rgba(255,255,255,.03)",
                   border:`1px solid ${r === "W" ? "rgba(247,241,230,.45)" : "rgba(242,208,211,.3)"}`,
                   fontFamily:"'JetBrains Mono',monospace",fontWeight:700,fontSize:11,
                   color:r === "W" ? "#F7F1E6" : "#F7F1E6"}}>{r}</div>)}
            </div>
            <div style={{fontSize:12.5,lineHeight:1.5,color:"#F7F1E6",marginTop:10}}>
              Most recent on the right. {wins} wins from {dec} decided matches.</div>
          </div>}
        </div>;
      })()}
      {prevSum > 0 && seriesNames.length > 0 && <Card className="p-3">
        <div className="text-[10px] text-stone-500 uppercase tracking-wider font-semibold mb-2">Previous Series</div>
        <div className="space-y-1">
          {seriesNames.map(sn => (
            <div key={sn} className="flex justify-between text-sm">
              <span className="text-stone-400">{sn}</span>
              <span className="font-mono text-stone-200">{playerSeriesPts[sn] || 0}</span>
            </div>
          ))}
          {legacyPrev > 0 && <div className="flex justify-between text-sm"><span className="text-stone-400">Legacy</span><span className="font-mono text-stone-200">{legacyPrev}</span></div>}
          <div className="border-t border-stone-800 pt-1 flex justify-between text-sm font-semibold">
            <span className="text-stone-300">Total prev</span><span className="font-mono text-blue-400">{prevSum}</span>
          </div>
        </div>
      </Card>}
      <div className="grid grid-cols-2 gap-2">
        <Card className="p-3"><div className="text-[10px] text-stone-500 uppercase tracking-wider mb-1">Match</div><div className="font-mono text-2xl font-bold text-stone-100">{entry.breakdown.matchPts}</div></Card>

function RestoreModal({ onClose }) {
  const [versions, setVersions] = useState(null);
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  useEffect(() => {
    (async () => {
      try {
        const r = await fetch(WORKER_URL + "/history", { headers: { "Authorization": "Bearer " + getToken() } });
        const d = await r.json();
        if (d.ok) setVersions(d.versions); else setErr(d.error || "Failed to load history");
      } catch (e) { setErr("Failed to load history"); }
    })();
  }, []);
  const restore = async (v) => {
    if (!confirm(`Restore the version from ${new Date(v.saved_at).toLocaleString()}?\n\n${v.player_ct} players, ${v.match_ct} scored matches.\n\nThe current state is snapshotted first, so this is reversible.`)) return;
    setBusy(true);
    try {
      const r = await fetch(WORKER_URL + "/restore", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + getToken() },
        body: JSON.stringify({ id: v.id }),
      });
      const d = await r.json();
      if (d.ok) { alert("Restored — reloading."); setTimeout(() => location.reload(), 1100); }
      else { setErr(d.error || "Restore failed"); setBusy(false); }
    } catch (e) { setErr("Restore failed"); setBusy(false); }
  };
  return <Modal open={true} onClose={onClose} title="RESTORE EARLIER VERSION">
    <div className="space-y-3">
      <div className="text-xs text-stone-400">Every save is kept for 60 days. Pick a point to roll back to — the current state is backed up first, so you can undo a restore.</div>
      {err && <div className="text-xs text-red-400">{err}</div>}
      {!versions && !err && <div className="text-center text-stone-500 py-6">Loading…</div>}
      {versions && versions.length === 0 && <div className="text-center text-stone-500 py-6">No history yet.</div>}
      {versions && <div className="space-y-1.5 max-h-80 overflow-y-auto">
        {versions.map((v, i) => (
          <div key={v.id} className="flex items-center gap-2 p-2.5 rounded-lg" style={{ background: "rgba(255,255,255,.03)", border: "1px solid rgba(255,255,255,.08)" }}>
            <div className="flex-1 min-w-0">
              <div className="text-sm text-stone-200">{new Date(v.saved_at).toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })}{i === 0 ? " · latest" : ""}</div>
              <div className="text-[11px] text-stone-500">{v.player_ct} players · {v.match_ct} scored matches</div>
            </div>
            <Btn variant="secondary" disabled={busy} onClick={() => restore(v)}>Restore</Btn>
          </div>
        ))}
      </div>}
    </div>
  </Modal>;
}

function SettingsView({ state, update, setTab, logout }) {

          <div className="flex justify-between"><span className="text-stone-300">⚔️ Reach Final</span><span className="font-mono text-red-400">+3 + match</span></div>
          <div className="flex justify-between"><span className="text-stone-300">🏆 Win Final</span><span className="font-mono text-cyan-300 font-bold">+5 bonus</span></div>
          <div className="border-t border-stone-800 my-2" />
          <div className="flex justify-between"><span className="text-stone-300">🔥 Streak Max</span><span className="font-mono text-orange-500 font-bold">+5</span></div>
          <div className="flex justify-between"><span className="text-stone-300">↩️ Comeback (miss 2+)</span><span className="font-mono text-blue-400 font-bold">+2</span></div>
        </div>
      </Card>
      <Card className="p-4">
        <h3 className="font-display text-lg text-stone-200 mb-3">PREVIOUS SERIES</h3>
        <div className="text-[10px] text-stone-500 mb-3">Series listed here appear as separate point inputs per player in the all-time leaderboard.</div>

          {(state.prevSeriesNames || []).map((sn, idx) => (
            <div key={idx} className="flex items-center gap-2">

        }}>Copy public leaderboard URL</Btn>
      </Card>
      <Card className="p-4">
        <h3 className="font-display text-lg text-stone-200 mb-3">DATA</h3>
        <div className="space-y-2">
          <Btn variant="secondary" className="w-full" onClick={() => setShowExp(true)}><I.download size={14} /> Export JSON</Btn>

      {showExp && (() => {
        // Export the photo-stripped state (same as the server stores). Full
        // state carries megabytes of base64 photos, which silently fails to
        // copy on mobile — this keeps it small and reliable.
        const exportStr = JSON.stringify(stateForLocalCache(state), null, 2);
        const copyExport = async () => {
          try {
            if (navigator.clipboard?.writeText) { await navigator.clipboard.writeText(exportStr); alert("Copied ✓"); return; }
            throw new Error("no clipboard api");
          } catch (e) {
            const ta = document.getElementById("jh-export-ta");
            if (ta) { ta.focus(); ta.select(); try { document.execCommand("copy"); alert("Copied ✓"); return; } catch (e2) {} }
            alert("Couldn't copy automatically — long-press the text and Copy, or use Download.");
          }
        };
        const downloadExport = () => {
          const blob = new Blob([exportStr], { type: "application/json" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          const d = new Date();
          a.href = url;
          // named after the current series, not a hardcoded one — Vol.9 will
          // name its own backups without anyone remembering to change this
          const slug = (state.seasonName || "series").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
          a.download = `${slug}-backup-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}-${String(d.getHours()).padStart(2,"0")}${String(d.getMinutes()).padStart(2,"0")}.json`;
          a.click();
          setTimeout(() => URL.revokeObjectURL(url), 2000);
        };
        return <Modal open={true} onClose={() => setShowExp(false)} title="EXPORT / BACKUP">
          <div className="space-y-3">
            <div className="text-xs text-stone-400">Scores & players ({Math.round(exportStr.length/1024)} KB, photos excluded). Download the file for a safe off-device backup, or copy the text.</div>

            <Btn className="w-full" onClick={downloadExport}><I.download size={14} /> Download .json file</Btn>
            <Btn variant="secondary" className="w-full" onClick={copyExport}>Copy text</Btn>
          </div>
        </Modal>;
      })()}
    </div>
  );
}

<script>
// Runtime comic forcer — patches inline styles React applies
(function(){
  const INK = '#9E1520', CREAM = '#FFFFFF', YELLOW = '#F2B8BC', RED = '#F7F1E6', ORANGE = '#F7F1E6', BLUE = '#F7F1E6';
  
  // Patch elements with known inline style patterns
  function patch(el){
    const s = el.style;
    if(!s) return;
    // Never touch jh- brand elements
    if(el.className && typeof el.className === 'string' && el.className.includes('jh-')) return;
    if(el.closest && el.closest('.jh-hero,.jh-caption,.jh-chip,.jh-pool,.jh-strip,.jh-flag,.jh-srow,.jh-lbrow')) return;
    const bg = s.background || s.backgroundColor || '';
    
    // surface ▶ cream
    if(bg.includes('var(--surface)') || bg.includes('rgba(28, 25, 23') || bg.includes('rgba(28,25,23')){
      el.style.background = CREAM;
      el.style.border = '4px solid '+INK;
      el.style.boxShadow = '6px 6px 0 '+INK;
      el.style.borderRadius = '0';
    }
    // stone-900 rows
    if(bg.includes('rgba(28, 25, 23, 0.4)') || bg.includes('rgba(28,25,23,0.4)') || bg.includes('rgba(20, 18, 16') || bg.includes('rgba(20,18,16')){
      el.style.background = 'rgba(240,233,216,0.9)';
      el.style.border = '2px solid '+INK;
      el.style.borderRadius = '0';
    }
    // streak cells (dark)
    if(bg.includes('rgba(28, 25, 23, 0.8)') || bg.includes('rgba(28,25,23,0.8)')){
      el.style.background = CREAM;
      el.style.border = '4px solid '+INK;
      el.style.color = INK;
    }
    // double points 2X badge inside toggle
    if(bg.includes('var(--blue)') || bg.includes('#F2B8BC')){
      el.style.border = '2px solid '+INK;
      el.style.borderRadius = '0';
    }
  }
  
  const obs = new MutationObserver(muts => {
    muts.forEach(m => m.addedNodes.forEach(n => {
      if(n.nodeType !== 1) return;
      patch(n);
      n.querySelectorAll('*').forEach(patch);
    }));
  });
  obs.observe(document.body, {childList:true, subtree:true});
  
  // Also patch existing after load
  setTimeout(()=>document.querySelectorAll('*').forEach(patch), 600);
  setTimeout(()=>document.querySelectorAll('*').forEach(patch), 1500);
})();
</script>

  72%{transform:translate(-2px,0);clip-path:inset(30% 0 0 0)}
  100%{opacity:1;transform:none;clip-path:none}
}
.glitch-in{animation:aaGlitchIn .95s .1s both;}
.glitch-in.d2{animation-delay:.5s;}
.glitch-in.d3{animation-delay:1.05s;}

/* scanline texture over the whole app (static, tactical) */
#root::after{content:"";position:fixed;inset:0;z-index:60;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.13) 0 1px,transparent 1px 3px);
  mix-blend-mode:multiply;opacity:.4;}

/* ── CARD SYSTEM (cohesive) ─────────────────────────────────
   Cards are quiet: dark surface, hairline edge, no glow, and the
   signature angled corner cut. Red is an ACCENT only — reserved for
   active state, the leader/top row, kickers and key numbers. Nothing
   is outlined "comic panel" style.                                  */
.jh-panel,.jh-srow,.jh-lbrow,.jh-mock-sess,.jh-mock-row,.jh-hero,
[class*="bg-stone-9"]:not(nav):not(header):not(.sticky){
  background:rgba(18,22,32,.9) !important;
  border:1px solid rgba(255,255,255,.10) !important;
  box-shadow:none !important;
  border-radius:0 !important;
  clip-path:polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px)) !important;
}
/* nested rows sit inside a cut card, so they stay square + slightly lifted */
.jh-panel .jh-mock-row,.jh-panel .jh-mock-sess,
[class*="bg-stone-9"] [class*="bg-stone-9"]{
  clip-path:none !important;background:rgba(255,255,255,.035) !important;
  border:1px solid rgba(255,255,255,.08) !important;
}
/* the ONE bold thing: hero keeps a faint red bloom, no hard outline */
.jh-hero{
  background:radial-gradient(ellipse 80% 55% at 50% 18%,rgba(247,241,230,.14),transparent 62%),rgba(158,21,32,.96) !important;
  border:1px solid rgba(247,241,230,.28) !important;
}
/* accent bars instead of outlines: leader / active / qualified */
.jh-lbrow.r1,.jh-srow.active,.jh-fill-red{border-left:2px solid #F7F1E6 !important;}
.jh-fill-blue{border-left:2px solid #F2B8BC !important;}
.jh-fill-green{border-left:2px solid #F7F1E6 !important;}
.jh-fill-yellow{border-left:2px solid #F2B8BC !important;}
/* hover: subtle lift, not a glow bomb */
.jh-srow:hover,.jh-lbrow:hover,.jh-mock-row:hover,.jh-mock-sess:hover{
  border-color:rgba(247,241,230,.4) !important;background:rgba(247,241,230,.05) !important;
}
/* stat tiles: top rule accent, quiet body */
.grid > div[style*="border"]{box-shadow:none !important;}
/* section labels: red letterspaced caps */
.jh-round-title,.jh-sec-kicker,.aa-kicker{
  font-family:'Archivo',sans-serif !important;font-weight:700 !important;
  letter-spacing:3.5px !important;text-transform:uppercase !important;
}
@media (prefers-reduced-motion:reduce){
  .glitch-in{animation:none !important;opacity:1 !important;transform:none !important;clip-path:none !important;filter:none !important;}
}


/* ── kickers: flat tactical labels, not boxed comic bursts ── */
.aa-kicker,.jh-burst2,.jh-sec-kicker{
  display:block !important;
  background:none !important;border:none !important;box-shadow:none !important;
  color:#F7F1E6 !important;padding:0 0 0 10px !important;position:relative !important;
  font-size:11px !important;letter-spacing:3.5px !important;margin-bottom:12px !important;
}
.aa-kicker::before,.jh-burst2::before,.jh-sec-kicker::before{
  content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:3px;height:12px;background:#F7F1E6;box-shadow:0 0 8px rgba(247,241,230,.8);
}
/* ── bottom nav: red text + top rule, no solid slab ── */
nav.fixed .grid > button,nav.fixed .grid > a{
  background:transparent !important;border:none !important;border-top:2px solid transparent !important;
}
nav.fixed .grid > button[style*="var(--orange-br)"]{
  background:rgba(247,241,230,.10) !important;border-top:2px solid #F7F1E6 !important;
  color:#F7F1E6 !important;
}
/* ── LIVE / DONE: quiet outlined pill ── */
.jh-pow{background:rgba(247,241,230,.12) !important;border:1px solid rgba(247,241,230,.6) !important;
  box-shadow:none !important;font-size:15px !important;letter-spacing:2.5px !important;padding:4px 10px !important;}
/* ── schedule chip + captions: hairline, no red box ── */
.jh-mock-caption{background:rgba(255,255,255,.04) !important;border:1px solid rgba(255,255,255,.12) !important;}
/* ── match rows: flat, separated by hairlines (not individual boxes) ── */
.jh-panel .space-y-1\.5 > div,.space-y-1\.5 > .rounded-lg{box-shadow:none !important;}


/* ── final cohesion pass ── */
/* stage divider label: quiet, not a solid cyan slab */
span[style*="background:var(--blue)"],span[style*="background: var(--blue)"],
.jh-panel span[style*="background:var(--blue)"],
.jh-panel span[style*="background: var(--blue)"]{
  background:rgba(242,184,188,.10) !important;color:#F2B8BC !important;
  border:1px solid rgba(242,184,188,.35) !important;box-shadow:none !important;
}
/* top-of-group / highlighted rows: tint + gold left bar, never a muddy fill */
[style*="rgba(242,184,188,.13)"],[style*="rgba(242,184,188,.14)"]{
  background:rgba(242,184,188,.07) !important;border-left:2px solid #F2B8BC !important;
}
/* bottom nav active: red text + top rule (beat the html:not(.light) rules) */
html:not(.light) nav.fixed .grid > button,
html:not(.light) nav.fixed .grid > a{
  background:transparent !important;border:none !important;border-top:2px solid transparent !important;
  border-right:none !important;
}
html:not(.light) nav.fixed .grid > button[style*="color: var(--orange-br)"],
html:not(.light) nav.fixed .grid > button[style*="color:var(--orange-br)"]{
  background:rgba(247,241,230,.10) !important;border-top:2px solid #F7F1E6 !important;
  color:#F7F1E6 !important;
}
html:not(.light) nav.fixed .grid > button[style*="var(--orange-br)"] svg{color:#F7F1E6 !important;}


/* ═══════════════════════════════════════════════════════════
   56 NATIONAL SERIES · BOX TREATMENT v2 — CORNER TICKS
   No outlines and no angled cuts. Each surface is a flat dark
   plate marked by two L-shaped corner ticks (drawn with
   background gradients, so no pseudo-element conflicts).
   Accent colour of the ticks carries the meaning.
   ═══════════════════════════════════════════════════════════ */
:root{ --tick:#F7F1E6; --plate:rgba(16,20,29,.92); --plate-2:rgba(255,255,255,.035); }

.jh-panel,.jh-srow,.jh-lbrow,.jh-mock-sess,.jh-mock-row,
[class*="bg-stone-9"]:not(nav):not(header):not(.sticky){
  clip-path:none !important;
  border:none !important;
  border-radius:0 !important;
  box-shadow:none !important;
  background-color:var(--plate) !important;
  background-image:
    linear-gradient(var(--tick),var(--tick)), linear-gradient(var(--tick),var(--tick)),
    linear-gradient(var(--tick),var(--tick)), linear-gradient(var(--tick),var(--tick)) !important;
  background-size:16px 2px, 2px 16px, 16px 2px, 2px 16px !important;
  background-position:0 0, 0 0, 100% 100%, 100% 100% !important;
  background-repeat:no-repeat !important;
}
/* nested rows: quieter plate, steel ticks so they don't compete */
.jh-panel .jh-mock-row,.jh-panel .jh-mock-sess,
[class*="bg-stone-9"] [class*="bg-stone-9"]{
  --tick:#F2D0D3;
  background-color:var(--plate-2) !important;
}
/* meaning through tick colour */
.jh-fill-red,.jh-lbrow.r1,.jh-srow.active{ --tick:#F7F1E6; }
.jh-fill-blue,.jh-fill-yellow{ --tick:#F2B8BC; }
.jh-fill-green{ --tick:#F7F1E6; }
.jh-lbrow.r2{ --tick:#F7F1E6; }
.jh-lbrow.r3{ --tick:#F2D0D3; }
/* the hero is the one full-bleed surface: bloom, ticks in red, no frame */
.jh-hero{
  background-color:rgba(8,10,16,.96) !important;
  background-image:
    radial-gradient(ellipse 80% 55% at 50% 18%,rgba(247,241,230,.16),transparent 62%),
    linear-gradient(#F7F1E6,#F7F1E6), linear-gradient(#F7F1E6,#F7F1E6),
    linear-gradient(#F7F1E6,#F7F1E6), linear-gradient(#F7F1E6,#F7F1E6) !important;
  background-size:auto, 26px 2px, 2px 26px, 26px 2px, 2px 26px !important;
  background-position:center, 0 0, 0 0, 100% 100%, 100% 100% !important;
  background-repeat:no-repeat !important;
  border:none !important;
}
/* hover: brighten the plate, ticks stay put */
.jh-srow:hover,.jh-lbrow:hover,.jh-mock-row:hover,.jh-mock-sess:hover{
  background-color:rgba(247,241,230,.07) !important;
}
/* stat tiles: plate + ticks, value in chalk, label steel */
.grid > div[style*="padding"]{box-shadow:none !important;}
/* medal chips follow the same ladder — never gold */
.jh-lbrow.r1 .jh-rank{background:rgba(247,241,230,.16) !important;color:#F7F1E6 !important;}
.jh-lbrow.r2 .jh-rank{background:rgba(201,207,218,.14) !important;color:#F7F1E6 !important;}
.jh-lbrow.r3 .jh-rank{background:rgba(154,154,154,.14) !important;color:#F2D0D3 !important;}
.jh-crown{color:#F7F1E6 !important;filter:drop-shadow(0 0 8px rgba(247,241,230,.6)) !important;}


/* list rows (matches, fixtures) are not cards: no ticks, just a plate +
   hairline rule so long lists stay calm. Ticks are for cards only. */
.space-y-1\.5 > div[class*="bg-stone-9"][class*="rounded"],
.space-y-1 > div[class*="bg-stone-9"][class*="rounded"],
.space-y-2 > div[class*="bg-stone-9"][class*="rounded"],
.space-y-1\.5 > div,.space-y-1 > div,.space-y-2 > div{
  background-image:none !important;
  background-color:rgba(255,255,255,.028) !important;
  border-bottom:1px solid rgba(255,255,255,.07) !important;
}
.space-y-1\.5 > div:hover,.space-y-1 > div:hover{background-color:rgba(247,241,230,.06) !important;}
/* standings rows keep their own treatment (they carry rank meaning) */
.jh-lbrow,.jh-srow{border-bottom:none !important;}


/* ═══════════════════════════════════════════════════════════
   56 NATIONAL SERIES · MOTION + NAV PASS
   1. Bottom nav no longer drifts: it drops backdrop-filter (the
      expensive thing that re-rasterises while Safari's toolbar
      collapses), gets its own compositor layer, and finally
      honours env(safe-area-inset-bottom) — the page has always
      set viewport-fit=cover but never read the inset back.
   2. Nav restyled as a HUD console: segment dividers, mono
      labels, corner ticks, active segment in red.
   3. Press feedback on everything pressable.
   4. Motion curves + durations: UI moves in under 250ms.
   5. Hover effects gated to devices that actually hover, so a
      tap no longer leaves a row stuck in its hover colour.
   6. prefers-reduced-motion covers scanlines and chromatic
      text-splits, not just .glitch-in.
   ═══════════════════════════════════════════════════════════ */
:root{
  --ease-out:cubic-bezier(.34,1.56,.64,1);
  --ease-in-out:cubic-bezier(.77,0,.175,1);
}

/* ── 1 · NAV: stable, safe-area aware ─────────────────────── */
nav.fixed.bottom-0{
  backdrop-filter:none !important;
  -webkit-backdrop-filter:none !important;
  padding-bottom:env(safe-area-inset-bottom,0px) !important;
  transform:translateZ(0);
  will-change:transform;
}
/* colour needs html:not(.light) to outrank the earlier dark-mode nav rule,
   otherwise that rule wins on specificity and the ticks never paint */
html:not(.light) nav.fixed.bottom-0{
  /* fully opaque: with backdrop-blur gone, any translucency lets the
     hero type ghost through the bar */
  background-color:#B8141F !important;
  border-top:1px solid rgba(247,241,230,.35) !important;
  /* corner ticks, drawn as backgrounds so no pseudo-element clash */
  background-image:
    linear-gradient(#F2B8BC,#F2B8BC), linear-gradient(#F2B8BC,#F2B8BC),
    linear-gradient(#F7F1E6,#F7F1E6), linear-gradient(#F7F1E6,#F7F1E6) !important;
  background-size:14px 2px, 2px 14px, 14px 2px, 2px 14px !important;
  background-position:0 0, 0 0, 100% 100%, 100% 100% !important;
  background-repeat:no-repeat !important;
}
/* the main region must clear the taller nav */
main.pb-24{ padding-bottom:calc(6rem + env(safe-area-inset-bottom,0px)) !important; }

/* ── 2 · NAV: HUD console segments ────────────────────────── */
html:not(.light) nav.fixed .grid > button,
html:not(.light) nav.fixed .grid > a{
  border-right:1px solid rgba(255,255,255,.08) !important;
  border-radius:0 !important;
  transition:color 160ms ease, background-color 160ms ease,
             transform 160ms var(--ease-out) !important;
}
html:not(.light) nav.fixed .grid > *:last-child{ border-right:none !important; }
nav.fixed .grid > button span,nav.fixed .grid > a span{
  font-family:'JetBrains Mono',monospace !important;
  font-size:9px !important;letter-spacing:1px !important;
}

/* ── 3 · PRESS FEEDBACK ───────────────────────────────────── */
nav.fixed .grid > button:active,
nav.fixed .grid > a:active{ transform:scale(.94) !important; }
.jh-srow:active,.jh-lbrow:active,.jh-mock-row:active,.jh-mock-sess:active{
  transform:scale(.985);
}
button:active:not(:disabled),[role="button"]:active{ transform:scale(.97); }
.jh-srow,.jh-lbrow,.jh-mock-row,.jh-mock-sess{
  transition:transform 160ms var(--ease-out), background-color 160ms ease;
}

/* ── 4 · CURVES: replace Tailwind's transition-all ─────────── */
.transition-all{
  transition-property:transform,background-color,border-color,color,opacity !important;
  transition-duration:180ms !important;
  transition-timing-function:var(--ease-out) !important;
}
.transition-colors{ transition-duration:160ms !important; }

/* ── 5 · HOVER ONLY WHERE HOVER EXISTS ────────────────────── */
@media (hover:none){
  .jh-srow:hover,.jh-lbrow:hover,.jh-mock-row:hover,.jh-mock-sess:hover,
  .space-y-1\.5 > div:hover,.space-y-1 > div:hover{
    background-color:inherit !important;
    border-color:inherit !important;
  }
}

/* ── 6 · REDUCED MOTION, properly ─────────────────────────── */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;animation-iteration-count:1 !important;
    transition-duration:.01ms !important;scroll-behavior:auto !important;
  }
  .glitch-in,.splash .splash-logo-wrap{
    animation:none !important;opacity:1 !important;transform:none !important;
    clip-path:none !important;filter:none !important;
  }
  /* scanlines and chromatic splits read as motion for some viewers */
  .aa-scan,.jh-scan,[class*="scanline"]{ display:none !important; }
  .glitch-txt,.jh-glitch,.h1-split{ text-shadow:none !important; }
}


/* ═══════════════════════════════════════════════════════════
   56 NATIONAL SERIES · FEEL PASS
   The previous pass fixed plumbing. This one is what you see:
   a nav rule that travels instead of jumping, tab content that
   enters, rows that cascade, and sheets that come from where
   they belong.
   Everything moves on transform/opacity only, under 320ms.
   ═══════════════════════════════════════════════════════════ */
:root{ --ease-drawer:cubic-bezier(.32,.72,0,1); }

/* ── A · NAV: the rule slides between tabs ────────────────── */
/* the old active state slapped a 2px border on whichever tab
   was current — it teleported. A single travelling rule reads
   as one object moving, which is what the user's eye expects. */
html:not(.light) nav.fixed.bottom-0 .grid > button[style*="color: var(--orange-br)"],
html:not(.light) nav.fixed.bottom-0 .grid > button[style*="color:var(--orange-br)"]{
  border-top:2px solid transparent !important;
}
nav.fixed.bottom-0 .aa-ind{
  position:absolute;top:0;left:0;height:2px;width:0;
  background:#F7F1E6;box-shadow:0 0 10px rgba(247,241,230,.9);
  pointer-events:none;z-index:3;
  transition:transform 260ms var(--ease-in-out), width 260ms var(--ease-in-out);
}
/* icons take the press too, not just the segment */
nav.fixed .grid > button svg,nav.fixed .grid > a svg{
  transition:transform 160ms var(--ease-out);
}
nav.fixed .grid > button:active svg,nav.fixed .grid > a:active svg{ transform:scale(.9); }

/* ── B · TAB CONTENT ENTERS ───────────────────────────────── */
/* switching tabs is the single most-repeated transition in the
   app, so it gets the shortest, quietest treatment that still
   reads as a change: 190ms, 6px, no glitch. */
main > div{ animation:aaViewIn 190ms var(--ease-out); }
@keyframes aaViewIn{ from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }

/* ── C · ROWS CASCADE ─────────────────────────────────────── */
/* The app already cascades rows (30ms steps, capped at 360ms) and
   deliberately fades opacity ONLY — every row carries an inline
   rotate(±.35deg) tilt, and any keyframe that animates transform
   would land on `transform:none` and flatten the tilt for good.
   So: keep it opacity-only, just make it faster and give it a
   real ease-out instead of the default `ease`. */
.jh-rank-in{ animation-duration:260ms !important; animation-timing-function:var(--ease-out) !important; }
/* rows WITHOUT an inline transform can afford the extra 7px rise */
.jh-lbrow:not([style*="rotate"]),.jh-srow:not([style*="rotate"]),
.jh-mock-sess:not([style*="rotate"]){
  animation:aaRowIn 260ms var(--ease-out) both;
}
@keyframes aaRowIn{ from{opacity:0;transform:translateY(7px)} to{opacity:1;transform:none} }
/* past the fold there is nothing to cascade — and 238 staggered
   rows would take nine seconds to finish */
.jh-lbrow:nth-child(n+13),.jh-srow:nth-child(n+13),.jh-mock-sess:nth-child(n+13){ animation:none; }
.jh-lbrow:nth-child(2),.jh-srow:nth-child(2),.jh-mock-sess:nth-child(2){animation-delay:35ms}
.jh-lbrow:nth-child(3),.jh-srow:nth-child(3),.jh-mock-sess:nth-child(3){animation-delay:70ms}
.jh-lbrow:nth-child(4),.jh-srow:nth-child(4),.jh-mock-sess:nth-child(4){animation-delay:105ms}
.jh-lbrow:nth-child(5),.jh-srow:nth-child(5),.jh-mock-sess:nth-child(5){animation-delay:140ms}
.jh-lbrow:nth-child(6),.jh-srow:nth-child(6),.jh-mock-sess:nth-child(6){animation-delay:170ms}
.jh-lbrow:nth-child(7),.jh-srow:nth-child(7),.jh-mock-sess:nth-child(7){animation-delay:195ms}
.jh-lbrow:nth-child(n+8),.jh-srow:nth-child(n+8),.jh-mock-sess:nth-child(n+8){animation-delay:215ms}

/* ── D · FULL-SCREEN DETAIL: comes up from the bottom ─────── */
/* session + player detail cover the whole screen. Sliding them
   up from the edge they were opened toward makes the back
   button feel like a reversal rather than a teleport. */
.fixed.inset-0.z-40{ animation:aaSheetIn 300ms var(--ease-drawer); }
@keyframes aaSheetIn{ from{transform:translateY(100%)} to{transform:none} }

/* ── E · MODAL: backdrop fades, sheet rises ───────────────── */
@keyframes aaFadeIn{ from{opacity:0} to{opacity:1} }
/* the scrim fades on a pseudo-element, NOT on the container: fading
   the container drags the panel's opacity down with it, and you see
   the page straight through the sheet while it rises. */
.fixed.inset-0.z-50::before{
  content:'';position:absolute;inset:0;background:rgba(184,20,31,.92);
  animation:aaFadeIn 180ms ease both;
}
/* on phones this stack is bottom-anchored, so it travels its own
   height; from sm: up it's centred and just settles 10px. */
.fixed.inset-0.z-50 > div{ animation:aaSheetUp 300ms var(--ease-drawer); }
@keyframes aaSheetUp{ from{transform:translateY(100%)} to{transform:none} }
@media (min-width:640px){
  @keyframes aaSheetUp{ from{opacity:0;transform:translateY(10px) scale(.98)} to{opacity:1;transform:none} }
}

/* ── E2 · fixes the slow-motion pass surfaced ─────────────── */
/* The panel ships at rgba(158,21,32,.85). Standing still that reads
   as depth; mid-rise you see the rankings list straight through it
   and the eye reads two objects instead of one panel moving. Opaque
   while it travels, and a heavier scrim behind it. */
.fixed.inset-0.z-50 > div{ background:#141826 !important; position:relative; z-index:1; }
.fixed.inset-0.z-50 > div > div[style*="sticky"]{ background:#141826 !important; }
.fixed.inset-0.z-50{ background:transparent !important; }
/* the active tab's red wash was arriving instantly while the rule
   was still travelling — two events where there should be one */
html:not(.light) nav.fixed.bottom-0 .grid > button,
html:not(.light) nav.fixed.bottom-0 .grid > a{
  transition:color 260ms var(--ease-in-out),
             background-color 260ms var(--ease-in-out),
             transform 160ms var(--ease-out) !important;
}

/* ── F · REDUCED MOTION: gentler, not absent ──────────────── */
/* movement goes; opacity stays, because a panel that appears
   with no transition at all reads as a glitch. */
@media (prefers-reduced-motion:reduce){
  main > div,.jh-lbrow,.jh-srow,.jh-mock-row,.jh-mock-sess,.jh-rank-in,
  .fixed.inset-0.z-40,.fixed.inset-0.z-50,.fixed.inset-0.z-50 > div{
    animation:aaFadeIn 140ms ease both !important;
  }
  nav.fixed.bottom-0 .aa-ind{ transition:none !important; }
}


/* ═══════════════════════════════════════════════════════════
   56 NATIONAL SERIES · BOOT SEQUENCE
   The beats from the launch film, brought into the app — but
   only on the FIRST paint of a page load. <html> carries .aa-boot
   for the length of the timeline and then loses it, so none of
   this replays on a tab switch. Same rule as before: rare enough
   to be loud, never on something pressed fifty times a day.
   ═══════════════════════════════════════════════════════════ */

/* 1 · SPLASH — the mark glitches in, then breathes as it always did */
.splash .splash-logo{ animation:aaBootMark 720ms cubic-bezier(.34,1.56,.64,1) both; }
@keyframes aaBootMark{
  0%{opacity:0;transform:translateX(-24px) skewX(7deg) scale(1.06);
     filter:drop-shadow(15px 0 rgba(247,241,230,.9)) drop-shadow(-15px 0 rgba(242,184,188,.9));
     clip-path:inset(42% 0 42% 0)}
  22%{opacity:1;transform:translateX(16px) skewX(-4deg) scale(1.03);clip-path:inset(0 0 58% 0)}
  46%{transform:translateX(-9px) skewX(2deg);clip-path:inset(8% 0 0 0)}
  68%{transform:translateX(5px);clip-path:inset(0 0 0 0);
      filter:drop-shadow(4px 0 rgba(247,241,230,.6)) drop-shadow(-4px 0 rgba(242,184,188,.6))}
  100%{transform:none;filter:drop-shadow(0 0 14px rgba(247,241,230,.5)) drop-shadow(0 0 34px rgba(247,241,230,.3))}

<script>
/* Presentational only — a press ripple and a bump on numbers that change.
   Reads no state, writes no state, touches no React props. */
(function(){
  if (matchMedia("(prefers-reduced-motion:reduce)").matches) return;

  document.addEventListener("pointerdown", function(e){
    var t = e.target.closest && e.target.closest(
      "button,[role='button'],.jh-mock-row,.jh-mock-sess,.sg-top,.sg-thin,.jh-chipbtn");
    if (!t) return;
    var r = document.createElement("span");
    r.className = "sg-ripple";
    r.style.left = e.clientX + "px";
    r.style.top  = e.clientY + "px";
    document.body.appendChild(r);
    setTimeout(function(){ r.remove(); }, 480);
  }, { passive: true });

  // Bump whichever number just changed. Guarded three ways: not during the
  // first paint, not inside a field the user is typing in, and never more
  // than a handful at once — a full-table re-render after a server sync
  // would otherwise flash the whole screen.
  var boot = Date.now();
  var mo = new MutationObserver(function(muts){
    if (Date.now() - boot < 1500) return;
    if (muts.length > 12) return;
    muts.forEach(function(m){
      var el = m.target.nodeType === 3 ? m.target.parentElement : m.target;
      if (!el || !el.classList) return;
      if (!/^[\d\s.,:+\-–]+$/.test((el.textContent || "").trim())) return;
      if (el.closest("input,textarea,nav")) return;
      el.classList.remove("sg-bump");
      void el.offsetWidth;
      el.classList.add("sg-bump");
      setTimeout(function(){ el.classList.remove("sg-bump"); }, 460);
    });
  });
  (function start(){
    var root = document.getElementById("root");
    if (!root) return setTimeout(start, 400);
    mo.observe(root, { subtree: true, characterData: true });
  })();
})();
</script>


<script>
/* Bottom-nav indicator. The nav is rendered by React and the active
   tab is only knowable from the inline `color: var(--orange-br)` it
   carries, so the rule is measured from the DOM rather than driven by
   app state — no React changes, and it survives re-renders because a
   MutationObserver re-measures. Width is set too: the segments are
   equal now, but they change count when an admin logs in. */
(function(){
  function mount(){
    var nav=document.querySelector('nav.fixed.bottom-0');
    var grid=nav&&nav.querySelector('.grid');
    if(!grid) return false;
    var ind=nav.querySelector('.aa-ind');
    if(!ind){ ind=document.createElement('div'); ind.className='aa-ind'; nav.appendChild(ind); }
    function place(){
      var el=grid.querySelector('[style*="orange-br"]')||grid.firstElementChild;
      if(!el) return;
      var r=el.getBoundingClientRect(), n=nav.getBoundingClientRect();
      if(!r.width) return;
      ind.style.width=r.width+'px';
      ind.style.transform='translateX('+(r.left-n.left)+'px)';
    }
    place();
    new MutationObserver(place).observe(grid,
      {attributes:true,subtree:true,childList:true,attributeFilter:['style','class']});
    grid.addEventListener('click',function(){ requestAnimationFrame(place); setTimeout(place,80); });
    addEventListener('resize',place);
    addEventListener('orientationchange',function(){ setTimeout(place,120); });
    return true;
  }
  /* the app boots behind a splash, so poll briefly until the nav exists */
  var t=setInterval(function(){ if(mount()) clearInterval(t); },200);
  setTimeout(function(){ clearInterval(t); },30000);
})();
</script>

<script>
/* Boot sequence driver.
   - marks <html> for the length of the timeline only, so a tab switch
     never replays it
   - counts the three dashboard stat tiles up from zero, once. The numbers
     are React-rendered, so this writes textContent and stops the moment
     React writes something else — worst case it snaps to the real value,
     which is what it would have shown anyway. */
(function(){
  var root=document.documentElement, RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
  root.classList.add('aa-boot');
  setTimeout(function(){ root.classList.remove('aa-boot'); }, 6000);
  if (RM) return;

  var done=false;
  function countUp(el, target){
    var t0=null, dur=900, last=null;
    function step(ts){
      if(!t0) t0=ts;
      if(last!==null && el.textContent!==last) return;      // React took over
      var k=Math.min(1,(ts-t0)/dur), e=1-Math.pow(1-k,3);   // ease-out cubic
      last=String(Math.round(target*e));
      el.textContent=last;
      if(k<1) requestAnimationFrame(step); else el.textContent=String(target);
    }
    requestAnimationFrame(step);
  }
  function run(){
    if(done) return true;
    var grid=document.querySelector('main .grid.grid-cols-3');
    if(!grid) return false;
    var cells=[].slice.call(grid.children).slice(0,3), any=false;
    cells.forEach(function(c,i){
      var el=c.firstElementChild;
      if(!el) return;
      var n=parseInt(el.textContent,10);
      if(isNaN(n) || String(n)!==el.textContent.trim() || n<=0) return;
      any=true; el.textContent='0';
      setTimeout(function(){ countUp(el,n); }, 420 + i*90);
    });
    done=true;
    return any || true;
  }
  var t=setInterval(function(){ if(run()) clearInterval(t); }, 200);
  setTimeout(function(){ clearInterval(t); }, 12000);
})();
</script>

<script>
/* Branded toast in place of window.alert.
   Shimming the global rather than editing 20 call sites keeps this a single
   reviewable change and means anything added later gets it for free.
   Caveat handled at the one place that mattered: the restore flow used to
   rely on alert() blocking before location.reload(), so that call site now
   delays its reload instead. confirm() is deliberately untouched — it needs
   to block, and a toast cannot answer a question. */
(function(){
  var host=null, native=window.alert.bind(window);
  function show(msg){
    try{
      if(!host){ host=document.createElement('div'); host.id='aa-toast-host';
                 document.body.appendChild(host); }
      var t=document.createElement('div');
      t.className='aa-toast'; t.setAttribute('role','status');
      t.setAttribute('aria-live','polite'); t.textContent=String(msg);
      host.appendChild(t);
      requestAnimationFrame(function(){ t.classList.add('in'); });
      var life=Math.min(7000, 2600 + String(msg).length*28);
      setTimeout(function(){
        t.classList.remove('in');
        setTimeout(function(){ t.remove(); }, 260);
      }, life);
    }catch(e){ native(msg); }   // never lose a message to a broken toast
  }
  window.alert = show;
})();
</script>

@keyframes bo-shimmer { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

/* ── Result-locked celebration ── */
.bo-ring{position:absolute;width:160px;height:160px;border:3px solid #F7F1E6;border-radius:50%;
  opacity:0;animation:bo-ring 1.6s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes bo-ring{0%{transform:scale(.3);opacity:.8}100%{transform:scale(4.2);opacity:0}}
.bo-pop{position:relative;padding:18px 26px;background:#F7F1E6;color:#B8141F;
  font-family:'Archivo',sans-serif;font-style:italic;
  font-variation-settings:'wdth' 118,'wght' 900;font-size:30px;line-height:1;
  animation:bo-pop 1.6s cubic-bezier(.34,1.56,.64,1) forwards;text-align:center}
@keyframes bo-pop{0%{transform:scale(.7);opacity:0}18%{transform:scale(1);opacity:1}
  72%{transform:scale(1);opacity:1}100%{transform:scale(.96);opacity:0}}
@media (prefers-reduced-motion:reduce){.bo-ring,.bo-pop{animation:none;display:none}}

/* ── Leader sheen: a slow diagonal pass, mostly paused ── */
.bo-sheen{position:relative;overflow:hidden}
.bo-sheen::after{content:"";position:absolute;top:0;bottom:0;width:40%;
  background:linear-gradient(100deg,transparent,rgba(247,241,230,.14),transparent);
  transform:translateX(-160%);animation:bo-sheen 6s ease-in-out infinite}
@keyframes bo-sheen{0%{transform:translateX(-160%)}28%{transform:translateX(320%)}
  100%{transform:translateX(320%)}}

/* ── Rows arrive from below, staggered ── */
.bo-rowin{animation:bo-rowin 420ms cubic-bezier(.34,1.4,.64,1) both}
@keyframes bo-rowin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion:reduce){
  .bo-sheen::after{animation:none;display:none}
  .bo-rowin{animation:none}
}

<style id="vol9-skin">
/* ═══════════════════════════════════════════════════════════════════════
   56 NATIONAL SERIES · VOL.9 SKIN
   ───────────────────────────────────────────────────────────────────────
   Appended as the LAST style block, after every Blackout override layer.
   Each volume's skin is an append-only layer on the one before, so nothing
   above needs deleting.

   The colour sweep in build-national-app.py already re-pointed every
   literal by ROLE. This layer enforces the four things a sweep cannot,
   all of them from brand/national/handoff/HANDOFF.md:

     1. the red ground, with the khanjar tile over it
     2. NO SQUARE BLOCKS — pills everywhere, arches for hero cards
     3. NO DROP SHADOWS — depth is the double-line ring and nothing else
     4. the tab bar as an ink pill floating off the bottom

   It does not touch layout, structure, or scoring.
   ═══════════════════════════════════════════════════════════════════════ */

/* ── 1 · TOKENS ────────────────────────────────────────────────────────
   Named tokens re-pointed so anything added later inherits National rather
   than a Blackout value that happens to still be spelled as a variable.
   The historical names are kept — the JSX references them inline in well
   over a hundred places, and renaming them is a separate job from
   re-skinning.
   ────────────────────────────────────────────────────────────────────── */
:root {
  --bg: #B8141F;          /* the red base */
  --deep: #9E1520;        /* rows, bands, anything ON the base */
  --flag: #D7202E;        /* live, accents */
  --ivory: #F7F1E6;       /* hero cards, and bright type on red */
  --ink: #1A0A0C;         /* text on ivory, CTAs, the tab bar */
  --muted-ink: #6B5A52;   /* secondary text ON IVORY ONLY */
  --rose: #F2B8BC;        /* labels on red — AN ACCENT, NOT A TEXT COLOUR */
  --rose-txt: #F2D0D3;    /* the readable tier of it: 4.72:1 on the base */
  --green: #087A3F;       /* NATIONAL DAY ONLY */
  --inactive: #CBBDB6;

  /* Historical names, re-pointed. */
  --ink2: #9E1520;
  --orange: #F7F1E6;
  --orange-br: #FFFFFF;
  --red: #F7F1E6;
  --blue: #D7202E;
  --blue-deep: #9E1520;
  --blue-soft: #F2B8BC;
  --gold: #D7202E;
  --cream: #FFFFFF;
  --muted: #F2B8BC;
  --muted2: #CBBDB6;
  --line: rgba(247,241,230,.18);
  --line-2: rgba(247,241,230,.12);
  --surface: #9E1520;
  --surface-2: #9E1520;
  --hairline: rgba(247,241,230,.18);

  /* The ones the sweep could not reach, because they are defined as another
     token rather than as a literal — so there was no hex for it to rewrite and
     they quietly kept pointing at a Vol.6/7 value. `--plate` was
     rgba(7,12,17,.94), a blue-black, which is a September Surge colour two
     volumes old still being used as a sheet background. */
  --paper: #B8141F;
  --panel: rgba(158,21,32,.82);
  --plate: rgba(158,21,32,.94);
  --plate-2: rgba(247,241,230,.05);
  --sg-plate-1: rgba(158,21,32,.94);
  --sg-plate-2: rgba(158,21,32,.96);
  --sg-text-2: #F7F1E6;
  --ember: #7C0F18;
  --hair: rgba(247,241,230,.22);
  --neon: rgba(247,241,230,.5);
  --ice: #F7F1E6;
  --tick: #F2B8BC;
  --yellow: #F7F1E6;
  --surge-base: #B8141F;
  --surge-void: #9E1520;
  /* NO GLOWS. Depth here is the double-line ring; a 90px bloom on a red ground
     is a smudge, and this token is read by a dozen components. */
  --glow: none;

  /* NO SQUARE BLOCKS. Anything still reading a radius token gets a rounded
     value, so a component added later cannot reintroduce Blackout's corners.
     The sheet is the default and the pill is for chips — see the shape rules
     below for why a universal pill is wrong. */
  --sheet: 28px;
  --arch: 168px 168px 28px 28px;
  --radius: 28px;
  --radius-sm: 999px;
  --radius-lg: 28px;
}

/* ── 2 · THE GROUND ────────────────────────────────────────────────────
   THE ARTWORK IS THE HANDOFF'S, NOT AN IMPRESSION OF IT. The first version of
   this file drew the khanjar tile as four CSS gradients (two dots and a
   cross-hatch) and the masar band as two repeating-linear-gradients. Both
   look like the brief from across the room; neither is the brief, and the
   repo has shipped the real files since the day the handoff landed.
   A build-time token of the form A-colon-name is replaced with a data: URL
   — see
   ops/national_assets.py, which also strips the 8KB C2PA manifest wrapped
   around every ~400-byte SVG.
   ────────────────────────────────────────────────────────────────────── */
html, body,
html:not(.light) body,
html:not(.dark) body {
  background: var(--bg) !important;
  background-attachment: fixed !important;
}

/* THE KHANJAR TILE AT 340 AND .18, against the handoff's 132 and .14.
   The handoff's figure was set against a 375px frame; at 132 on a real phone
   the emblem reads as noise — you can tell something is there and not what.
   The source is 288px square and carries TWO emblems, so at 340 each one
   lands around 170px: large enough to be the national emblem rather than a
   speckle, and still a ground rather than a picture.
   Above 340 the upscale starts to show. The art is a 288px bitmap and there
   is no more detail in it to enlarge — the only way past that is higher-res
