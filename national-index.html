function MvpVoteTab({ session, state, updateSession, isAdmin, canScore }) {
  const [voterPick, setVoterPick] = useState("");
  const [pick, setPick] = useState("");
  const [justVoted, setJustVoted] = useState("");
  const [showTally, setShowTally] = useState(false);
  const [blocked, setBlocked] = useState(false);

  const eligible = (session.teams || []).flatMap(t => [t.p1Id, t.p2Id]).filter(Boolean).filter((v, i, a) => a.indexOf(v) === i)
    .map(pid => state.players.find(p => p.id === pid)).filter(Boolean)
    .sort((a, b) => a.name.localeCompare(b.name));
  const votable = eligible.filter(p => p.id !== voterPick);

  const votedIds = session.mvpVotedIds || [];
  const alreadyVoted = voterPick && votedIds.includes(voterPick);

  const votes = session.mvpVotes || {};
  const totalVotes = Object.values(votes).reduce((a, b) => a + b, 0);
  const tally = Object.entries(votes)
    .map(([id, count]) => ({ id, count, player: state.players.find(p => p.id === id) }))
    .filter(t => t.player)
    .sort((a, b) => b.count - a.count);
  const mvpPlayer = state.players.find(p => p.id === session.mvpId);

  const startVoting = () => updateSession(s => ({ ...s, mvpVotingOpen: true, mvpVotes: {}, mvpVotedIds: [] }));
  const chooseVoter = (pid) => {
    setVoterPick(pid);
    if (pick === pid) setPick("");
    setBlocked(false);
  };
  const castVote = () => {
    if (!pick || !voterPick) return;
    if ((session.mvpVotedIds || []).includes(voterPick)) { setBlocked(true); return; }
    const name = state.players.find(p => p.id === pick)?.name || "";
    updateSession(s => {
      const v = { ...(s.mvpVotes || {}) };
      v[pick] = (v[pick] || 0) + 1;
      const votedIds = [...(s.mvpVotedIds || []), voterPick];
      return { ...s, mvpVotes: v, mvpVotedIds: votedIds };
    });
    setJustVoted(name);
    setVoterPick("");
    setPick("");
    setTimeout(() => setJustVoted(""), 1800);
  };
  const crownWinner = () => {
    if (tally.length === 0) return;
    updateSession(s => ({ ...s, mvpId: tally[0].id, mvpVotingOpen: false }));
    setShowTally(false);
  };
  const closeVoting = () => updateSession(s => ({ ...s, mvpVotingOpen: false }));
  const reopenVoting = () => updateSession(s => ({ ...s, mvpVotingOpen: true }));
  const resetVotes = () => updateSession(s => ({ ...s, mvpVotes: {}, mvpVotedIds: [] }));

  return (
    <div className="space-y-4">
      <div className="jh-panel jh-fill-yellow" style={{ transform:"none" }}>
        <div style={{ padding: "16px 14px 20px", position: "relative", zIndex: 2 }}>
          <div className="aa-kicker">MVP vote</div>

          {!session.mvpVotingOpen && !session.mvpId && (
            <div style={{ background:"rgba(158,21,32,.85)", border: "1px solid rgba(255,255,255,.10)", boxShadow: "none", padding: "22px 18px", textAlign: "center" }}>
              <div style={{ fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize: 22, color:"#FFFFFF", marginBottom: 10 }}>VOTING HASN'T STARTED</div>
              {canScore
                ? <>
                    <div style={{ fontSize: 13, fontWeight: 700, color:"#F2D0D3", marginBottom: 14 }}>Hand the device around the courts once you open voting.</div>
                    <button className="jh-chipbtn red" style={{ fontSize: 20, width: "100%", justifyContent: "center" }} onClick={startVoting}>▶ START VOTING</button>
                  </>
                : <div style={{ fontSize: 13, fontWeight: 700, color:"#F2D0D3" }}>Ask the scorer to open MVP voting.</div>
              }
            </div>
          )}

          {session.mvpVotingOpen && (
            <div style={{ background:"rgba(158,21,32,.85)", border: "1px solid rgba(255,255,255,.10)", boxShadow: "none", padding: "22px 18px", textAlign: "center", position: "relative" }}>
              {justVoted ? (
                <div style={{ padding: "20px 0" }}>
                  <div style={{ fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize: 30, color: "#3FA33C" }}>Vote locked</div>
                  <div style={{ fontSize: 15, fontWeight: 700, color:"#FFFFFF", marginTop: 6 }}>Thanks for repping <b>{justVoted}</b></div>
                  <div style={{ fontSize: 11, fontWeight: 700, color:"#F2D0D3", marginTop: 10, textTransform: "uppercase", letterSpacing: 1 }}>Pass it to the next voter ▶</div>
                </div>
              ) : (
                <>
                  <div style={{ fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize: 13, letterSpacing: 1, color:"#F2D0D3", marginBottom: 6, textTransform: "uppercase", fontWeight: 700 }}>Step 1</div>
                  <div style={{ fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize: 22, color:"#FFFFFF", marginBottom: 10 }}>WHO ARE YOU?</div>
                  <select value={voterPick} onChange={e => chooseVoter(e.target.value)}
                    style={{ width: "100%", background: "#FFFFFF", border: "1px solid rgba(255,255,255,.10)", padding: "14px 12px", fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize: 20, color:"#FFFFFF", marginBottom: 14 }}>
                    <option value="">— Select your name —</option>
                    {eligible.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                  </select>

                  {voterPick && alreadyVoted && (
                    <div style={{ background: "#F2B8BC", border: "1px solid rgba(255,255,255,.10)", padding: "14px", marginBottom: 14, fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize: 17, color:"#FFFFFF" }}>
                      🚫 {state.players.find(p => p.id === voterPick)?.name} already voted tonight!
                    </div>
                  )}

                  {voterPick && !alreadyVoted && (
                    <>
                      <div style={{ fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize: 13, letterSpacing: 1, color:"#F2D0D3", marginBottom: 6, textTransform: "uppercase", fontWeight: 700 }}>Step 2</div>
                      <div style={{ fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize: 22, color:"#FFFFFF", marginBottom: 10 }}>WHO'S YOUR MVP?</div>
                      <select value={pick} onChange={e => setPick(e.target.value)}
                        style={{ width: "100%", background: "#FFFFFF", border: "1px solid rgba(255,255,255,.10)", padding: "14px 12px", fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize: 20, color:"#FFFFFF", marginBottom: 14 }}>
                        <option value="">— Select a player —</option>
                        {votable.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                      </select>
                      <button className="jh-chipbtn red" disabled={!pick} style={{ fontSize: 22, width: "100%", justifyContent: "center", opacity: pick ? 1 : 0.4, cursor: pick ? "pointer" : "default" }} onClick={castVote}>VOTE! 🔥</button>
                    </>
                  )}
                </>
              )}
              <div style={{ marginTop: 16, fontSize: 11, fontWeight: 700, color:"#F2D0D3", textTransform: "uppercase", letterSpacing: 1 }}>{totalVotes} vote{totalVotes !== 1 ? "s" : ""} cast tonight</div>
            </div>
          )}

          {!session.mvpVotingOpen && session.mvpId && mvpPlayer && (
            <div style={{ background:"rgba(16,23,31,.96)", backgroundImage:"linear-gradient(180deg,#F2B8BC,rgba(242,184,188,.06))", backgroundSize:"3px 100%", backgroundRepeat:"no-repeat", border:"1px solid rgba(242,184,188,.4)", boxShadow:"0 0 40px rgba(242,184,188,.10)", padding: "24px 18px 24px 22px", textAlign: "center" }}>
              <div style={{ display: "flex", justifyContent: "center", marginBottom: 8 }}><CIc.crown size={40} /></div>
              <div style={{ fontSize: 11, fontWeight: 900, letterSpacing: 2, color:"#FFFFFF", textTransform: "uppercase" }}>MVP of the Night</div>
              <div style={{ fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize: 40, color:"#FFFFFF", marginTop: 4 }}>{mvpPlayer.name}</div>
              {canScore && <button className="jh-chipbtn" style={{ marginTop: 14 }} onClick={reopenVoting}>Reopen voting</button>}
            </div>
          )}

          {canScore && session.mvpVotingOpen && (
            <div style={{ marginTop: 14 }}>
              <button className="jh-chipbtn" onClick={() => setShowTally(v => !v)}>{showTally ? "Hide tally" : "View tally"}</button>
              {showTally && (
                <div style={{ marginTop: 10 }}>
                  {tally.length === 0
                    ? <div style={{ fontSize: 13, color:"#F2D0D3", fontWeight: 700, padding: "10px 4px" }}>No votes yet.</div>
                    : tally.map((t, i) => (
                      <div key={t.id} className="jh-mock-row" style={{ transform: `rotate(${i % 2 ? ".4" : "-.4"}deg)` }}>
                        <div className="jh-mock-rank" style={{ background: i === 0 ? "var(--blue)" : "var(--cream)" }}>{i + 1}</div>
                        <div style={{ flex: 1, fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize: 20, color:"#FFFFFF" }}>{t.player.name}</div>
                        <div style={{ fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize: 28, color: "#F7F1E6", WebkitTextStroke:"0" }}>{t.count}</div>
                      </div>
                    ))
                  }
                  <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
                    <button className="jh-chipbtn red" style={{ flex: 1, justifyContent: "center" }} disabled={tally.length === 0} onClick={crownWinner}><CIc.crown size={14} /> Crown Winner</button>
                    <button className="jh-chipbtn" onClick={closeVoting}>⏹ Close</button>
                    <button className="jh-chipbtn" onClick={resetVotes}>🔄 Reset</button>
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function TeamsTab({ session, state, updateSession, update, isAdmin, leaderboard }) {
  const [showAdd, setShowAdd] = useState(false);
  const [showImport, setShowImport] = useState(false);
  const [showSeedModal, setShowSeedModal] = useState(false);
  const [edit, setEdit] = useState(null);
  const teams = session.teams || [];
  const groups = getSessionGroups(session);
  const maxTeams = groups.length * 4;
  const byGroup = groups.reduce((a, g) => (a[g] = teams.filter(t => t.group === g), a), {});

  // manualSeeds: ordered array of teamIds (index 0 = seed 1)
  const manualSeeds = session.manualSeeds || null;

  const lifetimeSorted = [...(leaderboard || [])].sort((a, b) => b.lifetimePts - a.lifetimePts);
  const rankOf = (pid) => { const idx = lifetimeSorted.findIndex(e => e.player.id === pid); return idx === -1 ? 999 : idx; };
  const autoRanked = [...teams].sort((a, b) => (rankOf(a.p1Id) + rankOf(a.p2Id)) - (rankOf(b.p1Id) + rankOf(b.p2Id)));

  // Effective seed order: manual if set, else auto
  const seedOrder = manualSeeds
    ? manualSeeds.map(id => teams.find(t => t.id === id)).filter(Boolean).concat(teams.filter(t => !manualSeeds.includes(t.id)))
    : autoRanked;

  const getSeedNum = (tid) => { const i = seedOrder.findIndex(t => t.id === tid); return i < 8 ? i + 1 : null; };

  const serpentineFromOrder = (ordered, allTeams) => {
    // teams not in ordered go at end
    const sorted = [...ordered, ...allTeams.filter(t => !ordered.find(o => o.id === t.id))];
    const assign = [];
    let dir = 1, gi = 0;
    for (let i = 0; i < sorted.length; i++) {
      assign.push(groups[gi]);
      gi += dir;
      if (gi >= groups.length) { gi = groups.length - 1; dir = -1; }
      else if (gi < 0) { gi = 0; dir = 1; }
    }
    return sorted.map((t, i) => ({ ...t, group: assign[i] }));
  };

  const autoSeedGroups = () => {
    if (teams.length === 0) return;
    const seeded = serpentineFromOrder(seedOrder, teams);
    updateSession(s => ({ ...s, teams: s.teams.map(t => { const u = seeded.find(r => r.id === t.id); return u ? { ...t, group: u.group } : t; }) }));
  };

  const handleImport = (newTeams) => {
    updateSession(s => {
      const all = [...(s.teams || []), ...newTeams];
      const order = manualSeeds
        ? manualSeeds.map(id => all.find(t => t.id === id)).filter(Boolean).concat(all.filter(t => !manualSeeds.includes(t.id)))
        : [...all].sort((a, b) => (rankOf(a.p1Id) + rankOf(a.p2Id)) - (rankOf(b.p1Id) + rankOf(b.p2Id)));
      const seeded = serpentineFromOrder(order, all);
      return { ...s, teams: seeded };
    });
  };

  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between flex-wrap gap-2">
        <div><div className="text-stone-200 font-semibold">{teams.length} / {maxTeams} teams</div>{isAdmin && <div className="text-xs text-stone-500">Tap team to edit · {groups.length} groups</div>}</div>
        {isAdmin && <div className="flex gap-2 flex-wrap">
          {teams.length > 0 && <Btn size="sm" variant="secondary" onClick={() => setShowSeedModal(true)}><I.shield size={14} /> Seeds</Btn>}
          {teams.length > 0 && <Btn size="sm" variant="secondary" onClick={autoSeedGroups}><I.bolt size={14} /> Re-Seed</Btn>}
          <Btn size="sm" variant="secondary" onClick={() => setShowImport(true)}><I.users size={14} /> Import</Btn>
          <Btn size="sm" onClick={() => setShowAdd(true)} disabled={teams.length >= maxTeams}><I.plus size={14} /> Add</Btn>
        </div>}
      </div>
      {groups.map(g => (
        <Card key={g} className="p-3">
          <div className="flex items-center justify-between mb-2">
            <div className="flex items-center gap-2">
              <div style={{ width:32, height:32, display:"flex", alignItems:"center", justifyContent:"center", background:"rgba(247,241,230,.12)", border:"1px solid rgba(247,241,230,.4)", boxShadow:"none", fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize:"20px", letterSpacing:"1px", color:"#FFFFFF" }}>{g}</div>
              <span style={{fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900",fontSize:20,letterSpacing:1,color:"#FFFFFF"}}>GROUP {g}</span>
            </div>
            <span className="text-xs text-stone-500 font-mono">{byGroup[g].length} / 4</span>
          </div>
          {byGroup[g].length === 0 ? <div className="text-xs text-stone-600 italic px-2 py-3 text-center border border-dashed border-stone-800 rounded-lg">Empty</div>
            : (() => {
              // THE TABLE, NOT THE DRAW. Ordered by the app's own group
              // standings, so this screen and the GROUPS screen and the
              // bracket cannot tell three different stories.
              const rowsG = calcGroupStandings(session, g);
              const through = qualifyingTeamIds(session);
              const anyPlayed = rowsG.some(r => r.played > 0);
              const ordered = anyPlayed
                ? rowsG
                : byGroup[g].map(t => ({ team: t, pts: 0, wins: 0, played: 0,
                                         gf: 0, ga: 0, gd: 0 }));
              return <div>
                {anyPlayed && <div style={{ display:"flex", alignItems:"center", gap:6,
                  padding:"0 2px 6px", fontFamily:"'JetBrains Mono',monospace",
                  fontWeight:700, fontSize:9, letterSpacing:".2em", color:"#F2D0D3" }}>
                  <span style={{ flex:"0 0 15px" }} />
                  <span style={{ flex:1 }}>TEAM</span>
                  <span style={{ flex:"0 0 18px", textAlign:"right" }}>W</span>
                  <span style={{ flex:"0 0 28px", textAlign:"right" }}>GD</span>
                  <span style={{ flex:"0 0 26px", textAlign:"right" }}>PTS</span>
                </div>}
                <div className="space-y-1">{ordered.map((r, ri) => {
                const t = r.team;
                const p1 = state.players.find(p => p.id === t.p1Id);
                const p2 = state.players.find(p => p.id === t.p2Id);
                const seed = getSeedNum(t.id);
                // Nothing is marked as qualifying before a ball is hit. With
                // every team level on nothing, a green edge is not a
                // prediction, it is the draw order wearing the flag. Same
                // rule the wall already works under.
                // `qualifyingTeamIds` returns a SET, not an array. Caught by
                // rendering the screen; `.includes` on it throws and takes the
                // whole night view down, which is the entire session screen.
                const qual = anyPlayed && through.has(t.id);
                return <button key={t.id} onClick={() => isAdmin && setEdit(t)}
                  className="w-full flex items-center p-2 text-left"
                  style={{ minHeight:44, background:"rgba(247,241,230,.05)",
                           gap:6, paddingLeft:6 }}>
                  {/* A BAR, NOT A BORDER. A `border-left` on a row that
                      carries the sheet radius is bent by it — the mark came
                      out as a green crescent down the side of the pill, which
                      is the same fault as a radius on a hairline, one layer in.
                      The row has a background of its own, so the skin’s rule for
                      that cannot reach it: a surface with one drawn edge is a
                      card, and this needed to stop being an edge. */}
                  <span aria-hidden="true" style={{ flex:"0 0 4px", height:22,
                    background: qual ? "#087A3F" : "transparent" }} />
                  {anyPlayed
                    ? <span style={{ flex:"0 0 15px", fontFamily:"'JetBrains Mono',monospace",
                        fontWeight:700, fontSize:12, color: qual ? "#F7F1E6" : "#F2D0D3" }}>{ri + 1}</span>
                    : (seed
                      ? <span className="text-[9px] font-bold px-1.5 py-0.5 font-mono shrink-0 text-center"
                          style={{ background: seed <= 4 ? "#F7F1E6" : "rgba(255,255,255,.08)",
                            color: seed <= 4 ? "#B8141F" : "#F2D0D3",
                            border:"1px solid rgba(255,255,255,.14)", borderRadius: 28, minWidth:28 }}>S{seed}</span>
                      : <span className="shrink-0" style={{ width:18 }} aria-hidden="true" />)}
                  <span className="flex items-center shrink-0" style={{ marginRight:2 }}>
                    {p1 && <Avatar player={p1} size={22} />}
                    {p2 && <span style={{ marginLeft:-7 }}><Avatar player={p2} size={22} /></span>}
                  </span>
                  <div className="flex-1 min-w-0">
                    {/* THE PAIR IS STACKED, and it is not a style choice. A
                        doubles name beside W, GD and PTS gets 112px at 360 and
                        142 at 390; measured on the real roster,
                        "Muntaser & Mohammed" wants 190, and four of the sixteen
                        pairs overflow even at 390. There is no column width that
                        closes a 78px gap — shaving the numbers only moves which
                        names get cut. One per line fits every pair at every size,
                        and the two overlapping faces beside them already say it
                        is a pair, so the ampersand is not carrying anything. */}
                    {anyPlayed ? <>
                      <div className="truncate" style={{ fontSize:13, lineHeight:1.25,
                        color:"#F7F1E6" }}>{(p1?.name || "?").split(" ")[0]}</div>
                      <div className="truncate" style={{ fontSize:13, lineHeight:1.25,
                        color:"#F7F1E6" }}>{(p2?.name || "?").split(" ")[0]}</div>
                    </> : <div className="text-sm text-stone-100 truncate">
                      {(p1?.name || "?") + " & " + (p2?.name || "?")}</div>}
                  </div>
                  {anyPlayed && <>
                    <span style={{ flex:"0 0 18px", textAlign:"right",
                      fontFamily:"'JetBrains Mono',monospace", fontSize:12, color:"#F7F1E6" }}>{r.wins}</span>
                    <span style={{ flex:"0 0 28px", textAlign:"right",
                      fontFamily:"'JetBrains Mono',monospace", fontSize:12, color:"#F2D0D3" }}>{r.gd > 0 ? "+" + r.gd : r.gd}</span>
                    <span style={{ flex:"0 0 26px", textAlign:"right",
                      fontFamily:"'Archivo',sans-serif", fontStyle:"italic",
                      fontVariationSettings:"'wdth' 125,'wght' 900", fontSize:18, color:"#F7F1E6" }}>{r.pts}</span>
                  </>}
                  {isAdmin && !anyPlayed && <I.edit size={12} className="text-stone-500" />}
                </button>;
              })}</div>
              {anyPlayed && <div style={{ display:"flex", alignItems:"center", gap:7,
                padding:"9px 2px 2px", fontFamily:"'JetBrains Mono',monospace",
                fontWeight:700, fontSize:9, letterSpacing:".18em", color:"#F2D0D3" }}>
                <span style={{ width:14, height:4, background:"#087A3F" }} />
                THROUGH TO THE KNOCKOUT
              </div>}
            </div>;
            })()}
        </Card>
      ))}
      {showAdd && <TeamFormModal title="ADD TEAM" state={state} session={session} groups={groups} onClose={() => setShowAdd(false)} onSave={(t) => updateSession(s => ({ ...s, teams: [...(s.teams || []), { id: uid("t"), ...t }] }))} />}
      {edit && <TeamFormModal title="EDIT TEAM" state={state} session={session} groups={groups} initial={edit} onClose={() => setEdit(null)} onSave={(t) => updateSession(s => ({ ...s, teams: s.teams.map(x => x.id === edit.id ? { ...x, ...t } : x) }))} onDelete={() => updateSession(s => ({ ...s, teams: s.teams.filter(x => x.id !== edit.id) }))} />}
      {showImport && <WhatsAppTeamImportModal onClose={() => setShowImport(false)} state={state} session={session} leaderboard={leaderboard || []} onImport={handleImport} update={update} />}
      {showSeedModal && <ManualSeedModal teams={teams} seedOrder={seedOrder} state={state} onClose={() => setShowSeedModal(false)} onSave={(order) => updateSession(s => ({ ...s, manualSeeds: order.map(t => t.id) }))} />}
    </div>
  );
}

function ManualSeedModal({ teams, seedOrder, state, onClose, onSave }) {
  const [order, setOrder] = useState([...seedOrder]);
  const lbl = (t) => {
    const p1 = state.players.find(p => p.id === t.p1Id);
    const p2 = state.players.find(p => p.id === t.p2Id);
    return `${p1?.name?.split(" ")[0] || "?"} & ${p2?.name?.split(" ")[0] || "?"}`;
  };
  const move = (i, dir) => {
    const j = i + dir;
    if (j < 0 || j >= order.length) return;
    const next = [...order];
    [next[i], next[j]] = [next[j], next[i]];
    setOrder(next);
  };
  return <Modal open={true} onClose={onClose} title="SET SEEDS">
    <div className="space-y-3">
      <div className="text-xs text-stone-400">Re-Seed distributes teams by all-time lifetime points — best players spread evenly across groups (snake order).</div>
      <div className="space-y-1 max-h-80 overflow-y-auto pr-1">
        {order.map((t, i) => (
          <div key={t.id} className="flex items-center gap-2 px-2 py-1.5 rounded-lg" style={{ background: i < 8 ? (i < 4 ? "rgba(247,241,230,.08)" : "rgba(255,255,255,.03)") : "transparent", border: `1px solid ${i < 4 ? "rgba(247,241,230,.18)" : i < 8 ? "rgba(255,255,255,.06)" : "rgba(255,255,255,.03)"}` }}>
            <span className="font-mono text-xs w-5 text-center font-bold" style={{ color: i < 4 ? "var(--orange-br)" : i < 8 ? "var(--muted)" : "var(--muted2)" }}>S{i + 1}</span>
            <span className="flex-1 text-sm text-stone-200 truncate">{lbl(t)}</span>
            <div className="flex gap-1">
              <button onClick={() => move(i, -1)} disabled={i === 0} className="w-6 h-6 rounded bg-stone-800 border border-stone-700 text-stone-400 hover:text-stone-100 disabled:opacity-25 flex items-center justify-center text-xs">↑</button>
              <button onClick={() => move(i, 1)} disabled={i === order.length - 1} className="w-6 h-6 rounded bg-stone-800 border border-stone-700 text-stone-400 hover:text-stone-100 disabled:opacity-25 flex items-center justify-center text-xs">↓</button>
            </div>
          </div>
        ))}
      </div>
      <div className="flex gap-2 pt-1">
        <Btn variant="ghost" onClick={onClose} className="ml-auto">Cancel</Btn>
        <Btn onClick={() => { onSave(order); onClose(); }}>Save Seeds</Btn>
      </div>
    </div>
  </Modal>;
}

function TeamFormModal({ title, state, session, groups, initial, onClose, onSave, onDelete }) {
  const grps = groups || GROUPS;
  const [p1, setP1] = useState(initial?.p1Id || "");
  const [p2, setP2] = useState(initial?.p2Id || "");
  const [g, setG] = useState(initial?.group || grps[0] || "A");
  const warn = useMemo(() => {
    if (!p1 || !p2) return null;
    const others = state.sessions.filter(s => s.id !== session.id);
    const locked = getLockedPartners(p1, others);
    return locked.has(p2) ? "These players won a final together before. Loyalty Lockout!" : null;
  }, [p1, p2, state.sessions, session.id]);
  const used = (session.teams || []).filter(t => !initial || t.id !== initial.id).flatMap(t => [t.p1Id, t.p2Id]);
  return <Modal open={true} onClose={onClose} title={title}>
    <div className="space-y-3">
      <div><label className="text-xs text-stone-400 uppercase tracking-wider font-semibold mb-1 block">Player 1</label><PlayerPicker players={state.players} value={p1} onChange={setP1} exclude={[...used, p2].filter(Boolean)} /></div>
      <div><label className="text-xs text-stone-400 uppercase tracking-wider font-semibold mb-1 block">Player 2</label><PlayerPicker players={state.players} value={p2} onChange={setP2} exclude={[...used, p1].filter(Boolean)} /></div>
      {warn && <div className="flex gap-2 p-2.5 rounded-lg border bg-red-950/30 border-red-900/50 text-red-300 text-xs"><I.lock size={14} className="shrink-0 mt-0.5" /><span>{warn}</span></div>}
      <div><label className="text-xs text-stone-400 uppercase tracking-wider font-semibold mb-1 block">Group</label>
        <div className={`grid gap-2`} style={{gridTemplateColumns:`repeat(${grps.length},1fr)`}}>{grps.map(x => <button key={x} type="button" onClick={() => setG(x)} className={`py-2 rounded-lg font-display text-lg ${g === x ? "bg-gradient-to-b from-orange-500 to-red-600 text-white shadow-lg" : "bg-stone-900 text-stone-300 border border-stone-700"}`}>{x}</button>)}</div>
      </div>
      <div className="flex gap-2 pt-2">
        {onDelete && <Btn variant="danger" onClick={() => { onDelete(); onClose(); }}><I.trash size={14} /></Btn>}
        <Btn variant="ghost" onClick={onClose} className="ml-auto">Cancel</Btn>
        <Btn onClick={() => { if (p1 && p2) { onSave({ p1Id: p1, p2Id: p2, group: g }); onClose(); } }} disabled={!p1 || !p2}>Save</Btn>
      </div>
    </div>
  </Modal>;
}

function GroupsTab({ session, state, updateSession, isAdmin }) {
  const [edit, setEdit] = useState(null);
  const [add, setAdd] = useState(null);
  const groups = getSessionGroups(session);
  const [pick, setPick] = useState(groups[0] || "A");
  const g = groups.includes(pick) ? pick : groups[0];
  const groupSizes = groups.map(x => (session.teams || []).filter(t => t.group === x).length);
  const isUneven = groupSizes.length > 1 && new Set(groupSizes).size > 1;
  const [showRules, setShowRules] = useState(false);
  // Same rule the bracket seeds from, so the table cannot promise a spot the
  // knockout won't honour.
  const qualIds = qualifyingTeamIds(session);

  const teams = (session.teams || []).filter(t => t.group === g);
  const matches = (session.groupMatches || []).filter(m =>
    teams.find(t => t.id === m.team1Id) && teams.find(t => t.id === m.team2Id));
  const standings = calcGroupStandings(session, g);
  const top = getTopOfGroup(session, g);
  const first = (id) => { const p = state.players.find(x => x.id === id); return p ? p.name.split(" ")[0] : "?"; };
  const lbl = (t) => t ? `${first(t.p1Id)} & ${first(t.p2Id)}` : "?";
  const inits = (t) => t ? [t.p1Id, t.p2Id].map(id => {
    const p = state.players.find(x => x.id === id);
    return p ? (p.name[0] || "?").toUpperCase() : "?";
  }) : ["?", "?"];

  // What qualification actually is for THIS session, said plainly.
  const N = groups.length;
  const qLabel = N === 4 && session.thirdPlaceMode === "all4r16" ? "ALL THIRDS QUALIFY"
    : N === 3 ? "TOP 2 + BEST THIRDS QUALIFY"
    : `TOP ${getQualifyCount(session)} QUALIFY`;

  // Played against SCHEDULED, not against whatever has been entered. A group
  // of 3 plays three fixtures; with one entered the old count read 1/1, which
  // says finished when two are still to come.
  const fx = groupFixtures(session, g);
  const played = fx.played;

  return (
    <div className="space-y-4">
      {(() => {
        // Say it on the screen, so nobody wonders where the points came from.
        const small = groups.filter(x => {
          const n = (session.teams || []).filter(t => t.group === x).length;
          return n > 0 && n <= GROUP_COUNTED_GAMES;
        });
        if (!small.length) return null;
        const plays = Math.max(0, (session.teams || []).filter(t => t.group === small[0]).length - 1);
        return <div className="flex gap-2.5 p-3" style={{ background:"rgba(247,241,230,.08)", border:"1px solid rgba(247,241,230,.35)" }}>
          <I.alert size={16} className="shrink-0 mt-0.5" style={{ color:"#F7F1E6" }} />
          <div>
            <div className="text-xs font-bold" style={{ color:"#F7F1E6" }}>Bye awarded · group {small.join(" and ")}</div>
            <div className="text-[11px] mt-0.5" style={{ color:"#F7F1E6" }}>Your best 3 group results count, and this group only plays {plays} — so every team in it carries a notional 6&ndash;0 bye win, marked +BYE below. It counts the same in the table, in your series points and in the knockout seeding, so the draw costs nobody anything.</div>
          </div>
        </div>;
      })()}
      {isUneven && (
        <div className="flex gap-2.5 p-3" style={{ background:"rgba(242,184,188,.10)", border:"1px solid rgba(242,184,188,.35)" }}>
          <I.alert size={16} className="shrink-0 mt-0.5" style={{ color:"#F2B8BC" }} />
          <div>
            <div className="text-xs font-bold" style={{ color:"#F2B8BC" }}>Uneven groups</div>
            <div className="text-[11px] mt-0.5" style={{ color:"#F7F1E6" }}>Groups have different team counts ({groupSizes.join(" / ")}). Everyone is still ranked on the same number of results — the best {GROUP_COUNTED_GAMES} — so a larger group drops its lowest and a group too small to play {GROUP_COUNTED_GAMES} carries byes to make them up. That holds for the table, the series points and the knockout seeding alike.</div>
          </div>
        </div>
      )}

      {/* ── GROUP CHIPS — one group at a time ── */}
      <div style={{display:"grid",gridTemplateColumns:`repeat(${Math.max(1, groups.length)},minmax(0,1fr))`,gap:6}}>
        {groups.map(x => {
          const on = x === g;
          const n = (session.teams || []).filter(t => t.group === x).length;
          const fx = groupFixtures(session, x);
          return <div key={x} onClick={() => setPick(x)}
            style={{cursor:"pointer",minHeight:52,padding:"9px 4px",textAlign:"center",
                    background:on ? "rgba(247,241,230,.12)" : "rgba(158,21,32,.94)",
                    border:`1px solid ${on ? "rgba(247,241,230,.55)" : "rgba(242,208,211,.3)"}`}}>
            <div style={{fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 118,'wght' 900",
                 fontSize:21,lineHeight:1,color:on ? "#F7F1E6" : "#F7F1E6"}}>{x}</div>
            <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10,marginTop:4,
                 color:on ? "#F7F1E6" : "#F7F1E6"}}>{fx.played}/{fx.total} · {n}</div>
          </div>;
        })}
      </div>

      {/* ── STANDINGS ── */}
      <div style={{marginTop:14,padding:16,background:"rgba(158,21,32,.94)",
           backgroundImage:"linear-gradient(180deg,#F7F1E6,rgba(247,241,230,.06))",
           backgroundSize:"3px 100%",backgroundRepeat:"no-repeat",position:"relative",overflow:"hidden"}}>
        <div style={{position:"absolute",right:8,bottom:-26,fontFamily:"'Archivo',sans-serif",fontStyle:"italic",
             fontVariationSettings:"'wdth' 125,'wght' 900",fontSize:96,lineHeight:1,
             color:"rgba(255,255,255,.035)",pointerEvents:"none"}}>{g}</div>
        <div style={{position:"relative",display:"flex",alignItems:"center",gap:10}}>
          <div style={{width:36,height:36,display:"grid",placeItems:"center",background:"rgba(247,241,230,.12)",
               border:"1px solid rgba(247,241,230,.45)",fontFamily:"'Archivo',sans-serif",fontStyle:"italic",
               fontVariationSettings:"'wdth' 125,'wght' 900",fontSize:20,color:"#F7F1E6"}}>{g}</div>
          <div style={{fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 118,'wght' 900",
               fontSize:20,lineHeight:1,color:"#FFFFFF"}}>GROUP {g}</div>
          <div style={{marginLeft:"auto",fontFamily:"'Archivo',sans-serif",fontWeight:800,fontSize:9,
               letterSpacing:".18em",color:fx.played === fx.total ? "#F7F1E6" : "#F7F1E6"}}>{played}/{fx.total} PLAYED</div>
        </div>

        {standings.length === 0
          ? <div style={{position:"relative",marginTop:12,padding:16,textAlign:"center",
                 border:"1px dashed rgba(247,241,230,.22)",fontFamily:"'Archivo',sans-serif",fontWeight:800,
                 fontSize:11,letterSpacing:".12em",color:"#F7F1E6"}}>NO RESULTS YET</div>
          : <div style={{position:"relative",display:"grid",gridTemplateColumns:"1fr 40px 44px 56px",marginTop:12}}>
              <div style={{fontFamily:"'Archivo',sans-serif",fontWeight:800,fontSize:10,letterSpacing:".2em",color:"#F7F1E6",paddingBottom:8}}>TEAM</div>
              <div style={{fontFamily:"'Archivo',sans-serif",fontWeight:800,fontSize:10,letterSpacing:".2em",color:"#F7F1E6",textAlign:"center",paddingBottom:8}}>W</div>
              <div style={{fontFamily:"'Archivo',sans-serif",fontWeight:800,fontSize:10,letterSpacing:".2em",color:"#F7F1E6",textAlign:"center",paddingBottom:8}}>GD</div>
              <div style={{fontFamily:"'Archivo',sans-serif",fontWeight:800,fontSize:10,letterSpacing:".2em",color:"#F7F1E6",textAlign:"right",paddingBottom:8}}>PTS</div>
              {standings.map((r) => {
                const q = qualIds.has(r.team.id);
                const isTop = r.team.id === top;
                const [i1, i2] = inits(r.team);
                const cell = { borderTop:"1px solid rgba(242,208,211,.16)", padding:"10px 0" };
                return <React.Fragment key={r.team.id}>
                  <div style={{...cell, display:"flex",alignItems:"center",gap:8,paddingLeft:10,
                       boxShadow:q ? "inset 3px 0 0 var(--surge-cyan)" : "none"}}>
                    <div style={{display:"flex",flex:"0 0 auto",gap:2}}>
                      {[i1, i2].map((c, n2) => <div key={n2} style={{width:23,height:23,display:"grid",placeItems:"center",
                           background:q ? "rgba(247,241,230,.10)" : "rgba(255,255,255,.04)",
                           border:`1px solid ${q ? "rgba(247,241,230,.28)" : "rgba(242,208,211,.28)"}`,
                           fontFamily:"'JetBrains Mono',monospace",fontSize:10,fontWeight:700,
                           color:q ? "#F7F1E6" : "#F7F1E6"}}>{c}</div>)}
                    </div>
                    <div style={{minWidth:0,display:"flex",alignItems:"center",gap:6}}>
                      <span style={{minWidth:0,fontFamily:"'Archivo',sans-serif",fontWeight:800,fontSize:14,
                           color:"#FFFFFF",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>
                        {isTop && <span style={{color:"#F7F1E6",marginRight:4}}>&#9650;</span>}{lbl(r.team)}</span>
                      {r.byes > 0 && <span title="Notional 6-0 bye — this group is too small to play three matches"
                           style={{flex:"0 0 auto",padding:"1px 5px",background:"rgba(242,184,188,.14)",
                                   border:"1px solid rgba(242,184,188,.4)",fontFamily:"'JetBrains Mono',monospace",
                                   fontSize:9,fontWeight:700,color:"#F2B8BC"}}>+BYE</span>}
                    </div>
                  </div>
                  <div style={{...cell, display:"grid",placeItems:"center",fontFamily:"'JetBrains Mono',monospace",fontSize:14,color:"#FFFFFF"}}>{r.wins}</div>
                  <div style={{...cell, display:"grid",placeItems:"center",fontFamily:"'JetBrains Mono',monospace",fontSize:13,color:"#F7F1E6"}}>{r.gd > 0 ? "+" : ""}{r.gd}</div>
                  <div style={{...cell, display:"flex",alignItems:"center",justifyContent:"flex-end",
                       fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 112,'wght' 900",
                       fontSize:20,color:q ? "#F7F1E6" : "#FFFFFF"}}>{r.pts}</div>
                </React.Fragment>;
              })}
            </div>}

        <div style={{position:"relative",display:"flex",alignItems:"center",gap:8,marginTop:12,paddingTop:12,
             borderTop:"1px solid rgba(242,208,211,.16)"}}>
          <div style={{fontFamily:"'Archivo',sans-serif",fontWeight:800,fontSize:9,letterSpacing:".28em",color:"#F7F1E6"}}>{qLabel} &#9654;</div>
          <div style={{flex:1,height:2,background:"linear-gradient(90deg,rgba(247,241,230,.5),transparent)"}} />
        </div>
      </div>

      {/* ── MATCHES ── */}
      <div style={{display:"flex",alignItems:"center",gap:10,marginTop:20}}>
        <div className="sg-kicker">Group {g} matches</div>
        {isAdmin && teams.length >= 2 && <div style={{marginLeft:"auto"}}>
          <Btn size="sm" variant="secondary" onClick={() => setAdd(g)}><I.plus size={12} /> Match</Btn></div>}
      </div>
      {matches.length === 0
        ? <div style={{marginTop:10,padding:18,textAlign:"center",border:"1px dashed rgba(247,241,230,.22)",
               fontFamily:"'Archivo',sans-serif",fontWeight:800,fontSize:11,letterSpacing:".12em",color:"#F7F1E6"}}>NO MATCHES YET</div>
        : <div style={{display:"flex",flexDirection:"column",gap:10,marginTop:10}}>
            {matches.map((m, mi) => {
              const t1 = (session.teams || []).find(t => t.id === m.team1Id);
              const t2 = (session.teams || []).find(t => t.id === m.team2Id);
              const done = !!m.winner;
              const w1 = m.winner === "team1", w2 = m.winner === "team2";
              const bar = done ? "#F7F1E6" : "#F2D0D3";
              return <div key={m.id} onClick={() => isAdmin && setEdit({ ...m, group: g })}
                style={{cursor:isAdmin ? "pointer" : "default",padding:14,background:"rgba(158,21,32,.94)",
                        backgroundImage:`linear-gradient(180deg,${bar},rgba(242,208,211,.05))`,
                        backgroundSize:"3px 100%",backgroundRepeat:"no-repeat"}}>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
