}

function MeView({ state, leaderboard, meId, onOpenPicker, setTab, setOpenPlayerId }) {
  const [receipt, setReceipt] = React.useState(null);
  const [share, setShare] = React.useState(null);
  const players = state.players || [];
  const sessions = state.sessions || [];
  const nameOf = React.useCallback((s, teamId, pidDirect) => {
    if (pidDirect) return (players.find(p => p.id === pidDirect) || {}).name || "?";
    const t = (s.teams || []).find(x => x.id === teamId);
    if (!t) return "?";
    const n = id => ((players.find(p => p.id === id) || {}).name || "?").split(" ")[0];
    return n(t.p1Id) + " & " + n(t.p2Id);
  }, [players]);

  if (!meId) {
    return (
      <div style={{ padding: "48px 0", textAlign: "center" }}>
        <div style={{ fontStyle: "italic", fontVariationSettings: "'wdth' 125,'wght' 900",
                      fontSize: 34, lineHeight: .95 }}>WHICH ONE<br />ARE YOU?</div>
        <div style={{ fontSize: 13, color: "#F2D0D3", marginTop: 12, maxWidth: 280,
                      margin: "12px auto 0" }}>
          Pick your name once and this screen shows every point you have, and where it came from.
        </div>
        <button onClick={onOpenPicker} style={{ marginTop: 22, padding: "14px 28px",
          background: "#F7F1E6", color: "#B8141F", border: "none", cursor: "pointer",
          fontFamily: "'JetBrains Mono',monospace", fontWeight: 700, fontSize: 12,
          letterSpacing: ".24em" }}>PICK YOUR NAME &#9654;</button>
      </div>
    );
  }

  const me = players.find(p => p.id === meId);
  const data = calcPlayerNights(meId, sessions, nameOf);
  const ranks = React.useMemo(() => rankByNight(players, sessions), [players, sessions]);
  const badges = calcBadges(meId, sessions, players, data, ranks);
  const rank = leaderboard.findIndex(e => e.player.id === meId) + 1;
  const bestNight = Math.max(1, ...leaderboard.flatMap(() => []), ...data.nights.map(n => n.nightTotal));
  const unlocked = badges.filter(b => b.got).length;

  // Everything the story cards need, derived from what this screen already has
  // rather than recomputed -- a card that disagrees with the screen above it is
  // worse than no card.
  const lastNight = data.nights.length ? data.nights[data.nights.length - 1] : null;
  const lastSession = lastNight ? sessions[lastNight.idx] : null;
  const champTeam = lastSession?.bracket?.final?.winner
    ? (lastSession.teams || []).find(t =>
        t.id === (lastSession.bracket.final.winner === "team1"
          ? lastSession.bracket.final.team1Id : lastSession.bracket.final.team2Id))
    : null;
  const showBadge = badges.find(b => b.got) || badges[0];
  const pool = 14 * 2 * SESSIONS_TOTAL + SEASON_PRIZES.reduce((a, b) => a + b, 0);
  const shareData = {
    night: lastNight ? {
      no: lastNight.no, date: lastNight.date, name: me?.name, total: lastNight.nightTotal,
      rank: rank || "-", series: data.total,
      lines: lastNight.events.filter(e => e.pts > 0).slice(0, 4)
                 .map(e => ({ label: e.label, pts: e.pts })),
      caption: `${lastNight.nightTotal} points on session ${lastNight.no}. `
             + `#${rank || "-"} in the 56 National Series on ${data.total}. `
             + `national.urbanpadel.om`,
    } : {},
    champs: champTeam ? {
      no: lastNight.no, date: lastNight.date,
      champs: [champTeam.p1Id, champTeam.p2Id]
        .map(id => (players.find(p => p.id === id) || {}).name || "?"),
      score: lastSession.bracket.final.score
        ? lastSession.bracket.final.score.t1 + "\u2013" + lastSession.bracket.final.score.t2 : "",
      caption: `Session ${lastNight.no} champions. 14 OMR voucher each. national.urbanpadel.om`,
    } : {},
    top5: {
      rows: leaderboard.slice(0, 5).map(e => ({ name: e.player.name, pts: e.totalPts })),
      pool,
      caption: `Top 5 in the 56 National Series. Playing for ${pool} OMR. national.urbanpadel.om`,
    },
    badge: showBadge ? {
      code: showBadge.code, name: showBadge.name, desc: showBadge.desc,
      got: !!showBadge.got, player: me?.name,
      caption: `${showBadge.got ? "Unlocked" : "Chasing"}: ${showBadge.name} \u2014 ${showBadge.desc}. `
             + `national.urbanpadel.om`,
    } : {},
  };

  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
        <BoMark size={14} />
        <div style={{ fontFamily: "'JetBrains Mono',monospace", fontWeight: 700, fontSize: 10,
                      letterSpacing: ".28em", color: "#F2D0D3" }}>
          YOUR SEASON &middot; {(me?.name || "").toUpperCase()}
        </div>
      </div>
      <div style={{ fontStyle: "italic", fontVariationSettings: "'wdth' 125,'wght' 900",
                    fontSize: 46, lineHeight: .9, marginTop: 6 }}>MY POINTS</div>

      {/* summary */}
      <div style={{ border: "1px solid rgba(247,241,230,.35)", background: "rgba(158,21,32,.94)",
                    padding: 18, marginTop: 18 }}>
        <div style={{ display: "flex", alignItems: "flex-end", justifyContent: "space-between" }}>
          <div>
            <div style={{ fontFamily: "'JetBrains Mono',monospace", fontWeight: 700, fontSize: 9,
                          letterSpacing: ".26em", color: "#F2D0D3" }}>SERIES POINTS</div>
            <div style={{ fontFamily: "'JetBrains Mono',monospace", fontWeight: 700, fontSize: 62,
                          lineHeight: 1, color: "#F7F1E6" }}><CountUp to={data.total} /></div>
          </div>
          <div style={{ textAlign: "right" }}>
            <div style={{ fontFamily: "'JetBrains Mono',monospace", fontWeight: 700, fontSize: 9,
                          letterSpacing: ".26em", color: "#F2D0D3" }}>RANK</div>
            <div style={{ fontFamily: "'JetBrains Mono',monospace", fontWeight: 700, fontSize: 38,
                          lineHeight: 1, color: rank && rank <= 3 ? "#F7F1E6" : "#F2B8BC" }}>
              {rank ? "#" + rank : "–"}
            </div>
          </div>
        </div>
        {!data.ok && (
          <div style={{ marginTop: 12, padding: 10, border: "1px solid #F2B8BC", color: "#F2B8BC",
                        fontSize: 12 }}>
            This breakdown sums to {data.total} but the table says {data.ref}. The table is
            right — please report this.
          </div>
        )}
        <StackedBar seg={data.seg} total={data.total} />
        <SegLegend seg={data.seg} />
      </div>

      {/* night by night */}
      <div style={{ fontFamily: "'JetBrains Mono',monospace", fontWeight: 700, fontSize: 10,
                    letterSpacing: ".28em", color: "#F2D0D3", marginTop: 28 }}>NIGHT BY NIGHT</div>
      {data.nights.length === 0 && (
        <div style={{ fontSize: 13, color: "#F2D0D3", marginTop: 12 }}>
          No nights played yet. Your first receipt appears after your first match.
        </div>
      )}
      {[...data.nights].reverse().map(n => (
        <button key={n.id} onClick={() => setReceipt(n)} style={{ width: "100%", textAlign: "left",
          display: "flex", alignItems: "center", gap: 14, padding: "14px 0",
          borderBottom: "1px solid rgba(242,208,211,.16)", background: "transparent",
          border: "none", borderBottomStyle: "solid", cursor: "pointer", color: "inherit" }}>
          <div style={{ width: 44, height: 44, flexShrink: 0, border: "1px solid rgba(247,241,230,.4)",
                        display: "flex", alignItems: "center", justifyContent: "center",
                        fontFamily: "'JetBrains Mono',monospace", fontWeight: 700, fontSize: 18,
                        color: "#F7F1E6" }}>{n.no}</div>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <span style={{ fontWeight: 800, fontSize: 14 }}>{n.outcome}</span>
              {n.x2 && <span style={{ fontFamily: "'JetBrains Mono',monospace", fontWeight: 700,
                fontSize: 9, letterSpacing: ".2em", color: "#F2B8BC",
                border: "1px solid rgba(242,184,188,.5)", padding: "1px 5px" }}>2X</span>}
            </div>
            <div style={{ fontSize: 12, color: "#F2D0D3", marginTop: 2 }}>{n.date}</div>
            <div style={{ height: 4, background: "rgba(242,208,211,.2)", marginTop: 7 }}>
              <div style={{ height: "100%", background: "#F7F1E6",
                            width: Math.round(n.nightTotal / bestNight * 100) + "%" }} />
            </div>
          </div>
          <div style={{ fontFamily: "'JetBrains Mono',monospace", fontWeight: 700, fontSize: 24,
                        color: "#F7F1E6" }}>+{n.nightTotal}</div>
          <span style={{ color: "#F2D0D3" }}>&#9654;</span>
        </button>
      ))}

      <RankPath meId={meId} state={state} />
      <TopPartners meId={meId} state={state} setOpenPlayerId={setOpenPlayerId} />

      {/* badges */}
      <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between",
                    marginTop: 28 }}>
        <div style={{ fontFamily: "'JetBrains Mono',monospace", fontWeight: 700, fontSize: 10,
                      letterSpacing: ".28em", color: "#F2D0D3" }}>BADGES</div>
        <div style={{ fontFamily: "'JetBrains Mono',monospace", fontWeight: 700, fontSize: 11,
                      color: "#F7F1E6" }}>{unlocked} OF {badges.length}</div>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginTop: 12 }}>
        {badges.map(b => (
          <div key={b.code} style={{ display: "flex", gap: 10, padding: 12,
            border: "1px solid " + (b.got ? "rgba(247,241,230,.4)" : "rgba(242,208,211,.2)"),
            background: b.got ? "rgba(247,241,230,.06)" : "transparent" }}>
            <div style={{ width: 44, height: 44, flexShrink: 0,
              background: b.got ? "#F7F1E6" : "transparent",
              border: b.got ? "none" : "1px solid rgba(242,208,211,.4)",
              color: b.got ? "#B8141F" : "#F2D0D3",
              display: "flex", alignItems: "center", justifyContent: "center",
              fontFamily: "'JetBrains Mono',monospace", fontWeight: 700, fontSize: 15 }}>{b.code}</div>
            <div style={{ minWidth: 0 }}>
              <div style={{ fontWeight: 800, fontSize: 13,
                            color: b.got ? "#FFFFFF" : "#F2D0D3" }}>{b.name}</div>
              <div style={{ fontSize: 11, color: "#F2D0D3", marginTop: 2, lineHeight: 1.35 }}>{b.desc}</div>
              <div style={{ fontFamily: "'JetBrains Mono',monospace", fontWeight: 700, fontSize: 9,
                            letterSpacing: ".18em", marginTop: 5,
                            color: b.got ? "#F7F1E6" : "#F2D0D3" }}>
                {b.got ? "UNLOCKED" : b.locked ? b.locked.toUpperCase() : (b.prog || "LOCKED")}
              </div>
            </div>
          </div>
        ))}
      </div>

      <button onClick={onOpenPicker} style={{ width: "100%", marginTop: 24, padding: "12px",
        background: "transparent", border: "1px solid rgba(242,208,211,.4)", color: "#F2D0D3",
        fontFamily: "'JetBrains Mono',monospace", fontWeight: 700, fontSize: 10,
        letterSpacing: ".24em", cursor: "pointer" }}>NOT YOU? CHANGE NAME</button>

      {/* share */}
      <div style={{ fontFamily: "'JetBrains Mono',monospace", fontWeight: 700, fontSize: 10,
                    letterSpacing: ".28em", color: "#F2D0D3", marginTop: 28 }}>SHARE TO STORY</div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8, marginTop: 12 }}>
        <button onClick={() => setShare({ kind: "night" })} disabled={!data.nights.length}
          style={{ padding: "14px 6px", background: data.nights.length ? "#F7F1E6" : "transparent",
            color: data.nights.length ? "#B8141F" : "#F2D0D3",
            border: data.nights.length ? "none" : "1px solid rgba(242,208,211,.3)",
            cursor: data.nights.length ? "pointer" : "default",
            fontFamily: "'JetBrains Mono',monospace", fontWeight: 700, fontSize: 10,
            letterSpacing: ".14em" }}>MY NIGHT</button>
        <button onClick={() => setShare({ kind: "top5" })}
          style={{ padding: "14px 6px", background: "transparent", color: "#FFFFFF",
            border: "1px solid rgba(242,208,211,.4)", cursor: "pointer",
            fontFamily: "'JetBrains Mono',monospace", fontWeight: 700, fontSize: 10,
            letterSpacing: ".14em" }}>TOP 5</button>
        <button onClick={() => setShare({ kind: "badge" })}
          style={{ padding: "14px 6px", background: "transparent", color: "#F2B8BC",
            border: "1px solid rgba(242,184,188,.5)", cursor: "pointer",
            fontFamily: "'JetBrains Mono',monospace", fontWeight: 700, fontSize: 10,
            letterSpacing: ".14em" }}>BADGE</button>
      </div>

      <ShareSheet open={share} onClose={() => setShare(null)} data={shareData} />

      <ReceiptSheet night={receipt} player={me}
        rankAfter={receipt ? (ranks[receipt.idx] || {})[meId] : null}
        onClose={() => setReceipt(null)} />
    </div>
  );
}

// ══ VOL.9 · ROSTER ════════════════════════════════════════════════════════
// The admin PlayersView is an editor. This is the read-only wall everyone else
// gets: who is playing, how they are doing, tap through to their card.
function RosterView({ state, leaderboard, setOpenPlayerId, meId }) {
  const [q, setQ] = React.useState("");
  const [who, setWho] = React.useState("playing");
  // Before the season starts nobody has series points, so ordering by them puts
  // 314 people in an arbitrary order and shows every one of them a zero. Until
  // the first match is played the roster ranks on all-time instead, which is
  // the only number that exists and the reason the history was carried over.
  const started = leaderboard.some(e => e.totalPts > 0);
  const ranked = started ? leaderboard
                         : [...leaderboard].sort((a, b) => b.lifetimePts - a.lifetimePts);
  const rows = ranked
    .map((e, i) => {
      const form = recentForm(e.player.id, state.sessions || []);
      return { ...e, rank: i + 1, form, streak: currentStreak(form) };
    })
    .filter(e => !q || (e.player.name || "").toLowerCase().includes(q.toLowerCase()))
    // The filter steps aside the moment somebody types.
    .filter(e => !!q || who === "all" || !started || e.totalPts > 0);
  const playingCount = ranked.filter(e => e.totalPts > 0).length;
  return (
    <div>
      <div style={{ fontFamily: "'JetBrains Mono',monospace", fontWeight: 700, fontSize: 10,
                    letterSpacing: ".28em", color: "#F2D0D3",
                    display: "flex", alignItems: "center", gap: 8 }}>
        <BoMark size={14} />
        THE ROSTER &middot; {leaderboard.length} PLAYERS
        {!started && <span style={{ color: "#F2D0D3" }}> &middot; BY ALL-TIME</span>}
      </div>
      <div style={{ fontStyle: "italic", fontVariationSettings: "'wdth' 125,'wght' 900",
                    fontSize: 46, lineHeight: .9, marginTop: 6 }}>PLAYERS</div>
      <input value={q} onChange={e => setQ(e.target.value)} placeholder="Find a player&hellip;"
        style={{ width: "100%", marginTop: 16, padding: "14px 16px", background: "rgba(158,21,32,.96)",
          border: "1px solid rgba(242,208,211,.2)", color: "#FFFFFF", fontSize: 15,
          fontFamily: "'Archivo',sans-serif", outline: "none" }} />
      {started && !q && (
        <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
          {[["playing", "PLAYING", playingCount],
            ["all", "ALL", ranked.length]].map(([k, label, n]) => (
            <button key={k} onClick={() => setWho(k)}
              style={{ flex: "0 0 auto", minHeight: 44, padding: "0 16px", cursor: "pointer",
                display: "inline-flex", alignItems: "center", gap: 7,
                borderRadius: 28,
                background: who === k ? "#F7F1E6" : "transparent",
                border: "1px solid " + (who === k ? "#F7F1E6" : "rgba(242,208,211,.35)"),
                color: who === k ? "#1A0A0C" : "#F2D0D3",
                fontFamily: "'JetBrains Mono',monospace", fontWeight: 700,
                fontSize: 11, letterSpacing: ".18em" }}>
              {label}<span style={{ opacity: .72 }}>{n}</span>
            </button>
          ))}
        </div>
      )}
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginTop: 14 }}>
        {rows.map(e => (
          <button key={e.player.id} onClick={() => setOpenPlayerId(e.player.id)}
            style={{ textAlign: "left", padding: 12, cursor: "pointer", color: "inherit",
              background: e.player.id === meId ? "rgba(242,184,188,.07)" : "rgba(158,21,32,.94)",
              border: "1px solid " + (e.player.id === meId ? "rgba(242,184,188,.4)"
                                                          : "rgba(255,255,255,.07)") }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <span style={{ fontFamily: "'JetBrains Mono',monospace", fontWeight: 700, fontSize: 11,
                             color: e.rank <= 3 ? "#F7F1E6" : "#F2D0D3" }}>#{e.rank}</span>
              {e.player.id === meId && (
                <span style={{ fontFamily: "'JetBrains Mono',monospace", fontWeight: 700, fontSize: 8,
                  letterSpacing: ".2em", color: "#F2B8BC" }}>YOU</span>
              )}
              {e.streak >= 3 && (
                <span style={{ marginLeft: "auto", fontFamily: "'JetBrains Mono',monospace",
                  fontWeight: 700, fontSize: 8, letterSpacing: ".14em", color: "#F2B8BC",
                  border: "1px solid rgba(242,184,188,.5)", padding: "1px 4px" }}>W{e.streak}</span>
              )}
            </div>
            {/* A roster of 314 names needs faces. The photo slot keeps its
                height whether or not there is one, so the grid stays even. */}
            <div style={{ width: "100%", height: 120, marginTop: 8, background: "#9E1520",
              border: "1px solid rgba(255,255,255,.05)", overflow: "hidden",
              display: "flex", alignItems: "center", justifyContent: "center" }}>
              {e.player.photoUrl
                ? <img src={e.player.photoUrl} alt="" style={{ width: "100%", height: "100%",
                    objectFit: "cover", objectPosition: "center 28%" }} />
                : <span style={{ fontFamily: "'JetBrains Mono',monospace", fontWeight: 700,
                    fontSize: 26, color: "#F2B8BC" }}>
                    {(e.player.name || "?").split(" ").map(w => w[0]).join("").slice(0,2).toUpperCase()}
                  </span>}
            </div>
            <div style={{ fontWeight: 800, fontSize: 14, marginTop: 8, whiteSpace: "nowrap",
                          overflow: "hidden", textOverflow: "ellipsis" }}>{e.player.name}</div>
            <div style={{ fontSize: 11, color: "#F2D0D3", marginTop: 2 }}>
              {started
                ? e.stats.sessionsPlayed + " night" + (e.stats.sessionsPlayed === 1 ? "" : "s")
                : (e.lifetimePts > 0 ? "all-time" : "new this season")}
            </div>
            <div style={{ fontFamily: "'JetBrains Mono',monospace", fontWeight: 700, fontSize: 22,
                          marginTop: 8,
                          color: (started ? e.totalPts : e.lifetimePts) > 0 ? "#F7F1E6" : "#F2D0D3" }}>
              {started ? e.totalPts : e.lifetimePts}
            </div>
            {e.form && e.form.length > 0 && (
              <div style={{ display: "flex", gap: 2, marginTop: 7 }}>
                {e.form.slice(-8).map((w, i) => (
                  <span key={i} style={{ flex: 1, height: 4,
                    background: w ? "#F7F1E6" : "rgba(242,208,211,.3)" }} />
                ))}
              </div>
            )}
          </button>
        ))}
      </div>
    </div>
  );
}

function App() {
  const [state, setState] = useState(null);
  const [tab, setTab] = useState("dashboard");
  const [openSessionId, setOpenSessionId] = useState(null);
  const [openPlayerId, setOpenPlayerId] = useState(null);
  const [role, setRole] = useState(() => { const r = localStorage.getItem(ADMIN_KEY); return r === "yes" ? "admin" : (r === "admin" || r === "scorer" || r === "photographer") ? r : "guest"; });
  const isAdmin = role === "admin";
  const canScore = role === "admin" || role === "scorer";
  const canUploadPhotos = role === "admin" || role === "scorer" || role === "photographer";
  const [showLogin, setShowLogin] = useState(false);
  // Who this phone belongs to. Deliberately separate from `role`: identity
  // personalises the view, the token authorises changes.
  const [meId, setMeId] = useState(getMe);
  const [showMe, setShowMe] = useState(false);
  const pickMe  = (id) => { setMeId(id); saveMe(id); setShowMe(false); };
  const clearMe = ()   => { setMeId(""); saveMe(""); setShowMe(false); };
  const [theme, setTheme] = useState(() => localStorage.getItem("jh-theme") || "dark");
  const [sync, setSync] = useState("idle");
  const [syncErr, setSyncErr] = useState("");
  const saveTimer = useRef();
  const retryTimer = useRef();
  const savedFlash = useRef();
  const pollTimer = useRef();
  // Vol.9: a manual refresh people can reach, and something to look at while it
  // runs. The poll already keeps the page fresh; this is for the moment someone
  // wants to KNOW it is fresh, which is every time a score goes in.
  const [refreshing, setRefreshing] = useState(false);
  const [lastSync, setLastSync] = useState(null);
  const refreshNow = React.useCallback(async () => {
    setRefreshing(true);
    setSync("syncing");
    try {
      const res = await apiGet("getState");
      if (res?.ok && res.state) {
        setState(res.state);
        try { localStorage.setItem(LOCAL_KEY, JSON.stringify(stateForLocalCache(res.state))); } catch (e) {}
        setSync("idle");
        setLastSync(new Date());
      } else { setSync("offline"); }
    } catch (e) { setSync("offline"); }
    // Held deliberately: a refresh that returns in 80ms looks like nothing
    // happened, and people pull again.
    setTimeout(() => setRefreshing(false), 650);
  }, []);

  // Installed here, above the loading guard, because hooks must run in the same
  // order on every render. Below the guard it ran only once state had arrived,
  // and React counted more hooks on the second render than the first --
  // "Rendered more hooks than during the previous render", a blank page.
  //
  // Blocked while a sheet or a session is open: pulling down inside a
  // scrollable sheet should scroll it, not refresh the page behind it.
  const pullBlocked = React.useCallback(
    () => !!(openSessionId || openPlayerId || showMe || showLogin),
    [openSessionId, openPlayerId, showMe, showLogin]);
  const pullY = usePullToRefresh(refreshNow, pullBlocked);
  const initialLoaded = useRef(false);
  const stateRef = useRef(null);
  const tapRef = useRef({ n: 0, t: 0 });

  useEffect(() => {
    const root = document.documentElement;
    if (theme === "light") root.classList.add("light"); else root.classList.remove("light");
    localStorage.setItem("jh-theme", theme);
    // this paints the browser/OS chrome around the app. It was pinned to cyan
    // regardless of theme — wrong in both modes, and cyan is the support
    // colour here, not the brand one.
    document.querySelector('meta[name="theme-color"]')?.setAttribute("content", theme === "light" ? "#FFFFFF" : "#9E1520");
  }, [theme]);

  // Secret sign-in: tap brand logo 5× within 2.5s
  const secretTap = () => {
    const now = Date.now();
    const r = tapRef.current;
    r.n = (now - r.t < 2500) ? r.n + 1 : 1;
    r.t = now;
    if (r.n >= 5) { r.n = 0; setShowLogin(true); }
  };

  useEffect(() => {
    (async () => {
      try {
        const res = await apiGet("getState");
        if (res?.ok && res.state) {
          setState(res.state);
          try { localStorage.setItem(LOCAL_KEY, JSON.stringify(stateForLocalCache(res.state))); } catch (lsErr) {}
          setSync("idle");
          initialLoaded.current = true;
          document.getElementById("splash")?.remove();
          return;
        }
      } catch (e) { setSync("offline"); }
      try {
        const cached = localStorage.getItem(LOCAL_KEY);
        setState(cached ? JSON.parse(cached) : initState());
      } catch (e) { setState(initState()); }
      initialLoaded.current = true;
      document.getElementById("splash")?.remove();
    })();
  }, []);

  useEffect(() => {
    if (!state || !initialLoaded.current) return;
    stateRef.current = state;
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify(stateForLocalCache(state))); } catch (e) {}
    if (!canScore) return;
    clearTimeout(saveTimer.current);
    clearTimeout(retryTimer.current);
    setSync("syncing");
    const attempt = (tryNo) => {
      saveTimer.current = setTimeout(async () => {
        try {
          const res = await apiPost({ action: "saveState", state: stateRef.current });
          setSync("saved"); setSyncErr("");
          // brief "Saved ✓" flash, then settle to idle if nothing else queued
          clearTimeout(savedFlash.current);
          savedFlash.current = setTimeout(() => setSync(s => s === "saved" ? "idle" : s), 1500);
          if (res && res.merged && res.mergedState) {
            setState(prev => reattachPhotos(res.mergedState, prev));
          }
        } catch (e) {
          setSync("error"); setSyncErr(e.message || "Unknown sync error");
          if (!getToken()) { setShowLogin(true); return; }  // wait for re-login flush
          // Auto-retry with capped backoff so a transient failure self-heals
          // without the scorer having to touch anything.
          const delay = Math.min(30000, 4000 * Math.pow(2, tryNo));
          retryTimer.current = setTimeout(() => { setSync("syncing"); attempt(tryNo + 1); }, delay);
        }
      }, tryNo === 0 ? 3000 : 0);
    };
    attempt(0);
  }, [state, canScore]);

  useEffect(() => {
    if (canScore) return;
    pollTimer.current = setInterval(async () => {
      try {
        const res = await apiGet("getState");
        if (res?.ok && res.state) {
          setState(s => (JSON.stringify(s) !== JSON.stringify(res.state) ? res.state : s));
          setSync("idle");
        }
      } catch (e) { setSync("offline"); }
    }, 30000);
    return () => clearInterval(pollTimer.current);
  }, [canScore]);

  const handleLogin = async (pin) => {
    try {
      const r = await apiGet("unlock", { pin });
      if (r?.ok && r.role) {
        setRole(r.role); localStorage.setItem(ADMIN_KEY, r.role); setShowLogin(false);
        // Flush any changes that failed to save while the session was expired.
        if ((r.role === "admin" || r.role === "scorer") && state) {
          setSync("syncing");
          try { await apiPost({ action: "saveState", state }); setSync("idle"); setSyncErr(""); }
          catch (e) { setSync("error"); setSyncErr(e.message || "Sync failed"); }
        }
        return true;
      }
      return false;
    } catch (e) { return false; }
  };
  const logout = () => { setRole("guest"); localStorage.removeItem(ADMIN_KEY); setToken(""); if (tab === "players" || tab === "settings") setTab("dashboard"); };

  // First paint. A blank screen for a second reads as broken; the skeleton reads
  // as loading, and it is the shape of what is about to arrive.
  if (!state) return (
    <div className="min-h-screen">
      <main className="max-w-3xl mx-auto px-4 py-4"><Skeleton /></main>
    </div>
  );

  const isPublicMode = new URLSearchParams(window.location.search).has("public");
  const isPhotosMode = new URLSearchParams(window.location.search).has("photos");
  const update = (fn) => setState(s => fn({ ...s }));
  const updateSession = (sid, fn) => setState(s => ({ ...s, sessions: s.sessions.map(ss => ss.id === sid ? fn({ ...ss }) : ss) }));
  const leaderboard = state.players.map(p => {
    const s = calcPlayerStats(p.id, state.sessions);
    const prevSum = Object.values(p.prevSeriesPts || {}).reduce((a, b) => a + (Number(b) || 0), 0) + (p.prevSeriesPoints || 0);
    return { player: p, ...s, lifetimePts: s.totalPts + prevSum };
  }).sort((a, b) => b.totalPts - a.totalPts);
  const currentSession = state.sessions.find(s => s.id === openSessionId);

  if (isPublicMode) return <PublicLeaderboardPage state={state} leaderboard={leaderboard} />;
  if (isPhotosMode) return <PublicPhotosPage state={state} />;
  if (tvMode()) return <WallPage state={state} refreshNow={refreshNow} lastSync={lastSync} />;

  // Vol.9 runs the handoff's five tabs. ME is the new one and is the reason the
  // volume exists -- every point a player holds now traces back to a receipt.
  // The admin editor keeps its own entry so the organiser is not sent to the
  // read-only wall.
  const navTabs = [
    { id: "dashboard", icon: I.flame, label: "HOME" },
    { id: "sessions", icon: I.calendar, label: "SESSIONS" },
    { id: "leaderboard", icon: I.trophy, label: "RANK" },
    { id: "me", icon: I.user, label: "ME" },
    { id: isAdmin ? "players" : "roster", icon: I.users, label: "PLAYERS" },
  ];

  return (
    <div className="min-h-screen">
      <div className="court-motif" />
      {canScore && (sync === "error" || sync === "offline") && (
        <div className="na-savebanner" onClick={() => { if (!getToken()) setShowLogin(true); }} style={{ position: "sticky", top: 0, zIndex: 50, background: "#F7F1E6", color: "#1A0A0C", padding: "10px 14px", textAlign: "center", fontWeight: 800, fontSize: 13, letterSpacing: ".3px", cursor: "pointer", boxShadow: "0 2px 10px rgba(0,0,0,.5)" }}>
          ⚠️ NOT SAVING — your changes are only on this device.{" "}
          {getToken() ? "Reconnecting…" : "Tap here to sign in again"}
          {syncErr ? ` (${syncErr})` : ""}
        </div>
      )}
      <header className="sticky top-0 z-30 backdrop-blur-xl border-b border-stone-800/80" style={{ background: "rgba(158,21,32,0.92)" }}>
        <div className="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
          <div className="flex items-center gap-3 min-w-0">
            <button onClick={secretTap} className="shrink-0" aria-label="Urban Playground" style={{lineHeight:0}}>
              <img src={UP_LOGO_FULL} style={{height:44,width:"auto",display:"block",margin:"-4px 0",filter:"drop-shadow(0 0 10px rgba(247,241,230,.4))"}} alt="Urban Playground" />
            </button>
            {/* The chrome carried no National branding at all -- a player opened
                the app and the only mark on screen was the club's. */}
            
            <span style={{display:"none"}}>
              <span style={{position:"absolute",left:0,right:0,top:14,height:1,background:"#B8141F"}} />
              <span style={{position:"absolute",left:0,right:0,top:18,height:2,background:"#B8141F"}} />
              <span style={{position:"absolute",left:0,right:0,top:22,height:3,background:"#B8141F"}} />
              <span style={{position:"absolute",left:0,right:0,top:27,height:3,background:"#B8141F"}} />
              <span style={{position:"absolute",right:4,top:4,width:4,height:4,background:"#F2B8BC"}} />
            </span>
            <span className="na-flag" aria-hidden="true"><span style={{fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900",fontSize:26,lineHeight:.9,color:"#FFFFFF",WebkitTextStroke:"1.2px #1A0A0C",paintOrder:"stroke fill",textShadow:"1.5px 1.5px 0 #1A0A0C",letterSpacing:"-.02em"}}>56</span></span>
            <div style={{minWidth:0}}>
              <div className="na-brand-name" style={{fontStyle:"italic",fontVariationSettings:"'wdth' 118,'wght' 900",
                fontSize:20,lineHeight:1,whiteSpace:"nowrap"}}>56 NATIONAL SERIES</div>
              <div className="na-brand-sub" style={{fontFamily:"'JetBrains Mono',monospace",fontWeight:700,fontSize:8,
                letterSpacing:".2em",color:"#F2D0D3",marginTop:3,whiteSpace:"nowrap"}}>
                <span style={{fontFamily:"'Noto Kufi Arabic',sans-serif",fontWeight:700}}>السلسلة الوطنية</span> &middot; VOL.9</div>
            </div>
          </div>
          <div className="flex items-center gap-1 shrink-0">
            {canScore
              ? <SyncIndicator status={sync} errMsg={syncErr} />
              : <button onClick={refreshNow} aria-label="Refresh"
                  style={{display:"flex",alignItems:"center",gap:6,padding:"5px 9px",cursor:"pointer",
                    background:"transparent",border:"1px solid rgba(242,208,211,.3)"}}>
                  <span style={{width:6,height:6,borderRadius:"50%",
                    background: refreshing ? "#F2B8BC" : "#F7F1E6"}} />
                  <span style={{fontFamily:"'JetBrains Mono',monospace",fontWeight:700,fontSize:8,
                    letterSpacing:".18em",color:"#F2D0D3"}}>
                    {refreshing ? "SYNCING" : "SYNCED"}</span>
                </button>}
            
            {canScore && (
              <button onClick={() => isAdmin ? setTab("settings") : logout()} className="flex items-center gap-1.5 pl-2 pr-2.5 py-1.5 rounded-lg" style={{ background: isAdmin ? "rgba(247,241,230,.14)" : "rgba(242,184,188,.14)", border: `1px solid ${isAdmin ? "rgba(247,241,230,.3)" : "rgba(242,184,188,.3)"}` }} aria-label={isAdmin ? "Settings" : "Sign out scorer"}>
                {isAdmin ? <I.shield size={14} className="text-orange-400" /> : <I.whistle size={14} className="text-blue-400" />}
                <span className="text-[10px] font-bold uppercase tracking-wider" style={{ color: isAdmin ? "var(--orange-br)" : "var(--blue)" }}>{isAdmin ? "Admin" : "Scorer"}</span>
              </button>
            )}
          </div>
        </div>
      </header>

      <PullStrip pull={pullY} />
      <main className="max-w-3xl mx-auto px-4 py-4 pb-24">
        {refreshing && <Skeleton />}
        {!refreshing && <>
        {tab === "dashboard" && <DashboardView state={state} leaderboard={leaderboard} setTab={setTab} setOpenSessionId={setOpenSessionId} isAdmin={isAdmin} meId={meId} onOpenPicker={() => setShowMe(true)} />}
        {tab === "players" && isAdmin && <PlayersView state={state} update={update} setOpenPlayerId={setOpenPlayerId} isAdmin={isAdmin} />}
        {tab === "me" && <MeView state={state} leaderboard={leaderboard} meId={meId} onOpenPicker={() => setShowMe(true)} setTab={setTab} setOpenPlayerId={setOpenPlayerId} />}
        {tab === "roster" && <RosterView state={state} leaderboard={leaderboard} setOpenPlayerId={setOpenPlayerId} meId={meId} />}
        {tab === "sessions" && <SessionsView state={state} update={update} setOpenSessionId={setOpenSessionId} isAdmin={isAdmin} leaderboard={leaderboard} setTab={setTab} meId={meId} />}
        {tab === "leaderboard" && <LeaderboardView leaderboard={leaderboard} state={state} setOpenPlayerId={setOpenPlayerId} meId={meId} onOpenPicker={() => setShowMe(true)} />}
        {tab === "settings" && isAdmin && <SettingsView state={state} update={update} setTab={setTab} logout={logout} />}
        </>}
      </main>

      <nav className="fixed bottom-0 inset-x-0 z-30 border-t border-stone-800/80 backdrop-blur-xl" style={{ background: "rgba(158,21,32,0.96)" }}>
        <div className="max-w-3xl mx-auto grid px-2 py-1.5"
             style={{ gridTemplateColumns: `repeat(${navTabs.length}, minmax(0, 1fr))` }}>
          {navTabs.map(t => {
            const A = t.icon;
            if (t.href) return (
              <a key={t.id} href={t.href} className="flex flex-col items-center gap-0.5 py-2 rounded-lg transition-colors text-stone-500 hover:text-orange-400" style={{textDecoration:"none"}}>
                <A size={20} /><span className="text-[10px] font-semibold tracking-wide uppercase">{t.label}</span>
              </a>
            );
            const on = tab === t.id;
            return <button key={t.id} onClick={() => setTab(t.id)}
              className="relative flex flex-col items-center gap-0.5 py-2 transition-colors"
              style={{ color: on ? "#F7F1E6" : "#F2D0D3",
                       background: on ? "rgba(247,241,230,.07)" : "transparent" }}>
              {on && <span style={{ position: "absolute", top: 0, width: 26, height: 3,
                                    background: "#F7F1E6" }} />}
              <A size={20} />
              <span style={{ fontFamily: "'JetBrains Mono',monospace", fontWeight: 700,
                             fontSize: 10, letterSpacing: ".16em" }}>{t.label}</span>
            </button>;
          })}
        </div>
      </nav>

      {currentSession && <SessionDetail session={currentSession} state={state} isAdmin={isAdmin} canScore={canScore} canUploadPhotos={canUploadPhotos} sync={sync} syncErr={syncErr} onClose={() => setOpenSessionId(null)} updateSession={(fn) => updateSession(currentSession.id, fn)} update={update} deleteSession={() => { update(s => ({ ...s, sessions: s.sessions.filter(ss => ss.id !== currentSession.id) })); setOpenSessionId(null); }} leaderboard={leaderboard} />}
      {openPlayerId && <PlayerDetail meId={meId} playerId={openPlayerId} state={state} leaderboard={leaderboard} canScore={canScore} sync={sync} syncErr={syncErr} update={update} onClose={() => setOpenPlayerId(null)} />}
      {showLogin && <LoginModal onClose={() => setShowLogin(false)} onLogin={handleLogin} />}
      {showMe && <MePicker leaderboard={leaderboard} meId={meId} onPick={pickMe} onClear={clearMe} onClose={() => setShowMe(false)} />}
    </div>
  );
}

function SyncIndicator({ status, errMsg }) {
  const map = {
    idle:    { color: "#F7F1E6", label: "Synced" },
    saved:   { color: "#F7F1E6", label: "Saved ✓" },
    syncing: { color: "#f59e0b", label: "Saving…" },
    error:   { color: "#F2B8BC", label: "Retrying…" },
    offline: { color: "#F7F1E6", label: "Offline" },
  };
  const s = map[status] || map.idle;
  const onClick = () => { if (status === "error" && errMsg) alert("Sync error:\n\n" + errMsg + "\n\n(Auto-retrying — your changes are safe on this device meanwhile.)"); };
  const pulse = status === "syncing" || status === "error";
  return <div onClick={onClick} className={`flex items-center gap-1.5 text-[10px] uppercase font-semibold tracking-wider ${status === "error" ? "cursor-pointer" : ""}`} title={status === "error" ? (errMsg || s.label) : s.label}>
    <div className="w-2 h-2 rounded-full" style={{ background: s.color, boxShadow: `0 0 8px ${s.color}`, animation: pulse ? "pulse 1.2s ease-in-out infinite" : "none" }} />
    <span className="hidden sm:inline" style={{ color: status === "saved" ? "#F7F1E6" : "#78716c" }}>{s.label}</span>
  </div>;
}

function LoginModal({ onClose, onLogin }) {
  const [pin, setPin] = useState("");
  const [err, setErr] = useState("");
  const submit = async () => { setErr(""); const ok = await onLogin(pin); if (!ok) setErr("Wrong PIN"); };
  return <Modal open={true} onClose={onClose} title="STAFF SIGN-IN">
    <div className="space-y-3">
      <div className="text-xs text-stone-400">Enter your PIN to unlock editing.</div>
      <input autoFocus type="password" value={pin} onChange={e => setPin(e.target.value)} placeholder="••••" onKeyDown={e => e.key === "Enter" && submit()} className="w-full bg-stone-900 border border-stone-700 rounded-lg px-3 py-3 text-center text-2xl font-mono text-stone-100 tracking-widest focus:outline-none focus:border-orange-500" />
      {err && <div className="text-xs text-red-400 text-center">{err}</div>}
      <Btn className="w-full" onClick={submit}><I.unlock size={14} /> Unlock</Btn>
    </div>
  </Modal>;
}

// ═══════════════════════════════════════════════════════════════
// VIEWS
// ═══════════════════════════════════════════════════════════════
function DashboardView({ state, leaderboard, setTab, setOpenSessionId, isAdmin, meId, onOpenPicker }) {
  const [showPrizes, setShowPrizes] = React.useState(false);
  const [recap, setRecap] = React.useState(null);
  const sessions = state.sessions || [];
  const nextUp  = sessions.find(s => !s.completed);
  const live    = nextUp || sessions[sessions.length - 1];
  const allDone = !nextUp;

  // "Players" here means people who have actually played a Vol.9 session —
  // not the roster, which carries every August name across with its points.
  const played = leaderboard.filter(l => l.stats.groupPlayed > 0 || l.stats.qfReached > 0);
  const podium = played.slice(0, 3);
  const sessionVoucher = 14, perTeam = 2, sessionsTotal = SESSIONS_TOTAL, season = SEASON_PRIZES;
  const pool = sessionVoucher * perTeam * sessionsTotal + season.reduce((a, b) => a + b, 0);

  const enrich = (e) => {
    const form = recentForm(e.player.id, sessions);
    const decided = e.stats.groupPlayed + e.stats.qfReached + e.stats.sfReached + e.stats.finalsReached;
    const wins = e.stats.groupWins + e.stats.qfWins + e.stats.sfWins + e.stats.finalsWon;
    return { form, streak: currentStreak(form), decided,
             winRate: decided ? Math.round(wins / decided * 100) : 0 };
  };

  // Movement since the previous session, for the climber tile.
  const climber = (() => {
    if (sessions.length < 2) return null;
    const prev = sessions.slice(0, -1);
    const before = state.players
      .map(p => ({ id: p.id, s: calcPlayerStats(p.id, prev) }))
      .filter(e => e.s.stats.groupPlayed > 0 || e.s.stats.qfReached > 0)
      .sort((a, b) => b.s.totalPts - a.s.totalPts);
    const rank = {}; before.forEach((e, i) => { rank[e.id] = i; });
    let best = null;
    played.forEach((e, i) => {
      if (!(e.player.id in rank)) return;
      const d = rank[e.player.id] - i;
      if (d > 0 && (!best || d > best.n)) best = { e, n: d };
    });
    return best && best.n >= 2 ? best : null;
  })();

  // Best win rate among players with enough matches to mean something.
  const bestRate = (() => {
    const pool2 = played.map(e => ({ e, en: enrich(e) })).filter(x => x.en.decided >= 5);
    if (!pool2.length) return null;
    return pool2.sort((a, b) => b.en.winRate - a.en.winRate || b.e.totalPts - a.e.totalPts)[0];
  })();

  // Vol.9: four spotlight axes instead of two, each player used once. Two tiles
  // that land on the same person waste half the row, which is what happened
  // whenever the biggest climber also had the best win rate.
  const spotlights = (() => {
    const out = [], used = new Set(podium.map(e => e.player.id));
    const push = (id, sp) => { if (id && !used.has(id)) { used.add(id); out.push(sp); } };
    const nightsDone = sessions.filter(s => s.completed).length;

    if (climber) push(climber.e.player.id, { key: "climb", colour: "#F7F1E6",
      label: "BIGGEST CLIMBER", value: "▲" + climber.n, name: climber.e.player.name,
      note: "places gained since last session" });

    if (bestRate) push(bestRate.e.player.id, { key: "rate", colour: "#F2B8BC",
      label: "BEST WIN RATE", value: bestRate.en.winRate + "%", name: bestRate.e.player.name,
      note: "from " + bestRate.en.decided + " matches" });

    // Never missed a night -- only meaningful once there are nights to miss.
    if (nightsDone >= 2) {
      const iron = played.find(e => !used.has(e.player.id) && e.stats.sessionsPlayed >= nightsDone);
      if (iron) push(iron.player.id, { key: "iron", colour: "#F7F1E6",
        label: "NEVER MISSED A NIGHT", value: nightsDone + "/" + nightsDone,
        name: iron.player.name, note: "every night so far" });
    }

    const titled = played.filter(e => !used.has(e.player.id) && e.stats.finalsWon > 0)
      .sort((a, b) => b.stats.finalsWon - a.stats.finalsWon)[0];
    if (titled) push(titled.player.id, { key: "titles", colour: "#F2B8BC",
      label: "SESSION TITLES", value: String(titled.stats.finalsWon), name: titled.player.name,
      note: titled.stats.finalsWon === 1 ? "one night won" : "nights won outright" });

    return out.slice(0, 4);
  })();

  const LADDER = [
    ["Group win",            "+3", "#F7F1E6"],
    ["Tiebreak loss",        "+2", "#FFFFFF"],
    ["Close loss",           "+1", "#FFFFFF"],
    ["Blowout loss",          "0", "#F7F1E6"],
    ["Top of your group",    "+1", "#F7F1E6"],
    ["Reach QF / SF / final","+1 / +2 / +3", "#F7F1E6"],
    ["Win the final",        "+5", "#F2B8BC"],
  ];

  // Against the night's scheduled fixtures, not the records entered so far.
  const liveFx = live ? sessionFixtures(live) : { total: 0, played: 0, left: 0 };
  const donePct = liveFx.total ? Math.round(liveFx.played / liveFx.total * 100) : 0;

  return (
    <div className="space-y-4 na-home" data-played={(state.sessions || []).length ? "1" : "0"} style={{animation:"sgSlide 200ms var(--ease-out) both"}}>

      {/* ── HERO ── */}
      <div className="sg-hero na-hero" style={{position:"relative",marginTop:16,padding:"26px 18px",
           background:"rgba(184,20,31,.9)",border:"1px solid rgba(247,241,230,.28)",overflow:"hidden"}}>
        <div style={{position:"absolute",right:-16,top:-40,fontFamily:"'Archivo',sans-serif",fontStyle:"italic",
             fontVariationSettings:"'wdth' 125,'wght' 900",fontSize:170,lineHeight:1,
             color:"rgba(26,10,12,.055)",pointerEvents:"none"}} className="vol-mark" aria-hidden="true">09</div>
        <div className="na-hero-mark" style={{position:"relative"}}>
          <div className="na-medallion na-medallion-lg"
               title={landmarkFor(nextNightIndex(state)).nameEn}
               style={{backgroundImage:`url("${LANDMARK_ART[landmarkFor(nextNightIndex(state)).asset]}")`}} />
          <div className="na-hero-landmark">
            {landmarkFor(nextNightIndex(state)).nameEn.toUpperCase()}
            <span style={{fontFamily:"'Noto Kufi Arabic',sans-serif",fontWeight:700,marginInlineStart:8}}>
              {landmarkFor(nextNightIndex(state)).nameAr}</span>
          </div>
        </div>
        <div style={{position:"relative",fontFamily:"'Archivo',sans-serif",fontWeight:800,fontSize:9,
             letterSpacing:".34em",color:"#F7F1E6"}}>MON &amp; WED · 5:30 PM · ALL NOVEMBER</div>
        {/* The lockup, back in the hero. The canvas set the volume in type
            alone; the mark is the brand and it carries the volume better than
            a headline does, so the headline steps down to a tagline under it. */}
        <picture>
          <source type="image/webp" srcSet="assets/national-lockup.webp" />
          <img className="surge-lockup-img" src="assets/national-lockup.png" alt="56 National Series"
               style={{position:"relative",display:"block",width:"100%",maxWidth:330,margin:"12px auto 0"}} />
        </picture>
        <div style={{position:"relative",textAlign:"center",fontFamily:"'Archivo',sans-serif",fontStyle:"italic",
             fontVariationSettings:"'wdth' 118,'wght' 900",fontSize:22,lineHeight:1,
             color:"#FFFFFF",marginTop:10,letterSpacing:".02em"}}>ONE FLAG. <span style={{color:"#F7F1E6"}}>ONE COURT.</span></div>
        <div style={{position:"relative",display:"flex",gap:8,marginTop:16}}>
          <div style={{flex:1,padding:"10px 12px",background:"rgba(247,241,230,.08)",border:"1px solid rgba(247,241,230,.3)"}}>
            <div style={{fontFamily:"'Archivo',sans-serif",fontWeight:800,fontSize:8,letterSpacing:".22em",color:"#F7F1E6"}}>PRIZE POOL</div>
            <div style={{fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 112,'wght' 900",
                 fontSize:22,color:"#F7F1E6",marginTop:2}}>{pool} OMR</div>
          </div>
          <div style={{flex:1,padding:"10px 12px",background:"rgba(242,184,188,.08)",border:"1px solid rgba(242,184,188,.3)"}}>
            <div style={{fontFamily:"'Archivo',sans-serif",fontWeight:800,fontSize:8,letterSpacing:".22em",color:"#F7F1E6"}}>PLAYERS</div>
            <div style={{fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 112,'wght' 900",
                 fontSize:22,color:"#F2B8BC",marginTop:2}}>{played.length}</div>
          </div>
        </div>
      </div>

      <div className="na-natday">
        <div style={{flex:"1 1 auto",minWidth:0}}>
          <div className="na-natday-when">{NATIONAL_DAY_LABEL.toUpperCase()} &middot; 5:30 PM</div>
          <div className="na-natday-title">NATIONAL DAY NIGHT</div>
          <div className="na-natday-ar">العيد الوطني</div>
        </div>
        <div className="na-natday-2x">2X</div>
      </div>

      {/* ── NEXT UP ── */}
      {live && <>
        <div className="sg-kicker">{allDone ? "Last session" : "Next up"}</div>
        <div onClick={() => setOpenSessionId(live.id)} className="sg-card sg-card-cyan"
             style={{cursor:"pointer",padding:16,marginTop:10}}>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <div style={{fontFamily:"'Archivo',sans-serif",fontWeight:800,fontSize:9,letterSpacing:".28em",color:"#F7F1E6"}}>
              {live.date ? new Date(live.date + "T12:00:00").toLocaleDateString("en-GB", {weekday:"short",day:"numeric",month:"short"}).toUpperCase() : ""}</div>
            {!live.completed && <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:7}}>
              <span className="sg-livedot" />
              <span style={{fontFamily:"'Archivo',sans-serif",fontWeight:800,fontSize:9,letterSpacing:".2em",color:"#F7F1E6"}}>LIVE NOW</span>
            </div>}
          </div>
          <div style={{display:"flex",alignItems:"center",gap:14,marginTop:12}}>
            <div style={{flex:"0 0 auto",width:56,height:56,borderRadius:"50%",display:"grid",placeItems:"center",
                 background:`conic-gradient(#F7F1E6 ${donePct}%, rgba(242,208,211,.22) 0)`}}>
              <div style={{width:44,height:44,borderRadius:"50%",background:"#B8141F",display:"grid",placeItems:"center",
                   fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 118,'wght' 900",
                   fontSize:16,color:"#F7F1E6"}}>{(live.name||"").replace(/[^0-9]/g,"") || "·"}</div>
            </div>
            <div style={{flex:"1 1 auto",minWidth:0}}>
              <div style={{fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900",
                   fontSize:26,lineHeight:1,color:"#FFFFFF"}}>{(live.name||"").toUpperCase()}</div>
              <div style={{fontFamily:"'Archivo',sans-serif",fontWeight:800,fontSize:10,letterSpacing:".16em",
                   color:"#F7F1E6",marginTop:5,whiteSpace:"nowrap"}}>
                {liveFx.played} OF {liveFx.total} PLAYED
                {liveFx.left > 0 ? ` · ${liveFx.left} LEFT` : ""}
                {live.doublePoints ? " · 2X POINTS" : ""}</div>
            </div>
            <div style={{flex:"0 0 auto",fontFamily:"'Archivo',sans-serif",fontWeight:800,fontSize:11,color:"#F7F1E6"}}>OPEN &#9654;</div>
          </div>
        </div>
      </>}

      {/* ── WHO ARE YOU — only until it is answered ── */}
      {!meId && <div onClick={onOpenPicker} className="sg-card"
           style={{cursor:"pointer",padding:"13px 14px",display:"flex",alignItems:"center",gap:10}}>
        <div style={{flex:1,minWidth:0}}>
          <div className="sg-kicker" style={{marginBottom:3}}>Your standing</div>
          <div style={{fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 112,'wght' 900",
               fontSize:18,color:"#FFFFFF"}}>WHICH ONE ARE YOU?</div>
        </div>
        <span style={{color:"#F7F1E6",fontWeight:800}}>&#9654;</span>
      </div>}

      {/* ── TOP OF THE SERIES ── */}
      {podium.length > 0 && <>
        <div style={{display:"flex",alignItems:"baseline",gap:10,marginTop:20}}>
          <div className="sg-kicker">Top of the series</div>
          <div onClick={() => setTab("leaderboard")} style={{cursor:"pointer",marginLeft:"auto",
               fontFamily:"'Archivo',sans-serif",fontWeight:800,fontSize:9,letterSpacing:".2em",color:"#F7F1E6"}}>FULL TABLE &#9654;</div>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:8,marginTop:10}}>
          {podium.map((e, i) => {
            const en = enrich(e), lead = i === 0;
            const bar = lead ? "#F7F1E6" : "#F2D0D3";
            return <div key={e.player.id} onClick={() => setTab("leaderboard")} className="sg-top" data-lead={lead ? "1" : "0"}
              style={{cursor:"pointer",display:"flex",alignItems:"center",gap:12,padding:"13px 14px",
                      background:lead ? "rgba(16,23,31,.96)" : "rgba(158,21,32,.94)",
                      backgroundImage:`linear-gradient(180deg,${bar},rgba(242,208,211,.05))`,
                      backgroundSize:"3px 100%",backgroundRepeat:"no-repeat"}}>
              <div style={{flex:"0 0 auto",width:42,height:42,display:"grid",placeItems:"center",
                   background:lead ? "rgba(247,241,230,.14)" : "rgba(255,255,255,.04)",
                   border:`1px solid ${lead ? "rgba(247,241,230,.5)" : "rgba(242,208,211,.35)"}`,
                   fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 118,'wght' 900",
                   fontSize:20,lineHeight:1,color:lead ? "#F7F1E6" : "#F7F1E6"}}>{i + 1}</div>
              <Avatar player={e.player} size={34} />
              <div style={{flex:"1 1 auto",minWidth:0}}>
                <div style={{fontFamily:"'Archivo',sans-serif",fontWeight:800,fontSize:16,color:"#FFFFFF",
                     whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{e.player.name}</div>
                <div style={{fontFamily:"'Archivo',sans-serif",fontWeight:800,fontSize:9,letterSpacing:".18em",
                     color:"#F7F1E6",marginTop:4,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>
                  {e.stats.sessionsPlayed} {e.stats.sessionsPlayed === 1 ? "NIGHT" : "NIGHTS"} · {en.winRate}% WIN{en.streak >= 2 ? ` · W${en.streak}` : ""}</div>
              </div>
              <div style={{flex:"0 0 auto",textAlign:"right"}}>
                <div className="sg-top-pts" style={{fontFamily:"'Archivo',sans-serif",fontStyle:"italic",
                     fontVariationSettings:"'wdth' 112,'wght' 900",fontSize:24,lineHeight:1,
                     color:lead ? "#F7F1E6" : "#FFFFFF"}}>{e.totalPts}</div>
                <div style={{fontFamily:"'Archivo',sans-serif",fontWeight:800,fontSize:8,letterSpacing:".24em",color:"#F7F1E6",marginTop:2}}>PTS</div>
              </div>
            </div>;
          })}
        </div>
      </>}

      {/* ── LAST NIGHT, AND WHO YOU ARE RACING (Vol.9) ── */}
      {meId && <RecapReadyCard state={state} leaderboard={leaderboard} meId={meId}
                               onOpen={(s) => setRecap(s)} />}
      {meId && <RivalAlert state={state} leaderboard={leaderboard} meId={meId} setTab={setTab} />}

      {/* ── FINALS COUNTDOWN (Vol.9) ── */}
      <FinalsCountdown state={state} leaderboard={leaderboard} meId={meId} setTab={setTab} />

      {/* ── WORTH WATCHING (Vol.9: four axes, de-duplicated) ── */}
      {spotlights.length > 0 && <>
        <div className="sg-kicker" style={{marginTop:20}}>Worth watching</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(2,minmax(0,1fr))",gap:10,marginTop:10}}>
          {spotlights.map(sp => (
            <div key={sp.key} onClick={() => setTab("leaderboard")} className="sg-card"
                 style={{cursor:"pointer",padding:14,
                   backgroundImage:`linear-gradient(180deg,${sp.colour},rgba(242,208,211,.05))`,
                   backgroundSize:"3px 100%",backgroundRepeat:"no-repeat"}}>
              <div style={{fontFamily:"'Archivo',sans-serif",fontWeight:800,fontSize:8,
                   letterSpacing:".2em",color:sp.colour}}>{sp.label}</div>
              <div style={{fontFamily:"'Archivo',sans-serif",fontStyle:"italic",
                   fontVariationSettings:"'wdth' 118,'wght' 900",fontSize:34,lineHeight:1,
                   color:sp.colour,marginTop:7}}>{sp.value}</div>
              <div style={{fontFamily:"'Archivo',sans-serif",fontWeight:800,fontSize:14,
                   color:"#FFFFFF",marginTop:8,whiteSpace:"nowrap",overflow:"hidden",
                   textOverflow:"ellipsis"}}>{sp.name}</div>
              <div style={{fontSize:12,lineHeight:1.4,color:"#F7F1E6",marginTop:5}}>{sp.note}</div>
            </div>
          ))}
        </div>
      </>}

      {/* ── LAST NIGHT + PRIZE TRACKER (Vol.9) ── */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginTop:20}}>
        <button onClick={() => {
            const done = (state.sessions || []).filter(s => s.completed);
            if (done.length) setRecap(done[done.length - 1]);
          }}
          style={{textAlign:"left",padding:14,cursor:"pointer",color:"inherit",
            background:"rgba(158,21,32,.94)",border:"1px solid rgba(247,241,230,.3)"}}>
          <div style={{fontFamily:"'JetBrains Mono',monospace",fontWeight:700,fontSize:8,
            letterSpacing:".2em",color:"#F7F1E6"}}>LAST NIGHT</div>
          <div style={{fontStyle:"italic",fontVariationSettings:"'wdth' 118,'wght' 900",
            fontSize:22,marginTop:6}}>RECAP</div>
          <div style={{fontSize:11,color:"#F2D0D3",marginTop:4}}>
            {(state.sessions || []).filter(s => s.completed).length
              ? "champions, MVP, top scorer" : "after the first night"}
          </div>
        </button>
        <button onClick={() => setShowPrizes(true)}
          style={{textAlign:"left",padding:14,cursor:"pointer",color:"inherit",
            background:"rgba(158,21,32,.94)",border:"1px solid rgba(242,184,188,.35)"}}>
          <div style={{fontFamily:"'JetBrains Mono',monospace",fontWeight:700,fontSize:8,
            letterSpacing:".2em",color:"#F2B8BC"}}>PRIZE TRACKER</div>
          <div style={{fontStyle:"italic",fontVariationSettings:"'wdth' 118,'wght' 900",
            fontSize:22,marginTop:6}}>{pool} OMR</div>
          <div style={{fontSize:11,color:"#F2D0D3",marginTop:4}}>
            {/* Same figures as PrizeSheet, and derived the same way: a typed 28
                here is a second place for the voucher to drift from the file
                that is meant to decide it. */}
            {(() => {
              const done = (state.sessions || []).filter(s => s.completed).length;
              const pot = SEASON_PRIZES.reduce((a, b) => a + b, 0);
              return done * SEASON_VOUCHER * 2 + (done >= SESSIONS_TOTAL ? pot : 0);
            })()} paid so far
          </div>
        </button>
      </div>

      <PrizeSheet open={showPrizes} state={state} leaderboard={leaderboard}
                  onClose={() => setShowPrizes(false)} />
      <RecapSheet session={recap} state={state} leaderboard={leaderboard} meId={meId}
                  onClose={() => setRecap(null)} />

      {/* ── HOW POINTS ARE EARNED ──
          The canvas invented values here ("Knockout win +5, Session champion
          +8"). These are the app's real ones. */}
      <div className="sg-card" style={{marginTop:20,padding:16,
           backgroundImage:"linear-gradient(180deg,#F2B8BC,rgba(242,184,188,.06))",backgroundSize:"3px 100%",backgroundRepeat:"no-repeat"}}>
        <div style={{fontFamily:"'Archivo',sans-serif",fontWeight:800,fontSize:9,letterSpacing:".32em",color:"#F2B8BC"}}>HOW POINTS ARE EARNED</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr auto",marginTop:12}}>
          {LADDER.map(([label, pts, colour]) => <React.Fragment key={label}>
            <div style={{display:"flex",alignItems:"center",gap:8,padding:"9px 0",borderTop:"1px solid rgba(242,208,211,.16)"}}>
              <div style={{width:3,height:16,background:colour}} />
              <div style={{fontFamily:"'Archivo',sans-serif",fontWeight:800,fontSize:14,color:"#FFFFFF"}}>{label}</div>
            </div>
            <div style={{display:"flex",alignItems:"center",justifyContent:"flex-end",paddingLeft:12,
                 borderTop:"1px solid rgba(242,208,211,.16)",fontFamily:"'Archivo',sans-serif",fontStyle:"italic",
                 fontVariationSettings:"'wdth' 112,'wght' 900",fontSize:20,color:colour}}>{pts}</div>
          </React.Fragment>)}
        </div>
        <div style={{fontSize:12.5,lineHeight:1.5,color:"#F7F1E6",marginTop:11}}>
          Only your best three group results count, so a bigger group can never out-earn a
          smaller one. A double-points night doubles everything above.</div>
      </div>
    </div>
  );
}

function PlayersView({ state, update, setOpenPlayerId, isAdmin }) {
  const [search, setSearch] = useState("");
  const [showAdd, setShowAdd] = useState(false);
  const [showBulk, setShowBulk] = useState(false);
  const [editPlayer, setEditPlayer] = useState(null);
  const filtered = state.players.filter(p => !search || p.name.toLowerCase().includes(search.toLowerCase())).slice().sort((a, b) => a.name.localeCompare(b.name));
  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between">
        <h2 className="font-display text-3xl text-stone-100">PLAYERS</h2>
        {isAdmin && <div className="flex gap-2">
          <Btn variant="secondary" size="sm" onClick={() => setShowBulk(true)}><I.upload size={14} /> Import</Btn>
          <Btn size="sm" onClick={() => setShowAdd(true)}><I.plus size={14} /> Add</Btn>
        </div>}
      </div>
      <div className="relative">
        <I.search size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-stone-500" />
        <Input value={search} onChange={setSearch} placeholder="Search players…" className="pl-9" />
      </div>
      <div className="space-y-2">
        {filtered.length === 0 ? <Card className="p-6 text-center text-stone-500">No players match.</Card>
          : filtered.map(p => {
            const stats = calcPlayerStats(p.id, state.sessions);
            return (
              <Card key={p.id} className="p-3 flex items-center gap-3" onClick={() => isAdmin ? setEditPlayer(p) : setOpenPlayerId(p.id)}>
                <Avatar player={p} size={40} />
                <div className="flex-1 min-w-0">
                  <div className="font-semibold text-stone-100 truncate">{p.name}</div>
                  <div className="text-xs text-stone-500">{stats.stats.sessionsPlayed} sessions · {stats.stats.groupWins}W{(p.prevSeriesPoints||0) > 0 ? ` · +${p.prevSeriesPoints} prev` : ""}</div>
                </div>
                <div className="text-right">
                  <div className="font-mono font-bold text-orange-500">{stats.totalPts}</div>
                  <div className="text-[10px] text-stone-500 uppercase">pts</div>
                </div>
                {isAdmin ? <I.edit size={14} className="text-stone-600" /> : <I.chev size={16} className="text-stone-600" />}
              </Card>
            );
          })}
      </div>
      {showAdd && <AddPlayerModal onClose={() => setShowAdd(false)} onAdd={(name) => update(s => ({ ...s, players: [...s.players, { id: uid("p"), name: name.trim(), addedAt: Date.now() }] }))} />}
      {showBulk && <WhatsAppImportModal onClose={() => setShowBulk(false)} existing={state.players} onAdd={(players) => update(s => ({ ...s, players: [...s.players, ...players] }))} />}
      {editPlayer && <PlayerEditModal player={editPlayer} seriesNames={state.prevSeriesNames || []} onClose={() => setEditPlayer(null)}
        onSave={(data) => update(s => ({ ...s, players: s.players.map(p => p.id === editPlayer.id ? { ...p, ...data } : p) }))}
        onDelete={() => update(s => ({ ...s, players: s.players.filter(p => p.id !== editPlayer.id) }))} />}
    </div>
  );
}

function AddPlayerModal({ onClose, onAdd }) {
  const [n, setN] = useState("");
  return <Modal open={true} onClose={onClose} title="ADD PLAYER">
    <div className="space-y-3">
      <Input autoFocus value={n} onChange={setN} placeholder="Player name" />
      <div className="flex gap-2">
        <Btn variant="ghost" onClick={onClose}>Cancel</Btn>
        <Btn onClick={() => { if (n.trim()) { onAdd(n); onClose(); } }} disabled={!n.trim()}>Add</Btn>
      </div>
    </div>
  </Modal>;
}

function PlayerEditModal({ player, seriesNames, onClose, onSave, onDelete }) {
  const [name, setName] = useState(player.name || "");
  const [photoUrl, setPhotoUrl] = useState(player.photoUrl || "");
  const [photoUploading, setPhotoUploading] = useState(false);
  const initSeriesPts = {};
  (seriesNames || []).forEach(n => { initSeriesPts[n] = String((player.prevSeriesPts || {})[n] || 0); });
  const [seriesPts, setSeriesPts] = useState(initSeriesPts);
  const [showDel, setShowDel] = useState(false);
  const totalPrev = (seriesNames || []).reduce((sum, n) => sum + (parseInt(seriesPts[n]) || 0), 0) + (player.prevSeriesPoints || 0);
  return <Modal open={true} onClose={onClose} title="EDIT PLAYER">
    <div className="space-y-3">
      {photoUrl && !photoUrl.includes("PASTE") && (
        <div className="flex justify-center"><img src={photoUrl} alt="preview" className="w-20 h-20 rounded-full object-cover border-2 border-orange-500/30" onError={e => e.target.style.display="none"} /></div>
      )}
      <div><label className="text-xs text-stone-400 uppercase tracking-wider font-semibold mb-1 block">Name</label><Input value={name} onChange={setName} /></div>
      <div>
        <label className="text-xs text-stone-400 uppercase tracking-wider font-semibold mb-1 block">Photo</label>
        <div className="flex gap-2 items-center">
          <Input value={photoUrl} onChange={setPhotoUrl} placeholder="https://... or upload ↓" className="flex-1" />
        </div>
        <label className={`mt-1.5 flex items-center justify-center gap-2 w-full py-2 rounded-lg border border-dashed text-xs transition-colors ${photoUploading ? "border-orange-500 text-orange-400 cursor-wait" : "border-stone-700 text-stone-400 hover:border-orange-500 hover:text-orange-400 cursor-pointer"}`}>
          {photoUploading ? <><span className="animate-pulse">Uploading…</span></> : <><I.camera size={13} /> Upload from device</>}
          <input type="file" accept="image/*" className="hidden" disabled={photoUploading} onChange={async e => {
            const f = e.target.files?.[0]; if (!f) return;
            setPhotoUploading(true);
            try {
              const branded = await buildBrandAvatar(f);
              setPhotoUrl(branded || await resizeToBase64(f));
            } catch { try { setPhotoUrl(await resizeToBase64(f)); } catch {} }
            setPhotoUploading(false);
          }} />
        </label>
      </div>
      {(seriesNames || []).length > 0 && <div>
        <label className="text-xs text-stone-400 uppercase tracking-wider font-semibold mb-2 block">Previous Series Points <span className="text-stone-600 normal-case">(total: {totalPrev})</span></label>
        <div className="space-y-2">
          {(seriesNames || []).map(sn => (
            <div key={sn} className="flex items-center gap-2">
              <span className="text-xs text-stone-400 flex-1 truncate">{sn}</span>
              <Input type="number" value={seriesPts[sn] ?? "0"} onChange={v => setSeriesPts(p => ({ ...p, [sn]: v }))} className="w-20 text-right" />
            </div>
          ))}
        </div>
      </div>}
      <div className="flex gap-2 pt-2">
        <Btn variant="danger" size="sm" onClick={() => setShowDel(true)}><I.trash size={14} /></Btn>
        <Btn variant="ghost" onClick={onClose} className="ml-auto">Cancel</Btn>
        <Btn onClick={async () => {
          const pts = {};
          (seriesNames || []).forEach(n => { pts[n] = parseInt(seriesPts[n]) || 0; });
          const trimmedPhoto = photoUrl.trim();
          onSave({ name: name.trim() || player.name, photoUrl: trimmedPhoto, prevSeriesPts: pts });

    </div>
  </Modal>;
}

function WhatsAppImportModal({ onClose, onAdd, existing }) {
  const [text, setText] = useState("");
  const [step, setStep] = useState("paste");
  const [checked, setChecked] = useState({});
  const existingNames = existing.map(p => p.name);

  const parsed = useMemo(() => {
    if (!text.trim()) return [];
    return parseWhatsAppNames(text).map(name => {
      const exactMatch = existingNames.find(e => e.toLowerCase() === name.toLowerCase());
      if (exactMatch) return { name, status: "existing", suggestion: null };
      const fuzzy = fuzzyMatch(name, existingNames);
      return { name, status: fuzzy ? "fuzzy" : "new", suggestion: fuzzy?.match || null };
    });
  }, [text]);

  const freshItems = parsed.filter(p => p.status !== "existing");
  const toAdd = freshItems.filter(p => checked[p.name] !== false && p.status === "new")
    .concat(freshItems.filter(p => checked[p.name] === true && p.status === "fuzzy"));

  return <Modal open={true} onClose={onClose} title="IMPORT PLAYERS">
    <div className="space-y-3">
      {step === "paste" ? <>
        <div className="text-xs text-stone-400">Paste a WhatsApp chat export or a plain list of names (one per line).</div>

              border: p.status === "existing" ? "1px solid rgba(247,241,230,0.2)" : p.status === "fuzzy" ? "1px solid rgba(242,184,188,0.25)" : "1px solid rgba(68,64,60,0.5)"
            }}>

                <><Icon d='<path d="M20 6L9 17l-5-5"/>' size={14} style={{color:"#F7F1E6"}} /><span className="flex-1 text-stone-400 line-through">{p.name}</span><span className="text-[10px] text-emerald-500">already in</span></>

                <div className="flex-1 min-w-0">
                  <div className="text-stone-200">{p.name}</div>

                </div></>
