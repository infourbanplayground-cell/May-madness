        ? await drawCutCardAt(item.kind, { ...item, seed: item.key + (session ? session.id : "") },
                              photo, adj, 1)
        : null)
      || await drawLineupAt(item.kind, item, photo, adj, 1);
    try {
      const blob = await (await fetch(full)).blob();
      const f = new File([blob], `national-${item.key}.png`, { type: "image/png" });
      if (navigator.canShare && navigator.canShare({ files: [f] })) {
        await navigator.share({ files: [f], title: "56 National Series" });
        return;
      }
    } catch (e) { if (e && e.name === "AbortError") return; }
    const a = document.createElement("a");
    a.href = full; a.download = `national-${item.key}.png`;
    document.body.appendChild(a); a.click(); a.remove();
    setFlash("SAVED"); setTimeout(() => setFlash(""), 1600);
  };
  const copy = async () => {
    try { await navigator.clipboard.writeText(item.caption || ""); setFlash("CAPTION COPIED"); }
    catch (e) { setFlash("COULDN'T COPY"); }
    setTimeout(() => setFlash(""), 1600);
  };

  return (
    <div onClick={onClose} style={{ position: "fixed", inset: 0, zIndex: 90,
      background: "rgba(184,20,31,.9)", display: "flex", alignItems: "flex-end" }}>
      <div onClick={e => e.stopPropagation()} style={{ background: "#9E1520", width: "100%",
        maxHeight: "94vh", overflowY: "auto", borderTop: "3px solid #F7F1E6", padding: 16 }}>
        <div style={{ display: "grid",
                      gridTemplateColumns: `repeat(${Math.min(items.length, 4)},1fr)`, gap: 6 }}>
          {items.map((it, k) => (
            <button key={it.key} onClick={() => setI(k)} style={{ padding: "10px 4px", cursor: "pointer",
              background: i === k ? "#F7F1E6" : "transparent",
              color: i === k ? "#B8141F" : "#F2D0D3",
              border: "1px solid " + (i === k ? "#F7F1E6" : "rgba(242,208,211,.3)"),
              fontFamily: "'JetBrains Mono',monospace", fontWeight: 700, fontSize: 10,
              letterSpacing: ".12em" }}>{it.label}</button>
          ))}
        </div>

        {/* Add a photo without leaving: the card is where you find out you want
            one, and sending people to another tab to get it loses the moment. */}
        <div style={{ display: "grid",
                      gridTemplateColumns: photos.length > 0 && canUpload ? "1fr auto"
                                         : "1fr", gap: 6, marginTop: 8 }}>
          {photos.length > 0 && (
            <button onClick={() => setPh(p => (p + 2 > photos.length ? -1 : p + 1))}
              style={{ padding: "10px", cursor: "pointer",
                background: "transparent", color: ph >= 0 ? "#F7F1E6" : "#F2D0D3",
                border: "1px solid " + (ph >= 0 ? "rgba(247,241,230,.45)" : "rgba(242,208,211,.3)"),
                fontFamily: "'JetBrains Mono',monospace", fontWeight: 700, fontSize: 10,
                letterSpacing: ".12em" }}>
              {ph >= 0 ? `PHOTO ${ph + 1} / ${photos.length} — TAP TO CHANGE` : "USE A PHOTO FROM TONIGHT"}
            </button>
          )}
          {canUpload && (
            <label style={{ padding: "10px 14px", cursor: busy ? "default" : "pointer",
              textAlign: "center", color: "#F7F1E6", opacity: busy ? .5 : 1,
              border: "1px solid rgba(247,241,230,.45)",
              fontFamily: "'JetBrains Mono',monospace", fontWeight: 700, fontSize: 10,
              letterSpacing: ".12em" }}>
              {busy ? "UPLOADING\u2026" : (photos.length ? "+ ADD" : "+ ADD A PHOTO")}
              <input type="file" accept="image/*" multiple style={{ display: "none" }}
                disabled={busy}
                onChange={async e => {
                  const f = Array.from(e.target.files || []);
                  e.target.value = "";
                  if (!f.length) return;
                  setBusy(true);
                  const before = (session && session.photos ? session.photos.length : 0);
                  const urls = await addSessionPhotos(session, updateSession, f);
                  setBusy(false);
                  // Select what was just added, rather than making them hunt
                  // for it in the cycle.
                  if (urls.length) setPh(before);
                }} />
            </label>
          )}
        </div>

        {hasPhoto && (
          <button onClick={() => { setCutFail(false); setCut(v => !v); }}
            style={{ width: "100%", marginTop: 6, padding: "11px", cursor: "pointer",
              background: cut ? "#F7F1E6" : "transparent",
              color: cut ? "#B8141F" : "#F7F1E6",
              border: "1px solid " + (cut ? "#F7F1E6" : "rgba(247,241,230,.45)"),
              fontFamily: "'JetBrains Mono',monospace", fontWeight: 700, fontSize: 10,
              letterSpacing: ".14em" }}>
            {cut ? "CUT OUT \u00B7 ON" : "CUT THE BACKGROUND OUT"}
          </button>
        )}
        {cutFail && (
          <div style={{ marginTop: 6, fontSize: 11, color: "#F2B8BC", textAlign: "center" }}>
            Couldn't cut this one out &mdash; using the photo as it is.
          </div>
        )}

        <div style={{ display: "flex", justifyContent: "center", margin: "16px 0" }}>
          {url
            ? <img src={url} alt="" draggable={false}
                onPointerDown={onDown} onPointerMove={onMove}
                onPointerUp={onUp} onPointerCancel={onUp}
                style={{ width: 270, height: 480, display: "block",
                         border: "1px solid " + (dragging ? "#F7F1E6" : "rgba(242,208,211,.3)"),
                         cursor: hasPhoto ? (dragging ? "grabbing" : "grab") : "default",
                         touchAction: hasPhoto ? "none" : "auto",
                         userSelect: "none", WebkitUserSelect: "none" }} />
            : <div style={{ width: 270, height: 480, background: "#9E1520" }} />}
        </div>
        <div style={{ fontSize: 11, color: "#F2D0D3", textAlign: "center", marginBottom: 2 }}>
          {hasPhoto
            ? "Drag the card to move the photo. The preview is the file."
            : "Preview is the actual 1080\u00D71920 file, shown small."}
        </div>
        {hasPhoto && <LuPhotoControls adj={adj} setAdj={setAdj} hideWash={cut} />}
        {canUpload && (item.aId || item.bId) && (
          <LineupNames item={item} session={session} state={state} updateSession={updateSession} />
        )}

        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginTop: 14 }}>
          <button onClick={save} style={{ padding: "16px", background: "#F7F1E6", color: "#B8141F",
            border: "none", cursor: "pointer", fontFamily: "'JetBrains Mono',monospace",
            fontWeight: 700, fontSize: 11, letterSpacing: ".14em" }}>SHARE / SAVE</button>
          <button onClick={copy} style={{ padding: "16px", background: "transparent", color: "#F7F1E6",
            border: "1px solid rgba(247,241,230,.45)", cursor: "pointer",
            fontFamily: "'JetBrains Mono',monospace", fontWeight: 700, fontSize: 11,
            letterSpacing: ".14em" }}>COPY CAPTION</button>
        </div>
        {flash && <div style={{ textAlign: "center", color: "#F7F1E6", marginTop: 10,
          fontFamily: "'JetBrains Mono',monospace", fontSize: 11, letterSpacing: ".14em" }}>{flash}</div>}
        <button onClick={onClose} style={{ width: "100%", marginTop: 10, padding: "12px",
          background: "transparent", color: "#F2D0D3", border: "none", cursor: "pointer",
          fontFamily: "'JetBrains Mono',monospace", fontSize: 11, letterSpacing: ".14em" }}>CLOSE</button>
      </div>
    </div>
  );
}


const LU_ADJ0 = { x: 0, y: 0, zoom: 1, bright: 1, grade: 1 };

// Canvas filter is how brightness is applied; Safari only got it in 17. Where
// it is missing the slider is hidden rather than left there doing nothing.
const LU_CAN_FILTER = (() => {
  try { return typeof document.createElement("canvas").getContext("2d").filter === "string"; }
  catch (e) { return false; }
})();

// Cover-fit with a pan and a zoom, clamped so no amount of dragging can pull a
// gap in at an edge.
function luCoverAdj(g, im, x, y, w, h, adj) {
  g.imageSmoothingEnabled = true; g.imageSmoothingQuality = "high";
  const z = Math.max(1, (adj && adj.zoom) || 1);
  const r = Math.max(w / im.width, h / im.height) * z;
  const dw = im.width * r, dh = im.height * r;
  const mx = Math.max(0, (dw - w) / 2), my = Math.max(0, (dh - h) / 2);
  const ox = Math.max(-mx, Math.min(mx, (adj && adj.x) || 0));
  const oy = Math.max(-my, Math.min(my, (adj && adj.y) || 0));
  g.drawImage(im, x + (w - dw) / 2 + ox, y + (h - dh) / 2 + oy, dw, dh);
  return { mx, my };
}

// Draws the card at `scale`. luPaint is written entirely in 1080x1920 card
// coordinates, so a scaled context is all a cheap preview needs.
async function drawLineupAt(kind, d, photo, adj, scale) {
  const [im, logo, band] = await Promise.all([luImg(photo), luImg("assets/up-logo-national.png"), luImg(LU_BAND)]);
  LU_BAND_IMG = LU_BAND_IMG || band;
  await ncPreload(d);
  const mk = (img) => {
    const c = document.createElement("canvas");
    c.width = Math.round(LU_W * scale); c.height = Math.round(LU_H * scale);
    const g = c.getContext("2d");
    g.scale(scale, scale);
    ncPaint(g, kind, d, img, logo, adj, "photo");
    return c;
  };
  try { return mk(im).toDataURL(scale < 1 ? "image/jpeg" : "image/png", 0.86); }
  catch (e) { return mk(null).toDataURL("image/png"); }
}

// The controls. Drag anywhere on the card to move the photo; the rest is
// sliders, because a slider is the one control that works with a thumb on a
// phone held in one hand at the side of a court.
function LuPhotoControls({ adj, setAdj, disabled, hideWash }) {
  const row = (label, key, min, max, step, fmt) => (
    <div style={{ marginTop: 10, opacity: disabled ? .4 : 1 }}>
      <div style={{ display: "flex", justifyContent: "space-between",
        fontFamily: "'JetBrains Mono',monospace", fontWeight: 700, fontSize: 9,
        letterSpacing: ".2em", color: "#F2D0D3" }}>
        <span>{label}</span><span style={{ color: "#F7F1E6" }}>{fmt(adj[key])}</span>
      </div>
      <input type="range" min={min} max={max} step={step} value={adj[key]} disabled={disabled}
        onChange={e => setAdj(a => ({ ...a, [key]: parseFloat(e.target.value) }))}
        style={{ width: "100%", marginTop: 5, accentColor: "#F7F1E6" }} />
    </div>
  );
  return (
    <div style={{ marginTop: 6 }}>
      {row("ZOOM", "zoom", 1, 2.6, 0.02, v => v.toFixed(2) + "×")}
      {LU_CAN_FILTER && row("BRIGHTNESS", "bright", 0.5, 1.7, 0.02,
        v => (v > 1 ? "+" : "") + Math.round((v - 1) * 100) + "%")}
      {/* In cut-out mode the photograph is gone, so there is nothing for the
          wash to sit on and the slider would do nothing at all. */}
      {!hideWash && row("COLOUR WASH", "grade", 0, 1, 0.02, v => Math.round(v * 100) + "%")}
      <button onClick={() => setAdj({ ...LU_ADJ0 })} disabled={disabled}
        style={{ width: "100%", marginTop: 10, padding: 10, cursor: "pointer",
          background: "transparent", border: "1px solid rgba(242,208,211,.4)",
          color: "#F2D0D3", fontFamily: "'JetBrains Mono',monospace", fontWeight: 700,
          fontSize: 10, letterSpacing: ".2em" }}>RESET PHOTO</button>
    </div>
  );
}


// Cloudinary hosts the session photos, so the cut-out is a URL away. Anything
// not on Cloudinary (a data: URL, a local file during a test) has no cut-out
// and the caller falls back to the normal card.
function luCutoutUrl(url) {
  if (!url || typeof url !== "string") return null;
  if (!/res\.cloudinary\.com\/.+\/image\/upload\//.test(url)) return null;
  // Insert the transform right after /upload/, and ask for png — the whole
  // point is the alpha channel, and jpeg has none.
  return url.replace(/\/image\/upload\//, "/image/upload/e_background_removal/")
            .replace(/\.(jpg|jpeg|webp)(\?.*)?$/i, ".png");
}

// Where the ink actually is. A cut-out arrives with large transparent margins
// — whatever the original frame was — so fitting it by its own width and
// height stands the players somewhere arbitrary. This finds the real bounds.
function luInkBox(im) {
  const S = 220;                       // scanning at full size is pointless
  const c = document.createElement("canvas");
  const r = Math.min(S / im.width, S / im.height);
  c.width = Math.max(1, Math.round(im.width * r));
  c.height = Math.max(1, Math.round(im.height * r));
  const g = c.getContext("2d", { willReadFrequently: true });
  g.drawImage(im, 0, 0, c.width, c.height);
  let d;
  try { d = g.getImageData(0, 0, c.width, c.height).data; }
  catch (e) { return { x: 0, y: 0, w: im.width, h: im.height }; }
  let x0 = c.width, y0 = c.height, x1 = -1, y1 = -1;
  for (let y = 0; y < c.height; y++) {
    for (let x = 0; x < c.width; x++) {
      if (d[(y * c.width + x) * 4 + 3] > 24) {
        if (x < x0) x0 = x; if (x > x1) x1 = x;
        if (y < y0) y0 = y; if (y > y1) y1 = y;
      }
    }
  }
  if (x1 < 0) return { x: 0, y: 0, w: im.width, h: im.height };
  const sx = im.width / c.width, sy = im.height / c.height;
  return { x: x0 * sx, y: y0 * sy, w: (x1 - x0 + 1) * sx, h: (y1 - y0 + 1) * sy };
}

// A tiny seeded PRNG. The streaks are generated rather than loaded from a
// file, so every card is its own and none of it costs an image request or a
// generation credit — and seeding from the session means a given night always
// comes out the same, which matters when a card is re-made after a correction.
function luRng(seed) {
  let s = 0;
  for (const ch of String(seed || "blackout")) s = (s * 31 + ch.charCodeAt(0)) | 0;
  s = (s ^ 0x9e3779b9) >>> 0;
  return () => {
    s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0;
    return s / 4294967296;
  };
}

function luStreaks(g, seed) {
  const rnd = luRng(seed);
  g.globalCompositeOperation = "screen";
  for (let i = 0; i < 46; i++) {
    const y = rnd() * LU_H;
    const h = 2 + rnd() * 7;
    const w = (0.18 + rnd() * 0.75) * LU_W;
    const x = rnd() < 0.62 ? LU_W - w - rnd() * 90 : rnd() * 120;
    const a = 0.08 + rnd() * 0.42;
    const lg = g.createLinearGradient(x, 0, x + w, 0);
    const fromRight = x + w > LU_W * 0.7;
    lg.addColorStop(0, fromRight ? "rgba(247,241,230,0)" : "rgba(247,241,230," + a + ")");
    lg.addColorStop(1, fromRight ? "rgba(247,241,230," + a + ")" : "rgba(247,241,230,0)");
    g.fillStyle = lg;
    g.fillRect(x, y, w, h);
  }
  // The magenta bleed up the left edge — the only place magenta is allowed to
  // be a field rather than an accent. Radial, not a rectangle with a sideways
  // gradient: that version faded out horizontally but stopped dead top and
  // bottom, and the two hard horizontal seams were the first thing you saw.
  g.globalCompositeOperation = "screen";
  const mg = g.createRadialGradient(-LU_W * 0.10, LU_H * 0.52, 0,
                                    -LU_W * 0.10, LU_H * 0.52, LU_W * 0.80);
  mg.addColorStop(0, "rgba(242,184,188,.42)");
  mg.addColorStop(0.45, "rgba(242,184,188,.16)");
  mg.addColorStop(1, "rgba(242,184,188,0)");
  g.fillStyle = mg; g.fillRect(0, 0, LU_W, LU_H);
  g.globalCompositeOperation = "source-over";
}


// The H5 painter. Draw order is the design: ground, streaks, lamps, header,
// display type, PEOPLE, then the plates — the names are the one thing on this
// card that may never be covered by anything.
function luPaintCut(g, kind, d, cut, logo, adj) {
  adj = adj || LU_ADJ0;
  const L = 80, R = LU_W - 80, W = R - L;
  g.textBaseline = "alphabetic";

  g.fillStyle = "#B8141F"; g.fillRect(0, 0, LU_W, LU_H);
  luStreaks(g, d.seed || d.key || "blackout");

  // the two lamps
  const lamp = (cx, cy, rad, rgb, a) => {
    const r2 = g.createRadialGradient(cx, cy, 0, cx, cy, rad);
    r2.addColorStop(0, `rgba(${rgb},${a})`);
    r2.addColorStop(0.2, `rgba(${rgb},${a * 0.5})`);
    r2.addColorStop(0.55, `rgba(${rgb},${a * 0.14})`);
    r2.addColorStop(1, `rgba(${rgb},0)`);
    g.fillStyle = r2; g.fillRect(0, 0, LU_W, LU_H);
  };
  g.globalCompositeOperation = "screen";
  lamp(20, 820, 700, "12,168,86", 0.88);
  lamp(1060, 660, 620, "12,168,86", 0.58);
  lamp(540, 300, 480, "247,241,230", 0.26);
  g.globalCompositeOperation = "source-over";

  // header
  g.fillStyle = "#F7F1E6"; g.fillRect(0, 0, LU_W, 10);
  g.fillStyle = "#F7F1E6"; g.fillRect(L, 146, 16, 16);
  stMono(g, "56 NATIONAL SERIES · VOL.9", L + 40, 161, 26, "#F7F1E6", 6);

  const big = kind === "champs" ? ["NIGHT", "CHAMPIONS"]
            : kind === "final"  ? ["THE", "FINAL"]
            : ["SEMI", "FINAL"];

  // The ghost word, bleeding past both edges. It is allowed off the canvas —
  // that is the point of it — so it is NOT fitted to the card's width.
  {
    const t = big[1];
    const sz = stFit(g, t, LU_W * 1.30, 300, 900);
    g.font = `italic 900 ${sz}px Archivo, sans-serif`;
    g.fillStyle = "rgba(247,241,230,.55)";
    g.fillText(t, (LU_W - g.measureText(t).width) / 2, 620);
  }
  stDisp(g, big[0], L, 350, 150, "#FFFFFF", W);

  // ── the players ──
  // Stood on a floor just above the plates and fitted inside the card on BOTH
  // axes: fitting on height alone ran a row of four past each edge and sliced
  // the outside two.
  if (cut) {
    const FEET = 1215, HEAD_MIN = 470;
    const b = luInkBox(cut);
    const z = Math.max(1, adj.zoom || 1);
    const r = Math.min(LU_W * 0.94 / b.w, (FEET - HEAD_MIN) / b.h) * z;
    const dw = b.w * r, dh = b.h * r;
    const x = (LU_W - dw) / 2 + (adj.x || 0);
    const y = FEET - dh + (adj.y || 0);
    g.save();
    if (LU_CAN_FILTER && adj.bright && adj.bright !== 1) g.filter = `brightness(${adj.bright})`;
    g.imageSmoothingEnabled = true; g.imageSmoothingQuality = "high";
    g.drawImage(cut, b.x, b.y, b.w, b.h, x, y, dw, dh);
    g.restore();
  }

  // ── plates ──
  const PH = 116;
  const plate = (y, name, chip, colour, score, dim) => {
    g.fillStyle = "rgba(12,12,12,.9)";
    g.fillRect(L, y, W, PH);
    g.strokeStyle = colour; g.lineWidth = 3;
    g.strokeRect(L + 1.5, y + 1.5, W - 3, PH - 3);
    const tail = score ? 110 : (chip ? 130 : 0);
    const size = stFit(g, name, W - 64 - tail, 44, 900);
    g.font = `italic 900 ${size}px Archivo, sans-serif`;
    g.fillStyle = dim ? "#F2D0D3" : "#FFFFFF";
    g.fillText(name, L + 32, y + PH / 2 + size * 0.34);
    if (score) {
      g.font = "italic 900 52px Archivo, sans-serif";
      g.fillStyle = dim ? "#F2D0D3" : colour;
      g.fillText(score, R - 32 - g.measureText(score).width, y + PH / 2 + 18);
    } else if (chip) {
      g.font = '700 22px "JetBrains Mono", monospace';
      g.fillStyle = colour;
      g.fillText(chip, R - 32 - g.measureText(chip).width, y + PH / 2 + 8);
    }
  };
  const baseY = 1230;
  if (kind === "champs") {
    plate(baseY, (d.a || "").toUpperCase(), "", "#F7F1E6", d.aScore,
          false, "#0CA856");
    g.font = '700 22px "JetBrains Mono", monospace'; g.fillStyle = "#F2D0D3";
    { const t = "BEAT"; g.fillText(t, (LU_W - g.measureText(t).width) / 2, baseY + PH + 44); }
    plate(baseY + PH + 72, (d.b || "").toUpperCase(), "", "#F2D0D3", d.bScore, true);
  } else {
    plate(baseY, (d.a || "TBD").toUpperCase(), d.aChip || "", "#F7F1E6");
    g.font = "900 26px Archivo, sans-serif"; g.fillStyle = "#F2B8BC";
    { const t = "V S"; g.fillText(t, (LU_W - g.measureText(t).width) / 2, baseY + PH + 44); }
    plate(baseY + PH + 72, (d.b || "TBD").toUpperCase(), d.bChip || "", "#F2B8BC");
  }

  // ── footer ──
  if (logo) {
    const lh = 186, lw = lh * (logo.width / logo.height);
    const off = document.createElement("canvas");
    off.width = Math.ceil(lw); off.height = lh;
    const o = off.getContext("2d");
    o.drawImage(logo, 0, 0, lw, lh);
    o.globalCompositeOperation = "source-in";
    o.fillStyle = "#F7F1E6"; o.fillRect(0, 0, lw, lh);
    g.drawImage(off, (LU_W - lw) / 2, LU_H - 350);
  }
  g.font = '700 26px "JetBrains Mono", monospace';
  g.fillStyle = "#F2D0D3";
  {
    const t = d.foot || "";
    let cx = (LU_W - (g.measureText(t).width + (t.length - 1) * 6)) / 2;
    for (const ch of t) { g.fillText(ch, cx, LU_H - 116); cx += g.measureText(ch).width + 6; }
  }

  // scanlines and grain, over everything including the type — the grain is
  // what stops a flat black ground banding on a phone screen.
  g.fillStyle = "rgba(0,0,0,.05)";
  for (let y = 0; y < LU_H; y += 8) g.fillRect(0, y, LU_W, 2);
  luTrim(g);
}

// Renders the cut-out card at `scale`. Returns null when there is no cut-out to
// be had, so the caller can fall back rather than paint an empty poster.
async function drawCutCardAt(kind, d, photo, adj, scale) {
  const cutUrl = luCutoutUrl(photo);
  if (!cutUrl) return null;
  const [cut, logo, band] = await Promise.all([luImg(cutUrl), luImg("assets/up-logo-national.png"), luImg(LU_BAND)]);
  LU_BAND_IMG = LU_BAND_IMG || band;
  await ncPreload(d);
  if (!cut) return null;
  const c = document.createElement("canvas");
  c.width = Math.round(LU_W * scale); c.height = Math.round(LU_H * scale);
  const g = c.getContext("2d");
  g.scale(scale, scale);
  ncPaint(g, kind, d, cut, logo, adj, "cut");
  try { return c.toDataURL(scale < 1 ? "image/jpeg" : "image/png", 0.86); }
  catch (e) { return null; }
}


const AV_SIZE = 512;

// Face-aware crop. c_thumb with g_face finds the face and crops to it; c_fill
// with g_auto does not — it was tested and simply letterboxes the frame.
// Background removed, then cropped to the face. The order matters: removal
// first means the face detector is looking at a subject on nothing, and the
// crop lands on the person rather than on whatever the camera also caught.
function avCutFaceUrl(url, size = AV_SIZE) {
  if (!url || !/res\.cloudinary\.com\/.+\/image\/upload\//.test(url)) return null;
  return url.replace(/\/image\/upload\//,
      `/image/upload/e_background_removal/c_thumb,g_face,w_${size},h_${size}/`)
    .replace(/\.(jpg|jpeg|webp)(\?.*)?$/i, ".png");
}

function avFaceUrl(url, size = AV_SIZE) {
  if (!url || !/res\.cloudinary\.com\/.+\/image\/upload\//.test(url)) return null;
  return url.replace(/\/image\/upload\//,
    `/image/upload/c_thumb,g_face,w_${size},h_${size}/e_improve/`);
}

// The volume's ground for a cut-out portrait: near-black with the two lamps
// behind the head, the same light the line-up cards use, scaled to a square.
function avGround(g, S) {
  g.fillStyle = "#B8141F"; g.fillRect(0, 0, S, S);
  const lamp = (cx, cy, rad, rgb, a) => {
    const r2 = g.createRadialGradient(cx, cy, 0, cx, cy, rad);
    r2.addColorStop(0, `rgba(${rgb},${a})`);
    r2.addColorStop(0.35, `rgba(${rgb},${a * 0.42})`);
    r2.addColorStop(1, `rgba(${rgb},0)`);
    g.fillStyle = r2; g.fillRect(0, 0, S, S);
  };
  g.globalCompositeOperation = "screen";
  lamp(S * 0.26, S * 0.46, S * 0.62, "242,184,188", 0.52);
  lamp(S * 0.78, S * 0.28, S * 0.58, "247,241,230", 0.56);
  g.globalCompositeOperation = "source-over";
}

// Composite a cut-out onto that ground, standing on the bottom edge.
function avComposite(cut, S = AV_SIZE) {
  const c = document.createElement("canvas");
  c.width = S; c.height = S;
  const g = c.getContext("2d");
  avGround(g, S);
  g.imageSmoothingEnabled = true; g.imageSmoothingQuality = "high";
  const square = Math.abs(cut.width - cut.height) / Math.max(cut.width, cut.height) < 0.05;
  if (square) {
    // Cloudinary already framed this on the face and returned a square, so it
    // goes on at 1:1 and the ground shows through the transparency. Re-fitting
    // it to its own ink box, which the first version did, re-centres a crop
    // that was already correct and leaves a band of empty ground above the
    // head.
    g.drawImage(cut, 0, 0, S, S);
  } else {
    // An un-cropped cut-out: fit on BOTH axes. Height alone pushes a wide
    // subject past the sides, which crops the very thing being cut out.
    const b = luInkBox(cut);
    const r = Math.min(S * 0.86 / b.w, S * 0.94 / b.h);
    const dw = b.w * r, dh = b.h * r;
    g.drawImage(cut, b.x, b.y, b.w, b.h, (S - dw) / 2, S - dh, dw, dh);
  }
  return c.toDataURL("image/jpeg", 0.92);
}

// The whole pipeline, with a fallback at every step.
//
// Returns a URL to store in photoUrl, or null to mean "use the old path".
async function buildBrandAvatar(file) {
  let cloudUrl = null;
  try {
    // A generous source: the cut-out and the face crop both want more than the
    // 200px the avatar used to be stored at.
    const src = await resizePhotoToBase64(file, 1400);
    cloudUrl = await uploadFramedPhotoToCloud(src);
  } catch (e) { return null; }
  if (!cloudUrl || !cloudUrl.startsWith("http")) return null;

  // 1. background removed AND framed on the face, in one transform, then
  //    composited on the volume's ground.
  //
  //    Chaining the two is the whole trick. Cutting out alone does not fix
  //    framing — a full-body shot comes back as a tiny figure on a nice
  //    gradient — and cropping alone leaves 314 different fences behind 314
  //    people. Cloudinary applies them in sequence, so one URL gets both.
  const cutUrl = avCutFaceUrl(cloudUrl);
  if (cutUrl) {
    const cut = await luImg(cutUrl);
    if (cut) {
      try {
        const out = await uploadFramedPhotoToCloud(avComposite(cut));
        if (out && out.startsWith("http")) return out;
      } catch (e) { /* fall through */ }
    }
  }
  // 2. no cut-out to be had — a face-aware crop still beats a centre crop
  const face = avFaceUrl(cloudUrl);
  if (face) {
    const ok = await luImg(face);
    if (ok) return face;
  }
  // 3. the plain upload, which at least is a URL rather than 30KB of base64
  return cloudUrl;
}


// ── one group's block: letter tile, name, rows ────────────────────────────
//
// Row height adapts to the number of teams rather than the card scrolling or
// clipping: a 4-team group gets tall rows, a 6-team group gets short ones, and
// both fill the same band. The alternative — a fixed row height — silently
// drops the bottom team of a big group off the card, which is exactly the team
// most likely to be checking.
function gcGroup(g, d, x, y, w, h) {
  const HEAD = 62;
  const rows = d.rows || [];
  const n = Math.max(1, rows.length);
  const gap = 8;
  const rh = Math.max(52, Math.min(96, (h - HEAD - gap * n) / n));

  // letter tile
  g.fillStyle = "#F7F1E6";
  g.fillRect(x, y, HEAD - 10, HEAD - 10);
  g.font = "italic 900 34px Archivo, sans-serif";
  g.fillStyle = "#B8141F";
  {
    const t = d.letter;
    g.fillText(t, x + (HEAD - 10 - g.measureText(t).width) / 2, y + HEAD - 10 - 16);
  }
  g.font = '700 23px "JetBrains Mono", monospace';
  g.fillStyle = "#F2D0D3";
  {
    let cx = x + HEAD + 4;
    for (const ch of (d.title || "")) { g.fillText(ch, cx, y + 36); cx += g.measureText(ch).width + 4; }
  }
  if (d.note) {
    g.font = '700 19px "JetBrains Mono", monospace';
    g.fillStyle = "#F2D0D3";
    g.fillText(d.note, x + w - g.measureText(d.note).width, y + 36);
  }

  let ry = y + HEAD;
  rows.forEach((r, i) => {
    // Three states, not two. A third-placed team in a three-group night has
    // NOT been knocked out when this card goes up: either it is one of the best
    // thirds or it is in the thirds playoff, and in playoff mode that match has
    // not been played yet. Dimming it pre-judged a result — and did it using
    // the phantom-bye numbers, which is how a team with a worse real record
    // came out ahead of one with a better one.
    const live = r.through === true;       // through, decided
    const alive = r.through === "alive";   // still in it, not yet decided
    const out = r.through === false;       // done
    g.fillStyle = live ? "rgba(247,241,230,.09)"
                : alive ? "rgba(242,184,188,.07)"
                : "rgba(15,15,15,.9)";
    g.fillRect(x, ry, w, rh);
    g.strokeStyle = live ? "#F7F1E6" : alive ? "#F2B8BC" : "rgba(242,208,211,.3)";
    g.lineWidth = live || alive ? 3 : 2;
    g.strokeRect(x + 1.5, ry + 1.5, w - 3, rh - 3);

    // Position, but only on a card that HAS positions. On the draw nothing has
    // been played, so a column of 1-2-3-4 beside the names is read as a ranking
    // the organiser has made — and the order there is just the order the teams
    // were entered.
    if (d.ordered) {
      g.font = '700 ' + Math.round(rh * 0.34) + 'px "JetBrains Mono", monospace';
      g.fillStyle = live ? "#F7F1E6" : alive ? "#F2B8BC" : out ? "#F2D0D3" : "#F2D0D3";
      g.fillText(String(i + 1), x + 22, ry + rh / 2 + rh * 0.12);
    }

    // name — shrink to fit the room that is actually left after the tail
    const tail = r.tail ? 190 : 0;
    const nx = x + (d.ordered ? 68 : 26);
    const room = w - (nx - x) - 26 - tail;
    const size = stFit(g, r.name, room, Math.round(rh * 0.42), 900);
    g.font = `italic 900 ${size}px Archivo, sans-serif`;
    g.fillStyle = out ? "#F2B8BC" : "#FFFFFF";
    g.fillText(r.name, nx, ry + rh / 2 + size * 0.34);

    if (r.tail) {
      g.font = '700 ' + Math.round(rh * 0.3) + 'px "JetBrains Mono", monospace';
      g.fillStyle = live ? "#F7F1E6" : alive ? "#F2B8BC" : out ? "#F2D0D3" : "#F2D0D3";
      g.fillText(r.tail, x + w - 26 - g.measureText(r.tail).width, ry + rh / 2 + rh * 0.11);
    }
    ry += rh + gap;
  });
  return ry;
}

// ── the painter ───────────────────────────────────────────────────────────
function gcPaint(g, kind, d, logo, faces) {
  g.fillStyle = "#B8141F"; g.fillRect(0, 0, LU_W, LU_H);

  // the volume's two washes, same corners as every other card in the set
  let rg = g.createRadialGradient(LU_W, LU_H * 0.1, 0, LU_W, LU_H * 0.1, LU_W);
  rg.addColorStop(0, "rgba(123,43,255,.26)"); rg.addColorStop(1, "rgba(123,43,255,0)");
  g.fillStyle = rg; g.fillRect(0, 0, LU_W, LU_H);
  rg = g.createRadialGradient(0, LU_H * 0.95, 0, 0, LU_H * 0.95, LU_W);
  rg.addColorStop(0, "rgba(247,241,230,.10)"); rg.addColorStop(1, "rgba(247,241,230,0)");
  g.fillStyle = rg; g.fillRect(0, 0, LU_W, LU_H);
  g.fillStyle = "rgba(247,241,230,.04)";
  for (let y = 0; y < LU_H; y += 10) g.fillRect(0, y, LU_W, 2);
  g.fillStyle = "#F7F1E6"; g.fillRect(0, 0, LU_W, 10);

  const L = 76, R = LU_W - 76, W = R - L;
  g.textBaseline = "alphabetic";

  // ── header ──
  const ms = 64, my = 104;
  g.fillStyle = "#F7F1E6"; g.fillRect(L, my, ms, ms);
  g.fillStyle = "#B8141F";
  [[0.47, 0.03], [0.59, 0.06], [0.73, 0.09], [0.89, 0.11]].forEach(([t, h]) =>
    g.fillRect(L, my + ms * t, ms, ms * h));
  g.fillStyle = "#F2B8BC"; g.fillRect(L + ms * 0.75, my + ms * 0.12, ms * 0.13, ms * 0.13);
  stMono(g, "56 NATIONAL SERIES · VOL.9", L + ms + 22, my + ms * 0.64, 20, "#F2D0D3", 3);

  stMono(g, (d.eyebrow || "").toUpperCase(), L, 258, 24, "#F2B8BC", 5);
  const big = kind === "draw"    ? ["THE", "DRAW"]
            : kind === "tables"  ? ["GROUP", "TABLES"]
            :                      ["THE", "BRACKET"];
  stDisp(g, big[0], L, 360, 120, "#FFFFFF", W);
  stDisp(g, big[1], L, 472, 120, "#F7F1E6", W);

  // A key, on the one card that needs one. Lime means "through" here and it
  // means nothing on the draw card, so stating it only where it carries meaning
  // keeps it from becoming decoration people stop reading.
  let TOP = 540;
  if (d.keys && d.keys.length) {
    let kx = L;
    d.keys.forEach(([col, label]) => {
      g.fillStyle = col; g.fillRect(kx, 512, 20, 20);
      kx += 30;
      g.font = '700 19px "JetBrains Mono", monospace';
      g.fillStyle = "#F2D0D3";
      for (const ch of label) { g.fillText(ch, kx, 529); kx += g.measureText(ch).width + 3; }
      kx += 34;
    });
    TOP = 572;
  }

  // ── body ──
  const BOT = LU_H - 360;
  if (kind === "bracket") {
    gcBracket(g, d, L, TOP, W, BOT - TOP, faces || new Map());
  } else {
    const groups = d.groups || [];
    const n = Math.max(1, groups.length);
    const gap = 30;
    const bh = (BOT - TOP - gap * (n - 1)) / n;
    groups.forEach((gr, i) => gcGroup(g, gr, L, TOP + i * (bh + gap), W, bh));
  }

  // ── footer ──
  if (logo) {
    const lh = 150, lw = lh * (logo.width / logo.height);
    const off = document.createElement("canvas");
    off.width = Math.ceil(lw); off.height = lh;
    const o = off.getContext("2d");
    o.drawImage(logo, 0, 0, lw, lh);
    o.globalCompositeOperation = "source-in";
    o.fillStyle = "#F7F1E6";
    o.fillRect(0, 0, lw, lh);
    g.drawImage(off, (LU_W - lw) / 2, LU_H - 310);
  }
  g.font = '700 24px "JetBrains Mono", monospace';
  g.fillStyle = "#F2D0D3";
  {
    const t = d.foot || "";
    let cx = (LU_W - (g.measureText(t).width + (t.length - 1) * 6)) / 2;
    for (const ch of t) { g.fillText(ch, cx, LU_H - 116); cx += g.measureText(ch).width + 6; }
  }
  luTrim(g);
}

// ── the knockout, round by round ──────────────────────────────────────────
//
// Not three columns. A bracket tree wants landscape: at 1080 wide, three
// columns leave about 300px a slot, and "ALMUNTASER & MUATASIM" does not fit in
// 300px at any size you would want to read on a phone — the first version of
// this card had names running through their own scores and out past the border.
//
// So the rounds stack, which gives every tie the width a doubles name actually
// needs and reads top to bottom the way a story card is already read. The cost
// used to be that it did not read as a BRACKET at all: three labelled blocks of
// identical rows, no sense of anything narrowing, and the night's champion
// drawn exactly like a quarter-final loser. Three things fix that without
// taking the width back:
//
//   · each round is INSET from the one before, so the card visibly narrows
//   · a chevron between rounds, so the eye is pushed down the tree
//   · the final is taller, and the champions get the foot of the card
//
// The champion block is the payoff the card was missing. It is drawn only when
// the final has actually been won — a card that announces an empty winner is
// worse than one that stops at the semis.
function gcBracket(g, d, x, y, w, h, faces) {
  const cols = (d.cols || []).filter(c => c.ties && c.ties.length);
  if (!cols.length) return;

  // Who won the night, if anyone has yet.
  const last = cols[cols.length - 1];
  const fin = last.label === "FINAL" ? last.ties[0] : null;
  const champ = fin ? (fin.aWon ? fin.a : fin.bWon ? fin.b : "") : "";
  const CH = champ ? 190 : 0;

  const ties = cols.reduce((n, c) => n + c.ties.length, 0);
  // RGAP separates one TIE from the next; the 4px inside a tie binds its two
  // rows together. At 10 the two gaps were close enough that a round of four
  // ties read as one list of eight names.
  const LBL = 34, SGAP = 30, RGAP = 26, STEP = 52;
  const CGAP = 44;
  const band = h - (champ ? CH + CGAP : 0);
  const avail = band - cols.length * (LBL + SGAP) - (ties - cols.length) * RGAP;
  // The final is drawn 1.55x the others, so the row count it costs is not 1.
  // 1.18 was enough to mark it as the final and not enough to carry a face:
  // its rows came out 52px, the faces 35px, and at story-on-a-phone scale that
  // is a smudge. At 1.55 they are 52px of face, which is the size the
  // champions block proves works.
  const units = ties + (fin ? 0.55 : 0);
  const th = Math.max(72, Math.min(132, avail / units));

  // A two-round night does not have enough ties to fill the band, and the row
  // height is capped, so the slack has to go somewhere. Pinning the champions
  // to the foot of the band put all of it in ONE GAP in the middle of the
  // card — 280px of nothing between the final and the winners. Measuring the
  // block first and centring it keeps a short bracket together and leaves a
  // full one exactly where it was.
  const rowsH = cols.reduce((n, c) =>
    n + LBL + c.ties.length * (c.label === "FINAL" ? th * 1.55 : th)
      + (c.ties.length - 1) * RGAP + SGAP, 0) - SGAP;
  const contentH = rowsH + (champ ? CGAP + CH : 0);
  let cy = y + Math.max(0, (h - contentH) / 2);
  const top = cy;
  cols.forEach((col, ci) => {
    // Each round sits inside the one before it. This is the whole reason the
    // card reads as a bracket rather than as a list of results.
    const inset = ci * STEP;
    const cx = x + inset, cw = w - inset * 2;
    const isFinal = col.label === "FINAL";
    const rowH = isFinal ? th * 1.55 : th;

    g.font = '700 19px "JetBrains Mono", monospace';
    g.fillStyle = isFinal ? "#F7F1E6" : "#F2D0D3";
    {
      let tx = cx;
      for (const ch of col.label) { g.fillText(ch, tx, cy + 18); tx += g.measureText(ch).width + 3; }
    }
    cy += LBL;
    col.ties.forEach(t => {
      const rh = (rowH - 4) / 2;
      [[t.a, t.aWon, t.aScore, t.aPics], [t.b, t.bWon, t.bScore, t.bPics]].forEach(([nm, won, sc, pics], k) => {
        const ry = cy + k * (rh + 4);
        g.fillStyle = won ? "rgba(247,241,230,.10)" : "rgba(15,15,15,.9)";
        g.fillRect(cx, ry, cw, rh);
        g.strokeStyle = won ? "#F7F1E6" : "rgba(242,208,211,.3)";
        g.lineWidth = won ? 3 : 2;
        g.strokeRect(cx + 1.5, ry + 1.5, cw - 3, rh - 3);
        // Faces, but ONLY on the final. A quarter-final row is ~44px tall, so
        // a face in it lands at about 16px once a story is rendered on a phone
        // — unrecognisable, and it steals the width the name needs. The final
        // is the one round with the height to carry them.
        let tx = cx + 24;
        if (isFinal && pics && pics.length) {
          const fr = rh * 0.40;
          pics.slice(0, 2).forEach((q, j) => {
            gcFace(g, q, cx + 20 + fr + j * fr * 1.55, ry + rh / 2, fr, faces);
          });
          tx = cx + 20 + fr * 2.55 + fr + 18;
        }
        const size = stFit(g, nm || "TBD", cx + cw - 70 - 24 - tx, Math.round(rh * 0.5), 900);
        g.font = `italic 900 ${size}px Archivo, sans-serif`;
        g.fillStyle = nm ? (won ? "#FFFFFF" : "#F2B8BC") : "rgba(247,241,230,.35)";
        g.fillText(nm || "TBD", tx, ry + rh / 2 + size * 0.34);
        if (sc) {
          g.font = `700 ${Math.round(rh * 0.42)}px "JetBrains Mono", monospace`;
          g.fillStyle = won ? "#F7F1E6" : "#F2D0D3";
          g.fillText(sc, cx + cw - 24 - g.measureText(sc).width, ry + rh / 2 + rh * 0.15);
        }
      });
      cy += rowH + RGAP;
    });
    cy += SGAP - RGAP;
    // The chevron between rounds. Small, dim, and pointing the way the tree
    // goes — enough to say "and then", not enough to compete with a name.
    if (ci < cols.length - 1) {
      const mx = x + w / 2, my = cy - SGAP / 2 - 2, s = 13;
      g.strokeStyle = "rgba(247,241,230,.45)"; g.lineWidth = 3;
      g.beginPath();
      g.moveTo(mx - s, my - s / 2); g.lineTo(mx, my + s / 2); g.lineTo(mx + s, my - s / 2);
      g.stroke();
    }
  });

  // ── champions ──
  if (champ) {
    const by = top + rowsH + CGAP, bh = CH;
    g.fillStyle = "rgba(247,241,230,.08)";
    g.fillRect(x, by, w, bh);
    g.strokeStyle = "#F7F1E6"; g.lineWidth = 3;
    g.strokeRect(x + 1.5, by + 1.5, w - 3, bh - 3);
    g.font = '700 19px "JetBrains Mono", monospace';
    g.fillStyle = "#F7F1E6";
    {
      let tx = x + 28;
      for (const ch of "CHAMPIONS") { g.fillText(ch, tx, by + 44); tx += g.measureText(ch).width + 4; }
    }
    // The champions get the biggest faces on the card — at this size they
    // still read once a story is scaled down to a phone, which is the whole
    // reason the earlier rounds do not get them.
    const cp = fin ? (fin.aWon ? fin.aPics : fin.bPics) : null;
    let right = x + w - 28;
    if (cp && cp.length) {
      const fr = 52;
      // Left to right, so the faces are in the same order as the two names
      // beside them. Drawn right-to-left they put the second player's face
      // first, which reads as the wrong person winning.
      cp.slice(0, 2).forEach((q, j) => {
        gcFace(g, q, x + w - 36 - fr - (1 - j) * fr * 1.6, by + bh / 2 + 8, fr, faces);
      });
      right = x + w - 36 - fr * 2.6 - fr - 20;
    }
    const size = stFit(g, champ, right - (x + 28), 70, 900);
    g.font = `italic 900 ${size}px Archivo, sans-serif`;
    g.fillStyle = "#FFFFFF";
    g.fillText(champ, x + 28, by + bh - 34);
  }
}

async function drawGroupCard(kind, d) {
  const [logo, band] = await Promise.all([
    luImg("assets/up-logo-national.png"), luImg(LU_BAND)]);
  LU_BAND_IMG = LU_BAND_IMG || band;
  LU_TILE_IMG = LU_TILE_IMG || await luImg(LU_TILE);
  await ngPreload(d);
  // Only the rounds with room for a face are drawn with one, so only those are
  // fetched. luImg resolves null rather than rejecting, so a photo that will
  // not load costs an initial, not the card.
  const urls = [];
  (d.cols || []).forEach(c => (c.ties || []).forEach(t =>
    [...(t.aPics || []), ...(t.bPics || [])].forEach(q => { if (q.url) urls.push(q.url); })));
  const uniq = [...new Set(urls)];
  const loaded = await Promise.all(uniq.map(luImg));
  const faces = new Map();
  uniq.forEach((u, i) => { if (loaded[i]) faces.set(u, loaded[i]); });
  const c = document.createElement("canvas");
  c.width = LU_W; c.height = LU_H;
  ngPaint(c.getContext("2d"), kind, d, logo, faces);
  return c.toDataURL("image/png");
}

// One face, round, with the initial when there is no photo. The ring is what
// stops a dark photo dissolving into a dark card.
function gcFace(g, q, cx, cy, r, faces) {
  const im = q && q.url ? faces.get(q.url) : null;
  g.save();
  g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.clip();
  if (im) {
    luCover(g, im, cx - r, cy - r, r * 2, r * 2);
  } else {
    g.fillStyle = "#1A0A0C"; g.fillRect(cx - r, cy - r, r * 2, r * 2);
    g.font = `italic 900 ${Math.round(r * 0.95)}px Archivo, sans-serif`;
    g.fillStyle = "#F2D0D3"; g.textAlign = "center";
    g.fillText((q && q.init) || "?", cx, cy + r * 0.34);
    g.textAlign = "left";
  }
  g.restore();
  g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2);
  g.strokeStyle = "rgba(247,241,230,.55)"; g.lineWidth = 2.5; g.stroke();
}


// Everything the three cards need, read off the session the same way the
// screens read it. Nothing here re-derives a standing or a qualifier: the group
// table comes from calcGroupStandings and who goes through comes from
// qualifyingTeamIds, which is the function the bracket itself seeds from. A
// card that promised a spot the bracket then did not honour would be worse than
// no card at all.
function buildGroupCards(session, state, idx) {
  const teams = session.teams || [];
  const players = state.players || [];
  // The same resolver the line-up cards use, so a team renamed on one post is
  // renamed on all of them. A draw card and a champions card that disagree
  // about what a pair is called is worse than either name being wrong.
  const nm = id => teamCardLabel(session, state, id);
  const groups = getSessionGroups(session).filter(gr => teams.some(t => t.group === gr));
  const played = (session.groupMatches || []).filter(m => m.winner).length;
  const total = (session.groupMatches || []).length;
  const groupsDone = total > 0 && played === total;
  const no = idx + 1;
  const date = fmtNightDate(session.date);
  const foot = "NATIONAL.URBANPADEL.OM";

  // ── THE DRAW ── seeds, not results. Posted before anyone has lost.
  const draw = {
    eyebrow: `SESSION ${no} · ${date}`,
    foot,
    groups: groups.map(gr => {
      const inG = teams.filter(t => t.group === gr);
      return {
        letter: gr, title: "GROUP " + gr, ordered: false,
        note: inG.length + " TEAMS",
        rows: inG.map(t => ({
          name: nm(t.id).toUpperCase(),
          tail: t.seed ? "SEED " + t.seed : "",
          through: null,
        })),
      };
    }),
    caption: `Session ${no} draw. ${teams.length} teams, ${groups.length} groups. `
           + `Table and live scores: national.urbanpadel.om`,
  };

  // ── THE TABLES ── where it stands, and who that puts through.
  const through = qualifyingTeamIds(session);
  // The top `qualifyCount` of a group are through on their own merit and
  // nothing later can take it away. Everyone below them in a three-group night
  // is NOT automatically out: the thirds are either the best thirds or they are
  // in the playoff, and either way the card goes up before that is settled. So
  // a third place is drawn as "still in it", never as eliminated.
  const qCount = getQualifyCount(session);
  const thirdsLive = groups.length === 3 || session.thirdPlaceMode === "all4r16";
  const tables = {
    eyebrow: groupsDone ? `SESSION ${no} · GROUPS COMPLETE`
                        : `SESSION ${no} · ${played}/${total} PLAYED`,
    foot,
    keys: thirdsLive
      ? [["#087A3F", "THROUGH"],
         ["#D7202E", session.thirdPlaceMode === "playoff" ? "IN THE PLAYOFF" : "STILL IN IT"]]
      : [["#087A3F", groupsDone ? "THROUGH TO THE KNOCKOUT" : "CURRENTLY QUALIFYING"]],
    groups: groups.map(gr => {
      const rows = calcGroupStandings(session, gr);
      return {
        letter: gr, title: "GROUP " + gr, ordered: true,
        note: groupsDone ? "" : "LIVE",
        rows: rows.map((r, i) => ({
          name: nm(r.team.id).toUpperCase(),
          // Wins and game difference, which is the order the table is actually
          // sorted in. Showing points here instead would print a number that
          // does not explain the order above it.
          tail: `${r.wins}W  ${r.gd >= 0 ? "+" : ""}${r.gd}`,
          through: r.played === 0 ? null
                 : i < qCount ? true
                 : (thirdsLive && i === qCount) ? "alive"
                 : through.has(r.team.id) ? true
                 : false,
        })),
      };
    }),
    caption: groupsDone
      ? (thirdsLive
          ? `Groups are done. Top two in each group are through, and the thirds `
            + `are still in it. national.urbanpadel.om`
          : `Groups are done. ${through.size} teams through to the knockout. `
            + `national.urbanpadel.om`)
      : `Group stage, session ${no} — ${played} of ${total} played. national.urbanpadel.om`,
  };

  // ── THE BRACKET ── only the rounds this night actually has.
  const b = session.bracket || {};
  // The two faces behind a team name. Photos are merged onto the player record
  // from the /photos store before any screen reads it, and they are base64 data
  // URLs — so drawing one into the canvas is NOT a cross-origin draw and cannot
  // taint it. Not everybody has one: about three quarters of a knockout field
  // does, so the initial is a real state, not an error path.
  const pics = id => {
    const t = teams.find(x => x.id === id);
    if (!t) return [];
    return [t.p1Id, t.p2Id].map(pid => {
      const pl = players.find(q => q.id === pid) || {};
      return { url: pl.photoUrl || "", init: ((pl.name || "?").trim()[0] || "?").toUpperCase() };
    });
  };
  const tie = m => {
    if (!m) return null;
    const w = m.winner;
    return {
      a: nm(m.team1Id).toUpperCase(), b: nm(m.team2Id).toUpperCase(),
      aWon: w === "team1", bWon: w === "team2",
      aScore: m.score ? String(m.score.t1) : "", bScore: m.score ? String(m.score.t2) : "",
      aPics: pics(m.team1Id), bPics: pics(m.team2Id),
    };
  };
  const cols = [
    { label: "QUARTER-FINALS", ties: (b.qf || []).map(tie).filter(Boolean) },
    { label: "SEMI-FINALS", ties: (b.sf || []).map(tie).filter(Boolean) },
    { label: "FINAL", ties: [tie(b.final)].filter(Boolean) },
  ];
  const bracket = {
    eyebrow: `SESSION ${no} · ${date}`, foot, cols,
    caption: `Session ${no} knockout. national.urbanpadel.om`,
  };

  // Only offer a card that has something on it. An empty bracket tab that
  // paints three empty columns is a tab people press once.
  const out = [];
  if (teams.length) out.push({ key: "draw", label: "THE DRAW", d: draw });
  if (played > 0) out.push({ key: "tables", label: "TABLES", d: tables });
  if (cols.some(c => c.ties.length)) out.push({ key: "bracket", label: "BRACKET", d: bracket });
  return out;
}

// The sheet. Deliberately the same shape as LineupSheet — tabs across the top,
// the real bitmap as the preview, share and copy-caption underneath — so the
// two are one control that happens to open on different cards.
function GroupCardSheet({ open, items, onClose }) {
  const [k, setK] = React.useState(0);
  const [url, setUrl] = React.useState("");
  const [flash, setFlash] = React.useState("");
  React.useEffect(() => { if (open) setK(0); }, [open]);
  React.useEffect(() => {
    if (!open || !items.length) return;
    let alive = true;
    const it = items[Math.min(k, items.length - 1)];
    document.fonts.ready
      .then(() => drawGroupCard(it.key, it.d))
      .then(u => { if (alive) setUrl(u); });
    return () => { alive = false; };
  }, [open, k, items]);
  if (!open) return null;
  if (!items.length) return null;
  const it = items[Math.min(k, items.length - 1)];

  const save = async () => {
    try {
      const blob = await (await fetch(url)).blob();
      const f = new File([blob], `national-${it.key}.png`, { type: "image/png" });
      if (navigator.canShare && navigator.canShare({ files: [f] })) {
        await navigator.share({ files: [f], title: "56 National Series" });
        return;
      }
    } catch (e) { if (e && e.name === "AbortError") return; }
    const a = document.createElement("a");
    a.href = url; a.download = `national-${it.key}.png`;
    document.body.appendChild(a); a.click(); a.remove();
    setFlash("SAVED"); setTimeout(() => setFlash(""), 1600);
  };
  const copy = async () => {
    try { await navigator.clipboard.writeText(it.d.caption || ""); setFlash("CAPTION COPIED"); }
    catch (e) { setFlash("COULDN'T COPY"); }
    setTimeout(() => setFlash(""), 1600);
  };
  const btn = { fontFamily: "'JetBrains Mono',monospace", fontWeight: 700, fontSize: 11,
                letterSpacing: ".2em", cursor: "pointer", padding: 16 };

  return (
    <div onClick={onClose} style={{ position: "fixed", inset: 0, zIndex: 95,
      background: "rgba(184,20,31,.92)", display: "flex", alignItems: "flex-end" }}>
      <div onClick={e => e.stopPropagation()} style={{ background: "#9E1520", width: "100%",
        maxHeight: "94vh", overflowY: "auto", borderTop: "3px solid #F7F1E6", padding: 16 }}>
        <div style={{ display: "grid", gridTemplateColumns: `repeat(${items.length},1fr)`, gap: 6 }}>
          {items.map((x, i) => (
            <button key={x.key} onClick={() => setK(i)} style={{ padding: "11px 4px", cursor: "pointer",
              background: i === k ? "#F7F1E6" : "transparent",
              color: i === k ? "#B8141F" : "#F2D0D3",
              border: "1px solid " + (i === k ? "#F7F1E6" : "rgba(242,208,211,.3)"),
              fontFamily: "'JetBrains Mono',monospace", fontWeight: 700, fontSize: 10,
              letterSpacing: ".12em" }}>{x.label}</button>
          ))}
        </div>
        <div style={{ display: "flex", justifyContent: "center", margin: "16px 0" }}>
          {url
            ? <img src={url} alt="" style={{ width: 270, height: 480, display: "block",
                                             border: "1px solid rgba(242,208,211,.3)" }} />
            : <div style={{ width: 270, height: 480, background: "#9E1520" }} />}
        </div>
        <div style={{ fontSize: 11, color: "#F2D0D3", textAlign: "center", marginBottom: 12 }}>
          Preview is the actual 1080&times;1920 file, shown small.
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
          <button onClick={save} style={{ ...btn, background: "#F7F1E6", color: "#B8141F",
            border: "none" }}>SHARE / SAVE</button>
          <button onClick={copy} style={{ ...btn, background: "transparent", color: "#F2B8BC",
            border: "1px solid rgba(242,184,188,.5)" }}>COPY CAPTION</button>
        </div>
        {flash && <div style={{ textAlign: "center", marginTop: 12, color: "#F7F1E6",
          fontFamily: "'JetBrains Mono',monospace", fontWeight: 700, fontSize: 11,
          letterSpacing: ".2em" }}>{flash}</div>}
        <button onClick={onClose} style={{ width: "100%", marginTop: 14, padding: 12,
          background: "transparent", border: "1px solid rgba(242,208,211,.4)", color: "#F2D0D3",
          fontFamily: "'JetBrains Mono',monospace", fontWeight: 700, fontSize: 10,
          letterSpacing: ".24em", cursor: "pointer" }}>CLOSE</button>
      </div>
    </div>
  );
}


// ── who you are actually racing ───────────────────────────────────────────
//
// The nearest player ABOVE you, because that is the one you can do something
// about. At #1 it flips to the nearest below, which is the same relationship
// read from the other end. `passed` is the sharper case the handover's alert is
// written for: someone who was behind you before the last night and is not any
// more.
function rivalOf(meId, leaderboard, state) {
  if (!meId) return null;
  const i = leaderboard.findIndex(e => e.player.id === meId);
  if (i < 0) return null;
  const me = leaderboard[i];
  const up = i > 0 ? leaderboard[i - 1] : null;
  const down = leaderboard[i + 1] || null;
  const other = up || down;
  if (!other) return null;

  // Did they go past me on the last completed night? Compare the table as it
  // was before that night with the table now, rather than storing a flag that
  // can go stale the moment a score is corrected.
  const sessions = state.sessions || [];
  let passed = false;
  if (sessions.length >= 1 && up) {
    const before = sessions.slice(0, -1);
    const mineBefore = calcPlayerStats(meId, before).totalPts;
    const theirsBefore = calcPlayerStats(up.player.id, before).totalPts;
    passed = theirsBefore < mineBefore && up.totalPts > me.totalPts;
  }
  return {
    player: other.player,
    ahead: !!up,
    gap: Math.abs((other.totalPts || 0) - (me.totalPts || 0)),
    myPts: me.totalPts || 0,
    myRank: i + 1,
    passed,
  };
}

// What a night is worth to THIS player — their own median, not the field's.
// Used by the predictor so the bar reads "one of your nights" rather than "one
// of somebody's nights".
function typicalNight(meId, sessions) {
  const got = [];
  sessions.forEach((s, i) => {
    if (!getPlayerTeam(s, meId)) return;
    const upto = calcPlayerStats(meId, sessions.slice(0, i + 1)).totalPts;
    const prev = i ? calcPlayerStats(meId, sessions.slice(0, i)).totalPts : 0;
    got.push(upto - prev);
  });
  if (!got.length) return 0;
  got.sort((a, b) => a - b);
  return got[Math.floor(got.length / 2)];
}

// ── head to head, with the meetings kept ──────────────────────────────────
function h2hDetail(aId, bId, sessions) {
  let mine = 0, theirs = 0;
  const meetings = [];
  sessions.forEach((s, idx) => {
    const a = getPlayerTeam(s, aId), b = getPlayerTeam(s, bId);
    if (!a || !b || a.id === b.id) return;
    const all = (s.groupMatches || []).concat(s.bracket?.qf || [], s.bracket?.sf || [],
                                              s.bracket?.final ? [s.bracket.final] : []);
    all.forEach(m => {
      if (!m || !m.winner) return;
      const ids = [m.team1Id, m.team2Id];
      if (!ids.includes(a.id) || !ids.includes(b.id)) return;
      const iWon = teamWon(m, a.id);
      if (iWon) mine++; else theirs++;
      const t1 = m.team1Id === a.id;
      meetings.push({ idx, iWon,
        score: m.score ? `${t1 ? m.score.t1 : m.score.t2}–${t1 ? m.score.t2 : m.score.t1}` : "" });
    });
  });
  return mine + theirs ? { mine, theirs, meetings } : null;
}

// ── chemistry: the record of two people who played TOGETHER ───────────────
function chemistry(aId, bId, sessions) {
  let w = 0, l = 0, nights = 0;
  sessions.forEach(s => {
    const t = getPlayerTeam(s, aId);
    if (!t || (t.p1Id !== bId && t.p2Id !== bId)) return;
    nights++;
    const all = (s.groupMatches || []).concat(s.bracket?.qf || [], s.bracket?.sf || [],
                                              s.bracket?.final ? [s.bracket.final] : []);
    all.forEach(m => {
      if (!m || !m.winner) return;
      if (m.team1Id !== t.id && m.team2Id !== t.id) return;
      if (teamWon(m, t.id)) w++; else l++;
    });
  });
  if (!nights) return null;
  return { nights, w, l, games: w + l, pct: w + l ? Math.round(w / (w + l) * 100) : 0 };
}

// Every partner this player has had, best record first. The floor of 2 games is
// there because a single 6-0 would otherwise crown a 100% partner someone has
// played one match with.
function partnerTable(meId, sessions, players) {
  const ids = new Set();
  sessions.forEach(s => {
    const t = getPlayerTeam(s, meId);
    if (t) ids.add(t.p1Id === meId ? t.p2Id : t.p1Id);
  });
  return [...ids].map(id => {
    const c = chemistry(meId, id, sessions);
    const p = players.find(x => x.id === id);
    return c && p ? { id, name: p.name, ...c } : null;
  }).filter(x => x && x.games >= 2)
    .sort((a, b) => b.pct - a.pct || b.games - a.games);
}

// ── 1A · the rival alert, on Home ─────────────────────────────────────────
function RivalAlert({ state, leaderboard, meId, setTab }) {
  const r = React.useMemo(() => rivalOf(meId, leaderboard, state), [meId, leaderboard, state]);
  if (!r) return null;
  const sessions = state.sessions || [];
  const h = React.useMemo(() => h2hDetail(meId, r.player.id, sessions), [meId, r.player.id, sessions]);
  const first = (r.player.name || "").split(" ")[0].toUpperCase();

  const line = r.passed ? `${first} PASSED YOU LAST NIGHT`
             : r.ahead  ? `${first} IS ${r.gap} POINT${r.gap === 1 ? "" : "S"} AHEAD`
             :            `${first} IS ${r.gap} POINT${r.gap === 1 ? "" : "S"} BEHIND`;
  const sub = h
    ? `You have met ${h.mine + h.theirs} time${h.mine + h.theirs === 1 ? "" : "s"} — `
      + `${h.mine}–${h.theirs} to ${h.mine >= h.theirs ? "you" : "them"}.`
    : `You have not played each other yet.`;

  return (
    <button onClick={() => setTab("leaderboard")}
      style={{ display: "block", width: "100%", textAlign: "left", cursor: "pointer", color: "inherit",
        marginTop: 14, padding: "14px 16px", border: "1px solid rgba(242,184,188,.4)",
        background: "linear-gradient(90deg,#F2B8BC 0 3px,rgba(158,21,32,.96) 3px)" }}>
      <div style={{ fontFamily: "'Archivo',sans-serif", fontWeight: 900, fontSize: 9,
        letterSpacing: ".3em", color: "#F2B8BC" }}>{r.passed ? "RIVAL" : "THE CHASE"}</div>
      <div style={{ fontStyle: "italic", fontVariationSettings: "'wdth' 118,'wght' 900",
        fontSize: 22, lineHeight: 1.04, marginTop: 7 }}>{line}</div>
      <div style={{ fontSize: 12, color: "#F2D0D3", marginTop: 6 }}>{sub}</div>
      <div style={{ fontFamily: "'Archivo',sans-serif", fontWeight: 900, fontSize: 10,
        letterSpacing: ".2em", color: "#F7F1E6", marginTop: 10 }}>SEE RANK &#9654;</div>
    </button>
  );
}

// ── 2A · the recap-ready card, on Home ────────────────────────────────────
//
// Shows the morning after, until the player dismisses it. "Dismissed" is kept
// per session id in localStorage, so closing last night's card does not also
// close next week's.
function RecapReadyCard({ state, leaderboard, meId, onOpen }) {
  const sessions = state.sessions || [];
  const done = sessions.filter(s => s.completed);
  const last = done.length ? done[done.length - 1] : null;
  const key = last ? "bo-recap-seen-" + last.id : "";
  const [hidden, setHidden] = React.useState(() => {
    try { return key ? localStorage.getItem(key) === "1" : false; } catch (e) { return false; }
  });
  React.useEffect(() => {
    try { setHidden(key ? localStorage.getItem(key) === "1" : false); } catch (e) { setHidden(false); }
  }, [key]);

  const d = React.useMemo(() => {
    if (!last || !meId) return null;
    const idx = sessions.findIndex(s => s.id === last.id);
    if (idx < 0 || !getPlayerTeam(last, meId)) return null;
    const after = calcPlayerStats(meId, sessions.slice(0, idx + 1)).totalPts;
    const before = idx ? calcPlayerStats(meId, sessions.slice(0, idx)).totalPts : 0;
    const t = getPlayerTeam(last, meId);
    const all = (last.groupMatches || []).concat(last.bracket?.qf || [], last.bracket?.sf || [],
                                                 last.bracket?.final ? [last.bracket.final] : []);
    let w = 0, l = 0;
    all.forEach(m => {
      if (!m || !m.winner) return;
      if (m.team1Id !== t.id && m.team2Id !== t.id) return;
      if (teamWon(m, t.id)) w++; else l++;
    });
    // moveInto returns MAPS of playerId -> rank, not this player's rank. Read
    // off the top level they are objects: `rank` renders as [object Object] and
    // `prev - rank` is NaN, which is exactly what the first build of this card
    // put on screen — "▼NaN" where the movement should be.
    const mv = moveInto(state, idx);
    const rankNow = (mv.rank || {})[meId] || null;
    const rankPrev = (mv.prev || {})[meId] || null;
    return { no: idx + 1, date: fmtNightDate(last.date), gained: after - before, w, l,
             rank: rankNow, delta: rankPrev && rankNow ? rankPrev - rankNow : 0, session: last };
  }, [last, meId, sessions, state]);

  if (!d || hidden) return null;
  const climbed = d.delta > 0, dropped = d.delta < 0;
  const col = climbed ? "#F7F1E6" : dropped ? "#F2B8BC" : "#FFFFFF";
  const stat = (v, label, c) => (
    <div style={{ flex: 1 }}>
      <div style={{ fontStyle: "italic", fontVariationSettings: "'wdth' 118,'wght' 900",
        fontSize: 34, lineHeight: 1, color: c }}>{v}</div>
      <div style={{ fontFamily: "'Archivo',sans-serif", fontWeight: 800, fontSize: 8,
        letterSpacing: ".2em", color: "#F2D0D3", marginTop: 5 }}>{label}</div>
    </div>
  );

  return (
    <div style={{ marginTop: 14, padding: "16px 14px", background: "rgba(158,21,32,.96)",
      border: "1px solid rgba(247,241,230,.4)" }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
        <div style={{ fontFamily: "'Archivo',sans-serif", fontWeight: 900, fontSize: 9,
          letterSpacing: ".3em", color: "#F7F1E6" }}>YOUR RECAP</div>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <span style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: 10, color: "#F2D0D3" }}>
            {(d.date || "").toUpperCase()} &middot; {d.w + d.l} GAME{d.w + d.l === 1 ? "" : "S"}
          </span>
          <button onClick={() => { try { localStorage.setItem(key, "1"); } catch (e) {} setHidden(true); }}
            aria-label="Dismiss" style={{ cursor: "pointer", background: "none", border: "none",
              color: "#F2D0D3", fontSize: 14, lineHeight: 1, padding: 0 }}>&times;</button>
        </div>
      </div>
      <div style={{ display: "flex", gap: 10, marginTop: 14 }}>
        {stat("+" + d.gained, "POINTS", "#F7F1E6")}
        {stat(`${d.w}–${d.l}`, "RECORD", "#FFFFFF")}
        {stat(d.delta === 0 ? "—" : (climbed ? "▲" : "▼") + Math.abs(d.delta),
              "NOW #" + (d.rank || "-"), col)}
      </div>
      <button onClick={() => onOpen(d.session)} style={{ marginTop: 14, cursor: "pointer",
        background: "none", border: "none", padding: 0, fontFamily: "'Archivo',sans-serif",
        fontWeight: 900, fontSize: 10, letterSpacing: ".2em", color: "#F7F1E6" }}>
        OPEN RECAP &#9654;
      </button>
    </div>
  );
}

// ── 1B · your row, pinned to the top of RANK, with the predictor ──────────
function RankPin({ state, leaderboard, meId, setOpenPlayerId }) {
  const r = React.useMemo(() => rivalOf(meId, leaderboard, state), [meId, leaderboard, state]);

  if (!r) return null;
  const me = leaderboard.find(e => e.player.id === meId);
  if (!me) return null;

  // The bar is the gap measured in nights of this player's own form. Eight
  // segments because a gap worth more than two typical nights is not a gap the
  // bar should pretend to render precisely.
  const SEG = 8;
  const lit = typical > 0 ? Math.max(0, Math.min(SEG, SEG - Math.round(r.gap / typical * (SEG / 2)))) : 0;
  const verb = r.ahead ? "TO CATCH" : "TO HOLD";

  return (
    <div style={{ marginTop: 12, border: "1px solid rgba(247,241,230,.45)", background: "rgba(158,21,32,.96)" }}>

          fontVariationSettings: "'wdth' 125,'wght' 900", fontSize: 17, color: "#F7F1E6" }}>{r.myRank}</div>
        <Avatar player={me.player} size={34} />
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ fontFamily: "'Archivo',sans-serif", fontStyle: "italic",
            fontVariationSettings: "'wdth' 112,'wght' 900", fontSize: 17, whiteSpace: "nowrap",
            overflow: "hidden", textOverflow: "ellipsis" }}>{me.player.name}</div>
          <div style={{ fontFamily: "'Archivo',sans-serif", fontWeight: 800, fontSize: 9,
            letterSpacing: ".18em", color: "#F2D0D3", marginTop: 3 }}>YOU</div>
        </div>
        <div style={{ fontStyle: "italic", fontVariationSettings: "'wdth' 118,'wght' 900",
          fontSize: 26, color: "#F7F1E6" }}>{r.myPts}</div>
      </div>

      <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 14px",
        borderTop: "1px solid rgba(242,208,211,.2)", background: "rgba(242,184,188,.06)" }}>
        <span style={{ fontFamily: "'Archivo',sans-serif", fontWeight: 900, fontSize: 8,
          letterSpacing: ".24em", color: "#F2B8BC" }}>RIVAL</span>
        <span style={{ flex: 1, minWidth: 0, fontSize: 13, fontWeight: 800, whiteSpace: "nowrap",
          overflow: "hidden", textOverflow: "ellipsis" }}>{r.player.name}</span>
        <span style={{ fontFamily: "'JetBrains Mono',monospace", fontWeight: 700, fontSize: 13,
          color: "#F2B8BC" }}>{r.ahead ? "−" : "+"}{r.gap} PTS</span>
      </div>

      <div style={{ padding: "11px 14px", borderTop: "1px solid rgba(242,208,211,.2)" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
          <span style={{ fontFamily: "'Archivo',sans-serif", fontWeight: 900, fontSize: 8,
            letterSpacing: ".24em", color: "#F2D0D3" }}>PREDICTOR &middot; {verb}</span>
          <span style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: 10, color: "#F2D0D3" }}>
            {typical > 0 ? `YOUR NIGHT ≈ ${typical} PTS` : "NO FORM YET"}
          </span>
        </div>
        <div style={{ display: "grid", gridTemplateColumns: `repeat(${SEG},1fr)`, gap: 3, marginTop: 8 }}>
          {Array.from({ length: SEG }).map((_, i) => (
            <div key={i} style={{ height: 6,
              background: i < lit ? "#F7F1E6" : "rgba(242,208,211,.25)" }} />
          ))}
        </div>
        {/* "0.1 of your nights" is arithmetic, not language. Below one night the
            useful thing to say is that it is within a single night's reach;
            above it, how many nights. */}
        <div style={{ fontSize: 11, color: "#F2D0D3", marginTop: 7 }}>
          {typical > 0
            ? (r.gap === 0
                ? "Dead level. One game decides it."
                : r.gap <= typical
                  ? `${r.gap} point${r.gap === 1 ? "" : "s"} — inside one night.`
                  : `${r.gap} points — about ${Math.round(r.gap / typical)} of your nights.`)
            : "Play a night and this fills in."}
        </div>
      </div>
    </div>
  );
}


// ── 1C · head to head, as the handover draws it ───────────────────────────
//
// Replaces the one-line version: the score big enough to be the point of the
// card, a bar that shows the ratio at a glance, and the last three meetings as
// squares so "4-2" has some texture — three straight losses and a 4-2 are very
// different 4-2s.
function H2HCard({ meId, player, sessions }) {
  const h = React.useMemo(() => h2hDetail(meId, player.id, sessions), [meId, player.id, sessions]);
  if (!h) return null;
  const tot = h.mine + h.theirs;
  const pct = Math.round(h.mine / tot * 100);

    <div style={{ border: "1px solid rgba(242,184,188,.4)", padding: 14, marginTop: 20 }}>
      <div style={{ fontFamily: "'JetBrains Mono',monospace", fontWeight: 700, fontSize: 9,
        letterSpacing: ".24em", color: "#F2B8BC" }}>HEAD TO HEAD</div>
      <div style={{ display: "flex", alignItems: "baseline", gap: 14, marginTop: 8 }}>
        <div style={{ fontStyle: "italic", fontVariationSettings: "'wdth' 125,'wght' 900",
          fontSize: 56, lineHeight: .9, color: h.mine >= h.theirs ? "#F7F1E6" : "#FFFFFF" }}>
          {h.mine} &ndash; {h.theirs}
        </div>
        <div style={{ fontFamily: "'Archivo',sans-serif", fontWeight: 800, fontSize: 9,
          letterSpacing: ".18em", color: "#F2D0D3" }}>

}

// ── 1C · chemistry ────────────────────────────────────────────────────────
function ChemistryCard({ meId, player, sessions, players }) {

}

// ── 1D · the rank line, session by session ────────────────────────────────
//
// Drawn with the y-axis inverted, because rank 1 belongs at the top and a
// chart where "going up" means "getting worse" is a chart people misread once
// and never trust again.
function RankPath({ meId, state }) {
  const sessions = state.sessions || [];
  const players = state.players || [];
  const ranks = React.useMemo(() => rankByNight(players, sessions), [players, sessions]);
  const pts = [];
  ranks.forEach((pos, i) => { if (pos[meId]) pts.push({ i, r: pos[meId] }); });
  if (pts.length < 2) return null;

  const W = 300, H = 76, PAD = 10, GUT = 26;   // GUT: room for the rank ticks
  const lo = Math.min(...pts.map(p => p.r)), hi = Math.max(...pts.map(p => p.r));
  const span = Math.max(1, hi - lo);
  const x = k => GUT + (W - GUT - PAD) * (pts.length === 1 ? 0.5 : k / (pts.length - 1));
  const y = r => PAD + (H - PAD * 2) * ((r - lo) / span);   // inverted: best rank on top
  const d = pts.map((p, k) => `${k ? "L" : "M"}${x(k).toFixed(1)},${y(p.r).toFixed(1)}`).join(" ");
  const peakK = pts.findIndex(p => p.r === lo);
  const lastK = pts.length - 1;
  const dropped = pts.length > 1 && pts[lastK].r > pts[lastK - 1].r;

  return (
    <div style={{ border: "1px solid rgba(242,208,211,.3)", padding: 14, marginTop: 12 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
        <span style={{ fontFamily: "'JetBrains Mono',monospace", fontWeight: 700, fontSize: 9,
          letterSpacing: ".24em", color: "#F2D0D3" }}>RANK, NIGHT BY NIGHT</span>
        <span style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: 10, color: "#F2D0D3" }}>
          BEST #{lo}
        </span>
      </div>
      {/* Two ticks, so the direction of the line is not something you have to
          infer. Without them a rising line reads as "points going up" and the
          axis is the opposite way round from that. */}
      <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", height: H, marginTop: 8, display: "block" }}>
        <text x="0" y={PAD + 3} fill="#F2D0D3" fontSize="9"
              fontFamily="'JetBrains Mono',monospace">#{lo}</text>
        {hi !== lo && <text x="0" y={H - PAD + 3} fill="#F2D0D3" fontSize="9"
              fontFamily="'JetBrains Mono',monospace">#{hi}</text>}
        <path d={d} fill="none" stroke="#F7F1E6" strokeWidth="2" />
        {pts.map((p, k) => (
          <circle key={k} cx={x(k)} cy={y(p.r)} r={k === peakK || k === lastK ? 4 : 2.5}
            fill={k === lastK && dropped ? "#F2B8BC" : k === peakK ? "#F7F1E6" : "#B8141F"}
            stroke={k === lastK && dropped ? "#F2B8BC" : "#F7F1E6"} strokeWidth="2" />
        ))}
      </svg>
      <div style={{ display: "flex", justifyContent: "space-between",
        fontFamily: "'JetBrains Mono',monospace", fontSize: 9, color: "#F2D0D3", marginTop: 2 }}>
        <span>S{pts[0].i + 1}</span><span>NOW #{pts[lastK].r}</span>
      </div>
    </div>
  );
}
