function PlayerPicker({ players, value, onChange, exclude = [], placeholder = "Pick player" }) {
  const [open, setOpen] = useState(false);
  const [search, setSearch] = useState("");
  const ref = useRef();
  useEffect(() => { const h = e => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); }; document.addEventListener("mousedown", h); return () => document.removeEventListener("mousedown", h); }, []);
  const sel = players.find(p => p.id === value);
  const avail = players.filter(p => !exclude.includes(p.id) && (!search || p.name.toLowerCase().includes(search.toLowerCase())));
  return (
    <div className="relative" ref={ref}>
      <button type="button" onClick={() => setOpen(!open)} className="w-full bg-stone-900 border border-stone-700 rounded-lg px-3 py-2.5 text-left flex items-center justify-between">
        <span className={sel ? "text-stone-100" : "text-stone-500"}>{sel?.name || placeholder}</span>
        <I.chev size={16} className={`transition-transform ${open ? "rotate-90" : ""}`} />
      </button>
      {open && (
        <div className="absolute z-20 mt-1 w-full bg-stone-900 border border-stone-700 rounded-lg shadow-2xl max-h-64 overflow-y-auto">
          <div className="sticky top-0 bg-stone-900 p-2 border-b border-stone-800">
            <div className="relative">
              <I.search size={14} className="absolute left-2.5 top-1/2 -translate-y-1/2 text-stone-500" />
              <input autoFocus value={search} onChange={e => setSearch(e.target.value)} placeholder="Search…" className="w-full bg-stone-800 rounded-md pl-8 pr-2 py-1.5 text-sm text-stone-100 focus:outline-none" />
            </div>
          </div>
          {avail.length === 0 ? <div className="px-3 py-4 text-sm text-stone-500 text-center">No players found</div>
            : avail.map(p => <button key={p.id} type="button" onClick={() => { onChange(p.id); setOpen(false); setSearch(""); }} className="w-full text-left px-3 py-2 hover:bg-stone-800 text-stone-100 text-sm border-b border-stone-800/50 last:border-0">{p.name}</button>)}
        </div>
      )}
    </div>
  );
}

function Avatar({ player, size = 40, className = "", ring = null }) {
  const initials = (player.name || "?").split(" ").map(n => n[0]).join("").slice(0, 2).toUpperCase();
  const [imgErr, setImgErr] = useState(false);
  const border = Math.max(2, Math.round(size * 0.07));
  const ringStyle = ring ? { boxShadow: `${border}px ${border}px 0 var(--ink), 0 0 0 ${Math.max(2, Math.round(size*0.05))}px ${ring}` } : { boxShadow: `${border}px ${border}px 0 var(--ink)` };
  const commonStyle = { width: size, height: size, flexShrink: 0, border: `${border}px solid var(--ink)`, borderRadius: 28, ...ringStyle };
  if (player.photoUrl && !imgErr) {
    return <img src={player.photoUrl} alt={player.name} onError={() => setImgErr(true)}
      className={`object-cover shrink-0 ${className}`}
      style={{ ...commonStyle,
                objectPosition: player.photoUrl.startsWith("data:") ? "center 28%" : "center" }} />;
  }
  // Deterministic tinted initials background instead of flat black, so avatars
  // without photos still read as distinct people.
  const palette = ["#F7F1E6", "#F2B8BC", "#9E1520", "#F7F1E6", "#3A3A3A", "#F2B8BC"];
  const tint = palette[Math.abs((player.id || player.name || "").split("").reduce((a, c) => a + c.charCodeAt(0), 0)) % palette.length];
  return (
    <div className={`flex items-center justify-center shrink-0 font-bold ${className}`}
      style={{ ...commonStyle, background: tint,
        // Luminance picks the text colour, so a bright tint never gets
        // light text. Lime is bright enough that white on it is unreadable.
        color: (parseInt(tint.slice(1,3),16)*0.299 + parseInt(tint.slice(3,5),16)*0.587
                + parseInt(tint.slice(5,7),16)*0.114) > 140 ? "#1A0A0C" : "#FFFFFF", fontSize: size * 0.36, fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", letterSpacing: "1px", textShadow: "none" }}>
      {initials}
    </div>
  );
}

  </span>;
}

// ══ VOL.9 · COUNT-UP ══════════════════════════════════════════════════════
// Headline numbers ease to their value instead of snapping. Stepped rather than
// time-based so it lands exactly on the target: max(1, ceil(remaining * .16))
// per frame, which is the handoff's rule.
function useCountUp(target) {
  const [n, setN] = React.useState(0);
  const raf = React.useRef();
  React.useEffect(() => {
    const t = Number(target) || 0;
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      setN(t); return;
    }
    let cur = 0;
    const tick = () => {
      const diff = t - cur;
      if (Math.abs(diff) <= 1) { setN(t); return; }
      cur += Math.sign(diff) * Math.max(1, Math.ceil(Math.abs(diff) * 0.16));
      setN(cur);
      raf.current = requestAnimationFrame(tick);
    };
    raf.current = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf.current);
  }, [target]);
  return n;
}
function CountUp({ to, prefix = "", suffix = "" }) {
  const n = useCountUp(to);
  return <>{prefix}{n}{suffix}</>;
}

// ══ VOL.9 · PLAYER CARD EXTRAS ════════════════════════════════════════════
// The card showed a points breakdown and stopped there. The handoff asks for the
// three things that make it worth opening someone else's: where their points
// came from NIGHT BY NIGHT (each tapping through to that night's receipt),
// their badges, and the head-to-head against you.
function PlayerExtras({ player, state, leaderboard, meId }) {
  const [receipt, setReceipt] = React.useState(null);
  const players = state.players || [];
  const sessions = state.sessions || [];
  const nameOf = React.useCallback((s, teamId, pidDirect) => {
    if (pidDirect) return (players.find(p => p.id === pidDirect) || {}).name || "?";
    const t = (s.teams || []).find(x => x.id === teamId);
    if (!t) return "?";
    const n = id => ((players.find(p => p.id === id) || {}).name || "?").split(" ")[0];
    return n(t.p1Id) + " & " + n(t.p2Id);
  }, [players]);

  const data = calcPlayerNights(player.id, sessions, nameOf);
  const ranks = React.useMemo(() => rankByNight(players, sessions), [players, sessions]);
  const best = Math.max(1, ...data.nights.map(n => n.nightTotal));

  // Head to head: every decided match where the two were on opposite teams.
  const h2h = React.useMemo(() => {
    if (!meId || meId === player.id) return null;
    let mine = 0, theirs = 0, last = null;
    sessions.forEach((s, idx) => {
      const a = getPlayerTeam(s, meId), b = getPlayerTeam(s, player.id);
      if (!a || !b || a.id === b.id) return;
      const all = (s.groupMatches || []).concat(s.bracket?.qf || [], s.bracket?.sf || [],
                                                s.bracket?.final ? [s.bracket.final] : []);
      all.forEach(m => {
        if (!m || !m.winner) return;
        const ids = [m.team1Id, m.team2Id];
        if (!ids.includes(a.id) || !ids.includes(b.id)) return;
        const iWon = teamWon(m, a.id);
        if (iWon) mine++; else theirs++;
        last = { idx, iWon, score: m.score, date: s.date };
      });
    });
    return mine + theirs ? { mine, theirs, last } : null;
  }, [sessions, meId, player.id]);

  if (data.nights.length === 0 && !h2h) return null;

  return (
    <div style={{ marginTop: 20 }}>
      {data.nights.length > 0 && <>
        <div style={{ fontFamily: "'JetBrains Mono',monospace", fontWeight: 700, fontSize: 9,
          letterSpacing: ".26em", color: "#F2D0D3" }}>WHERE THE POINTS CAME FROM</div>
        <StackedBar seg={data.seg} total={data.total} />
        <SegLegend seg={data.seg} />

        <div style={{ display: "grid", gridTemplateColumns: "repeat(5,1fr)", gap: 6, marginTop: 16 }}>
          {data.nights.slice(-5).map(n => (
            <button key={n.id} onClick={() => setReceipt(n)}
              style={{ padding: "10px 4px", cursor: "pointer", color: "inherit", textAlign: "center",
                background: "rgba(158,21,32,.94)", border: "1px solid rgba(247,241,230,.25)" }}>
              <div style={{ fontFamily: "'JetBrains Mono',monospace", fontWeight: 700, fontSize: 9,
                color: "#F2D0D3" }}>S{n.no}</div>
              <div style={{ fontFamily: "'JetBrains Mono',monospace", fontWeight: 700, fontSize: 17,
                color: "#F7F1E6", marginTop: 3 }}>+{n.nightTotal}</div>
              <div style={{ height: 3, background: "rgba(242,208,211,.25)", marginTop: 6 }}>
                <div style={{ height: "100%", background: "#F7F1E6",
                  width: Math.round(n.nightTotal / best * 100) + "%" }} />
              </div>
            </button>
          ))}
        </div>
      </>}

      {meId && meId !== player.id &&
        <H2HCard meId={meId} player={player} sessions={sessions} />}
      {meId && meId !== player.id &&
        <ChemistryCard meId={meId} player={player} sessions={sessions} players={players} />}

      <ReceiptSheet night={receipt} player={player}
        rankAfter={receipt ? (ranks[receipt.idx] || {})[player.id] : null}
        onClose={() => setReceipt(null)} />
    </div>
  );
}

// Pull-to-refresh. Touch only: a mouse has a refresh button and a trackpad
// gesture already, and binding this to the mouse hijacks text selection.
function usePullToRefresh(onRefresh, blocked) {
  const [pull, setPull] = React.useState(0);
  const start = React.useRef(null);
  React.useEffect(() => {
    const TH = 64, MAX = 110;
    const down = e => {
      if (blocked() || window.scrollY > 0) { start.current = null; return; }
      start.current = e.touches[0].clientY;
    };
    const move = e => {
      if (start.current == null) return;
      const d = e.touches[0].clientY - start.current;
      if (d <= 0) { setPull(0); return; }
      // Half the finger travel, capped: a 1:1 strip feels loose and a long drag
      // on a phone overshoots the whole header.
      setPull(Math.min(d * 0.5, MAX));
    };
    const up = () => {
      if (start.current == null) return;
      setPull(p => { if (p >= TH) onRefresh(); return 0; });
      start.current = null;
    };
    document.addEventListener("touchstart", down, { passive: true });
    document.addEventListener("touchmove", move, { passive: true });
    document.addEventListener("touchend", up, { passive: true });
    document.addEventListener("touchcancel", up, { passive: true });
    return () => {
      document.removeEventListener("touchstart", down);
      document.removeEventListener("touchmove", move);
      document.removeEventListener("touchend", up);
      document.removeEventListener("touchcancel", up);
    };
  }, [onRefresh, blocked]);
  return pull;
}

function PullStrip({ pull }) {
  if (pull <= 0) return null;
  const ready = pull >= 64;
  return (
    <div style={{ height: pull, display: "flex", flexDirection: "column",
      alignItems: "center", justifyContent: "center", overflow: "hidden" }}>
      <div style={{ width: Math.min(90, pull), height: 3, background: "#F7F1E6" }} />
      <div style={{ marginTop: 8, fontFamily: "'JetBrains Mono',monospace", fontWeight: 700,
        fontSize: 9, letterSpacing: ".24em", color: ready ? "#F7F1E6" : "#F2D0D3" }}>
        {ready ? "RELEASE TO REFRESH" : "PULL TO REFRESH"}
      </div>
    </div>
  );
}

// ══ VOL.9 · FINALS COUNTDOWN ══════════════════════════════════════════════
// Dates come from the sessions themselves, so the countdown cannot drift from
// the schedule the organiser actually entered.
function FinalsCountdown({ state, leaderboard, meId, setTab }) {
  const [now, setNow] = React.useState(Date.now());
  React.useEffect(() => {
    const t = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(t);
  }, []);

  const sessions = state.sessions || [];
  // The finals is the night ON the scheduled finals date — nothing else.
  //
  // This used to fall back to "the last session created" whenever fewer than
  // nine existed, which was meant to cover signup but did the opposite: with
  // Session 1 created, the FINALS countdown counted down to Session 1. On the
  // evening of night one it read two hours, which is true of tonight and
  // nonsense about the finals.
  //
  // Matching on the date also survives the sessions being created out of
  // order, or a tenth being added, both of which break an index.
  const finals = sessions.find(s => s.date === FINALS_DATE) || { date: FINALS_DATE };
  if (!finals || !finals.date) return null;
  // Parsed field by field: the server runs UTC+4, and new Date("2026-10-30")
  // is parsed as UTC, which puts the night a day early for everyone here.
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(finals.date);
  if (!m) return null;
  const target = new Date(+m[1], +m[2] - 1, +m[3], 17, 30, 0).getTime();
  const left = Math.max(0, target - now);
  const d = Math.floor(left / 86400000);
  const h = Math.floor(left / 3600000) % 24;
  const mi = Math.floor(left / 60000) % 60;
  const se = Math.floor(left / 1000) % 60;
  const done = left === 0;

  const myRank = meId ? leaderboard.findIndex(e => e.player.id === meId) + 1 : 0;
  const myPts = myRank ? leaderboard[myRank - 1].totalPts : 0;
  const third = leaderboard[2]?.totalPts ?? 0;
  const fourth = leaderboard[3]?.totalPts ?? 0;
  const inPrizes = myRank > 0 && myRank <= 3;
  const gap = inPrizes ? myPts - fourth : third - myPts;

  const Tile = ({ v, l }) => (
    <div style={{ flex: 1, textAlign: "center", padding: "10px 0",
                  border: "1px solid rgba(242,184,188,.3)" }}>
      <div style={{ fontStyle: "italic", fontVariationSettings: "'wdth' 125,'wght' 900",
        fontSize: 30, lineHeight: 1, fontVariantNumeric: "tabular-nums" }}>
        {String(v).padStart(2, "0")}
      </div>
      <div style={{ fontFamily: "'JetBrains Mono',monospace", fontWeight: 700, fontSize: 8,
        letterSpacing: ".2em", color: "#F2D0D3", marginTop: 5 }}>{l}</div>
    </div>
  );

  return (
    <div className="na-ivory" style={{ padding: 18, marginTop: 20 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline",
                    gap: 16, flexWrap: "wrap" }}>
        <div style={{ fontFamily: "'JetBrains Mono',monospace", fontWeight: 700, fontSize: 9,
          letterSpacing: ".26em", color: "#F2B8BC" }}>
          {done ? "FINALS NIGHT · TONIGHT" : "FINALS NIGHT · " + fmtNightDate(finals.date)}
        </div>
        <div style={{ fontFamily: "'JetBrains Mono',monospace", fontWeight: 700, fontSize: 12,
          color: "#F7F1E6" }}>
          <span style={{ fontSize: 9, letterSpacing: ".26em", opacity: .72,
            marginRight: 7 }}>SEASON PRIZES</span>
          {SEASON_PRIZES.join(" · ")} OMR</div>
      </div>
      {!done && (
        <div style={{ display: "flex", gap: 6, marginTop: 12 }}>
          <Tile v={d} l="DAYS" /><Tile v={h} l="HRS" /><Tile v={mi} l="MIN" /><Tile v={se} l="SEC" />
        </div>
      )}
      {myRank > 0 && (
        <button onClick={() => setTab("me")} style={{ width: "100%", marginTop: 12, padding: "12px",
          display: "flex", alignItems: "center", gap: 10, cursor: "pointer", color: "inherit",
          background: "transparent", border: "1px solid rgba(242,208,211,.25)", textAlign: "left" }}>
          <span style={{ fontFamily: "'JetBrains Mono',monospace", fontWeight: 700, fontSize: 15,
            padding: "3px 8px", color: "#B8141F",
            background: inPrizes ? "#F7F1E6" : "#F2B8BC" }}>#{myRank}</span>
          <span style={{ flex: 1, fontSize: 12, color: "#F2D0D3", lineHeight: 1.35 }}>
            {inPrizes
              ? <>In the season prizes &middot; <b style={{ color: "#FFFFFF" }}>{gap} pts</b> clear of 4th</>
              : <><b style={{ color: "#FFFFFF" }}>{Math.max(0, gap)} pts</b> behind 3rd place</>}
          </span>
          <span style={{ color: "#F2D0D3" }}>&#9654;</span>
        </button>
      )}
    </div>
  );
}

function fmtNightDate(s) {
  const M = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || "");
  return m ? (+m[3]) + " " + M[+m[2] - 1] : (s || "").toUpperCase();
}

// ══ VOL.9 · PRIZE TRACKER ═════════════════════════════════════════════════
function PrizeSheet({ open, state, leaderboard, onClose }) {
  if (!open) return null;
  const sessions = state.sessions || [];
  const doneNights = sessions.filter(s => s.completed);
  // Read, not typed. This used to carry its own 14 beside a pool derived from
  // national-season.json, so moving the voucher in the one file that is meant
  // to be the single source of truth would have changed every surface except
  // the one that counts the money.
  const voucher = SEASON_VOUCHER, perTeam = 2;
  const seasonPot = SEASON_PRIZES.reduce((a, b) => a + b, 0);
  const pool = voucher * perTeam * SESSIONS_TOTAL + seasonPot;
  // THE SEASON PRIZES ARE PAID WHEN THE SEASON ENDS. `paid` counted night
  // vouchers only and nothing could ever mark the season prizes paid, so the
  // moment the last night completed the tracker said "155 OMR LEFT" for ever
  // — at a prize-giving where the money had just been handed over. They are
  // awarded on the final night by definition, so finishing the season is the
  // event, and there is no separate flag to forget to set.
  const seasonDone = doneNights.length >= SESSIONS_TOTAL;
  const paid = doneNights.length * voucher * perTeam + (seasonDone ? seasonPot : 0);
  const left = pool - paid;
  const nameOf = id => (state.players.find(p => p.id === id) || {}).name || "?";
  const champsOf = s => {
    const f = s.bracket?.final;
    if (!f || !f.winner) return null;
    const tid = f.winner === "team1" ? f.team1Id : f.team2Id;
    const t = (s.teams || []).find(x => x.id === tid);
    return t ? [nameOf(t.p1Id), nameOf(t.p2Id)] : null;
  };
  // EARNINGS ARE VOUCHERS *AND* CASH, AND THE TWO ARE NOT THE SAME THING.
  // This counted night vouchers only, so the season's three biggest cheques —
  // the whole reason anyone plays nine nights — were missing from the one list
  // headed TOP EARNERS. The night prize is a voucher and the season prize is
  // cash, so they are tracked apart and shown apart: a player cannot spend one
  // where they spend the other, and a single merged number would tell them
  // they have more of whichever they happen to need.
  //
  // The cash lands on the same event as `paid` above — the season being over —
  // so the list can never show money as earned while the tracker still has it
  // outstanding.
  const earners = {};
  const bump = (n, kind, amt) => {
    if (!n) return;
    earners[n] = earners[n] || { voucher: 0, cash: 0 };
    earners[n][kind] += amt;
  };
  doneNights.forEach(s => { (champsOf(s) || []).forEach(n => bump(n, "voucher", voucher)); });
  if (seasonDone) {
    SEASON_PRIZES.forEach((amt, i) => {
      const e = leaderboard[i];
      if (e && e.player) bump(e.player.name, "cash", amt);
    });
  }
  const top = Object.entries(earners)
    .map(([n, v]) => [n, v, v.voucher + v.cash])
    .sort((a, b) => b[2] - a[2])
    .slice(0, 6);

  return (
    <div onClick={onClose} style={{ position: "fixed", inset: 0, zIndex: 80,
      background: "rgba(184,20,31,.88)", display: "flex", alignItems: "flex-end" }}>
      <div onClick={e => e.stopPropagation()} style={{ background: "#9E1520", width: "100%",
        maxHeight: "90vh", overflowY: "auto", borderTop: "3px solid #F7F1E6", padding: 16 }}>
        <div style={{ background: "#F7F1E6", color: "#B8141F", padding: 18 }}>
          <div style={{ fontFamily: "'JetBrains Mono',monospace", fontWeight: 700, fontSize: 10,
            letterSpacing: ".26em" }}>PLAYING FOR</div>
          <div style={{ fontStyle: "italic", fontVariationSettings: "'wdth' 125,'wght' 900",
            fontSize: 60, lineHeight: 1 }}>{pool} OMR</div>
          <div style={{ height: 8, background: "rgba(184,20,31,.2)", marginTop: 14 }}>
            <div style={{ height: "100%", background: "#B8141F",
                          width: Math.round(paid / pool * 100) + "%" }} />
          </div>
          <div style={{ display: "flex", justifyContent: "space-between", marginTop: 8,
            fontFamily: "'JetBrains Mono',monospace", fontWeight: 700, fontSize: 11 }}>
            <span>{paid} OMR PAID</span><span>{left} OMR LEFT</span>
          </div>
        </div>

        <div style={{ fontFamily: "'JetBrains Mono',monospace", fontWeight: 700, fontSize: 10,
          letterSpacing: ".26em", color: "#F2D0D3", marginTop: 22 }}>
          SEASON PRIZES &middot; {seasonDone ? "CASH" : "CASH \u00b7 IF IT ENDED NOW"}
        </div>
        {SEASON_PRIZES.map((amt, i) => {
          const e = leaderboard[i];
          return (
            <div key={i} style={{ display: "flex", alignItems: "center", gap: 12, padding: "12px 0",
              borderBottom: "1px solid rgba(242,208,211,.16)" }}>
              <span style={{ fontFamily: "'JetBrains Mono',monospace", fontWeight: 700, fontSize: 13,
                color: "#F7F1E6", width: 34 }}>{i + 1}{["ST","ND","RD"][i] || "TH"}</span>
              <span style={{ flex: 1, fontWeight: 800, fontSize: 14 }}>{e ? e.player.name : "—"}</span>
              <span style={{ fontSize: 12, color: "#F2D0D3" }}>{e ? e.totalPts + " pts" : ""}</span>
              <span style={{ fontFamily: "'JetBrains Mono',monospace", fontWeight: 700, fontSize: 16,
                color: "#F2B8BC" }}>{amt}</span>
            </div>
          );
        })}

        <div style={{ fontFamily: "'JetBrains Mono',monospace", fontWeight: 700, fontSize: 10,
          letterSpacing: ".26em", color: "#F2D0D3", marginTop: 22 }}>
          NIGHTLY VOUCHERS &middot; {voucher} OMR EACH
        </div>
        {doneNights.length === 0 && (
          <div style={{ fontSize: 13, color: "#F2D0D3", marginTop: 10 }}>No nights finished yet.</div>
        )}
        {doneNights.map((s, i) => {
          const c = champsOf(s);
          return (
            <div key={s.id} style={{ display: "flex", alignItems: "center", gap: 12, padding: "11px 0",
              borderBottom: "1px solid rgba(242,208,211,.16)" }}>
              <span style={{ fontFamily: "'JetBrains Mono',monospace", fontWeight: 700, fontSize: 12,
                color: "#F2D0D3", width: 28 }}>{i + 1}</span>
              <span style={{ flex: 1, fontSize: 13 }}>{c ? c.join(" & ") : "—"}</span>
              <span style={{ fontFamily: "'JetBrains Mono',monospace", fontWeight: 700, fontSize: 13,
                color: "#F7F1E6" }}>{voucher * perTeam}</span>
            </div>
          );
        })}

        {top.length > 0 && <>
          <div style={{ fontFamily: "'JetBrains Mono',monospace", fontWeight: 700, fontSize: 10,
            letterSpacing: ".26em", color: "#F2D0D3", marginTop: 22 }}>
            {seasonDone ? "TOP EARNERS" : "TOP EARNERS SO FAR"}</div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginTop: 10 }}>
            {top.map(([n, v, tot]) => (
              <div key={n} style={{ padding: 10, border: "1px solid rgba(255,255,255,.07)" }}>
                <div style={{ fontWeight: 800, fontSize: 13, whiteSpace: "nowrap",
                  overflow: "hidden", textOverflow: "ellipsis" }}>{n}</div>
                <div style={{ fontFamily: "'JetBrains Mono',monospace", fontWeight: 700, fontSize: 18,
                  color: "#F7F1E6", marginTop: 3 }}>{tot} OMR</div>
                {/* The split, always — a player who has 14 in vouchers and 75
                    in cash needs to know which is which before they turn up
                    expecting to spend it. Magenta is the cash, the same ink
                    the season prizes carry above. */}
                <div style={{ fontFamily: "'JetBrains Mono',monospace", fontWeight: 700,
                  fontSize: 10, letterSpacing: ".1em", marginTop: 4 }}>
                  <span style={{ color: "#F7F1E6" }}>{v.voucher} VOUCHER</span>
                  <span style={{ color: "#F2D0D3" }}> &middot; </span>
                  <span style={{ color: v.cash ? "#F2B8BC" : "#F2D0D3" }}>{v.cash} CASH</span>
                </div>
              </div>
            ))}
          </div>
        </>}

        <button onClick={onClose} style={{ width: "100%", marginTop: 20, padding: "14px",
          background: "transparent", border: "1px solid rgba(242,208,211,.4)", color: "#F2D0D3",
          fontFamily: "'JetBrains Mono',monospace", fontWeight: 700, fontSize: 11,
          letterSpacing: ".24em", cursor: "pointer" }}>CLOSE</button>
      </div>
    </div>
  );
}

// ══ VOL.9 · NIGHT RECAP ═══════════════════════════════════════════════════

function RecapSheet({ session, state, leaderboard, meId, onClose, onOpenSession }) {
  if (!session) return null;
  const [tab, setTab] = React.useState(() => {
    try { return localStorage.getItem("bo_recap_tab") || "mine"; } catch (e) { return "mine"; }
  });
  const [story, setStory] = React.useState(null);
  React.useEffect(() => {
    try { localStorage.setItem("bo_recap_tab", tab); } catch (e) {}
  }, [tab]);

  const nameOf = id => (state.players.find(p => p.id === id) || {}).name || "?";
  const teamName = tid => {
    const t = (session.teams || []).find(x => x.id === tid);
    return t ? nameOf(t.p1Id) + " & " + nameOf(t.p2Id) : "-";
  };
  const f = session.bracket && session.bracket.final;
  const champTid = f && f.winner ? (f.winner === "team1" ? f.team1Id : f.team2Id) : null;
  const idx = (state.sessions || []).findIndex(s => s.id === session.id);

  const nightOf = pid => {
    const r = calcPlayerNights(pid, (state.sessions || []).slice(0, idx + 1), () => "");
    const n = r.nights.find(x => x.idx === idx);
    return n ? n.nightTotal : 0;
  };
  const inIt = (state.players || []).filter(p => getPlayerTeam(session, p.id));
  const scored = inIt.map(p => ({ p, pts: nightOf(p.id) })).sort((a, b) => b.pts - a.pts);
  const topScorer = scored[0];

  const all = (session.groupMatches || []).concat((session.bracket || {}).qf || [],
    (session.bracket || {}).sf || [], f ? [f] : []).filter(m => m && m.winner && m.score);
  const biggest = all.map(m => {
    const w = m.winner === "team1" ? m.team1Id : m.team2Id;
    return { m, w, margin: Math.abs(m.score.t1 - m.score.t2) };
  }).sort((x, y) => y.margin - x.margin)[0];

  const votes = session.mvpVotes || {};
  const mvpId = Object.keys(votes).sort((a, b) => (votes[b] || 0) - (votes[a] || 0))[0];

  // My story: the handoff's three stat rows, filled from the night.
  const mineStory = d => {
    const wins = d.games.filter(g => g.won).length;
    const best = d.games.filter(g => g.won)
      .sort((a, b) => parseInt(b.score) - parseInt(a.score))[0];
    const far = d.games.some(g => g.stage === "FINAL") ? "REACHED THE FINAL"
              : d.games.some(g => g.stage === "SEMI-FINAL") ? "REACHED SEMI-FINAL"
              : d.games.some(g => g.stage === "QUARTER-FINAL") ? "REACHED THE QUARTERS"
              : "GROUP STAGE";
    setStory({
      no: idx + 1, who: (nameOf(meId) || "").split(" ")[0],
      record: wins + "-" + (d.games.length - wins),
      rows: [
        { k: "POINTS", v: "+" + (d.ptsNow - d.ptsWas), lime: true },
        { k: "HOW FAR", v: far },
        best ? { k: "BEST WIN", v: best.score + " VS " + best.opponents[0].toUpperCase() } : null,
      ].filter(Boolean),
      foot: "SESSION " + (idx + 1) + " \u00b7 " + fmtNightDate(session.date).toUpperCase(),
      rankLine: d.rankNow ? "#" + d.rankNow + " OF " + d.total : "",
    });
  };

  const groupStory = sum => setStory({
    no: idx + 1, who: sum.final ? sum.final.winners.toUpperCase() : "THE NIGHT",
    record: sum.final ? sum.final.score : "",
    rows: [
      { k: "PLAYERS", v: String(sum.playerCount) },
      { k: "GAMES", v: String(sum.gameCount) },
      sum.closest ? { k: "CLOSEST", v: sum.closest.score, lime: true } : null,
    ].filter(Boolean),
    foot: "SESSION " + (idx + 1) + " \u00b7 " + fmtNightDate(session.date).toUpperCase(),
    rankLine: sum.tiebreaks + (sum.tiebreaks === 1 ? " TIEBREAK" : " TIEBREAKS"),
  });

  return (
    <div onClick={onClose} style={{ position: "fixed", inset: 0, zIndex: 80,
      background: "rgba(184,20,31,.88)", display: "flex", alignItems: "flex-end" }}>
      <div onClick={e => e.stopPropagation()} style={{ background: "#9E1520", width: "100%",
        maxHeight: "90vh", overflowY: "auto", borderTop: "3px solid #F7F1E6", padding: 16 }}>
        <div style={{ fontFamily: "'JetBrains Mono',monospace", fontWeight: 700, fontSize: 10,
          letterSpacing: ".26em", color: "#F2D0D3" }}>
          <BoMark size={13} style={{ display: "inline-block", verticalAlign: "-2px", marginRight: 7 }} />
          SESSION {idx + 1} &middot; {fmtNightDate(session.date)}{session.doublePoints ? " \u00b7 2X NIGHT" : ""}
        </div>
        <div style={{ fontStyle: "italic", fontVariationSettings: "'wdth' 125,'wght' 900",
          fontSize: 44, lineHeight: .9, marginTop: 6 }}>SESSION {idx + 1}<br />RECAP</div>

        <RecapToggle tab={tab} setTab={setTab} />

        {tab === "mine"
          ? <RecapMine session={session} state={state} meId={meId} idx={idx} onShare={mineStory} />
          : <RecapEveryone session={session} state={state} meId={meId} idx={idx}
              nameOf={nameOf} teamName={teamName} champTid={champTid} f={f}
              mvpId={mvpId} votes={votes} topScorer={topScorer} biggest={biggest}
              inIt={inIt} onShare={groupStory} />}

        {onOpenSession && (
          <button onClick={onOpenSession} style={{ width: "100%", marginTop: 16, padding: "14px",
            background: "transparent", border: "1px solid rgba(247,241,230,.4)", color: "#F7F1E6",
            fontFamily: "'JetBrains Mono',monospace", fontWeight: 700, fontSize: 11,
            letterSpacing: ".24em", cursor: "pointer" }}>FULL RESULTS &#9654;</button>
        )}
        <button onClick={onClose} style={{ width: "100%", marginTop: 10, padding: "14px",
          background: "transparent", border: "1px solid rgba(242,208,211,.4)", color: "#F2D0D3",
          fontFamily: "'JetBrains Mono',monospace", fontWeight: 700, fontSize: 11,
          letterSpacing: ".24em", cursor: "pointer" }}>CLOSE</button>
      </div>
      <RecapStorySheet open={story} onClose={() => setStory(null)} />
    </div>
  );
}


function BoMark({ size = 16, style }) {
  const s = size;
  return (
    <svg width={s} height={s} viewBox="0 0 100 100" aria-hidden="true"
         style={{ display: "block", flex: "0 0 auto", ...(style || {}) }}>
      <rect x="0" y="0" width="100" height="46" fill="#F7F1E6" />
      <rect x="75" y="12" width="13" height="13" fill="#F2B8BC" />
      <rect x="0" y="55" width="100" height="7" fill="#F7F1E6" />
      <rect x="0" y="69" width="100" height="9" fill="#F7F1E6" />
      <rect x="0" y="85" width="100" height="11" fill="#F7F1E6" />
    </svg>
  );
}

// An eyebrow with the mark in front of it. Every screen head uses this, so the
// mark sits in the same place on all of them instead of five near-misses.
function ScreenEyebrow({ children, color = "#F7F1E6" }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
      <BoMark size={14} />
      <div style={{ fontFamily: "'Archivo',sans-serif", fontWeight: 800, fontSize: 10,
                    letterSpacing: ".34em", textTransform: "uppercase", color }}>
        {children}
      </div>
    </div>
  );
}

// The table as it stood after night `upto` (0-based, inclusive). Returns a map
// of playerId -> rank, plus the ordered rows.
function rankAt(state, upto) {
  const sessions = (state.sessions || []).slice(0, upto + 1);
  const rows = (state.players || []).map(p => {
    const s = calcPlayerStats(p.id, sessions);
    // sessionsPlayed lives on s.stats, not on s — reading it off the top level
    // silently returns undefined and ranks nobody who has yet to score.
    return { id: p.id, name: p.name, pts: s.totalPts, played: (s.stats || {}).sessionsPlayed || 0 };
  }).filter(r => r.played > 0 || r.pts > 0)
    .sort((a, b) => b.pts - a.pts || a.name.localeCompare(b.name));
  const rank = {};
  rows.forEach((r, i) => { rank[r.id] = i + 1; });
  return { rows, rank };
}

// Movement into the latest completed night: ▲n, ▼n or —.
function moveInto(state, idx) {
  if (idx <= 0) return { rank: rankAt(state, idx).rank, prev: {} };
  return { rank: rankAt(state, idx).rank, prev: rankAt(state, idx - 1).rank };
}

function Delta({ now, before }) {
  if (!before || !now || before === now) {
    return <span style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: 11,
                          color: "#F2D0D3" }}>—</span>;
  }
  const up = before > now;
  return (
    <span style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: 11, fontWeight: 700,
                   color: up ? "#F7F1E6" : "#F2B8BC" }}>
      {up ? "▲" : "▼"}{Math.abs(before - now)}
    </span>
  );
}

// The standings, on the SESSIONS screen. The owner asked to see the ranking
// without leaving for the RANK tab — this is the top five plus your own row
// when you are outside it, which is the only part of the table anyone checks
// between nights.
function SessionsTable({ state, meId, onOpen }) {
  const played = (state.sessions || []).reduce(
    (n, s, i) => (s.completed || (s.bracket && s.bracket.final && s.bracket.final.winner) ? i : n), -1);
  const { rows } = rankAt(state, Math.max(played, (state.sessions || []).length - 1));
  if (!rows.length) {
    return (
      <div style={{ border: "1px solid rgba(242,208,211,.3)", background: "rgba(158,21,32,.94)",
                    padding: 16, textAlign: "center", color: "#F2D0D3", fontSize: 12 }}>
        The table opens after the first night is played.
      </div>
    );
  }
  const { rank, prev } = moveInto(state, played);
  const top = rows.slice(0, 5);
  const mine = rows.findIndex(r => r.id === meId);
  const extra = mine >= 5 ? rows[mine] : null;

  const Row = ({ r, i }) => {
    const you = r.id === meId;
    return (
      <div onClick={() => onOpen && onOpen(r.id)}
           style={{ display: "grid", gridTemplateColumns: "22px 1fr 44px 42px", alignItems: "center",
                    gap: 8, padding: "9px 0", cursor: onOpen ? "pointer" : "default",
                    borderTop: i === 0 ? "none" : "1px solid rgba(242,208,211,.16)" }}>
        <div style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: 12,
                      color: i === 0 ? "#F7F1E6" : "#F2D0D3" }}>{rank[r.id] || i + 1}</div>
        <div style={{ fontSize: 14, fontWeight: 800,
                      color: you ? "#F2B8BC" : "#FFFFFF", overflow: "hidden",
                      textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
          {r.name}{you ? " · you" : ""}
        </div>
        <div style={{ textAlign: "center" }}>
          <Delta now={rank[r.id]} before={prev[r.id]} />
        </div>
        <div style={{ fontStyle: "italic", fontVariationSettings: "'wdth' 112,'wght' 900",
                      fontSize: 17, textAlign: "right",
                      color: you ? "#F2B8BC" : "#FFFFFF" }}>{r.pts}</div>
      </div>
    );
  };

  return (
    <div style={{ border: "1px solid rgba(247,241,230,.35)", background: "rgba(158,21,32,.96)",
                  padding: "12px 14px 6px" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center",
                    marginBottom: 4 }}>
        <div style={{ fontFamily: "'Archivo',sans-serif", fontWeight: 900, fontSize: 9,
                      letterSpacing: ".3em", color: "#F7F1E6" }}>
          {played >= 0 ? `TABLE AFTER S${played + 1}` : "THE TABLE"}
        </div>
        <div style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: 10, color: "#F2D0D3" }}>
          {rows.length} RANKED
        </div>
      </div>
      {top.map((r, i) => <Row key={r.id} r={r} i={i} />)}
      {extra && (
        <>
          <div style={{ borderTop: "1px solid rgba(242,208,211,.16)", margin: "2px 0" }} />
          <Row r={extra} i={1} />
        </>
      )}
    </div>
  );
}

// One uploader, used by the KO strip and by the line-up sheet. Two copies of
// this would be two places for the watermark, the folder or the error handling
// to drift apart.
async function addSessionPhotos(session, updateSession, files) {
  if (!files.length) return [];
  if (!getToken()) { alert("Sign in first — photos can't be saved without it."); return []; }
  try {
    const settled = await Promise.allSettled(
      files.map(async f => uploadFramedPhotoToCloud(await watermarkPhotoToBase64(f)))
    );
    const urls = settled.filter(r => r.status === "fulfilled" && r.value).map(r => r.value);
    if (urls.length) {
      const next = [...(session.photos || []), ...urls];
      updateSession(s => ({ ...s, photos: next }));
      await uploadSessionPhotosToServer(session.id, next);
    }
    const failed = files.length - urls.length;
    if (failed > 0) alert(`${failed} photo${failed > 1 ? "s" : ""} couldn't be added.`);
    return urls;
  } catch (e) {
    alert("Couldn't add photos: " + (e && e.message ? e.message : e));
    return [];
  }
}

function KoPhotoStrip({ session, updateSession, canUpload }) {
  const [busy, setBusy] = React.useState(false);
  const photos = session.photos || [];

  const add = async (files) => {
    setBusy(true);
    await addSessionPhotos(session, updateSession, files);
    setBusy(false);
  };

  if (!canUpload && photos.length === 0) return null;

  return (
    <div style={{ border: "1px solid rgba(242,208,211,.3)", background: "rgba(158,21,32,.94)",
                  padding: 12 }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
        <div style={{ fontFamily: "'Archivo',sans-serif", fontWeight: 900, fontSize: 9,
                      letterSpacing: ".3em", color: "#F2D0D3" }}>
          KNOCKOUT PHOTOS{photos.length ? ` \u00b7 ${photos.length}` : ""}
        </div>
        {canUpload && (
          <label style={{ cursor: busy ? "default" : "pointer", padding: "7px 12px",
                          border: "1px solid rgba(247,241,230,.45)", color: "#F7F1E6",
                          fontFamily: "'JetBrains Mono',monospace", fontWeight: 700,
                          fontSize: 10, letterSpacing: ".14em",
                          opacity: busy ? .5 : 1 }}>
            {busy ? "UPLOADING\u2026" : "+ ADD PHOTO"}
            <input type="file" accept="image/*" multiple style={{ display: "none" }}
                   disabled={busy}
                   onChange={e => { const f = Array.from(e.target.files || []);
                                    e.target.value = ""; add(f); }} />
          </label>
        )}
      </div>
      {photos.length > 0 && (
        <div style={{ display: "flex", gap: 6, marginTop: 10, overflowX: "auto" }}>
          {photos.slice(-8).map((src, i) => (
            <img key={i} src={src} alt="" onClick={() => sharePhoto && sharePhoto(src, i)}
                 style={{ width: 64, height: 64, objectFit: "cover", flex: "0 0 auto",
                          cursor: "pointer", border: "1px solid rgba(242,208,211,.3)" }} />
          ))}
        </div>
      )}
      <div style={{ fontSize: 11, color: "#F2D0D3", marginTop: 8 }}>
        Added here, they show on the photo wall and can go on the line-up card.
      </div>
    </div>
  );
}

// Every game one player played on a night, in the order they played them.
function recapGames(session, state, pid) {
  const team = getPlayerTeam(session, pid);
  if (!team) return [];
  const nameOf = id => ((state.players || []).find(p => p.id === id) || {}).name || "?";
  const first = id => nameOf(id).split(" ")[0];
  const partner = team.p1Id === pid ? team.p2Id : team.p1Id;
  const teamOf = tid => (session.teams || []).find(t => t.id === tid);
  const opp = tid => {
    const t = teamOf(tid);
    return t ? [first(t.p1Id), first(t.p2Id)] : ["?", "?"];
  };

  const rows = [];
  const push = (m, stage) => {
    if (!m || !m.winner || (m.team1Id !== team.id && m.team2Id !== team.id)) return;
    const mine = m.team1Id === team.id;
    const otherId = mine ? m.team2Id : m.team1Id;
    const won = teamWon(m, team.id);
    const a = mine ? m.score.t1 : m.score.t2;
    const b = mine ? m.score.t2 : m.score.t1;
    rows.push({
      stage, won, score: `${a}–${b}`,
      partner: first(partner), opponents: opp(otherId),
      tiebreak: m.lossType === "tiebreak" || Math.abs(a - b) === 1,
    });
  };

  let g = 0;
  (session.groupMatches || []).forEach(m => {
    if (m.team1Id === team.id || m.team2Id === team.id) { g += 1; push(m, `GROUP · G${g}`); }
  });
  ((session.bracket || {}).qf || []).forEach(m => push(m, "QUARTER-FINAL"));
  ((session.bracket || {}).sf || []).forEach(m => push(m, "SEMI-FINAL"));
  const f = (session.bracket || {}).final;
  if (f) push(f, "FINAL");
  const tp = (session.bracket || {}).thirdsPlayoff || (session.bracket || {}).thirdPlace;
  if (tp) push(tp, "3RD PLACE");
  return rows;
}

// The headline, generated from what actually happened. Ordered by what is worth
// saying: winning the thing, then beating the leader, then a tiebreak, then a
// count of wins.
function recapHeadline(games, opts) {
  const w = games.filter(g => g.won).length;
  const l = games.length - w;
  if (!games.length) return ["NO GAMES", "ON THE NIGHT"];
  if (opts && opts.champion) return [`${w}–${l} AND`, "THE TITLE."];
  if (opts && opts.beatLeader) return ["YOU BEAT", "THE LEADER."];
  if (games.some(g => g.won && g.tiebreak)) return [`${w} WINS.`, "ONE TIEBREAK."];
  if (w && !l) return ["UNBEATEN", "ON THE NIGHT."];
  if (!w) return ["TOUGH ONE.", `${l} LOSSES.`];
  return [`${w} WINS.`, `${l} ${l === 1 ? "LOSS" : "LOSSES"}.`];
}

// The whole group's night, the same for everyone.
function sessionSummary(session, state, idx) {
  const nameOf = id => ((state.players || []).find(p => p.id === id) || {}).name || "?";
  const teamName = tid => {
    const t = (session.teams || []).find(x => x.id === tid);
    return t ? nameOf(t.p1Id).split(" ")[0] + " & " + nameOf(t.p2Id).split(" ")[0] : "—";
  };
  const f = (session.bracket || {}).final;
  const all = (session.groupMatches || []).concat((session.bracket || {}).qf || [],
    (session.bracket || {}).sf || [], f ? [f] : []).filter(m => m && m.winner && m.score);
  const players = (state.players || []).filter(p => getPlayerTeam(session, p.id));

  const { rank } = rankAt(state, idx);
  const prev = idx > 0 ? rankAt(state, idx - 1).rank : {};
  let climb = null;
  players.forEach(p => {
    const before = prev[p.id], now = rank[p.id];
    if (!before || !now) return;
    const up = before - now;
    if (up > 0 && (!climb || up > climb.up)) climb = { name: p.name, up };
  });

  const tiebreaks = all.filter(m => Math.abs(m.score.t1 - m.score.t2) === 1).length;
  const closest = all.map(m => ({ m, d: Math.abs(m.score.t1 - m.score.t2) }))
                     .sort((a, b) => a.d - b.d)[0];

  return {
    playerCount: players.length,
    gameCount: all.length,
    final: f && f.winner ? {
      winners: teamName(f.winner === "team1" ? f.team1Id : f.team2Id),
      runnersUp: teamName(f.winner === "team1" ? f.team2Id : f.team1Id),
      score: f.score ? `${Math.max(f.score.t1, f.score.t2)}–${Math.min(f.score.t1, f.score.t2)}` : "",
    } : null,
    climb, tiebreaks,
    closest: closest ? { score: `${closest.m.score.t1}–${closest.m.score.t2}` } : null,
  };
}

// The 9:16 recap story. Same canvas approach as every other share card here, so
// what you preview is the file you post.
function drawRecapStory(d) {
  const c = document.createElement("canvas");
  c.width = 1080; c.height = 1920;
  const g = c.getContext("2d");
  g.fillStyle = "#B8141F"; g.fillRect(0, 0, 1080, 1920);
  let rg = g.createRadialGradient(1080, 300, 0, 1080, 300, 1000);
  rg.addColorStop(0, "rgba(242,184,188,.22)"); rg.addColorStop(1, "rgba(242,184,188,0)");
  g.fillStyle = rg; g.fillRect(0, 0, 1080, 1920);
  rg = g.createRadialGradient(0, 1700, 0, 0, 1700, 1000);
  rg.addColorStop(0, "rgba(247,241,230,.12)"); rg.addColorStop(1, "rgba(247,241,230,0)");
  g.fillStyle = rg; g.fillRect(0, 0, 1080, 1920);
  g.fillStyle = "rgba(247,241,230,.05)";
  for (let y = 0; y < 1920; y += 10) g.fillRect(0, y, 1080, 2);
  g.fillStyle = "#F7F1E6"; g.fillRect(0, 0, 1080, 10);

  const L = 86, R = 1080 - 86, W = R - L;
  stMono(g, `56 NATIONAL SERIES · VOL.9 · S${d.no}`, L, 190, 24, "#F7F1E6", 5);
  stDisp(g, (d.who || "").toUpperCase(), L, 400, 112, "#FFFFFF", W);
  stDisp(g, d.record, L, 530, 112, "#F7F1E6", W);
  stDisp(g, "ON THE", L, 650, 112, "#FFFFFF", W);
  stDisp(g, "NIGHT", L, 770, 112, "#FFFFFF", W);

  let y = 1020;
  (d.rows || []).slice(0, 3).forEach(r => {
    g.fillStyle = "rgba(242,208,211,.3)"; g.fillRect(L, y - 56, W, 2);
    stMono(g, r.k, L, y - 18, 22, "#F2D0D3", 4);
    stDisp(g, r.v, L, y + 36, 56, r.lime ? "#F7F1E6" : "#FFFFFF", W);
    y += 180;
  });

  stMono(g, d.foot || "", L, 1920 - 150, 26, "#F2B8BC", 5);
  g.font = '700 26px "JetBrains Mono", monospace'; g.fillStyle = "#F2D0D3";
  const t = d.rankLine || "";
  g.fillText(t, R - g.measureText(t).width, 1920 - 150);
  return c.toDataURL("image/png");
}

function RecapStorySheet({ open, onClose }) {
  const [url, setUrl] = React.useState("");
  const [flash, setFlash] = React.useState("");
  React.useEffect(() => {
    if (!open) return;
    let alive = true;
    document.fonts.ready.then(() => { if (alive) setUrl(drawRecapStory(open)); });
    return () => { alive = false; };
  }, [open]);
  if (!open) return null;
  const save = async () => {
    try {
      const blob = await (await fetch(url)).blob();
      const f = new File([blob], "national-recap.png", { type: "image/png" });
      if (navigator.canShare && navigator.canShare({ files: [f] })) {
        await navigator.share({ files: [f], title: "56 National Series" }); return;
      }
    } catch (e) { if (e && e.name === "AbortError") return; }
    const a = document.createElement("a");
    a.href = url; a.download = "national-recap.png";
    document.body.appendChild(a); a.click(); a.remove();
    setFlash("SAVED"); setTimeout(() => setFlash(""), 1600);
  };
  return (
    <div onClick={onClose} style={{ position: "fixed", inset: 0, zIndex: 95,
      background: "rgba(184,20,31,.92)", display: "flex", alignItems: "flex-end" }}>
      <div onClick={e => e.stopPropagation()} style={{ background: "#9E1520", width: "100%",
        maxHeight: "94vh", overflowY: "auto", borderTop: "3px solid #F7F1E6", padding: 16 }}>
        <div style={{ display: "flex", justifyContent: "center", margin: "6px 0 14px" }}>
          {url ? <img src={url} alt="" style={{ width: 260, height: 462, display: "block",
                        border: "1px solid rgba(242,208,211,.3)" }} />
               : <div style={{ width: 260, height: 462, background: "#9E1520" }} />}
        </div>
        <button onClick={save} style={{ width: "100%", padding: 16, background: "#F7F1E6",
          color: "#B8141F", border: "none", cursor: "pointer",
          fontFamily: "'JetBrains Mono',monospace", fontWeight: 700, fontSize: 11,
          letterSpacing: ".2em" }}>SHARE / SAVE</button>
        {flash && <div style={{ textAlign: "center", color: "#F7F1E6", marginTop: 10,
          fontFamily: "'JetBrains Mono',monospace", fontSize: 11 }}>{flash}</div>}
        <button onClick={onClose} style={{ width: "100%", marginTop: 10, padding: 12,
          background: "transparent", color: "#F2D0D3", border: "none", cursor: "pointer",
          fontFamily: "'JetBrains Mono',monospace", fontSize: 11,
          letterSpacing: ".14em" }}>CLOSE</button>
      </div>
    </div>
  );
}



// ══ VOL.9 · SHARE TO STORY ════════════════════════════════════════════════
//
// The handoff describes a 270x480 DOM preview that exports at 1080x1920 "x4".
// Two renderers of the same card drift, and the one people see is not the one
// they post. So this draws the real 1080x1920 card ONCE on a canvas and shows
// that same bitmap scaled down as the preview — what you see is the file.
//
// Canvas cannot set font-variation-settings, so the display type here sits at
// Archivo's default width rather than the app's 'wdth' 125. It is the one place
// in Vol.9 the wordmark is not pushed wide, and it is a platform limit, not an
// oversight.

const ST_W = 1080, ST_H = 1920;

function stFit(ctx, text, max, size, weight) {
  let s = size;
  for (;;) {
    ctx.font = `italic ${weight} ${s}px Archivo, sans-serif`;
    if (ctx.measureText(text).width <= max || s <= 18) return s;
    s -= 2;
  }
}
function stDisp(ctx, text, x, y, size, color, max) {
  const s = max ? stFit(ctx, text, max, size, 900) : size;
  ctx.font = `italic 900 ${s}px Archivo, sans-serif`;
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
  return s;
}
function stMono(ctx, text, x, y, size, color, track) {
  ctx.font = `700 ${size}px "JetBrains Mono", monospace`;
  ctx.fillStyle = color;
  if (!track) { ctx.fillText(text, x, y); return; }
  let cx = x;
  for (const ch of text) { ctx.fillText(ch, cx, y); cx += ctx.measureText(ch).width + track; }
}

function drawStory(kind, d) {
  const c = document.createElement("canvas");
  c.width = ST_W; c.height = ST_H;
  const g = c.getContext("2d");

  g.fillStyle = "#B8141F"; g.fillRect(0, 0, ST_W, ST_H);
  // the brand's corner washes
  let rg = g.createRadialGradient(ST_W, ST_H * 0.18, 0, ST_W, ST_H * 0.18, ST_W * 0.9);
  rg.addColorStop(0, "rgba(242,184,188,.20)"); rg.addColorStop(1, "rgba(242,184,188,0)");
  g.fillStyle = rg; g.fillRect(0, 0, ST_W, ST_H);
  rg = g.createRadialGradient(0, ST_H * 0.92, 0, 0, ST_H * 0.92, ST_W * 0.9);
  rg.addColorStop(0, "rgba(247,241,230,.10)"); rg.addColorStop(1, "rgba(247,241,230,0)");
  g.fillStyle = rg; g.fillRect(0, 0, ST_W, ST_H);
  // scanlines
  g.fillStyle = "rgba(247,241,230,.045)";
  for (let y = 0; y < ST_H; y += 10) g.fillRect(0, y, ST_W, 2);
  // top rail
  g.fillStyle = "#F7F1E6"; g.fillRect(0, 0, ST_W, 10);

  // the mark, drawn rather than loaded so the card never waits on an image
  const mx = 86, my = 150, ms = 96;
  g.fillStyle = "#F7F1E6"; g.fillRect(mx, my, ms, ms);
  g.fillStyle = "#B8141F";
  [[0.47, 0.03], [0.59, 0.06], [0.73, 0.09], [0.89, 0.11]].forEach(([t, h]) =>
    g.fillRect(mx, my + ms * t, ms, ms * h));
  g.fillStyle = "#F2B8BC"; g.fillRect(mx + ms * 0.75, my + ms * 0.12, ms * 0.13, ms * 0.13);
  stMono(g, "56 NATIONAL SERIES · VOL.9", mx + ms + 28, my + ms * 0.62, 24, "#F2D0D3", 3);

  const L = 86, R = ST_W - 86, W = R - L;
  g.textBaseline = "alphabetic";

  if (kind === "night") {
    stMono(g, `SESSION ${d.no}  ·  ${(d.date || "").toUpperCase()}`, L, 420, 26, "#F7F1E6", 5);
    stDisp(g, "MY", L, 580, 150, "#FFFFFF", W);
    stDisp(g, "NIGHT", L, 720, 150, "#F7F1E6", W);
    stDisp(g, (d.name || "").toUpperCase(), L, 850, 72, "#FFFFFF", W);
    g.font = "700 220px Archivo, sans-serif";
    g.fillStyle = "#F7F1E6";
    g.fillText("+" + d.total, L, 1090);
    stMono(g, "POINTS THIS NIGHT", L, 1150, 24, "#F2D0D3", 4);
    // Four lines, not five: the fifth landed under the footer plate at 1628.
    let y = 1260;
    (d.lines || []).slice(0, 4).forEach(ln => {
      g.fillStyle = "rgba(242,208,211,.3)"; g.fillRect(L, y - 44, W, 2);
      g.font = "800 34px Archivo, sans-serif"; g.fillStyle = "#FFFFFF";
      g.fillText(ln.label, L, y);
      g.font = '700 38px "JetBrains Mono", monospace';
      g.fillStyle = ln.pts > 0 ? "#F7F1E6" : "#F2D0D3";
      const t = (ln.pts > 0 ? "+" : "") + ln.pts;
      g.fillText(t, R - g.measureText(t).width, y);
      y += 92;
    });
    g.fillStyle = "#F7F1E6"; g.fillRect(L, ST_H - 300, W, 116);
    stMono(g, `SERIES #${d.rank}  ·  ${d.series} PTS`, L + 36, ST_H - 224, 36, "#B8141F", 4);
  }

  if (kind === "champs") {
    stDisp(g, "NIGHT", L, 560, 150, "#FFFFFF", W);
    stDisp(g, "CHAMPS", L, 700, 150, "#F7F1E6", W);
    stMono(g, `SESSION ${d.no} · ${(d.date || "").toUpperCase()}`, L, 780, 26, "#F2D0D3", 5);
    g.strokeStyle = "#F7F1E6"; g.lineWidth = 4;
    g.strokeRect(L, 860, W, 420);
    (d.champs || []).forEach((n, i) => stDisp(g, n.toUpperCase(), L + 44, 990 + i * 110, 74, "#FFFFFF", W - 88));
    stMono(g, SEASON_VOUCHER + " OMR VOUCHER EACH", L + 44, 1220, 28, "#F2B8BC", 4);
    if (d.score) stDisp(g, d.score, L, 1420, 96, "#F2D0D3", W);
    stMono(g, "NATIONAL.URBANPADEL.OM", L, ST_H - 220, 26, "#F2D0D3", 5);
  }

  if (kind === "top5") {
    stDisp(g, "AS IT", L, 560, 150, "#FFFFFF", W);
    stDisp(g, "STANDS", L, 700, 150, "#F7F1E6", W);
    let y = 880;
    (d.rows || []).slice(0, 5).forEach((r, i) => {
      if (i === 0) { g.strokeStyle = "#F7F1E6"; g.lineWidth = 4; g.strokeRect(L, y - 66, W, 104); }
      else { g.fillStyle = "rgba(242,208,211,.3)"; g.fillRect(L, y + 38, W, 2); }
      g.font = '700 42px "JetBrains Mono", monospace';
      g.fillStyle = i === 0 ? "#F7F1E6" : "#F2D0D3";
      g.fillText(String(i + 1), L + 26, y);
      const nm = stFit(g, r.name, W - 300, 54, 900);
      g.font = `italic 900 ${nm}px Archivo, sans-serif`; g.fillStyle = "#FFFFFF";
      g.fillText(r.name, L + 100, y);
      g.font = '700 48px "JetBrains Mono", monospace';
      g.fillStyle = i === 0 ? "#F7F1E6" : "#FFFFFF";
      const t = String(r.pts);
      g.fillText(t, R - 26 - g.measureText(t).width, y);
      y += 128;
    });
    stMono(g, `PLAYING FOR ${d.pool} OMR`, L, ST_H - 240, 32, "#F2B8BC", 5);
  }

  if (kind === "badge") {
    stDisp(g, "BADGE", L, 560, 150, "#FFFFFF", W);
    stDisp(g, d.got ? "UNLOCKED" : "IN REACH", L, 700, 150, d.got ? "#F7F1E6" : "#F2B8BC", W);
    const bs = 300, bx = (ST_W - bs) / 2;
    g.fillStyle = d.got ? "#F7F1E6" : "transparent"; g.fillRect(bx, 880, bs, bs);
    if (!d.got) { g.strokeStyle = "#F2D0D3"; g.lineWidth = 4; g.strokeRect(bx, 880, bs, bs); }
    g.font = '700 128px "JetBrains Mono", monospace';
    g.fillStyle = d.got ? "#B8141F" : "#F2D0D3";
    g.fillText(d.code, bx + (bs - g.measureText(d.code).width) / 2, 1055);
    g.textAlign = "center";
    stDisp(g, (d.name || "").toUpperCase(), ST_W / 2, 1300, 86, "#FFFFFF", W);
    g.font = "400 36px Archivo, sans-serif"; g.fillStyle = "#F2D0D3";
    g.fillText(d.desc || "", ST_W / 2, 1370);
    g.font = "800 44px Archivo, sans-serif"; g.fillStyle = "#F7F1E6";
    g.fillText(d.player || "", ST_W / 2, 1480);
    g.textAlign = "left";
  }

  return c.toDataURL("image/png");
}

const ST_TABS = [["night", "MY NIGHT"], ["champs", "CHAMPS"], ["top5", "TOP 5"], ["badge", "BADGE"]];

function ShareSheet({ open, data, onClose }) {
  const [kind, setKind] = React.useState(open?.kind || "night");
  const [url, setUrl] = React.useState("");
  const [flash, setFlash] = React.useState("");
  React.useEffect(() => { if (open) setKind(open.kind || "night"); }, [open]);
  React.useEffect(() => {
    if (!open) return;
    let alive = true;
    // The display face has to be in before the canvas measures anything, or
    // every card is laid out against a fallback and the type overruns.
    document.fonts.ready.then(() => { if (alive) setUrl(drawStory(kind, data[kind] || {})); });
    return () => { alive = false; };
  }, [open, kind, data]);
  if (!open) return null;

  const save = async () => {
    try {
      const blob = await (await fetch(url)).blob();
      const f = new File([blob], `national-${kind}.png`, { type: "image/png" });
      if (navigator.canShare && navigator.canShare({ files: [f] })) {
        await navigator.share({ files: [f], title: "56 National Series" });
        return;
      }
    } catch (e) { if (e && e.name === "AbortError") return; }
    const a = document.createElement("a");
    a.href = url; a.download = `national-${kind}.png`;
    document.body.appendChild(a); a.click(); a.remove();
    setFlash("SAVED"); setTimeout(() => setFlash(""), 1600);
  };
  const copy = async () => {
    try { await navigator.clipboard.writeText((data[kind] || {}).caption || ""); setFlash("CAPTION COPIED"); }
    catch (e) { setFlash("COULDN'T COPY"); }
    setTimeout(() => setFlash(""), 1600);
  };

  return (
    <div onClick={onClose} style={{ position: "fixed", inset: 0, zIndex: 90,
      background: "rgba(184,20,31,.9)", display: "flex", alignItems: "flex-end" }}>
      <div onClick={e => e.stopPropagation()} style={{ background: "#9E1520", width: "100%",
        maxHeight: "94vh", overflowY: "auto", borderTop: "3px solid #F2B8BC", padding: 16 }}>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: 6 }}>
          {ST_TABS.map(([k, label]) => (
            <button key={k} onClick={() => setKind(k)} style={{ padding: "10px 4px", cursor: "pointer",
              background: kind === k ? "#F7F1E6" : "transparent",
              color: kind === k ? "#B8141F" : "#F2D0D3",
              border: "1px solid " + (kind === k ? "#F7F1E6" : "rgba(242,208,211,.3)"),
              fontFamily: "'JetBrains Mono',monospace", fontWeight: 700, fontSize: 10,
              letterSpacing: ".12em" }}>{label}</button>
          ))}
        </div>
        <div style={{ display: "flex", justifyContent: "center", margin: "16px 0" }}>
          {url
            ? <img src={url} alt="" style={{ width: 270, height: 480, display: "block",
                                             border: "1px solid rgba(242,208,211,.3)" }} />
            : <div style={{ width: 270, height: 480, background: "#9E1520" }} />}
        </div>
        <div style={{ fontSize: 11, color: "#F2D0D3", textAlign: "center", marginBottom: 12 }}>
          Preview is the actual 1080&times;1920 file, shown small.
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
          <button onClick={save} style={{ padding: "16px", background: "#F7F1E6", color: "#B8141F",
            border: "none", cursor: "pointer", fontFamily: "'JetBrains Mono',monospace",
            fontWeight: 700, fontSize: 11, letterSpacing: ".2em" }}>SAVE IMAGE</button>
          <button onClick={copy} style={{ padding: "16px", background: "transparent", color: "#F2B8BC",
            border: "1px solid rgba(242,184,188,.5)", cursor: "pointer",
            fontFamily: "'JetBrains Mono',monospace", fontWeight: 700, fontSize: 11,
            letterSpacing: ".2em" }}>COPY CAPTION</button>
        </div>
        {flash && <div style={{ textAlign: "center", marginTop: 12, color: "#F7F1E6",
          fontFamily: "'JetBrains Mono',monospace", fontWeight: 700, fontSize: 11,
          letterSpacing: ".2em" }}>{flash}</div>}
        <button onClick={onClose} style={{ width: "100%", marginTop: 14, padding: "12px",
          background: "transparent", border: "1px solid rgba(242,208,211,.4)", color: "#F2D0D3",
          fontFamily: "'JetBrains Mono',monospace", fontWeight: 700, fontSize: 10,
          letterSpacing: ".24em", cursor: "pointer" }}>CLOSE</button>
      </div>
    </div>
  );
}

const LU_W = 1080, LU_H = 1920;

function luImg(src) {
  return new Promise(res => {
    if (!src) return res(null);
    const im = new Image();
    im.crossOrigin = "anonymous";
    im.onload = () => res(im);
    im.onerror = () => res(null);
    im.src = src;
  });
}

// Cover-fit, the way CSS background-size:cover does it: fill the box, crop the
// overflow, never distort faces.
function luCover(g, im, x, y, w, h) {
  g.imageSmoothingEnabled = true; g.imageSmoothingQuality = "high";
  const r = Math.max(w / im.width, h / im.height);
  const dw = im.width * r, dh = im.height * r;
  g.drawImage(im, x + (w - dw) / 2, y + (h - dh) / 2, dw, dh);
}

function luPaint(g, kind, d, im, logo, adj) {
  adj = adj || LU_ADJ0;
  g.fillStyle = "#B8141F"; g.fillRect(0, 0, LU_W, LU_H);

  // ── the photo, and the grade that makes any photo look like this volume ──
  if (im) {
    const top = 420, hh = 1140;
    const gr = Math.max(0, Math.min(1, adj.grade == null ? 1 : adj.grade));
    const br = adj.bright || 1;
    g.save();
    g.beginPath(); g.rect(0, top, LU_W, hh); g.clip();

    // ── 1. the photograph, pushed back ──────────────────────────────────
    // The old treatment desaturated and then laid a flat left-to-right wash
    // over the whole window, which tinted the players as much as the room.
    // This darkens and cools the frame first so the photo becomes a ground,
    // and puts the colour in as LIGHT in the next step instead.
    if (LU_CAN_FILTER) {
      // Only what the organiser dialled in. `grade` no longer
      // desaturates: it is the strength of the LIGHT below, not a
      // wash over the people.
      g.filter = br === 1 ? "none" : `brightness(${br.toFixed(3)})`;
      luCoverAdj(g, im, 0, top, LU_W, hh, adj);
      g.filter = "none";
    } else {
      luCoverAdj(g, im, 0, top, LU_W, hh, adj);
      g.globalCompositeOperation = "saturation";
      g.fillStyle = "#1a1a1a"; g.globalAlpha = 0.85 * gr;
      g.fillRect(0, top, LU_W, hh);
      g.globalCompositeOperation = "source-over";
      g.fillStyle = "#B8141F"; g.globalAlpha = 0.22 * gr;
      g.fillRect(0, top, LU_W, hh);
      g.globalAlpha = 1;
    }

    // ── 2. the floodlights ──────────────────────────────────────────────
    // Two lamps BEHIND the players rather than a wash across them: magenta
    // low and left, lime higher and right, both soft and both centred near
    // the shoulder line of a group shot, which is where a real backlight
    // would sit. `screen` is what makes them read as light falling on the
    // room instead of paint laid on the picture.
    g.globalCompositeOperation = "screen";
    // A lamp needs a hot core and a fast falloff. The first version used a
    // gentle ramp over most of the card and read as coloured haze laid on the
    // whole picture rather than as two lights in the room behind it.
    const lamp = (cx, cy, rad, rgb, a) => {
      const rg2 = g.createRadialGradient(cx, cy, 0, cx, cy, rad);
      rg2.addColorStop(0,    `rgba(${rgb},${(a * gr).toFixed(3)})`);
      rg2.addColorStop(0.18, `rgba(${rgb},${(a * gr * 0.55).toFixed(3)})`);
      rg2.addColorStop(0.50, `rgba(${rgb},${(a * gr * 0.16).toFixed(3)})`);
      rg2.addColorStop(1,    `rgba(${rgb},0)`);
      g.fillStyle = rg2; g.fillRect(0, top, LU_W, hh);
    };
    // Shoulder height, just outside the frame on each side: that is where a
    // backlight would stand, and it is what puts a rim on people rather than
    // a tint on everything.
    lamp(LU_W * 0.02, top + hh * 0.40, LU_W * 0.56, "12,168,86",  0.92);
    lamp(LU_W * 1.00, top + hh * 0.30, LU_W * 0.50, "12,168,86",  0.62);
    lamp(LU_W * 0.50, top + hh * 0.06, LU_W * 0.42, "247,241,230", 0.30);
    g.globalCompositeOperation = "source-over";

    // ── 3. the floor ────────────────────────────────────────────────────
    // Darken the bottom of the window so the lamps do not light the ground
    // the plates stand on. Without it the lime glow runs under the names.
    const fg = g.createLinearGradient(0, top + hh * 0.52, 0, top + hh);
    fg.addColorStop(0, "rgba(184,20,31,0)");
    fg.addColorStop(1, `rgba(184,20,31,${(0.55 * gr).toFixed(3)})`);
    g.fillStyle = fg; g.fillRect(0, top, LU_W, hh);
    g.restore();
    // fade the photo into the ground at both ends, so it has no visible edge
    let vg = g.createLinearGradient(0, top, 0, top + hh);
    vg.addColorStop(0, "#B8141F");
    vg.addColorStop(0.18, "rgba(184,20,31,0)");
    vg.addColorStop(0.62, "rgba(184,20,31,0)");
    vg.addColorStop(1, "#B8141F");
    g.fillStyle = vg; g.fillRect(0, top, LU_W, hh);
  } else {
    // No photo: the corner washes the rest of the brand uses, so the card is
    // never a flat black rectangle.
    let rg = g.createRadialGradient(LU_W, LU_H * 0.16, 0, LU_W, LU_H * 0.16, LU_W);
    rg.addColorStop(0, "rgba(242,184,188,.22)"); rg.addColorStop(1, "rgba(242,184,188,0)");
    g.fillStyle = rg; g.fillRect(0, 0, LU_W, LU_H);
    rg = g.createRadialGradient(0, LU_H * 0.9, 0, 0, LU_H * 0.9, LU_W);
    rg.addColorStop(0, "rgba(247,241,230,.12)"); rg.addColorStop(1, "rgba(247,241,230,0)");
    g.fillStyle = rg; g.fillRect(0, 0, LU_W, LU_H);
  }

  // scanlines over everything
  g.fillStyle = "rgba(247,241,230,.055)";
  for (let y = 0; y < LU_H; y += 10) g.fillRect(0, y, LU_W, 2);
  g.fillStyle = "#F7F1E6"; g.fillRect(0, 0, LU_W, 10);

  const L = 80, R = LU_W - 80, W = R - L;

  // ── header ──
  g.fillStyle = "#F7F1E6"; g.fillRect(L, 146, 16, 16);
  stMono(g, "56 NATIONAL SERIES · VOL.9", L + 40, 161, 26, "#F7F1E6", 6);

  const big = kind === "champs" ? ["NIGHT", "CHAMPIONS"]
            : kind === "final"  ? ["THE", "FINAL"]
            : ["SEMI", "FINAL"];
  stDisp(g, big[0], L, 350, 164, "#FFFFFF", W);
  stDisp(g, big[1], L, 500, 164, "#F7F1E6", W);

  // ── the two plates, sitting on the floor of the card ──
  // The names were set at 56px on a 150px plate and filled it wall to wall, so
  // two doubles pairs read as a block of type rather than as a line-up. 44 on a
  // 116px plate leaves air around them and gives the photograph the room back.
  const PH = 116;
  const plate = (y, name, chip, colour, score, dim, edge) => {
    g.fillStyle = "rgba(15,15,15,.92)";
    g.fillRect(L, y, W, PH);
    g.strokeStyle = edge || colour; g.lineWidth = edge ? 5 : 3;
    g.strokeRect(L + 1.5, y + 1.5, W - 3, PH - 3);
    const tail = score ? 110 : (chip ? 130 : 0);
    const room = W - 64 - tail;
    const size = stFit(g, name, room, 44, 900);
    g.font = `italic 900 ${size}px Archivo, sans-serif`;
    g.fillStyle = dim ? "#F2D0D3" : "#FFFFFF";
    g.fillText(name, L + 32, y + PH / 2 + size * 0.34);
    if (score) {
      // The score sits where the group chip would: one slot, never both, so a
      // result card and a line-up card have the same silhouette.
      g.font = `italic 900 52px Archivo, sans-serif`;
      g.fillStyle = dim ? "#F2D0D3" : colour;
      g.fillText(score, R - 32 - g.measureText(score).width, y + PH / 2 + 18);
    } else if (chip) {
      g.font = '700 22px "JetBrains Mono", monospace';
      g.fillStyle = colour;
      g.fillText(chip, R - 32 - g.measureText(chip).width, y + PH / 2 + 8);
    }
  };

  const baseY = 1230;
  if (kind === "champs") {
    plate(baseY, (d.a || "").toUpperCase(), "", "#F7F1E6", d.aScore,
          false, "#0CA856");
    g.font = '700 22px "JetBrains Mono", monospace'; g.fillStyle = "#F2D0D3";
    {
      const t = "BEAT";
      g.fillText(t, (LU_W - g.measureText(t).width) / 2, baseY + PH + 44);
    }
    plate(baseY + PH + 72, (d.b || "").toUpperCase(), "", "#F2D0D3", d.bScore, true);
  } else {
    plate(baseY, (d.a || "TBD").toUpperCase(), d.aChip || "", "#F7F1E6");
    g.font = '900 26px Archivo, sans-serif'; g.fillStyle = "#F2B8BC";
    {
      const t = "V S";
      g.fillText(t, (LU_W - g.measureText(t).width) / 2, baseY + PH + 44);
    }
    plate(baseY + PH + 72, (d.b || "TBD").toUpperCase(), d.bChip || "", "#F2B8BC");
  }

  // ── footer ──
  // The pool used to sit here. It is the season's number, not this match's, and
  // on a card about two teams about to play it read as the prize for winning
  // the night, which it is not.
  if (logo) {
    const lh = 186, lw = lh * (logo.width / logo.height);
    // Tinted to the volume's lime rather than drawn as-is: the file is white
    // with an orange ball, and orange is the one colour on this card that
    // belongs to neither team.
    const off = document.createElement("canvas");
    off.width = Math.ceil(lw); off.height = lh;
    const o = off.getContext("2d");
    o.drawImage(logo, 0, 0, lw, lh);
    o.globalCompositeOperation = "source-in";
    o.fillStyle = "#F7F1E6";
    o.fillRect(0, 0, lw, lh);
    g.drawImage(off, (LU_W - lw) / 2, LU_H - 350);
  }
  g.font = '700 26px "JetBrains Mono", monospace';
  g.fillStyle = "#F2D0D3";
  {
    const t = d.foot || "";
    let cx = (LU_W - (g.measureText(t).width + (t.length - 1) * 6)) / 2;
    for (const ch of t) { g.fillText(ch, cx, LU_H - 116); cx += g.measureText(ch).width + 6; }
  }
  luTrim(g);
}

// Returns a data URL. The photo may taint the canvas, which only shows up at
// toDataURL, so the fallback is a clean repaint without it rather than an error.
async function drawLineup(kind, d, photo, adj) {
  // Both loads are same-origin or CORS-enabled and either may fail; the card is
  // designed to survive losing either one.
  const [im, logo, band] = await Promise.all([luImg(photo), luImg("assets/up-logo-national.png"), luImg(LU_BAND)]);
  LU_BAND_IMG = LU_BAND_IMG || band;
  await ncPreload(d);
  const mk = (img) => {
    const c = document.createElement("canvas");
    c.width = LU_W; c.height = LU_H;
    ncPaint(c.getContext("2d"), kind, d, img, logo, adj, "photo");
    return c;
  };
  try {
    return mk(im).toDataURL("image/png");
  } catch (e) {
    return mk(null).toDataURL("image/png");
  }
}

// Every line-up this session can show: each semi with both teams known, then
// the final. Built from the bracket, so it cannot disagree with the draw.
// What a team is called ON A POST. First names by default, because two full
// names on one plate shrink until neither is readable in a story — but the
// organiser can override it per session, which is the only way to fix the
// things a derived name cannot know: that two players share a first name, that
// someone goes by something else, or that a name was typed wrong at signup.
//
// The override lives on the session, never on the player: renaming a card must
// not touch the leaderboard, the receipts or anyone's history.
function teamCardLabel(session, state, teamId) {
  const t = (session.teams || []).find(x => x.id === teamId);
  if (!t) return "";
  const over = (session.cardNames || {})[teamId];
  if (over && over.trim()) return over.trim();
  const f = pid => (((state.players || []).find(p => p.id === pid) || {}).name || "?")
                     .split(" ")[0];
  return `${f(t.p1Id)} & ${f(t.p2Id)}`;
}

// The derived name on its own, for showing as the placeholder and for telling
// whether an override is actually doing anything.
function teamDefaultLabel(session, state, teamId) {
  const t = (session.teams || []).find(x => x.id === teamId);
  if (!t) return "";
  const f = pid => (((state.players || []).find(p => p.id === pid) || {}).name || "?")
                     .split(" ")[0];
  return `${f(t.p1Id)} & ${f(t.p2Id)}`;
}

function buildLineups(session, state, pool) {
  const teams = session.teams || [];
  const nm = id => teamCardLabel(session, state, id);
  const grp = id => {
    const t = teams.find(x => x.id === id);
    return t && t.group ? "GRP " + t.group : "";
  };
  // The session's own name is what everyone calls it; fall back to its position
  // only when the name carries no number.
  const named = (session.name || "").match(/\d+/);
  const no = named ? Number(named[0])
                   : (state.sessions || []).findIndex(s => s.id === session.id) + 1;
  const foot = `NIGHT ${String(no).padStart(2, "0")}`;
  const out = [];
  const b = session.bracket || {};
  (b.sf || []).forEach((m, i) => {
    if (!m || !m.team1Id || !m.team2Id) return;
    out.push({
      key: "sf" + i, kind: "semi", label: `SEMI ${i + 1}`,
      a: nm(m.team1Id), b: nm(m.team2Id), aId: m.team1Id, bId: m.team2Id,
      aChip: grp(m.team1Id), bChip: grp(m.team2Id),
      foot, pool,
      caption: `Semi-final ${i + 1} tonight — ${nm(m.team1Id)} vs ${nm(m.team2Id)}. `
             + `Night ${no} of the 56 National Series. national.urbanpadel.om`,
    });
  });
  const f = b.final;
  if (f && f.team1Id && f.team2Id) {
    out.push({
      key: "final", kind: "final", label: "FINAL",
      a: nm(f.team1Id), b: nm(f.team2Id), aId: f.team1Id, bId: f.team2Id,
      aChip: grp(f.team1Id), bChip: grp(f.team2Id),
      foot, pool,
      caption: `The final — ${nm(f.team1Id)} vs ${nm(f.team2Id)}. `
             + `Night ${no} of the 56 National Series. national.urbanpadel.om`,
    });
    // The result card, once there is a result. Winner first and the loser
    // greyed: a champions card that gives both teams the same weight is a
    // fixture list with a trophy on it.
    if (f.winner) {
      const winId = f.winner === "team1" ? f.team1Id : f.team2Id;
      const lostId = f.winner === "team1" ? f.team2Id : f.team1Id;
      const hi = f.score ? Math.max(f.score.t1, f.score.t2) : "";
      const lo = f.score ? Math.min(f.score.t1, f.score.t2) : "";
      out.push({
        key: "champs", kind: "champs", label: "CHAMPS",
        a: nm(winId), b: nm(lostId), aId: winId, bId: lostId,
        aScore: String(hi), bScore: String(lo),
        foot, pool,
        caption: `${nm(winId)} take night ${no}${f.score ? ` — ${hi}-${lo}` : ""}. `
               + `14 OMR voucher each. national.urbanpadel.om`,
      });
    }
  }
  return out;
}

// Editing what the two plates say. Scoped to the session and keyed by team, so
// a fix made on the semi card is already right on the final and the champions
// card — the alternative, editing per card, means typing the same correction
// three times on the one night it matters.
function LineupNames({ item, session, state, updateSession }) {
  const [open, setOpen] = React.useState(false);
  const rows = [["aId", "TOP"], ["bId", "BOTTOM"]].filter(([k]) => item[k]);
  const over = session && session.cardNames ? session.cardNames : {};
  const dirty = rows.some(([k]) => (over[item[k]] || "").trim());

  const set = (teamId, value) => updateSession(s => {
    const next = { ...(s.cardNames || {}) };
    // An empty box means "go back to the derived name", so the key is removed
    // rather than stored as "" — a stored empty string would render a blank
    // plate on every card for the rest of the night.
    if (value.trim()) next[teamId] = value; else delete next[teamId];
    return { ...s, cardNames: next };
  });

  if (!open) {
    return (
      <button onClick={() => setOpen(true)} style={{ width: "100%", marginTop: 8, padding: 11,
        background: "transparent", color: dirty ? "#F7F1E6" : "#F2D0D3", cursor: "pointer",
        border: "1px solid " + (dirty ? "rgba(247,241,230,.45)" : "rgba(242,208,211,.4)"),
        fontFamily: "'JetBrains Mono',monospace", fontWeight: 700, fontSize: 10,
        letterSpacing: ".14em" }}>
        {dirty ? "NAMES \u00B7 EDITED" : "EDIT THE NAMES"}
      </button>
    );
  }
  return (
    <div style={{ marginTop: 8, padding: 12, border: "1px solid rgba(247,241,230,.3)",
                  background: "rgba(158,21,32,.94)" }}>
      {rows.map(([k, label]) => {
        const teamId = item[k];
        const def = teamDefaultLabel(session, state || { players: [] }, teamId);
        return (
          <div key={k} style={{ marginBottom: 10 }}>
            <div style={{ fontFamily: "'JetBrains Mono',monospace", fontWeight: 700, fontSize: 9,
              letterSpacing: ".2em", color: "#F2D0D3", marginBottom: 5 }}>{label}</div>
            <input value={over[teamId] || ""} placeholder={def}
              onChange={e => set(teamId, e.target.value)}
              style={{ width: "100%", padding: "10px 12px", background: "#B8141F",
                color: "#FFFFFF", border: "1px solid rgba(242,208,211,.5)", borderRadius: 28,
                fontFamily: "'Archivo',sans-serif", fontWeight: 800, fontSize: 15 }} />
          </div>
        );
      })}
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
        <button onClick={() => rows.forEach(([k]) => set(item[k], ""))}
          style={{ padding: 10, background: "transparent", color: "#F2D0D3", cursor: "pointer",
            border: "1px solid rgba(242,208,211,.4)", fontFamily: "'JetBrains Mono',monospace",
            fontWeight: 700, fontSize: 10, letterSpacing: ".14em" }}>RESET</button>
        <button onClick={() => setOpen(false)}
          style={{ padding: 10, background: "#F7F1E6", color: "#B8141F", cursor: "pointer",
            border: "none", fontFamily: "'JetBrains Mono',monospace",
            fontWeight: 700, fontSize: 10, letterSpacing: ".14em" }}>DONE</button>
      </div>
      <div style={{ fontSize: 11, color: "#F2D0D3", marginTop: 9 }}>
        Only changes the posts. Nothing here touches points or the table.
      </div>
    </div>
  );
}

function LineupSheet({ open, items, photos, onClose, session, updateSession, canUpload, state }) {
  const [i, setI] = React.useState(0);
  const [ph, setPh] = React.useState(-1);          // -1 = no photo
  const [url, setUrl] = React.useState("");
  const [flash, setFlash] = React.useState("");
  const [busy, setBusy] = React.useState(false);
  const [adj, setAdj] = React.useState({ ...LU_ADJ0 });
  const [dragging, setDragging] = React.useState(false);
  // Cut-out mode. `cutFail` is separate from `cut` on purpose: a photo whose
  // background will not come off has to turn the toggle OFF and say so, not sit
  // there switched on showing the ordinary card and looking broken.
  const [cut, setCut] = React.useState(false);
  const [cutFail, setCutFail] = React.useState(false);
  const drag = React.useRef(null);
  React.useEffect(() => { if (open) { setI(0); setPh(-1); } }, [open]);
  // A new photo starts square. Carrying one photo's crop onto the next is how
  // you end up posting a card framed for a picture it is no longer showing.
  React.useEffect(() => { setAdj({ ...LU_ADJ0 }); }, [ph, i]);
  const item = items[i];
  React.useEffect(() => {
    if (!open || !item) return;
    let alive = true;
    // Only blank the preview when there is nothing to show yet. Blanking on
    // every adjustment makes the card flash black under the finger.
    setUrl(u => u || "");
    // Half size while a finger is down: a full 1080x1920 repaint per frame is
    // too slow on a phone, and luPaint is written in card coordinates so a
    // scaled context needs no other change.
    const scale = dragging ? 0.5 : 1;
    const photo = ph >= 0 ? photos[ph] : null;
    // The display face has to be in before the canvas measures anything, or the
    // card is laid out against a fallback and the names overrun their plates.
    document.fonts.ready
      .then(async () => {
        if (cut && photo) {
          const u = await drawCutCardAt(item.kind, { ...item, seed: item.key + (session ? session.id : "") },
                                        photo, adj, scale);
          if (u) { if (alive) setCutFail(false); return u; }
          // The background would not come off — say so and drop back rather
          // than leaving the toggle lit over an ordinary card.
          if (alive) { setCutFail(true); setCut(false); }
        }
        return drawLineupAt(item.kind, item, photo, adj, scale);
      })
      .then(u => { if (alive) setUrl(u); });
    return () => { alive = false; };
  }, [open, i, ph, items, photos, adj, dragging, cut, session]);
  if (!open || !item) return null;
  const hasPhoto = ph >= 0 && !!photos[ph];

  // Drag the preview to move the photo. The preview is 270 wide for a 1080
  // card, so one preview pixel is four card pixels — pan in card coordinates
  // and the clamp in luCoverAdj does the rest.
  const P2C = LU_W / 270;
  const onDown = e => {
    if (!hasPhoto) return;
    drag.current = { px: e.clientX, py: e.clientY, x: adj.x, y: adj.y };
    setDragging(true);
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
  };
  const onMove = e => {
    if (!drag.current) return;
    e.preventDefault();
    const d = drag.current;
    setAdj(a => ({ ...a,
      x: d.x + (e.clientX - d.px) * P2C,
      y: d.y + (e.clientY - d.py) * P2C }));
  };
  const onUp = () => { if (drag.current) { drag.current = null; setDragging(false); } };

  const save = async () => {
    // Redraw at full size before sharing. `url` may still be the half-scale
    // JPEG the drag used, and shipping that would quietly post a 540x960
    // card — the one bug this whole preview-is-the-file idea exists to avoid.
    const photo = ph >= 0 ? photos[ph] : null;
    const full = (cut && photo
