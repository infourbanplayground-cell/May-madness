          <div><span className="font-bold" style={{color:"#FFFFFF"}}>Series points:</span> each team's best 3 group results count, so a 5-team group drops its lowest game and cannot out-earn a group of 4. A group too small to play 3 gets notional 6&ndash;0 byes instead, marked <span style={{color:"#F2B8BC"}}>+BYE</span> above — they count here, in your series points and in the knockout seeding alike, so the draw costs nobody. Knockout and playoff matches never count as group games.</div>
        </div>
      </Card>}

      {(edit || add) && <MatchEditorModal session={session} state={state} group={edit?.group || add} match={edit} onClose={() => { setEdit(null); setAdd(null); }} onSave={(d) => { if (edit) updateSession(s => ({ ...s, groupMatches: s.groupMatches.map(m => m.id === edit.id ? { ...m, ...d } : m) })); else updateSession(s => ({ ...s, groupMatches: [...(s.groupMatches || []), { id: uid("m"), ...d }] })); }} onDelete={edit ? () => updateSession(s => ({ ...s, groupMatches: s.groupMatches.filter(m => m.id !== edit.id) })) : null} />}
    </div>
  );
}

function MatchEditorModal({ session, state, group, match, onClose, onSave, onDelete }) {
  const teams = (session.teams || []).filter(t => t.group === group);
  const [t1, setT1] = useState(match?.team1Id || "");
  const [t2, setT2] = useState(match?.team2Id || "");
  const initS1 = match?.score?.t1 ?? (match?.winner ? (match.winner === "team1" ? 6 : 3) : null);
  const initS2 = match?.score?.t2 ?? (match?.winner ? (match.winner === "team2" ? 6 : 3) : null);
  const [s1, setS1] = useState(initS1);
  const [s2, setS2] = useState(initS2);
  // Declared, because the lock button both reads it and sets it. Without this
  // the screen rendered perfectly until the moment a score was complete: the
  // button's `disabled={!!why || saving}` short-circuits while `why` is truthy
  // ("PICK BOTH SCORES"), so `saving` was never evaluated — and the instant
  // both scores were picked, `why` went null, JS finally read `saving`, threw
  // ReferenceError, and React tore the whole tree down. It only ever broke on a
  // valid score, which is the one case nobody tests.
  const [saving, setSaving] = useState(false);

  const first = id => (state.players.find(p => p.id === id)?.name || "?").split(" ")[0];
  const lbl = t => t ? `${first(t.p1Id)} & ${first(t.p2Id)}` : "?";
  const inits = t => t ? (first(t.p1Id)[0] || "?") + (first(t.p2Id)[0] || "?") : "??";

  const playedPairs = new Set(
    (session.groupMatches || [])
      .filter(m => m.winner && (!match || m.id !== match.id))
      .map(m => [m.team1Id, m.team2Id].sort().join("|"))
  );
  const hasPlayed = (id1, id2) => id1 && id2 && playedPairs.has([id1, id2].sort().join("|"));

  const derived = (s1 !== null && s2 !== null && s1 !== s2) ? scoreToResult(s1, s2) : null;
  const matchNo = (session.groupMatches || []).filter(m => {
    const t = (session.teams || []).find(x => x.id === m.team1Id);
    return t && t.group === group;
  }).findIndex(m => match && m.id === match.id) + 1;

  const why = s1 === null || s2 === null ? "PICK BOTH SCORES"
            : s1 === s2 ? "SCORES CAN'T BE LEVEL"
            : !t1 || !t2 ? "PICK BOTH TEAMS" : null;

  const Panel = ({ tid, val, setVal, side }) => {
    const t = teams.find(x => x.id === tid);
    const won = derived?.winner === side;
    const lost = derived && !won;
    return (
      <div style={{ padding: 12, marginBottom: 10,
        background: won ? "rgba(247,241,230,.08)" : "rgba(158,21,32,.94)",
        border: "1px solid " + (won ? "rgba(247,241,230,.5)" : "rgba(255,255,255,.07)") }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <div style={{ width: 38, height: 38, flexShrink: 0, display: "flex", alignItems: "center",
            justifyContent: "center", background: won ? "#F7F1E6" : "#1A0A0C",
            color: won ? "#B8141F" : "#F2D0D3", fontFamily: "'JetBrains Mono',monospace",
            fontWeight: 700, fontSize: 14 }}>{inits(t)}</div>
          <div style={{ flex: 1, minWidth: 0, fontWeight: 800, fontSize: 15,
            color: lost ? "#F2D0D3" : "#FFFFFF", whiteSpace: "nowrap", overflow: "hidden",
            textOverflow: "ellipsis" }}>{lbl(t)}</div>
          <div style={{ fontFamily: "'JetBrains Mono',monospace", fontWeight: 700, fontSize: 30,
            lineHeight: 1, color: won ? "#F7F1E6" : lost ? "#F2D0D3" : "#FFFFFF" }}>
            {val ?? "—"}
          </div>
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: 6, marginTop: 10 }}>
          {[0,1,2,3,4,5,6,7].map(n => (
            <button key={n} type="button" onClick={() => setVal(n)}
              style={{ height: 64, cursor: "pointer", border: "1px solid",
                fontFamily: "'JetBrains Mono',monospace", fontWeight: 700, fontSize: 26,
                transition: "transform 170ms cubic-bezier(.2,.7,.3,1)",
                ...(val === n
                  ? { background: "#F7F1E6", color: "#B8141F", borderColor: "#F7F1E6" }
                  : { background: "#9E1520", color: "#F7F1E6", borderColor: "rgba(242,208,211,.3)" }) }}>
              {n}
            </button>
          ))}
        </div>
      </div>
    );
  };

  return <Modal open={true} onClose={onClose} title={match ? "EDIT MATCH" : `GROUP ${group} MATCH`}>
    <div>
      <div style={{ fontFamily: "'JetBrains Mono',monospace", fontWeight: 700, fontSize: 10,
        letterSpacing: ".26em", color: "#F2D0D3", marginBottom: 12 }}>
        GROUP {group}{matchNo > 0 ? " · MATCH " + matchNo : ""}
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 12 }}>
        {[[t1, setT1, t2], [t2, setT2, t1]].map(([val, set, other], i) => (
          <select key={i} value={val} onChange={e => set(e.target.value)}
            style={{ width: "100%", padding: "11px 10px", background: "#9E1520", color: "#FFFFFF",
              border: "1px solid rgba(242,208,211,.3)", fontSize: 13, outline: "none" }}>
            <option value="">Team {i + 1}</option>
            {teams.filter(t => t.id !== other && !hasPlayed(t.id, other)).map(t =>
              <option key={t.id} value={t.id}>{lbl(t)}</option>)}
          </select>
        ))}
      </div>

      {t1 && t2 && <>
        <Panel tid={t1} val={s1} setVal={setS1} side="team1" />
        <Panel tid={t2} val={s2} setVal={setS2} side="team2" />

        <LossReadout derived={derived} />
        <PointsPreview derived={derived} />
      </>}

      <div style={{ display: "flex", gap: 8, marginTop: 16 }}>
        {onDelete && <Btn variant="danger" onClick={() => { onDelete(); onClose(); }}><I.trash size={14} /></Btn>}
        <Btn variant="ghost" onClick={onClose}>Cancel</Btn>
        <button type="button" disabled={!!why || saving}
          onClick={() => {
            if (why) return;
            setSaving(true);
            celebrate(lbl(teams.find(t => t.id === (derived.winner === "team1" ? t1 : t2))) + " TAKE IT");
            onSave({ team1Id: t1, team2Id: t2, ...derived, resultAt: Date.now() });
            onClose();
          }}
          style={{ flex: 1, padding: "22px 16px", cursor: why ? "default" : "pointer",
            fontFamily: "'JetBrains Mono',monospace", fontWeight: 700, fontSize: 12,
            letterSpacing: ".2em", border: "none",
            ...(why
              ? { background: "#1A0A0C", color: "#F2D0D3" }
              : { background: "#F7F1E6", color: "#B8141F",
                  boxShadow: "0 0 30px rgba(247,241,230,.32)" }) }}>
          {why || "LOCK RESULT ▶"}
        </button>
      </div>
    </div>
  </Modal>;
}

function BracketTab({ session, state, updateSession, isAdmin, canScore, canUploadPhotos }) {
  const [edit, setEdit] = useState(null);
  const [seedEdit, setSeedEdit] = useState(false);
  const b = session.bracket || { qf: [], sf: [], final: null };
  const teams = session.teams || [];
  const thirdPlaceMode = session.thirdPlaceMode || "best2";

  // Everything the seeding is derived from: which team is in which group, and
  // every group-stage result. Seeding that was computed from a different
  // signature is stale — a late result or a corrected score changes who
  // finished where, and therefore who should be playing whom.
  const seedInputSig = JSON.stringify({
    t: (session.teams || []).map(t => [t.id, t.group]).sort(),
    m: (session.groupMatches || []).map(m => [m.team1Id, m.team2Id, m.winner || "", m.lossType || "", m.score?.t1 ?? "", m.score?.t2 ?? ""]).sort(),
  });

  // Every seeding write goes through here so the bracket always records the
  // group results it was built from, and clears any manual override.
  const applyBracket = (bracket) =>
    updateSession(s => ({ ...s, bracket, seedSig: seedInputSig, seedManual: false }));

  // Turns the tier list from seedStandardBracket into stored QF matches.
  const qfFromTiers = (tiers) => {
    const pairing = seedStandardBracket(tiers);
    if (!pairing) return null;
    return pairing.map(p => ({
      id: uid("qf"), slot: p.slot,
      team1Id: p.a.id, team2Id: p.b.id,
      s1: p.a.seed, s2: p.b.seed, winner: null,
    }));
  };

  const seedQF = (silent = false) => {
    const groups = getSessionGroups(session);
    const qCount = getQualifyCount(session);
    // Seed off normalised standings so every team is ranked on the same number
    // of matches (smallest group − 1). Equal-size groups are unaffected.
    const standings = groups.map(g => calcGroupStandingsNormalized(session, g));
    const N = groups.length;

    if (N === 4 && thirdPlaceMode === "all4r16") {
      const winners   = standings.map((s, gi) => s[0]?.team?.id ? { id: s[0].team.id, pts: s[0].pts, wins: s[0].wins, gd: s[0].gd||0, gf: s[0].gf||0, seed: groups[gi]+"1" } : null).filter(Boolean);
      const runnersUp = standings.map((s, gi) => s[1]?.team?.id ? { id: s[1].team.id, pts: s[1].pts, wins: s[1].wins, gd: s[1].gd||0, gf: s[1].gf||0, seed: groups[gi]+"2" } : null).filter(Boolean);
      const rawThirds = standings.map((s, gi) => s[2]?.team?.id ? { id: s[2].team.id, pts: s[2].pts, wins: s[2].wins, gd: s[2].gd||0, gf: s[2].gf||0, seed: groups[gi]+"3" } : null).filter(Boolean);
      if (winners.length < 4) { if (!silent) alert("Need results for all 4 group winners first"); return; }
      if (runnersUp.length < 4) { if (!silent) alert("Need results for all 4 runners-up first"); return; }
      if (rawThirds.length < 4) { if (!silent) alert("Need results for all 4 third-place teams first"); return; }

      // Equalize for cross-group seeding: ghost BYE wins for smaller groups — does NOT change group points
      const eqWinners   = [...equalizeThirds(winners,   session)].sort(compareThirds);
      const eqRunners   = [...equalizeThirds(runnersUp, session)].sort(compareThirds);
      const eqThirds    = [...equalizeThirds(rawThirds, session)].sort(compareThirds);

      // R16: seeds 5-12 (runners-up then thirds)
      // Match 1: seed5 vs seed12, Match 2: seed6 vs seed11, Match 3: seed7 vs seed10, Match 4: seed8 vs seed9
      const r16p = [...eqRunners, ...eqThirds]; // 8 teams, indices 0–7
      const r16 = [1,2,3,4].map((slot, i) => ({
        id: uid("r16"), slot,
        team1Id: r16p[i].id,     s1: r16p[i].seed,
        team2Id: r16p[7-i].id,   s2: r16p[7-i].seed,
        winner: null
      }));

      // QF: seed1 gets bye and faces R16M4 winner (weakest), seed4 faces R16M1 winner (strongest)
      const qf = eqWinners.map((w, i) => ({
        id: uid("qf"), slot: i+1,
        team1Id: w.id,              s1: w.seed,
        team2Id: `R16_TBD_${4-i}`, s2: `R16W${4-i}`,
        winner: null, r16Slot: 4-i,
      }));

      applyBracket({ r16, qf, sf: [], final: null } );
      return;
    }

    if (N === 3) {
      // Tier 1 = winners, Tier 2 = runners-up, Tier 3 = thirds
      const tier1 = standings.map((s, gi) => s[0]?.team?.id ? { id: s[0].team.id, pts: s[0].pts, wins: s[0].wins, gd: s[0].gd || 0, gf: s[0].gf || 0, tier: 1, seed: groups[gi] + "1" } : null).filter(Boolean);
      const tier2 = standings.map((s, gi) => s[1]?.team?.id ? { id: s[1].team.id, pts: s[1].pts, wins: s[1].wins, gd: s[1].gd || 0, gf: s[1].gf || 0, tier: 2, seed: groups[gi] + "2" } : null).filter(Boolean);
      const rawThirds = standings.map((s, gi) => s[2]?.team?.id ? { id: s[2].team.id, pts: s[2].pts, wins: s[2].wins, gd: s[2].gd || 0, gf: s[2].gf || 0, tier: 3, seed: groups[gi] + "3" } : null).filter(Boolean);
      // Thirds already come from the normalised (dropped-game) standings, so every
      // team has the same match count — compare them directly, no ghost-bye padding.
      // Padel ranking for 3rds: wins ▶ game difference ▶ games scored
      const sortedThirds = [...rawThirds].sort(compareThirds);
      // Check for complete tie between 2nd and 3rd thirds (tiebreak match required)
      if (sortedThirds.length >= 3 && thirdPlaceMode === "best2" && compareThirds(sortedThirds[1], sortedThirds[2]) === 0) {
        if (!silent) alert(`Tie between ${lbl(sortedThirds[1].id)} and ${lbl(sortedThirds[2].id)} for the last 3rd-place spot!\n\nPlay a tiebreak match to determine who qualifies.`);
        return;
      }
      const t1sorted = tier1.sort(compareThirds);
      const t2sorted = tier2.sort(compareThirds);

      if (thirdPlaceMode === "playoff" && sortedThirds.length >= 3) {
        // T3A (best third) ▶ direct QF spot; T3B vs T3C play a qualifier
        const t3a = sortedThirds[0];
        const t3b = sortedThirds[1];
        const t3c = sortedThirds[2];
        // Tier 3 is [best third, playoff winner]: the known best third takes
        // seed 7, the still-undecided qualifier seed 8.
        const qf = qfFromTiers([t1sorted, t2sorted, [t3a, { id: "PLAYOFF_TBD", seed: "Q" }]]);
        if (!qf) { if (!silent) alert("Need 8 qualifiers to seed the quarterfinals"); return; }
        const thirdsPlayoff = { id: uid("tpo"), team1Id: t3b.id, team2Id: t3c.id, s1: t3b.seed, s2: t3c.seed, winner: null };
        applyBracket({ qf, sf: [], final: null, thirdsPlayoff } );
        return;
      }

      // best2 mode: top 2 thirds directly into bracket
      const best2 = sortedThirds.slice(0, 2);
      const qf = qfFromTiers([t1sorted, t2sorted, best2]);
      if (!qf) { if (!silent) alert("Not enough results — need at least 2 teams per group and some 3rd-place results"); return; }
      applyBracket({ qf, sf: [], final: null } );
      return;
    }

    if (qCount === 2 && (N === 2 || N === 4)) {
      const mkTier = (rank) => standings.map((s, i) => s[rank]?.team?.id
        ? { id: s[rank].team.id, seed: groups[i] + (rank + 1), group: groups[i], pts: s[rank].pts, wins: s[rank].wins, gd: s[rank].gd || 0, gf: s[rank].gf || 0 }
        : null);
      const winners = mkTier(0);
      const runners = mkTier(1);
      if (winners.some(w => !w) || runners.some(r => !r)) { if (!silent) alert("Need top 2 in every group first"); return; }
      if (N === 2) {
        const pairs = winners.map((w, i) => ({ a: w, b: runners[N - 1 - i] }));
        const sf = pairs.map((p, i) => ({ id: uid("sf"), slot: i + 1, team1Id: p.a.id, team2Id: p.b.id, s1: p.a.seed, s2: p.b.seed, winner: null }));
        applyBracket({ qf: [], sf, final: null } );
      } else {
        // N === 4: the groups CROSS BY LETTER -- A1 v D2, B1 v C2, C1 v B2,
        // D1 v A2 -- which is the draw the club plays and the one players can
        // read off the group tables before the last match finishes.
        //
        // It replaces a merit seeding (winners ranked 1-4, runners-up 5-8,
        // then 1v8 / 4v5 / 3v6 / 2v7). That one could draw two teams out of
        // the same group, which is the only reason seedStandardBracket carries
        // a clash-swap; by letter, every quarter-final is two different groups
        // and no swap can ever be needed.
        //
        // Slots 1-2 feed SF1 and slots 3-4 feed SF2, so A1 and B1 are on one
        // half of the draw and C1 and D1 on the other.
        const CROSS = [[0, 3], [1, 2], [2, 1], [3, 0]];   // winner index -> runner-up index
        const qf = CROSS.map(([w, r], i) => ({
          id: uid("qf"), slot: i + 1,
          team1Id: winners[w].id, s1: winners[w].seed,
          team2Id: runners[r].id, s2: runners[r].seed,
          winner: null,
        }));
        applyBracket({ qf, sf: [], final: null } );
      }
      return;
    }

    if (N === 2 && qCount === 4) {
      const a = standings[0], b = standings[1];
      if (!a[3]?.team?.id || !b[3]?.team?.id) { if (!silent) alert("Need top 4 in every group first"); return; }
      const at = (s, i, g) => ({ id: s[i].team.id, seed: g + (i + 1), group: g, wins: s[i].wins, gd: s[i].gd || 0, gf: s[i].gf || 0 });
      // Seeds alternate by group in placement order -- A1, B1, A2, B2, A3, B3,
      // A4, B4 -- which the standard 1v8 / 4v5 / 3v6 / 2v7 template turns into
      // exactly A1vB4, B2vA3, A2vB3, B1vA4. Every quarter-final is therefore
      // A against B, so no pair that already met in the group stage can be
      // drawn together and the clash-swap never has to fire.
      //
      // The old behaviour sorted each tier of two on its own (wins, GD, GF),
      // so the stronger group winner took seed 1 -- but with the tiers sorted
      // independently the ladder could come apart: a group that owned both the
      // better 2nd and the better 3rd put them on the same side of the draw and
      // produced a same-group quarter-final, which is what happened last time.
      const tiers = [0, 1, 2, 3].map(i => [at(a, i, groups[0]), at(b, i, groups[1])]);
      const qf = qfFromTiers(tiers);
      if (!qf) { if (!silent) alert("Need 8 qualifiers to seed the quarterfinals"); return; }
      applyBracket({ qf, sf: [], final: null } );
      return;
    }

    const qualifiers = [];
    standings.forEach((s, gi) => {
      for (let i = 0; i < qCount; i++) {
        if (s[i]?.team?.id) qualifiers.push({ teamId: s[i].team.id, pts: s[i].pts, wins: s[i].wins, gd: s[i].gd || 0, gf: s[i].gf || 0, groupRank: i, seed: groups[gi] + (i + 1) });
      }
    });
    if (qualifiers.length === 0) { if (!silent) alert("No qualified teams yet"); return; }
    const seeded = [...qualifiers].sort((a, b) => a.groupRank - b.groupRank || b.wins - a.wins || b.gd - a.gd || b.gf - a.gf);
    const total = seeded.length;
    if (total < 2) { if (!silent) alert("Only one team qualified — need at least 2 to make a bracket."); return; }
    if (total === 2) {
      applyBracket({ qf: [], sf: [], final: { id: uid("f"), team1Id: seeded[0].teamId, team2Id: seeded[1].teamId, s1: seeded[0].seed, s2: seeded[1].seed, winner: null } } );
    } else if (total <= 4) {
      const sf = [];
      for (let i = 0; i < Math.floor(total / 2); i++) sf.push({ id: uid("sf"), slot: i + 1, team1Id: seeded[i].teamId, team2Id: seeded[total - 1 - i].teamId, s1: seeded[i].seed, s2: seeded[total - 1 - i].seed, winner: null });
      applyBracket({ qf: [], sf, final: null } );
    } else {
      const pick = [[0,7],[3,4],[1,6],[2,5]];
      const qf = pick.map(([x, y], i) => seeded[x] && seeded[y] ? { id: uid("qf"), slot: i + 1, team1Id: seeded[x].teamId, team2Id: seeded[y].teamId, s1: seeded[x].seed, s2: seeded[y].seed, winner: null } : null).filter(Boolean);
      applyBracket({ qf, sf: [], final: null } );
    }
  };

  // Group stage complete = every group has played its full round-robin and
  // every match has a result. (A group of n plays n*(n-1)/2 matches.)
  const groupStageComplete = (() => {
    const groups = getSessionGroups(session);
    const gm = session.groupMatches || [];
    if (gm.length === 0) return false;
    let expected = 0;
    for (const g of groups) {
      const n = teams.filter(t => t.group === g).length;
      expected += (n * (n - 1)) / 2;
    }
    if (expected === 0 || gm.length < expected) return false;
    return gm.every(m => m.winner);
  })();
  const bracketEmpty = !(b.qf?.length) && !(b.sf?.length) && !b.final && !(b.r16?.length) && !b.thirdsPlayoff;

  // The knockout is "locked" as soon as any of it has been played — including
  // the thirds qualifier, whose winner takes the 8th seed. Past that point the
  // seeding is history and must never be recomputed.
  const koLocked = (b.qf || []).some(m => m.winner)
    || (b.sf || []).some(m => m.winner)
    || (b.r16 || []).some(m => m.winner)
    || !!b.final?.winner
    || !!b.thirdsPlayoff?.winner;

  // Keep the seeding in sync with the group results, instead of seeding once
  // and letting it go stale. A score entered or corrected after the bracket
  // was drawn changes who finished 1st/2nd/3rd, and therefore who should be
  // playing whom — that used to require a hand-patch to fix.
  //
  // EVERY FORMAT, not just three groups. This used to be limited to 3-group
  // nights on the argument that the others take a fixed top-N per group and a
  // late result "rarely changes who is in". Both halves were wrong: a
  // correction can drop a team from 2nd to 3rd, and on a top-2 night 3rd does
  // not qualify at all; and since the draw crosses by letter, the order inside
  // a group IS the fixture, so swapping 1st and 2nd changes two
  // quarter-finals. Reported from the 26 Oct night, where a corrected group
  // score left the bracket saying the wrong people were through.
  //
  // Re-seeding is still skipped whenever it could destroy something: once any
  // knockout match has a result (koLocked), or when an admin has deliberately
  // arranged the seeding by hand (seedManual). Silent, so a tie or an
  // incomplete group just waits for the organizer rather than popping alerts.
  useEffect(() => {
    if (!canScore || !groupStageComplete) return;
    if (koLocked || session.seedManual) return;
    if (!bracketEmpty && session.seedSig === seedInputSig) return;  // already current
    seedQF(true);
  }, [canScore, groupStageComplete, bracketEmpty, koLocked, session.seedManual, session.seedSig, seedInputSig]);

  // Whether the bracket on screen was drawn from the group results as they
  // stand NOW. When it was not and nothing can be redrawn — because the
  // knockout has started — the screen has to say so. Silently showing a
  // bracket that disagrees with the tables underneath it is how "it doesn't
  // change who's through" goes unnoticed until somebody is on the wrong court.
  const seedStale = !bracketEmpty && !!session.seedSig && session.seedSig !== seedInputSig;

  const lbl = (id) => {
    if (id === "PLAYOFF_TBD") return "Qualifier TBD";
    if (id?.startsWith?.("R16_TBD_")) return `R16 M${id.slice(8)} Winner`;
    const t = teams.find(t => t.id === id);
    if (!t) return "—";
    return `${state.players.find(p => p.id === t.p1Id)?.name?.split(" ")[0] || "?"} & ${state.players.find(p => p.id === t.p2Id)?.name?.split(" ")[0] || "?"}`;
  };

  useEffect(() => {
    // R16 ▶ QF (all4r16 mode)
    if (b.r16?.length > 0) {
      let updatedQF = [...b.qf];
      let changed = false;
      for (const r16m of b.r16) {
        if (!r16m.winner) continue;
        const winnerId = r16m.winner === "team1" ? r16m.team1Id : r16m.team2Id;
        updatedQF = updatedQF.map(qfm => {
          if (qfm.r16Slot !== r16m.slot || qfm.winner) return qfm;
          if (qfm.team2Id !== winnerId) { changed = true; return { ...qfm, team2Id: winnerId }; }
          return qfm;
        });
      }
      if (changed) updateSession(s => ({ ...s, bracket: { ...s.bracket, qf: updatedQF } }));
    }
    // Thirds playoff winner ▶ fill PLAYOFF_TBD slot in QF
    if (b.thirdsPlayoff?.winner && b.qf.some(m => m.team1Id === "PLAYOFF_TBD" || m.team2Id === "PLAYOFF_TBD")) {
      const winner = b.thirdsPlayoff.winner === "team1" ? b.thirdsPlayoff.team1Id : b.thirdsPlayoff.team2Id;
      updateSession(s => ({ ...s, bracket: { ...s.bracket, qf: s.bracket.qf.map(m => ({
        ...m,
        team1Id: m.team1Id === "PLAYOFF_TBD" ? winner : m.team1Id,
        team2Id: m.team2Id === "PLAYOFF_TBD" ? winner : m.team2Id,
      })) } }));
    }
    // QF ▶ SF
    const qfWinners = b.qf.filter(m => m.winner && m.team1Id !== "PLAYOFF_TBD" && m.team2Id !== "PLAYOFF_TBD").map(m => m.winner === "team1" ? m.team1Id : m.team2Id);
    if (qfWinners.length === 4 && (b.sf?.length || 0) < 2) {
      updateSession(s => ({ ...s, bracket: { ...s.bracket, sf: [
        { id: uid("sf"), slot: 1, team1Id: qfWinners[0], team2Id: qfWinners[1], winner: null },
        { id: uid("sf"), slot: 2, team1Id: qfWinners[2], team2Id: qfWinners[3], winner: null },
      ] } }));
    }
    // SF ▶ Final
    const sfWinners = (b.sf || []).filter(m => m.winner).map(m => m.winner === "team1" ? m.team1Id : m.team2Id);
    if (sfWinners.length === 2 && !b.final) {
      updateSession(s => ({ ...s, bracket: { ...s.bracket, final: { id: uid("f"), team1Id: sfWinners[0], team2Id: sfWinners[1], winner: null } } }));
    }
  }, [JSON.stringify(b)]);

  // ── Qualify-per-group setting (editable here; re-seeds on change) ──
  const numGroups = getSessionGroups(session).length;
  const currentQC = getQualifyCount(session);
  const qcOptions = numGroups === 2 ? [1, 2, 4] : [1, 2];
  const reseedGuard = () => !(koLocked && !confirm("Changing knockout qualification re-seeds the bracket and clears the current knockout results. Continue?"));
  const changeQualify = (q) => {
    if (q === currentQC) return;
    if (!reseedGuard()) return;
    autoSeededRef.current = null;  // let the auto-seed re-fire with the new count
    updateSession(s => ({ ...s, qualifyCount: q, bracket: { qf: [], sf: [], final: null } }));
  };
  const changeThirdMode = (mode) => {
    if (mode === thirdPlaceMode) return;
    if (!reseedGuard()) return;
    autoSeededRef.current = null;
    updateSession(s => ({ ...s, thirdPlaceMode: mode, bracket: { qf: [], sf: [], final: null } }));
  };
  // 3-group format has a FIXED qualification rule: top 2 per group + 2 best
  // thirds = 8 ▶ QF (qualifyCount doesn't apply). Show the rule instead of the
  // misleading "Top N per group" buttons, and let the admin choose how the last
  // third-place spot is decided (best-2 by points, or a 3rds playoff).
  const QualifyControl = () => !canScore ? null : (
    <Card className="p-3">
      {numGroups === 3 ? (
        <div className="space-y-2.5">
          <div>
            <div className="text-[10px] text-stone-500 uppercase tracking-wider font-semibold">Knockout qualification · 3 groups</div>
            <div className="text-[11px] text-stone-400 mt-0.5">Top 2 per group + 2 best thirds ▶ <span className="text-stone-200 font-semibold">8 teams ▶ quarterfinals</span></div>
          </div>
          <div className="flex items-center justify-between gap-3 flex-wrap">
            <div className="text-[10px] text-stone-500 uppercase tracking-wider font-semibold">Last 3rd-place spot</div>
            <div className="flex gap-1.5">
              {[["best2", "Best 2 thirds"], ["playoff", "3rds playoff"]].map(([m, label]) => <button key={m} type="button" onClick={() => changeThirdMode(m)} className="px-3 py-1.5 rounded-lg text-xs font-bold border-2 active:scale-95" style={m === thirdPlaceMode ? { background: "#F7F1E6", color: "#FFFFFF", borderColor: "rgba(247,241,230,.5)" } : { background: "transparent", color: "#F7F1E6", borderColor: "#9E1520" }}>{label}</button>)}
            </div>
          </div>
        </div>
      ) : (
        <div className="flex items-center justify-between gap-3 flex-wrap">
          <div>
            <div className="text-[10px] text-stone-500 uppercase tracking-wider font-semibold">Qualify per group</div>
            <div className="text-[11px] text-stone-600 mt-0.5">{numGroups * currentQC} teams{numGroups * currentQC >= 4 ? " ▶ quarterfinals" : ""} · changing re-seeds</div>
          </div>
          <div className="flex gap-1.5">
            {qcOptions.map(q => <button key={q} type="button" onClick={() => changeQualify(q)} className="px-3.5 py-1.5 rounded-lg text-sm font-bold border-2 active:scale-95" style={q === currentQC ? { background: "#F7F1E6", color: "#FFFFFF", borderColor: "rgba(247,241,230,.5)" } : { background: "transparent", color: "#F7F1E6", borderColor: "#9E1520" }}>Top {q}</button>)}
          </div>
        </div>
      )}
    </Card>
  );

  if (bracketEmpty) {
    return <div className="space-y-3">
      <QualifyControl />
      <KoPhotoStrip session={session} updateSession={updateSession} canUpload={canUploadPhotos} />
      <Card className="p-6 text-center border-dashed">
        <I.swords className="mx-auto mb-3 text-stone-600" size={36} />
        <div className="text-stone-300 font-semibold mb-1">No bracket yet</div>
        {canScore && <>
          <div className="text-stone-500 text-sm mb-4">The knockout seeds automatically once every group match is in — or seed now from current standings.</div>
          <Btn onClick={() => seedQF()}><I.bolt size={14} /> Auto-Seed</Btn>
        </>}
      </Card>
    </div>;
  }

  const champId = b.final?.winner ? (b.final.winner === "team1" ? b.final.team1Id : b.final.team2Id) : null;

  return (
    <div className="space-y-4">
      <QualifyControl />
      <KoPhotoStrip session={session} updateSession={updateSession} canUpload={canUploadPhotos} />
      {(() => {
        // Transparency panel: every qualified team with its OVERALL seed (1..8),
        // its actual group + placement, and why it's ranked there — all computed
        // live from current standings so it stays correct even if a team was
        // moved between groups after the bracket was seeded.
        const standCache = {};
        const rankOf = (id) => {
          const t = (session.teams || []).find(x => x.id === id); if (!t) return null;
          const g = t.group; if (!standCache[g]) standCache[g] = calcGroupStandings(session, g);
          const i = standCache[g].findIndex(r => r.team.id === id);
          return i < 0 ? null : { g, rank: i + 1 };
        };
        // Overall seed from the actual QF pairing (standard 8-seed bracket:
        // slot1 = 1v8, slot2 = 4v5, slot3 = 3v6, slot4 = 2v7).
        const seedByTeam = {};
        const slotSeeds = { 1: [1, 8], 2: [4, 5], 3: [3, 6], 4: [2, 7] };
        const std8 = (b.qf || []).length === 4 && !(b.r16 && b.r16.length);
        if (std8) (b.qf || []).forEach((m, idx) => { const pr = slotSeeds[idx + 1]; if (pr) { if (m.team1Id) seedByTeam[m.team1Id] = pr[0]; if (m.team2Id) seedByTeam[m.team2Id] = pr[1]; } });
        const seen = new Set(); const rows = [];
        const collect = (m) => { if (!m) return; ["team1Id", "team2Id"].forEach(tk => {
          const id = m[tk];
          if (!id || seen.has(id)) return;
          // A slot still waiting on the thirds playoff gets a row of its own.
          // Skipping it silently removed its seed number from the list, so the
          // panel read 1,2,3,4,5,6,8 and the missing seed looked like a bug in
          // the draw rather than a match that has not been played yet.
          if (String(id).includes("TBD")) {
            seen.add(id);
            rows.push({ id, g: null, rank: null, seed: seedByTeam[id] || null, pending: true });
            return;
          }
          const r = rankOf(id);
          if (r) { seen.add(id); rows.push({ id, g: r.g, rank: r.rank, seed: seedByTeam[id] || null }); }
        }); };
        (b.qf || []).forEach(collect); (b.r16 || []).forEach(collect); collect(b.thirdsPlayoff);
        if (!rows.length) return null;
        const ord = (n) => n === 1 ? "1st" : n === 2 ? "2nd" : n === 3 ? "3rd" : `${n}th`;
        const why = (rk) => rk === 1 ? "Group winner" : rk === 2 ? "Runner-up" : rk === 3 ? "Best 3rd" : `${ord(rk)} place`;
        rows.sort((a, c) => (a.seed || 99) - (c.seed || 99) || a.rank - c.rank || a.g.localeCompare(c.g));
        const top = rows.find(r => r.seed === 1);
        return <Card className="p-3">
          <div className="flex items-center justify-between mb-1">
            <h3 className="jh-round-title" style={{ fontSize: 18 }}>SEEDING · WHO QUALIFIED</h3>
            <span className="text-[10px] text-stone-500 font-bold uppercase tracking-wider">{rows.length} teams</span>
          </div>
          <div className="text-[10px] text-stone-500 mb-2 leading-snug">
            Seeded by group finish — winners (1–3), runners-up (4–6), then the 2 best thirds (7–8); ranked by wins, then game difference.
            {top && <> Top seed plays the lowest (1 v 8). <span className="text-cyan-300 font-bold">#1 seed: {lbl(top.id)}.</span></>}
          </div>
          <div className="space-y-1">{rows.map(r => (
            <div key={r.id} className="flex items-center gap-2 px-2 py-1.5 rounded-md" style={{ background: r.seed === 1 ? "rgba(247,241,230,.13)" : "rgba(19,19,19,.06)", border: r.seed === 1 ? "2px solid #9E1520" : "2px solid transparent" }}>
              {r.seed
                ? <span className="font-mono text-xs font-bold flex items-center justify-center shrink-0" style={{ width: 22, height: 22, background: r.seed === 1 ? "#F7F1E6" : "#9E1520", color: "#FFFFFF", border: "1px solid rgba(255,255,255,.14)" }}>{r.seed}</span>
                : <span style={{ width: 22 }} className="shrink-0" />}
              {r.pending
                ? <span className="shrink-0" style={{ minWidth: 30, textAlign: "center", padding: "2px 5px", border: "1px dashed rgba(242,184,188,.5)", fontFamily: "'JetBrains Mono',monospace", fontSize: 10, fontWeight: 700, color: "#F2B8BC" }}>?</span>
                : <SeedBadge seed={r.g + r.rank} />}
              <span className="flex-1 text-xs truncate font-semibold" style={{ color: r.pending ? "#F7F1E6" : "#FFFFFF" }}>
                {r.pending ? "Winner of the 3rds playoff" : lbl(r.id)}</span>
              <span className="text-[10px] font-mono uppercase tracking-wide" style={{ color: r.pending ? "#F2B8BC" : "#F7F1E6" }}>
                {r.pending ? "To be played" : why(r.rank)}</span>
            </div>
          ))}</div>
        </Card>;
      })()}
      {champId && <div style={{ background:"var(--blue)", border:"1px solid rgba(255,255,255,.10)", boxShadow:"none", padding:"20px", textAlign:"center", marginBottom:16 }}>
        <I.crown size={32} style={{ color:"#FFFFFF", margin:"0 auto 8px" }} />
        <div style={{ fontWeight:900, fontSize:"11px", letterSpacing:".22em", textTransform:"uppercase", color:"#FFFFFF", marginBottom:4 }}>Champion</div>
        <div style={{ fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize:"36px", letterSpacing:"1.5px", color:"#FFFFFF" }}>{lbl(champId)}</div>
      </div>}

      {/* R16 round (all4r16 mode) */}
      {b.r16?.length > 0 && (
        <Card className="p-3" style={{ borderColor: "rgba(167,139,250,0.35)" }}>
          <div className="flex items-center justify-between mb-2">
            <h3 className="jh-round-title" style={{fontSize:20}}>ROUND OF 16</h3>
            <span className="text-[10px] font-bold uppercase tracking-wider" style={{ color: "#F7F1E6" }}>All thirds qualify</span>
          </div>
          <div className="space-y-1.5">
            {b.r16.map(m => (
              <BracketRow key={m.id} match={m} lbl={lbl}
                onClick={() => canScore && setEdit({ ...m, round: "r16" })} />
            ))}
          </div>
        </Card>
      )}

      {/* Thirds qualifier (playoff mode) */}
      {b.thirdsPlayoff && !b.thirdsPlayoff.winner && (
        <Card className="p-3" style={{ borderColor: "rgba(167,139,250,0.35)" }}>
          <div className="flex items-center justify-between mb-2">
            <h3 className="jh-round-title" style={{fontSize:20}}>3RDS QUALIFIER</h3>
            <span className="text-[10px] font-bold uppercase tracking-wider" style={{ color: "#F7F1E6" }}>For 8th QF spot</span>
          </div>
          <BracketRow match={b.thirdsPlayoff} lbl={lbl} onClick={() => canScore && setEdit({ ...b.thirdsPlayoff, round: "thirdsPlayoff" })} />
        </Card>
      )}

      {/* Bracket tree (4 QF) or fallback list */}
      {isAdmin && b.qf.length === 4 && !(b.r16?.length) && (
        koLocked
          ? <div className="px-1 space-y-1">
              <div className="text-[10px] text-stone-500 flex items-center gap-1"><I.alert size={10} /> Seeding is locked — a score is already recorded.</div>
              {seedStale && <div className="flex gap-2 p-2" style={{ background:"rgba(242,184,188,.10)", border:"1px solid rgba(242,184,188,.4)" }}>
                <I.alert size={12} className="shrink-0 mt-0.5" style={{ color:"#F2B8BC" }} />
                <div className="text-[10px]" style={{ color:"#F7F1E6" }}>
                  <span className="font-bold" style={{ color:"#F2B8BC" }}>A group result changed after this bracket was drawn.</span>{" "}
                  The knockout has already been played, so nothing is redrawn — this bracket may no longer match the group tables. Fix the pairings by hand if it matters.
                </div>
              </div>}
            </div>
          : <div className="flex items-center justify-between gap-2 flex-wrap">
              <div className="text-[10px] text-stone-500 flex items-center gap-1">
                {session.seedManual
                  ? <><I.alert size={10} /> Seeded by hand — it won't follow group-result changes. Re-seed to resume auto.</>
                  : <>Seeding follows the group results automatically until a knockout score is entered.</>}
              </div>
              <div className="flex gap-1.5">
                {session.seedManual && <Btn variant="ghost" onClick={() => seedQF()}><I.bolt size={12} /> Re-seed</Btn>}
                <Btn variant="secondary" onClick={() => setSeedEdit(true)}><I.swords size={12} /> Edit seeding</Btn>
              </div>
            </div>
      )}
      {b.qf.length === 4
        ? <BracketTreeView b={b} lbl={lbl} canScore={canScore} setEdit={setEdit} />
        : <>
            {b.qf?.length > 0 && <Card className="p-3">
              <div className="flex items-center justify-between mb-2"><h3 className="jh-round-title">QUARTERFINALS</h3><Pill color="orange">+1 · W+3 TB+2 L+1</Pill></div>
              {isAdmin && <div className="text-[10px] text-cyan-300 mb-2 flex items-center gap-1"><I.alert size={10} /> Tap to edit (for dropouts)</div>}
              <div className="space-y-1.5">{b.qf.map(m => <BracketRow key={m.id} match={m} lbl={lbl} onClick={() => canScore && setEdit({ ...m, round: "qf" })} />)}</div>
            </Card>}
            {b.sf?.length > 0 && <Card className="p-3">
              <div className="flex items-center justify-between mb-2"><h3 className="jh-round-title">SEMIFINALS</h3><Pill color="red">+2 · W+3 TB+2 L+1</Pill></div>
              <div className="space-y-1.5">{b.sf.map(m => <BracketRow key={m.id} match={m} lbl={lbl} onClick={() => canScore && setEdit({ ...m, round: "sf" })} />)}</div>
            </Card>}
            {b.final && <Card className="p-3" style={{ borderColor: "rgba(251, 191, 36, 0.3)" }}>
              <div className="flex items-center justify-between mb-2"><h3 className="jh-round-title" style={{textShadow:"none",display:"inline-flex",alignItems:"center",gap:6}}><svg width="18" height="18" viewBox="0 0 24 24" fill="#F2B8BC" stroke="#9E1520" strokeWidth="1.8"><path d="M7 3h10v6a5 5 0 01-10 0z"/><path d="M7 5H4a3 3 0 003 5M17 5h3a3 3 0 01-3 5M12 14v4M8 21h8M9 18h6" fill="none"/></svg> FINAL</h3><Pill color="amber">+3 reach · +5 win · W+3 TB+2 L+1</Pill></div>
              <BracketRow match={b.final} lbl={lbl} onClick={() => canScore && setEdit({ ...b.final, round: "final" })} big />
            </Card>}
          </>
      }

      {edit && <BracketEditModal match={edit} teams={teams} state={state} session={session} isAdmin={isAdmin} onClose={() => setEdit(null)}
        onSave={(d) => updateSession(s => {
          const nb = { ...s.bracket };
          if (edit.round === "r16") nb.r16 = (nb.r16||[]).map(m => m.id === edit.id ? { ...m, ...d } : m);
          else if (edit.round === "qf") nb.qf = nb.qf.map(m => m.id === edit.id ? { ...m, ...d } : m);
          else if (edit.round === "sf") nb.sf = nb.sf.map(m => m.id === edit.id ? { ...m, ...d } : m);
          else if (edit.round === "final") nb.final = { ...nb.final, ...d };
          else if (edit.round === "thirdsPlayoff") nb.thirdsPlayoff = { ...nb.thirdsPlayoff, ...d };
          return { ...s, bracket: nb };
        })}
        onReset={() => updateSession(s => ({ ...s, bracket: { r16: s.bracket.r16, qf: s.bracket.qf, sf: [], final: null, thirdsPlayoff: s.bracket.thirdsPlayoff } }))}
      />}

      {/* A hand-arranged bracket sets seedManual, which parks the automatic
          re-seed — otherwise the next group-result edit would silently undo
          the organizer's arrangement. "Re-seed" clears it again. */}
      {seedEdit && <QFSeedingModal qf={b.qf} lbl={lbl} onClose={() => setSeedEdit(false)}
        onSave={(newQf) => { updateSession(s => ({ ...s, bracket: { ...s.bracket, qf: newQf }, seedManual: true })); setSeedEdit(false); }}
      />}
    </div>
  );
}

function BracketTreeView({ b, lbl, canScore, setEdit }) {
  const QFW = 176, SFW = 168, FW = 176, CARD = 78, GAP = 18;
  const qf = b.qf || [];
  const n = Math.max(1, qf.length);
  const qTop = (i) => 22 + i * (CARD + GAP);
  const qMid = (i) => qTop(i) + CARD / 2;
  const sfCount = Math.max(1, Math.ceil(n / 2));
  const sMid = (i) => (qMid(i * 2) + qMid(Math.min(n - 1, i * 2 + 1))) / 2;
  const fMid = sfCount > 1 ? (sMid(0) + sMid(sfCount - 1)) / 2 : sMid(0);
  const H = qTop(n - 1) + CARD + 26;
  const X1 = QFW, X2 = QFW + 18, X3 = QFW + 36;
  const Y1 = X3 + SFW, Y2 = Y1 + 18, Y3 = Y1 + 36;
  const W = Y3 + FW;

  // Placeholders so all three columns are visible from the start.
  const sf = b.sf && b.sf.length ? b.sf
    : Array.from({ length: sfCount }, (_, i) => ({ id: "sfp" + i, slot: i + 1, team1Id: null, team2Id: null, winner: null }));
  const fin = b.final || { id: "fp", team1Id: null, team2Id: null, winner: null };

  const nameOf = (id) => id && !String(id).includes("TBD") ? lbl(id) : "—";
  const won = (m, k) => !!(m && m.winner === k);
  const line = (key, l, t, w, h, on) => <div key={key} style={{position:"absolute",left:l,top:t,width:w,height:h,
    background:on ? "rgba(247,241,230,.55)" : "rgba(242,208,211,.3)"}} />;

  const Card2 = ({ m, round, label, l, t, w, accent, live, big }) => {
    const done = !!(m && m.winner);
    const real = !!(m && (m.team1Id || m.team2Id));
    return <div onClick={() => real && canScore && setEdit({ ...m, round })}
      style={{position:"absolute",left:l,top:t,width:w,padding:big ? 12 : "9px 10px",
              background:big ? "rgba(16,23,31,.96)" : "rgba(158,21,32,.94)",
              cursor:real && canScore ? "pointer" : "default",
              border:`1px solid ${done ? (big ? "rgba(242,184,188,.5)" : "rgba(247,241,230,.45)") : "rgba(242,208,211,.3)"}`,
              borderLeft:`3px solid ${accent}`}}>
      <div style={{fontFamily:"'Archivo',sans-serif",fontWeight:800,fontSize:8,letterSpacing:".22em",
           color:big ? "#F2B8BC" : "#F7F1E6"}}>{label}</div>
      {["team1", "team2"].map((k, ki) => (
        <div key={k} style={{display:"flex",alignItems:"center",gap:8,marginTop:ki ? (big ? 5 : 4) : (big ? 8 : 6),
             paddingTop:ki ? (big ? 5 : 4) : 0,
             borderTop:ki ? "1px solid rgba(242,208,211,.18)" : "none"}}>
          <div style={{flex:"1 1 auto",minWidth:0,fontFamily:"'Archivo',sans-serif",fontWeight:800,
               fontSize:big ? 14 : 13,color:won(m, k) ? live : "#FFFFFF",
               whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{nameOf(m && m[k + "Id"])}</div>
          <div style={{flex:"0 0 auto",fontFamily:"'JetBrains Mono',monospace",fontSize:13,
               color:won(m, k) ? live : "#F7F1E6"}}>{m && m.score ? m.score[k === "team1" ? "t1" : "t2"] : "–"}</div>
        </div>
      ))}
    </div>;
  };

  const champId = b.final && b.final.winner
    ? (b.final.winner === "team1" ? b.final.team1Id : b.final.team2Id) : null;
  const label = (txt, l, colour) => <div style={{position:"absolute",left:l,top:0,
    fontFamily:"'Archivo',sans-serif",fontWeight:800,fontSize:9,letterSpacing:".28em",color:colour}}>{txt}</div>;

  return (
    <div>
      <div style={{overflowX:"auto",overscrollBehaviorX:"contain",paddingBottom:4}}>
        <div style={{position:"relative",width:W,height:H}}>
          {label("QUARTER-FINALS", 0, "#F7F1E6")}
          {label("SEMI-FINALS", X3, "#F7F1E6")}
          {label("FINAL", Y3, "#F2B8BC")}

          {/* connectors — each lights when its round has a result */}
          {qf.map((m, i) => line("q" + i, X1, qMid(i) - 1, 18, 2, !!m.winner))}
          {Array.from({ length: sfCount }).map((_, i) => {
            const a = qMid(i * 2), c = qMid(Math.min(n - 1, i * 2 + 1));
            const on = !!(sf[i] && (sf[i].team1Id || sf[i].team2Id));
            return <React.Fragment key={"j" + i}>
              {line("v" + i, X2, Math.min(a, c), 2, Math.abs(c - a) || 2, on)}
              {line("h" + i, X2, sMid(i) - 1, 18, 2, on)}
            </React.Fragment>;
          })}
          {sf.map((m, i) => line("s" + i, Y1, sMid(i) - 1, 18, 2, !!m.winner))}
          {sfCount > 1 && line("fv", Y2, Math.min(sMid(0), sMid(sfCount - 1)), 2,
                               Math.abs(sMid(sfCount - 1) - sMid(0)) || 2, !!(fin.team1Id || fin.team2Id))}
          {line("fh", Y2, fMid - 1, 18, 2, !!(fin.team1Id || fin.team2Id))}

          {/* cards */}
          {qf.map((m, i) => <Card2 key={"qf" + m.id} m={m} round="qf" label={`QF${i + 1}`}
            l={0} t={qTop(i)} w={QFW} accent={m.winner ? "#F7F1E6" : "#F2D0D3"} live="#F7F1E6" />)}
          {sf.map((m, i) => <Card2 key={"sf" + m.id} m={m} round="sf" label={`SF${i + 1}`}
            l={X3} t={sMid(i) - CARD / 2} w={SFW} accent={m.winner ? "#F7F1E6" : "#F2D0D3"} live="#F7F1E6" />)}
          <Card2 m={fin} round="final" label="FINAL" l={Y3} t={fMid - CARD / 2 - 8} w={FW}
            accent="#F2B8BC" live="#F2B8BC" big />
        </div>
      </div>

      {champId && <div style={{marginTop:12,display:"flex",alignItems:"center",gap:8,padding:"11px 13px",
           background:"rgba(242,184,188,.08)",borderLeft:"3px solid #F2B8BC"}}>
        <div style={{fontFamily:"'Archivo',sans-serif",fontWeight:800,fontSize:9,letterSpacing:".26em",color:"#F2B8BC"}}>CHAMPION</div>
        <div style={{marginLeft:"auto",minWidth:0,fontFamily:"'Archivo',sans-serif",fontStyle:"italic",
             fontVariationSettings:"'wdth' 112,'wght' 900",fontSize:18,color:"#F2B8BC",
             whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{lbl(champId)}</div>
      </div>}

      <div style={{marginTop:12,padding:"13px 14px",background:"rgba(247,241,230,.06)",borderLeft:"3px solid #F7F1E6",
           fontSize:12.5,lineHeight:1.5,color:"#F7F1E6"}}>
        Group winners cross over against runners-up from another group, so a group-stage rematch is avoided
        wherever the seeding allows. Swipe sideways to follow it through{canScore ? "; tap a match to score it" : ""}.
        Reaching the quarter-final is worth +1, the semi +2, the final +3, and winning it +5 more.
      </div>
    </div>
  );
}

function SeedBadge({ seed }) {
  if (!seed) return null;
  // Tier color: ends in 1 = winner (green), 2 = runner-up (gold), 3 = third (purple), else blue
  const n = parseInt(seed.slice(-1));
  // group winner red, runner-up cyan, third and below steel — the same
  // ladder the leaderboard medals use, instead of green/gold/purple/blue
  const cfg = n === 1
    ? { bg: "rgba(247,241,230,.9)",   color: "#B8141F" }
    : n === 2
    ? { bg: "rgba(242,184,188,.16)", color: "#F2B8BC" }
    : { bg: "rgba(255,255,255,.10)", color: "#F2D0D3" };
  return <span className="inline-flex items-center justify-center px-1.5 py-0.5 text-[9px] font-bold font-mono shrink-0" style={{ background: cfg.bg, color: cfg.color, border: "1px solid rgba(255,255,255,.14)", borderRadius: 28 }}>{seed}</span>;
}
