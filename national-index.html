/* LIFT THE APP ABOVE THE TILE — ON #root ALONE, AND NOT ON `main`.
   This rule used to read `#root, main, nav { position: relative; z-index: 1 }`
   and it TRAPPED EVERY SHEET RENDERED INSIDE <main> UNDERNEATH THE NAV.
   A z-index on a positioned element creates a STACKING CONTEXT, so the
   recap sheet's `z-index: 80` stopped meaning "above the nav" and started
   meaning "80th within main" — and main itself is 1 against the nav's 30.
   No value the sheet could have given itself would have escaped: the
   comparison that decides is main (1) against nav (30), three ancestors up.
   On a 667px phone that put the floating nav squarely over the bottom of
   every sheet opened from a tab screen — FULL RESULTS on the night recap,
   "Copy for WhatsApp" on the format sheet — which is the reported
   "buttons are not reachable in some pages". It is invisible at 430x932,
   where the sheets are short enough to end above the nav.
   #root is the common ancestor of the nav AND the sheets, so one context
   there lifts everything clear of the tile while leaving z-index inside the
   app meaning what it says. main and nav stay positioned, with no z-index of
   their own; the nav keeps its Tailwind z-30 and the sheets their z-50..95. */
#root { position: relative; z-index: 1; }
main, nav { position: relative; }

/* ── THE MASAR BAND ────────────────────────────────────────────────────
   The woven turban band, and the first thing down the screen. To the
   handoff's spec: 24px tall, 14px side inset, pill radius, deep red ground
   with masar-band-white.svg tiled at its native 40x24.
   It was 10px of hand-rolled gradient before, which at that height reads as a
   stripe rather than as weaving — the band has a pattern and you have to be
   able to see it.
   ────────────────────────────────────────────────────────────────────── */
/* THE OWNER'S OWN BAND. The artwork is the enhancement — the handoff's SVG
   is two rules and a row of plain lozenges; this is the real weave, diamonds
   outlined in the flag's green over deep red, between green rules and a
   flag-red stripe, finished with an ivory line. In this volume's exact
   palette, which is why it replaces the handoff's band rather than sitting
   beside it: same motif, drawn properly. It is also where most of the green
   and ivory on a red screen comes from.
   THE PROPORTIONS ARE THE HANDOFF'S, though: thin and INSET at the very top,
   not a 44px full-bleed stripe. Blown up to 44 it stopped being a trim on
   the page and became a header of its own, which is not what the design
   does with it. 20px, inset 14, pill — bigger than the 10px it replaced and
   carrying ten times the detail.
   The width keeps the art's own 100:56 ratio: a woven band stretched off its
   aspect is the one place a pattern looks obviously wrong.
   OLD NOTE, superseded: */
/* THE OWNER'S OWN BAND, and bigger: 44px against the handoff's 24. The
   handoff's SVG is two rules and a row of plain lozenges; this is the real
   weave — diamonds outlined in the flag's green over a deep red ground,
   between green rules and a flag-red stripe, finished with an ivory line.
   It already uses this volume's exact palette, which is why it replaces the
   handoff's band rather than sitting beside it: same motif, drawn properly.
   It is also where most of the green and ivory on a red screen comes from.
   The width keeps the art's own 100:56 ratio — a band stretched off its
   aspect is the one place a woven pattern looks obviously wrong. */
/* IT IS THE HEADER'S ::before, AND `body::after` WAS BOTH WRONG PLACES AT ONCE.
   The handoff lists this band as item 1 of the Sessions screen — ABOVE the
   header, in flow, 24px tall at a 14px side inset with a pill radius. It was
   written here as `position: fixed; top: 7px; z-index: 60`, which is not
   above the header but ON it: a strip floating over the chrome, owned by no
   component, that would have sat over a sheet as readily as over the brand
   bar.
   AND IT WAS INVISIBLE WHILE EVERY CHECK SAID IT WAS DRAWN. `body::after` is
   the previous volume's scanline overlay, and three inherited layers own it —
   including `html:not(.light) body::after { opacity:.14; mix-blend-mode:
   multiply }`, which is (0,1,2) against a plain `body::after`'s (0,0,2) and
   wins with !important on both. So the weave rendered at 14% MULTIPLIED over
   the red: a flat dark pill with not one green pixel in it, while
   `getComputedStyle` reported the background-image exactly as written and the
   motif assertion went green. The fourth time in this skin that specificity,
   not order, decided — and the first time it produced a passing check over
   artwork that was not on the screen.
   Moving it into the header's own ::before leaves all of that behind: no
   inherited layer styles it, it is clipped and carried by the sticky chrome,
   and it cannot lie over anything because the header's top padding is what
   makes room for it. */
header::before, .sticky.top-0::before {
  content: "";
  position: absolute; left: 14px; right: 14px; top: 7px; height: 24px;
  z-index: 1; pointer-events: none; border-radius: 999px;
  background-color: var(--deep);
  /* 43 x 24 is the art's own 100:56 ratio. A woven band stretched off its
     aspect is the one place a pattern looks obviously wrong. */

/* The header's own children must sit ABOVE it: the band is a trim on the
   chrome, not a layer over the lockup. */
header > *, .sticky.top-0 > * { position: relative; z-index: 2; }

/* THE SAME WEAVE THREADS THE PAGE, not just its top edge. The handoff runs a
   masar strip under the champions photo as well as across the top — it is the
   volume's rule, the way the scanline was Blackout's. So it is also the
   header's bottom edge and the foot of every ivory arch, where a flat
   hairline was doing the job of a motif. 12px and the red cut, which is what
   the handoff uses for a strip inside a card. */
/* A FULL-BLEED STRIP ACROSS A ROUNDED PLATE HANGS OFF BOTH ENDS, and that is
   what the header's trim was doing: the brand bar is a 28px bubble, the strip
   is square and runs `left:0; right:0`, so at 6px above the foot it stood
   about 10px proud of the curve on each side — the bubble's outline ran
   behind it and came back out the other side. Reported as the band and the
   bubble overlapping, which is exactly what it is.
   THE PLATE CLIPS ITS OWN TRIM. `.na-ivory` has carried this the whole time
   and its band sits perfectly inside its corners; the header was the one
   surface drawing a trim it did not clip. That is the fix rather than
   insetting the strip, because an inset is a number that has to be re-derived
   every time a corner moves (at 28px it is 14, at the hero's 168px arch it
   would be 123), while clipping is right whatever the radius becomes.
   The aspect goes back to the art's own too: the repeat unit is 100x56, which
   is exactly 25:14, and 20x11 is 1.8% wide of it. A woven band stretched off
   its aspect is the one place a pattern looks obviously wrong. */
header, .sticky.top-0 { overflow: hidden; }
header::after, .sticky.top-0::after,
.sg-hero::after {
  content: "";
  position: absolute; left: 0; right: 0; bottom: 0; height: 14px;
  pointer-events: none;
  background-color: var(--deep);
  background-image: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAGQAAAA4CAIAAACEzMqPAAAEcElEQVR4nO2bz2/bZBzGv69/xY7dpUmTRaiZmrGihrIUQSc6tpUC0gTSGBIV2qT1uAPTzpy48V/ApZyqauWXxNQDAqaxrhMVhWkdKgEiqo4yrVubNG0SJ3YTc7AZjWM7fslUO9L7OUR28vrNkyff9/H72gn6NTkEBHcwfylVAAAEoNk/ugEBQBsH7sXlgfsOs6ZWvdbQMVBeC+gkiFkYELMwYGaHQ0YeA2Bs6Bls2rB7fm8D9537DQTM7IvdXqvoGMgwxABNxpJea+gYSGVhQMzCgJiFATELgxZmiRQ9JIgiRe+PGpd4pcrJrCjDpnlRpOg0L0YZtp230QDmU9KH53pvpqQ2p5weqrKeOiAEh1khzjZIWVfVFVXW8D/rWoSdHu1ZORjQd/seKhfmNw9tKLj9eK7KwiwWoRQflKyKvFivZSpl1bU0mUOzw+FrR7uaXxpb3jm7uBWs1l125QdVZrNEik7xAodsh6ei1TMVuVSvtdT0Y7/4+fHwtkADAFfT3rhdeP2X7WtHD3z9QkihEQBIlfo7C/mXfy+27MonqhrMijJsPyeg5kuXjWgaZBV5Y1e1a7DezU6d6sk+ZVT486vlc7dy4aLxSfISPXMicqcvqO/2PVQm5jYSOdve/KPKMMsyDpyxDAuVRrPDoe/SoRoFABDbVs/P5wfX5ObDlxPClZPhRwdYAKA0bWy5+NZiXlAauvObKjQZSzrEwfVeNhOhU7naq39bfGOmsLjTF/z0RDgnMfBvhZ9eKjD2I2OXhm+GQo/rv0uujf+QH8mW9Fd9qApdiR+xi4OP0/xHaUHfvnRXfu9upbmNHhb3gmh6NLKcMBqbKtwZU/0/vV59/6sHDiHllaqJuU10cXzk8lIluGtxKnnl3e4dzoiKLkW78dlWc5sSgyafC0wNCFUGwLHCndlb/zOf3HcIKa9U0XWN0tq7MKkhrUJTuiYACJXdTgXM/ew5lmqV5Z6oqlEIzcSPpPgga/U9uil4VdMylfIfIWpqtOfPuPWJxhnLYShRtN9UTcxtoslYkkNUihcsl1rXe9nfIvSATZSW6rVMRVY0w/uFZ8QvRiI7AgVPIuB9qOq/qUM/J2AttTZ21axiPknLHLp6LHxjUKojBE9i6uArVQ2T0jjLHmZdTf9WVHldtZ3+rUXYqdHo6kFO321zUuofVebljkNY6OhxUHSxsLg1IH35UrjEG/X/5u3Ca00Li/GF/HEXyx2fqLJYSDuEhSkOWlIOUFePdX8/aL1kfXtxS3C9kPaDKttLNM1hYRkHbrgXDUyfiqzGjPpPPqpemMslNv/PJRpvVTndCnscFi3jwA03n5W+TYdOLxVOZlqPOwc8VNXivqFE0f0BPlutuImDfcMrVeQmKwbk7g4GxCwMiFkYELMwQPwHY15r6BhIZWHAnPlpC4D8Dt4VzJmfC15r6BjIMMSAmIUBMQsDJsEFyO/gXYGAOcQGvFbRMZBhiAExCwNiFgbkn6wYkH+yYkCGIQZILtz3WkPHQCoLg38A+Jaspk0xVK8AAAAASUVORK5CYII=");
  background-size: 25px 14px;
  background-repeat: repeat-x;
}
/* ONLY THE HERO. The header already establishes a positioning context —
   `sticky` does — and writing `position: relative` on it to anchor the masar
   strip OVERRODE THE STICKY, so the header scrolled away and the fixed band
   at the top was left floating over the content on its own. That is what
   "a gradient in the top part that moves while you scroll" was: not a
   gradient, the brand bar leaving. */
.sg-hero { position: relative; }
/* The hero's strip sits INSIDE the arch, so it has to be clipped by it —
   otherwise a 12px rectangle hangs off the bottom corners of a rounded card.
   The arch's own overflow does that, and the card's bottom padding makes room
   so the strip never runs under the last line of type. */
.sg-hero { overflow: hidden; }

/* THE FADE ABOVE THE TAB BAR. The handoff's last global rule: content below
   the fold fades out over 56px directly above the bar, so a row is never
   half-hidden behind a floating pill — it goes quiet first. */
body > #root::after, #root::after {
  content: "";
  position: fixed; left: 0; right: 0; bottom: 0; height: 102px;
  z-index: 2; pointer-events: none;
  background: linear-gradient(180deg, rgba(184,20,31,0) 0%, var(--bg) 55%);
}

/* ── THE FLAG PLAQUE, BEHIND THE "56" ─────────────────────────────────
   The Omani flag as the mark's ground: a red hoist bar down the left, then
   three equal bands — white, red, green. It is the one place in the chrome
   that carries white and green, which is deliberate: the handoff reserves
   green for National Day, so spending it as a general accent would take the
   meaning off the 18th. On the flag it is not an accent, it is the flag.

   The radius is 6px and that is NOT a breach of "no square blocks". That rule
   is about surfaces — cards, rows, sheets — and a flag drawn as a pill or an
   arch stops being a flag. The :not() chain is here for the same reason it is
   on the arch and the medallion: the inherited universal rule is (0,3,0) and
   would otherwise make this a 28px lozenge.

   The 56 keeps its ink stroke, which is what lets one mark sit legibly across
   all three bands. Its GREEN offset shadow is gone — against the green band it
   read as mis-registered printing rather than as depth.
   ────────────────────────────────────────────────────────────────────── */
.na-flag:not([data-a]):not([data-b]):not([data-c]) {
  display: inline-flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  padding: 4px 8px 4px 13px;
  margin-right: 2px;
  border-radius: 6px !important;
  background-image:
    linear-gradient(90deg, var(--flag) 0 6px, transparent 6px),
    linear-gradient(180deg,
      #FFFFFF 0 34%, var(--flag) 34% 66%, var(--green) 66% 100%);
  /* The same double-line ring the arches use, so the plaque belongs to the
     system rather than looking stuck on. */
  box-shadow: 0 0 0 1.5px var(--ink);
}

/* ── THE LANDMARK MEDALLION ────────────────────────────────────────────
   A night's badge: a red disc carrying an Omani landmark in white. The
   markup side is in build-national-app.py (the silhouette is a per-session
   data URL, so it cannot live in a static stylesheet); this is the disc it
   sits on.
   The handoff's hero medallion is 64px with a double ring; a row's is 44px
   and plain. This is the row's, at the 48px the row already allowed for.
   ────────────────────────────────────────────────────────────────────── */
/* THE :not() CHAIN AGAIN — fourth time in this file. The inherited universal
   radius rule is (0,3,0) and excludes only elements whose INLINE style names a
   50% radius; a class cannot beat it however loud. A disc that silently became
   a 28px rounded square is exactly the kind of thing that looks like a design
   decision. */
.na-medallion:not([data-a]):not([data-b]):not([data-c]) {
  border-radius: 50% !important;
  background-color: var(--bg);
  background-repeat: no-repeat;
  background-position: center 54%;
  /* 62% of the disc: the silhouettes carry 4px of their own padding in the
     viewBox, so a landmark drawn edge to edge touches the rim. */
  background-size: 62% auto;
  box-shadow: 0 0 0 2px var(--ivory), 0 0 0 4px var(--flag);
}
/* THE HERO'S MEDALLION is the handoff's 64px disc with its double ring — the
   row's is 48px and plain. It sits above the copy, centred, with the landmark
   named under it in both scripts. */
.na-hero-mark {
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  margin-bottom: 14px;
}
.na-medallion-lg:not([data-a]):not([data-b]):not([data-c]) {
  width: 64px !important; height: 64px !important;
  background-color: var(--bg) !important;
  box-shadow: 0 0 0 3px var(--ivory), 0 0 0 5px var(--flag) !important;
}
.na-hero-landmark {
  font-family: 'Archivo', sans-serif; font-weight: 800;
  font-size: 11px; letter-spacing: .16em; color: var(--bg);
  display: flex; align-items: center; justify-content: center;
}

/* The row eyebrow carries the landmark's name, and at the .24em it inherited
   "MON 9 NOV · AL ALAM PALACE" wrapped to two lines — which pushed the title
   down and made every third row a different height. .14em fits the longest
   name we have with room to spare, and the handoff's own figure for a label
   is .16em, so this was never the tracking the design asked for. */
.jh-mock-sess [style*="letter-spacing: 0.24em"],
.jh-mock-sess [style*="letterSpacing"] { letter-spacing: .14em !important; }

/* The live night's disc takes the flag red and a brighter rim, which is the
   one place the row says "now" without a word. */
.na-medallion[data-live="1"] {
  background-color: var(--flag);
  box-shadow: 0 0 0 2px var(--ivory), 0 0 0 5px var(--ivory);
}

/* ── 3 · NO SQUARE BLOCKS ──────────────────────────────────────────────
   Pills everywhere, arches for heroes. The sweep pilled every INLINE
   radius; these are the classed ones.
   ────────────────────────────────────────────────────────────────────── */
/* A PILL ONLY WHERE A PILL IS A PILL. 999px on a tall block is an ellipse,
   not a stadium — the first pass pilled everything and the countdown came out
   as four ovals under a lozenge. So: buttons and fields are pills (they are
   short by construction), card-shaped things take the sheet radius, and
   deliberate circles stay circles. */
button, input, select, textarea { border-radius: 999px !important; }
[class*="rounded-"] { border-radius: var(--sheet) !important; }
.rounded-full, [style*="50%"] { border-radius: 50% !important; }
/* Tailwind's own small radii are chips in this app — a count, a tag, a state
   dot's label — and those do want the pill. */
.rounded, .rounded-sm, .rounded-md, .rounded-lg { border-radius: 999px !important; }

/* A RADIUS BELONGS TO A SURFACE, NEVER TO A RULE — and this is the same
   lesson as the ellipse above, one case further down. The inherited sweep
   carries `:not(.rounded-full):not(…):not(…){border-radius:28px !important}`
   at specificity (0,3,0), which reaches EVERY element in the document,
   including a bare div whose only drawn edge is a one-pixel `border-top`.
   A 28px radius on a hairline does not round a box, it CURLS THE LINE: each
   divider rendered as two little brackets swooping up at the ends and meeting
   in a peak in the middle, which reads as a rendering fault rather than as a
   design. Measured on the shipped build: 14 of them in HOW POINTS ARE EARNED,
   4 under the SESSIONS table and 81 across RANK — three per row of the main
   table in the app.
   A rule has no corners to round, so it keeps none. The guard is the inline
   `background`, because an element that paints a surface AND draws a top edge
   is a card and does want the sheet radius; one that paints nothing is a line.
   (0,4,0), so it beats the universal rule rather than racing it on order.) */
[style*="border-top:"]:not([style*="background"]):not([style*="border-radius"]),
[style*="border-bottom:"]:not([style*="background"]):not([style*="border-radius"]),
[style*="border-left:"]:not([style*="background"]):not([style*="border-radius"]),
[style*="border-right:"]:not([style*="background"]):not([style*="border-radius"]) {
  border-radius: 0 !important;
}

/* ── 4 · THE SURFACES ──────────────────────────────────────────────────
   THE CARDS ARE .sg-card AND .sg-hero — September Surge class names, three
   volumes old and still carrying the chrome. The first re-skin targeted
   `.card` and `[class*="Card"]`, matched nothing, and left every surface
   the same red as the page behind it.

   Blackout is light type on dark cards; National is DARK TYPE ON IVORY.
   That is an inversion, not a recolour, and no colour sweep can do it — so
   it is done here: the hero becomes ivory and everything inside it flips to
   ink, while rows stay on the deep red with light type.
   ────────────────────────────────────────────────────────────────────── */
/* THE :not() CHAIN IS NOT DECORATION. An inherited layer carries
   `*:not(…):not(…):not(…){border-radius:2px}` at specificity (0,3,0), which
   beats a plain `.sg-hero` no matter how late it is written — the arch lost
   silently and the hero rendered with 2px corners. Three attribute selectors
   take this to (0,4,0), which wins. The build also corrects that rule's own
   value, so this only has to beat it for the arch. */
.sg-hero:not([data-a]):not([data-b]):not([data-c]) {
  background: var(--ivory) !important;
  border: 0 !important;
  border-radius: var(--arch) !important;
  box-shadow: 0 0 0 4px var(--bg), 0 0 0 6px var(--ivory) !important;
  /* THE PADDING IS DERIVED FROM THE ARCH, NOT CHOSEN. A 168px corner clips its
     own content: at 45px below the top edge the curve eats 54px off EACH side,
     and the eyebrow rendered as "& WED · 5:30 PM · ALL NOVEMB" — MON and ER
     cut off by the radius, with every width assertion green because nothing
     had overflowed its box. At 100px down the curve takes 14px a side, which
     a line of caps can live with. 92px of top padding is what puts the first
     line there. The side padding is the rest of that 14. */
  padding: 92px 26px 22px !important;
}
/* The lockup is a RED banner, and on an ivory hero it reads as a sticker
   stuck to the card. The header already carries it two inches above; inside
   the hero the type does the work, which is what the handoff's own hero does
   (a medallion and a name, no lockup). */
.sg-hero img[src*="lockup"] { display: none !important; }
.sg-hero, .sg-hero * { color: var(--ink) !important; }
/* The accent, back where it reads. NOT --flag: measured, flag red on ivory is
   4.38:1, which is under AA for the 22px figures in the hero's stat row (22px
   at weight 400 is not large text — the allowance starts at 24px, or 18.66px
   at 700). The base red is 5.83:1 on ivory and reads as the same colour at a
   glance; --flag keeps its job on the red ground, where it is the loud one. */
/* LED BY `body`, AND THAT PREFIX IS LATE-ADDED LOAD-BEARING. The global rose
   rule at the foot of this file carries a `:not([style*="background"])` guard
   (see it for why), and adding that second attribute selector took it from
   (0,1,0) to (0,2,0) — exactly level with a plain `.sg-hero [style*=…]`. On a
   tie the later rule wins, and the global one is written after this, so the
   hero's own figures were quietly repainted --rose-txt on ivory: **1.23:1**,
   a blank space where the PLAYERS count should be. `body` makes this (0,2,1)
   and puts it back in front.
   The fifth time in this skin that specificity rather than order decided, and
   the first where tightening one rule silently broke another. */
body .sg-hero [style*="242, 184, 188"], body .sg-hero [style*="#F2B8BC"],
body .sg-hero [style*="rgb(242,184,188)"] { color: var(--bg) !important; }
/* THE TAGLINE IS TWO BEATS AND HAS TO LOOK LIKE TWO. The hero sets its second
   half in what was Vol.8's lead colour, which the sweep turned to ivory —
   ivory type on an ivory card. `.sg-hero *` then painted it ink, so the line
   rendered as one flat sentence and the markup that exists to split it was
   doing nothing. Anything inside an ivory hero that names ivory as its own
   colour was an accent before the sweep and is the base red now. */
.sg-hero [style*="247, 241, 230"], .sg-hero [style*="#F7F1E6"] {
  color: var(--bg) !important;
}
/* Secondary copy on ivory is the handoff's muted ink, not a grey. */
.sg-hero [style*="203, 189, 182"], .sg-hero [style*="#CBBDB6"],
.sg-hero .text-stone-400, .sg-hero .text-stone-500 { color: var(--muted-ink) !important; }
/* Anything that was a tint of the lead is now an ivory tint ON ivory, which
   is nothing. Give those blocks the base red at a low alpha instead. */
.sg-hero [style*="247, 241, 230, 0.0"], .sg-hero [style*="247, 241, 230, 0.1"] {
  background: rgba(184,20,31,.07) !important;
}

/* THE VOLUME WATERMARK IS THE ONE THING IN THE HERO THAT MUST NOT GO INK.
   It is a 170px numeral sitting behind the eyebrow and the headline, and it
   works only as a ghost — on Blackout it was a 6% tint of the lead. The rule
   above (`.sg-hero *`) is exactly what broke it: it beats the element's own
   inline colour, so the ghost rendered at full opacity and a near-black 09 lay
   across the copy. The build gives it `.vol-mark` for this; the alpha lives
   here, next to the rule that would otherwise overwrite it.
   Both sizes (170px on the home hero, 150px on the screen headers) carry it. */
.sg-hero .vol-mark, .vol-mark {
  color: rgba(26,10,12,.055) !important;
  z-index: 0 !important;
}
/* ...and the copy sits ON it, not under it: the watermark is absolutely
   positioned and comes first in the markup, so without this the headline shares
   its stacking context at the same level and the ghost can paint over type that
   has its own background. */
.sg-hero > *:not(.vol-mark) { position: relative; z-index: 1; }

/* ── AN IVORY PANEL, AND THE GREEN THAT COMES WITH THE BAND ────────────
   The home screen was red on red on red: an ivory arch at the top and then
   four hundred pixels of deep-red cards, which reads as ONE colour however
   many surfaces are in it. `.na-ivory` is the second plate — same inversion
   as the hero, same double-line ring, and it carries a strip of the masar
   band at its foot so the green and the ivory line come with it.
   It is a PANEL and not an arch: two arches on one screen reads as a mistake
   rather than as a system, so this takes the sheet radius.
   ────────────────────────────────────────────────────────────────────── */
.na-ivory:not([data-a]):not([data-b]):not([data-c]) {
  position: relative;
  background: var(--ivory) !important;
  border: 0 !important;
  border-radius: 28px !important;
  box-shadow: 0 0 0 4px var(--bg), 0 0 0 6px var(--ivory) !important;
  overflow: hidden;
  padding-bottom: 24px !important;
}
.na-ivory, .na-ivory * { color: var(--ink) !important; }
/* Anything that was the lead accent inside it becomes the base red, the same
   rule the hero uses — ivory type on an ivory plate is nothing. */
.na-ivory [style*="247, 241, 230"], .na-ivory [style*="#F7F1E6"],
/* `body` for the same reason the hero's rule carries it. */
body .na-ivory [style*="242, 184, 188"], body .na-ivory [style*="#F2B8BC"],
body .na-ivory [style*="rgb(242,184,188)"] {
  color: var(--bg) !important;
}
/* ...and the hairline rings the countdown cells draw have to come back as
   ink, or they vanish into the ivory. */
.na-ivory [style*="border"] { border-color: rgba(26,10,12,.18) !important; }
.na-ivory::after {
  content: "";
  position: absolute; left: 0; right: 0; bottom: 0; height: 14px;
  background-color: var(--deep);
  background-image: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAGQAAAA4CAIAAACEzMqPAAAEcElEQVR4nO2bz2/bZBzGv69/xY7dpUmTRaiZmrGihrIUQSc6tpUC0gTSGBIV2qT1uAPTzpy48V/ApZyqauWXxNQDAqaxrhMVhWkdKgEiqo4yrVubNG0SJ3YTc7AZjWM7fslUO9L7OUR28vrNkyff9/H72gn6NTkEBHcwfylVAAAEoNk/ugEBQBsH7sXlgfsOs6ZWvdbQMVBeC+gkiFkYELMwYGaHQ0YeA2Bs6Bls2rB7fm8D9537DQTM7IvdXqvoGMgwxABNxpJea+gYSGVhQMzCgJiFATELgxZmiRQ9JIgiRe+PGpd4pcrJrCjDpnlRpOg0L0YZtp230QDmU9KH53pvpqQ2p5weqrKeOiAEh1khzjZIWVfVFVXW8D/rWoSdHu1ZORjQd/seKhfmNw9tKLj9eK7KwiwWoRQflKyKvFivZSpl1bU0mUOzw+FrR7uaXxpb3jm7uBWs1l125QdVZrNEik7xAodsh6ei1TMVuVSvtdT0Y7/4+fHwtkADAFfT3rhdeP2X7WtHD3z9QkihEQBIlfo7C/mXfy+27MonqhrMijJsPyeg5kuXjWgaZBV5Y1e1a7DezU6d6sk+ZVT486vlc7dy4aLxSfISPXMicqcvqO/2PVQm5jYSOdve/KPKMMsyDpyxDAuVRrPDoe/SoRoFABDbVs/P5wfX5ObDlxPClZPhRwdYAKA0bWy5+NZiXlAauvObKjQZSzrEwfVeNhOhU7naq39bfGOmsLjTF/z0RDgnMfBvhZ9eKjD2I2OXhm+GQo/rv0uujf+QH8mW9Fd9qApdiR+xi4OP0/xHaUHfvnRXfu9upbmNHhb3gmh6NLKcMBqbKtwZU/0/vV59/6sHDiHllaqJuU10cXzk8lIluGtxKnnl3e4dzoiKLkW78dlWc5sSgyafC0wNCFUGwLHCndlb/zOf3HcIKa9U0XWN0tq7MKkhrUJTuiYACJXdTgXM/ew5lmqV5Z6oqlEIzcSPpPgga/U9uil4VdMylfIfIWpqtOfPuPWJxhnLYShRtN9UTcxtoslYkkNUihcsl1rXe9nfIvSATZSW6rVMRVY0w/uFZ8QvRiI7AgVPIuB9qOq/qUM/J2AttTZ21axiPknLHLp6LHxjUKojBE9i6uArVQ2T0jjLHmZdTf9WVHldtZ3+rUXYqdHo6kFO321zUuofVebljkNY6OhxUHSxsLg1IH35UrjEG/X/5u3Ca00Li/GF/HEXyx2fqLJYSDuEhSkOWlIOUFePdX8/aL1kfXtxS3C9kPaDKttLNM1hYRkHbrgXDUyfiqzGjPpPPqpemMslNv/PJRpvVTndCnscFi3jwA03n5W+TYdOLxVOZlqPOwc8VNXivqFE0f0BPlutuImDfcMrVeQmKwbk7g4GxCwMiFkYELMwQPwHY15r6BhIZWHAnPlpC4D8Dt4VzJmfC15r6BjIMMSAmIUBMQsDJsEFyO/gXYGAOcQGvFbRMZBhiAExCwNiFgbkn6wYkH+yYkCGIQZILtz3WkPHQCoLg38A+Jaspk0xVK8AAAAASUVORK5CYII=");
  /* 25 x 14 is the art's own repeat unit (100x56) reduced, so the weave is
     drawn at its true aspect. 20 x 11 was 1.8% wide of it. */
  background-size: 25px 14px; background-repeat: repeat-x;
}

.sg-card {
  background: var(--deep) !important;
  border: 1px solid rgba(247,241,230,.18) !important;
  border-radius: 28px !important;
  box-shadow: none !important;
}

/* ── 5 · NO DROP SHADOWS ───────────────────────────────────────────────
   Depth is the double-line ring and nothing else. Blackout leaned on glows
   and they read as smudges on a red ground.
   ────────────────────────────────────────────────────────────────────── */
* { text-shadow: none !important; }
.sg-card, .sg-hero > * { box-shadow: none !important; }

/* ── 6 · THE TAB BAR ───────────────────────────────────────────────────
   An ink pill floating off the bottom. The nav is
   `nav.fixed.bottom-0.inset-x-0`, and a bare `nav.fixed` rule LOSES to the
   earlier skin layers, which are more specific — so this matches the full
   class list it actually carries.
   ────────────────────────────────────────────────────────────────────── */
body nav.fixed.bottom-0.inset-x-0 {
  left: 12px !important; right: 12px !important; bottom: 14px !important;
  inset-inline: 12px !important;
  width: auto !important;
  background: var(--ink) !important;
  border: 0 !important;
  border-radius: 999px !important;
  padding: 5px !important;
  box-shadow: none !important;
  backdrop-filter: none !important;
}
/* THE TABS ARE NOT PILLS, AND PILLING THEM DREW FOUR CRESCENTS ACROSS THE
   CHROME ON EVERY SCREEN. An inherited layer separates the tabs with a
   one-pixel `border-right`, and an inherited layer ALSO carried
   `nav.fixed .grid > button { border-radius: 0 }` — it already knew. This
   skin's `999px` shouted that down, and a 999px radius on a 71x58 box clamps
   to an ellipse whose right-hand arc is the only edge drawn: a 58px-tall
   crescent between every pair of tabs, four of them, in the one piece of
   furniture that is on the screen the whole time. The separator is a line,
   so the button that carries it has square corners.
   AND THEN THE SEPARATOR GOES, because it belongs to a different nav. It is
   a July-Heat-era "HUD console segment": the bar was full-bleed and split
   into five cells, and a cell wants an edge. Vol.9's nav is a floating ink
   PILL, 12px clear of each side and 14px off the bottom, and five full-height
   rules inside a stadium read as a segmented control — a thing you drag —
   rather than as five places to go. Five evenly spaced items and a white mark
   on the one you are on is the whole design; the lines were only ever holding
   a shape this volume does not have. */
body nav.fixed.bottom-0.inset-x-0 button,
body nav.fixed.bottom-0.inset-x-0 a {
  color: var(--inactive) !important;
  background: transparent !important;
  border: 0 !important;
  border-radius: 0 !important;
  box-shadow: none !important;
}
/* ALL FIVE TABS RENDERED IDENTICALLY, ON EVERY SCREEN IN THE APP, AND THAT
   IS THIS SKIN'S DOING. The app marks the tab you are on perfectly well — it
   writes `color: rgb(247,241,230)` and `background: rgba(247,241,230,.07)`
   INLINE on that one button and a rose colour on the other four — and the
   rule above paints every button `var(--inactive)` on a transparent ground
   with `!important`, which beats an inline declaration that has no priority
   of its own. So the marker was being painted out four lines after the app
   drew it, and the nav said nothing about where you were.
   The four guesses it was caught by (`[aria-current]`, `.active`,
   `[data-active]`, `.text-white`) match NOTHING in this build. Guessing how a
   three-volume-old component marks itself is how the marker went missing; the
   selector is now the thing the app actually writes.
   Measured before: all five `rgb(203,189,182)`, no fill, no pseudo-element.
   A FILL, NOT A COLOUR SHIFT. Ivory-on-ink against rose-on-ink is a tonal
   step you have to hunt for on a lit phone beside a court; a filled stadium
   is the one tab you can find without looking for it. 999px is right here and
   is not the ellipse the tabs were warned about above: that was a 999px on a
   box with only its RIGHT EDGE drawn, and this is a filled 71x58, which
   clamps to a 29px stadium. */
body nav.fixed.bottom-0.inset-x-0 button[style*="rgb(247, 241, 230)"],
body nav.fixed.bottom-0.inset-x-0 a[style*="rgb(247, 241, 230)"],
body nav.fixed.bottom-0.inset-x-0 [aria-current],
body nav.fixed.bottom-0.inset-x-0 [data-active="true"] {
  color: #FFFFFF !important;
  background: rgba(247, 241, 230, .14) !important;
  border-radius: 999px !important;
}

/* ── 7 · THE HEADER, AND TYPE ON RED ───────────────────────────────────
   The header is `.sticky.top-0`. It sits under the masar band, so it takes
   the base red rather than a blur of whatever scrolled under it.

   There is no dark-on-red pairing that clears 4.5:1, so type on the base is
   white or rose and never ink. Ink appears only ON ivory, or as a fill
   carrying white text.
   ────────────────────────────────────────────────────────────────────── */
header, .sticky.top-0 {
  background: var(--bg) !important;
  border-bottom: 1px solid rgba(247,241,230,.18) !important;
  backdrop-filter: none !important;
  /* THE BAND LIVES IN THIS PADDING. It is the header's ::before at top 7,
     24 tall, so it ends at 31 — and the handoff puts it above the lockup, not
     behind it. 44 leaves 13px between the weave and the club mark; at the old
     34 the two were 3px apart, which reads as a collision rather than a trim.
     If the band's height or offset moves, this moves with it. */
  padding-top: 44px !important;
  /* ...and 30 at the foot, because the masar strip is drawn INSIDE the header
     as a pseudo-element: without room made for it the weave sat straight
     across the Arabic line. A ::after is not a text run and not a box in
     flow, so neither the clipped check nor the overlap check could see it. */
  padding-bottom: 20px !important;
  transition: padding-top .18s ease, padding-bottom .18s ease;
}

/* ── THE HEADER COLLAPSES ONCE YOU SCROLL ───────────────────────────────
   Measured: 44 (the band's room) + 58 (the brand row) + 20 + border = 128px,
   and the floating nav is another 68 with its 14px gap. That is 209px of
   chrome — 25% of an 844px phone and 31% of a 667px one — gone before a
   single word of the page. It is also a header that is 128px tall and STILL
   truncates its own title to "56 NATIONAL S…".
   The band is the top of the PAGE, not a permanent fixture: the handoff puts
   it above the header as item one of the screen. So it is drawn in full at
   rest and folded away the moment the page moves, along with half the
   padding and a smaller club mark. 128px → 66px, which gives back 62px on
   every screen in the app.
   The header stays `sticky` throughout — the brand bar leaving is the exact
   fault SABOTAGE=unstick exists to catch, and this must not reintroduce it. */
html[data-scrolled="1"] header,
html[data-scrolled="1"] .sticky.top-0 {
  padding-top: 8px !important;
  padding-bottom: 10px !important;
}
html[data-scrolled="1"] header::before,
html[data-scrolled="1"] .sticky.top-0::before {
  opacity: 0;
  transition: opacity .18s ease;
}
header::before, .sticky.top-0::before { transition: opacity .18s ease; }
/* !important, because the rule that pins the club mark's height carries it —
   see the note above about `height:auto` on a portrait mark. */
/* MAX-HEIGHT, NOT HEIGHT. The mark carries an inline `height: 44px` and an
   inherited `header img { height: auto }`, and between them it renders at 40
   — so a `height` of my own is one more voice in an argument that is already
   not resolving the way anything says it should. A max-height cannot be
   argued with: whatever wins, the box is no taller than this. */
html[data-scrolled="1"] header button[aria-label="Urban Playground"] img {
  max-height: 30px !important;
}
header button[aria-label="Urban Playground"] img {
  transition: max-height .18s ease, height .18s ease;
}
/* The sub-line is identity, not navigation, and it is the difference between
   a 46px row and a 58px one. The volume's name stays: that is the thing that
   tells you which app you are looking at. Shrinking it to 15px also stops it
   truncating, which it does at rest — "56 NATIONAL S…" in a 128px header. */
/* Once folded, the 44px touch boxes are the tallest thing in the row, so they
   pull in further. The box stays 44 for the thumb; only the space it claims
   in the layout shrinks. */
html[data-scrolled="1"] header button,
html[data-scrolled="1"] .sticky.top-0 button { margin-block: -11px; }
/* The flag plaque is the tallest thing left in a folded row, so it folds too
   — the same proportions at a smaller size, never a different shape. */
html[data-scrolled="1"] .na-flag:not([data-a]):not([data-b]):not([data-c]) {
  padding: 2px 6px 2px 10px;
  font-size: 15px;
}
html[data-scrolled="1"] .na-flag span { font-size: 15px !important; }
/* ...and then it goes, because the row still could not fit its own title.
   "56 NATIONAL S…" in a folded header is the same fault as in an unfolded
   one, and the plaque is a 56 sitting two inches from a title that starts
   with the word 56. The club mark stays — it is the thing that is NOT
   written anywhere else in the bar. */
html[data-scrolled="1"] .na-flag { display: none !important; }
html[data-scrolled="1"] .na-brand-sub { display: none !important; }
html[data-scrolled="1"] .na-brand-name { font-size: 15px !important; }
/* 19px at rest, not 20. The row is four pixels short of its own title after
   the club mark's box grew, and a volume name that ellipsises on every
   screen is a worse trade than one point of type — the handoff's floor is
   11px and this is nowhere near it. */
.na-brand-name { font-size: 19px !important; transition: font-size .18s ease; }

/* ── TAP TARGETS ────────────────────────────────────────────────────────
   The club mark's button measured 26x40 and the SYNCED pill 83x29, both
   under the 44px every mobile guideline asks for — and the mark is also the
   only route into staff sign-in, so the smallest target in the app is the
   one a scorer has to hit before they can score. The box grows, not the
   artwork: the brand row is 58px tall at rest, so nothing moves until the
   header is collapsed, where the row becomes the 44 it should always have
   been.
   THE NEGATIVE MARGIN IS THE WHOLE TRICK. A bare `min-height: 44px` grew the
   brand row from 58px to 68 and made the header TALLER — undoing the point of
   the rule above it. The club mark already pulls itself in by 4px a side for
   the same reason, so the buttons do the same: the touch box is 44, the box
   the row lays out is 32, and the header does not move. */
header button, .sticky.top-0 button {
  min-height: 44px;
  margin-block: -6px;
  display: inline-flex; align-items: center; justify-content: center;
}
/* THE CLUB MARK'S TOUCH BOX GROWS SIDEWAYS WITHOUT TAKING THE ROOM, by the
   same trick the heights use. A plain `min-width: 44px` widened the cell
   from 26 to 44 and took 18px out of the one cell that was already short —
   "56 NATIONAL SERIES" needed 179px in 171 and ellipsised on every screen in
   the app. Padding makes the box 44 wide for the thumb; the matching
   negative margin hands the 18px straight back to the title. */
header button[aria-label="Urban Playground"] {
  padding-inline: 9px; margin-inline: -9px;
}
header .flex.items-center.gap-3.min-w-0 { gap: 8px !important; }
/* ...and the same floor inside a night, which is where the organiser spends
   the evening. The chip row (GROUPS / TEAMS / KO / LIST / PHOTOS / MVP /
   POSTS / LINE-UP) drew at 36px and the back arrow out of a session at
   30x30 — the control you need when you are holding a phone in one hand and
   a racket in the other. These grow for real, because there is room: they
   are in the body, not in a bar whose height is the thing being defended. */
.jh-chipbtn { min-height: 44px; }
/* Every control inside a full-screen layer — the open session, the recap,
   the share sheets. Chasing them one class at a time missed four of seven,
   and these are all actions in a sheet rather than rows in a table, so the
   floor is safe to apply at the layer. min-width as well, for the icon-only
   ones: the back arrow drew 30x30 and carries no text to widen it. */
body .fixed.inset-0 button { min-height: 44px; min-width: 44px; }
/* ...and the sheets that declare `position: fixed; inset: 0` INLINE rather
   than through the utility classes — the recap, the share sheets, the
   pickers. They are the same kind of layer and the class selector cannot
   see them, which left the recap's MY NIGHT / EVERYONE toggle at 37px. */
body [style*="position: fixed"][style*="inset: 0"] button {
  min-height: 44px; min-width: 44px;
}
/* AND THE FIELDS, NOT JUST THE BUTTONS. The signup list is sixteen text
   inputs that the organiser types names into on a phone, and they drew 22 and
   23px tall — half the floor, on the screen whose entire job is typing. It
   went unseen because nothing had ever opened that screen: the harness's
   sub-screen sweep matched a fixed list of labels and LIST was not in it, so
   the one screen made of fields was the one screen never measured. Found the
   moment the list was added to that sweep, which is the argument for the
   sweep being a sweep. */
body .fixed.inset-0 input, body .fixed.inset-0 select, body .fixed.inset-0 textarea,
body [style*="position: fixed"][style*="inset: 0"] input,
body [style*="position: fixed"][style*="inset: 0"] select {
  min-height: 44px;
}

/* ── THE OPEN NIGHT'S CHROME ───────────────────────────────────────────
   THE PAGE SCROLLED VISIBLY THROUGH THE HEADER. The night's bar is
   `rgba(158,21,32,.95)` under a `backdrop-blur-xl` — which is Vol.8's
   chrome, and this skin correctly takes the blur off everything. A blurred
   translucent bar is a material; an UNBLURRED one is just see-through, and
   5% of a table scrolling past is perfectly legible: GROUP STAGE and
   18 / 24 MATCHES read straight through "Session 1" in the screenshot. The
   chip block under it is 3% and does the same thing more quietly.
   Opaque, both, and the blur stays off. This is the general rule and not a
   one-off: if the blur goes, the alpha has to go with it.
   ────────────────────────────────────────────────────────────────────── */
body .fixed.inset-0 .sticky.top-0 { background: var(--deep) !important; }
body .fixed.inset-0 .sticky[class*="top-["] { background: var(--bg) !important; }

/* ...AND THE CHIP BLOCK WAS PINNED TO A NUMBER THAT WAS NEVER RIGHT.
   `sticky top-[57px]` against a header that is 109px open and 63px folded:
   it rides 52px INTO the header until the fold fires, and then sits 5px
   inside its bottom edge, which is the masar strip landing on the chips.
   Equal z-index and later in the DOM, so the chips paint over the header
   rather than the other way round — a title with a tab bar through it.
   The header's height is a function of the fold, the width and the night's
   own title, so it cannot be written down. `--na-sesshead` is measured and
   published by the same boot script that measures the save banner, for the
   same reason. The fallback is the folded height, which is the state the
   bar is in for all but the first few pixels of a scroll. */
body .fixed.inset-0 .sticky[class*="top-["] {
  top: var(--na-sesshead, 63px) !important;
}

/* ONLY THE DESTINATIONS ARE PINNED. The block holds two rows — where in the
   night you are, and four occasional actions (PHOTOS, POSTS, LINE-UP,
   SHARE) — and both were stuck to the top for the whole evening. Measured on
   the open night: 63px of header plus 119px of chips, and a floating nav
   that costs another 82, is **264px of a 667px phone gone before a word of
   the table** — 40%, permanently, on the screen somebody holds for three
   hours. The destination row earns its place because it is how you move
   around the night; the actions are tapped once and are worth 55px of every
   screen all night. They scroll away with the page now and come back at the
   top, which is where you go looking for them anyway.
   A STICKY CHILD CANNOT ESCAPE ITS PARENT'S BOX, so the obvious CSS version
   of this — unstick the wrapper, stick the row inside it — made the row
   scroll clean off the top (measured: pinned at -231px). The wrapper closes
   after the destination row in the markup instead; see 5g5 in the builder.
   What is left here is the wrapper's bottom padding, which belonged to a row
   that is no longer inside it. */
body .fixed.inset-0 .sticky[class*="top-["] { padding-bottom: 8px !important; }
/* THE CLUB MARK IS PORTRAIT, AND `height:auto` IS WHAT BROKE THE HEADER.
   up-logo-tight.png is 324x505 and the JSX sets it `height:44; width:auto`,
   which is 28px wide — fine. An earlier line here read
   `header img { max-width:100%; height:auto }`, written for the Blackout
   WORDMARK (3100x840, which really did run off the right-hand side). On a
   portrait mark that same rule threw the inline height away, let the image
   take its natural width and capped it at the container: the button became
   152px of a 428px row, the volume name was squeezed to 81px for a line that
   needs ~195, and the ellipsis fired on a header that had simply run out of
   bar. Capping the WIDTH then made it 96x150 — a logo three times the height
   of the header.
   So the height is pinned and the width follows it, which is what the markup
   asked for in the first place. The generic rule keeps the job it was written
   for — never wider than the bar — and stops touching the height. */
header img, .sticky.top-0 img { max-width: 100%; object-fit: contain; }
header button.shrink-0 img, .sticky.top-0 button.shrink-0 img {
  height: 40px !important; width: auto !important; max-width: none !important;
}

/* The name's box is a plain flex item with no grow, so it took its share of
   whatever was left rather than the room it needs. With the mark back to 26px
   there is plenty: ~250px against the ~195 the name wants and the 176 the
   line under it wants. The ellipsis stays as the backstop for a longer volume
   name later, and the overlap check in ops/check-national-skin.mjs is what
   proves the two are not touching — measured on the live header with a Range,
   because nowrap text that is wider than its box does not widen the box and
   every width assertion passes while the words sit on each other. */
header .max-w-3xl > div, .sticky.top-0 .max-w-3xl > div { gap: 10px !important; }
header .min-w-0, .sticky.top-0 .min-w-0,
header [style*="min-width: 0"], .sticky.top-0 [style*="min-width: 0"] {
  flex: 1 1 auto !important; min-width: 0 !important;
}
/* 17px, measured: the name renders 252px at the inherited 20px — a clone
   measured outside the header said 203, which is why the number here comes
   from what the overlap check reads off the live bar and not from arithmetic.
   The "56" mark took 32px back and the flag plaque behind it another 14, so
   it is 13px: measured on the live bar it needs 179 of the 190 it has. Every
   one of those numbers came off the rendered header, never off arithmetic —
   a clone measured outside it under-reported the width by twenty pixels. The harness asserts no run is ellipsised —
   a backstop that fires is a layout that did not fit, and it is invisible to
   every other check here because clipping is what ellipsis does INSTEAD of
   overflowing. */
header [style*="min-width: 0"] > div:first-child,
.sticky.top-0 [style*="min-width: 0"] > div:first-child {
  font-size: 13px !important;
  overflow: hidden; text-overflow: ellipsis;
}
header [style*="min-width: 0"] > div:last-child,
.sticky.top-0 [style*="min-width: 0"] > div:last-child {
  overflow: hidden; text-overflow: ellipsis;
}

/* THE HEADER'S MICRO-CAPS GO IVORY, NOT ROSE. Rose on the base red is 3.64:1
   and inactive is 3.91:1 — both fine as a LABEL beside something, which is the
   job the handoff gives them, and both under AA for an 11px run that is the
   only thing in its box. "URBAN SOCIAL SERIES · VOL.9" and "SYNCED" are the
   two, and they are the first and last thing on every screen. Ivory on the
   base is 5.8:1.
   Matched on the literals the JSX sets inline, in both notations React can
   emit, because these are inline styles and nothing else in the sheet can
   outrank them without !important. */
header [style*="#CBBDB6"], .sticky.top-0 [style*="#CBBDB6"],
header [style*="203, 189, 182"], .sticky.top-0 [style*="203, 189, 182"],
header [style*="#F2B8BC"], .sticky.top-0 [style*="#F2B8BC"],
header [style*="242, 184, 188"], .sticky.top-0 [style*="242, 184, 188"] {
  color: var(--ivory) !important;
}
/* ...but not the status dot, which is a 6px square of colour and carries no
   type at all — turning it ivory removes the one thing that distinguishes
   SYNCING from SYNCED. */
header [style*="border-radius: 50%"], .sticky.top-0 [style*="borderRadius"] {
  color: inherit !important;
}

body { color: #FFFFFF; }

/* THE TWO READABLE TIERS, AND ROSE IS NOT ONE OF THEM. The handoff gives rose
   as "labels on red", and as a label beside something it is fine — but the app
   uses its muted tone for whole sentences ("Standings appear after the first
   match", "Pick your name once and this screen is yours"), and rose on the
   base is 3.64:1. Measured on #B8141F: ivory 5.83:1, --rose-txt 4.72:1,
   inactive 4.40:1, rose 3.64:1. So copy is ivory or --rose-txt, and rose keeps
   the jobs that are not type — dots, rules, fills.
   The sweep re-points the literals it can see in the stylesheets; this catches
   the ones written INLINE, which nothing can outrank without !important.
   The hero's own rules are above this and more specific (0,2,0 against 0,1,0),
   so an ivory hero still flips its copy to ink. */
.text-stone-300, .text-stone-400, .text-stone-500, .text-stone-600,
.text-neutral-300, .text-neutral-400, .text-neutral-500,
.text-gray-300, .text-gray-400, .text-gray-500 { color: var(--rose-txt) !important; }
/* ...AND IT MUST MATCH THE COLOUR AS *INK*, NOT ANYWHERE IN THE ATTRIBUTE.
   `[style*="242, 184, 188"]` cannot tell `color: rgb(242,184,188)` from
   `background: rgb(242,184,188)` — it only sees the number somewhere in the
   style attribute. The avatar fallback paints a tinted disc and picks its own
   contrasting ink by luminance; this rule beat that inline choice with
   !important and set the initials to --rose-txt on a rose disc: **1.19:1**,
   no letter at all, on roughly a third of the photo-less avatars in a
   340-name roster.
   A blunt `:not([style*="background"])` guard fixed that and broke two more
   things, which is why it is not that: it also excluded every element that
   legitimately needs the upgrade AND happens to set a background — the
   session row's 2X pill, rose on a red fill at 4.16:1 — and it took the rule
   from (0,1,0) to (0,2,0), tying the scoped ivory overrides and beating them
   on source order, which blanked the hero's own figures at 1.23:1.
   The discriminator is the serialised declaration itself. The CSSOM
   normalises inline colours to `rgb(...)`, so ink is `color: rgb(…)` and the
   avatar's shorthand fill is `background: rgb(…)`, which does not contain
   `color:`. `background-color:` does, and is excluded by name.
   The scoped overrides carry `body` so they stay ahead of this at (0,2,1). */
[style*="color: rgb(242, 184, 188)"]:not([style*="background-color: rgb(242, 184, 188)"]),
[style*="color: rgb(203, 189, 182)"]:not([style*="background-color: rgb(203, 189, 182)"]) {
  color: var(--rose-txt) !important;
}

/* THE NATIONAL DAY PILL, to the handoff's own spec: a green pill carrying the
   date, the name in italic caps and the Arabic, with a white 2X disc on the
   right. The markup is in build-national-app.py — a stylesheet cannot add a
   block the app does not have.
   This is the ONLY place the flag's green is spent, and that is the point:
   green on a red screen reads as an occasion exactly as long as there is one
   occasion wearing it. */
.na-natday {
  display: flex; align-items: center; gap: 16px;
  background: var(--green) !important;
  border-radius: 999px !important;
  padding: 14px 14px 14px 24px;
  margin-top: 16px;
}
.na-natday-when {
  font-family: 'JetBrains Mono', monospace; font-weight: 700;
  font-size: 11px; letter-spacing: .16em; color: #FFFFFF;
}
.na-natday-title {
  font-family: 'Archivo', sans-serif; font-style: italic;
  font-variation-settings: 'wdth' 118, 'wght' 900;
  font-size: 19px; text-transform: uppercase; color: #FFFFFF;
  margin-top: 3px; white-space: nowrap;
}
.na-natday-ar {
  font-family: 'Noto Kufi Arabic', sans-serif; font-weight: 700;
  font-size: 12px; color: rgba(255,255,255,.88); margin-top: 3px;
}
/* 52px, and a CIRCLE — it needs the same :not() chain everything round in
   this skin needs, or the inherited universal radius rule makes it a
   rounded square. */
.na-natday-2x:not([data-a]):not([data-b]):not([data-c]) {
  flex: 0 0 auto; width: 52px; height: 52px; border-radius: 50% !important;
  background: #FFFFFF; color: var(--green);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Archivo', sans-serif; font-style: italic;
  font-variation-settings: 'wdth' 125, 'wght' 900; font-size: 21px;
}

/* ── 8 · NATIONAL DAY ──────────────────────────────────────────────────
   The flag's green, and it means the 18th. It is applied by the app on a
   2X session and nowhere else; spend it on ordinary urgency and the night
   it belongs to stops meaning anything.
   ────────────────────────────────────────────────────────────────────── */
.national-day, [data-double="true"] {
  background: var(--green) !important;
  color: #FFFFFF !important;
  border-radius: 999px !important;
}


/* ── 9 · MINIMUM TYPE SIZE ─────────────────────────────────────────────
   The handoff sets a floor of 11px and the app runs 8px and 9px caps — a
   Blackout habit that worked on flat black and does not on a red ground
   with a tile over it. Raised rather than redesigned: the labels keep their
   tracking and their place, they just stop being unreadable.
   ────────────────────────────────────────────────────────────────────── */
[style*="fontSize:8"], [style*="fontSize: 8"],
[style*="font-size:8px"], [style*="font-size: 8px"] { font-size: 11px !important; }
[style*="fontSize:9"], [style*="fontSize: 9"],
[style*="font-size:9px"], [style*="font-size: 9px"] { font-size: 11px !important; }
[style*="fontSize:10"], [style*="font-size:10px"] { font-size: 11px !important; }
.text-\[8px\], .text-\[9px\], .text-\[10px\] { font-size: 11px !important; }

/* ── THE OPEN SESSION STARTS BELOW THE SAVE BANNER ──────────────────────
   The banner is `sticky; top:0; z-index:50`; the open session is
   `fixed inset-0 z-40`. So the banner paints over the session's own header,
   and the BACK ARROW out of a night lives in that header — with a failed
   save showing, the organiser could not leave the screen they were stuck
   on. That is the worst possible moment for it, and it is the one state the
   banner exists for.
   The banner is right to be on top: its whole job is to be impossible to
   miss. The overlay just has to begin underneath it. The height cannot be
   written down — the banner wraps to two or three lines depending on the
   width and on whether it is retrying — so the boot script measures it and
   publishes it here. With no banner the property is 0px and nothing moves. */
body .fixed.inset-0.z-40 { top: var(--na-banner, 0px); }

/* ── HOME IS A DASHBOARD ONCE THERE IS A SEASON TO REPORT ON ────────────
   The season poster is the right thing to open on when nothing has been
   played: it IS the news. The moment a night exists it stops being news and
   starts being an advertisement for something you are already in the middle
   of — measured, it was the first 900px of a 2,019px screen, with the live
   table, your own standing and the next night all underneath it.
   So the column becomes a flex column and the poster takes an order. Nothing
   is moved in the markup and nothing is hidden; the blocks that were already
