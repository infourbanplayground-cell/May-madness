<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Muscat Heist · preview</title>

<style>/* MUSCAT HEIST · Vol.10 — tokens and the shared components.
   The :root block is the handoff's tokens/tokens.css, verbatim except:
     - no Google @import (the faces are vendored: brand/fonts + brand/heist/fonts)
     - no Arabic face (the owner removed the Arabic name, 22 Nov 2026)
     - a few extra tokens at the end, each a value the handoff's own static
       design uses inline (the art tint, the fades, the band's shadow), so no
       component below carries a colour of its own.
   EVERY colour in this file and in the components comes from :root. */
:root {
  /* colour */
  --mn-navy: #0F1B2B;
  --mn-navy-2: #13202F;
  --mn-sand: #FFF4E8;
  --mn-peach: #FFC9A3;
  --mn-coral: #F26B5B;
  --mn-coral-2: #F59A62;
  --mn-gold: #FFD08A;
  --mn-teal: #2FB7B0;
  --mn-rose: #E9849A;
  --mn-mist: #B9C6D3;
  --mn-dim: #7F8EA0;
  --mn-red: #E5484D;
  --mn-silver: #D7DDE4;
  --mn-bronze: #D9A27A;
  --mn-line: rgba(255,244,232,.10);
  --mn-line-2: rgba(255,244,232,.18);

  --mn-grad-primary: linear-gradient(135deg, var(--mn-coral), var(--mn-coral-2));
  /* the static design draws the band to #F5895E, not coral-2; the screenshots are the target */
  --mn-grad-nights: linear-gradient(90deg, var(--mn-coral), #F5895E);
  --mn-grad-title: linear-gradient(180deg, #FFFBF5 0%, var(--mn-sand) 55%, var(--mn-peach) 100%);
  --mn-sky: linear-gradient(180deg,#24456E 0%,#6B5B8E 30%,#E07C8E 52%,#F6A06B 72%,#FFD39A 90%);

  --mn-glass-bg: rgba(15,27,43,.62);
  --mn-glass-border: 1px solid rgba(255,244,232,.18);
  --mn-glass-blur: blur(14px);

  --mn-tier-legend: linear-gradient(135deg,#FFD08A,#F59A62 50%,#FFD08A);
  --mn-tier-elite: linear-gradient(135deg,#F26B5B,#E9849A);
  --mn-tier-pro: linear-gradient(135deg,#2FB7B0,#2A7FA8);
  --mn-tier-street: linear-gradient(135deg,#5A6B80,#B9C6D3);

  --mn-rep-rookie: var(--mn-dim);
  --mn-rep-rising: var(--mn-teal);
  --mn-rep-known: var(--mn-coral);
  --mn-rep-legend: var(--mn-gold);

  --mn-font-display: 'Archivo', Impact, sans-serif;
  --mn-display-axes: 'wdth' 66;
  --mn-font-serif: 'Fraunces', Georgia, serif;
  --mn-serif-axes: 'SOFT' 100, 'WONK' 1;
  --mn-font-ui: 'Manrope', system-ui, sans-serif;
  --mn-font-mono: 'JetBrains Mono', monospace;

  --mn-r-card: 14px;
  --mn-r-hero: 16px;
  --mn-r-pill: 999px;
  --mn-r-nav: 20px;

  --mn-shadow-card: 0 14px 30px rgba(0,0,0,.40);
  --mn-shadow-title: 0 3px 0 rgba(15,27,43,.55), 0 10px 22px rgba(0,0,0,.45);

  --mn-cut-hero: polygon(0 0,100% 0,100% 82%,0 96%);
  --mn-keyline: 3px solid var(--mn-sand);

  --mn-s1: 4px; --mn-s2: 8px; --mn-s3: 12px; --mn-s4: 16px; --mn-s5: 20px; --mn-s6: 24px;
  --mn-page-x: 20px;
  --mn-min-text: 11px;

  /* — added: values the static design uses inline, named once — */
  --mn-art-filter: saturate(1.08) contrast(1.05);
  --mn-art-tint: linear-gradient(180deg, rgba(255,140,90,.12), rgba(20,60,90,.22));
  --mn-hero-fade: linear-gradient(180deg, rgba(15,27,43,.45), rgba(15,27,43,0) 22%, rgba(15,27,43,0) 50%, rgba(15,27,43,.85) 92%);
  --mn-card-fade: linear-gradient(180deg, rgba(19,32,47,0) 55%, var(--mn-navy-2));
  --mn-foil: linear-gradient(115deg, transparent 25%, rgba(255,244,232,.35) 40%, rgba(255,201,163,.3) 48%, transparent 62%);
  --mn-sun: radial-gradient(circle, rgba(255,201,163,.55), rgba(242,107,91,.25) 45%, rgba(242,107,91,0) 70%);
  --mn-band-shadow: 0 8px 20px rgba(0,0,0,.4);
  --mn-keyline-shadow: drop-shadow(0 0 5px rgba(0,0,0,.35));
  --mn-text-glow: 0 2px 8px rgba(0,0,0,.6);
  --mn-tag-bg: rgba(15,27,43,.75);
  --mn-scene-bg: rgba(15,27,43,.72);
  --mn-nav-bg: rgba(15,27,43,.78);
  --mn-nav-border: 1px solid rgba(255,244,232,.14);
  --mn-pill-border: 1px solid rgba(255,244,232,.25);
  --mn-ghost-border: 1.5px solid rgba(255,244,232,.35);
  --mn-track: rgba(255,244,232,.12);
  --mn-billing: rgba(255,244,232,.72);
  --mn-billing-dim: rgba(255,244,232,.45);
  --mn-title-filter: drop-shadow(0 3px 0 rgba(15,27,43,.55)) drop-shadow(0 10px 22px rgba(0,0,0,.45));
  --mn-rank-glow: 0 2px 8px rgba(0,0,0,.5);
  --mn-teal-45: rgba(47,183,176,.45);
  --mn-teal-60: rgba(47,183,176,.6);
  --mn-teal-20: rgba(47,183,176,.2);
  --mn-teal-16: rgba(47,183,176,.16);
  --mn-coral-14: rgba(242,107,91,.14);
  --mn-coral-50: rgba(242,107,91,.5);
  --mn-gold-45: rgba(255,208,138,.45);
  --mn-gold-70: rgba(255,208,138,.7);
  --mn-faint: rgba(255,244,232,.15);
  --mn-leader-fade: linear-gradient(90deg, rgba(15,27,43,.88), rgba(15,27,43,0) 65%);
  --mn-grad-progress: linear-gradient(90deg, var(--mn-teal), var(--mn-coral));
  --mn-grad-meter: linear-gradient(90deg, var(--mn-teal), var(--mn-peach));
  /* phase 3 — the night */
  --mn-fade-session: linear-gradient(180deg, rgba(15,27,43,.5), rgba(15,27,43,0) 40%, rgba(15,27,43,.8));
  --mn-fade-live: linear-gradient(180deg, rgba(15,27,43,.4), rgba(15,27,43,0) 35%, rgba(15,27,43,.75));
  --mn-fade-recap: linear-gradient(180deg, rgba(15,27,43,.4), rgba(15,27,43,0) 35%, rgba(15,27,43,.85));
  --mn-fade-slides: linear-gradient(180deg, rgba(15,27,43,.6), rgba(15,27,43,.1) 30%, rgba(15,27,43,.92) 80%);
  --mn-row-line: 1px solid rgba(255,244,232,.08);
  --mn-peach-50: rgba(255,201,163,.5);
  --mn-teal-50: rgba(47,183,176,.5);
  --mn-chip-bg: rgba(15,27,43,.6);
  --mn-seg-off: rgba(255,244,232,.3);
  --mn-slide-ring: 0 0 0 4px var(--mn-peach), 0 12px 30px rgba(0,0,0,.5);
  /* phase 4 — the moments */
  --mn-fade-none: none;
  --mn-fade-settled: linear-gradient(180deg, rgba(15,27,43,.3), rgba(15,27,43,0) 35%, rgba(15,27,43,.9));
  --mn-fade-finale: linear-gradient(180deg, rgba(15,27,43,.5), rgba(229,72,77,.12) 50%, rgba(15,27,43,.9));
  --mn-fade-split: linear-gradient(180deg, rgba(15,27,43,.4), rgba(15,27,43,0) 30%, rgba(15,27,43,0) 60%, var(--mn-navy));
  --mn-settled-filter: grayscale(.2);
  --mn-gold-50: rgba(255,208,138,.5);
  --mn-rule-bg: rgba(255,244,232,.05);
  --mn-shout-shadow: 0 6px 24px rgba(0,0,0,.5);
  --mn-grad-load: linear-gradient(90deg, var(--mn-coral), var(--mn-peach));
  --mn-grad-lead: linear-gradient(90deg, var(--mn-red), var(--mn-coral));
  /* phase 5 — the stories */
  --mn-story-foot: linear-gradient(180deg, rgba(15,27,43,0), rgba(15,27,43,.88) 45%, var(--mn-navy));
  --mn-story-back: linear-gradient(180deg, rgba(15,27,43,.55), rgba(15,27,43,.05) 30%, rgba(15,27,43,.35) 55%, rgba(15,27,43,.95) 82%);
  --mn-story-panel: linear-gradient(180deg, rgba(15,27,43,0) 55%, rgba(15,27,43,.9));
  --mn-story-shadow: 0 2px 12px rgba(0,0,0,.5);
  --mn-logo-shadow: drop-shadow(0 2px 6px rgba(0,0,0,.6));
}

/* ── type helpers (the handoff's own) ─────────────────────────────────── */
.mn-display { font-family: var(--mn-font-display); font-variation-settings: var(--mn-display-axes); font-weight: 900; text-transform: uppercase; line-height: .86; color: var(--mn-sand); }
.mn-serif   { font-family: var(--mn-font-serif); font-variation-settings: var(--mn-serif-axes); font-style: italic; color: var(--mn-mist); }
.mn-label   { font-family: var(--mn-font-mono); font-weight: 500; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--mn-mist); }
.mn-glass   { position: relative; background: var(--mn-glass-bg); border: var(--mn-glass-border); border-radius: var(--mn-r-card); backdrop-filter: var(--mn-glass-blur); -webkit-backdrop-filter: var(--mn-glass-blur); padding: 14px 16px; }
.mn-glass[data-accent="peach"] { border-color: var(--mn-peach); }
.mn-glass[data-accent="teal"]  { border-color: var(--mn-teal); }
.mn-glass[data-accent="gold"]  { border-color: var(--mn-gold); }
.mn-glass[data-accent="coral"] { border-color: var(--mn-coral); }

/* ── buttons ──────────────────────────────────────────────────────────── */
.mn-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 18px; cursor: pointer; border: 0; text-decoration: none; }
.mn-btn-primary { background: var(--mn-grad-primary); color: var(--mn-navy); border-radius: var(--mn-r-card); font-family: var(--mn-font-display); font-variation-settings: var(--mn-display-axes); font-weight: 900; letter-spacing: .06em; min-height: 48px; font-size: 17px; text-transform: uppercase; }
.mn-btn-ghost   { background: transparent; border: var(--mn-ghost-border); color: var(--mn-sand); border-radius: var(--mn-r-card); min-height: 48px; font-family: var(--mn-font-display); font-variation-settings: var(--mn-display-axes); font-weight: 900; letter-spacing: .06em; font-size: 17px; text-transform: uppercase; }
.mn-btn-light   { background: var(--mn-sand); color: var(--mn-navy); border-radius: var(--mn-r-card); min-height: 48px; font-family: var(--mn-font-ui); font-weight: 700; font-size: 15px; }
.mn-btn[data-size="live"] { min-height: 56px; }
.mn-btn:focus-visible, .mn-pill:focus-visible, .mn-navtab:focus-visible { outline: 2px solid var(--mn-peach); outline-offset: 2px; }

/* ── pills ────────────────────────────────────────────────────────────── */
/* the row scrolls sideways, which clips; the drawn pill is 32px and the row it
   leaves after the 44px target's -7px margins is 30, so the outline lost a
   pixel or two top and bottom on every pill row. 4px of room, taken back outside. */
.mn-pills { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 4px 0; margin: -4px 0; }
.mn-pills::-webkit-scrollbar { display: none; }
/* the visible pill is the handoff's 32px chip; the button around it is 44px
   tall so the target meets the floor without changing what is drawn */
.mn-pill { flex: 0 0 auto; min-height: 44px; min-width: 44px; justify-content: center; margin: -7px 0; display: inline-flex; align-items: center; background: none; border: 0; padding: 0; cursor: pointer; }
.mn-pill > span { display: inline-flex; align-items: center; padding: 7px 12px; border-radius: var(--mn-r-pill); border: var(--mn-pill-border); color: var(--mn-mist); font-family: var(--mn-font-ui); font-weight: 600; font-size: 12px; }
.mn-pill[aria-pressed="true"] > span, .mn-pill[aria-selected="true"] > span { background: var(--mn-sand); border-color: var(--mn-sand); color: var(--mn-navy); }
.mn-pill[data-round] { min-width: 44px; justify-content: center; }
.mn-pill[data-round] > span { width: 32px; height: 32px; padding: 0; justify-content: center; }

/* ── bottom nav ───────────────────────────────────────────────────────── */
.mn-nav { position: fixed; left: 14px; right: 14px; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 40; padding: 10px 8px; display: flex; justify-content: space-around; background: var(--mn-nav-bg); border: var(--mn-nav-border); border-radius: var(--mn-r-nav); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
.mn-navtab { min-height: 44px; min-width: 44px; margin: -7px 0; display: inline-flex; align-items: center; justify-content: center; background: none; border: 0; padding: 0; cursor: pointer; }
.mn-navtab > span { padding: 7px 12px; border-radius: 12px; color: var(--mn-mist); font-family: var(--mn-font-ui); font-weight: 600; font-size: 12px; }
.mn-navtab[aria-current="page"] > span { background: var(--mn-sand); color: var(--mn-navy); }

/* ── top bar ──────────────────────────────────────────────────────────── */
.mn-topbar { position: absolute; left: 20px; right: 20px; top: 50px; z-index: 6; display: flex; justify-content: space-between; align-items: center; }
.mn-topbar img { height: 28px; }
.mn-topbar .mn-serif { font-size: 16px; color: var(--mn-sand); }

/* ── art: every painting/photo gets the same treatment ────────────────── */
.mn-art { position: absolute; inset: 0; overflow: hidden; }
.mn-art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: var(--mn-art-filter); }
.mn-art::after { content: ""; position: absolute; inset: 0; background: var(--mn-art-tint); mix-blend-mode: soft-light; }
.mn-initials { position: absolute; inset: 0; display: grid; place-items: center; background: var(--mn-navy); font-family: var(--mn-font-display); font-variation-settings: var(--mn-display-axes); font-weight: 900; color: var(--mn-mist); }

/* ── hero cut ─────────────────────────────────────────────────────────── */
.mn-hero { position: relative; overflow: hidden; }
.mn-hero .mn-hero-img { position: absolute; inset: 0; }
.mn-hero .mn-hero-fade { position: absolute; inset: 0; background: var(--mn-hero-fade); }
.mn-hero .mn-keyline { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; filter: var(--mn-keyline-shadow); pointer-events: none; }
.mn-hero .mn-keyline line { stroke: var(--mn-sand); stroke-width: 3; }
.mn-hero[data-gold] .mn-keyline line { stroke: var(--mn-gold); }

/* ── title lockup ─────────────────────────────────────────────────────── */
.mn-lockup { position: relative; display: flex; flex-direction: column; align-items: flex-start; }
.mn-lockup[data-center] { align-items: center; }
.mn-lockup .mn-sun { position: absolute; left: 50%; top: 4px; border-radius: 50%; background: var(--mn-sun); transform: translateX(-50%); pointer-events: none; }
.mn-lockup .mn-presents { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-family: var(--mn-font-serif); font-variation-settings: var(--mn-serif-axes); font-style: italic; color: var(--mn-peach); }
.mn-lockup .mn-presents::before, .mn-lockup .mn-presents::after { content: ""; width: 24px; height: 1px; background: var(--mn-peach); }
.mn-lockup .mn-l1 { position: relative; font-family: var(--mn-font-display); font-variation-settings: var(--mn-display-axes); font-weight: 900; line-height: .84; letter-spacing: -.01em; background: var(--mn-grad-title); -webkit-background-clip: text; background-clip: text; color: transparent; filter: var(--mn-title-filter); }
.mn-lockup .mn-band { position: relative; margin-top: -1px; padding: 4px 14px 3px; background: var(--mn-grad-nights); transform: skewX(-10deg); box-shadow: var(--mn-band-shadow); }
.mn-lockup .mn-band > span { display: block; transform: skewX(10deg); font-family: var(--mn-font-display); font-variation-settings: var(--mn-display-axes); font-weight: 900; line-height: 1; letter-spacing: .32em; padding-left: .32em; color: var(--mn-navy); }
.mn-lockup .mn-meta { position: relative; margin-top: 9px; font-family: var(--mn-font-mono); font-weight: 500; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--mn-sand); text-shadow: var(--mn-text-glow); }

/* ── scene tag ────────────────────────────────────────────────────────── */
.mn-scenetag { display: inline-block; padding: 3px 8px; background: var(--mn-scene-bg); border-left: 2px solid var(--mn-coral); font-family: var(--mn-font-display); font-variation-settings: var(--mn-display-axes); font-weight: 800; font-size: 12px; letter-spacing: .18em; color: var(--mn-sand); text-transform: uppercase; }
.mn-scenetag[data-gold] { border-left-color: var(--mn-gold); color: var(--mn-gold); }

/* ── billing (stories) ────────────────────────────────────────────────── */
.mn-billing { font-family: var(--mn-font-display); font-variation-settings: var(--mn-display-axes); font-weight: 700; font-size: 12px; letter-spacing: .08em; line-height: 1.25; color: var(--mn-billing); text-transform: uppercase; text-align: center; }
.mn-billing i { font-style: normal; color: var(--mn-billing-dim); text-transform: none; }

/* ── crew card ────────────────────────────────────────────────────────── */
.mn-card { flex: 0 0 auto; padding: 4px; border-radius: var(--mn-r-card); box-shadow: var(--mn-shadow-card); background: var(--mn-tier-street); }
.mn-card[data-tier="legend"] { background: var(--mn-tier-legend); }
.mn-card[data-tier="elite"]  { background: var(--mn-tier-elite); }
.mn-card[data-tier="pro"]    { background: var(--mn-tier-pro); }
.mn-card > div { border-radius: 11px; overflow: hidden; background: var(--mn-navy-2); }
.mn-card .mn-card-img { position: relative; }
.mn-card .mn-foil { position: absolute; inset: 0; background: var(--mn-foil); background-size: 250% 100%; mix-blend-mode: overlay; animation: mn-foil 3.2s linear infinite; }
.mn-card .mn-card-fade { position: absolute; inset: 0; background: var(--mn-card-fade); }
.mn-card .mn-tiertag { position: absolute; left: 8px; top: 8px; padding: 2px 7px; border-radius: 6px; background: var(--mn-tag-bg); font-family: var(--mn-font-display); font-variation-settings: var(--mn-display-axes); font-weight: 900; letter-spacing: .1em; color: var(--mn-sand); }
.mn-card .mn-rank { position: absolute; right: 8px; top: 6px; font-family: var(--mn-font-display); font-variation-settings: var(--mn-display-axes); font-weight: 900; color: var(--mn-sand); text-shadow: var(--mn-rank-glow); }
.mn-card .mn-name { font-family: var(--mn-font-display); font-variation-settings: var(--mn-display-axes); font-weight: 900; line-height: 1; color: var(--mn-sand); text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mn-card .mn-repline { display: flex; justify-content: space-between; align-items: baseline; margin-top: 3px; }
.mn-card .mn-rep { font-family: var(--mn-font-mono); font-size: 11px; }
.mn-card .mn-pts { font-family: var(--mn-font-display); font-variation-settings: var(--mn-display-axes); font-weight: 800; color: var(--mn-sand); }
.mn-card .mn-stats { display: flex; flex-direction: column; gap: 5px; margin-top: 6px; }
.mn-card .mn-stat { display: flex; align-items: center; gap: 8px; }
.mn-card .mn-stat > span:first-child { width: 52px; font-family: var(--mn-font-mono); font-size: 11px; color: var(--mn-mist); }
.mn-card .mn-stat > span:nth-child(2) { flex: 1; height: 4px; border-radius: 2px; background: var(--mn-track); overflow: hidden; }
.mn-card .mn-stat > span:nth-child(2) > span { display: block; height: 100%; border-radius: 2px; }
.mn-card .mn-stat > b { min-width: 16px; text-align: right; font-family: var(--mn-font-display); font-variation-settings: var(--mn-display-axes); font-weight: 800; font-size: 13px; color: var(--mn-sand); }
.mn-card[data-tilt] { animation: mn-tilt 6s ease-in-out infinite; }
button.mn-cardbtn { background: none; border: 0; padding: 0; cursor: pointer; border-radius: var(--mn-r-card); }

/* ── avatar ───────────────────────────────────────────────────────────── */
.mn-avatar { position: relative; flex: 0 0 auto; border-radius: 50%; overflow: hidden; background: var(--mn-navy-2); }

/* ── film grain over every screen, as the static design draws it ──────── */
.mn-grain { position: fixed; inset: 0; width: 100%; height: 100%; opacity: .08; mix-blend-mode: overlay; pointer-events: none; z-index: 30; }

/* ── motion ───────────────────────────────────────────────────────────── */
@keyframes mn-foil { 0% { background-position: 120% 0 } 100% { background-position: -120% 0 } }
@keyframes mn-tilt { 0%,100% { transform: perspective(900px) rotateY(-9deg) rotateX(3deg) } 50% { transform: perspective(900px) rotateY(9deg) rotateX(-3deg) } }
@keyframes mn-ring { 0% { transform: scale(.6); opacity: .9 } 100% { transform: scale(2.2); opacity: 0 } }
@keyframes mn-slam { 0% { transform: scale(2.4); opacity: 0 } 60% { transform: scale(.94); opacity: 1 } 100% { transform: scale(1); opacity: 1 } }
@keyframes mn-fill { from { width: 0 } }
.mn-ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid currentColor; animation: mn-ring 2.4s ease-out infinite; }
.mn-ring + .mn-ring { animation-delay: .8s; }
.mn-slam { animation: mn-slam .7s ease-out both; }
.mn-fill { animation: mn-fill .6s ease-out .7s both; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ── the season screens (heist-screens.jsx) ───────────────────────────── */
html, body { margin: 0; background: var(--mn-navy); color: var(--mn-sand); font-family: var(--mn-font-ui); -webkit-font-smoothing: antialiased; }
.mh-page { position: relative; min-height: 100vh; min-height: 100dvh; background: var(--mn-navy); overflow-x: hidden; }
.mh-page .mn-topbar { position: absolute; }
.mh-body { position: relative; z-index: 5; box-sizing: border-box; padding-bottom: 100px !important; }
/* the night's screens carry no nav, so nothing to clear: the footer sits on the glass */
.mh-body[data-bare] { padding-bottom: 0 !important; }
.mh-col { display: flex; flex-direction: column; gap: 12px; }
.mh-title { display: flex; justify-content: space-between; align-items: flex-end; }
.mh-title h1 { margin: 0; font-size: 44px; line-height: .86; }
.mh-title .mn-serif { font-size: 15px; }
.mh-split { display: flex; justify-content: space-between; align-items: center; gap: 12px; }

// MUSCAT HEIST · Vol.10 — the shared components (handoff components.md).
// Plain JSX for Babel standalone, the way every volume's page is compiled.

// ── derived rules (handoff data.md), as data ──────────────────────────────
// REP IS PER NIGHT PLAYED (owner, 22 Nov 2026): the threshold for a level is
// its per-night figure times the nights the season has played, so after five
// nights it is exactly the handoff's 80 / 90 / 100. Rep never goes down: a
// player's level is the highest they reached after ANY night, which is why
// this takes their running totals, not just today's.
const MH_REPS = (MH.rep && MH.rep.levels) || [];
function mhRepAt(points, nights) {
  return MH_REPS.find(l => points >= l.perNight * nights) || MH_REPS[MH_REPS.length - 1];
}
// totalsByNight: the player's series total after night 1, 2, ... n
function mhRepFor(totalsByNight) {
  let best = MH_REPS.length - 1;
  (totalsByNight || []).forEach((pts, i) => {
    const k = MH_REPS.indexOf(mhRepAt(pts, i + 1));
    if (k < best) best = k;
  });
  return MH_REPS[best];
}
function mhNextRep(rep) {
  const k = MH_REPS.indexOf(rep);
  return k > 0 ? MH_REPS[k - 1] : null;
}

const mhInitials = name => (name || "?").split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase();

// MUSCAT HEIST · Vol.10 — the season screens (handoff phase 2):
// 01 Home · 02 Jobs · 03 Most Wanted · 04 ME · 05 The Crew · 06 Crew Card ·
// 17 The Take. Every value is the static design's own (handoff/design/
// Muscat Nights App.html); every colour is a token. They read ONE shape of
// data, D, built by brand/heist/preview-data.js in preview and by the app's
// adapter from the live state — so a screen cannot be right in preview and
// wrong on the night.

// ── dates, without the UTC trap ──────────────────────────────────────────
// A plain "2026-12-23" is parsed by its parts. new Date("2026-12-23") is UTC
// midnight, which on this server and on every phone in Oman is 4am — fine —
// but the repo's rule is never to rely on it (CLAUDE.md, dates on UTC+4).
const MH_DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const MH_MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
function mhDate(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
function mhDay(s) { const d = mhDate(s); return `${MH_DOW[d.getDay()]} ${d.getDate()} ${MH_MON[d.getMonth()]}`; }
function mhStart(s, time) { const d = mhDate(s); const [h, m] = (time || "17:30").split(":").map(Number); d.setHours(h, m, 0, 0); return d; }
function mhCountdown(to, now) {
  const ms = to - now; if (ms <= 0) return null;
  const m = Math.floor(ms / 60000), d = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60);
  return d > 0 ? `${d}D ${h}H` : `${h}H ${m % 60}M`;
}
const mhFirst = n => (n || "").split(" ")[0];
const mhPts = n => `${n} pt${n === 1 ? "" : "s"}`;

// ── what every screen derives from D ─────────────────────────────────────
function mhDerive(D) {
  const nightsPlayed = D.sessions.filter(s => s.state === "done").length;
  const players = D.players.map(p => {
    const rep = p.repId ? MH_REPS.find(r => r.id === p.repId) : mhRepAt(p.points, Math.max(1, nightsPlayed));
    return Object.assign({}, p, { rep, tier: mhTierFor(p.rank) });
  });
  const byId = Object.fromEntries(players.map(p => [p.id, p]));
  const above = p => players.find(q => q.rank === p.rank - 1);
  const me = byId[D.meId] || null;
  const lastDone = D.sessions.filter(s => s.state === "done").slice(-1)[0];
  return { players, byId, above, me, nightsPlayed, lastDone,
    gap: p => { const a = above(p); return a ? a.points - p.points : null; } };
}

// ── page shell: top bar, scrolling content, nav ──────────────────────────
function MhPage({ D, tab, onTab, children, nav = true, pad = "96px 20px 0" }) {

}
const MhTitle = ({ title, aside }) => (
  <div className="mh-title">

// ── 01 HOME ──────────────────────────────────────────────────────────────
function MhHome({ D, go }) {
  const X = mhDerive(D);
  // the countdown moves every minute (spec); D.now pins it in preview only
  const [tick, setTick] = React.useState(0);
  React.useEffect(() => { if (D.now) return; const t = setInterval(() => setTick(x => x + 1), 60000); return () => clearInterval(t); }, [D.now]);
  const now = D.now ? new Date(D.now) : new Date();
  const live = D.sessions.find(s => s.state === "live");
  const next = D.sessions.find(s => s.no === D.homeNext) || D.sessions.find(s => s.state === "soon");
  const showLive = live && D.homeShowsLive;
  const hero = showLive ? live : (next || X.lastDone);
  const lead = X.players[0], second = X.players[1];
  const me = X.me, rival = me && X.above(me);
  const left = next && mhCountdown(mhStart(next.date, next.time), now);
  return (
    <MhPage D={D} tab="home" onTab={go} pad="0">
      <MhHeroCut height={470} src={hero && hero.art} pos={hero && hero.heroPos || "34% 20%"}>
        <div style={{ position: "absolute", left: 22, top: 250 }}><MhTitleLockup size="S" /></div>

      <div className="mh-col" style={{ padding: "0 20px", marginTop: -8, gap: 10 }}>
        {showLive ? (
          <button type="button" className="mn-glass mh-tap" data-accent="coral" onClick={() => go("session", live.no)}>
            <div className="mh-split">
              <div>
                <MhLabel tone="coral">● Live now · {live.code}</MhLabel>
                <MhDisplay size={28} style={{ marginTop: 3 }}>{live.title}</MhDisplay>
                {live.progress && <MhSerif>{live.progress.played} of {live.progress.total} matches played</MhSerif>}
              </div>
              <MhDisplay size={18} tone="coral">OPEN ›</MhDisplay>
            </div>
          </button>
        ) : next ? (
          <button type="button" className="mn-glass mh-tap" onClick={() => go("session", next.no)}>
            <div className="mh-split">
              <div>
                <MhLabel tone="peach">Next job · {next.code}</MhLabel>
                <MhDisplay size={28} style={{ marginTop: 3 }}>{mhDay(next.date).toUpperCase()}</MhDisplay>
                <MhSerif>{next.time} · {MH.venue}</MhSerif>
              </div>
              {left && <div style={{ textAlign: "right" }}>
                <MhDisplay size={28} tone="peach">{left}</MhDisplay>
                <MhLabel>to go</MhLabel>
              </div>}
            </div>
          </button>
        ) : null}
        <div className="mh-two">
          {lead && <button type="button" className="mn-glass mh-tap mh-small" onClick={() => go("wanted")}>
            <MhLabel tone="peach">Leader</MhLabel>
            <MhDisplay size={19} weight={800} style={{ marginTop: 3, lineHeight: 1.05 }}>{mhFirst(lead.name)} · {lead.points}</MhDisplay>
            <MhSerif size={14}>{second ? `${lead.points - second.points} clear` : "on top"}</MhSerif>
          </button>}
          {me && (rival ? (
            <button type="button" className="mn-glass mh-tap mh-small" onClick={() => go("rival")}>
              <MhLabel tone="teal">Your rival</MhLabel>
              <MhDisplay size={19} weight={800} style={{ marginTop: 3, lineHeight: 1.05 }}>{mhFirst(rival.name)} · {rival.points}</MhDisplay>
              <MhSerif size={14}>{mhPts(rival.points - me.points)} ahead</MhSerif>
            </button>
          ) : second && (
            <button type="button" className="mn-glass mh-tap mh-small" onClick={() => go("rival")}>
              <MhLabel tone="teal">#2 chasing</MhLabel>
              <MhDisplay size={19} weight={800} style={{ marginTop: 3, lineHeight: 1.05 }}>{mhFirst(second.name)} · {second.points}</MhDisplay>
              <MhSerif size={14}>{mhPts(me.points - second.points)} behind you</MhSerif>
            </button>
          ))}
        </div>
      </div>
    </MhPage>
  );
}

// ── 02 JOBS ──────────────────────────────────────────────────────────────
function MhJobs({ D, go }) {
  const [f, setF] = React.useState("upcoming");
  const rows = D.sessions.filter(s => f === "all" || (f === "done" ? s.state === "done" : s.state !== "done"));
  const ordered = f === "done" ? rows.slice().reverse() : f === "all" ? rows
    : rows.concat(D.sessions.filter(s => s.state === "done").slice(-1));   // the reference trails the latest recap
  const upcoming = D.sessions.some(s => s.state !== "done");
  return (
    <MhPage D={D} tab="jobs" onTab={go}>
      <div className="mh-col">
        <MhTitle title="JOBS" aside={`${MH.month} · ${D.sessions.length} episodes`} />
        <MhPills label="Filter" items={[["upcoming", "Upcoming"], ["done", "Done"], ["all", "All"]]} value={f} onChange={setF} />
        {!upcoming && f === "upcoming" && (
          <button type="button" className="mn-glass mh-tap" onClick={() => go("take")}>
            <MhDisplay size={19}>Season complete</MhDisplay><MhSerif size={14}>See The Take ›</MhSerif>
          </button>
        )}
        {ordered.map(s => <MhJobRow key={s.no} s={s} go={go} />)}
      </div>
    </MhPage>
  );
}
function MhJobRow({ s, go }) {
  const live = s.state === "live", done = s.state === "done", signup = s.signups && s.signups.open;
  const day = mhDay(s.date);
  const label = live ? `● Live now · ${day}` : done ? day : `${day} · ${s.time}`;
  const tone = live ? "coral" : done ? "dim" : s.finale ? "gold" : signup ? "peach" : "mist";
  const sub = live && s.progress ? `${s.progress.played} of ${s.progress.total} matches played`
    : done ? `${(s.champions || []).map(mhFirst).join(" & ")} won · recap ›`
    : s.finale ? `Finale · 2× points`
    : signup ? `Signups open · ${s.signups.teams} of ${s.signups.max} teams`
    : s.signups && s.signups.opensOn ? `Signups open ${s.signups.opensOn}` : (s.doublePoints ? "2× points" : "");
  return (
    <div className="mh-job" data-state={live ? "live" : s.finale ? "finale" : done ? "done" : "soon"}>
      <button type="button" className="mh-jobmain" onClick={() => go(done ? "recap" : "session", s.no)}
        aria-label={`${s.code} ${s.title}`}>
        <div className="mh-thumb"><MhArt src={s.art} pos={s.artPos} /></div>
        <div style={{ minWidth: 0 }}>
          <MhLabel tone={tone}>{label}</MhLabel>
          <div className="mn-display mh-jobtitle">{s.code} · {s.title}</div>
          {sub && <MhSerif size={14}>{sub}</MhSerif>}
        </div>
      </button>
      {live ? <MhDisplay size={15} tone="coral" style={{ alignSelf: "center" }}>OPEN ›</MhDisplay>
        : s.finale && !done ? <MhDisplay size={15} tone="gold" style={{ alignSelf: "center" }}>FINALE</MhDisplay>
        : signup ? <button type="button" className="mn-pill" aria-pressed="true" onClick={() => go("signup", s.no)}><span>Sign up</span></button>
        : null}
    </div>
  );
}

// ── 03 MOST WANTED ───────────────────────────────────────────────────────
function MhWanted({ D, go }) {
  const X = mhDerive(D);
  const lead = X.players[0];
  const bounty = r => (MH.seasonPrizes || [])[r - 1];
  return (
    <MhPage D={D} tab="wanted" onTab={go}>
      <div className="mh-col">
        <MhTitle title="MOST WANTED" aside={X.lastDone ? `after ${X.lastDone.code}` : "before EP.01"} />
        {lead && (
          <button type="button" className="mh-leader mh-tap" onClick={() => go("card", lead.id)}>
            <MhArt src={lead.photo} pos={lead.pos} name={lead.name} />
            <div className="mh-leaderfade" aria-hidden="true" />
            <div className="mh-stars" aria-hidden="true">★★★★★</div>
            <div className="mh-leaderbody">
              <MhLabel tone="gold">Most wanted · Rep {lead.rep.label}</MhLabel>
              <div className="mn-display" style={{ fontSize: 36, lineHeight: .86 }}>
                {lead.name.split(" ").map((w, i) => <React.Fragment key={i}>{i ? <br /> : null}{w}</React.Fragment>)}
              </div>
              <div className="mh-mono-row">
                <span>{lead.points} PTS</span>
                {bounty(1) && <span style={{ color: "var(--mn-peach)" }}>BOUNTY {bounty(1)} OMR</span>}
              </div>
            </div>
          </button>
        )}
        <div className="mh-replegend">
          {MH_REPS.slice().reverse().map(r => (
            <div key={r.id} style={{ borderTopColor: `var(--mn-rep-${r.id})` }}>
              <b>{r.label.toUpperCase()}</b><span>{r.perNight * Math.max(1, X.nightsPlayed)}+</span>
            </div>
          ))}
        </div>
        {X.players.length >= 2 && (
          <div>
            {X.players.slice(1).map(p => {
              const g = X.gap(p), mine = X.me && p.id === X.me.id;
              const ring = p.rep.id === "rookie" ? null : `rep-${p.rep.id}`;
              return (
                <button type="button" key={p.id} className="mh-wrow mh-tap" data-me={mine ? "" : undefined}
                  onClick={() => go("card", p.id)}>
                  <div className="mn-display mh-wrank">{p.rank}</div>
                  <MhAvatar player={{ name: p.name, photo: p.photo, photoPos: p.avPos || p.pos }} size={34} ring={ring} zoom={p.zoom} />
                  <div style={{ minWidth: 0, textAlign: "left" }}>
                    <div className="mh-wname">{p.name}{mine && <span className="mn-serif"> you</span>}</div>
                    <MhLabel style={{ color: `var(--mn-rep-${p.rep.id})` }}>Rep · {p.rep.label.toUpperCase()}</MhLabel>
                  </div>
                  <div className="mh-wmove">{p.movement || "—"}</div>
                  <div style={{ textAlign: "right" }}>
                    <div className="mn-display" style={{ fontSize: 20, fontWeight: 800, lineHeight: 1 }}>{p.points}</div>
                    <div className="mh-wgap">{g === 0 ? "level" : `−${g}`}</div>
                  </div>
                </button>
              );
            })}
          </div>
        )}
      </div>
    </MhPage>
  );
}

// ── 04 ME ────────────────────────────────────────────────────────────────
const MH_SEG = [["groupWins", "Group wins", "var(--mn-teal)"], ["lossPts", "Loss points", "var(--mn-teal-45)", "var(--mn-teal-60)"],
                ["knockout", "Knockout", "var(--mn-coral)"], ["titles", "Titles", "var(--mn-sand)"]];
function MhMe({ D, go }) {
  const X = mhDerive(D);
  const me = X.me;
  if (!me || !me.points) {
    return (
      <MhPage D={D} tab="me" onTab={go}>
        <div className="mh-col">
          <MhTitle title="ME" />
          <MhGlass><MhDisplay size={22}>Play your first night</MhDisplay>
            <MhSerif size={14}>Your card, your rival and every point you earn show up here.</MhSerif></MhGlass>
        </div>
      </MhPage>
    );
  }
  const rival = X.above(me), next = mhNextRep(me.rep), n = Math.max(1, X.nightsPlayed);
  const lo = me.rep.perNight * n, hi = next ? next.perNight * n : lo;
  const frac = next ? Math.max(0, Math.min(1, (me.points - lo) / Math.max(1, hi - lo))) : 1;
  const seg = (D.me && D.me.seg) || {};
  const segTotal = MH_SEG.reduce((a, [k]) => a + (seg[k] || 0), 0);
  return (
    <MhPage D={D} tab="me" onTab={go}>
      <div className="mh-col">
        <div style={{ display: "flex", gap: 14, alignItems: "center" }}>
          <MhCrewCard player={{ name: me.name, photo: me.photo, photoPos: me.meCardPos || me.pos }} rank={me.rank}
            points={me.points} rep={me.rep} size="S" foil={false} onClick={() => go("card", me.id)} />
          <div style={{ flex: 1, display: "flex", flexDirection: "column", gap: 6 }}>
            <MhLabel>Your season</MhLabel>
            <MhDisplay size={56} style={{ lineHeight: .85 }}>{me.points}</MhDisplay>
            <div style={{ display: "flex", gap: 6 }}>
              <span className="mh-chip" data-tone={me.rep.id}>#{me.rank}</span>
              <span className="mh-chip" data-tone={me.rep.id}>REP {me.rep.label.toUpperCase()}</span>
            </div>
            {next ? <>
              <div className="mh-progress"><div className="mn-fill" style={{ width: (frac * 100).toFixed(1) + "%" }} /></div>
              <MhLabel>{mhPts(hi - me.points)} to {next.label}</MhLabel>
            </> : <MhLabel tone="gold">Top rep reached</MhLabel>}
          </div>
        </div>
        {rival && (
          <button type="button" className="mn-glass mh-tap" onClick={() => go("rival")}>
            <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
              <MhAvatar player={{ name: rival.name, photo: rival.photo, photoPos: rival.avPos || rival.pos }} size={42} ring="coral" zoom={rival.zoom} />
              <div style={{ flex: 1, textAlign: "left" }}>
                <MhLabel tone="coral">Your rival · #{rival.rank}</MhLabel>
                <MhDisplay size={20}>{mhFirst(rival.name)} · {rival.points}</MhDisplay>
                {D.rival && D.rival.h2h && <MhSerif size={14}>Head to head {D.rival.h2h.w}–{D.rival.h2h.l}</MhSerif>}
              </div>
              <div style={{ textAlign: "right" }}>
                <MhDisplay size={26} tone="peach">{rival.points - me.points}</MhDisplay>
                <MhLabel>pts</MhLabel>
              </div>
            </div>
          </button>
        )}
        {segTotal > 0 && <>
          <MhLabel>Where the points came from</MhLabel>
          <div className="mh-stack" role="img" aria-label={MH_SEG.map(([k, l]) => `${l} ${seg[k] || 0}`).join(", ")}>
            {MH_SEG.map(([k, , c]) => (seg[k] ? <div key={k} style={{ flex: seg[k], background: c }} /> : null))}
          </div>
          <div className="mh-legend">
            {MH_SEG.map(([k, l, c, sw]) => (
              <div key={k}><span><span style={{ color: sw || c }}>■</span> {l}</span><b>{seg[k] || 0}</b></div>
            ))}
          </div>
        </>}
        {D.me && D.me.episodes && D.me.episodes.length > 0 && <>
          <MhLabel>Episode by episode</MhLabel>
          <div>
            {D.me.episodes.map(e => (
              <button type="button" key={e.session} className="mh-eprow mh-tap" onClick={() => go("receipt", e.session)}>
                <MhDisplay size={16} tone="mist">{D.sessions[e.session - 1].code}</MhDisplay>
                <span>{e.label}</span>
                <MhDisplay size={17} tone={e.title ? "gold" : e.knockout ? "teal" : undefined}>+{e.pts}</MhDisplay>
              </button>
            ))}
          </div>
        </>}
      </div>
    </MhPage>
  );
}

// ── 05 THE CREW ──────────────────────────────────────────────────────────
function MhCrew({ D, go }) {
  const X = mhDerive(D);
  const [t, setT] = React.useState("all");
  const tiers = [["all", "All"]].concat((MH.tiers || []).map(x => [x.id, x.label[0] + x.label.slice(1).toLowerCase()]));
  const shown = X.players.filter(p => t === "all" || p.tier.id === t);
  return (
    <MhPage D={D} tab="crew" onTab={go}>
      <div className="mh-col">
        <MhTitle title="THE CREW" aside={`${D.rosterSize || X.players.length} players`} />
        <MhPills label="Tier" items={tiers} value={t} onChange={setT} />
        <div className="mh-grid">
          {shown.map(p => (
            <MhCrewCard key={p.id} player={{ name: p.name, photo: p.photo, photoPos: p.pos }} rank={p.rank}
              points={p.points} rep={p.rep} size="M" onClick={() => go("card", p.id)} />
          ))}
        </div>
      </div>
    </MhPage>
  );
}

// ── 06 CREW CARD ─────────────────────────────────────────────────────────
function MhCardScreen({ D, go, id }) {
  const X = mhDerive(D);
  const p = X.byId[id] || X.players[0];
  const own = X.me && p.id === X.me.id;
  const v = D.vsCard && D.vsCard.playerId === p.id ? D.vsCard : null;
  return (
    <MhPage D={D} tab="crew" onTab={go} nav={false} pad="92px 20px 0">
      <div className="mh-col">
        <div className="mh-split">
          <MhLabel>Crew card</MhLabel>
          <button type="button" className="mh-close mn-serif" onClick={() => go("back")}>close ✕</button>
        </div>
        <div style={{ display: "flex", justifyContent: "center" }}>
          <MhCrewCard player={{ name: p.name, photo: p.photo, photoPos: p.pos }} rank={p.rank} points={p.points}
            rep={p.rep} size="L" stats={p.stats || {}} />
        </div>
        {/* the handoff's "Share (optional) → share sheet MY CARD", on your own card only */}

        {!own && v && (
          <MhGlass>
            <div className="mh-split">
              <div>
                <MhLabel tone="coral">You vs him</MhLabel>
                <MhSerif size={14}>{v.meetings} meeting{v.meetings === 1 ? "" : "s"} · last {D.sessions[v.last.session - 1].code}, {v.last.won ? "won" : "lost"} {v.last.score}</MhSerif>
              </div>
              <MhDisplay size={28}>{v.w}–{v.l}</MhDisplay>
            </div>
          </MhGlass>
        )}
      </div>
    </MhPage>
  );
}

// ── 17 THE TAKE ──────────────────────────────────────────────────────────
function MhTake({ D, go }) {
  const X = mhDerive(D);
  const pool = (MH.seasonPrizes || []).reduce((a, b) => a + b, 0) + MH.voucher * 2 * D.sessions.length;
  const paid = D.paidOMR != null ? D.paidOMR : X.nightsPlayed * MH.voucher * 2;
  const left = pool - paid;
  const place = [["1ST", "gold"], ["2ND", "silver"], ["3RD", "bronze"]];
  return (
    <MhPage D={D} tab="me" onTab={go}>
      <div className="mh-col">
        <MhTitle title="THE TAKE" />
        <div className="mh-takehero">
          <MhArt src={D.sessions[D.sessions.length - 1].art} pos="center 50%" />
          <div className="mh-takebody">
            <MhLabel tone="peach">Prize pool</MhLabel>
            <MhDisplay size={52} style={{ lineHeight: .9 }}>{pool} OMR</MhDisplay>
            <div style={{ display: "flex", gap: 14 }}><MhLabel tone="teal">{paid} paid</MhLabel><MhLabel tone="gold">{left} left</MhLabel></div>
          </div>
        </div>
        <div className="mh-col" style={{ gap: 6 }}>
          <div className="mh-split"><MhLabel tone="teal">Won so far</MhLabel><MhLabel>{X.nightsPlayed} of {D.sessions.length} nights</MhLabel></div>
          <div className="mh-meter"><div className="mn-fill" style={{ width: (paid / pool * 100).toFixed(1) + "%" }} /></div>
          <div className="mh-segs" style={{ gridTemplateColumns: `repeat(${D.sessions.length},minmax(0,1fr))` }}>
            {D.sessions.map(s => <div key={s.no} data-s={s.state === "done" ? "done" : s.finale ? "finale" : "rest"} />)}
          </div>
          <div className="mh-split mn-serif" style={{ fontSize: 13 }}><span>{paid} OMR in vouchers paid</span><span>{left} OMR still to win</span></div>
        </div>
        <MhLabel>If the season ended now</MhLabel>
        {X.players.slice(0, 3).map((p, i) => (
          <button type="button" key={p.id} className="mn-glass mh-tap mh-prize" onClick={() => go("card", p.id)}>
            <MhDisplay size={20} tone={place[i][1]} style={{ width: 36 }}>{place[i][0]}</MhDisplay>
            <MhAvatar player={{ name: p.name, photo: p.photo, photoPos: p.avPos || p.pos }} size={38} ring={place[i][1]} zoom={p.zoom} />
            <div className="mn-display" style={{ flex: 1, fontSize: 17, textAlign: "left" }}>{p.name.toUpperCase()}
              <div className="mh-ptsline">{p.points} PTS</div></div>
            <MhDisplay size={24}>{MH.seasonPrizes[i]}<span className="mh-omr"> OMR</span></MhDisplay>
          </button>
        ))}
        <MhLabel>Nightly · {MH.voucher * 2} OMR to each episode's champions</MhLabel>
      </div>
    </MhPage>
  );
}

// MUSCAT HEIST · Vol.10 — the session night (handoff phase 3):
// 07 Session detail (Teams · Groups · Knockout · MVP) · 08 Live Scoring ·
// 09 Episode Recap · 10 Recap Slides. Values are the static design's own.
//
// SCORING IS NOT CHANGED. Live Scoring's "+1 MUNTHER" adds one GAME (the
// fixture is first to 6, at 5-3), so +1 / Undo / Lock result produce exactly
// the final score the app has always recorded — entered game by game instead
// of on a number pad. Lock calls back with { t1, t2 } and the app's own
// engine decides winner, loss type and points, as it always has.

// The session header: art with the cut, the back link, and the episode line.
function MhSessionHead({ s, height = 250, cut = [80, 100], fade = "session", back, label, tone = "coral", title, titleSize = 38, children }) {
  return (
    <MhHeroCut height={height} src={s && s.art} pos={s && s.artPos} cut={cut} fade={fade}>
      {back && <button type="button" className="mh-back" onClick={back.onClick}>‹ {back.label}</button>}
      {children}
      {title && (
        <div style={{ position: "absolute", left: 20, bottom: 46 }}>
          {label && <MhLabel tone={tone}>{label}</MhLabel>}
          <div className="mn-display" style={{ fontSize: titleSize, lineHeight: .9 }}>{title}</div>
        </div>
      )}
    </MhHeroCut>
  );
}

// ── 07 SESSION DETAIL ─────────────────────────────────────────────────────
function MhSession({ D, go, no, canScore }) {
  const s = D.sessions.find(x => x.no === +no) || D.sessions.find(x => x.state === "live");
  const N = (D.nights && D.nights[s.no]) || {};
  const [tab, setTab] = React.useState("groups");
  const groups = Object.keys(N.groups || {});
  const [g, setG] = React.useState(groups[0] || "A");
  const live = s.state === "live";
  const stateLabel = live ? `● Live · ${mhDay(s.date)}` : s.state === "done" ? `Played · ${mhDay(s.date)}` : `${mhDay(s.date)} · ${s.time}`;
  return (
    <div className="mh-page">
      <main className="mh-body" data-bare="" style={{ padding: 0 }}>
        <MhSessionHead s={s} back={{ label: "Jobs", onClick: () => go("jobs") }}
          label={stateLabel} tone={live ? "coral" : "peach"} title={`${s.code} · ${s.title}`} />
        <div className="mh-col" style={{ padding: "4px 20px 0", gap: 10 }}>
          <MhPills label="Session" items={[["teams", "Teams"], ["groups", "Groups"], ["knockout", "Knockout"], ["mvp", "MVP"]]} value={tab} onChange={setTab} />
          {tab === "groups" && <>
            {groups.length > 0 && <MhPills label="Group" items={groups} value={g} onChange={setG} />}
            <MhGroupTable rows={(N.groups[g] || {}).standings || []} played={(N.groups[g] || {}).matches || []} />
            <MhLabel>Matches{canScore ? " · tap to score" : ""}</MhLabel>
            {((N.groups[g] || {}).matches || []).map((m, i) => (
              <MhMatchCard key={i} m={m} onClick={canScore && m.state !== "final" ? () => go("live", `${s.no}/${g}${i}`) : null} />
            ))}
          </>}
          {tab === "teams" && <MhTeams N={N} />}
          {tab === "knockout" && <MhKnockout N={N} />}
          {tab === "mvp" && <MhMvp N={N} />}
        </div>
      </main>
      <MhGrain />
    </div>
  );
}
function MhGroupTable({ rows, played }) {
  const started = played.some(m => m.state === "final");
  return (
    <MhGlass style={{ padding: "6px 14px" }}>
      {rows.map((r, i) => (
        <div key={r.team} className="mh-grow">
          {/* nothing is marked as qualifying before a ball is hit */}
          <div className="mn-display" style={{ fontSize: 14, color: started && i < 2 ? "var(--mn-teal)" : "var(--mn-mist)" }}>{i + 1}</div>
          <div className="mh-gteam">{r.team}</div>

// ── 08 LIVE SCORING ───────────────────────────────────────────────────────
// Games, not points: each +1 is one game to that team. Serve alternates every
// game from whichever team served first (the score card that is lit). Lock
// hands { t1, t2 } to the app, whose existing engine validates and scores it.
function MhLive({ D, go, match, onLock }) {
  const L = match || D.live;
  const [a, setA] = React.useState(L.a || 0), [b, setB] = React.useState(L.b || 0);
  const [hist, setHist] = React.useState([]);
  const [clock, setClock] = React.useState(L.clock || "");
  React.useEffect(() => {
    if (L.clock) return;
    const f = () => { const d = new Date(); setClock(`${d.getHours()}:${String(d.getMinutes()).padStart(2, "0")}`); };
    f(); const t = setInterval(f, 30000); return () => clearInterval(t);
  }, [L.clock]);
  const firstServeA = (L.serving || "A") === "A" ? ((L.a + L.b) % 2 === 0) : ((L.a + L.b) % 2 === 1);
  const servingA = ((a + b) % 2 === 0) === firstServeA;
  const add = side => { setHist(h => h.concat([[a, b]])); side === "a" ? setA(a + 1) : setB(b + 1); };
  const undo = () => { if (!hist.length) return; const [x, y] = hist[hist.length - 1]; setA(x); setB(y); setHist(hist.slice(0, -1)); };
  const lines = t => { const p = t.split(" & "); return <>{p[0].toUpperCase()}<br />&amp; {(p[1] || "").toUpperCase()}</>; };
  const first = t => t.split(" & ")[0].toUpperCase();
  const Card = ({ team, score, on }) => (
    <MhGlass accent={on ? "peach-50" : undefined}>
      <div style={{ display: "grid", gridTemplateColumns: "1fr auto", alignItems: "center" }}>
        <div>
          {on && <MhLabel tone="peach">Serving</MhLabel>}
          <div className="mn-display" style={{ fontSize: 26, fontWeight: 800, lineHeight: 1.05, color: on ? undefined : "var(--mn-mist)" }}>{lines(team)}</div>
        </div>
        <div className="mn-display" style={{ fontSize: 92, lineHeight: .85, color: on ? undefined : "var(--mn-mist)" }} aria-live="polite">{score}</div>
      </div>
    </MhGlass>
  );
  return (
    <div className="mh-page mh-live">
      <main className="mh-body" data-bare="" style={{ padding: 0, display: "flex", flexDirection: "column", minHeight: "100dvh" }}>
        <MhHeroCut height={300} src={L.art} pos={L.artPos || "center 25%"} cut={[84, 100]} fade="live">
          {/* the pill is the way back to the session: the design has no other exit */}
          <button type="button" className="mh-livepill" onClick={() => go("back")} aria-label={`Back to the session — live, court ${L.court}, group ${L.group}`}>
            <span className="mh-dot" aria-hidden="true" /><MhLabel tone="sand">Live · Court {L.court} · Group {L.group}</MhLabel></button>
          <div className="mh-clock">{clock}</div>
        </MhHeroCut>
        <div className="mh-col" style={{ padding: "0 20px", gap: 8 }}>
          <Card team={L.teamA} score={a} on={servingA} />
          <Card team={L.teamB} score={b} on={!servingA} />
          <div className="mh-two" style={{ gap: 8 }}>
            <MhButton live onClick={() => add("a")} kind="primary">+1 {first(L.teamA)}</MhButton>
            <MhButton live onClick={() => add("b")} kind="ghost">+1 {first(L.teamB)}</MhButton>
          </div>
        </div>
        <div className="mh-livefoot">
          <button type="button" className="mh-undo" onClick={undo} disabled={!hist.length}>Undo</button>
          <MhButton kind="light" live onClick={() => onLock ? onLock({ t1: a, t2: b }) : go("back")}>Lock result</MhButton>
        </div>
      </main>
      <MhGrain />
    </div>
  );
}

// ── 10 RECAP SLIDES ───────────────────────────────────────────────────────
// Five slides, 5s each, auto-advancing; pressed = paused. Tap the right third
// for next, the left third for previous; swipe down or ✕ to close; ←/→ keys.
// Under reduced motion nothing advances on its own and nothing animates.
const MH_SLIDE_MS = 5000;
function mhSlides(D, s, R) {
  const me = D.players.find(p => p.id === D.meId);
  const P = n => D.players.find(p => p.name === n || mhFirst(p.name) === n) || { name: n };
  const out = [
    { key: "Champions", label: "Champions", name: R.champions.map(mhFirst).join(" & "), sub: `beat ${R.beat.map(mhFirst).join(" & ")} ${R.score.replace("-", "–")}`, who: P(R.champions[0]) },
    { key: "MVP", label: "MVP · player vote", name: R.mvp.name, sub: `${R.mvp.votes} votes${R.mvp.note ? " · " + R.mvp.note : ""}`, who: P(R.mvp.name) },
    { key: "Biggest win", label: "Biggest win", name: R.biggestWin.team, sub: R.biggestWin.score.replace("-", "–"), who: P(R.biggestWin.team.split(" & ")[0]) },
    { key: "Upset", label: "Upset", name: R.upset.team, sub: R.upset.note, who: P(R.upset.team.split(" & ")[0]) },
  ];
  if (R.yourNight && me) out.push({ key: "Your night", label: "Your night", name: `+${R.yourNight.points}`, sub: R.yourNight.note, who: me, last: true });
  return out;
}
function MhSlides({ D, go, no, start = 0 }) {
  const s = D.sessions.find(x => x.no === +no) || D.sessions.filter(x => x.state === "done").slice(-1)[0];
  const R = (D.recaps || {})[s.no];
  const slides = mhSlides(D, s, R);
  const [i, setI] = React.useState(Math.min(start, slides.length - 1));
  const [held, setHeld] = React.useState(false);
  const reduced = React.useMemo(() => matchMedia("(prefers-reduced-motion: reduce)").matches, []);
  const touch = React.useRef(null);
  const next = () => setI(x => Math.min(slides.length - 1, x + 1));
  const prev = () => setI(x => Math.max(0, x - 1));
  React.useEffect(() => {
    if (reduced || held || i >= slides.length - 1) return;
    const t = setTimeout(next, MH_SLIDE_MS); return () => clearTimeout(t);
  }, [i, held, reduced]);
  React.useEffect(() => {
    const k = e => { if (e.key === "ArrowRight") next(); else if (e.key === "ArrowLeft") prev(); else if (e.key === "Escape") go("back"); };
    addEventListener("keydown", k); return () => removeEventListener("keydown", k);
  }, []);
  const S = slides[i];
  const tap = e => { const x = e.clientX / innerWidth; if (x > 2 / 3) next(); else if (x < 1 / 3) prev(); };
  return (
    <div className="mh-slides" onPointerDown={() => setHeld(true)} onPointerUp={() => setHeld(false)} onPointerLeave={() => setHeld(false)}
      onClick={tap}
      onTouchStart={e => { touch.current = e.touches[0].clientY; }}
      onTouchEnd={e => { if (touch.current != null && e.changedTouches[0].clientY - touch.current > 90) go("back"); touch.current = null; }}>
      <div className="mh-slidesart"><MhArt src={R.art || s.art} pos={R.artPos || "center 50%"} /></div>
      <div className="mh-slidesfade" aria-hidden="true" />
      <div className="mh-segbar" aria-hidden="true">
        {slides.map((x, k) => (
          <div key={x.key}><div style={{ width: k < i ? "100%" : k > i ? "0%" : (reduced ? "100%" : undefined) }}
            className={k === i && !reduced ? "mh-segrun" : undefined} data-held={held ? "" : undefined} /></div>
        ))}
      </div>
      <div className="mh-slideshead">
        <MhLabel tone="sand">{s.code} recap · {i + 1} of {slides.length}</MhLabel>
        <button type="button" className="mh-x" onClick={e => { e.stopPropagation(); go("back"); }} aria-label="Close">✕</button>
      </div>
      <div className="mh-slide" key={S.key} aria-live="polite">
        <div className="mh-slidephoto">
          <MhAvatar player={{ name: S.who.name, photo: S.who.photo, photoPos: S.who.avPos || S.who.pos }} size={150} zoom={S.who.zoom} />
        </div>
        <MhLabel tone="peach">{S.label}</MhLabel>
        <div className="mn-display" style={{ fontSize: 64, lineHeight: .86 }}>{S.name}</div>
        <MhSerif size={18}>{S.sub}</MhSerif>
        {S.last && <MhButton onClick={e => { e.stopPropagation(); go("share", s.no); }} style={{ marginTop: 8, width: "100%" }}>Share</MhButton>}
      </div>
      <div className="mh-slidesfoot">
        <button type="button" className="mh-hint" onClick={e => { e.stopPropagation(); prev(); }} disabled={i === 0}>{i > 0 ? `‹ ${slides[i - 1].key}` : ""}</button>
        <button type="button" className="mh-hint" data-next="" onClick={e => { e.stopPropagation(); next(); }} disabled={i === slides.length - 1}>{i < slides.length - 1 ? `${slides[i + 1].key} ›` : ""}</button>
      </div>
    </div>
  );
}

// MUSCAT HEIST · Vol.10 — the moments (handoff phase 4):
// 11 Now Loading Muscat · 12 New Crew Card · 13 Rep Up · 14 Your Rival ·
// 15 Score Settled · 16 The Big Score. Values are the static design's own.
//
// Every figure is DERIVED, never copied out of the fixture's prose: the gap
// to your rival is the difference in points, "10 to Known" is the next rep's
// per-night threshold times the nights played, the next rival after Score
// Settled is recomputed from the table with the locked result applied, and
// the leader's lead is #1 minus #2. Boss Kill +3 is not scored anywhere and
// its rule row only shows while bossKillBonus.enabled (handoff rule 11).

// a moment's player rows, in the shape the screens read
const mhRepById = id => MH_REPS.find(r => r.id === id) || MH_REPS[MH_REPS.length - 1];
const mhTierById = id => (MH.tiers || []).find(t => t.id === id);
const mhTierIdx = id => (MH.tiers || []).findIndex(t => t.id === id);

// The full-screen backdrop the moments share: the player's art, blurred and
// darkened, under a radial glow in the moment's own colour.
function MhMomentBack({ src, pos, dim = .6, glow, at = "50% 45%", strength = 35, fadeTo = 70, fadeAt = 60 }) {
  return (
    <>
      <div className="mh-mback" aria-hidden="true" style={{ "--mh-dim": dim }}><MhArt src={src} pos={pos} /></div>
      <div className="mh-mglow" aria-hidden="true" style={{
        background: `radial-gradient(circle at ${at}, color-mix(in srgb, var(--mn-${glow}) ${strength}%, transparent), color-mix(in srgb, var(--mn-navy) ${fadeTo}%, transparent) ${fadeAt}%)` }} />
    </>
  );
}
function MhMoment({ children, foot, kind }) {
  return (
    <div className="mh-page mh-moment" data-kind={kind}>
      <main className="mh-body" data-bare="" style={{ padding: 0, display: "flex", flexDirection: "column", minHeight: "100dvh" }}>
        {children}
        {foot && <div className="mh-momentfoot">{foot}</div>}
      </main>
      <MhGrain />
    </div>

}

// ── 11 NOW LOADING MUSCAT ─────────────────────────────────────────────────
// Shown while the app loads and on the first open of a session day, once per
// device per day. progress: 0..1, from the real load; the bar never finishes
// in under MH_LOAD_MIN, and a tap only goes through once the data is ready.
const MH_LOAD_MIN = 1200;
// "Once" is per device: a moment is keyed by what it is about, e.g.
// mhOnce("loaded", "2026-12-21"), mhOnce("card", "p05/5"), mhOnce("rep", "p05/rising").
// due() asks, seen() records. Storage can be missing (private mode) — then a
// moment shows again rather than never, which is the cheaper of the two faults.
const mhOnce = (kind, key) => ({
  due() { try { return localStorage.getItem("mh-once-" + kind) !== key && !(localStorage.getItem("mh-once-" + kind + "-" + key)); } catch (e) { return true; } },
  seen() { try { localStorage.setItem(kind === "loaded" ? "mh-once-loaded" : "mh-once-" + kind + "-" + key, kind === "loaded" ? key : "1"); } catch (e) { /* show again next time */ } },
});
// The tips in heist-season.json, filled from the player's own data. A tip
// whose blanks cannot be filled is skipped rather than shown with a hole.
function mhTips(D, X) {
  const me = X.me, rival = me && X.above(me), next = me && mhNextRep(me.rep);
  const n = Math.max(1, X.nightsPlayed);
  const fin = D.sessions.find(s => s.finale);
  const vals = {
    rival: rival && mhFirst(rival.name), gap: rival && rival.points - me.points,
    n: next && Math.max(0, next.perNight * n - me.points), nextRep: next && next.label,
    finaleDay: fin && mhDay(fin.date), voucher: MH.voucher,
  };
  return (MH.tips || []).map(t => {
    let ok = true;
    const s = t.replace(/\{(\w+)\}/g, (_, k) => { if (vals[k] == null) ok = false; return vals[k]; });
    return ok ? s : null;
  }).filter(Boolean);
}
function MhLoading({ D, go, progress, ready = true, tip }) {
  const X = mhDerive(D);
  const s = D.sessions.find(x => x.no === (D.homeNext || 0)) || D.sessions.find(x => x.state !== "done") || D.sessions[D.sessions.length - 1];
  const tips = mhTips(D, X);
  const line = tips.length ? tips[(tip != null ? tip : Math.floor(Date.now() / 864e5)) % tips.length] : "";
  // with no real progress to follow, the bar fills over the minimum time
  const [t, setT] = React.useState(progress != null ? progress : 0);
  React.useEffect(() => {
    if (progress != null) { setT(progress); return; }
    const t0 = performance.now(); let raf;
    const f = now => { const k = Math.min(1, (now - t0) / MH_LOAD_MIN); setT(k); if (k < 1) raf = requestAnimationFrame(f); };
    raf = requestAnimationFrame(f); return () => cancelAnimationFrame(raf);
  }, [progress]);
  const done = ready && t >= 1;
  return (
    <div className="mh-page mh-loading">
      <button type="button" className="mh-loadtap" disabled={!done} onClick={() => go("home")}
        aria-label={done ? "Continue to Home" : "Loading"}>
        <MhHeroCut height="100%" src={s.art} pos={s.artPos || "center 28%"} cut={[54, 62]} fade="none"
          style={{ position: "absolute", inset: 0 }} />
        <div className="mh-loadtag"><MhSceneTag>{s.code} · {s.title}</MhSceneTag></div>
        <div className="mh-loadlock"><MhTitleLockup size="M" center /></div>
        <div className="mh-loadfoot">
          <MhLabel tone="peach">Did you know</MhLabel>
          <MhSerif size={18} tone="sand" style={{ lineHeight: 1.3 }}>{line}</MhSerif>
          <div className="mh-loadbar">
            <div role="progressbar" aria-valuemin={0} aria-valuemax={100} aria-valuenow={Math.round(t * 100)}
              aria-label="Now loading Muscat"><div style={{ width: (t * 100) + "%" }} /></div>
            <MhLabel>Now loading Muscat</MhLabel>
          </div>
        </div>
      </button>
      <MhGrain />
    </div>
  );
}

// ── 12 NEW CREW CARD ──────────────────────────────────────────────────────
// After each finished session, once per player per session: the card as it
// now stands. The headline follows the tier change (up / holding / down).
function MhCardPull({ D, go, no }) {
  const X = mhDerive(D);
  const m = (D.moments || []).find(x => x.type === "tierUp" && (no == null || x.session === +no))
    || { playerId: X.me.id, session: +no || X.lastDone, from: X.me.tier.id, to: X.me.tier.id };
  const p = X.byId[m.playerId];
  const s = D.sessions.find(x => x.no === m.session);
  const from = mhTierById(m.from), to = p.tier;
  const dir = mhTierIdx(to.id) < mhTierIdx(from.id) ? "up" : mhTierIdx(to.id) > mhTierIdx(from.id) ? "down" : "hold";
  const title = dir === "up" ? <>TIER UP:<br /><span className="mh-hl" style={{ color: "var(--mn-gold)" }}>{to.label}</span></>
    : dir === "down" ? <>TIER DOWN:<br /><span className="mh-hl">{to.label}</span></>
    : <>HOLDING<br /><span className="mh-hl" style={{ color: "var(--mn-gold)" }}>{to.label}</span></>;
  const where = p.rank === 1 ? "top of the table" : `#${p.rank} on the table`;
  const cap = w => w.charAt(0) + w.slice(1).toLowerCase();
  const line = dir === "up" ? `Upgraded from ${cap(from.label)} · ${where}`
    : dir === "down" ? `Down from ${cap(from.label)} · ${where}` : `Still ${cap(to.label)} · ${where}`;
  return (
    <MhMoment foot={<>
      <MhButton kind="ghost" live onClick={() => go("crew")}>Collection</MhButton>
      <MhButton live onClick={() => go("share", "card/" + p.id)}>Share card</MhButton>
    </>}>
      <MhMomentBack src={p.photo} pos={p.heroPos || p.pos} dim={.6} glow="gold" />
      <div className="mh-pullhead">
        <MhLabel tone="peach">New crew card · {s.code}</MhLabel>
        <h1 className="mn-display mh-mtitle" style={{ fontSize: 44, lineHeight: .9, textAlign: "center" }}>{title}</h1>
        <div style={{ marginTop: 8 }}>
          <MhCrewCard player={{ name: p.name, photo: p.photo, photoPos: p.pos }} rank={p.rank} points={p.points}
            rep={p.rep} size="L" stats={p.stats || {}} />
        </div>
        <MhSerif size={15}>{line}</MhSerif>
      </div>
    </MhMoment>
  );
}

// ── 15 SCORE SETTLED ──────────────────────────────────────────────────────
// Fires when a locked result moves you above your rival. The new rank and the
// next rival are RECOMPUTED from the table with the locked points applied,
// not read from the moment, so the screen cannot disagree with Most Wanted.
function MhSettled({ D, go }) {
  const X = mhDerive(D);
  const m = (D.moments || []).find(x => x.type === "scoreSettled");
  const now = { [m.playerId]: m.points[0], [m.overtookId]: m.points[1] };
  const table = X.players.map(p => ({ ...p, points: now[p.id] != null ? now[p.id] : p.points }))
    .sort((a, b) => b.points - a.points || a.rank - b.rank);
  const at = table.findIndex(p => p.id === m.playerId);
  const me = table[at], beaten = table.find(p => p.id === m.overtookId);
  const was = X.byId[m.playerId].rank, rank = at + 1;
  const next = table[at - 1];
  const s = D.sessions.find(x => x.no === m.session);
  return (
    <MhMoment kind="settled" foot={<MhButton live onClick={() => go("share", "settled")} style={{ width: "100%" }}>Share the moment</MhButton>}>
      <MhHeroCut height={500} src={me.photo} pos={me.splitPos || me.pos} cut={[86, 100]} fade="settled">
        <div className="mh-settledhead">
          <MhLabel tone="peach">{s.code} · result locked</MhLabel>
          <h1 className="mn-display mn-slam mh-shout" style={{ fontSize: 68 }}>SCORE<br /><span style={{ color: "var(--mn-coral)" }}>SETTLED</span></h1>
        </div>
      </MhHeroCut>
      <div className="mh-tiles" style={{ paddingTop: 8 }}>
        <MhGlass style={{ padding: "12px 14px" }}>
          <MhLabel tone="teal">New rank</MhLabel>
          <MhDisplay size={30} style={{ lineHeight: 1.15 }}>#{rank} {was > rank && <span style={{ fontSize: 16, color: "var(--mn-teal)" }}>▲{was - rank}</span>}</MhDisplay>
          <MhSerif size={13}>{me.name} {me.points} · {beaten.name} {beaten.points}</MhSerif>
        </MhGlass>
        <MhGlass style={{ padding: "12px 14px" }}>
          <MhLabel tone="coral">Next rival</MhLabel>
          {next ? <>
            <MhDisplay size={20} style={{ lineHeight: 1.05 }}>{next.name.toUpperCase()}</MhDisplay>
            <MhSerif size={13}>{next.points - me.points} pts ahead</MhSerif>
          </> : <><MhDisplay size={20} style={{ lineHeight: 1.05 }}>NOBODY</MhDisplay><MhSerif size={13}>top of the table</MhSerif></>}
        </MhGlass>
      </div>
    </MhMoment>
  );
}

// MUSCAT HEIST · Vol.10 — the share exports (handoff phase 5):
// 18 Story · Campaign Poster, 19 Story · Contenders, and MY CARD.
//
// Each story is a 416x740 frame, the handoff's own artboard, exported at
// 1080x1920 (x2.596). The frame on screen IS the export — the sheet's
// preview and the saved PNG are the same DOM — so what somebody sees is what
// they post. Every word on them is data: the starring names are the table's
// top five, "27 MORE" is the roster minus them, the pool is derived, the days
// and the first night come from the nights list, and the contenders' "Eleven
// points" is #1 minus #2 in words.
const MH_STORY = { w: 416, h: 740, outW: 1080, outH: 1920 };
const MH_WORDS = ["Zero", "One", "Two", "Three", "Four", "Five", "Six", "Seven", "Eight", "Nine", "Ten", "Eleven",
  "Twelve", "Thirteen", "Fourteen", "Fifteen", "Sixteen", "Seventeen", "Eighteen", "Nineteen"];
const MH_TENS = ["", "", "Twenty", "Thirty", "Forty", "Fifty", "Sixty", "Seventy", "Eighty", "Ninety"];
function mhWords(n) {
  if (n < 20) return MH_WORDS[n];
  if (n < 100) return MH_TENS[Math.floor(n / 10)] + (n % 10 ? "-" + MH_WORDS[n % 10].toLowerCase() : "");
  return String(n);
}
const mhPool = D => (MH.seasonPrizes || []).reduce((a, b) => a + b, 0) + MH.voucher * 2 * D.sessions.length;
// "Mon & Wed", from the weekdays the nights actually fall on — in week order,
// Monday first: the season opens on a Wednesday, and in date order this read
// "Wed & Mon".
function mhDays() {
  const seen = [];
  (MH.nights || []).forEach(n => { const k = (mhDate(n).getDay() + 6) % 7; if (seen.indexOf(k) < 0) seen.push(k); });
  return seen.sort((a, b) => a - b).map(k => MH_DOW[(k + 1) % 7]).join(" & ");
}
const mhArt = (D, file) => (D.artBase || "") + file;

function MhStoryFrame({ children, label }) {
  return <div className="mh-story" role="img" aria-label={label}>{children}<MhGrain /></div>;
}
// the film-credits block both stories close on
function MhStoryBilling({ D, X }) {
  const S = MH.stories || {};
  const played = X.players.some(p => p.points > 0);
  const five = played ? X.players.slice(0, 5).map(p => p.name) : (S.starring || []).slice(0, 5);
  const more = Math.max(0, (D.rosterSize || X.players.length) - five.length);
  return (
    <MhBilling parts={[
      "Urban Playground", { link: "presents a" }, "Social Padel League",
      ...(five.length ? [{ link: "starring" }, <br key="b1" />, five.join(" · "), <br key="b2" />] : [<br key="b3" />]),
      ...(more ? [{ link: "with" }, `${more} more of Muscat’s finest ·`] : []),
      { link: "prize pool" }, `${mhPool(D)} OMR ·`, { link: "courts" }, MH.venue,
    ]} />
  );
}

// ── the export ────────────────────────────────────────────────────────────
// html-to-image is loaded only when somebody exports: no screen pays for it.
// Pinned to an exact version, like every script this club loads.
const MH_H2I = "https://unpkg.com/html-to-image@1.11.11/dist/html-to-image.js";
function mhLoadH2I() {
  if (window.htmlToImage) return Promise.resolve(window.htmlToImage);
  return new Promise((ok, no) => {
    const s = document.createElement("script"); s.src = MH_H2I;
    s.onload = () => ok(window.htmlToImage); s.onerror = () => no(new Error("export library failed to load"));
    document.head.appendChild(s);
  });
}
// The node is the 416x740 frame — the handoff's artboard, which is not quite
// 9:16. At 1080/416 it would be 1080 x 1921.2; the canvas is set to exactly
// 1080x1920 and the frame is drawn into it, a 0.06% vertical squeeze that no
// eye can see and that keeps the file to Instagram's own size.
async function mhExportStory(node) {
  const h = await mhLoadH2I();
  await document.fonts.ready;
  const k = MH_STORY.outW / MH_STORY.w;
  const canvas = await h.toCanvas(node, { width: MH_STORY.w, height: MH_STORY.h, pixelRatio: k,
    canvasWidth: MH_STORY.outW / k, canvasHeight: MH_STORY.outH / k, cacheBust: false });
  return new Promise(r => canvas.toBlob(r, "image/png"));
}

// ── the share sheet ───────────────────────────────────────────────────────
const MH_SHARES = [["card", "My card"], ["poster", "Campaign poster"], ["contenders", "Contenders"]];
function MhShareSheet({ D, go, what = "card", id }) {
  const [k, setK] = React.useState(MH_SHARES.some(s => s[0] === what) ? what : "card");
  const [busy, setBusy] = React.useState(false), [err, setErr] = React.useState("");
  const ref = React.useRef(null);
  const name = { card: "my-card", poster: "campaign-poster", contenders: "contenders" }[k];
  const run = async () => {
    setBusy(true); setErr("");
    try {
      const blob = await mhExportStory(ref.current.firstChild);
      const file = new File([blob], `muscat-heist-${name}.png`, { type: "image/png" });
      window.__mhLastExport = blob;                       // for the harness
      if (navigator.canShare && navigator.canShare({ files: [file] })) await navigator.share({ files: [file] });
      else { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = file.name; a.click(); }
    } catch (e) { if (e && e.name !== "AbortError") setErr("Couldn't make the image. Try again."); }
    setBusy(false);
  };
  return (
    <div className="mh-page">
      <main className="mh-body" data-bare="" style={{ padding: "56px 20px 0", display: "flex", flexDirection: "column", minHeight: "100dvh" }}>
        <div className="mh-split">
          <MhLabel>Share</MhLabel>
          <button type="button" className="mh-close mn-serif" onClick={() => go("back")}>close ✕</button>
        </div>
        <div style={{ marginTop: 10 }}><MhPills label="What to share" items={MH_SHARES} value={k} onChange={setK} /></div>
        <div className="mh-sharepreview">
          <div ref={ref} className="mh-sharescale">
            {k === "card" ? <MhStoryCard D={D} id={id} /> : k === "poster" ? <MhStoryPoster D={D} /> : <MhStoryContenders D={D} />}
          </div>
        </div>
        <MhLabel style={{ textAlign: "center" }}>1080 × 1920 · Instagram story</MhLabel>
        {err && <MhSerif size={14} tone="coral" style={{ textAlign: "center" }}>{err}</MhSerif>}
        <div className="mh-momentfoot" style={{ padding: "12px 0 26px" }}>
          <MhButton live onClick={run} disabled={busy}>{busy ? "Making the image…" : "Share image"}</MhButton>
        </div>
      </main>
    </div>
  );
}

// #story/<poster|contenders|card>/<id>: the bare 416x740 frame, for export and compare
function MhStoryOnly({ D, what, id }) {
  const S = { poster: MhStoryPoster, contenders: MhStoryContenders, card: MhStoryCard }[what] || MhStoryPoster;
  return <div className="mh-page mh-storyonly"><S D={D} id={id} /></div>;
}
function Preview() {
  const read = () => (location.hash.slice(1) || "home").split("/");
  const [route, setRoute] = React.useState(read());
  const [stack, setStack] = React.useState([]);
  React.useEffect(() => { const f = () => setRoute(read()); addEventListener("hashchange", f); return () => removeEventListener("hashchange", f); }, []);
  const D = window.MH_PREVIEW;
  const go = (to, arg) => {
    if (to === "back") { history.back(); return; }
    const known = ["home", "jobs", "wanted", "me", "crew", "card", "take", "session", "live", "recap", "slides", "loading", "cardpull", "repup", "rival", "settled", "finale", "share", "story"];
    if (known.indexOf(to) < 0) return;      // later phases: session, recap, rival, receipt, signup
    location.hash = arg != null ? `${to}/${arg}` : to; scrollTo(0, 0);
  };
  const [name, arg, arg2] = route;
  const S = { home: MhHome, jobs: MhJobs, wanted: MhWanted, me: MhMe, crew: MhCrew, card: MhCardScreen, take: MhTake,
              session: MhSession, live: MhLive, recap: MhRecap, slides: MhSlides,
              loading: MhLoading, cardpull: MhCardPull, repup: MhRepUp, rival: MhRival, settled: MhSettled, finale: MhFinale,
              share: MhShareSheet, story: MhStoryOnly }[name] || MhHome;
  // the preview is the organiser's phone: matches are tappable, as in the reference
  return <S key={route.join("/")} D={D} go={go} no={arg} start={+arg2 || 0} canScore what={arg}
    id={name === "share" || name === "story" ? arg2 : arg}
    progress={name === "loading" && arg ? +arg / 100 : undefined} ready={!(name === "loading" && arg)} tip={name === "loading" ? 1 : undefined} />;
}
ReactDOM.createRoot(document.getElementById("root")).render(<Preview />);
</script>
