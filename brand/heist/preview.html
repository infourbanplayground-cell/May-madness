// ── 01 HOME ──────────────────────────────────────────────────────────────
function MhHome({ D, go }) {
  const X = mhDerive(D);
  // the countdown moves every minute (spec); D.now pins it in preview only
  const [tick, setTick] = React.useState(0);
  React.useEffect(() => { if (D.now) return; const t = setInterval(() => setTick(x => x + 1), 60000); return () => clearInterval(t); }, [D.now]);
  const now = D.now ? new Date(D.now) : new Date();
  const live = D.sessions.find(s => s.state === "live");
  const next = D.sessions.find(s => s.no === D.homeNext) || D.sessions.find(s => s.state === "soon");
  const showLive = live && D.homeShowsLive;
  const hero = showLive ? live : (next || X.lastDone);
  const lead = X.players[0], second = X.players[1];
  const me = X.me, rival = me && X.above(me);
  const left = next && mhCountdown(mhStart(next.date, next.time), now);
  return (
    <MhPage D={D} tab="home" onTab={go} pad="0">
      <MhHeroCut height={470} src={hero && hero.art} pos={hero && hero.heroPos || "34% 20%"}
        scenes={D.scenes} sceneStart={mhSceneIndex(D, "home")} every={6000}>
        <div style={{ position: "absolute", left: 22, top: 250 }}><MhTitleLockup size="S" /></div>
      </MhHeroCut>
      <div className="mh-col" style={{ padding: "0 20px", marginTop: -8, gap: 10 }}>
        {showLive ? (
          <button type="button" className="mn-glass mh-tap" data-accent="coral" onClick={() => go("session", live.no)}>
            <div className="mh-split">
              <div>
                <MhLabel tone="coral">● Live now · {live.code}</MhLabel>
                <MhDisplay size={28} style={{ marginTop: 3 }}>{live.title}</MhDisplay>
                {live.progress && <MhSerif>{live.progress.played} of {live.progress.total} matches played</MhSerif>}
              </div>
              <MhDisplay size={18} tone="coral">OPEN ›</MhDisplay>
            </div>
          </button>
        ) : next ? (
          <button type="button" className="mn-glass mh-tap" onClick={() => go("session", next.no)}>
            <div className="mh-split">
              <div>
                <MhLabel tone="peach">Next job · {next.code}</MhLabel>
                <MhDisplay size={28} style={{ marginTop: 3 }}>{mhDay(next.date).toUpperCase()}</MhDisplay>
                <MhSerif>{next.time} · {MH.venue}</MhSerif>
              </div>
              {left && <div style={{ textAlign: "right" }}>
                <MhDisplay size={28} tone="peach">{left}</MhDisplay>
                <MhLabel>to go</MhLabel>
              </div>}
            </div>
          </button>
        ) : null}
        {typeof MhHomeClips === "function" && <MhHomeClips D={D} go={go} />}
        {D.preseason ? (
          <MhGlass>
            <MhLabel tone="peach">The table</MhLabel>
            <MhDisplay size={22} style={{ marginTop: 3, lineHeight: 1.05 }}>Opens after {(D.sessions[0] || {}).code || "EP.01"}</MhDisplay>
            <MhSerif size={14}>Everyone starts on zero on {D.sessions[0] ? mhDay(D.sessions[0].date) : "night one"}. Your rival is whoever finishes just above you.</MhSerif>
          </MhGlass>
        ) : <div className="mh-two">
          {lead && <button type="button" className="mn-glass mh-tap mh-small" onClick={() => go("wanted")}>
            <MhLabel tone="peach">Leader</MhLabel>
            <MhDisplay size={19} weight={800} style={{ marginTop: 3, lineHeight: 1.05 }}>{mhFirst(lead.name)} · {lead.points}</MhDisplay>
            <MhSerif size={14}>{second ? `${lead.points - second.points} clear` : "on top"}</MhSerif>
          </button>}
          {me && (rival ? (
            <button type="button" className="mn-glass mh-tap mh-small" onClick={() => go("rival")}>
              <MhLabel tone="teal">Your rival</MhLabel>
              <MhDisplay size={19} weight={800} style={{ marginTop: 3, lineHeight: 1.05 }}>{mhFirst(rival.name)} · {rival.points}</MhDisplay>
              <MhSerif size={14}>{mhPts(rival.points - me.points)} ahead</MhSerif>
            </button>
          ) : second && (
            <button type="button" className="mn-glass mh-tap mh-small" onClick={() => go("rival")}>
              <MhLabel tone="teal">#2 chasing</MhLabel>
              <MhDisplay size={19} weight={800} style={{ marginTop: 3, lineHeight: 1.05 }}>{mhFirst(second.name)} · {second.points}</MhDisplay>
              <MhSerif size={14}>{mhPts(me.points - second.points)} behind you</MhSerif>
            </button>
          ))}
        </div>}
      </div>
    </MhPage>
  );
}

// ── 02 JOBS ──────────────────────────────────────────────────────────────
function MhJobs({ D, go }) {
  const [f, setF] = React.useState("upcoming");
  const rows = D.sessions.filter(s => f === "all" || (f === "done" ? s.state === "done" : s.state !== "done"));
  const ordered = f === "done" ? rows.slice().reverse() : f === "all" ? rows
    : rows.concat(D.sessions.filter(s => s.state === "done").slice(-1));   // the reference trails the latest recap
  const upcoming = D.sessions.some(s => s.state !== "done");
  return (
    <MhPage D={D} tab="jobs" onTab={go}>
      <div className="mh-col">
        <MhTitle title="JOBS" aside={`${MH.month} · ${D.sessions.length} episodes`} />
        <MhPills label="Filter" items={[["upcoming", "Upcoming"], ["done", "Done"], ["all", "All"]]} value={f} onChange={setF} />
        {!upcoming && f === "upcoming" && (
          <button type="button" className="mn-glass mh-tap" onClick={() => go("take")}>
            <MhDisplay size={19}>Season complete</MhDisplay><MhSerif size={14}>See The Take ›</MhSerif>
          </button>
        )}
        {ordered.map(s => <MhJobRow key={s.no} s={s} go={go} />)}
      </div>
    </MhPage>
  );
}
function MhJobRow({ s, go }) {
  const live = s.state === "live", done = s.state === "done", signup = s.signups && s.signups.open;
  const day = mhDay(s.date);
  const label = live ? `● Live now · ${day}` : done ? day : `${day} · ${s.time}`;
  const tone = live ? "coral" : done ? "dim" : s.finale ? "gold" : signup ? "peach" : "mist";
  const sub = live && s.progress ? `${s.progress.played} of ${s.progress.total} matches played`
    : done ? `${(s.champions || []).map(mhFirst).join(" & ")} won · recap ›`
    : s.finale ? `Finale · 2× points`
    : signup ? `Signups open · ${s.signups.teams} of ${s.signups.max} teams`
    : s.signups && s.signups.opensOn ? `Signups open ${s.signups.opensOn}` : (s.doublePoints ? "2× points" : "");
  return (
    <div className="mh-job" data-state={live ? "live" : s.finale ? "finale" : done ? "done" : "soon"}>
      <button type="button" className="mh-jobmain" onClick={() => go(done ? "recap" : "session", s.no)}
        aria-label={`${s.code} ${s.title}`}>
        <div className="mh-thumb"><MhArt src={s.art} pos={s.artPos} sizes="96px" /></div>
        <div style={{ minWidth: 0 }}>
          <MhLabel tone={tone}>{label}</MhLabel>
          <div className="mn-display mh-jobtitle">{s.code} · {s.title}</div>
          {sub && <MhSerif size={14}>{sub}</MhSerif>}
        </div>
      </button>
      {live ? <MhDisplay size={15} tone="coral" style={{ alignSelf: "center" }}>OPEN ›</MhDisplay>
        : s.finale && !done ? <MhDisplay size={15} tone="gold" style={{ alignSelf: "center" }}>FINALE</MhDisplay>
        : signup ? <button type="button" className="mn-pill" aria-pressed="true" onClick={() => go("signup", s.no)}><span>Sign up</span></button>
        : null}
    </div>
  );
}

// ── 03 MOST WANTED ───────────────────────────────────────────────────────
function MhWanted({ D, go }) {
  const X = mhDerive(D);
  const lead = X.players[0];
  const bounty = r => (MH.seasonPrizes || [])[r - 1];
  return (
    <MhPage D={D} tab="wanted" onTab={go}>
      <div className="mh-col">
        <MhTitle title="MOST WANTED" aside={X.lastDone ? `after ${X.lastDone.code}` : "before EP.01"} />
        {D.preseason && (
          <MhGlass>
            <MhDisplay size={22} style={{ lineHeight: 1.05 }}>Nobody's wanted yet</MhDisplay>
            <MhSerif size={14}>The table fills in as {(D.sessions[0] || {}).code || "EP.01"} is played on {D.sessions[0] ? mhDay(D.sessions[0].date) : "night one"}. Last season's crew is on the Crew tab.</MhSerif>
          </MhGlass>
        )}
        {lead && !D.preseason && (
          <button type="button" className="mh-leader mh-tap" onClick={() => go("card", lead.id)}>
            <MhArt src={lead.photo} pos={lead.pos} name={lead.name} />
            <div className="mh-leaderfade" aria-hidden="true" />
            <div className="mh-stars" aria-hidden="true">★★★★★</div>
            <div className="mh-leaderbody">
              <MhLabel tone="gold">Most wanted · Rep {lead.rep.label}</MhLabel>
              <div className="mn-display" style={{ fontSize: 36, lineHeight: .86 }}>
                {lead.name.split(" ").map((w, i) => <React.Fragment key={i}>{i ? <br /> : null}{w}</React.Fragment>)}
              </div>
              <div className="mh-mono-row">
                <span>{lead.points} PTS</span>
                {bounty(1) && <span style={{ color: "var(--mn-peach)" }}>BOUNTY {bounty(1)} OMR</span>}
              </div>
            </div>
          </button>
        )}
        <div className="mh-replegend">
          {MH_REPS.slice().reverse().map(r => (
            <div key={r.id} style={{ borderTopColor: `var(--mn-rep-${r.id})` }}>
              <b>{r.label.toUpperCase()}</b><span>{r.perNight * Math.max(1, X.nightsPlayed)}+</span>
            </div>
          ))}
        </div>
        {X.players.length >= 2 && !D.preseason && (
          <div>
            {X.players.slice(1).map(p => {
              const g = X.gap(p), mine = X.me && p.id === X.me.id;
              const ring = p.rep.id === "rookie" ? null : `rep-${p.rep.id}`;
              return (
                <button type="button" key={p.id} className="mh-wrow mh-tap" data-me={mine ? "" : undefined}
                  onClick={() => go("card", p.id)}>
                  <div className="mn-display mh-wrank">{p.rank}</div>
                  <MhAvatar player={{ name: p.name, photo: p.photo, photoPos: p.avPos || p.pos }} size={34} ring={ring} zoom={p.zoom} />
                  <div style={{ minWidth: 0, textAlign: "left" }}>
                    <div className="mh-wname">{p.name}{mine && <span className="mn-serif"> you</span>}</div>
                    <MhLabel style={{ color: `var(--mn-rep-${p.rep.id})` }}>Rep · {p.rep.label.toUpperCase()}</MhLabel>
                  </div>
                  <div className="mh-wmove">{p.movement || "—"}</div>
                  <div style={{ textAlign: "right" }}>
                    <div className="mn-display" style={{ fontSize: 20, fontWeight: 800, lineHeight: 1 }}>{p.points}</div>
                    <div className="mh-wgap">{g === 0 ? "level" : `−${g}`}</div>
                  </div>
                </button>
              );
            })}
          </div>
        )}
      </div>
    </MhPage>
  );
}

// ── 04 ME ────────────────────────────────────────────────────────────────
const MH_SEG = [["groupWins", "Group wins", "var(--mn-teal)"], ["lossPts", "Loss points", "var(--mn-teal-45)", "var(--mn-teal-60)"],
                ["knockout", "Knockout", "var(--mn-coral)"], ["titles", "Titles", "var(--mn-sand)"],
                // comeback, streak and the 2X extra: the engine pays them and the design's four
                // segments have no room for them, so without this the bar would not add up to the total
                ["bonus", "Bonuses & 2X", "var(--mn-gold)"]];
function MhMe({ D, go }) {
  const X = mhDerive(D);
  const me = X.me;
  if (!me || !me.points) {
    return (
      <MhPage D={D} tab="me" onTab={go}>
        <div className="mh-col">
          <MhTitle title="ME" />
          {!D.meId && D.pickMe ? <MhGlass><MhDisplay size={22}>Who are you?</MhDisplay>
            <MhSerif size={14}>Pick yourself once and this phone shows your card, your rival and every point you earn.</MhSerif>
            <MhButton style={{ marginTop: 10, width: "100%" }} onClick={D.pickMe}>Pick yourself</MhButton></MhGlass>
          : <MhGlass><MhDisplay size={22}>Play your first night</MhDisplay>
            <MhSerif size={14}>Your card, your rival and every point you earn show up here.</MhSerif></MhGlass>}
        </div>
      </MhPage>
    );
  }
  const rival = X.above(me), next = mhNextRep(me.rep), n = Math.max(1, X.nightsPlayed);
  const lo = me.rep.perNight * n, hi = next ? next.perNight * n : lo;
  const frac = next ? Math.max(0, Math.min(1, (me.points - lo) / Math.max(1, hi - lo))) : 1;
  const seg = (D.me && D.me.seg) || {};
  const segTotal = MH_SEG.reduce((a, [k]) => a + (seg[k] || 0), 0);
  return (
    <MhPage D={D} tab="me" onTab={go}>
      <div className="mh-col">
        <div style={{ display: "flex", gap: 14, alignItems: "center" }}>
          <MhCrewCard player={{ name: me.name, photo: me.photo, photoPos: me.meCardPos || me.pos }} rank={me.rank}
            points={me.points} rep={me.rep} size="S" foil={false} onClick={() => go("card", me.id)} />
          <div style={{ flex: 1, display: "flex", flexDirection: "column", gap: 6 }}>
            <MhLabel>Your season</MhLabel>
            <MhDisplay size={56} style={{ lineHeight: .85 }}>{me.points}</MhDisplay>
            <div style={{ display: "flex", gap: 6 }}>
              <span className="mh-chip" data-tone={me.rep.id}>#{me.rank}</span>
              <span className="mh-chip" data-tone={me.rep.id}>REP {me.rep.label.toUpperCase()}</span>
            </div>
            {next ? <>
              <div className="mh-progress"><div className="mn-fill" style={{ width: (frac * 100).toFixed(1) + "%" }} /></div>
              <MhLabel>{mhPts(hi - me.points)} to {next.label}</MhLabel>
            </> : <MhLabel tone="gold">Top rep reached</MhLabel>}
          </div>
        </div>
        {rival && (
          <button type="button" className="mn-glass mh-tap" onClick={() => go("rival")}>
            <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
              <MhAvatar player={{ name: rival.name, photo: rival.photo, photoPos: rival.avPos || rival.pos }} size={42} ring="coral" zoom={rival.zoom} />
              <div style={{ flex: 1, textAlign: "left" }}>
                <MhLabel tone="coral">Your rival · #{rival.rank}</MhLabel>
                <MhDisplay size={20}>{mhFirst(rival.name)} · {rival.points}</MhDisplay>
                {D.rival && D.rival.h2h && <MhSerif size={14}>Head to head {D.rival.h2h.w}–{D.rival.h2h.l}</MhSerif>}
              </div>
              <div style={{ textAlign: "right" }}>
                <MhDisplay size={26} tone="peach">{rival.points - me.points}</MhDisplay>
                <MhLabel>pts</MhLabel>
              </div>
            </div>
          </button>
        )}
        {segTotal > 0 && <>
          <MhLabel>Where the points came from</MhLabel>
          <div className="mh-stack" role="img" aria-label={MH_SEG.map(([k, l]) => `${l} ${seg[k] || 0}`).join(", ")}>
            {MH_SEG.map(([k, , c]) => (seg[k] ? <div key={k} style={{ flex: seg[k], background: c }} /> : null))}
          </div>
          <div className="mh-legend">
            {MH_SEG.filter(([k]) => k !== "bonus" || seg[k]).map(([k, l, c, sw]) => (
              <div key={k}><span><span style={{ color: sw || c }}>■</span> {l}</span><b>{seg[k] || 0}</b></div>
            ))}
          </div>
        </>}
        {D.me && D.me.episodes && D.me.episodes.length > 0 && <>
          <MhLabel>Episode by episode</MhLabel>
          <div>
            {D.me.episodes.map(e => (
              <button type="button" key={e.session} className="mh-eprow mh-tap" onClick={() => go("receipt", e.session)}>
                <MhDisplay size={16} tone="mist">{D.sessions[e.session - 1].code}</MhDisplay>
                <span>{e.label}</span>
                <MhDisplay size={17} tone={e.title ? "gold" : e.knockout ? "teal" : undefined}>+{e.pts}</MhDisplay>
              </button>
            ))}
          </div>
        </>}
        <MhAlbum D={D} pid={me.id} go={go} title="Your loot" />
      </div>
    </MhPage>
  );
}

// ── 05 THE CREW ──────────────────────────────────────────────────────────
function MhCrew({ D, go }) {
  const X = mhDerive(D);
  const [t, setT] = React.useState("all");
  const tiers = [["all", "All"]].concat((MH.tiers || []).map(x => [x.id, x.label[0] + x.label.slice(1).toLowerCase()]));
  const shown = X.players.filter(p => t === "all" || p.tier.id === t);
  return (
    <MhPage D={D} tab="crew" onTab={go}>
      <div className="mh-col">
        <MhTitle title="THE CREW" aside={`${D.rosterSize || X.players.length} players`} />
        <MhPills label="Tier" items={tiers} value={t} onChange={setT} />
        <div className="mh-grid">
          {shown.map(p => (
            <MhCrewCard key={p.id} player={{ name: p.name, photo: p.photo, photoPos: p.pos }} rank={p.rank}
              points={p.points} rep={p.rep} size="M" onClick={() => go("card", p.id)} />
          ))}
        </div>
      </div>
    </MhPage>

}

// ── 06 CREW CARD ─────────────────────────────────────────────────────────
function MhCardScreen({ D, go, id }) {
  const X = mhDerive(D);
  const p = X.byId[id] || X.players[0];
  const own = X.me && p.id === X.me.id;
  // the app works you-v-them out for whichever card is open; the preview carries one fixed pair
  const v = D.vsFor ? D.vsFor(p.id) : D.vsCard && D.vsCard.playerId === p.id ? D.vsCard : null;
  return (
    <MhPage D={D} tab="crew" onTab={go} nav={false} pad="92px 20px 0">
      <div className="mh-col">
        <div className="mh-split">
          <MhLabel>Crew card</MhLabel>
          <button type="button" className="mh-close mn-serif" onClick={() => go("back")}>close ✕</button>
        </div>
        <div style={{ display: "flex", justifyContent: "center" }}>
          <MhCrewCard player={{ name: p.name, photo: p.photo, photoPos: p.pos }} rank={p.rank} points={p.points}
            rep={p.rep} size="L" stats={p.stats || {}} />
        </div>
        {/* the handoff's "Share (optional) → share sheet MY CARD", on your own card only */}
        {own && <MhButton live onClick={() => go("share", "card/" + p.id)}>Share my card</MhButton>}
        {!own && v && (
          <MhGlass>
            <div className="mh-split">
              <div>
                <MhLabel tone="coral">You vs him</MhLabel>
                <MhSerif size={14}>{v.meetings} meeting{v.meetings === 1 ? "" : "s"} · last {D.sessions[v.last.session - 1].code}, {v.last.won ? "won" : "lost"} {v.last.score}</MhSerif>
              </div>
              <MhDisplay size={28}>{v.w}–{v.l}</MhDisplay>
            </div>
          </MhGlass>
        )}
        <MhAlbum D={D} pid={p.id} go={go} title={own ? "Your loot" : `${mhFirst(p.name)}'s loot`} />
      </div>
    </MhPage>
  );
}

// ── 17 THE TAKE ──────────────────────────────────────────────────────────
function MhTake({ D, go }) {
  const X = mhDerive(D);
  const pool = (MH.seasonPrizes || []).reduce((a, b) => a + b, 0) + MH.voucher * 2 * D.sessions.length;
  const paid = D.paidOMR != null ? D.paidOMR : X.nightsPlayed * MH.voucher * 2;
  const left = pool - paid;
  const place = [["1ST", "gold"], ["2ND", "silver"], ["3RD", "bronze"]];
  return (
    <MhPage D={D} tab="me" onTab={go}>
      <div className="mh-col">
        <MhTitle title="THE TAKE" />
        <div className="mh-takehero">
          <MhArt src={mhScene(D, "take").src || D.sessions[D.sessions.length - 1].art} pos={mhScene(D, "take").pos || "center 50%"} />
          <div className="mh-takebody">
            <MhLabel tone="peach">Prize pool</MhLabel>
            <MhDisplay size={52} style={{ lineHeight: .9 }}>{pool} OMR</MhDisplay>
            <div style={{ display: "flex", gap: 14 }}><MhLabel tone="teal">{paid} paid</MhLabel><MhLabel tone="gold">{left} left</MhLabel></div>
          </div>
        </div>
        <div className="mh-col" style={{ gap: 6 }}>
          <div className="mh-split"><MhLabel tone="teal">Won so far</MhLabel><MhLabel>{X.nightsPlayed} of {D.sessions.length} nights</MhLabel></div>
          <div className="mh-meter"><div className="mn-fill" style={{ width: (paid / pool * 100).toFixed(1) + "%" }} /></div>
          <div className="mh-segs" style={{ gridTemplateColumns: `repeat(${D.sessions.length},minmax(0,1fr))` }}>
            {D.sessions.map(s => <div key={s.no} data-s={s.state === "done" ? "done" : s.finale ? "finale" : "rest"} />)}
          </div>
          <div className="mh-split mn-serif" style={{ fontSize: 13 }}><span>{paid} OMR in vouchers paid</span><span>{left} OMR still to win</span></div>
        </div>
        <MhLabel>If the season ended now</MhLabel>
        {X.players.slice(0, 3).map((p, i) => (
          <button type="button" key={p.id} className="mn-glass mh-tap mh-prize" onClick={() => go("card", p.id)}>
            <MhDisplay size={20} tone={place[i][1]} style={{ width: 36 }}>{place[i][0]}</MhDisplay>
            <MhAvatar player={{ name: p.name, photo: p.photo, photoPos: p.avPos || p.pos }} size={38} ring={place[i][1]} zoom={p.zoom} />
            <div className="mn-display" style={{ flex: 1, minWidth: 0, fontSize: 17, textAlign: "left" }}><span className="mh-fitline">{p.name}</span>
              <div className="mh-ptsline">{p.points} PTS</div></div>
            <MhDisplay size={24}>{MH.seasonPrizes[i]}<span className="mh-omr"> OMR</span></MhDisplay>
          </button>
        ))}
        <MhLabel>Nightly · {MH.voucher * 2} OMR to each episode's champions</MhLabel>
      </div>
    </MhPage>
  );
}

// MUSCAT HEIST · Vol.10 — the session night (handoff phase 3):
// 07 Session detail (Teams · Groups · Knockout · MVP) · 08 Live Scoring ·
// 09 Episode Recap · 10 Recap Slides. Values are the static design's own.
//
// SCORING IS NOT CHANGED. Live Scoring's "+1 MUNTHER" adds one GAME (the
// fixture is first to 6, at 5-3), so +1 / Undo / Lock result produce exactly
// the final score the app has always recorded — entered game by game instead
// of on a number pad. Lock calls back with { t1, t2 } and the app's own
// engine decides winner, loss type and points, as it always has.

// The session header: art with the cut, the back link, and the episode line.
function MhSessionHead({ s, height = 250, cut = [80, 100], fade = "session", back, label, tone = "coral", title, titleSize = 38, children }) {
  return (
    <MhHeroCut height={height} src={s && s.art} pos={s && s.artPos} cut={cut} fade={fade}>
      {back && <button type="button" className="mh-back" onClick={back.onClick}>‹ {back.label}</button>}
      {children}
      {title && (
        <div style={{ position: "absolute", left: 20, bottom: 46 }}>
          {label && <MhLabel tone={tone}>{label}</MhLabel>}
          <div className="mn-display" style={{ fontSize: titleSize, lineHeight: .9 }}>{title}</div>
        </div>
      )}
    </MhHeroCut>
  );
}

// ── 07 SESSION DETAIL ─────────────────────────────────────────────────────
// What the night IS, before which tab you are on: a played night says who won,
// a live one what is happening, an upcoming one when and how full. Then the
// four tabs, every row carrying faces, every result saying who won it.
function MhSession({ D, go, no, canScore }) {
  const s = D.sessions.find(x => x.no === +no) || D.sessions.find(x => x.state === "live") || D.sessions[0];
  const N = (D.nights && D.nights[s.no]) || {};
  const groups = Object.keys(N.groups || {});
  const koDrawn = !!(N.knockout && [].concat(N.knockout.qf || [], N.knockout.sf || [], N.knockout.final || []).some(m => m && (m.a || m.b)));
  const [tab, setTab] = React.useState(s.state === "done" && koDrawn ? "knockout" : groups.length ? "groups" : "teams");
  const firstOpen = groups.find(g => !(N.groups[g] || {}).done) || groups[0] || "A";
  const [g, setG] = React.useState(firstOpen);
  const live = s.state === "live";
  const stateLabel = live ? `● Live · ${mhDay(s.date)}` : s.state === "done" ? `Played · ${mhDay(s.date)}` : `${mhDay(s.date)} · ${s.time}`;
  const hasTeams = (N.teams || []).length > 0;
  const clipSt = mhUseClips()(s.state === "live");
  const clips = mhClipsFor(clipSt, s.date);
  return (
    <div className="mh-page">
      <main className="mh-body" data-bare="" style={{ padding: 0 }}>
        <MhSessionHead s={s} back={{ label: "Jobs", onClick: () => go("jobs") }}
          label={stateLabel + (s.doublePoints ? " · 2X" : "")} tone={live ? "coral" : "peach"} title={`${s.code} · ${s.title}`} />
        <div className="mh-col" style={{ padding: "4px 20px 0", gap: 12 }}>
          <MhNightStatus s={s} N={N} go={go} />
          <div className="mh-actions">
            {hasTeams && <button type="button" className="mh-act" onClick={() => go("nightshare", `${s.no}/${N.champion ? "champions" : koDrawn ? "lineup" : "draw"}`)}>
              <span aria-hidden="true">↗</span> Posts</button>}
            {s.state === "done" && <button type="button" className="mh-act" onClick={() => go("recap", s.no)}><span aria-hidden="true">★</span> Recap</button>}
            {canScore && s.sid && <button type="button" className="mh-act" data-org="" onClick={() => go("results", s.no)}><span aria-hidden="true">⚙</span> Organiser</button>}
            {(clips.length > 0 || s.state !== "soon") && <button type="button" className="mh-act" data-on={tab === "clips" ? "" : undefined}
              onClick={() => setTab(tab === "clips" ? (hasTeams ? "teams" : "") : "clips")}><span aria-hidden="true">▶</span> Clips{clips.length ? ` · ${clips.length}` : ""}</button>}
          </div>
          {tab === "clips" ? <MhClips st={clipSt} list={clips} /> : hasTeams ? <>
            <MhPills label="Session" items={[["teams", "Teams"], ["groups", "Groups"], ["knockout", "Knockout"], ["mvp", N.mvp && N.mvp.votes.length ? "MVP" : "Points"]]} value={tab} onChange={setTab} />
            {tab === "groups" && <>
              {groups.length > 0 && <MhPills label="Group" items={groups.map(x => [x, (N.groups[x] || {}).done ? `${x} ✓` : x])} value={g} onChange={setG} />}
              <MhGroupTable rows={(N.groups[g] || {}).standings || []} started={N.started} done={(N.groups[g] || {}).done} />
              <MhLabel>Group {g} matches{canScore ? " · tap to score" : ""}</MhLabel>
              {((N.groups[g] || {}).matches || []).map((m, i) => (
                <MhMatchCard key={i} m={m} onClick={canScore && m.state !== "final" ? () => go("live", `${s.no}/${m.id || g + i}`) : null} />
              ))}
            </>}
            {tab === "teams" && <MhTeams N={N} />}
            {tab === "knockout" && <MhKnockout N={N} />}
            {tab === "mvp" && <MhMvp N={N} />}

// the line under the header: who won / what is on / when it is

const MH_ROUNDS = [["qf", "Quarter-finals"], ["sf", "Semi-finals"], ["final", "Final"]];

// MVP when the players voted; tonight's points always — the engine's own

// ── 08 LIVE SCORING ───────────────────────────────────────────────────────
// Games, not points: each +1 is one game to that team. Serve alternates every
// game from whichever team served first (the score card that is lit). Lock
// hands { t1, t2 } to the app, whose existing engine validates and scores it.
function MhLive({ D, go, match, onLock }) {
  const L = match || D.live;
  const [a, setA] = React.useState(L.a || 0), [b, setB] = React.useState(L.b || 0);
  const [hist, setHist] = React.useState([]);
  const [clock, setClock] = React.useState(L.clock || "");
  React.useEffect(() => {
    if (L.clock) return;
    const f = () => { const d = new Date(); setClock(`${d.getHours()}:${String(d.getMinutes()).padStart(2, "0")}`); };
    f(); const t = setInterval(f, 30000); return () => clearInterval(t);
  }, [L.clock]);
  const firstServeA = (L.serving || "A") === "A" ? ((L.a + L.b) % 2 === 0) : ((L.a + L.b) % 2 === 1);
  const servingA = ((a + b) % 2 === 0) === firstServeA;
  const add = side => { setHist(h => h.concat([[a, b]])); side === "a" ? setA(a + 1) : setB(b + 1); };
  const undo = () => { if (!hist.length) return; const [x, y] = hist[hist.length - 1]; setA(x); setB(y); setHist(hist.slice(0, -1)); };
  const lines = t => { const p = t.split(" & "); return <>{p[0].toUpperCase()}<br />&amp; {(p[1] || "").toUpperCase()}</>; };
  const first = t => t.split(" & ")[0].toUpperCase();
  const Card = ({ team, score, on }) => (
    <MhGlass accent={on ? "peach-50" : undefined}>
      <div style={{ display: "grid", gridTemplateColumns: "1fr auto", alignItems: "center" }}>
        <div>
          {on && <MhLabel tone="peach">Serving</MhLabel>}
          <div className="mn-display" style={{ fontSize: 26, fontWeight: 800, lineHeight: 1.05, color: on ? undefined : "var(--mn-mist)" }}>{lines(team)}</div>
        </div>
        <div className="mn-display" style={{ fontSize: 92, lineHeight: .85, color: on ? undefined : "var(--mn-mist)" }} aria-live="polite">{score}</div>
      </div>
    </MhGlass>
  );
  return (
    <div className="mh-page mh-live">
      <main className="mh-body" data-bare="" style={{ padding: 0, display: "flex", flexDirection: "column", minHeight: "100dvh" }}>
        <MhHeroCut height={300} src={L.art} pos={L.artPos || "center 25%"} cut={[84, 100]} fade="live">
          {/* the pill is the way back to the session: the design has no other exit */}
          <button type="button" className="mh-livepill" onClick={() => go("back")} aria-label={`Back to the session — live, court ${L.court}, group ${L.group}`}>
            <span className="mh-dot" aria-hidden="true" /><MhLabel tone="sand">Live · Court {L.court} · Group {L.group}</MhLabel></button>
          <div className="mh-clock">{clock}</div>
        </MhHeroCut>
        <div className="mh-col" style={{ padding: "0 20px", gap: 8 }}>
          <Card team={L.teamA} score={a} on={servingA} />
          <Card team={L.teamB} score={b} on={!servingA} />
          <div className="mh-two" style={{ gap: 8 }}>
            <MhButton live onClick={() => add("a")} kind="primary">+1 {first(L.teamA)}</MhButton>
            <MhButton live onClick={() => add("b")} kind="ghost">+1 {first(L.teamB)}</MhButton>
          </div>
        </div>
        <div className="mh-livefoot">
          <button type="button" className="mh-undo" onClick={undo} disabled={!hist.length}>Undo</button>
          <MhButton kind="light" live onClick={() => onLock ? onLock({ t1: a, t2: b }) : go("back")}>Lock result</MhButton>
        </div>
      </main>
      <MhGrain />
    </div>
  );
}

// ── 09 EPISODE RECAP ──────────────────────────────────────────────────────
function MhRecap({ D, go, no }) {
  const s = D.sessions.find(x => x.no === +no) || D.sessions.filter(x => x.state === "done").slice(-1)[0];

    ["Biggest win", "teal", R.biggestWin.team.toUpperCase(), R.biggestWin.score.replace("-", "–")],
    ["Upset", "coral", R.upset.team.toUpperCase(), R.upset.note],
    rep ? ["Rep up", "teal", rep.name.toUpperCase(), `${rep.from} → ${rep.to}`]

          <div style={{ position: "absolute", left: 20, bottom: 64 }}>
            <MhLabel tone="gold">{s.code} · {s.title} · Champions</MhLabel>

            <MhSerif size={16} tone="sand">beat {R.beat.map(mhFirst).join(" & ")} {R.score.replace("-", "–")}{R.pointsEach ? ` · +${R.pointsEach} each` : ""}</MhSerif>
          </div>
        </MhHeroCut>
        <div className="mh-tiles">
          {tiles.map(([k, tone, name, sub]) => (

        {R.yourNight && (
          <div style={{ padding: "10px 20px 0" }}>
            <button type="button" className="mn-glass mh-tap" data-accent="teal-50" onClick={() => go("cardpull", s.no)}>

              </div>

        )}
        <div className="mh-recapfoot">
          <MhButton onClick={() => go("slides", s.no)}>Share</MhButton>

        </div>

      <MhGrain />

// ── 10 RECAP SLIDES ───────────────────────────────────────────────────────
// Five slides, 5s each, auto-advancing; pressed = paused. Tap the right third
// for next, the left third for previous; swipe down or ✕ to close; ←/→ keys.
// Under reduced motion nothing advances on its own and nothing animates.
const MH_SLIDE_MS = 5000;
function mhSlides(D, s, R) {
  const me = D.players.find(p => p.id === D.meId);
  const P = n => D.players.find(p => p.name === n || mhFirst(p.name) === n) || { name: n };
  const out = [
    { key: "Champions", label: "Champions", name: R.champions.map(mhFirst).join(" & "), sub: `beat ${R.beat.map(mhFirst).join(" & ")} ${R.score.replace("-", "–")}`, who: P(R.champions[0]) },
    // a night nobody voted on has no MVP slide rather than a slide that says "—"
    R.mvp.votes ? { key: "MVP", label: "MVP · player vote", name: R.mvp.name, sub: `${R.mvp.votes} vote${R.mvp.votes === 1 ? "" : "s"}${R.mvp.note ? " · " + R.mvp.note : ""}`, who: P(R.mvp.name) } : null,
    { key: "Biggest win", label: "Biggest win", name: R.biggestWin.team, sub: R.biggestWin.score.replace("-", "–"), who: P(R.biggestWin.team.split(" & ")[0]) },
    { key: "Upset", label: "Upset", name: R.upset.team, sub: R.upset.note, who: P(R.upset.team.split(" & ")[0]) },
  ];
  for (let k = out.length - 1; k >= 0; k--) if (!out[k]) out.splice(k, 1);
  if (R.yourNight && me) out.push({ key: "Your night", label: "Your night", name: `+${R.yourNight.points}`, sub: R.yourNight.note, who: me, last: true });
  return out;
}
function MhSlides({ D, go, no, start = 0 }) {
  const s = D.sessions.find(x => x.no === +no) || D.sessions.filter(x => x.state === "done").slice(-1)[0];
  const R = (D.recaps || {})[s.no];
  const slides = mhSlides(D, s, R);
  const [i, setI] = React.useState(Math.min(start, slides.length - 1));
  const [held, setHeld] = React.useState(false);
  const reduced = React.useMemo(() => matchMedia("(prefers-reduced-motion: reduce)").matches, []);
  const touch = React.useRef(null);
  const next = () => setI(x => Math.min(slides.length - 1, x + 1));
  const prev = () => setI(x => Math.max(0, x - 1));
  React.useEffect(() => {
    if (reduced || held || i >= slides.length - 1) return;
    const t = setTimeout(next, MH_SLIDE_MS); return () => clearTimeout(t);
  }, [i, held, reduced]);
  React.useEffect(() => {
    const k = e => { if (e.key === "ArrowRight") next(); else if (e.key === "ArrowLeft") prev(); else if (e.key === "Escape") go("back"); };
    addEventListener("keydown", k); return () => removeEventListener("keydown", k);
  }, []);
  const S = slides[i];
  const tap = e => { const x = e.clientX / innerWidth; if (x > 2 / 3) next(); else if (x < 1 / 3) prev(); };
  return (
    <div className="mh-slides" onPointerDown={() => setHeld(true)} onPointerUp={() => setHeld(false)} onPointerLeave={() => setHeld(false)}
      onClick={tap}
      onTouchStart={e => { touch.current = e.touches[0].clientY; }}
      onTouchEnd={e => { if (touch.current != null && e.changedTouches[0].clientY - touch.current > 90) go("back"); touch.current = null; }}>
      <div className="mh-slidesart"><MhArt src={R.art || s.art} pos={R.artPos || "center 50%"} /></div>
      <div className="mh-slidesfade" aria-hidden="true" />
      <div className="mh-segbar" aria-hidden="true">
        {slides.map((x, k) => (
          <div key={x.key}><div style={{ width: k < i ? "100%" : k > i ? "0%" : (reduced ? "100%" : undefined) }}
            className={k === i && !reduced ? "mh-segrun" : undefined} data-held={held ? "" : undefined} /></div>
        ))}
      </div>
      <div className="mh-slideshead">
        <MhLabel tone="sand">{s.code} recap · {i + 1} of {slides.length}</MhLabel>
        <button type="button" className="mh-x" onClick={e => { e.stopPropagation(); go("back"); }} aria-label="Close">✕</button>
      </div>
      <div className="mh-slide" key={S.key} aria-live="polite">
        <div className="mh-slidephoto">
          <MhAvatar player={{ name: S.who.name, photo: S.who.photo, photoPos: S.who.avPos || S.who.pos }} size={150} zoom={S.who.zoom} />
        </div>
        <MhLabel tone="peach">{S.label}</MhLabel>
        <div className="mn-display" style={{ fontSize: 64, lineHeight: .86 }}>{S.name}</div>
        <MhSerif size={18}>{S.sub}</MhSerif>
        {S.last && <MhButton onClick={e => { e.stopPropagation(); go("share", s.no); }} style={{ marginTop: 8, width: "100%" }}>Share</MhButton>}
      </div>
      <div className="mh-slidesfoot">
        <button type="button" className="mh-hint" onClick={e => { e.stopPropagation(); prev(); }} disabled={i === 0}>{i > 0 ? `‹ ${slides[i - 1].key}` : ""}</button>
        <button type="button" className="mh-hint" data-next="" onClick={e => { e.stopPropagation(); next(); }} disabled={i === slides.length - 1}>{i < slides.length - 1 ? `${slides[i + 1].key} ›` : ""}</button>
      </div>
    </div>
  );
}


// ── CLIPS (SaveMyPlay), as National has them ────────────────────────────────
// A player presses the button on court after a point and the last 25 seconds
// land on the club's SaveMyPlay page a few minutes later. The fetching, the
// night a clip belongs to (Muscat time, anything before 04:00 is the night
// before) and the polling are National's own (useNaClips, naClipsForNight),
// inherited with the page; these are the Heist screens over them. Nothing is
// copied to our server: the video plays from SaveMyPlay and links back there.
const mhNoClips = () => ({ clips: [], err: false });
function mhUseClips() { return typeof useNaClips === "function" ? useNaClips : mhNoClips; }
function mhClipsFor(st, date) { return typeof naClipsForNight === "function" ? naClipsForNight(st.clips, date) : []; }
const mhClipLine = c => (typeof naClipCourt === "function" ? naClipCourt(c) : "Court") + " · " + (typeof naClipWhen === "function" ? naClipWhen(c) : "");

function MhClipThumb({ c, onPick, wide }) {
  return (
    <button type="button" className="mh-clip" data-wide={wide ? "" : undefined} onClick={onPick} aria-label={"Play clip, " + mhClipLine(c)}>
      <img src={c.thumb} alt="" loading="lazy" decoding="async" />
      <span className="mh-clipplay" aria-hidden="true">▶</span>
      <span className="mh-clipcap">{mhClipLine(c)}</span>
    </button>
  );
}
function MhClipViewer({ list, at, onAt, onClose }) {
  const c = list[at];
  React.useEffect(() => {
    const k = e => { if (e.key === "Escape") onClose(); };
    addEventListener("keydown", k); return () => removeEventListener("keydown", k);
  }, []);
  if (!c) return null;
  const page = typeof naClipPage === "function" ? naClipPage(c) : (typeof NA_HIGHLIGHTS_URL !== "undefined" ? NA_HIGHLIGHTS_URL : "#");
  // portalled to <body>: inside the page it inherited the screen's entrance
  // animation, whose transform turns position:fixed into "fixed to the column"
  const ui = (
    <div className="mh-clipview" role="dialog" aria-modal="true" aria-label="Clip">
      <div className="mh-clipbar">
        <MhLabel tone="sand">{mhClipLine(c)}</MhLabel>
        <span className="mh-clipn">{at + 1} / {list.length}</span>
        <button type="button" className="mh-clipx" onClick={onClose} aria-label="Close">✕</button>
      </div>
      <video key={c.id} src={c.video} poster={c.poster || c.thumb} controls playsInline autoPlay preload="metadata" />
      <div className="mh-clipnav">
        <button type="button" className="mh-act" disabled={at === 0} onClick={() => onAt(at - 1)}>← Earlier</button>
        <a className="mh-act" href={c.video} download target="_blank" rel="noopener noreferrer">⤓ Save</a>
        <button type="button" className="mh-act" disabled={at === list.length - 1} onClick={() => onAt(at + 1)}>Later →</button>
      </div>
      <a className="mh-cliplink" href={page} target="_blank" rel="noopener noreferrer">Open on SaveMyPlay ↗</a>
    </div>
  );
  return ReactDOM.createPortal(ui, document.body);
}
function MhClips({ st, list }) {
  const [at, setAt] = React.useState(null);
  const all = typeof NA_HIGHLIGHTS_URL !== "undefined" ? NA_HIGHLIGHTS_URL : null;
  return (
    <div className="mh-col" style={{ gap: 10 }}>
      <div className="mh-split"><MhDisplay size={22}>From the courts</MhDisplay>
        {list.length > 0 && <MhLabel>{list.length} clip{list.length === 1 ? "" : "s"}</MhLabel>}</div>
      <MhSerif size={14} tone="mist">Press the SaveMyPlay button on court after a point and the last 25 seconds land here a few minutes later.</MhSerif>
      {st.clips === null && !st.err && <div className="mh-clipgrid">{[0, 1, 2, 3].map(k => <div key={k} className="mh-clip" data-skel="" />)}</div>}
      {st.err && !st.clips && <MhSerif size={14}>The clips could not be loaded just now.</MhSerif>}
      {st.clips && list.length === 0 && <MhSerif size={14}>No clips from this night yet.</MhSerif>}
      {list.length > 0 && <div className="mh-clipgrid">{list.map((c, k) => <MhClipThumb key={c.id} c={c} onPick={() => setAt(k)} />)}</div>}
      {all && <a className="mh-cliplink" href={all} target="_blank" rel="noopener noreferrer">Every clip from the club on SaveMyPlay ↗</a>}
      {at !== null && <MhClipViewer list={list} at={at} onAt={setAt} onClose={() => setAt(null)} />}
    </div>
  );
}
// HOME: the latest night's clips for a week after it, then only the night page has them
function MhHomeClips({ D, go }) {
  const st = mhUseClips()(false);
  const [at, setAt] = React.useState(null);
  if (!st.clips || !st.clips.length || typeof naClipNight !== "function") return null;
  const newest = [...st.clips].sort((a, b) => b.start_time - a.start_time)[0];
  if (Date.now() / 1000 - newest.start_time > 7 * 86400) return null;
  const night = naClipNight(newest);
  const list = mhClipsFor(st, night).reverse().slice(0, 12);
  const s = (D.sessions || []).find(x => x.date === night);
  return (
    <div className="mh-col" style={{ gap: 8 }}>
      <div className="mh-split"><MhLabel tone="peach">Latest clips · {s ? s.code : mhDay(night)}</MhLabel>
        {s && <button type="button" className="mh-linkbtn" onClick={() => go("session", s.no)}>All {list.length} ›</button>}</div>
      <div className="mh-cliprow">{list.map((c, k) => <MhClipThumb key={c.id} c={c} wide onPick={() => setAt(k)} />)}</div>
      {at !== null && <MhClipViewer list={list} at={at} onAt={setAt} onClose={() => setAt(null)} />}
    </div>
  );
}

// MUSCAT HEIST · Vol.10 — the moments (handoff phase 4):
// 11 Now Loading Muscat · 12 New Crew Card · 13 Rep Up · 14 Your Rival ·
// 15 Score Settled · 16 The Big Score. Values are the static design's own.
//
// Every figure is DERIVED, never copied out of the fixture's prose: the gap
// to your rival is the difference in points, "10 to Known" is the next rep's
// per-night threshold times the nights played, the next rival after Score
// Settled is recomputed from the table with the locked result applied, and
// the leader's lead is #1 minus #2. Boss Kill +3 is not scored anywhere and
// its rule row only shows while bossKillBonus.enabled (handoff rule 11).

// a moment's player rows, in the shape the screens read
const mhRepById = id => MH_REPS.find(r => r.id === id) || MH_REPS[MH_REPS.length - 1];
const mhTierById = id => (MH.tiers || []).find(t => t.id === id);
const mhTierIdx = id => (MH.tiers || []).findIndex(t => t.id === id);

// The full-screen backdrop the moments share: the player's art, blurred and
// darkened, under a radial glow in the moment's own colour.
function MhMomentBack({ src, pos, dim = .6, glow, at = "50% 45%", strength = 35, fadeTo = 70, fadeAt = 60 }) {
  return (
    <>
      <div className="mh-mback" aria-hidden="true" style={{ "--mh-dim": dim }}><MhArt src={src} pos={pos} /></div>
      <div className="mh-mglow" aria-hidden="true" style={{
        background: `radial-gradient(circle at ${at}, color-mix(in srgb, var(--mn-${glow}) ${strength}%, transparent), color-mix(in srgb, var(--mn-navy) ${fadeTo}%, transparent) ${fadeAt}%)` }} />
    </>
  );
}
function MhMoment({ children, foot, kind }) {
  return (
    <div className="mh-page mh-moment" data-kind={kind}>
      <main className="mh-body" data-bare="" style={{ padding: 0, display: "flex", flexDirection: "column", minHeight: "100dvh" }}>
        {children}
        {foot && <div className="mh-momentfoot">{foot}</div>}
      </main>
      <MhGrain />
    </div>
  );
}

// ── 11 NOW LOADING MUSCAT ─────────────────────────────────────────────────
// Shown while the app loads and on the first open of a session day, once per
// device per day. progress: 0..1, from the real load; the bar never finishes
// in under MH_LOAD_MIN, and a tap only goes through once the data is ready.
const MH_LOAD_MIN = 1200;
// "Once" is per device: a moment is keyed by what it is about, e.g.
// mhOnce("loaded", "2026-12-21"), mhOnce("card", "p05/5"), mhOnce("rep", "p05/rising").
// due() asks, seen() records. Storage can be missing (private mode) — then a
// moment shows again rather than never, which is the cheaper of the two faults.
const mhOnce = (kind, key) => ({
  due() { try { return localStorage.getItem("mh-once-" + kind) !== key && !(localStorage.getItem("mh-once-" + kind + "-" + key)); } catch (e) { return true; } },
  seen() { try { localStorage.setItem(kind === "loaded" ? "mh-once-loaded" : "mh-once-" + kind + "-" + key, kind === "loaded" ? key : "1"); } catch (e) { /* show again next time */ } },
});
// The tips in heist-season.json, filled from the player's own data. A tip
// whose blanks cannot be filled is skipped rather than shown with a hole.
function mhTips(D, X) {
  const me = X.me, rival = me && X.above(me), next = me && mhNextRep(me.rep);
  const n = Math.max(1, X.nightsPlayed);
  const fin = D.sessions.find(s => s.finale);
  const vals = {
    rival: rival && mhFirst(rival.name), gap: rival && rival.points - me.points,
    n: next && Math.max(0, next.perNight * n - me.points), nextRep: next && next.label,
    finaleDay: fin && mhDay(fin.date), voucher: MH.voucher,
  };
  return (MH.tips || []).map(t => {
    let ok = true;
    const s = t.replace(/\{(\w+)\}/g, (_, k) => { if (vals[k] == null) ok = false; return vals[k]; });
    return ok ? s : null;
  }).filter(Boolean);
}
function MhLoading({ D, go, progress, ready = true, tip }) {
  // GTA-style: one full-bleed poster at a time, panning slowly across the art,
  // the title big in the corner, the tip in a dark box, a spinner bottom right.
  // The owner's own posters go first (loadingArt), then the episode scenes.
  const X = mhDerive(D);
  const nx = D.sessions.find(x => x.no === (D.homeNext || 0)) || D.sessions.find(x => x.state !== "done") || D.sessions[D.sessions.length - 1];
  let list = [...(D.loadingArt || []), ...(D.scenes || [])];
  if (!list.length && nx && nx.art) list = [{ src: nx.art, pos: nx.artPos, code: nx.code, title: nx.title }];  // preview data has no scene list
  const start = (Math.floor(Date.now() / 864e5)) % Math.max(1, (D.loadingArt || []).length || list.length);
  const tips = mhTips(D, X);
  const line = tips.length ? tips[(tip != null ? tip : Math.floor(Date.now() / 864e5)) % tips.length] : "";
  const [scene, setScene] = React.useState(start);
  const cur = list[scene] || {};
  const [t, setT] = React.useState(progress != null ? progress : 0);
  React.useEffect(() => {
    if (progress != null) { setT(progress); return; }
    const t0 = performance.now(); let raf;
    const f = now => { const k = Math.min(1, (now - t0) / MH_LOAD_MIN); setT(k); if (k < 1) raf = requestAnimationFrame(f); };
    raf = requestAnimationFrame(f); return () => cancelAnimationFrame(raf);
  }, [progress]);
  const done = ready && t >= 1;
  return (
    <div className="mh-page mh-loading" data-gta="">
      <button type="button" className="mh-loadtap" disabled={!done} onClick={() => go("home")}
        aria-label={done ? "Continue to Home" : "Loading"}>
        <div className="mh-loadart"><MhScenes list={list} start={start} every={4200} onIndex={setScene} /></div>
        <div className="mh-loadshade" aria-hidden="true" />
        {cur.code && <div className="mh-loadtag" key={cur.code}><MhSceneTag>{cur.code} · {cur.title}</MhSceneTag></div>}
        <div className="mh-loadlock"><MhTitleLockup size="M" /></div>
        <div className="mh-loadfoot">
          {line && <div className="mh-loadtip"><MhLabel tone="peach">Did you know</MhLabel>
            <MhSerif size={16} tone="sand" style={{ lineHeight: 1.3 }}>{line}</MhSerif></div>}
        </div>
        <div className="mh-loadspin" data-done={done ? "" : undefined}>
          {done ? <MhLabel tone="sand">Tap to continue</MhLabel>
                : <><span className="mh-spinner" aria-hidden="true" /><MhLabel tone="sand">Now loading Muscat</MhLabel></>}
        </div>
        <div className="mh-loadbar">
          <div role="progressbar" aria-valuemin={0} aria-valuemax={100} aria-valuenow={Math.round(t * 100)}
            aria-label="Now loading Muscat"><div style={{ width: (t * 100) + "%" }} /></div>
        </div>
      </button>
      <MhGrain />
    </div>
  );
}

// ── 12 NEW CREW CARD ──────────────────────────────────────────────────────
// After each finished session, once per player per session: the card as it
// now stands. The headline follows the tier change (up / holding / down).
function MhCardPull({ D, go, no }) {
  const X = mhDerive(D);
  const m = (D.moments || []).find(x => x.type === "tierUp" && (no == null || x.session === +no))
    || (X.me ? { playerId: X.me.id, session: +no || X.lastDone, from: X.me.tier.id, to: X.me.tier.id } : {});
  const p = X.byId[m.playerId];
  const s = D.sessions.find(x => x.no === m.session);
  React.useEffect(() => { if (!p || !s) go("home"); }, [p, s]);
  if (!p || !s) return null;
  const from = mhTierById(m.from), to = p.tier;
  const dir = mhTierIdx(to.id) < mhTierIdx(from.id) ? "up" : mhTierIdx(to.id) > mhTierIdx(from.id) ? "down" : "hold";
  const title = dir === "up" ? <>TIER UP:<br /><span className="mh-hl" style={{ color: "var(--mn-gold)" }}>{to.label}</span></>
    : dir === "down" ? <>TIER DOWN:<br /><span className="mh-hl">{to.label}</span></>
    : <>HOLDING<br /><span className="mh-hl" style={{ color: "var(--mn-gold)" }}>{to.label}</span></>;
  const where = p.rank === 1 ? "top of the table" : `#${p.rank} on the table`;
  const cap = w => w.charAt(0) + w.slice(1).toLowerCase();
  const line = dir === "up" ? `Upgraded from ${cap(from.label)} · ${where}`
    : dir === "down" ? `Down from ${cap(from.label)} · ${where}` : `Still ${cap(to.label)} · ${where}`;
  return (
    <MhMoment foot={<>
      <MhButton kind="ghost" live onClick={() => go("crew")}>Collection</MhButton>
      <MhButton live onClick={() => go("share", "card/" + p.id)}>Share card</MhButton>
    </>}>
      <MhMomentBack src={p.photo} pos={p.heroPos || p.pos} dim={.6} glow="gold" />
      <div className="mh-pullhead">
        <MhLabel tone="peach">New crew card · {s.code}</MhLabel>
        <h1 className="mn-display mh-mtitle" style={{ fontSize: 44, lineHeight: .9, textAlign: "center" }}>{title}</h1>
        <div style={{ marginTop: 8 }}>
          <MhCrewCard player={{ name: p.name, photo: p.photo, photoPos: p.pos }} rank={p.rank} points={p.points}
            rep={p.rep} size="L" stats={p.stats || {}} />
        </div>
        <MhSerif size={15}>{line}</MhSerif>
      </div>
    </MhMoment>
  );
}

// ── 13 REP UP ─────────────────────────────────────────────────────────────
function MhRepUp({ D, go, id }) {
  const X = mhDerive(D);
  const m = (D.moments || []).find(x => x.type === "repUp" && (id == null || x.playerId === id));
  // a moment that is not (or no longer) true is never drawn: a stale link goes home
  React.useEffect(() => { if (!m) go("home"); }, [m]);
  if (!m || !X.byId[m.playerId]) return null;
  const p = X.byId[m.playerId];
  const from = mhRepById(m.from), to = mhRepById(m.to), next = mhNextRep(to);
  const nights = m.session;                               // the threshold is per night played
  const pts = m.points != null ? m.points : p.points;
  const tail = next ? `${Math.max(0, next.perNight * nights - pts)} to ${next.label}` : "Top rep reached";
  const glow = `rep-${to.id}`;
  return (
    <MhMoment foot={<MhButton live onClick={() => go("share", "rep/" + p.id)} style={{ width: "100%" }}>Share the moment</MhButton>}>
      <MhMomentBack src={p.photo} pos={p.pos} dim={.4} glow={glow} at="50% 38%" fadeTo={85} fadeAt={65} />
      <div className="mh-repphoto" style={{ "--mh-glow": `var(--mn-${glow})` }}>
        <div className="mn-ring" aria-hidden="true" /><div className="mn-ring" aria-hidden="true" />
        <MhAvatar player={{ name: p.name, photo: p.photo, photoPos: p.avPos || p.pos }} size={200} zoom={p.zoom} />
      </div>
      <div className="mh-reptext">
        <MhLabel style={{ color: `var(--mn-${glow})` }}>Rep up</MhLabel>
        <h1 className="mn-display mn-slam" style={{ fontSize: 56, lineHeight: .86, margin: 0 }}>
          {mhFirst(p.name).toUpperCase()} IS<br /><span style={{ color: `var(--mn-${glow})` }}>{to.label.toUpperCase()}</span></h1>
        <MhSerif size={16}>{from.label} → {to.label} · {pts} pts · {tail}</MhSerif>
      </div>
    </MhMoment>
  );
}

// ── 14 YOUR RIVAL ─────────────────────────────────────────────────────────
// The player directly above you; at #1 it turns round and shows #2 chasing.
function MhRival({ D, go }) {
  const X = mhDerive(D);
  const me = X.me;
  const top = me.rank === 1;
  const them = top ? X.players.find(p => p.rank === 2) : X.above(me);
  const R = D.rival && D.rival.rivalId === them.id ? D.rival : { h2h: { w: 0, l: 0 }, meetings: [] };
  const gap = Math.abs(them.points - me.points);
  const tone = r => /^won|champ/i.test(r) ? (/champ/i.test(r) ? "gold" : "teal") : "coral";
  const Side = ({ p, right, tag, color }) => (
    <div className="mh-rivside" data-right={right ? "" : undefined}>
      <MhLabel tone={color}>{tag}</MhLabel>
      <div className="mn-display" style={{ fontSize: 34, lineHeight: .9 }}>{mhFirst(p.name).toUpperCase()}</div>
      <MhDisplay size={26} tone={color} style={{ lineHeight: 1.15 }}>{p.points}</MhDisplay>
    </div>
  );
  return (
    <div className="mh-page">
      <main className="mh-body" data-bare="" style={{ padding: 0 }}>
        <div className="mh-split2">
          <div className="mh-half" data-side="l"><div><MhArt src={me.photo} pos={me.splitPos || me.pos} /></div></div>
          <button type="button" className="mh-half" data-side="r" onClick={() => go("card", them.id)} aria-label={`${them.name}'s crew card`}>
            <div><MhArt src={them.photo} pos={them.splitPos || them.pos} /></div></button>
          <svg className="mh-splitline" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
            <line x1="58" y1="0" x2="42" y2="100" vectorEffect="non-scaling-stroke" /></svg>
          <div className="mh-splitfade" aria-hidden="true" />
          <div style={{ position: "absolute", left: 20, top: 58 }}><MhLabel tone="peach">{top ? "#2 chasing" : "Your rival"}</MhLabel></div>
          <Side p={me} tag={`You · #${me.rank}`} color="teal" />
          <Side p={them} right tag={`#${them.rank}`} color="coral" />
        </div>
        <div className="mh-col" style={{ padding: "12px 20px 0", gap: 10 }}>
          <MhGlass accent="gold-50" style={{ textAlign: "center" }}>
            <MhDisplay size={30} tone="gold" style={{ lineHeight: 1.15 }}>{gap} PT{gap === 1 ? "" : "S"} {top ? "IN HAND" : "TO SETTLE IT"}</MhDisplay>
            <MhLabel>Head to head this season · {R.h2h.w}–{R.h2h.l}</MhLabel>
          </MhGlass>
          {R.meetings.map(x => (
            <div key={x.session + x.label} className="mh-meet">
              <span>{D.sessions[x.session - 1].code} · {x.label}</span>
              <span style={{ color: `var(--mn-${tone(x.result)})` }}>{x.result.replace("-", "–")}</span>
            </div>
          ))}
        </div>
      </main>
      <MhGrain />
    </div>
  );
}

// ── 15 SCORE SETTLED ──────────────────────────────────────────────────────
// Fires when a locked result moves you above your rival. The new rank and the
// next rival are RECOMPUTED from the table with the locked points applied,
// not read from the moment, so the screen cannot disagree with Most Wanted.
function MhSettled({ D, go }) {
  const X = mhDerive(D);
  const m = (D.moments || []).find(x => x.type === "scoreSettled");
  React.useEffect(() => { if (!m) go("home"); }, [m]);
  if (!m || !X.byId[m.playerId] || !X.byId[m.overtookId]) return null;
  const now = { [m.playerId]: m.points[0], [m.overtookId]: m.points[1] };
  const table = X.players.map(p => ({ ...p, points: now[p.id] != null ? now[p.id] : p.points }))
    .sort((a, b) => b.points - a.points || a.rank - b.rank);
  const at = table.findIndex(p => p.id === m.playerId);
  const me = table[at], beaten = table.find(p => p.id === m.overtookId);
  const was = X.byId[m.playerId].rank, rank = at + 1;
  const next = table[at - 1];
  const s = D.sessions.find(x => x.no === m.session);
  return (
    <MhMoment kind="settled" foot={<MhButton live onClick={() => go("share", "settled")} style={{ width: "100%" }}>Share the moment</MhButton>}>
      <MhHeroCut height={500} src={me.photo} pos={me.splitPos || me.pos} cut={[86, 100]} fade="settled">
        <div className="mh-settledhead">
          <MhLabel tone="peach">{s.code} · result locked</MhLabel>
          <h1 className="mn-display mn-slam mh-shout" style={{ fontSize: 68 }}>SCORE<br /><span style={{ color: "var(--mn-coral)" }}>SETTLED</span></h1>
        </div>
      </MhHeroCut>
      <div className="mh-tiles" style={{ paddingTop: 8 }}>
        <MhGlass style={{ padding: "12px 14px" }}>
          <MhLabel tone="teal">New rank</MhLabel>
          <MhDisplay size={30} style={{ lineHeight: 1.15 }}>#{rank} {was > rank && <span style={{ fontSize: 16, color: "var(--mn-teal)" }}>▲{was - rank}</span>}</MhDisplay>
          <MhSerif size={13}>{me.name} {me.points} · {beaten.name} {beaten.points}</MhSerif>
        </MhGlass>
        <MhGlass style={{ padding: "12px 14px" }}>
          <MhLabel tone="coral">Next rival</MhLabel>
          {next ? <>
            <MhDisplay size={20} style={{ lineHeight: 1.05 }}>{next.name.toUpperCase()}</MhDisplay>
            <MhSerif size={13}>{next.points - me.points} pts ahead</MhSerif>
          </> : <><MhDisplay size={20} style={{ lineHeight: 1.05 }}>NOBODY</MhDisplay><MhSerif size={13}>top of the table</MhSerif></>}
        </MhGlass>
      </div>
    </MhMoment>
  );
}

// ── 16 THE BIG SCORE ──────────────────────────────────────────────────────
function MhFinale({ D, go }) {
  const X = mhDerive(D);
  const s = D.sessions.find(x => x.finale);
  const [lead1, lead2] = X.players;                       // ranked
  const lead = lead1.points - lead2.points;

        <MhGlass accent="gold-45">
          <button type="button" className="mh-target" onClick={() => go("card", lead1.id)}>
            <MhAvatar player={{ name: lead1.name, photo: lead1.photo, photoPos: lead1.pos }} size={46} ring="gold" />
            <div style={{ flex: 1, minWidth: 0, textAlign: "left" }}>
              <MhLabel tone="gold">The target · #1</MhLabel>
              <MhDisplay size={22} style={{ lineHeight: 1.15 }}>{lead1.name.toUpperCase()}</MhDisplay>
            </div>
            <MhDisplay size={26}>{lead1.points}</MhDisplay>
          </button>
          <div className="mh-split" style={{ marginTop: 10 }}><MhLabel>His lead</MhLabel><MhLabel>{lead} / {atStart}</MhLabel></div>
          <div className="mh-leadbar"><div style={{ width: Math.max(0, Math.min(100, atStart ? lead / atStart * 100 : 0)) + "%" }} /></div>
        </MhGlass>

// MUSCAT HEIST · Vol.10 — the share exports (handoff phase 5):
// 18 Story · Campaign Poster, 19 Story · Contenders, and MY CARD.
//
// Each story is a 416x740 frame, the handoff's own artboard, exported at
// 1080x1920 (x2.596). The frame on screen IS the export — the sheet's
// preview and the saved PNG are the same DOM — so what somebody sees is what
// they post. Every word on them is data: the starring names are the table's
// top five, "27 MORE" is the roster minus them, the pool is derived, the days
// and the first night come from the nights list, and the contenders' "Eleven
// points" is #1 minus #2 in words.
const MH_STORY = { w: 416, h: 740, outW: 1080, outH: 1920 };
const MH_WORDS = ["Zero", "One", "Two", "Three", "Four", "Five", "Six", "Seven", "Eight", "Nine", "Ten", "Eleven",
  "Twelve", "Thirteen", "Fourteen", "Fifteen", "Sixteen", "Seventeen", "Eighteen", "Nineteen"];
const MH_TENS = ["", "", "Twenty", "Thirty", "Forty", "Fifty", "Sixty", "Seventy", "Eighty", "Ninety"];
function mhWords(n) {
  if (n < 20) return MH_WORDS[n];
  if (n < 100) return MH_TENS[Math.floor(n / 10)] + (n % 10 ? "-" + MH_WORDS[n % 10].toLowerCase() : "");
  return String(n);
}
const mhPool = D => (MH.seasonPrizes || []).reduce((a, b) => a + b, 0) + MH.voucher * 2 * D.sessions.length;
// "Mon & Wed", from the weekdays the nights actually fall on — in week order,
// Monday first: the season opens on a Wednesday, and in date order this read
// "Wed & Mon".
function mhDays() {
  const seen = [];
  (MH.nights || []).forEach(n => { const k = (mhDate(n).getDay() + 6) % 7; if (seen.indexOf(k) < 0) seen.push(k); });
  return seen.sort((a, b) => a - b).map(k => MH_DOW[(k + 1) % 7]).join(" & ");
}
const mhArt = (D, file) => (D.artBase || "") + file;

function MhStoryFrame({ children, label }) {
  return <div className="mh-story" role="img" aria-label={label}>{children}<MhGrain /></div>;

// the film-credits block both stories close on
function MhStoryBilling({ D, X }) {
  const S = MH.stories || {};
  const played = X.players.some(p => p.points > 0);
  const five = played ? X.players.slice(0, 5).map(p => p.name) : (S.starring || []).slice(0, 5);
  const more = Math.max(0, (D.rosterSize || X.players.length) - five.length);
  return (
    <MhBilling parts={[
      "Urban Playground", { link: "presents a" }, "Social Padel League",
      ...(five.length ? [{ link: "starring" }, <br key="b1" />, five.join(" · "), <br key="b2" />] : [<br key="b3" />]),
      ...(more ? [{ link: "with" }, `${more} more of Muscat’s finest ·`] : []),
      { link: "prize pool" }, `${mhPool(D)} OMR ·`, { link: "courts" }, MH.venue,
    ]} />
  );
}
