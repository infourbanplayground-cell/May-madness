<!doctype html>
<html lang="en"><head>

<title>Muscat Heist · preview</title>

<style>/* MUSCAT HEIST · Vol.10 — tokens and the shared components.
   The :root block is the handoff's tokens/tokens.css, verbatim except:
     - no Google @import (the faces are vendored: brand/fonts + brand/heist/fonts)
     - no Arabic face (the owner removed the Arabic name, 22 Nov 2026)
     - a few extra tokens at the end, each a value the handoff's own static
       design uses inline (the art tint, the fades, the band's shadow), so no
       component below carries a colour of its own.
   EVERY colour in this file and in the components comes from :root.

   RE-THEMED TO THE OWNER'S LOGO (25 Nov 2026, "Bold on navy", chosen from mocks
   made by ops/mock-heist-theme.mjs): the handoff's Archivo / Fraunces / coral /
   teal became the logo's language — Bowlby One set LOWERCASE with a thick
   black outline and a hard drop (the "urban playground" block face), Kaushan
   Script in hot pink (the "Muscat Heist" brush), pink and orange where teal
   and coral were, and the sunset skies. The ground stays the navy: a purple
   ground was tried and was "a bit much". Values changed here, at the tokens,
   so no component carries a colour of its own. */
:root {
  /* colour */
  --mn-navy: #0F1B2B;
  --mn-navy-2: #13202F;
  --mn-sand: #F6EAD3;
  --mn-peach: #FFB36B;
  --mn-coral: #FF2D78;
  --mn-coral-2: #FF7A3D;
  --mn-gold: #FFC24A;
  --mn-teal: #FF4F8B;
  --mn-rose: #E9849A;
  --mn-mist: #D8DEE8;
  --mn-dim: #9AA6B6;
  --mn-red: #E5484D;
  --mn-silver: #D7DDE4;
  --mn-bronze: #D9A27A;
  --mn-line: rgba(255,244,232,.10);
  --mn-line-2: rgba(255,244,232,.18);

  --mn-grad-primary: linear-gradient(135deg, var(--mn-coral), var(--mn-coral-2));
  /* the static design draws the band to #F5895E, not coral-2; the screenshots are the target */
  --mn-grad-nights: linear-gradient(90deg, var(--mn-coral), var(--mn-coral-2));
  --mn-grad-title: linear-gradient(180deg, var(--mn-sand), var(--mn-sand));
  --mn-sky: linear-gradient(180deg,#2A1650 0%,#6B2C8F 32%,#D2357E 56%,#FF7A3D 78%,#FFC36B 95%);

  --mn-glass-bg: rgba(15,27,43,.62);
  --mn-glass-border: 1px solid rgba(255,45,120,.38);
  --mn-glass-blur: blur(14px);

  --mn-tier-legend: linear-gradient(135deg,#FFC24A,#FF7A3D 50%,#FFC24A);
  --mn-tier-elite: linear-gradient(135deg,#FF2D78,#FF7A3D);
  --mn-tier-pro: linear-gradient(135deg,#FF4F8B,#B0306E);
  --mn-tier-street: linear-gradient(135deg,#5A6B80,#B9C6D3);

  --mn-rep-rookie: var(--mn-dim);
  --mn-rep-rising: var(--mn-teal);
  --mn-rep-known: var(--mn-coral);
  --mn-rep-legend: var(--mn-gold);

  --mn-font-display: 'Bowlby One', Impact, sans-serif;
  --mn-display-axes: normal;
  --mn-font-serif: 'Kaushan Script', cursive;
  --mn-serif-axes: normal;
  --mn-font-ui: 'Manrope', system-ui, sans-serif;
  --mn-font-mono: 'JetBrains Mono', monospace;

  --mn-r-card: 14px;
  --mn-r-hero: 16px;
  --mn-r-pill: 999px;
  --mn-r-nav: 20px;

  --mn-shadow-card: 0 14px 30px rgba(0,0,0,.40);
  --mn-shadow-title: 0 3px 0 rgba(15,27,43,.55), 0 10px 22px rgba(0,0,0,.45);

  --mn-cut-hero: polygon(0 0,100% 0,100% 82%,0 96%);
  --mn-keyline: 3px solid var(--mn-sand);

  --mn-s1: 4px; --mn-s2: 8px; --mn-s3: 12px; --mn-s4: 16px; --mn-s5: 20px; --mn-s6: 24px;
  --mn-page-x: 20px;
  --mn-min-text: 11px;

  /* — added: values the static design uses inline, named once — */
  --mn-art-filter: saturate(1.28) contrast(1.06) brightness(1.04);
  --mn-art-tint: linear-gradient(180deg, rgba(255,140,90,.10), rgba(20,60,90,.08));
  --mn-hero-fade: linear-gradient(180deg, rgba(15,27,43,.32), rgba(15,27,43,0) 18%, rgba(15,27,43,0) 58%, rgba(15,27,43,.82) 94%);
  --mn-card-fade: linear-gradient(180deg, rgba(19,32,47,0) 55%, var(--mn-navy-2));
  --mn-foil: linear-gradient(115deg, transparent 25%, rgba(255,244,232,.35) 40%, rgba(255,201,163,.3) 48%, transparent 62%);
  --mn-sun: radial-gradient(circle, rgba(255,201,163,.55), rgba(242,107,91,.25) 45%, rgba(242,107,91,0) 70%);
  --mn-band-shadow: 0 8px 20px rgba(0,0,0,.4);
  --mn-keyline-shadow: drop-shadow(0 0 5px rgba(0,0,0,.35));
  --mn-text-glow: 0 2px 8px rgba(0,0,0,.6);
  --mn-tag-bg: rgba(15,27,43,.75);
  --mn-scene-bg: rgba(15,27,43,.72);
  --mn-nav-bg: rgba(15,27,43,.78);
  --mn-nav-border: 1px solid rgba(255,244,232,.14);
  --mn-pill-border: 1px solid rgba(255,244,232,.25);
  --mn-ghost-border: 1.5px solid rgba(255,244,232,.35);
  --mn-track: rgba(255,244,232,.12);
  --mn-billing: rgba(255,244,232,.72);
  --mn-billing-dim: rgba(255,244,232,.45);
  --mn-title-filter: drop-shadow(0 3px 0 rgba(15,27,43,.55)) drop-shadow(0 10px 22px rgba(0,0,0,.45));
  --mn-rank-glow: 0 2px 8px rgba(0,0,0,.5);
  --mn-teal-45: rgba(255,79,139,.45);
  --mn-teal-60: rgba(255,79,139,.6);
  --mn-teal-20: rgba(255,79,139,.2);
  --mn-teal-16: rgba(255,79,139,.16);
  --mn-coral-14: rgba(255,45,120,.14);
  --mn-coral-50: rgba(255,45,120,.5);
  --mn-gold-45: rgba(255,194,74,.45);
  --mn-gold-70: rgba(255,194,74,.7);
  --mn-faint: rgba(255,244,232,.15);
  --mn-leader-fade: linear-gradient(90deg, rgba(15,27,43,.88), rgba(15,27,43,0) 65%);
  --mn-grad-progress: linear-gradient(90deg, var(--mn-teal), var(--mn-coral));
  --mn-grad-meter: linear-gradient(90deg, var(--mn-teal), var(--mn-peach));
  /* phase 3 — the night */
  --mn-fade-session: linear-gradient(180deg, rgba(15,27,43,.5), rgba(15,27,43,0) 40%, rgba(15,27,43,.8));
  --mn-fade-live: linear-gradient(180deg, rgba(15,27,43,.4), rgba(15,27,43,0) 35%, rgba(15,27,43,.75));
  --mn-fade-recap: linear-gradient(180deg, rgba(15,27,43,.4), rgba(15,27,43,0) 35%, rgba(15,27,43,.85));
  --mn-fade-slides: linear-gradient(180deg, rgba(15,27,43,.6), rgba(15,27,43,.1) 30%, rgba(15,27,43,.92) 80%);
  --mn-row-line: 1px solid rgba(255,244,232,.08);
  --mn-peach-50: rgba(255,179,107,.5);
  --mn-teal-50: rgba(255,79,139,.5);
  --mn-chip-bg: rgba(15,27,43,.6);
  --mn-seg-off: rgba(255,244,232,.3);
  --mn-slide-ring: 0 0 0 4px var(--mn-peach), 0 12px 30px rgba(0,0,0,.5);
  /* phase 4 — the moments */
  --mn-fade-none: none;
  --mn-fade-settled: linear-gradient(180deg, rgba(15,27,43,.3), rgba(15,27,43,0) 35%, rgba(15,27,43,.9));
  --mn-fade-finale: linear-gradient(180deg, rgba(15,27,43,.5), rgba(229,72,77,.12) 50%, rgba(15,27,43,.9));
  --mn-fade-split: linear-gradient(180deg, rgba(15,27,43,.4), rgba(15,27,43,0) 30%, rgba(15,27,43,0) 60%, var(--mn-navy));
  --mn-settled-filter: grayscale(.2);
  --mn-gold-50: rgba(255,194,74,.5);
  --mn-rule-bg: rgba(255,244,232,.05);
  --mn-shout-shadow: 0 6px 24px rgba(0,0,0,.5);
  --mn-grad-load: linear-gradient(90deg, var(--mn-coral), var(--mn-peach));
  --mn-grad-lead: linear-gradient(90deg, var(--mn-red), var(--mn-coral));
  /* phase 5 — the stories */
  --mn-story-foot: linear-gradient(180deg, rgba(15,27,43,0), rgba(15,27,43,.88) 45%, var(--mn-navy));
  --mn-story-back: linear-gradient(180deg, rgba(15,27,43,.55), rgba(15,27,43,.05) 30%, rgba(15,27,43,.35) 55%, rgba(15,27,43,.95) 82%);
  --mn-story-panel: linear-gradient(180deg, rgba(15,27,43,0) 55%, rgba(15,27,43,.9));
  --mn-story-shadow: 0 2px 12px rgba(0,0,0,.5);
  --mn-logo-shadow: drop-shadow(0 2px 6px rgba(0,0,0,.6));
  /* the logo's ink: outline and hard drop on the block face */
  --mn-ink: #07040D;
  --mn-ink-stroke: .085em;
  --mn-ink-drop: .055em .075em 0 #07040D;
}
[style*="--mn-font-display"], .mn-display * { font-weight: 400; font-style: normal; }

/* ── type helpers (the handoff's own) ─────────────────────────────────── */
.mn-display { font-family: var(--mn-font-display); font-variation-settings: var(--mn-display-axes); font-weight: 400; text-transform: lowercase; line-height: .9; color: var(--mn-sand); letter-spacing: -.005em;
  /* the logo's block face: cream, a thick black outline drawn UNDER the fill, a hard drop */
  -webkit-text-stroke: var(--mn-ink-stroke) var(--mn-ink); paint-order: stroke fill; text-shadow: var(--mn-ink-drop); }
/* Bowlby One and Kaushan Script are single-weight upright faces: asking for
   900 or italic makes the browser SYNTHESISE a smeared bold and a slanted
   oblique, so every rule that set those on them is neutralised at the root */
.mn-serif   { font-family: var(--mn-font-serif); font-variation-settings: var(--mn-serif-axes); font-style: normal; color: var(--mn-coral); }
.mn-label   { font-family: var(--mn-font-mono); font-weight: 500; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--mn-peach); }
.mn-glass   { position: relative; background: var(--mn-glass-bg); border: var(--mn-glass-border); border-radius: var(--mn-r-card); backdrop-filter: var(--mn-glass-blur); -webkit-backdrop-filter: var(--mn-glass-blur); padding: 14px 16px; }
.mn-glass[data-accent="peach"] { border-color: var(--mn-peach); }
.mn-glass[data-accent="teal"]  { border-color: var(--mn-teal); }
.mn-glass[data-accent="gold"]  { border-color: var(--mn-gold); }
.mn-glass[data-accent="coral"] { border-color: var(--mn-coral); }

/* ── buttons ──────────────────────────────────────────────────────────── */
.mn-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 18px; cursor: pointer; border: 0; text-decoration: none; }
.mn-btn-primary { background: var(--mn-grad-primary); color: var(--mn-navy); border-radius: var(--mn-r-card); font-family: var(--mn-font-display); font-variation-settings: var(--mn-display-axes); font-weight: 400; letter-spacing: .06em; min-height: 48px; font-size: 17px; text-transform: lowercase; }
.mn-btn-ghost   { background: transparent; border: var(--mn-ghost-border); color: var(--mn-sand); border-radius: var(--mn-r-card); min-height: 48px; font-family: var(--mn-font-display); font-variation-settings: var(--mn-display-axes); font-weight: 400; letter-spacing: .06em; font-size: 17px; text-transform: lowercase; }
.mn-btn-light   { background: var(--mn-sand); color: var(--mn-navy); border-radius: var(--mn-r-card); min-height: 48px; font-family: var(--mn-font-ui); font-weight: 700; font-size: 15px; }
.mn-btn[data-size="live"] { min-height: 56px; }
.mn-btn:focus-visible, .mn-pill:focus-visible, .mn-navtab:focus-visible { outline: 2px solid var(--mn-peach); outline-offset: 2px; }

/* ── pills ────────────────────────────────────────────────────────────── */
/* the row scrolls sideways, which clips; the drawn pill is 32px and the row it
   leaves after the 44px target's -7px margins is 30, so the outline lost a
   pixel or two top and bottom on every pill row. 4px of room, taken back outside. */
.mn-pills { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 4px 0; margin: -4px 0; }
.mn-pills::-webkit-scrollbar { display: none; }
/* the visible pill is the handoff's 32px chip; the button around it is 44px
   tall so the target meets the floor without changing what is drawn */
.mn-pill { flex: 0 0 auto; min-height: 44px; min-width: 44px; justify-content: center; margin: -7px 0; display: inline-flex; align-items: center; background: none; border: 0; padding: 0; cursor: pointer; }
.mn-pill > span { display: inline-flex; align-items: center; padding: 7px 12px; border-radius: var(--mn-r-pill); border: var(--mn-pill-border); color: var(--mn-mist); font-family: var(--mn-font-ui); font-weight: 600; font-size: 12px; }
.mn-pill[aria-pressed="true"] > span, .mn-pill[aria-selected="true"] > span { background: var(--mn-sand); border-color: var(--mn-sand); color: var(--mn-navy); }
.mn-pill[data-round] { min-width: 44px; justify-content: center; }
.mn-pill[data-round] > span { width: 32px; height: 32px; padding: 0; justify-content: center; }

/* ── bottom nav ───────────────────────────────────────────────────────── */
.mn-nav { position: fixed; left: 14px; right: 14px; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 40; padding: 10px 8px; display: flex; justify-content: space-around; background: var(--mn-nav-bg); border: var(--mn-nav-border); border-radius: var(--mn-r-nav); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
.mn-navtab { min-height: 44px; min-width: 44px; margin: -7px 0; display: inline-flex; align-items: center; justify-content: center; background: none; border: 0; padding: 0; cursor: pointer; }
.mn-navtab > span { padding: 7px 12px; border-radius: 12px; color: var(--mn-mist); font-family: var(--mn-font-ui); font-weight: 600; font-size: 12px; }
.mn-navtab[aria-current="page"] > span { background: var(--mn-sand); color: var(--mn-navy); }

/* ── top bar ──────────────────────────────────────────────────────────── */
.mn-topbar { position: absolute; left: 20px; right: 20px; top: 50px; z-index: 6; display: flex; justify-content: space-between; align-items: center; }
.mn-topbar img { height: 28px; }
.mn-topbar .mn-serif { font-size: 16px; color: var(--mn-sand); }

/* ── art: every painting/photo gets the same treatment ────────────────── */
.mn-art { position: absolute; inset: 0; overflow: hidden; }
.mn-art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: var(--mn-art-filter); }
.mn-art::after { content: ""; position: absolute; inset: 0; background: var(--mn-art-tint); mix-blend-mode: soft-light; }
.mn-initials { position: absolute; inset: 0; display: grid; place-items: center; background: var(--mn-navy); font-family: var(--mn-font-display); font-variation-settings: var(--mn-display-axes); font-weight: 400; color: var(--mn-mist); }

/* ── hero cut ─────────────────────────────────────────────────────────── */
.mn-hero { position: relative; overflow: hidden; }
.mn-hero .mn-hero-img { position: absolute; inset: 0; }
.mn-hero .mn-hero-fade { position: absolute; inset: 0; background: var(--mn-hero-fade); }
.mn-hero .mn-keyline { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; filter: var(--mn-keyline-shadow); pointer-events: none; }
.mn-hero .mn-keyline line { stroke: var(--mn-sand); stroke-width: 3; }
.mn-hero[data-gold] .mn-keyline line { stroke: var(--mn-gold); }

/* ── title lockup ─────────────────────────────────────────────────────── */
.mn-lockup { position: relative; display: flex; flex-direction: column; align-items: flex-start; }
.mn-lockup[data-center] { align-items: center; }
.mn-lockup .mn-sun { position: absolute; left: 50%; top: 4px; border-radius: 50%; background: var(--mn-sun); transform: translateX(-50%); pointer-events: none; }
.mn-lockup .mn-presents { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-family: var(--mn-font-serif); font-variation-settings: var(--mn-serif-axes); font-style: normal; color: var(--mn-peach); }
.mn-lockup .mn-presents::before, .mn-lockup .mn-presents::after { content: ""; width: 24px; height: 1px; background: var(--mn-peach); }
.mn-lockup .mn-l1 { position: relative; font-family: var(--mn-font-display); font-variation-settings: var(--mn-display-axes); font-weight: 400; line-height: .84; letter-spacing: -.01em; background: var(--mn-grad-title); -webkit-background-clip: text; background-clip: text; color: transparent; filter: var(--mn-title-filter); }
.mn-lockup .mn-band { position: relative; margin-top: -1px; padding: 4px 14px 3px; background: var(--mn-grad-nights); transform: skewX(-10deg); box-shadow: var(--mn-band-shadow); }
.mn-lockup .mn-band > span { display: block; transform: skewX(10deg); font-family: var(--mn-font-display); font-variation-settings: var(--mn-display-axes); font-weight: 400; line-height: 1; letter-spacing: .32em; padding-left: .32em; color: var(--mn-navy); }
.mn-lockup .mn-logo { position: relative; display: block; line-height: 0; }
.mn-lockup .mn-logo img { display: block; max-width: 100%; filter: drop-shadow(0 6px 14px rgba(0,0,0,.45)); }
.mn-lockup .mn-meta { position: relative; margin-top: 9px; font-family: var(--mn-font-mono); font-weight: 500; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--mn-sand); text-shadow: var(--mn-text-glow); }

/* ── scene tag ────────────────────────────────────────────────────────── */
.mn-scenetag { display: inline-block; padding: 3px 8px; background: var(--mn-scene-bg); border-left: 2px solid var(--mn-coral); font-family: var(--mn-font-display); font-variation-settings: var(--mn-display-axes); font-weight: 800; font-size: 12px; letter-spacing: .18em; color: var(--mn-sand); text-transform: lowercase; }
.mn-scenetag[data-gold] { border-left-color: var(--mn-gold); color: var(--mn-gold); }

/* ── billing (stories) ────────────────────────────────────────────────── */
.mn-billing { font-family: var(--mn-font-display); font-variation-settings: var(--mn-display-axes); font-weight: 700; font-size: 12px; letter-spacing: .08em; line-height: 1.25; color: var(--mn-billing); text-transform: lowercase; text-align: center; }
.mn-billing i { font-style: normal; color: var(--mn-billing-dim); text-transform: none; }

/* ── crew card ────────────────────────────────────────────────────────── */
.mn-card { flex: 0 0 auto; padding: 4px; border-radius: var(--mn-r-card); box-shadow: var(--mn-shadow-card); background: var(--mn-tier-street); }
.mn-card[data-tier="legend"] { background: var(--mn-tier-legend); }
.mn-card[data-tier="elite"]  { background: var(--mn-tier-elite); }
.mn-card[data-tier="pro"]    { background: var(--mn-tier-pro); }
.mn-card > div { border-radius: 11px; overflow: hidden; background: var(--mn-navy-2); }
.mn-card .mn-card-img { position: relative; }
.mn-card .mn-foil { position: absolute; inset: 0; background: var(--mn-foil); background-size: 250% 100%; mix-blend-mode: overlay; animation: mn-foil 3.2s linear infinite; }
.mn-card .mn-card-fade { position: absolute; inset: 0; background: var(--mn-card-fade); }
.mn-card .mn-tiertag { position: absolute; left: 8px; top: 8px; padding: 2px 7px; border-radius: 6px; background: var(--mn-tag-bg); font-family: var(--mn-font-display); font-variation-settings: var(--mn-display-axes); font-weight: 400; letter-spacing: .1em; color: var(--mn-sand); }
.mn-card .mn-rank { position: absolute; right: 8px; top: 6px; font-family: var(--mn-font-display); font-variation-settings: var(--mn-display-axes); font-weight: 400; color: var(--mn-sand); text-shadow: var(--mn-rank-glow); }
.mn-card .mn-name { font-family: var(--mn-font-display); font-variation-settings: var(--mn-display-axes); font-weight: 400; line-height: 1; color: var(--mn-sand); text-transform: lowercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mn-card .mn-repline { display: flex; justify-content: space-between; align-items: baseline; margin-top: 3px; }
.mn-card .mn-rep { font-family: var(--mn-font-mono); font-size: 11px; }
.mn-card .mn-pts { font-family: var(--mn-font-display); font-variation-settings: var(--mn-display-axes); font-weight: 800; color: var(--mn-sand); }
.mn-card .mn-stats { display: flex; flex-direction: column; gap: 5px; margin-top: 6px; }
.mn-card .mn-stat { display: flex; align-items: center; gap: 8px; }
.mn-card .mn-stat > span:first-child { width: 52px; font-family: var(--mn-font-mono); font-size: 11px; color: var(--mn-mist); }
.mn-card .mn-stat > span:nth-child(2) { flex: 1; height: 4px; border-radius: 2px; background: var(--mn-track); overflow: hidden; }
.mn-card .mn-stat > span:nth-child(2) > span { display: block; height: 100%; border-radius: 2px; }
.mn-card .mn-stat > b { min-width: 16px; text-align: right; font-family: var(--mn-font-display); font-variation-settings: var(--mn-display-axes); font-weight: 800; font-size: 13px; color: var(--mn-sand); }
.mn-card[data-tilt] { animation: mn-tilt 6s ease-in-out infinite; }
button.mn-cardbtn { background: none; border: 0; padding: 0; cursor: pointer; border-radius: var(--mn-r-card); }

/* ── avatar ───────────────────────────────────────────────────────────── */
.mn-avatar { position: relative; flex: 0 0 auto; border-radius: 50%; overflow: hidden; background: var(--mn-navy-2); }

/* ── film grain over every screen, as the static design draws it ──────── */
.mn-grain { position: fixed; inset: 0; width: 100%; height: 100%; opacity: .08; mix-blend-mode: overlay; pointer-events: none; z-index: 30; }

/* ── motion ───────────────────────────────────────────────────────────── */
@keyframes mn-foil { 0% { background-position: 120% 0 } 100% { background-position: -120% 0 } }
@keyframes mn-tilt { 0%,100% { transform: perspective(900px) rotateY(-9deg) rotateX(3deg) } 50% { transform: perspective(900px) rotateY(9deg) rotateX(-3deg) } }
@keyframes mn-ring { 0% { transform: scale(.6); opacity: .9 } 100% { transform: scale(2.2); opacity: 0 } }
@keyframes mn-slam { 0% { transform: scale(2.4); opacity: 0 } 60% { transform: scale(.94); opacity: 1 } 100% { transform: scale(1); opacity: 1 } }
@keyframes mn-fill { from { width: 0 } }
.mn-ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid currentColor; animation: mn-ring 2.4s ease-out infinite; }
.mn-ring + .mn-ring { animation-delay: .8s; }
.mn-slam { animation: mn-slam .7s ease-out both; }
.mn-fill { animation: mn-fill .6s ease-out .7s both; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ── the season screens (heist-screens.jsx) ───────────────────────────── */
html, body { margin: 0; background: var(--mn-navy); color: var(--mn-sand); font-family: var(--mn-font-ui); -webkit-font-smoothing: antialiased; }
.mh-page { position: relative; min-height: 100vh; min-height: 100dvh; background: var(--mn-navy); overflow-x: hidden; }
.mh-page .mn-topbar { position: absolute; }
.mh-body { position: relative; z-index: 5; box-sizing: border-box; padding-bottom: 100px !important; }
/* the night's screens carry no nav, so nothing to clear: the footer sits on the glass */
.mh-body[data-bare] { padding-bottom: 0 !important; }
.mh-col { display: flex; flex-direction: column; gap: 12px; }
.mh-title { display: flex; justify-content: space-between; align-items: flex-end; }
.mh-title h1 { margin: 0; font-size: 44px; line-height: .86; }
.mh-title .mn-serif { font-size: 15px; }
.mh-split { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.mh-two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mh-small { padding: 12px 14px; }
button.mh-tap { display: block; width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer; }
button.mn-glass { border: var(--mn-glass-border); }
button.mn-glass[data-accent="coral"] { border-color: var(--mn-coral); }
.mh-close { background: none; border: 0; cursor: pointer; font-size: 15px; min-height: 44px; min-width: 48px; margin: -14px 0; padding: 0; color: var(--mn-mist); }

/* jobs */
.mh-job { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 8px; border-radius: var(--mn-r-card); border: 1px solid transparent; }
.mh-job[data-state="live"] { background: var(--mn-coral-14); border-color: var(--mn-coral-50); }
.mh-job[data-state="finale"] { border-color: var(--mn-gold-45); }
.mh-jobmain { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: center; background: none; border: 0; padding: 0; text-align: left; color: inherit; cursor: pointer; min-height: 64px; }
.mh-thumb { position: relative; height: 64px; border-radius: 10px; overflow: hidden; }
.mh-job[data-state="done"] .mh-thumb { filter: grayscale(.25) brightness(.85); }
.mh-jobtitle { font-size: 19px; line-height: 1.05; }
.mh-job .mn-pill { margin: -7px 0; }

/* most wanted */
.mh-leader { position: relative; height: 200px; border-radius: var(--mn-r-hero); overflow: hidden; border: 0; padding: 0; }
.mh-leaderfade { position: absolute; inset: 0; background: var(--mn-leader-fade); }
.mh-stars { position: absolute; left: 16px; top: 14px; display: flex; gap: 3px; font-size: 15px; color: var(--mn-gold); }
.mh-leaderbody { position: absolute; left: 16px; bottom: 14px; text-align: left; }
.mh-mono-row { display: flex; gap: 12px; margin-top: 6px; font-family: var(--mn-font-mono); font-size: 12px; color: var(--mn-sand); }
.mh-replegend { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
.mh-replegend > div { padding: 5px 0 0; border-top: 3px solid; text-align: center; }
.mh-replegend b { display: block; font-family: var(--mn-font-display); font-variation-settings: var(--mn-display-axes); font-weight: 800; font-size: 12px; letter-spacing: .08em; color: var(--mn-sand); }
.mh-replegend span { font-family: var(--mn-font-mono); font-size: 11px; color: var(--mn-mist); }
.mh-wrow { display: grid !important; grid-template-columns: 22px auto 1fr 24px 38px; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 12px; background: none; border: 0; min-height: 50px; }
.mh-wrow[data-me] { background: var(--mn-teal-16); }
.mh-wrank { font-size: 17px; color: var(--mn-mist); }
.mh-wname { font-family: var(--mn-font-ui); font-weight: 600; font-size: 14px; color: var(--mn-sand); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mh-wname .mn-serif { font-weight: 400; color: var(--mn-teal); }
.mh-wmove { font-family: var(--mn-font-mono); font-size: 11px; color: var(--mn-mist); text-align: right; }
.mh-wgap { font-family: var(--mn-font-mono); font-size: 11px; color: var(--mn-peach); }

/* me */
.mh-chip { padding: 3px 8px; border-radius: 6px; background: var(--mn-teal-20); font-family: var(--mn-font-display); font-variation-settings: var(--mn-display-axes); font-weight: 800; font-size: 13px; color: var(--mn-teal); }
.mh-progress { height: 6px; border-radius: 3px; background: var(--mn-track); margin-top: 4px; overflow: hidden; }
.mh-progress > div { height: 100%; border-radius: 3px; background: var(--mn-grad-progress); }
.mh-stack { display: flex; height: 14px; gap: 2px; border-radius: 4px; overflow: hidden; }
.mh-legend { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; }
.mh-legend > div { display: flex; justify-content: space-between; font-weight: 600; font-size: 12px; color: var(--mn-mist); }
.mh-legend b { font-weight: 600; color: var(--mn-sand); }
.mh-eprow { display: grid !important; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center; padding: 7px 0; border: 0; border-top: 1px solid var(--mn-line); background: none; min-height: 44px; }
.mh-eprow > span { font-weight: 600; font-size: 13px; color: var(--mn-sand); }

/* crew */
.mh-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; justify-items: center; }

/* the take */
.mh-takehero { position: relative; height: 150px; border-radius: var(--mn-r-hero); overflow: hidden; }
.mh-takehero .mn-art img { filter: var(--mn-art-filter) brightness(.7); }
.mh-takebody { position: absolute; left: 16px; bottom: 14px; }
.mh-meter { position: relative; height: 12px; border-radius: 6px; background: var(--mn-line); overflow: hidden; }
.mh-meter > div { height: 100%; border-radius: 6px; background: var(--mn-grad-meter); }
.mh-segs { display: grid; gap: 3px; }
.mh-segs > div { height: 4px; border-radius: 2px; background: var(--mn-faint); }
.mh-segs > div[data-s="done"] { background: var(--mn-teal); }
.mh-segs > div[data-s="finale"] { background: var(--mn-gold-70); }
.mh-prize { display: flex !important; align-items: center; gap: 12px; padding: 10px 14px; }
.mh-ptsline { font-family: var(--mn-font-mono); font-weight: 400; font-size: 11px; color: var(--mn-mist); font-variation-settings: normal; }
.mh-omr { font-size: 12px; color: var(--mn-mist); }

/* ── phase 3: the night ───────────────────────────────────────────────── */
.mn-glass[data-accent="peach-50"] { border-color: var(--mn-peach-50); }
.mn-glass[data-accent="teal-50"], button.mn-glass[data-accent="teal-50"] { border-color: var(--mn-teal-50); }
.mh-back { position: absolute; left: 20px; top: 56px; margin: -12px -12px; padding: 12px; min-height: 44px; min-width: 44px; background: none; border: 0; cursor: pointer; font-family: var(--mn-font-ui); font-weight: 600; font-size: 13px; color: var(--mn-sand); text-align: left; }
.mh-grow { display: grid; grid-template-columns: 18px 1fr 22px 28px; gap: 8px; align-items: center; padding: 8px 0; border-top: var(--mn-row-line); }
.mh-gteam, .mh-mteam { font-family: var(--mn-font-ui); font-weight: 600; font-size: 13px; color: var(--mn-sand); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mh-gw { font-family: var(--mn-font-mono); font-size: 12px; color: var(--mn-mist); }
.mn-glass.mh-match { padding: 10px 14px; }
.mh-seed { font-family: var(--mn-font-mono); font-size: 11px; color: var(--mn-mist); margin-right: 6px; }
.mh-trow { display: flex; align-items: center; gap: 4px; padding: 8px 0; border-top: var(--mn-row-line); }
.mh-trow:first-child, .mh-grow:first-child { border-top: var(--mn-row-line); }
.mh-vbar { margin-top: 6px; height: 4px; border-radius: 2px; background: var(--mn-track); overflow: hidden; }
.mh-vbar > div { height: 100%; background: var(--mn-peach); border-radius: 2px; }

/* live scoring */
/* 44px to tap, the design's 6px-padded pill to look at (drawn by ::before) */
.mh-livepill { position: absolute; left: 20px; top: 56px; display: flex; gap: 8px; align-items: center; padding: 0; border: 0; background: none; cursor: pointer; min-height: 44px; margin-top: -8px; }
.mh-livepill::before { content: ""; position: absolute; left: 0; right: 0; top: 8px; bottom: 8px; border-radius: var(--mn-r-pill); background: var(--mn-chip-bg); }
.mh-livepill > * { position: relative; }
.mh-livepill .mh-dot { margin-left: 10px; }
.mh-livepill .mn-label { margin-right: 10px; }
.mh-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--mn-coral); flex: none; }
.mh-clock { position: absolute; right: 20px; top: 56px; padding: 6px 10px; border-radius: var(--mn-r-pill); background: var(--mn-chip-bg); font-family: var(--mn-font-mono); font-size: 12px; color: var(--mn-sand); }
.mh-live .mn-btn[data-size="live"] { padding: 15px 0; }
.mh-livefoot, .mh-recapfoot { margin-top: auto; padding: 16px 20px 26px; display: grid; grid-template-columns: auto 1fr; gap: 8px; }
.mh-recapfoot { grid-template-columns: 1fr 1fr; }
.mh-undo { padding: 15px 16px; min-height: 56px; border-radius: var(--mn-r-card); border: var(--mn-pill-border); background: none; cursor: pointer; font-family: var(--mn-font-ui); font-weight: 600; font-size: 13px; color: var(--mn-mist); }
.mh-undo:disabled { opacity: .5; cursor: default; }
.mh-undo:focus-visible, .mh-back:focus-visible, .mh-livepill:focus-visible, .mh-x:focus-visible, .mh-hint:focus-visible { outline: 2px solid var(--mn-peach); outline-offset: 2px; }

/* episode recap */
.mh-tiles { padding: 0 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

/* recap slides */
.mh-slides { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--mn-navy); overflow: hidden; user-select: none; -webkit-user-select: none; }
.mh-slidesart { position: absolute; inset: 0; }
.mh-slidesart .mn-art img { filter: var(--mn-art-filter) brightness(.55); }
.mh-slidesfade { position: absolute; inset: 0; background: var(--mn-fade-slides); }
.mh-segbar { position: relative; padding: 54px 16px 0; display: flex; gap: 4px; }
.mh-segbar > div { flex: 1; height: 3px; border-radius: 2px; background: var(--mn-seg-off); overflow: hidden; }
.mh-segbar > div > div { height: 100%; background: var(--mn-sand); border-radius: 2px; }
.mh-segrun { animation: mh-seg 5s linear both; }
.mh-segrun[data-held] { animation-play-state: paused; }
@keyframes mh-seg { from { width: 0 } to { width: 100% } }
.mh-slideshead { position: relative; padding: 12px 20px 0; display: flex; justify-content: space-between; align-items: center; }
.mh-x { min-width: 44px; min-height: 44px; margin: -12px -14px -12px 0; background: none; border: 0; cursor: pointer; font-family: var(--mn-font-ui); font-weight: 600; font-size: 13px; color: var(--mn-sand); }
.mh-slide { position: relative; margin-top: auto; padding: 0 24px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; animation: mh-slidein .35s ease-out both; }
@keyframes mh-slidein { from { opacity: 0; transform: translateY(10px) } }
.mh-slidephoto .mn-avatar { box-shadow: var(--mn-slide-ring); }
.mh-slidesfoot { position: relative; padding: 22px 20px 30px; display: flex; justify-content: space-between; }
.mh-hint { min-height: 44px; min-width: 44px; margin: -12px 0; background: none; border: 0; cursor: pointer; font-family: var(--mn-font-mono); font-weight: 500; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--mn-mist); }
.mh-hint[data-next] { color: var(--mn-sand); }
.mh-hint:disabled { cursor: default; }

/* ── phase 4: the moments ─────────────────────────────────────────────── */
.mn-glass[data-accent="gold-50"] { border-color: var(--mn-gold-50); }
.mn-glass[data-accent="gold-45"] { border-color: var(--mn-gold-45); }
.mh-moment main > *:not(.mh-mback):not(.mh-mglow) { position: relative; }
.mh-mback, .mh-mglow { position: absolute; inset: 0; overflow: hidden; }
.mh-mback .mn-art img { filter: blur(6px) brightness(var(--mh-dim)); transform: scale(1.1); }
.mh-momentfoot { margin-top: auto; padding: 16px 20px 26px; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; }
.mh-mtitle, .mh-shout { margin: 0; }
.mh-shout { line-height: .84; text-shadow: var(--mn-shout-shadow); }

/* 11 now loading */
.mh-loading { position: relative; height: 100vh; height: 100dvh; overflow: hidden; }
.mh-loadtap { position: absolute; inset: 0; width: 100%; padding: 0; border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.mh-loadtap:disabled { cursor: progress; }
.mh-loadtag { position: absolute; left: 18px; top: 64px; }
.mh-loadbar > [role="progressbar"] > div { height: 100%; background: var(--mn-grad-load); }

/* 12 new crew card */
.mh-pullhead { padding: 70px 20px 0; display: flex; flex-direction: column; align-items: center; gap: 10px; }

/* 13 rep up */
.mh-repphoto { position: absolute !important; left: 50%; top: 220px; width: 200px; height: 200px; margin-left: -100px; color: var(--mh-glow); }
.mh-repphoto .mn-avatar { position: relative; box-shadow: 0 0 0 4px var(--mh-glow), 0 0 40px var(--mh-glow); }
.mh-reptext { margin-top: 460px; padding: 0 24px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }

/* 14 your rival */
.mh-split2 { position: relative; height: 440px; }
.mh-half { position: absolute; inset: 0; padding: 0; border: 0; background: none; cursor: pointer; overflow: hidden; }
.mh-half[data-side="l"] { clip-path: polygon(0 0, 58% 0, 42% 100%, 0 100%); }
.mh-half[data-side="r"] { clip-path: polygon(58% 0, 100% 0, 100% 100%, 42% 100%); }
.mh-half > div { position: absolute; top: 0; width: 60%; height: 100%; }
.mh-half[data-side="l"] > div { left: 0; }
.mh-half[data-side="r"] > div { left: 40%; }
.mh-splitline { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; filter: var(--mn-keyline-shadow); }
.mh-splitline line { stroke: var(--mn-sand); stroke-width: 4; }
.mh-splitfade { position: absolute; inset: 0; background: var(--mn-fade-split); pointer-events: none; }
.mh-rivside { position: absolute; left: 20px; bottom: 20px; pointer-events: none; }
.mh-rivside[data-right] { left: auto; right: 20px; text-align: right; }
.mh-meet { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-top: 1px solid var(--mn-line); font-family: var(--mn-font-ui); font-weight: 600; font-size: 13px; color: var(--mn-sand); }

/* 15 score settled */
.mh-moment[data-kind="settled"] .mn-hero-img { filter: var(--mn-settled-filter); }
.mh-settledhead { position: absolute; left: 0; right: 0; bottom: 70px; text-align: center; }

/* 16 the big score */
.mh-target { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 46px; padding: 0; border: 0; background: none; color: inherit; cursor: pointer; }
.mh-leadbar { height: 10px; border-radius: 5px; margin-top: 4px; background: var(--mn-line); overflow: hidden; }
.mh-leadbar > div { height: 100%; border-radius: 5px; background: var(--mn-grad-lead); }
.mh-rule { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--mn-rule-bg); }
.mh-rule > span { font-family: var(--mn-font-ui); font-weight: 600; font-size: 13px; color: var(--mn-sand); }

/* ── phase 5: the stories (a 416x740 artboard, exported at 1080x1920) ─── */
.mh-story { position: relative; width: 416px; height: 740px; overflow: hidden; background: var(--mn-navy); flex: none; }
.mh-shard { position: absolute; inset: 0; }
.mh-shard[data-dim] { filter: brightness(.62); }
.mh-shardlines { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; filter: var(--mn-keyline-shadow); pointer-events: none; }
.mh-shardlines line { stroke: var(--mn-sand); stroke-width: 3; }
.mh-storyfoot { position: absolute; left: 0; right: 0; bottom: 0; height: 330px; background: var(--mn-story-foot); }
.mh-storylock { position: absolute; left: 0; right: 0; display: flex; justify-content: center; }
.mh-storybill { position: absolute; left: 22px; right: 22px; }
.mh-storywhen { display: flex; justify-content: center; gap: 16px; margin-top: 8px; }
.mh-storylogo { position: absolute; filter: var(--mn-logo-shadow); }
.mh-contback { position: absolute; inset: 0; background: var(--mn-story-back); }
.mh-conttag { position: absolute; left: 0; right: 0; top: 40px; text-align: center; font-size: 22px; color: var(--mn-sand); text-shadow: var(--mn-story-shadow); }
.mh-controw { position: absolute; left: 18px; right: 18px; top: 230px; height: 250px; display: flex; gap: 8px; }
.mh-contender { position: relative; overflow: hidden; clip-path: polygon(8% 0, 100% 0, 92% 100%, 0 100%); }
.mh-contfade { position: absolute; inset: 0; background: var(--mn-story-panel); }
.mh-contname { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; letter-spacing: .12em; line-height: 1; }
.mh-mycard { position: absolute; left: 0; right: 0; top: 76px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.mh-story .mn-grain { z-index: 5; }
/* the share sheet shows the frame itself, scaled to the phone */
.mh-sharepreview { margin: 14px auto 10px; width: calc(416px * var(--k)); height: calc(740px * var(--k)); --k: min(1, calc((100vw - 40px) / 416px)); }
.mh-sharescale { width: 416px; height: 740px; transform: scale(var(--k)); transform-origin: 0 0; border-radius: 12px; overflow: hidden; }

/* ── the app shell ────────────────────────────────────────────────────── */
.mn-logobtn { min-width: 44px; min-height: 44px; margin: -8px 0; padding: 0; border: 0; background: none; cursor: pointer; display: inline-flex; align-items: center; }
.mn-logobtn img { height: 28px; }
.mh-orgchip { position: absolute; right: 20px; top: 92px; z-index: 6; min-height: 44px; padding: 0 14px; border-radius: var(--mn-r-pill); border: var(--mn-pill-border); background: var(--mn-chip-bg); color: var(--mn-peach); font-family: var(--mn-font-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; cursor: pointer; }
/* the 17 Oct lesson: a failed save is impossible to miss, and above everything */
.mh-savebanner { position: sticky; top: 0; z-index: 100; display: block; width: 100%; min-height: 44px; padding: 10px 14px; border: 0; background: var(--mn-sand); color: var(--mn-navy); font: 800 13px var(--mn-font-ui); text-align: center; cursor: pointer; }
/* the inherited Vol.9 skin paints the page oxblood with more specific
   selectors (html:not(.light) body); the Heist ground is navy everywhere */
/* The inherited skin names <html> and <body> in every state it has (aa-boot,
   :not(.light)) and some of its blocks sit LATER in the page than this one, so
   equal specificity loses on order. :not(#mh) carries an id's weight and
   outranks every class selector Vol.9 has, in any order. */
html:not(#mh), html:not(#mh) body, html:not(#mh) #root { background: var(--mn-navy) !important; }
/* and National's own furniture on the page itself — the khanjar tile on body::before
   and the band on body::after — is Vol.9's, not Heist's */
html:not(#mh) body::before, html:not(#mh) body::after { display: none !important; }

/* ── 07 SESSION, rebuilt: status, actions, faces on every row ─────────── */
.mh-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.mh-act { min-height: 44px; display: inline-flex; align-items: center; gap: 6px; padding: 0 14px; border-radius: var(--mn-r-pill); border: var(--mn-pill-border); background: var(--mn-glass-bg); color: var(--mn-sand); font-family: var(--mn-font-ui); font-weight: 700; font-size: 13px; cursor: pointer; }
.mh-act[data-org] { border-color: var(--mn-coral); }
.mh-act:disabled { opacity: .35; cursor: default; }
.mh-act:focus-visible { outline: 2px solid var(--mn-peach); outline-offset: 2px; }
.mh-pairfaces { display: flex; flex: none; }
.mh-pairfaces > .mn-avatar + .mn-avatar { margin-left: -8px; box-shadow: 0 0 0 2px var(--mn-navy-2); }
.mh-pairfaces-s > .mn-avatar + .mn-avatar { margin-left: -6px; }
.mh-champ { display: flex; align-items: center; gap: 12px; }
.mh-champ .mh-pairfaces > .mn-avatar + .mn-avatar { margin-left: -12px; }
.mh-champname { font-size: 22px; line-height: 1; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mh-champsub { font-family: var(--mn-font-ui); font-size: 12px; color: var(--mn-mist); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mh-progress { height: 6px; border-radius: 3px; background: var(--mn-line-2); margin: 10px 0 8px; overflow: hidden; }
.mh-progress > div { height: 100%; background: var(--mn-grad-nights); }
.mh-onnow { font-family: var(--mn-font-ui); font-weight: 600; font-size: 13px; color: var(--mn-sand); }
.mh-onnow > span { font-family: var(--mn-font-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--mn-coral); margin-right: 8px; }
.mh-onnow > i { color: var(--mn-mist); font-style: normal; margin: 0 4px; }
/* group table: # · team (faces + names) · W · GD · PTS, qualifiers on a teal bar */
.mh-grow { grid-template-columns: 16px 1fr 18px 28px 26px; position: relative; }
.mh-grow[data-q]::before { content: ""; position: absolute; left: -14px; top: 6px; bottom: 6px; width: 3px; border-radius: 2px; background: var(--mn-teal); }
.mh-ghead { font-family: var(--mn-font-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--mn-mist); border-top: 0 !important; padding: 8px 0 4px; }
.mh-ghead > span:nth-child(n+3) { text-align: right; }
.mh-grow > .mh-gw { text-align: right; }
.mh-gpos { font-size: 14px; color: var(--mn-mist); }
.mh-grow[data-q] .mh-gpos { color: var(--mn-teal); }
.mh-gpts { font-size: 18px; text-align: right; }
.mh-gteamcell { display: flex; align-items: center; gap: 8px; min-width: 0; }
.mh-qkey { display: flex; align-items: center; gap: 8px; padding: 8px 0 4px; font-family: var(--mn-font-mono); font-size: 11px; color: var(--mn-mist); letter-spacing: .06em; }
.mh-qkey > i { width: 3px; height: 12px; border-radius: 2px; background: var(--mn-teal); }
/* a match: each side its own row with its own games; the winner lit */
.mh-mrow { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
.mh-mrow .mh-mteam { flex: 1; }
.mh-mgames { font-size: 22px; min-width: 18px; text-align: right; color: var(--mn-mist); }
.mh-mrow[data-win] .mh-mteam { font-weight: 800; }
.mh-mrow[data-win] .mh-mgames { color: var(--mn-sand); }
.mh-mrow[data-lose] .mh-mteam { color: var(--mn-mist); }
.mh-mrow[data-lose] .mn-avatar { opacity: .55; }
.mh-mstate { margin-top: 4px; }
.mh-trow { gap: 10px; position: relative; }
.mh-trow[data-q]::before { content: ""; position: absolute; left: -14px; top: 10px; bottom: 10px; width: 3px; border-radius: 2px; background: var(--mn-teal); }
.mh-tstat { text-align: right; flex: none; }
.mh-tstat > b { display: block; font-size: 20px; }
.mh-tstat > span { font-family: var(--mn-font-mono); font-size: 11px; color: var(--mn-mist); }
.mh-prow { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: var(--mn-row-line); }
.mh-prow:first-child { border-top: 0; }
.mh-prow .mh-gpos { width: 18px; }
.mh-psub { font-family: var(--mn-font-ui); font-size: 11px; color: var(--mn-mist); }
.mh-lupick { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
.mh-luselect { flex: 1; min-width: 0; min-height: 44px; border-radius: var(--mn-r-pill); border: var(--mn-pill-border); background: var(--mn-glass-bg); color: var(--mn-sand); font-family: var(--mn-font-ui); font-weight: 600; font-size: 13px; padding: 0 14px; }

/* ── a NIGHT's stories (416x740 frames, exported at 1080x1920) ────────── */
.mh-nsart { position: absolute; left: 0; right: 0; top: 0; }
.mh-nsfade { position: absolute; left: 0; right: 0; top: 0; background: linear-gradient(180deg, rgba(15,27,43,.35) 0%, rgba(15,27,43,.55) 45%, var(--mn-navy) 100%); }
.mh-nstop { position: absolute; left: 18px; right: 18px; top: 16px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
.mh-nstop img { filter: var(--mn-logo-shadow); }
.mh-nshead { position: absolute; left: 20px; right: 20px; top: 92px; z-index: 2; }
.mh-nstitle { font-size: 54px; line-height: .9; margin-top: 6px; text-shadow: var(--mn-text-glow); }
.mh-nsbody { position: absolute; left: 16px; right: 16px; top: 178px; bottom: 44px; z-index: 2; display: flex; flex-direction: column; justify-content: center; gap: 8px; }
.mh-nsfoot { position: absolute; left: 20px; right: 20px; bottom: 16px; z-index: 2; display: flex; justify-content: space-between; font-family: var(--mn-font-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--mn-mist); }
.mh-ngrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.mh-ngrid[data-n="1"] { grid-template-columns: 1fr; }
.mh-ngrid[data-tight] { gap: 6px; }
.mh-npanel { background: var(--mn-glass-bg); border: var(--mn-glass-border); border-radius: 16px; padding: 8px 10px 6px; min-width: 0; }
.mh-npanelhead { display: flex; align-items: center; gap: 6px; font-family: var(--mn-font-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--mn-peach); padding-bottom: 4px; }
.mh-nhcols { margin-left: auto; color: var(--mn-mist); letter-spacing: .06em; }
.mh-nletter { width: 20px; height: 20px; border-radius: 50%; background: var(--mn-sand); color: var(--mn-navy); display: grid; place-items: center; font-family: var(--mn-font-display); font-variation-settings: var(--mn-display-axes); font-weight: 400; font-size: 12px; letter-spacing: 0; }
.mh-npair { display: flex; align-items: center; gap: 7px; padding: 5px 0; border-top: var(--mn-row-line); min-width: 0; }
.mh-nnames { min-width: 0; flex: 1; font-family: var(--mn-font-ui); font-weight: 700; font-size: 12px; line-height: 1.2; color: var(--mn-sand); }
.mh-nnames > div, .mh-nname { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mh-nname { min-width: 0; flex: 1; font-family: var(--mn-font-ui); font-weight: 700; font-size: 12px; color: var(--mn-sand); }
.mh-ntrow { display: flex; align-items: center; gap: 7px; padding: 5px 0; border-top: var(--mn-row-line); position: relative; }
.mh-ntrow[data-q]::before { content: ""; position: absolute; left: -10px; top: 6px; bottom: 6px; width: 3px; border-radius: 2px; background: var(--mn-teal); }
.mh-npos { width: 12px; flex: none; font-family: var(--mn-font-display); font-variation-settings: var(--mn-display-axes); font-weight: 400; font-size: 13px; color: var(--mn-mist); }
.mh-ntrow[data-q] .mh-npos { color: var(--mn-teal); }
.mh-nw { width: 14px; text-align: right; font-family: var(--mn-font-mono); font-size: 11px; color: var(--mn-mist); }
.mh-ntrow > b { width: 22px; text-align: right; font-size: 17px; }
.mh-nkey { display: flex; align-items: center; gap: 8px; font-family: var(--mn-font-mono); font-size: 11px; color: var(--mn-mist); letter-spacing: .06em; padding: 4px 4px 0; }
.mh-nkey > i { width: 3px; height: 12px; border-radius: 2px; background: var(--mn-teal); }
.mh-nround { font-family: var(--mn-font-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--mn-peach); margin-top: 4px; }
.mh-nmini { background: var(--mn-glass-bg); border: var(--mn-glass-border); border-radius: 12px; padding: 4px 9px; min-width: 0; }
.mh-nmini[data-big] { border-color: var(--mn-gold); padding: 8px 12px; }
.mh-nmrow { display: flex; align-items: center; gap: 6px; padding: 3px 0; min-width: 0; }
.mh-nmrow .mh-nname { font-size: 11px; font-weight: 600; color: var(--mn-mist); }
.mh-nmini[data-big] .mh-nmrow .mh-nname { font-size: 15px; }
.mh-nmrow > b { font-size: 15px; color: var(--mn-mist); min-width: 12px; text-align: right; }
.mh-nmini[data-big] .mh-nmrow > b { font-size: 24px; }
.mh-nmrow[data-win] .mh-nname, .mh-nmrow[data-win] > b { color: var(--mn-sand); font-weight: 800; }
.mh-nmrow[data-lose] .mn-avatar { opacity: .5; }
.mh-nseed { font-family: var(--mn-font-mono); font-size: 11px; color: var(--mn-mist); flex: none; }
.mh-nchampline { display: flex; align-items: baseline; justify-content: center; gap: 10px; margin-top: 4px; }
.mh-nchampline > b { font-size: 24px; color: var(--mn-gold); }
.mh-nprow { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-top: var(--mn-row-line); }
.mh-nprow:first-child { border-top: 0; }
.mh-nprow > b { font-size: 24px; color: var(--mn-peach); }
.mh-nsub { font-family: var(--mn-font-ui); font-size: 11px; color: var(--mn-mist); }
/* line-up: face to face over the episode's art */
.mh-nlufade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(15,27,43,.55) 0%, rgba(15,27,43,.82) 30%, rgba(15,27,43,.92) 70%, var(--mn-navy) 100%); }
.mh-nluhead { position: absolute; left: 20px; right: 20px; top: 70px; display: flex; align-items: center; gap: 10px; z-index: 2; }
.mh-n2x { padding: 3px 9px; border-radius: 999px; background: var(--mn-gold); color: var(--mn-navy); font-family: var(--mn-font-display); font-variation-settings: var(--mn-display-axes); font-weight: 400; font-size: 13px; letter-spacing: .1em; }
.mh-nlu { position: absolute; left: 16px; right: 16px; top: 112px; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.mh-nside { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.mh-nfaces > .mn-avatar + .mn-avatar { margin-left: -18px; box-shadow: 0 0 0 3px var(--mn-navy); }
.mh-nside[data-win] .mh-nfaces > .mn-avatar { box-shadow: 0 0 0 3px var(--mn-gold); }
.mh-nside[data-lose] { opacity: .5; }
.mh-nsidename { font-size: 30px; line-height: .95; }
.mh-nvs { font-family: var(--mn-font-display); font-variation-settings: var(--mn-display-axes); font-weight: 400; font-size: 46px; color: var(--mn-coral); line-height: 1; display: flex; gap: 10px; align-items: center; }
.mh-nvs > span { color: var(--mn-sand); }
.mh-nvs > i { font-style: normal; color: var(--mn-mist); }
.mh-nlufoot { position: absolute; left: 0; right: 0; bottom: 24px; z-index: 2; display: flex; flex-direction: column; align-items: center; }
/* champions */
.mh-nchfade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(15,27,43,.4) 0%, rgba(15,27,43,.78) 35%, rgba(15,27,43,.95) 75%, var(--mn-navy) 100%); }
.mh-nchhead { position: absolute; left: 20px; right: 20px; top: 76px; z-index: 2; text-align: center; }
.mh-nchword { font-size: 66px; line-height: .9; margin-top: 6px; background: linear-gradient(180deg, #FFF4E8 0%, var(--mn-gold) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.mh-nchpics { position: absolute; left: 22px; right: 22px; top: 176px; z-index: 2; display: flex; gap: 12px; }
.mh-nchpic { flex: 1; min-width: 0; text-align: center; }
.mh-nchphoto { position: relative; width: 100%; aspect-ratio: 4 / 5; border-radius: 18px; overflow: hidden; box-shadow: 0 0 0 3px var(--mn-gold); background: var(--mn-navy-2); }
.mh-nchname { font-size: 28px; margin-top: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mh-nchscore { position: absolute; left: 20px; right: 20px; top: 498px; z-index: 2; text-align: center; }
/* The inherited skin caps EVERY corner at 28px with !important
   (:not(.rounded-full)...), which leaves a 24px avatar round and turns a
   118px one into a rounded square. Faces are circles at every size. */
html:not(#mh) .mn-avatar { border-radius: 50% !important; }
.mn-avatar .mn-initials { font-size: max(9px, 2.2em) !important; }
/* a player with no photo is a disc with their initials, not loose letters on the page */
.mn-avatar .mn-initials { background: rgba(255,244,232,.12); color: var(--mn-sand); }

/* ── scenes: the crossfading pictures (loading, home) ─────────────────── */
.mh-scenes { position: absolute; inset: 0; }
.mh-scene { position: absolute; inset: 0; opacity: 0; transition: opacity 1.1s ease; }
.mh-scene[data-on] { opacity: 1; }
.mh-scene .mn-art img { transform: scale(1.02); }
.mh-scene[data-on] .mn-art img { animation: mhKen 7s ease-out forwards; }
@keyframes mhKen { from { transform: scale(1.02); } to { transform: scale(1.1); } }
.mh-loadtag { animation: mhTagIn .5s ease-out both; }
@keyframes mhTagIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ── motion: every screen arrives, nothing loops (owner, 23 Nov) ─────────
   Screens are keyed by route, so each visit replays its entrance. Fill mode is
   BACKWARDS only: once it has played the element gets its own transform back.
   The global reduced-motion rule above switches all of it off. */
@keyframes mhRise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes mhSlideIn { from { opacity: 0; transform: translateX(-28px); } to { opacity: 1; transform: none; } }
@keyframes mhBand { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
@keyframes mhFade { from { opacity: 0; } to { opacity: 1; } }
@keyframes mhSettle { from { transform: scale(1.12); } to { transform: scale(1); } }
.mh-body > *, .mh-body > .mh-col > *, .mh-body > .mh-col > .mh-col > * { animation: mhRise .48s cubic-bezier(.2,.8,.2,1) backwards; }
.mh-body > .mh-col > :nth-child(1) { animation-delay: .04s } .mh-body > .mh-col > :nth-child(2) { animation-delay: .09s }
.mh-body > .mh-col > :nth-child(3) { animation-delay: .14s } .mh-body > .mh-col > :nth-child(4) { animation-delay: .19s }
.mh-body > .mh-col > :nth-child(5) { animation-delay: .24s } .mh-body > .mh-col > :nth-child(6) { animation-delay: .28s }
.mh-body > .mh-col > :nth-child(n+7) { animation-delay: .32s }
.mh-body > .mn-hero { animation: mhFade .5s ease-out backwards; }
.mn-hero-img > .mn-art img { animation: mhSettle 1.4s cubic-bezier(.2,.8,.2,1) backwards; }
.mn-hero .mn-lockup .mn-logo { animation: mhSlideIn .6s .18s cubic-bezier(.2,.8,.2,1) backwards; }
.mn-hero .mn-lockup .mn-band { animation: mhBand .55s .38s cubic-bezier(.6,0,.2,1) backwards; }
.mn-hero .mn-lockup .mn-meta { animation: mhFade .5s .6s ease-out backwards; }
.mh-job { animation: mhRise .45s cubic-bezier(.2,.8,.2,1) backwards; }
.mh-job:nth-child(2) { animation-delay: .05s } .mh-job:nth-child(3) { animation-delay: .1s } .mh-job:nth-child(4) { animation-delay: .15s }
.mh-job:nth-child(n+5) { animation-delay: .2s }
.mh-loadlock { animation: mhRise .7s .1s cubic-bezier(.2,.8,.2,1) backwards; }
.mh-loadfoot { animation: mhRise .6s .35s cubic-bezier(.2,.8,.2,1) backwards; }

/* touch: a press you can feel, no double-tap zoom delay, no grey flash */
.mh-page button, .mh-page a { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.mn-pill, .mh-chip, .mh-act, .mh-job, .mn-navtab, .mn-cardbtn, .mh-orgchip, .mh-wrow, .mh-eprow {
  transition: transform .12s ease, filter .12s ease; }
.mn-pill:active, .mh-chip:active, .mh-act:active, .mh-job:active, .mn-navtab:active, .mn-cardbtn:active,
.mh-orgchip:active, .mh-wrow:active, .mh-eprow:active { transform: scale(.97); filter: brightness(1.12); }
/* long lists: skip painting rows that are off screen */
.mh-wrow, .mh-job { content-visibility: auto; contain-intrinsic-size: auto 72px; }

/* ── NOW LOADING, GTA-style (owner, 24 Nov) ───────────────────────────────
   A poster fills the glass and PANS across itself (the wide ones are wider
   than a phone, so the pan shows the whole scene over its 4s); title bottom
   left with a hard drop shadow, the tip in a dark box, spinner bottom right. */
.mh-loadart { position: absolute; inset: 0; }
.mh-loading .mh-scene .mn-art img { transform: none; }
.mh-loading .mh-scene[data-on] .mn-art img { animation: mhPan 4.6s linear forwards; }
@keyframes mhPan { from { object-position: 0% 35%; transform: scale(1.06); } to { object-position: 100% 35%; transform: scale(1.12); } }
.mh-loading .mh-scene { transition: opacity .7s ease; }
.mh-loadshade { position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(180deg, rgba(10,16,26,.78), rgba(10,16,26,.35) 26%, rgba(10,16,26,0) 40%, rgba(10,16,26,0) 62%, rgba(10,16,26,.85) 88%); }
.mh-loadtag { position: absolute; left: 18px; top: calc(18px + env(safe-area-inset-top)); }
.mh-loadfoot { position: absolute; left: 20px; right: 20px; bottom: calc(64px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 14px; }
/* the title sits TOP left: several posters carry their own lettering low down,
   and a title over a title reads as neither */
.mh-loadlock { position: absolute; left: 20px; top: calc(58px + env(safe-area-inset-top)); }
.mh-loadlock .mn-l1 { filter: var(--mn-title-filter) drop-shadow(4px 4px 0 rgba(0,0,0,.85)); }
.mh-loadlock .mn-band { filter: drop-shadow(4px 4px 0 rgba(0,0,0,.85)); }
.mh-loadlock .mn-meta { text-shadow: 0 1px 6px rgba(0,0,0,.9); }
.mh-loadtip { max-width: 330px; padding: 10px 12px; background: rgba(8,12,20,.82); border-left: 3px solid var(--mn-coral, #F26B5B); display: flex; flex-direction: column; gap: 4px; }
.mh-loadspin { position: absolute; right: 18px; bottom: calc(22px + env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 10px; }
.mh-spinner { width: 22px; height: 22px; border-radius: 50%; border: 3px solid rgba(255,255,255,.25); border-top-color: var(--mn-peach, #FFC9A3); animation: mhSpin .8s linear infinite; }
@keyframes mhSpin { to { transform: rotate(360deg); } }
.mh-loadspin[data-done] { animation: mhBlink 1.4s ease-in-out infinite; }
@keyframes mhBlink { 50% { opacity: .35; } }
.mh-loadbar { position: absolute; left: 0; right: 0; bottom: 0; }
.mh-loadbar > [role="progressbar"] { height: 4px; background: rgba(255,255,255,.12); }

/* the tier tag and the rank sit over the photo: a short dark wash at the top keeps
   them readable over a bright sky without covering the face (24 Nov) */
.mn-card .mn-card-img::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 26%; z-index: 1; pointer-events: none;
  background: linear-gradient(180deg, rgba(10,16,26,.55), rgba(10,16,26,0)); }
.mn-card .mn-tiertag, .mn-card .mn-rank { z-index: 2; }

/* ── clips ───────────────────────────────────────────────────────────────── */
.mh-act[data-on] { background: var(--mn-sand); color: var(--mn-navy); }
.mh-clipgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.mh-cliprow { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -20px; padding: 0 20px 2px; }
.mh-cliprow::-webkit-scrollbar { display: none; }
.mh-clip { position: relative; display: block; width: 100%; aspect-ratio: 16 / 9; padding: 0; border: 0; border-radius: 12px; overflow: hidden; background: rgba(255,255,255,.06); cursor: pointer; }
.mh-clip[data-wide] { flex: 0 0 210px; width: 210px; }
.mh-clip[data-skel] { animation: mhFade 1.2s ease-in-out infinite alternate; }
.mh-clip img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.mh-clipplay { position: absolute; left: 50%; top: 42%; transform: translate(-50%,-50%); width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; padding-left: 3px; font-size: 13px; color: var(--mn-navy); background: rgba(255,240,225,.9); }
.mh-clipcap { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 8px 5px; text-align: left; font: 500 11px/1.2 var(--mn-font-mono); letter-spacing: .06em; color: var(--mn-sand); background: linear-gradient(180deg, rgba(10,16,26,0), rgba(10,16,26,.85)); }
.mh-clipview { position: fixed; inset: 0; z-index: 90; display: flex; flex-direction: column; justify-content: center; gap: 12px; padding: calc(14px + env(safe-area-inset-top)) 14px calc(18px + env(safe-area-inset-bottom)); background: rgba(6,10,18,.96); }
.mh-clipview video { display: block; width: 100%; max-height: 62vh; background: #000; border-radius: 12px; }
.mh-clipbar { display: flex; align-items: center; gap: 10px; }
.mh-clipbar > :first-child { flex: 1; }
.mh-clipn { font: 500 11px var(--mn-font-mono); color: var(--mn-mist); }
.mh-clipx { width: 44px; height: 44px; border: 0; border-radius: 50%; background: rgba(255,255,255,.1); color: var(--mn-sand); font-size: 16px; cursor: pointer; }
.mh-clipnav { display: flex; gap: 8px; justify-content: center; }
.mh-clipnav .mh-act[disabled] { opacity: .35; }
.mh-cliplink { align-self: center; font: italic 14px var(--mn-font-serif); color: var(--mn-mist); text-decoration: underline; padding: 10px 0; }
.mh-linkbtn { border: 0; background: none; color: var(--mn-peach); font: 500 12px var(--mn-font-mono); letter-spacing: .08em; min-height: 44px; cursor: pointer; }

/* shrink-to-fit names (mhFitAll in heist-components.jsx): one line, never cut */
.mh-fitline { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* the posts' headlines are one line in the wider face, shrunk to fit: "champions"
   ran off the card and "tonight's take" wrapped onto the first row */
.mh-nstitle, .mh-nchword, .mh-nchname { white-space: nowrap; overflow: hidden; }

/* ── THE LOOT — knockout cards (heist-loot.jsx) ─────────────────────────
   One card per night you reach the knockout; the frame says how far you got.
   Sizes are in em off the card's own font-size (16px at 264 wide), so the
   album thumbnail and the story card are one drawing at two scales. */
:root {
  --mh-loot-job: linear-gradient(150deg, #FFF6E6, #E8D6B4 55%, #F6EAD3);
  --mh-loot-inside: linear-gradient(150deg, #FFC36B, #FF7A3D 55%, #D2357E);
  --mh-loot-getaway: linear-gradient(150deg, #FF4F8B, #FF2D78 40%, #B0306E 70%, #FF7AA8);
  --mh-loot-score: linear-gradient(150deg, #FFE7A3, #FFC24A 35%, #E89A1F 65%, #FFE7A3);
  --mh-loot-ink: #07040D;
  --mh-loot-foil: linear-gradient(115deg, transparent 20%, rgba(255,255,255,.42) 38%, rgba(255,201,163,.35) 46%, rgba(255,45,120,.25) 54%, transparent 68%);
  --mh-loot-wash: linear-gradient(180deg, rgba(15,27,43,.15), rgba(15,27,43,.0) 30%, rgba(15,27,43,.55) 62%, rgba(7,4,13,.92) 100%);
}
.mh-loot { position: relative; flex: 0 0 auto; box-sizing: border-box; padding: .3em; border-radius: .9em;
  background: var(--mh-loot-job); box-shadow: var(--mn-shadow-card); overflow: hidden; isolation: isolate; }
.mh-loot[data-tier="inside"]  { background: var(--mh-loot-inside); box-shadow: var(--mn-shadow-card), 0 0 1.6em rgba(255,122,61,.35); }

// code change (handoff rule 10).

const MH = window.MH_SEASON || {};

// REP IS PER NIGHT PLAYED (owner, 22 Nov 2026): the threshold for a level is
// its per-night figure times the nights the season has played, so after five
// nights it is exactly the handoff's 80 / 90 / 100. Rep never goes down: a
// player's level is the highest they reached after ANY night, which is why
// this takes their running totals, not just today's.
const MH_REPS = (MH.rep && MH.rep.levels) || [];
function mhRepAt(points, nights) {
  return MH_REPS.find(l => points >= l.perNight * nights) || MH_REPS[MH_REPS.length - 1];

function mhRepFor(totalsByNight) {
  let best = MH_REPS.length - 1;
  (totalsByNight || []).forEach((pts, i) => {
    const k = MH_REPS.indexOf(mhRepAt(pts, i + 1));
    if (k < best) best = k;

// ── hero cut ──────────────────────────────────────────────────────────────
// The keyline is an SVG line in the hero's own coordinates, so it lands on
// the cut at any width. The static design positions a rotated div by
// measured pixels, which is right at 375 and wrong at every other phone.
// cut = [right edge %, left edge %] of the bottom edge, top to bottom.
// fade names a --mn-fade-<name> token (session, live, recap); default is Home's.
// ── scenes ────────────────────────────────────────────────────────────────
// Each page owns a SLOT, and the slot is offset by the day, so the pictures
// change every day and two pages never open on the same one (while there are
// more scenes than slots). Session pages keep their own episode's art.
const MH_SLOTS = ["loading", "home", "take", "wanted", "jobs", "me", "crew"];
function mhSceneIndex(D, slot) {
  const n = (D && D.scenes || []).length; if (!n) return 0;
  const k = MH_SLOTS.indexOf(slot);
  return (Math.floor(Date.now() / 864e5) + (k < 0 ? 0 : k) * 3) % n;
}
function mhScene(D, slot) { return (D && D.scenes || [])[mhSceneIndex(D, slot)] || {}; }
const mhStill = () => typeof matchMedia !== "undefined" && matchMedia("(prefers-reduced-motion: reduce)").matches;

// A crossfading stack. Only scenes already shown (and the next one, warming)
// are in the DOM, so opening the page costs one picture, not ten.
function MhScenes({ list, start = 0, every = 3200, onIndex }) {
  const n = (list || []).length;
  const [i, setI] = React.useState(n ? start % n : 0);
  const [seen, setSeen] = React.useState(() => new Set([n ? start % n : 0]));
  React.useEffect(() => {
    if (n < 2 || mhStill()) return;
    const t = setInterval(() => setI(x => (x + 1) % n), every);
    return () => clearInterval(t);
  }, [n, every]);
  React.useEffect(() => {
    if (onIndex) onIndex(i);
    setSeen(s => { if (s.has(i) && s.has((i + 1) % n)) return s; const c = new Set(s); c.add(i); c.add((i + 1) % n); return c; });
  }, [i]);
  if (!n) return null;
  return (
    <div className="mh-scenes">
      {list.map((sc, k) => seen.has(k) && (
        <div key={sc.src + k} className="mh-scene" data-on={k === i ? "" : undefined} aria-hidden={k !== i}>
          <div className="mn-art"><img src={sc.src} srcSet={mhSrcSet(sc.src)} sizes="100vw" alt="" style={{ objectPosition: sc.pos || "center 30%" }}
            fetchpriority={k === start % n ? "high" : undefined} decoding="async" /></div>
        </div>))}
    </div>
  );
}

function MhHeroCut({ height, src, pos, cut = [82, 96], gold, fade, children, style, scenes, sceneStart, every, onScene }) {
  const poly = `polygon(0 0,100% 0,100% ${cut[0]}%,0 ${cut[1]}%)`;
  return (
    <div className="mn-hero" data-gold={gold ? "" : undefined} style={{ height, ...style }}>
      <div className="mn-hero-img" style={{ clipPath: poly }}>{scenes && scenes.length
        ? <MhScenes list={scenes} start={sceneStart || 0} every={every} onIndex={onScene} />
        : <MhArt src={src} pos={pos} />}</div>
      <div className="mn-hero-fade" style={{ clipPath: poly, background: fade ? `var(--mn-fade-${fade})` : undefined }} aria-hidden="true" />
      <svg className="mn-keyline" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <line x1="0" y1={cut[1]} x2="100" y2={cut[0]} vectorEffect="non-scaling-stroke" />
      </svg>
      {children}
    </div>
  );
}

// ── shrink-to-fit names ───────────────────────────────────────────────────
// The logo's block face (Bowlby One, 25 Nov 2026) is far wider than the
// condensed Archivo it replaced: "MUNTHER RAHBI" ellipsised on the crew card
// and wrapped in The Take. Anything marked .mh-fitline (and every crew-card
// name) is shrunk, in steps, until its whole text fits its one line — down to
// 60% of its set size, and the ellipsis stays as the last resort. One observer
// on the body re-fits after every render, so no screen has to remember to.
const MH_FIT_SEL = ".mh-fitline, .mn-card .mn-name, .mh-nstitle, .mh-nchword, .mh-nchname";
function mhFitAll() {
  for (const el of document.querySelectorAll(MH_FIT_SEL)) {
    if (!el.offsetWidth) continue;
    el.style.fontSize = "";
    let fs = parseFloat(getComputedStyle(el).fontSize); const min = fs * .6;
    while (mhOver(el) && fs > min) { fs -= .5; el.style.fontSize = fs + "px"; }
  }
}
// scrollWidth and clientWidth are whole numbers: text 0.4px too wide for a
// 92.66px box reads as 93 = 93 while text-overflow draws the ellipsis ("inside
// m…" on a 104px knockout card). And a range over ellipsised text measures the
// TRIMMED run, so the ellipsis is switched off while the text is measured.
function mhOver(el) {
  if (el.scrollWidth > el.clientWidth + .5) return true;
  const box = el.getBoundingClientRect().width, s = el.style, d = s.display, t = s.textOverflow;
  s.display = "inline-block"; s.textOverflow = "clip";
  const r = document.createRange(); r.selectNodeContents(el);
  const w = r.getBoundingClientRect().width;
  s.display = d; s.textOverflow = t;
  return w > box + .05;
}
if (typeof window !== "undefined" && !window.__mhFit) {
  window.__mhFit = true;
  let raf = 0;
  const kick = () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; mhFitAll(); }); };
  const start = () => { new MutationObserver(kick).observe(document.body, { childList: true, subtree: true, characterData: true }); kick(); };
  if (document.body) start(); else addEventListener("DOMContentLoaded", start);
  // the face arrives AFTER the first render: a swap changes widths without
  // touching the DOM, so the observer alone never re-fits (it left "munther ra…")
  if (document.fonts) { document.fonts.ready.then(kick); document.fonts.addEventListener("loadingdone", kick); }
  addEventListener("resize", kick);
}

// MUSCAT HEIST · Vol.10 — the season screens (handoff phase 2):
// 01 Home · 02 Jobs · 03 Most Wanted · 04 ME · 05 The Crew · 06 Crew Card ·
// 17 The Take. Every value is the static design's own (handoff/design/
// Muscat Nights App.html); every colour is a token. They read ONE shape of
// data, D, built by brand/heist/preview-data.js in preview and by the app's
// adapter from the live state — so a screen cannot be right in preview and
// wrong on the night.

// ── dates, without the UTC trap ──────────────────────────────────────────
// A plain "2026-12-23" is parsed by its parts. new Date("2026-12-23") is UTC
// midnight, which on this server and on every phone in Oman is 4am — fine —
// but the repo's rule is never to rely on it (CLAUDE.md, dates on UTC+4).
const MH_DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const MH_MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
function mhDate(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
function mhDay(s) { const d = mhDate(s); return `${MH_DOW[d.getDay()]} ${d.getDate()} ${MH_MON[d.getMonth()]}`; }
function mhStart(s, time) { const d = mhDate(s); const [h, m] = (time || "17:30").split(":").map(Number); d.setHours(h, m, 0, 0); return d; }
function mhCountdown(to, now) {
  const ms = to - now; if (ms <= 0) return null;
  const m = Math.floor(ms / 60000), d = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60);
  return d > 0 ? `${d}D ${h}H` : `${h}H ${m % 60}M`;
}
const mhFirst = n => (n || "").split(" ")[0];
const mhPts = n => `${n} pt${n === 1 ? "" : "s"}`;

// ── what every screen derives from D ─────────────────────────────────────
function mhDerive(D) {
  const nightsPlayed = D.sessions.filter(s => s.state === "done").length;
  const players = D.players.map(p => {
    const rep = p.repId ? MH_REPS.find(r => r.id === p.repId) : mhRepAt(p.points, Math.max(1, nightsPlayed));
    return Object.assign({}, p, { rep, tier: mhTierFor(p.rank) });
  });
  const byId = Object.fromEntries(players.map(p => [p.id, p]));
  const above = p => players.find(q => q.rank === p.rank - 1);
  const me = byId[D.meId] || null;
  const lastDone = D.sessions.filter(s => s.state === "done").slice(-1)[0];
  return { players, byId, above, me, nightsPlayed, lastDone,
    gap: p => { const a = above(p); return a ? a.points - p.points : null; } };
}

const MhTitle = ({ title, aside }) => (
