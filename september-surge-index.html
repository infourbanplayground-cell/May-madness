function DashboardView({ state, leaderboard, setTab, setOpenSessionId, isAdmin, meId, onOpenPicker }) {
  // HOW TO SCORE is read once and then sits permanently between the standings
  // and the end of the page — roughly 1,500pt of it. Collapsed by default;
  // the rules are unchanged, they just stop costing a scroll every visit.
  const [showRules, setShowRules] = useState(false);
  const top3 = leaderboard.slice(0, 3);
  // NEXT UP must point at the next session to PLAY, not simply the last one
  // entered. With every session complete this fell through to a finished
  // session under a "NEXT UP" heading, so a 9-session series read as over.
  const nextUp  = state.sessions.find(s => !s.completed);
  const latest  = nextUp || state.sessions[state.sessions.length - 1];
  const allDone = !nextUp;
  const active = leaderboard.filter(l => l.stats.groupPlayed > 0 || l.stats.qfReached > 0).length;
  const totalTeams = state.sessions.reduce((n, s) => n + (s.teams?.length || 0), 0);

  const rankColors = [
    { text: "#FFC24B", glow: "rgba(255,194,75,0.35)", bg: "rgba(255,194,75,0.07)", border: "rgba(255,194,75,0.2)" },
    { text: "#c0c0c0", glow: "rgba(192,192,192,0.25)", bg: "rgba(192,192,192,0.05)", border: "rgba(192,192,192,0.15)" },
    { text: "#cd7f32", glow: "rgba(205,127,50,0.25)", bg: "rgba(205,127,50,0.05)", border: "rgba(205,127,50,0.15)" },
  ];

  return (
    <div className="space-y-4">

      {/* ── SEPTEMBER SURGE BRAND HERO ── */}
      <div className="jh-hero" style={{margin:"2px 0 8px",padding:0,background:"#0A0A0A",border:"1px solid rgba(244,249,250,.10)",boxShadow:"none",transform:"none",position:"relative"}}>
        <div style={{position:"absolute",top:0,left:0,zIndex:5,background:"rgba(0,229,255,.14)",border:"1px solid rgba(244,249,250,.10)",borderTop:"none",borderLeft:"none",fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900",fontSize:12,letterSpacing:"2.5px",color:"#F4F9FA",padding:"6px 14px 4px"}}>URBAN PLAYGROUND · VOL.7</div>
        <div className="jh-hero-inner" style={{padding:"18px 16px 16px",textAlign:"center"}}>
          {/* The emblem and "URBAN PLAYGROUND PRESENTS" both sat here, within
              700pt of the identical mark in the header. The header keeps the
              emblem; the hero keeps the series wordmark, which is the part
              that carries the volume. */}
          <img className="surge-lockup-img glitch-in" src="assets/surge-lockup.png" alt="September Surge" />
          <div className="aa-tag glitch-in d3">RIDE <b>THE SURGE.</b></div>
          <div style={{marginTop:14}}><span className="jh-mock-caption">MON &amp; WED · 5:30 PM · <b>ALL SEPTEMBER</b></span></div>
        </div>
      </div>

      {/* ── YOUR STANDING — the first thing on HOME that is about the reader ── */}
      <YourStanding leaderboard={leaderboard} state={state} meId={meId}
                    onOpenPicker={onOpenPicker} setTab={setTab} />

      {/* ── Series progress + prize pool ──
          "2 of 9" beats an empty screen at reading whether the series is
          nearly over or just getting going (review finding #2's other
          half). The pool figure is computed from the same numbers
          generateFormatText already uses for the WhatsApp post below, not
          retyped — the two can't quietly drift apart. */}
      <div style={{display:"flex",gap:8}}>
        {(() => {
          const planned = Math.max(9, state.sessions.length);
          const done = state.sessions.filter(s => s.completed).length;
          const pct = planned ? Math.round(done / planned * 100) : 0;
          return (
            <div style={{flex:1,background:"rgba(20,24,36,.85)",border:"1px solid rgba(244,249,250,.10)",padding:"12px 14px"}}>
              <div style={{fontFamily:"Verdana,sans-serif",fontSize:9,fontWeight:"bold",letterSpacing:".18em",color:"#8A9BA8",textTransform:"uppercase"}}>Series progress</div>
              <div style={{fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900",fontSize:26,color:"#F4F9FA",lineHeight:1,margin:"6px 0 8px"}}>{done}<span style={{color:"#8A9BA8",fontSize:18}}> / {planned}</span></div>
              <div style={{height:4,background:"rgba(138,155,168,.25)"}}><div style={{width:pct+"%",height:4,background:"#00E5FF"}} /></div>
            </div>
          );
        })()}
        {(() => {
          const sessionVoucher = 14, perTeam = 2, sessionsTotal = 9, season = [75, 45, 30];
          const pool = sessionVoucher * perTeam * sessionsTotal + season.reduce((a, b) => a + b, 0);
          return (
            <div style={{width:150,background:"rgba(20,24,36,.85)",border:"1px solid rgba(244,249,250,.10)",padding:"12px 14px"}}>
              <div style={{fontFamily:"Verdana,sans-serif",fontSize:9,fontWeight:"bold",letterSpacing:".18em",color:"#8A9BA8",textTransform:"uppercase"}}>Prize pool</div>
              <div style={{fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900",fontSize:26,color:"#F4F9FA",lineHeight:1,margin:"6px 0 8px"}}>{pool}<span style={{fontSize:13,color:"#8A9BA8"}}> OMR</span></div>
              <div style={{fontFamily:"Verdana,sans-serif",fontSize:8.5,fontWeight:"bold",letterSpacing:".1em",color:"#FF9E1B"}}>2X ON THE LAST TWO</div>
            </div>
          );
        })()}
      </div>

      {/* ── Stats ────────────────────────────────────── */}
      <div className="grid grid-cols-3 gap-2">
        {[
          { value: state.sessions.length, label: "Sessions", fill: "none", rot: "-1deg" },
          { value: active,                label: "Ranked",   fill: "none", rot: ".8deg" },
          { value: totalTeams,            label: "Teams",    fill: "none", rot: "-.5deg" },
        ].map(({ value, label, fill, rot }) => (
          <div key={label} style={{ background:fill, border:"1px solid rgba(244,249,250,.10)", boxShadow:"none", borderRadius:0, padding:"16px 6px 10px", textAlign:"center", transform:`rotate(${rot})`, position:"relative", overflow:"hidden" }}>
            
            <div style={{ position:"relative", fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize:"52px", lineHeight:.8, color:"#F4F9FA", WebkitTextStroke:"0", textShadow:"none" }}>{value}</div>
            <div style={{ position:"relative", display:"inline-block", fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize:"13px", letterSpacing:"2px", background:"#0A0F14", color:"#F4F9FA", padding:"3px 10px 1px", marginTop:8 }}>{label}</div>
          </div>
        ))}
      </div>

      {/* ── Top 3 Leaderboard ────────────────────────── */}
      {top3.length > 0 && top3[0].totalPts > 0 && (
        <div className="jh-panel jh-fill-blue" style={{transform:"none"}}>
          <div style={{padding:"16px 12px 14px"}}>
            <div className="aa-kicker">LEADERBOARD</div>
            {top3.map((e, i) => (
              <div key={e.player.id} className="jh-mock-row" style={{transform:`rotate(${i % 2 ? ".5" : "-.5"}deg)`}} onClick={() => setTab("leaderboard")}>
                {i === 0 && <span className="jh-crown"><CIc.crown size={26} /></span>}
                <div className="jh-mock-rank" style={{background: i === 0 ? "var(--blue)" : i === 1 ? "#C9C9C9" : "#8A9BA8"}}>{i + 1}</div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900",fontSize:22,letterSpacing:1,color:"#F4F9FA",lineHeight:1}}>{e.player.name.toUpperCase()}</div>
                  <div style={{fontFamily:"Verdana,sans-serif",fontSize:9,fontWeight:"bold",letterSpacing:".12em",color:"#8A9BA8",marginTop:3,textTransform:"uppercase"}}>{e.stats.sessionsPlayed} SESS · {e.stats.groupWins} WINS</div>
                </div>
                <div style={{fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900",fontSize:32,color:"#00E5FF",WebkitTextStroke:"0",textShadow:"none",whiteSpace:"nowrap"}}>{e.totalPts}<span style={{fontSize:12,color:"#F4F9FA",WebkitTextStroke:"0",letterSpacing:1}}> PTS</span></div>
              </div>
            ))}
            <div style={{textAlign:"center",marginTop:4}}>
              <button className="jh-mock-chip" onClick={() => setTab("leaderboard")}>VIEW FULL RANKINGS ▶</button>
            </div>
          </div>
        </div>
      )}

      {/* Tagline lives once, in the hero band. */}

      {/* ── Latest Session ───────────────────────────── */}
      {latest ? (
        <div className="jh-panel jh-fill-red" style={{transform:"none"}}>
          <div style={{padding:"16px 12px 14px"}}>
            <div className="aa-kicker" style={{background:"var(--blue)"}}>{allDone ? "LATEST SESSION" : "NEXT UP"}</div>
            <div className="jh-mock-sess" onClick={() => setOpenSessionId(latest.id)}>
              <div className="jh-pow" style={{color: latest.completed ? "#3FA33C" : "#00E5FF"}}>{latest.completed ? "DONE" : "LIVE"}</div>
              <div style={{fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900",fontSize:34,letterSpacing:1,color:"#F4F9FA",lineHeight:.9,paddingRight:70}}>{latest.name.toUpperCase()}</div>
              <div style={{fontFamily:"Verdana,sans-serif",fontSize:9.5,fontWeight:"bold",letterSpacing:".1em",color:"#8A9BA8",textTransform:"uppercase",marginTop:6}}>{latest.date ? new Date(latest.date + "T12:00:00").toLocaleDateString("en-GB", {weekday:"short",day:"numeric",month:"short"}).toUpperCase() : "NO DATE"} · {latest.teams?.length || 0} TEAMS{latest.doublePoints ? " · ⚡ 2X POINTS" : ""}</div>
              <div className="jh-mock-btn">OPEN SESSION ▶</div>
            </div>
          </div>
        </div>
      ) : isAdmin ? (
        <Card className="p-6 text-center border-dashed">
          <I.calendar className="mx-auto mb-2 text-stone-600" size={32} />
          <div className="text-stone-400 mb-3">No sessions yet</div>
          <Btn onClick={() => setTab("sessions")}><I.plus size={14} /> Create Session 1</Btn>
        </Card>
      ) : (
        <Card className="p-6 text-center border-dashed">
          <I.calendar className="mx-auto mb-2 text-stone-600" size={32} />
          <div className="text-stone-400">Waiting for first session…</div>
        </Card>
      )}

      {/* ── Prize panel ──────────────────────────────── */}
      <div className="jh-panel jh-fill-green" style={{transform:"none"}}>
        <div style={{display:"flex",alignItems:"center",gap:14,padding:"14px 12px",position:"relative",zIndex:2}}>
          <div className="jh-star"><div><div style={{fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900",fontSize:34,lineHeight:.8,color:"#00E5FF",WebkitTextStroke:"0"}}>402</div><div style={{fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900",fontSize:15,color:"#F4F9FA"}}>OMR</div></div></div>
          <div>
            <div style={{fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900",fontSize:30,letterSpacing:1,color:"#F4F9FA",WebkitTextStroke:"0",textShadow:"none",lineHeight:.95}}>PRIZE POOL<br/>UP FOR GRABS</div>
            <div style={{display:"inline-flex",alignItems:"center",gap:6,marginTop:8,fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900",fontSize:14,letterSpacing:1.5,background:"#0A0F14",color:"var(--blue)",padding:"4px 10px 2px",transform:"none"}}>SESSIONS 8 &amp; 9 = 2X POINTS <CIc.flame size={11} /></div>
          </div>
        </div>
      </div>

      {/* ── Point Structure ──────────────────────────── */}
      <div className="jh-panel jh-fill-yellow" style={{transform:"none"}}>
        <button onClick={() => setShowRules(v => !v)}
          aria-expanded={showRules}
          style={{padding:"16px 12px 14px",position:"relative",zIndex:2,width:"100%",
                  display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,
                  background:"none",border:"none",cursor:"pointer",textAlign:"left"}}>
          <span className="aa-kicker">HOW TO SCORE</span>
          <span style={{fontFamily:"'JetBrains Mono',monospace",fontWeight:700,fontSize:11,
                        letterSpacing:".16em",color:"#8A9BA8",whiteSpace:"nowrap"}}>
            {showRules ? "HIDE −" : "SHOW +"}
          </span>
        </button>

        {showRules && <div className="p-4 space-y-5" style={{position:"relative",zIndex:2,paddingTop:4}}>
          {/* Group Stage */}
          <div>
            <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:14 }}>
              <div style={{ height:3, flex:1, background:"var(--ink)" }}/>
              <span style={{ fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize:"16px", letterSpacing:"3px", color:"#F4F9FA", padding:"3px 12px", border:"1px solid rgba(244,249,250,.14)", background:"var(--blue)" }}>GROUP STAGE</span>
              <div style={{ height:3, flex:1, background:"var(--ink)" }}/>
            </div>
            <div className="space-y-1.5">
              {[
                { label: "WIN", pts: "+3", color: "#00E5FF", bg: "rgba(20,24,36,.85)", border: "rgba(244,249,250,.16)", icon: <Icon d='<path d="M20 6L9 17l-5-5"/>' size={13} /> },
                { label: "TIEBREAK LOSS", pts: "+2", color: "var(--blue)", bg: "rgba(20,24,36,.85)", border: "rgba(244,249,250,.16)", icon: <Icon d='<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>' size={13} /> },
                { label: "COMPETITIVE LOSS", pts: "+1", color: "var(--orange)", bg: "rgba(20,24,36,.85)", border: "rgba(244,249,250,.16)", icon: <Icon d='<path d="M16 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="8.5" cy="7" r="4"/><path d="M22 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/>' size={13} /> },
                { label: "6-0 / 6-1 LOSS", pts: "0", color:"#8A9BA8", bg: "rgba(20,24,36,.85)", border: "rgba(244,249,250,.16)", icon: <Icon d='<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>' size={13} /> },
              ].map(({ label, pts, color, bg, border, icon }) => (
                <div key={label} style={{ display:"flex", alignItems:"center", gap:10, padding:"10px 14px", background:bg, border:`4px solid ${border}`, boxShadow:`4px 4px 0 ${border}`, marginBottom:8 }}>
                  <span style={{ color, flexShrink:0 }}>{icon}</span>
                  <span style={{ flex:1, fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize:"20px", letterSpacing:"1px", color:"#F4F9FA" }}>{label}</span>
                  <span style={{ fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize:"28px", color, WebkitTextStroke:"0", letterSpacing:"1px" }}>{pts}</span>
                </div>
              ))}
              <div style={{ display:"flex", alignItems:"center", gap:10, padding:"10px 14px", background:"rgba(255,158,27,.14)", border:"1px solid rgba(244,249,250,.10)", boxShadow:"none", marginBottom:8 }}>
                <Icon d='<path d="M11.562 3.266a.5.5 0 01.876 0L15.39 8.87a1 1 0 001.516.294L21.183 5.5a.5.5 0 01.798.519l-2.834 10.246a1 1 0 01-.956.734H5.81a1 1 0 01-.957-.734L2.02 6.02a.5.5 0 01.798-.519l4.276 3.664a1 1 0 001.516-.294z"/><path d="M5 21h14"/>' size={13} style={{ color:"#F4F9FA" }} />
                <span style={{ flex:1, fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize:"20px", letterSpacing:"1px", color:"#F4F9FA" }}>TOP OF GROUP</span>
                <span style={{ fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize:"28px", color:"#F4F9FA", WebkitTextStroke:"0", letterSpacing:"1px" }}>+1</span>
              </div>
            </div>
          </div>

          {/* Knockout Stage */}
          <div>
            <div style={{ display:"flex", alignItems:"center", gap:10, margin:"16px 0 14px" }}>
              <div style={{ height:3, flex:1, background:"var(--ink)" }}/>
              <span style={{ fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize:"16px", letterSpacing:"3px", color:"#F4F9FA", padding:"3px 12px", border:"1px solid rgba(244,249,250,.14)", background:"var(--red)" }}>KNOCKOUT STAGE</span>
              <div style={{ height:3, flex:1, background:"var(--ink)" }}/>
            </div>
            <div className="space-y-1.5">
              {[
                { label: "REACH QF",    pts: "+1", color: "var(--orange)" },
                { label: "REACH SF",    pts: "+2", color: "var(--orange)" },
                { label: "REACH FINAL", pts: "+3", color: "var(--red)" },
              ].map(({ label, pts, color }) => (
                <div key={label} style={{ display:"flex", alignItems:"center", gap:10, padding:"10px 14px", background:"rgba(20,24,36,.85)", border:"1px solid rgba(244,249,250,.10)", boxShadow:"none", marginBottom:8 }}>
                  <div style={{ width:12, height:12, background:color, border:"1px solid rgba(244,249,250,.14)", flexShrink:0 }} />
                  <span style={{ flex:1, fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize:"20px", letterSpacing:"1px", color:"#F4F9FA" }}>{label}</span>
                  <span style={{ fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize:"28px", color, WebkitTextStroke:"0", letterSpacing:"1px" }}>{pts}</span>
                </div>
              ))}
              <div style={{ display:"flex", alignItems:"center", gap:10, padding:"12px 14px", background:"var(--blue)", border:"1px solid rgba(244,249,250,.10)", boxShadow:"none", marginBottom:8 }}>
                <Icon d='<path d="M6 9H4.5a2.5 2.5 0 010-5H6"/><path d="M18 9h1.5a2.5 2.5 0 000-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0012 0V2z"/>' size={16} style={{ color:"#F4F9FA" }} />
                <span style={{ flex:1, fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize:"22px", letterSpacing:"1px", color:"#F4F9FA" }}>WIN FINAL 🏆</span>
                <span style={{ fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize:"36px", color:"var(--red)", WebkitTextStroke:"0", letterSpacing:"1px" }}>+5</span>
              </div>
            </div>
          </div>

          {/* Attendance Streak */}
          <div>
            <div style={{ display:"flex", alignItems:"center", gap:10, margin:"16px 0 14px" }}>
              <div style={{ height:3, flex:1, background:"var(--ink)" }}/>
              <span style={{ fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize:"16px", letterSpacing:"3px", color:"#F4F9FA", padding:"3px 12px", border:"1px solid rgba(244,249,250,.14)", background:"var(--orange)" }}>ATTENDANCE STREAK</span>
              <div style={{ height:3, flex:1, background:"var(--ink)" }}/>
            </div>
            <div className="flex gap-1.5 mb-2">
              {[{n:1,pts:"0",lbl:"1ST"},{n:2,pts:"+1",lbl:"2ND"},{n:3,pts:"+1",lbl:"3RD"},{n:4,pts:"+3",lbl:"4TH 🔥"}].map(({n,pts,lbl}) => (
                <div key={n} style={{ flex:1, padding:"10px 6px", textAlign:"center", background: n===4?"var(--orange)":n===1?"rgba(240,233,216,.6)":"var(--cream)", border:"1px solid rgba(244,249,250,.10)", boxShadow: n===4?"none":"none", marginRight: n<4?6:0 }}>
                  <div style={{ fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize:"26px", letterSpacing:"1px", color: n===4?"var(--cream)":n===1?"rgba(11,8,20,.3)":"var(--ink)", WebkitTextStroke: n===4?"1px var(--ink)":"none" }}>{pts}</div>
                  <div style={{ fontFamily:"'Archivo',sans-serif", fontWeight:900, fontSize:"9px", letterSpacing:".14em", textTransform:"uppercase", color: n===4?"rgba(255,247,232,.85)":"rgba(11,8,20,.65)", marginTop:3 }}>{lbl}</div>
                </div>
              ))}
            </div>
            <div className="text-[11px] text-stone-500 italic px-1">Builds from 2nd session in a row · Max +5 · Miss a session ▶ streak resets</div>
          </div>

          {/* Comeback Bonus */}
          <div style={{ padding:"14px 16px", background:"rgba(20,24,36,.85)", border:"1px solid rgba(244,249,250,.10)", boxShadow:"none" }}>
            <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:8 }}>
              <span style={{ fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize:"20px", flexShrink:0 }}>↩️</span>
              <span style={{ fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize:"22px", letterSpacing:"1px", color:"#F4F9FA" }}>COMEBACK BONUS</span>
              <span style={{ marginLeft:"auto", fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize:"28px", color:"var(--blue)", WebkitTextStroke:"0", letterSpacing:"1px" }}>+2</span>
            </div>
            <div style={{ fontSize:"14px", fontWeight:700, color:"#8A9BA8", lineHeight:1.4 }}>Missed <b style={{color:"#F4F9FA"}}>2+ sessions in a row</b>? Show up again and earn a one-time +2 for coming back.</div>
          </div>

          {/* Double Points */}
          <div style={{ padding:"14px 16px", background:"rgba(20,24,36,.85)", border:"1px solid rgba(244,249,250,.10)", boxShadow:"none" }}>
            <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:8 }}>
              <div style={{ padding:"4px 12px 2px", background:"var(--red)", border:"1px solid rgba(244,249,250,.14)", fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize:"22px", letterSpacing:"1px", color:"var(--cream)", flexShrink:0 }}>2X</div>
              <span style={{ fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize:"22px", letterSpacing:"1px", color:"#F4F9FA" }}>LAST TWO SESSIONS</span>
            </div>
            <div style={{ fontSize:"14px", fontWeight:700, color:"#8A9BA8", lineHeight:1.4 }}>All points doubled — wins, knockouts, top of group. <b style={{color:"var(--red)"}}>Streak bonus NOT doubled</b> (stays max +5).</div>
          </div>

          {/* Loyalty Lockout */}
          <div style={{ padding:"14px 16px", background:"rgba(20,24,36,.85)", border:"1px solid rgba(244,249,250,.10)", boxShadow:"none" }}>
            <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:8 }}>
              <I.lock size={16} style={{ color:"var(--red)", flexShrink:0 }} />
              <span style={{ fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize:"22px", letterSpacing:"1px", color:"var(--red)" }}>LOYALTY LOCKOUT 🔒</span>
            </div>
            <div style={{ fontSize:"14px", fontWeight:700, color:"#8A9BA8", lineHeight:1.4 }}>Win the session final with a partner ▶ you <b style={{color:"var(--red)"}}>cannot pair with them again</b> for the rest of the series.</div>
          </div>
        </div>}
      </div>

    </div>
  );
}

function PlayersView({ state, update, setOpenPlayerId, isAdmin }) {
  const [search, setSearch] = useState("");
  const [showAdd, setShowAdd] = useState(false);
  const [showBulk, setShowBulk] = useState(false);
  const [editPlayer, setEditPlayer] = useState(null);
  const filtered = state.players.filter(p => !search || p.name.toLowerCase().includes(search.toLowerCase())).slice().sort((a, b) => a.name.localeCompare(b.name));
  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between">
        <h2 className="font-display text-3xl text-stone-100">PLAYERS</h2>
        {isAdmin && <div className="flex gap-2">
          <Btn variant="secondary" size="sm" onClick={() => setShowBulk(true)}><I.upload size={14} /> Import</Btn>
          <Btn size="sm" onClick={() => setShowAdd(true)}><I.plus size={14} /> Add</Btn>
        </div>}
      </div>
      <div className="relative">
        <I.search size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-stone-500" />
        <Input value={search} onChange={setSearch} placeholder="Search players…" className="pl-9" />
      </div>
      <div className="space-y-2">
        {filtered.length === 0 ? <Card className="p-6 text-center text-stone-500">No players match.</Card>
          : filtered.map(p => {
            const stats = calcPlayerStats(p.id, state.sessions);
            return (
              <Card key={p.id} className="p-3 flex items-center gap-3" onClick={() => isAdmin ? setEditPlayer(p) : setOpenPlayerId(p.id)}>
                <Avatar player={p} size={40} />
                <div className="flex-1 min-w-0">
                  <div className="font-semibold text-stone-100 truncate">{p.name}</div>
                  <div className="text-xs text-stone-500">{stats.stats.sessionsPlayed} sessions · {stats.stats.groupWins}W{(p.prevSeriesPoints||0) > 0 ? ` · +${p.prevSeriesPoints} prev` : ""}</div>
                </div>

function WhatsAppTeamImportModal({ onClose, state, session, leaderboard, onImport, update }) {
  const [text, setText] = useState("");
  const [step, setStep] = useState("paste");
  const [rows, setRows] = useState([]);
  const groups = getSessionGroups(session);
  const existingPairs = new Set((session.teams || []).map(t => [t.p1Id, t.p2Id].sort().join("|")));

  const buildRows = () => {
    const parsed = parseTeamsFromText(text).map(([n1, n2]) => {
      const r1 = resolvePlayerSmart(n1, state.players);
      const r2 = resolvePlayerSmart(n2, state.players);
      return {
        n1, n2,
        sel1: r1.player?.id || "", sel2: r2.player?.id || "",
        amb1: r1.ambiguous, amb2: r2.ambiguous,
        new1: !r1.player,  // no match ▶ will auto-register
        new2: !r2.player,
      };
    });
    setRows(parsed);
    setStep("review");
  };

  const setSel = (i, key, val) => setRows(rs => rs.map((r, j) => j === i ? { ...r, [key]: val } : r));
  const toggleSkip = (i) => setRows(rs => rs.map((r, j) => j === i ? { ...r, skip: !r.skip } : r));

  // "__register__" sentinel = user explicitly chose to register as new (overrides any fuzzy match)
  const isRegisterNew = (r, side) => r["sel" + side] === "__register__" || (r["new" + side] && !r["sel" + side]);
  const effectiveId = (r, side) => {
    const sel = r["sel" + side];
    if (sel === "__register__" || (!sel && r["new" + side])) return "__new__";
    return sel || "";
  };
  const status = (r) => {
    const id1 = effectiveId(r, 1), id2 = effectiveId(r, 2);
    if (!id1 || !id2) return "unmatched";
    const real1 = id1 !== "__new__" ? id1 : null;
    const real2 = id2 !== "__new__" ? id2 : null;
    if (real1 && real1 === real2) return "samepair";
    if (real1 && real2 && existingPairs.has([real1, real2].sort().join("|"))) return "dup";
    return "ok";
  };
  const importable = rows.filter(r => !r.skip && status(r) === "ok");
  const newCount = importable.filter(r => isRegisterNew(r, 1)).length + importable.filter(r => isRegisterNew(r, 2)).length;

  const handleImport = () => {
    const created = {};
    importable.forEach(r => {
      if (isRegisterNew(r, 1)) { const p = { id: uid("p"), name: r.n1, addedAt: Date.now() }; created[r.n1] = p; }
      if (isRegisterNew(r, 2)) { const p = { id: uid("p"), name: r.n2, addedAt: Date.now() }; created[r.n2] = p; }
    });
    if (Object.keys(created).length > 0) {
      update(s => ({ ...s, players: [...s.players, ...Object.values(created)] }));
    }
    const newTeams = importable.map(r => ({
      id: uid("t"),
      p1Id: isRegisterNew(r, 1) ? created[r.n1]?.id : r.sel1,
      p2Id: isRegisterNew(r, 2) ? created[r.n2]?.id : r.sel2,
      group: groups[0],
    }));
    onImport(newTeams);
    onClose();
  };

  const sortedPlayers = useMemo(() => [...state.players].sort((a, b) => a.name.localeCompare(b.name)), [state.players]);
  const NameSelect = ({ raw, value, ambiguous, isNew, onChange }) => {
    const registerChosen = value === "__register__";
    const resolved = !isNew && value && value !== "__register__";
    const borderCls = !value && !isNew ? "border-red-500/60"
      : ambiguous && !registerChosen ? "border-amber-500/60"
      : (isNew && !value) || registerChosen ? "border-emerald-500/60"
      : "border-stone-700";
    return (
      <div className="flex-1 min-w-0">
        <div className="flex items-center gap-1">
          <div className="text-[10px] text-stone-500 truncate">"{raw}"</div>
          {(isNew && !value) || registerChosen ? <span className="text-[9px] font-bold px-1 rounded bg-emerald-500 text-white">NEW</span> : null}
        </div>
        <select value={value} onChange={e => onChange(e.target.value)}
          className={`w-full bg-stone-900 border rounded-md px-2 py-1.5 text-xs text-stone-100 ${borderCls}`}>
          <option value="">{isNew ? "— auto-register as new —" : "— pick player —"}</option>
          <option value="__register__">+ Register "{raw}" as new player</option>
          <option disabled>──────────────</option>
          {sortedPlayers.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
        </select>
      </div>
    );
  };

  return <Modal open={true} onClose={onClose} title="IMPORT TEAMS">
    <div className="space-y-3">
      {step === "paste" ? <>
        <div className="text-xs text-stone-400">Paste WA chat export or plain list. One team per line, separated by <code className="text-cyan-300">&amp;</code> or <code className="text-cyan-300">/</code>. Unknown names auto-register as new players.</div>
        <textarea value={text} onChange={e => setText(e.target.value)} rows={10}
          placeholder={"Ahmed & Khalid\nMoh / Sultan\nFaisal & Omar\n\nOR from WA export:\n31/05/2025, 10:23 - Coach: Ahmed & Khalid"}
          className="w-full bg-stone-900 border border-stone-700 rounded-lg px-3 py-2.5 text-stone-100 font-mono text-xs focus:outline-none focus:border-stone-500" />
        <div className="flex gap-2">
          <Btn variant="ghost" onClick={onClose}>Cancel</Btn>
          <Btn onClick={buildRows} disabled={!text.trim()}>Extract Teams ▶</Btn>
        </div>
      </> : <>
        <div className="text-xs text-stone-400">{rows.length} pairs · {importable.length} ready{newCount > 0 ? <span className="text-emerald-400"> · {newCount} new player{newCount>1?"s":""} will be registered</span> : null}. <span className="text-cyan-300">Amber</span> = unsure. <span className="text-red-400">Red</span> = pick manually.</div>
        <div className="space-y-2 max-h-80 overflow-y-auto pr-1">
          {rows.map((r, i) => {
            const st = status(r);
            const bg = st === "dup" ? "rgba(16,185,129,0.06)" : st === "ok" ? "var(--surface)" : "rgba(239,68,68,0.06)";
            return (
              <div key={i} className="px-2.5 py-2 rounded-lg" style={{ background: bg, border: "1px solid var(--hairline)" }}>
                <div className="flex items-center gap-2">
                  <input type="checkbox" checked={!r.skip && st !== "dup"} disabled={st === "dup"} onChange={() => toggleSkip(i)} className="accent-orange-500 shrink-0" />
                  <NameSelect raw={r.n1} value={r.sel1} ambiguous={r.amb1} isNew={r.new1} onChange={v => setSel(i, "sel1", v)} />
                  <span className="text-stone-500 shrink-0">&</span>
                  <NameSelect raw={r.n2} value={r.sel2} ambiguous={r.amb2} isNew={r.new2} onChange={v => setSel(i, "sel2", v)} />
                </div>
                {st === "dup" && <div className="text-[10px] text-emerald-500 mt-1 pl-6">Already in this session</div>}
                {st === "samepair" && <div className="text-[10px] text-red-400 mt-1 pl-6">Same player twice</div>}
                {(r.amb1 || r.amb2) && st === "ok" && <div className="text-[10px] text-cyan-300 mt-1 pl-6">Multiple possible matches — verify</div>}
              </div>
            );
          })}
        </div>
        <div className="flex gap-2 pt-1">
          <Btn variant="ghost" onClick={() => setStep("paste")}>← Back</Btn>
          <Btn onClick={handleImport} disabled={!importable.length}>Import {importable.length} + Auto-Seed</Btn>
        </div>
      </>}
    </div>
  </Modal>;
}

// ── H2H Rivals ────────────────────────────────────────────────
function calcRivals(pid, sessions) {
  const map = {};
  sessions.forEach(s => {
    const myTeam = getPlayerTeam(s, pid); if (!myTeam) return;
    const matches = [...(s.groupMatches || []),
      ...(s.bracket?.qf || []),
      ...(s.bracket?.sf || []),
      s.bracket?.final
    ].filter(Boolean);
    matches.forEach(m => {
      if (!m.winner) return;
      const isTeam1 = m.team1Id === myTeam.id;
      const isTeam2 = m.team2Id === myTeam.id;
      if (!isTeam1 && !isTeam2) return;
      const oppTeamId = isTeam1 ? m.team2Id : m.team1Id;
      const oppTeam = (s.teams || []).find(t => t.id === oppTeamId); if (!oppTeam) return;
      const opponents = [oppTeam.p1Id, oppTeam.p2Id].filter(Boolean);
      const won = teamWon(m, myTeam.id);
      opponents.forEach(oid => {
        if (!map[oid]) map[oid] = { wins: 0, losses: 0 };
        if (won) map[oid].wins++; else map[oid].losses++;
      });
    });
  });
  return Object.entries(map)
    .map(([id, r]) => ({ id, ...r, total: r.wins + r.losses }))
    .filter(r => r.total >= 1)
    .sort((a, b) => b.total - a.total)
    .slice(0, 5);
}

// ── Session Reminder ──────────────────────────────────────────
function generateReminderText(session, state, leaderboard) {
  const slots = session.signupSlots || Array(16).fill("");
  const waitlist = session.signupWaitlist || Array(3).fill("");
  const dateStr = session.date
    ? new Date(session.date + "T12:00:00").toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" })
    : "";
  const seriesName = state.seasonName || "SEPTEMBER SURGE";
  const vol = state.seasonSubtitle?.match(/VOL\.\s*\d+/i)?.[0] || "Vol. 7";
  const sessionsTotal = (state.sessions || []).length;
  const sessionsLeft = Math.max(0, 9 - sessionsTotal);
  const top5 = [...(leaderboard || [])].filter(e => e.stats.groupPlayed > 0 || e.stats.qfReached > 0).slice(0, 5);
  const rankEmoji = ["🥇","🥈","🥉","4️⃣","5️⃣"];

  let text = `🔥 *${seriesName} · ${session.name}* 🔥\n`;
  text += `_Urban Social Series · ${vol}_\n\n`;
  if (session.doublePoints) {
    text += `*⚡ DOUBLE POINTS ⚡ DOUBLE POINTS ⚡ DOUBLE POINTS*\n\n`;
  }
  text += `📍 Urban Playground\n`;
  if (dateStr) text += `🗓️ ${dateStr} · 5:30 PM\n`;
  text += `💸 7 OMR\n\n`;
  if (session.doublePoints) {
    text += `🏆 Win = 28 OMR voucher per player\n`;
    text += `🔥🔥 *EVERY POINT COUNTS TWICE — leaderboard about to FLIP* 🔥🔥\n`;
  } else {
    text += `🏆 Win = 14 OMR voucher per player\n`;
  }
  if (sessionsLeft > 0) text += `📊 ${sessionsLeft} session${sessionsLeft !== 1 ? "s" : ""} left · this is where champions are made\n`;
  if (top5.length > 0) {
    text += `\n*📈 Current Standings:*\n`;
    top5.forEach((e, i) => { text += `${rankEmoji[i]} ${e.player.name} — ${e.totalPts} pts\n`; });
  }
  // The four other generated posts all carry the link; the signup post was the
  // only one without it, and it is the post players actually act on. Sits under
  // the standings because that is the tease the link pays off.
  text += `\n🎾 Full table & your own rank: https://surge.urbanpadel.om\n`;
  text += `\nDrop name + partner below 👇\n\n`;
  slots.forEach((s, i) => { text += `${i + 1}- ${s}\n`; });
  text += `\n⏳ Waitlist\n`;
  waitlist.forEach((s, i) => { text += `${i + 1}- ${s}\n`; });
  text += `\n⚠️ *16 teams max* · first come, first served\n`;
  text += `💥 *Ride the surge.* 👑`;
  return text;
}

function generateSessionShareText(session, state, leaderboard) {
  const pName = (id) => state.players.find(p => p.id === id)?.name?.split(" ")[0] || "?";
  const tLabel = (t) => t ? `${pName(t.p1Id)} & ${pName(t.p2Id)}` : "TBD";
  const winner = session.bracket?.final?.winner
    ? (session.bracket.final.winner === "team1" ? session.teams?.find(t => t.id === session.bracket.final.team1Id) : session.teams?.find(t => t.id === session.bracket.final.team2Id))
    : null;
  const finalist = session.bracket?.final?.winner
    ? (session.bracket.final.winner === "team1" ? session.teams?.find(t => t.id === session.bracket.final.team2Id) : session.teams?.find(t => t.id === session.bracket.final.team1Id))
    : null;

  // Top scorers this session
  const sessionScores = (state.players || []).map(p => {
    const team = getPlayerTeam(session, p.id); if (!team) return null;
    const mult = session.doublePoints ? 2 : 1;
    let pts = 0;
    (session.groupMatches || []).forEach(m => {
      if ((m.team1Id !== team.id && m.team2Id !== team.id) || !m.winner) return;
      if (teamWon(m, team.id)) pts += 3 * mult;
      else { const t = m.lossType || "tiebreak"; pts += (t === "tiebreak" ? 2 : t === "competitive" ? 1 : 0) * mult; }
    });
    if (getTopOfGroup(session, team.group) === team.id) pts += 1 * mult;
    const qfM = (session.bracket?.qf || []).find(m => (m.team1Id === team.id || m.team2Id === team.id) && m.winner);
    if (qfM) pts += (1 + koMatchPts(qfM, team.id)) * mult;
    const sfM = (session.bracket?.sf || []).find(m => (m.team1Id === team.id || m.team2Id === team.id) && m.winner);
    if (sfM) pts += (2 + koMatchPts(sfM, team.id)) * mult;
    const f = session.bracket?.final;
    if (f && (f.team1Id === team.id || f.team2Id === team.id) && f.winner)
      pts += (3 + koMatchPts(f, team.id) + (teamWon(f, team.id) ? 5 : 0)) * mult;
    return { name: p.name, pts };
  }).filter(Boolean).sort((a, b) => b.pts - a.pts);

  const seriesLeader = [...leaderboard].sort((a, b) => b.totalPts - a.totalPts)[0];
  const dateStr = session.date ? new Date(session.date + "T12:00:00").toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" }) : "";

  let text = `🔥 *SEPTEMBER SURGE Vol.7 — ${session.name}*`;
  if (dateStr) text += ` (${dateStr})`;
  text += `\n`;
  if (session.doublePoints) text += `⚡ *DOUBLE POINTS NIGHT*\n`;
  text += `\n`;
  if (winner) {
    text += `🏆 *Champions:* ${tLabel(winner)}\n`;
    if (finalist) text += `🥈 *Finalists:* ${tLabel(finalist)}\n`;
    text += `\n`;
  }
  if (sessionScores.length > 0) {
    text += `📊 *Top Scorers Tonight:*\n`;
    sessionScores.slice(0, 5).forEach((e, i) => { text += `${["🥇","🥈","🥉","4️⃣","5️⃣"][i]} ${e.name} — ${e.pts} pts\n`; });
    text += `\n`;
  }
  if (seriesLeader) {
    text += `📈 *Series Leader:* ${seriesLeader.player.name} (${seriesLeader.totalPts} pts)\n`;
  }
  text += `\n🎾 https://surge.urbanpadel.om`;
  return text;
}

function PartnerDrawModal({ onClose, state, session, onAddTeams }) {
  const inSession = new Set((session.teams || []).flatMap(t => [t.p1Id, t.p2Id]));
  const available = (state.players || []).filter(p => !inSession.has(p.id));
  const [selected, setSelected] = useState([]);
  const toggle = (id) => setSelected(s => s.includes(id) ? s.filter(x => x !== id) : [...s, id]);
  const toggleAll = () => setSelected(selected.length === available.length ? [] : available.map(p => p.id));

  const draw = () => {
    const pool = [...selected].sort(() => Math.random() - 0.5);
    if (pool.length < 2) return;
    const groups = getSessionGroups(session);
    const teams = [];
    for (let i = 0; i + 1 < pool.length; i += 2) {
      teams.push({ id: uid("t"), name: "", p1Id: pool[i], p2Id: pool[i + 1], group: groups[Math.floor(i / 2) % groups.length] });
    }
    onAddTeams(teams);
    onClose();
  };

  return <Modal open={true} onClose={onClose} title="PARTNER DRAW">
    <div className="space-y-3">
      <div className="text-xs text-stone-400">Select players entering the draw — pairs will be random. Odd player out is skipped.</div>
      <div className="flex items-center justify-between">
        <div className="text-xs text-stone-500">{selected.length} selected</div>
        <button onClick={toggleAll} className="text-xs text-orange-400 font-semibold">{selected.length === available.length ? "Clear all" : "Select all"}</button>
      </div>
      <div className="max-h-64 overflow-y-auto space-y-1">
        {available.length === 0
          ? <div className="text-xs text-stone-500 text-center py-4">All players already in session</div>
          : available.map(p => (
            <button key={p.id} onClick={() => toggle(p.id)}
              className={`w-full text-left px-3 py-2 rounded-lg text-sm font-semibold transition-all ${selected.includes(p.id) ? "bg-orange-500/20 text-orange-300 border border-orange-500/40" : "bg-stone-900 text-stone-300 border border-transparent"}`}>
              {p.name}
            </button>
          ))}
      </div>
      {selected.length % 2 !== 0 && selected.length > 0 && <div className="text-[11px] text-cyan-300">Odd number — one player will be left out of draw</div>}
      <div className="flex gap-2 pt-1">
        <Btn variant="ghost" onClick={onClose}>Cancel</Btn>
        <Btn className="flex-1" onClick={draw} disabled={selected.length < 2}>🎲 Draw {Math.floor(selected.length / 2)} Pairs</Btn>
      </div>
    </div>
  </Modal>;
}

          <div style={{ height:"100%", width:`${(filledSlots/MAX_TEAMS)*100}%`, background: isFull ? "#ef4444" : "linear-gradient(90deg, var(--orange), var(--red))", transition:"width .3s" }} />

      {/* 16 team slots */}

  );

function MvpVoteTab({ session, state, updateSession, isAdmin, canScore }) {
  const [voterPick, setVoterPick] = useState("");
  const [pick, setPick] = useState("");
  const [justVoted, setJustVoted] = useState("");
  const [showTally, setShowTally] = useState(false);
  const [blocked, setBlocked] = useState(false);

  const eligible = (session.teams || []).flatMap(t => [t.p1Id, t.p2Id]).filter(Boolean).filter((v, i, a) => a.indexOf(v) === i)
    .map(pid => state.players.find(p => p.id === pid)).filter(Boolean)
    .sort((a, b) => a.name.localeCompare(b.name));
  const votable = eligible.filter(p => p.id !== voterPick);

  const votedIds = session.mvpVotedIds || [];
  const alreadyVoted = voterPick && votedIds.includes(voterPick);

  const votes = session.mvpVotes || {};
  const totalVotes = Object.values(votes).reduce((a, b) => a + b, 0);
  const tally = Object.entries(votes)
    .map(([id, count]) => ({ id, count, player: state.players.find(p => p.id === id) }))
    .filter(t => t.player)
    .sort((a, b) => b.count - a.count);
  const mvpPlayer = state.players.find(p => p.id === session.mvpId);

  const startVoting = () => updateSession(s => ({ ...s, mvpVotingOpen: true, mvpVotes: {}, mvpVotedIds: [] }));
  const chooseVoter = (pid) => {
    setVoterPick(pid);
    if (pick === pid) setPick("");
    setBlocked(false);
  };
  const castVote = () => {
    if (!pick || !voterPick) return;
    if ((session.mvpVotedIds || []).includes(voterPick)) { setBlocked(true); return; }
    const name = state.players.find(p => p.id === pick)?.name || "";
    updateSession(s => {
      const v = { ...(s.mvpVotes || {}) };
      v[pick] = (v[pick] || 0) + 1;
      const votedIds = [...(s.mvpVotedIds || []), voterPick];
      return { ...s, mvpVotes: v, mvpVotedIds: votedIds };
    });
    setJustVoted(name);
    setVoterPick("");
    setPick("");
    setTimeout(() => setJustVoted(""), 1800);
  };
  const crownWinner = () => {
    if (tally.length === 0) return;
    updateSession(s => ({ ...s, mvpId: tally[0].id, mvpVotingOpen: false }));
    setShowTally(false);
  };
  const closeVoting = () => updateSession(s => ({ ...s, mvpVotingOpen: false }));
  const reopenVoting = () => updateSession(s => ({ ...s, mvpVotingOpen: true }));
  const resetVotes = () => updateSession(s => ({ ...s, mvpVotes: {}, mvpVotedIds: [] }));

  return (
    <div className="space-y-4">
      <div className="jh-panel jh-fill-yellow" style={{ transform:"none" }}>
        <div style={{ padding: "16px 14px 20px", position: "relative", zIndex: 2 }}>
          <div className="aa-kicker">🗳️ MVP VOTE!</div>

          {!session.mvpVotingOpen && !session.mvpId && (
            <div style={{ background:"rgba(20,24,36,.85)", border: "1px solid rgba(244,249,250,.10)", boxShadow: "none", padding: "22px 18px", textAlign: "center" }}>
              <div style={{ fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize: 22, color:"#F4F9FA", marginBottom: 10 }}>VOTING HASN'T STARTED</div>
              {canScore
                ? <>
                    <div style={{ fontSize: 13, fontWeight: 700, color:"#8A9BA8", marginBottom: 14 }}>Hand the device around the courts once you open voting.</div>
                    <button className="jh-chipbtn red" style={{ fontSize: 20, width: "100%", justifyContent: "center" }} onClick={startVoting}>▶ START VOTING</button>
                  </>
                : <div style={{ fontSize: 13, fontWeight: 700, color:"#8A9BA8" }}>Ask the scorer to open MVP voting.</div>
              }
            </div>
          )}

          {session.mvpVotingOpen && (
            <div style={{ background:"rgba(20,24,36,.85)", border: "1px solid rgba(244,249,250,.10)", boxShadow: "none", padding: "22px 18px", textAlign: "center", position: "relative" }}>
              {justVoted ? (
                <div style={{ padding: "20px 0" }}>
                  <div style={{ fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize: 30, color: "#3FA33C" }}>🎉 VOTE LOCKED!</div>
                  <div style={{ fontSize: 15, fontWeight: 700, color:"#F4F9FA", marginTop: 6 }}>Thanks for repping <b>{justVoted}</b></div>
                  <div style={{ fontSize: 11, fontWeight: 700, color:"#8A9BA8", marginTop: 10, textTransform: "uppercase", letterSpacing: 1 }}>Pass it to the next voter ▶</div>
                </div>
              ) : (
                <>
                  <div style={{ fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize: 13, letterSpacing: 1, color:"#8A9BA8", marginBottom: 6, textTransform: "uppercase", fontWeight: 700 }}>Step 1</div>
                  <div style={{ fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize: 22, color:"#F4F9FA", marginBottom: 10 }}>WHO ARE YOU?</div>
                  <select value={voterPick} onChange={e => chooseVoter(e.target.value)}
                    style={{ width: "100%", background: "#fff", border: "1px solid rgba(244,249,250,.10)", padding: "14px 12px", fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize: 20, color:"#F4F9FA", marginBottom: 14 }}>
                    <option value="">— Select your name —</option>
                    {eligible.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                  </select>

                  {voterPick && alreadyVoted && (
                    <div style={{ background: "#FF9E1B", border: "1px solid rgba(244,249,250,.10)", padding: "14px", marginBottom: 14, fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize: 17, color:"#F4F9FA" }}>
                      🚫 {state.players.find(p => p.id === voterPick)?.name} already voted tonight!
                    </div>
                  )}

                  {voterPick && !alreadyVoted && (
                    <>
                      <div style={{ fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize: 13, letterSpacing: 1, color:"#8A9BA8", marginBottom: 6, textTransform: "uppercase", fontWeight: 700 }}>Step 2</div>
                      <div style={{ fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize: 22, color:"#F4F9FA", marginBottom: 10 }}>WHO'S YOUR MVP?</div>
                      <select value={pick} onChange={e => setPick(e.target.value)}
                        style={{ width: "100%", background: "#fff", border: "1px solid rgba(244,249,250,.10)", padding: "14px 12px", fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize: 20, color:"#F4F9FA", marginBottom: 14 }}>
                        <option value="">— Select a player —</option>
                        {votable.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                      </select>
                      <button className="jh-chipbtn red" disabled={!pick} style={{ fontSize: 22, width: "100%", justifyContent: "center", opacity: pick ? 1 : 0.4, cursor: pick ? "pointer" : "default" }} onClick={castVote}>VOTE! 🔥</button>
                    </>
                  )}
                </>
              )}
              <div style={{ marginTop: 16, fontSize: 11, fontWeight: 700, color:"#8A9BA8", textTransform: "uppercase", letterSpacing: 1 }}>{totalVotes} vote{totalVotes !== 1 ? "s" : ""} cast tonight</div>
            </div>
          )}

          {!session.mvpVotingOpen && session.mvpId && mvpPlayer && (
            <div style={{ background:"rgba(255,158,27,.14)", border: "1px solid rgba(244,249,250,.10)", boxShadow: "none", padding: "24px 18px", textAlign: "center" }}>
              <div style={{ display: "flex", justifyContent: "center", marginBottom: 8 }}><CIc.crown size={40} /></div>
              <div style={{ fontSize: 11, fontWeight: 900, letterSpacing: 2, color:"#F4F9FA", textTransform: "uppercase" }}>MVP of the Night</div>
              <div style={{ fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize: 40, color:"#F4F9FA", marginTop: 4 }}>{mvpPlayer.name}</div>
              {canScore && <button className="jh-chipbtn" style={{ marginTop: 14 }} onClick={reopenVoting}>🔄 Reopen Voting</button>}
            </div>
          )}

          {canScore && session.mvpVotingOpen && (
            <div style={{ marginTop: 14 }}>
              <button className="jh-chipbtn" onClick={() => setShowTally(v => !v)}>{showTally ? "🙈 Hide Tally" : "📊 View Tally"}</button>
              {showTally && (
                <div style={{ marginTop: 10 }}>
                  {tally.length === 0
                    ? <div style={{ fontSize: 13, color:"#8A9BA8", fontWeight: 700, padding: "10px 4px" }}>No votes yet.</div>
                    : tally.map((t, i) => (
                      <div key={t.id} className="jh-mock-row" style={{ transform: `rotate(${i % 2 ? ".4" : "-.4"}deg)` }}>
                        <div className="jh-mock-rank" style={{ background: i === 0 ? "var(--blue)" : "var(--cream)" }}>{i + 1}</div>
                        <div style={{ flex: 1, fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize: 20, color:"#F4F9FA" }}>{t.player.name}</div>
                        <div style={{ fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize: 28, color: "#00E5FF", WebkitTextStroke:"0" }}>{t.count}</div>
                      </div>
                    ))
                  }
                  <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
                    <button className="jh-chipbtn red" style={{ flex: 1, justifyContent: "center" }} disabled={tally.length === 0} onClick={crownWinner}><CIc.crown size={14} /> Crown Winner</button>
                    <button className="jh-chipbtn" onClick={closeVoting}>⏹ Close</button>
                    <button className="jh-chipbtn" onClick={resetVotes}>🔄 Reset</button>
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function TeamsTab({ session, state, updateSession, update, isAdmin, leaderboard }) {
  const [showAdd, setShowAdd] = useState(false);
  const [showImport, setShowImport] = useState(false);
  const [showSeedModal, setShowSeedModal] = useState(false);
  const [edit, setEdit] = useState(null);
  const teams = session.teams || [];
  const groups = getSessionGroups(session);
  const maxTeams = groups.length * 4;
  const byGroup = groups.reduce((a, g) => (a[g] = teams.filter(t => t.group === g), a), {});

  // manualSeeds: ordered array of teamIds (index 0 = seed 1)
  const manualSeeds = session.manualSeeds || null;

  const lifetimeSorted = [...(leaderboard || [])].sort((a, b) => b.lifetimePts - a.lifetimePts);
  const rankOf = (pid) => { const idx = lifetimeSorted.findIndex(e => e.player.id === pid); return idx === -1 ? 999 : idx; };
  const autoRanked = [...teams].sort((a, b) => (rankOf(a.p1Id) + rankOf(a.p2Id)) - (rankOf(b.p1Id) + rankOf(b.p2Id)));

  // Effective seed order: manual if set, else auto
  const seedOrder = manualSeeds
    ? manualSeeds.map(id => teams.find(t => t.id === id)).filter(Boolean).concat(teams.filter(t => !manualSeeds.includes(t.id)))
    : autoRanked;

  const getSeedNum = (tid) => { const i = seedOrder.findIndex(t => t.id === tid); return i < 8 ? i + 1 : null; };

  const serpentineFromOrder = (ordered, allTeams) => {
    // teams not in ordered go at end
    const sorted = [...ordered, ...allTeams.filter(t => !ordered.find(o => o.id === t.id))];
    const assign = [];
    let dir = 1, gi = 0;
    for (let i = 0; i < sorted.length; i++) {
      assign.push(groups[gi]);
      gi += dir;
      if (gi >= groups.length) { gi = groups.length - 1; dir = -1; }
      else if (gi < 0) { gi = 0; dir = 1; }
    }
    return sorted.map((t, i) => ({ ...t, group: assign[i] }));
  };

  const autoSeedGroups = () => {
    if (teams.length === 0) return;
    const seeded = serpentineFromOrder(seedOrder, teams);
    updateSession(s => ({ ...s, teams: s.teams.map(t => { const u = seeded.find(r => r.id === t.id); return u ? { ...t, group: u.group } : t; }) }));
  };

  const handleImport = (newTeams) => {
    updateSession(s => {
      const all = [...(s.teams || []), ...newTeams];
      const order = manualSeeds
        ? manualSeeds.map(id => all.find(t => t.id === id)).filter(Boolean).concat(all.filter(t => !manualSeeds.includes(t.id)))
        : [...all].sort((a, b) => (rankOf(a.p1Id) + rankOf(a.p2Id)) - (rankOf(b.p1Id) + rankOf(b.p2Id)));
      const seeded = serpentineFromOrder(order, all);
      return { ...s, teams: seeded };
    });
  };

  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between flex-wrap gap-2">
        <div><div className="text-stone-200 font-semibold">{teams.length} / {maxTeams} teams</div>{isAdmin && <div className="text-xs text-stone-500">Tap team to edit · {groups.length} groups</div>}</div>
        {isAdmin && <div className="flex gap-2 flex-wrap">
          {teams.length > 0 && <Btn size="sm" variant="secondary" onClick={() => setShowSeedModal(true)}><I.shield size={14} /> Seeds</Btn>}
          {teams.length > 0 && <Btn size="sm" variant="secondary" onClick={autoSeedGroups}><I.bolt size={14} /> Re-Seed</Btn>}
          <Btn size="sm" variant="secondary" onClick={() => setShowImport(true)}><I.users size={14} /> Import</Btn>
          <Btn size="sm" onClick={() => setShowAdd(true)} disabled={teams.length >= maxTeams}><I.plus size={14} /> Add</Btn>
        </div>}
      </div>
      {groups.map(g => (
        <Card key={g} className="p-3">
          <div className="flex items-center justify-between mb-2">
            <div className="flex items-center gap-2">
              <div style={{ width:32, height:32, display:"flex", alignItems:"center", justifyContent:"center", background:"rgba(255,158,27,.14)", border:"1px solid rgba(244,249,250,.14)", boxShadow:"none", fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize:"20px", letterSpacing:"1px", color:"#F4F9FA" }}>{g}</div>
              <span style={{fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900",fontSize:20,letterSpacing:1,color:"#F4F9FA"}}>GROUP {g}</span>
            </div>
            <span className="text-xs text-stone-500 font-mono">{byGroup[g].length} / 4</span>
          </div>
          {byGroup[g].length === 0 ? <div className="text-xs text-stone-600 italic px-2 py-3 text-center border border-dashed border-stone-800 rounded-lg">Empty</div>
            : <div className="space-y-1">{byGroup[g].map(t => {
              const p1 = state.players.find(p => p.id === t.p1Id);
              const p2 = state.players.find(p => p.id === t.p2Id);
              const seed = getSeedNum(t.id);
              return <button key={t.id} onClick={() => isAdmin && setEdit(t)} className="w-full flex items-center gap-2 p-2 rounded-lg bg-stone-900/50 hover:bg-stone-800/70 text-left">
                {seed ? <span className="text-[9px] font-bold px-1.5 py-0.5 rounded font-mono shrink-0 text-center" style={{ background: seed <= 4 ? "#00E5FF" : "rgba(244,249,250,.08)", color: seed <= 4 ? "#F4F9FA" : "#8A9BA8", border: "1px solid rgba(244,249,250,.14)", borderRadius: 0, minWidth: 28 }}>S{seed}</span> : <span className="shrink-0" style={{ width: 28 }} aria-hidden="true" />}
                <div className="flex-1 min-w-0"><div className="text-sm text-stone-100 truncate">{p1?.name || "?"} & {p2?.name || "?"}</div></div>
                {isAdmin && <I.edit size={12} className="text-stone-500" />}
              </button>;
            })}</div>}
        </Card>
      ))}
      {showAdd && <TeamFormModal title="ADD TEAM" state={state} session={session} groups={groups} onClose={() => setShowAdd(false)} onSave={(t) => updateSession(s => ({ ...s, teams: [...(s.teams || []), { id: uid("t"), ...t }] }))} />}
      {edit && <TeamFormModal title="EDIT TEAM" state={state} session={session} groups={groups} initial={edit} onClose={() => setEdit(null)} onSave={(t) => updateSession(s => ({ ...s, teams: s.teams.map(x => x.id === edit.id ? { ...x, ...t } : x) }))} onDelete={() => updateSession(s => ({ ...s, teams: s.teams.filter(x => x.id !== edit.id) }))} />}
      {showImport && <WhatsAppTeamImportModal onClose={() => setShowImport(false)} state={state} session={session} leaderboard={leaderboard || []} onImport={handleImport} update={update} />}
      {showSeedModal && <ManualSeedModal teams={teams} seedOrder={seedOrder} state={state} onClose={() => setShowSeedModal(false)} onSave={(order) => updateSession(s => ({ ...s, manualSeeds: order.map(t => t.id) }))} />}
    </div>
  );
}

function ManualSeedModal({ teams, seedOrder, state, onClose, onSave }) {
  const [order, setOrder] = useState([...seedOrder]);
  const lbl = (t) => {
    const p1 = state.players.find(p => p.id === t.p1Id);
    const p2 = state.players.find(p => p.id === t.p2Id);
    return `${p1?.name?.split(" ")[0] || "?"} & ${p2?.name?.split(" ")[0] || "?"}`;
  };
  const move = (i, dir) => {
    const j = i + dir;
    if (j < 0 || j >= order.length) return;
    const next = [...order];
    [next[i], next[j]] = [next[j], next[i]];
    setOrder(next);
  };
  return <Modal open={true} onClose={onClose} title="SET SEEDS">
    <div className="space-y-3">
      <div className="text-xs text-stone-400">Re-Seed distributes teams by all-time lifetime points — best players spread evenly across groups (snake order).</div>
      <div className="space-y-1 max-h-80 overflow-y-auto pr-1">
        {order.map((t, i) => (
          <div key={t.id} className="flex items-center gap-2 px-2 py-1.5 rounded-lg" style={{ background: i < 8 ? (i < 4 ? "rgba(0,229,255,.08)" : "rgba(255,255,255,.03)") : "transparent", border: `1px solid ${i < 4 ? "rgba(0,229,255,.18)" : i < 8 ? "rgba(255,255,255,.06)" : "rgba(255,255,255,.03)"}` }}>
            <span className="font-mono text-xs w-5 text-center font-bold" style={{ color: i < 4 ? "var(--orange-br)" : i < 8 ? "var(--muted)" : "var(--muted2)" }}>S{i + 1}</span>
            <span className="flex-1 text-sm text-stone-200 truncate">{lbl(t)}</span>
            <div className="flex gap-1">
              <button onClick={() => move(i, -1)} disabled={i === 0} className="w-6 h-6 rounded bg-stone-800 border border-stone-700 text-stone-400 hover:text-stone-100 disabled:opacity-25 flex items-center justify-center text-xs">↑</button>
              <button onClick={() => move(i, 1)} disabled={i === order.length - 1} className="w-6 h-6 rounded bg-stone-800 border border-stone-700 text-stone-400 hover:text-stone-100 disabled:opacity-25 flex items-center justify-center text-xs">↓</button>
            </div>
          </div>
        ))}
      </div>
      <div className="flex gap-2 pt-1">
        <Btn variant="ghost" onClick={onClose} className="ml-auto">Cancel</Btn>
