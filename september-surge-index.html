function BracketTab({ session, state, updateSession, isAdmin, canScore }) {
  const [edit, setEdit] = useState(null);
  const [seedEdit, setSeedEdit] = useState(false);
  const b = session.bracket || { qf: [], sf: [], final: null };
  const teams = session.teams || [];
  const thirdPlaceMode = session.thirdPlaceMode || "best2";

  // Everything the seeding is derived from: which team is in which group, and
  // every group-stage result. Seeding that was computed from a different
  // signature is stale — a late result or a corrected score changes who
  // finished where, and therefore who should be playing whom.
  const seedInputSig = JSON.stringify({
    t: (session.teams || []).map(t => [t.id, t.group]).sort(),
    m: (session.groupMatches || []).map(m => [m.team1Id, m.team2Id, m.winner || "", m.lossType || "", m.score?.t1 ?? "", m.score?.t2 ?? ""]).sort(),
  });

  // Every seeding write goes through here so the bracket always records the
  // group results it was built from, and clears any manual override.
  const applyBracket = (bracket) =>
    updateSession(s => ({ ...s, bracket, seedSig: seedInputSig, seedManual: false }));

  // Turns the tier list from seedStandardBracket into stored QF matches.
  const qfFromTiers = (tiers) => {
    const pairing = seedStandardBracket(tiers);
    if (!pairing) return null;
    return pairing.map(p => ({
      id: uid("qf"), slot: p.slot,
      team1Id: p.a.id, team2Id: p.b.id,
      s1: p.a.seed, s2: p.b.seed, winner: null,
    }));
  };

  const seedQF = (silent = false) => {
    const groups = getSessionGroups(session);
    const qCount = getQualifyCount(session);
    // Seed off normalised standings so every team is ranked on the same number
    // of matches (smallest group − 1). Equal-size groups are unaffected.
    const standings = groups.map(g => calcGroupStandingsNormalized(session, g));
    const N = groups.length;

    if (N === 4 && thirdPlaceMode === "all4r16") {
      const winners   = standings.map((s, gi) => s[0]?.team?.id ? { id: s[0].team.id, pts: s[0].pts, wins: s[0].wins, gd: s[0].gd||0, gf: s[0].gf||0, seed: groups[gi]+"1" } : null).filter(Boolean);
      const runnersUp = standings.map((s, gi) => s[1]?.team?.id ? { id: s[1].team.id, pts: s[1].pts, wins: s[1].wins, gd: s[1].gd||0, gf: s[1].gf||0, seed: groups[gi]+"2" } : null).filter(Boolean);
      const rawThirds = standings.map((s, gi) => s[2]?.team?.id ? { id: s[2].team.id, pts: s[2].pts, wins: s[2].wins, gd: s[2].gd||0, gf: s[2].gf||0, seed: groups[gi]+"3" } : null).filter(Boolean);
      if (winners.length < 4) { if (!silent) alert("Need results for all 4 group winners first"); return; }
      if (runnersUp.length < 4) { if (!silent) alert("Need results for all 4 runners-up first"); return; }
      if (rawThirds.length < 4) { if (!silent) alert("Need results for all 4 third-place teams first"); return; }

      // Equalize for cross-group seeding: ghost BYE wins for smaller groups — does NOT change group points
      const eqWinners   = [...equalizeThirds(winners,   session)].sort(compareThirds);
      const eqRunners   = [...equalizeThirds(runnersUp, session)].sort(compareThirds);
      const eqThirds    = [...equalizeThirds(rawThirds, session)].sort(compareThirds);

      // R16: seeds 5-12 (runners-up then thirds)
      // Match 1: seed5 vs seed12, Match 2: seed6 vs seed11, Match 3: seed7 vs seed10, Match 4: seed8 vs seed9
      const r16p = [...eqRunners, ...eqThirds]; // 8 teams, indices 0–7
      const r16 = [1,2,3,4].map((slot, i) => ({
        id: uid("r16"), slot,
        team1Id: r16p[i].id,     s1: r16p[i].seed,
        team2Id: r16p[7-i].id,   s2: r16p[7-i].seed,
        winner: null
      }));

      // QF: seed1 gets bye and faces R16M4 winner (weakest), seed4 faces R16M1 winner (strongest)
      const qf = eqWinners.map((w, i) => ({
        id: uid("qf"), slot: i+1,
        team1Id: w.id,              s1: w.seed,
        team2Id: `R16_TBD_${4-i}`, s2: `R16W${4-i}`,
        winner: null, r16Slot: 4-i,
      }));

      applyBracket({ r16, qf, sf: [], final: null } );
      return;
    }

    if (N === 3) {
      // Tier 1 = winners, Tier 2 = runners-up, Tier 3 = thirds
      const tier1 = standings.map((s, gi) => s[0]?.team?.id ? { id: s[0].team.id, pts: s[0].pts, wins: s[0].wins, gd: s[0].gd || 0, gf: s[0].gf || 0, tier: 1, seed: groups[gi] + "1" } : null).filter(Boolean);
      const tier2 = standings.map((s, gi) => s[1]?.team?.id ? { id: s[1].team.id, pts: s[1].pts, wins: s[1].wins, gd: s[1].gd || 0, gf: s[1].gf || 0, tier: 2, seed: groups[gi] + "2" } : null).filter(Boolean);
      const rawThirds = standings.map((s, gi) => s[2]?.team?.id ? { id: s[2].team.id, pts: s[2].pts, wins: s[2].wins, gd: s[2].gd || 0, gf: s[2].gf || 0, tier: 3, seed: groups[gi] + "3" } : null).filter(Boolean);
      // Thirds already come from the normalised (dropped-game) standings, so every
      // team has the same match count — compare them directly, no ghost-bye padding.
      // Padel ranking for 3rds: wins ▶ game difference ▶ games scored
      const sortedThirds = [...rawThirds].sort(compareThirds);
      // Check for complete tie between 2nd and 3rd thirds (tiebreak match required)
      if (sortedThirds.length >= 3 && thirdPlaceMode === "best2" && compareThirds(sortedThirds[1], sortedThirds[2]) === 0) {
        if (!silent) alert(`Tie between ${lbl(sortedThirds[1].id)} and ${lbl(sortedThirds[2].id)} for the last 3rd-place spot!\n\nPlay a tiebreak match to determine who qualifies.`);
        return;
      }
      const t1sorted = tier1.sort(compareThirds);
      const t2sorted = tier2.sort(compareThirds);

      if (thirdPlaceMode === "playoff" && sortedThirds.length >= 3) {
        // T3A (best third) ▶ direct QF spot; T3B vs T3C play a qualifier
        const t3a = sortedThirds[0];
        const t3b = sortedThirds[1];
        const t3c = sortedThirds[2];
        // Tier 3 is [best third, playoff winner]: the known best third takes
        // seed 7, the still-undecided qualifier seed 8.
        const qf = qfFromTiers([t1sorted, t2sorted, [t3a, { id: "PLAYOFF_TBD", seed: "Q" }]]);
        if (!qf) { if (!silent) alert("Need 8 qualifiers to seed the quarterfinals"); return; }
        const thirdsPlayoff = { id: uid("tpo"), team1Id: t3b.id, team2Id: t3c.id, s1: t3b.seed, s2: t3c.seed, winner: null };
        applyBracket({ qf, sf: [], final: null, thirdsPlayoff } );
        return;
      }

      // best2 mode: top 2 thirds directly into bracket
      const best2 = sortedThirds.slice(0, 2);
      const qf = qfFromTiers([t1sorted, t2sorted, best2]);
      if (!qf) { if (!silent) alert("Not enough results — need at least 2 teams per group and some 3rd-place results"); return; }
      applyBracket({ qf, sf: [], final: null } );
      return;
    }

    if (qCount === 2 && (N === 2 || N === 4)) {
      const mkTier = (rank) => standings.map((s, i) => s[rank]?.team?.id
        ? { id: s[rank].team.id, seed: groups[i] + (rank + 1), group: groups[i], pts: s[rank].pts, wins: s[rank].wins, gd: s[rank].gd || 0, gf: s[rank].gf || 0 }
        : null);
      const winners = mkTier(0);
      const runners = mkTier(1);
      if (winners.some(w => !w) || runners.some(r => !r)) { if (!silent) alert("Need top 2 in every group first"); return; }
      if (N === 2) {
        const pairs = winners.map((w, i) => ({ a: w, b: runners[N - 1 - i] }));
        const sf = pairs.map((p, i) => ({ id: uid("sf"), slot: i + 1, team1Id: p.a.id, team2Id: p.b.id, s1: p.a.seed, s2: p.b.seed, winner: null }));
        applyBracket({ qf: [], sf, final: null } );
      } else {
        // N === 4: all four winners take seeds 1-4, all four runners-up 5-8,
        // each tier ranked by wins ▶ GD ▶ GF. 1v8 then means the strongest
        // winner draws the weakest runner-up, and 4v5 gives the best
        // runner-up the weakest winner.
        const qf = qfFromTiers([[...winners].sort(compareThirds), [...runners].sort(compareThirds)]);
        if (!qf) { if (!silent) alert("Need 8 qualifiers to seed the quarterfinals"); return; }
        applyBracket({ qf, sf: [], final: null } );
      }
      return;
    }

    if (N === 2 && qCount === 4) {
      const a = standings[0], b = standings[1];
      if (!a[3]?.team?.id || !b[3]?.team?.id) { if (!silent) alert("Need top 4 in every group first"); return; }
      const at = (s, i, g) => ({ id: s[i].team.id, seed: g + (i + 1), group: g, wins: s[i].wins, gd: s[i].gd || 0, gf: s[i].gf || 0 });
      // Four tiers of two: both group winners, then both 2nds, both 3rds, both
      // 4ths — each pair ranked against each other by wins ▶ GD ▶ GF, so seed 1
      // is the stronger of the two group winners rather than whichever is "A".
      const tiers = [0, 1, 2, 3].map(i => [at(a, i, groups[0]), at(b, i, groups[1])].sort(compareThirds));
      const qf = qfFromTiers(tiers);
      if (!qf) { if (!silent) alert("Need 8 qualifiers to seed the quarterfinals"); return; }
      applyBracket({ qf, sf: [], final: null } );
      return;
    }

    const qualifiers = [];
    standings.forEach((s, gi) => {
      for (let i = 0; i < qCount; i++) {
        if (s[i]?.team?.id) qualifiers.push({ teamId: s[i].team.id, pts: s[i].pts, wins: s[i].wins, gd: s[i].gd || 0, gf: s[i].gf || 0, groupRank: i, seed: groups[gi] + (i + 1) });
      }
    });
    if (qualifiers.length === 0) { if (!silent) alert("No qualified teams yet"); return; }
    const seeded = [...qualifiers].sort((a, b) => a.groupRank - b.groupRank || b.wins - a.wins || b.gd - a.gd || b.gf - a.gf);
    const total = seeded.length;
    if (total < 2) { if (!silent) alert("Only one team qualified — need at least 2 to make a bracket."); return; }
    if (total === 2) {
      applyBracket({ qf: [], sf: [], final: { id: uid("f"), team1Id: seeded[0].teamId, team2Id: seeded[1].teamId, s1: seeded[0].seed, s2: seeded[1].seed, winner: null } } );
    } else if (total <= 4) {
      const sf = [];
      for (let i = 0; i < Math.floor(total / 2); i++) sf.push({ id: uid("sf"), slot: i + 1, team1Id: seeded[i].teamId, team2Id: seeded[total - 1 - i].teamId, s1: seeded[i].seed, s2: seeded[total - 1 - i].seed, winner: null });
      applyBracket({ qf: [], sf, final: null } );
    } else {
      const pick = [[0,7],[3,4],[1,6],[2,5]];
      const qf = pick.map(([x, y], i) => seeded[x] && seeded[y] ? { id: uid("qf"), slot: i + 1, team1Id: seeded[x].teamId, team2Id: seeded[y].teamId, s1: seeded[x].seed, s2: seeded[y].seed, winner: null } : null).filter(Boolean);
      applyBracket({ qf, sf: [], final: null } );
    }
  };

  // Group stage complete = every group has played its full round-robin and
  // every match has a result. (A group of n plays n*(n-1)/2 matches.)
  const groupStageComplete = (() => {
    const groups = getSessionGroups(session);
    const gm = session.groupMatches || [];
    if (gm.length === 0) return false;
    let expected = 0;
    for (const g of groups) {
      const n = teams.filter(t => t.group === g).length;
      expected += (n * (n - 1)) / 2;
    }
    if (expected === 0 || gm.length < expected) return false;
    return gm.every(m => m.winner);
  })();
  const bracketEmpty = !(b.qf?.length) && !(b.sf?.length) && !b.final && !(b.r16?.length) && !b.thirdsPlayoff;

  // The knockout is "locked" as soon as any of it has been played — including
  // the thirds qualifier, whose winner takes the 8th seed. Past that point the
  // seeding is history and must never be recomputed.
  const koLocked = (b.qf || []).some(m => m.winner)
    || (b.sf || []).some(m => m.winner)
    || (b.r16 || []).some(m => m.winner)
    || !!b.final?.winner
    || !!b.thirdsPlayoff?.winner;

  // Keep the seeding in sync with the group results, instead of seeding once
  // and letting it go stale. A score entered or corrected after the bracket
  // was drawn changes who finished 1st/2nd/3rd, and therefore who should be
  // playing whom — that used to require a hand-patch to fix.
  //
  // DELIBERATELY LIMITED TO 3-GROUP SESSIONS. That format seeds 8 from 3
  // groups, so two of the three third-place teams qualify and their ranking
  // decides both the last QF seed and who plays the qualifier — the part that
  // actually moved when a late result landed. The other formats take a fixed
  // top-N per group, where a late result reorders the group but rarely changes
  // who is in, so re-seeding them is churn on a live bracket for little gain.
  //
  // Re-seeding is skipped whenever it could destroy something: once any
  // knockout match has a result (koLocked), or when an admin has deliberately
  // arranged the seeding by hand (seedManual). Silent, so a tie or an
  // incomplete group just waits for the organizer rather than popping alerts.
  const autoReseedFormat = getSessionGroups(session).length === 3;
  useEffect(() => {
    if (!canScore || !groupStageComplete) return;
    if (koLocked || session.seedManual) return;
    if (!autoReseedFormat) {
      // Other formats keep the original behaviour: seed once, never redraw.
      if (!bracketEmpty) return;
    } else if (!bracketEmpty && session.seedSig === seedInputSig) {
      return;  // already current
    }
    seedQF(true);
  }, [canScore, groupStageComplete, bracketEmpty, koLocked, autoReseedFormat, session.seedManual, session.seedSig, seedInputSig]);

  const lbl = (id) => {
    if (id === "PLAYOFF_TBD") return "Qualifier TBD";
    if (id?.startsWith?.("R16_TBD_")) return `R16 M${id.slice(8)} Winner`;
    const t = teams.find(t => t.id === id);
    if (!t) return "—";
    return `${state.players.find(p => p.id === t.p1Id)?.name?.split(" ")[0] || "?"} & ${state.players.find(p => p.id === t.p2Id)?.name?.split(" ")[0] || "?"}`;
  };

  useEffect(() => {
    // R16 ▶ QF (all4r16 mode)
    if (b.r16?.length > 0) {
      let updatedQF = [...b.qf];
      let changed = false;
      for (const r16m of b.r16) {
        if (!r16m.winner) continue;
        const winnerId = r16m.winner === "team1" ? r16m.team1Id : r16m.team2Id;
        updatedQF = updatedQF.map(qfm => {
          if (qfm.r16Slot !== r16m.slot || qfm.winner) return qfm;
          if (qfm.team2Id !== winnerId) { changed = true; return { ...qfm, team2Id: winnerId }; }
          return qfm;
        });
      }
      if (changed) updateSession(s => ({ ...s, bracket: { ...s.bracket, qf: updatedQF } }));
    }
    // Thirds playoff winner ▶ fill PLAYOFF_TBD slot in QF
    if (b.thirdsPlayoff?.winner && b.qf.some(m => m.team1Id === "PLAYOFF_TBD" || m.team2Id === "PLAYOFF_TBD")) {
      const winner = b.thirdsPlayoff.winner === "team1" ? b.thirdsPlayoff.team1Id : b.thirdsPlayoff.team2Id;
      updateSession(s => ({ ...s, bracket: { ...s.bracket, qf: s.bracket.qf.map(m => ({
        ...m,
        team1Id: m.team1Id === "PLAYOFF_TBD" ? winner : m.team1Id,
        team2Id: m.team2Id === "PLAYOFF_TBD" ? winner : m.team2Id,
      })) } }));
    }
    // QF ▶ SF
    const qfWinners = b.qf.filter(m => m.winner && m.team1Id !== "PLAYOFF_TBD" && m.team2Id !== "PLAYOFF_TBD").map(m => m.winner === "team1" ? m.team1Id : m.team2Id);
    if (qfWinners.length === 4 && (b.sf?.length || 0) < 2) {
      updateSession(s => ({ ...s, bracket: { ...s.bracket, sf: [
        { id: uid("sf"), slot: 1, team1Id: qfWinners[0], team2Id: qfWinners[1], winner: null },
        { id: uid("sf"), slot: 2, team1Id: qfWinners[2], team2Id: qfWinners[3], winner: null },
      ] } }));
    }
    // SF ▶ Final
    const sfWinners = (b.sf || []).filter(m => m.winner).map(m => m.winner === "team1" ? m.team1Id : m.team2Id);
    if (sfWinners.length === 2 && !b.final) {
      updateSession(s => ({ ...s, bracket: { ...s.bracket, final: { id: uid("f"), team1Id: sfWinners[0], team2Id: sfWinners[1], winner: null } } }));
    }
  }, [JSON.stringify(b)]);

  // ── Qualify-per-group setting (editable here; re-seeds on change) ──
  const numGroups = getSessionGroups(session).length;
  const currentQC = getQualifyCount(session);
  const qcOptions = numGroups === 2 ? [1, 2, 4] : [1, 2];
  const reseedGuard = () => !(koLocked && !confirm("Changing knockout qualification re-seeds the bracket and clears the current knockout results. Continue?"));
  const changeQualify = (q) => {
    if (q === currentQC) return;
    if (!reseedGuard()) return;
    autoSeededRef.current = null;  // let the auto-seed re-fire with the new count
    updateSession(s => ({ ...s, qualifyCount: q, bracket: { qf: [], sf: [], final: null } }));
  };
  const changeThirdMode = (mode) => {
    if (mode === thirdPlaceMode) return;
    if (!reseedGuard()) return;
    autoSeededRef.current = null;
    updateSession(s => ({ ...s, thirdPlaceMode: mode, bracket: { qf: [], sf: [], final: null } }));
  };
  // 3-group format has a FIXED qualification rule: top 2 per group + 2 best
  // thirds = 8 ▶ QF (qualifyCount doesn't apply). Show the rule instead of the
  // misleading "Top N per group" buttons, and let the admin choose how the last
  // third-place spot is decided (best-2 by points, or a 3rds playoff).
  const QualifyControl = () => !canScore ? null : (
    <Card className="p-3">
      {numGroups === 3 ? (
        <div className="space-y-2.5">
          <div>
            <div className="text-[10px] text-stone-500 uppercase tracking-wider font-semibold">Knockout qualification · 3 groups</div>
            <div className="text-[11px] text-stone-400 mt-0.5">Top 2 per group + 2 best thirds ▶ <span className="text-stone-200 font-semibold">8 teams ▶ quarterfinals</span></div>
          </div>
          <div className="flex items-center justify-between gap-3 flex-wrap">
            <div className="text-[10px] text-stone-500 uppercase tracking-wider font-semibold">Last 3rd-place spot</div>
            <div className="flex gap-1.5">
              {[["best2", "Best 2 thirds"], ["playoff", "3rds playoff"]].map(([m, label]) => <button key={m} type="button" onClick={() => changeThirdMode(m)} className="px-3 py-1.5 rounded-lg text-xs font-bold border-2 active:scale-95" style={m === thirdPlaceMode ? { background: "#ea580c", color: "#fff", borderColor: "rgba(0,229,255,.5)" } : { background: "transparent", color: "#a8a29e", borderColor: "#44403c" }}>{label}</button>)}
            </div>
          </div>
        </div>
      ) : (
        <div className="flex items-center justify-between gap-3 flex-wrap">
          <div>
            <div className="text-[10px] text-stone-500 uppercase tracking-wider font-semibold">Qualify per group</div>
            <div className="text-[11px] text-stone-600 mt-0.5">{numGroups * currentQC} teams{numGroups * currentQC >= 4 ? " ▶ quarterfinals" : ""} · changing re-seeds</div>
          </div>
          <div className="flex gap-1.5">
            {qcOptions.map(q => <button key={q} type="button" onClick={() => changeQualify(q)} className="px-3.5 py-1.5 rounded-lg text-sm font-bold border-2 active:scale-95" style={q === currentQC ? { background: "#ea580c", color: "#fff", borderColor: "rgba(0,229,255,.5)" } : { background: "transparent", color: "#a8a29e", borderColor: "#44403c" }}>Top {q}</button>)}
          </div>
        </div>
      )}
    </Card>
  );

  if (bracketEmpty) {
    return <div className="space-y-3">
      <QualifyControl />
      <Card className="p-6 text-center border-dashed">
        <I.swords className="mx-auto mb-3 text-stone-600" size={36} />
        <div className="text-stone-300 font-semibold mb-1">No bracket yet</div>
        {canScore && <>
          <div className="text-stone-500 text-sm mb-4">The knockout seeds automatically once every group match is in — or seed now from current standings.</div>
          <Btn onClick={() => seedQF()}><I.bolt size={14} /> Auto-Seed</Btn>
        </>}
      </Card>
    </div>;
  }

  const champId = b.final?.winner ? (b.final.winner === "team1" ? b.final.team1Id : b.final.team2Id) : null;

  return (
    <div className="space-y-4">
      <QualifyControl />
      {(() => {
        // Transparency panel: every qualified team with its OVERALL seed (1..8),
        // its actual group + placement, and why it's ranked there — all computed
        // live from current standings so it stays correct even if a team was
        // moved between groups after the bracket was seeded.
        const standCache = {};
        const rankOf = (id) => {
          const t = (session.teams || []).find(x => x.id === id); if (!t) return null;
          const g = t.group; if (!standCache[g]) standCache[g] = calcGroupStandings(session, g);
          const i = standCache[g].findIndex(r => r.team.id === id);
          return i < 0 ? null : { g, rank: i + 1 };
        };
        // Overall seed from the actual QF pairing (standard 8-seed bracket:
        // slot1 = 1v8, slot2 = 4v5, slot3 = 3v6, slot4 = 2v7).
        const seedByTeam = {};
        const slotSeeds = { 1: [1, 8], 2: [4, 5], 3: [3, 6], 4: [2, 7] };
        const std8 = (b.qf || []).length === 4 && !(b.r16 && b.r16.length);
        if (std8) (b.qf || []).forEach((m, idx) => { const pr = slotSeeds[idx + 1]; if (pr) { if (m.team1Id) seedByTeam[m.team1Id] = pr[0]; if (m.team2Id) seedByTeam[m.team2Id] = pr[1]; } });
        const seen = new Set(); const rows = [];
        const collect = (m) => { if (!m) return; ["team1Id", "team2Id"].forEach(tk => {
          const id = m[tk];
          if (id && !String(id).includes("TBD") && !seen.has(id)) { const r = rankOf(id); if (r) { seen.add(id); rows.push({ id, g: r.g, rank: r.rank, seed: seedByTeam[id] || null }); } }
        }); };
        (b.qf || []).forEach(collect); (b.r16 || []).forEach(collect); collect(b.thirdsPlayoff);
        if (!rows.length) return null;
        const ord = (n) => n === 1 ? "1st" : n === 2 ? "2nd" : n === 3 ? "3rd" : `${n}th`;
        const why = (rk) => rk === 1 ? "Group winner" : rk === 2 ? "Runner-up" : rk === 3 ? "Best 3rd" : `${ord(rk)} place`;
        rows.sort((a, c) => (a.seed || 99) - (c.seed || 99) || a.rank - c.rank || a.g.localeCompare(c.g));
        const top = rows.find(r => r.seed === 1);
        return <Card className="p-3">
          <div className="flex items-center justify-between mb-1">
            <h3 className="jh-round-title" style={{ fontSize: 18 }}>SEEDING · WHO QUALIFIED</h3>
            <span className="text-[10px] text-stone-500 font-bold uppercase tracking-wider">{rows.length} teams</span>
          </div>
          <div className="text-[10px] text-stone-500 mb-2 leading-snug">
            Seeded by group finish — winners (1–3), runners-up (4–6), then the 2 best thirds (7–8); ranked by wins, then game difference.
            {top && <> Top seed plays the lowest (1 v 8). <span className="text-cyan-300 font-bold">#1 seed: {lbl(top.id)}.</span></>}
          </div>
          <div className="space-y-1">{rows.map(r => (
            <div key={r.id} className="flex items-center gap-2 px-2 py-1.5 rounded-md" style={{ background: r.seed === 1 ? "rgba(255,158,27,.13)" : "rgba(19,19,19,.06)", border: r.seed === 1 ? "2px solid #0A0F14" : "2px solid transparent" }}>
              {r.seed
                ? <span className="font-mono text-xs font-bold flex items-center justify-center shrink-0" style={{ width: 22, height: 22, background: r.seed === 1 ? "#00E5FF" : "#0A0F14", color: "#F4F9FA", border: "1px solid rgba(244,249,250,.14)" }}>{r.seed}</span>
                : <span style={{ width: 22 }} className="shrink-0" />}
              <SeedBadge seed={r.g + r.rank} />
              <span className="flex-1 text-xs text-stone-200 truncate font-semibold">{lbl(r.id)}</span>
              <span className="text-[10px] text-stone-400 font-mono uppercase tracking-wide">{why(r.rank)}</span>
            </div>
          ))}</div>
        </Card>;
      })()}
      {champId && <div style={{ background:"var(--blue)", border:"1px solid rgba(244,249,250,.10)", boxShadow:"none", padding:"20px", textAlign:"center", marginBottom:16 }}>
        <I.crown size={32} style={{ color:"#F4F9FA", margin:"0 auto 8px" }} />
        <div style={{ fontWeight:900, fontSize:"11px", letterSpacing:".22em", textTransform:"uppercase", color:"#F4F9FA", marginBottom:4 }}>Champion</div>
        <div style={{ fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize:"36px", letterSpacing:"1.5px", color:"#F4F9FA" }}>{lbl(champId)}</div>
      </div>}

      {/* R16 round (all4r16 mode) */}
      {b.r16?.length > 0 && (
        <Card className="p-3" style={{ borderColor: "rgba(167,139,250,0.35)" }}>
          <div className="flex items-center justify-between mb-2">
            <h3 className="jh-round-title" style={{fontSize:20}}>ROUND OF 16</h3>
            <span className="text-[10px] font-bold uppercase tracking-wider" style={{ color: "#1467A8" }}>All thirds qualify</span>
          </div>
          <div className="space-y-1.5">
            {b.r16.map(m => (
              <BracketRow key={m.id} match={m} lbl={lbl}
                onClick={() => canScore && setEdit({ ...m, round: "r16" })} />
            ))}
          </div>
        </Card>
      )}

      {/* Thirds qualifier (playoff mode) */}
      {b.thirdsPlayoff && !b.thirdsPlayoff.winner && (
        <Card className="p-3" style={{ borderColor: "rgba(167,139,250,0.35)" }}>
          <div className="flex items-center justify-between mb-2">
            <h3 className="jh-round-title" style={{fontSize:20}}>3RDS QUALIFIER</h3>
            <span className="text-[10px] font-bold uppercase tracking-wider" style={{ color: "#1467A8" }}>For 8th QF spot</span>
          </div>
          <BracketRow match={b.thirdsPlayoff} lbl={lbl} onClick={() => canScore && setEdit({ ...b.thirdsPlayoff, round: "thirdsPlayoff" })} />
        </Card>
      )}

      {/* Bracket tree (4 QF) or fallback list */}
      {isAdmin && b.qf.length === 4 && !(b.r16?.length) && (
        koLocked
          ? <div className="text-[10px] text-stone-500 flex items-center gap-1 px-1"><I.alert size={10} /> Seeding is locked — a score is already recorded.</div>
          : <div className="flex items-center justify-between gap-2 flex-wrap">
              <div className="text-[10px] text-stone-500 flex items-center gap-1">
                {session.seedManual
                  ? <><I.alert size={10} /> Seeded by hand — it won't follow group-result changes. Re-seed to resume auto.</>
                  : autoReseedFormat
                  ? <>Seeding follows the group results automatically until a knockout score is entered.</>
                  : <>Seeded from the final group standings. Edit a group result and re-seed to redraw.</>}
              </div>
              <div className="flex gap-1.5">
                {session.seedManual && <Btn variant="ghost" onClick={() => seedQF()}><I.bolt size={12} /> Re-seed</Btn>}
                <Btn variant="secondary" onClick={() => setSeedEdit(true)}><I.swords size={12} /> Edit seeding</Btn>
              </div>
            </div>
      )}
      {b.qf.length === 4
        ? <BracketTreeView b={b} lbl={lbl} canScore={canScore} setEdit={setEdit} />
        : <>
            {b.qf?.length > 0 && <Card className="p-3">
              <div className="flex items-center justify-between mb-2"><h3 className="jh-round-title">QUARTERFINALS</h3><Pill color="orange">+1 · W+3 TB+2 L+1</Pill></div>
              {isAdmin && <div className="text-[10px] text-cyan-300 mb-2 flex items-center gap-1"><I.alert size={10} /> Tap to edit (for dropouts)</div>}
              <div className="space-y-1.5">{b.qf.map(m => <BracketRow key={m.id} match={m} lbl={lbl} onClick={() => canScore && setEdit({ ...m, round: "qf" })} />)}</div>
            </Card>}
            {b.sf?.length > 0 && <Card className="p-3">
              <div className="flex items-center justify-between mb-2"><h3 className="jh-round-title">SEMIFINALS</h3><Pill color="red">+2 · W+3 TB+2 L+1</Pill></div>
              <div className="space-y-1.5">{b.sf.map(m => <BracketRow key={m.id} match={m} lbl={lbl} onClick={() => canScore && setEdit({ ...m, round: "sf" })} />)}</div>
            </Card>}
            {b.final && <Card className="p-3" style={{ borderColor: "rgba(251, 191, 36, 0.3)" }}>
              <div className="flex items-center justify-between mb-2"><h3 className="jh-round-title" style={{textShadow:"none",display:"inline-flex",alignItems:"center",gap:6}}><svg width="18" height="18" viewBox="0 0 24 24" fill="#FF9E1B" stroke="#0A0F14" strokeWidth="1.8"><path d="M7 3h10v6a5 5 0 01-10 0z"/><path d="M7 5H4a3 3 0 003 5M17 5h3a3 3 0 01-3 5M12 14v4M8 21h8M9 18h6" fill="none"/></svg> FINAL</h3><Pill color="amber">+3 reach · +5 win · W+3 TB+2 L+1</Pill></div>
              <BracketRow match={b.final} lbl={lbl} onClick={() => canScore && setEdit({ ...b.final, round: "final" })} big />
            </Card>}
          </>
      }

      {edit && <BracketEditModal match={edit} teams={teams} state={state} isAdmin={isAdmin} onClose={() => setEdit(null)}
        onSave={(d) => updateSession(s => {
          const nb = { ...s.bracket };
          if (edit.round === "r16") nb.r16 = (nb.r16||[]).map(m => m.id === edit.id ? { ...m, ...d } : m);
          else if (edit.round === "qf") nb.qf = nb.qf.map(m => m.id === edit.id ? { ...m, ...d } : m);
          else if (edit.round === "sf") nb.sf = nb.sf.map(m => m.id === edit.id ? { ...m, ...d } : m);
          else if (edit.round === "final") nb.final = { ...nb.final, ...d };
          else if (edit.round === "thirdsPlayoff") nb.thirdsPlayoff = { ...nb.thirdsPlayoff, ...d };
          return { ...s, bracket: nb };
        })}
        onReset={() => updateSession(s => ({ ...s, bracket: { r16: s.bracket.r16, qf: s.bracket.qf, sf: [], final: null, thirdsPlayoff: s.bracket.thirdsPlayoff } }))}
      />}

      {/* A hand-arranged bracket sets seedManual, which parks the automatic
          re-seed — otherwise the next group-result edit would silently undo
          the organizer's arrangement. "Re-seed" clears it again. */}
      {seedEdit && <QFSeedingModal qf={b.qf} lbl={lbl} onClose={() => setSeedEdit(false)}
        onSave={(newQf) => { updateSession(s => ({ ...s, bracket: { ...s.bracket, qf: newQf }, seedManual: true })); setSeedEdit(false); }}
      />}
    </div>
  );
}

function BracketTreeView({ b, lbl, canScore, setEdit }) {
  const CARD_H = 66, GAP = 20, COL_W = 106, CONN_W = 26;
  const step = CARD_H + GAP;
  const qfTops = [0, 1, 2, 3].map(i => i * step);
  const qfCenters = qfTops.map(t => t + CARD_H / 2);
  const sfCenters = [(qfCenters[0] + qfCenters[1]) / 2, (qfCenters[2] + qfCenters[3]) / 2];
  const sfTops = sfCenters.map(c => c - CARD_H / 2);
  const finalCenter = (sfCenters[0] + sfCenters[1]) / 2;
  const finalTop = finalCenter - CARD_H / 2;
  const totalH = 4 * CARD_H + 3 * GAP;

  // Always show all 3 columns — use placeholders until rounds are populated
  const sfData = b.sf?.length > 0 ? b.sf : [
    { id: "sfp1", slot: 1, team1Id: null, team2Id: null, winner: null },
    { id: "sfp2", slot: 2, team1Id: null, team2Id: null, winner: null },
  ];
  const finalData = b.final || { id: "fp", team1Id: null, team2Id: null, winner: null };

  const colX = { qf: 0, sf: COL_W + CONN_W, final: 2 * (COL_W + CONN_W) };
  const totalW = colX.final + COL_W;

  const MiniCard = ({ m, round, top, left }) => {
    const w = m.winner;
    const isFinal = round === "final";
    const isEmpty = !m.team1Id && !m.team2Id;
    const hasTbd = m.team1Id === "PLAYOFF_TBD" || m.team2Id === "PLAYOFF_TBD" || m.team1Id?.startsWith?.("R16_TBD_") || m.team2Id?.startsWith?.("R16_TBD_");
    const isPlaceholder = isEmpty || hasTbd;
    const sides = [
      { key: "team1", id: m.team1Id, seed: m.s1 },
      { key: "team2", id: m.team2Id, seed: m.s2 },
    ];
    const roundLabel = { sf: "SF Winner", final: "Finalist" };
    return (
      <button
        onClick={() => canScore && !isPlaceholder && setEdit({ ...m, round })}
        style={{
          position: "absolute", top, left, width: COL_W, height: CARD_H,
          background: isEmpty ? "rgba(244,249,250,.03)" : isFinal ? "rgba(255,158,27,.09)" : "rgba(5,7,9,.72)",
          border: isEmpty ? "1px dashed rgba(244,249,250,.16)" : "1px solid rgba(244,249,250,.10)",
          borderRadius: 0,
          // the decided side carries the accent; the final is the one cyan card
          boxShadow: w ? `inset 3px 0 0 ${isFinal ? "#FF9E1B" : "#00E5FF"}` : "none",
          padding: "7px 8px", textAlign: "left",
          cursor: canScore && !isPlaceholder ? "pointer" : "default",
          display: "flex", flexDirection: "column", justifyContent: isEmpty ? "center" : "space-between",
          transition: "border-color 0.15s",
        }}
      >
        {isEmpty ? (
          <div style={{ fontSize: "10px", color:"#8A9BA8", textAlign: "center", fontStyle: "italic" }}>
            {roundLabel[round] || "TBD"}
          </div>
        ) : sides.map(({ key, id, seed }) => {
          const won = w === key;
          const lost = w && w !== key;
          return (
            <div key={key} style={{
              display: "flex", alignItems: "center", gap: "3px",
              fontSize: "11px", lineHeight: "1.3",
              color: won ? "#F4F9FA" : lost ? "#5C6675" : id ? "#C9CFDA" : "#5C6675",
              fontWeight: won ? "700" : "500",
            }}>
              {won && <I.trophy size={9} style={{ flexShrink: 0, color: "#00E5FF" }} />}
              {seed && seed !== "Q" && (
                <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: "9px",
                  fontWeight: 700, letterSpacing: ".04em", flexShrink: 0,
                  color: won ? "#00E5FF" : "#6B7484" }}>{seed}</span>
              )}
              {m.score && id && (
                <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: "10px", fontWeight: 700, fontVariantNumeric: "tabular-nums", color: won ? "#00E5FF" : "#5C6675", flexShrink: 0 }}>
                  {key === "team1" ? m.score.t1 : m.score.t2}
                </span>
              )}
              <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", flex: 1, fontStyle: id ? "normal" : "italic" }}>
                {id ? lbl(id) : "TBD"}
              </span>
            </div>
          );
        })}
      </button>
    );
  };

  const qfWon = (i) => b.qf[i]?.winner;
  const sfWon = (i) => sfData[i]?.winner;
  // the advancing path lights up: red through the QFs, cyan into the final
  const qfConnColor = (i) => qfWon(i) ? "#00E5FF" : "rgba(244,249,250,.16)";
  const sfConnColor = (i) => sfWon(i) ? "#FF9E1B" : "rgba(244,249,250,.16)";

  return (
    <div style={{ background: "rgba(16,20,32,.92)", border: "1px solid rgba(244,249,250,.10)", borderRadius: 0, overflow: "hidden" }}>
      <div className="flex items-center justify-between px-3 pt-3 pb-2">
        <h3 className="jh-round-title">BRACKET</h3>
        <div className="flex items-center gap-1.5 text-[10px] font-bold uppercase tracking-wider">
          <span style={{ color: "#00E5FF" }}>QF</span>
          <span style={{ color:"#8A9BA8" }}>▶</span>
          <span style={{ color: "#00E5FF" }}>SF</span>
          <span style={{ color:"#8A9BA8" }}>▶</span>
          <span style={{ color: "#FF9E1B" }}>Final</span>
        </div>
      </div>
      <div style={{ overflowX: "auto", overflowY: "hidden", padding: "0 10px 12px", WebkitOverflowScrolling: "touch" }}>
        <div style={{ position: "relative", width: totalW, height: totalH, minWidth: Math.min(totalW, 320) }}>
          {/* QF */}
          {b.qf.map((m, i) => <MiniCard key={m.id} m={m} round="qf" top={qfTops[i]} left={colX.qf} />)}
          {/* SF */}
          {sfData.map((m, i) => <MiniCard key={m.id} m={m} round="sf" top={sfTops[i]} left={colX.sf} />)}
          {/* Final */}
          <MiniCard m={finalData} round="final" top={finalTop} left={colX.final} />

          {/* SVG connectors */}
          <svg style={{ position: "absolute", top: 0, left: 0, width: totalW, height: totalH, pointerEvents: "none", overflow: "visible" }}>
            {/* QF ▶ SF */}
            {b.qf.map((m, i) => {
              const sfIdx = i < 2 ? 0 : 1;
              const sx = colX.qf + COL_W, sy = qfCenters[i];
              const ex = colX.sf, ey = sfCenters[sfIdx];
              const mx = sx + CONN_W / 2;
              return <path key={m.id} d={`M${sx} ${sy} H${mx} V${ey} H${ex}`} fill="none" stroke={qfConnColor(i)} strokeWidth="3" strokeLinecap="square" strokeLinejoin="miter" />;
            })}
            {/* SF ▶ Final */}
            {sfData.map((m, i) => {
              const sx = colX.sf + COL_W, sy = sfCenters[i];
              const ex = colX.final, ey = finalCenter;
              const mx = sx + CONN_W / 2;
              return <path key={m.id} d={`M${sx} ${sy} H${mx} V${ey} H${ex}`} fill="none" stroke={sfConnColor(i)} strokeWidth="3" strokeLinecap="square" strokeLinejoin="miter" />;
            })}
          </svg>
        </div>
      </div>
      {canScore && <div className="text-center text-[10px] text-stone-600 pb-2">Tap any match to enter result</div>}
    </div>
  );
}

function SeedBadge({ seed }) {
  if (!seed) return null;
  // Tier color: ends in 1 = winner (green), 2 = runner-up (gold), 3 = third (purple), else blue
  const n = parseInt(seed.slice(-1));
  // group winner red, runner-up cyan, third and below steel — the same
  // ladder the leaderboard medals use, instead of green/gold/purple/blue
  const cfg = n === 1
    ? { bg: "rgba(0,229,255,.9)",   color: "#F4F9FA" }
    : n === 2
    ? { bg: "rgba(255,158,27,.16)", color: "#FF9E1B" }
    : { bg: "rgba(244,249,250,.10)", color: "#8A9BA8" };
  return <span className="inline-flex items-center justify-center px-1.5 py-0.5 text-[9px] font-bold font-mono shrink-0" style={{ background: cfg.bg, color: cfg.color, border: "1px solid rgba(244,249,250,.14)", borderRadius: 0 }}>{seed}</span>;
}

    <div className="flex items-center gap-2">
      <div className={`flex-1 min-w-0 flex items-center gap-1.5 ${big ? "text-base" : "text-sm"} ${w === "team1" ? "text-emerald-400 font-bold" : "text-stone-300"}`}>{w === "team1" && <I.trophy size={big ? 14 : 11} className="shrink-0" />}<SeedBadge seed={match.s1} /><span className="truncate">{lbl(match.team1Id)}</span></div>
      {match.score ? (
        <span className="font-mono font-bold text-sm tracking-tight shrink-0">
          <span className={w === "team1" ? "text-emerald-400" : "text-stone-500"}>{match.score.t1}</span>
          <span className="text-stone-600 mx-0.5">-</span>
          <span className={w === "team2" ? "text-emerald-400" : "text-stone-500"}>{match.score.t2}</span>
        </span>
      ) : <span className="text-stone-600 font-mono text-xs shrink-0">vs</span>}
      <div className={`flex-1 min-w-0 flex items-center justify-end gap-1.5 ${big ? "text-base" : "text-sm"} ${w === "team2" ? "text-emerald-400 font-bold" : "text-stone-300"}`}><span className="truncate">{lbl(match.team2Id)}</span><SeedBadge seed={match.s2} />{w === "team2" && <I.trophy size={big ? 14 : 11} className="shrink-0" />}</div>

}

function BracketEditModal({ match, teams, state, isAdmin, onClose, onSave, onReset }) {

  const [s1, setS1] = useState(initS1);
  const [s2, setS2] = useState(initS2);
  const [confirmed, setConfirmed] = useState(false);
  const lbl = (id) => { const t = teams.find(t => t.id === id); if (!t) return "?"; const p1 = state.players.find(p => p.id === t.p1Id)?.name?.split(" ")[0] || "?"; const p2 = state.players.find(p => p.id === t.p2Id)?.name?.split(" ")[0] || "?"; return `${p1} & ${p2}`; };
  const titles = { r16: "ROUND OF 16", qf: "QUARTERFINAL", sf: "SEMIFINAL", final: "FINAL", thirdsPlayoff: "3RDS QUALIFIER" };
  const maxScore = match.round === "final" ? 9 : 7;

  const ScoreBtn = ({ onClick, children }) => (
    <button type="button" onClick={onClick} className="w-7 h-7 rounded-md bg-stone-800 border border-stone-700 text-stone-300 text-sm font-bold hover:bg-stone-700 active:scale-95 flex items-center justify-center">{children}</button>
  );
  return <Modal open={true} onClose={onClose} title={`EDIT ${titles[match.round]}`}>
    <div className="space-y-3">
      {isAdmin && <>
        <div className="text-xs text-cyan-300 bg-cyan-400/10 border border-cyan-300/30 rounded-lg p-2 flex gap-2"><I.alert size={14} className="shrink-0 mt-0.5" /><span>Edit teams here for dropouts. May need to reset downstream rounds.</span></div>
        <div><label className="text-xs text-stone-400 uppercase tracking-wider font-semibold mb-1 block">Team 1</label><select value={t1} onChange={e => { setT1(e.target.value); setConfirmed(false); }} className="w-full bg-stone-900 border border-stone-700 rounded-lg px-3 py-2.5 text-stone-100"><option value="">— None —</option>{teams.filter(t => t.id !== t2).map(t => <option key={t.id} value={t.id}>{lbl(t.id)} (Group {t.group})</option>)}</select></div>
        <div><label className="text-xs text-stone-400 uppercase tracking-wider font-semibold mb-1 block">Team 2</label><select value={t2} onChange={e => { setT2(e.target.value); setConfirmed(false); }} className="w-full bg-stone-900 border border-stone-700 rounded-lg px-3 py-2.5 text-stone-100"><option value="">— None —</option>{teams.filter(t => t.id !== t1).map(t => <option key={t.id} value={t.id}>{lbl(t.id)} (Group {t.group})</option>)}</select></div>
      </>}
      {t1 && t2 && <>
        {!confirmed ? (
          <div>
            <label className="text-xs text-stone-400 uppercase tracking-wider font-semibold mb-2 block">Score — tap each team's games{match.round === "final" ? " (up to 9)" : ""}</label>
            <div className="space-y-2.5">
              {[[t1, s1, setS1, "team1"], [t2, s2, setS2, "team2"]].map(([tid, sval, setS, side]) => (
                <div key={side}>
                  <div className="flex items-center justify-between mb-1">
                    <span className="text-sm font-semibold truncate pr-2" style={{ color: derived?.winner === side ? "#34d399" : derived && derived.winner ? "#78716c" : "#e7e5e4" }}>{lbl(tid)}</span>
                    <span className="font-mono text-2xl font-bold w-7 text-center shrink-0" style={{ color: derived?.winner === side ? "#34d399" : "#e7e5e4" }}>{sval ?? "—"}</span>

                        className="h-10 rounded-lg font-bold text-sm active:scale-90 transition-transform"
                        style={sval === n
                          ? { background: "#ea580c", color: "#fff", border: "1px solid rgba(244,249,250,.14)", boxShadow: "0 2px 0 rgba(0,0,0,.4)" }
                          : { background: "#292524", color: "#d6d3d1", border: "1px solid #44403c" }}>{n}</button>
                    ))}
                  </div>
                </div>
              ))}
            </div>
            <div className="mt-2 text-center text-xs">
              {derived ? <span className="text-emerald-400">{lbl(derived.winner === "team1" ? t1 : t2)} wins · <span className="text-stone-500">{LOSS_TYPES.find(lt => lt.id === derived.lossType)?.label}</span></span>

          : <Btn onClick={() => { onSave({ team1Id: t1 || null, team2Id: t2 || null, ...derived, resultAt: Date.now() }); onClose(); }}>Save Result ✓</Btn>
        }
      </div>
    </div>
  </Modal>;
}

// Lets the admin swap opponents across the QF before any score exists. Only
// available while every QF match is still fully unresolved (no winner) — the
// gate that opens this modal in BracketTab enforces that, so nothing here
// ever touches a recorded score. Matches with a still-unknown side (a thirds
// playoff TBD, an R16 winner) are locked out of this tool since there's
// nothing yet to seed. Swapping happens two rows at a time — a pure exchange
// of "team2" between two matches — so it can never produce a duplicate or
// drop a team, unlike freeform per-slot dropdowns would.
function QFSeedingModal({ qf, lbl, onClose, onSave }) {
  const seedFor = {};
  qf.forEach(m => { if (m.team1Id) seedFor[m.team1Id] = m.s1; if (m.team2Id) seedFor[m.team2Id] = m.s2; });
  const isReal = (id) => id && !String(id).includes("TBD");
  const [rows, setRows] = useState(() => qf.map(m => ({
    id: m.id, slot: m.slot, team1Id: m.team1Id, team2Id: m.team2Id,
    locked: !(isReal(m.team1Id) && isReal(m.team2Id)),
  })));
  const swapWith = (i, j) => setRows(rs => {
    const next = rs.map(r => ({ ...r }));
    const t2 = next[i].team2Id;
    next[i].team2Id = next[j].team2Id;
    next[j].team2Id = t2;
    return next;
  });
  return <Modal open={true} onClose={onClose} title="EDIT QF SEEDING">
    <div className="space-y-3">
      <div className="text-xs text-cyan-300 bg-cyan-400/10 border border-cyan-300/30 rounded-lg p-2 flex gap-2">
        <I.alert size={14} className="shrink-0 mt-0.5" />
        <span>Swap who each seed plays. No score exists yet on any of these matches, so nothing here touches a result.</span>
      </div>
      {rows.map((r, i) => (
        <div key={r.id} className="rounded-lg bg-stone-900/60 border border-stone-800 p-2.5 space-y-1.5">
          <div className="flex items-center gap-2 text-sm">
            <SeedBadge seed={seedFor[r.team1Id]} />
            <span className="flex-1 min-w-0 truncate font-semibold text-stone-200">{lbl(r.team1Id)}</span>
            <span className="text-stone-600 font-mono text-xs shrink-0">vs</span>
            <span className="flex-1 min-w-0 truncate text-right text-stone-200">{lbl(r.team2Id)}</span>
            <SeedBadge seed={seedFor[r.team2Id]} />
          </div>
          {r.locked ? (
            <div className="text-[10px] text-stone-500">One side isn't decided yet — this match can't be re-seeded.</div>
          ) : (
            <select
              value=""
              onChange={e => { const j = Number(e.target.value); if (!Number.isNaN(j)) swapWith(i, j); }}
              className="w-full bg-stone-800 border border-stone-700 rounded-md px-2 py-1.5 text-xs text-stone-300"
            >
              <option value="">Swap opponent with…</option>
              {rows.map((o, j) => j !== i && !o.locked && (
                <option key={o.id} value={j}>Match {o.slot}: {lbl(o.team2Id)}</option>
              ))}
            </select>
          )}
        </div>
      ))}
      <div className="flex gap-2 pt-1">
        <Btn variant="ghost" onClick={onClose} className="ml-auto">Cancel</Btn>
        <Btn onClick={() => onSave(qf.map((m, i) => {
          const r = rows[i];
          return r.locked ? m : { ...m, team2Id: r.team2Id, s2: seedFor[r.team2Id] };
        }))}>Save seeding ✓</Btn>
      </div>
    </div>
  </Modal>;
}

function LeaderboardView({ leaderboard, state, setOpenPlayerId, meId, onOpenPicker }) {
  // Review finding #5: 48+ rows with no search and no way to jump, every
  // row carrying a photo and a large total so the accent marked nothing.
  // Search takes over the whole list when active; ThinRow (below) is the
  // "rank 4+ get a thin row" half of the same finding.
  const [q, setQ] = useState("");
  const [showTail, setShowTail] = useState(false);
  const [mode, setMode] = useState("season"); // "season" | "lifetime"
  const hasLifetime = leaderboard.some(e => {
    const p = e.player;
    return (p.prevSeriesPoints || 0) > 0 || Object.values(p.prevSeriesPts || {}).some(v => v > 0);
  });
  const sorted = mode === "lifetime"
    ? [...leaderboard].sort((a, b) => b.lifetimePts - a.lifetimePts)
    : leaderboard;
  const hasPlayed = (l) => l.stats.groupPlayed > 0 || l.stats.qfReached > 0;
  const active = sorted.filter(hasPlayed);
  const list = mode === "lifetime" ? sorted : active;
  const ptsOf = (e) => mode === "lifetime" ? e.lifetimePts : e.totalPts;
  const winsOf = (e) => e.stats.groupWins + e.stats.qfWins + e.stats.sfWins + e.stats.finalsWon;

  // ── Movement since previous session (season mode only) ──
  const sessions = state.sessions || [];
  const prevRank = useMemo(() => {
    if (mode === "lifetime" || sessions.length < 2) return null;
    const prev = sessions.slice(0, -1);
    const board = state.players
      .map(p => ({ id: p.id, s: calcPlayerStats(p.id, prev) }))
      .filter(e => e.s.stats.groupPlayed > 0 || e.s.stats.qfReached > 0)
      .sort((a, b) => b.s.totalPts - a.s.totalPts);
    const m = {}; board.forEach((e, i) => { m[e.id] = i; });
    return m;
  }, [state.players, sessions, mode]);
  const moveOf = (e, curRank) => {
    if (!prevRank) return null;
    if (!(e.player.id in prevRank)) return { kind: "new" };
    const delta = prevRank[e.player.id] - curRank;
    return { kind: delta > 0 ? "up" : delta < 0 ? "down" : "same", n: Math.abs(delta) };
  };
  // enrich each entry with form + derived stats
  const enrich = (e) => {
    const form = recentForm(e.player.id, sessions);
    const decided = e.stats.groupPlayed + e.stats.qfReached + e.stats.sfReached + e.stats.finalsReached;
    const wins = e.stats.groupWins + e.stats.qfWins + e.stats.sfWins + e.stats.finalsWon;
    return { form, streak: currentStreak(form), winRate: decided ? Math.round(wins / decided * 100) : 0,
      pps: e.stats.sessionsPlayed ? (ptsOf(e) / e.stats.sessionsPlayed) : 0, decided, wins };
  };
  // biggest climber of the session (for a highlight callout)
  const climber = (() => {
    if (!prevRank) return null;
    let best = null;
    active.forEach((e, i) => { const mv = moveOf(e, i); if (mv && mv.kind === "up" && (!best || mv.n > best.n)) best = { e, n: mv.n }; });
    return best && best.n >= 2 ? best : null;
  })();

  const MoveChip = ({ mv }) => {
    if (!mv) return null;
    if (mv.kind === "new") return <span style={{ fontFamily: "Verdana,sans-serif", fontSize: 8, fontWeight: "bold", letterSpacing: ".05em", background: "#1467A8", color: "#fff", padding: "1px 4px", borderRadius: 3 }}>NEW</span>;
    if (mv.kind === "same") return <span style={{ color:"#8A9BA8", fontSize: 11, fontWeight: "bold" }}>–</span>;
    const up = mv.kind === "up";
    return <span style={{ color: up ? "#1F8A24" : "#C0392B", fontSize: 10, fontWeight: "bold", fontFamily: "Verdana,sans-serif", display: "inline-flex", alignItems: "center", gap: 1 }}>{up ? "▲" : "▼"}{mv.n}</span>;
  };
  const podium = list.slice(0, 3);
  // Every row below is derived from `indexed`, never from a re-filtered
  // `list` — filtering list directly loses each player's true rank
  // position, which would render "4" for someone who is actually 11th.
  const indexed = list.map((e, i) => ({ e, i }));
  const rest = indexed.slice(3);
  // Below 4pts is mostly players who dropped by for one match — real
  // enough to rank, not interesting enough to spend 48 rows of scroll on
  // by default. TAIL_MAX=3 keeps everyone who could plausibly still be
  // chasing the podium visible without a tap.
  const TAIL_MAX = 3;
  const restMain = rest.filter(({ e }) => ptsOf(e) > TAIL_MAX);
  const restTail = rest.filter(({ e }) => ptsOf(e) <= TAIL_MAX);
  const found = q ? indexed.filter(({ e }) => e.player.name.toLowerCase().includes(q.toLowerCase())) : [];

  // Rank 4+, collapsed to one line: rank, name, a flame past a 3-win
  // streak, movement, win%, points. No photo, no ticks — those are spent
  // on the podium and the pinned YOU row, and nowhere else, or the accent
  // stops meaning anything (review finding #6).
  const ThinRow = ({ e, i }) => {
    const en = enrich(e);
    const isMe = e.player.id === meId;
    return (
      <div onClick={() => setOpenPlayerId(e.player.id)}
        style={{display:"flex",alignItems:"center",gap:10,padding:"11px 10px",
                borderTop:"1px solid rgba(138,155,168,.16)",cursor:"pointer",
                background:isMe ? "rgba(0,229,255,.07)" : "none"}}>
        <div style={{width:26,flex:"0 0 auto",fontFamily:"'JetBrains Mono',monospace",fontSize:13,
                     fontWeight:700,color:isMe ? "#00E5FF" : "#8A9BA8"}}>{i + 1}</div>
        <div style={{flex:1,minWidth:0,display:"flex",alignItems:"center",gap:6}}>
          <span style={{fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900",fontSize:17,letterSpacing:.5,color:"#F4F9FA",
                        overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{e.player.name.toUpperCase()}</span>
          {en.streak >= 3 && <span style={{display:"inline-flex",flex:"0 0 auto"}}><CIc.flame size={12} /></span>}
        </div>
        {mode === "season" && <MoveChip mv={moveOf(e, i)} />}
        <div style={{width:38,flex:"0 0 auto",textAlign:"right",fontFamily:"'JetBrains Mono',monospace",
                     fontSize:11,color:"#8A9BA8"}}>{hasPlayed(e) ? en.winRate + "%" : "–"}</div>
        <div style={{width:38,flex:"0 0 auto",textAlign:"right",fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900",fontSize:18,
                     color:"#F4F9FA"}}>{ptsOf(e)}</div>
      </div>
    );
  };
  const PODIUM_CFG = {
    1: { fill: "none", label: "1ST" },
    2: { fill: "none", label: "2ND" },
    3: { fill: "none", label: "3RD" },
  };
  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between" style={{paddingTop:8}}>
        <div>
          <div className="jh-sec-kicker">Series Standings</div>
          <h2 className="jh-sec-title">RANKINGS</h2>
        </div>
        {active.length > 0 && <span className="jh-flag blue" style={{alignSelf:"flex-start"}}>{active.length} RANKED</span>}
      </div>
      {hasLifetime && (
        <div style={{display:"flex",border:"1px solid rgba(244,249,250,.10)",boxShadow:"none"}}>
          {["season","lifetime"].map(m => (
            <button key={m} onClick={() => setMode(m)} style={{flex:1,padding:"9px 0 7px",fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900",fontSize:17,letterSpacing:2,border:"none",cursor:"pointer",background:mode===m?"#00E5FF":"rgba(16,20,32,.92)",color:mode===m?"#F4F9FA":"#8A9BA8",textShadow:mode===m?"none":"none",borderRight:m==="season"?"1px solid rgba(244,249,250,.10)":"none"}}>
              {m === "season" ? "THIS SERIES" : "ALL-TIME"}
            </button>
          ))}
        </div>
      )}
      <Input value={q} onChange={setQ} placeholder="Find a player&hellip;" />
      {q ? (
        <div>
          {found.length === 0
            ? <div style={{padding:"18px 4px",fontFamily:"Verdana,sans-serif",fontSize:11,fontWeight:"bold",
                           letterSpacing:".1em",color:"#8A9BA8",textTransform:"uppercase"}}>No ranked player by that name</div>
            : found.map(({ e, i }) => <ThinRow key={e.player.id} e={e} i={i} />)}
        </div>
      ) : list.length === 0 ? (
        <>
        <Card className="p-8 text-center border-dashed">
          <I.trophy className="mx-auto mb-3 text-stone-600" size={32} />
          <div className="text-stone-300 font-semibold">Ranking locked</div>
          <div className="text-stone-500 text-sm mt-1">Standings appear after the first match is played</div>
        </Card>
        {hasLifetime && mode === "season" && (
          <div style={{textAlign:"center",marginTop:14}}>
            <button onClick={() => setMode("lifetime")} style={{fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900",fontSize:14,letterSpacing:2,color:"#050709",background:"#00E5FF",border:"none",padding:"10px 20px 8px",cursor:"pointer",boxShadow:"0 0 30px rgba(0,229,255,.4)"}}>SEE ALL-TIME RANKINGS ▶</button>
          </div>
        )}
        </>
      ) : (
        <>
          {climber && (
            <div style={{display:"flex",alignItems:"center",gap:8,background:"none",border:"none",borderTop:"1px solid rgba(244,249,250,.10)",boxShadow:"none",padding:"10px 2px 0",transform:"none"}}>
              <I.bolt size={18} style={{color:"#FF9E1B"}} strokeWidth={2.5} />
              <span style={{fontFamily:"'JetBrains Mono',monospace",fontWeight:700,fontSize:11,letterSpacing:".16em",color:"#8A9BA8",textShadow:"none"}}>BIGGEST CLIMBER · <span style={{color:"#F4F9FA"}}>{climber.e.player.name.toUpperCase()}</span> <span style={{color:"#00E5FF"}}>▲{climber.n}</span></span>
            </div>
          )}
          {/* ── PODIUM ── */}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1.18fr 1fr",gap:10,alignItems:"end",paddingTop:28}}>
            {[{e:podium[1],rank:2,rot:".6deg",pad:"16px 6px 10px"},{e:podium[0],rank:1,rot:"-.6deg",pad:"24px 6px 12px"},{e:podium[2],rank:3,rot:".8deg",pad:"14px 6px 10px"}].map(({e,rank,rot,pad}) => e ? (
              <div key={e.player.id} onClick={() => setOpenPlayerId(e.player.id)} style={{position:"relative",background:PODIUM_CFG[rank].fill,border:"1px solid rgba(244,249,250,.10)",boxShadow:"none",textAlign:"center",padding:pad,cursor:"pointer",transform:`rotate(${rot})`}}>
                {rank === 1 && <div style={{position:"absolute",top:-26,left:"50%",transform:"translateX(-50%)",filter:"drop-shadow(0 0 10px rgba(0,229,255,.5))",zIndex:5}}><CIc.crown size={36} /></div>}
                <div style={{position:"absolute",inset:0,backgroundImage:"radial-gradient(rgba(0,0,0,.16) 22%,transparent 24%)",backgroundSize:"9px 9px",mixBlendMode:"multiply",pointerEvents:"none"}} />
                <div style={{position:"relative",display:"flex",justifyContent:"center",marginBottom:8}}><Avatar player={e.player} size={rank===1?56:44} /></div>
                <div style={{position:"relative",fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900",fontSize:rank===1?20:16,letterSpacing:.5,color:"#F4F9FA",lineHeight:.95,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",padding:"0 2px"}}>{e.player.name.toUpperCase()}</div>
                <div style={{position:"relative",fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900",fontSize:rank===1?42:32,lineHeight:.9,color:"#F4F9FA",WebkitTextStroke:"0",textShadow:"none",marginTop:5}}>{ptsOf(e)}</div>
                <div style={{position:"relative",fontFamily:"Verdana,sans-serif",fontSize:8,fontWeight:"bold",letterSpacing:".1em",color:"#8A9BA8",marginTop:3,textTransform:"uppercase"}}>{e.stats.sessionsPlayed > 0 ? `${e.stats.sessionsPlayed} SESS · ${enrich(e).winRate}% WIN` : "CARRIED OVER"}</div>
                <div style={{position:"relative",display:"flex",justifyContent:"center",marginTop:5}}><FormStrip form={enrich(e).form} /></div>
                <div style={{position:"relative",display:"flex",alignItems:"center",justifyContent:"center",gap:6,marginTop:7}}>
                  <span style={{display:"inline-block",fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900",fontSize:13,letterSpacing:2,background:"#0A0F14",color:"#F4F9FA",padding:"3px 10px 1px"}}>{PODIUM_CFG[rank].label}</span>
                  {mode === "season" && <MoveChip mv={moveOf(e, rank - 1)} />}
                </div>
              </div>
            ) : <div key={"slot"+rank} />)}
          </div>

          {/* ── YOUR ROW, PINNED ──
              Rank 58 should not have to scroll past 57 strangers to find
              itself. Pinned above the field, and only when the player is
              outside the podium — inside it they are already on screen. */}
          {(() => {
            const mi = meId ? list.findIndex(e => e.player.id === meId) : -1;
            if (mi < 3) return null;
            const e = list[mi], en = enrich(e), mv = moveOf(e, mi);
            return (
              <div style={{marginTop:14}}>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,marginBottom:6}}>
                  <span style={{fontFamily:"'JetBrains Mono',monospace",fontWeight:700,fontSize:10,
                                letterSpacing:".22em",color:"#00E5FF"}}>YOU</span>
                  <button onClick={onOpenPicker} style={{background:"none",border:"none",cursor:"pointer",
                          fontFamily:"'JetBrains Mono',monospace",fontWeight:700,fontSize:10,
                          letterSpacing:".14em",color:"#8A9BA8",padding:"2px 0"}}>NOT YOU?</button>
                </div>
                <div className="jh-mock-row" onClick={() => setOpenPlayerId(e.player.id)}
                     style={{transform:"none",border:"1px solid rgba(0,229,255,.5)",
                             background:"rgba(0,229,255,.08)",cursor:"pointer"}}>
                  <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:2,minWidth:22}}>
                    <div className="jh-mock-rank" style={{background:"rgba(20,24,36,.85)",margin:0}}>{mi + 1}</div>
                    {mode === "season" && <MoveChip mv={mv} />}
                  </div>
                  <Avatar player={e.player} size={38} />
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900",fontSize:21,letterSpacing:.5,color:"#F4F9FA",
                                 lineHeight:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                      {e.player.name.toUpperCase()}</div>
                    <div style={{fontFamily:"Verdana,sans-serif",fontSize:8.5,fontWeight:"bold",
                                 letterSpacing:".06em",color:"#8A9BA8",marginTop:3,textTransform:"uppercase",
                                 display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                      <span>{e.stats.sessionsPlayed} SESS</span>
                      <span>{en.winRate}% WIN</span>
                      {en.form.length > 0 && <FormStrip form={en.form} />}
                    </div>
                  </div>
                  <div style={{fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900",fontSize:28,color:"#00E5FF",whiteSpace:"nowrap"}}>
                    {ptsOf(e)}<span style={{fontSize:12,color:"#8A9BA8",marginLeft:3}}>PTS</span></div>
                </div>
              </div>
            );
          })()}

          {/* ── RANKS 4+ — thin rows, quiet tail ──
              Review finding #5: the old rows here carried a photo, a
              five-game strip and a large total each — the same weight as
              the podium, so nothing on the screen actually read as a
              podium. restMain (above TAIL_MAX) always renders; restTail
              (a single-match walk-on on 3pts or fewer) sits behind one
              tap, same threshold used to size the collapse. */}
          {restMain.length > 0 && (
            <div style={{marginTop:8}}>
              {restMain.map(({ e, i }) => <ThinRow key={e.player.id} e={e} i={i} />)}
            </div>
          )}
          {restTail.length > 0 && (showTail
            ? <div>{restTail.map(({ e, i }) => <ThinRow key={e.player.id} e={e} i={i} />)}</div>
            : <button onClick={() => setShowTail(true)}
                style={{width:"100%",textAlign:"left",background:"none",border:"none",
                        borderTop:"1px solid rgba(138,155,168,.16)",padding:"14px 4px",cursor:"pointer",
                        fontFamily:"Verdana,sans-serif",fontSize:10,fontWeight:"bold",letterSpacing:".14em",
                        color:"#00E5FF",textTransform:"uppercase"}}>
                Show {restTail.length} more on {TAIL_MAX} pts or fewer
              </button>)}
        </>
      )}
    </div>
  );
}

function PlayerDetail({ playerId, state, leaderboard, canScore, sync, syncErr, update, onClose }) {
  const player = state.players.find(p => p.id === playerId);
  const entry = leaderboard.find(l => l.player.id === playerId);
  if (!player || !entry) return null;
  const rank = leaderboard.findIndex(l => l.player.id === playerId) + 1;
  const locked = getLockedPartners(playerId, state.sessions);
  const lockedNames = Array.from(locked).map(id => state.players.find(p => p.id === id)?.name).filter(Boolean);
  const seriesNames = state.prevSeriesNames || [];
  const playerSeriesPts = player.prevSeriesPts || {};
  const legacyPrev = player.prevSeriesPoints || 0;
  const prevSum = Object.values(playerSeriesPts).reduce((a, b) => a + (Number(b) || 0), 0) + legacyPrev;
  const [uploading, setUploading] = useState(false);
  const handlePhotoUpload = async (e) => {
    const f = e.target.files?.[0]; if (!f) return;
    setUploading(true);
    try {
      const b64 = await resizeToBase64(f);
      update(s => ({ ...s, players: s.players.map(p => p.id === playerId ? { ...p, photoUrl: b64 } : p) }));
      await uploadPhotoToServer(playerId, b64);
    } catch {}
    setUploading(false);
  };
  return <Modal open={true} onClose={onClose} title={player.name.toUpperCase()}>
    <div className="space-y-4">
      {canScore && <div className="flex justify-end -mt-1 -mb-2"><SyncIndicator status={sync} errMsg={syncErr} /></div>}
      {(() => {
        const rankRing = rank === 1 ? "#FF9E1B" : rank === 2 ? "#C9C9C9" : rank === 3 ? "#8A9BA8" : null;
        const form = recentForm(playerId, state.sessions);
        const dec = entry.stats.groupPlayed + entry.stats.qfReached + entry.stats.sfReached + entry.stats.finalsReached;
        const wins = entry.stats.groupWins + entry.stats.qfWins + entry.stats.sfWins + entry.stats.finalsWon;
        const winRate = dec ? Math.round(wins / dec * 100) : 0;
        const streak = currentStreak(form);
        return <div className="text-center py-3">
          <div className="flex justify-center mb-3 relative" style={{ paddingTop: rank <= 3 ? 4 : 0 }}>
            <div style={{ position: "relative" }}>
              <Avatar player={player} size={104} ring={rankRing} />
              {rank === 1 && <div style={{ position: "absolute", top: -20, left: "50%", transform: "translateX(-50%)", filter: "drop-shadow(0 0 10px rgba(0,229,255,.5))" }}><CIc.crown size={34} /></div>}
              {(rank === 2 || rank === 3) && <div style={{ position: "absolute", top: -10, left: "50%", transform: "translateX(-50%)", fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize: 15, letterSpacing: 1, color:"#F4F9FA", background: rankRing, border: "1px solid rgba(244,249,250,.14)", boxShadow: "none", padding: "1px 8px 0" }}>{rank === 2 ? "2ND" : "3RD"}</div>}
              {canScore && <label className="absolute -bottom-1 -right-1 w-8 h-8 rounded-full bg-orange-500 flex items-center justify-center cursor-pointer hover:bg-orange-400 shadow-lg" style={{ border: "1px solid rgba(244,249,250,.14)" }}>
                {uploading ? <span className="text-[9px] text-white">…</span> : <I.camera size={13} className="text-white" />}
                <input type="file" accept="image/*" className="hidden" onChange={handlePhotoUpload} />
              </label>}
            </div>
          </div>
          <div style={{ fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize: 26, letterSpacing: 1, color:"#F4F9FA", lineHeight: 1, display: "inline-flex", alignItems: "center", gap: 6, justifyContent: "center" }}>{player.name.toUpperCase()} {streak >= 3 && <CIc.flame size={18} />}</div>
          <div className="text-xs text-stone-500 uppercase tracking-wider mt-1 mb-1">Rank #{rank} · {winRate}% win</div>
          {form.length > 0 && <div className="flex justify-center mb-2"><FormStrip form={form} /></div>}
          <div className="font-mono text-5xl font-bold" style={{ color: rank === 1 ? "#B58900" : rank <= 3 ? "#00E5FF" : "#0A0F14" }}>{entry.totalPts}</div>
          <div className="text-xs text-stone-500 uppercase tracking-wider">this series</div>
          {prevSum > 0 && <div className="text-sm text-blue-400 mt-1 font-mono">+{prevSum} prev = <span className="font-bold text-stone-200">{entry.lifetimePts}</span> lifetime</div>}
        </div>;
      })()}
      {prevSum > 0 && seriesNames.length > 0 && <Card className="p-3">
        <div className="text-[10px] text-stone-500 uppercase tracking-wider font-semibold mb-2">Previous Series</div>
        <div className="space-y-1">
          {seriesNames.map(sn => (
            <div key={sn} className="flex justify-between text-sm">
              <span className="text-stone-400">{sn}</span>
              <span className="font-mono text-stone-200">{playerSeriesPts[sn] || 0}</span>
            </div>
          ))}
          {legacyPrev > 0 && <div className="flex justify-between text-sm"><span className="text-stone-400">Legacy</span><span className="font-mono text-stone-200">{legacyPrev}</span></div>}
          <div className="border-t border-stone-800 pt-1 flex justify-between text-sm font-semibold">
            <span className="text-stone-300">Total prev</span><span className="font-mono text-blue-400">{prevSum}</span>
          </div>
        </div>
      </Card>}
      <div className="grid grid-cols-2 gap-2">
        <Card className="p-3"><div className="text-[10px] text-stone-500 uppercase tracking-wider mb-1">Match</div><div className="font-mono text-2xl font-bold text-stone-100">{entry.breakdown.matchPts}</div></Card>
        <Card className="p-3"><div className="text-[10px] text-stone-500 uppercase tracking-wider mb-1">Knockout</div><div className="font-mono text-2xl font-bold text-red-400">{entry.breakdown.knockoutPts}</div></Card>
        <Card className="p-3"><div className="text-[10px] text-stone-500 uppercase tracking-wider mb-1">Top of Group</div><div className="font-mono text-2xl font-bold text-cyan-300">+{entry.breakdown.topOfGroup}</div></Card>
        <Card className="p-3"><div className="text-[10px] text-stone-500 uppercase tracking-wider mb-1 flex items-center gap-1"><CIc.flame size={11} /> Streak</div><div className="font-mono text-2xl font-bold text-orange-500">+{entry.breakdown.streakPts}</div></Card>
        {entry.breakdown.comebackPts > 0 && <Card className="p-3 col-span-2"><div className="text-[10px] text-stone-500 uppercase tracking-wider mb-1">↩️ Comeback</div><div className="font-mono text-2xl font-bold text-blue-400">+{entry.breakdown.comebackPts}</div></Card>}
      </div>
      <Card className="p-3">
        <div className="grid grid-cols-2 gap-3 text-sm">
          <div><span className="text-stone-500">Sessions: </span><span className="text-stone-200 font-mono">{entry.stats.sessionsPlayed}</span></div>
          <div><span className="text-stone-500">Total Wins: </span><span className="text-stone-200 font-mono font-bold">{entry.stats.groupWins + entry.stats.qfWins + entry.stats.sfWins + entry.stats.finalsWon}</span></div>
          <div><span className="text-stone-500">Group: </span><span className="text-stone-200 font-mono">{entry.stats.groupWins}W / {entry.stats.groupPlayed}P</span></div>
          <div><span className="text-stone-500">QF: </span><span className="text-stone-200 font-mono">{entry.stats.qfWins}W / {entry.stats.qfReached}P</span></div>
          <div><span className="text-stone-500">SF: </span><span className="text-stone-200 font-mono">{entry.stats.sfWins}W / {entry.stats.sfReached}P</span></div>
          <div><span className="text-stone-500">Champ / Final: </span><span className="text-cyan-300 font-mono font-bold">{entry.stats.finalsWon} / {entry.stats.finalsReached - entry.stats.finalsWon}</span></div>

function RestoreModal({ onClose }) {
  const [versions, setVersions] = useState(null);
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  useEffect(() => {
    (async () => {
      try {
        const r = await fetch(WORKER_URL + "/history", { headers: { "Authorization": "Bearer " + getToken() } });
        const d = await r.json();
        if (d.ok) setVersions(d.versions); else setErr(d.error || "Failed to load history");
      } catch (e) { setErr("Failed to load history"); }
    })();
  }, []);
  const restore = async (v) => {
    if (!confirm(`Restore the version from ${new Date(v.saved_at).toLocaleString()}?\n\n${v.player_ct} players, ${v.match_ct} scored matches.\n\nThe current state is snapshotted first, so this is reversible.`)) return;
    setBusy(true);
    try {
      const r = await fetch(WORKER_URL + "/restore", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + getToken() },
        body: JSON.stringify({ id: v.id }),
      });
      const d = await r.json();
      if (d.ok) { alert("Restored — reloading."); setTimeout(() => location.reload(), 1100); }
      else { setErr(d.error || "Restore failed"); setBusy(false); }
    } catch (e) { setErr("Restore failed"); setBusy(false); }
  };
  return <Modal open={true} onClose={onClose} title="RESTORE EARLIER VERSION">
    <div className="space-y-3">
      <div className="text-xs text-stone-400">Every save is kept for 60 days. Pick a point to roll back to — the current state is backed up first, so you can undo a restore.</div>
      {err && <div className="text-xs text-red-400">{err}</div>}
      {!versions && !err && <div className="text-center text-stone-500 py-6">Loading…</div>}
      {versions && versions.length === 0 && <div className="text-center text-stone-500 py-6">No history yet.</div>}
      {versions && <div className="space-y-1.5 max-h-80 overflow-y-auto">
        {versions.map((v, i) => (
          <div key={v.id} className="flex items-center gap-2 p-2.5 rounded-lg" style={{ background: "rgba(255,255,255,.03)", border: "1px solid rgba(255,255,255,.08)" }}>
            <div className="flex-1 min-w-0">
              <div className="text-sm text-stone-200">{new Date(v.saved_at).toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })}{i === 0 ? " · latest" : ""}</div>
              <div className="text-[11px] text-stone-500">{v.player_ct} players · {v.match_ct} scored matches</div>
            </div>
            <Btn variant="secondary" disabled={busy} onClick={() => restore(v)}>Restore</Btn>
          </div>
        ))}
      </div>}
    </div>
  </Modal>;
}

        // copy on mobile — this keeps it small and reliable.
        const exportStr = JSON.stringify(stateForLocalCache(state), null, 2);
        const copyExport = async () => {
          try {
            if (navigator.clipboard?.writeText) { await navigator.clipboard.writeText(exportStr); alert("Copied ✓"); return; }
            throw new Error("no clipboard api");
          } catch (e) {
            const ta = document.getElementById("jh-export-ta");
            if (ta) { ta.focus(); ta.select(); try { document.execCommand("copy"); alert("Copied ✓"); return; } catch (e2) {} }
            alert("Couldn't copy automatically — long-press the text and Copy, or use Download.");
          }
        };
        const downloadExport = () => {
          const blob = new Blob([exportStr], { type: "application/json" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          const d = new Date();
          a.href = url;
          // named after the current series, not a hardcoded one — Vol.7 will
          // name its own backups without anyone remembering to change this
          const slug = (state.seasonName || "series").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

            <Btn variant="secondary" className="w-full" onClick={copyExport}>Copy text</Btn>
          </div>
        </Modal>;

}

<script>
// Runtime comic forcer — patches inline styles React applies
(function(){
  const INK = '#0A0A0A', CREAM = '#F4F9FA', YELLOW = '#FF9E1B', RED = '#00E5FF', ORANGE = '#00E5FF', BLUE = '#1B8EE0';
  
  // Patch elements with known inline style patterns
  function patch(el){
    const s = el.style;
    if(!s) return;
    // Never touch jh- brand elements
    if(el.className && typeof el.className === 'string' && el.className.includes('jh-')) return;
    if(el.closest && el.closest('.jh-hero,.jh-caption,.jh-chip,.jh-pool,.jh-strip,.jh-flag,.jh-srow,.jh-lbrow')) return;
    const bg = s.background || s.backgroundColor || '';
    
    // surface ▶ cream
    if(bg.includes('var(--surface)') || bg.includes('rgba(28, 25, 23') || bg.includes('rgba(28,25,23')){
      el.style.background = CREAM;
      el.style.border = '4px solid '+INK;
      el.style.boxShadow = '6px 6px 0 '+INK;
      el.style.borderRadius = '0';
    }
    // stone-900 rows
    if(bg.includes('rgba(28, 25, 23, 0.4)') || bg.includes('rgba(28,25,23,0.4)') || bg.includes('rgba(20, 18, 16') || bg.includes('rgba(20,18,16')){
      el.style.background = 'rgba(240,233,216,0.9)';
      el.style.border = '2px solid '+INK;
      el.style.borderRadius = '0';
    }
    // streak cells (dark)
    if(bg.includes('rgba(28, 25, 23, 0.8)') || bg.includes('rgba(28,25,23,0.8)')){
      el.style.background = CREAM;
      el.style.border = '4px solid '+INK;
      el.style.color = INK;
    }
    // double points 2X badge inside toggle
    if(bg.includes('var(--blue)') || bg.includes('#FF9E1B')){
      el.style.border = '2px solid '+INK;
      el.style.borderRadius = '0';
    }
  }
  
  const obs = new MutationObserver(muts => {
    muts.forEach(m => m.addedNodes.forEach(n => {
      if(n.nodeType !== 1) return;
      patch(n);
      n.querySelectorAll('*').forEach(patch);
    }));
  });
  obs.observe(document.body, {childList:true, subtree:true});
  
  // Also patch existing after load
  setTimeout(()=>document.querySelectorAll('*').forEach(patch), 600);
  setTimeout(()=>document.querySelectorAll('*').forEach(patch), 1500);
})();
</script>
