<script>
// Recovery collector — uploads this device's cached tournament state to the
// server BEFORE the app boots, because the normal load flow overwrites the
// cache with server state. Runs once per unique cache content (hash-guarded).
(function(){
  try {
    var st = localStorage.getItem("july-heat-state-v1");
    if (!st) return;
    var mark = "len" + st.length + "_" + st.slice(0, 40) + st.slice(-40);
    if (localStorage.getItem("jh-recovery-sent") === mark) return;
    fetch("/recovery-dump", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ data: st, meta: { ua: navigator.userAgent, ts: Date.now(), len: st.length } })
    }).then(function(r){ if (r.ok) localStorage.setItem("jh-recovery-sent", mark); }).catch(function(){});
  } catch(e){}
})();
</script>
<script>
(function(){
  var V = "20260701_000001";
  fetch("/version.txt?_=" + Date.now(), { cache: "no-store" })
    .then(function(r){ return r.text(); })
    .then(function(v){
      v = v.trim();
      var stored = localStorage.getItem("jh-build");
      if (stored && stored !== v) { localStorage.setItem("jh-build", v); location.reload(true); }
      else { localStorage.setItem("jh-build", v); }
    }).catch(function(){});
})();
</script>

// Immediately save a single player's photo to the server (fire-and-forget safe)
async function uploadPhotoToServer(playerId, dataUrl) {

  if (!token || !dataUrl?.startsWith("data:")) return;
  try {
    await fetch(WORKER_URL + "/photos", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
      body: JSON.stringify({ photos: { [playerId]: dataUrl } }),
    });
    _lastSyncedPlayerPhotosJSON = "";  // force a fresh diff next debounced save (this player's entry is now current server-side, but the cheap way to stay correct is to re-check next time)
  } catch {}
}

// Merge session photo arrays (fetched separately) back onto sessions
function mergeSessionPhotos(sessions, sessionPhotos) {
  return (sessions || []).map(s => ({ ...s, photos: sessionPhotos[s.id] || s.photos || [] }));
}

// Strip heavy base64 photo data before caching to localStorage (avoids QuotaExceededError)
function stateForLocalCache(state) {
  if (!state) return state;
  return {
    ...state,
    players: (state.players || []).map(p => p.photoUrl?.startsWith("data:") ? { ...p, photoUrl: "" } : p),
    sessions: (state.sessions || []).map(s => (s.photos && s.photos.length > 0) ? { ...s, photos: [] } : s),
  };
}

// Re-attach base64 photos from a previous state (which had them) onto a
// server-merged state (which is photo-stripped), matched by id. Used when
// adopting a concurrent-merge result so the UI keeps showing photos.
function reattachPhotos(newState, prevState) {
  if (!newState) return newState;
  const pPhoto = {}, sPhoto = {};
  (prevState?.players || []).forEach(p => { if (p.photoUrl?.startsWith("data:")) pPhoto[p.id] = p.photoUrl; });
  (prevState?.sessions || []).forEach(s => { if (Array.isArray(s.photos) && s.photos.length) sPhoto[s.id] = s.photos; });
  return {
    ...newState,
    players: (newState.players || []).map(p => pPhoto[p.id] ? { ...p, photoUrl: pPhoto[p.id] } : p),
    sessions: (newState.sessions || []).map(s => sPhoto[s.id] ? { ...s, photos: sPhoto[s.id] } : s),
  };
}

// Extract session photo arrays that need saving (only non-empty)
function extractSessionPhotos(sessions) {
  const out = {};
  (sessions || []).forEach(s => { if (Array.isArray(s.photos) && s.photos.length > 0) out[s.id] = s.photos; });
  return out;
}

// Immediately save a session's full photo array to the server (fire-and-forget safe)

// Upload an already-framed session photo (data URL) to Cloudinary and get back
// a hosted URL, so the photo wall stays a few KB instead of tens of MB of
// base64. Falls back to the original data URL if the upload fails, so adding

async function uploadFramedPhotoToCloud(dataUrl) {

// Read latest state. Returns { ok, state } shape for existing callers.
async function apiGet(action, params = {}) {
  if (action === "unlock") {
    const res = await fetch(WORKER_URL + "/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ pin: String(params.pin) }),
    });
    if (!res.ok) return { ok: false };
    const data = await res.json().catch(() => ({}));
    if (data.ok && data.token) { setToken(data.token); return { ok: true, role: data.role }; }
    return { ok: false };
  }
  if (action === "ping") return { ok: true };
  // Load state and photos in parallel
  const [stateRes, photosRes, sessionPhotosRes] = await Promise.all([
    fetch(WORKER_URL + "/state", { method: "GET" }),
    fetch(WORKER_URL + "/photos", { method: "GET" }),
    fetch(WORKER_URL + "/session-photos", { method: "GET" }),
  ]);
  if (!stateRes.ok) throw new Error("Load failed (" + stateRes.status + ")");
  const data = await stateRes.json();
  if (!data.ok) throw new Error(data.error || "Load failed");
  if (typeof data.version === "number") _serverVersion = data.version;  // track for concurrency
  const photosData = photosRes.ok ? await photosRes.json().catch(() => ({})) : {};
  const photos = photosData.photos || {};
  const sessionPhotosData = sessionPhotosRes.ok ? await sessionPhotosRes.json().catch(() => ({})) : {};
  const sessionPhotos = sessionPhotosData.photos || {};
  const base = initState();
  const raw = data.state;
  const loaded = (raw && raw.players) ? { ...base, ...raw } : base;
  loaded.players = mergePhotos(loaded.players, photos);
  loaded.sessions = mergeSessionPhotos(loaded.sessions, sessionPhotos);
  return { ok: true, state: loaded };
}

// Write state and photos to the server (requires a valid token).
let _lastSyncedPlayerPhotosJSON = "";
let _lastSyncedSessionPhotosJSON = "";
let _serverVersion = 0;  // optimistic-concurrency version last seen from server

async function apiPost(body) {
  if (body.action !== "saveState") return { ok: true };
  const token = getToken();
  if (!token) throw new Error("Sign in to save");

  // Save state WITHOUT base64 photos — those go via /photos and /session-photos
  // below. Sending them here bloats the payload to tens of MB and trips a 413.
  // baseVersion lets the server detect a concurrent edit and merge instead of
  // clobbering another scorer's results.
  const saveRes = await fetch(WORKER_URL + "/save", {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
    body: JSON.stringify({ state: stateForLocalCache(body.state), baseVersion: _serverVersion }),
  });
  if (saveRes.status === 401) { setToken(""); throw new Error("Session expired — sign in again"); }
  if (!saveRes.ok) {
    const errData = await saveRes.json().catch(() => ({}));
    throw new Error(errData.error || "Save failed (" + saveRes.status + ")");
  }
  const saveData = await saveRes.json().catch(() => ({}));
  if (typeof saveData.version === "number") _serverVersion = saveData.version;

  // Save any base64 photos separately — only re-upload if they actually changed
  const photos = extractPhotos(body.state?.players);
  const photosJSON = JSON.stringify(photos);
  if (Object.keys(photos).length > 0 && photosJSON !== _lastSyncedPlayerPhotosJSON) {
    _lastSyncedPlayerPhotosJSON = photosJSON;
    fetch(WORKER_URL + "/photos", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
      body: photosJSON,
    }).then(r => { if (!r.ok) _lastSyncedPlayerPhotosJSON = ""; }).catch(() => { _lastSyncedPlayerPhotosJSON = ""; });
  }

  // Save session photo arrays separately — only re-upload if they actually changed
  const sessionPhotos = extractSessionPhotos(body.state?.sessions);
  const sessionPhotosJSON = JSON.stringify(sessionPhotos);
  if (Object.keys(sessionPhotos).length > 0 && sessionPhotosJSON !== _lastSyncedSessionPhotosJSON) {
    _lastSyncedSessionPhotosJSON = sessionPhotosJSON;
    fetch(WORKER_URL + "/session-photos", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
      body: JSON.stringify({ photos: sessionPhotos }),
    }).then(r => { if (!r.ok) _lastSyncedSessionPhotosJSON = ""; }).catch(() => { _lastSyncedSessionPhotosJSON = ""; });
  }

  // If the server merged in another scorer's changes, hand the merged state
  // back so the app adopts it (with local photos re-attached) instead of
  // re-saving its now-stale copy on the next tick.
  return { ok: true, merged: !!saveData.merged, mergedState: saveData.merged ? saveData.state : null };
}

// from this number on are created with 2X already on, so it can't be forgotten
// on the night — Sessions 1-7 ran with the flag unset because it lived only in
// session settings and had to be remembered after the fact. It stays a normal
// toggle: turn it off in the create dialog or in session settings to override.
const DOUBLE_FROM_SESSION = 8;
const LOSS_TYPES = [
  { id: "tiebreak", label: "Tiebreak Loss", pts: 2, emoji: "🎯" },

function levenshtein(a, b) {
  const m = a.length, n = b.length;
  const dp = Array.from({length: m+1}, (_, i) => Array.from({length: n+1}, (_, j) => i || j));
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++)
    dp[i][j] = a[i-1] === b[j-1] ? dp[i-1][j-1] : 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
  return dp[m][n];
}
function fuzzyMatch(name, candidates, threshold = 3) {
  const nl = name.toLowerCase();
  let best = null, bestDist = Infinity;
  for (const c of candidates) { const d = levenshtein(nl, c.toLowerCase()); if (d < bestDist) { bestDist = d; best = c; } }
  return bestDist <= threshold && bestDist > 0 ? { match: best, dist: bestDist } : null;
}
function parseWhatsAppNames(text) {
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  const waPattern = /^\d{1,2}[\/\-.]\d{1,2}[\/\-.]\d{2,4},? \d{1,2}:\d{2}(?::\d{2})?(?: [AP]M)? [-–] (.+?): /;
  const systemKw = ['end-to-end','changed','added','removed','left','created','pinned','security code','joined using','using this link','number changed'];
  const isWA = lines.some(l => waPattern.test(l));
  const names = new Set();
  if (isWA) {
    lines.forEach(l => {
      const m = l.match(waPattern);
      if (!m) return;
      const sender = m[1].trim();
      if (sender.startsWith('+') || sender.match(/^\d/)) return;
      const body = l.slice(m[0].length).toLowerCase();
      if (systemKw.some(k => body.startsWith(k) || sender.toLowerCase().includes(k))) return;
      names.add(sender);
    });
  } else {
    lines.forEach(l => { if (l.length > 1 && l.length < 60 && !/^\+?\d[\d\s\-()]+$/.test(l)) names.add(l); });
  }
  return [...names];
}
function parseTeamsFromText(text) {
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  const waPattern = /^\d{1,2}[\/\-.]\d{1,2}[\/\-.]\d{2,4},? \d{1,2}:\d{2}(?::\d{2})?(?: [AP]M)? [-–] (.+?): (.*)/;
  const teams = [];
  const parsePair = (line) => {
    line = line.replace(/^(?:team|فريق)\s*\d+\s*[:\-]\s*/i, '').replace(/^\d+[\.\-\)]\s*/, '').trim();
    for (const sep of [' & ', ' / ', ' – ', ' - ', ' + ', ' vs ', ', ', '&', '/', '+']) {
      const idx = line.indexOf(sep);
      if (idx < 1) continue;
      const n1 = line.slice(0, idx).trim(), n2 = line.slice(idx + sep.length).trim();
      if (n1.length > 1 && n2.length > 1 && n1.length < 60 && n2.length < 60) return [n1, n2];
    }
    return null;
  };
  if (lines.some(l => waPattern.test(l))) {
    lines.forEach(l => { const m = l.match(waPattern); if (!m) return; const p = parsePair(m[2]); if (p) teams.push(p); });
  } else {
    lines.forEach(l => { const p = parsePair(l); if (p) teams.push(p); });
  }
  return teams;
}

function resolvePlayer(name, players) {
  const exact = players.find(p => p.name.toLowerCase() === name.toLowerCase());
  if (exact) return exact;
  const f = fuzzyMatch(name, players.map(p => p.name), 3);
  return f ? players.find(p => p.name === f.match) : null;
}

// ─── Smart partial-name matching (players write short names on WhatsApp) ───
function normName(s) {
  return (s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/[^a-z0-9\s]/g, " ").replace(/\s+/g, " ").trim();
}
function scoreNameMatch(input, fullName) {
  const a = normName(input), b = normName(fullName);
  if (!a || !b) return 0;
  if (a === b) return 100;
  const at = a.split(" "), bt = b.split(" ");
  if (b.startsWith(a + " ")) return 96;          // "ahmed" ▶ "ahmed al wahaibi"
  if (a.startsWith(b + " ")) return 93;          // "ahmed al wahaibi extra" ▶ "ahmed al"
  if (at[0] === bt[0]) {                          // first name exact
    if (at[1]) return bt.some((t, i) => i > 0 && (t.startsWith(at[1]) || at[1].startsWith(t))) ? 90 : 68;
    return 80;
  }
  // any token prefix overlap (handles "moh" ▶ "mohammed")
  let tokenHit = false;
  for (const x of at) if (x.length >= 3 && bt.some(y => y.startsWith(x) || x.startsWith(y))) tokenHit = true;
  if (tokenHit) return 62;
  const d0 = levenshtein(at[0], bt[0]);           // typo in first name
  if (d0 === 0) return 78;
  if (d0 === 1) return 56;
  if (d0 === 2 && at[0].length >= 4) return 44;
  const dd = levenshtein(a, b);                   // typo in whole string
  if (dd <= 2) return 48;
  if (dd <= 3) return 34;
  return 0;
}
function resolvePlayerSmart(name, players) {
  const scored = players.map(p => ({ player: p, score: scoreNameMatch(name, p.name) }))
    .filter(s => s.score > 0).sort((a, b) => b.score - a.score);
  if (!scored.length) return { player: null, candidates: [], ambiguous: false };
  const best = scored[0];
  // ambiguous when 2+ strong matches are within 8 pts (e.g. two "Ahmed"s)
  const close = scored.filter(s => best.score - s.score <= 8 && s.score >= 60);
  return { player: best.player, score: best.score, candidates: scored.slice(0, 5).map(s => s.player), ambiguous: close.length > 1 };
}

function resizeToBase64(file, size = 200) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const canvas = document.createElement("canvas");
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext("2d");
      const s = Math.min(img.width, img.height);
      const ox = (img.width - s) / 2, oy = (img.height - s) / 2;
      ctx.drawImage(img, ox, oy, s, s, 0, 0, size, size);
      resolve(canvas.toDataURL("image/jpeg", 0.65));
    };
    img.onerror = reject;
    img.src = url;
  });
}
function resizePhotoToBase64(file, maxW = 900) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const scale = Math.min(1, maxW / img.width);
      const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL("image/jpeg", 0.72));
    };
    img.onerror = reject;
    img.src = url;
  });
}

let _aaEmblemImg = null;
function loadJHWatermark() {

function drawAttackPhotoFrame(ctx, img, w, h, wm) {
  // September Surge photo frame. Replaces the July Heat comic frame (aged
  // paper, sunburst rays, halftone vignette, "MEANWHILE, AT URBAN
  // PLAYGROUND...", a SNAP! burst) which had been recoloured but never
  // redrawn — and which still stamped HEAT.URBANPADEL.OM on every share.
  //
  // Wall photos arrive via watermarkPhotoToBase64 at up to 1080px (the 200px
  // cap in resizeToBase64 is the avatar path, not this one), so the frame is
  // sized in units of min(w,h)/1080 and holds at full resolution.
  const s = Math.min(w, h) / 1080;
  const ink = "#0A0F14", ice = "#FF9E1B", chalk = "#F4F9FA", red = "#00E5FF";
  const pad = 26 * s;

  // ── court black base + faint tactical grid ──
  ctx.fillStyle = "#050709";
  ctx.fillRect(0, 0, w, h);
  ctx.save();
  ctx.strokeStyle = "rgba(0,229,255,.07)";
  ctx.lineWidth = Math.max(1, 1 * s);
  const cell = 46 * s * 2;
  for (let x = 0; x < w; x += cell) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
  for (let y = 0; y < h; y += cell) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
  ctx.restore();

  // ── the photo, cover-fitted into the frame window ──
  const barH = 92 * s;                       // bottom plate
  const iw = w - pad * 2, ih = h - pad * 2 - barH;
  const scale = Math.max(iw / img.width, ih / img.height);
  const dw = img.width * scale, dh = img.height * scale;
  ctx.save();
  ctx.beginPath(); ctx.rect(pad, pad, iw, ih); ctx.clip();
  ctx.drawImage(img, pad + (iw - dw) / 2, pad + (ih - dh) / 2, dw, dh);

  // chromatic tear slices — red pulled left, cyan pushed right
  // No scanlines and no tear slices over the photo — both drew lines
  // straight across the image. The frame carries its identity in the
  // border: corner ticks, the red/cyan edge and the bottom plate.

  // edge falloff so the photo sits into the plate rather than on top of it
  const g = ctx.createLinearGradient(0, pad + ih - 120 * s, 0, pad + ih);
  g.addColorStop(0, "rgba(5,7,9,0)"); g.addColorStop(1, "rgba(5,7,9,.78)");
  ctx.fillStyle = g; ctx.fillRect(pad, pad + ih - 120 * s, iw, 120 * s);
  ctx.restore();

  // ── corner ticks: cyan opens top-left, red closes bottom-right ──
  const tk = 40 * s, tw3 = 4 * s;
  ctx.fillStyle = ice;
  ctx.fillRect(pad, pad, tk, tw3); ctx.fillRect(pad, pad, tw3, tk);
  ctx.fillStyle = red;
  ctx.fillRect(pad + iw - tk, pad + ih - tw3, tk, tw3);
  ctx.fillRect(pad + iw - tw3, pad + ih - tk, tw3, tk);

  // ── bottom plate: emblem, series, URL ──
  const by = h - pad - barH;
  ctx.fillStyle = "rgba(5,7,9,.96)";
  ctx.fillRect(pad, by, iw, barH);
  ctx.fillStyle = red;
  ctx.fillRect(pad, by, iw, 3 * s);

  let tx = pad + 20 * s;
  if (wm) {                                   // emblem, left
    const lh = barH - 30 * s, lw = (wm.width / wm.height) * lh;
    ctx.drawImage(wm, tx, by + 15 * s, lw, lh);
    tx += lw + 18 * s;
  }
  ctx.textAlign = "left"; ctx.textBaseline = "middle";
  ctx.fillStyle = chalk;
  ctx.font = `italic 900 ${30 * s}px 'Archivo', sans-serif`;
  ctx.fillText("SEPTEMBER SURGE", tx, by + barH / 2 - 12 * s);
  ctx.fillStyle = "#8A9BA8";
  ctx.font = `700 ${17 * s}px 'JetBrains Mono', monospace`;
  ctx.fillText("URBAN SOCIAL SERIES \u00B7 VOL.7", tx, by + barH / 2 + 18 * s);

  ctx.textAlign = "right";
  ctx.fillStyle = ice;
  ctx.font = `700 ${19 * s}px 'JetBrains Mono', monospace`;
  ctx.fillText("ATTACK.URBANPADEL.OM", w - pad - 20 * s, by + barH / 2);
}

// Uploads a resized photo to the server for Cloudinary enhancement (brightness/
// contrast/vibrance auto-correct). Returns the enhanced image URL, or null if
// the enhancement call fails — caller falls back to the original photo.
function fileToDataURL(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

async function enhancePhotoOnServer(file, maxW = 1600) {
  let dataUrl = null, forceJpg = false;
  // Try to decode + downscale locally first (keeps the upload small).
  try {
    dataUrl = await new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        URL.revokeObjectURL(url);
        const scale = Math.min(1, maxW / img.width);
        const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", 0.9));
      };
      img.onerror = reject;
      img.src = url;
    });
  } catch (e) {
    // Browser can't decode this file (e.g. HEIC from an iPhone). Send the raw
    // bytes to Cloudinary — it converts them — and force JPEG on the way back
    // so the framing step can render it.
    try { dataUrl = await fileToDataURL(file); forceJpg = true; } catch (e2) { return null; }
  }
  try {
    const res = await fetch(WORKER_URL + "/photo-upload", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + getToken() },
      body: JSON.stringify({ image: dataUrl }),
    });
    const json = await res.json();
    if (!json.ok || !json.url) return null;
    return forceJpg ? json.url.replace("/upload/", "/upload/f_jpg/") : json.url;
  } catch (e) {
    return null;
  }
}

function loadImageEl(src, useCors = false) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    if (useCors) img.crossOrigin = "anonymous";
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

async function watermarkPhotoToBase64(file, maxW = 1080) {
  const wm = await loadJHWatermark();

  const enhancedUrl = await enhancePhotoOnServer(file);
  let srcImg = enhancedUrl ? await loadImageEl(enhancedUrl, true).catch(() => null) : null;
  if (!srcImg) {
    // fall back to decoding the original file directly
    srcImg = await new Promise((resolve) => {
      const fallback = new Image();
      const url = URL.createObjectURL(file);
      fallback.onload = () => { URL.revokeObjectURL(url); resolve(fallback); };
      fallback.onerror = () => { URL.revokeObjectURL(url); resolve(null); };

  // Still couldn't render it for framing — if Cloudinary already hosts it,
  // use that URL unframed so the photo still lands on the wall.
  if (!srcImg) {
    if (enhancedUrl) return enhancedUrl;
    throw new Error("This image format couldn't be read");
  }

  const scale = Math.min(1, maxW / srcImg.width);
  const w = Math.round(srcImg.width * scale), h = Math.round(srcImg.height * scale);
  const canvas = document.createElement("canvas");
  canvas.width = w; canvas.height = h;
  drawAttackPhotoFrame(canvas.getContext("2d"), srcImg, w, h, wm);
  return canvas.toDataURL("image/jpeg", 0.85);
}

  }).sort((a,b)=>b.totalPts-a.totalPts).findIndex(l=>l.id===p.id)+1;
  const badges = getMilestones(entry);
  const totalWins = entry.stats.groupWins + entry.stats.qfWins + entry.stats.sfWins + entry.stats.finalsWon;

  txt += `\n`;
  txt += `📅 ${entry.stats.sessionsPlayed} sessions played\n`;

  if (entry.stats.finalsReached - entry.stats.finalsWon > 0) txt += `🥈 Finalist ×${entry.stats.finalsReached - entry.stats.finalsWon}\n`;

function initState() {

    players: SEED_PLAYERS.map(name => ({ id: uid("p"), name, addedAt: Date.now() })),

function getPlayerTeam(s, pid) { return (s.teams || []).find(t => t.p1Id === pid || t.p2Id === pid); }
function teamWon(m, tid) { if (!m || !m.winner) return false; if (m.winner === "team1") return m.team1Id === tid; if (m.winner === "team2") return m.team2Id === tid; return false; }

// Points baseline for the SERIES leaderboard only: a group of 4 plays 3
// matches, so only each team's best GROUP_COUNTED_GAMES results earn series
// points. A 5-team group therefore drops its lowest game and cannot out-earn a
// group of 4. This does NOT touch the group table below — group standings use
// every match played, so qualification is decided on real results.
const GROUP_COUNTED_GAMES = 3;

function teamGroupResults(session, teamId) {
  const out = [];
  (session.groupMatches || []).forEach(m => {
    if (m.team1Id !== teamId && m.team2Id !== teamId) return;
    if (!m.winner) return;
    const isT1 = m.team1Id === teamId;
    const won = teamWon(m, teamId);
    const lt = m.lossType || "tiebreak";
    out.push({
      pts: won ? 3 : (lt === "tiebreak" ? 2 : lt === "competitive" ? 1 : 0),
      w: won ? 1 : 0,
      gf: m.score ? (isT1 ? m.score.t1 : m.score.t2) : 0,
      ga: m.score ? (isT1 ? m.score.t2 : m.score.t1) : 0,
    });
  });
  const playedActual = out.length;
  out.sort((a, b) => b.pts - a.pts || (b.gf - b.ga) - (a.gf - a.ga) || b.gf - a.gf);
  return { all: out, counted: out.slice(0, GROUP_COUNTED_GAMES), playedActual };
}

// GROUP TABLE — every match played counts. This is the real standing and it is
// what decides top-of-group and who qualifies.
function calcGroupStandings(session, group) {
  const teams = (session.teams || []).filter(t => t.group === group);
  const matchList = session.groupMatches || [];
  const rows = teams.map(team => {
    let pts = 0, wins = 0, played = 0, gf = 0, ga = 0;
    matchList.forEach(m => {
      if (m.team1Id !== team.id && m.team2Id !== team.id) return;
      if (!m.winner) return;
      played++;
      const isT1 = m.team1Id === team.id;
      if (m.score) { gf += isT1 ? m.score.t1 : m.score.t2; ga += isT1 ? m.score.t2 : m.score.t1; }
      if (teamWon(m, team.id)) { pts += 3; wins++; }
      else { const t = m.lossType || "tiebreak"; if (t === "tiebreak") pts += 2; else if (t === "competitive") pts += 1; }
    });
    return { team, pts, wins, played, gf, ga, gd: gf - ga };
  });
  const h2h = {};
  matchList.forEach(m => {
    if (!m.winner) return;
    const wid = m.winner === "team1" ? m.team1Id : m.team2Id;
    const lid = m.winner === "team1" ? m.team2Id : m.team1Id;
    if (!h2h[wid]) h2h[wid] = {};
    h2h[wid][lid] = (h2h[wid][lid] || 0) + 1;
  });
  return rows.sort((a, b) => {
    if (b.wins !== a.wins) return b.wins - a.wins;   // 1) most wins
    if (b.gd !== a.gd) return b.gd - a.gd;           // 2) game difference
    if (b.gf !== a.gf) return b.gf - a.gf;           // 3) games won
    const aH = (h2h[a.team.id]?.[b.team.id] || 0) - (h2h[b.team.id]?.[a.team.id] || 0);
    if (aH !== 0) return -aH;                        // 4) head-to-head
    return b.pts - a.pts;
  });
}

function scoreToResult(s1, s2) {
  if (s1 === s2 || (s1 === null || s2 === null)) return { winner: null, lossType: null };
  const [winScore, loseScore] = s1 > s2 ? [s1, s2] : [s2, s1];
  const lossType = (loseScore <= 1) ? "blowout" : (loseScore === 5) ? "tiebreak" : "competitive";
  return { winner: s1 > s2 ? "team1" : "team2", lossType, score: { t1: s1, t2: s2 } };
}

function getTopOfGroup(s, g) { const ov = s.topOfGroupOverride && s.topOfGroupOverride[g]; if (ov) return ov; const r = calcGroupStandings(s, g); return r[0]?.team?.id || null; }

// Returns standings for a group NORMALISED to the session's smallest group size:
// each team keeps only its best (minGroupSize − 1) results, so every team across
// differently-sized groups is compared on the same number of matches. In a 5/5/4
// session that means everyone is ranked on their best 3 games — the group-of-5
// teams drop their single worst result, the group-of-4 teams are unchanged.
// Used for KNOCKOUT SEEDING only; the displayed group table and leaderboard are
// handled separately.
// KO SEEDING ONLY — when groups are UNEVEN (e.g. 5/5/4) teams have played a
// different number of matches, so ranking them against each other across groups
// is unfair. In that case rank everyone on the smallest group's match count
// (larger groups drop their lowest). Equal-size groups need no adjustment and
// use the real table.
function calcGroupStandingsNormalized(session, group) {
  const teams = (session.teams || []).filter(t => t.group === group);
  const sizes = getSessionGroups(session)
    .map(g => (session.teams || []).filter(t => t.group === g).length)
    .filter(n => n > 0);
  const uneven = sizes.length > 1 && new Set(sizes).size > 1;
  if (!uneven) return calcGroupStandings(session, group);
  const keep = Math.max(1, Math.min(...sizes) - 1);
  const rows = teams.map(team => {
    const best = teamGroupResults(session, team.id).all.slice(0, keep);
    let pts = 0, wins = 0, gf = 0, ga = 0;
    best.forEach(r => { pts += r.pts; wins += r.w; gf += r.gf; ga += r.ga; });
    return { team, pts, wins, played: best.length, gf, ga, gd: gf - ga };
  });
  return rows.sort((a, b) => b.wins - a.wins || b.gd - a.gd || b.gf - a.gf || b.pts - a.pts);
}

// Equalizes 3rd-place entries for cross-group comparison by adding ghost BYE wins
// (+3 pts each) for teams in smaller groups to normalize to the largest group's match count.
function equalizeThirds(thirds, session) {
  const groups = getSessionGroups(session);
  const groupSizes = {};
  groups.forEach(g => { groupSizes[g] = (session.teams || []).filter(t => t.group === g).length; });
  const maxPerTeam = Math.max(...Object.values(groupSizes)) - 1;
  return thirds.map(t => {
    const g = (session.teams || []).find(tm => tm.id === t.id)?.group;
    const missing = maxPerTeam - ((groupSizes[g] || maxPerTeam + 1) - 1);
    // Ghost BYE win: +1 win, +6 games for (notional 6-0), +6 GD
    return { ...t, wins: t.wins + missing, gd: (t.gd || 0) + missing * 6, gf: (t.gf || 0) + missing * 6, ghostWins: missing };
  });
}

// Compare two thirds entries: wins ▶ GD ▶ GF (padel tiebreaker order)
function compareThirds(a, b) {
  return b.wins - a.wins || b.gd - a.gd || b.gf - a.gf;
}

// Standard 8-team knockout pairing: 1v8, 4v5, 3v6, 2v7 — in that slot order,
// so the top two seeds sit in opposite halves and can only meet in the final.
// The seeding transparency panel reads the same table, so the two never drift.
const SEED_PAIRS = [[0, 7], [3, 4], [2, 5], [1, 6]];

// Builds the QF pairing from tiers of qualifiers, in strict tier order:
// every group winner outranks every runner-up, every runner-up outranks
// every third. Seeds 1..8 are just the flattened tiers, so seed 1 is the
// best 1st and seed 8 the weakest last-tier qualifier. Callers sort each
// tier internally with compareThirds (wins ▶ GD ▶ GF) — never by points,
// which include consolation scoring for close losses and so measure
// participation rather than strength.
//
// If a pairing would rematch two teams that already met in the group stage,
// it's resolved by swapping seats WITHIN one tier (a 2nd trades places with
// another 2nd), so a clash fix can never promote a team above a tier it
// didn't earn, and 1v8 stays 1v8.
function seedStandardBracket(tiers) {
  const seeded = tiers.flat();
  if (seeded.length !== 8) return null;
  const bounds = [];
  let off = 0;
  tiers.forEach(t => { bounds.push([off, off + t.length]); off += t.length; });
  const tierOf = (i) => bounds.findIndex(([lo, hi]) => i >= lo && i < hi);
  // A still-undecided slot (thirds-playoff winner) has no group yet, so it
  // can't clash — treat it as compatible with everyone.
  const grp = (x) => x?.group || (/^[A-Z]\d$/.test(x?.seed || "") ? x.seed[0] : null);
  const partnerOf = (i) => { const p = SEED_PAIRS.find(pr => pr[0] === i || pr[1] === i); return p[0] === i ? p[1] : p[0]; };

  for (const [x, y] of SEED_PAIRS) {
    const gx = grp(seeded[x]), gy = grp(seeded[y]);
    if (!gx || !gy || gx !== gy) continue;
    const [lo, hi] = bounds[tierOf(y)];
    for (let k = lo; k < hi; k++) {
      if (k === y) continue;
      // Swapping y and k must leave BOTH pairings clash-free.
      if (grp(seeded[k]) !== gx && grp(seeded[y]) !== grp(seeded[partnerOf(k)])) {
        const t = seeded[y]; seeded[y] = seeded[k]; seeded[k] = t;
        break;
      }
    }
  }
  return SEED_PAIRS.map(([x, y], i) => ({ slot: i + 1, a: seeded[x], b: seeded[y] }));
}

function calcStreak(idxs) {
  if (!idxs?.length) return 0;
  const sorted = [...idxs].sort((a, b) => a - b);
  let total = 0, len = 0, last = null;
  for (const i of sorted) {
    if (last === null || i === last + 1) len++; else len = 1;
    last = i;
    // len=1: no bonus (first session alone doesn't count)
    // len=2: +1, len=3: +1, len=4: jackpot +3
    if (len === 2 || len === 3) total += 1;
    else if (len >= 4) total += 3;
  }
  return Math.min(total, 5);
}

function koMatchPts(match, teamId) {
  if (teamWon(match, teamId)) return 3;
  const t = match.lossType || "tiebreak";
  return t === "tiebreak" ? 2 : t === "competitive" ? 1 : 0;
}

function calcPlayerStats(pid, sessions) {
  let total = 0;
  const breakdown = { matchPts: 0, topOfGroup: 0, knockoutPts: 0, streakPts: 0, comebackPts: 0 };
  const stats = { groupWins: 0, groupPlayed: 0, sessionsPlayed: 0, qfReached: 0, qfWins: 0, sfReached: 0, sfWins: 0, finalsReached: 0, finalsWon: 0 };
  const attended = [];
  const partners = {};
  sessions.forEach((s, idx) => {
    const team = getPlayerTeam(s, pid); if (!team) return;
    stats.sessionsPlayed++;
    const partnerId = team.p1Id === pid ? team.p2Id : team.p1Id;
    partners[partnerId] = (partners[partnerId] || 0) + 1;
    // 2X Double Points (applies to everything except streak)
    const mult = s.doublePoints ? 2 : 1;
    let sessionPlayed = 0;
    // Group scoring is normalised to the group-of-4 baseline: only each team's
    // best GROUP_COUNTED_GAMES (3) results count toward series points, so a
    // 5-team group (4 matches) drops its lowest and the maximum matches a group
    // of 4. Win/played records below stay actual. Knockout and playoff matches
    // are not group matches, so they never enter this calculation.
    (s.groupMatches || []).forEach(m => {
      if (m.team1Id !== team.id && m.team2Id !== team.id) return;
      if (!m.winner) return;
      stats.groupPlayed++; sessionPlayed++;
      if (teamWon(m, team.id)) stats.groupWins++;
    });
    teamGroupResults(s, team.id).counted.forEach(r => {
      total += r.pts * mult; breakdown.matchPts += r.pts * mult;
    });
    // Only award top-of-group if team actually played matches
    if (sessionPlayed > 0 && getTopOfGroup(s, team.group) === team.id) { total += 1 * mult; breakdown.topOfGroup += 1 * mult; }
    // Only count streak if player actually played a match this session
    if (sessionPlayed > 0) {
      // Comeback bonus: +2 for returning after missing 2+ consecutive sessions
      if (attended.length > 0 && (idx - attended[attended.length - 1]) >= 3) {
        total += 2; breakdown.comebackPts += 2;
      }
      attended.push(idx);
    }
    const qfM = s.bracket?.qf?.find(m => (m.team1Id === team.id || m.team2Id === team.id) && m.winner);
    if (qfM) { stats.qfReached++; if (teamWon(qfM, team.id)) stats.qfWins++; const qp = (1 + koMatchPts(qfM, team.id)) * mult; total += qp; breakdown.knockoutPts += qp; }
    const sfM = s.bracket?.sf?.find(m => (m.team1Id === team.id || m.team2Id === team.id) && m.winner);
    if (sfM) { stats.sfReached++; if (teamWon(sfM, team.id)) stats.sfWins++; const sp = (2 + koMatchPts(sfM, team.id)) * mult; total += sp; breakdown.knockoutPts += sp; }
    const f = s.bracket?.final;
    if (f && (f.team1Id === team.id || f.team2Id === team.id) && f.winner) {
      stats.finalsReached++;
      const fp = (3 + koMatchPts(f, team.id) + (teamWon(f, team.id) ? 5 : 0)) * mult;
      total += fp; breakdown.knockoutPts += fp;
      if (teamWon(f, team.id)) stats.finalsWon++;
    }
  });
  const streak = calcStreak(attended); total += streak; breakdown.streakPts = streak;
  return { totalPts: total, breakdown, stats, attended, partners };
}

// Last n decided results for a player across the series (most recent last),
// as 'W'/'L'. Used for the form strip and hot-streak detection.
function recentForm(pid, sessions, n = 5) {
  const res = [];
  sessions.forEach(s => {
    const team = getPlayerTeam(s, pid); if (!team) return;
    (s.groupMatches || []).forEach(m => {
      if ((m.team1Id === team.id || m.team2Id === team.id) && m.winner) res.push(teamWon(m, team.id) ? "W" : "L");
    });
    ["qf", "sf"].forEach(r => {
      const km = s.bracket?.[r]?.find(m => (m.team1Id === team.id || m.team2Id === team.id) && m.winner);
      if (km) res.push(teamWon(km, team.id) ? "W" : "L");
    });
    const f = s.bracket?.final;
    if (f && (f.team1Id === team.id || f.team2Id === team.id) && f.winner) res.push(teamWon(f, team.id) ? "W" : "L");
  });
  return res.slice(-n);
}

// Current win streak (trailing W count) from a form array.
function currentStreak(form) {
  let n = 0;
  for (let i = form.length - 1; i >= 0; i--) { if (form[i] === "W") n++; else break; }
  return n;
}

function getLockedPartners(pid, sessions) {
  const locked = new Set();
  sessions.forEach(s => {
    const team = getPlayerTeam(s, pid); if (!team) return;
    const partnerId = team.p1Id === pid ? team.p2Id : team.p1Id;
    // Lock only if they WON the final together (session champions)
    const wonFinal = s.bracket?.final && teamWon(s.bracket.final, team.id);
    if (wonFinal) locked.add(partnerId);
  });
  return locked;
}

function Pill({ children, color = "orange" }) {
  const bg = { orange:"var(--orange)", red:"var(--red)", amber:"var(--blue)", blue:"var(--blue)", stone:"rgba(255,247,232,.2)", green:"#00E5FF" };
  const tc = { orange:"var(--cream)", red:"var(--cream)", amber:"var(--ink)", blue:"var(--ink)", stone:"var(--cream)", green:"var(--ink)" };
  return <span style={{display:"inline-flex",alignItems:"center",gap:4,padding:"3px 10px 1px",background:bg[color]||bg.orange,color:tc[color]||"var(--cream)",border:"1px solid rgba(244,249,250,.14)",boxShadow:"none",borderRadius:0,fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900",fontSize:"14px",letterSpacing:"1px",whiteSpace:"nowrap"}}>{children}</span>;
}

function Btn({ children, onClick, variant = "primary", size = "md", className = "", disabled, type = "button" }) {
  const styles = {
    primary: { background:"var(--red)", color:"var(--cream)", border:"1px solid rgba(244,249,250,.10)", boxShadow:"none", borderRadius:0, fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize:"20px", letterSpacing:"2px", paddingTop:"10px", paddingBottom:"6px", paddingLeft:"20px", paddingRight:"20px" },
    secondary: { background:"rgba(20,24,36,.85)", color:"#F4F9FA", border:"1px solid rgba(244,249,250,.10)", boxShadow:"none", borderRadius:0, fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize:"18px", letterSpacing:"1.5px", paddingTop:"8px", paddingBottom:"4px", paddingLeft:"16px", paddingRight:"16px" },
    ghost: { background:"transparent", color:"var(--blue)", border:"3px solid var(--blue)", boxShadow:"none", borderRadius:0, fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize:"18px", letterSpacing:"1.5px", paddingTop:"8px", paddingBottom:"4px", paddingLeft:"16px", paddingRight:"16px" },
    danger: { background:"var(--red)", color:"var(--cream)", border:"1px solid rgba(244,249,250,.10)", boxShadow:"none", borderRadius:0, fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize:"18px", letterSpacing:"1.5px", paddingTop:"8px", paddingBottom:"4px", paddingLeft:"14px", paddingRight:"14px" },
    gold: { background:"rgba(255,158,27,.14)", color:"#F4F9FA", border:"1px solid rgba(244,249,250,.10)", boxShadow:"none", borderRadius:0, fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize:"20px", letterSpacing:"2px", paddingTop:"10px", paddingBottom:"6px", paddingLeft:"20px", paddingRight:"20px" },
  };
  return <button type={type} onClick={onClick} disabled={disabled} className={`inline-flex items-center justify-center gap-2 ${className}`} style={{...styles[variant]||styles.primary,opacity:disabled?.5:1,cursor:disabled?"not-allowed":"pointer",transition:"transform .1s, box-shadow .1s"}} onMouseEnter={e=>{if(!disabled){e.currentTarget.style.transform="translate(-2px,-2px)";e.currentTarget.style.boxShadow="none";}}} onMouseLeave={e=>{e.currentTarget.style.transform="";e.currentTarget.style.boxShadow=styles[variant]?.boxShadow||"none";}} onMouseDown={e=>{e.currentTarget.style.transform="translate(3px,3px)";e.currentTarget.style.boxShadow="none";}} onMouseUp={e=>{e.currentTarget.style.transform="";e.currentTarget.style.boxShadow=styles[variant]?.boxShadow||"none";}}>{children}</button>;

function Input({ value, onChange, placeholder, className = "", type = "text", autoFocus }) {

// ── YOUR STANDING ────────────────────────────────────────────────────────
// The first thing on HOME once the phone knows who it belongs to. Answers
// "where do I stand" without a scroll: rank, points, movement since the last
// session, and the gap to the place above.
function YourStanding({ leaderboard, state, meId, onOpenPicker, setTab }) {
  const played = leaderboard.filter(hasPlayedEntry);

  // Rank a session ago, so movement is real rather than decorative. Same
  // method the RANK tab uses: rebuild the table over sessions minus the last.
  const prevRank = useMemo(() => {
    const ss = state.sessions || [];
    if (ss.length < 2) return null;
    const board = state.players
      .map(pl => ({ id: pl.id, s: calcPlayerStats(pl.id, ss.slice(0, -1)) }))
      .filter(e => e.s.stats.groupPlayed > 0 || e.s.stats.qfReached > 0)
      .sort((a, b) => b.s.totalPts - a.s.totalPts);
    const m = {}; board.forEach((e, i) => { m[e.id] = i + 1; });
    return m;
  }, [state.players, state.sessions]);

  if (!meId || !played.some(e => e.player.id === meId)) {
    return (
      <button onClick={onOpenPicker}
        style={{width:"100%",display:"flex",alignItems:"center",justifyContent:"space-between",gap:12,
                background:"rgba(20,24,36,.92)",border:"1px solid rgba(0,229,255,.35)",borderRadius:0,
                padding:"16px 16px 14px",cursor:"pointer",textAlign:"left"}}>
        <span>
          <span style={{display:"block",fontFamily:"'JetBrains Mono',monospace",fontWeight:700,fontSize:10,
                        letterSpacing:".22em",color:"#00E5FF"}}>YOUR STANDING</span>
          <span style={{display:"block",marginTop:6,fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900",fontSize:24,letterSpacing:1,
                        color:"#F4F9FA",lineHeight:1}}>WHICH ONE ARE YOU?</span>
          <span style={{display:"block",marginTop:6,fontFamily:"'Archivo',sans-serif",fontSize:12,color:"#8A9BA8"}}>
            Tap once to follow your own rank</span>
        </span>
        <span style={{flex:"0 0 auto",fontFamily:"'JetBrains Mono',monospace",fontWeight:700,fontSize:20,
                      color:"#00E5FF"}}>&rarr;</span>
      </button>
    );
  }

  const i    = played.findIndex(e => e.player.id === meId);
  const me   = played[i];
  const rank = i + 1;
  const above = i > 0 ? played[i - 1] : null;
  const gap   = above ? above.totalPts - me.totalPts : 0;
  const was   = prevRank ? prevRank[meId] : null;
  const delta = (was && was !== rank) ? was - rank : 0;

  const box = { flex:1, background:"rgba(10,15,20,.55)", border:"1px solid rgba(244,249,250,.08)",
                padding:"10px 8px 9px", textAlign:"center" };
  const num = { fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", fontSize:26, lineHeight:1, color:"#F4F9FA" };
  const cap = { display:"block", marginTop:5, fontFamily:"'JetBrains Mono',monospace", fontWeight:700,
                fontSize:9, letterSpacing:".14em", color:"#8A9BA8" };

  return (
    <div style={{background:"rgba(20,24,36,.92)",border:"1px solid rgba(0,229,255,.35)",
                 borderRadius:0,padding:"14px 14px 13px"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,marginBottom:10}}>
        <span style={{fontFamily:"'JetBrains Mono',monospace",fontWeight:700,fontSize:10,
                      letterSpacing:".22em",color:"#00E5FF"}}>YOUR STANDING</span>
        <button onClick={onOpenPicker}
          style={{background:"none",border:"none",cursor:"pointer",padding:"2px 0",
                  fontFamily:"'JetBrains Mono',monospace",fontWeight:700,fontSize:10,
                  letterSpacing:".14em",color:"#8A9BA8"}}>NOT YOU?</button>
      </div>

      <div onClick={() => setTab("leaderboard")} style={{display:"flex",alignItems:"baseline",gap:10,cursor:"pointer"}}>
        <span style={{fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900",fontSize:52,lineHeight:.85,color:"#00E5FF"}}>
          {rank}<span style={{fontSize:20,color:"#8A9BA8"}}>{rank===1?"st":rank===2?"nd":rank===3?"rd":"th"}</span></span>
        <span style={{flex:1,minWidth:0,fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900",fontSize:23,letterSpacing:.5,color:"#F4F9FA",
                      lineHeight:1.05,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
          {me.player.name.toUpperCase()}</span>
      </div>

      <div style={{display:"flex",gap:8,marginTop:12}}>
        <div style={box}><span style={num}>{me.totalPts}</span><span style={cap}>POINTS</span></div>
        <div style={box}>
          <span style={{...num, color: delta > 0 ? "#00E5FF" : delta < 0 ? "#00E5FF" : "#8A9BA8"}}>
            {delta > 0 ? "\u25B2" + delta : delta < 0 ? "\u25BC" + Math.abs(delta) : "\u2013"}</span>
          <span style={cap}>SINCE LAST</span>
        </div>
        <div style={box}>
          <span style={num}>{above ? gap : "\u2013"}</span>
          <span style={cap}>{above ? "BEHIND " + rank_ordinal(rank - 1) : "TOP SPOT"}</span>
        </div>
      </div>
    </div>
  );
}
function rank_ordinal(n) { return n + (n===1?"ST":n===2?"ND":n===3?"RD":"TH"); }

// ── "Which one are you?" ──────────────────────────────────────────────────
// Searchable because 73 names is too many to scan, and a shared phone needs
// to be able to switch without clearing storage by hand.
function MePicker({ leaderboard, meId, onPick, onClear, onClose }) {
  const [q, setQ] = useState("");
  const played = leaderboard.filter(hasPlayedEntry);
  const shown = q ? played.filter(e => e.player.name.toLowerCase().includes(q.toLowerCase())) : played;
  return (
    <Modal open={true} onClose={onClose} title="WHICH ONE ARE YOU?">
      <div style={{fontFamily:"'Archivo',sans-serif",fontSize:13,lineHeight:1.5,color:"#8A9BA8",marginBottom:14}}>
        Saved on this phone only. No account, and it never unlocks scoring.
      </div>
      <input value={q} onChange={e => setQ(e.target.value)} placeholder="Search your name"
        style={{width:"100%",background:"rgba(10,15,20,.9)",border:"1px solid rgba(244,249,250,.14)",
                color:"#F4F9FA",padding:"12px 14px",fontFamily:"'Archivo',sans-serif",fontSize:15,
                outline:"none",borderRadius:0,marginBottom:12}} />
      <div style={{maxHeight:"46vh",overflowY:"auto",WebkitOverflowScrolling:"touch"}}>
        {shown.map((e, i) => {
          const mine = e.player.id === meId;
          return (
            <button key={e.player.id} onClick={() => onPick(e.player.id)}
              style={{width:"100%",display:"flex",alignItems:"center",gap:12,textAlign:"left",
                      background: mine ? "rgba(0,229,255,.12)" : "rgba(10,15,20,.6)",
                      border:"1px solid " + (mine ? "rgba(0,229,255,.5)" : "rgba(244,249,250,.08)"),
                      borderRadius:0,padding:"11px 12px",marginBottom:6,cursor:"pointer"}}>
              <span style={{flex:"0 0 auto",width:34,textAlign:"right",fontFamily:"'JetBrains Mono',monospace",
                            fontWeight:700,fontSize:12,color:"#8A9BA8"}}>{played.indexOf(e) + 1}</span>
              <span style={{flex:1,minWidth:0,fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900",fontSize:19,letterSpacing:.5,
                            color:"#F4F9FA",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                {e.player.name.toUpperCase()}</span>
              <span style={{flex:"0 0 auto",fontFamily:"'JetBrains Mono',monospace",fontWeight:700,
                            fontSize:12,color:"#8A9BA8"}}>{e.totalPts} PTS</span>
            </button>
          );
        })}
        {shown.length === 0 && (
          <div style={{padding:"18px 4px",fontFamily:"'Archivo',sans-serif",fontSize:14,color:"#8A9BA8"}}>
            No one by that name has played yet.
          </div>
        )}
      </div>
      {meId && (
        <button onClick={onClear}
          style={{marginTop:12,width:"100%",background:"none",border:"1px solid rgba(244,249,250,.14)",
                  color:"#8A9BA8",padding:"11px",fontFamily:"'JetBrains Mono',monospace",fontWeight:700,
                  fontSize:11,letterSpacing:".16em",cursor:"pointer",borderRadius:0}}>
          NOT ME — FORGET THIS PHONE
        </button>
      )}
    </Modal>
  );
}

function Modal({ open, onClose, title, children }) {
  if (!open) return null;
  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4" onClick={onClose} style={{background:"rgba(11,8,20,.85)"}}>
      <div onClick={e => e.stopPropagation()} style={{position:"relative",width:"100%",maxWidth:520,background:"rgba(20,24,36,.85)",border:"1px solid rgba(244,249,250,.10)",boxShadow:"none",borderRadius:0,maxHeight:"90vh",overflowY:"auto"}}>
        <div style={{position:"sticky",top:0,background:"rgba(20,24,36,.85)",borderBottom:"1px solid rgba(244,249,250,.10)",padding:"14px 20px",display:"flex",alignItems:"center",justifyContent:"space-between",zIndex:10}}>
          <h2 style={{fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900",fontSize:"28px",letterSpacing:"2px",color:"#F4F9FA"}}>{title}</h2>
          <button onClick={onClose} style={{background:"none",border:"none",cursor:"pointer",color:"#F4F9FA",padding:4}}><I.x size={22} /></button>
        </div>
        <div style={{padding:20}}>{children}</div>
      </div>
    </div>
  );
}

function PlayerPicker({ players, value, onChange, exclude = [], placeholder = "Pick player" }) {
  const [open, setOpen] = useState(false);
  const [search, setSearch] = useState("");
  const ref = useRef();
  useEffect(() => { const h = e => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); }; document.addEventListener("mousedown", h); return () => document.removeEventListener("mousedown", h); }, []);
  const sel = players.find(p => p.id === value);
  const avail = players.filter(p => !exclude.includes(p.id) && (!search || p.name.toLowerCase().includes(search.toLowerCase())));
  return (
    <div className="relative" ref={ref}>
      <button type="button" onClick={() => setOpen(!open)} className="w-full bg-stone-900 border border-stone-700 rounded-lg px-3 py-2.5 text-left flex items-center justify-between">
        <span className={sel ? "text-stone-100" : "text-stone-500"}>{sel?.name || placeholder}</span>
        <I.chev size={16} className={`transition-transform ${open ? "rotate-90" : ""}`} />
      </button>
      {open && (
        <div className="absolute z-20 mt-1 w-full bg-stone-900 border border-stone-700 rounded-lg shadow-2xl max-h-64 overflow-y-auto">
          <div className="sticky top-0 bg-stone-900 p-2 border-b border-stone-800">
            <div className="relative">
              <I.search size={14} className="absolute left-2.5 top-1/2 -translate-y-1/2 text-stone-500" />
              <input autoFocus value={search} onChange={e => setSearch(e.target.value)} placeholder="Search…" className="w-full bg-stone-800 rounded-md pl-8 pr-2 py-1.5 text-sm text-stone-100 focus:outline-none" />
            </div>
          </div>
          {avail.length === 0 ? <div className="px-3 py-4 text-sm text-stone-500 text-center">No players found</div>
            : avail.map(p => <button key={p.id} type="button" onClick={() => { onChange(p.id); setOpen(false); setSearch(""); }} className="w-full text-left px-3 py-2 hover:bg-stone-800 text-stone-100 text-sm border-b border-stone-800/50 last:border-0">{p.name}</button>)}
        </div>
      )}
    </div>
  );
}

function Avatar({ player, size = 40, className = "", ring = null }) {
  const initials = (player.name || "?").split(" ").map(n => n[0]).join("").slice(0, 2).toUpperCase();
  const [imgErr, setImgErr] = useState(false);
  const border = Math.max(2, Math.round(size * 0.07));
  const ringStyle = ring ? { boxShadow: `${border}px ${border}px 0 var(--ink), 0 0 0 ${Math.max(2, Math.round(size*0.05))}px ${ring}` } : { boxShadow: `${border}px ${border}px 0 var(--ink)` };
  const commonStyle = { width: size, height: size, flexShrink: 0, border: `${border}px solid var(--ink)`, borderRadius: 0, ...ringStyle };
  if (player.photoUrl && !imgErr) {
    return <img src={player.photoUrl} alt={player.name} onError={() => setImgErr(true)}
      className={`object-cover shrink-0 ${className}`}
      style={{ ...commonStyle, objectPosition: "center 28%" }} />;  // bias crop toward faces (upper third)
  }
  // Deterministic tinted initials background instead of flat black, so avatars
  // without photos still read as distinct people.
  const palette = ["#1467A8", "#B31414", "#1F8A24", "#C77800", "#6B2FB3", "#0E7C7B"];
  const tint = palette[Math.abs((player.id || player.name || "").split("").reduce((a, c) => a + c.charCodeAt(0), 0)) % palette.length];
  return (
    <div className={`flex items-center justify-center shrink-0 font-bold ${className}`}
      style={{ ...commonStyle, background: tint, color: "var(--cream)", fontSize: size * 0.36, fontFamily:"'Archivo',sans-serif",fontStyle:"italic",fontVariationSettings:"'wdth' 125,'wght' 900", letterSpacing: "1px", textShadow: "none" }}>
      {initials}
    </div>
  );
}

// Small W/L form strip, shared by the rankings and player profile.
function FormStrip({ form }) {
  return <span style={{ display: "inline-flex", gap: 2 }}>
    {form.map((r, i) => <span key={i} title={r === "W" ? "Win" : "Loss"} style={{ width: 12, height: 12, borderRadius: 2, background: r === "W" ? "#1F8A24" : "#C0392B", color: "#fff", fontSize: 8, fontWeight: "bold", display: "inline-flex", alignItems: "center", justifyContent: "center", fontFamily: "Verdana,sans-serif" }}>{r}</span>)}
  </span>;
}

function App() {
  const [state, setState] = useState(null);
  const [tab, setTab] = useState("dashboard");
  const [openSessionId, setOpenSessionId] = useState(null);
  const [openPlayerId, setOpenPlayerId] = useState(null);
  const [role, setRole] = useState(() => { const r = localStorage.getItem(ADMIN_KEY); return r === "yes" ? "admin" : (r === "admin" || r === "scorer" || r === "photographer") ? r : "guest"; });
  const isAdmin = role === "admin";
  const canScore = role === "admin" || role === "scorer";
  const canUploadPhotos = role === "admin" || role === "scorer" || role === "photographer";
  const [showLogin, setShowLogin] = useState(false);
  // Who this phone belongs to. Deliberately separate from `role`: identity
  // personalises the view, the token authorises changes.
  const [meId, setMeId] = useState(getMe);
  const [showMe, setShowMe] = useState(false);
  const pickMe  = (id) => { setMeId(id); saveMe(id); setShowMe(false); };
  const clearMe = ()   => { setMeId(""); saveMe(""); setShowMe(false); };
  const [theme, setTheme] = useState(() => localStorage.getItem("jh-theme") || "dark");
  const [sync, setSync] = useState("idle");
  const [syncErr, setSyncErr] = useState("");
  const saveTimer = useRef();
  const retryTimer = useRef();
  const savedFlash = useRef();
  const pollTimer = useRef();
  const initialLoaded = useRef(false);
  const stateRef = useRef(null);
  const tapRef = useRef({ n: 0, t: 0 });

  useEffect(() => {
    const root = document.documentElement;
    if (theme === "light") root.classList.add("light"); else root.classList.remove("light");
    localStorage.setItem("jh-theme", theme);
    // this paints the browser/OS chrome around the app. It was pinned to cyan
    // regardless of theme — wrong in both modes, and cyan is the support
    // colour here, not the brand one.
    document.querySelector('meta[name="theme-color"]')?.setAttribute("content", theme === "light" ? "#F4F9FA" : "#0A0F14");
  }, [theme]);

  // Secret sign-in: tap brand logo 5× within 2.5s
  const secretTap = () => {
    const now = Date.now();
    const r = tapRef.current;
    r.n = (now - r.t < 2500) ? r.n + 1 : 1;
    r.t = now;
    if (r.n >= 5) { r.n = 0; setShowLogin(true); }
  };

  useEffect(() => {
    (async () => {
      try {
        const res = await apiGet("getState");
        if (res?.ok && res.state) {
          setState(res.state);
          try { localStorage.setItem(LOCAL_KEY, JSON.stringify(stateForLocalCache(res.state))); } catch (lsErr) {}
          setSync("idle");
          initialLoaded.current = true;
          document.getElementById("splash")?.remove();
          return;
        }
      } catch (e) { setSync("offline"); }
      try {
        const cached = localStorage.getItem(LOCAL_KEY);
        setState(cached ? JSON.parse(cached) : initState());
      } catch (e) { setState(initState()); }
      initialLoaded.current = true;
      document.getElementById("splash")?.remove();
    })();
  }, []);

  useEffect(() => {
    if (!state || !initialLoaded.current) return;
    stateRef.current = state;
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify(stateForLocalCache(state))); } catch (e) {}
    if (!canScore) return;
    clearTimeout(saveTimer.current);
    clearTimeout(retryTimer.current);
    setSync("syncing");
    const attempt = (tryNo) => {
      saveTimer.current = setTimeout(async () => {
        try {
          const res = await apiPost({ action: "saveState", state: stateRef.current });
          setSync("saved"); setSyncErr("");
          // brief "Saved ✓" flash, then settle to idle if nothing else queued
          clearTimeout(savedFlash.current);
          savedFlash.current = setTimeout(() => setSync(s => s === "saved" ? "idle" : s), 1500);
          if (res && res.merged && res.mergedState) {
            setState(prev => reattachPhotos(res.mergedState, prev));
          }
        } catch (e) {
          setSync("error"); setSyncErr(e.message || "Unknown sync error");
          if (!getToken()) { setShowLogin(true); return; }  // wait for re-login flush
          // Auto-retry with capped backoff so a transient failure self-heals
          // without the scorer having to touch anything.
          const delay = Math.min(30000, 4000 * Math.pow(2, tryNo));
          retryTimer.current = setTimeout(() => { setSync("syncing"); attempt(tryNo + 1); }, delay);
        }
      }, tryNo === 0 ? 3000 : 0);
    };
    attempt(0);
  }, [state, canScore]);

  useEffect(() => {
    if (canScore) return;
    pollTimer.current = setInterval(async () => {
      try {
        const res = await apiGet("getState");
        if (res?.ok && res.state) {
          setState(s => (JSON.stringify(s) !== JSON.stringify(res.state) ? res.state : s));
          setSync("idle");
        }
      } catch (e) { setSync("offline"); }
    }, 30000);
    return () => clearInterval(pollTimer.current);
  }, [canScore]);

  const handleLogin = async (pin) => {
    try {
      const r = await apiGet("unlock", { pin });
      if (r?.ok && r.role) {
        setRole(r.role); localStorage.setItem(ADMIN_KEY, r.role); setShowLogin(false);
        // Flush any changes that failed to save while the session was expired.
        if ((r.role === "admin" || r.role === "scorer") && state) {
          setSync("syncing");
          try { await apiPost({ action: "saveState", state }); setSync("idle"); setSyncErr(""); }
          catch (e) { setSync("error"); setSyncErr(e.message || "Sync failed"); }
        }
        return true;
      }
      return false;
    } catch (e) { return false; }
  };
  const logout = () => { setRole("guest"); localStorage.removeItem(ADMIN_KEY); setToken(""); if (tab === "players" || tab === "settings") setTab("dashboard"); };

  if (!state) return null;

  const isPublicMode = new URLSearchParams(window.location.search).has("public");
  const isPhotosMode = new URLSearchParams(window.location.search).has("photos");
  const update = (fn) => setState(s => fn({ ...s }));
  const updateSession = (sid, fn) => setState(s => ({ ...s, sessions: s.sessions.map(ss => ss.id === sid ? fn({ ...ss }) : ss) }));
  const leaderboard = state.players.map(p => {
    const s = calcPlayerStats(p.id, state.sessions);
    const prevSum = Object.values(p.prevSeriesPts || {}).reduce((a, b) => a + (Number(b) || 0), 0) + (p.prevSeriesPoints || 0);
    return { player: p, ...s, lifetimePts: s.totalPts + prevSum };
  }).sort((a, b) => b.totalPts - a.totalPts);
  const currentSession = state.sessions.find(s => s.id === openSessionId);

  if (isPublicMode) return <PublicLeaderboardPage state={state} leaderboard={leaderboard} />;
  if (isPhotosMode) return <PublicPhotosPage state={state} />;

  const navTabs = [
    { id: "dashboard", icon: I.flame, label: "HOME" },
    { id: "sessions", icon: I.calendar, label: "SESSIONS" },
    { id: "leaderboard", icon: I.trophy, label: "RANK" },
    ...(isAdmin ? [{ id: "players", icon: I.users, label: "PLAYERS" }] : []),
  ];

  return (
    <div className="min-h-screen">
      <div className="court-motif" />
      {canScore && (sync === "error" || sync === "offline") && (
        <div onClick={() => { if (!getToken()) setShowLogin(true); }} style={{ position: "sticky", top: 0, zIndex: 50, background: "#00E5FF", color: "#fff", padding: "10px 14px", textAlign: "center", fontWeight: 800, fontSize: 13, letterSpacing: ".3px", cursor: "pointer", boxShadow: "0 2px 10px rgba(0,0,0,.5)" }}>
          ⚠️ NOT SAVING — your changes are only on this device.{" "}
          {getToken() ? "Reconnecting…" : "Tap here to sign in again"}
          {syncErr ? ` (${syncErr})` : ""}
        </div>
      )}
      <header className="sticky top-0 z-30 backdrop-blur-xl border-b border-stone-800/80" style={{ background: "rgba(10,10,10,0.92)" }}>
        <div className="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
          <div className="flex items-center gap-3 min-w-0">
            <button onClick={secretTap} className="shrink-0" aria-label="September Surge" style={{lineHeight:0}}>
              <img src={UP_LOGO_FULL} style={{height:64,width:"auto",display:"block",margin:"-8px 0",filter:"drop-shadow(0 0 10px rgba(0,229,255,.5)) drop-shadow(0 0 14px rgba(0,229,255,.4))"}} alt="September Surge" />
            </button>
          </div>
          <div className="flex items-center gap-1 shrink-0">
            {canScore && <SyncIndicator status={sync} errMsg={syncErr} />}
            
            {canScore && (
              <button onClick={() => isAdmin ? setTab("settings") : logout()} className="flex items-center gap-1.5 pl-2 pr-2.5 py-1.5 rounded-lg" style={{ background: isAdmin ? "rgba(0,229,255,.14)" : "rgba(255,158,27,.14)", border: `1px solid ${isAdmin ? "rgba(0,229,255,.3)" : "rgba(255,158,27,.3)"}` }} aria-label={isAdmin ? "Settings" : "Sign out scorer"}>
                {isAdmin ? <I.shield size={14} className="text-orange-400" /> : <I.whistle size={14} className="text-blue-400" />}
                <span className="text-[10px] font-bold uppercase tracking-wider" style={{ color: isAdmin ? "var(--orange-br)" : "var(--blue)" }}>{isAdmin ? "Admin" : "Scorer"}</span>
              </button>
            )}
          </div>
        </div>
      </header>

      <main className="max-w-3xl mx-auto px-4 py-4 pb-24">
        {tab === "dashboard" && <DashboardView state={state} leaderboard={leaderboard} setTab={setTab} setOpenSessionId={setOpenSessionId} isAdmin={isAdmin} meId={meId} onOpenPicker={() => setShowMe(true)} />}
        {tab === "players" && isAdmin && <PlayersView state={state} update={update} setOpenPlayerId={setOpenPlayerId} isAdmin={isAdmin} />}
        {tab === "sessions" && <SessionsView state={state} update={update} setOpenSessionId={setOpenSessionId} isAdmin={isAdmin} leaderboard={leaderboard} setTab={setTab} />}
        {tab === "leaderboard" && <LeaderboardView leaderboard={leaderboard} state={state} setOpenPlayerId={setOpenPlayerId} meId={meId} onOpenPicker={() => setShowMe(true)} />}
        {tab === "settings" && isAdmin && <SettingsView state={state} update={update} setTab={setTab} logout={logout} />}
      </main>

      <nav className="fixed bottom-0 inset-x-0 z-30 border-t border-stone-800/80 backdrop-blur-xl" style={{ background: "rgba(10,10,10,0.96)" }}>
        <div className={`max-w-3xl mx-auto grid ${isAdmin ? "grid-cols-4" : "grid-cols-3"} px-2 py-1.5`}>
          {navTabs.map(t => {
            const A = t.icon;
            if (t.href) return (
              <a key={t.id} href={t.href} className="flex flex-col items-center gap-0.5 py-2 rounded-lg transition-colors text-stone-500 hover:text-orange-400" style={{textDecoration:"none"}}>
                <A size={20} /><span className="text-[10px] font-semibold tracking-wide uppercase">{t.label}</span>
              </a>
            );
            return <button key={t.id} onClick={() => setTab(t.id)} className={`flex flex-col items-center gap-0.5 py-2 rounded-lg transition-colors ${tab === t.id ? "" : "text-stone-500"}`} style={tab === t.id ? { color: "var(--orange-br)" } : {}}>
              <A size={20} /><span className="text-[10px] font-semibold tracking-wide uppercase">{t.label}</span>
            </button>;
          })}
        </div>
      </nav>

      {currentSession && <SessionDetail session={currentSession} state={state} isAdmin={isAdmin} canScore={canScore} canUploadPhotos={canUploadPhotos} sync={sync} syncErr={syncErr} onClose={() => setOpenSessionId(null)} updateSession={(fn) => updateSession(currentSession.id, fn)} update={update} deleteSession={() => { update(s => ({ ...s, sessions: s.sessions.filter(ss => ss.id !== currentSession.id) })); setOpenSessionId(null); }} leaderboard={leaderboard} />}
      {openPlayerId && <PlayerDetail playerId={openPlayerId} state={state} leaderboard={leaderboard} canScore={canScore} sync={sync} syncErr={syncErr} update={update} onClose={() => setOpenPlayerId(null)} />}
      {showLogin && <LoginModal onClose={() => setShowLogin(false)} onLogin={handleLogin} />}
      {showMe && <MePicker leaderboard={leaderboard} meId={meId} onPick={pickMe} onClear={clearMe} onClose={() => setShowMe(false)} />}
    </div>
  );
}

function SyncIndicator({ status, errMsg }) {
  const map = {
    idle:    { color: "#10b981", label: "Synced" },
    saved:   { color: "#10b981", label: "Saved ✓" },
    syncing: { color: "#f59e0b", label: "Saving…" },
    error:   { color: "#ef4444", label: "Retrying…" },
    offline: { color: "#a8a29e", label: "Offline" },
  };
  const s = map[status] || map.idle;
  const onClick = () => { if (status === "error" && errMsg) alert("Sync error:\n\n" + errMsg + "\n\n(Auto-retrying — your changes are safe on this device meanwhile.)"); };
  const pulse = status === "syncing" || status === "error";
  return <div onClick={onClick} className={`flex items-center gap-1.5 text-[10px] uppercase font-semibold tracking-wider ${status === "error" ? "cursor-pointer" : ""}`} title={status === "error" ? (errMsg || s.label) : s.label}>
    <div className="w-2 h-2 rounded-full" style={{ background: s.color, boxShadow: `0 0 8px ${s.color}`, animation: pulse ? "pulse 1.2s ease-in-out infinite" : "none" }} />
    <span className="hidden sm:inline" style={{ color: status === "saved" ? "#10b981" : "#78716c" }}>{s.label}</span>
  </div>;
}

function LoginModal({ onClose, onLogin }) {
  const [pin, setPin] = useState("");
  const [err, setErr] = useState("");
  const submit = async () => { setErr(""); const ok = await onLogin(pin); if (!ok) setErr("Wrong PIN"); };
  return <Modal open={true} onClose={onClose} title="STAFF SIGN-IN">
    <div className="space-y-3">
      <div className="text-xs text-stone-400">Enter your PIN to unlock editing.</div>
      <input autoFocus type="password" value={pin} onChange={e => setPin(e.target.value)} placeholder="••••" onKeyDown={e => e.key === "Enter" && submit()} className="w-full bg-stone-900 border border-stone-700 rounded-lg px-3 py-3 text-center text-2xl font-mono text-stone-100 tracking-widest focus:outline-none focus:border-orange-500" />
      {err && <div className="text-xs text-red-400 text-center">{err}</div>}
      <Btn className="w-full" onClick={submit}><I.unlock size={14} /> Unlock</Btn>
    </div>
  </Modal>;
}
