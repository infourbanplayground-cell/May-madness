server {
    listen 80; listen [::]:80;
    server_name surge.urbanpadel.om;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2; listen [::]:443 ssl http2;
    server_name surge.urbanpadel.om;
    ssl_certificate     /etc/ssl/urbanpadel.om/origin.crt;
    ssl_certificate_key /etc/ssl/urbanpadel.om/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    real_ip_header CF-Connecting-IP;

    root /var/www/surge.urbanpadel.om/public;
    index index.html;

    # Vol.7 runs its own API on 127.0.0.1:3008 against its own ss_* tables.
    # This is NOT the read-only window into August Attack that this vhost used
    # to be while Surge was a preview — Surge now writes its own scores, so the
    # full route set is proxied, exactly as attack.urbanpadel.om does for 3005.
    # Vol.6 lives on 3005 and is untouched by anything served here.
    location ~ ^/(state|login|save|photos|session-photos|jf-leaderboard|photo-upload|recovery-dump|history|restore)$ {
        proxy_pass http://127.0.0.1:3008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        client_max_body_size 250m;
    }

    # Brand art is immutable per release and heavy (the lockup is the largest
    # paint on the page), so it is the one thing here worth caching hard.
    location ~* \.(png|webp|jpg|jpeg|svg|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    access_log /var/log/nginx/surge.urbanpadel.om.access.log;
    error_log  /var/log/nginx/surge.urbanpadel.om.error.log;
}
