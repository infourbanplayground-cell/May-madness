server {
    listen 80; listen [::]:80;
    server_name surge.urbanpadel.om;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2; listen [::]:443 ssl http2;
    server_name surge.urbanpadel.om;
    ssl_certificate     /etc/ssl/urbanpadel.om/origin.crt;
    ssl_certificate_key /etc/ssl/urbanpadel.om/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    real_ip_header CF-Connecting-IP;

    root /var/www/surge.urbanpadel.om/public;
    index index.html;

    # READ-ONLY proxy into the same August Attack API (127.0.0.1:3005) that
    # attack.urbanpadel.om itself talks to. This is the live sync: Surge's
    # standings and the app's standings are the same fetch against the same
    # backend, not a copy. Only GET-safe, read-only routes are listed here —
    # /login /save /photo-upload /recovery-dump /history /restore are
    # deliberately NOT proxied, so there is no path from this vhost to
    # writing a score or reading admin-only data, regardless of anything the
    # front-end JS does or is ever changed to do.
    location ~ ^/(state|photos|session-photos)$ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    access_log /var/log/nginx/surge.urbanpadel.om.access.log;
    error_log  /var/log/nginx/surge.urbanpadel.om.error.log;
}
