<script type="text/babel" data-presets="react,stage-3">

const { useState, useEffect, useMemo, useCallback, useRef } = React;

// ── API helpers ──────────────────────────────────────────────────
const API = ""; // same-origin, nginx routes /state /login /save /photos to the backend

function getToken() { try { return localStorage.getItem("am-token") || ""; } catch (e) { return ""; } }
function setToken(t) { try { t ? localStorage.setItem("am-token", t) : localStorage.removeItem("am-token"); } catch (e) {} }
function getRole() { try { return localStorage.getItem("am-role") || ""; } catch (e) { return ""; } }
function setRole(r) { try { r ? localStorage.setItem("am-role", r) : localStorage.removeItem("am-role"); } catch (e) {} }

async function apiGet(path) {
  const r = await fetch(API + path);
  return r.json();
}
async function apiPost(path, body, auth) {
  const headers = { "Content-Type": "application/json" };
  if (auth) headers["Authorization"] = "Bearer " + getToken();
  const r = await fetch(API + path, { method: "POST", headers, body: JSON.stringify(body || {}) });
  return r.json();
}

// ── IDs ──────────────────────────────────────────────────────────
function uid(prefix) {
  return prefix + "_" + Math.random().toString(36).slice(2, 10);
}

// ── Americano scheduling: circle method ─────────────────────────
// Produces a 1-factorization of the player set: over (n-1) rounds (n even,
// padded with a bye slot if odd) every pair of players appears together as
// PARTNERS exactly once. This is the same rotation math used by classic
// Americano generators (padelution etc). Courts are formed by combining two
// partner-pairs per round, with the grouping offset rotated each round to
// spread opponent variety too.
function circlePairRounds(n) {
  const arr = Array.from({ length: n }, (_, i) => i);
  if (n % 2 === 1) arr.push(-1); // bye slot
  const total = arr.length;
  const cycles = total - 1;
  let cur = arr.slice();
  const rounds = [];
  for (let r = 0; r < cycles; r++) {
    const pairs = [];
    for (let i = 0; i < total / 2; i++) pairs.push([cur[i], cur[total - 1 - i]]);
    rounds.push(pairs);
    const fixed = cur[0];
    const rest = cur.slice(1);
    rest.unshift(rest.pop());
    cur = [fixed, ...rest];
  }
  return rounds;
}

// Courts physically needed to run every pair at once — the upper bound on the
// "courts available" setting, and its default.
function maxCourtsFor(playerCount) {
  return Math.max(1, Math.floor(Math.floor(playerCount / 2) / 2));
}

// Builds rounds startRound..numRounds-1. `r` indexes the circle cycle globally,
// so regenerating a tail (when courts change midway) resumes the partner
// rotation where it left off instead of restarting it — restarting would replay
// partnerships that have already been used.
//
// Capping courts never changes WHO partners WHOM — the circle method decides
// that alone. It only decides which of those pairs gets a court this round; a
// benched pair's partnership is skipped, never repeated. `sitOutCounts` carries
// sit-out history so rest is spread evenly across players.
function generateSchedule(playerIds, numRounds, maxCourts, opts) {
  const n = playerIds.length;
  if (n < 4) return [];
  const startRound = opts?.startRound || 0;
  const sitOutCounts = { ...(opts?.sitOutCounts || {}) };
  const courtCap = Math.max(1, Number(maxCourts) || maxCourtsFor(n));
  const cyclePairs = circlePairRounds(n); // index-based, cycles = (n even ? n-1 : n)
  const cycles = cyclePairs.length;
  const rounds = [];
  for (let r = startRound; r < numRounds; r++) {
    const pairsIdx = cyclePairs[r % cycles];
    const realPairs = [];
    const byePlayers = [];
    pairsIdx.forEach(([a, b]) => {
      if (a === -1 && b !== -1) byePlayers.push(playerIds[b]);
      else if (b === -1 && a !== -1) byePlayers.push(playerIds[a]);
      else if (a !== -1 && b !== -1) realPairs.push([playerIds[a], playerIds[b]]);
    });
    // rotate grouping offset each round for opponent variety
    const offset = r % Math.max(1, realPairs.length);
    let playing = realPairs.slice(offset).concat(realPairs.slice(0, offset));

    // More pairs than courts can hold → bench the pairs whose members have sat
    // out least so far, so rest evens out over the tournament.
    const capacity = courtCap * 2;
    if (playing.length > capacity) {
      const ranked = playing.map((pair, i) => ({
        i,
        load: (sitOutCounts[pair[0]] || 0) + (sitOutCounts[pair[1]] || 0),
      }));
      ranked.sort((x, y) => x.load - y.load || x.i - y.i);
      const benched = new Set(ranked.slice(0, playing.length - capacity).map(x => x.i));
      playing.forEach((pair, i) => { if (benched.has(i)) byePlayers.push(pair[0], pair[1]); });
      playing = playing.filter((_, i) => !benched.has(i));
    }
    // a leftover odd pair has no opponent
    if (playing.length % 2 === 1) {
      const last = playing[playing.length - 1];
      byePlayers.push(last[0], last[1]);
      playing = playing.slice(0, -1);
    }

    const courts = [];
    for (let i = 0; i + 1 < playing.length; i += 2) {
      courts.push({
        court: courts.length + 1,
        team1: playing[i],
        team2: playing[i + 1],
        score1: null,
        score2: null,
      });
    }
    byePlayers.forEach(id => { sitOutCounts[id] = (sitOutCounts[id] || 0) + 1; });
    rounds.push({ roundNum: r + 1, sitOuts: byePlayers, courts });
  }
  return rounds;
}

// Rebuild a tournament's remaining rounds for a new court count. Rounds that
// already have any score entered are left exactly as played.
function rescheduleForCourts(t, newCourts) {
  let cut = t.rounds.findIndex(r => r.courts.every(m => m.score1 == null && m.score2 == null));
  if (cut === -1) cut = t.rounds.length; // everything played — nothing to rebuild
  const kept = t.rounds.slice(0, cut);
  const sitOutCounts = {};
  kept.forEach(r => (r.sitOuts || []).forEach(id => { sitOutCounts[id] = (sitOutCounts[id] || 0) + 1; }));
  const rebuilt = generateSchedule(t.playerIds, t.rounds.length, newCourts, { startRound: cut, sitOutCounts });
  return { ...t, courtCount: newCourts, rounds: [...kept, ...rebuilt] };
}

// ── Standings ────────────────────────────────────────────────────
function calcStandings(tournament, players) {
  const byId = {};
  players.forEach(p => { byId[p.id] = p; });
  const stats = {};
  (tournament.playerIds || []).forEach(id => {
    stats[id] = { id, name: byId[id]?.name || "?", photoUrl: byId[id]?.photoUrl || "", points: 0, played: 0, wins: 0, diff: 0 };
  });
  (tournament.rounds || []).forEach(round => {
    (round.courts || []).forEach(m => {
      if (m.score1 == null || m.score2 == null) return;
      const s1 = Number(m.score1), s2 = Number(m.score2);
      m.team1.forEach(id => {
        if (!stats[id]) return;
        stats[id].points += s1; stats[id].played += 1; stats[id].diff += (s1 - s2);
        if (s1 > s2) stats[id].wins += 1;
      });
      m.team2.forEach(id => {
        if (!stats[id]) return;
        stats[id].points += s2; stats[id].played += 1; stats[id].diff += (s2 - s1);
        if (s2 > s1) stats[id].wins += 1;
      });
    });
  });
  return Object.values(stats).sort((a, b) => b.points - a.points || b.diff - a.diff || b.wins - a.wins);
}

// ── Small UI atoms ───────────────────────────────────────────────
function Btn({ children, onClick, variant = "orange", className = "", disabled, type = "button" }) {
  const styles = {
    orange: "bg-gradient-to-b from-[var(--orange-br)] to-[var(--orange)] text-[var(--ink)] glow-orange",
    blue: "bg-gradient-to-b from-[var(--blue-soft)] to-[var(--blue)] text-[var(--ink)] glow-blue",
    ghost: "bg-white/5 text-[var(--cream)] border border-white/10",
    danger: "bg-gradient-to-b from-[var(--red)] to-[var(--ember)] text-white",
  };
  return (
    <button type={type} disabled={disabled} onClick={onClick}
      className={`px-4 py-2.5 rounded-xl font-bold text-sm active:scale-95 transition disabled:opacity-40 disabled:active:scale-100 ${styles[variant]} ${className}`}>
      {children}
    </button>
  );
}
function Card({ children, className = "" }) { return <div className={`card p-4 ${className}`}>{children}</div>; }
function Input(props) {
  return <input {...props} className={`w-full bg-black/30 border border-white/10 rounded-xl px-3 py-2.5 text-[var(--cream)] placeholder-[var(--muted2)] outline-none focus:border-[var(--orange)] ${props.className || ""}`} />;
}
function Avatar({ player, size = 40 }) {
  const initials = (player?.name || "?").split(" ").map(w => w[0]).slice(0, 2).join("").toUpperCase();
  return player?.photoUrl
    ? <img src={player.photoUrl} style={{ width: size, height: size }} className="rounded-full object-cover border border-white/10" />
    : <div style={{ width: size, height: size }} className="rounded-full flex items-center justify-center bg-gradient-to-br from-[var(--orange)] to-[var(--red)] text-[var(--ink)] font-black text-xs">{initials}</div>;
}
function Modal({ title, onClose, children, wide }) {
  return (
    <div className="fixed inset-0 bg-black/70 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4" onClick={onClose}>
      <div onClick={e => e.stopPropagation()} className={`card w-full ${wide ? "sm:max-w-2xl" : "sm:max-w-md"} max-h-[90vh] overflow-y-auto rounded-b-none sm:rounded-b-[18px]`}>
        <div className="flex items-center justify-between p-4 border-b border-white/10 sticky top-0 bg-[var(--ink2)] z-10">
          <h2 className="display text-lg">{title}</h2>
          <button onClick={onClose} className="text-[var(--muted)] text-2xl leading-none px-2">×</button>
        </div>
        <div className="p-4">{children}</div>
      </div>
    </div>
  );
}
function Pill({ children, tone = "orange" }) {
  const tones = { orange: "bg-[var(--orange)]/15 text-[var(--orange-br)] border-[var(--orange)]/30", blue: "bg-[var(--blue)]/15 text-[var(--blue-soft)] border-[var(--blue)]/30", muted: "bg-white/5 text-[var(--muted)] border-white/10" };
  return <span className={`text-[11px] font-bold uppercase tracking-wide px-2 py-1 rounded-full border ${tones[tone]}`}>{children}</span>;
}

// ── Login modal ──────────────────────────────────────────────────
function LoginModal({ onClose, onLoggedIn }) {
  const [pin, setPin] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  async function submit() {
    setBusy(true); setErr("");
    const r = await apiPost("/login", { pin });
    setBusy(false);
    if (r.ok) { setToken(r.token); setRole(r.role); onLoggedIn(r.role); onClose(); }
    else setErr("Wrong PIN");
  }
  return (
    <Modal title="Scorer / Admin Login" onClose={onClose}>
      <div className="space-y-3">
        <Input type="password" inputMode="numeric" placeholder="Enter PIN" value={pin}
          onChange={e => setPin(e.target.value)} onKeyDown={e => e.key === "Enter" && submit()} autoFocus />
        {err && <div className="text-[var(--red)] text-sm">{err}</div>}
        <Btn onClick={submit} disabled={busy || !pin} className="w-full">{busy ? "..." : "Login"}</Btn>
      </div>
    </Modal>
  );
}

// ── Players view ─────────────────────────────────────────────────
function PlayersView({ state }) {
  const [q, setQ] = useState("");
  const players = (state.players || []).filter(p => p.name.toLowerCase().includes(q.toLowerCase()))
    .sort((a, b) => a.name.localeCompare(b.name));
  return (
    <div className="space-y-4">
      <Input placeholder="Search players…" value={q} onChange={e => setQ(e.target.value)} />
      <div className="text-sm text-[var(--muted)]">{players.length} players · synced from August Attack's roster</div>
      <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
        {players.map(p => (
          <Card key={p.id} className="flex items-center gap-3 !p-3">
            <Avatar player={p} />
            <div className="flex-1 min-w-0">
              <div className="font-bold truncate">{p.name}</div>
            </div>
          </Card>
        ))}
      </div>
    </div>
  );
}
// ── New tournament setup ─────────────────────────────────────────
function SetupView({ state, canEdit, onStart }) {
  const [selected, setSelected] = useState({});
  const [points, setPoints] = useState(32);
  const [rounds, setRounds] = useState(7);
  const [courts, setCourts] = useState(2);
  const [name, setName] = useState("");
  const players = (state.players || []).slice().sort((a, b) => a.name.localeCompare(b.name));
  const n = Object.values(selected).filter(Boolean).length;
  const suggestedRounds = n >= 4 ? (n % 2 === 0 ? n - 1 : n) : 0;
  const courtsNeeded = n >= 4 ? maxCourtsFor(n) : 0;
  const benchedPerRound = courtsNeeded > 0 ? Math.max(0, (courtsNeeded - Math.min(Number(courts) || 1, courtsNeeded)) * 4) : 0;

  useEffect(() => { if (suggestedRounds) setRounds(Math.min(suggestedRounds, 8)); }, [n]);
  useEffect(() => { if (courtsNeeded) setCourts(courtsNeeded); }, [courtsNeeded]);

  function toggle(id) { setSelected(s => ({ ...s, [id]: !s[id] })); }

  function start() {
    const ids = Object.keys(selected).filter(id => selected[id]);
    if (ids.length < 4) return;
    const courtCount = Math.max(1, Math.min(Number(courts) || 1, maxCourtsFor(ids.length)));
    onStart({
      id: uid("t"),
      name: name.trim() || `Americano ${new Date().toLocaleDateString()}`,
      createdAt: Date.now(),
      pointsPerMatch: Number(points) || 32,
      playerIds: ids,
      numRounds: Number(rounds) || 1,
      courtCount,
      rounds: generateSchedule(ids, Number(rounds) || 1, courtCount),
      status: "active",
    });
  }

  return (
    <div className="space-y-4">
      <Card>
        <h2 className="display text-xl mb-2">🎾 Classic Americano</h2>
        <p className="text-sm text-[var(--muted)] leading-relaxed">
          Partners rotate every round — there are no fixed teams. Each point your pair wins
          adds to <b className="text-[var(--cream)]">your own</b> individual total. After all
          rounds, individual point totals decide the final ranking.
        </p>
        <div className="flex flex-wrap gap-2 mt-3">
          <Pill>Recommended: 32 points/match</Pill>
          <Pill tone="blue">Best with player count ÷ 4</Pill>
          <Pill tone="muted">8 players ≈ 2 hours</Pill>
        </div>
      </Card>

      {!canEdit ? (
        <Card className="text-center text-[var(--muted)]">Login as scorer/admin to set up a tournament.</Card>
      ) : (
        <>
          <Card className="space-y-3">
            <Input placeholder="Tournament name (optional)" value={name} onChange={e => setName(e.target.value)} />
            <div className="grid grid-cols-3 gap-3">
              <div>
                <label className="text-xs text-[var(--muted)] block mb-1">Points per match</label>
                <Input type="number" value={points} onChange={e => setPoints(e.target.value)} />
              </div>
              <div>
                <label className="text-xs text-[var(--muted)] block mb-1">Rounds</label>
                <Input type="number" min="1" value={rounds} onChange={e => setRounds(e.target.value)} />
              </div>
              <div>
                <label className="text-xs text-[var(--muted)] block mb-1">Courts</label>
                <Input type="number" min="1" max={courtsNeeded || 1} value={courts} onChange={e => setCourts(e.target.value)} />
              </div>
            </div>
            {n > 0 && suggestedRounds > 0 && (
              <div className="text-xs text-[var(--muted)]">Full partner rotation for {n} players covers {suggestedRounds} rounds.</div>
            )}
            {courtsNeeded > 0 && (
              <div className="text-xs text-[var(--muted)]">
                {benchedPerRound > 0
                  ? `${courtsNeeded} courts would run everyone at once — on ${courts} court${Number(courts) === 1 ? "" : "s"}, ${benchedPerRound} players sit out each round (rotated evenly).`
                  : `${courtsNeeded} court${courtsNeeded === 1 ? "" : "s"} runs every match at once — nobody sits out.`}
              </div>
            )}
          </Card>

          <Card>
            <div className="flex items-center justify-between mb-3">
              <div className="font-bold">Select players</div>
              <div className="text-sm text-[var(--muted)]">{n} selected{n % 4 !== 0 && n > 0 ? ` (${n % 4} will sit out some rounds)` : ""}</div>
            </div>
            <div className="grid grid-cols-2 sm:grid-cols-3 gap-2 max-h-96 overflow-y-auto">
              {players.map(p => (
                <button key={p.id} onClick={() => toggle(p.id)}
                  className={`flex items-center gap-2 p-2 rounded-xl border text-left ${selected[p.id] ? "border-[var(--orange)] bg-[var(--orange)]/10" : "border-white/10 bg-white/5"}`}>
                  <Avatar player={p} size={28} />
                  <span className="text-sm truncate">{p.name}</span>
                </button>
              ))}
            </div>
          </Card>

          <Btn onClick={start} disabled={n < 4} className="w-full">Start Tournament ({n} players)</Btn>
        </>
      )}
    </div>
  );
}

// ── Live round view ──────────────────────────────────────────────
function LiveView({ tournament, players, canEdit, onScore, onFinish, onCourtsChange }) {
  const byId = {}; players.forEach(p => { byId[p.id] = p; });
  const [roundIdx, setRoundIdx] = useState(() => {
    const firstOpen = tournament.rounds.findIndex(r => r.courts.some(m => m.score1 == null));
    return firstOpen === -1 ? tournament.rounds.length - 1 : firstOpen;
  });
  const [courtsOpen, setCourtsOpen] = useState(false);
  const round = tournament.rounds[roundIdx];
  const allScored = tournament.rounds.every(r => r.courts.every(m => m.score1 != null && m.score2 != null));
  const courtCount = tournament.courtCount || maxCourtsFor(tournament.playerIds.length);

  function Name({ id }) {
    const p = byId[id];
    return <div className="flex items-center gap-2"><Avatar player={p} size={32} /><span className="font-bold text-sm">{p?.name || "?"}</span></div>;
  }

  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between">
        <button disabled={roundIdx === 0} onClick={() => setRoundIdx(i => i - 1)} className="px-3 py-2 rounded-xl bg-white/5 disabled:opacity-30">‹</button>
        <div className="text-center">
          <div className="display text-xl">ROUND {round.roundNum}</div>
          <div className="text-xs text-[var(--muted)]">of {tournament.rounds.length}</div>
        </div>
        <button disabled={roundIdx === tournament.rounds.length - 1} onClick={() => setRoundIdx(i => i + 1)} className="px-3 py-2 rounded-xl bg-white/5 disabled:opacity-30">›</button>
      </div>

      {canEdit && (
        <button onClick={() => setCourtsOpen(true)} className="w-full text-left">
          <Card className="!p-3 flex items-center justify-between">
            <span className="text-sm text-[var(--muted)]">Courts in use</span>
            <span className="flex items-center gap-2">
              <span className="display text-lg">{courtCount}</span>
              <span className="text-[var(--orange-br)] text-xs font-bold">CHANGE</span>
            </span>
          </Card>
        </button>
      )}

      {courtsOpen && (
        <CourtsModal tournament={tournament} current={courtCount}
          onClose={() => setCourtsOpen(false)}
          onApply={c => { onCourtsChange(c); setCourtsOpen(false); }} />
      )}

      {round.sitOuts.length > 0 && (
        <Card className="!p-3 text-sm text-[var(--muted)]">
          Sitting out: {round.sitOuts.map(id => byId[id]?.name || "?").join(", ")}
        </Card>
      )}

      <div className="space-y-3">
        {round.courts.map((m, mi) => (
          <Card key={`${roundIdx}-${mi}`} className={m.score1 != null ? "opacity-80" : ""}>
            <div className="text-xs text-[var(--muted)] mb-2">Court {m.court}</div>
            <div className="grid grid-cols-[1fr,auto,1fr] items-center gap-3">
              <div className="space-y-1">{m.team1.map(id => <Name key={id} id={id} />)}</div>
              <ScoreEntry m={m} canEdit={canEdit} pointsPerMatch={tournament.pointsPerMatch}
                onSubmit={(s1, s2) => onScore(roundIdx, mi, s1, s2)} />
              <div className="space-y-1 text-right">{m.team2.map(id => <Name key={id} id={id} />)}</div>
            </div>
          </Card>
        ))}
      </div>

      {canEdit && roundIdx === tournament.rounds.length - 1 && allScored && (
        <Btn variant="blue" onClick={onFinish} className="w-full">Finish Tournament</Btn>
      )}
    </div>
  );
}
function CourtsModal({ tournament, current, onClose, onApply }) {
  const [val, setVal] = useState(current);
  const maxC = maxCourtsFor(tournament.playerIds.length);
  const chosen = Math.max(1, Math.min(Number(val) || 1, maxC));
  const benched = Math.max(0, (maxC - chosen) * 4);
  const played = tournament.rounds.filter(r => r.courts.some(m => m.score1 != null)).length;
  const remaining = tournament.rounds.length - played;
  return (
    <Modal title="Courts in use" onClose={onClose}>
      <div className="space-y-3">
        <div>
          <label className="text-xs text-[var(--muted)] block mb-1">Courts available (max {maxC})</label>
          <Input type="number" min="1" max={maxC} value={val} onChange={e => setVal(e.target.value)} autoFocus />
        </div>
        <div className="text-sm text-[var(--muted)] leading-relaxed">
          {benched > 0
            ? `${benched} players sit out each round, rotated so rest is spread evenly.`
            : "Every match runs at once — nobody sits out."}
        </div>
        <Card className="!p-3 text-xs text-[var(--muted)] leading-relaxed">
          The {played} round{played === 1 ? "" : "s"} already scored stay exactly as played.
          The remaining {remaining} will be rebuilt — partners carry on rotating from where
          they left off, so nobody gets a repeat partner.
        </Card>
        <div className="flex gap-2">
          <Btn variant="ghost" onClick={onClose} className="flex-1">Cancel</Btn>
          <Btn onClick={() => onApply(chosen)} disabled={chosen === current} className="flex-1">Apply</Btn>
        </div>
      </div>
    </Modal>
  );
}
function ScoreEntry({ m, canEdit, pointsPerMatch, onSubmit }) {
  const [s1, setS1] = useState(m.score1 ?? "");
  const [s2, setS2] = useState(m.score2 ?? "");
  const done = m.score1 != null;
  if (!canEdit && !done) return <div className="text-[var(--muted)] text-xs text-center">vs</div>;
  return (
    <div className="flex items-center gap-1">
      <Input type="number" disabled={!canEdit} value={s1} onChange={e => setS1(e.target.value)}
        onBlur={() => s1 !== "" && s2 !== "" && onSubmit(Number(s1), Number(s2))}
        className="!w-14 text-center !px-1" placeholder="0" />
      <span className="text-[var(--muted)] text-xs">-</span>
      <Input type="number" disabled={!canEdit} value={s2} onChange={e => setS2(e.target.value)}
        onBlur={() => s1 !== "" && s2 !== "" && onSubmit(Number(s1), Number(s2))}
        className="!w-14 text-center !px-1" placeholder="0" />
    </div>
  );
}

// ── Standings view ───────────────────────────────────────────────
function StandingsView({ tournament, players }) {
  if (!tournament) return <Card className="text-center text-[var(--muted)]">No active tournament yet.</Card>;
  const standings = calcStandings(tournament, players);
  return (
    <div className="space-y-2">
      <div className="text-sm text-[var(--muted)] mb-2">{tournament.name}</div>
      {standings.map((s, i) => (
        <Card key={s.id} className={`flex items-center gap-3 !p-3 ${i === 0 ? "glow-orange" : ""}`}>
          <div className={`display text-lg w-6 text-center ${i === 0 ? "text-[var(--orange-br)]" : "text-[var(--muted)]"}`}>{i + 1}</div>
          <Avatar player={s} />
          <div className="flex-1 min-w-0">
            <div className="font-bold truncate">{s.name}</div>
            <div className="text-xs text-[var(--muted)]">{s.played} played · {s.wins} won</div>
          </div>
          <div className="text-right">
            <div className="display text-lg mono">{s.points}</div>
            <div className="text-xs text-[var(--muted)]">pts</div>
          </div>
        </Card>
      ))}
    </div>
  );
}

// ── History view ─────────────────────────────────────────────────
function HistoryView({ state, players }) {
  const [openId, setOpenId] = useState(null);
  const done = (state.tournaments || []).filter(t => t.status === "completed").sort((a, b) => b.createdAt - a.createdAt);
  if (!done.length) return <Card className="text-center text-[var(--muted)]">No completed tournaments yet.</Card>;
  const open = done.find(t => t.id === openId);
  if (open) {
    return (
      <div className="space-y-3">
        <button onClick={() => setOpenId(null)} className="text-sm text-[var(--muted)]">‹ Back to history</button>
        <StandingsView tournament={open} players={players} />
      </div>
    );
  }
  return (
    <div className="space-y-2">
      {done.map(t => (
        <button key={t.id} onClick={() => setOpenId(t.id)} className="w-full text-left">
          <Card className="flex items-center justify-between !p-3">
            <div>
              <div className="font-bold">{t.name}</div>
              <div className="text-xs text-[var(--muted)]">{new Date(t.createdAt).toLocaleDateString()} · {t.playerIds.length} players · {t.rounds.length} rounds</div>
            </div>
            <span className="text-[var(--muted)]">›</span>
          </Card>
        </button>
      ))}
    </div>
  );
}

// ── App ──────────────────────────────────────────────────────────
function App() {
  const [state, setState] = useState({ players: [], tournaments: [] });
  const [loading, setLoading] = useState(true);
  const [role, setRoleState] = useState(getRole());
  const [loginOpen, setLoginOpen] = useState(false);
  const [tab, setTab] = useState("play");
  const saveTimer = useRef(null);

  useEffect(() => {
    apiGet("/state").then(r => {
      if (r.ok) setState(prev => ({ players: [], tournaments: [], ...r.state }));
      setLoading(false);
    });
  }, []);

  const canEdit = role === "admin" || role === "scorer";

  function persist(next) {
    setState(next);
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => { apiPost("/save", { state: next }, true); }, 400);
  }

  const activeTournament = (state.tournaments || []).find(t => t.status === "active");

  function startTournament(t) {
    persist({ ...state, tournaments: [...(state.tournaments || []), t] });
  }
  function scoreMatch(roundIdx, matchIdx, s1, s2) {
    const t = activeTournament; if (!t) return;
    const rounds = t.rounds.map((r, ri) => ri !== roundIdx ? r : {
      ...r, courts: r.courts.map((m, mi) => mi !== matchIdx ? m : { ...m, score1: s1, score2: s2 }),
    });
    const nextT = { ...t, rounds };
    persist({ ...state, tournaments: state.tournaments.map(x => x.id === t.id ? nextT : x) });
  }
  function finishTournament() {
    const t = activeTournament; if (!t) return;
    persist({ ...state, tournaments: state.tournaments.map(x => x.id === t.id ? { ...x, status: "completed", completedAt: Date.now() } : x) });
    setTab("history");
  }
  function changeCourts(newCourts) {
    const t = activeTournament; if (!t) return;
    const nextT = rescheduleForCourts(t, newCourts);
    persist({ ...state, tournaments: state.tournaments.map(x => x.id === t.id ? nextT : x) });
  }

  if (loading) return <div className="min-h-screen flex items-center justify-center text-[var(--muted)]">Loading…</div>;

  const tabs = [
    { id: "play", label: "🎾 Play" },
    { id: "standings", label: "🏆 Standings" },
    { id: "players", label: "👥 Players" },
    { id: "history", label: "📜 History" },
  ];

  return (
    <div className="min-h-screen pb-24">
      <header className="sticky top-0 z-30 bg-[var(--ink)]/90 backdrop-blur border-b border-white/10 px-4 py-3 flex items-center justify-between">
        <h1 className="display text-xl tracking-wide">🎾 AMERICANO</h1>
        {canEdit
          ? <Pill tone={role === "admin" ? "orange" : "blue"}>{role}</Pill>
          : <button onClick={() => setLoginOpen(true)} className="text-sm text-[var(--muted)] underline">Login</button>}
      </header>

      <main className="max-w-2xl mx-auto p-4">
        {tab === "play" && (activeTournament
          ? <LiveView tournament={activeTournament} players={state.players} canEdit={canEdit}
              onScore={scoreMatch} onFinish={finishTournament} onCourtsChange={changeCourts} />
          : <SetupView state={state} canEdit={canEdit} onStart={startTournament} />)}
        {tab === "standings" && <StandingsView tournament={activeTournament} players={state.players} />}
        {tab === "players" && <PlayersView state={state} />}
        {tab === "history" && <HistoryView state={state} players={state.players} />}
      </main>

      <nav className="fixed bottom-0 inset-x-0 bg-[var(--ink2)] border-t border-white/10 flex z-30">
        {tabs.map(tb => (
          <button key={tb.id} onClick={() => setTab(tb.id)}
            className={`flex-1 py-3 text-xs font-bold ${tab === tb.id ? "text-[var(--orange-br)]" : "text-[var(--muted)]"}`}>
            {tb.label}
          </button>
        ))}
      </nav>

      {loginOpen && <LoginModal onClose={() => setLoginOpen(false)} onLoggedIn={r => setRoleState(r)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
