}

// ── setup ───────────────────────────────────────────────────────
function Setup({ people, canEdit, cfg, setCfg, sel, setSel, onStart, onAddGuest }) {
  const selCount = Object.values(sel).filter(Boolean).length;
  const suggested = selCount >= 4 ? (selCount % 2 === 0 ? selCount - 1 : selCount) : 0;
  const needed = selCount >= 4 ? maxCourtsFor(selCount) : 0;
  const useCourts = Math.max(1, Math.min(Number(cfg.courts) || 1, needed || 1));
  const benched = selCount >= 4 ? Math.max(0, selCount - useCourts * 4) : 0;
  // 286 people are synced from August Attack and the whole list used to render
  // alphabetically with no way to search it. Checking in sixteen meant hunting
  // down a 286-row grid, twice, while people waited on court. Two changes fix
  // it: a filter, and everyone already checked in pinned to the top so the
  // scorer can see who they have without scrolling back up.
  const [q, setQ] = useState("");
  const roster = useMemo(() => {
    const needle = q.trim().toLowerCase();
    return people.slice()
      .filter(p => !needle || p.name.toLowerCase().includes(needle))
      .sort((a, b) => {
        const sa = sel[a.id] ? 0 : 1, sb = sel[b.id] ? 0 : 1;
        return sa !== sb ? sa - sb : a.name.localeCompare(b.name);
      });
  }, [people, q, sel]);

  const hint = selCount < 4
    ? "Check in at least 4 players to start."
    : `Full partner rotation for ${selCount} players covers ${suggested} rounds. ` + (benched > 0
      ? `On ${plural(useCourts, "court")}, ${restPhrase(benched)} each round, rotated evenly.`
      : `${plural(needed, "court")} runs every match at once — nobody rests.`);

  // Warn when this combination can't give everyone the same number of matches:
  // in Americano the winner is whoever piles up the most points, so an extra
  // match is a real head start.
  //
  // The arithmetic (fairRoundCounts) says which round counts COULD share the
  // rest evenly. It is necessary, not sufficient: the circle method has
  // already decided who is paired with whom, and the bench is chosen a pair at
  // a time, so some of those round counts cannot actually be realised. This
  // screen used to print the arithmetic as fact — it told organisers that 20
  // players over 5 rounds on 4 courts would be even, and the schedule it then
  // generated handed out 3 to 5 matches. So every candidate is now GENERATED
  // and measured before it is offered, and the current choice reports its real
  // spread rather than a predicted one.
  const ids = useMemo(() => Object.keys(sel).filter(id => sel[id]), [sel]);
  const roundsNow = Number(cfg.rounds) || 0;
  const schedule = useMemo(() => {
    if (selCount < 4 || cfg.format === "uprising") return null;
    const spreadOf = n => {
      const played = {};
      ids.forEach(id => { played[id] = 0; });
      generateSchedule(ids, n, useCourts).forEach(r => r.courts.forEach(m =>
        [...m.team1, ...m.team2].forEach(id => { played[id] = (played[id] || 0) + 1; })));
      const v = Object.values(played);
      return { min: Math.min(...v), max: Math.max(...v) };
    };
    const cand = fairRoundCounts(selCount, useCourts) || [];
    return {
      now: roundsNow >= 1 ? spreadOf(roundsNow) : null,
      fair: cand.filter(n => { const s = spreadOf(n); return s.min === s.max; }).slice(0, 4),
    };
  }, [ids, selCount, useCourts, roundsNow, cfg.format]);

  const unevenWarning = (schedule && schedule.now && schedule.now.min !== schedule.now.max)
    ? (schedule.fair.length
        ? `Heads up: on ${plural(useCourts, "court")}, ${roundsNow} rounds hands out ${schedule.now.min}–${schedule.now.max} matches, not the same number to everyone. ${schedule.fair.join(" or ")} rounds would be even. Otherwise the standings switch to points per match so nobody wins on extra court time.`
        : `Heads up: on ${plural(useCourts, "court")} no round count shares ${selCount} players out evenly — this one gives ${schedule.now.min}–${schedule.now.max} matches each — so the standings will rank on points per match.`)
    : null;

  return (
    <div className="screen">
      <div>
        <Eyebrow>New Session</Eyebrow>
        <div className="display">
          {cfg.format === "uprising" ? <Fragment>The <em>Uprising</em></Fragment>
                                     : <Fragment>Classic <em>Americano</em></Fragment>}
        </div>
        <p className="lede">
          {cfg.format === "uprising"
            ? <Fragment>
                Four courts, nine rounds, nobody sits out. Win and you move <b>up</b> a court; lose and you
                go down. Points are worth more the higher you climb, and the last round is worth double.
              </Fragment>
            : <Fragment>
                Partners rotate every round — no fixed teams. Every point your pair wins adds to <b>your own</b> total,
                and individual totals decide the final ranking.
              </Fragment>}
        </p>
      </div>

      {!canEdit ? (
        <div className="hair" style={{ fontSize: 15, color: "var(--muted)" }}>
          Log in as scorer or admin to set up a session.
        </div>
      ) : (
        <Fragment>
          <div className="hair" style={{ display: "flex", gap: 10, marginBottom: 18 }}>
            {[["americano", "AMERICANO"], ["uprising", "UPRISING"]].map(([k, lab]) => (
              <button key={k} type="button" onClick={() => setCfg(c => ({ ...c, format: k }))}
                style={{ flex: 1, padding: "14px 8px", cursor: "pointer", borderRadius: 0,
                  background: cfg.format === k ? "var(--volt)" : "transparent",
                  /* Cream on a volt fill measures 1.2:1 — the selected format
                     was very nearly invisible. Volt is a BRIGHT accent, so
                     anything sitting on it has to be near-black (14.4:1). */
                  color: cfg.format === k ? "var(--ink)" : "var(--muted)",
                  boxShadow: cfg.format === k ? "var(--glow)" : "none",
                  border: "1px solid " + (cfg.format === k ? "var(--volt)" : "var(--line)"),
                  fontWeight: 900, letterSpacing: ".14em", fontSize: 12 }}>{lab}</button>
            ))}
          </div>
          {cfg.format === "uprising" && (() => {
            // Four to a court is padel. The field is whoever turned up: if it
            // is not a multiple of four, somebody rests every round, and the
            // round count decides whether those rests come out even.
            //
            // The ROUND COUNT is the organiser's. Nine was a two-hour time
            // budget, not a rule — nothing in the ladder or the points table
            // counts to nine. This block tells them what their own number
            // actually produces rather than quietly substituting one.
            // Two is the floor: one court is not a ladder — there is nowhere to
            // climb to — and eight players is already the minimum, so two
            // courts can always be filled.
            const upC = Math.max(2, Math.min(
              Number(cfg.upcourts) || UP.COURTS, Math.max(2, Math.floor(selCount / 4)), UP.COURTS));
            const upR = selCount - 4 * upC;
            const tgt = Math.max(4, Math.min(99, Number(cfg.uppoints) || UP.TARGET));
            const sc = cfg.upfinish
              ? upPlanRounds(Number(cfg.upfinish), tgt,
                  { shuffle: cfg.upshuffle, players: Math.max(8, selCount), courts: upC })
              : Math.max(2, Math.min(40, Number(cfg.uprounds) || UP.ROUNDS));
            const rounds = sc + upShuffleRounds({ shuffle: cfg.upshuffle });
            const mins = nightMinutes(rounds, tgt);
            const fair = selCount >= 8 ? upFairRounds(selCount, upC, 40) : [];
            const evenRests = upR === 0 || (fair || []).includes(sc);
            const restsEach = (sc * upR) / selCount;
            // Suggest the LONGEST even round count that still finishes inside
            // three hours, not merely the closest number. Closest-by-distance
            // told a 9-player night to run 18 scoring rounds — even, and 3h26
            // — when 9 rounds is just as even and finishes at 2h10.
            const shuf = upShuffleRounds({ shuffle: cfg.upshuffle });
            // Only offer a round count that could actually be played. Some
            // field sizes have exactly one even answer and it is 25 or 31
            // scoring rounds — five to six hours. Printing it as the fix is
            // worse than saying plainly that there is no fix.
            const fits = (fair || []).filter(n => nightMinutes(n + shuf, tgt) <= 180);
            const nearest = fits.length ? fits[fits.length - 1] : null;
            const nearestTotal = nearest ? nearest + shuf : null;
            const nearestMins = nearest ? nightMinutes(nearestTotal, tgt) : 0;

            // Four courts seat sixteen. Past that the extra people are not
            // playing a format, they are queuing for one — at 24 a third of
            // the room is off court every round, at 32 it is half.
            const idle = selCount ? Math.round(100 * upR / selCount) : 0;
            return (
              <div className="hair" style={{ fontSize: 14, color: "var(--muted)", marginBottom: 18 }}>
                {selCount < 8
                  ? <Fragment>UPRISING needs at least <b>eight</b> players — two courts.
                      {" "}{selCount} checked in.</Fragment>
                  : <Fragment>
                      <b style={{ color: "var(--cream)" }}>
                        {plural(selCount, "player")} on {plural(upC, "court")},{" "}
                        {plural(sc, "scoring round")}{cfg.upshuffle ? ` after the shuffle — ${rounds} matches each` : ""}.
                      </b>{" "}
                      {upR === 0
                        ? <Fragment>Nobody sits out and the last round is worth double.</Fragment>
                        : evenRests
                          ? <Fragment>
                              {plural(upR, "player")} {upR === 1 ? "rests" : "rest"} each round, on a rota drawn
                              at the start, and over {plural(sc, "scoring round")} that comes out exactly even:
                              everyone rests {["never", "once", "twice"][restsEach] || restsEach + " times"} and
                              plays {sc - restsEach}. The final round is <b>not</b> doubled — whoever drew the last
                              rest could not otherwise win, and that is not something they chose.
                            </Fragment>
                          : <Fragment>
                              <b style={{ color: "var(--warn)" }}>{plural(upR, "player")} {upR === 1 ? "rests" : "rest"} each
                              round, and {plural(sc, "scoring round")} does not share that out evenly</b> — some will
                              play one more match than others, so the table will rank on <b>points per round played</b>.
                              {nearestTotal
                                ? <Fragment>{" "}<b style={{ color: "var(--cream)" }}>{nearest} scoring rounds</b>{" "}
                                    would be exactly even ({nearestTotal} matches, {asClock(nearestMins)}).</Fragment>
                                : <Fragment>{" "}No round count that fits an evening shares {selCount} players
                                    out evenly, so this field always ranks per round — which is fair, just less
                                    tidy. Drop to {4 * upC} or go up to {4 * upC + upC} and it comes out exact.</Fragment>}
                            </Fragment>}
                      {" "}{cfg.upshuffle
                        ? "Where everyone starts is decided on court, by the shuffle — nobody is placed by a draw."
                        : "The opening ladder is seeded by form, not drawn — a random draw hands a Court 1 starter 7x the chance of a Court 4 starter."}{" "}
                      <b style={{ color: mins > 180 ? "var(--warn)" : "var(--cream)" }}>
                        {rounds} {cfg.upshuffle ? "matches" : "rounds"} of first to {tgt} runs about {asClock(mins)}
                      </b>
                      {mins > 180
                        ? " — over three hours. Drop the target or the round count."
                        : " from the first serve."}
                      {idle >= 30
                        ? <Fragment>{" "}<b style={{ color: "var(--warn)" }}>{idle}% of the room is off court
                            every round.</b> Four courts seat sixteen; past about {4 * upC + Math.round(4 * upC * 0.3)} players
                            they are queuing rather than playing, and two shorter sessions beat one long one.</Fragment>
                        : null}
                      {rounds >= 12 && upR === 0
                        ? <Fragment>{" "}A longer night is a better competition — at 16 players, 15 rounds puts
                            the strongest player on top 69% of the time against 61% at nine — but a court of four
                            has only three ways to split, so expect repeat partners past about round 11.</Fragment>
                        : null}
                    </Fragment>}
              </div>
            );
          })()}
          <div className="hair" style={{ display: "flex", flexDirection: "column", gap: 18 }}>
            <input className="field big" placeholder="Session name" value={cfg.name}
              onChange={e => setCfg(c => ({ ...c, name: e.target.value }))} />
            {/* UPRISING fixes points (first to 16) and derives the round count
                from the field, but COURTS is a real constraint — the club has
                four. Hiding it meant 20 players silently asked for a fifth
                court, which has no points defined for it, and the first round
                took the whole screen down with "no points defined for court 5". */}
            <div className="grid3">
              {(cfg.format === "uprising"
                 ? (cfg.upfinish
                      ? [["Courts", "upcourts"], ["Play to", "uppoints"]]
                      : [["Courts", "upcourts"], ["Play to", "uppoints"], ["Scoring rounds", "uprounds"]])
                 : [["Points", "points"], ["Rounds", "rounds"], ["Courts", "courts"]]
               ).map(([lab, key]) => (
                <label className="stack" key={key}>
                  <span className="label">{lab}</span>
                  <input className="field num" type="number" min={key === "upcourts" ? 2 : 1} max={key === "courts" || key === "upcourts" ? 4 : undefined}
                    value={cfg[key]}
                    onChange={e => setCfg(c => ({ ...c, [key]: e.target.value }))} />
                </label>
              ))}
            </div>
            {/* Both of these are about the classic rotation, and both read off
                cfg.courts / cfg.rounds — the two fields UPRISING hides and
                ignores. Left ungated they told an UPRISING organiser that
                "8 players rest each round" and that 7 rounds would be unfair,
                neither of which is true of a format where nobody sits out and
                the round count is fixed at nine. */}
            {cfg.format === "uprising" && (() => {
              // The round count is the thing nobody can work out in their head:
              // it depends on the target, the changeover and the field. So the
              // organiser says when everyone has to be off court and the app
              // does the arithmetic — and snaps to a count that shares the
              // rests evenly, because finishing early and even beats using
              // every minute and ranking per round.
              const tgt = Math.max(4, Math.min(99, Number(cfg.uppoints) || UP.TARGET));
              const upC2 = Math.max(2, Math.min(Number(cfg.upcourts) || UP.COURTS,
                Math.max(2, Math.floor(selCount / 4)), UP.COURTS));
              return (
                <div className="hair" style={{ paddingTop: 0, borderTop: 0 }}>
                  <div className="label" style={{ marginBottom: 9 }}>Everyone off court by</div>
                  <div style={{ display: "flex", flexWrap: "wrap", gap: 7 }}>
                    {[[120, "2h"], [150, "2h30"], [180, "3h"], [0, "Set rounds myself"]].map(([v, lab]) => {
                      const on = (Number(cfg.upfinish) || 0) === v;
                      const sc = v ? upPlanRounds(v, tgt, { shuffle: cfg.upshuffle,
                        players: Math.max(8, selCount), courts: upC2 }) : 0;
                      return (
                        <button key={v} type="button" className={"rchip" + (on ? " on" : "")}
                          style={{ padding: "9px 13px", fontSize: 12 }}
                          onClick={() => setCfg(c => ({ ...c, upfinish: v }))}>
                          {lab}{v ? ` · ${sc} rds` : ""}
                        </button>
                      );
                    })}
                  </div>
                </div>
              );
            })()}
            {cfg.format === "uprising" && (() => {
              // Three values, not a checkbox: the shuffle is a COUNT now.
              // One round is one data point per player, and a single 11-1
              // thrashing can put a good player on the bottom court for the
              // night; two rounds sum the margins and average that out.
              // Measured at 16 players on 4 courts, the opening ladder
              // separates the strongest quarter from the weakest by 0.60
              // courts after one shuffle and 0.83 after two.
              const n = upShuffleRounds({ shuffle: cfg.upshuffle });
              const copy = {
                0: "Off — round 1 scores, and the opening courts are seeded from form, or drawn if nobody has any.",
                1: "One match that sets your starting court and scores nothing. Everyone is ranked by how far they won or lost it by.",
                2: "Two matches that score nothing. The margins are added together, so one bad start does not decide your night — at the cost of a scoring round.",
              }[n];
              return (
                <div className="hair">
                  <div className="label">The shuffle</div>
                  <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
                    {[0, 1, 2].map(v => (
                      <button key={v} type="button"
                        className={"rchip" + (v === n ? " on" : "")}
                        style={{ minWidth: 76, fontSize: 14 }}
                        onClick={() => setCfg(c => ({ ...c, upshuffle: v }))}>
                        {v === 0 ? "None" : v === 1 ? "1 round" : "2 rounds"}
                      </button>
                    ))}
                  </div>
                  <div className="note" style={{ marginTop: 10 }}>{copy}</div>
                </div>
              );
            })()}
            {cfg.format !== "uprising" && <div className="note">{hint}</div>}
            {cfg.format !== "uprising" && unevenWarning && (
              <div className="note" style={{ color: "var(--gold)" }}>{unevenWarning}</div>
            )}
          </div>

          <div className="hair">
            <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", gap: 14, marginBottom: 14 }}>
              <span className="sect">Check In</span>
              <span className="label">{selCount} checked in</span>
            </div>
            <div className="srch" style={{ marginBottom: 12 }}>
              <span className="ico">⌕</span>
              <input value={q} onChange={e => setQ(e.target.value)}
                placeholder={`Search ${people.length} players…`} />
              {q && <button className="btn ghost" style={{ padding: "5px 10px" }} onClick={() => setQ("")}>Clear</button>}
            </div>
            <div className="note" style={{ marginBottom: 12, display: "flex", justifyContent: "space-between", gap: 10 }}>
              <span>Tap everyone who showed up. Checked-in players stay at the top.</span>
              {selCount > 0 && (
                <button className="btn ghost" style={{ flex: "0 0 auto", padding: "5px 10px" }}
                  onClick={() => setSel({})}>Clear all</button>
              )}
            </div>
            {/* Walk-ins. 314 people are synced from the series DB, but somebody
                always turns up who has never played — and before this the only
                way in was the Admin tab, which is admin-only and, since the
                nav hides before a night starts, unreachable for a scorer. So
                the adder lives in the search box: type the name, tap once,
                they are created AND checked in. */}
            {canEdit && (() => {
              const n = q.trim();
              if (!n) return null;
              const dupe = people.find(p => p.name.toLowerCase() === n.toLowerCase());
              if (dupe) {
                // Do not make a second Ali. If the name already exists, the
                // button checks that person in instead of forking the roster.
                if (sel[dupe.id]) return null;
                return (
                  <button className="btn" style={{ width: "100%", marginBottom: 12 }}
                    onClick={() => { setSel(x => ({ ...x, [dupe.id]: true })); setQ(""); }}>
                    Check in {dupe.name}
                  </button>
                );
              }
              return (
                <button className="btn" style={{ width: "100%", marginBottom: 12 }}
                  onClick={() => {
                    const id = onAddGuest && onAddGuest(n);
                    if (id) { setSel(x => ({ ...x, [id]: true })); setQ(""); }
                  }}>
                  + Add “{n}” and check them in
                </button>
              );
            })()}
            {roster.length === 0 && !q.trim() && <div className="note">No players yet.</div>}
            <div className="chipgrid">
              {roster.map(p => (
                <button key={p.id} className={"chip" + (sel[p.id] ? " on" : "")}
                  onClick={() => setSel(s => ({ ...s, [p.id]: !s[p.id] }))}>
                  <Ava p={p} on={!!sel[p.id]} />
                  <span className="truncate">{p.name}</span>
                </button>
              ))}
            </div>
          </div>

          {/* Disabling the button says why before the tap; the alert that used
              to catch this fired after the scorer thought the night had
              started. Eight is the floor because one court is not a ladder. */}
          {(() => {
            const bad = cfg.format === "uprising" ? selCount < 8 : selCount < 4;
            const label = cfg.format === "uprising"
              ? (selCount < 8 ? `Check in ${8 - selCount} more` : `Start Uprising · ${selCount} players`)
              : (selCount < 4 ? "Check in 4+ players" : `Start session · ${selCount} players`);
            return <button className="btn" disabled={bad} onClick={onStart}>{label}</button>;
          })()}
        </Fragment>
      )}
    </div>
  );
}

// ── live board ──────────────────────────────────────────────────
function Board({ t, byId, canEdit, roundIdx, setRoundIdx, drafts, setDrafts, editing, setEditing,
                 onCommit, onFinish, onOpenCourts, onOpenRounds, onOpenJoin, onAbandon }) {
  const isUp = t.format === "uprising";
  const ri = Math.min(roundIdx, t.rounds.length - 1);
  const round = t.rounds[ri];
  // Where everyone stands going INTO the round being looked at, not where they
  // stand now — scrolling back to round 3 should show round 3's ladder.
  const ladder = isUp
    ? upCurrentCourts({ ...t, rounds: t.rounds.slice(0, ri) })
    : {};
  const pts = t.pointsPerMatch || 32;
  const scored = round.courts.filter(m => m.score1 != null).length;
  const sitOutNames = (round.sitOuts || []).map(id => (byId[id] && byId[id].name) || "?").join(", ");
  const canFinish = canEdit
    && t.rounds.every(r => r.courts.every(m => m.score1 != null && m.score2 != null))
    && (!isUp || t.rounds.length === upRoundsTotal(t));
  const nameOf = id => (byId[id] && byId[id].name) || "?";
  // Whether the round ON SCREEN pays double, which is not the same question as
  // whether the night has a double final — scroll back to round 3 and the
  // stakes shown must be round 3's.
  const dblRound = isUp && upDoubleFinal(t) && round.roundNum === upRoundsTotal(t);
  const dblNow = dblRound;
  // A round that pays nothing has to SAY so everywhere a number would normally
  // appear, or the first person to win one will ask why their eight points
  // never arrived.
  const isShuffle = isUp && !upScoringRound(t, round.roundNum);

  return (
    <div className="screen">
      <div>
        <Eyebrow>Live</Eyebrow>
        <div className="display">
          {isShuffle ? <Fragment>The <em>Shuffle</em></Fragment>
                     : <Fragment>Round <em>{round.roundNum}</em></Fragment>}
        </div>
        <div className="note" style={{ marginTop: 12 }}>
          {isShuffle
            ? <Fragment><b style={{ color: "var(--volt)" }}>No points.</b> This match decides the court
                everybody starts on — {upScoringRounds(t)} scoring rounds follow. · </Fragment>
            : null}
          {!isShuffle && <Fragment>of {isUp ? upRoundsTotal(t) : t.rounds.length} · </Fragment>}
          {scored}/{round.courts.length} courts scored
          {isUp && upDoubleFinal(t) && round.roundNum === upRoundsTotal(t)
            && <b style={{ color: "var(--warn)" }}> · DOUBLE POINTS</b>}
        </div>
        {isUp && (
          <div style={{ marginTop: 16, display: "flex", flexDirection: "column", gap: 6 }}>
            <div className="label" style={{ display: "flex", justifyContent: "space-between", marginBottom: 2 }}>
              <span>{isShuffle ? "The draw · nothing is at stake yet" : "The ladder"}{dblNow ? " · double points" : ""}</span>
              <span>{isShuffle ? "" : "Win / lose"}</span>
            </div>
            {/* Doubled on the final round, so the rungs show the real stake
                for the round being looked at, not the standard one. */}
            {Array.from({ length: upCourts(t) }, (_, i) => i + 1).map(c => {
              const on = Object.keys(ladder).filter(p => ladder[p] === c);
              return (
                <div key={c} className={"rung" + (c === 1 ? " top" : "")}>
                  <span className="cn">COURT {c}</span>
                  <span className="who">{on.map(nameOf).join("  ·  ")}</span>
                  {/* What this rung pays. "Court 1 is worth double Court 3"
                      means nothing as a sentence in a sign-up post; it means
                      something when it is written on the court you are
                      standing on, before you play. */}
                  {!isShuffle && (
                    <span className="worth">
                      <b>{upRoundPoints(c, true, dblNow)}</b>
                      <i>/{upRoundPoints(c, false, dblNow)}</i>
                    </span>
                  )}
                </div>
              );
            })}
            <div className="note" style={{ marginTop: 2 }}>
              {isShuffle
                ? "Win the shuffle and you start a court higher. Nothing is scored yet."
                : "Win and you go up a court. Lose and you go down."}
            </div>
          </div>
        )}
      </div>

      <div className="rchips">
        {t.rounds.map((r, i) => {
          const done = r.courts.every(m => m.score1 != null);
          return (
            <button key={i} className={"rchip" + (i === ri ? " on" : done ? " done" : "")}
              onClick={() => setRoundIdx(i)}>
              {isUp && !upScoringRound(t, r.roundNum) ? "S" : "R" + r.roundNum}
            </button>
          );
        })}
      </div>

      {/* Change courts and Late arrival both rebuild the remaining rounds with
          rebuildTail(), which calls generateSchedule() — the CLASSIC Americano
          circle method. On an UPRISING night that would overwrite the ladder
          with an Americano schedule and silently end the format mid-session.
          UPRISING's court count is not a setting either: it is players ÷ 4. So
          the controls are Americano's, and UPRISING states the fact instead. */}
      {canEdit && !isUp && (
        <div className="hair" style={{ display: "flex", flexWrap: "wrap", gap: 10, alignItems: "center", justifyContent: "space-between" }}>
          <div>
            <div className="label">Courts in use</div>
            <div className="sect" style={{ marginTop: 6 }}>{plural(t.courtCount, "court")}</div>
          </div>
          <div style={{ display: "flex", gap: 8 }}>
            <button className="btn small" onClick={onOpenCourts}>Change courts</button>
            <button className="btn small" onClick={onOpenJoin}>Late arrival</button>
          </div>
        </div>
      )}
      {canEdit && isUp && (
        <div className="hair" style={{ display: "flex", flexWrap: "wrap", gap: 10, alignItems: "center", justifyContent: "space-between" }}>
          <div>
            <div className="label">Courts in use</div>
            <div className="sect" style={{ marginTop: 6 }}>{plural(upCourts(t), "court")}</div>
            <div className="note" style={{ marginTop: 8 }}>
              {upRestCount(t) > 0
                ? `${plural(upRestCount(t), "player")} ${upRestCount(t) === 1 ? "rests" : "rest"} each round, in turn.`
                : "Nobody sits out."}
            </div>
          </div>
          {/* Courts ARE changeable mid-night now. A court freeing up or being
              taken away at 7pm is the normal way a club night goes, and the
              alternative was abandoning the session. It does NOT call
              rebuildTail — that is the classic Americano circle method and
              would overwrite the ladder. UPRISING builds one round at a time,
              so changing the count is a change to the NEXT round only. */}
          <div style={{ display: "flex", gap: 8 }}>
            <button className="btn small" onClick={onOpenCourts}>Change courts</button>
            <button className="btn small" onClick={onOpenRounds}>Rounds</button>
          </div>
        </div>
      )}

      {sitOutNames && (
        <div className="hair">
          <div className="label">Resting</div>
          <div className="note" style={{ marginTop: 8, color: "var(--muted)" }}>{sitOutNames}</div>
        </div>
      )}

      <div className="courtgrid">
        {round.courts.map((m, mi) => {
          const key = ri + "-" + mi;
          const done = m.score1 != null && m.score2 != null;
          const isEditing = !!editing[key];
          const show = canEdit && (!done || isEditing);
          // Classic Americano shares a fixed pot of points between the two
          // pairs, so one slider says everything: 20 here is 12 there.
          const slide = drafts[key] != null ? drafts[key] : (done ? Number(m.score1) : Math.round(pts / 2));
          const presets = [pts, Math.round(pts * 0.75), Math.round(pts * 0.625), Math.round(pts / 2)];

          // UPRISING does NOT work that way: a match is first to 16, so the
          // winner has 16 and the loser has 0-15 and the two do not sum to
          // anything fixed. Driven by the zero-sum slider, a real 16-11 could
          // not be entered at all, and the slider's own midpoint preset gave
          // 8-8 — which upMatchDone rejects as unfinished, so the round never
          // completed, the next round was never built, and the night stalled
          // with nothing on screen to say why. So UPRISING gets its own entry:
          // tap the side that won, then tap what the other side got.
          const upd = drafts["up-" + key] || (done
            ? { w: m.score1 > m.score2 ? 1 : 2, l: Math.min(Number(m.score1), Number(m.score2)) }
            : { w: 0, l: null });
          const upReady = upd.w > 0 && upd.l != null;
          const upS = side => upd.w === 0 ? "–" : upd.w === side ? pts : (upd.l == null ? "?" : upd.l);
          const setUp = patch => setDrafts(d => ({ ...d, ["up-" + key]: { ...upd, ...patch } }));

          const s1 = done && !isEditing ? m.score1 : !show ? "–" : isUp ? upS(1) : slide;
          const s2 = done && !isEditing ? m.score2 : !show ? "–" : isUp ? upS(2) : pts - slide;
          return (
            <div key={key} className={"court" + (done && !isEditing ? " final" : show ? " live" : "")}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12, gap: 8 }}>
                <span className="label">Court {m.court}</span>
                {/* The stake, on the card, before anyone serves. A player who
                    can see that this court pays 8 and the one below pays 4 is
                    playing the ladder; one who cannot is just playing padel. */}
                {isUp && (isShuffle
                  ? <span className="stake">SETS YOUR COURT <span className="sep">·</span> NO POINTS</span>
                  : <span className="stake">
                      WIN <b>{upRoundPoints(m.court, true, dblRound)}</b>
                      <span className="sep">·</span>
                      LOSE <b>{upRoundPoints(m.court, false, dblRound)}</b>
                      {dblRound && <span className="dbl">2×</span>}
                    </span>)}
                <span className="label" style={{ color: done ? "var(--blue-soft)" : show ? "var(--orange-br)" : "var(--muted2)" }}>
                  {done ? "Final" : show ? "Scoring" : "Awaiting"}
                </span>
              </div>

              <div style={{ display: "grid", gridTemplateColumns: "minmax(0,1fr) auto minmax(0,1fr)", gap: 10, alignItems: "center" }}>
                <div className="teamside">
                  {m.team1.map(id => (
                    <span key={id} style={{ display: "flex", alignItems: "center", gap: 8, minWidth: 0 }}>
                      <Ava p={byId[id]} /><span className="truncate" style={{ fontWeight: 700, fontSize: 14 }}>{nameOf(id)}</span>
                    </span>
                  ))}
                  {isUp && done && !isEditing && (
                    <span className={"award" + (m.score1 > m.score2 ? " win" : "")}>
                      {isShuffle ? "" : "+" + upRoundPoints(m.court, m.score1 > m.score2, dblRound)}
                      <i>{m.score1 > m.score2
                        ? (m.court === 1 ? "hold Court 1" : "up to Court " + (m.court - 1))
                        : (m.court === upCourts(t) ? "stay on Court " + m.court : "down to Court " + (m.court + 1))}</i>
                    </span>
                  )}
                </div>
                <div style={{ textAlign: "center" }}>
                  <div className="score" style={{ color: "var(--cream)" }}>
                    {s1}<span style={{ color: "var(--muted2)", fontSize: 20 }}> · </span>{s2}
                  </div>
                </div>
                <div className="teamside" style={{ alignItems: "flex-end" }}>
                  {/* NOT row-reverse. Reversing the row puts the overflow on
                      the left, so a long name was clipped mid-word and ran
                      straight through the score instead of ellipsing —
                      "Abdurahman Riyami" printed over the 0 of 16–0. Normal
                      direction with the avatar last keeps the ellipsis where
                      the browser can draw it. */}
                  {m.team2.map(id => (
                    <span key={id} style={{ display: "flex", alignItems: "center", justifyContent: "flex-end", gap: 8, minWidth: 0, width: "100%" }}>
                      <span className="truncate" style={{ fontWeight: 700, fontSize: 14, textAlign: "right" }}>{nameOf(id)}</span>
                      <Ava p={byId[id]} />
                    </span>
                  ))}
                  {isUp && done && !isEditing && (
                    <span className={"award" + (m.score2 > m.score1 ? " win" : "")} style={{ textAlign: "right" }}>
                      {isShuffle ? "" : "+" + upRoundPoints(m.court, m.score2 > m.score1, dblRound)}
                      <i>{m.score2 > m.score1
                        ? (m.court === 1 ? "hold Court 1" : "up to Court " + (m.court - 1))
                        : (m.court === upCourts(t) ? "stay on Court " + m.court : "down to Court " + (m.court + 1))}</i>
                    </span>
                  )}
                </div>
              </div>

              {show && isUp && (
                <div style={{ marginTop: 14 }}>
                  <div className="label">Who won the court</div>
                  <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
                    {[1, 2].map(side => (
                      <button key={side} className={"wbtn" + (upd.w === side ? " on" : "")}
                        onClick={() => setUp({ w: side })}>
                        {(side === 1 ? m.team1 : m.team2).map(id => nameOf(id).split(" ")[0]).join(" + ")}
                      </button>
                    ))}
                  </div>
                  {upd.w > 0 && (
                    <div style={{ marginTop: 14 }}>
                      <div className="label">
                        And {(upd.w === 1 ? m.team2 : m.team1).map(id => nameOf(id).split(" ")[0]).join(" + ")} got
                      </div>
                      <div className={"pad" + (pts > 16 ? " tight" : "")}>
                        {Array.from({ length: pts }, (_, v) => v).map(v => (
                          <button key={v} className={"pbtn" + (upd.l === v ? " on" : "")}
                            onClick={() => setUp({ l: v })}>{v}</button>
                        ))}
                      </div>
                    </div>
                  )}
                  <button className="btn" style={{ width: "100%", marginTop: 16 }} disabled={!upReady}
                    onClick={() => onCommit(ri, mi, upS(1), upS(2), key)}>
                    {!upd.w ? "Pick the winning pair"
                      : upd.l == null ? "Pick their score"
                      : (done ? "Update" : "Confirm") + ` ${upS(1)}–${upS(2)}`}
                  </button>
                </div>
              )}

              {show && !isUp && (
                <div style={{ marginTop: 14 }}>
                  <div className="track"><i style={{ width: Math.round((slide / pts) * 100) + "%" }} /></div>
                  <input type="range" min="0" max={pts} value={slide}
                    onChange={e => setDrafts(d => ({ ...d, [key]: Number(e.target.value) }))} />
                  <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginTop: 10 }}>
                    {presets.map(v => (
                      <button key={v} className="btn small" onClick={() => setDrafts(d => ({ ...d, [key]: v }))}>
                        {v}-{pts - v}
                      </button>
                    ))}
                    <button className="btn" style={{ marginLeft: "auto", padding: "10px 18px" }}
                      onClick={() => onCommit(ri, mi, slide, pts - slide, key)}>
                      {done ? "Update score" : "Confirm score"}
                    </button>
                  </div>
                </div>
              )}
              {done && canEdit && !isEditing && (
                <div style={{ marginTop: 12, textAlign: "right" }}>
                  <button className="btn small" onClick={() => setEditing(e => ({ ...e, [key]: true }))}>Edit score</button>
                </div>
              )}
            </div>
          );
        })}
      </div>

      {canFinish && <button className="btn" onClick={onFinish}>Finish session 🏆</button>}

      {/* A session with unscored matches can never be finished, so without this
          an abandoned night stays `active` forever and the app opens into it
          instead of Setup — there is no other way back. An August session with
          seven unscored rounds was still on the board in October. */}
      {canEdit && !canFinish && (
        <button className="btn ghost" style={{ borderColor: "rgba(var(--warn-rgb),.45)", color: "var(--warn)" }}
          onClick={onAbandon}>Abandon session</button>
      )}
    </div>
  );
}

        <Eyebrow>{t.name}</Eyebrow>
        <div className="display">The <em>Standings</em></div>

}

// ── players ─────────────────────────────────────────────────────
function Players({ people, tournaments, query, setQuery, onOpenStats }) {
  const q = query.toLowerCase();
  const cards = people.filter(p => p.name.toLowerCase().includes(q))
    .sort((a, b) => a.name.localeCompare(b.name))
    .map(p => {
      let played = 0, pointsTotal = 0;
      tournaments.forEach(tt => (tt.rounds || []).forEach(r => (r.courts || []).forEach(m => {
        if (m.score1 == null) return;
        if (m.team1.includes(p.id)) { played++; pointsTotal += Number(m.score1); }
        else if (m.team2.includes(p.id)) { played++; pointsTotal += Number(m.score2); }
      })));
      return { ...p, sub: played ? `${played} matches · ${pointsTotal} pts` : "No matches yet" };
    });
  return (
    <div className="screen">
      <div>
        <Eyebrow>{plural(people.length, "player")}</Eyebrow>
        <div className="display">The <em>Roster</em></div>
      </div>
      <input className="field" placeholder="Search players…" value={query} onChange={e => setQuery(e.target.value)} />
      <div className="hair" style={{ display: "flex", flexDirection: "column" }}>
        {cards.map(p => (
          <button key={p.id} className="row" onClick={() => onOpenStats(p.id)}
            style={{ background: "transparent", border: 0, borderBottom: "1px solid var(--line2)", cursor: "pointer", color: "inherit", textAlign: "left", width: "100%" }}>
            <Ava p={p} />
            <span style={{ flex: 1, minWidth: 0 }}>
              <span className="truncate" style={{ display: "block", fontWeight: 700 }}>{p.name}</span>
              <span className="label" style={{ letterSpacing: ".12em" }}>{p.sub}</span>
            </span>
            {p.guest && <span className="label" style={{ color: "var(--blue-soft)" }}>Guest</span>}
          </button>
        ))}
      </div>
    </div>
  );
}

// What anybody who taps the link sees when there is no night running.
