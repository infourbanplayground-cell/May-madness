<script>
(function(){
  fetch("/version.txt?_=" + Date.now(), { cache: "no-store" })
    .then(function(r){ return r.text(); })
    .then(function(v){
      v = v.trim();
      var stored = localStorage.getItem("am-build");
      if (stored && stored !== v) { localStorage.setItem("am-build", v); location.reload(true); }
      else { localStorage.setItem("am-build", v); }
    }).catch(function(){});
})();
</script>

<style>

    --orange:#FF5E1E; --orange-br:#FF8A3D; --red:#FF2A24; --ember:#8A1E08;

  /* ── modal ──────────────────────────────────── */

<body>
<div class="bg"></div>
<div id="root" class="wrap"></div>

<script type="text/babel" data-presets="react">

const { useState, useEffect, useMemo, useRef, Fragment } = React;

// ── storage / small helpers ──────────────────────────────────────
const LS = {
  get(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } },
  set(k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) {} }
};
const uid = p => p + "_" + Math.random().toString(36).slice(2, 10);
const initials = n => (n || "?").split(" ").filter(Boolean).map(w => w[0]).slice(0, 2).join("").toUpperCase();
const restPhrase = n => (n === 1 ? "1 player rests" : n + " players rest");
const plural = (n, w) => n + " " + w + (n === 1 ? "" : "s");

// ── Americano scheduling: circle method ─────────────────────────
// Over (n-1) rounds (n even; padded with a bye slot if odd) every pair of
// players appears together as PARTNERS exactly once — the rotation math used
// by classic Americano generators. Courts are formed by combining two partner
// pairs, with the grouping offset rotated each round for opponent variety.
function circlePairRounds(n) {
  const arr = Array.from({ length: n }, (_, i) => i);
  if (n % 2 === 1) arr.push(-1);
  const total = arr.length, cycles = total - 1;
  let cur = arr.slice();
  const rounds = [];
  for (let r = 0; r < cycles; r++) {
    const pairs = [];
    for (let i = 0; i < total / 2; i++) pairs.push([cur[i], cur[total - 1 - i]]);
    rounds.push(pairs);
    const fixed = cur[0], rest = cur.slice(1);
    rest.unshift(rest.pop());
    cur = [fixed, ...rest];
  }
  return rounds;
}
const maxCourtsFor = pc => Math.max(1, Math.floor(Math.floor(pc / 2) / 2));

// Capping courts never changes WHO partners WHOM — the circle method decides
// that alone. It only decides which pairs get a court; a benched pair's
// partnership is skipped, never repeated. `sitOutCounts` carries sit-out
// history so rest spreads evenly. `cycleShift` rotates the starting point in
// the cycle (used when the player set changes mid-session).
function generateSchedule(playerIds, numRounds, maxCourts, opts) {
  const n = playerIds.length;
  if (n < 4) return [];
  const startRound = (opts && opts.startRound) || 0;
  const cycleShift = (opts && opts.cycleShift) || 0;
  const sitOutCounts = Object.assign({}, (opts && opts.sitOutCounts) || {});
  const courtCap = Math.max(1, Number(maxCourts) || maxCourtsFor(n));
  const cyclePairs = circlePairRounds(n), cycles = cyclePairs.length;
  const rounds = [];
  for (let r = startRound; r < numRounds; r++) {
    const pairsIdx = cyclePairs[(r + cycleShift) % cycles];
    const realPairs = [], byePlayers = [];
    pairsIdx.forEach(([a, b]) => {
      if (a === -1 && b !== -1) byePlayers.push(playerIds[b]);
      else if (b === -1 && a !== -1) byePlayers.push(playerIds[a]);
      else if (a !== -1 && b !== -1) realPairs.push([playerIds[a], playerIds[b]]);
    });
    const offset = r % Math.max(1, realPairs.length);
    let playing = realPairs.slice(offset).concat(realPairs.slice(0, offset));
    const capacity = courtCap * 2;
    if (playing.length > capacity) {
      const ranked = playing.map((pair, i) => ({ i, load: (sitOutCounts[pair[0]] || 0) + (sitOutCounts[pair[1]] || 0) }));
      ranked.sort((x, y) => x.load - y.load || x.i - y.i);
      const benched = new Set(ranked.slice(0, playing.length - capacity).map(x => x.i));
      playing.forEach((pair, i) => { if (benched.has(i)) byePlayers.push(pair[0], pair[1]); });
      playing = playing.filter((_, i) => !benched.has(i));
    }
    if (playing.length % 2 === 1) {
      const last = playing[playing.length - 1];
      byePlayers.push(last[0], last[1]);
      playing = playing.slice(0, -1);
    }
    const courts = [];
    for (let i = 0; i + 1 < playing.length; i += 2) {
      courts.push({ court: courts.length + 1, team1: playing[i], team2: playing[i + 1], score1: null, score2: null });
    }
    byePlayers.forEach(id => { sitOutCounts[id] = (sitOutCounts[id] || 0) + 1; });
    rounds.push({ roundNum: r + 1, sitOuts: byePlayers, courts });
  }
  return rounds;
}

function firstUnplayedIndex(t) {
  const cut = t.rounds.findIndex(r => r.courts.every(m => m.score1 == null && m.score2 == null));
  return cut === -1 ? t.rounds.length : cut;
}
const pairKey = (a, b) => [a, b].sort().join("|");
function playedPairs(rounds) {
  const used = new Set();
  rounds.forEach(r => r.courts.forEach(m => { used.add(pairKey(m.team1[0], m.team1[1])); used.add(pairKey(m.team2[0], m.team2[1])); }));
  return used;
}

// Rebuild the not-yet-scored rounds — for a new court count, a new player set,
// or both. Rounds with any score entered are kept exactly as played.
//
// Changing the COURT count keeps the same circle cycle, so the partner
// rotation simply carries on and no pairing repeats. Changing the PLAYER set
// (a late arrival) necessarily builds a *different* cycle, which could replay
// a partnership already used. To limit that we try every starting offset in
// the new cycle and keep whichever produces the fewest repeats.
function rebuildTail(t, newCourts, newPlayerIds) {
  const cut = firstUnplayedIndex(t);
  const kept = t.rounds.slice(0, cut);
  const sitOutCounts = {};
  kept.forEach(r => (r.sitOuts || []).forEach(id => { sitOutCounts[id] = (sitOutCounts[id] || 0) + 1; }));
  const ids = newPlayerIds || t.playerIds;
  const courts = Math.max(1, Math.min(Number(newCourts) || t.courtCount, maxCourtsFor(ids.length)));
  const build = shift => generateSchedule(ids, t.rounds.length, courts, { startRound: cut, sitOutCounts, cycleShift: shift });

  let rebuilt;
  const sameRoster = !newPlayerIds || (newPlayerIds.length === t.playerIds.length
    && newPlayerIds.every(id => t.playerIds.includes(id)));
  if (sameRoster) {
    rebuilt = build(0);
  } else {
    const used = playedPairs(kept);
    const cycles = Math.max(1, (ids.length % 2 === 0 ? ids.length - 1 : ids.length));
    let best = null;
    for (let s = 0; s < cycles; s++) {
      const cand = build(s);
      let clashes = 0;
      cand.forEach(r => r.courts.forEach(m => {
        if (used.has(pairKey(m.team1[0], m.team1[1]))) clashes++;
        if (used.has(pairKey(m.team2[0], m.team2[1]))) clashes++;
      }));
      if (!best || clashes < best.clashes) best = { rounds: cand, clashes };
      if (clashes === 0) break;
    }
    rebuilt = best.rounds;
  }
  return Object.assign({}, t, { courtCount: courts, playerIds: ids, rounds: [...kept, ...rebuilt] });
}

function calcStandings(t, byId) {
  const stats = {};
  (t.playerIds || []).forEach(id => {
    stats[id] = { id, name: (byId[id] && byId[id].name) || "?", photoUrl: byId[id] && byId[id].photoUrl, points: 0, played: 0, wins: 0, diff: 0 };
  });
  (t.rounds || []).forEach(round => (round.courts || []).forEach(m => {
    if (m.score1 == null || m.score2 == null) return;
    const s1 = Number(m.score1), s2 = Number(m.score2);
    m.team1.forEach(id => { const s = stats[id]; if (!s) return; s.points += s1; s.played++; s.diff += s1 - s2; if (s1 > s2) s.wins++; });
    m.team2.forEach(id => { const s = stats[id]; if (!s) return; s.points += s2; s.played++; s.diff += s2 - s1; if (s2 > s1) s.wins++; });
  }));
  return Object.values(stats).sort((a, b) => b.points - a.points || b.diff - a.diff || b.wins - a.wins);
}

// ── atoms ───────────────────────────────────────────────────────
function Eyebrow({ children }) { return <div className="eyebrow"><i /> {children}</div>; }
function Ava({ p, on, lg }) {
  return (
    <span className={"ava" + (on ? " on" : "") + (lg ? " lg" : "")}>
      {p && p.photoUrl ? <img src={p.photoUrl} alt="" /> : initials(p && p.name)}
    </span>
  );
}
function Sheet({ title, onClose, children }) {
  return (
    <div className="scrim" onClick={onClose}>
      <div className="sheet" onClick={e => e.stopPropagation()}>
        <div className="sheethead">
          <span className="sect">{title}</span>
          <button className="btn small" onClick={onClose}>Close</button>
        </div>
        {children}
      </div>
    </div>
  );
}

// ── setup ───────────────────────────────────────────────────────
function Setup({ people, canEdit, cfg, setCfg, sel, setSel, onStart }) {
  const selCount = Object.values(sel).filter(Boolean).length;
  const suggested = selCount >= 4 ? (selCount % 2 === 0 ? selCount - 1 : selCount) : 0;
  const needed = selCount >= 4 ? maxCourtsFor(selCount) : 0;
  const useCourts = Math.max(1, Math.min(Number(cfg.courts) || 1, needed || 1));
  const benched = selCount >= 4 ? Math.max(0, selCount - useCourts * 4) : 0;
  const roster = useMemo(() => people.slice().sort((a, b) => a.name.localeCompare(b.name)), [people]);

  const hint = selCount < 4
    ? "Check in at least 4 players to start."
    : `Full partner rotation for ${selCount} players covers ${suggested} rounds. ` + (benched > 0
      ? `On ${plural(useCourts, "court")}, ${restPhrase(benched)} each round, rotated evenly.`
      : `${plural(needed, "court")} runs every match at once — nobody rests.`);

  return (
    <div className="screen">
      <div>
        <Eyebrow>New Session</Eyebrow>
        <div className="display">Classic <em>Americano</em></div>
        <p className="lede">
          Partners rotate every round — no fixed teams. Every point your pair wins adds to <b>your own</b> total,
          and individual totals decide the final ranking.
        </p>
      </div>

      {!canEdit ? (
        <div className="hair" style={{ fontSize: 15, color: "var(--muted)" }}>
          Log in as scorer or admin to set up a session.
        </div>
      ) : (
        <Fragment>
          <div className="hair" style={{ display: "flex", flexDirection: "column", gap: 18 }}>
            <input className="field big" placeholder="Session name" value={cfg.name}
              onChange={e => setCfg(c => ({ ...c, name: e.target.value }))} />
            <div className="grid3">
              {[["Points", "points"], ["Rounds", "rounds"], ["Courts", "courts"]].map(([lab, key]) => (
                <label className="stack" key={key}>
                  <span className="label">{lab}</span>
                  <input className="field num" type="number" min="1" value={cfg[key]}
                    onChange={e => setCfg(c => ({ ...c, [key]: e.target.value }))} />
                </label>
              ))}
            </div>
            <div className="note">{hint}</div>
          </div>

          <div className="hair">
            <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", gap: 14, marginBottom: 14 }}>
              <span className="sect">Check In</span>
              <span className="label">{selCount} checked in</span>
            </div>
            <div className="note" style={{ marginBottom: 12 }}>Tap everyone who showed up.</div>
            <div className="chipgrid">
              {roster.map(p => (
                <button key={p.id} className={"chip" + (sel[p.id] ? " on" : "")}
                  onClick={() => setSel(s => ({ ...s, [p.id]: !s[p.id] }))}>
                  <Ava p={p} on={!!sel[p.id]} />
                  <span className="truncate">{p.name}</span>
                </button>
              ))}
            </div>
          </div>

          <button className="btn" disabled={selCount < 4} onClick={onStart}>
            {selCount < 4 ? "Check in 4+ players" : `Start session · ${selCount} players`}
          </button>
        </Fragment>
      )}
    </div>
  );
}

// ── live board ──────────────────────────────────────────────────
function Board({ t, byId, canEdit, roundIdx, setRoundIdx, drafts, setDrafts, editing, setEditing,
                 onCommit, onFinish, onOpenCourts, onOpenJoin }) {
  const ri = Math.min(roundIdx, t.rounds.length - 1);
  const round = t.rounds[ri];
  const pts = t.pointsPerMatch || 32;
  const scored = round.courts.filter(m => m.score1 != null).length;
  const sitOutNames = (round.sitOuts || []).map(id => (byId[id] && byId[id].name) || "?").join(", ");
  const canFinish = canEdit && t.rounds.every(r => r.courts.every(m => m.score1 != null && m.score2 != null));
  const nameOf = id => (byId[id] && byId[id].name) || "?";

  return (
    <div className="screen">
      <div>
        <Eyebrow>Live</Eyebrow>
        <div className="display">Round <em>{round.roundNum}</em></div>
        <div className="note" style={{ marginTop: 12 }}>
          of {t.rounds.length} · {scored}/{round.courts.length} courts scored
        </div>
      </div>

      <div className="rchips">
        {t.rounds.map((r, i) => {
          const done = r.courts.every(m => m.score1 != null);
          return (
            <button key={i} className={"rchip" + (i === ri ? " on" : done ? " done" : "")}
              onClick={() => setRoundIdx(i)}>R{r.roundNum}</button>
          );
        })}
      </div>

      {canEdit && (
        <div className="hair" style={{ display: "flex", flexWrap: "wrap", gap: 10, alignItems: "center", justifyContent: "space-between" }}>
          <div>
            <div className="label">Courts in use</div>
            <div className="sect" style={{ marginTop: 6 }}>{plural(t.courtCount, "court")}</div>
          </div>
          <div style={{ display: "flex", gap: 8 }}>
            <button className="btn small" onClick={onOpenCourts}>Change courts</button>
            <button className="btn small" onClick={onOpenJoin}>Late arrival</button>
          </div>
        </div>
      )}

      {sitOutNames && (
        <div className="hair">
          <div className="label">Resting</div>
          <div className="note" style={{ marginTop: 8, color: "var(--muted)" }}>{sitOutNames}</div>
        </div>
      )}

      <div className="courtgrid">
        {round.courts.map((m, mi) => {
          const key = ri + "-" + mi;
          const done = m.score1 != null && m.score2 != null;
          const isEditing = !!editing[key];
          const show = canEdit && (!done || isEditing);
          const slide = drafts[key] != null ? drafts[key] : (done ? Number(m.score1) : Math.round(pts / 2));
          const s1 = done && !isEditing ? m.score1 : show ? slide : "–";
          const s2 = done && !isEditing ? m.score2 : show ? pts - slide : "–";
          const presets = [pts, Math.round(pts * 0.75), Math.round(pts * 0.625), Math.round(pts / 2)];
          return (
            <div key={key} className={"court" + (done && !isEditing ? " final" : show ? " live" : "")}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
                <span className="label">Court {m.court}</span>
                <span className="label" style={{ color: done ? "var(--blue-soft)" : show ? "var(--orange-br)" : "var(--muted2)" }}>
                  {done ? "Final" : show ? "Scoring" : "Awaiting"}
                </span>
              </div>

              <div style={{ display: "grid", gridTemplateColumns: "1fr auto 1fr", gap: 10, alignItems: "center" }}>
                <div className="teamside">
                  {m.team1.map(id => (
                    <span key={id} style={{ display: "flex", alignItems: "center", gap: 8, minWidth: 0 }}>
                      <Ava p={byId[id]} /><span className="truncate" style={{ fontWeight: 700, fontSize: 14 }}>{nameOf(id)}</span>
                    </span>
                  ))}
                </div>
                <div style={{ textAlign: "center" }}>
                  <div className="score" style={{ color: "var(--cream)" }}>
                    {s1}<span style={{ color: "var(--muted2)", fontSize: 20 }}> · </span>{s2}
                  </div>
                </div>
                <div className="teamside" style={{ alignItems: "flex-end" }}>
                  {m.team2.map(id => (
                    <span key={id} style={{ display: "flex", alignItems: "center", gap: 8, minWidth: 0, flexDirection: "row-reverse" }}>
                      <Ava p={byId[id]} /><span className="truncate" style={{ fontWeight: 700, fontSize: 14 }}>{nameOf(id)}</span>
                    </span>
                  ))}
                </div>
              </div>

              {show && (
                <div style={{ marginTop: 14 }}>
                  <div className="track"><i style={{ width: Math.round((slide / pts) * 100) + "%" }} /></div>
                  <input type="range" min="0" max={pts} value={slide}
                    onChange={e => setDrafts(d => ({ ...d, [key]: Number(e.target.value) }))} />
                  <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginTop: 10 }}>
                    {presets.map(v => (
                      <button key={v} className="btn small" onClick={() => setDrafts(d => ({ ...d, [key]: v }))}>
                        {v}-{pts - v}
                      </button>
                    ))}
                    <button className="btn" style={{ marginLeft: "auto", padding: "10px 18px" }}
                      onClick={() => onCommit(ri, mi, slide, pts - slide, key)}>
                      {done ? "Update score" : "Confirm score"}
                    </button>
                  </div>
                </div>
              )}
              {done && canEdit && !isEditing && (
                <div style={{ marginTop: 12, textAlign: "right" }}>
                  <button className="btn small" onClick={() => setEditing(e => ({ ...e, [key]: true }))}>Edit score</button>
                </div>
              )}
            </div>
          );
        })}
      </div>

      {canFinish && <button className="btn" onClick={onFinish}>Finish session 🏆</button>}
    </div>
  );
}

// ── standings ───────────────────────────────────────────────────
function Standings({ t, byId, onPodium }) {
  if (!t) return (
    <div className="screen">
      <div><Eyebrow>Standings</Eyebrow><div className="display">No <em>session</em></div>
        <p className="lede">Start a session and scores will show up here.</p></div>
    </div>
  );
  const table = calcStandings(t, byId);
  return (
    <div className="screen">
      <div>
        <Eyebrow>{t.name}</Eyebrow>
        <div className="display">The <em>Standings</em></div>
      </div>
      {table.length > 0 && (
        <div><button className="btn gold" onClick={onPodium}>Podium 👑</button></div>
      )}
      <div className="hair" style={{ display: "flex", flexDirection: "column" }}>
        {table.map((s, i) => (
          <div className="row" key={s.id} style={i === 0 ? { background: "rgba(255,194,75,.07)", borderRadius: 12 } : null}>
            <span className="score" style={{ fontSize: 22, width: 34, textAlign: "center", color: i === 0 ? "var(--gold)" : "var(--muted2)" }}>{i + 1}</span>
            <Ava p={s} on={i === 0} />
            <span style={{ flex: 1, minWidth: 0 }}>
              <span className="truncate" style={{ display: "block", fontWeight: 800 }}>{s.name}</span>
              <span className="label" style={{ letterSpacing: ".12em" }}>{s.played} played · {s.wins} won</span>
            </span>
            <span style={{ textAlign: "right" }}>
              <span className="score" style={{ fontSize: 26, color: "var(--orange-br)", display: "block" }}>{s.points}</span>
              <span className="label" style={{ letterSpacing: ".12em" }}>{s.diff > 0 ? "+" : ""}{s.diff}</span>
            </span>
          </div>
        ))}
      </div>
    </div>
  );
}

// ── players ─────────────────────────────────────────────────────
function Players({ people, tournaments, query, setQuery, onOpenStats }) {
  const q = query.toLowerCase();
  const cards = people.filter(p => p.name.toLowerCase().includes(q))
    .sort((a, b) => a.name.localeCompare(b.name))
    .map(p => {
      let played = 0, pointsTotal = 0;
      tournaments.forEach(tt => (tt.rounds || []).forEach(r => (r.courts || []).forEach(m => {
        if (m.score1 == null) return;
        if (m.team1.includes(p.id)) { played++; pointsTotal += Number(m.score1); }
        else if (m.team2.includes(p.id)) { played++; pointsTotal += Number(m.score2); }
      })));
      return { ...p, sub: played ? `${played} matches · ${pointsTotal} pts` : "No matches yet" };
    });
  return (
    <div className="screen">
      <div>
        <Eyebrow>{plural(people.length, "player")}</Eyebrow>
        <div className="display">The <em>Roster</em></div>
      </div>
      <input className="field" placeholder="Search players…" value={query} onChange={e => setQuery(e.target.value)} />
      <div className="hair" style={{ display: "flex", flexDirection: "column" }}>
        {cards.map(p => (
          <button key={p.id} className="row" onClick={() => onOpenStats(p.id)}
            style={{ background: "transparent", border: 0, borderBottom: "1px solid var(--line2)", cursor: "pointer", color: "inherit", textAlign: "left", width: "100%" }}>
            <Ava p={p} />
            <span style={{ flex: 1, minWidth: 0 }}>
              <span className="truncate" style={{ display: "block", fontWeight: 700 }}>{p.name}</span>
              <span className="label" style={{ letterSpacing: ".12em" }}>{p.sub}</span>
            </span>
            {p.guest && <span className="label" style={{ color: "var(--blue-soft)" }}>Guest</span>}
          </button>
        ))}
      </div>
    </div>
  );
}

// ── admin (guests only) ─────────────────────────────────────────
function Admin({ guests, newName, setNewName, onAdd, onRename, onDelete }) {
  return (
    <div className="screen">
      <div>
        <Eyebrow>Admin</Eyebrow>
        <div className="display">Manage <em>Guests</em></div>
        <p className="lede">
          The main roster is synced from <b>August Attack</b> and is read-only here — add or edit those players there.
          Guests below are local to Americano, for one-off drop-ins.
        </p>
      </div>
      <div className="hair" style={{ display: "flex", gap: 10, alignItems: "flex-end" }}>
        <input className="field" placeholder="Add a guest player…" value={newName}
          onChange={e => setNewName(e.target.value)}
          onKeyDown={e => e.key === "Enter" && onAdd()} />
        <button className="btn" onClick={onAdd}>Add</button>
      </div>
      <div style={{ display: "flex", flexDirection: "column" }}>
        {guests.length === 0 && <div className="note">No guest players yet.</div>}
        {guests.map(p => (
          <div className="row" key={p.id}>
            <Ava p={p} />
            <input className="field" style={{ borderBottom: 0, fontWeight: 700 }} value={p.name}
              onChange={e => onRename(p.id, e.target.value)} />
            <button className="btn small" style={{ borderColor: "rgba(255,42,36,.32)", color: "var(--orange-br)" }}
              onClick={() => onDelete(p.id)}>Del</button>
          </div>
        ))}
      </div>
    </div>
  );
}

// ── history ─────────────────────────────────────────────────────
function History({ tournaments, byId, onOpen }) {
  const done = tournaments.filter(x => x.status === "completed").sort((a, b) => b.createdAt - a.createdAt);
  return (
    <div className="screen">
      <div>
        <Eyebrow>Archive</Eyebrow>
        <div className="display">Past <em>Sessions</em></div>
      </div>
      {done.length === 0
        ? <div className="hair note">No completed sessions yet.</div>
        : (
          <div className="hair" style={{ display: "flex", flexDirection: "column" }}>
            {done.map(tt => {
              const s = calcStandings(tt, byId);
              return (
                <button key={tt.id} className="row" onClick={() => onOpen(tt.id)}
                  style={{ background: "transparent", border: 0, borderBottom: "1px solid var(--line2)", cursor: "pointer", color: "inherit", textAlign: "left", width: "100%" }}>
                  <span style={{ flex: 1, minWidth: 0 }}>
                    <span className="truncate" style={{ display: "block", fontWeight: 800, fontSize: 16 }}>{tt.name}</span>
                    <span className="label" style={{ letterSpacing: ".12em" }}>
                      {new Date(tt.createdAt).toLocaleDateString()} · {tt.playerIds.length} players · {tt.rounds.length} rounds
                    </span>
                  </span>
                  <span style={{ textAlign: "right" }}>
                    <span className="label" style={{ color: "var(--gold)" }}>Winner</span>
                    <span className="truncate" style={{ display: "block", fontWeight: 700 }}>{s.length ? s[0].name : "—"}</span>
                  </span>
                </button>
              );
            })}
          </div>
        )}
    </div>
  );
}

// ── app ─────────────────────────────────────────────────────────
function App() {
  const [data, setData] = useState({ players: [], guests: [], tournaments: [] });
  const [loaded, setLoaded] = useState(false);
  const [role, setRole] = useState(LS.get("am-role"));
  const [token, setTokenState] = useState(LS.get("am-token"));
  const [view, setView] = useState("board");
  const [modal, setModal] = useState(null);
  const [pin, setPin] = useState("");
  const [loginErr, setLoginErr] = useState(false);
  const [sel, setSel] = useState({});
  const [cfg, setCfg] = useState({ name: "", points: 32, rounds: 7, courts: 2 });
  const [roundIdx, setRoundIdx] = useState(0);
  const [drafts, setDrafts] = useState({});
  const [editing, setEditing] = useState({});
  const [courtsPick, setCourtsPick] = useState(null);
  const [query, setQuery] = useState("");
  const [newName, setNewName] = useState("");
  const [statsId, setStatsId] = useState(null);
  const [historyId, setHistoryId] = useState(null);
  const [podiumId, setPodiumId] = useState(null);
  const saveTimer = useRef(null);

  useEffect(() => {
    fetch("/state").then(r => r.json()).then(r => {
      if (r && r.ok) setData(d => ({ players: [], guests: [], tournaments: [], ...r.state }));
      setLoaded(true);
    }).catch(() => setLoaded(true));
  }, []);

  const canEdit = role === "admin" || role === "scorer";
  const guests = data.guests || [];
  const people = useMemo(
    () => [...(data.players || []), ...guests.map(g => ({ ...g, guest: true }))],
    [data.players, guests]
  );
  const byId = useMemo(() => { const m = {}; people.forEach(p => { m[p.id] = p; }); return m; }, [people]);
  const tournaments = data.tournaments || [];
  const active = tournaments.find(t => t.status === "active");

  function persist(next) {
    setData(next);
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      fetch("/save", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + LS.get("am-token") },
        body: JSON.stringify({ state: next })
      }).catch(() => {});
    }, 400);
  }
  const saveT = nextT => persist({ ...data, tournaments: tournaments.map(x => x.id === nextT.id ? nextT : x) });

  function startSession() {
    const ids = Object.keys(sel).filter(id => sel[id]);
    if (ids.length < 4) return;
    const courts = Math.max(1, Math.min(Number(cfg.courts) || 1, maxCourtsFor(ids.length)));
    const rounds = Number(cfg.rounds) || 1;
    const nt = {
      id: uid("t"), name: cfg.name.trim() || "Americano " + new Date().toLocaleDateString(),
      createdAt: Date.now(), pointsPerMatch: Number(cfg.points) || 32,
      playerIds: ids, numRounds: rounds, courtCount: courts,
      rounds: generateSchedule(ids, rounds, courts), status: "active"
    };
    persist({ ...data, tournaments: [...tournaments, nt] });
    setRoundIdx(0); setView("board");
  }
  function commitScore(ri, mi, s1, s2, key) {
    if (!active) return;
    const rounds = active.rounds.map((r, i) => i !== ri ? r : {
      ...r, courts: r.courts.map((mm, j) => j !== mi ? mm : { ...mm, score1: s1, score2: s2 })
    });
    saveT({ ...active, rounds });
    setEditing(e => ({ ...e, [key]: false }));
  }
  function finishSession() {
    if (!active) return;
    saveT({ ...active, status: "completed", completedAt: Date.now() });
    setPodiumId(active.id); setSel({}); setModal("podium");
  }
  function submitLogin() {
    fetch("/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ pin }) })
      .then(r => r.json()).then(r => {
        if (r && r.ok) {
          LS.set("am-token", r.token); LS.set("am-role", r.role);
          setTokenState(r.token); setRole(r.role); setModal(null); setLoginErr(false); setPin("");
        } else setLoginErr(true);
      }).catch(() => setLoginErr(true));
  }
  function logout() {
    LS.set("am-role", ""); LS.set("am-token", "");
    setRole(""); setTokenState(""); setView("board");
  }
  function addGuest() {
    const n = newName.trim(); if (!n) return;
    persist({ ...data, guests: [...guests, { id: uid("g"), name: n }] });
    setNewName("");
  }

  if (!loaded) return <div style={{ minHeight: "100vh", display: "grid", placeItems: "center", color: "var(--muted2)" }}>Loading…</div>;

  const shownT = historyId ? tournaments.find(x => x.id === historyId) : active;
  const podiumT = podiumId ? tournaments.find(x => x.id === podiumId) : shownT;
  const navDefs = [
    { id: "board", label: active ? "Board" : "Setup" },
    { id: "standings", label: "Standings" },
    { id: "players", label: "Players" },
    { id: "history", label: "History" }
  ];
  if (role === "admin") navDefs.push({ id: "admin", label: "Admin" });
  const headerSub = active ? active.name : (canEdit ? "Ready to set up" : "Guest view");

  return (
    <Fragment>
      <header className="top">
        <div className="brand">
          <span className="mark">🎾</span>
          <span style={{ display: "flex", flexDirection: "column", minWidth: 0 }}>
            <span className="name">Americano</span>
            <span className="sub">{headerSub}</span>
          </span>
        </div>
        {canEdit
          ? <button className="btn ghost" onClick={logout}>{role}</button>
          : <button className="btn pill" onClick={() => { setModal("login"); setPin(""); setLoginErr(false); }}>Login</button>}
      </header>

      <main>
        {view === "board" && (active
          ? <Board t={active} byId={byId} canEdit={canEdit} roundIdx={roundIdx} setRoundIdx={setRoundIdx}
              drafts={drafts} setDrafts={setDrafts} editing={editing} setEditing={setEditing}
              onCommit={commitScore} onFinish={finishSession}
              onOpenCourts={() => { setCourtsPick(active.courtCount); setModal("courts"); }}
              onOpenJoin={() => setModal("join")} />
          : <Setup people={people} canEdit={canEdit} cfg={cfg} setCfg={setCfg} sel={sel} setSel={setSel} onStart={startSession} />)}

        {view === "standings" && <Standings t={shownT} byId={byId}
          onPodium={() => { setPodiumId(shownT ? shownT.id : null); setModal("podium"); }} />}

        {view === "players" && <Players people={people} tournaments={tournaments} query={query} setQuery={setQuery}
          onOpenStats={id => { setStatsId(id); setModal("stats"); }} />}

        {view === "history" && <History tournaments={tournaments} byId={byId}
          onOpen={id => { setHistoryId(id); setView("standings"); }} />}

        {view === "admin" && role === "admin" && (
          <Admin guests={guests} newName={newName} setNewName={setNewName} onAdd={addGuest}
            onRename={(id, name) => persist({ ...data, guests: guests.map(g => g.id === id ? { ...g, name } : g) })}
            onDelete={id => persist({ ...data, guests: guests.filter(g => g.id !== id) })} />
        )}
      </main>

      <nav className="bottom">
        {navDefs.map(n => (
          <button key={n.id} className={view === n.id ? "on" : ""}
            onClick={() => { if (n.id === "standings") setHistoryId(null); setView(n.id); }}>{n.label}</button>
        ))}
      </nav>

      {modal === "login" && (
        <Sheet title="Scorer login" onClose={() => setModal(null)}>
          <input className="field big" type="password" inputMode="numeric" placeholder="PIN" value={pin} autoFocus
            onChange={e => setPin(e.target.value)} onKeyDown={e => e.key === "Enter" && submitLogin()} />
          {loginErr && <div className="note" style={{ color: "var(--red)", marginTop: 10 }}>Wrong PIN.</div>}
          <button className="btn" style={{ width: "100%", marginTop: 18 }} onClick={submitLogin}>Log in</button>
        </Sheet>
      )}

      {modal === "courts" && active && (() => {
        const maxC = maxCourtsFor(active.playerIds.length);
        const pick = courtsPick == null ? active.courtCount : courtsPick;
        const playedRounds = firstUnplayedIndex(active);
        return (
          <Sheet title="Courts in use" onClose={() => setModal(null)}>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
              {Array.from({ length: maxC }, (_, i) => i + 1).map(v => (
                <button key={v} className={"rchip" + (v === pick ? " on" : "")} style={{ minWidth: 52, fontSize: 15 }}
                  onClick={() => setCourtsPick(v)}>{v}</button>
              ))}
            </div>
            <div className="note" style={{ marginTop: 14 }}>
              {restPhrase(Math.max(0, active.playerIds.length - pick * 4))} each round on {plural(pick, "court")}.
              The {playedRounds} {playedRounds === 1 ? "round already scored stays" : "rounds already scored stay"} as
              played; partners keep rotating from there, so nobody repeats a partner.
            </div>
            <button className="btn" style={{ width: "100%", marginTop: 18 }} disabled={pick === active.courtCount}
              onClick={() => { saveT(rebuildTail(active, pick, null)); setModal(null); }}>Apply</button>
          </Sheet>
        );
      })()}

      {modal === "join" && active && (() => {
        const cands = people.filter(p => !active.playerIds.includes(p.id)).sort((a, b) => a.name.localeCompare(b.name));
        return (
          <Sheet title="Add a late arrival" onClose={() => setModal(null)}>
            <div className="note" style={{ marginBottom: 14 }}>
              They join from the next unplayed round. Scored rounds stay as played — but note that changing the
              line-up mid-session rebuilds the rotation, so a repeat partner is possible where it can't be avoided.
            </div>
            {cands.length === 0 && <div className="note">Everyone on the roster is already in this session.</div>}
            <div style={{ display: "flex", flexDirection: "column" }}>
              {cands.map(p => (
                <div className="row" key={p.id}>
                  <Ava p={p} />
                  <span className="truncate" style={{ flex: 1, fontWeight: 700 }}>{p.name}</span>
                  <button className="btn small" onClick={() => {
                    saveT(rebuildTail(active, active.courtCount, [...active.playerIds, p.id]));
                    setModal(null);
                  }}>Join</button>
                </div>
              ))}
            </div>
          </Sheet>
        );
      })()}

      {modal === "stats" && statsId && (() => {
        const me = statsId, agg = {};
        let played = 0, won = 0, ptsTotal = 0;
        tournaments.forEach(tt => (tt.rounds || []).forEach(r => (r.courts || []).forEach(m => {
          if (m.score1 == null || m.score2 == null) return;
          const inT1 = m.team1.includes(me), inT2 = m.team2.includes(me);
          if (!inT1 && !inT2) return;
          const mine = inT1 ? Number(m.score1) : Number(m.score2);
          const theirs = inT1 ? Number(m.score2) : Number(m.score1);
          const mate = (inT1 ? m.team1 : m.team2).find(id => id !== me);
          played++; ptsTotal += mine;
          const win = mine > theirs; if (win) won++;
          if (!agg[mate]) agg[mate] = { w: 0, l: 0 };
          win ? agg[mate].w++ : agg[mate].l++;
        })));
        const partners = Object.keys(agg).map(id => ({
          name: (byId[id] && byId[id].name) || "?", record: agg[id].w + "W – " + agg[id].l + "L"
        })).sort((a, b) => a.name.localeCompare(b.name));
        return (
          <Sheet title={(byId[me] && byId[me].name) || "Player"} onClose={() => setModal(null)}>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 10 }}>
              {[[played, "Matches"], [won, "Wins"], [ptsTotal, "Points"]].map(([v, l]) => (
                <div key={l} style={{ border: "1px solid var(--line)", borderRadius: 14, padding: "14px 10px", textAlign: "center" }}>
                  <div className="score" style={{ fontSize: 28, color: "var(--orange-br)" }}>{v}</div>
                  <div className="label" style={{ marginTop: 4 }}>{l}</div>
                </div>
              ))}
            </div>
            <div className="hair" style={{ marginTop: 18 }}>
              <div className="label" style={{ marginBottom: 8 }}>Partners</div>
              {partners.length === 0
                ? <div className="note">No matches played yet.</div>
                : partners.map(p => (
                  <div className="row" key={p.name}>
                    <span className="truncate" style={{ flex: 1, fontWeight: 700 }}>{p.name}</span>
                    <span className="label" style={{ letterSpacing: ".12em" }}>{p.record}</span>
                  </div>
                ))}
            </div>
          </Sheet>
        );
      })()}

      {modal === "podium" && podiumT && (() => {
        const table = calcStandings(podiumT, byId);
        const heights = [150, 185, 125], order = [1, 0, 2];
        return (
          <Sheet title="Podium 👑" onClose={() => setModal(null)}>
            <div className="podium">
              {order.filter(i => table[i]).map((i, slot) => (
                <div key={i} className={"plinth" + (i === 0 ? " first" : "")} style={{ height: heights[slot] }}>
                  <Ava p={table[i]} on={i === 0} lg />
                  <span className="truncate" style={{ fontWeight: 800, fontSize: 13, maxWidth: "100%" }}>{table[i].name}</span>
                  <span className="score" style={{ fontSize: 24, color: i === 0 ? "var(--gold)" : "var(--orange-br)" }}>{table[i].points}</span>
                  <span className="label">{i === 0 ? "1st" : i === 1 ? "2nd" : "3rd"}</span>
                </div>
              ))}
            </div>
            {table.slice(3).map((s, i) => (
              <div className="row" key={s.id}>
                <span className="label" style={{ width: 24 }}>{i + 4}</span>
                <span className="truncate" style={{ flex: 1, fontWeight: 700 }}>{s.name}</span>
                <span className="label" style={{ letterSpacing: ".12em" }}>{s.points} pts</span>
              </div>
            ))}
          </Sheet>
        );
      })()}
    </Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
