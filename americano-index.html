// the page doing the explaining that the post no longer does.
//
// ═══ UPRISING NEXT NIGHT — GENERATED, DO NOT EDIT ═════════════════════
// Written by build-uprising-announce.py from uprising-social.json. Only what
// the ENGINE cannot know lives here — when, how much, what you win. The court
// count, the target and the points table are read from the inlined engine
// below, exactly as the RULES screen reads them, so this page cannot advertise
// a number the scoring contradicts.
const UP_NEXT = {
  date: "2026-10-10",
  dateLabel: "Sat 10 Oct",
  entry: "7 OMR",
  cap: 16,
  courts: 3,
  champion: "15 OMR voucher",
  signupVia: "WhatsApp the club",
  cadence: "One Saturday a month"
};
// ═══ END UPRISING NEXT NIGHT ══════════════════════════════════════════

function Home({ cfg }) {
  // Same derivation the RULES screen uses when no night is live, so the two
  // screens cannot disagree — and so a scorer part-way through setup sees the
  // night they are about to run, not a brochure for a different one.
  const C = Math.min(UP.COURTS, Math.max(2, Number(cfg.upcourts) || UP.COURTS));
  const target = Number(cfg.uppoints) || UP.TARGET;
  const shuf = upShuffleRounds({ shuffle: cfg.upshuffle });
  const shuffle = shuf > 0;
  const players = UP_NEXT.cap || 4 * C;
  const scoring = cfg.upfinish
    ? upPlanRounds(Number(cfg.upfinish), target, { shuffle, players, courts: C })
    : (Number(cfg.uprounds) || UP.ROUNDS);
  const matches = scoring + shuf;
  // Rounds and matches-each are the same number only when nobody rests. With
  // 16 on 3 courts the night is 13 rounds and 9 matches each.
  const resting = Math.max(0, players - 4 * C);
  const each = Math.floor((scoring * 4 * C) / players);

  // Local date parts, never toISOString(): the server is UTC and Oman is
  // UTC+4, which has moved a date back a day in this repo before. A past date
  // hides the block rather than advertising a night that has been and gone.
  const now = new Date();
  const today = now.getFullYear() * 10000 + (now.getMonth() + 1) * 100 + now.getDate();
  const nd = Number((UP_NEXT.date || "").replace(/-/g, "")) || 0;
  const upcoming = nd >= today;

  const Step = ({ n, head, children }) => (
    <div className="rule"><span className="rn">{n}</span>
      <div><b>{head}</b><p>{children}</p></div></div>
  );

  return (
    <div className="screen">
      <div>
        <Eyebrow>{UP_NEXT.cadence} · Urban Playground</Eyebrow>
        <div className="display">Climb to <em>Court One</em></div>
        <p className="lede">
          <b style={{ color: "var(--cream)" }}>Come on your own.</b> {C} courts, one ladder — win
          your match and you move up a court, lose it and you move down. You play with a different
          partner almost every round, and the court you are standing on is your position.
        </p>
      </div>

      {upcoming && (
        <div className="hair">
          <div className="sect">The next one</div>
          <div className="facts" style={{ marginTop: 12 }}>
            {/* No clock time. The start is fixed when the court is confirmed,
                and a page that says 17:30 before that is wrong on the one
                surface people screenshot. Same rule as the posters. */}
            {[[UP_NEXT.dateLabel, "The next night"],
              [UP_NEXT.entry, "To play"],
              ["Up to " + UP_NEXT.cap, "Places"],
              [UP_NEXT.champion, "To the champion"]].map(([a, b2]) => (
              <div className="fact" key={a}><b>{a}</b><i>{b2}</i></div>
            ))}
          </div>
          <p className="note" style={{ marginTop: 14 }}>
            <b style={{ color: "var(--cream)" }}>No partner needed</b> — turn up alone and the
            draw does the rest. {UP_NEXT.signupVia} to claim a place; after {UP_NEXT.cap} it is a
            waitlist.
          </p>
        </div>
      )}

      <div className="hair">
        <div className="sect">How a match works</div>
        <p className="note" style={{ margin: "10px 0 14px" }}>
          Every rally you win is a point. No 15-30-40, no deuce, no games, no sets.
          <b style={{ color: "var(--cream)" }}> First pair to {target} wins</b> and the match stops
          there — so a score always looks like {target}-something. Then you walk to your next court.
        </p>
        <div className="facts">
          {[["0–" + target, "In the match — decides this match"],
            [UP.LOSE[C] + "–" + UP.WIN[1], "On the table — decides the night"]].map(([a, b2]) => (
            <div className="fact" key={a}><b>{a}</b><i>{b2}</i></div>
          ))}
        </div>
        <p className="note" style={{ marginTop: 14 }}>
          Two different things are called points, and this is the one everybody asks about: the{" "}
          {target} decides the match and then goes nowhere near the table.
          <b style={{ color: "var(--cream)" }}> What you bank is what the court pays.</b>
        </p>
      </div>

      <div className="hair">
        <div className="sect">The ladder</div>
        <div className="ptab" style={{ marginTop: 12 }}>
          <div className="ph"><span>Court</span><span>Win</span><span>Lose</span></div>
          {Array.from({ length: C }, (_, i) => i + 1).map(c => (
            <div className={"pr" + (c === 1 ? " top" : "")} key={c}>
              <span>Court {c}</span><span><b>{UP.WIN[c]}</b></span><span>{UP.LOSE[c]}</span>
            </div>
          ))}
        </div>
        <p className="note" style={{ marginTop: 14 }}>
          Points are worth more the higher you climb, so there is nothing to gain from camping at
          the bottom beating people you should beat. Read the diagonal:{" "}
          <b style={{ color: "var(--cream)" }}>losing on Court 1 is worth winning on Court {Math.min(3, C)}</b>.
        </p>
      </div>

      <div className="hair" style={{ display: "flex", flexDirection: "column", gap: 16 }}>
        {shuffle && (
          <Step n="1" head="Round one is the shuffle">
            You play one match and it scores <b>nothing</b> — but <b>the margin sets the whole
            ladder</b>. Everyone is ranked by how much they won or lost that one match by, and
            the courts are dealt from that: biggest win starts on Court 1, biggest loss on Court{" "}
            {C}. Where you begin is won, not drawn.
          </Step>
        )}
        <Step n={shuffle ? "2" : "1"} head="Up or down, every round">
          Winners climb a court together, losers drop one. Court 1 winners stay on Court 1;
          Court {C} losers stay on Court {C}.
        </Step>
        <Step n={shuffle ? "3" : "2"} head="New partners on arrival">
          The four of you are ranked by points so far and paired <b>1 + 4 against 2 + 3</b> — the
          closest match the four of you can make.
        </Step>
        {/* The last round only doubles when nobody rests, so this line has to
            follow the court count rather than being typed. With 16 on 3 courts
            it would be a promise the scoring does not keep. */}
        <Step n={shuffle ? "4" : "3"} head={plural(each, "match") + " each"}>
          Highest total at the end takes the night. There is no score to reach — you accumulate.
          {resting > 0
            ? ` ${plural(resting, "player")} ${resting === 1 ? "rests" : "rest"} each round, on a rota drawn before the first serve.`
            : " The last round is worth double."}
        </Step>
      </div>

      <div className="hair note">
        When the night starts this page becomes the live board — your court, your partner, your
        score and the table, updating as the results go in. Nothing to install.
      </div>
    </div>
  );
}

function Rules({ t, cfg }) {
  const live = t && t.format === "uprising" ? t : null;
  const players = live ? live.playerIds.length : 16;
  const C = live ? upCourts(live) : Math.min(UP.COURTS, Math.max(2, Number(cfg.upcourts) || UP.COURTS));
  const target = live ? (live.pointsPerMatch || UP.TARGET) : (Number(cfg.uppoints) || UP.TARGET);
  const shuf = upShuffleRounds(live || { shuffle: cfg.upshuffle });
  const shuffle = shuf > 0;
  const scoring = live ? upScoringRounds(live)
    : (cfg.upfinish ? upPlanRounds(Number(cfg.upfinish), target, { shuffle, players, courts: C })
                    : (Number(cfg.uprounds) || UP.ROUNDS));
  const matches = scoring + shuf;
  const resting = Math.max(0, players - 4 * C);
  const dbl = resting === 0;
  const mins = nightMinutes(matches, target);

  const Rule = ({ n, head, children }) => (
    <div className="rule">
      <span className="rn">{n}</span>
      <div>
        <b>{head}</b>
        <p>{children}</p>
      </div>
    </div>
  );

  return (
    <div className="screen">
      <div>
        <Eyebrow>How it works</Eyebrow>
        <div className="display">Climb to <em>Court One</em></div>
        <p className="lede">
          Come alone. You play with a different partner almost every round, and the court you
          are standing on is your position — there is no table to follow.
        </p>
      </div>

      <div className="hair" style={{ display: "flex", flexDirection: "column", gap: 16 }}>
        {shuffle && (
          <Rule n="1" head="Round one is the shuffle">
            Courts are drawn, you play one match, and it scores <b>nothing</b> — but the{" "}
            <b>margin</b> sets the ladder everybody starts on. All {players} of you are ranked by
            how far you won or lost that match by, and the courts are dealt from that list:
            biggest win on Court 1, biggest loss on Court {C}. Win {target}-2 from the bottom of
            the draw and you open on Court 1; scrape {target}-{target - 2} from the top and you
            will not.
            {resting > 0 && ` Anyone resting the shuffle has no margin, so they start in the middle.`}
            {" "}The draw decides nothing — measured, it is worth a 1.00x swing.
          </Rule>
        )}
        <Rule n={shuffle ? "2" : "1"} head="Win and you go up. Lose and you go down.">
          The winning pair moves up a court together, the losing pair moves down. Court 1 winners
          stay on Court 1; Court {C} losers stay on Court {C}.
        </Rule>
        <Rule n={shuffle ? "3" : "2"} head="New partners every round">
          On your new court the four of you are ranked by points so far and paired{" "}
          <b>1 + 4 against 2 + 3</b> — the closest match the four of you can make. If that would
          repeat a partnership from tonight, the next-closest split is used instead.
        </Rule>
        <Rule n={shuffle ? "4" : "3"} head={`Every match is first to ${target}`}>
          Straight points, no games or sets. The winner finishes on {target}; the other pair keeps
          whatever they scored.
        </Rule>
        {resting > 0 && (
          <Rule n={shuffle ? "5" : "4"} head={`${plural(resting, "player")} ${resting === 1 ? "rests" : "rest"} each round`}>
            {4 * C} play at once on {plural(C, "court")}, so {resting} sit out. Rest runs on a rota
            drawn before the first serve, in order, so your turn has nothing to do with how you are
            playing — and everyone rests the same number of times.
          </Rule>
        )}
      </div>

      <div className="hair">
        <div className="sect">The points</div>
        <p className="note" style={{ margin: "10px 0 14px" }}>
          Points are worth more the higher you climb — otherwise the smart move would be to stay at
          the bottom and beat weaker opponents, which is the opposite of the idea.
        </p>
        <div className="ptab">
          <div className="ph"><span>Court</span><span>Win</span><span>Lose</span></div>
          {Array.from({ length: C }, (_, i) => i + 1).map(c => (
            <div className={"pr" + (c === 1 ? " top" : "")} key={c}>
              <span>Court {c}</span>
              <span><b>{UP.WIN[c]}</b></span>
              <span>{UP.LOSE[c]}</span>
            </div>
          ))}
        </div>
        <p className="note" style={{ marginTop: 14 }}>
          Read the diagonal: <b style={{ color: "var(--cream)" }}>losing on Court 1 is worth the same
          as winning on Court 3</b>. Where you got to counts as much as what you did when you got there.
        </p>
        {dbl && (
          <p className="note" style={{ marginTop: 10, color: "var(--warn)" }}>
            <b>The last round is worth double.</b> One night in three is decided in it.
          </p>
        )}
        {!dbl && (
          <p className="note" style={{ marginTop: 10 }}>
            The last round is <b>not</b> doubled tonight — somebody has to sit it out, and they could
            not otherwise win.
          </p>
        )}
      </div>

      <div className="hair">
        <div className="sect">Tonight</div>
        <div className="facts">
          {[[plural(players, "player"), "checked in"],
            [plural(C, "court"), `${4 * C} on court at once`],
            [plural(matches, "match"), shuffle ? `the shuffle + ${scoring} that score` : "all of them score"],
            [`First to ${target}`, "straight points"],
            [asClock(mins), "from the first serve"]].map(([a, b2]) => (
            <div className="fact" key={a}><b>{a}</b><i>{b2}</i></div>
          ))}
        </div>
      </div>

      <div className="hair">
        <div className="sect">Winning it</div>
        <p className="note" style={{ marginTop: 10 }}>
          Highest total after the last round takes it. There is no score to reach — you accumulate.
          {resting > 0 && " If the rounds cannot give everyone the same number of matches, the table ranks on points per round played, so nobody wins on extra court time."}
          {" "}Level at the top is broken by <b style={{ color: "var(--cream)" }}>total match points scored</b>,
          then head to head.
        </p>
      </div>
    </div>
  );
}

// ── history ─────────────────────────────────────────────────────
function History({ tournaments, byId, onOpen }) {
  const done = tournaments.filter(x => x.status === "completed").sort((a, b) => b.createdAt - a.createdAt);
  return (
    <div className="screen">
      <div>
        <Eyebrow>Archive</Eyebrow>
        <div className="display">Past <em>Sessions</em></div>
      </div>
      {done.length === 0
        ? <div className="hair note">No completed sessions yet.</div>
        : (
          <div className="hair" style={{ display: "flex", flexDirection: "column" }}>
            {done.map(tt => {
              const s = calcStandings(tt, byId);
              return (
                <button key={tt.id} className="row" onClick={() => onOpen(tt.id)}
                  style={{ background: "transparent", border: 0, borderBottom: "1px solid var(--line2)", cursor: "pointer", color: "inherit", textAlign: "left", width: "100%" }}>
                  <span style={{ flex: 1, minWidth: 0 }}>
                    <span className="truncate" style={{ display: "block", fontWeight: 800, fontSize: 16 }}>{tt.name}</span>
                    <span className="label" style={{ letterSpacing: ".12em" }}>
                      {new Date(tt.createdAt).toLocaleDateString()} · {tt.playerIds.length} players · {tt.rounds.length} rounds
                    </span>
                  </span>
                  <span style={{ textAlign: "right" }}>
                    <span className="label" style={{ color: "var(--gold)" }}>Winner</span>
                    <span className="truncate" style={{ display: "block", fontWeight: 700 }}>{s.length ? s[0].name : "—"}</span>
                  </span>
                </button>
              );
            })}
          </div>
        )}
    </div>
  );
}

// ── app ─────────────────────────────────────────────────────────
function App() {
  const [data, setData] = useState({ players: [], guests: [], tournaments: [] });
  const [loaded, setLoaded] = useState(false);
  const [role, setRole] = useState(LS.get("am-role"));
  const [token, setTokenState] = useState(LS.get("am-token"));
  const [view, setView] = useState("board");
  const [modal, setModal] = useState(null);
  const [pin, setPin] = useState("");
  const [loginErr, setLoginErr] = useState(false);
  const [sel, setSel] = useState({});
  const [cfg, setCfg] = useState({ name: "", points: 32, rounds: 7, courts: 2,
                                   upcourts: UP_NEXT.courts || UP.COURTS, uppoints: 11, uprounds: 15,
                                   upshuffle: true, upfinish: 150, format: "americano" });
  const [roundIdx, setRoundIdx] = useState(0);
  const [receipt, setReceipt] = useState(null);
  const [drafts, setDrafts] = useState({});
  const [editing, setEditing] = useState({});
  const [courtsPick, setCourtsPick] = useState(null);
  const [roundsPick, setRoundsPick] = useState(null);
  const [query, setQuery] = useState("");
  const [newName, setNewName] = useState("");
  const [statsId, setStatsId] = useState(null);
  const [historyId, setHistoryId] = useState(null);
  const [podiumId, setPodiumId] = useState(null);
  const saveTimer = useRef(null);

  useEffect(() => {
    fetch("/state").then(r => r.json()).then(r => {
      if (r && r.ok) setData(d => ({ players: [], guests: [], tournaments: [], ...r.state }));
      setLoaded(true);
    }).catch(() => setLoaded(true));
  }, []);

  const canEdit = role === "admin" || role === "scorer";
  const guests = data.guests || [];
  const people = useMemo(
    () => [...(data.players || []), ...guests.map(g => ({ ...g, guest: true }))],
    [data.players, guests]
  );
  const byId = useMemo(() => { const m = {}; people.forEach(p => { m[p.id] = p; }); return m; }, [people]);
  const tournaments = data.tournaments || [];
  const active = tournaments.find(t => t.status === "active");

  // The tabs appear when there is a night to follow. Before one starts there
  // is nothing behind four of the five — a Board and Standings of nothing, an
  // empty History — and a row of tabs leading to empty screens reads as a
  // broken app rather than as a club that has not started yet.
  //
  // A scorer keeps them regardless: they have to reach Setup, Players and
  // Admin to CREATE the night, so hiding the nav from them would lock them out
  // of the only screens that make the nav appear.
  const showNav = !!active || canEdit;

  // THIS MUST STAY ABOVE the `if (!loaded) return` below. Put after it, the
  // effect runs on the loaded render and not on the loading one, which is
  // "rendered more hooks than during the previous render" — React 18 throws
  // #310 and unmounts the tree, so the page is BLANK rather than slightly
  // wrong. Caught by the headless shell test, not by reading it.
  //
  // What it does: a scorer sitting on Players when the night ends, who then
  // logs out, would be left on a screen with no way back, because the nav that
  // got them there has just gone. Snap to the one view that always exists.
  useEffect(() => {
    if (!showNav && view !== "board") setView("board");
  }, [showNav, view]);

  function persist(next) {
    setData(next);
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      fetch("/save", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + LS.get("am-token") },
        body: JSON.stringify({ state: next })
      }).catch(() => {});
    }, 400);
  }
  const saveT = nextT => persist({ ...data, tournaments: tournaments.map(x => x.id === nextT.id ? nextT : x) });

  // What a player has averaged in previous UPRISING nights. Used to seed the
  // opening ladder and as the baseline for THE CLIMB. Measured over 3,000
  // simulated nights, a RANDOM opening ladder hands a Court 1 starter 40% of
  // the wins and a Court 4 starter 8% — a five-fold swing settled before a ball
  // is hit. Seeded, that advantage is earned instead of drawn.
  const upForm = useMemo(() => {
    const got = {};
    (tournaments || []).forEach(t => {
      // Only a FINISHED night is form. An abandoned one is a few scores and a
      // walk-off, and an active one is tonight.
      if (t.format !== "uprising" || t.status !== "completed") return;
      // PER SCORING ROUND, not the night total. The planner sizes nights to
      // the clock, so a 14-round night and a 10-round night produce totals
      // that cannot be compared — stored raw, every player looked worse on the
      // shorter night and THE CLIMB fell to the champion.
      upStandings(t, byId).forEach(r => {
        if (r.played > 0) (got[r.id] = got[r.id] || []).push(r.perRound);
      });
    });
    const out = {};
    Object.keys(got).forEach(id => {
      out[id] = got[id].reduce((a, b) => a + b, 0) / got[id].length;
    });
    return out;
  }, [tournaments, byId]);

  function startSession() {
    const ids = Object.keys(sel).filter(id => sel[id]);
    if (ids.length < 4) return;
    const courts = Math.max(1, Math.min(Number(cfg.courts) || 1, maxCourtsFor(ids.length)));
    const rounds = Number(cfg.rounds) || 1;
    let nt;
    if (cfg.format === "uprising") {
      // UPRISING cannot pre-generate a schedule: who you play depends on which
      // court you climbed to, so only round one exists at the start and each
      // round is built from the last one's results.
      if (ids.length < 8) { alert("UPRISING needs at least eight players."); return; }
      // Four to a court is padel. The FIELD does not have to be a multiple of
      // four — it just means somebody rests every round, on a rota drawn now
      // and walked in order so that when your turn comes it has nothing to do
      // with how you are playing.
      const upCourtCount = Math.max(2, Math.min(
        Number(cfg.upcourts) || UP.COURTS, Math.max(2, Math.floor(ids.length / 4)), UP.COURTS));
      // Nine rounds was a two-hour time budget, never a rule of the format —
      // nothing in the ladder or the points table counts to nine. Longer is a
      // measurably better competition: at 16 players, 15 rounds puts the real
      // top-3 player on top 69% of the time against 61% at nine, correlates
      // 0.73 with true skill against 0.62, and gives a median of 11 different
      // partners against 8. It only costs time, which is what the finish
      // estimate on the setup screen is for.
      // cfg.uprounds is the number of SCORING rounds. The shuffle sits on top
      // of it rather than inside it, because "15 rounds" means fifteen rounds
      // that count — asked for 15 and given 14 is the wrong kind of surprise.
      const upScoring = cfg.upfinish
        ? upPlanRounds(Number(cfg.upfinish), Math.max(4, Math.min(99, Number(cfg.uppoints) || UP.TARGET)),
            { shuffle: cfg.upshuffle, players: ids.length, courts: upCourtCount })
        : Math.max(2, Math.min(40, Number(cfg.uprounds) || UP.ROUNDS));
      const upRounds = upScoring + upShuffleRounds({ shuffle: cfg.upshuffle });
      const ladder0 = upSeedLadder(ids, upForm, upCourtCount);
      const seedT = {
        id: uid("t"), format: "uprising", playerIds: ids, ladder0, rounds: [],
        courtCount: upCourtCount, numRounds: upRounds,
        // Round one as a shuffle: a real match that decides where you start
        // and pays nothing. A random opening draw hands a Court 1 starter 7.3x
        // the chance of a Court 4 starter and a longer night barely dilutes it
        // (3.7x at 15 rounds); the shuffle takes it to 2.7x, and what is left
        // was won rather than drawn.
        // Stored as a COUNT (0, 1 or 2), not a flag. upShuffleRounds still
        // reads `true` as 1, so nights created before this keep working.
        shuffle: upShuffleRounds({ shuffle: cfg.upshuffle }),
        restRota: upMakeRestRota(ids, Date.now()),
      };
      nt = {
        ...seedT,
        name: cfg.name.trim() || "Uprising " + new Date().toLocaleDateString(),
        // The target is the organiser's: first to 16 is the default because it
        // lands an UPRISING round at about eleven minutes, but a shorter night
        // wants 11 and a longer one 21. Nothing in the ladder depends on it —
        // the court you are on decides the points, the scoreline only breaks
        // ties — so it is free to move.
        createdAt: Date.now(),
        pointsPerMatch: Math.max(4, Math.min(99, Number(cfg.uppoints) || UP.TARGET)),
        baselines: Object.fromEntries(ids.filter(i => upForm[i] != null).map(i => [i, upForm[i]])),
        rounds: [upBuildRound(seedT)], status: "active",
      };
    } else {
      nt = {
        id: uid("t"), format: "americano",
        name: cfg.name.trim() || "Americano " + new Date().toLocaleDateString(),
        createdAt: Date.now(), pointsPerMatch: Number(cfg.points) || 32,
        playerIds: ids, numRounds: rounds, courtCount: courts,
        rounds: generateSchedule(ids, rounds, courts), status: "active"
      };
    }
    persist({ ...data, tournaments: [...tournaments, nt] });
    setRoundIdx(0); setView("board");
  }
  function commitScore(ri, mi, s1, s2, key) {
    if (!active) return;
    let rounds = active.rounds.map((r, i) => i !== ri ? r : {
      ...r, courts: r.courts.map((mm, j) => j !== mi ? mm : { ...mm, score1: s1, score2: s2 })
    });
    if (active.format === "uprising") {
      // The ladder has moved, so the next round can now be drawn. Built only
      // when the LAST round on the board is complete: editing a score in an
      // earlier round must not append a duplicate round behind the scorer's
      // back, and later rounds are left alone because re-pairing them would
      // rewrite matches people have already played.
      const nextT = { ...active, rounds };
      if (upRoundDone(rounds[rounds.length - 1]) && rounds.length < upRoundsTotal(active)) {
        try { rounds = [...rounds, upBuildRound(nextT)]; }
        catch (e) { console.warn("could not build the next round:", e.message); }
      }
    }
    saveT({ ...active, rounds });
    setEditing(e => ({ ...e, [key]: false }));
  }
  function finishSession() {
    if (!active) return;
    saveT({ ...active, status: "completed", completedAt: Date.now() });
    setPodiumId(active.id); setSel({}); setModal("podium");
  }
  // Abandoned, NOT deleted: the night stays in the state so the scores anyone
  // did enter are not thrown away, but it stops being `active` so Setup comes
  // back. History shows only `completed`, so it does not appear there, and it
  // does not feed UPRISING form either.
  function abandonSession() {
    if (!active) return;
    saveT({ ...active, status: "abandoned", abandonedAt: Date.now() });
    setSel({}); setRoundIdx(0); setModal(null); setView("board");
  }
  function submitLogin() {
    fetch("/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ pin }) })
      .then(r => r.json()).then(r => {
        if (r && r.ok) {
          LS.set("am-token", r.token); LS.set("am-role", r.role);
          setTokenState(r.token); setRole(r.role); setModal(null); setLoginErr(false); setPin("");
        } else setLoginErr(true);
      }).catch(() => setLoginErr(true));
  }
  function logout() {
    LS.set("am-role", ""); LS.set("am-token", "");
    setRole(""); setTokenState(""); setView("board");
  }
  function addGuest() {
    const n = newName.trim(); if (!n) return;
    persist({ ...data, guests: [...guests, { id: uid("g"), name: n }] });
    setNewName("");
  }
  // Same thing, but it RETURNS the id — the check-in screen needs it to tick
  // the new player immediately, and `people` will not have rebuilt yet when
  // the button handler runs.
  function addGuestNamed(name) {
    const n = (name || "").trim();
    if (!n) return null;
    const existing = people.find(p => p.name.toLowerCase() === n.toLowerCase());
    if (existing) return existing.id;
    const id = uid("g");
    persist({ ...data, guests: [...guests, { id, name: n }] });
    return id;
  }

  if (!loaded) return <div style={{ minHeight: "100vh", display: "grid", placeItems: "center", color: "var(--muted2)" }}>Loading…</div>;

  const shownT = historyId ? tournaments.find(x => x.id === historyId) : active;
  const podiumT = podiumId ? tournaments.find(x => x.id === podiumId) : shownT;
  const navDefs = [
    { id: "board", label: active ? "Board" : "Setup" },
    { id: "standings", label: "Standings" },
    { id: "players", label: "Players" },
    { id: "history", label: "History" },
    { id: "rules", label: "Rules" }
  ];
  if (role === "admin") navDefs.push({ id: "admin", label: "Admin" });
  // The header used to say AMERICANO on an UPRISING night, with the format
  // demoted to the subtitle. The wordmark is the thing people photograph.
  // The homepage is entirely about UPRISING, so the header said AMERICANO over
  // it — the default cfg.format is "americano" and nobody has touched setup.
  // The wordmark is the thing people photograph; it has to agree with the page
  // under it.
  const onHome = !active && !canEdit;
  const headerName = onHome ? "Uprising"
                   : active && active.format === "uprising" ? "Uprising"
                   : active ? "Americano"
                   : cfg.format === "uprising" ? "Uprising" : "Americano";
  // "Guest view" is scorer-speak for "you are nobody", printed under the
  // wordmark on the one screen the public actually lands on.
  const headerSub = active
    ? active.name.replace(new RegExp("^" + headerName + "\\s+", "i"), "")
    : (canEdit ? "Ready to set up" : UP_NEXT.cadence);

  return (
    <Fragment>
      <header className="top">
        {/* The login is BEHIND THE MARK. Players outnumber scorers forty to
            one and a LOGIN button in the corner invites every one of them to
            try the one thing on screen they have no business touching. Tapping
            the mark opens it; there is nothing else to find.

            It is a <button> rather than a div with onClick so it keeps the tap
            target, the focus ring and the keyboard. The label is on the button
            and not visible, which is the only clue a screen reader gets. */}
        <button className="brand" type="button"
          aria-label={canEdit ? headerName : "Scorer login"}
          onClick={() => { if (!canEdit) { setModal("login"); setPin(""); setLoginErr(false); } }}>
          {/* A drawn mark, not an emoji: the emoji renders in whatever face
              the OS supplies and carries its own colours, which is the one
              thing a palette cannot override. This is the climb. */}
          <span className="mark" aria-hidden="true">
            <svg viewBox="0 0 100 100" width="18" height="18">
              <path d="M18 64 L50 32 L82 64" fill="none" stroke="currentColor"
                strokeWidth="13" strokeLinecap="square" />
            </svg>
          </span>
          <span style={{ display: "flex", flexDirection: "column", minWidth: 0 }}>
            <span className="name">{headerName}</span>
            <span className="sub">{headerSub}</span>
          </span>
        </button>
        {canEdit && <button className="btn ghost" onClick={logout}>{role}</button>}
      </header>

      <main className={showNav ? "" : "nonav"}>
        {view === "board" && (active
          ? <Board t={active} byId={byId} canEdit={canEdit} roundIdx={roundIdx} setRoundIdx={setRoundIdx}
              drafts={drafts} setDrafts={setDrafts} editing={editing} setEditing={setEditing}
              onCommit={commitScore} onFinish={finishSession}
              onOpenCourts={() => { setCourtsPick(active.courtCount); setModal("courts"); }}
              onOpenRounds={() => { setRoundsPick(upRoundsTotal(active)); setModal("rounds"); }}
              onOpenJoin={() => setModal("join")}
              onAbandon={() => setModal("abandon")} />
          : (canEdit
            ? <Setup people={people} canEdit={canEdit} cfg={cfg} setCfg={setCfg} sel={sel} setSel={setSel}
                onStart={startSession} onAddGuest={addGuestNamed} />
            : <Home cfg={cfg} />))}

        {view === "standings" && <Standings t={shownT} byId={byId}
          onReceipt={id => { setReceipt({ id, tid: shownT.id }); setModal("receipt"); }}
          onPodium={() => { setPodiumId(shownT ? shownT.id : null); setModal("podium"); }} />}

        {view === "players" && <Players people={people} tournaments={tournaments} query={query} setQuery={setQuery}
          onOpenStats={id => { setStatsId(id); setModal("stats"); }} />}

        {view === "rules" && <Rules t={active} cfg={cfg} />}

        {view === "history" && <History tournaments={tournaments} byId={byId}
          onOpen={id => { setHistoryId(id); setView("standings"); }} />}

        {view === "admin" && role === "admin" && (
          <Admin guests={guests} newName={newName} setNewName={setNewName} onAdd={addGuest}
            onRename={(id, name) => persist({ ...data, guests: guests.map(g => g.id === id ? { ...g, name } : g) })}
            onDelete={id => persist({ ...data, guests: guests.filter(g => g.id !== id) })} />
        )}
      </main>

      {showNav && <nav className="bottom">
        {navDefs.map(n => (
          <button key={n.id} className={view === n.id ? "on" : ""}
            onClick={() => { if (n.id === "standings") setHistoryId(null); setView(n.id); }}>{n.label}</button>
        ))}
      </nav>}

      {modal === "login" && (
        <Sheet title="Scorer login" onClose={() => setModal(null)}>
          <input className="field big" type="password" inputMode="numeric" placeholder="PIN" value={pin} autoFocus
            onChange={e => setPin(e.target.value)} onKeyDown={e => e.key === "Enter" && submitLogin()} />
          {loginErr && <div className="note" style={{ color: "var(--red)", marginTop: 10 }}>Wrong PIN.</div>}
          <button className="btn" style={{ width: "100%", marginTop: 18 }} onClick={submitLogin}>Log in</button>
        </Sheet>
      )}

      {modal === "courts" && active && (() => {
        const isUp = active.format === "uprising";
        // UPRISING has a floor of two: a one-court "ladder" has nowhere to
        // climb to. And a ceiling of four, because the points table defines
        // four rungs and no more.
        const maxC = isUp ? Math.min(UP.COURTS, maxCourtsFor(active.playerIds.length))
                          : maxCourtsFor(active.playerIds.length);
        const minC = isUp ? Math.min(2, maxC) : 1;
        const now = isUp ? upCourts(active) : active.courtCount;
        const pick = courtsPick == null ? now : courtsPick;
        const playedRounds = firstUnplayedIndex(active);
        const left = Math.max(0, upRoundsTotal(active) - active.rounds.length);
        const restNow = Math.max(0, active.playerIds.length - now * 4);
        const restNext = Math.max(0, active.playerIds.length - pick * 4);
        return (
          <Sheet title="Courts in use" onClose={() => setModal(null)}>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
              {Array.from({ length: maxC - minC + 1 }, (_, i) => i + minC).map(v => (
                <button key={v} className={"rchip" + (v === pick ? " on" : "")} style={{ minWidth: 52, fontSize: 15 }}
                  onClick={() => setCourtsPick(v)}>{v}</button>
              ))}
            </div>
            {isUp ? (
              <Fragment>
                <div className="note" style={{ marginTop: 14 }}>
                  {restPhrase(restNext)} each round on {plural(pick, "court")}.
                  {" "}<b style={{ color: "var(--cream)" }}>
                    The {playedRounds} {playedRounds === 1 ? "round already played stays" : "rounds already played stay"} exactly as played
                  </b>{" "}— the points on the board do not move, and nobody is sent to a court they
                  never stood on. It takes effect from the next round.
                </div>
                {pick !== now && (
                  <div className="note" style={{ marginTop: 10 }}>
                    {restNext > restNow
                      ? `With ${left} ${left === 1 ? "round" : "rounds"} to go, the people who have already taken their rest will end up having played more than the people who have not. The table switches to points per round played, so nobody wins on extra court time.`
                      : restNext < restNow
                        ? `More people on court from here. Whoever was resting comes back in; the rota keeps running for anybody still sitting out.`
                        : ""}
                  </div>
                )}
                {restNext === 0 && restNow > 0 && (
                  <div className="note" style={{ marginTop: 10, color: "var(--warn)" }}>
                    With nobody resting, the last round becomes <b>double points</b> again.
                  </div>
                )}
                {restNext > 0 && restNow === 0 && (
                  <div className="note" style={{ marginTop: 10, color: "var(--warn)" }}>
                    With somebody resting, the last round is <b>no longer double</b> — whoever
                    sits it out could not win it.
                  </div>
                )}
              </Fragment>
            ) : (
              <div className="note" style={{ marginTop: 14 }}>
                {restPhrase(Math.max(0, active.playerIds.length - pick * 4))} each round on {plural(pick, "court")}.
                The {playedRounds} {playedRounds === 1 ? "round already scored stays" : "rounds already scored stay"} as
                played; partners keep rotating from there, so nobody repeats a partner.
              </div>
            )}
            <button className="btn" style={{ width: "100%", marginTop: 18 }} disabled={pick === now}
              onClick={() => {
                // UPRISING builds one round at a time from the last one's
                // results, so there is no tail to rebuild — set the number and
                // the next round is dealt on it. rebuildTail() here would run
                // the classic Americano circle method over the ladder.
                if (!isUp) { saveT(rebuildTail(active, pick, null)); setModal(null); return; }
                const next = { ...active, courtCount: pick };
                // The app deals the next round the moment the last score is
                // locked, so by the time the organiser reaches this sheet the
                // round on the board is ALREADY drawn — on the old number of
                // courts. Changing the count and leaving it would make the
                // change take effect a round later than it was made, which is
                // exactly the round the court became free.
                //
                // So if that round has not been touched, throw the draw away
                // and deal it again. Nothing is lost: it is a pairing, not a
                // result. A round with so much as one score in it is history
                // and is left alone.
                const rs = next.rounds || [];
                const lastR = rs[rs.length - 1];
                const untouched = lastR && (lastR.courts || []).every(
                  m => !Number.isFinite(m.score1) && !Number.isFinite(m.score2));
                if (untouched) {
                  const trimmed = { ...next, rounds: rs.slice(0, -1) };
                  try { next.rounds = [...trimmed.rounds, upBuildRound(trimmed)]; }
                  catch (e) { console.warn("could not re-deal the round:", e.message); }
                }
                saveT(next);
                setModal(null);
              }}>Apply</button>
          </Sheet>
        );
      })()}

      {modal === "rounds" && active && (() => {
        // "We have the court for another twenty minutes." The night's length
        // was fixed at setup and the only way to react was to stop early or
        // run over; upBuildRound simply refuses past numRounds.
        const now = upRoundsTotal(active);
        const played = active.rounds.filter(upRoundDone).length;
        const pick = roundsPick == null ? now : roundsPick;
        const floorR = Math.max(played, upShuffleRounds(active) + 1);
        const scoring = pick - upShuffleRounds(active);
        const left = Math.max(0, pick - active.rounds.length);
        const mins = nightMinutes(pick, active.pointsPerMatch || UP.TARGET);
        const done = active.rounds.filter(upRoundDone);
        const lastWasDoubled = done.length && upRoundDoubled(active, done[done.length - 1]);
        return (
          <Sheet title="How many rounds" onClose={() => setModal(null)}>
            <div style={{ display: "flex", alignItems: "center", gap: 14, justifyContent: "center", marginTop: 4 }}>
              <button className="btn" style={{ padding: "10px 20px", fontSize: 22 }}
                disabled={pick <= floorR} onClick={() => setRoundsPick(Math.max(floorR, pick - 1))}>−</button>
              <span className="disp" style={{ fontSize: 46, minWidth: 70, textAlign: "center" }}>{pick}</span>
              <button className="btn" style={{ padding: "10px 20px", fontSize: 22 }}
                disabled={pick >= 40} onClick={() => setRoundsPick(Math.min(40, pick + 1))}>+</button>
            </div>
            <div className="note" style={{ marginTop: 14, textAlign: "center" }}>
              {plural(scoring, "scoring round")}{upShuffleRounds(active)
                ? ` + ${plural(upShuffleRounds(active), "shuffle round")}` : ""} · about {asClock(mins)} in all
            </div>
            <div className="note" style={{ marginTop: 10 }}>
              {played} {played === 1 ? "round is" : "rounds are"} already played and cannot be undone here.
              {pick > now && ` ${plural(pick - now, "more round")} to play after this one.`}
              {pick < now && ` The night will stop ${plural(now - pick, "round")} earlier.`}
            </div>
            {pick > now && lastWasDoubled && (
              <div className="note" style={{ marginTop: 10, color: "var(--warn)" }}>
                The last round already played was <b>double points</b> and keeps them — they are
                on the board. The new final round will double as well, so the night ends with two.
              </div>
            )}
            {left === 0 && pick > now && (
              <div className="note" style={{ marginTop: 10 }}>
                The night had finished; adding a round reopens it.
              </div>
            )}
            <button className="btn" style={{ width: "100%", marginTop: 18 }} disabled={pick === now}
              onClick={() => { saveT(upSetRounds(active, pick)); setModal(null); }}>
              {pick > now ? `Play ${plural(pick - now, "more round")}` : `Finish ${plural(now - pick, "round")} earlier`}
            </button>
          </Sheet>
        );
      })()}

      {modal === "abandon" && active && (() => {
        const total = active.rounds.reduce((n, r) => n + r.courts.length, 0);
        const scored = active.rounds.reduce(
          (n, r) => n + r.courts.filter(m => m.score1 != null).length, 0);
        return (
          <Sheet title="Abandon this session?" onClose={() => setModal(null)}>
            <div className="note">
              <b>{active.name}</b> — {scored} of {total} matches scored.
              It will be closed without a podium and will not appear in the archive,
              and you will be able to start a new session. This cannot be undone from here.
            </div>
            <button className="btn" style={{ width: "100%", marginTop: 18, borderColor: "rgba(var(--warn-rgb),.45)", color: "var(--warn)", background: "rgba(var(--warn-rgb),.10)", boxShadow: "0 0 30px rgba(var(--warn-rgb),.25)" }}
              onClick={abandonSession}>Abandon it</button>
            <button className="btn ghost" style={{ width: "100%", marginTop: 10 }}
              onClick={() => setModal(null)}>Keep playing</button>
          </Sheet>
        );
      })()}

      {modal === "join" && active && (() => {
        const cands = people.filter(p => !active.playerIds.includes(p.id)).sort((a, b) => a.name.localeCompare(b.name));
        return (
          <Sheet title="Add a late arrival" onClose={() => setModal(null)}>
            <div className="note" style={{ marginBottom: 14 }}>
              They join from the next unplayed round. Scored rounds stay as played — but note that changing the
              line-up mid-session rebuilds the rotation, so a repeat partner is possible where it can't be avoided.
            </div>
            {cands.length === 0 && <div className="note">Everyone on the roster is already in this session.</div>}
            <div style={{ display: "flex", flexDirection: "column" }}>
              {cands.map(p => (
                <div className="row" key={p.id}>
                  <Ava p={p} />
                  <span className="truncate" style={{ flex: 1, fontWeight: 700 }}>{p.name}</span>
                  <button className="btn small" onClick={() => {
                    saveT(rebuildTail(active, active.courtCount, [...active.playerIds, p.id]));
                    setModal(null);
                  }}>Join</button>
                </div>
              ))}
            </div>
          </Sheet>
        );
      })()}

      {modal === "stats" && statsId && (() => {
        const me = statsId, agg = {};
        let played = 0, won = 0, ptsTotal = 0;
        tournaments.forEach(tt => (tt.rounds || []).forEach(r => (r.courts || []).forEach(m => {
          if (m.score1 == null || m.score2 == null) return;
          const inT1 = m.team1.includes(me), inT2 = m.team2.includes(me);
          if (!inT1 && !inT2) return;
          const mine = inT1 ? Number(m.score1) : Number(m.score2);
          const theirs = inT1 ? Number(m.score2) : Number(m.score1);
          const mate = (inT1 ? m.team1 : m.team2).find(id => id !== me);
          played++; ptsTotal += mine;
          const win = mine > theirs; if (win) won++;
          if (!agg[mate]) agg[mate] = { w: 0, l: 0 };
          win ? agg[mate].w++ : agg[mate].l++;
        })));
        const partners = Object.keys(agg).map(id => ({
          name: (byId[id] && byId[id].name) || "?", record: agg[id].w + "W – " + agg[id].l + "L"
        })).sort((a, b) => a.name.localeCompare(b.name));
        return (
          <Sheet title={(byId[me] && byId[me].name) || "Player"} onClose={() => setModal(null)}>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 10 }}>
              {[[played, "Matches"], [won, "Wins"], [ptsTotal, "Points"]].map(([v, l]) => (
                <div key={l} style={{ border: "1px solid var(--line)", borderRadius: 14, padding: "14px 10px", textAlign: "center" }}>
                  <div className="score" style={{ fontSize: 28, color: "var(--orange-br)" }}>{v}</div>
                  <div className="label" style={{ marginTop: 4 }}>{l}</div>
                </div>
              ))}
            </div>
            <div className="hair" style={{ marginTop: 18 }}>
              <div className="label" style={{ marginBottom: 8 }}>Partners</div>
              {partners.length === 0
                ? <div className="note">No matches played yet.</div>
                : partners.map(p => (
                  <div className="row" key={p.name}>
                    <span className="truncate" style={{ flex: 1, fontWeight: 700 }}>{p.name}</span>
                    <span className="label" style={{ letterSpacing: ".12em" }}>{p.record}</span>
                  </div>
                ))}
            </div>
          </Sheet>
        );
      })()}

      {/* Round by round, for one player. The ladder only teaches you to play
          it if you can see what each round paid you — a total at the end is a
          result, not feedback. */}
      {modal === "receipt" && receipt && (() => {
        const rt = tournaments.find(x => x.id === receipt.tid);
        if (!rt) return null;
        const rows = upReceipt(rt, receipt.id);
        const me = byId[receipt.id] || {};
        const nm = id => (byId[id] || {}).name || "?";
        const total = rows.reduce((n, r) => n + (r.points || 0), 0);
        const stand = calcStandings(rt, byId);
        const pos = stand.findIndex(x => x.id === receipt.id) + 1;
        return (
          <Sheet title={me.name || "Player"} onClose={() => setModal(null)}>
            <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", marginBottom: 14 }}>
              <span className="label">{pos ? `${pos} of ${stand.length}` : ""}</span>
              <span>
                <span className="score" style={{ fontSize: 30, color: "var(--volt)" }}>{total}</span>
                <span className="label" style={{ marginLeft: 8 }}>points</span>
              </span>
            </div>
            <div className="rcpt">
              {rows.map(r => (
                <div className={"r" + (r.won ? " won" : "")} key={r.roundNum}>
                  <span className="rn">R{r.roundNum}</span>
                  {r.shuffle && !r.pending
                    ? <Fragment>
                        <span className="ct">C{r.court}</span>
                        <span className="mid">
                          <span className="sc">{r.myScore}–{r.theirScore}</span>
                          <span className="with">the shuffle · {r.won ? "started a court up" : "started a court down"}</span>
                        </span>
                        <span className="got" style={{ fontSize: 13 }}>–<small>0</small></span>
                      </Fragment>
                    : r.resting
                    ? <Fragment>
                        <span className="ct">REST</span>
                        <span className="mid"><span className="with">sat this round out</span></span>
                        <span className="got">0</span>
                      </Fragment>
                    : r.pending
                      ? <Fragment>
                          <span className="ct">C{r.court}</span>
                          <span className="mid">
                            <span className="sc" style={{ color: "var(--muted2)" }}>not played</span>
                            <span className="with">with {nm(r.partner)}</span>
                          </span>
                          <span className="got" style={{ fontSize: 13 }}>
                            {r.stake.win}<small>or {r.stake.lose}</small>
                          </span>
                        </Fragment>
                      : <Fragment>
                          <span className="ct">C{r.court}</span>
                          <span className="mid">
                            <span className="sc">{r.myScore}–{r.theirScore}
                              {r.doubled && <span style={{ color: "var(--warn)", fontSize: 10, marginLeft: 7 }}>2×</span>}
                            </span>
                            <span className="with">
                              with {nm(r.partner)} · {r.moved === "up" ? "▲ up" : r.moved === "down" ? "▼ down" : "– held"}
                            </span>
                          </span>
                          <span className="got">+{r.points}<small>{r.running}</small></span>
                        </Fragment>}
                </div>
              ))}
            </div>
            <div className="note" style={{ marginTop: 14 }}>
              Court 1 pays {UP.WIN[1]} for a win and {UP.LOSE[1]} for a loss; Court {upCourts(rt)} pays{" "}
              {UP.WIN[upCourts(rt)]} and {UP.LOSE[upCourts(rt)]}. Losing on Court 1 is worth the same as
              winning on Court 3 — where you got to counts as much as what you did there.
            </div>
          </Sheet>
        );
      })()}

      {modal === "podium" && podiumT && (() => {
        const table = calcStandings(podiumT, byId);
        const heights = [150, 185, 125], order = [1, 0, 2];
        return (
          <Sheet title="Podium 👑" onClose={() => setModal(null)}>
            <div className="podium">
              {order.filter(i => table[i]).map((i, slot) => (
                <div key={i} className={"plinth" + (i === 0 ? " first" : i === 1 ? " second" : " third")} style={{ height: heights[slot] }}>
                  <Ava p={table[i]} on={i === 0} lg />
                  <span className="truncate pname" style={{ fontSize: 13, maxWidth: "100%" }}>{table[i].name}</span>
                  <span className="score ppts" style={{ fontSize: 24 }}>
                    {table[i].byAvg ? table[i].avg.toFixed(1) : table[i].points}
                  </span>
                  <span className="label">{i === 0 ? "1st" : i === 1 ? "2nd" : "3rd"}</span>
                </div>
              ))}
            </div>
            {table.slice(3).map((s, i) => (
              <div className="row" key={s.id}>
                <span className="label" style={{ width: 24 }}>{i + 4}</span>
                <span className="truncate" style={{ flex: 1, fontWeight: 700 }}>{s.name}</span>
                <span className="label" style={{ letterSpacing: ".12em" }}>
                  {s.byAvg ? `${s.avg.toFixed(1)} / match` : `${s.points} pts`}
                </span>
              </div>
            ))}
          </Sheet>
        );
      })()}
    </Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
