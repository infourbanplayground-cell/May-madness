          rebuildTail(), which calls generateSchedule() — the CLASSIC Americano
          circle method. On an UPRISING night that would overwrite the ladder
          with an Americano schedule and silently end the format mid-session.
          UPRISING's court count is not a setting either: it is players ÷ 4. So
          the controls are Americano's, and UPRISING states the fact instead. */}
      {canEdit && !isUp && (
        <div className="hair" style={{ display: "flex", flexWrap: "wrap", gap: 10, alignItems: "center", justifyContent: "space-between" }}>
          <div>
            <div className="label">Courts in use</div>
            <div className="sect" style={{ marginTop: 6 }}>{plural(t.courtCount, "court")}</div>
          </div>
          <div style={{ display: "flex", gap: 8 }}>
            <button className="btn small" onClick={onOpenCourts}>Change courts</button>
            <button className="btn small" onClick={onOpenJoin}>Late arrival</button>
          </div>
        </div>
      )}
      {canEdit && isUp && (
        <div className="hair">
          <div className="label">Courts in use</div>
          <div className="sect" style={{ marginTop: 6 }}>{plural(t.courtCount, "court")}</div>
          <div className="note" style={{ marginTop: 10 }}>
            Fixed for the night — {t.playerIds.length} players, four to a court.
            {upRestCount(t) > 0
              ? ` ${plural(upRestCount(t), "player")} ${upRestCount(t) === 1 ? "rests" : "rest"} each round, in turn, so everyone rests the same number of times.`
              : " Nobody sits out."}
          </div>
        </div>
      )}

      {sitOutNames && (
        <div className="hair">
          <div className="label">Resting</div>
          <div className="note" style={{ marginTop: 8, color: "var(--muted)" }}>{sitOutNames}</div>
        </div>
      )}

      <div className="courtgrid">
        {round.courts.map((m, mi) => {
          const key = ri + "-" + mi;
          const done = m.score1 != null && m.score2 != null;
          const isEditing = !!editing[key];
          const show = canEdit && (!done || isEditing);
          // Classic Americano shares a fixed pot of points between the two
          // pairs, so one slider says everything: 20 here is 12 there.
          const slide = drafts[key] != null ? drafts[key] : (done ? Number(m.score1) : Math.round(pts / 2));
          const presets = [pts, Math.round(pts * 0.75), Math.round(pts * 0.625), Math.round(pts / 2)];

          // UPRISING does NOT work that way: a match is first to 16, so the
          // winner has 16 and the loser has 0-15 and the two do not sum to
          // anything fixed. Driven by the zero-sum slider, a real 16-11 could
          // not be entered at all, and the slider's own midpoint preset gave
          // 8-8 — which upMatchDone rejects as unfinished, so the round never
          // completed, the next round was never built, and the night stalled
          // with nothing on screen to say why. So UPRISING gets its own entry:
          // tap the side that won, then tap what the other side got.
          const upd = drafts["up-" + key] || (done
            ? { w: m.score1 > m.score2 ? 1 : 2, l: Math.min(Number(m.score1), Number(m.score2)) }
            : { w: 0, l: null });
          const upReady = upd.w > 0 && upd.l != null;
          const upS = side => upd.w === 0 ? "–" : upd.w === side ? pts : (upd.l == null ? "?" : upd.l);
          const setUp = patch => setDrafts(d => ({ ...d, ["up-" + key]: { ...upd, ...patch } }));

          const s1 = done && !isEditing ? m.score1 : !show ? "–" : isUp ? upS(1) : slide;
          const s2 = done && !isEditing ? m.score2 : !show ? "–" : isUp ? upS(2) : pts - slide;
          return (
            <div key={key} className={"court" + (done && !isEditing ? " final" : show ? " live" : "")}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12, gap: 8 }}>
                <span className="label">Court {m.court}</span>
                {/* The stake, on the card, before anyone serves. A player who
                    can see that this court pays 8 and the one below pays 4 is
                    playing the ladder; one who cannot is just playing padel. */}
                {isUp && (
                  <span className="stake">
                    WIN <b>{upRoundPoints(m.court, true, dblRound)}</b>
                    <span className="sep">·</span>
                    LOSE <b>{upRoundPoints(m.court, false, dblRound)}</b>
                    {dblRound && <span className="dbl">2×</span>}
                  </span>
                )}
                <span className="label" style={{ color: done ? "var(--blue-soft)" : show ? "var(--orange-br)" : "var(--muted2)" }}>
                  {done ? "Final" : show ? "Scoring" : "Awaiting"}
                </span>
              </div>

              <div style={{ display: "grid", gridTemplateColumns: "minmax(0,1fr) auto minmax(0,1fr)", gap: 10, alignItems: "center" }}>
                <div className="teamside">
                  {m.team1.map(id => (
                    <span key={id} style={{ display: "flex", alignItems: "center", gap: 8, minWidth: 0 }}>
                      <Ava p={byId[id]} /><span className="truncate" style={{ fontWeight: 700, fontSize: 14 }}>{nameOf(id)}</span>
                    </span>
                  ))}
                  {isUp && done && !isEditing && (
                    <span className={"award" + (m.score1 > m.score2 ? " win" : "")}>
                      +{upRoundPoints(m.court, m.score1 > m.score2, dblRound)}
                      <i>{m.score1 > m.score2
                        ? (m.court === 1 ? "hold Court 1" : "up to Court " + (m.court - 1))
                        : (m.court === upCourts(t) ? "stay on Court " + m.court : "down to Court " + (m.court + 1))}</i>
                    </span>
                  )}
                </div>
                <div style={{ textAlign: "center" }}>
                  <div className="score" style={{ color: "var(--cream)" }}>
                    {s1}<span style={{ color: "var(--muted2)", fontSize: 20 }}> · </span>{s2}
                  </div>
                </div>
                <div className="teamside" style={{ alignItems: "flex-end" }}>
                  {/* NOT row-reverse. Reversing the row puts the overflow on
                      the left, so a long name was clipped mid-word and ran
                      straight through the score instead of ellipsing —
                      "Abdurahman Riyami" printed over the 0 of 16–0. Normal
                      direction with the avatar last keeps the ellipsis where
                      the browser can draw it. */}
                  {m.team2.map(id => (
                    <span key={id} style={{ display: "flex", alignItems: "center", justifyContent: "flex-end", gap: 8, minWidth: 0, width: "100%" }}>
                      <span className="truncate" style={{ fontWeight: 700, fontSize: 14, textAlign: "right" }}>{nameOf(id)}</span>
                      <Ava p={byId[id]} />
                    </span>
                  ))}
                  {isUp && done && !isEditing && (
                    <span className={"award" + (m.score2 > m.score1 ? " win" : "")} style={{ textAlign: "right" }}>
                      +{upRoundPoints(m.court, m.score2 > m.score1, dblRound)}
                      <i>{m.score2 > m.score1
                        ? (m.court === 1 ? "hold Court 1" : "up to Court " + (m.court - 1))
                        : (m.court === upCourts(t) ? "stay on Court " + m.court : "down to Court " + (m.court + 1))}</i>
                    </span>
                  )}
                </div>
              </div>

              {show && isUp && (
                <div style={{ marginTop: 14 }}>
                  <div className="label">Who won the court</div>
                  <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
                    {[1, 2].map(side => (
                      <button key={side} className={"wbtn" + (upd.w === side ? " on" : "")}
                        onClick={() => setUp({ w: side })}>
                        {(side === 1 ? m.team1 : m.team2).map(id => nameOf(id).split(" ")[0]).join(" + ")}
                      </button>
                    ))}
                  </div>
                  {upd.w > 0 && (
                    <div style={{ marginTop: 14 }}>
                      <div className="label">
                        And {(upd.w === 1 ? m.team2 : m.team1).map(id => nameOf(id).split(" ")[0]).join(" + ")} got
                      </div>
                      <div className={"pad" + (pts > 16 ? " tight" : "")}>
                        {Array.from({ length: pts }, (_, v) => v).map(v => (
                          <button key={v} className={"pbtn" + (upd.l === v ? " on" : "")}
                            onClick={() => setUp({ l: v })}>{v}</button>
                        ))}
                      </div>
                    </div>
                  )}
                  <button className="btn" style={{ width: "100%", marginTop: 16 }} disabled={!upReady}
                    onClick={() => onCommit(ri, mi, upS(1), upS(2), key)}>
                    {!upd.w ? "Pick the winning pair"
                      : upd.l == null ? "Pick their score"
                      : (done ? "Update" : "Confirm") + ` ${upS(1)}–${upS(2)}`}
                  </button>
                </div>
              )}

              {show && !isUp && (
                <div style={{ marginTop: 14 }}>
                  <div className="track"><i style={{ width: Math.round((slide / pts) * 100) + "%" }} /></div>
                  <input type="range" min="0" max={pts} value={slide}
                    onChange={e => setDrafts(d => ({ ...d, [key]: Number(e.target.value) }))} />
                  <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginTop: 10 }}>
                    {presets.map(v => (
                      <button key={v} className="btn small" onClick={() => setDrafts(d => ({ ...d, [key]: v }))}>
                        {v}-{pts - v}
                      </button>
                    ))}
                    <button className="btn" style={{ marginLeft: "auto", padding: "10px 18px" }}
                      onClick={() => onCommit(ri, mi, slide, pts - slide, key)}>
                      {done ? "Update score" : "Confirm score"}
                    </button>
                  </div>
                </div>
              )}
              {done && canEdit && !isEditing && (
                <div style={{ marginTop: 12, textAlign: "right" }}>
                  <button className="btn small" onClick={() => setEditing(e => ({ ...e, [key]: true }))}>Edit score</button>
                </div>
              )}
            </div>
          );
        })}
      </div>

      {canFinish && <button className="btn" onClick={onFinish}>Finish session 🏆</button>}

      {/* A session with unscored matches can never be finished, so without this
          an abandoned night stays `active` forever and the app opens into it
          instead of Setup — there is no other way back. An August session with
          seven unscored rounds was still on the board in October. */}
      {canEdit && !canFinish && (
        <button className="btn ghost" style={{ borderColor: "rgba(var(--warn-rgb),.45)", color: "var(--warn)" }}
          onClick={onAbandon}>Abandon session</button>
      )}
    </div>
  );
}

// ── standings ───────────────────────────────────────────────────
function Standings({ t, byId, onPodium, onReceipt }) {
  const isUp = !!t && t.format === "uprising";
  if (!t) return (
    <div className="screen">
      <div><Eyebrow>Standings</Eyebrow><div className="display">No <em>session</em></div>
        <p className="lede">Start a session and scores will show up here.</p></div>
    </div>
  );
  const table = calcStandings(t, byId);
  const byAvg = !isEvenSchedule(t);
  const counts = Object.values(scheduledMatchCounts(t));
  return (
    <div className="screen">
      <div>
        <Eyebrow>{t.name}</Eyebrow>
        <div className="display">The <em>Standings</em></div>
      </div>
      {byAvg && (
        <div className="hair note">
          This line-up can't give everyone the same number of matches — the schedule hands some players
          {" "}{Math.min(...counts)}–{Math.max(...counts)} matches. Ranking on <b style={{ color: "var(--cream)" }}>points per match</b> so
          extra court time doesn't decide the winner. Totals are shown underneath.
        </div>
      )}
      {table.length > 0 && (
        <div><button className="btn gold" onClick={onPodium}>Podium 👑</button></div>
      )}
      <div className="hair" style={{ display: "flex", flexDirection: "column" }}>
        {table.map((s, i) => (
          <div className="row" key={s.id}
            onClick={isUp && onReceipt ? () => onReceipt(s.id) : undefined}
            style={Object.assign({},
              i === 0 ? { background: "rgba(var(--volt-rgb),.07)", borderLeft: "2px solid var(--volt)", paddingLeft: 10 } : null,
              isUp && onReceipt ? { cursor: "pointer" } : null)}>
            <span className="score" style={{ fontSize: 22, width: 34, textAlign: "center", color: i === 0 ? "var(--volt)" : "var(--muted2)" }}>{i + 1}</span>
            <Ava p={s} on={i === 0} />
            <span style={{ flex: 1, minWidth: 0 }}>
              <span className="truncate" style={{ display: "block", fontWeight: 800 }}>{s.name}</span>
              <span className="label" style={{ letterSpacing: ".12em" }}>
                {s.played} played · {s.wins} won{isUp && onReceipt ? " · tap for rounds" : ""}
              </span>
            </span>
            <span style={{ textAlign: "right" }}>
              <span className="score" style={{ fontSize: 26, display: "block",
                color: i === 0 ? "var(--volt)" : "var(--cream)" }}>
                {byAvg ? (s.played ? s.avg.toFixed(1) : "–") : s.points}
              </span>
              <span className="label" style={{ letterSpacing: ".12em" }}>
                {byAvg ? `${s.points} pts` : `${s.diff > 0 ? "+" : ""}${s.diff}`}
              </span>
            </span>
          </div>
        ))}
      </div>
    </div>
  );
}

// ── players ─────────────────────────────────────────────────────
function Players({ people, tournaments, query, setQuery, onOpenStats }) {
  const q = query.toLowerCase();
  const cards = people.filter(p => p.name.toLowerCase().includes(q))
    .sort((a, b) => a.name.localeCompare(b.name))
    .map(p => {
      let played = 0, pointsTotal = 0;
      tournaments.forEach(tt => (tt.rounds || []).forEach(r => (r.courts || []).forEach(m => {
        if (m.score1 == null) return;
        if (m.team1.includes(p.id)) { played++; pointsTotal += Number(m.score1); }
        else if (m.team2.includes(p.id)) { played++; pointsTotal += Number(m.score2); }
      })));
      return { ...p, sub: played ? `${played} matches · ${pointsTotal} pts` : "No matches yet" };
    });
  return (
    <div className="screen">
      <div>
        <Eyebrow>{plural(people.length, "player")}</Eyebrow>
        <div className="display">The <em>Roster</em></div>
      </div>
      <input className="field" placeholder="Search players…" value={query} onChange={e => setQuery(e.target.value)} />
      <div className="hair" style={{ display: "flex", flexDirection: "column" }}>
        {cards.map(p => (
          <button key={p.id} className="row" onClick={() => onOpenStats(p.id)}
            style={{ background: "transparent", border: 0, borderBottom: "1px solid var(--line2)", cursor: "pointer", color: "inherit", textAlign: "left", width: "100%" }}>
            <Ava p={p} />
            <span style={{ flex: 1, minWidth: 0 }}>
              <span className="truncate" style={{ display: "block", fontWeight: 700 }}>{p.name}</span>
              <span className="label" style={{ letterSpacing: ".12em" }}>{p.sub}</span>
            </span>
            {p.guest && <span className="label" style={{ color: "var(--blue-soft)" }}>Guest</span>}
          </button>
        ))}
      </div>
    </div>
  );
}

// ── admin (guests only) ─────────────────────────────────────────
function Admin({ guests, newName, setNewName, onAdd, onRename, onDelete }) {
  return (
    <div className="screen">
      <div>
        <Eyebrow>Admin</Eyebrow>
        <div className="display">Manage <em>Guests</em></div>
        <p className="lede">
          The main roster is synced from <b>August Attack</b> and is read-only here — add or edit those players there.
          Guests below are local to Americano, for one-off drop-ins.
        </p>
      </div>
      <div className="hair" style={{ display: "flex", gap: 10, alignItems: "flex-end" }}>
        <input className="field" placeholder="Add a guest player…" value={newName}
          onChange={e => setNewName(e.target.value)}
          onKeyDown={e => e.key === "Enter" && onAdd()} />
        <button className="btn" onClick={onAdd}>Add</button>
      </div>
      <div style={{ display: "flex", flexDirection: "column" }}>
        {guests.length === 0 && <div className="note">No guest players yet.</div>}
        {guests.map(p => (
          <div className="row" key={p.id}>
            <Ava p={p} />
            <input className="field" style={{ borderBottom: 0, fontWeight: 700 }} value={p.name}
              onChange={e => onRename(p.id, e.target.value)} />
            <button className="btn small" style={{ borderColor: "rgba(var(--warn-rgb),.45)", color: "var(--warn)" }}
              onClick={() => onDelete(p.id)}>Del</button>
          </div>
        ))}
      </div>
    </div>
  );
}

// ── history ─────────────────────────────────────────────────────
function History({ tournaments, byId, onOpen }) {
  const done = tournaments.filter(x => x.status === "completed").sort((a, b) => b.createdAt - a.createdAt);
  return (
    <div className="screen">
      <div>
        <Eyebrow>Archive</Eyebrow>
        <div className="display">Past <em>Sessions</em></div>
      </div>
      {done.length === 0
        ? <div className="hair note">No completed sessions yet.</div>
        : (
          <div className="hair" style={{ display: "flex", flexDirection: "column" }}>
            {done.map(tt => {
              const s = calcStandings(tt, byId);
              return (
                <button key={tt.id} className="row" onClick={() => onOpen(tt.id)}
                  style={{ background: "transparent", border: 0, borderBottom: "1px solid var(--line2)", cursor: "pointer", color: "inherit", textAlign: "left", width: "100%" }}>
                  <span style={{ flex: 1, minWidth: 0 }}>
                    <span className="truncate" style={{ display: "block", fontWeight: 800, fontSize: 16 }}>{tt.name}</span>
                    <span className="label" style={{ letterSpacing: ".12em" }}>
                      {new Date(tt.createdAt).toLocaleDateString()} · {tt.playerIds.length} players · {tt.rounds.length} rounds
                    </span>
                  </span>
                  <span style={{ textAlign: "right" }}>
                    <span className="label" style={{ color: "var(--gold)" }}>Winner</span>
                    <span className="truncate" style={{ display: "block", fontWeight: 700 }}>{s.length ? s[0].name : "—"}</span>
                  </span>
                </button>
              );
            })}
          </div>
        )}
    </div>
  );
}

// ── app ─────────────────────────────────────────────────────────
function App() {
  const [data, setData] = useState({ players: [], guests: [], tournaments: [] });
  const [loaded, setLoaded] = useState(false);
  const [role, setRole] = useState(LS.get("am-role"));
  const [token, setTokenState] = useState(LS.get("am-token"));
  const [view, setView] = useState("board");
  const [modal, setModal] = useState(null);
  const [pin, setPin] = useState("");
  const [loginErr, setLoginErr] = useState(false);
  const [sel, setSel] = useState({});
  const [cfg, setCfg] = useState({ name: "", points: 32, rounds: 7, courts: 2,
                                   upcourts: 4, uppoints: UP.TARGET, uprounds: UP.ROUNDS,
                                   format: "americano" });
  const [roundIdx, setRoundIdx] = useState(0);
  const [receipt, setReceipt] = useState(null);
  const [drafts, setDrafts] = useState({});
  const [editing, setEditing] = useState({});
  const [courtsPick, setCourtsPick] = useState(null);
  const [query, setQuery] = useState("");
  const [newName, setNewName] = useState("");
  const [statsId, setStatsId] = useState(null);
  const [historyId, setHistoryId] = useState(null);
  const [podiumId, setPodiumId] = useState(null);
  const saveTimer = useRef(null);

  useEffect(() => {
    fetch("/state").then(r => r.json()).then(r => {
      if (r && r.ok) setData(d => ({ players: [], guests: [], tournaments: [], ...r.state }));
      setLoaded(true);
    }).catch(() => setLoaded(true));
  }, []);

  const canEdit = role === "admin" || role === "scorer";
  const guests = data.guests || [];
  const people = useMemo(
    () => [...(data.players || []), ...guests.map(g => ({ ...g, guest: true }))],
    [data.players, guests]
  );
  const byId = useMemo(() => { const m = {}; people.forEach(p => { m[p.id] = p; }); return m; }, [people]);
  const tournaments = data.tournaments || [];
  const active = tournaments.find(t => t.status === "active");

  function persist(next) {
    setData(next);
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      fetch("/save", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + LS.get("am-token") },
        body: JSON.stringify({ state: next })
      }).catch(() => {});
    }, 400);
  }
  const saveT = nextT => persist({ ...data, tournaments: tournaments.map(x => x.id === nextT.id ? nextT : x) });

  // What a player has averaged in previous UPRISING nights. Used to seed the
  // opening ladder and as the baseline for THE CLIMB. Measured over 3,000
  // simulated nights, a RANDOM opening ladder hands a Court 1 starter 40% of
  // the wins and a Court 4 starter 8% — a five-fold swing settled before a ball
  // is hit. Seeded, that advantage is earned instead of drawn.
  const upForm = useMemo(() => {
    const got = {};
    (tournaments || []).forEach(t => {
      // Only a FINISHED night is form. An abandoned one is a few scores and a
      // walk-off, and an active one is tonight.
      if (t.format !== "uprising" || t.status !== "completed") return;
      upStandings(t, byId).forEach(r => {
        if (r.played > 0) (got[r.id] = got[r.id] || []).push(r.total);
      });
    });
    const out = {};
    Object.keys(got).forEach(id => {
      out[id] = got[id].reduce((a, b) => a + b, 0) / got[id].length;
    });
    return out;
  }, [tournaments, byId]);

  function startSession() {
    const ids = Object.keys(sel).filter(id => sel[id]);
    if (ids.length < 4) return;
    const courts = Math.max(1, Math.min(Number(cfg.courts) || 1, maxCourtsFor(ids.length)));
    const rounds = Number(cfg.rounds) || 1;
    let nt;
    if (cfg.format === "uprising") {
      // UPRISING cannot pre-generate a schedule: who you play depends on which
      // court you climbed to, so only round one exists at the start and each
      // round is built from the last one's results.
      if (ids.length < 8) { alert("UPRISING needs at least eight players."); return; }
      // Four to a court is padel. The FIELD does not have to be a multiple of
      // four — it just means somebody rests every round, on a rota drawn now
      // and walked in order so that when your turn comes it has nothing to do
      // with how you are playing.
      const upCourtCount = Math.max(1, Math.min(
        Number(cfg.upcourts) || UP.COURTS, Math.floor(ids.length / 4), UP.COURTS));
      // Nine rounds was a two-hour time budget, never a rule of the format —
      // nothing in the ladder or the points table counts to nine. Longer is a
      // measurably better competition: at 16 players, 15 rounds puts the real
      // top-3 player on top 69% of the time against 61% at nine, correlates
      // 0.73 with true skill against 0.62, and gives a median of 11 different
      // partners against 8. It only costs time, which is what the finish
      // estimate on the setup screen is for.
      const upRounds = Math.max(2, Math.min(40, Number(cfg.uprounds) || UP.ROUNDS));
      const ladder0 = upSeedLadder(ids, upForm, upCourtCount);
      const seedT = {
        id: uid("t"), format: "uprising", playerIds: ids, ladder0, rounds: [],
        courtCount: upCourtCount, numRounds: upRounds,
        restRota: upMakeRestRota(ids, Date.now()),
      };
      nt = {
        ...seedT,
        name: cfg.name.trim() || "Uprising " + new Date().toLocaleDateString(),
        // The target is the organiser's: first to 16 is the default because it
        // lands an UPRISING round at about eleven minutes, but a shorter night
        // wants 11 and a longer one 21. Nothing in the ladder depends on it —
        // the court you are on decides the points, the scoreline only breaks
        // ties — so it is free to move.
        createdAt: Date.now(),
        pointsPerMatch: Math.max(4, Math.min(99, Number(cfg.uppoints) || UP.TARGET)),
        baselines: Object.fromEntries(ids.filter(i => upForm[i] != null).map(i => [i, upForm[i]])),
        rounds: [upBuildRound(seedT)], status: "active",
      };
    } else {
      nt = {
        id: uid("t"), format: "americano",
        name: cfg.name.trim() || "Americano " + new Date().toLocaleDateString(),
        createdAt: Date.now(), pointsPerMatch: Number(cfg.points) || 32,
        playerIds: ids, numRounds: rounds, courtCount: courts,
        rounds: generateSchedule(ids, rounds, courts), status: "active"
      };
    }
    persist({ ...data, tournaments: [...tournaments, nt] });
    setRoundIdx(0); setView("board");
  }
  function commitScore(ri, mi, s1, s2, key) {
    if (!active) return;
    let rounds = active.rounds.map((r, i) => i !== ri ? r : {
      ...r, courts: r.courts.map((mm, j) => j !== mi ? mm : { ...mm, score1: s1, score2: s2 })
    });
    if (active.format === "uprising") {
      // The ladder has moved, so the next round can now be drawn. Built only
      // when the LAST round on the board is complete: editing a score in an
      // earlier round must not append a duplicate round behind the scorer's
      // back, and later rounds are left alone because re-pairing them would
      // rewrite matches people have already played.
      const nextT = { ...active, rounds };
      if (upRoundDone(rounds[rounds.length - 1]) && rounds.length < upRoundsTotal(active)) {
        try { rounds = [...rounds, upBuildRound(nextT)]; }
        catch (e) { console.warn("could not build the next round:", e.message); }
      }
    }
    saveT({ ...active, rounds });
    setEditing(e => ({ ...e, [key]: false }));
  }
  function finishSession() {
    if (!active) return;
    saveT({ ...active, status: "completed", completedAt: Date.now() });
    setPodiumId(active.id); setSel({}); setModal("podium");
  }
  // Abandoned, NOT deleted: the night stays in the state so the scores anyone
  // did enter are not thrown away, but it stops being `active` so Setup comes
  // back. History shows only `completed`, so it does not appear there, and it
  // does not feed UPRISING form either.
  function abandonSession() {
    if (!active) return;
    saveT({ ...active, status: "abandoned", abandonedAt: Date.now() });
    setSel({}); setRoundIdx(0); setModal(null); setView("board");
  }
  function submitLogin() {
    fetch("/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ pin }) })
      .then(r => r.json()).then(r => {
        if (r && r.ok) {
          LS.set("am-token", r.token); LS.set("am-role", r.role);
          setTokenState(r.token); setRole(r.role); setModal(null); setLoginErr(false); setPin("");
        } else setLoginErr(true);
      }).catch(() => setLoginErr(true));
  }
  function logout() {
    LS.set("am-role", ""); LS.set("am-token", "");
    setRole(""); setTokenState(""); setView("board");
  }
  function addGuest() {
    const n = newName.trim(); if (!n) return;
    persist({ ...data, guests: [...guests, { id: uid("g"), name: n }] });
    setNewName("");
  }

  if (!loaded) return <div style={{ minHeight: "100vh", display: "grid", placeItems: "center", color: "var(--muted2)" }}>Loading…</div>;

  const shownT = historyId ? tournaments.find(x => x.id === historyId) : active;
  const podiumT = podiumId ? tournaments.find(x => x.id === podiumId) : shownT;
  const navDefs = [
    { id: "board", label: active ? "Board" : "Setup" },
    { id: "standings", label: "Standings" },
    { id: "players", label: "Players" },
    { id: "history", label: "History" }
  ];
  if (role === "admin") navDefs.push({ id: "admin", label: "Admin" });
  // The header used to say AMERICANO on an UPRISING night, with the format
  // demoted to the subtitle. The wordmark is the thing people photograph.
  const headerName = active && active.format === "uprising" ? "Uprising"
                   : active ? "Americano"
                   : cfg.format === "uprising" ? "Uprising" : "Americano";
  const headerSub = active
    ? active.name.replace(new RegExp("^" + headerName + "\\s+", "i"), "")
    : (canEdit ? "Ready to set up" : "Guest view");

  return (
    <Fragment>
      <header className="top">
        <div className="brand">
          {/* A drawn mark, not an emoji: the emoji renders in whatever face
              the OS supplies and carries its own colours, which is the one
              thing a palette cannot override. This is the climb. */}
          <span className="mark" aria-hidden="true">
            <svg viewBox="0 0 100 100" width="18" height="18">
              <path d="M18 64 L50 32 L82 64" fill="none" stroke="currentColor"
                strokeWidth="13" strokeLinecap="square" />
            </svg>
          </span>
          <span style={{ display: "flex", flexDirection: "column", minWidth: 0 }}>
            <span className="name">{headerName}</span>
            <span className="sub">{headerSub}</span>
          </span>
        </div>
        {canEdit
          ? <button className="btn ghost" onClick={logout}>{role}</button>
          : <button className="btn pill" onClick={() => { setModal("login"); setPin(""); setLoginErr(false); }}>Login</button>}
      </header>

      <main>
        {view === "board" && (active
          ? <Board t={active} byId={byId} canEdit={canEdit} roundIdx={roundIdx} setRoundIdx={setRoundIdx}
              drafts={drafts} setDrafts={setDrafts} editing={editing} setEditing={setEditing}
              onCommit={commitScore} onFinish={finishSession}
              onOpenCourts={() => { setCourtsPick(active.courtCount); setModal("courts"); }}
              onOpenJoin={() => setModal("join")}
              onAbandon={() => setModal("abandon")} />
          : <Setup people={people} canEdit={canEdit} cfg={cfg} setCfg={setCfg} sel={sel} setSel={setSel} onStart={startSession} />)}

        {view === "standings" && <Standings t={shownT} byId={byId}
          onReceipt={id => { setReceipt({ id, tid: shownT.id }); setModal("receipt"); }}
          onPodium={() => { setPodiumId(shownT ? shownT.id : null); setModal("podium"); }} />}

        {view === "players" && <Players people={people} tournaments={tournaments} query={query} setQuery={setQuery}
          onOpenStats={id => { setStatsId(id); setModal("stats"); }} />}

        {view === "history" && <History tournaments={tournaments} byId={byId}
          onOpen={id => { setHistoryId(id); setView("standings"); }} />}

        {view === "admin" && role === "admin" && (
          <Admin guests={guests} newName={newName} setNewName={setNewName} onAdd={addGuest}
            onRename={(id, name) => persist({ ...data, guests: guests.map(g => g.id === id ? { ...g, name } : g) })}
            onDelete={id => persist({ ...data, guests: guests.filter(g => g.id !== id) })} />
        )}
      </main>

      <nav className="bottom">
        {navDefs.map(n => (
          <button key={n.id} className={view === n.id ? "on" : ""}
            onClick={() => { if (n.id === "standings") setHistoryId(null); setView(n.id); }}>{n.label}</button>
        ))}
      </nav>

      {modal === "login" && (
        <Sheet title="Scorer login" onClose={() => setModal(null)}>
          <input className="field big" type="password" inputMode="numeric" placeholder="PIN" value={pin} autoFocus
            onChange={e => setPin(e.target.value)} onKeyDown={e => e.key === "Enter" && submitLogin()} />
          {loginErr && <div className="note" style={{ color: "var(--red)", marginTop: 10 }}>Wrong PIN.</div>}
          <button className="btn" style={{ width: "100%", marginTop: 18 }} onClick={submitLogin}>Log in</button>
        </Sheet>
      )}

      {modal === "courts" && active && (() => {
        const maxC = maxCourtsFor(active.playerIds.length);
        const pick = courtsPick == null ? active.courtCount : courtsPick;
        const playedRounds = firstUnplayedIndex(active);
        return (
          <Sheet title="Courts in use" onClose={() => setModal(null)}>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
              {Array.from({ length: maxC }, (_, i) => i + 1).map(v => (
                <button key={v} className={"rchip" + (v === pick ? " on" : "")} style={{ minWidth: 52, fontSize: 15 }}
                  onClick={() => setCourtsPick(v)}>{v}</button>
              ))}
            </div>
            <div className="note" style={{ marginTop: 14 }}>
              {restPhrase(Math.max(0, active.playerIds.length - pick * 4))} each round on {plural(pick, "court")}.
              The {playedRounds} {playedRounds === 1 ? "round already scored stays" : "rounds already scored stay"} as
              played; partners keep rotating from there, so nobody repeats a partner.
            </div>
            <button className="btn" style={{ width: "100%", marginTop: 18 }} disabled={pick === active.courtCount}
              onClick={() => { saveT(rebuildTail(active, pick, null)); setModal(null); }}>Apply</button>
          </Sheet>
        );
      })()}

      {modal === "abandon" && active && (() => {
        const total = active.rounds.reduce((n, r) => n + r.courts.length, 0);
        const scored = active.rounds.reduce(
          (n, r) => n + r.courts.filter(m => m.score1 != null).length, 0);
        return (
          <Sheet title="Abandon this session?" onClose={() => setModal(null)}>
            <div className="note">
              <b>{active.name}</b> — {scored} of {total} matches scored.
              It will be closed without a podium and will not appear in the archive,
              and you will be able to start a new session. This cannot be undone from here.
            </div>
            <button className="btn" style={{ width: "100%", marginTop: 18, borderColor: "rgba(var(--warn-rgb),.45)", color: "var(--warn)", background: "rgba(var(--warn-rgb),.10)", boxShadow: "0 0 30px rgba(var(--warn-rgb),.25)" }}
              onClick={abandonSession}>Abandon it</button>
            <button className="btn ghost" style={{ width: "100%", marginTop: 10 }}
              onClick={() => setModal(null)}>Keep playing</button>
          </Sheet>
        );
      })()}

      {modal === "join" && active && (() => {
        const cands = people.filter(p => !active.playerIds.includes(p.id)).sort((a, b) => a.name.localeCompare(b.name));
        return (
          <Sheet title="Add a late arrival" onClose={() => setModal(null)}>
            <div className="note" style={{ marginBottom: 14 }}>
              They join from the next unplayed round. Scored rounds stay as played — but note that changing the
              line-up mid-session rebuilds the rotation, so a repeat partner is possible where it can't be avoided.
            </div>
            {cands.length === 0 && <div className="note">Everyone on the roster is already in this session.</div>}
            <div style={{ display: "flex", flexDirection: "column" }}>
              {cands.map(p => (
                <div className="row" key={p.id}>
                  <Ava p={p} />
                  <span className="truncate" style={{ flex: 1, fontWeight: 700 }}>{p.name}</span>
                  <button className="btn small" onClick={() => {
                    saveT(rebuildTail(active, active.courtCount, [...active.playerIds, p.id]));
                    setModal(null);
                  }}>Join</button>
                </div>
              ))}
            </div>
          </Sheet>
        );
      })()}

      {modal === "stats" && statsId && (() => {
        const me = statsId, agg = {};
        let played = 0, won = 0, ptsTotal = 0;
        tournaments.forEach(tt => (tt.rounds || []).forEach(r => (r.courts || []).forEach(m => {
          if (m.score1 == null || m.score2 == null) return;
          const inT1 = m.team1.includes(me), inT2 = m.team2.includes(me);
          if (!inT1 && !inT2) return;
          const mine = inT1 ? Number(m.score1) : Number(m.score2);
          const theirs = inT1 ? Number(m.score2) : Number(m.score1);
          const mate = (inT1 ? m.team1 : m.team2).find(id => id !== me);
          played++; ptsTotal += mine;
          const win = mine > theirs; if (win) won++;
          if (!agg[mate]) agg[mate] = { w: 0, l: 0 };
          win ? agg[mate].w++ : agg[mate].l++;
        })));
        const partners = Object.keys(agg).map(id => ({
          name: (byId[id] && byId[id].name) || "?", record: agg[id].w + "W – " + agg[id].l + "L"
        })).sort((a, b) => a.name.localeCompare(b.name));
        return (
          <Sheet title={(byId[me] && byId[me].name) || "Player"} onClose={() => setModal(null)}>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 10 }}>
              {[[played, "Matches"], [won, "Wins"], [ptsTotal, "Points"]].map(([v, l]) => (
                <div key={l} style={{ border: "1px solid var(--line)", borderRadius: 14, padding: "14px 10px", textAlign: "center" }}>
                  <div className="score" style={{ fontSize: 28, color: "var(--orange-br)" }}>{v}</div>
                  <div className="label" style={{ marginTop: 4 }}>{l}</div>
                </div>
              ))}
            </div>
            <div className="hair" style={{ marginTop: 18 }}>
              <div className="label" style={{ marginBottom: 8 }}>Partners</div>
              {partners.length === 0
                ? <div className="note">No matches played yet.</div>
                : partners.map(p => (
                  <div className="row" key={p.name}>
                    <span className="truncate" style={{ flex: 1, fontWeight: 700 }}>{p.name}</span>
                    <span className="label" style={{ letterSpacing: ".12em" }}>{p.record}</span>
                  </div>
                ))}
            </div>
          </Sheet>
        );
      })()}

      {/* Round by round, for one player. The ladder only teaches you to play
          it if you can see what each round paid you — a total at the end is a
          result, not feedback. */}
      {modal === "receipt" && receipt && (() => {
        const rt = tournaments.find(x => x.id === receipt.tid);
        if (!rt) return null;
        const rows = upReceipt(rt, receipt.id);
        const me = byId[receipt.id] || {};
        const nm = id => (byId[id] || {}).name || "?";
        const total = rows.reduce((n, r) => n + (r.points || 0), 0);
        const stand = calcStandings(rt, byId);
        const pos = stand.findIndex(x => x.id === receipt.id) + 1;
        return (
          <Sheet title={me.name || "Player"} onClose={() => setModal(null)}>
            <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", marginBottom: 14 }}>
              <span className="label">{pos ? `${pos} of ${stand.length}` : ""}</span>
              <span>
                <span className="score" style={{ fontSize: 30, color: "var(--volt)" }}>{total}</span>
                <span className="label" style={{ marginLeft: 8 }}>points</span>
              </span>
            </div>
            <div className="rcpt">
              {rows.map(r => (
                <div className={"r" + (r.won ? " won" : "")} key={r.roundNum}>
                  <span className="rn">R{r.roundNum}</span>
                  {r.resting
                    ? <Fragment>
                        <span className="ct">REST</span>
                        <span className="mid"><span className="with">sat this round out</span></span>
                        <span className="got">0</span>
                      </Fragment>
                    : r.pending
                      ? <Fragment>
                          <span className="ct">C{r.court}</span>
                          <span className="mid">
                            <span className="sc" style={{ color: "var(--muted2)" }}>not played</span>
                            <span className="with">with {nm(r.partner)}</span>
                          </span>
                          <span className="got" style={{ fontSize: 13 }}>
                            {r.stake.win}<small>or {r.stake.lose}</small>
                          </span>
                        </Fragment>
                      : <Fragment>
                          <span className="ct">C{r.court}</span>
                          <span className="mid">
                            <span className="sc">{r.myScore}–{r.theirScore}
                              {r.doubled && <span style={{ color: "var(--warn)", fontSize: 10, marginLeft: 7 }}>2×</span>}
                            </span>
                            <span className="with">
                              with {nm(r.partner)} · {r.moved === "up" ? "▲ up" : r.moved === "down" ? "▼ down" : "– held"}
                            </span>
                          </span>
                          <span className="got">+{r.points}<small>{r.running}</small></span>
                        </Fragment>}
                </div>
              ))}
            </div>
            <div className="note" style={{ marginTop: 14 }}>
              Court 1 pays {UP.WIN[1]} for a win and {UP.LOSE[1]} for a loss; Court {upCourts(rt)} pays{" "}
              {UP.WIN[upCourts(rt)]} and {UP.LOSE[upCourts(rt)]}. Losing on Court 1 is worth the same as
              winning on Court 3 — where you got to counts as much as what you did there.
            </div>
          </Sheet>
        );
      })()}

      {modal === "podium" && podiumT && (() => {
        const table = calcStandings(podiumT, byId);
        const heights = [150, 185, 125], order = [1, 0, 2];
        return (
          <Sheet title="Podium 👑" onClose={() => setModal(null)}>
            <div className="podium">
              {order.filter(i => table[i]).map((i, slot) => (
                <div key={i} className={"plinth" + (i === 0 ? " first" : i === 1 ? " second" : " third")} style={{ height: heights[slot] }}>
                  <Ava p={table[i]} on={i === 0} lg />
                  <span className="truncate pname" style={{ fontSize: 13, maxWidth: "100%" }}>{table[i].name}</span>
                  <span className="score ppts" style={{ fontSize: 24 }}>
                    {table[i].byAvg ? table[i].avg.toFixed(1) : table[i].points}
                  </span>
                  <span className="label">{i === 0 ? "1st" : i === 1 ? "2nd" : "3rd"}</span>
                </div>
              ))}
            </div>
            {table.slice(3).map((s, i) => (
              <div className="row" key={s.id}>
                <span className="label" style={{ width: 24 }}>{i + 4}</span>
                <span className="truncate" style={{ flex: 1, fontWeight: 700 }}>{s.name}</span>
                <span className="label" style={{ letterSpacing: ".12em" }}>
                  {s.byAvg ? `${s.avg.toFixed(1)} / match` : `${s.points} pts`}
                </span>
              </div>
            ))}
          </Sheet>
        );
      })()}
    </Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
