<body>
<div class="bg"></div>
<div id="root" class="wrap"></div>

<script type="text/babel" data-presets="react">

const { useState, useEffect, useMemo, useRef, Fragment } = React;

// ── storage / small helpers ──────────────────────────────────────
const LS = {
  get(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } },
  set(k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) {} }
};
const uid = p => p + "_" + Math.random().toString(36).slice(2, 10);
const initials = n => (n || "?").split(" ").filter(Boolean).map(w => w[0]).slice(0, 2).join("").toUpperCase();
const restPhrase = n => (n === 1 ? "1 player rests" : n + " players rest");
const plural = (n, w) => n + " " + w + (n === 1 ? "" : "s");

// ── Americano scheduling: circle method ─────────────────────────
// Over (n-1) rounds (n even; padded with a bye slot if odd) every pair of
// players appears together as PARTNERS exactly once — the rotation math used
// by classic Americano generators. Courts are formed by combining two partner
// pairs, with the grouping offset rotated each round for opponent variety.
// ══ UPRISING ENGINE ════════════════════════════════════════════════════════
// Inlined verbatim from uprising-engine.js by build-americano-app.py.
// Do not edit it here: the tests run against that file, and a second
// copy is how the rules drift away from the thing that proves them.
/* UPRISING — the engine.
 *
 * Every rule in UPRISING.md lives here and nowhere else. The app inlines this
 * file verbatim (build-uprising-app.py) so that the thing the tests exercise is
 * the thing the browser runs — the one mistake this repo has made more than any
 * other is two copies of the same logic quietly drifting apart.
 *
 * Pure functions, no DOM, no fetch. `node --test uprising-engine.test.js`.
 */

const UP = {
  COURTS: 4,
  ROUNDS: 9,
  FIELD: 16,
  TARGET: 16,            // a match is first to 16 points
  FINAL_MULT: 2,         // the last round is worth double

  // Points are worth more higher up the ladder. Ranking on raw match points
  // would reward farming wins on Court 4, which is the opposite of a format
  // called UPRISING. Losing on Court 1 is worth the same as winning on Court 3:
  // where you got to counts as much as what you did when you got there.
  WIN:  { 1: 8, 2: 6, 3: 4, 4: 2 },
  LOSE: { 1: 4, 2: 3, 3: 2, 4: 1 },
};

// ── helpers ────────────────────────────────────────────────────────────────

function upPairKey(a, b) { return [a, b].sort().join("|"); }

function upCourtSizes(courts) {
  const n = {};
  Object.values(courts).forEach(c => { n[c] = (n[c] || 0) + 1; });
  return n;
}

// ── the opening ladder ─────────────────────────────────────────────────────
//
// Seeded by form, never drawn at random. Measured over 3,000 nights, a random
// opening ladder gives a Court 1 starter 40% of the wins and a Court 4 starter
// 8% — a five-fold swing decided before a ball is hit, which is luck choosing
// who takes a voucher. Seeded, that same 40% is the form player starting where
// they earned it.
//
// `form` is a map of playerId -> number (higher is better). A player with no
// history gets the median, so newcomers start in the middle rather than being
// punished or rewarded for being unknown.
function upSeedLadder(playerIds, form = {}) {
  const known = playerIds.filter(p => typeof form[p] === "number").map(p => form[p]).sort((a, b) => a - b);
  const median = known.length ? known[Math.floor(known.length / 2)] : 0;
  const keyOf = p => (typeof form[p] === "number" ? form[p] : median);
  // Ties broken by id so the ladder is deterministic — the same input must
  // always give the same draw, or a reload reshuffles the night.
  const order = [...playerIds].sort((a, b) => (keyOf(b) - keyOf(a)) || String(a).localeCompare(String(b)));
  const out = {};
  order.forEach((p, i) => { out[p] = 1 + Math.floor(i / 4); });
  return out;
}

// ── pairing within a court ─────────────────────────────────────────────────
//
// Rank the four by running total and pair 1+4 against 2+3: the closest match
// the four of them can produce. There are exactly three ways to split four
// players, so when the closest one would repeat a partnership the next-closest
// split that does not is taken instead.
//
// This yields seven different partners in nine rounds (median; five at worst).
// Not nine — once a group settles on a court, three rounds exhausts the three
// splits. A "one up, one down, two stay" ladder was tested as a way to churn
// membership faster and is worse on both counts, so pairs travel together.
function upPairCourt(ids, totals = {}, seen = new Set()) {
  if (ids.length !== 4) throw new Error(`a court needs exactly 4 players, got ${ids.length}`);
  const t = p => totals[p] || 0;
  const on = [...ids].sort((a, b) => (t(b) - t(a)) || String(a).localeCompare(String(b)));
  const splits = [
    [[on[0], on[3]], [on[1], on[2]]],   // 1+4 v 2+3 — the closest match
    [[on[0], on[2]], [on[1], on[3]]],
    [[on[0], on[1]], [on[2], on[3]]],
  ];
  const fresh = splits.find(([A, B]) => !seen.has(upPairKey(...A)) && !seen.has(upPairKey(...B)));
  return fresh || splits[0];
}

// ── scoring ────────────────────────────────────────────────────────────────

function upRoundPoints(court, won, isFinalRound) {
  const base = won ? UP.WIN[court] : UP.LOSE[court];
  if (base == null) throw new Error(`no points defined for court ${court}`);
  return base * (isFinalRound ? UP.FINAL_MULT : 1);
}

function upMatchDone(m) {
  return m && Number.isFinite(m.score1) && Number.isFinite(m.score2) && m.score1 !== m.score2;
}

function upRoundDone(round) {
  return !!round && (round.courts || []).length > 0 && round.courts.every(upMatchDone);
}

// ── movement ───────────────────────────────────────────────────────────────
//
// The winning pair moves up a court, the losing pair moves down. Court 1
// winners stay on Court 1; Court 4 losers stay on Court 4. This balances
// exactly — each court sends two away and receives two — which `upValidate`
// checks on every round rather than trusting.
function upCourtsAfter(round, before) {
  const next = { ...before };
  (round.courts || []).forEach(m => {
    if (!upMatchDone(m)) return;
    const aWon = m.score1 > m.score2;
    const up = aWon ? m.team1 : m.team2;
    const down = aWon ? m.team2 : m.team1;
    up.forEach(p => { next[p] = Math.max(1, m.court - 1); });
    down.forEach(p => { next[p] = Math.min(UP.COURTS, m.court + 1); });
  });
  return next;
}

// Where everyone stands right now: the opening ladder, moved on by every round
// that has been fully played.
function upCurrentCourts(night) {
  let courts = { ...(night.ladder0 || {}) };
  (night.rounds || []).forEach(r => { if (upRoundDone(r)) courts = upCourtsAfter(r, courts); });
  return courts;
}

// Every partnership used so far, so the pairing rule can avoid repeats.
function upSeenPairs(night) {
  const seen = new Set();
  (night.rounds || []).forEach(r => (r.courts || []).forEach(m => {
    if (m.team1) seen.add(upPairKey(...m.team1));
    if (m.team2) seen.add(upPairKey(...m.team2));
  }));
  return seen;
}

// ── building the next round ────────────────────────────────────────────────

function upBuildRound(night) {
  const rounds = night.rounds || [];
  const last = rounds[rounds.length - 1];
  if (last && !upRoundDone(last)) throw new Error("the previous round is not finished");
  if (rounds.length >= UP.ROUNDS) throw new Error("the night is already nine rounds long");

  const courts = upCurrentCourts(night);
  const totals = upTotals(night);
  const seen = upSeenPairs(night);
  const out = { roundNum: rounds.length + 1, sitOuts: [], courts: [] };
  for (let c = 1; c <= UP.COURTS; c++) {
    const on = Object.keys(courts).filter(p => courts[p] === c);
    if (on.length !== 4) throw new Error(`court ${c} has ${on.length} players, not 4`);
    const [A, B] = upPairCourt(on, totals, seen);
    seen.add(upPairKey(...A)); seen.add(upPairKey(...B));
    out.courts.push({ court: c, team1: A, team2: B, score1: null, score2: null });
  }
  return out;
}

// ── standings ──────────────────────────────────────────────────────────────

function upPlayerIds(night) {
  return night.playerIds || (night.players || []).map(p => p.id);
}

function upTotals(night) {
  const total = {};
  upPlayerIds(night).forEach(id => { total[id] = 0; });
  (night.rounds || []).forEach(r => (r.courts || []).forEach(m => {
    if (!upMatchDone(m)) return;
    const isFinal = r.roundNum === UP.ROUNDS;
    const aWon = m.score1 > m.score2;
    m.team1.forEach(p => { total[p] = (total[p] || 0) + upRoundPoints(m.court, aWon, isFinal); });
    m.team2.forEach(p => { total[p] = (total[p] || 0) + upRoundPoints(m.court, !aWon, isFinal); });
  }));
  return total;
}

// The full table. `baseline` is a player's own running average from previous
// nights; a first-timer has none and is given the field average for tonight,
// which is deliberately generous — a newcomer being able to win THE CLIMB on
// their first night is the point of a format built to convert newcomers.
function upStandings(night, byId = {}, baselines = {}) {
  const total = upTotals(night);
  const courts = upCurrentCourts(night);
  const start = night.ladder0 || {};
  const match = {}, against = {}, wins = {}, played = {}, partners = {};
  upPlayerIds(night).forEach(id => {
    match[id] = 0; against[id] = 0; wins[id] = 0; played[id] = 0; partners[id] = new Set();
  });
  (night.rounds || []).forEach(r => (r.courts || []).forEach(m => {
    if (!upMatchDone(m)) return;
    const aWon = m.score1 > m.score2;
    m.team1.forEach(p => { match[p] += m.score1; against[p] += m.score2; played[p]++; if (aWon) wins[p]++; });
    m.team2.forEach(p => { match[p] += m.score2; against[p] += m.score1; played[p]++; if (!aWon) wins[p]++; });
    partners[m.team1[0]].add(m.team1[1]); partners[m.team1[1]].add(m.team1[0]);
    partners[m.team2[0]].add(m.team2[1]); partners[m.team2[1]].add(m.team2[0]);
  }));

  const scored = upPlayerIds(night).filter(id => played[id] > 0);
  const fieldAvg = scored.length
    ? scored.reduce((s, id) => s + total[id], 0) / scored.length : 0;

  const rows = upPlayerIds(night).map(id => {
    // A baseline can arrive on the player record or in the `baselines` map the
    // app builds from previous nights. Resolved into a local, never written
    // back onto the caller's objects — upStandings is called on every render.
    const p = (night.players || []).find(x => x.id === id) || {};
    const own = Number.isFinite(p.baseline) ? p.baseline
              : Number.isFinite(baselines[id]) ? baselines[id] : null;
    const base = own == null ? fieldAvg : own;
    return {
      id,
      name: p.name || (byId[id] || {}).name || "?",
      photoUrl: p.photoUrl || (byId[id] || {}).photoUrl || "",
      total: total[id] || 0,
      matchPts: match[id] || 0,
      // Real wins and a real game difference. The table showed "0 WON" beside
      // a player on 80 points because the engine never counted either, and the
      // app's row was rendering match points under a "+" as if they were a
      // difference.
      wins: wins[id] || 0,
      diff: (match[id] || 0) - (against[id] || 0),
      played: played[id] || 0,
      court: courts[id] || start[id] || UP.COURTS,
      startCourt: start[id] || UP.COURTS,
      partners: [...partners[id]],
      baseline: base,
      firstTimer: own == null,
      vsBaseline: (total[id] || 0) - base,
    };
  });
  // CHAMPION: most points, match points break the tie.
  rows.sort((x, y) => (y.total - x.total) || (y.matchPts - x.matchPts)
                      || String(x.name).localeCompare(String(y.name)));
  rows.forEach((r, i) => { r.rank = i + 1; });
  return rows;
}

// The two prizes. CHAMPION is scratch and is won on merit; THE CLIMB is the
// handicap and is open to anyone — measured at 21% of nights going to a top-3
// player, against 70% for scratch alone.
function upPrizes(night, byId = {}, baselines = {}) {
  const rows = upStandings(night, byId, baselines);
  const eligible = rows.filter(r => r.played > 0);
  if (!eligible.length) return { champion: null, climb: null };
  const champion = eligible[0];
  const climb = [...eligible].sort((a, b) => (b.vsBaseline - a.vsBaseline)
                                             || (b.total - a.total))[0];
  return { champion, climb };
}

// Each player's court after every round — the line that makes the share card.
function upClimbPath(night, playerId) {
  const path = [night.ladder0 ? night.ladder0[playerId] : UP.COURTS];
  let courts = { ...(night.ladder0 || {}) };
  (night.rounds || []).forEach(r => {
    if (!upRoundDone(r)) return;
    courts = upCourtsAfter(r, courts);
    path.push(courts[playerId]);
  });
  return path;
}

// ── the invariant ──────────────────────────────────────────────────────────
//
// Four to a court, always. If this ever fails the night is unplayable, so it is
// checked rather than assumed — the simulation that designed this format had a
// bug that moved players between courts while still iterating over courts, and
// it silently skipped rounds instead of crashing.
function upValidate(night) {
  const bad = [];
  const ids = upPlayerIds(night);
  if (new Set(ids).size !== ids.length) bad.push("a player appears twice");
  if (ids.length && ids.length % 4 !== 0) bad.push(`${ids.length} players is not a multiple of 4`);

  const sizes0 = upCourtSizes(night.ladder0 || {});
  Object.entries(sizes0).forEach(([c, n]) => {
    if (n !== 4) bad.push(`opening ladder: court ${c} has ${n}`);
  });

  let courts = { ...(night.ladder0 || {}) };
  (night.rounds || []).forEach(r => {
    const onCourt = {};
    (r.courts || []).forEach(m => {
      [...(m.team1 || []), ...(m.team2 || [])].forEach(p => {
        if (onCourt[p]) bad.push(`round ${r.roundNum}: ${p} is on two courts`);
        onCourt[p] = m.court;
      });
      if (new Set([...(m.team1 || []), ...(m.team2 || [])]).size !== 4)
        bad.push(`round ${r.roundNum} court ${m.court}: not four distinct players`);
      // NOT `upMatchDone(m) && m.score1 === m.score2` — upMatchDone already requires the
      // scores to differ, so that condition can never be true and the check was
      // dead code. A draw is exactly the case where a match has two scores and
      // no winner, which is what has to be caught.
      if (Number.isFinite(m.score1) && Number.isFinite(m.score2) && m.score1 === m.score2)
        bad.push(`round ${r.roundNum} court ${m.court}: drawn match`);
    });
    if (upRoundDone(r)) {
      courts = upCourtsAfter(r, courts);
      Object.entries(upCourtSizes(courts)).forEach(([c, n]) => {
        if (n !== 4) bad.push(`after round ${r.no}: court ${c} has ${n}`);
      });
    }
  });
  return bad;
}
// ══ END UPRISING ENGINE ════════════════════════════════════════════════════════

function circlePairRounds(n) {
  const arr = Array.from({ length: n }, (_, i) => i);
  if (n % 2 === 1) arr.push(-1);
  const total = arr.length, cycles = total - 1;
  let cur = arr.slice();
  const rounds = [];
  for (let r = 0; r < cycles; r++) {
    const pairs = [];
    for (let i = 0; i < total / 2; i++) pairs.push([cur[i], cur[total - 1 - i]]);
    rounds.push(pairs);
    const fixed = cur[0], rest = cur.slice(1);
    rest.unshift(rest.pop());
    cur = [fixed, ...rest];
  }
  return rounds;
}
const maxCourtsFor = pc => Math.max(1, Math.floor(Math.floor(pc / 2) / 2));

// Capping courts never changes WHO partners WHOM — the circle method decides
// that alone. It only decides which pairs get a court; a benched pair's
// partnership is skipped, never repeated. `sitOutCounts` carries sit-out
// history so rest spreads evenly. `cycleShift` rotates the starting point in
// the cycle (used when the player set changes mid-session).
function generateSchedule(playerIds, numRounds, maxCourts, opts) {
  const n = playerIds.length;
  if (n < 4) return [];
  const startRound = (opts && opts.startRound) || 0;
  const cycleShift = (opts && opts.cycleShift) || 0;
  const sitOutCounts = Object.assign({}, (opts && opts.sitOutCounts) || {});
  const courtCap = Math.max(1, Number(maxCourts) || maxCourtsFor(n));
  const cyclePairs = circlePairRounds(n), cycles = cyclePairs.length;
  const rounds = [];
  for (let r = startRound; r < numRounds; r++) {
    const pairsIdx = cyclePairs[(r + cycleShift) % cycles];
    const realPairs = [], byePlayers = [];
    pairsIdx.forEach(([a, b]) => {
      if (a === -1 && b !== -1) byePlayers.push(playerIds[b]);
      else if (b === -1 && a !== -1) byePlayers.push(playerIds[a]);
      else if (a !== -1 && b !== -1) realPairs.push([playerIds[a], playerIds[b]]);
    });
    const offset = r % Math.max(1, realPairs.length);
    let playing = realPairs.slice(offset).concat(realPairs.slice(0, offset));
    const capacity = courtCap * 2;
    if (playing.length > capacity) {
      const ranked = playing.map((pair, i) => ({ i, load: (sitOutCounts[pair[0]] || 0) + (sitOutCounts[pair[1]] || 0) }));
      ranked.sort((x, y) => x.load - y.load || x.i - y.i);
      const benched = new Set(ranked.slice(0, playing.length - capacity).map(x => x.i));
      playing.forEach((pair, i) => { if (benched.has(i)) byePlayers.push(pair[0], pair[1]); });
      playing = playing.filter((_, i) => !benched.has(i));
    }
    if (playing.length % 2 === 1) {
      const last = playing[playing.length - 1];
      byePlayers.push(last[0], last[1]);
      playing = playing.slice(0, -1);
    }
    const courts = [];
    for (let i = 0; i + 1 < playing.length; i += 2) {
      courts.push({ court: courts.length + 1, team1: playing[i], team2: playing[i + 1], score1: null, score2: null });
    }
    byePlayers.forEach(id => { sitOutCounts[id] = (sitOutCounts[id] || 0) + 1; });
    rounds.push({ roundNum: r + 1, sitOuts: byePlayers, courts });
  }
  return rounds;
}

function firstUnplayedIndex(t) {
  const cut = t.rounds.findIndex(r => r.courts.every(m => m.score1 == null && m.score2 == null));
  return cut === -1 ? t.rounds.length : cut;
}
const pairKey = (a, b) => [a, b].sort().join("|");
function playedPairs(rounds) {
  const used = new Set();
  rounds.forEach(r => r.courts.forEach(m => { used.add(pairKey(m.team1[0], m.team1[1])); used.add(pairKey(m.team2[0], m.team2[1])); }));
  return used;
}

// Rebuild the not-yet-scored rounds — for a new court count, a new player set,
// or both. Rounds with any score entered are kept exactly as played.
//
// Changing the COURT count keeps the same circle cycle, so the partner
// rotation simply carries on and no pairing repeats. Changing the PLAYER set
// (a late arrival) necessarily builds a *different* cycle, which could replay
// a partnership already used. To limit that we try every starting offset in
// the new cycle and keep whichever produces the fewest repeats.
function rebuildTail(t, newCourts, newPlayerIds) {
  const cut = firstUnplayedIndex(t);
  const kept = t.rounds.slice(0, cut);
  const sitOutCounts = {};
  kept.forEach(r => (r.sitOuts || []).forEach(id => { sitOutCounts[id] = (sitOutCounts[id] || 0) + 1; }));
  const ids = newPlayerIds || t.playerIds;
  const courts = Math.max(1, Math.min(Number(newCourts) || t.courtCount, maxCourtsFor(ids.length)));
  const build = shift => generateSchedule(ids, t.rounds.length, courts, { startRound: cut, sitOutCounts, cycleShift: shift });

  let rebuilt;
  const sameRoster = !newPlayerIds || (newPlayerIds.length === t.playerIds.length
    && newPlayerIds.every(id => t.playerIds.includes(id)));
  if (sameRoster) {
    rebuilt = build(0);
  } else {
    const used = playedPairs(kept);
    const cycles = Math.max(1, (ids.length % 2 === 0 ? ids.length - 1 : ids.length));
    let best = null;
    for (let s = 0; s < cycles; s++) {
      const cand = build(s);
      let clashes = 0;
      cand.forEach(r => r.courts.forEach(m => {
        if (used.has(pairKey(m.team1[0], m.team1[1]))) clashes++;
        if (used.has(pairKey(m.team2[0], m.team2[1]))) clashes++;
      }));
      if (!best || clashes < best.clashes) best = { rounds: cand, clashes };
      if (clashes === 0) break;
    }
    rebuilt = best.rounds;
  }
  return Object.assign({}, t, { courtCount: courts, playerIds: ids, rounds: [...kept, ...rebuilt] });
}

// How many matches the SCHEDULE gives each player over the whole session —
// counted from the fixture list, not from what's been scored yet, so the
// ranking metric stays stable from round 1 instead of flipping mid-session.
function scheduledMatchCounts(t) {
  const counts = {};
  (t.playerIds || []).forEach(id => { counts[id] = 0; });
  (t.rounds || []).forEach(r => (r.courts || []).forEach(m => {
    [...m.team1, ...m.team2].forEach(id => { if (counts[id] != null) counts[id]++; });
  }));
  return counts;
}

// True when every player is scheduled the same number of matches. Only then are
// raw point totals comparable: a player given an extra match is ~half a match
// total ahead on average before anyone hits a ball. When the schedule can't be
// even (rest slots not divisible by the player count), rank on points per match
// instead — measured over 20k equal-skill trials, totals hand the title to the
// most-played group far beyond its fair share (63.7% vs 16.7% at 24 players on
// 4 courts over 6 rounds, where the least-played group never won at all), while
// the per-match average brings every group back to roughly its fair share.
function isEvenSchedule(t) {
  // UPRISING is always even — nobody ever sits out — and its table is ranked on
  // court-weighted points, so the points-per-match fallback must never kick in.
  if (t && t.format === "uprising") return true;
  const v = Object.values(scheduledMatchCounts(t));
  return v.length === 0 || Math.max(...v) === Math.min(...v);
}

function calcStandings(t, byId) {
  // UPRISING scores by the court you were on, not by the points you scored, so
  // it has its own table — see uprising-engine.js. Shaped the same way as the
  // Americano one so every screen below renders both without knowing which.
  if (t && t.format === "uprising") {
    return upStandings(t, byId, t.baselines || {}).map(r => ({
      id: r.id, name: r.name, photoUrl: r.photoUrl,
      points: r.total, played: r.played, wins: r.wins, diff: r.diff,
      avg: r.played ? r.total / r.played : 0, byAvg: false,
      court: r.court, startCourt: r.startCourt, vsBaseline: r.vsBaseline,
      firstTimer: r.firstTimer, partners: r.partners, matchPts: r.matchPts,
    }));
  }
  const stats = {};
  (t.playerIds || []).forEach(id => {
    stats[id] = { id, name: (byId[id] && byId[id].name) || "?", photoUrl: byId[id] && byId[id].photoUrl, points: 0, played: 0, wins: 0, diff: 0, avg: 0 };
  });
  (t.rounds || []).forEach(round => (round.courts || []).forEach(m => {
    if (m.score1 == null || m.score2 == null) return;
    const s1 = Number(m.score1), s2 = Number(m.score2);
    m.team1.forEach(id => { const s = stats[id]; if (!s) return; s.points += s1; s.played++; s.diff += s1 - s2; if (s1 > s2) s.wins++; });
    m.team2.forEach(id => { const s = stats[id]; if (!s) return; s.points += s2; s.played++; s.diff += s2 - s1; if (s2 > s1) s.wins++; });
  }));
  const rows = Object.values(stats);
  rows.forEach(s => { s.avg = s.played ? s.points / s.played : 0; });
  const even = isEvenSchedule(t);
  rows.forEach(s => { s.byAvg = !even; });
  return even
    ? rows.sort((a, b) => b.points - a.points || b.diff - a.diff || b.wins - a.wins)
    : rows.sort((a, b) => b.avg - a.avg || b.points - a.points || b.diff - a.diff || b.wins - a.wins);
}

// Round counts that give every player exactly the same number of matches, for
// this player count on this many courts. Rest slots per round = n - 4c; rest
// shares out evenly only when R*(n-4c) is a multiple of n.
function fairRoundCounts(n, courts, limit) {
  const restPer = n - courts * 4;
  if (restPer <= 0) return null;            // nobody rests — every R is even
  const out = [];
  for (let R = 1; R <= (limit || 20) && out.length < 4; R++) if ((R * restPer) % n === 0) out.push(R);
  return out;
}

// ── atoms ───────────────────────────────────────────────────────
function Eyebrow({ children }) { return <div className="eyebrow"><i /> {children}</div>; }
function Ava({ p, on, lg }) {
  return (
    <span className={"ava" + (on ? " on" : "") + (lg ? " lg" : "")}>
      {p && p.photoUrl ? <img src={p.photoUrl} alt="" /> : initials(p && p.name)}
    </span>
  );
}
function Sheet({ title, onClose, children }) {
  return (
    <div className="scrim" onClick={onClose}>
      <div className="sheet" onClick={e => e.stopPropagation()}>
        <div className="sheethead">
          <span className="sect">{title}</span>
          <button className="btn small" onClick={onClose}>Close</button>
        </div>
        {children}
      </div>
    </div>
  );
}

// ── setup ───────────────────────────────────────────────────────
function Setup({ people, canEdit, cfg, setCfg, sel, setSel, onStart }) {
  const selCount = Object.values(sel).filter(Boolean).length;
  const suggested = selCount >= 4 ? (selCount % 2 === 0 ? selCount - 1 : selCount) : 0;
  const needed = selCount >= 4 ? maxCourtsFor(selCount) : 0;
  const useCourts = Math.max(1, Math.min(Number(cfg.courts) || 1, needed || 1));
  const benched = selCount >= 4 ? Math.max(0, selCount - useCourts * 4) : 0;
  // 286 people are synced from August Attack and the whole list used to render
  // alphabetically with no way to search it. Checking in sixteen meant hunting
  // down a 286-row grid, twice, while people waited on court. Two changes fix
  // it: a filter, and everyone already checked in pinned to the top so the
  // scorer can see who they have without scrolling back up.
  const [q, setQ] = useState("");
  const roster = useMemo(() => {
    const needle = q.trim().toLowerCase();
    return people.slice()
      .filter(p => !needle || p.name.toLowerCase().includes(needle))
      .sort((a, b) => {
        const sa = sel[a.id] ? 0 : 1, sb = sel[b.id] ? 0 : 1;
        return sa !== sb ? sa - sb : a.name.localeCompare(b.name);
      });
  }, [people, q, sel]);

  const hint = selCount < 4
    ? "Check in at least 4 players to start."
    : `Full partner rotation for ${selCount} players covers ${suggested} rounds. ` + (benched > 0
      ? `On ${plural(useCourts, "court")}, ${restPhrase(benched)} each round, rotated evenly.`
      : `${plural(needed, "court")} runs every match at once — nobody rests.`);

  // Warn when this combination can't give everyone the same number of matches:
  // in Americano the winner is whoever piles up the most points, so an extra
  // match is a real head start. Suggest round counts where rest shares evenly.
  const fairRounds = selCount >= 4 ? fairRoundCounts(selCount, useCourts) : null;
  const roundsNow = Number(cfg.rounds) || 0;
  const unevenWarning = (benched > 0 && fairRounds && !fairRounds.includes(roundsNow))
    ? (fairRounds.length
        ? `Heads up: on ${plural(useCourts, "court")}, ${roundsNow} rounds won't give everyone the same number of matches. ${fairRounds.join(" or ")} rounds would. Otherwise the standings switch to points per match so nobody wins on extra court time.`
        : `Heads up: on ${plural(useCourts, "court")} no round count splits evenly across ${selCount} players, so the standings will rank on points per match.`)
    : null;

  return (
    <div className="screen">
      <div>
        <Eyebrow>New Session</Eyebrow>
        <div className="display">
          {cfg.format === "uprising" ? <Fragment>The <em>Uprising</em></Fragment>
                                     : <Fragment>Classic <em>Americano</em></Fragment>}
        </div>
        <p className="lede">
          {cfg.format === "uprising"
            ? <Fragment>
                Four courts, nine rounds, nobody sits out. Win and you move <b>up</b> a court; lose and you
                go down. Points are worth more the higher you climb, and the last round is worth double.
              </Fragment>
            : <Fragment>
                Partners rotate every round — no fixed teams. Every point your pair wins adds to <b>your own</b> total,
                and individual totals decide the final ranking.
              </Fragment>}
        </p>
      </div>

      {!canEdit ? (
        <div className="hair" style={{ fontSize: 15, color: "var(--muted)" }}>
          Log in as scorer or admin to set up a session.
        </div>
      ) : (
        <Fragment>
          <div className="hair" style={{ display: "flex", gap: 10, marginBottom: 18 }}>
            {[["americano", "AMERICANO"], ["uprising", "UPRISING"]].map(([k, lab]) => (
              <button key={k} type="button" onClick={() => setCfg(c => ({ ...c, format: k }))}
                style={{ flex: 1, padding: "14px 8px", cursor: "pointer", borderRadius: 0,
                  background: cfg.format === k ? "var(--volt)" : "transparent",
                  /* Cream on a volt fill measures 1.2:1 — the selected format
                     was very nearly invisible. Volt is a BRIGHT accent, so
                     anything sitting on it has to be near-black (14.4:1). */
                  color: cfg.format === k ? "var(--ink)" : "var(--muted)",
                  boxShadow: cfg.format === k ? "var(--glow)" : "none",
                  border: "1px solid " + (cfg.format === k ? "var(--volt)" : "var(--line)"),
                  fontWeight: 900, letterSpacing: ".14em", fontSize: 12 }}>{lab}</button>
            ))}
          </div>
          {cfg.format === "uprising" && (
            <div className="hair" style={{ fontSize: 14, color: "var(--muted)", marginBottom: 18 }}>
              {selCount % 4 === 0 && selCount >= 8
                ? <Fragment><b style={{ color: "var(--cream)" }}>{selCount} players on {selCount / 4} courts.</b>{" "}
                    Nine rounds, everybody plays every round. The opening ladder is seeded by form, not drawn —
                    a random draw is worth a five-fold swing in who wins.</Fragment>
                : <Fragment>UPRISING needs a <b>multiple of four</b> players so nobody sits out.
                    {" "}{selCount} checked in — {selCount < 8 ? "check in at least 8." : `add ${4 - (selCount % 4)} or drop ${selCount % 4}.`}</Fragment>}
            </div>
          )}
          <div className="hair" style={{ display: "flex", flexDirection: "column", gap: 18 }}>
            <input className="field big" placeholder="Session name" value={cfg.name}
              onChange={e => setCfg(c => ({ ...c, name: e.target.value }))} />
            <div className="grid3" style={{ display: cfg.format === "uprising" ? "none" : undefined }}>
              {[["Points", "points"], ["Rounds", "rounds"], ["Courts", "courts"]].map(([lab, key]) => (
                <label className="stack" key={key}>
                  <span className="label">{lab}</span>
                  <input className="field num" type="number" min="1" value={cfg[key]}
                    onChange={e => setCfg(c => ({ ...c, [key]: e.target.value }))} />
                </label>
              ))}
            </div>
            {/* Both of these are about the classic rotation, and both read off
                cfg.courts / cfg.rounds — the two fields UPRISING hides and
                ignores. Left ungated they told an UPRISING organiser that
                "8 players rest each round" and that 7 rounds would be unfair,
                neither of which is true of a format where nobody sits out and
                the round count is fixed at nine. */}
            {cfg.format !== "uprising" && <div className="note">{hint}</div>}
            {cfg.format !== "uprising" && unevenWarning && (
              <div className="note" style={{ color: "var(--gold)" }}>{unevenWarning}</div>
            )}
          </div>

          <div className="hair">
            <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", gap: 14, marginBottom: 14 }}>
              <span className="sect">Check In</span>
              <span className="label">{selCount} checked in</span>
            </div>
            <div className="srch" style={{ marginBottom: 12 }}>
              <span className="ico">⌕</span>
              <input value={q} onChange={e => setQ(e.target.value)}
                placeholder={`Search ${people.length} players…`} />
              {q && <button className="btn ghost" style={{ padding: "5px 10px" }} onClick={() => setQ("")}>Clear</button>}
            </div>
            <div className="note" style={{ marginBottom: 12, display: "flex", justifyContent: "space-between", gap: 10 }}>
              <span>Tap everyone who showed up. Checked-in players stay at the top.</span>
              {selCount > 0 && (
                <button className="btn ghost" style={{ flex: "0 0 auto", padding: "5px 10px" }}
                  onClick={() => setSel({})}>Clear all</button>
              )}
            </div>
            {roster.length === 0 && <div className="note">No player matches “{q}”.</div>}
            <div className="chipgrid">
              {roster.map(p => (
                <button key={p.id} className={"chip" + (sel[p.id] ? " on" : "")}
                  onClick={() => setSel(s => ({ ...s, [p.id]: !s[p.id] }))}>
                  <Ava p={p} on={!!sel[p.id]} />
                  <span className="truncate">{p.name}</span>
                </button>
              ))}
            </div>
          </div>

          {/* UPRISING needs a multiple of four so nobody sits out. Disabling the
              button says so before the tap; the alert that used to catch it
              fired after the scorer thought they had started the night. */}
          {(() => {
            const upOk = selCount >= 8 && selCount % 4 === 0;
            const bad = cfg.format === "uprising" ? !upOk : selCount < 4;
            const label = cfg.format === "uprising"
              ? (selCount < 8 ? "Check in 8+ players"
                 : selCount % 4 ? `Check in ${4 - (selCount % 4)} more` 
                 : `Start Uprising · ${selCount} players`)
              : (selCount < 4 ? "Check in 4+ players" : `Start session · ${selCount} players`);
            return <button className="btn" disabled={bad} onClick={onStart}>{label}</button>;
          })()}
        </Fragment>
      )}
    </div>
  );
}

// ── live board ──────────────────────────────────────────────────
function Board({ t, byId, canEdit, roundIdx, setRoundIdx, drafts, setDrafts, editing, setEditing,
                 onCommit, onFinish, onOpenCourts, onOpenJoin, onAbandon }) {
  const isUp = t.format === "uprising";
  const ri = Math.min(roundIdx, t.rounds.length - 1);
  const round = t.rounds[ri];
  // Where everyone stands going INTO the round being looked at, not where they
  // stand now — scrolling back to round 3 should show round 3's ladder.
  const ladder = isUp
    ? upCurrentCourts({ ...t, rounds: t.rounds.slice(0, ri) })
    : {};
  const pts = t.pointsPerMatch || 32;
  const scored = round.courts.filter(m => m.score1 != null).length;
  const sitOutNames = (round.sitOuts || []).map(id => (byId[id] && byId[id].name) || "?").join(", ");
  const canFinish = canEdit
    && t.rounds.every(r => r.courts.every(m => m.score1 != null && m.score2 != null))
    && (!isUp || t.rounds.length === UP.ROUNDS);
  const nameOf = id => (byId[id] && byId[id].name) || "?";

  return (
    <div className="screen">
      <div>
        <Eyebrow>Live</Eyebrow>
        <div className="display">Round <em>{round.roundNum}</em></div>
        <div className="note" style={{ marginTop: 12 }}>
          of {isUp ? UP.ROUNDS : t.rounds.length} · {scored}/{round.courts.length} courts scored
          {isUp && round.roundNum === UP.ROUNDS && <b style={{ color: "var(--warn)" }}> · DOUBLE POINTS</b>}
        </div>
        {isUp && (
          <div style={{ marginTop: 16, display: "flex", flexDirection: "column", gap: 6 }}>
            {[1, 2, 3, 4].slice(0, t.courtCount || 4).map(c => {
              const on = Object.keys(ladder).filter(p => ladder[p] === c);
              return (
                <div key={c} className={"rung" + (c === 1 ? " top" : "")}>
                  <span className="cn">COURT {c}</span>
                  <span className="who">{on.map(nameOf).join("  ·  ")}</span>
                </div>
              );
            })}
            <div className="note" style={{ marginTop: 2 }}>
              Win and you go up a court. Lose and you go down.
            </div>
          </div>
        )}
      </div>

      <div className="rchips">
        {t.rounds.map((r, i) => {
          const done = r.courts.every(m => m.score1 != null);
          return (
            <button key={i} className={"rchip" + (i === ri ? " on" : done ? " done" : "")}
              onClick={() => setRoundIdx(i)}>R{r.roundNum}</button>
          );
        })}
      </div>

      {/* Change courts and Late arrival both rebuild the remaining rounds with
          rebuildTail(), which calls generateSchedule() — the CLASSIC Americano
          circle method. On an UPRISING night that would overwrite the ladder
          with an Americano schedule and silently end the format mid-session.
          UPRISING's court count is not a setting either: it is players ÷ 4. So
          the controls are Americano's, and UPRISING states the fact instead. */}
      {canEdit && !isUp && (
        <div className="hair" style={{ display: "flex", flexWrap: "wrap", gap: 10, alignItems: "center", justifyContent: "space-between" }}>
          <div>
            <div className="label">Courts in use</div>
            <div className="sect" style={{ marginTop: 6 }}>{plural(t.courtCount, "court")}</div>
          </div>
          <div style={{ display: "flex", gap: 8 }}>
            <button className="btn small" onClick={onOpenCourts}>Change courts</button>
            <button className="btn small" onClick={onOpenJoin}>Late arrival</button>
          </div>
        </div>
      )}
      {canEdit && isUp && (
        <div className="hair">
          <div className="label">Courts in use</div>
          <div className="sect" style={{ marginTop: 6 }}>{plural(t.courtCount, "court")}</div>
          <div className="note" style={{ marginTop: 10 }}>
            Fixed for the night — {t.playerIds.length} players, four to a court. A late arrival
            would leave someone sitting out, which UPRISING does not do.
          </div>
        </div>
      )}

      {sitOutNames && (
        <div className="hair">
          <div className="label">Resting</div>
          <div className="note" style={{ marginTop: 8, color: "var(--muted)" }}>{sitOutNames}</div>
        </div>
      )}

      <div className="courtgrid">
        {round.courts.map((m, mi) => {
          const key = ri + "-" + mi;
          const done = m.score1 != null && m.score2 != null;
          const isEditing = !!editing[key];
          const show = canEdit && (!done || isEditing);
          // Classic Americano shares a fixed pot of points between the two
          // pairs, so one slider says everything: 20 here is 12 there.
          const slide = drafts[key] != null ? drafts[key] : (done ? Number(m.score1) : Math.round(pts / 2));
          const presets = [pts, Math.round(pts * 0.75), Math.round(pts * 0.625), Math.round(pts / 2)];

          // UPRISING does NOT work that way: a match is first to 16, so the
          // winner has 16 and the loser has 0-15 and the two do not sum to
          // anything fixed. Driven by the zero-sum slider, a real 16-11 could
          // not be entered at all, and the slider's own midpoint preset gave
          // 8-8 — which upMatchDone rejects as unfinished, so the round never
          // completed, the next round was never built, and the night stalled
          // with nothing on screen to say why. So UPRISING gets its own entry:
          // tap the side that won, then tap what the other side got.
          const upd = drafts["up-" + key] || (done
            ? { w: m.score1 > m.score2 ? 1 : 2, l: Math.min(Number(m.score1), Number(m.score2)) }
            : { w: 0, l: null });
          const upReady = upd.w > 0 && upd.l != null;
          const upS = side => upd.w === 0 ? "–" : upd.w === side ? pts : (upd.l == null ? "?" : upd.l);
          const setUp = patch => setDrafts(d => ({ ...d, ["up-" + key]: { ...upd, ...patch } }));

          const s1 = done && !isEditing ? m.score1 : !show ? "–" : isUp ? upS(1) : slide;
          const s2 = done && !isEditing ? m.score2 : !show ? "–" : isUp ? upS(2) : pts - slide;
          return (
            <div key={key} className={"court" + (done && !isEditing ? " final" : show ? " live" : "")}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
                <span className="label">Court {m.court}</span>
                <span className="label" style={{ color: done ? "var(--blue-soft)" : show ? "var(--orange-br)" : "var(--muted2)" }}>
                  {done ? "Final" : show ? "Scoring" : "Awaiting"}
                </span>
              </div>

              <div style={{ display: "grid", gridTemplateColumns: "1fr auto 1fr", gap: 10, alignItems: "center" }}>
                <div className="teamside">
                  {m.team1.map(id => (
                    <span key={id} style={{ display: "flex", alignItems: "center", gap: 8, minWidth: 0 }}>
                      <Ava p={byId[id]} /><span className="truncate" style={{ fontWeight: 700, fontSize: 14 }}>{nameOf(id)}</span>
                    </span>
                  ))}
                </div>
                <div style={{ textAlign: "center" }}>
                  <div className="score" style={{ color: "var(--cream)" }}>
                    {s1}<span style={{ color: "var(--muted2)", fontSize: 20 }}> · </span>{s2}
                  </div>
                </div>
                <div className="teamside" style={{ alignItems: "flex-end" }}>
                  {m.team2.map(id => (
                    <span key={id} style={{ display: "flex", alignItems: "center", gap: 8, minWidth: 0, flexDirection: "row-reverse" }}>
                      <Ava p={byId[id]} /><span className="truncate" style={{ fontWeight: 700, fontSize: 14 }}>{nameOf(id)}</span>
                    </span>
                  ))}
                </div>
              </div>

              {show && isUp && (
                <div style={{ marginTop: 14 }}>
                  <div className="label">Who won the court</div>
                  <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
                    {[1, 2].map(side => (
                      <button key={side} className={"wbtn" + (upd.w === side ? " on" : "")}
                        onClick={() => setUp({ w: side })}>
                        {(side === 1 ? m.team1 : m.team2).map(id => nameOf(id).split(" ")[0]).join(" + ")}
                      </button>
                    ))}
                  </div>
                  {upd.w > 0 && (
                    <div style={{ marginTop: 14 }}>
                      <div className="label">
                        And {(upd.w === 1 ? m.team2 : m.team1).map(id => nameOf(id).split(" ")[0]).join(" + ")} got
                      </div>
                      <div className="pad">
                        {Array.from({ length: pts }, (_, v) => v).map(v => (
                          <button key={v} className={"pbtn" + (upd.l === v ? " on" : "")}
                            onClick={() => setUp({ l: v })}>{v}</button>
                        ))}
                      </div>
                    </div>
                  )}
                  <button className="btn" style={{ width: "100%", marginTop: 16 }} disabled={!upReady}
                    onClick={() => onCommit(ri, mi, upS(1), upS(2), key)}>
                    {!upd.w ? "Pick the winning pair"
                      : upd.l == null ? "Pick their score"
                      : (done ? "Update" : "Confirm") + ` ${upS(1)}–${upS(2)}`}
                  </button>
                </div>
              )}

              {show && !isUp && (
                <div style={{ marginTop: 14 }}>
                  <div className="track"><i style={{ width: Math.round((slide / pts) * 100) + "%" }} /></div>
                  <input type="range" min="0" max={pts} value={slide}
                    onChange={e => setDrafts(d => ({ ...d, [key]: Number(e.target.value) }))} />
                  <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginTop: 10 }}>
                    {presets.map(v => (
                      <button key={v} className="btn small" onClick={() => setDrafts(d => ({ ...d, [key]: v }))}>
                        {v}-{pts - v}
                      </button>
                    ))}
                    <button className="btn" style={{ marginLeft: "auto", padding: "10px 18px" }}
                      onClick={() => onCommit(ri, mi, slide, pts - slide, key)}>
                      {done ? "Update score" : "Confirm score"}
                    </button>
                  </div>
                </div>
              )}
              {done && canEdit && !isEditing && (
                <div style={{ marginTop: 12, textAlign: "right" }}>
                  <button className="btn small" onClick={() => setEditing(e => ({ ...e, [key]: true }))}>Edit score</button>
                </div>
              )}
            </div>
          );
        })}
      </div>

      {canFinish && <button className="btn" onClick={onFinish}>Finish session 🏆</button>}

      {/* A session with unscored matches can never be finished, so without this
          an abandoned night stays `active` forever and the app opens into it
          instead of Setup — there is no other way back. An August session with
          seven unscored rounds was still on the board in October. */}
      {canEdit && !canFinish && (
        <button className="btn ghost" style={{ borderColor: "rgba(var(--warn-rgb),.45)", color: "var(--warn)" }}
          onClick={onAbandon}>Abandon session</button>
      )}
    </div>
  );
}

// ── standings ───────────────────────────────────────────────────
function Standings({ t, byId, onPodium }) {
  if (!t) return (
    <div className="screen">
      <div><Eyebrow>Standings</Eyebrow><div className="display">No <em>session</em></div>
        <p className="lede">Start a session and scores will show up here.</p></div>
    </div>
  );
  const table = calcStandings(t, byId);
  const byAvg = !isEvenSchedule(t);
  const counts = Object.values(scheduledMatchCounts(t));
  return (
    <div className="screen">
      <div>
        <Eyebrow>{t.name}</Eyebrow>
        <div className="display">The <em>Standings</em></div>
      </div>
      {byAvg && (
        <div className="hair note">
          This line-up can't give everyone the same number of matches — the schedule hands some players
          {" "}{Math.min(...counts)}–{Math.max(...counts)} matches. Ranking on <b style={{ color: "var(--cream)" }}>points per match</b> so
          extra court time doesn't decide the winner. Totals are shown underneath.
        </div>
      )}
      {table.length > 0 && (
        <div><button className="btn gold" onClick={onPodium}>Podium 👑</button></div>
      )}
      <div className="hair" style={{ display: "flex", flexDirection: "column" }}>
        {table.map((s, i) => (
          <div className="row" key={s.id} style={i === 0 ? { background: "rgba(var(--volt-rgb),.07)", borderLeft: "2px solid var(--volt)", paddingLeft: 10 } : null}>
            <span className="score" style={{ fontSize: 22, width: 34, textAlign: "center", color: i === 0 ? "var(--volt)" : "var(--muted2)" }}>{i + 1}</span>
            <Ava p={s} on={i === 0} />
            <span style={{ flex: 1, minWidth: 0 }}>
              <span className="truncate" style={{ display: "block", fontWeight: 800 }}>{s.name}</span>
              <span className="label" style={{ letterSpacing: ".12em" }}>{s.played} played · {s.wins} won</span>
            </span>
            <span style={{ textAlign: "right" }}>
              <span className="score" style={{ fontSize: 26, display: "block",
                color: i === 0 ? "var(--volt)" : "var(--cream)" }}>
                {byAvg ? (s.played ? s.avg.toFixed(1) : "–") : s.points}
              </span>
              <span className="label" style={{ letterSpacing: ".12em" }}>
                {byAvg ? `${s.points} pts` : `${s.diff > 0 ? "+" : ""}${s.diff}`}
              </span>
            </span>
          </div>
        ))}
      </div>
    </div>
  );
}

// ── players ─────────────────────────────────────────────────────
function Players({ people, tournaments, query, setQuery, onOpenStats }) {
  const q = query.toLowerCase();
  const cards = people.filter(p => p.name.toLowerCase().includes(q))
    .sort((a, b) => a.name.localeCompare(b.name))
    .map(p => {
      let played = 0, pointsTotal = 0;
      tournaments.forEach(tt => (tt.rounds || []).forEach(r => (r.courts || []).forEach(m => {
        if (m.score1 == null) return;
        if (m.team1.includes(p.id)) { played++; pointsTotal += Number(m.score1); }
        else if (m.team2.includes(p.id)) { played++; pointsTotal += Number(m.score2); }
      })));
      return { ...p, sub: played ? `${played} matches · ${pointsTotal} pts` : "No matches yet" };
    });
  return (
    <div className="screen">
      <div>
        <Eyebrow>{plural(people.length, "player")}</Eyebrow>
        <div className="display">The <em>Roster</em></div>
      </div>
      <input className="field" placeholder="Search players…" value={query} onChange={e => setQuery(e.target.value)} />
      <div className="hair" style={{ display: "flex", flexDirection: "column" }}>
        {cards.map(p => (
          <button key={p.id} className="row" onClick={() => onOpenStats(p.id)}
            style={{ background: "transparent", border: 0, borderBottom: "1px solid var(--line2)", cursor: "pointer", color: "inherit", textAlign: "left", width: "100%" }}>
            <Ava p={p} />
            <span style={{ flex: 1, minWidth: 0 }}>
              <span className="truncate" style={{ display: "block", fontWeight: 700 }}>{p.name}</span>
              <span className="label" style={{ letterSpacing: ".12em" }}>{p.sub}</span>
            </span>
            {p.guest && <span className="label" style={{ color: "var(--blue-soft)" }}>Guest</span>}
          </button>
        ))}
      </div>
    </div>
  );
}

// ── admin (guests only) ─────────────────────────────────────────
function Admin({ guests, newName, setNewName, onAdd, onRename, onDelete }) {
  return (
    <div className="screen">
      <div>
        <Eyebrow>Admin</Eyebrow>
        <div className="display">Manage <em>Guests</em></div>
        <p className="lede">
          The main roster is synced from <b>August Attack</b> and is read-only here — add or edit those players there.
          Guests below are local to Americano, for one-off drop-ins.
        </p>
      </div>
      <div className="hair" style={{ display: "flex", gap: 10, alignItems: "flex-end" }}>
        <input className="field" placeholder="Add a guest player…" value={newName}
          onChange={e => setNewName(e.target.value)}
          onKeyDown={e => e.key === "Enter" && onAdd()} />
        <button className="btn" onClick={onAdd}>Add</button>
      </div>
      <div style={{ display: "flex", flexDirection: "column" }}>
        {guests.length === 0 && <div className="note">No guest players yet.</div>}
        {guests.map(p => (
          <div className="row" key={p.id}>
            <Ava p={p} />
            <input className="field" style={{ borderBottom: 0, fontWeight: 700 }} value={p.name}
              onChange={e => onRename(p.id, e.target.value)} />
            <button className="btn small" style={{ borderColor: "rgba(var(--warn-rgb),.45)", color: "var(--warn)" }}
              onClick={() => onDelete(p.id)}>Del</button>
          </div>
        ))}
      </div>
    </div>
  );
}

// ── history ─────────────────────────────────────────────────────
function History({ tournaments, byId, onOpen }) {
  const done = tournaments.filter(x => x.status === "completed").sort((a, b) => b.createdAt - a.createdAt);
  return (
    <div className="screen">
      <div>
        <Eyebrow>Archive</Eyebrow>
        <div className="display">Past <em>Sessions</em></div>
      </div>
      {done.length === 0
        ? <div className="hair note">No completed sessions yet.</div>
        : (
          <div className="hair" style={{ display: "flex", flexDirection: "column" }}>
            {done.map(tt => {
              const s = calcStandings(tt, byId);
              return (
                <button key={tt.id} className="row" onClick={() => onOpen(tt.id)}
                  style={{ background: "transparent", border: 0, borderBottom: "1px solid var(--line2)", cursor: "pointer", color: "inherit", textAlign: "left", width: "100%" }}>
                  <span style={{ flex: 1, minWidth: 0 }}>
                    <span className="truncate" style={{ display: "block", fontWeight: 800, fontSize: 16 }}>{tt.name}</span>
                    <span className="label" style={{ letterSpacing: ".12em" }}>
                      {new Date(tt.createdAt).toLocaleDateString()} · {tt.playerIds.length} players · {tt.rounds.length} rounds
                    </span>
                  </span>
                  <span style={{ textAlign: "right" }}>
                    <span className="label" style={{ color: "var(--gold)" }}>Winner</span>
                    <span className="truncate" style={{ display: "block", fontWeight: 700 }}>{s.length ? s[0].name : "—"}</span>
                  </span>
                </button>
              );
            })}
          </div>
        )}
    </div>
  );
}

// ── app ─────────────────────────────────────────────────────────
function App() {
  const [data, setData] = useState({ players: [], guests: [], tournaments: [] });
  const [loaded, setLoaded] = useState(false);
  const [role, setRole] = useState(LS.get("am-role"));
  const [token, setTokenState] = useState(LS.get("am-token"));
  const [view, setView] = useState("board");
  const [modal, setModal] = useState(null);
  const [pin, setPin] = useState("");
  const [loginErr, setLoginErr] = useState(false);
  const [sel, setSel] = useState({});
  const [cfg, setCfg] = useState({ name: "", points: 32, rounds: 7, courts: 2, format: "americano" });
  const [roundIdx, setRoundIdx] = useState(0);
  const [drafts, setDrafts] = useState({});
  const [editing, setEditing] = useState({});
  const [courtsPick, setCourtsPick] = useState(null);
  const [query, setQuery] = useState("");
  const [newName, setNewName] = useState("");
  const [statsId, setStatsId] = useState(null);
  const [historyId, setHistoryId] = useState(null);
  const [podiumId, setPodiumId] = useState(null);
  const saveTimer = useRef(null);

  useEffect(() => {
    fetch("/state").then(r => r.json()).then(r => {
      if (r && r.ok) setData(d => ({ players: [], guests: [], tournaments: [], ...r.state }));
      setLoaded(true);
    }).catch(() => setLoaded(true));
  }, []);

  const canEdit = role === "admin" || role === "scorer";
  const guests = data.guests || [];
  const people = useMemo(
    () => [...(data.players || []), ...guests.map(g => ({ ...g, guest: true }))],
    [data.players, guests]
  );
  const byId = useMemo(() => { const m = {}; people.forEach(p => { m[p.id] = p; }); return m; }, [people]);
  const tournaments = data.tournaments || [];
  const active = tournaments.find(t => t.status === "active");

  function persist(next) {
    setData(next);
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      fetch("/save", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + LS.get("am-token") },
        body: JSON.stringify({ state: next })
      }).catch(() => {});
    }, 400);
  }
  const saveT = nextT => persist({ ...data, tournaments: tournaments.map(x => x.id === nextT.id ? nextT : x) });

  // What a player has averaged in previous UPRISING nights. Used to seed the
  // opening ladder and as the baseline for THE CLIMB. Measured over 3,000
  // simulated nights, a RANDOM opening ladder hands a Court 1 starter 40% of
  // the wins and a Court 4 starter 8% — a five-fold swing settled before a ball
  // is hit. Seeded, that advantage is earned instead of drawn.
  const upForm = useMemo(() => {
    const got = {};
    (tournaments || []).forEach(t => {
      // Only a FINISHED night is form. An abandoned one is a few scores and a
      // walk-off, and an active one is tonight.
      if (t.format !== "uprising" || t.status !== "completed") return;
      upStandings(t, byId).forEach(r => {
        if (r.played > 0) (got[r.id] = got[r.id] || []).push(r.total);
      });
    });
    const out = {};
    Object.keys(got).forEach(id => {
      out[id] = got[id].reduce((a, b) => a + b, 0) / got[id].length;
    });
    return out;
  }, [tournaments, byId]);

  function startSession() {
    const ids = Object.keys(sel).filter(id => sel[id]);
    if (ids.length < 4) return;
    const courts = Math.max(1, Math.min(Number(cfg.courts) || 1, maxCourtsFor(ids.length)));
    const rounds = Number(cfg.rounds) || 1;
    let nt;
    if (cfg.format === "uprising") {
      // UPRISING cannot pre-generate a schedule: who you play depends on which
      // court you climbed to, so only round one exists at the start and each
      // round is built from the last one's results.
      if (ids.length % 4 !== 0) { alert("UPRISING needs a multiple of four players."); return; }
      const ladder0 = upSeedLadder(ids, upForm);
      const seedT = { id: uid("t"), format: "uprising", playerIds: ids, ladder0, rounds: [] };
      nt = {
        ...seedT,
        name: cfg.name.trim() || "Uprising " + new Date().toLocaleDateString(),
        createdAt: Date.now(), pointsPerMatch: UP.TARGET,
        numRounds: UP.ROUNDS, courtCount: ids.length / 4,
        baselines: Object.fromEntries(ids.filter(i => upForm[i] != null).map(i => [i, upForm[i]])),
        rounds: [upBuildRound(seedT)], status: "active",
      };
    } else {
      nt = {
        id: uid("t"), format: "americano",
        name: cfg.name.trim() || "Americano " + new Date().toLocaleDateString(),
        createdAt: Date.now(), pointsPerMatch: Number(cfg.points) || 32,
        playerIds: ids, numRounds: rounds, courtCount: courts,
        rounds: generateSchedule(ids, rounds, courts), status: "active"
      };
    }
    persist({ ...data, tournaments: [...tournaments, nt] });
    setRoundIdx(0); setView("board");
  }
  function commitScore(ri, mi, s1, s2, key) {
    if (!active) return;
    let rounds = active.rounds.map((r, i) => i !== ri ? r : {
      ...r, courts: r.courts.map((mm, j) => j !== mi ? mm : { ...mm, score1: s1, score2: s2 })
    });
    if (active.format === "uprising") {
      // The ladder has moved, so the next round can now be drawn. Built only
      // when the LAST round on the board is complete: editing a score in an
      // earlier round must not append a duplicate round behind the scorer's
      // back, and later rounds are left alone because re-pairing them would
      // rewrite matches people have already played.
      const nextT = { ...active, rounds };
      if (upRoundDone(rounds[rounds.length - 1]) && rounds.length < UP.ROUNDS) {
        try { rounds = [...rounds, upBuildRound(nextT)]; }
        catch (e) { console.warn("could not build the next round:", e.message); }
      }
    }
    saveT({ ...active, rounds });
    setEditing(e => ({ ...e, [key]: false }));
  }
  function finishSession() {
    if (!active) return;
    saveT({ ...active, status: "completed", completedAt: Date.now() });
    setPodiumId(active.id); setSel({}); setModal("podium");
  }
  // Abandoned, NOT deleted: the night stays in the state so the scores anyone
  // did enter are not thrown away, but it stops being `active` so Setup comes
  // back. History shows only `completed`, so it does not appear there, and it
  // does not feed UPRISING form either.
  function abandonSession() {
    if (!active) return;
    saveT({ ...active, status: "abandoned", abandonedAt: Date.now() });
    setSel({}); setRoundIdx(0); setModal(null); setView("board");
  }
  function submitLogin() {
    fetch("/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ pin }) })
      .then(r => r.json()).then(r => {
        if (r && r.ok) {
          LS.set("am-token", r.token); LS.set("am-role", r.role);
          setTokenState(r.token); setRole(r.role); setModal(null); setLoginErr(false); setPin("");
        } else setLoginErr(true);
      }).catch(() => setLoginErr(true));
  }
  function logout() {
    LS.set("am-role", ""); LS.set("am-token", "");
    setRole(""); setTokenState(""); setView("board");
  }
  function addGuest() {
    const n = newName.trim(); if (!n) return;
    persist({ ...data, guests: [...guests, { id: uid("g"), name: n }] });
    setNewName("");
  }

  if (!loaded) return <div style={{ minHeight: "100vh", display: "grid", placeItems: "center", color: "var(--muted2)" }}>Loading…</div>;

  const shownT = historyId ? tournaments.find(x => x.id === historyId) : active;
  const podiumT = podiumId ? tournaments.find(x => x.id === podiumId) : shownT;
  const navDefs = [
    { id: "board", label: active ? "Board" : "Setup" },
    { id: "standings", label: "Standings" },
    { id: "players", label: "Players" },
    { id: "history", label: "History" }
  ];
  if (role === "admin") navDefs.push({ id: "admin", label: "Admin" });
  // The header used to say AMERICANO on an UPRISING night, with the format
  // demoted to the subtitle. The wordmark is the thing people photograph.
  const headerName = active && active.format === "uprising" ? "Uprising"
                   : active ? "Americano"
                   : cfg.format === "uprising" ? "Uprising" : "Americano";
  const headerSub = active
    ? active.name.replace(new RegExp("^" + headerName + "\\s+", "i"), "")
    : (canEdit ? "Ready to set up" : "Guest view");

  return (
    <Fragment>
      <header className="top">
        <div className="brand">
          {/* A drawn mark, not an emoji: the emoji renders in whatever face
              the OS supplies and carries its own colours, which is the one
              thing a palette cannot override. This is the climb. */}
          <span className="mark" aria-hidden="true">
            <svg viewBox="0 0 100 100" width="18" height="18">
              <path d="M18 64 L50 32 L82 64" fill="none" stroke="currentColor"
                strokeWidth="13" strokeLinecap="square" />
            </svg>
          </span>
          <span style={{ display: "flex", flexDirection: "column", minWidth: 0 }}>
            <span className="name">{headerName}</span>
            <span className="sub">{headerSub}</span>
          </span>
        </div>
        {canEdit
          ? <button className="btn ghost" onClick={logout}>{role}</button>
          : <button className="btn pill" onClick={() => { setModal("login"); setPin(""); setLoginErr(false); }}>Login</button>}
      </header>

      <main>
        {view === "board" && (active
          ? <Board t={active} byId={byId} canEdit={canEdit} roundIdx={roundIdx} setRoundIdx={setRoundIdx}
              drafts={drafts} setDrafts={setDrafts} editing={editing} setEditing={setEditing}
              onCommit={commitScore} onFinish={finishSession}
              onOpenCourts={() => { setCourtsPick(active.courtCount); setModal("courts"); }}
              onOpenJoin={() => setModal("join")}
              onAbandon={() => setModal("abandon")} />
          : <Setup people={people} canEdit={canEdit} cfg={cfg} setCfg={setCfg} sel={sel} setSel={setSel} onStart={startSession} />)}

        {view === "standings" && <Standings t={shownT} byId={byId}
          onPodium={() => { setPodiumId(shownT ? shownT.id : null); setModal("podium"); }} />}

        {view === "players" && <Players people={people} tournaments={tournaments} query={query} setQuery={setQuery}
          onOpenStats={id => { setStatsId(id); setModal("stats"); }} />}

        {view === "history" && <History tournaments={tournaments} byId={byId}
          onOpen={id => { setHistoryId(id); setView("standings"); }} />}

        {view === "admin" && role === "admin" && (
          <Admin guests={guests} newName={newName} setNewName={setNewName} onAdd={addGuest}
            onRename={(id, name) => persist({ ...data, guests: guests.map(g => g.id === id ? { ...g, name } : g) })}
            onDelete={id => persist({ ...data, guests: guests.filter(g => g.id !== id) })} />
        )}
      </main>

      <nav className="bottom">
        {navDefs.map(n => (
          <button key={n.id} className={view === n.id ? "on" : ""}
            onClick={() => { if (n.id === "standings") setHistoryId(null); setView(n.id); }}>{n.label}</button>
        ))}
      </nav>

      {modal === "login" && (
        <Sheet title="Scorer login" onClose={() => setModal(null)}>
          <input className="field big" type="password" inputMode="numeric" placeholder="PIN" value={pin} autoFocus
            onChange={e => setPin(e.target.value)} onKeyDown={e => e.key === "Enter" && submitLogin()} />
          {loginErr && <div className="note" style={{ color: "var(--red)", marginTop: 10 }}>Wrong PIN.</div>}
          <button className="btn" style={{ width: "100%", marginTop: 18 }} onClick={submitLogin}>Log in</button>
        </Sheet>
      )}

      {modal === "courts" && active && (() => {
        const maxC = maxCourtsFor(active.playerIds.length);
        const pick = courtsPick == null ? active.courtCount : courtsPick;
        const playedRounds = firstUnplayedIndex(active);
        return (
          <Sheet title="Courts in use" onClose={() => setModal(null)}>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
              {Array.from({ length: maxC }, (_, i) => i + 1).map(v => (
                <button key={v} className={"rchip" + (v === pick ? " on" : "")} style={{ minWidth: 52, fontSize: 15 }}
                  onClick={() => setCourtsPick(v)}>{v}</button>
              ))}
            </div>
            <div className="note" style={{ marginTop: 14 }}>
              {restPhrase(Math.max(0, active.playerIds.length - pick * 4))} each round on {plural(pick, "court")}.
              The {playedRounds} {playedRounds === 1 ? "round already scored stays" : "rounds already scored stay"} as
              played; partners keep rotating from there, so nobody repeats a partner.
            </div>
            <button className="btn" style={{ width: "100%", marginTop: 18 }} disabled={pick === active.courtCount}
              onClick={() => { saveT(rebuildTail(active, pick, null)); setModal(null); }}>Apply</button>
          </Sheet>
        );
      })()}

      {modal === "abandon" && active && (() => {
        const total = active.rounds.reduce((n, r) => n + r.courts.length, 0);
        const scored = active.rounds.reduce(
          (n, r) => n + r.courts.filter(m => m.score1 != null).length, 0);
        return (
          <Sheet title="Abandon this session?" onClose={() => setModal(null)}>
            <div className="note">
              <b>{active.name}</b> — {scored} of {total} matches scored.
              It will be closed without a podium and will not appear in the archive,
              and you will be able to start a new session. This cannot be undone from here.
            </div>
            <button className="btn" style={{ width: "100%", marginTop: 18, borderColor: "rgba(var(--warn-rgb),.45)", color: "var(--warn)", background: "rgba(var(--warn-rgb),.10)", boxShadow: "0 0 30px rgba(var(--warn-rgb),.25)" }}
              onClick={abandonSession}>Abandon it</button>
            <button className="btn ghost" style={{ width: "100%", marginTop: 10 }}
              onClick={() => setModal(null)}>Keep playing</button>
          </Sheet>
        );
      })()}

      {modal === "join" && active && (() => {
        const cands = people.filter(p => !active.playerIds.includes(p.id)).sort((a, b) => a.name.localeCompare(b.name));
        return (
          <Sheet title="Add a late arrival" onClose={() => setModal(null)}>
            <div className="note" style={{ marginBottom: 14 }}>
              They join from the next unplayed round. Scored rounds stay as played — but note that changing the
              line-up mid-session rebuilds the rotation, so a repeat partner is possible where it can't be avoided.
            </div>
            {cands.length === 0 && <div className="note">Everyone on the roster is already in this session.</div>}
            <div style={{ display: "flex", flexDirection: "column" }}>
              {cands.map(p => (
                <div className="row" key={p.id}>
                  <Ava p={p} />
                  <span className="truncate" style={{ flex: 1, fontWeight: 700 }}>{p.name}</span>
                  <button className="btn small" onClick={() => {
                    saveT(rebuildTail(active, active.courtCount, [...active.playerIds, p.id]));
                    setModal(null);
                  }}>Join</button>
                </div>
              ))}
            </div>
          </Sheet>
        );
      })()}

      {modal === "stats" && statsId && (() => {
        const me = statsId, agg = {};
        let played = 0, won = 0, ptsTotal = 0;
        tournaments.forEach(tt => (tt.rounds || []).forEach(r => (r.courts || []).forEach(m => {
          if (m.score1 == null || m.score2 == null) return;
          const inT1 = m.team1.includes(me), inT2 = m.team2.includes(me);
          if (!inT1 && !inT2) return;
          const mine = inT1 ? Number(m.score1) : Number(m.score2);
          const theirs = inT1 ? Number(m.score2) : Number(m.score1);
          const mate = (inT1 ? m.team1 : m.team2).find(id => id !== me);
          played++; ptsTotal += mine;
          const win = mine > theirs; if (win) won++;
          if (!agg[mate]) agg[mate] = { w: 0, l: 0 };
          win ? agg[mate].w++ : agg[mate].l++;
        })));
        const partners = Object.keys(agg).map(id => ({
          name: (byId[id] && byId[id].name) || "?", record: agg[id].w + "W – " + agg[id].l + "L"
        })).sort((a, b) => a.name.localeCompare(b.name));
        return (
          <Sheet title={(byId[me] && byId[me].name) || "Player"} onClose={() => setModal(null)}>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 10 }}>
              {[[played, "Matches"], [won, "Wins"], [ptsTotal, "Points"]].map(([v, l]) => (
                <div key={l} style={{ border: "1px solid var(--line)", borderRadius: 14, padding: "14px 10px", textAlign: "center" }}>
                  <div className="score" style={{ fontSize: 28, color: "var(--orange-br)" }}>{v}</div>
                  <div className="label" style={{ marginTop: 4 }}>{l}</div>
                </div>
              ))}
            </div>
            <div className="hair" style={{ marginTop: 18 }}>
              <div className="label" style={{ marginBottom: 8 }}>Partners</div>
              {partners.length === 0
                ? <div className="note">No matches played yet.</div>
                : partners.map(p => (
                  <div className="row" key={p.name}>
                    <span className="truncate" style={{ flex: 1, fontWeight: 700 }}>{p.name}</span>
                    <span className="label" style={{ letterSpacing: ".12em" }}>{p.record}</span>
                  </div>
                ))}
            </div>
          </Sheet>
        );
      })()}

      {modal === "podium" && podiumT && (() => {
        const table = calcStandings(podiumT, byId);
        const heights = [150, 185, 125], order = [1, 0, 2];
        return (
          <Sheet title="Podium 👑" onClose={() => setModal(null)}>
            <div className="podium">
              {order.filter(i => table[i]).map((i, slot) => (
                <div key={i} className={"plinth" + (i === 0 ? " first" : i === 1 ? " second" : " third")} style={{ height: heights[slot] }}>
                  <Ava p={table[i]} on={i === 0} lg />
                  <span className="truncate pname" style={{ fontSize: 13, maxWidth: "100%" }}>{table[i].name}</span>
                  <span className="score ppts" style={{ fontSize: 24 }}>
                    {table[i].byAvg ? table[i].avg.toFixed(1) : table[i].points}
                  </span>
                  <span className="label">{i === 0 ? "1st" : i === 1 ? "2nd" : "3rd"}</span>
                </div>
              ))}
            </div>
            {table.slice(3).map((s, i) => (
              <div className="row" key={s.id}>
                <span className="label" style={{ width: 24 }}>{i + 4}</span>
                <span className="truncate" style={{ flex: 1, fontWeight: 700 }}>{s.name}</span>
                <span className="label" style={{ letterSpacing: ".12em" }}>
                  {s.byAvg ? `${s.avg.toFixed(1)} / match` : `${s.points} pts`}
                </span>
              </div>
            ))}
          </Sheet>
        );
      })()}
    </Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
