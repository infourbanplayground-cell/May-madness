// ─── Helpers ──────────────────────────────────────────────────────────────────
function getDeadline(dateStr, timeStr) {
  const [h, m] = timeStr.split(":").map(Number);
  const d = new Date(dateStr);
  d.setHours(h, m - 5, 0, 0);
  return d;
}
function getCountdown(dateStr, timeStr) {
  const diff = getDeadline(dateStr, timeStr) - Date.now();
  if (diff <= 0) return null;
  return {
    d: Math.floor(diff / 86400000),
    h: Math.floor((diff % 86400000) / 3600000),
    m: Math.floor((diff % 3600000) / 60000),
    s: Math.floor((diff % 60000) / 1000),
  };
}
function loadData() {
  try { return JSON.parse(localStorage.getItem("wc2026v2") || "null") || { bets:[], users:{} }; }
  catch { return { bets:[], users:{} }; }
}
function saveData(d) {
  try { localStorage.setItem("wc2026v2", JSON.stringify(d)); } catch {}
}

const BET_DEFS = [
  { key:"o1",  enLabel:"Home Win", arLabel:"فوز 1"  },
  { key:"ox",  enLabel:"Draw",     arLabel:"تعادل"  },
  { key:"o2",  enLabel:"Away Win", arLabel:"فوز 2"  },
  { key:"o1x", enLabel:"1X",       arLabel:"1X"     },
  { key:"ox2", enLabel:"X2",       arLabel:"X2"     },
];

function App() {
  const [lang, setLang] = useState("ar");
  const L = T[lang];
  const isAr = lang === "ar";

  const [tab, setTab] = useState("matches");
  const [user, setUser] = useState(null);
  const [uname, setUname] = useState("");
  const [data, setData] = useState(loadData);
  const [sel, setSel] = useState({});
  const [gFilter, setGFilter] = useState("ALL");
  const [, setTick] = useState(0);
  const [toast, setToast] = useState({ show:false, msg:"", err:false });

  useEffect(() => {
    const t = setInterval(() => setTick(x => x+1), 1000);
    return () => clearInterval(t);
  }, []);
  useEffect(() => {
    const t = setInterval(() => setData(loadData()), 4000);
    return () => clearInterval(t);
  }, []);

  const notify = (msg, err=false) => {
    setToast({ show:true, msg, err });
    setTimeout(() => setToast({ show:false, msg:"", err:false }), 3000);
  };

  const doLogin = () => {
    const n = uname.trim();
    if (!n) return;
    const d = { ...data };
    if (!d.users[n]) d.users[n] = { name:n, joinedAt:Date.now() };
    saveData(d); setData(d); setUser(n);
    notify(`${L.welcome} ${n}! 🎉`);
  };

  const userBet = (matchId) => data.bets.find(b => b.user === user && b.matchId === matchId);
  const myBets = user ? data.bets.filter(b => b.user === user) : [];

  const placeBet = (match) => {
    if (!user) return;
    const betKey = sel[match.id];
    if (!betKey) { notify(L.chooseBetFirst, true); return; }
    if (!getCountdown(match.date, match.time)) { notify(L.betsClosed, true); return; }
    if (userBet(match.id)) { notify(L.alreadyBetMsg, true); return; }
    const def = BET_DEFS.find(b => b.key === betKey);
    const odds = match[betKey];
    const potential = parseFloat((100 * odds).toFixed(2));
    const newBet = {
      id: Date.now(), user, matchId: match.id,
      matchName: isAr ? `${match.homeAr} vs ${match.awayAr}` : `${match.home} vs ${match.away}`,
      betKey, betLabel: isAr ? def.arLabel : def.enLabel,
      odds, amount:100, potential, result:"pending",
      placedAt: Date.now(),
    };
    const d = { ...data, bets:[...data.bets, newBet] };
    saveData(d); setData(d);
    setSel(p => ({ ...p, [match.id]:null }));
    notify(`${L.betPlaced} ${L.potentialWin}: $${potential}`);
  };

  const leaderboard = (() => {
    const map = {};
    data.bets.forEach(b => {
      if (!map[b.user]) map[b.user] = { name:b.user, total:0, won:0, lost:0, pending:0, profit:0 };
      map[b.user].total++;
      if (b.result==="won") { map[b.user].won++; map[b.user].profit += b.potential - 100; }
      else if (b.result==="lost") { map[b.user].lost++; map[b.user].profit -= 100; }
      else map[b.user].pending++;
    });
    return Object.values(map).sort((a,b) => b.profit - a.profit);
  })();

  const myStats = user ? (() => {
    const settled = myBets.filter(b => b.result !== "pending");
    const won = myBets.filter(b => b.result === "won");
    const profit = won.reduce((s,b) => s+b.potential,0) - settled.length*100;
    return { total:myBets.length, pending:myBets.filter(b=>b.result==="pending").length, profit };
  })() : null;

  const groups = ["ALL","A","B","C","D","E","F","G","H","I","J","K","L"];
  const shown = gFilter==="ALL" ? MATCHES : MATCHES.filter(m => m.group===gFilter);

  const cdStr = (cd) => {
    if (!cd) return null;
    const parts = [];
    if (cd.d) parts.push(`${cd.d}${L.days}`);
    parts.push(`${cd.h}${L.hours}`, `${cd.m}${L.mins}`, `${cd.s}${L.secs}`);
    return parts.join(" ");
  };

  return (
    <>
      <style dangerouslySetInnerHTML={{ __html: CSS }} />

      {!user && (
        <div className="overlay">
          <div className={`modal ${isAr?"ar":"en"}`}>
            <div style={{fontSize:46,marginBottom:8}}>🏆</div>
            <h2>WC 2026 BET</h2>
            <p>{L.enterName}</p>
            <input className="inp" placeholder={L.username} value={uname}
              onChange={e=>setUname(e.target.value)} onKeyDown={e=>e.key==="Enter"&&doLogin()} autoFocus />
            <button className="modal-btn" onClick={doLogin}>{L.enter}</button>
            {Object.keys(data.users).length > 0 && (
              <div className="plist">{L.participants}: {Object.keys(data.users).join(", ")}</div>
            )}
          </div>
        </div>
      )}

      <header className={`hdr ${isAr?"ar":"en"}`}>
        <div className="logo">⚽ WC <em>2026</em> BET</div>
        <nav className="nav">
          {["matches","myBets","leaderboard"].map(t => (
            <button key={t} className={`ntab ${tab===t?"on":""}`} onClick={()=>setTab(t)}>
              {t==="matches"?L.matches:t==="myBets"?`${L.myBets} (${myBets.length})`:L.leaderboard}
            </button>
          ))}
        </nav>
        <div className="hdr-right">
          <button className="lng-btn" onClick={()=>setLang(isAr?"en":"ar")}>
            {isAr?"🇬🇧 EN":"🇸🇦 ع"}
          </button>
          {user && <span className="uname">👤 {user}</span>}
          {myStats && (
            <div className={`pnl ${myStats.profit>0?"pos":myStats.profit<0?"neg":"neu"}`}>
              {myStats.profit>0?"+":""}${myStats.profit.toFixed(0)} {L.profit}
            </div>
          )}
        </div>
      </header>

      <div className={`wrap ${isAr?"ar":"en"}`}>
        <div className="col-main">
          {user && myStats && (
            <div className="stats">
              <div className="sc"><div className="sv">{myStats.total}</div><div className="sl">{L.myBets}</div></div>
              <div className="sc"><div className="sv" style={{color:"var(--gold)"}}>{myStats.pending}</div><div className="sl">{L.pending}</div></div>
              <div className="sc">
                <div className="sv" style={{color:myStats.profit>=0?"var(--green)":"var(--red)"}}>
                  {myStats.profit>=0?"+":""}${myStats.profit.toFixed(0)}
                </div>
                <div className="sl">{L.myProfit}</div>
              </div>
              <div className="sc"><div className="sv">{data.bets.length}</div><div className="sl">{L.totalBets}</div></div>
            </div>
          )}

          {tab==="matches" && (
            <>
              <div className="fbar">
                {groups.map(g => (
                  <button key={g} className={`fbtn ${gFilter===g?"on":""}`} onClick={()=>setGFilter(g)}>
                    {g==="ALL"?L.allGroups:`${L.group} ${g}`}
                  </button>
                ))}
              </div>
              {shown.map(match => {
                const cd = getCountdown(match.date, match.time);
                const locked = !cd;
                const ub = userBet(match.id);
                const selected = sel[match.id];
                const matchBets = data.bets.filter(b=>b.matchId===match.id).length;
                const homeName = isAr ? match.homeAr : match.home;
                const awayName = isAr ? match.awayAr : match.away;
                return (
                  <div key={match.id} className="mc">
                    <div className="mc-head">
                      <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
                        <span className="gbadge">{isAr?`المجموعة ${match.group}`:`Group ${match.group}`}</span>
                        <span className="mc-meta">
                          <span>📅 {match.date}</span>
                          <span>⏰ {match.time} ET</span>
                          <span>🏟 {match.stadium}</span>
                          <span>👥 {matchBets}</span>
                        </span>
                      </div>
                      <div>
                        {locked
                          ? <span className="cd">{L.betLocked}</span>
                          : <span className="cd">⏱ {cdStr(cd)}</span>
                        }
                      </div>
                    </div>
                    <div className="mc-body">
                      <div className="team">
                        <div className="flag">{match.homef}</div>
                        <div className="tname">{homeName}</div>
                      </div>
                      <div className="vs">VS</div>
                      <div className="team">
                        <div className="flag">{match.awayf}</div>
                        <div className="tname">{awayName}</div>
                      </div>
                    </div>
                    <div className="odds-row">
                      {BET_DEFS.map(def => {
                        const odds = match[def.key];
                        const potential = (100*odds).toFixed(0);
                        const isSel = selected===def.key;
                        const isMyType = ub?.betKey===def.key;
                        return (
                          <div key={def.key}
                            className={`ob ${isSel?"sel":""} ${locked||ub?"locked":""} ${isMyType?"mybet-type":""}`}
                            onClick={()=> !locked && !ub && setSel(p=>({...p,[match.id]:p[match.id]===def.key?null:def.key}))}>
                            <div className="olabel">{isAr?def.arLabel:def.enLabel}</div>
                            <div className="oval" style={isSel?{color:"#7eb3ff"}:{}}>{odds.toFixed(2)}</div>
                            <div className="opotential">${potential}</div>
                          </div>
                        );
                      })}
                    </div>
                    {ub ? (
                      <div className="already-bet-bar">
                        {L.alreadyBet}: {isAr?BET_DEFS.find(d=>d.key===ub.betKey)?.arLabel:BET_DEFS.find(d=>d.key===ub.betKey)?.enLabel} ×{ub.odds.toFixed(2)} → ${ub.potential}
                      </div>
                    ) : locked ? (
                      <div className="locked-bar">{L.betLocked}</div>
                    ) : (
                      <button className="bet-btn" disabled={!selected} onClick={()=>placeBet(match)}>
                        {selected
                          ? `${L.placeBet} — ${L.potentialWin}: $${(100*match[selected]).toFixed(0)}`
                          : L.chooseType}
                      </button>
                    )}
                  </div>
                );
              })}
            </>
          )}

          {tab==="myBets" && (
            <div>
              <div className="stitle">🎯 {L.myBets}</div>
              <div className="scard">
                {myBets.length===0
                  ? <div className="empty">{L.noMyBets}<br/><small>{L.noMyBetsHint}</small></div>
                  : myBets.slice().reverse().map(b => (
                    <div key={b.id} className="bitem">
                      <div className="bm">⚽ {b.matchName}</div>
                      <div className="bs">{b.betLabel} × {b.odds.toFixed(2)} → $100 → ${b.potential}</div>
                      <div className={`br ${b.result==="pending"?"pen":b.result==="won"?"won":"los"}`}>
                        {b.result==="pending"?L.resultPending:b.result==="won"?`${L.resultWon} +$${(b.potential-100).toFixed(2)}`:`${L.resultLost} -$100`}
                      </div>
                    </div>
                  ))
                }
              </div>
            </div>
          )}

          {tab==="leaderboard" && (
            <div>
              <div className="stitle">🏆 {L.leaderboard}</div>
              <div className="scard">
                <table className="ltable">
                  <thead>
                    <tr>
                      <th>#</th><th>{L.rankPlayer}</th><th>{L.rankBets}</th>
                      <th>{L.rankWon}</th><th>{L.rankLost}</th><th>{L.rankPending}</th><th>{L.rankProfit}</th>
                    </tr>
                  </thead>
                  <tbody>
                    {leaderboard.length===0
                      ? <tr><td colSpan={7} className="empty">{L.noParticipants}</td></tr>
                      : leaderboard.map((u,i) => (
                        <tr key={u.name} style={{background:u.name===user?"rgba(245,166,35,.05)":""}}>
                          <td><span className={`rb ${i===0?"r1":i===1?"r2":i===2?"r3":"ro"}`}>{i+1}</span></td>
                          <td style={{color:u.name===user?"var(--gold)":"",fontWeight:u.name===user?700:400}}>
                            {u.name===user?"👤 ":""}{u.name}
                          </td>
                          <td className="mn">{u.total}</td>
                          <td className="gn">{u.won}</td>
                          <td className="rd">{u.lost}</td>
                          <td style={{color:"var(--gold)"}}>{u.pending}</td>
                          <td className={u.profit>0?"gn":u.profit<0?"rd":"mn"}>
                            {u.profit>0?"+":""}${u.profit.toFixed(2)}
                          </td>
                        </tr>
                      ))
                    }
                  </tbody>
                </table>
              </div>
            </div>
          )}
        </div>

        <div className="col-side">
          <div className="scard">
            <div className="stitle">🏆 {L.leaderboard}</div>
            <table className="ltable">
              <thead><tr><th>#</th><th>{L.rankPlayer}</th><th>{L.rankProfit}</th></tr></thead>
              <tbody>
                {leaderboard.slice(0,8).map((u,i)=>(
                  <tr key={u.name}>
                    <td><span className={`rb ${i===0?"r1":i===1?"r2":i===2?"r3":"ro"}`}>{i+1}</span></td>
                    <td style={{color:u.name===user?"var(--gold)":""}}>{u.name}</td>
                    <td className={u.profit>0?"gn":u.profit<0?"rd":"mn"}>{u.profit>0?"+":""}${u.profit.toFixed(0)}</td>
                  </tr>
                ))}
                {leaderboard.length===0&&<tr><td colSpan={3} className="empty">{L.noParticipants}</td></tr>}
              </tbody>
            </table>
          </div>
          <div className="scard">
            <div className="stitle">{L.recentBets}</div>
            {myBets.length===0
              ? <div className="empty">{L.noBetsYet}</div>
              : myBets.slice(-5).reverse().map(b=>(
                <div key={b.id} className="bitem">
                  <div className="bm">{b.matchName}</div>
                  <div className="bs">{b.betLabel} × {b.odds.toFixed(2)}</div>
                  <div className={`br ${b.result==="pending"?"pen":b.result==="won"?"won":"los"}`}>
                    {b.result==="pending"?`⏳ $${b.potential}`:b.result==="won"?`✅ +$${(b.potential-100).toFixed(2)}`:`❌ -$100`}
                  </div>
                </div>
              ))
            }
          </div>
          <div className="scard">
            <div className="stitle">{L.rules}</div>
            <div className="rules-body">
              <p>💰 {L.rule1}</p>
              <p>⏰ {L.rule2}</p>
              <p>🎯 {L.rule3}</p>
              <p>📊 {L.rule4}</p>
              <p>🏆 {L.rule5}</p>
            </div>
          </div>
        </div>
      </div>

      <div className={`toast ${toast.show?"show":""} ${toast.err?"err":""}`}>{toast.msg}</div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
