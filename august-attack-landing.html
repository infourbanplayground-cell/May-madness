*{margin:0;box-sizing:border-box}
:root{--glow:0 0 9px rgba(255,46,67,.85),0 0 26px rgba(255,46,67,.45);--glow-sm:0 0 6px rgba(255,46,67,.8)}
html,body{height:100%}
body{font-family:'Rajdhani',system-ui,sans-serif;color:#F4F6FA;overflow-x:hidden;
  background:
    radial-gradient(85% 55% at 50% -6%,rgba(255,46,67,.22),transparent 60%),
    radial-gradient(70% 45% at 50% 106%,rgba(255,46,67,.12),transparent 60%),
    #050609;
  background-attachment:fixed;
  min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:max(28px,env(safe-area-inset-top)) 22px max(28px,env(safe-area-inset-bottom));
  position:relative}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(rgba(255,46,67,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,46,67,.05) 1px,transparent 1px);
  background-size:44px 44px;-webkit-mask-image:radial-gradient(120% 80% at 50% 40%,#000,transparent 80%)}
.wrap{position:relative;z-index:1;width:100%;max-width:640px;display:flex;flex-direction:column;align-items:center;gap:0}
.emblem{width:min(56vw,232px);filter:drop-shadow(0 0 12px rgba(255,46,67,.55)) drop-shadow(0 0 30px rgba(255,46,67,.3))}
.presents{font-weight:700;letter-spacing:8px;font-size:12px;color:#8B95A7;margin:18px 0 12px}
.word{width:min(88vw,470px);filter:drop-shadow(0 0 12px rgba(255,46,67,.5))}
.tag{font-weight:700;letter-spacing:4px;font-size:clamp(13px,3.4vw,16px);margin-top:16px}
.tag b{color:#FF2E43;text-shadow:var(--glow)}
.chip{margin-top:26px;display:inline-flex;align-items:center;gap:9px;font-weight:700;letter-spacing:3px;font-size:13px;
  color:#F4F6FA;border:1px solid rgba(255,46,67,.75);border-radius:4px;padding:9px 16px;
  box-shadow:0 0 14px rgba(255,46,67,.5),inset 0 0 10px rgba(255,46,67,.2)}
.chip i{width:8px;height:8px;border-radius:50%;background:#FF2E43;box-shadow:0 0 8px #FF2E43,0 0 15px #FF2E43;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.soon{margin-top:30px;font-weight:700;letter-spacing:6px;font-size:clamp(20px,6vw,30px);color:#F4F6FA;text-shadow:0 0 10px rgba(255,255,255,.2)}
.soon .r{color:#FF2E43;text-shadow:var(--glow)}
.sub{margin-top:10px;color:#8B95A7;font-weight:600;letter-spacing:1px;font-size:14px;max-width:44ch}
.rule{width:min(70%,360px);height:1px;background:rgba(255,46,67,.5);box-shadow:0 0 8px rgba(255,46,67,.7);margin:30px 0 0}
.foot{margin-top:22px;color:#8B95A7;font-weight:600;letter-spacing:2px;font-size:11px;line-height:1.9}
.foot .r{color:#FF2E43;text-shadow:var(--glow-sm)}
.foot a{color:#8B95A7;text-decoration:none}
@media (prefers-reduced-motion:reduce){.chip i{animation:none}}
</style></head>
