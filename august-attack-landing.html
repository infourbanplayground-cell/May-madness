*{margin:0;box-sizing:border-box}
:root{--glow:0 0 9px rgba(255,46,67,.85),0 0 26px rgba(255,46,67,.45);--glow-sm:0 0 6px rgba(255,46,67,.8)}
html,body{height:100%}
body{font-family:'Rajdhani',system-ui,sans-serif;color:#F4F6FA;overflow-x:hidden;
  background:
    radial-gradient(85% 55% at 50% -6%,rgba(255,46,67,.22),transparent 60%),
    radial-gradient(70% 45% at 50% 106%,rgba(255,46,67,.12),transparent 60%),
    #050609;
  background-attachment:fixed;
  min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:max(28px,env(safe-area-inset-top)) 22px max(28px,env(safe-area-inset-bottom));
  position:relative}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(rgba(255,46,67,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,46,67,.05) 1px,transparent 1px);
  background-size:44px 44px;-webkit-mask-image:radial-gradient(120% 80% at 50% 40%,#000,transparent 80%)}
.wrap{position:relative;z-index:1;width:100%;max-width:640px;display:flex;flex-direction:column;align-items:center;gap:0}
.emblem{width:min(56vw,232px);filter:drop-shadow(0 0 12px rgba(255,46,67,.55)) drop-shadow(0 0 30px rgba(255,46,67,.3))}
.presents{font-weight:700;letter-spacing:8px;font-size:12px;color:#8B95A7;margin:18px 0 12px}
.word{width:min(88vw,470px);filter:drop-shadow(0 0 12px rgba(255,46,67,.5));animation:glitchIn 1.05s .7s both}
/* ── one-time glitch-in reveal on page load ── */
@keyframes glitchIn{
  0%{opacity:0;transform:translate(-9px,0) skewX(6deg);filter:drop-shadow(6px 0 #ff2e43) drop-shadow(-6px 0 #3de1ff);clip-path:inset(45% 0 45% 0)}
  15%{opacity:1;transform:translate(8px,-2px) skewX(-4deg);clip-path:inset(0 0 72% 0)}
  30%{transform:translate(-7px,2px);filter:drop-shadow(-5px 0 #3de1ff);clip-path:inset(62% 0 6% 0)}
  45%{transform:translate(5px,-1px);filter:drop-shadow(5px 0 #ff2e43);clip-path:inset(12% 0 34% 0)}
  60%{transform:translate(-3px,0);clip-path:inset(34% 0 0 0)}
  78%{transform:translate(2px,0);clip-path:none}
  100%{opacity:1;transform:none;clip-path:none}
}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.emblem{animation:glitchIn 1s .1s both}
.presents{animation:fadeUp .55s .5s both}
.tag{animation:fadeUp .55s 1.2s both}
.chip{animation:fadeUp .55s 1.35s both}
.soon{position:relative;animation:glitchIn .95s 1.5s both}
.sub{animation:fadeUp .55s 1.75s both}
.rule{animation:fadeUp .55s 1.9s both}
.foot{animation:fadeUp .55s 2.05s both}
/* static scanline texture (no loop) */
body::after{content:"";position:fixed;inset:0;z-index:5;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 1px,transparent 1px 3px);
  mix-blend-mode:multiply;opacity:.42}
@media (prefers-reduced-motion:reduce){
  .emblem,.word,.presents,.tag,.chip,.soon,.sub,.rule,.foot,.chip i{animation:none;opacity:1;transform:none;clip-path:none}
}
.tag{font-weight:700;letter-spacing:4px;font-size:clamp(13px,3.4vw,16px);margin-top:16px}
.tag b{color:#FF2E43;text-shadow:var(--glow)}
.chip{margin-top:26px;display:inline-flex;align-items:center;gap:9px;font-weight:700;letter-spacing:3px;font-size:13px;
  color:#F4F6FA;border:1px solid rgba(255,46,67,.75);border-radius:4px;padding:9px 16px;
  box-shadow:0 0 14px rgba(255,46,67,.5),inset 0 0 10px rgba(255,46,67,.2)}
